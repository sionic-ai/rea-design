<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Studio Name — one-line intro here</title>
  <link rel="stylesheet" href="../../_shared/wire.css">
  <link rel="stylesheet" href="../../_shared/kf-defaults.css">
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="shared.css">
  <link rel="stylesheet" href="../_fx/tumble-drift-stream/fx.css">
  <link rel="stylesheet" href="../_fx/slash-bar-sweep/fx.css">
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <!-- Photo river: every .3~.7s one photo tumbles from lower left → upper right over 15~50s (under the logo) -->
  <div class="ur-stream" data-slot="photo-stream" data-fx="tumble-drift-stream" aria-hidden="true">
    <div class="wf-img" data-fx-part="photo" data-ratio="0.5625" style="--tone: 38%" data-label="Virtual stage 3D render · night lighting · landscape 16:9"></div>
    <div class="wf-img" data-fx-part="photo" data-ratio="1.3333" style="--tone: 22%" data-label="Street restaurant sign · Day · Portrait 3:4"></div>
    <div class="wf-img" data-fx-part="photo" data-ratio="0.6667" style="--tone: 16%" data-label="Food on a dining table · from above · horizontal 3:2"></div>
    <div class="wf-img" data-fx-part="photo" data-ratio="1.5" style="--tone: 30%" data-label="Full-length portrait · indoor fluorescent light · vertical 2:3"></div>
    <div class="wf-img" data-fx-part="photo" data-ratio="1" style="--tone: 44%" data-label="Group photo of a gathering · Flash · Square"></div>
    <div class="wf-img" data-fx-part="photo" data-ratio="0.5625" style="--tone: 26%" data-label="Giant door 3D render · Fog · Landscape 16:9"></div>
    <div class="wf-img" data-fx-part="photo" data-ratio="0.75" style="--tone: 12%" data-label="Lunch box · window light · landscape 4:3"></div>
    <div class="wf-img" data-fx-part="photo" data-ratio="1.3333" style="--tone: 52%" data-label="Audience at the venue · stage light · portrait 3:4"></div>
    <div class="wf-img" data-fx-part="photo" data-ratio="0.6667" style="--tone: 20%" data-label="Exhibition installation piece · Daytime · Landscape 3:2"></div>
    <div class="wf-img" data-fx-part="photo" data-ratio="1.7778" style="--tone: 34%" data-label="Phone screen capture · 9:16 portrait"></div>
    <div class="wf-img" data-fx-part="photo" data-ratio="0.5625" style="--tone: 58%" data-label="3D render inside a cave · dark interior · landscape 16:9"></div>
    <div class="wf-img" data-fx-part="photo" data-ratio="1.25" style="--tone: 14%" data-label="Magazine spread · studio · portrait 4:5"></div>
    <div class="wf-img" data-fx-part="photo" data-ratio="1.5" style="--tone: 40%" data-label="Portrait · colored lighting · portrait 2:3"></div>
    <div class="wf-img" data-fx-part="photo" data-ratio="0.6667" style="--tone: 28%" data-label="Alley scene · dusk · landscape 3:2"></div>
    <div class="wf-img" data-fx-part="photo" data-ratio="1" style="--tone: 10%" data-label="Flat meme art · square"></div>
    <div class="wf-img" data-fx-part="photo" data-ratio="0.75" style="--tone: 36%" data-label="Dinner setting · warm lighting · 4:3 landscape"></div>
    <div class="wf-img" data-fx-part="photo" data-ratio="1.3333" style="--tone: 24%" data-label="Flowers and plants · natural light · portrait 3:4"></div>
    <div class="wf-img" data-fx-part="photo" data-ratio="0.5625" style="--tone: 18%" data-label="Virtual stage wide shot · daytime · landscape 16:9"></div>
  </div>

  <!-- Cover and icon river: each one flows along the same path in 10~20s and reappears after passing (above the logo · clickable) -->
  <div class="ur-stream ur-stream--over" data-slot="cover-stream" data-fx="tumble-drift-stream">
    <a class="wf-img" href="index.html" data-fx-part="solo" data-ratio="1.2929" data-shape="square" style="--tone: 20%" data-label="Latest issue cover · person and graphics · portrait 792:1024" aria-label="View latest issue"></a>
    <a class="ur-icon" href="https://www.example.com/" target="_blank" rel="noopener" data-fx-part="solo" data-ratio="1" data-size="1.2 12.5" data-size-narrow="1.5 25" data-label="SNS icon slot" aria-label="SNS account">
      <svg viewBox="0 0 512 512" aria-hidden="true"><rect x="12" y="12" width="488" height="488" rx="140" stroke="currentColor" stroke-width="24"/><path d="M196 316 316 196M224 196h92v92" fill="none" stroke="currentColor" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
  </div>

  <!-- Wordmark + five comb lines: drawn at .15 second intervals over 1.6s cubic-bezier(1,0,0,1), retract every 9 seconds and redraw 2.5 seconds later -->
  <div class="ur-logo" data-slot="hero-wordmark" data-fx="slash-bar-sweep">
    <i class="ur-logo__bar" data-fx-part="bar"></i>
    <i class="ur-logo__bar" data-fx-part="bar"></i>
    <i class="ur-logo__bar" data-fx-part="bar"></i>
    <i class="ur-logo__bar" data-fx-part="bar"></i>
    <i class="ur-logo__bar" data-fx-part="bar"></i>
    <h1 data-label="Brand English wordmark — original is an SVG logo">
      <svg viewBox="0 0 170 83.3" role="img" aria-label="Studio Name"><text x="2.8" y="82.6" textLength="163.8" lengthAdjust="spacingAndGlyphs" lang="en">WORDMARK</text></svg>
    </h1>
  </div>

  <span class="wf-note">Wordmark · five comb strokes drawn 1.6s cubic-bezier(1,0,0,1) at .15s intervals · erased every 9s → redrawn 2.5s later · behind it, a photo disc tumbles with rotate3d and drifts diagonally</span>

  <a class="ur-issue" href="index.html" data-slot="issue-link" data-label="Latest issue number"><b>#00</b></a>

  <script src="../../_shared/vendor/gsap/gsap.min.js"></script>
  <script src="../_fx/fx-core.js"></script>
  <script src="../_fx/tumble-drift-stream/fx.js"></script>
  <script src="../_fx/slash-bar-sweep/fx.js"></script>
  <script src="../../_shared/wire.js"></script>
</body>
</html>
