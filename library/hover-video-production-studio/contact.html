<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact · gray-blue background contact form</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,400;0,500;1,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="../../_shared/wire.css">
<link rel="stylesheet" href="../../_shared/kf-defaults.css">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="contact.css">
<script>document.documentElement.classList.add("mr-js")</script>
</head>
<body data-page="contact" data-color="blue" id="top">
<header data-slot="header"></header>
<div class="mr-wrap" id="smooth-wrapper"><div id="smooth-content">
  <main data-barba="wrapper"><div class="mr-main" data-barba="container" data-barba-namespace="contact" data-color="blue">
    <section class="mr-chead" data-slot="page-head">
      <h1 class="mr-pagetitle" data-label="Section names + three English words that invite contact"><div><span>Contact</span></div><div class="mr-pagetitle__l2"><span>Drop</span> <span>a</span> <span>Line</span></div></h1>
    </section>

    <section class="mr-cform mr-enter" data-slot="contact-form">
      <h2 class="mr-cform__label">Your inquiry type here</h2>
      <form class="mr-cform__body" novalidate>
        <div class="mr-cform__part"><label for="c-company">Company name</label><div class="mr-cform__in"><input id="c-company" type="text" placeholder="Please enter the company name."></div></div>
        <div class="mr-cform__part"><label for="c-name">Name</label><div class="mr-cform__in mr-cform__suffix"><input id="c-name" type="text" placeholder="Please enter your name."><span>Honorific</span></div></div>
        <div class="mr-cform__part"><label for="c-mail">Email address</label><div class="mr-cform__in"><input id="c-mail" type="email" placeholder="Please enter your email address."></div></div>
        <div class="mr-cform__part"><label for="c-subject">Title</label><div class="mr-cform__in mr-cform__drop"><span class="mr-cform__droplabel">Work request</span><select id="c-subject"><option selected>Work request</option><option>Others</option></select></div></div>
        <div class="mr-cform__part"><label for="c-body">Content</label><div class="mr-cform__in"><textarea id="c-body" placeholder="Please enter your inquiry."></textarea></div></div>
        <div class="mr-cform__msg" id="invalid"><p>Please review the details below.</p><ul><li data-k="name">Please enter your name.</li><li data-k="mail">Please enter your email address.</li><li data-k="body">Please enter your inquiry.</li></ul></div>
        <div class="mr-cform__msg" id="success"><p>One line saying it has been sent.<br>Your thank-you line here.</p></div>
        <div class="mr-cform__send"><button class="mr-cform__btn" type="submit" data-roll>Send</button></div>
      </form>
    </section>
  </div></main>
  <footer data-slot="footer"></footer>
</div></div>

<script src="../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../../_shared/vendor/gsap/ScrollSmoother.min.js"></script>
<script src="../../_shared/vendor/gsap/ScrollToPlugin.min.js"></script>
<script src="../_vendor/barba-core@2.9.7/barba.umd.js"></script>
<script src="shared.js"></script>
<script src="index.js"></script>
<script src="works.js"></script>
<script src="about.js"></script>
<script src="contact.js"></script>
<script src="../../_shared/wire.js"></script>
</body>
</html>
