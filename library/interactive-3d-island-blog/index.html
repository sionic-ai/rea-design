<!doctype html>
<html lang="ko" class="bb-field-page is-entering">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>The Sample Blog — Your one-line intro here</title>
  <link rel="stylesheet" href="../../_shared/wire.css">
  <link rel="stylesheet" href="../../_shared/kf-defaults.css">
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="../_fx/grass-turntable-gl/fx.css">
  <link rel="stylesheet" href="../_fx/seam-split-btn/fx.css">
  <link rel="stylesheet" href="shared.css">
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <div class="bb-clearing bb-leaf is-entering" data-slot="clearing">
    <div class="bb-sky" aria-hidden="true" data-label="Dawn sky photo · thin clouds, blue-gray light · full-width landscape (only the top shows through at 30%)"></div>

    <section class="bb-hero" data-slot="hero">
      <h1 class="bb-hero__word" aria-label="The Sample Blog" data-label="Blog English name — two hidden words (not · ?) droop on hover"><span class="bb-hero__row"><span data-type>The</span><em class="bb-no" aria-hidden="true"> not</em><span data-type> Sample</span><span data-type> Blog</span><em class="bb-no" aria-hidden="true">?</em></span></h1>
      <p class="bb-hero__blurb">Your one line introducing the blog goes here. Briefly say what you write about, in under two lines.</p>
      <p class="bb-hero__go">
        <a href="news.html" class="bb-go" data-fx="seam-split-btn" data-walk><span data-fx-part="label">Go read the article</span><span data-fx-part="icon"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8h10M9 4l4 4-4 4"/></svg></span></a>
      </p>
    </section>
  </div>

  <div class="bb-stage" data-slot="field" role="application" tabindex="0" aria-label="Rotatable meadow — left and right arrows move one slot at a time" data-fx="grass-turntable-gl" data-fx-grass-turntable-gl="drag: page">
    <canvas data-fx-part="scene" data-draw="reader" data-ground=".36" width="600" height="400" data-label="Illustration scene 1 — a child reading on the grass with a dog lying beside (drawn in code, transparent background 3:2)"></canvas>
    <canvas data-fx-part="scene" data-draw="telescope" data-ground=".36" width="600" height="400" data-label="Illustration scene 2 — person looking at the sky through a small telescope"></canvas>
    <canvas data-fx-part="scene" data-draw="kite" data-ground=".36" width="600" height="400" data-label="Illustration scene 3 — child flying a kite"></canvas>
    <canvas data-fx-part="scene" data-draw="box" data-ground=".36" width="600" height="400" data-label="Illustration scene 4 — person peering at a cat on a box"></canvas>
  </div>

  <header class="bb-mast" data-slot="mast">
    <span class="bb-mark" data-home tabindex="0">
      <svg class="bb-mark__glyph" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22V11"/><path d="M12 14c-4.2 0-6.4-2.8-6.4-6.4 3.6 0 6.4 2.4 6.4 6.4z"/><path d="M12 11.5c0-4.2 2.9-6.9 6.6-6.9 0 3.6-2.6 6.9-6.6 6.9z"/></svg>
      <span class="bb-mark__say">This is the Hero</span>
    </span>
    <div class="bb-mast__end">
      <button class="bb-ghost bb-ghost--icon bb-sun" type="button" aria-label="Put the sun down"><span class="bb-swap" aria-hidden="true"><span><svg class="bb-sun__icon" viewBox="0 0 20 20" aria-hidden="true"><mask id="bb-bite-a"><rect width="20" height="20" fill="white"/><circle class="bb-sun__bite" cx="18.6" cy="2.4" r="5.4"/></mask><circle cx="10" cy="10" r="4.9" fill="currentColor" mask="url(#bb-bite-a)"/><g class="bb-sun__rays" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M10 1.5v1.5M10 17v1.5M18.5 10H17M3 10H1.5M16 4l-1.05 1.05M5.05 14.95L4 16M16 16l-1.05-1.05M5.05 5.05L4 4"/></g></svg></span><span><svg class="bb-sun__icon" viewBox="0 0 20 20" aria-hidden="true"><mask id="bb-bite-b"><rect width="20" height="20" fill="white"/><circle class="bb-sun__bite" cx="18.6" cy="2.4" r="5.4"/></mask><circle cx="10" cy="10" r="4.9" fill="currentColor" mask="url(#bb-bite-b)"/><g class="bb-sun__rays" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M10 1.5v1.5M10 17v1.5M18.5 10H17M3 10H1.5M16 4l-1.05 1.05M5.05 14.95L4 16M16 16l-1.05-1.05M5.05 5.05L4 4"/></g></svg></span></span></button>
      <a class="bb-ghost bb-ghost--wide-only" href="news.html" data-walk data-label="Menu English">Menu 1</a>
      <nav class="bb-elsewhere" aria-label="Another place">
        <a class="bb-ghost bb-ghost--icon" href="https://example.com/" target="_blank" rel="noopener" aria-label="Social 1 (new tab)" data-label="External social URL"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="3.6"/><path d="M15.6 12v1.6a2.4 2.4 0 0 0 4.8 0V12a8.4 8.4 0 1 0-3.3 6.7"/></svg></a>
        <a class="bb-ghost bb-ghost--icon" href="https://example.org/" target="_blank" rel="noopener" aria-label="Social 2 (new tab)" data-label="External social URL"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg></a>
      </nav>
      <div class="bb-sub" data-state="closed">
        <button class="bb-subscribe" type="button" aria-haspopup="dialog" aria-expanded="false" data-fx="seam-split-btn" data-fx-seam-split-btn="look: accent"><span data-fx-part="label" data-label="Subscribe button (English)">Subscribe</span><span data-fx-part="icon"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true"><path d="M2 4h12v8H2z"/><path d="M2 4.5l6 4.5 6-4.5"/></svg></span></button>
        <form class="bb-sub__pop" role="dialog" aria-label="Subscription">
          <p>We will send you one email whenever a new post goes up. One line of notice here.</p>
          <div class="bb-sub__row"><input type="email" placeholder="Email address" aria-label="Email address"><button class="bb-ghost" type="submit">Receive</button></div>
        </form>
      </div>
    </div>
  </header>

  <div class="bb-track" data-slot="turn-track">
    <div class="bb-track__inner">
      <div class="bb-track__bar" role="slider" tabindex="0" aria-label="Spin the meadow" aria-valuemin="0" aria-valuemax="23" aria-valuenow="0">
        <span class="bb-track__seg bb-track__seg--l"></span><span class="bb-track__seg bb-track__seg--r"></span>
        <div class="bb-track__thumbs"><div class="bb-track__thumb"></div></div>
      </div>
      <div class="bb-track__meta">
        <p>Drag to rotate</p>
        <p class="bb-track__keys">
          <button type="button" data-turn="-1" aria-label="One step to the left"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 8H3M7 4L3 8l4 4"/></svg></button>
          <button type="button" data-turn="1" aria-label="One step to the right"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8h10M9 4l4 4-4 4"/></svg></button>
        </p>
      </div>
    </div>
  </div>

  <script src="../../_shared/vendor/gsap/gsap.min.js"></script>
  <script src="../_vendor/three@0.186.0/three.min.js"></script>
  <script src="../_fx/fx-core.js"></script>
  <script src="../_fx/grass-turntable-gl/fx.js"></script>
  <script src="../_fx/seam-split-btn/fx.js"></script>
  <script src="../_fx/weight-proximity/fx.js"></script>
  <script src="shared.js"></script>
  <script src="index.js"></script>
  <script src="../../_shared/wire.js"></script>
</body>
</html>
