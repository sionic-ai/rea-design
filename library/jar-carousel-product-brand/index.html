<main>
  <section class="jar" data-slot="hero-jar-carousel" data-jar data-ready="false">
    <p class="wf-note">Wheel or drag rotates the bottle ring (no document scroll) · hover the center bottle = Cursor pill + label rotating every 2s · on click the bottle flies off and lands on the product page · bottle is a cut-out product photo slot</p>
    <h1 class="visually-hidden">Your home title here</h1>

    <div class="jar__shape" aria-hidden="true" data-slot="boundary-arch">
      <svg class="jar__shape-img" viewBox="0 0 1407 601" preserveAspectRatio="xMidYMax meet"><path d="M0 601 L196.2 248.7 Q240 170 325 140.3 L600 44 Q703 8 806 44 L1082 140.3 Q1167 170 1210.8 248.7 L1407 601Z" fill="var(--ag-wine)"/></svg>
      <div class="jar__badge" data-label="English slogan running around the disc · two uppercase repeats">
        <svg viewBox="0 0 1168 1168">
          <defs><path id="jar-ring" d="M584 84a500 500 0 1 1 -0.1 0z"/></defs>
          <text class="jar__ring-text"><textPath href="#jar-ring" textLength="3130" lengthAdjust="spacing">RING SLOGAN HERE · RING SLOGAN HERE ·</textPath></text>
        </svg>
      </div>
    </div>

    <div class="jar__overlay"><p class="jar__prompt" data-label="One English line telling users to scroll down goes here.">Scroll to view more</p></div>

    <div class="jar__wrap" data-jar-wrap>
      <div class="jar__marquee"><div class="jar__track" data-jar-track></div></div>
    </div>
  </section>
