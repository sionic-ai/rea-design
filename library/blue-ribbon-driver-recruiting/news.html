<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>News list · driver recruiting site with an opening blue ribbon</title>
<link rel="stylesheet" href="../../_shared/wire.css">
<link rel="stylesheet" href="../../_shared/kf-defaults.css">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="news.css">
</head>
<body data-page="news">

<header class="zm-header" data-slot="header"></header>

<main>
  <section class="zm-pagemv" data-slot="page-hero">
    <div class="zm-pagemv__bg zm-ribbon js-ribbon" data-ribbon="page"></div>
    <div class="zm-inner">
      <div class="zm-pagemv__content">
        <div class="zm-title"><p class="zm-title__ja js-opacity-word">Notice</p><h1 class="zm-pagemv__title-en js-opacity-word" lang="en">News</h1></div>
        <nav class="zm-pan js-opacity-word" aria-label="Current location"><a href="index.html">First Page</a><i></i><span>Notice</span></nav>
      </div>
    </div>
  </section>

  <section class="zm-newslist" data-slot="news-filter-list">
    <span class="wf-note">Notification list · left branch pills (current branch is blue) · right side date, tag and title row</span>
    <div class="zm-inner">
      <div class="zm-newslist__content">
        <div class="zm-newslist__cats">
          <a class="zm-newslist__cat is-active" href="news.html">Entire</a>
          <a class="zm-newslist__cat" href="news.html">Notice</a>
          <a class="zm-newslist__cat" href="news.html">Hiring</a>
        </div>
        <div class="zm-newslist__list">
          <article><a class="zm-newslist__item" href="news.html"><div class="zm-newslist__meta"><span class="zm-newslist__date">0000.00.00</span><span class="zm-newslist__tag">Hiring</span></div><div class="zm-newslist__main"><p class="zm-newslist__title">Your notification title line here</p><span class="zm-arrow"></span></div></a></article>
          <article><a class="zm-newslist__item" href="news.html"><div class="zm-newslist__meta"><span class="zm-newslist__date">0000.00.00</span><span class="zm-newslist__tag">Notice</span></div><div class="zm-newslist__main"><p class="zm-newslist__title">Your slightly longer one-line notice title here</p><span class="zm-arrow"></span></div></a></article>
        </div>
      </div>
    </div>
  </section>

  <section class="zm-submit" data-slot="submit"></section>
</main>

<footer class="zm-footer" data-slot="footer"></footer>

<script src="../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="shared.js"></script>
<script src="page.js"></script>
<script src="../../_shared/wire.js"></script>
</body>
</html>
