<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your shop name — password here</title>
  <link rel="stylesheet" href="../../_shared/wire.css">
  <link rel="stylesheet" href="../../_shared/kf-defaults.css">
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="shared.css">
  <link rel="stylesheet" href="../_fx/password-gate/fx.css">
</head>
<body>
  <!-- Entrance to the shop before it opens (same spot as a Brand storefront password). The check is made by the part at this spot —
       To send to a server, remove the answer from data-fx-password-gate, set the form’s action and method to that store’s own, and have the server set data-state instead of fx:error="error" draws it -->
  <main class="bs-stage" data-slot="password-gate">
    <form class="bs-gate" data-fx="password-gate" data-fx-password-gate="answer: 0000" action="#" method="get" autocomplete="off">
      <input class="bs-gate__field" type="password" name="password" data-fx-part="field"
             placeholder="Password" data-wrong="Wrong password" aria-label="Shop Password"
             data-label="Password field · placeholder is one English word (shown in capitals) · data-wrong text when incorrect">
      <input class="bs-gate__submit" type="submit" value="Unlock" data-fx-part="submit"
             data-label="Enter button · One English word, about 6 letters (appears in caps)">
    </form>
  </main>

  <script src="../_fx/fx-core.js"></script>
  <script src="../_fx/password-gate/fx.js"></script>
  <script src="../../_shared/wire.js"></script>
</body>
</html>
