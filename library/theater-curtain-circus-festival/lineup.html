<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cast — your event name here</title>
  <script>try { if (!sessionStorage.getItem("pp-load-seen") && !matchMedia("(prefers-reduced-motion: reduce)").matches) document.documentElement.classList.add("pp-loading"); } catch (e) {}</script>
  <link rel="stylesheet" href="../../_shared/wire.css">
  <link rel="stylesheet" href="../../_shared/kf-defaults.css">
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="shared.css">
  <link rel="stylesheet" href="../_vendor/lenis@1.3.21/lenis.css">
  <link rel="stylesheet" href="../_fx/fold-curtain-scrub/fx.css">
  <link rel="stylesheet" href="../_fx/bulb-frame-lights/fx.css">
  <link rel="stylesheet" href="../_fx/card-depth-tilt/fx.css">
  <link rel="stylesheet" href="../_fx/char-squash-hover/fx.css">
  <link rel="stylesheet" href="../_fx/magnet-pull/fx.css">
  <link rel="stylesheet" href="../_fx/momentum-hover/fx.css">
  <link rel="stylesheet" href="index.css">
  <link rel="stylesheet" href="lineup.css">
  <link rel="stylesheet" href="faq.css">
  <link rel="stylesheet" href="recruit.css">
</head>
<body data-barba="wrapper">
  <header data-slot="nav"></header>

  <main data-barba="container" data-barba-namespace="lineup">
    <!-- Hero cast: below the big title a card band flows constantly to the left, bobbing like waves, and speeds up in that direction on scroll. It can also be dragged. -->
    <section class="pp-heads" data-slot="headliners-drift" data-headliners>
      <div class="pp-wrap pp-heads__head" data-reveal-group>
        <p class="pp-label" data-reveal="fade">Your small lead-in here</p>
        <h1 class="pp-h pp-h--xl" data-reveal data-fx="char-squash-hover" data-label="Your cast page English title in two lines here">The faces<br>on stage</h1>
      </div>
      <div class="pp-heads__slider"><div class="pp-heads__track" data-heads-track></div></div>
    </section>

    <!-- Search: date pills (All, Fri, Sat, Sun) and view pills. The pill strip sticks to the bottom of the screen once past the section. On selection the visible cards drop out and new cards pop in at .08s intervals -->
    <section class="pp-finder" data-slot="artist-finder" data-finder>
      <div class="pp-wrap pp-finder__wrap">
        <div class="pp-finder__head" data-reveal-group>
          <p class="pp-label" data-reveal="fade">Your small lead-in here</p>
          <h2 class="pp-h pp-h--xl" data-reveal data-fx="char-squash-hover" data-label="Your English title, two lines, about filtering by date">Find what<br>you're after</h2>
        </div>
        <div class="pp-finder__bar" data-finder-bar>
          <div class="pp-pills" data-pills role="tablist" aria-label="Date">
            <span class="pp-pills__mark" data-pills-mark></span>
            <button data-fx="magnet-pull" data-fx-magnet-pull="mode: edge; pull: .5; label: .25; dur: .6; ease: back.out(2.5); back: 1.2; spring: elastic.out(1, 0.5)" class="pp-pills__pill is-active" type="button" data-day="all">Entire</button>
            <button data-fx="magnet-pull" data-fx-magnet-pull="mode: edge; pull: .5; label: .25; dur: .6; ease: back.out(2.5); back: 1.2; spring: elastic.out(1, 0.5)" class="pp-pills__pill" type="button" data-day="Gold">Friday</button>
            <button data-fx="magnet-pull" data-fx-magnet-pull="mode: edge; pull: .5; label: .25; dur: .6; ease: back.out(2.5); back: 1.2; spring: elastic.out(1, 0.5)" class="pp-pills__pill" type="button" data-day="Earth">Saturday</button>
            <button data-fx="magnet-pull" data-fx-magnet-pull="mode: edge; pull: .5; label: .25; dur: .6; ease: back.out(2.5); back: 1.2; spring: elastic.out(1, 0.5)" class="pp-pills__pill" type="button" data-day="Day">Sunday</button>
          </div>
          <div class="pp-pills" data-pills aria-label="View">
            <span class="pp-pills__mark" data-pills-mark></span>
            <button data-fx="magnet-pull" data-fx-magnet-pull="mode: edge; pull: .5; label: .25; dur: .6; ease: back.out(2.5); back: 1.2; spring: elastic.out(1, 0.5)" class="pp-pills__pill is-active" type="button">ABC</button>
            <button data-fx="magnet-pull" data-fx-magnet-pull="mode: edge; pull: .5; label: .25; dur: .6; ease: back.out(2.5); back: 1.2; spring: elastic.out(1, 0.5)" class="pp-pills__pill" type="button">By zone</button>
          </div>
        </div>
        <div class="pp-finder__wall" data-finder-wall data-fx="velocity-lag-columns" data-fx-velocity-lag-columns="lags: .5, 1, .25, .75; gain: .25; most: 4; settle: .15"></div>
      </div>
    </section>

    <footer data-slot="footer"></footer>
  </main>

  <script src="../../_shared/vendor/gsap/gsap.min.js"></script>
  <script src="../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
  <script src="../../_shared/vendor/gsap/CustomEase.min.js"></script>
  <script src="../../_shared/vendor/gsap/SplitText.min.js"></script>
  <script src="../../_shared/vendor/gsap/InertiaPlugin.min.js"></script>
  <script src="../_vendor/lenis@1.3.21/lenis.min.js"></script>
  <script src="../_vendor/barba-core@2.10.3/barba.umd.js"></script>
  <script src="../_fx/fx-core.js"></script>
  <script src="../_fx/fold-curtain-scrub/fx.js"></script>
  <script src="../_fx/bulb-frame-lights/fx.js"></script>
  <script src="../_fx/card-depth-tilt/fx.js"></script>
  <script src="../_fx/char-squash-hover/fx.js"></script>
  <script src="../_fx/velocity-lag-columns/fx.js"></script>
  <script src="../_fx/magnet-pull/fx.js"></script>
  <script src="../_fx/momentum-hover/fx.js"></script>
  <script src="cards.js"></script>
  <script src="shared.js"></script>
  <script src="index.js"></script>
  <script src="lineup.js"></script>
  <script src="faq.js"></script>
  <script src="../../_shared/wire.js"></script>
</body>
</html>
