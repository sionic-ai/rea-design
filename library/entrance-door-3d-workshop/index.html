<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Studio Name — Studio tour</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" href="https://cdn.jsdelivr.net/npm/@fontsource/redaction-35@5/files/redaction-35-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="../../_shared/wire.css">
  <link rel="stylesheet" href="../../_shared/kf-defaults.css">
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="shared.css">
  <link rel="stylesheet" href="index.css">
  <link rel="stylesheet" href="../_fx/pulse-ring-dot/fx.css">
</head>
<body>
<div class="page-content">
  <main class="stage" data-entered="false">
    <div class="stage__content" inert aria-hidden="true">
      <div class="room" data-view="overview" data-panel-open="false" data-slot="room-scene">
        <div class="room__scene" data-label="One corner of a 3D studio — brick wall, loft, stairs, long wooden desk, swing, whiteboard, pegboard, TV, phone booth">
          <canvas class="room__canvas" aria-label="Studio 3D scene — drag to look around"></canvas>
          <div class="room__dots" data-slot="hotspots">
            <button class="dot" type="button" data-fx="pulse-ring-dot" data-view="table" aria-label="Look closer at the table"><span class="dot__mark" data-fx-part="mark"><span class="dot__pulse" data-fx-part="pulse"></span></span></button>
            <button class="dot" type="button" data-fx="pulse-ring-dot" data-view="swing" aria-label="Look closer at the swing"><span class="dot__mark" data-fx-part="mark"><span class="dot__pulse" data-fx-part="pulse"></span></span></button>
            <button class="dot" type="button" data-fx="pulse-ring-dot" data-view="whiteboard" aria-label="Look closer at the whiteboard"><span class="dot__mark" data-fx-part="mark"><span class="dot__pulse" data-fx-part="pulse"></span></span></button>
            <button class="dot" type="button" data-fx="pulse-ring-dot" data-view="pegboard" aria-label="Look closer at the pegboard"><span class="dot__mark" data-fx-part="mark"><span class="dot__pulse" data-fx-part="pulse"></span></span></button>
            <button class="dot" type="button" data-fx="pulse-ring-dot" data-view="tv" aria-label="Look closer at the TV"><span class="dot__mark" data-fx-part="mark"><span class="dot__pulse" data-fx-part="pulse"></span></span></button>
            <a class="dot dot--link" href="join.html" data-curtain data-fx="pulse-ring-dot" data-fx-pulse-ring-dot="look: link" data-view="booth" aria-label="Open the phone booth — Join"><span class="dot__mark" data-fx-part="mark"><span class="dot__pulse" data-fx-part="pulse"></span></span><svg class="dot__arrow" data-fx-part="arrow" viewBox="0 0 20 20" aria-hidden="true"><path d="M6 14 14 6M7.5 6H14v6.5" fill="none" stroke="currentColor" stroke-width="1.6"/></svg></a>
          </div>
          <div class="room__items" data-slot="item-hotspots"></div>
        </div>

        <aside class="item-panel" data-visible="false" data-slot="item-panel" aria-live="polite">
          <div class="item-panel__viewport"><div class="item-panel__content"></div></div>
        </aside>

        <header class="room-heading" data-visible="false" data-slot="room-heading">
          <h1 class="room-heading__title" data-label="Section name (English)">Area Title</h1>
          <p class="room-hint room-hint--coming-soon" data-visible="false">Coming soon</p>
        </header>

        <nav class="room-views" data-detail="false" aria-label="Room views" data-slot="room-views">
          <div class="room-views__buttons">
            <button type="button" data-view="table">Table</button>
            <button type="button" data-view="swing">Swing</button>
            <button type="button" data-view="whiteboard">Whiteboard</button>
            <button type="button" data-view="pegboard">Pegboard</button>
            <button type="button" data-view="tv">TV</button>
            <button type="button" data-view="booth">Phone booth</button>
          </div>
          <div class="room-views__picker">
            <button type="button" class="room-views__trigger" aria-expanded="false"><span>Explore the room</span><svg viewBox="0 0 20 20" width="20" height="20" aria-hidden="true"><path d="m6 8 4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.6"/></svg></button>
            <div class="room-views__menu" role="menu" hidden>
              <button type="button" role="menuitemradio" aria-checked="false" data-view="table">Table<svg viewBox="0 0 20 20" width="20" height="20" aria-hidden="true"><path d="m5 10 3.5 3.5L15 7" fill="none" stroke="currentColor" stroke-width="1.6"/></svg></button>
              <button type="button" role="menuitemradio" aria-checked="false" data-view="swing">Swing<svg viewBox="0 0 20 20" width="20" height="20" aria-hidden="true"><path d="m5 10 3.5 3.5L15 7" fill="none" stroke="currentColor" stroke-width="1.6"/></svg></button>
              <button type="button" role="menuitemradio" aria-checked="false" data-view="whiteboard">Whiteboard<svg viewBox="0 0 20 20" width="20" height="20" aria-hidden="true"><path d="m5 10 3.5 3.5L15 7" fill="none" stroke="currentColor" stroke-width="1.6"/></svg></button>
              <button type="button" role="menuitemradio" aria-checked="false" data-view="pegboard">Pegboard<svg viewBox="0 0 20 20" width="20" height="20" aria-hidden="true"><path d="m5 10 3.5 3.5L15 7" fill="none" stroke="currentColor" stroke-width="1.6"/></svg></button>
              <button type="button" role="menuitemradio" aria-checked="false" data-view="tv">TV<svg viewBox="0 0 20 20" width="20" height="20" aria-hidden="true"><path d="m5 10 3.5 3.5L15 7" fill="none" stroke="currentColor" stroke-width="1.6"/></svg></button>
              <button type="button" role="menuitemradio" aria-checked="false" data-view="booth">Phone booth<svg viewBox="0 0 20 20" width="20" height="20" aria-hidden="true"><path d="m5 10 3.5 3.5L15 7" fill="none" stroke="currentColor" stroke-width="1.6"/></svg></button>
            </div>
          </div>
          <button type="button" class="room-views__back" tabindex="-1"><svg viewBox="0 0 20 20" width="20" height="20" aria-hidden="true"><path d="M16 10H4m5-5-5 5 5 5" fill="none" stroke="currentColor" stroke-width="1.6"/></svg><span>Back to the room</span></button>
        </nav>

        <p class="room-hint" data-slot="room-hint">Drag or pinch to look.<br>Tap hotspots to explore.</p>
      </div>
      <div class="stage__scrim" aria-hidden="true"></div>
      <header class="nav" data-slot="nav">
        <a class="nav__logo" href="index.html" aria-label="Studio Name — home"><span class="wordmark" data-label="Brand wordmark (pixel blackletter logo slot)">StudioLabs</span></a>
        <a class="nav__cta" href="join.html" data-curtain>Join Studio</a>
      </header>
    </div>

    <div class="entry-screen" data-entering="false" data-slot="entry-gate">
      <div class="entry-screen__layout">
        <h1 class="entry-screen__heading" aria-label="Welcome to Studio Name">
          <span class="entry-screen__welcome" aria-hidden="true" data-label="Greeting line (English pixel serif)">Welcome to</span>
          <span class="entry-screen__mark wordmark" aria-hidden="true" data-label="Brand wordmark">StudioLabs</span>
        </h1>
        <div class="entry-screen__model" aria-hidden="true" data-label="Rotating model video slot — a 3D model of a solid wood desk, chair and lamp makes one turn in 44s · 512:448">
          <canvas class="entry-screen__video"></canvas>
        </div>
        <p class="entry-screen__cue" id="entry-cue">Click to enter</p>
      </div>
      <button class="entry-screen__enter" type="button" aria-label="Enter Studio Name" aria-describedby="entry-cue"></button>
    </div>
    <span class="sr-only" role="status"></span>
  </main>
</div>

<script src="../../_shared/vendor/gsap/gsap.min.js"></script>
<script>window.exports = {};</script>
<script src="../_vendor/three@0.185.0/build/three.cjs"></script>
<script>window.THREE = window.exports; delete window.exports;</script>
<script src="../_vendor/three-addons@0.185.0/OrbitControls.js"></script>
<script src="shared.js"></script>
<script src="room.js"></script>
<script src="index.js"></script>
<script src="../../_shared/wire.js"></script>
</body>
</html>
