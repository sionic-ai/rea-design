<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Join — Studio Name</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" href="https://cdn.jsdelivr.net/npm/@fontsource/redaction-35@5/files/redaction-35-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="../../_shared/wire.css">
  <link rel="stylesheet" href="../../_shared/kf-defaults.css">
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="shared.css">
  <link rel="stylesheet" href="join.css">
  <link rel="stylesheet" href="../_fx/pinch-velocity-gallery/fx.css">
</head>
<body class="is-join">
<div class="page-content">
  <div class="join-page" id="join-page">
    <header class="nav" data-tone="light" data-slot="nav">
      <a class="nav__logo" href="index.html" data-curtain aria-label="Studio Name — home"><span class="wordmark" data-label="Brand wordmark (black version)">StudioLabs</span></a>
      <a class="nav__cta" href="#contact">Join Studio</a>
    </header>
    <main>
      <div class="join-content">
        <div class="join-heading" data-motion="pending" data-slot="rebus-heading">
          <h1 tabindex="-1" aria-label="Introducing Studio, a maker-first product studio where the words make room for art.">
            <span class="join-heading__line" aria-hidden="true"><span class="join-word-mask"><span class="join-word">Introducing</span></span> <span class="join-word-mask"><span class="join-word">Studio,</span></span> <span class="join-word-mask"><span class="join-word">a</span></span> <span class="join-word-mask"><span class="join-word">maker-first</span></span> <span class="rebus rebus--lamp" data-rebus-slot data-label="Picture text — 3D pendant light prop made of several joined cream cylinders, at an angle"><svg data-rebus-art viewBox="0 0 220 80" aria-hidden="true"><g class="rb-lamp"><ellipse cx="40" cy="52" rx="34" ry="12"/><rect x="6" y="34" width="68" height="18"/><ellipse class="rb-top" cx="40" cy="34" rx="34" ry="12"/><ellipse cx="96" cy="44" rx="40" ry="14"/><rect x="56" y="24" width="80" height="20"/><ellipse class="rb-top" cx="96" cy="24" rx="40" ry="14"/><ellipse cx="160" cy="38" rx="36" ry="12"/><rect x="124" y="20" width="72" height="18"/><ellipse class="rb-top" cx="160" cy="20" rx="36" ry="12"/><ellipse class="rb-glow" cx="96" cy="46" rx="22" ry="5"/></g></svg></span> <span class="join-word-mask"><span class="join-word">product</span></span></span>
            <span class="join-heading__line" aria-hidden="true"><span class="join-word-mask"><span class="join-word">studio</span></span> <span class="join-word-mask"><span class="join-word">where</span></span> <span class="rebus rebus--logomark" data-rebus-slot data-rebus-art data-label="Graphic lettering — 3D prop of a logo mark made of a pair of red curly braces"><svg viewBox="0 0 100 96" aria-hidden="true"><g class="rb-brace"><path d="M38 8C22 8 20 16 20 28v10c0 6-4 9-12 10 8 1 12 4 12 10v10c0 12 2 20 18 20v-12c-6 0-6-3-6-9V58c0-6-3-9-8-10 5-1 8-4 8-10V30c0-6 0-9 6-9z"/><path d="M62 8c16 0 18 8 18 20v10c0 6 4 9 12 10-8 1-12 4-12 10v10c0 12-2 20-18 20v-12c6 0 6-3 6-9V58c0-6 3-9 8-10-5-1-8-4-8-10V30c0-6 0-9-6-9z"/></g></svg></span> <span class="join-word-mask"><span class="join-word">the</span></span> <span class="join-word-mask"><span class="join-word">words</span></span> <span class="join-word-mask"><span class="join-word">make</span></span> <span class="join-word-mask"><span class="join-word">room</span></span> <span class="join-word-mask"><span class="join-word">for</span></span></span>
            <span class="join-heading__line" aria-hidden="true"><span class="join-word-mask"><span class="join-word">art.</span></span><span class="rebus-tail" data-rebus-slot><span class="rebus rebus--squiggle" data-rebus-art data-label="Picture text — 3D prop of wavy lines like blue yarn"><svg viewBox="0 0 100 110" aria-hidden="true"><path class="rb-squiggle" d="M18 14c22-8 40 4 26 18S6 52 26 66s48-6 40 14-34 16-30 22"/></svg></span><svg class="rebus-cursor" data-rebus-art viewBox="0 0 14 20" shape-rendering="crispEdges" aria-hidden="true" data-label="Image text — pixel arrow cursor"><path class="rb-cursor-edge" d="M0 0h2v1h1v1h1v1h1v1h1v1h1v1h1v1h1v1h1v1h1v1h1v1h1v2H9v1h1v2h1v2h1v2H9v-1H8v-2H7v-2H6v-1H5v1H4v1H3v1H2v1H0z"/><path class="rb-cursor-fill" d="M1 2h1v1h1v1h1v1h1v1h1v1h1v1h1v1h1v1h1v1h1v1H8v1h1v2h1v2h1v1h-1v-1H9v-2H8v-2H7v-1H5v1H4v1H3v1H2v1H1z"/></svg></span></span>
          </h1>
        </div>

        <section class="join-contact" id="contact" aria-labelledby="contact-title" data-slot="contact-form">
          <div class="join-contact__intro">
            <h2 id="contact-title" data-label="Section name (English)">Get in touch</h2>
            <p>One line here on who you are looking for — a sentence slot saying you seek makers, artists, and creators to build with.</p>
          </div>
          <form class="join-form" aria-label="Application form" novalidate>
            <fieldset class="join-form__fields">
              <div class="join-form__row">
                <label class="join-field"><span>Name</span><input placeholder="Please write your name" name="name" autocomplete="name"></label>
                <label class="join-field"><span>Email</span><input placeholder="name@studio.com" name="email" type="email" autocomplete="email"></label>
              </div>
              <div class="join-form__row">
                <label class="join-field"><span>Age</span><span class="join-select"><select name="age"><option value="">Choose one</option><option>Option 1</option><option>Option 2</option></select><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="m4 6 4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></span></label>
                <label class="join-field"><span>Gender</span><span class="join-select"><select name="gender"><option value="">Choose one</option><option>Option 1</option><option>Option 2</option></select><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="m4 6 4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></span></label>
              </div>
              <label class="join-field"><span>Where We Live</span><input placeholder="City, region" name="location"></label>
              <div class="join-form__row">
                <label class="join-field"><span>What I do now</span><span class="join-select"><select name="situation"><option value="">Choose one</option><option>Option 1</option><option>Option 2</option></select><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="m4 6 4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></span></label>
                <label class="join-field join-field--follow-up"><span class="sr-only">What it’s about</span><input placeholder="What’s going on?" name="situationDetail"></label>
              </div>
              <label class="join-field"><span>Work link</span><input placeholder="Website, portfolio, social links" name="work"></label>
              <div class="join-form__row">
                <label class="join-field"><span>How comfortable you are in front of the camera</span><span class="join-select"><select name="camera"><option value="">Choose one</option><option>Option 1</option></select><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="m4 6 4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></span></label>
                <label class="join-field"><span>Available times</span><span class="join-select"><select name="availability"><option value="">Choose one</option><option>Option 1</option></select><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="m4 6 4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></span></label>
              </div>
              <label class="join-field"><span>How did you hear about us</span><span class="join-select"><select name="discovery"><option value="">Choose one</option><option>Option 1</option></select><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="m4 6 4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></span></label>
              <label class="join-field"><span>What I’m building now · self-introduction</span><textarea name="message" placeholder="Please share a self-introduction and what you’re making now."></textarea></label>
              <div class="join-form__footer"><button class="join-submit" type="submit">Send application</button></div>
            </fieldset>
            <p class="join-form__notice" role="status" aria-live="polite"></p>
          </form>
        </section>
      </div>

      <section class="join-gallery" aria-label="Life at the studio" data-slot="pinch-gallery" data-fx="pinch-velocity-gallery" data-fx-pinch-velocity-gallery="top: 64">
        <div class="join-gallery__pin" data-fx-part="pin">
          <div class="join-gallery__viewport" data-fx-part="viewport">
            <canvas class="join-gallery__canvas" data-fx-part="canvas" aria-label="Studio photo strip — drag or scroll to browse"></canvas>
            <div class="join-gallery__list" data-fx-part="list">
              <div class="wf-img" data-fx-part="photo" data-label="Daily studio life · people gathered around a desk · daytime window light · portrait"></div>
              <div class="wf-img" data-fx-part="photo" data-label="Shooting scene · Person in front of camera · Warm lighting · Portrait"></div>
              <div class="wf-img" data-fx-part="photo" data-label="Attic workspace · two people at a monitor · portrait"></div>
              <div class="wf-img" data-fx-part="photo" data-label="Person sitting on a swing chair · afternoon light · portrait"></div>
              <div class="wf-img" data-fx-part="photo" data-label="Whiteboard meeting · handwriting · portrait"></div>
              <div class="wf-img" data-fx-part="photo" data-label="Accessory shelf close-up · pegboard · portrait"></div>
              <div class="wf-img" data-fx-part="photo" data-label="Evening gathering · long shared desk · portrait"></div>
              <div class="wf-img" data-fx-part="photo" data-label="Solo person shot · in front of a brick wall · portrait"></div>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>
</div>

<script src="../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../_fx/fx-core.js"></script>
<script src="../_fx/pinch-velocity-gallery/fx.js"></script>
<script src="shared.js"></script>
<script src="join.js"></script>
<script src="../../_shared/wire.js"></script>
</body>
</html>
