<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>About · marketer portfolio with a mail-merge greeting</title>
<link rel="stylesheet" href="../../_shared/wire.css">
<link rel="stylesheet" href="../../_shared/kf-defaults.css">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="shared.css">

<body data-page="about" id="top">

<header data-slot="header"></header>

<main>
  <!-- 1. Red panel: three bold handwriting-style lines filled with hatching are drawn one after another -->
  <section class="ab-big" data-tone="red" data-cursor="scroll" data-slot="hatched-statement" data-label="Your three bold hatched English pledge lines here">
    <p class="bayon ab-big__line">A big promise in one line.</p>
    <p class="bayon ab-big__line">A big promise in one line.</p>
    <p class="bayon ab-big__line">A big promise in one line.</p>
  </section>

  <!-- 1-1. Film panel: typewriter words scattered like stairs on black, with a small video on the right and a playback bar below -->
  <section class="ab-film" data-tone="dark" data-cursor="scroll" data-slot="film-player">
    <p class="ab-film__words" data-label="Your seven English typewriter words here, scattered like stairs"><span style="--x:22%;--y:30%">A short</span><span style="--x:30%;--y:36%">line</span><span style="--x:24%;--y:43%">set in</span><span style="--x:20%;--y:50%">words</span><span style="--x:32%;--y:50%">that</span><span style="--x:25%;--y:57%">step</span><span style="--x:24%;--y:64%">down.</span></p>
    <div class="ab-film__video wf-img wr-shot is-bw wf-video" data-label="Childhood home video · indoors · small landscape window · 32s"><video src="placeholder-16x9.mp4" muted playsinline preload="none" aria-hidden="true"></video></div>
    <div class="ab-film__bar micro"><button class="ab-film__play" type="button" aria-label="Play"><svg viewBox="0 0 10 10" aria-hidden="true"><path d="M2 1l7 4-7 4z"/></svg></button><i><b></b></i><span>0:00 / 0:32</span></div>
  </section>

  <!-- 2. Constellation: handwritten sentence on a red panel → colored dots scattered on a cream panel gather into a black constellation on scroll and lines are drawn -->
  <section class="ab-stars" data-cursor="scroll" data-slot="constellation-scrub">
    <div class="ab-stars__pin">
      <div class="ab-stars__red"><p class="hand ab-stars__say" data-label="Your handwritten English sentence here, two lines · one red word">A line with a <span>red word</span><br>handwritten across two lines…</p></div>
      <svg class="ab-stars__lines" aria-hidden="true"></svg>
      <div class="ab-stars__dots" aria-hidden="true"></div>
      <span class="micro ab-stars__hint">Scroll ↓</span>
    </div>
  </section>

  <!-- 3. Mosaic map: blackletter sentence over a line-drawn world map, red dots appear while approaching one region -->
  <section class="ab-map" data-cursor="scroll" data-slot="map-zoom-mosaic">
    <div class="ab-map__pin">
      <svg class="ab-map__svg" viewBox="0 0 1000 520" aria-hidden="true">
        <g class="ab-map__land">
          <path d="M80 120c40-40 120-60 170-40s60 70 30 110-20 90-70 100-90-40-110-80-60-50-20-90Z"/>
          <path d="M260 300c30-10 60 10 70 50s-10 110-40 140-60-10-60-60 0-120 30-130Z"/>
          <path d="M440 90c50-30 140-30 190 0s40 60 0 80-110 10-140 40-90-10-90-50 10-60 40-70Z"/>
          <path d="M470 230c40-20 90 0 100 50s-20 130-60 150-70-40-70-100 0-90 30-100Z"/>
          <path d="M620 140c60-40 200-50 270 0s30 110-30 140-120-10-150 30-70 20-90-30-60-100 0-140Z"/>
          <path class="ab-map__focus" d="M690 250c20-5 40 10 40 40s-20 60-35 60-25-30-25-55 5-40 20-45Z"/>
          <path d="M800 380c40-10 90 10 90 40s-40 40-80 30-50-60-10-70Z"/>
        </g>
        <g class="ab-map__pins"></g>
      </svg>
      <p class="ab-map__say" data-label="Your blackletter English line · one red word here.">…a gothic line that ends with one <span>red word</span>…</p>
    </div>
  </section>

  <!-- 4. Cork board: photo notes drop and pin one by one onto a wood-framed cork board, and can be dragged around -->
  <section class="ab-cork" data-cursor="scroll" data-slot="corkboard-pins">
    <p class="hand ab-cork__say" data-label="Your handwritten English line here">…a handwritten line about the board…</p>
    <div class="ab-cork__board" data-tone="photo" data-label="Note text: Your handwritten English memo here">
      <figure class="ab-cork__note" style="--x:12%;--y:14%;--r:-6deg" data-cursor="peel"><div class="wf-img wr-shot is-bw" data-label="Instant photo taken on a trip · daytime · square"></div><figcaption class="hand">A short note</figcaption></figure>
      <figure class="ab-cork__note" style="--x:40%;--y:8%;--r:4deg" data-cursor="peel"><div class="wf-img wr-shot is-red" data-label="Concert ticket stub · red · horizontal"></div><figcaption class="hand">Date goes here</figcaption></figure>
      <figure class="ab-cork__note" style="--x:66%;--y:20%;--r:-3deg" data-cursor="peel"><div class="wf-img wr-shot is-bw" data-label="Black-and-white photo with friends · indoors · portrait"></div><figcaption class="hand">One line here</figcaption></figure>
      <figure class="ab-cork__note" style="--x:22%;--y:54%;--r:5deg" data-cursor="peel"><div class="wf-img wr-shot is-bw" data-label="Handwritten note · lined notebook · landscape"></div><figcaption class="hand">Another note</figcaption></figure>
      <figure class="ab-cork__note" style="--x:56%;--y:58%;--r:-5deg" data-cursor="peel"><div class="wf-img wr-shot is-red" data-label="Favorite book cover · red · portrait"></div><figcaption class="hand">Book title here</figcaption></figure>
      <i class="ab-cork__pin"></i>
    </div>
  </section>

  <!-- 4-1. Photo strip + scrambled text: gray photo slots stand in one row, the center sentence scrambles into symbols then resolves -->
  <section class="ab-scramble" data-cursor="scroll" data-slot="photo-strip-scramble">
    <div class="ab-scramble__strip"><div class="wf-img wr-shot" data-label="Photo 1"></div><div class="wf-img wr-shot" data-label="Photo 2"></div><div class="wf-img wr-shot" data-label="Photo 3"></div><div class="wf-img wr-shot" data-label="Photo 4"></div><div class="wf-img wr-shot" data-label="Photo 5"></div><div class="wf-img wr-shot" data-label="Photo 6"></div><div class="wf-img wr-shot" data-label="Photo 7"></div></div>
    <p class="bayon ab-scramble__text" data-text="A two line sentence about 00% of everything goes here, ending with a question?" data-label="Two lines of English that scramble then resolve · one number · ends with a question mark"></p>
  </section>

  <!-- 5. Principles list: a long paragraph joining red numbers and bold uppercase sentences -->
  <section class="ab-rules" data-cursor="scroll" data-slot="numbered-principles">
    <p class="bayon ab-rules__p" data-label="Your numbered English principle sentences here"></p>
  </section>
</main>

<footer data-slot="footer"></footer>
