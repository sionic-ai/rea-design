<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Notice title — Your event name here</title>
  <link rel="stylesheet" href="../../_shared/wire.css">
  <link rel="stylesheet" href="../../_shared/kf-defaults.css">
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="shared.css">
  <link rel="stylesheet" href="sub.css">
</head>
<body data-page="article">
  <div data-ks="chrome"></div>

  <article class="ks-film">
    <!-- Notice header — white text over a teal-lit photo, with a large curved white arc below -->
    <header class="ks-subkv" data-ks-kv data-slot="article-head">
      <div class="ks-subkv__photo wf-img" data-label="Outdoor screening setup photo in a forest · covered in teal light · wide landscape" aria-hidden="true"></div>
      <div class="ks-subkv__in">
        <span class="ks-title__icon ks-subkv__icon" data-ks-icon></span>
        <p class="ks-subkv__en" data-label="Section name in English">information</p>
        <h1 class="ks-subkv__title">Your notice title in one line here</h1>
        <p class="ks-subkv__meta"><span>Fri, 0/00/0000</span><span class="ks-news__cat">event</span></p>
      </div>
      <svg class="ks-subkv__cover" viewBox="0 0 1200 160" preserveAspectRatio="none" aria-hidden="true"><path d="M0 160V70C300 -10 900 -10 1200 70V160Z"/></svg>
    </header>

    <!-- Body — centered round logo graphic, short text, share buttons, back to list -->
    <section class="ks-post" data-slot="article-body">
      <figure class="ks-post__emblem" data-ks-fade><svg viewBox="0 0 260 260" role="img" aria-label="Event emblem — logo lettering under a tent roof" data-label="Event emblem graphic · teal tent roof + logo text"><path class="ks-emblem__roof" d="M30 130C40 70 90 26 130 18c40 8 90 52 100 112Z"/><path class="ks-emblem__base" d="M30 130h200v40c0 40-40 70-100 70S30 210 30 170Z"/><text class="ks-emblem__txt" x="130" y="168" text-anchor="middle">Intersection</text><text class="ks-emblem__en" x="130" y="204" text-anchor="middle">CINEMA</text></svg></figure>
      <div class="ks-post__text">
        <p>Your first line of the notice body goes here. State in one sentence what has changed.</p>
        <p>Include a line conveying apology to those who have been waiting,<br>We will let you know on this site once it reopens.</p>
      </div>
      <div class="ks-post__share"><span>SHARE</span><a class="ks-share__icon" href="#" aria-label="Social share" data-ks-ico="fb"></a><a class="ks-share__icon" href="#" aria-label="Share on X" data-ks-ico="x"></a></div>
      <a class="ks-post__back" href="index.html#information">Notice list</a>
    </section>
  </article>

  <div data-ks="footer"></div>

  <script src="../../_shared/vendor/gsap/gsap.min.js"></script>
  <script src="shared.js"></script>
  <script src="../../_shared/wire.js"></script>
</body>
</html>
