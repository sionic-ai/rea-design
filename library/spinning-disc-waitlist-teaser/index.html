<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Brand.fm — Your one-line intro here</title>
  <link rel="stylesheet" href="../../_shared/wire.css">
  <link rel="stylesheet" href="../../_shared/kf-defaults.css">
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="../_fx/spring-card-morph/fx.css">
  <link rel="stylesheet" href="shared.css">
</head>
<body>
  <!-- 3D stage: a single CD spinning in gray fog, five lasers coming down from above bend away when they hit the CD. Dragging sideways rotates the stage, holding down gathers the lasers into one line and speeds up the CD -->
  <canvas class="d-gl" data-slot="laser-disc-stage" aria-label="Spinning CD and laser 3D scene — drag to spin and press to collect"></canvas>

  <!-- Waitlist card: four panels — default (docked at bottom) · info · sign-up · loaded — move back and forth on a spring -->
  <div class="d-ui" data-slot="waitlist-card" data-fx="spring-card-morph" data-fx-spring-card-morph="wait: ready; intro: 400">
    <div class="d-overlay" data-fx-part="overlay"></div>
    <div class="d-spin" aria-hidden="true"><i style="--n:0"></i><i style="--n:1"></i><i style="--n:2"></i><i style="--n:3"></i><i style="--n:4"></i><i style="--n:5"></i><i style="--n:6"></i><i style="--n:7"></i><i style="--n:8"></i><i style="--n:9"></i><i style="--n:10"></i><i style="--n:11"></i></div>
    <div class="d-box" data-fx-part="box">
      <header class="d-head" data-fx-part="head">
        <button type="button" class="d-round d-round--x" data-go="home" aria-label="Close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
        <div class="d-head__pill" data-fx-part="title"></div>
        <button type="button" class="d-round d-round--ok" data-fx-part="confirm" aria-label="Confirm"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6L9 17l-5-5"/></svg></button>
      </header>
      <div class="d-card">
        <div class="d-pane d-pane--home" data-fx-part="pane" data-key="home" data-size="280x200" data-dock="bottom">
          <button type="button" class="d-info" data-go="info" aria-label="Info">i</button>
          <div class="d-wave" role="button" aria-label="Toggle sound off and on" tabindex="0"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
          <div class="d-switch"><input type="checkbox" id="d-debug" aria-label="View scene skeleton"><label for="d-debug"></label></div>
          <div class="d-title" data-label="Brand English Wordmark">Brand.fm</div>
          <div class="d-actions"><button type="button" class="d-cta" data-go="form"><span class="d-cta__label">Join the waiting list</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg></button></div>
        </div>
        <div class="d-pane d-pane--info" data-fx-part="pane" data-key="info" data-size="340x480" data-title="Info">
          <span class="d-ver">v0.0.0</span>
          <div class="d-logo" data-label="Brand Logo Wordmark">Brand.fm</div>
          <p class="d-pill">Your short alert here</p>
          <p class="d-para">Service intro here, three or four lines. Briefly note what the place does and when it is open.</p>
        </div>
        <div class="d-pane d-pane--form" data-fx-part="pane" data-key="form" data-size="280x140" data-title="Join waiting list" data-confirm>
          <form novalidate>
            <input type="text" name="name" placeholder="Name" autocomplete="name" aria-label="Name">
            <input type="email" name="email" placeholder="Email" autocomplete="email" aria-label="Email">
          </form>
        </div>
        <div class="d-pane d-pane--wait" data-fx-part="pane" data-key="wait" data-size="100x100" data-next="home" data-hold="1000">
          <div class="d-spin" aria-hidden="true"><i style="--n:0"></i><i style="--n:1"></i><i style="--n:2"></i><i style="--n:3"></i><i style="--n:4"></i><i style="--n:5"></i><i style="--n:6"></i><i style="--n:7"></i><i style="--n:8"></i><i style="--n:9"></i><i style="--n:10"></i><i style="--n:11"></i></div>
        </div>
      </div>
    </div>
  </div>

  <script>window.exports = {};</script>
  <script src="../_vendor/three@0.162.0/build/three.cjs"></script>
  <script>window.THREE = window.exports; delete window.exports;</script>
  <script src="../_vendor/three-addons@0.162.0/OrbitControls.js"></script>
  <script src="../_vendor/three-addons@0.162.0/RoomEnvironment.js"></script>
  <script src="../../_shared/vendor/gsap/gsap.min.js"></script>
  <script src="../_fx/fx-core.js"></script>
  <script src="../_fx/spring-card-morph/fx.js"></script>
  <script src="shared.js"></script>
  <script src="index.js"></script>
  <script src="../../_shared/wire.js"></script>
</body>
</html>
