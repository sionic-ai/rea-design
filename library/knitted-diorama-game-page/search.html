<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Find game software·pages | Brand name</title>
  <link rel="stylesheet" href="../../_shared/wire.css">
  <link rel="stylesheet" href="../../_shared/kf-defaults.css">
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="shared.css">
  <link rel="stylesheet" href="product.css">
  <style>
    .s-search { padding: 64px 0 120px; }
    .s-search .p-search { width: 520px; max-width: 100%; height: 48px; margin: 0 auto; padding: 0 12px 0 22px; }
    .s-search__row { display: flex; justify-content: center; gap: 8px; }
    .s-search__go { flex: none; padding: 0 16px; border: 0; background: var(--kf-line); color: var(--kf-dim); font: 700 12px/1 var(--kf-font-sans); cursor: pointer; transition: background-color 150ms linear, color 150ms linear; }
    .s-search__go:hover { background: var(--kf-accent); color: var(--kf-on-accent); }
    .s-search__bar { position: fixed; left: 0; top: 0; width: 100%; height: 3px; z-index: 80; transform-origin: 0 50%; background: var(--kf-accent); transform: scaleX(0); }
    .s-result { list-style: none; width: 520px; max-width: 100%; margin: 26px auto 0; padding: 0; }
    .s-result li { padding: 12px 4px; border-bottom: 1px solid var(--kf-line); font-size: 13px; }
  </style>
</head>
<body>
  <span class="s-search__bar" aria-hidden="true"></span>
  <header class="n-hdr" data-n-hdr data-slot="corp-header"></header>
  <main class="s-search p-in" data-slot="search-box">
    <form class="s-search__row" role="search" onsubmit="return false">
      <label class="p-search"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M13 13l4.5 4.5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg><input type="search" placeholder="Please enter a keyword" aria-label="Keyword"><i aria-hidden="true"></i></label>
      <button class="s-search__go" type="submit">Find</button>
    </form>
    <ul class="s-result" aria-live="polite"></ul>
  </main>
  <footer class="n-foot" data-n-foot data-crumb="Find" data-slot="corp-footer"></footer>

  <script src="../../_shared/vendor/gsap/gsap.min.js"></script>
  <script src="../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
  <script src="../../_shared/vendor/gsap/CustomEase.min.js"></script>
  <script src="shared.js"></script>
  <script>
    (() => {
      // The original, on entry, fills a red bar at the top while loading results — result slots are lines of the same type
      const bar = document.querySelector(".s-search__bar");
      const list = document.querySelector(".s-result");
      const input = document.querySelector(".s-search input");
      const load = () => {
        gsap.fromTo(bar, { scaleX: 0, opacity: 1 }, { scaleX: 1, duration: 0.8, ease: "power2.out", onComplete: () => gsap.to(bar, { opacity: 0, duration: 0.2 }) });
        list.innerHTML = input.value ? Array.from({ length: 5 }, (_, i) => `<li>「${input.value}” search results ${i + 1} — Your software · page name here</li>`).join("") : "";
      };
      document.querySelector(".s-search__row").addEventListener("submit", load);
      document.querySelector(".s-search i").addEventListener("click", () => { input.value = ""; list.innerHTML = ""; input.focus(); });
      load();
    })();
  </script>
  <script src="../../_shared/wire.js"></script>
</body>
</html>
