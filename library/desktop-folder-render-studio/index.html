<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Render showcase visual tech studio Hero</title>
<link rel="stylesheet" href="../../_shared/wire.css">
<link rel="stylesheet" href="../../_shared/kf-defaults.css">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="../_fx/fade-cycle-viewer/fx.css">
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="index.css">
</head>
<body class="at-body" data-page="index">
<main class="at-home at-show" data-fx="fade-cycle-viewer" data-slot="render-showcase">
  <div class="at-veil" aria-hidden="true"></div>

  <!-- Wordmark filling the full screen width — dims in view mode and closes on tap -->
  <div class="at-mark" data-slot="wordmark">
    <div class="at-mark__btn" data-fx-part="close">
      <svg class="at-word" viewBox="0 0 720 72" role="img" aria-label="Name" data-label="Studio English wordmark · four wide, bold capital letters · full screen width"><text x="360" y="71.5" text-anchor="middle" textLength="718" lengthAdjust="spacingAndGlyphs">NAME</text></svg>
    </div>
  </div>

  <!-- Render showcase — every 4s fades out over .7s and fades in the next image. Click for dark viewing mode -->
  <div class="at-stage">
    <div class="at-stage__in" data-fx-part="stage">
      <figure class="at-r at-r1" data-fx-part="item" data-title="Render Title 01" data-label="3D render · neon-green felt ball with black English print · centered on white · square">
        <svg viewBox="48 58 904 904" aria-hidden="true">
          <defs>
            <radialGradient id="at-r1-g" cx="40%" cy="36%" r="70%"><stop offset="0" class="s1"/><stop offset="0.55" class="s2"/><stop offset="1" class="s3"/></radialGradient>
            <filter id="at-r1-fuzz" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="4"/><feDisplacementMap in="SourceGraphic" scale="9"/></filter>
          </defs>
          <circle cx="500" cy="510" r="330" fill="url(#at-r1-g)" filter="url(#at-r1-fuzz)"/>
          <g class="seam" fill="none" stroke-width="20" stroke-linecap="round" filter="url(#at-r1-fuzz)"><path d="M228 300c120 90 150 330 18 440"/><path d="M772 300c-120 90-150 330-18 440"/></g>
          <text class="print" x="500" y="500" text-anchor="middle" textLength="300" lengthAdjust="spacingAndGlyphs">NAME</text>
          <text class="print2" x="500" y="562" text-anchor="middle" textLength="170" lengthAdjust="spacingAndGlyphs">0000</text>
        </svg>
      </figure>
      <figure class="at-r at-r2" data-fx-part="item" data-title="Render Title 02" data-label="3D render · green dot inside chrome ring symbol with world map on screen · front view · square" hidden>
        <svg viewBox="100 130 800 800" aria-hidden="true">
          <defs>
            <linearGradient id="at-r2-chrome" x1="0" y1="0" x2="1" y2="0.4"><stop offset="0" class="s1"/><stop offset="0.35" class="s2"/><stop offset="0.6" class="s3"/><stop offset="1" class="s4"/></linearGradient>
            <radialGradient id="at-r2-screen" cx="50%" cy="20%" r="80%"><stop offset="0" class="s5"/><stop offset="0.7" class="s6"/><stop offset="1" class="s7"/></radialGradient>
            <pattern id="at-r2-dots" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="7" cy="7" r="3.4" class="dot"/></pattern>
            <clipPath id="at-r2-top"><rect x="0" y="0" width="1000" height="455"/></clipPath>
            <clipPath id="at-r2-bot"><rect x="0" y="545" width="1000" height="455"/></clipPath>
          </defs>
          <g clip-path="url(#at-r2-top)"><path d="M500 170a330 330 0 0 1 330 330H170a330 330 0 0 1 330-330z" fill="url(#at-r2-chrome)"/><path d="M500 250a250 250 0 0 1 250 250H250a250 250 0 0 1 250-250z" fill="url(#at-r2-screen)"/><path d="M500 250a250 250 0 0 1 250 250H250a250 250 0 0 1 250-250z" fill="url(#at-r2-dots)" opacity="0.6"/><path class="land" d="M370 330c40-30 90-20 120 10 20 30-10 60 20 80 40 10 70-30 110-10 30 20 20 60-10 90H330c-20-60 0-130 40-170z"/></g>
          <rect x="160" y="420" width="700" height="80" class="bar" fill="url(#at-r2-chrome)"/>
          <rect x="160" y="500" width="700" height="18" class="gap"/>
          <g clip-path="url(#at-r2-bot)"><path d="M170 518h330l-60 320a330 330 0 0 1-270-320z" fill="url(#at-r2-chrome)"/><path d="M250 545h200l-48 240a250 250 0 0 1-152-240z" fill="url(#at-r2-screen)"/><path d="M250 545h200l-48 240a250 250 0 0 1-152-240z" fill="url(#at-r2-dots)" opacity="0.6"/><path d="M560 518h300v70H640l-56 300h-80z" fill="url(#at-r2-chrome)"/></g>
          <rect x="530" y="518" width="18" height="370" class="gap" transform="skewX(-10) translate(95 0)"/>
        </svg>
      </figure>
      <figure class="at-r at-r3" data-fx-part="item" data-title="Render Title 03" data-label="3D render · sky-blue thick initial symbol with elliptical orbit ring · front view · square" hidden>
        <svg viewBox="120 125 760 760" aria-hidden="true">
          <g class="side" transform="translate(0 26)"><path d="M500 180l200 620h-120l-80-290-80 290H300z"/><path d="M180 520c0-90 145-150 320-150s320 60 320 150-145 150-320 150-320-60-320-150zm110 0c0 40 95 72 210 72s210-32 210-72-95-72-210-72-210 32-210 72z" fill-rule="evenodd"/><rect x="230" y="790" width="190" height="40" rx="8"/><rect x="580" y="790" width="190" height="40" rx="8"/></g>
          <g class="face"><path d="M500 180l200 620h-120l-80-290-80 290H300z"/><path d="M180 520c0-90 145-150 320-150s320 60 320 150-145 150-320 150-320-60-320-150zm110 0c0 40 95 72 210 72s210-32 210-72-95-72-210-72-210 32-210 72z" fill-rule="evenodd"/><rect x="230" y="790" width="190" height="40" rx="8"/><rect x="580" y="790" width="190" height="40" rx="8"/><circle cx="500" cy="470" r="34" class="eye"/></g>
          <path class="hi" d="M500 196l20 60-40 0z"/>
        </svg>
      </figure>
      <figure class="at-r at-r4" data-fx-part="item" data-title="Render Title 04" data-label="3D render · pink-purple glossy app icon tile with a white star symbol · slightly tilted · square" hidden>
        <svg viewBox="85 105 830 830" aria-hidden="true">
          <defs><linearGradient id="at-r4-g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" class="s1"/><stop offset="1" class="s2"/></linearGradient><linearGradient id="at-r4-gloss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" class="s3"/><stop offset="1" class="s4"/></linearGradient></defs>
          <rect x="250" y="270" width="500" height="500" rx="118" class="base" transform="translate(0 22)"/>
          <rect x="250" y="250" width="500" height="500" rx="118" fill="url(#at-r4-g)"/>
          <path d="M268 390c0-80 60-122 120-122h224c60 0 120 42 120 122z" fill="url(#at-r4-gloss)"/>
          <path class="glyph" d="M500 330l40 130 130 40-130 40-40 130-40-130-130-40 130-40z"/>
        </svg>
      </figure>
      <figure class="at-r at-r5" data-fx-part="item" data-title="Render Title 05" data-label="3D render · orange shield badge with a white star emblem · metal rim · portrait" hidden>
        <svg viewBox="83 88 835 835" aria-hidden="true">
          <defs><linearGradient id="at-r5-g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" class="s1"/><stop offset="1" class="s2"/></linearGradient><linearGradient id="at-r5-rim" x1="0" y1="0" x2="1" y2="1"><stop offset="0" class="s3"/><stop offset="0.5" class="s4"/><stop offset="1" class="s5"/></linearGradient></defs>
          <path d="M500 150l300 100v230c0 190-130 320-300 380-170-60-300-190-300-380V250z" fill="url(#at-r5-rim)"/>
          <path d="M500 200l250 84v196c0 160-108 270-250 322-142-52-250-162-250-322V284z" fill="url(#at-r5-g)"/>
          <path class="glyph" d="M500 330l36 110h116l-94 68 36 110-94-68-94 68 36-110-94-68h116z"/>
          <path class="hi" d="M270 300l230-76v60l-200 66z"/>
        </svg>
      </figure>
    </div>
  </div>

  <!-- Bottom — one-line intro, folder and info icons (triangle under the name on hover) -->
  <div class="at-foot" data-slot="desk-icons">
    <p class="at-tag" data-label="One-line studio intro · small uppercase label">One-line studio intro here</p>
    <nav class="at-icons" aria-label="Menu">
      <a class="at-icon" href="works.html">
        <svg class="at-icon__art" viewBox="0 0 74 72" aria-hidden="true"><path class="tab" d="M5 5.5h20.4c1.3 0 2.5.6 3.3 1.6l3.6 4.4c.8 1 2 1.6 3.3 1.6H69c2.5 0 4.5 2 4.5 4.5V60H.5V10C.5 7.5 2.5 5.5 5 5.5z"/><path class="body" d="M69 15.5c2.5 0 4.5 2 4.5 4.5v44c0 2.5-2 4.5-4.5 4.5H5C2.5 68.5.5 66.5.5 64V20c0-2.5 2-4.5 4.5-4.5z"/></svg>
        <span class="at-icon__name"><span class="at-icon__label">Projects</span><i class="at-pointer" aria-hidden="true"></i></span>
      </a>
      <a class="at-icon" href="#info" aria-disabled="true">
        <svg class="at-icon__art" viewBox="0 0 72 72" aria-hidden="true"><circle class="ring" cx="36" cy="36" r="34.5"/><path class="body" d="M44 25.7H28v37.6h16zM49.1 61.5H22.9v2h26.2zM44 25.7H22.9v2H44z"/><circle class="body" cx="36" cy="15.5" r="6.5"/></svg>
        <span class="at-icon__name"><span class="at-icon__label">Information</span><i class="at-pointer" aria-hidden="true"></i></span>
      </a>
    </nav>
  </div>

  <!-- View mode bottom row: image name, dots, close -->
  <div class="at-viewbar" data-slot="viewer-bar">
    <p class="at-viewbar__title" data-fx-part="title"></p>
    <div class="at-viewbar__dots" data-fx-part="dots"></div>
    <button class="at-viewbar__close" type="button" data-fx-part="close">Close</button>
  </div>
</main>

<script src="../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../_shared/vendor/gsap/CustomEase.min.js"></script>
<script src="../_fx/fx-core.js"></script>
<script src="../_fx/fade-cycle-viewer/fx.js"></script>
<script src="shared.js"></script>
<script src="../../_shared/wire.js"></script>
</body>
</html>
