<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>News collection · a snack brand where the bag stays the same but the world changes</title>
<link rel="stylesheet" href="../../_shared/wire.css">
<link rel="stylesheet" href="../../_shared/kf-defaults.css">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="list.css">
</head>
<body data-page="list">

<header data-slot="header"></header>

<main>
  <!-- Four color-block rows enter staggered, and moving the mouse makes peanuts pop out where it passed, bounce and fall to the floor -->
  <section class="hs-sp" data-slot="block-rows-hero">
    <p class="wf-note">Four color-block rows · on open they settle from x 15·-20·20·-15% · scroll scrub .8 moves upper and lower groups 5% in opposite directions · a peanut drops every screen width/8 the mouse travels</p>
    <div class="hs-sp__group is-right">
      <div class="hs-sp__row is-1"></div>
    </div>
    <div class="hs-sp__group is-left">
      <div class="hs-sp__row is-2"></div>
      <div class="hs-sp__row is-3"></div>
      <div class="hs-sp__row is-4"></div>
    </div>
    <div class="hs-drop" data-slot="mouse-drop"></div>
  </section>

  <!-- News grid: four flavor-colored cards, each row with a different ratio of photo and title. Photos are black-and-white, color returns on hover -->
  <section class="hs-feat" data-slot="card-list">
    <div class="hs-feat__head">
      <h1 class="hs-d" data-reveal="chars" data-label="Your list English title here">Featured Stories</h1>
      <p class="hs-t" data-reveal="lines" data-delay=".2">Your line introducing the list goes here. Short and playful, ending with an ellipsis…</p>
    </div>
    <div class="hs-blog"></div>
  </section>
</main>

<footer data-slot="footer"></footer>

<script src="../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../../_shared/vendor/gsap/SplitText.min.js"></script>
<script src="../../_shared/vendor/gsap/CustomEase.min.js"></script>
<script src="../../_shared/vendor/gsap/CustomWiggle.min.js"></script>
<script src="../../_shared/vendor/gsap/EasePack.min.js"></script>
<script src="../_vendor/lenis@1.1.14/lenis.min.js"></script>
<script src="../_vendor/lottie-web@5.12.2/lottie_svg.min.js"></script>
<script src="shared.js"></script>
<script src="list.js"></script>
<script src="../../_shared/wire.js"></script>
</body>
</html>
