<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>News list · craft brand on a tile grid</title>
<link rel="stylesheet" href="../../_shared/wire.css">
<link rel="stylesheet" href="../../_shared/kf-defaults.css">
<link rel="stylesheet" href="../_fx/tile-veil/fx.css">
<link rel="stylesheet" href="../_fx/pin-cross-frames/fx.css">
<link rel="stylesheet" href="../_fx/char-roll/fx.css">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="sub.css">
</head>
<body data-page="news">
<div id="smooth-wrapper">
<div id="smooth-content" class="sc-grid">
<main>
  <header class="sc-head" data-slot="page-head">
    <a class="sc-head__logo" href="index.html" aria-label="Back to start" data-sc-mark></a>
    <div class="sc-head__crumb"><h1>NEWS</h1><span>ALL</span></div>
    <h2 class="sc-head__title"><span><span>NEWS &amp;</span></span><span><span>INFORMATION</span></span></h2>
  </header>
  <section class="nw-index" data-slot="news-list">
    <div class="nw-filter" data-slot="filter">
      <label class="sc-pulldown"><span class="sc-pulldown__label">Tag</span><span class="sc-pulldown__box"><span class="sc-pulldown__text">ALL</span><select><option>ALL</option><option>TOPICS</option></select></span></label>
      <label class="sc-pulldown"><span class="sc-pulldown__label">Storage</span><span class="sc-pulldown__box"><span class="sc-pulldown__text">ALL</span><select><option>ALL</option><option>2025</option></select></span></label>
    </div>
    <div class="nw-list">
      <a class="sc-news-item is-light" href="article.html"><div class="sc-news-item__thumb wf-img" data-label="New tile series set · gray backdrop · square"></div><div class="sc-news-item__date sc-lat">2025.00.00</div><span class="sc-term">TOPICS</span><div class="sc-news-item__title">Put your news title here in one line</div></a>
      <a class="sc-news-item is-light" href="article.html"><div class="sc-news-item__thumb wf-img" data-label="Brand mark · cream background · square"></div><div class="sc-news-item__date sc-lat">2025.00.00</div><span class="sc-term">TOPICS</span><div class="sc-news-item__title">A slightly longer news title here in one line, truncated with an ellipsis if it overflows.</div></a>
    </div>
  </section>
  <nav class="sc-crumb" data-slot="crumb"><a href="index.html" data-fx="char-roll" data-fx-char-roll="mode: once; dur: .75; ease: 0.19,1,0.22,1; gap: 2"><span data-fx-part="text">TOP</span></a><span>NEWS</span><span>ALL</span></nav>
</main>
</div>
</div>
<script src="../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../../_shared/vendor/gsap/ScrollSmoother.min.js"></script>
<script src="../../_shared/vendor/gsap/ScrollToPlugin.min.js"></script>
<script src="../_fx/fx-core.js"></script>
<script src="../_fx/tile-veil/fx.js"></script>
<script src="../_fx/pin-cross-frames/fx.js"></script>
<script src="../_fx/char-roll/fx.js"></script>
<script src="shared.js"></script>
<script src="news.js"></script>
<script src="../../_shared/wire.js"></script>
</body>
</html>
