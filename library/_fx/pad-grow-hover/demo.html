<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pad-grow-hover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); overflow-x: hidden; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-spacer { height: 90vh; display: grid; place-items: center; color: var(--kf-dim); }
  .row { display: flex; gap: 24px; padding: 80px 40px; }
  .btn { padding: 22px 60px 22px 40px; border-radius: var(--kf-radius-pill); background: var(--kf-accent); color: var(--kf-on-accent); font: 500 16px/1 var(--kf-font-sans); }
  .btn i { display: block; width: 10px; height: 10px; background: currentColor; clip-path: polygon(50% 0, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0 50%, 38% 38%); }
</style>
</head>
<body>
<p class="demo-hint"><b>pad-grow-hover</b> — Hover over the button. The button stretches to the right and a star spins.</p>
<section class="row"><a class="btn" href="#" data-fx="pad-grow-hover">View details<i data-fx-part="icon"></i></a><a class="btn" href="#" data-fx="pad-grow-hover" style="--fx-pad-to: 90px">Official event site here<i data-fx-part="icon"></i></a></section>
<script>
(() => {
  const src = document.querySelector('[data-fx~="pad-grow-hover"]');
  const html = src.outerHTML;
  const make = () => { const t = document.createElement("template"); t.innerHTML = html; return t.content.firstElementChild; };
  const gone = make(); src.after(gone);
  setTimeout(() => src.after(make()), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s one more of the same comes in, and after 2.5s one drops out.");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
