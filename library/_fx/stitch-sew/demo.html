<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>stitch-sew — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 40px; padding: 48px 20px 120vh; }
  .card { position: relative; height: 260px; padding: 20px; background: var(--kf-surface); border-radius: var(--kf-radius-md); }
  .card p { font-size: 13px; color: var(--kf-dim); }
  .line-x { position: absolute; left: 20px; right: 20px; bottom: 40px; height: 1px; }
  .line-y { position: absolute; top: 20px; bottom: 20px; right: 30px; width: 1px; }
  .curve { position: absolute; left: 20px; bottom: 20px; width: 170px; height: 151px; }
</style>
</head>
<body>
<p class="demo-hint"><b>stitch-sew</b> — Open the page and stitched dotted lines are sewn in one stitch at a time. Each card has its own rhythm. <span style="color:var(--kf-dim)">(One more card comes in after 1s, and one drops out after 2.5s)</span></p>
<section class="demo" id="demo">
  <div class="card"><p>normal · horizontal</p><span class="line-x" data-fx="stitch-sew"></span></div>
  <div class="card"><p>slow · vertical · pause</p><span class="line-y" data-fx="stitch-sew" data-fx-stitch-sew="preset: slow"></span></div>
  <div class="card"><p>notStop · Bold</p><span class="line-x" data-fx="stitch-sew" data-fx-stitch-sew="preset: notStop" style="--fx-weight: 2px; --fx-stitch: 6; --fx-gap: 4"></span></div>
  <div class="card" data-demo-remove><p>Line to be removed soon</p><span class="line-x" data-fx="stitch-sew"></span></div>
  <div class="card"><p>long · Curve</p><span class="curve" data-fx="stitch-sew" data-fx-stitch-sew="preset: long; on: load; delay: 400"><svg viewBox="0 0 340 302" preserveAspectRatio="xMidYMid meet"><path data-fx-part="path" d="M2 300C40 250 90 150 180 90S300 10 338 2"/></svg></span></div>
</section>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.getElementById("demo").insertAdjacentHTML("beforeend", '<div class="card"><p>Late row</p><span class="line-y" data-fx="stitch-sew" data-fx-stitch-sew="on: load"></span></div>'), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
