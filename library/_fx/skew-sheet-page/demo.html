<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>skew-sheet-page — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 10; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { display: flex; gap: 24px; padding: 48px 20px; }
  .demo a, .demo button { padding: 12px 20px; border: 1px solid var(--kf-line); background: none; color: inherit; font: inherit; cursor: pointer; text-decoration: none; }
</style>
</head>
<body>
<p class="demo-hint"><b>skew-sheet-page</b> — Press ‹Back to this page› and the curtain covers, moves on, then lifts. ‹Cover then lift› is the event type. <span style="color:var(--kf-dim)">(After 1s one more layer comes in, and one leaves 2.5s later)</span></p>
<section class="demo">
  <a href="demo.html">Back to this page</a>
  <button type="button" id="ev">Cover and uncover (event)</button>
</section>
<div class="sheet" data-fx="skew-sheet-page" aria-hidden="true"></div>
<div class="sheet2" data-demo-remove data-fx="skew-sheet-page" data-fx-skew-sheet-page="mode: event" aria-hidden="true"></div>
<template data-demo-late><div class="sheet3" data-fx="skew-sheet-page" data-fx-skew-sheet-page="mode: event; dur: .6" aria-hidden="true"></div></template>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
document.getElementById("ev").addEventListener("click", () => {
  const s = document.querySelector(".sheet3") || document.querySelector(".sheet");
  s.dispatchEvent(new CustomEvent("fx:cover", { detail: { done: () => s.dispatchEvent(new CustomEvent("fx:reveal")) } }));
});
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
