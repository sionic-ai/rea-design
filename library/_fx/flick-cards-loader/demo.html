<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>flick-cards-loader — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { margin: 0; background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .stage { position: relative; height: 90vh; overflow: clip; }
  .arches { display: flex; justify-content: center; padding-top: 6vw; background: var(--kf-bg); }
  .arches i { width: 30vw; aspect-ratio: 1080/653; border-radius: 9999px 9999px 0 0; background: var(--kf-accent); }
  .cap { padding: 2vw 3vw; }
  .card-txt { display: block; width: 100%; font: 800 7vw/1 var(--kf-font-display); text-align: center; }
</style>
</head>
<body>
<p class="demo-hint"><b>flick-cards-loader</b> — Each time it opens fresh (once per session — here once: none, so every time), the cover letters change every .1s, the arch panel comes down at 4s and lights up .7s later.</p>
<div data-fx="flick-cards-loader" data-fx-flick-cards-loader="once: none; drop: .arches; dark: .arches i; show: .cap">
  <span class="card-txt" data-fx-part="card">LOGO</span>
  <span class="card-txt" data-fx-part="card" style="font-family: var(--kf-font-sans)">Your name here</span>
  <span class="card-txt" data-fx-part="card" style="font-weight: 400">LOGO</span>
  <span class="card-txt" data-fx-part="card" style="font-family: var(--kf-font-mono)">LOGO</span>
  <span class="card-txt" data-fx-part="card" style="letter-spacing: .2em">LOGO</span>
  <span class="card-txt" data-fx-part="card" style="font-weight: 500">LOGO</span>
  <span class="card-txt" data-fx-part="card" style="font-family: var(--kf-font-sans); font-weight: 500">Your name here</span>
  <span class="card-txt" data-fx-part="card" style="letter-spacing: -.02em">LOGO</span>
  <span class="card-txt" data-fx-part="card">●◗</span>
</div>
<section class="stage">
  <div class="arches"><i></i><i></i><i></i></div>
  <p class="cap">Your hero news line here.</p>
</section>
<section class="stage"><div class="demo-late"></div></section>
<script>
// Late arrivals and removals — checks that fx-core attaches to an element added after 1s and detaches from an element removed after 2.5s
(() => {
  const src = document.querySelector('[data-fx~="flick-cards-loader"]');
  const make = () => { const el = src.cloneNode(true); el.dataset.fxFlickCardsLoader = "once: none; at: 1"; el.style.inset = "50% 0 0 0"; return el; };
  const gone = make();
  document.body.append(gone);
  setTimeout(() => document.querySelector(".demo-late").append(make()), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical one comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/CustomEase.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
