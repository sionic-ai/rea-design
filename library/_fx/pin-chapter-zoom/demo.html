<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pin-chapter-zoom — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { margin: 0; background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo-spacer { height: 70vh; display: grid; place-items: center; color: var(--kf-dim); }
  .stage { height: 100vh; background: var(--kf-contrast-bg); color: var(--kf-contrast-ink); }
  .stage [data-fx-part="intro"], .stage [data-fx-part="title"] { display: grid; place-items: center; font-size: clamp(32px, 6vw, 72px); }
  .stage [data-fx-part="film"] { margin: auto; width: min(80%, 120vh); height: auto; aspect-ratio: 16 / 9; }
  .stage [data-fx-part="film"] .wf-img { height: 100%; }
  .stage [data-fx-part="layer"] { display: flex; align-items: flex-end; justify-content: flex-end; padding: 4vw; }
  .stage [data-fx-part="layer"] .wf-img { width: 18vw; aspect-ratio: 3 / 5; height: auto; }
</style>
</head>
<body>
<p class="demo-hint"><b>pin-chapter-zoom</b> — Scroll down a long way: on a fixed black stage the chapter video grows from a dot, swells to three times, then moves on to the next chapter.</p>
<div class="demo-spacer">Scroll down ↓</div>
<section class="stage" data-fx="pin-chapter-zoom" data-fx-pin-chapter-zoom="end: 6000">
  <div data-fx-part="intro"><span>Chapter</span></div>
  <div data-fx-part="chapter"><div data-fx-part="film"><span class="wf-img wf-video" data-label="Chapter 1 video 16:9"></span></div><div data-fx-part="layer"><span class="wf-img" data-label="Cutout"></span></div><div data-fx-part="title"><span>01 Your title here</span></div></div>
  <div data-fx-part="chapter"><div data-fx-part="film"><span class="wf-img wf-video" data-label="Chapter 2 video 16:9"></span></div><div data-fx-part="title"><span>02 Your title here</span></div></div>
  <div data-fx-part="chapter"><div data-fx-part="film"><span class="wf-img wf-video" data-label="Chapter 3 video 16:9"></span></div><div data-fx-part="layer"><span class="wf-img" data-label="Cutout"></span></div><div data-fx-part="title"><span>03 Your title here</span></div></div>
</section>
<div class="demo-spacer">Next section</div>
<script>
// Late arrivals and removals — after 1 second one more identical stage comes in, and after 2.5 seconds one drops out
(() => {
  const src = document.querySelector('[data-fx~="pin-chapter-zoom"]');
  if (!src) return;
  const html = src.outerHTML;
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; el.classList.remove("is-fx-on"); return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => src.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s one more identical stage comes in, and after 2.5s one drops out.");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
