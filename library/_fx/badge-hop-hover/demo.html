<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>badge-hop-hover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { display: flex; flex-wrap: wrap; gap: 72px 96px; align-items: flex-start; padding: 96px 64px; font: 500 36px/1.3 var(--kf-font-display); }
  .demo a { color: inherit; text-decoration: none; }
  .demo .v { writing-mode: vertical-rl; }
  .demo .row { display: flex; align-items: flex-start; gap: 10px; }
  .demo .col { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
  .demo [data-fx-part="icon"] { width: 44px; height: 40px; }
  .demo [data-fx-part="icon"] svg { display: block; width: 100%; height: 100%; }
  .demo [data-fx-part="icon"] .fill { fill: var(--kf-accent); }
  .demo [data-fx-part="icon"] .ink { fill: none; stroke: var(--kf-ink); stroke-width: 2.8; stroke-linejoin: round; }
</style>
</head>
<body>
<p class="demo-hint"><b>badge-hop-hover</b> — Hover over the sentence. The text grows to 1.05x and the speech-bubble icons bounce outward (top · left · corner).</p>
<section class="demo" id="demo">
  <p class="col" data-fx="badge-hop-hover" id="up"><span data-fx-part="icon"><svg viewBox="0 0 55 50" aria-hidden="true"><path class="fill" d="M1.4 1.4h51.7v35.2H25.6L15 47.6c-.3.4-.8.2-.8-.3V36.6H1.4z"/><path class="ink" d="M1.4 1.4h51.7v35.2H25.6L15 47.6c-.3.4-.8.2-.8-.3V36.6H1.4zM27.2 10.4v17.9M18.3 19.3h17.9"/></svg></span><a class="v" href="#">Vertical Sentence</a></p>
  <p class="row" data-fx="badge-hop-hover" data-fx-badge-hop-hover="look: left"><span data-fx-part="icon"><svg viewBox="0 0 55 50" aria-hidden="true"><path class="fill" d="M1.4 1.4h51.7v35.2H25.6L15 47.6c-.3.4-.8.2-.8-.3V36.6H1.4z"/><path class="ink" d="M1.4 1.4h51.7v35.2H25.6L15 47.6c-.3.4-.8.2-.8-.3V36.6H1.4zM27.2 10.4v17.9M18.3 19.3h17.9"/></svg></span><a href="#">Horizontal text</a></p>
  <p class="row" data-fx="badge-hop-hover" data-fx-badge-hop-hover="look: corner"><span data-fx-part="icon"><svg viewBox="0 0 55 50" aria-hidden="true"><path class="fill" d="M1.4 1.4h51.7v35.2H25.6L15 47.6c-.3.4-.8.2-.8-.3V36.6H1.4z"/><path class="ink" d="M1.4 1.4h51.7v35.2H25.6L15 47.6c-.3.4-.8.2-.8-.3V36.6H1.4zM27.2 10.4v17.9M18.3 19.3h17.9"/></svg></span><a href="#">Bent<br><span class="v">Sentence</span></a></p>
  <p data-fx="badge-hop-hover"><a href="#">Sentence without icon</a></p>
</section>
<script>
// Things that enter late or get erased — CSS parts, so they apply as soon as they enter and simply vanish when removed
(() => {
  const src = document.getElementById("up");
  const make = (tag) => { const el = src.cloneNode(true); el.removeAttribute("id"); el.dataset.demo = tag; return el; };
  const gone = make("gone");
  document.getElementById("demo").append(gone);
  setTimeout(() => document.getElementById("demo").append(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s one more sentence comes in, and after 2.5s one drops out.");
})();
</script>
<script src="../fx-core.js"></script>
</body>
</html>
