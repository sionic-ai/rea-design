<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tile-blur-focus — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .board { display: grid; grid-template-columns: repeat(4, 1fr); margin: 30px 20px; }
  .tile { aspect-ratio: 1; border: 1px solid var(--kf-line); position: relative; overflow: hidden; }
  .tile > div { position: absolute; inset: 0; display: grid; place-items: center; }
  .tile i { width: 40%; aspect-ratio: 1; border-radius: 50%; background: color-mix(in oklab, var(--kf-accent) 40%, var(--kf-bg)); animation: bob 1.6s ease-in-out infinite alternate; }
  .tile b { font: 700 48px/1 var(--kf-font-sans); }
  @keyframes bob { to { transform: translateY(-14px); } }
</style>
</head>
<body>
<p class="demo-hint"><b>tile-blur-focus</b> — Hover over a cell. Hover over the text cell (A) and everything becomes clear again. <span style="color:var(--kf-dim)">(After 1s one more panel comes in, and one leaves 2.5s later)</span></p>
<div class="board" data-fx="tile-blur-focus" data-demo-remove>
  <div class="tile" data-fx-part="tile"><div data-fx-part="blur"><i></i></div></div><div class="tile" data-fx-part="tile"><div data-fx-part="blur"><i></i></div></div>
</div>
<div class="board" data-fx="tile-blur-focus">
  <div class="tile" data-fx-part="tile" data-clear><div data-fx-part="blur"><b>Go</b></div></div><div class="tile" data-fx-part="tile"><div data-fx-part="blur"><i></i></div></div><div class="tile" data-fx-part="tile"><div data-fx-part="blur"><i></i></div></div><div class="tile" data-fx-part="tile"><div data-fx-part="blur"><i></i></div></div>
  <div class="tile" data-fx-part="tile"><div data-fx-part="blur"><i></i></div></div><div class="tile" data-fx-part="tile"><div data-fx-part="blur"><i></i></div></div><div class="tile" data-fx-part="tile"></div><div class="tile" data-fx-part="tile"><div data-fx-part="blur"><i></i></div></div>
</div>
<template data-demo-late><div class="board" data-fx="tile-blur-focus" data-fx-tile-blur-focus="blur: 3; release: all"><div class="tile" data-fx-part="tile"><div data-fx-part="blur"><i></i></div></div><div class="tile" data-fx-part="tile"><div data-fx-part="blur"><i></i></div></div><div class="tile" data-fx-part="tile"><div data-fx-part="blur"><i></i></div></div></div></template>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
