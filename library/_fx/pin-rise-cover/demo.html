<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pin-rise-cover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 500 15px/1.6 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: sticky; top: 0; z-index: 10; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .gap { height: 80vh; display: grid; place-items: center; color: var(--kf-dim); }
  .split { display: flex; }
  .split > [data-fx-part="side"] { width: 50%; height: 100vh; display: grid; place-items: center; font: 400 42px/1 var(--kf-font-display); }
  .split > [data-fx-part="frame"] { width: 50%; }
  [data-fx-part="media"] { border: 0; }
</style>
</head>
<body>
<p class="demo-hint"><b>pin-rise-cover</b> — Scroll down. The photo frame stays still while the next photo covers it from below. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<div class="gap">Downward</div>
<section class="split" data-fx="pin-rise-cover" data-fx-pin-rise-cover="enter: true">
  <div data-fx-part="side">Your title here</div>
  <div data-fx-part="frame">
    <div class="wf-img" data-fx-part="media" data-label="Photo 1"></div>
    <div class="wf-img" data-fx-part="media" data-label="Photo 2"></div>
    <div class="wf-img" data-fx-part="media" data-label="Photo 3"></div>
  </div>
</section>
<div class="gap">Center</div>
<section data-fx="pin-rise-cover" data-fx-pin-rise-cover="dur: 0.1" data-demo-remove>
  <div data-fx-part="frame">
    <div class="wf-img" data-fx-part="media" data-label="Removed Cell 1"></div>
    <div class="wf-img" data-fx-part="media" data-label="Removed Cell 2"></div>
  </div>
</section>
<template data-demo-late><section data-fx="pin-rise-cover" data-fx-pin-rise-cover="dur: 0.1"><div data-fx-part="frame"><div class="wf-img" data-fx-part="media" data-label="Late-arriving cell 1"></div><div class="wf-img" data-fx-part="media" data-label="Late-arriving cell 2"></div></div></section></template>
<div class="gap">Footer</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script>gsap.registerPlugin(ScrollTrigger);</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
