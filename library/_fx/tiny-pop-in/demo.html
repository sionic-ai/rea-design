<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tiny-pop-in — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .spacer { height: 80vh; display: grid; place-items: center; color: var(--kf-dim); }
  .row { display: flex; gap: 40px; justify-content: center; padding: 40px 20px 80vh; }
  .ill { width: 120px; height: 120px; border-radius: 50%; background: var(--kf-accent); }
</style>
</head>
<body>
<p class="demo-hint"><b>tiny-pop-in</b> — Scroll down — the circle pops out as it enters the screen. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<div class="spacer">↓</div>
<div class="row" id="row">
  <div class="ill" data-fx="tiny-pop-in"></div>
  <div class="ill" data-fx="tiny-pop-in" style="--fx-delay: .2s"></div>
  <div class="ill" data-fx="tiny-pop-in" style="--fx-delay: .4s" data-demo-remove></div>
</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => { const d = document.createElement("div"); d.className = "ill"; d.dataset.fx = "tiny-pop-in"; document.getElementById("row").append(d); }, 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
