<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>corner-wipe-slides — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { padding: 48px 20px; }
  .demo-spacer { height: 90vh; display: grid; place-items: center; color: var(--kf-dim); }
  .wipe { height: 320px; border-radius: 24px; margin-bottom: 30px; }
  .sl { display: grid; place-items: center; font: 700 64px/1 var(--kf-font-display); color: var(--kf-surface); }
  .s0 { background: var(--kf-ink); } .s1 { background: var(--kf-accent); } .s2 { background: var(--kf-dim); }
</style>
</head>
<body>
<p class="demo-hint"><b>corner-wipe-slides</b> — Left alone, the photo is covered from the bottom-left corner and swapped every 4 seconds (every 2 seconds for the second panel). <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<section class="demo"><div class="wipe" data-demo-remove data-fx="corner-wipe-slides"><div data-fx-part="slide" class="sl s0">1</div><div data-fx-part="slide" class="sl s1">2</div><div data-fx-part="slide" class="sl s2">3</div></div><div class="wipe" data-fx="corner-wipe-slides" data-fx-corner-wipe-slides="every: 2"><div data-fx-part="slide" class="sl s0">1</div><div data-fx-part="slide" class="sl s1">2</div><div data-fx-part="slide" class="sl s2">3</div></div><template data-demo-late><div class="wipe" data-fx="corner-wipe-slides"><div data-fx-part="slide" class="sl s0">1</div><div data-fx-part="slide" class="sl s1">2</div></div></template><div class="wipe" data-fx="corner-wipe-slides"></div></section>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); window.ScrollTrigger?.refresh(); }, 2500);
</script>
</body>
</html>
