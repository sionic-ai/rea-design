<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>diagonal-open-intro — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: relative; z-index: 2; margin: 0; padding: 12px 20px; border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .frame { position: fixed; inset: 60px 24px 24px; border: 2px solid var(--kf-accent); border-radius: 10px; background: var(--kf-surface); display: grid; place-items: center; }
  .frame [data-fx-part="after"] { position: absolute; left: 16px; bottom: 16px; }
  .again { position: fixed; right: 16px; top: 8px; z-index: 3; }
</style>
</head>
<body>
<p class="demo-hint"><b>diagonal-open-intro</b> — Try refreshing. A small panel opens diagonally and grows, and after 2.3s the text at lower left comes down.</p>
<button class="wf-btn again" type="button">Re-insert panel</button>
<div class="frame" data-fx="diagonal-open-intro">Your Hero here<span data-fx-part="after">Scroll</span></div>
<script>
// Things that arrive late or get removed — add the same panel again after 1 second and remove it after 2.5 seconds to check detaching
(() => {
  const src = document.querySelector(".frame").cloneNode(true);
  const add = () => { const el = src.cloneNode(true); el.style.inset = "120px 80px 80px"; document.body.append(el); setTimeout(() => el.remove(), 2500); };
  document.querySelector(".again").addEventListener("click", add);
  setTimeout(add, 1000);
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
