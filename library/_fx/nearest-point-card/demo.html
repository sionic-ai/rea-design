<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>nearest-point-card — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-map { position: relative; width: min(100% - 40px, 960px); aspect-ratio: 16 / 10; margin: 32px auto; background: var(--kf-surface); }
  .demo-map svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .demo-map path { fill: none; vector-effect: non-scaling-stroke; }
  .demo-map ellipse { fill: var(--kf-accent); opacity: .08; }
  .demo-map ellipse.is-active { opacity: .2; }
  .demo-map button { position: absolute; display: flex; gap: 8px; align-items: center; padding: 6px; border: 0; background: none; transform: translate(-11px, -50%); }
  .demo-map article { position: absolute; width: 180px; padding: 12px; background: var(--kf-bg); border: 1px solid var(--kf-line); }
</style>
</head>
<body>
<p class="demo-hint"><b>nearest-point-card</b> — Move the mouse over the board. The nearest dot lights up and a card appears.</p>
<div class="demo-map" data-fx="nearest-point-card" id="src">
  <svg viewBox="0 0 1600 1000" preserveAspectRatio="none"><ellipse data-fx-part="group" data-key="g1" cx="500" cy="380" rx="420" ry="200"/><ellipse data-fx-part="group" data-key="g2" cx="1150" cy="620" rx="380" ry="220"/><path data-fx-part="line" data-a="a" data-b="b" d="M400,350 Q520,250 640,430"/><path data-fx-part="line" data-a="b" data-b="c" d="M640,430 Q900,600 1100,600"/><path data-fx-part="line" data-a="c" data-b="d" d="M1100,600 Q1250,500 1300,700"/></svg>
  <button data-fx-part="point" data-key="a" data-group="g1" style="left:25%;top:35%"><span data-fx-part="dot"></span>Place 1</button>
  <button data-fx-part="point" data-key="b" data-group="g1" style="left:40%;top:43%"><span data-fx-part="dot"></span>Place 2</button>
  <button data-fx-part="point" data-key="c" data-group="g2" style="left:68.75%;top:60%"><span data-fx-part="dot"></span>Place 3</button>
  <button data-fx-part="point" data-key="d" data-group="g2" style="left:81.25%;top:70%"><span data-fx-part="dot"></span>Place 4</button>
  <article data-fx-part="card" data-key="a" style="left:28%;top:8%">Place 1 card</article>
  <article data-fx-part="card" data-key="b" style="left:43%;top:15%">Place 2 card</article>
  <article data-fx-part="card" data-key="c" style="left:48%;top:32%">Place 3 card</article>
  <article data-fx-part="card" data-key="d" style="left:60%;top:42%">Place 4 card</article>
</div>
<script>
(() => {
  const src = document.getElementById("src");
  const html = src.outerHTML.replace(/\sid="[^"]*"/g, "");
  const make = () => { const t = document.createElement("template"); t.innerHTML = html; return t.content.firstElementChild; };
  const gone = make();
  src.after(gone);
  setTimeout(() => src.after(make()), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s, one more panel comes in (the late one), and after 2.5s one drops out (the removal).");
})();
</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
