<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>flip-grid-toggle — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { padding: 32px 20px; }
  .works { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-top: 16px; }
  .works.is-grid { grid-template-columns: repeat(3, 1fr); }
  .works .wf-img { aspect-ratio: 3 / 2; border-radius: var(--kf-radius-md); }
</style>
</head>
<body>
<p class="demo-hint"><b>flip-grid-toggle</b> — Try pressing ‹Grid view›. <span style="color:var(--kf-dim)">(After 1s one more panel comes in, and one leaves 2.5s later)</span></p>
<section class="demo" data-fx="flip-grid-toggle">
  <button class="wf-btn" type="button" data-fx-part="toggle">Grid view</button>
  <div class="works" data-fx-part="list"><div class="wf-img" data-label="Work 1"></div><div class="wf-img" data-label="Work 2"></div><div class="wf-img" data-label="Work 3"></div><div class="wf-img" data-label="Work 4"></div><div class="wf-img" data-label="Work 5"></div><div class="wf-img" data-label="Work 6"></div></div>
</section>
<section class="demo" data-demo-remove data-fx="flip-grid-toggle"><button class="wf-btn" type="button" data-fx-part="toggle">Dropped Panel</button><div class="works" data-fx-part="list"><div class="wf-img" data-label="Work"></div></div></section>
<section class="demo" data-fx="flip-grid-toggle"><p>Version without list</p></section>
<template data-demo-late><section class="demo" data-fx="flip-grid-toggle"><button class="wf-btn" type="button" data-fx-part="toggle">Late panel</button><div class="works" data-fx-part="list"><div class="wf-img" data-label="Work 1"></div><div class="wf-img" data-label="Work 2"></div><div class="wf-img" data-label="Work 3"></div></div></section></template>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/Flip.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
