<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>strip-deck-cycle — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { padding: 48px 20px; display: grid; gap: 40px; }
  .deck { height: 38vw; max-height: 460px; }
  .deck.is-small { height: 220px; max-width: 520px; }
  .face { display: grid; place-items: end start; padding: 16px; color: var(--kf-surface); font: 700 28px/1 var(--kf-font-display); }
  .s0 { background: var(--kf-ink); } .s1 { background: var(--kf-accent); } .s2 { background: var(--kf-dim); } .s3 { background: var(--kf-ink-soft); }
  .meta { position: absolute; left: 16px; top: 16px; padding: 2px 10px; border-radius: 99px; background: var(--kf-surface); font-size: 12px; }
</style>
</head>
<body>
<p class="demo-hint"><b>strip-deck-cycle</b> — Leave it alone and the first photo folds after 3s, then every 5s the cards shift one slot to the left. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<section class="demo">
  <div class="deck" data-fx="strip-deck-cycle">
    <article data-fx-part="card"><a class="face s0" data-fx-part="face" href="#">01</a><span class="meta" data-fx-part="meta">Tag</span></article>
    <article data-fx-part="card"><a class="face s1" data-fx-part="face" href="#">02</a><span class="meta" data-fx-part="meta">Tag</span></article>
    <article data-fx-part="card"><a class="face s2" data-fx-part="face" href="#">03</a></article>
    <article data-fx-part="card"><a class="face s3" data-fx-part="face" href="#">04</a></article>
    <article data-fx-part="card"><a class="face s1" data-fx-part="face" href="#">05</a></article>
  </div>
  <div class="deck is-small" data-demo-remove data-fx="strip-deck-cycle" data-fx-strip-deck-cycle="every: 2.5; close: 1.2; open: 1.8; hold: 1"><article data-fx-part="card"><a class="face s2" data-fx-part="face" href="#">A</a></article><article data-fx-part="card"><a class="face s0" data-fx-part="face" href="#">B</a></article><article data-fx-part="card"><a class="face s1" data-fx-part="face" href="#">C</a></article></div>
  <template data-demo-late><div class="deck is-small" data-fx="strip-deck-cycle" data-fx-strip-deck-cycle="every: 3; dur: 0.5; close-dur: 0.8"><article data-fx-part="card"><a class="face s3" data-fx-part="face" href="#">X</a></article><article data-fx-part="card"><a class="face s1" data-fx-part="face" href="#">Y</a></article></div></template>
  <div class="deck is-small" data-fx="strip-deck-cycle"></div>
</section>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); }, 2500);
</script>
</body>
</html>
