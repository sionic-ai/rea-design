<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>scramble-alt-swap — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/2 var(--kf-font-sans); margin: 0; }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-body { padding: 40px 20px; display: grid; gap: 40px; }
</style>
</head>
<body>
<p class="demo-hint"><b>scramble-alt-swap</b> — Hover over a line of text. All lines in the group shuffle and turn into English, and return to Korean when you leave. (One more group comes in after 1s and one leaves after 2.5s)</p>
<div class="demo-body" data-demo-late-host>
  <p data-fx="scramble-alt-swap"><span data-fx-part="line" data-alt="With just three tiny bumps,">With just three small bumps</span><br><span data-fx-part="line" data-alt="even the last bite is easy.">Even the last bite is easy to pick up.</span></p>
  <p data-fx="scramble-alt-swap" data-demo-remove><span data-fx-part="line" data-alt="Gone soon">Row to be removed soon</span></p>
  <p data-fx="scramble-alt-swap"></p>
</div>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => {
  const p = document.createElement("p");
  p.dataset.fx = "scramble-alt-swap";
  p.innerHTML = '<span data-fx-part="line" data-alt="Arrived late">Late-arriving line</span>';
  document.querySelector("[data-demo-late-host]").append(p);
}, 1000);
setTimeout(() => document.querySelector("[data-demo-remove]")?.remove(), 2500);
</script>
</body>
</html>
