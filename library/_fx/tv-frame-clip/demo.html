<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tv-frame-clip — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { padding: 40px 20px 60vh; display: grid; gap: 60px; }
  .stage { height: 70vh; background: linear-gradient(135deg, var(--kf-contrast-bg), var(--kf-accent)); }
  .track { height: 220vh; }
  .track .stage { position: sticky; top: 10vh; }
  button { justify-self: start; padding: 10px 18px; border: 1px solid var(--kf-line); border-radius: var(--kf-radius-pill); background: var(--kf-surface); color: var(--kf-ink); cursor: pointer; }
</style>
</head>
<body>
<p class="demo-hint"><b>tv-frame-clip</b> — Press ”Open” and a TV-screen-shaped window in the center opens to full screen. Scroll down and the second panel shrinks into a TV shape along with the scroll. <span style="color:var(--kf-dim)">(After 1s one more panel comes in, and one leaves 2.5s later)</span></p>
<main class="demo">
  <button type="button" onclick="document.querySelector('#manual').dispatchEvent(new CustomEvent('fx:play'))">Open</button>
  <div id="manual" class="stage" data-fx="tv-frame-clip" data-fx-tv-frame-clip="on: manual"></div>
  <div class="track" data-fx-part="track"><div class="stage" data-fx="tv-frame-clip" data-fx-tv-frame-clip="from: 1; to: 0; start: top bottom; end: bottom bottom"></div></div>
  <div class="stage" data-fx="tv-frame-clip" data-fx-tv-frame-clip="on: load" data-demo-remove></div>
</main>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => { const d = document.createElement("div"); d.className = "stage"; d.dataset.fx = "tv-frame-clip"; d.dataset.fxTvFrameClip = "on: load"; document.querySelector(".demo")?.append(d); }, 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); }, 2500);
</script>
</body>
</html>
