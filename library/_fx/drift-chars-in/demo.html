<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>drift-chars-in — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.6 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .col { position: relative; width: min(560px, 90vw); margin: 0 auto; padding: 40px 0 60vh; }
  .big { font: 300 64px/1 var(--kf-font-display); letter-spacing: .02em; color: transparent; -webkit-text-stroke: 1px var(--kf-ink); }
  .vt { writing-mode: vertical-rl; margin: 60vh 0 0 auto; }
</style>
</head>
<body>
<p class="demo-hint"><b>drift-chars-in</b> — The top title enters as soon as it opens, the vertical title below slides in letter by letter from the right once it scrolls into view. <span style="color:var(--kf-dim)">(One more title comes in after 1s, and one drops out after 2.5s)</span></p>
<div class="col">
  <h1 class="big" data-fx="drift-chars-in" data-fx-drift-chars-in="on: load; delay: .2">ABOUT</h1>
  <p data-fx="drift-chars-in" data-demo-remove>Dropping text</p>
  <h2 class="big vt" data-fx="drift-chars-in" data-fx-drift-chars-in="delay: .2">NEWS</h2>
  <div data-late-slot></div>
</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script>gsap.registerPlugin(ScrollTrigger);</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelector("[data-late-slot]").outerHTML = '<h2 class="big" data-fx="drift-chars-in" data-fx-drift-chars-in="on: load">LATE</h2>', 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
