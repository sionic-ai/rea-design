<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>burger-pass-hover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo-spacer { height: 90vh; display: grid; place-items: center; color: var(--kf-dim); }
  main { display: flex; flex-wrap: wrap; align-items: center; gap: 48px; padding: 60px 40px; }
  .bp { display: inline-flex; flex-direction: column; justify-content: center; gap: 10px; width: 52px; height: 24px; padding: 0; border: 0; background: none; color: var(--kf-ink); cursor: pointer; }
  .bp.is-wide { width: 80px; gap: 8px; height: 30px; }
  .bp-stage { padding: 24px 32px; background: var(--kf-contrast-bg); color: var(--kf-contrast-ink); }
  .bp-stage .bp { color: inherit; }
</style>
</head>
<body>
<p class="demo-hint"><b>burger-pass-hover</b> — Hover over the menu button and the line slides out to the right while the same line enters from the left, staggered. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<main>
  <button class="bp" type="button" aria-label="Menu" data-demo-remove data-fx="burger-pass-hover"><span data-fx-part="row"><i></i><i></i></span><span data-fx-part="row"><i></i><i></i></span></button>
  <button class="bp" type="button" aria-label="Menu" data-fx="burger-pass-hover"><span data-fx-part="row"><i></i><i></i></span><span data-fx-part="row"><i></i><i></i></span></button>
  <button class="bp is-wide" type="button" aria-label="Three menu rows" data-fx="burger-pass-hover" style="--fx-dur: .6s; --fx-out: .3s"><span data-fx-part="row"><i></i><i></i></span><span data-fx-part="row"><i></i><i></i></span><span data-fx-part="row"><i></i><i></i></span></button>
  <div class="bp-stage"><button class="bp" type="button" aria-label="Menu" data-fx="burger-pass-hover"><span data-fx-part="row"><i></i><i></i></span><span data-fx-part="row"><i></i><i></i></span></button></div>
  <button class="bp" type="button" aria-label="Empty Menu" data-fx="burger-pass-hover"></button>
  <template data-demo-late><button class="bp" type="button" aria-label="Menu" data-fx="burger-pass-hover"><span data-fx-part="row"><i></i><i></i></span><span data-fx-part="row"><i></i><i></i></span></button></template>
</main>
<div class="demo-spacer"></div>

<script src="../fx-core.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); window.ScrollTrigger?.refresh(); }, 2500);
</script>
</body>
</html>
