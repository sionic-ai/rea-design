<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hold-xray-lens — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { padding: 64px 20px; }
  .demo-title { margin: 0 0 40px; font: 600 72px/1 var(--kf-font-display); letter-spacing: -.03em; }
  .demo-p { max-width: 30ch; font-size: 20px; } .demo-box { margin-top: 32px; aspect-ratio: 16/9; max-width: 520px; display: grid; place-items: center; background: var(--kf-surface); border-radius: var(--kf-radius-md); color: var(--kf-dim); font: 12px var(--kf-font-mono); }
</style>
</head>
<body>
<p class="demo-hint"><b>hold-xray-lens</b> — Hold the mouse button down on the text (0.17s). A flipped blueprint circle opens at the cursor, and boxes and notes attach to the title and text inside.</p>
<main class="demo" data-fx="hold-xray-lens"><h1 class="demo-title" data-fx-part="note" data-x="Title" data-note="18 characters per line">Your big title here.</h1><p class="demo-p" data-fx-part="note" data-x="About" data-note="30 characters per line">Your intro sentence goes here in two lines. One person handles both sides.</p><div class="demo-box" data-fx-part="note" data-x="Photo">Photo slot · landscape 16:9</div></main>
<script>
// Late arrivals and removals — checks that fx-core attaches to an element added after 1s and detaches from an element removed after 2.5s
(() => {
  const src = document.querySelector('[data-fx~="hold-xray-lens"]');
  if (!src) return;
  const html = src.outerHTML.replace(/\sid="[^"]*"/g, "");
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => src.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical one comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
