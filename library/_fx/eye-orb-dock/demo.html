<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>eye-orb-dock — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 30; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .hero { position: relative; height: 90vh; padding: 40px 20px; }
  .anchor { position: absolute; left: 50%; bottom: 60px; width: 280px; aspect-ratio: 1; transform: translateX(-50%); border: 1px dashed var(--kf-line); }
  .row { display: flex; gap: 24px; padding: 40px 20px; }
  .row [data-fx] { width: 140px; }
  .spacer { height: 160vh; padding: 20px; }
</style>
</head>
<body>
<p class="demo-hint"><b>eye-orb-dock</b> — Move the cursor and the bead eyes follow it. Scroll down and the big bead moves to settle in the bottom-right corner.</p>
<section class="hero">
  <h1>Your Hero title here</h1>
  <div class="anchor" id="orb-anchor"></div>
</section>
<figure data-fx="eye-orb-dock" data-fx-eye-orb-dock="dock: corner; from: #orb-anchor; over: .hero; size: 84; gutter: 24" aria-hidden="true"></figure>
<div class="row">
  <span data-fx="eye-orb-dock"></span>
  <span data-fx="eye-orb-dock" data-demo-remove></span>
  <template data-demo-late><span data-fx="eye-orb-dock" data-fx-eye-orb-dock="reach: .5; speed: 6"></span></template>
</div>
<div class="spacer">Scroll Space</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
