<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pill-curtain-menu — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.6 var(--kf-font-sans); margin: 0; min-height: 100vh; }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  nav { width: 520px; margin: 40px auto; }
  [data-fx-part="bar"] { display: flex; gap: 48px; align-items: center; height: 45px; padding: 0 30px; border-radius: var(--kf-radius-md); background: color-mix(in oklab, var(--kf-dim) 12%, transparent); }
  [data-fx-part="bar"] button { background: none; border: 0; font: inherit; cursor: pointer; }
  [data-fx-part="panel"] > div { background: color-mix(in oklab, var(--kf-dim) 12%, transparent); padding: 10px 20px 30px; }
  .head { display: flex; justify-content: center; position: relative; height: 45px; align-items: center; border-bottom: 1px solid var(--kf-line); }
  .head button { position: absolute; right: 0; background: none; border: 0; cursor: pointer; font: inherit; }
  .row { display: flex; justify-content: center; align-items: center; height: 29px; width: 300px; margin: 8px auto 0; border-radius: var(--kf-radius-md); background: color-mix(in oklab, var(--kf-dim) 12%, transparent); }
</style>
</head>
<body>
<p class="demo-hint"><b>pill-curtain-menu</b> — Click Menu 1 and Menu 2. A curtain drops down and lifts away with × or Esc. <span style="color:var(--kf-dim)">(After 1s one more menu item comes in, and after 2.5s one drops out)</span></p>
<nav data-fx="pill-curtain-menu">
  <div data-fx-part="bar"><button data-fx-part="open" data-key="a">Menu 1</button><button data-fx-part="open" data-key="b">Menu 2</button><span>Menu 3</span></div>
  <div data-fx-part="panel" data-key="a"><div><div class="head" data-fx-part="item">Menu 1<button data-fx-part="close" aria-label="Close">×</button></div><a class="row" data-fx-part="item" href="#">Sub 1</a><a class="row" data-fx-part="item" href="#">Sub 2</a></div></div>
  <div data-fx-part="panel" data-key="b"><div><div class="head" data-fx-part="item">Menu 2<button data-fx-part="close" aria-label="Close">×</button></div><a class="row" data-fx-part="item" href="#">Sub 3</a></div></div>
</nav>
<nav data-fx="pill-curtain-menu" data-demo-remove><div data-fx-part="bar"><span>Exit menu</span></div><div data-fx-part="panel" data-key="z"><div></div></div></nav>
<div data-late-slot></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelector("[data-late-slot]").outerHTML = '<nav data-fx="pill-curtain-menu" data-fx-pill-curtain-menu="dur: .5"><div data-fx-part="bar"><button data-fx-part="open" data-key="c">Late-arriving menu · curtain .5s</button></div><div data-fx-part="panel" data-key="c"><div><div class="head" data-fx-part="item">Sub board<button data-fx-part="close">×</button></div><a class="row" data-fx-part="item" href="#">Sub 4</a></div></div></nav>', 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
