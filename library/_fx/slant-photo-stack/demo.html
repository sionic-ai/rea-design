<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>slant-photo-stack — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { margin: 0; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .stage { height: 70vh; border-bottom: 1px solid var(--kf-line); }
  .stage--small { height: 40vh; }
</style>
</head>
<body>
<p class="demo-hint"><b>slant-photo-stack</b> — Roll the wheel or drag left and right on the panel. Hover the panel and it pops out of the row, press and it turns to face front.</p>
<section class="stage" data-fx="slant-photo-stack">
  <a data-fx-part="tile" data-title="Project 01 / Photo" data-ratio="1.25" data-label="Indoor hallway · overcast daylight · portrait 4:5">Project 01</a>
  <a data-fx-part="tile" data-title="Project 02 / Video" data-ratio="1" data-label="Cloud mass · black and white · square">Project 02</a>
  <a data-fx-part="tile" data-title="Project 03 / Photo" data-ratio="1.25" data-label="Steel-frame stage · Cool light · Portrait 4:5">Project 03</a>
  <a data-fx-part="tile" data-title="Project 04 / Photo" data-ratio="0.8" data-label="Blank billboard · clear sky · landscape 5:4">Project 04</a>
</section>
<script>
// Late arrivals and removals — after 1 second one more small panel comes in (late arrival), and after 2.5 seconds one pre-placed panel is removed (detach)
(() => {
  const src = document.querySelector('[data-fx~="slant-photo-stack"]');
  const make = () => { const s = src.cloneNode(true); s.classList.add("stage--small"); s.removeAttribute("data-fx"); s.dataset.fx = "slant-photo-stack"; return s; };
  const gone = make();
  src.after(gone);
  setTimeout(() => document.body.append(make()), 1000);
  setTimeout(() => gone.remove(), 2500);
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="three-global.js"></script>
<script src="../../_vendor/three@0.173.0/build/three.cjs"></script>
<script src="../../_vendor/virtual-scroll@2.2.1/virtualscroll.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
