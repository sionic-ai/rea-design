<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>speed-swell-edge — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo-spacer { height: 90vh; display: grid; place-items: center; color: var(--kf-dim); }
  .band { height: 60vh; background: var(--kf-contrast-bg); color: var(--kf-contrast-ink); display: grid; place-items: center; }
  .edge { margin-bottom: -1px; }
</style>
</head>
<body>
<p class="demo-hint"><b>speed-swell-edge</b> — Scroll fast. The round tip on the strip swells the faster you go and settles when you stop.</p>
<div class="demo-spacer">Scroll down quickly ↓</div>
<svg class="edge" data-fx="speed-swell-edge" viewBox="0 0 1440 247" preserveAspectRatio="none" aria-hidden="true"><path data-fx-part="path" d="M725 60C1054 60 1315 110 1440 170V247H0V170C134 110 396 60 725 60Z" data-to="M725 0C1054 0 1315 80 1440 152V247H0V152C134 74 396 0 725 0Z"/></svg>
<section class="band">Navy band area</section>
<div class="demo-spacer"></div>
<div class="demo-spacer"></div>
<script>
// Late arrivals and removals — checks that fx-core attaches to an element added after 1s and detaches from an element removed after 2.5s
(() => {
  const src = document.querySelector('[data-fx~="speed-swell-edge"]');
  if (!src) return;
  const html = src.outerHTML.replace(/\sid="[^"]*"/g, "");
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => src.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical one comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
