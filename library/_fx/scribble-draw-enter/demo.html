<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>scribble-draw-enter — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { padding: 10vh 8vw 60vh; display: grid; gap: 30vh; }
  .demo svg { width: 320px; height: auto; overflow: visible; }
</style>
</head>
<body>
<p class="demo-hint"><b>scribble-draw-enter</b> — Scroll down. The curve is drawn as it enters the screen and an arrowhead attaches. <span style="color:var(--kf-dim)">(After 1s one more curve comes in, and after 2.5s one drops out)</span></p>
<section class="demo" id="box">
  <div data-fx="scribble-draw-enter"><svg viewBox="0 0 320 220"><path data-fx-part="line" stroke-width="2" d="M300 10C200 14 90 40 70 110C55 170 150 180 190 150C230 120 160 90 110 120C70 145 40 180 20 210"/><path data-fx-part="line" stroke-width="2" d="M20 210L18 190M20 210L38 202"/></svg></div>
  <div data-fx="scribble-draw-enter" style="--fx-dur: 1.6s; --fx-dur2: .3s" data-demo-remove><svg viewBox="0 0 320 120"><path data-fx-part="line" stroke-width="2" d="M10 60C80 10 160 110 300 50"/></svg></div>
  <div data-fx="scribble-draw-enter"><svg viewBox="0 0 10 10"></svg></div>
</section>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => { const d = document.createElement("div"); d.dataset.fx = "scribble-draw-enter"; d.innerHTML = '<svg viewBox="0 0 320 120"><path data-fx-part="line" stroke-width="2" d="M10 100C120 0 200 120 310 20"/></svg>'; document.getElementById("box").append(d); }, 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
