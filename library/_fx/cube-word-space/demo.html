<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cube-word-space — Line cube word space</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style> body { margin: 0; font-family: var(--kf-font-sans); } .hint, .after { padding: 24px; min-height: 40vh; } </style>
</head>
<body>
<p class="hint">Scroll down — the camera passes between line cubes floating on a dark plate.</p>
<section data-fx="cube-word-space"><span data-fx-part="word">Architecture</span><span data-fx-part="word">Perception</span><span data-fx-part="word">Form</span><span data-fx-part="word">Experience</span></section>
<p class="after">The end.</p>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="three-global.js"></script>
<script src="../../_vendor/three@0.174.0/build/three.cjs"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
  gsap.registerPlugin(ScrollTrigger);
  setTimeout(() => { const s = document.createElement("section"); s.dataset.fx = "cube-word-space"; document.body.append(s); setTimeout(() => s.remove(), 1000); }, 1000);
</script>
</body>
</html>
