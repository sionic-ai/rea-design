<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sticky-stack-panels — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: sticky; top: 0; z-index: 100; height: 60px; box-sizing: border-box; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  [data-fx-part="panel"]:nth-child(odd) { background: var(--kf-accent); color: var(--kf-on-accent); }
  [data-fx-part="panel"]:nth-child(even) { background: var(--kf-contrast-bg); color: var(--kf-contrast-ink); }
  [data-fx-part="inner"] { display: flex; align-items: center; justify-content: center; font: 600 40px/1.2 var(--kf-font-display); }
  .after { height: 100vh; }
</style>
</head>
<body>
<p class="demo-hint"><b>sticky-stack-panels</b> — Scroll down. The next panel rises and covers the previous one <span style="color:var(--kf-dim)">(One more panel comes in after 1s, and one drops out after 2.5s)</span></p>
<div data-fx="sticky-stack-panels" style="--fx-top: 60px">
  <section data-fx-part="panel"><div data-fx-part="inner">Panel 1</div></section>
  <section data-fx-part="panel" data-demo-remove><div data-fx-part="inner">Panel to drop</div></section>
  <section data-fx-part="panel"><div data-fx-part="inner">Panel 2</div></section>
  <section data-fx-part="panel"><div data-fx-part="inner">Panel 3</div></section>
  <template data-demo-late><section data-fx-part="panel"><div data-fx-part="inner">Late-arriving panel</div></section></template>
</div>
<div class="after"></div>
<script src="../fx-core.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
