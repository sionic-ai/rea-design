<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ring-lag-cursor — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { padding: 48px 20px; display: grid; gap: 24px; max-width: 560px; }
  .card { height: 160px; border: 1px solid var(--kf-line); display: grid; place-items: center; }
  input { font: inherit; padding: 8px; border: 1px solid var(--kf-line); background: var(--kf-surface); color: var(--kf-ink); }
</style>
</head>
<body>
<p class="demo-hint"><b>ring-lag-cursor</b> — Move the mouse quickly and watch the ring trail behind, then hover and press over links, buttons, input fields and cards.</p>
<div data-fx="ring-lag-cursor"></div>
<section class="demo">
  <a href="#">Link one</a>
  <button type="button">Button</button>
  <input type="text" placeholder="Input field">
  <div class="card" data-cursor-label="Open Branch">Card with a name tag</div>
</section>
<div data-fx="ring-lag-cursor" data-demo-remove></div>
<template data-demo-late><div data-fx="ring-lag-cursor" data-fx-ring-lag-cursor="lag: .7"></div></template>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
