<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dot-ring-hover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { padding: 48px 20px; display: grid; gap: 20px; max-width: 560px; }
  .row { display: flex; align-items: center; justify-content: space-between; padding: 24px 24px 22px 0; border-bottom: 1px solid var(--kf-line); }
  .pill { display: flex; align-items: center; justify-content: space-between; gap: 30px; width: 240px; padding: 16px 22px; border-radius: var(--kf-radius-pill); background: var(--kf-accent); color: var(--kf-on-accent); }
</style>
</head>
<body>
<p class="demo-hint"><b>dot-ring-hover</b> — Hover a row or button. The dot at the end grows and its center opens up into a ring.</p>
<section class="demo">
  <a href="#" class="row">Your news title here, one line <span data-fx="dot-ring-hover"></span></a>
  <a href="#" class="row">Your treatment item name here <span data-fx="dot-ring-hover"></span></a>
  <a href="#" class="pill">Your button text here <span data-fx="dot-ring-hover" data-fx-dot-ring-hover="look: on-accent"></span></a>
</section>
<script>
// Late arrivals and removals — checks that fx-core attaches to an element added after 1s and detaches from an element removed after 2.5s
(() => {
  const src = document.querySelector('[data-fx~="dot-ring-hover"]');
  if (!src) return;
  const host = src.closest("a"), html = host.outerHTML;
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  host.after(gone);
  setTimeout(() => host.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical one comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
</body>
</html>
