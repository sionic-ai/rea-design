<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gap-close-pin — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 10; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .sp { height: 70vh; display: grid; place-items: center; color: var(--kf-dim); }
  .title { font: 800 clamp(48px, 9vw, 140px)/0.9 var(--kf-font-display); letter-spacing: -0.03em; }
  .ph { background: var(--kf-raised); border: 1px solid var(--kf-line); display: grid; place-items: center; font: 500 12px var(--kf-font-mono); color: var(--kf-dim); }
</style>
</head>
<body>
<p class="demo-hint"><b>gap-close-pin</b> — Scroll down. The two split halves gather in the center and a photo window opens.</p>
<div class="sp">Downward</div>
<section data-fx="gap-close-pin">
  <div data-fx-part="stage">
    <h2 class="title" data-fx-part="left">The gap</h2>
    <h2 class="title" data-fx-part="right">Fills in</h2>
    <div data-fx-part="window"><div class="ph" data-fx-part="photo">Photo 1</div><div class="ph" data-fx-part="photo">Photo 2</div><div class="ph" data-fx-part="photo">Photo 3</div></div>
  </div>
</section>
<section data-fx="gap-close-pin" data-demo-remove style="min-height:120vh"><div data-fx-part="stage"><h2 class="title" data-fx-part="left">To be erased</h2><h2 class="title" data-fx-part="right">Section</h2></div></section>
<template data-demo-late><section data-fx="gap-close-pin" data-fx-gap-close-pin="spread: 20; shift: 40"><div data-fx-part="stage"><h2 class="title" data-fx-part="left">Arrived late</h2><h2 class="title" data-fx-part="right">A market gathers too</h2></div></section></template>
<div class="sp"></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../../../_shared/vendor/gsap/SplitText.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); window.ScrollTrigger?.refresh(); }, 2500);
</script>
</body>
</html>
