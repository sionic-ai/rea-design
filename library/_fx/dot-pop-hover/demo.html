<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dot-pop-hover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  nav { display: flex; gap: 40px; padding: 60px 40px; font-size: 13px; letter-spacing: 0.04em; }
</style>
</head>
<body>
<p class="demo-hint"><b>dot-pop-hover</b> — Hover over the menu labels. “Menu 2” is the current page, so its dot is always shown. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<nav id="nav"><a data-fx="dot-pop-hover" href="#a">HOME</a><a data-fx="dot-pop-hover" href="#b" aria-current="page">Menu 2</a><a data-demo-remove data-fx="dot-pop-hover" href="#c">Menu 3</a><a data-fx="dot-pop-hover" href="#d" style="--fx-size: 6px">Large dot</a></nav>
<template data-demo-late><a data-fx="dot-pop-hover" href="#e">Late-arrived Menu</a></template>
<script src="../fx-core.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => document.getElementById("nav").append(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
