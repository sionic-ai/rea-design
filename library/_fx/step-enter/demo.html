<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>step-enter — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo-spacer { height: 90vh; display: grid; place-items: center; color: var(--kf-dim); }
  .se { display: flex; flex-wrap: wrap; gap: 40px; justify-content: center; padding: 60px 20px; }
  .se article { width: 220px; padding: 18px; background: var(--kf-surface); border: 1px solid var(--kf-line); }
  .se .wf-img { aspect-ratio: 4 / 3; margin-top: 10px; }
</style>
</head>
<body>
<p class="demo-hint"><b>step-enter</b> — Scroll down. Notes come in one cell at a time, in steps. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<div class="demo-spacer">Scroll down</div>
<div class="se">
  <article data-fx="step-enter">From below<div class="wf-img" data-label="Photo"></div></article>
  <article data-fx="step-enter" data-fx-step-enter="from: right">From the right<div class="wf-img" data-label="Photo"></div></article>
  <article data-demo-remove data-fx="step-enter" data-fx-step-enter="from: left; dur: 1">1s from the left<div class="wf-img" data-label="Photo"></div></article>
  <article data-fx="step-enter" data-fx-step-enter="look: swing; steps: 6; swing: 8; rot: -1; ox: -15; oy: -33">Alternating tilt stairs 6 · .4s<div class="wf-img" data-label="Photo"></div></article>
  <article data-fx="step-enter" data-fx-step-enter="look: swing; steps: 4; swing: 10; s0: .6; delay: .1">.6x across 4 steps<div class="wf-img" data-label="Photo"></div></article>
  <article data-fx="step-enter" data-fx-step-enter="from: down-right; rotate: 0">Diagonal, no tilt<div class="wf-img" data-label="Photo"></div></article>
  <template data-demo-late><article data-fx="step-enter" data-fx-step-enter="from: up">Enters late<div class="wf-img" data-label="Photo"></div></article></template>
</div>
<div class="demo-spacer"></div>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
