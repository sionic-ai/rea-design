<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>exit-lag-scrub — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .col { max-width: 660px; margin: 0 auto; }
  .sec { position: relative; min-height: 120vh; padding: 120px 40px; background: var(--kf-surface); display: grid; place-items: center; }
  .sec:nth-child(2n) { background: var(--kf-raised); border-radius: 50% 50% 0 0 / 120px 120px 0 0; }
  .sec:nth-child(1) { z-index: 1; } .sec:nth-child(2) { z-index: 2; } .sec:nth-child(3) { z-index: 3; } .sec:nth-child(4) { z-index: 4; }
</style>
</head>
<body>
<p class="demo-hint"><b>exit-lag-scrub</b> — Scroll down. When a section leaves upward it rises late and the next rounded section covers it. After 1s one more section is added and one is removed.</p>
<div class="col" id="col">
  <section class="sec" data-fx="exit-lag-scrub">Section 1</section>
  <section class="sec" data-fx="exit-lag-scrub" id="gone">Section 2 (to be dropped)</section>
  <section class="sec" data-fx="exit-lag-scrub">Section 3</section>
</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
  setTimeout(() => {
    const s = document.createElement("section");
    s.className = "sec"; s.dataset.fx = "exit-lag-scrub"; s.textContent = "Late-attached Section";
    document.getElementById("col").append(s);
    document.getElementById("gone")?.remove();
  }, 1000);
</script>
</body>
</html>
