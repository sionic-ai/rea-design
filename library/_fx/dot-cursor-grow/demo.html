<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dot-cursor-grow — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { margin: 0; background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 50; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .hero { height: 60vh; display: grid; place-items: center; background: var(--kf-accent); color: var(--kf-on-accent); font: 600 28px var(--kf-font-display); }
  .demo { display: flex; gap: 20px; padding: 60px 40px 80vh; }
  .demo a, .demo button { padding: 10px 18px; border: 1px solid var(--kf-line); border-radius: var(--kf-radius-pill); color: inherit; background: none; font: inherit; }
</style>
</head>
<body data-fx="dot-cursor-grow">
<p class="demo-hint"><b>dot-cursor-grow</b> Move the mouse. The dot follows, grows over buttons, and turns into a SCROLL bubble inside the color panel above. <span style="color:var(--kf-dim)">(After 1s one more panel comes in, and one leaves 2.5s later)</span></p>
<section class="hero" data-fx="dot-cursor-grow" data-fx-dot-cursor-grow="label: SCROLL">Your Hero here</section>
<section class="demo"><a href="#">Link</a><button type="button">Button</button><span data-demo-remove data-fx="dot-cursor-grow" data-fx-dot-cursor-grow="label: BYE">Dropped Panel</span><template data-demo-late><span data-fx="dot-cursor-grow" data-fx-dot-cursor-grow="label: LATE">Late panel</span></template></section>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
