<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>halftone-flow — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .floor { height: 40vh; margin: 20px; border-radius: var(--kf-radius-md); }
  .floor.is-small { height: 160px; }
</style>
</head>
<body>
<p class="demo-hint"><b>halftone-flow</b> — The dot pattern flows slowly. Hold the panel and it flows larger and faster, release and it slowly returns.</p>
<div class="floor" data-fx="halftone-flow"></div>
<div class="floor is-small" data-fx="halftone-flow" data-demo-remove></div>
<template data-demo-late><div class="floor is-small" data-fx="halftone-flow" data-fx-halftone-flow="cell: 6; goo: 0; invert: 0"></div></template>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="three-global.js"></script>
<script src="../../_vendor/three@0.182.0/build/three.cjs"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
