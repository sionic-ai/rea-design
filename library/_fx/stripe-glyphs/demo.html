<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>stripe-glyphs — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { padding: 24px 20px; }
  .demo + .demo { margin-top: 40px; }
  .demo-spacer { height: 70vh; display: grid; place-items: center; color: var(--kf-dim); }
  .hero { aspect-ratio: 32 / 9; }
</style>
</head>
<body>
<p class="demo-hint"><b>stripe-glyphs</b> — The upper title’s pieces slide in as soon as it opens and are swapped every 5 seconds, and scrolling down thickens the second title’s lines. <span style="color:var(--kf-dim)">(One more title comes in after 1s, and one drops out after 2.5s)</span></p>
<div class="demo"><h2 class="hero" data-fx="stripe-glyphs" data-fx-stripe-glyphs="text: SAMPLE/TITLE; mode: loop; lines: 40; field: .22; seed: 11" aria-label="Your big title here"></h2></div>
<div class="demo" data-demo-remove><h2 data-fx="stripe-glyphs" data-fx-stripe-glyphs="text: REMOVED" aria-label="Omitted title"></h2></div>
<div class="demo-spacer">Scroll down</div>
<div class="demo"><h2 data-fx="stripe-glyphs" data-fx-stripe-glyphs="text: ABCDEFGHIJKLM/NOPQRSTUVWXYZ" aria-label="Character chart"></h2></div>
<template data-demo-late><div class="demo"><h2 data-fx="stripe-glyphs" data-fx-stripe-glyphs="text: LATE 01; lines: 22" style="--fx-ink: var(--kf-accent)" aria-label="Late-arrived title"></h2></div></template>
<div class="demo-spacer"></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); window.ScrollTrigger?.refresh(); }, 2500);
</script>
</body>
</html>
