<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hold-fill — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { padding: 48px 20px; }
  .demo-btn { display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 16px; border: 1px solid var(--kf-line); border-radius: var(--kf-radius-sm); background: var(--kf-surface); color: var(--kf-ink); cursor: pointer; }
  .demo-card { padding: 20px; border: 1px solid var(--kf-line); border-radius: var(--kf-radius-md); background: var(--kf-surface); }
  .demo-spacer { height: 90vh; display: grid; place-items: center; color: var(--kf-dim); }
  .hero { height: 80vh; display: grid; place-items: center; font: 400 96px/.9 var(--kf-font-display); color: var(--kf-accent); }
</style>
</head>
<body>
<p class="demo-hint"><b>hold-fill</b> — Press and hold the circle. When it fills, the text below changes.</p>
<section class="demo" style="display:grid;place-items:center;gap:20px">
  <button class="demo-hold" data-fx="hold-fill" type="button" aria-label="Press and hold" style="width:96px;height:96px;border-radius:50%;display:grid;place-items:center;background:none;border:0"><svg viewBox="0 0 96 96" style="position:absolute;inset:0;transform:rotate(-90deg);overflow:visible"><circle data-fx-part="ring" cx="48" cy="48" r="47"/></svg><span data-fx-part="core"></span></button>
  <p class="demo-out" style="filter:blur(calc(var(--h, 0) * 10px))">One line with the answer revealed by perseverance.</p>
</section>
<script>addEventListener("fx:done", () => (document.querySelector(".demo-out").textContent = "Your revealed answer here — fx:done")); addEventListener("fx:hold", (e) => document.querySelector(".demo-out").style.setProperty("--h", e.detail.progress), true);</script>
<script>
// Late arrivals and removals — checks that fx-core attaches to an element added after 1s and detaches from an element removed after 2.5s
(() => {
  const src = document.querySelector('[data-fx~="hold-fill"]');
  if (!src) return;
  const html = src.outerHTML.replace(/\sid="[^"]*"/g, "");
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => (src.closest(".pin-spacer") || src).after(make("late")), 1000); // Once pinned the panel gets wrapped in a pin-spacer, so place it outside that
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical one comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
