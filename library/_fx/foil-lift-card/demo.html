<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>foil-lift-card — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { display: flex; flex-wrap: wrap; gap: 36px; padding: 120px 40px 60px; }
  .slot { padding: 0; border: 0; background: none; cursor: pointer; }
  .card { position: relative; width: 220px; aspect-ratio: .71; border-radius: 5.6%; overflow: hidden; background: linear-gradient(155deg, var(--kf-accent-soft), var(--kf-raised)); box-shadow: var(--kf-shadow-lift); }
  .card.is-dark { background: linear-gradient(155deg, var(--kf-ink), var(--kf-dim)); color: var(--kf-surface); }
  .card b { position: absolute; left: 16px; top: 16px; z-index: 4; font: 600 18px/1.1 var(--kf-font-display); }
</style>
</head>
<body>
<p class="demo-hint"><b>foil-lift-card</b> — Move the mouse over the cards. The card rises and tilts, with a rainbow foil and light following (the third is dodge for dark cards, the fourth is flat with no tilt). <span style="color:var(--kf-dim)">(One more card comes in after 1s, and one drops out after 2.5s)</span></p>
<section class="demo">
  <button class="slot" data-fx="foil-lift-card" data-demo-remove><div class="card" data-fx-part="tilt"><b>Card 1</b><span data-fx-part="foil"></span><span data-fx-part="glare"></span><span data-fx-part="edge"></span></div></button>
  <button class="slot" data-fx="foil-lift-card"><div class="card" data-fx-part="tilt"><b>Card 2</b><span data-fx-part="foil"></span><span data-fx-part="glare"></span><span data-fx-part="edge"></span></div></button>
  <button class="slot" data-fx="foil-lift-card" data-fx-foil-lift-card="look: dodge"><div class="card is-dark" data-fx-part="tilt"><b>Dark Card</b><span data-fx-part="foil"></span><span data-fx-part="glare"></span><span data-fx-part="edge"></span></div></button>
  <button class="slot" data-fx="foil-lift-card" data-fx-foil-lift-card="flat: 1"><div class="card" data-fx-part="tilt"><b>flat</b><span data-fx-part="foil"></span><span data-fx-part="glare"></span></div></button>
  <template data-demo-late><button class="slot" data-fx="foil-lift-card"><div class="card" data-fx-part="tilt"><b>Late-arrived card</b><span data-fx-part="foil"></span><span data-fx-part="glare"></span><span data-fx-part="edge"></span></div></button></template>
  <button class="slot" data-fx="foil-lift-card"></button>
</section>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
