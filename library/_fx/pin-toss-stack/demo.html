<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pin-toss-stack — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .spacer { height: 60vh; display: grid; place-items: center; color: var(--kf-dim); }
  .toss { background: var(--kf-surface); transition: background-color .5s; }
  .toss[data-step="2"] { background: var(--kf-raised); }
  .toss [data-fx-part="stage"] { display: grid; place-items: center; }
  .toss [data-fx-part="card"] { width: 300px; height: 360px; margin: 0; background: var(--kf-bg); border: 1px solid var(--kf-line); display: grid; place-items: center; rotate: -1deg; }
  .toss [data-fx-part="card"]:nth-child(even) { rotate: 5deg; }
  .toss .name { position: absolute; bottom: 12vh; opacity: 0; transition: opacity .5s; }
  .toss[data-step="1"] .name.n1, .toss[data-step="2"] .name.n2, .toss[data-step="3"] .name.n3 { opacity: 1; }
</style>
</head>
<body>
<p class="demo-hint"><b>pin-toss-stack</b> — Scroll down — stacked photo cards fly up one at a time and the name changes. <span style="color:var(--kf-dim)">(After 1s one more pile comes in, and after 2.5s one drops out)</span></p>
<div class="spacer">↓</div>
<section class="toss" data-fx="pin-toss-stack">
  <div data-fx-part="stage">
    <figure data-fx-part="card">Photo 1</figure><figure data-fx-part="card">Photo 2</figure><figure data-fx-part="card">Photo 3</figure>
    <p class="name n1">Your first name here</p><p class="name n2">Your second name here</p><p class="name n3">Your third name here</p>
  </div>
</section>
<section class="toss" data-fx="pin-toss-stack" data-demo-remove><div data-fx-part="stage"><figure data-fx-part="card">Omission</figure><figure data-fx-part="card">Omission</figure></div></section>
<div data-late-slot></div>
<div class="spacer">Footer</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script>gsap.registerPlugin(ScrollTrigger);</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelector("[data-late-slot]").outerHTML = '<section class="toss" data-fx="pin-toss-stack" data-fx-pin-toss-stack="per: 100; rotate: 15"><div data-fx-part="stage"><figure data-fx-part="card">Late 1</figure><figure data-fx-part="card">Late 2</figure></div></section>', 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
