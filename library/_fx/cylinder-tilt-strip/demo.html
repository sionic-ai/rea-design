<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cylinder-tilt-strip — a photo strip that curves and flows along the inside of a cylinder</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="../../_vendor/swiper@5.4.5/swiper.min.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { padding: 40px 0; overflow-x: hidden; }
  p { padding: 0 40px; }
  .demo { margin: 80px -20px 0; }
  .demo [data-fx-part="track"] { transform: rotate(-8.26deg); }
  .demo .swiper-slide figure { aspect-ratio: 16 / 9; margin: 0; }
  .demo .swiper-slide .wf-img { height: 100%; }
</style>
</head>
<body>
<p>The photo strip flows endlessly to the right, and cards at the edges turn away and darken — as if stuck to the inside of a round wall.</p>
<div class="demo" data-fx="cylinder-tilt-strip">
  <div class="swiper-container" data-fx-part="track"><div class="swiper-wrapper">
    <div class="swiper-slide"><figure data-fx-part="item"><div class="wf-img" data-label="Photo 1"></div></figure></div>
    <div class="swiper-slide"><figure data-fx-part="item"><div class="wf-img" data-label="Photo 2"></div></figure></div>
    <div class="swiper-slide"><figure data-fx-part="item"><div class="wf-img" data-label="Photo 3"></div></figure></div>
    <div class="swiper-slide"><figure data-fx-part="item"><div class="wf-img" data-label="Photo 4"></div></figure></div>
    <div class="swiper-slide"><figure data-fx-part="item"><div class="wf-img" data-label="Photo 5"></div></figure></div>
    <div class="swiper-slide"><figure data-fx-part="item"><div class="wf-img" data-label="Photo 6"></div></figure></div>
  </div></div>
</div>
<div data-fx="cylinder-tilt-strip" data-demo-remove><div class="swiper-container" data-fx-part="track"><div class="swiper-wrapper"><div class="swiper-slide">Cell to Be Removed</div><div class="swiper-slide">Cell to Be Removed</div></div></div></div>
<template data-demo-late><div class="demo" data-fx="cylinder-tilt-strip" data-fx-cylinder-tilt-strip="dir: left; speed: 4000; curve: .4"><div class="swiper-container" data-fx-part="track"><div class="swiper-wrapper"><div class="swiper-slide"><figure data-fx-part="item"><div class="wf-img" data-label="Late 1"></div></figure></div><div class="swiper-slide"><figure data-fx-part="item"><div class="wf-img" data-label="Late 2"></div></figure></div><div class="swiper-slide"><figure data-fx-part="item"><div class="wf-img" data-label="Late 3"></div></figure></div><div class="swiper-slide"><figure data-fx-part="item"><div class="wf-img" data-label="Late 4"></div></figure></div></div></div></div></template>
<script src="../../_vendor/swiper@5.4.5/swiper.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
