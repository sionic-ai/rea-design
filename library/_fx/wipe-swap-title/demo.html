<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>wipe-swap-title — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; min-height: 200vh; }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-title { padding: 40px 20px; font-size: 56px; font-weight: 300; line-height: 1.1; }
  .demo-row { padding: 0 20px; }
  .demo-row button { height: 40px; padding: 0 20px; border: 1px solid currentColor; border-radius: 20px; background: none; font: inherit; cursor: pointer; }
</style>
</head>
<body>
<p class="demo-hint"><b>wipe-swap-title</b> — The English section name is wiped in, then swapped for the local-language name. The button replays the event panel.</p>
<h2 class="demo-title" data-fx="wipe-swap-title"><span data-fx-part="before">CHAPTER</span><span data-fx-part="after">Your section name here</span></h2>
<div class="demo-row"><button type="button" data-demo-play>Re-trigger event panel</button></div>
<h2 class="demo-title" data-fx="wipe-swap-title" data-fx-wipe-swap-title="on: event" data-demo-event><span data-fx-part="before">EVENT</span><span data-fx-part="after">Changes on press</span></h2>
<div data-demo-late-host></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
const ev = document.querySelector("[data-demo-event]");
document.querySelector("[data-demo-play]").addEventListener("click", () => { ev.dispatchEvent(new CustomEvent("fx:reset")); ev.dispatchEvent(new CustomEvent("fx:play")); });
// Attach a late-added title and an empty title with no pair, then remove them
setTimeout(() => {
  const host = document.querySelector("[data-demo-late-host]");
  const t = document.createElement("h2");
  t.className = "demo-title";
  t.dataset.fx = "wipe-swap-title";
  t.innerHTML = '<span data-fx-part="before">LATE</span><span data-fx-part="after">Late-arrived title</span>';
  const empty = document.createElement("h2");
  empty.dataset.fx = "wipe-swap-title";
  host.append(t, empty);
  setTimeout(() => empty.remove(), 1500);
}, 1000);
</script>
</body>
</html>
