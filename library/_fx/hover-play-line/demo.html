<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hover-play-line — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 48px; padding: 48px 40px; }
  .demo-card { color: inherit; text-decoration: none; }
  .demo-card [data-fx-part="media"] { display: block; aspect-ratio: 16 / 9; border-radius: var(--kf-radius-md); background: var(--kf-surface); }
  .demo-card .wf-img { position: absolute; inset: 0; height: 100%; border: 0; }
  .demo-card p { margin: 16px 0 0; }
</style>
</head>
<body>
<p class="demo-hint"><b>hover-play-line</b> Hover over the video area. The left line blinks, becomes a playback bar, and the time counts down.</p>
<div class="demo-grid">
  <a class="demo-card" href="#" data-fx="hover-play-line"><span data-fx-part="media"><span class="wf-img wf-video" data-label="Poster · Landscape 16:9"></span><video data-fx-part="video" data-src="demo.mp4" muted loop playsinline preload="none"></video></span><p>Your work title here</p></a>
  <a class="demo-card" href="#" data-fx="hover-play-line" data-fx-hover-play-line="time: off; delay: 0"><span data-fx-part="media"><span class="wf-img wf-video" data-label="Poster · Landscape 16:9"></span><video data-fx-part="video" data-src="demo.mp4" muted loop playsinline preload="none"></video></span><p>No time text · turns on right away</p></a>
</div>
<script>
// Late arrivals and removals — checks that fx-core attaches to an element added after 1s and detaches from an element removed after 2.5s
(() => {
  const src = document.querySelector('[data-fx~="hover-play-line"]');
  if (!src) return;
  const html = src.outerHTML.replace(/\sid="[^"]*"/g, "");
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => src.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical one comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
