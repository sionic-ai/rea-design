<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bracket-snap-cursor — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { padding: 64px 20px; max-width: 760px; margin: 0 auto; display: grid; gap: 32px; }
  .demo ol { border-bottom: 1px solid var(--kf-line); }
  .demo li { border-top: 1px solid var(--kf-line); padding: 22px 16px; font: 900 32px/1 var(--kf-font-display); }
  .demo nav { display: flex; gap: 32px; font-size: 13px; }
  .demo button { padding: 10px 16px; background: var(--kf-ink); color: var(--kf-bg); border: 0; }
</style>
</head>
<body data-fx="bracket-snap-cursor">
<p class="demo-hint"><b>bracket-snap-cursor</b> — Move the mouse over links, buttons and list rows.</p>
<section class="demo">
  <nav><a href="#">Menu 1</a><a href="#">Menu 2</a><a href="#">Menu 3</a></nav>
  <ol><li data-fx-part="row">List row one</li><li data-fx-part="row">List line two</li><li data-fx-part="row">List line three</li></ol>
  <p><button type="button">Button</button></p>
</section>
<script>
// Checks whether it attaches to late-arriving lines (after 1 second) and whether the brackets disappear when the cursor part is removed (reattached after 4 seconds)
(() => {
  const ol = document.querySelector(".demo ol");
  setTimeout(() => { const li = document.createElement("li"); li.dataset.fxPart = "row"; li.textContent = "Late row"; ol.append(li); }, 1000);
  setTimeout(() => document.body.setAttribute("data-fx", ""), 2500);
  setTimeout(() => document.body.setAttribute("data-fx", "bracket-snap-cursor"), 4000);
  document.querySelector(".demo-hint").append(" · One more line comes in after 1 second, detaches at 2.5 seconds, and attaches again at 4 seconds.");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
