<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>water-trail-gl — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { display: flex; flex-wrap: wrap; gap: 20px; padding: 40px 20px; }
  .card { width: 360px; }
  .card .wf-img { aspect-ratio: 4 / 5; background-color: var(--kf-contrast-bg); }
</style>
</head>
<body>
<p class="demo-hint"><b>water-trail-gl</b> — Move the mouse slowly over the photo. Water marks spread and dry out over 3 seconds.</p>
<section class="demo">
  <figure class="card" id="a" data-fx="water-trail-gl"><div class="wf-img" data-fx-part="photo" data-label="Photo slot"></div></figure>
  <figure class="card" id="b" data-fx="water-trail-gl" data-fx-water-trail-gl="radius: .008; dry: 6"><div class="wf-img" data-fx-part="photo" data-label="Leaves big marks and dries slowly"></div></figure>
</section>
<script>
(() => {
  const late = document.getElementById("a").cloneNode(true);
  late.id = "late";
  setTimeout(() => document.querySelector(".demo").append(late), 1000);
  setTimeout(() => document.getElementById("b").remove(), 2500);
})();
</script>
<script src="../../_vendor/ogl@1.0.11/ogl.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
