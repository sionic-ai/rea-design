<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>wave-strip-loop — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { padding: 48px 20px; }
  .demo-gap { height: 70vh; }
  .demo-big { margin: 0; font: 700 120px/1 var(--kf-font-display); letter-spacing: -0.05em; }
  .demo-wave { height: 70px; color: var(--kf-accent); }
</style>
</head>
<body>
<p class="demo-hint"><b>wave-strip-loop</b> — Wave lines flow endlessly to the left (the second one to the right). <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<section class="demo"><div class="demo-wave" data-fx="wave-strip-loop"><svg data-fx-part="strip" viewBox="0 0 2400 70" width="2400" height="70" preserveAspectRatio="none"><path d="M0 35C150 0 300 0 450 35S750 70 900 35 1050 0 1200 35 1500 70 1650 35 1950 0 2100 35 2250 70 2400 35" fill="none" stroke="currentColor" stroke-width="2"/></svg></div><div class="demo-wave" data-fx="wave-strip-loop" style="--fx-dur: 30s; --fx-dir: reverse" data-demo-remove><svg data-fx-part="strip" viewBox="0 0 2400 70" width="2400" height="70" preserveAspectRatio="none"><path d="M0 35C150 0 300 0 450 35S750 70 900 35 1050 0 1200 35 1500 70 1650 35 1950 0 2100 35 2250 70 2400 35" fill="none" stroke="currentColor" stroke-width="2"/></svg></div><template data-demo-late><div class="demo-wave" data-fx="wave-strip-loop" style="--fx-dur: 8s"><svg data-fx-part="strip" viewBox="0 0 2400 70" width="2400" height="70" preserveAspectRatio="none"><path d="M0 35C150 0 300 0 450 35S750 70 900 35 1050 0 1200 35 1500 70 1650 35 1950 0 2100 35 2250 70 2400 35" fill="none" stroke="currentColor" stroke-width="2"/></svg></div></template></section>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>

<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
