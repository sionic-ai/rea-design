<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rush-marquee — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 10; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { padding: 48px 0; }
  .big { font: 200 72px/1 var(--kf-font-display); text-transform: uppercase; }
  .demo-spacer { height: 120vh; display: grid; place-items: center; color: var(--kf-dim); }
</style>
</head>
<body>
<p class="demo-hint"><b>rush-marquee</b> — Text slides in as a band surges forward, then settles. Scrolling speeds it up briefly. <span style="color:var(--kf-dim)">(After 1s one more band comes in, and one leaves 2.5s later)</span></p>
<section class="demo" data-demo-wrap>
  <div class="big" data-fx="rush-marquee" data-demo-remove><div data-fx-part="track"><p data-fx-part="line">Your statement here. Short and calm.</p></div></div>
  <div class="big" data-fx="rush-marquee" data-fx-rush-marquee="speed: .2; rush: 2"><div data-fx-part="track"><p data-fx-part="line">A second line runs faster.</p></div></div>
  <div data-fx="rush-marquee"><div data-fx-part="track"></div></div>
  <template data-demo-late><div class="big" data-fx="rush-marquee"><div data-fx-part="track"><p data-fx-part="line">Late line joins the page.</p></div></div></template>
</section>
<div class="demo-spacer">Try scrolling down</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
