<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>char-blink-hover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { padding: 48px 20px; display: grid; gap: 32px; justify-items: start; }
  .nav { display: flex; gap: 28px; font-size: 16px; }
  .more { display: grid; gap: 12px; max-width: 420px; }
  .more img, .more i { width: 20px; height: 20px; border-radius: 50%; background: var(--kf-ink); transition: opacity .6s ease; }
  .more .is-hovered { opacity: .5; }
</style>
</head>
<body>
<p class="demo-hint"><b>char-blink-hover</b> — Hover over a menu label. The letters fade from the front, then become crisp again.</p>
<section class="demo">
  <nav class="nav"><a href="#" data-fx="char-blink-hover">About</a><a href="#" data-fx="char-blink-hover">Four Seasons</a><a href="#" data-fx="char-blink-hover">Grounds</a><a href="#" data-fx="char-blink-hover">Zen Meditation</a></nav>
  <a href="#" class="more" data-fx="char-blink-hover"><p>Long intro text here and the whole link is clickable. Only the ”See more” below blinks.</p><span><span data-fx-part="text">View details</span> <i data-fx-part="mark"></i></span></a>
</section>
<script>
(() => {
  const src = document.querySelector('.nav [data-fx~="char-blink-hover"]');
  if (!src) return;
  const make = (tag) => { const a = document.createElement("a"); a.href = "#"; a.dataset.fx = "char-blink-hover"; a.dataset.demo = tag; a.textContent = tag === "late" ? "Late Item" : "Gone Item"; return a; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => src.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical one comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/SplitText.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
