<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>drop-panel-height — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); min-height: 120vh; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-nav { position: relative; z-index: 2; margin: 24px 20px; border-radius: 8px; background: var(--kf-surface); }
  .demo-row { display: flex; gap: 24px; padding: 16px 24px; }
  .demo-row button { border: 0; background: none; color: inherit; font: 500 14px/1 var(--kf-font-sans); text-transform: uppercase; cursor: pointer; }
  .demo-panel { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; padding: 16px 24px 24px; }
  .demo-panel .wf-img { aspect-ratio: 1; }
</style>
</head>
<body>
<p class="demo-hint"><b>drop-panel-height</b> — Hover over a menu item. A panel opens and the cells float up one after another. <span style="color:var(--kf-dim)">(After 1s one more menu item comes in, and after 2.5s one drops out)</span></p>
<nav class="demo-nav" data-fx="drop-panel-height">
  <div class="demo-row"><button data-fx-part="toggle" data-key="a">Menu 1</button><button data-fx-part="toggle" data-key="b">Menu 2</button></div>
  <div data-fx-part="box">
    <div data-fx-part="panel" data-key="a"><div class="demo-panel"><div class="wf-img" data-fx-part="item" data-label="Product 1"></div><div class="wf-img" data-fx-part="item" data-label="Product 2"></div><div class="wf-img" data-fx-part="item" data-label="Product 3"></div></div></div>
    <div data-fx-part="panel" data-key="b"><div class="demo-panel"><a data-fx-part="item" href="#">Link one</a><a data-fx-part="item" href="#">Link Two</a></div></div>
  </div>
  <div data-fx-part="backdrop"></div>
</nav>
<nav class="demo-nav" data-fx="drop-panel-height" data-fx-drop-panel-height="open: .2; close: .15; enter: 0" data-demo-remove><div class="demo-row"><button data-fx-part="toggle" data-key="x">Quick menu</button></div><div data-fx-part="box"><div data-fx-part="panel" data-key="x"><div class="demo-panel"><a data-fx-part="item" href="#">One</a></div></div></div></nav>
<nav class="demo-nav" data-fx="drop-panel-height"><div class="demo-row">Menu without a panel (hooks nothing)</div></nav>
<template data-demo-late><nav class="demo-nav" data-fx="drop-panel-height"><div class="demo-row"><button data-fx-part="toggle" data-key="l">Late Menu</button></div><div data-fx-part="box"><div data-fx-part="panel" data-key="l"><div class="demo-panel"><a data-fx-part="item" href="#">Late One</a><a data-fx-part="item" href="#">Late two</a></div></div></div></nav></template>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
