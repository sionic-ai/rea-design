<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bob-swap-slides — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { margin: 0; background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); overflow-x: hidden; }
  .demo-hint { position: sticky; top: 0; z-index: 100; margin: 0; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .bs-row { display: flex; gap: 40px; padding: 40px 20px 140px; }
  .bs-card { flex: 0 0 220px; height: 165px; border-radius: var(--kf-radius-lg); background: var(--kf-accent-soft); color: var(--kf-accent-text); display: grid; place-items: center; font-weight: 700; }
</style>
</head>
<body>
<p class="demo-hint"><b>bob-swap-slides</b> — Every 2s the odd and even cells swap up and down (in a slider, fx:step is sent when you advance). Flip it once with the button below.</p>
<button type="button" class="wf-btn" style="margin:20px" id="bs-step">send fx:step</button>
<div data-demo-host>
  <div class="bs-row" data-fx="bob-swap-slides" data-fx-bob-swap-slides="every: 2">
    <div class="bs-card" data-fx-part="item">Photo 1</div>
    <div class="bs-card" data-fx-part="item">Photo 2</div>
    <div class="bs-card" data-fx-part="item">Photo 3</div>
    <div class="bs-card" data-fx-part="item">Photo 4</div>
    <div class="bs-card" data-fx-part="item">Photo 5</div>
  </div>
</div>
<script>
document.getElementById("bs-step").addEventListener("click", () => document.querySelectorAll('[data-fx~="bob-swap-slides"]').forEach((el) => el.dispatchEvent(new CustomEvent("fx:step"))));
// Late arrivals and removals — checks that fx-core attaches to an element added after 1s and detaches from an element removed after 2.5s
(() => {
  const src = document.querySelector('[data-fx~="bob-swap-slides"]');
  if (!src) return;
  const html = src.outerHTML.replace(/\sid="[^"]*"/g, "");
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const host = src.closest("[data-demo-host]") || src;
  const gone = make("gone");
  host.after(gone);
  setTimeout(() => host.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical one comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
