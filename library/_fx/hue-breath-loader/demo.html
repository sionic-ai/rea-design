<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hue-breath-loader — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-logo { font: 700 40px/1 var(--kf-font-display); letter-spacing: 0.04em; }
  .demo-page { padding: 40px 20px; }
  .demo-box { position: relative; height: 260px; margin-top: 20px; overflow: hidden; border: 1px solid var(--kf-line); }
  .demo-box [data-fx~="hue-breath-loader"] { position: absolute; }
</style>
</head>
<body>
<p class="demo-hint"><b>hue-breath-loader</b> — On reload the accent gradient breathes, then clears after 1s. <span style="color:var(--kf-dim)">(After 1s one more curtain comes into a box, and after 2.5s one drops out)</span></p>
<div data-fx="hue-breath-loader" data-demo-remove><div data-fx-part="cont" class="demo-logo">LOGO</div></div>
<div class="demo-page">
  <p>This is the page content shown after the curtain lifts.</p>
  <div class="demo-box"><template data-demo-late><div data-fx="hue-breath-loader" data-fx-hue-breath-loader="hold: 2; low: 70"><div data-fx-part="cont" class="demo-logo">LATE</div></div></template></div>
  <div class="demo-box"><div data-fx="hue-breath-loader" data-fx-hue-breath-loader="hold: 3"></div></div>
</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
