<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bip-label-cursor — Motion part</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); margin: 0; }
  main { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; padding: 20px; }
  .tile { height: 40vh; background: var(--kf-raised); display: grid; place-items: center; }
  .tile.dark { background: var(--kf-contrast-bg); color: var(--kf-contrast-ink); }
</style>
</head>
<body>
<p class="demo-hint"><b>bip-label-cursor</b> — Hover over the cells. The left cell has a bouncing circle, and in the right cell the “Menu” text becomes the cursor.</p>
<main data-fx="bip-label-cursor">
  <a class="tile" href="#a" data-cursor="circle">Circle cursor</a>
  <div class="tile dark" data-cursor="Menu">Post cursor</div>
</main>
<div data-fx="bip-label-cursor" data-demo-remove></div>
<template data-demo-late><main data-fx="bip-label-cursor"><div class="tile" data-cursor="Late-arrived spot">Late cell</div></main></template>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
  setTimeout(() => {
    const t = document.querySelector("[data-demo-late]");
    t.after(t.content.cloneNode(true));
    document.querySelector("[data-demo-remove]")?.remove();
  }, 1000);
</script>
</body>
</html>
