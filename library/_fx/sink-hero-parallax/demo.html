<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sink-hero-parallax — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.6 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 10; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .hero { position: relative; display: grid; grid-template-columns: 1fr 1fr; height: 100vh; }
  .hero__frame { position: relative; overflow: clip; background: var(--kf-contrast-bg); color: var(--kf-contrast-ink); }
  .hero__pic { position: absolute; inset: 0; background: linear-gradient(160deg, var(--kf-accent), var(--kf-raised) 55%, var(--kf-ink)); }
  .hero__mark { position: absolute; inset: 0; display: grid; place-items: center; margin: 0; font-size: clamp(28px, 4vw, 56px); font-weight: 200; }
  .demo-body { min-height: 150vh; padding: 40px; }
</style>
</head>
<body>
<p class="demo-hint"><b>sink-hero-parallax</b> Scroll down. The left photo (.5) and text (.4) follow down more slowly than the scroll.</p>
<section class="hero">
  <div class="hero__frame" data-fx-part="frame">
    <div class="hero__pic" data-fx="sink-hero-parallax" data-fx-sink-hero-parallax="value: .5"></div>
    <h1 class="hero__mark" data-fx="sink-hero-parallax" data-fx-sink-hero-parallax="value: .4">BRAND NAME</h1>
  </div>
  <div></div>
</section>
<div class="demo-body" id="late-host"><p>Body — after 1s a small Frame slides in below, and after 2.5s one drops out.</p></div>
<template data-demo-late><div class="hero__frame" style="height:200px"><div class="hero__pic" data-fx="sink-hero-parallax" data-fx-sink-hero-parallax="value: .3" data-demo-remove></div></div></template>
<div data-fx="sink-hero-parallax"></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => document.getElementById("late-host").append(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
