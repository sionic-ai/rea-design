<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>elastic-dot-cta — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css"><link rel="stylesheet" href="../../../_shared/kf-defaults.css"><link rel="stylesheet" href="fx.css">
<style>body{margin:0;background:var(--kf-bg);color:var(--kf-ink);font:400 14px/1.5 var(--kf-font-sans)}.demo-hint{padding:12px 20px;background:var(--kf-surface);border-bottom:1px solid var(--kf-line);font:500 13px/1.4 var(--kf-font-mono)}.row{display:flex;gap:24px;padding:60px 40px}</style></head>
<body>
<p class="demo-hint"><b>elastic-dot-cta</b> — Hover over the button. The background swells and the dot is pushed away. (After 1s one more button comes in and after 2.5s one drops out)</p>
<div class="row" data-demo-host>
  <a href="#" data-fx="elastic-dot-cta"><span data-fx-part="bg"></span><span data-fx-part="label">Say hello<span data-fx-part="dots"><i data-fx-part="dot"></i><i data-fx-part="dot"></i><i data-fx-part="dot"></i><i data-fx-part="dot"></i><i data-fx-part="dot"></i></span></span></a>
  <a href="#" data-fx="elastic-dot-cta" data-demo-remove><span data-fx-part="bg"></span><span data-fx-part="label">Omitted button</span></a>
</div>
<script>
setTimeout(() => { const a = document.createElement("a"); a.href = "#"; a.dataset.fx = "elastic-dot-cta"; a.style.setProperty("--fx-sx", "1.08"); a.innerHTML = '<span data-fx-part="bg"></span><span data-fx-part="label">Late-arriving button<span data-fx-part="dots"><i data-fx-part="dot"></i><i data-fx-part="dot"></i><i data-fx-part="dot"></i><i data-fx-part="dot"></i><i data-fx-part="dot"></i></span></span>'; document.querySelector("[data-demo-host]").append(a); }, 1000);
setTimeout(() => document.querySelector("[data-demo-remove]")?.remove(), 2500);
</script></body></html>
