<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>flipbook-pop — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { display: flex; gap: 80px; justify-content: center; padding: 100px 20px; }
  .demo [data-fx] { width: 200px; height: 300px; }
  .demo .wf-img { height: 100%; }
  .demo-spacer { height: 80vh; display: grid; place-items: center; color: var(--kf-dim); }
</style>
</head>
<body>
<p class="demo-hint"><b>flipbook-pop</b> — Cut-out photos approach in steps while swaying, and with two photos they alternate. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<div class="demo">
  <p data-fx="flipbook-pop"><span data-fx-part="frame"><span class="wf-img" data-label="Cutout person · first sheet"></span></span><span data-fx-part="frame"><span class="wf-img" data-label="Cutout figure · Section two"></span></span></p>
  <p data-fx="flipbook-pop" data-fx-flipbook-pop="look: right"><span data-fx-part="frame"><span class="wf-img" data-label="From the right · one sheet"></span></span></p>
  <p data-fx="flipbook-pop" data-demo-remove><span data-fx-part="frame"><span class="wf-img" data-label="Being removed soon"></span></span></p>
  <template data-demo-late><p data-fx="flipbook-pop" data-fx-flipbook-pop="look: right; cycle: 1"><span data-fx-part="frame"><span class="wf-img" data-label="Late arrival · First sheet"></span></span><span data-fx-part="frame"><span class="wf-img" data-label="Late arrival · second section"></span></span></p></template>
</div>
<div class="demo-spacer">Bottom end</div>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); window.ScrollTrigger?.refresh(); }, 2500);
</script>
</body>
</html>
