<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>line-dot-link — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { padding: 48px 20px; display: flex; flex-direction: column; gap: 32px; align-items: flex-start; }
</style>
</head>
<body>
<p class="demo-hint"><b>line-dot-link</b> — Hover over ”More”. The left line folds to the right and the circle changes. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<section class="demo">
  <a data-fx="line-dot-link" href="#">More</a>
  <a data-demo-remove data-fx="line-dot-link" href="#">Link to Remove</a>
  <a data-fx="line-dot-link" data-fx-line-dot-link="look: bare" href="#">Lineless type</a>
  <a data-fx="line-dot-link" style="--fx-line: 5em; --fx-line-dur: .8s" href="#">Long line · slow</a>
  <template data-demo-late><a data-fx="line-dot-link" href="#">Enters late</a></template>
</section>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
