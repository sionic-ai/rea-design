<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>badge-pop-hover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .grid { display: flex; flex-wrap: wrap; gap: 34px; padding: 48px 20px; }
  .card { width: 248px; height: 332px; border-radius: var(--kf-radius-lg); background: var(--kf-surface); border: 1px solid var(--kf-line); overflow: visible; display: flex; flex-direction: column; justify-content: flex-end; padding: 16px; }
  .card video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; border-radius: inherit; background: var(--kf-accent-soft); }
  .card .badge { position: absolute; top: 20px; right: -20px; padding: 2px 14px; border-radius: var(--kf-radius-pill); background: var(--kf-ink); color: var(--kf-bg); font-weight: 600; }
  .card [data-fx-part="dim"] { position: relative; }
</style>
</head>
<body>
<p class="demo-hint"><b>badge-pop-hover</b> — Hover over a card. One card joins late after 1s, and after 3s a part drops from the first card.</p>
<div class="grid" id="grid">
  <article class="card" data-fx="badge-pop-hover"><video data-fx-part="video" muted loop playsinline preload="none"></video><div data-fx-part="dim"><b>Work Title 01</b><br>Tag · Tag</div><span class="badge" data-fx-part="badge">VIEW MORE</span></article>
  <article class="card" data-fx="badge-pop-hover" data-fx-badge-pop-hover="dur: .4; y: -20; x: 0"><div data-fx-part="dim"><b>List line type</b><br>dur .4 · y -20</div><span class="badge" data-fx-part="badge">VIEW MORE</span></article>
</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
  setTimeout(() => {
    const src = document.querySelector(".card");
    if (!src) return;
    const a = src.cloneNode(true);
    a.querySelector("b").textContent = "Late-attached card";
    document.getElementById("grid").append(a);
  }, 1000);
  setTimeout(() => document.querySelector(".card")?.removeAttribute("data-fx"), 3000);
</script>
</body>
</html>
