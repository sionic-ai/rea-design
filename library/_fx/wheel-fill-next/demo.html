<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>wheel-fill-next — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.6 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo-spacer { height: 110vh; display: grid; place-items: center; color: var(--kf-dim); }
  .demo-next { display: flex; align-items: center; gap: 16px; margin: 24px 20px; height: 56px; padding: 0 16px; border: 1px solid var(--kf-line); font: 500 18px/1 var(--kf-font-mono); }
  .demo-next .track { flex: 1; height: 2px; background: var(--kf-line); overflow: hidden; }
  .demo-next [data-fx-part="fill"] { display: block; width: 100%; height: 100%; }
  .demo-log { margin: 0 20px 40px; color: var(--kf-dim); font: 13px/1.4 var(--kf-font-mono); }
</style>
</head>
<body>
<p class="demo-hint"><b>wheel-fill-next</b> — Scroll all the way down, then keep rolling the wheel (on phones, push up) and the bar fills. When it is full, a ”next” event fires. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<div class="demo-spacer">Scroll all the way down</div>
<footer class="demo-next" data-fx="wheel-fill-next" data-demo-remove><span>Being removed soon</span><div class="track"><i data-fx-part="fill"></i></div></footer>
<template data-demo-late><footer class="demo-next" data-fx="wheel-fill-next" data-fx-wheel-fill-next="step: 5"><span>Late-arriving band</span><div class="track"><i data-fx-part="fill"></i></div></footer></template>
<footer class="demo-next" data-fx="wheel-fill-next"></footer>
<footer class="demo-next" data-fx="wheel-fill-next"><span>Next</span><div class="track"><i data-fx-part="fill"></i></div></footer>
<p class="demo-log">Event: <span id="log">Not yet</span></p>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
document.addEventListener("fx:next", (e) => { e.preventDefault(); document.getElementById("log").textContent = "fx:next — where it moves on to the next page"; });
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
