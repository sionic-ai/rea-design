<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>frame-in-frame-slides — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { display: grid; gap: 40px; padding: 30px 4vw 40vh; }
  .hero { aspect-ratio: 16 / 9; }
  .hero .wf-img { height: 100%; }
  .hero [data-fx-part="inset"] { right: 2vw; bottom: 2vw; width: 31%; aspect-ratio: 16 / 10; }
  .small { aspect-ratio: 4 / 3; width: min(420px, 90%); }
  .small .wf-img { height: 100%; }
</style>
</head>
<body>
<p class="demo-hint"><b>frame-in-frame-slides</b> — Just watch. The large photo opens from the bottom and changes every 3.65 seconds, and the small frame at the bottom right always turns to the next one along with it. <span style="color:var(--kf-dim)">(After 1s one more panel comes in, and one leaves 2.5s later)</span></p>
<section class="demo">
  <div class="hero" data-fx="frame-in-frame-slides">
    <div data-fx-part="slide"><div class="wf-img" data-label="House 1 · wide living room shot · landscape"></div></div>
    <div data-fx-part="slide"><div class="wf-img" data-label="House 2 · Exterior · Horizontal"></div></div>
    <div data-fx-part="slide"><div class="wf-img" data-label="House 3 · Dining table · Landscape"></div></div>
    <div data-fx-part="inset"></div>
  </div>
  <div class="small" data-fx="frame-in-frame-slides" data-fx-frame-in-frame-slides="every: 2; dur: .8; zoom: 1.05">
    <div data-fx-part="slide"><div class="wf-img" data-label="No small frame · every 2 seconds"></div></div>
    <div data-fx-part="slide"><div class="wf-img" data-label="Second Section"></div></div>
  </div>
  <div class="small" data-fx="frame-in-frame-slides" data-demo-remove>
    <div data-fx-part="slide"><div class="wf-img" data-label="Panel to be removed soon"></div></div>
    <div data-fx-part="slide"><div class="wf-img" data-label="Panel to be removed soon 2"></div></div>
  </div>
  <template data-demo-late><div class="small" data-fx="frame-in-frame-slides"><div data-fx-part="slide"><div class="wf-img" data-label="Late panel"></div></div><div data-fx-part="slide"><div class="wf-img" data-label="Late-arriving panel 2"></div></div></div></template>
</section>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
