<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>spine-shelf-open — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .shelf { display: flex; height: 70vh; overflow-x: auto; border-top: 1px solid var(--kf-line); }
  .spine { width: 14vh; height: 100%; display: flex; align-items: center; justify-content: center; border-left: 1px solid var(--kf-line); border-right: 1px solid var(--kf-line); }
  .spine b { writing-mode: vertical-lr; font: 800 5vh/1 var(--kf-font-display); text-transform: uppercase; }
  .book > div { width: 60vh; padding: 4vh; }
  .book p { margin-top: 2vh; }
</style>
</head>
<body>
<p class="demo-hint"><b>spine-shelf-open</b> — Press the spine to open the book, press again to close it.</p>
<div class="shelf">
  <div data-fx="spine-shelf-open"><div class="spine" data-fx-part="spine"><b>Project One</b></div><div class="book" data-fx-part="book"><div><b>Open book</b><p>Your two-line description goes here.</p></div></div></div>
  <div data-fx="spine-shelf-open" data-demo-remove><div class="spine" data-fx-part="spine"><b>Project Two</b></div><div class="book" data-fx-part="book"><div><b>Open book</b><p>Erased after 2.5s.</p></div></div></div>
  <div data-fx="spine-shelf-open" data-fx-spine-shelf-open="single: 1" style="--fx-open: 50vh"><div class="spine" data-fx-part="spine"><b>Project Three</b></div><div class="book" data-fx-part="book"><div><b>Spreads narrower</b></div></div></div>
  <div data-fx="spine-shelf-open"></div>
</div>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => {
  const late = document.createElement("div");
  late.setAttribute("data-fx", "spine-shelf-open");
  late.innerHTML = '<div class="spine" data-fx-part="spine"><b>Late Book</b></div><div class="book" data-fx-part="book"><div><b>Late-attached Book</b></div></div>';
  document.querySelector(".shelf").append(late);
}, 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
