<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fluid-gradient-gl — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 10; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { display: grid; gap: 40px; padding: 40px; }
  .demo [data-fx] { height: 60vh; border-radius: var(--kf-radius-md); }
</style>
</head>
<body>
<p class="demo-hint"><b>fluid-gradient-gl</b> — Sweep the mouse quickly across the board. <span style="color:var(--kf-dim)">(After 1s one more panel comes in, and one leaves 2.5s later)</span></p>
<section class="demo">
  <div data-fx="fluid-gradient-gl"></div>
  <div data-demo-remove data-fx="fluid-gradient-gl" data-fx-fluid-gradient-gl="brush: 40; speed: .3; c4: .1 .1 .1" style="height:30vh"></div>
  <template data-demo-late><div data-fx="fluid-gradient-gl" data-fx-fluid-gradient-gl="force: 20; decay: .99" style="height:30vh"></div></template>
</section>
<script src="../pillar-gallery-gl/three-global.js"></script>
<script src="../../_vendor/three@0.181.0/build/three.cjs"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
