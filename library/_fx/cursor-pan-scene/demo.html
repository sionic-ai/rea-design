<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cursor-pan-scene — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { padding: 48px 20px; }
  .demo-spacer { height: 70vh; display: grid; place-items: center; color: var(--kf-dim); }
  .demo-card { height: 420px; padding: 32px; border: 1px solid var(--kf-line); border-radius: var(--kf-radius-sm); background: var(--kf-surface); font: 700 32px/1.1 var(--kf-font-display); }
  .demo-card:nth-child(2n) { background: var(--kf-accent); color: var(--kf-on-accent); }
  .demo-chip { padding: 16px 24px; margin-right: 12px; border: 1px solid var(--kf-line); border-radius: var(--kf-radius-md); background: var(--kf-surface); font: 700 28px/1 var(--kf-font-display); white-space: nowrap; }
  .demo-scene svg { width: 100%; height: 100%; }
  .demo-actor { position: absolute; width: 140px; height: 140px; border-radius: 50%; background: var(--kf-accent); display: grid; place-items: center; font-weight: 700; }
  
</style>
</head>
<body>
<p class="demo-hint"><b>cursor-pan-scene</b> — Move the mouse left and right over the lower panel. The panel is pushed the opposite way, and lifts when you hover the circle.</p>
<section class="demo">
<div data-fx="cursor-pan-scene" style="height: 420px; background: var(--kf-accent-soft)">
  <div class="demo-scene" data-fx-part="scene" style="width: 1800px; height: 420px">
    <svg viewBox="0 0 1800 420" preserveAspectRatio="none"><path d="M0 200 C300 80 600 120 900 220 S1500 300 1800 160" fill="none" stroke="currentColor" stroke-width="3"/><path d="M0 330 C400 250 800 300 1200 360 S1600 280 1800 320" fill="none" stroke="currentColor" stroke-width="3"/></svg>
    <div class="demo-actor" data-fx-part="actor" style="left: 18%; top: 40%; --fx-tilt: 2.5deg">One</div>
    <div class="demo-actor" data-fx-part="actor" style="left: 70%; top: 30%; --fx-tilt: -3deg">Both</div>
  </div>
</div>
</section>
<script>
// Late arrivals and removals — checks that fx-core attaches to an element added after 1s and detaches from an element removed after 2.5s
(() => {
  const src = document.querySelector('[data-fx~="cursor-pan-scene"]');
  if (!src) return;
  const html = src.outerHTML.replace(/\sid="[^"]*"/g, "");
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => (src.closest(".pin-spacer") || src).after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical one comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
