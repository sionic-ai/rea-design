<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>slice-widen-hover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { padding: 32px 20px; display: grid; gap: 24px; }
  .panel { height: 70vh; background: var(--kf-contrast-bg); color: var(--kf-contrast-ink); }
  .panel [data-fx-part="image"] { position: absolute; inset: 0 -20%; }
  .panel [data-fx-part="image"] .wf-img { height: 100%; }
  .panel [data-fx-part="small"], .panel [data-fx-part="big"] { z-index: 2; margin: 0; }
  .panel [data-fx-part="big"] { font-size: 48px; }
  @media (max-width: 899px) { .panel { height: auto; } .panel > [data-fx-part="slice"] { position: relative; height: 40vh; } }
</style>
</head>
<body>
<p class="demo-hint"><b>slice-widen-hover</b> — Hover over one of the three cells. That cell widens and the others fold to both ends and fade. <span style="color:var(--kf-dim)">(After 1s one more panel comes in, and one leaves 2.5s later)</span></p>
<main class="demo">
  <div class="panel" data-fx="slice-widen-hover">
    <a data-fx-part="slice" href="#"><div data-fx-part="image"><div class="wf-img" data-label="Photo 1"></div></div><p data-fx-part="small">Cell 1</p><p data-fx-part="big">Panel 1 large title</p></a>
    <a data-fx-part="slice" href="#"><div data-fx-part="image"><div class="wf-img" data-label="Photo 2"></div></div><p data-fx-part="small">Cell 2</p><p data-fx-part="big">Panel 2 large title</p></a>
    <a data-fx-part="slice" href="#"><div data-fx-part="image"><div class="wf-img" data-label="Photo 3"></div></div><p data-fx-part="small">Cell 3</p><p data-fx-part="big">Panel 3 large title</p></a>
  </div>
  <div class="panel" data-fx="slice-widen-hover" data-demo-remove>
    <a data-fx-part="slice" href="#"><div data-fx-part="image"><div class="wf-img" data-label="Panel to be removed soon"></div></div></a>
    <a data-fx-part="slice" href="#"><div data-fx-part="image"><div class="wf-img" data-label="Panel to be removed soon"></div></div></a>
  </div>
  <template data-demo-late><div class="panel" data-fx="slice-widen-hover" data-fx-slice-widen-hover="narrow: 10; dur: 0.8; blur: 6">
    <a data-fx-part="slice" href="#"><div data-fx-part="image"><div class="wf-img" data-label="Late-arriving panel 1"></div></div><p data-fx-part="small">1 of 4</p></a>
    <a data-fx-part="slice" href="#"><div data-fx-part="image"><div class="wf-img" data-label="Late-arriving panel 2"></div></div><p data-fx-part="small">2 of 4</p></a>
    <a data-fx-part="slice" href="#"><div data-fx-part="image"><div class="wf-img" data-label="Late-arriving panel 3"></div></div><p data-fx-part="small">3 of 4</p></a>
    <a data-fx-part="slice" href="#"><div data-fx-part="image"><div class="wf-img" data-label="Late-arriving panel 4"></div></div><p data-fx-part="small">4 of 4</p></a>
  </div></template>
</main>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
