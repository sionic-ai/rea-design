<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sprite-hotspot-map — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .wrap { max-width: 900px; margin: 40px auto; padding: 0 20px; }
  .map { position: relative; min-width: 640px; aspect-ratio: 1300 / 896; background: var(--kf-surface); border-radius: var(--kf-radius-lg); }
  .map > svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .ground { fill: var(--kf-accent-soft); }
  .bob { fill: var(--kf-accent); }
  .roof { fill: var(--kf-ink-soft); }
  .nav { display: flex; gap: 8px; justify-content: flex-end; margin-top: 8px; }
  [data-fx-part="modal"] { background: color-mix(in oklab, var(--kf-bg) 70%, transparent); }
  [data-fx-part="card"] { position: relative; width: min(375px, 100%); padding: 24px; background: var(--kf-surface); box-shadow: var(--kf-shadow-lift); }
  [data-fx-part="track"] article { padding: 8px 0; }
  .ctrl { display: flex; justify-content: space-between; margin-top: 12px; }
  [data-fx-part="close"] { position: absolute; top: 6px; right: 6px; }
</style>
</head>
<body>
<p class="demo-hint"><b>sprite-hotspot-map</b> — Click a wiggling spot on the map. The card for that spot opens. <span style="color:var(--kf-dim)">(After 1s one more map comes in, and after 2s one leaves)</span></p>
<div class="wrap" data-fx="sprite-hotspot-map" data-fx-sprite-hotspot-map="start: left">
  <div data-fx-part="pan">
    <div class="map">
      <svg viewBox="0 0 1300 896"><path class="ground" d="M650 120 1240 460 650 800 60 460Z"/></svg>
      <button type="button" data-fx-part="spot" aria-label="Open slot 1" style="left:14%;top:38%;width:18%;height:26%;--fx-frames:3;--fx-dur:.6s">
        <span data-fx-part="strip"><svg viewBox="0 0 300 100" width="100%" height="100%" preserveAspectRatio="none"><rect class="bob" x="30" y="40" width="40" height="50"/><rect class="bob" x="130" y="30" width="40" height="60"/><rect class="bob" x="230" y="20" width="40" height="70"/></svg></span>
      </button>
      <button type="button" data-fx-part="spot" aria-label="Open slot 2" style="left:52%;top:20%;width:22%;height:30%;--fx-frames:4;--fx-dur:.8s;--fx-badge-y:-20%">
        <span data-fx-part="strip"><svg viewBox="0 0 400 100" width="100%" height="100%" preserveAspectRatio="none"><path class="roof" d="M10 60 50 20 90 60Z"/><path class="roof" d="M110 55 150 15 190 55Z"/><path class="roof" d="M210 50 250 10 290 50Z"/><path class="roof" d="M310 55 350 15 390 55Z"/></svg></span>
      </button>
    </div>
  </div>
  <div class="nav"><button type="button" data-fx-part="pan-prev">←</button><button type="button" data-fx-part="pan-next">→</button></div>
  <div data-fx-part="modal">
    <div data-fx-part="card">
      <div><div data-fx-part="track"><article><h3>Seat 1</h3><p>Add a two-line facility description here.</p></article><article><h3>Seat 2</h3><p>Add a two-line facility description here.</p></article></div></div>
      <div class="ctrl"><button type="button" data-fx-part="prev">Previous</button><button type="button" data-fx-part="next">Next</button></div>
      <button type="button" data-fx-part="close" aria-label="Close">×</button>
    </div>
  </div>
</div>
<div data-demo-remove data-fx="sprite-hotspot-map"></div>
<template data-demo-late><div class="wrap" data-fx="sprite-hotspot-map"><div class="map" style="min-width:0;aspect-ratio:3/1"><button type="button" data-fx-part="spot" aria-label="Late-arrived spot" style="left:40%;top:20%;width:20%;height:60%;--fx-frames:2;--fx-dur:.4s"><span data-fx-part="strip"><svg viewBox="0 0 200 100" width="100%" height="100%"><circle class="bob" cx="50" cy="60" r="30"/><circle class="bob" cx="150" cy="40" r="30"/></svg></span></button></div></div></template>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2000);
</script>
</body>
</html>
