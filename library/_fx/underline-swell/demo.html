<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>underline-swell — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { display: flex; flex-wrap: wrap; gap: 32px; padding: 48px 20px; font-size: 20px; font-weight: 600; }
  .demo a { color: inherit; }
</style>
</head>
<body>
<p class="demo-hint"><b>underline-swell</b> — Hover over a link. The underline swells into a thick band.</p>
<nav class="demo"><a data-fx="underline-swell" href="#">Menu 1</a><a data-fx="underline-swell" href="#">Menu 2</a><a data-fx="underline-swell" href="#" style="--fx-fill: linear-gradient(90deg, var(--kf-accent), var(--kf-accent-soft))">Menu 3 Band switch</a></nav>
<script>
// Late arrivals and removals — as a css part, it applies the same to what comes in after 1s, and nothing remains after removal
(() => {
  const src = document.querySelector('[data-fx~="underline-swell"]');
  if (!src) return;
  const row = src.parentElement, gone = src.cloneNode(true);
  src.after(gone);
  setTimeout(() => { const late = src.cloneNode(true); late.textContent = "Late-arrived Link"; row.append(late); }, 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s one more link comes in, and after 2.5s one drops out.");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
</body>
</html>
