<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>word-fade-loader — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .page { display: grid; place-items: center; height: 70vh; font-size: 28px; }
  .box { position: relative; height: 200px; margin: 20px; border: 1px solid var(--kf-line); }
  .box [data-fx~="word-fade-loader"] { position: absolute; z-index: 1; }
</style>
</head>
<body>
<p class="demo-hint"><b>word-fade-loader</b> — Refresh the page. Three words light up in turn, the curtain lifts at 3.4s, then the body copy brightens over 2 seconds. <span style="color:var(--kf-dim)">(After 1s one more small panel comes in, and after 2.5s one leaves)</span></p>
<div data-fx="word-fade-loader" data-fx-word-fade-loader="reveal: .page"><p><span data-fx-part="word">your</span> <span data-fx-part="word">three</span> <span data-fx-part="word">words</span></p></div>
<main class="page">Page behind the curtain</main>
<div class="box" data-demo-remove><div data-fx="word-fade-loader" data-fx-word-fade-loader="hold: 2"><p><span data-fx-part="word">one</span> <span data-fx-part="word">two</span></p></div></div>
<template data-demo-late><div class="box"><div data-fx="word-fade-loader" data-fx-word-fade-loader="hold: 3; step: .3"><p><span data-fx-part="word">late</span> <span data-fx-part="word">words</span></p></div></div></template>
<div class="box"><div data-fx="word-fade-loader" data-fx-word-fade-loader="hold: 4"></div></div>

<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
