<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>scroll-dir-marquee — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); overflow-x: hidden; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo-spacer { height: 70vh; display: grid; place-items: center; color: var(--kf-dim); }
  .row { margin: 24px 0; }
  .row [data-fx-part="set"] { gap: 6rem; padding-left: 6rem; font: 500 max(3em, 7vw)/1.15 var(--kf-font-display); white-space: nowrap; }
  .row svg { width: 1em; height: 1em; color: var(--kf-accent); }
  .row p { color: var(--kf-dim); }
</style>
</head>
<body>
<p class="demo-hint"><b>scroll-dir-marquee</b> — Scroll up and down — the band flows in reverse following scroll direction and the arrow turns. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<div class="demo-spacer">Downward</div>
<div class="row" data-fx="scroll-dir-marquee"><div data-fx-part="track"><div data-fx-part="set"><svg data-fx-part="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M4 12h15M13 5.5 19.5 12 13 18.5"/></svg><p>Your slogan here.</p></div></div></div>
<div class="row" data-demo-remove data-fx="scroll-dir-marquee" data-fx-scroll-dir-marquee="dir: right; speed: 25"><div data-fx-part="track"><div data-fx-part="set"><p>Band to Be Removed</p></div></div></div>
<template data-demo-late><div class="row" data-fx="scroll-dir-marquee" data-fx-scroll-dir-marquee="dir: right; speed: 25"><div data-fx-part="track"><div data-fx-part="set"><p>Delayed band · right</p></div></div></div></template>
<div class="demo-spacer">Slide it up</div>
<div class="demo-spacer">Footer</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); window.ScrollTrigger?.refresh(); }, 2500);
</script>
</body>
</html>
