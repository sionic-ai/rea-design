<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>run-line-tail — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { padding: 48px 20px; display: grid; gap: 36px; font: 300 22px/1.4 var(--kf-font-display); letter-spacing: .075em; }
  .demo p { display: flex; align-items: center; gap: 1em; }
</style>
</head>
<body>
<p class="demo-hint"><b>run-line-tail</b> — Hover over “view more” — a bar passes inside the line. The line before the subtitle below always flows. <span style="color:var(--kf-dim)">(After 1s one more link comes in, and after 2.5s one drops out)</span></p>
<section class="demo">
  <a data-fx="run-line-tail" href="#">view more<span data-fx-part="tail" aria-hidden="true"></span></a>
  <a data-fx="run-line-tail" href="#" style="--fx-len: 200px" data-demo-remove>about this work<span data-fx-part="tail" aria-hidden="true"></span></a>
  <p><span data-fx="run-line-tail" data-fx-run-line-tail="look: always" aria-hidden="true"></span>Your subtitle line here</p>
  <a data-fx="run-line-tail" href="#"></a>
  <template data-demo-late><a data-fx="run-line-tail" href="#">contact<span data-fx-part="tail" aria-hidden="true"></span></a></template>
</section>
<script src="../fx-core.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
