<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>corner-promo-close — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); min-height: 200vh; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .promo { position: fixed; right: 32px; bottom: 32px; width: 320px; display: flex; flex-direction: column; align-items: flex-end; z-index: 10; }
  .promo.is-left { right: auto; left: 32px; align-items: flex-start; }
  .promo button { width: 24px; height: 24px; margin: 0 0 4px; padding: 0; border: 0; background: none; color: var(--kf-ink); cursor: pointer; font-size: 20px; line-height: 24px; }
  .promo a { width: 100%; border-radius: var(--kf-radius-md); box-shadow: var(--kf-shadow-soft); }
  .promo .wf-img { display: block; height: 200px; border: 0; }
</style>
</head>
<body>
<p class="demo-hint"><b>corner-promo-close</b> — Hover the card at bottom right (1.04×), hovering × spins it, and pressing it collapses the card. After 1 second one is added on the left, and after 2.5 seconds one empty element is removed.</p>
<aside class="promo" data-fx="corner-promo-close">
  <button type="button" data-fx-part="close" aria-label="Close">×</button>
  <a href="#" data-fx-part="card"><span class="wf-img" data-label="Promo graphic · Horizontal 16:10"></span></a>
</aside>
<aside class="promo" data-fx="corner-promo-close" data-demo-remove></aside>
<template data-demo-late>
  <aside class="promo is-left" data-fx="corner-promo-close" data-fx-corner-promo-close="fold: .6" style="--fx-scale: 1.08">
    <button type="button" data-fx-part="close" aria-label="Close">×</button>
    <a href="#" data-fx-part="card"><span class="wf-img" data-label="Late card · fold .6s"></span></a>
  </aside>
</template>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
