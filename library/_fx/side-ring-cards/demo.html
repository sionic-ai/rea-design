<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>side-ring-cards — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .ring { height: 90vh; display: grid; place-items: center; }
  .ring [data-fx-part="card"] { background: var(--kf-surface); border: 1px solid var(--kf-line); }
  .ring h2 { position: relative; font: var(--kf-weight-display) 40px/1.1 var(--kf-font-display); text-align: center; }
  .pad { height: 60vh; }
</style>
</head>
<body>
<p class="demo-hint"><b>side-ring-cards</b> — Look closely and the rings on both sides spin, scroll to make them spin more.</p>
<section class="ring" data-fx="side-ring-cards">
  <div data-fx-part="card"></div><div data-fx-part="card"></div><div data-fx-part="card"></div><div data-fx-part="card"></div><div data-fx-part="card"></div><div data-fx-part="card"></div><div data-fx-part="card"></div><div data-fx-part="card"></div>
  <div data-fx-part="card"></div><div data-fx-part="card"></div><div data-fx-part="card"></div><div data-fx-part="card"></div><div data-fx-part="card"></div><div data-fx-part="card"></div><div data-fx-part="card"></div><div data-fx-part="card"></div>
  <h2>Centered closing title</h2>
</section>
<div class="pad"></div>
<script>
(() => {
  const src = document.querySelector('[data-fx~="side-ring-cards"]');
  if (!src) return;
  const html = src.outerHTML;
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => src.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical one comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
