<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>marker-rise-title — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .stage { padding: 48px 20px; }
  .big { font: 400 64px/1.1 var(--kf-font-display); }
  .big [data-fx-part="line"] { padding: 8px 12px 1px; margin-bottom: 6px; }
  .spacer { height: 110vh; display: grid; place-items: center; color: var(--kf-dim); }
</style>
</head>
<body>
<p class="demo-hint"><b>marker-rise-title</b> — The first heading plays on every open, lower headings when scrolled into view: the letters rise and 1s later the band is painted. Scroll up and down again to repaint.</p>
<div class="stage">
  <h1 class="big" data-fx="marker-rise-title" data-fx-marker-rise-title="on: load"><span data-fx-part="line">Your title here</span><span data-fx-part="line">Second row</span></h1>
  <h2 class="big" data-fx="marker-rise-title" data-demo-remove><span data-fx-part="line">Being removed soon</span></h2>
</div>
<div class="spacer">Try scrolling down</div>
<div class="stage" id="late">
  <h2 class="big" data-fx="marker-rise-title"><span data-fx-part="line">Scroll Title</span></h2>
  <p data-fx="marker-rise-title" style="font-size: 24px">Single line with no line mark</p>
</div>
<div class="spacer"></div>
<script>
// Late arrivals·removals — add one more title after 1 second, remove one after 2.5 seconds
setTimeout(() => document.getElementById("late").insertAdjacentHTML("beforeend", '<h2 class="big" data-fx="marker-rise-title"><span data-fx-part="line">Late-arrived title</span></h2>'), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); window.ScrollTrigger?.refresh(); }, 2500);
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
