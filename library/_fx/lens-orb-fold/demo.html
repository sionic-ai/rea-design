<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lens-orb-fold — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { margin: 0; background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: fixed; top: 0; left: 0; right: 0; z-index: 100; margin: 0; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .fold { position: relative; height: 260vh; }
  .fold [data-fx-part="stage"] { height: 100vh; }
  .fold canvas[data-fx-part="source"] { position: absolute; inset: 0; width: 100%; height: 100%; }
  .rest { display: grid; gap: 24px; padding: 80px 20px 60vh; }
</style>
</head>
<body>
<p class="demo-hint"><b>lens-orb-fold</b> — Scroll down. The pattern covering the screen shrinks into a 260px (180px on phones) lens bead, its edges bending and glowing.</p>
<section class="fold" data-fx="lens-orb-fold" data-fx-lens-orb-fold="size: 260; size-narrow: 180; zoom: 0.34; span: 0.42">
  <div data-fx-part="stage"><canvas data-fx-part="source" aria-hidden="true"></canvas></div>
</section>
<div class="rest"><p>Your next section text line here.</p></div>
<script>
// Source canvas: draws round patterns drifting in the Skin color (on the site these are the three scene, photo and video slots)
(() => {
  const draw = (cv) => {
    const g = cv.getContext("2d"), cs = getComputedStyle(document.documentElement);
    const bg = cs.getPropertyValue("--kf-accent").trim(), fg = cs.getPropertyValue("--kf-accent-soft").trim(), ink = cs.getPropertyValue("--kf-surface").trim();
    const frame = (t) => {
      if (!cv.isConnected) return;
      cv.width = cv.clientWidth; cv.height = cv.clientHeight;
      g.fillStyle = bg; g.fillRect(0, 0, cv.width, cv.height);
      for (let i = 0; i < 40; i++) {
        const x = ((i * 137) % 100) / 100 * cv.width, y = ((i * 71) % 100) / 100 * cv.height + Math.sin(t / 900 + i) * 8;
        g.fillStyle = i % 7 ? fg : ink; g.globalAlpha = i % 7 ? 0.35 : 0.9;
        g.beginPath(); g.arc(x, y, 30 + (i % 5) * 18, 0, Math.PI * 2); g.fill();
      }
      g.globalAlpha = 1;
      requestAnimationFrame(frame);
    };
    requestAnimationFrame(frame);
  };
  document.querySelectorAll("canvas[data-fx-part=source]").forEach(draw);
  // Late arrivals and removals — checks that fx-core attaches to an element added after 1s and detaches from an element removed after 2.5s
  const host = document.querySelector(".fold"), html = host.outerHTML, rest = document.querySelector(".rest");
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  rest.prepend(gone);
  draw(gone.querySelector("canvas"));
  setTimeout(() => { const late = make("late"); rest.append(late); draw(late.querySelector("canvas")); }, 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical panel comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script>gsap.registerPlugin(ScrollTrigger);</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
