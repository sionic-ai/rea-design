<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>wave-edge-media-gl — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); color: var(--kf-ink); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { padding: 60px 10vw 120vh; display: grid; gap: 12vh; }
  .demo > * { width: min(70vw, 720px); }
</style>
</head>
<body>
<p class="demo-hint"><b>wave-edge-media-gl</b> — Scroll fast and the panel edges ripple, hover and they sway slightly. <span>(After 1s one more panel comes in, and one leaves 2.5s later)</span></p>
<section class="demo">
  <div data-fx="wave-edge-media-gl" data-label="Work screen recording · 16:9"></div>
  <div data-demo-remove data-fx="wave-edge-media-gl" data-label="Panel that drops out after 2.5s"></div>
  <div data-fx="wave-edge-media-gl" data-fx-wave-edge-media-gl="amp: .12; hover: .04" data-label="Double Ripple"></div>
  <template data-demo-late><div data-fx="wave-edge-media-gl" data-label="Late-arriving panel"></div></template>
</section>
<script src="three-global.js"></script>
<script src="../../_vendor/three@0.185.0/build/three.cjs"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
