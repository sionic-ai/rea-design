<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>alt-photo-hover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { padding: 48px 20px; }
  .grid { display: grid; grid-template-columns: repeat(3, 280px); gap: 24px; }
  .card { display: block; border: 1px solid var(--kf-line); border-radius: var(--kf-radius-md); overflow: hidden; background: var(--kf-surface); }
  [data-fx-part="frame"] { aspect-ratio: 1; background: var(--kf-raised); }
  [data-fx-part="main"], [data-fx-part="alt"] { display: grid; place-items: center; width: 100%; height: 100%; color: var(--kf-dim); }
  [data-fx-part="alt"] { background: var(--kf-accent-soft); color: var(--kf-accent-text); }
  .card h3 { padding: 16px; font-size: 16px; }
</style>
</head>
<body>
<p class="demo-hint"><b>alt-photo-hover</b> — Hover over the card (even over the text side). <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<section class="demo"><div class="grid">
  <a data-demo-remove class="card" data-fx="alt-photo-hover" href="#"><div data-fx-part="frame"><div data-fx-part="main">Product cutout</div><div data-fx-part="alt">Worn shot</div></div><h3>Product 01</h3></a>
  <a class="card" data-fx="alt-photo-hover" href="#"><div data-fx-part="frame"><div data-fx-part="main">Product cutout</div><div data-fx-part="alt">Other Angle</div></div><h3>Product 02</h3></a>
  <template data-demo-late><a class="card" data-fx="alt-photo-hover" href="#"><div data-fx-part="frame"><div data-fx-part="main">Product cutout</div><div data-fx-part="alt">Enters late</div></div><h3>Product 03</h3></a></template>
  <a class="card" data-fx="alt-photo-hover" style="--fx-dur: .8s" href="#"><div data-fx-part="frame"><div data-fx-part="main">Product cutout</div><div data-fx-part="alt">Slow (.8s)</div></div><h3>Product 04</h3></a>
  <a class="card" data-fx="alt-photo-hover" href="#"><div data-fx-part="frame"><div data-fx-part="main">Second photo: none</div></div><h3>Product 05</h3></a>
</div></section>

<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
