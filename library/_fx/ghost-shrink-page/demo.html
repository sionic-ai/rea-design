<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ghost-shrink-page — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 500 15px/1.6 var(--kf-font-sans); margin: 0; }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  main { padding: 40px 20px; min-height: 100vh; }
  h1 { font: 500 64px/1 var(--kf-font-display); letter-spacing: -0.05em; margin-bottom: 24px; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-top: 32px; }
  .grid .wf-img { aspect-ratio: 4 / 3; }
  a.go { text-decoration: underline; }
</style>
</head>
<body>
<p class="demo-hint"><b>ghost-shrink-page</b> — Click the link below. The screen shrinks and darkens and a curtain covers it, then the same demo reopens and the body rises from below. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<main data-fx="ghost-shrink-page" id="page">
  <h1>Your page title here</h1>
  <p><a class="go" href="demo.html?again=1">Go to another page</a></p>
  <div class="grid"><div class="wf-img" data-label="Photo 1"></div><div class="wf-img" data-label="Photo 2"></div><div class="wf-img" data-label="Photo 3"></div></div>
</main>
<section data-fx="ghost-shrink-page" data-demo-remove style="display:none"></section>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => { const s = document.createElement("section"); s.dataset.fx = "ghost-shrink-page"; s.dataset.fxGhostShrinkPage = "out: 0.4"; s.style.display = "none"; document.body.append(s); }, 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
