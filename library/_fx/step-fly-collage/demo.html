<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>step-fly-collage — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 2; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .stage { height: 80vh; margin: 20px; border-radius: var(--kf-radius-md); background: var(--kf-accent); color: var(--kf-on-accent); }
  .band { position: absolute; left: 0; bottom: 6%; font: 700 clamp(60px, 12vw, 160px)/1 var(--kf-font-display); white-space: nowrap; opacity: .9; }
  .title { position: absolute; left: 8%; top: 30%; margin: 0; font: 800 clamp(26px, 4vw, 52px)/1.4 var(--kf-font-display); }
  .piece { position: absolute; display: grid; place-items: center; border: 6px solid var(--kf-surface); border-radius: 50% 50% 12px 12px; background: var(--kf-ink); color: var(--kf-bg); font: 600 12px/1 var(--kf-font-mono); }
  .tag { position: absolute; font: 700 16px/1 var(--kf-font-display); color: var(--kf-surface); transform: rotate(-12deg); }
</style>
</head>
<body>
<p class="demo-hint"><b>step-fly-collage</b> On open, pieces fly in with a clunk, the title pops, and a band slides in. Reload to see it again. <span style="color:var(--kf-dim)">(After 1s one more panel comes in, and after 2s one leaves)</span></p>
<section class="stage" data-fx="step-fly-collage">
  <p class="band" data-fx-part="band">RECRUIT RECRUIT</p>
  <h2 class="title" data-fx-part="title">Gather here<br>Large two-line title</h2>
  <span class="piece" data-fx-part="piece" data-from="0 100" style="left:52%;top:18%;width:16%;height:40%">Person</span>
  <span class="piece" data-fx-part="piece" data-from="30 0" style="left:72%;top:8%;width:12%;height:22%">Castle</span>
  <span class="piece" data-fx-part="piece" data-from="10 -30 45" style="left:40%;top:56%;width:10%;height:30%">Jump</span>
  <span class="piece" data-fx-part="piece" data-from="0 -50" style="left:8%;top:8%;width:14%;height:16%">Food</span>
  <span class="piece" data-fx-part="piece" data-from="-30 -30" style="left:80%;top:48%;width:12%;height:34%">Both</span>
  <span class="tag" data-fx-part="after" style="left:36%;top:52%">Sales</span>
</section>
<section class="stage" data-fx="step-fly-collage" data-fx-step-fly-collage="dur: .8; steps: 3; each: 0; gap: .3" data-demo-remove>
  <h2 class="title" data-fx-part="title">Dropping panel</h2>
  <span class="piece" data-fx-part="piece" style="left:50%;top:20%;width:20%;height:50%">One</span>
</section>
<template data-demo-late><section class="stage" data-fx="step-fly-collage" data-fx-step-fly-collage="steps: 8"><h2 class="title" data-fx-part="title">Late-arriving panel</h2><span class="piece" data-fx-part="piece" data-from="-30 30" style="left:56%;top:20%;width:16%;height:50%">Late</span><span class="piece" data-fx-part="piece" style="left:76%;top:30%;width:12%;height:40%">Both</span></section></template>
<section class="stage" data-fx="step-fly-collage"></section>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2000);
</script>
</body>
</html>
