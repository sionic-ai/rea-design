<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cursor-quip — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); min-height: 120vh; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .row { display: flex; gap: 20px; padding: 40px 20px; flex-wrap: wrap; }
  .row a, .row button, .card { padding: 14px 20px; border: 1px solid var(--kf-line); border-radius: var(--kf-radius-md); background: var(--kf-surface); }
  .card { width: 240px; height: 160px; }
</style>
</head>
<body data-fx="cursor-quip" data-fx-cursor-quip="hello: Welcome|Take your time looking around; idleText: Still there?|What shall we look at?; idle: 4000">
<p class="demo-hint"><b>cursor-quip</b> — Move the mouse. A dot follows and speaks over links, buttons and cards. After 4 seconds idle, it talks to itself. <span style="color:var(--kf-dim)">(One more card comes in after 1s, and one drops out after 2.5s)</span></p>
<div class="row">
  <a href="#">Plain link</a>
  <button type="button">Button</button>
  <a href="#" data-label="Don’t miss this">Label link</a>
  <div class="card" data-fx-part="quip" data-label="View work" data-key="accent">Accent card</div>
  <div class="card" data-fx-part="quip" data-label="Hello!" data-key="paper" data-demo-remove>White card (omitted)</div>
  <template data-demo-late><div class="card" data-fx-part="quip" data-label="It arrived late">Late-added Card</div></template>
</div>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); }, 2500);
</script>
</body>
</html>
