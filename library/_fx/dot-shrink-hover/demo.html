<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dot-shrink-hover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { margin: 0; padding: 12px 20px; border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .row { display: flex; flex-wrap: wrap; gap: 32px; justify-content: center; margin: 80px auto; }
  .btn { display: flex; align-items: center; justify-content: center; width: 240px; height: 46px; border-radius: var(--kf-radius-pill); font: 700 18px/1 var(--kf-font-display); letter-spacing: .05em; }
  .btn--sm { width: 108px; height: 32px; font-size: 14px; --fx-dot: 8px; --fx-dot-x: 14px; --fx-arrow: 6px; --fx-arrow-x: 10.5px; }
</style>
</head>
<body>
<p class="demo-hint"><b>dot-shrink-hover</b> — Hover over the button (1024px and up). The fill shrinks into the dot on the right.</p>
<div class="row" id="row">
  <a class="btn" href="#" data-fx="dot-shrink-hover"><span data-fx-part="text">READ MORE</span></a>
  <a class="btn" href="#" data-fx="dot-shrink-hover" style="--fx-fill: var(--kf-accent); --fx-on: var(--kf-on-accent)"><span data-fx-part="text">BUY NOW</span></a>
  <a class="btn btn--sm" href="#" data-fx="dot-shrink-hover" style="--fx-fill: var(--kf-accent); --fx-on: var(--kf-on-accent)"><span data-fx-part="text">CONTACT</span></a>
  <a class="btn gone" href="#" data-fx="dot-shrink-hover"><span data-fx-part="text">Button to be removed soon</span></a>
</div>
<script>
setTimeout(() => { const a = document.createElement("a"); a.className = "btn"; a.href = "#"; a.dataset.fx = "dot-shrink-hover"; a.innerHTML = '<span data-fx-part="text">LATE</span>'; document.getElementById("row").append(a); }, 1000);
setTimeout(() => document.querySelector(".gone")?.remove(), 2500);
</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
