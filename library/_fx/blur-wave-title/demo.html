<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>blur-wave-title — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { padding: 20vh 20px; text-align: center; }
  .demo-spacer { height: 80vh; display: grid; place-items: center; color: var(--kf-dim); }
  .t { margin: 0 0 80px; font: 700 64px/1 var(--kf-font-display); text-transform: uppercase; letter-spacing: -0.03em; }
</style>
</head>
<body>
<p class="demo-hint"><b>blur-wave-title</b> — The title letters sharpen out of a blur, and after 3 seconds a blur wave passes from the left. <span style="color:var(--kf-dim)">(One more title comes in after 1s, and one drops out after 2.5s)</span></p>
<section class="demo">
  <h2 class="t" data-fx="blur-wave-title" data-fx-blur-wave-title="on: load"><span data-fx-part="line">Who do you want</span><span data-fx-part="line">to be today?</span></h2>
  <div class="demo-spacer">Downward</div>
  <h2 class="t" data-demo-remove data-fx="blur-wave-title">Soon-Removed Title</h2>
  <template data-demo-late><h2 class="t" data-fx="blur-wave-title" data-fx-blur-wave-title="step: .2; blur: 8">Late-arriving title</h2></template>
  <h2 data-fx="blur-wave-title"></h2>
  <div class="demo-spacer">Footer</div>
</section>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); window.ScrollTrigger?.refresh(); }, 2500);
</script>
</body>
</html>
