<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>drip-curtain-reveal — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { display: grid; gap: 32px; padding: 32px 20px; }
  .demo-stage { height: 70vh; border-radius: 16px; background: var(--kf-surface); display: flex; align-items: center; justify-content: center; }
  .demo-stage h2 { font: 800 64px/1 var(--kf-font-display); color: var(--kf-accent); text-align: center; }
  .demo-small { height: 40vh; }
  .demo-stage .wf-img { position: absolute; inset: 20%; height: auto; }
</style>
</head>
<body>
<p class="demo-hint"><b>drip-curtain-reveal</b> — On open the curtain covers from the left, a bubble grows and then lifts upward, revealing the panel behind (refresh to replay). <span style="color:var(--kf-dim)">(After 1s one more panel comes in, and one leaves 2.5s later)</span></p>
<main class="demo">
  <section class="demo-stage" data-fx="drip-curtain-reveal"><div class="wf-img" data-label="Product stage revealed behind the curtain"></div><h2 data-fx-part="title">Your big title here<br>Two lines</h2></section>
  <section class="demo-stage demo-small" data-fx="drip-curtain-reveal" data-fx-drip-curtain-reveal="dur: 3; rise: .6; lift: 1.2; sweep: 0; drips: 9" data-demo-remove><div class="wf-img" data-label="Quick curtain · no cover-in"></div></section>
  <section class="demo-stage demo-small" data-fx="drip-curtain-reveal" data-fx-drip-curtain-reveal="delay: 1"></section>
  <template data-demo-late><section class="demo-stage demo-small" data-fx="drip-curtain-reveal"><div class="wf-img" data-label="Late-arriving panel"></div></section></template>
</main>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
