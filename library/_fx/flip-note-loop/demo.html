<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>flip-note-loop — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 2; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .row { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 40px; padding: 80px 40px; }
  .card { width: min(320px, 80vw); aspect-ratio: 3 / 2; border-radius: var(--kf-radius-md); }
  .card .wf-img { width: 100%; height: 100%; }
  .speech { position: absolute; top: -28px; left: 8%; right: 8%; padding: 8px 12px; border: 2px solid var(--kf-ink); border-radius: 99px; background: var(--kf-surface); text-align: center; }
  .illust { position: absolute; left: 0; bottom: -24px; width: 120px; height: 120px; fill: none; stroke: var(--kf-ink); stroke-width: 3; stroke-linecap: round; }
  .illust circle { fill: var(--kf-surface); }
</style>
</head>
<body>
<p class="demo-hint"><b>flip-note-loop</b> — Wait a moment. Photo cells flip at 2s and 3s intervals into speech-bubble cards and back. <span style="color:var(--kf-dim)">(After 1s one more cell comes in, and one leaves 2.5s later)</span></p>
<div class="row" id="row">
  <div class="card" data-fx="flip-note-loop" data-fx-flip-note-loop="every: 2"><div class="wf-img" data-label="Living room photo · landscape 3:2"></div><p class="speech" data-fx-part="back">Your lifestyle line here</p><svg class="illust" data-fx-part="back" viewBox="0 0 100 100"><circle cx="40" cy="24" r="9"/><path d="M40 33v26M40 42l-14 10M40 42l16-6M40 59l-12 22M40 59l10 22"/></svg></div>
  <div class="card" data-fx="flip-note-loop" data-fx-flip-note-loop="every: 3; dur: .6; tint: .6" style="--fx-tint: var(--kf-ink)"><div class="wf-img" data-label="Kitchen photo · landscape 3:2"></div><p class="speech" data-fx-part="back">Flips fast</p></div>
  <div class="card" data-fx="flip-note-loop" data-demo-remove><div class="wf-img" data-label="Dropped Cell"></div><p class="speech" data-fx-part="back">Omission</p></div>
</div>
<template data-demo-late><div class="card" data-fx="flip-note-loop" data-fx-flip-note-loop="every: 2; delay: 1"><div class="wf-img" data-label="Late cell"></div><p class="speech" data-fx-part="back">Late</p></div></template>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => document.getElementById("row").append(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
