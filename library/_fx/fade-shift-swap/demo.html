<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fade-shift-swap — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 16px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { display: flex; flex-wrap: wrap; gap: 32px; padding: 48px 20px; }
  .demo a { color: inherit; text-decoration: none; letter-spacing: .05em; }
</style>
</head>
<body>
<p class="demo-hint"><b>fade-shift-swap</b> — Hover over the menu text. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<nav class="demo">
  <a href="#" data-fx="fade-shift-swap"><span data-fx-part="label">Menu 1</span></a>
  <a href="#" data-fx="fade-shift-swap" data-demo-remove><span data-fx-part="label">Removed</span></a>
  <a href="#" data-fx="fade-shift-swap" data-fx-fade-shift-swap="look: soft"><span data-fx-part="label">Privacy Policy</span></a>
  <a href="#" data-fx="fade-shift-swap"><span data-fx-part="label">Your menu here</span></a>
  <template data-demo-late><a href="#" data-fx="fade-shift-swap"><span data-fx-part="label">Late</span></a></template>
</nav>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
