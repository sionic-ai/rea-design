<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>center-shrink-strip — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { margin: 0; background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.6 var(--kf-font-sans); }
  .demo-hint { margin: 0; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .orb { display: grid; place-items: center; background: var(--kf-accent-soft); color: var(--kf-dim); font-size: 13px; }
  .orb:nth-child(2n) { background: var(--kf-raised); }
  .gap { height: 40vh; }
</style>
</head>
<body>
<p class="demo-hint"><b>center-shrink-strip</b> — Round cells flow left, shrinking at the center and growing at the end. <span style="color:var(--kf-dim)">(After 1s one cell is added, and after 2.5s one row drops out)</span></p>
<div data-fx="center-shrink-strip" id="strip" style="--fx-h: 420px">
  <figure class="orb" data-fx-part="item">Cell 1</figure><figure class="orb" data-fx-part="item">Cell 2</figure><figure class="orb" data-fx-part="item">Cell 3</figure><figure class="orb" data-fx-part="item">Cell 4</figure><figure class="orb" data-fx-part="item">Cell 5</figure>
</div>
<div data-fx="center-shrink-strip" data-fx-center-shrink-strip="speed: 0; grow: 0.3" data-demo-remove><figure class="orb" data-fx-part="item">Dropped Line</figure></div>
<div data-fx="center-shrink-strip"></div>
<div class="gap"></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => {
  const s = document.getElementById("strip"); if (!s) return;
  const f = document.createElement("figure"); f.className = "orb"; f.dataset.fxPart = "item"; f.textContent = "Late cell";
  s.setAttribute("data-fx", ""); s.append(f); requestAnimationFrame(() => s.setAttribute("data-fx", "center-shrink-strip"));
}, 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
