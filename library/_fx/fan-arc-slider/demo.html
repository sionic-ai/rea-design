<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fan-arc-slider — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="../../_vendor/swiper@8.4.5/swiper-bundle.min.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.6 var(--kf-font-sans); margin: 0; overflow-x: hidden; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .stage { padding: 80px 0 200px; background: var(--kf-raised); }
  .card { padding: 0 0 20px; background: var(--kf-surface); text-align: center; }
  .card .wf-img { aspect-ratio: 1; }
  .card h3 { margin-top: 12px; font-size: 17px; }
</style>
</head>
<body>
<p class="demo-hint"><b>fan-arc-slider</b> — Cards line up tilted like a fan and roll one step every 8s. Drag to flip through. <span style="color:var(--kf-dim)">(After 1s one more panel comes in, and one leaves 2.5s later)</span></p>
<section class="stage">
  <div data-fx="fan-arc-slider"><div class="swiper" data-fx-part="track"><div class="swiper-wrapper">
    <article class="swiper-slide card"><div class="wf-img" data-label="Room 1"></div><h3>Your room 1 here</h3></article>
    <article class="swiper-slide card"><div class="wf-img" data-label="Room 2"></div><h3>Your room 2 here</h3></article>
    <article class="swiper-slide card"><div class="wf-img" data-label="Room 3"></div><h3>Your room 3 here</h3></article>
    <article class="swiper-slide card"><div class="wf-img" data-label="Room 4"></div><h3>Your room 4 here</h3></article>
    <article class="swiper-slide card"><div class="wf-img" data-label="Room 5"></div><h3>Your room 5 here</h3></article>
    <article class="swiper-slide card"><div class="wf-img" data-label="Room 6"></div><h3>Your room 6 here</h3></article>
  </div></div></div>
</section>
<section class="stage" data-demo-remove>
  <div data-fx="fan-arc-slider" data-fx-fan-arc-slider="rotate: 4; delay: 3000"><div class="swiper" data-fx-part="track"><div class="swiper-wrapper">
    <article class="swiper-slide card"><div class="wf-img" data-label="Dropped Panel"></div></article>
    <article class="swiper-slide card"><div class="wf-img" data-label="Dropped Panel"></div></article>
  </div></div></div>
</section>
<div data-late-slot></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../_vendor/swiper@8.4.5/swiper-bundle.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelector("[data-late-slot]").outerHTML = '<section class="stage"><div data-fx="fan-arc-slider" data-fx-fan-arc-slider="rotate: 12; speed: 900; delay: 2500"><div class="swiper" data-fx-part="track"><div class="swiper-wrapper"><article class="swiper-slide card"><div class="wf-img" data-label="Late-arriving panel 1"></div></article><article class="swiper-slide card"><div class="wf-img" data-label="Late-arriving panel 2"></div></article><article class="swiper-slide card"><div class="wf-img" data-label="Late-arriving panel 3"></div></article><article class="swiper-slide card"><div class="wf-img" data-label="Late-arriving panel 4"></div></article></div></div></div></section>', 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
