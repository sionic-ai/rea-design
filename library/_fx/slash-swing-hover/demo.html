<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>slash-swing-hover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { display: flex; gap: 120px; justify-content: center; padding: 140px 20px; }
  .demo a { font-size: 12px; font-weight: 500; letter-spacing: 6.72px; line-height: 1.8; }
</style>
</head>
<body>
<p class="demo-hint"><b>slash-swing-hover</b> — Hover over ‹Learn More›. The two lines at the top right rotate and spread apart. <span style="color:var(--kf-dim)">(After 1s one more button comes in, and after 2.5s one drops out)</span></p>
<section class="demo">
  <a href="#" data-fx="slash-swing-hover">Learn More</a>
  <a href="#" data-fx="slash-swing-hover" style="--fx-a-to: 180deg; --fx-b-to: 150deg">Read More</a>
  <a href="#" data-fx="slash-swing-hover" data-demo-remove>Remove me</a>
  <template data-demo-late><a href="#" data-fx="slash-swing-hover">Late One</a></template>
</section>
<script src="../fx-core.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
