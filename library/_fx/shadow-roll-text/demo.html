<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>shadow-roll-text — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .list { max-width: 480px; margin: 40px 24px; border-top: 1px solid var(--kf-line); }
  .list a { display: block; padding: 14px 8px; border-bottom: 1px solid var(--kf-line); font-size: 18px; }
  .card { display: block; max-width: 480px; margin: 24px; padding: 24px; border-radius: var(--kf-radius-sm); background: var(--kf-surface); font-size: 20px; font-weight: 700; }
  .band { margin: 24px; padding: 24px; background: var(--kf-accent); --fx-roll-ink: var(--kf-on-accent); --fx-roll-hover: var(--kf-on-accent); }
</style>
</head>
<body>
<p class="demo-hint"><b>shadow-roll-text</b> Hover over a row or card. The text slides up and out, and accent-color text rises in from below.</p>
<div class="list">
  <a href="#" data-fx="shadow-roll-text"><span data-fx-part="label">A message from the company</span></a>
  <a href="#" data-fx="shadow-roll-text" data-demo-remove><span data-fx-part="label">Line to erase</span></a>
  <a href="#" data-fx="shadow-roll-text"><span data-fx-part="label">Frequently asked questions</span></a>
</div>
<a class="card" href="#" data-fx="shadow-roll-text"><span data-fx-part="label">Card title one line</span></a>
<div class="band"><a href="#" data-fx="shadow-roll-text"><span data-fx-part="label">White Type link</span></a></div>
<template data-demo-late><a class="card" href="#" data-fx="shadow-roll-text" style="--fx-dur: .6s"><span data-fx-part="label">Late-entering card (.6s)</span></a></template>
<a class="card" href="#" data-fx="shadow-roll-text">Link without children</a>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
