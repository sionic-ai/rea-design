<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>center-grow-strip — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); overflow-x: hidden; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .strip { padding: 40px 0 120px; }
  .strip [data-fx-part="track"] { height: 560px; }
  .strip [data-fx-part="item"] { width: 270px; aspect-ratio: 9 / 16; border-radius: 20px; overflow: hidden; }
  .strip .wf-img { height: 100%; }
  .bar { display: flex; justify-content: center; gap: 12px; }
  .bar button { padding: 8px 14px; border: 1px solid var(--kf-line); background: var(--kf-surface); cursor: pointer; }
  .bar [data-fx-part="dot"] { width: 10px; height: 10px; padding: 0; border-radius: 50%; background: var(--kf-line); }
</style>
</head>
<body>
<p class="demo-hint"><b>center-grow-strip</b> — Every 3s (demo) the next panel is pulled to the center and grows. Try the previous, next and dots. After 1s one panel drops out.</p>
<section class="strip" data-fx="center-grow-strip" data-fx-center-grow-strip="every: 3">
  <div data-fx-part="track">
    <div data-fx-part="item"><span class="wf-img" data-label="Vertical video 1"></span></div>
    <div data-fx-part="item"><span class="wf-img" data-label="Vertical video 2"></span></div>
    <div data-fx-part="item"><span class="wf-img" data-label="Vertical video 3"></span></div>
    <div data-fx-part="item"><span class="wf-img" data-label="Vertical Video 4"></span></div>
    <div data-fx-part="item"><span class="wf-img" data-label="Vertical video 5"></span></div>
  </div>
  <div class="bar"><button type="button" data-fx-part="prev">Previous</button><button type="button" data-fx-part="dot" aria-label="1"></button><button type="button" data-fx-part="dot" aria-label="2"></button><button type="button" data-fx-part="dot" aria-label="3"></button><button type="button" data-fx-part="dot" aria-label="4"></button><button type="button" data-fx-part="dot" aria-label="5"></button><button type="button" data-fx-part="next">Next</button></div>
</section>
<section class="strip" id="late"></section>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
  setTimeout(() => {
    const s = document.querySelector(".strip").cloneNode(true);
    s.setAttribute("data-fx-center-grow-strip", "every: 0; scale: 1.5; center-gap: 60");
    s.querySelectorAll('[data-fx-part="item"]').forEach((i) => { i.style.transform = ""; i.classList.remove("is-active"); });
    document.getElementById("late").replaceWith(s);
    document.querySelector(".strip").remove();
  }, 1000);
</script>
</body>
</html>
