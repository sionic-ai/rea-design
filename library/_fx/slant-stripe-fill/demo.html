<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>slant-stripe-fill — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { padding: 48px 20px; }
  .side { width: 200px; border-left: 1px solid var(--kf-line); }
  .side a { display: flex; align-items: center; height: 72px; padding-left: 20px; border-bottom: 1px solid var(--kf-line); font: 700 22px/1 var(--kf-font-display); }
</style>
</head>
<body>
<p class="demo-hint"><b>slant-stripe-fill</b> — Hover over a menu cell. The first cell is the current one (aria-current), so it is always filled. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<section class="demo"><nav class="side">
  <a data-fx="slant-stripe-fill" href="#" aria-current="true">MENU 1</a>
  <a data-fx="slant-stripe-fill" href="#">MENU 2</a>
  <a data-demo-remove data-fx="slant-stripe-fill" href="#">MENU 3</a>
  <a data-fx="slant-stripe-fill" href="#">MENU 4</a>
  <template data-demo-late><a data-fx="slant-stripe-fill" href="#">MENU 5</a></template>
</nav></section>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); window.ScrollTrigger?.refresh(); }, 2500);
</script>
</body>
</html>
