<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cell-seam-eat — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 9; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  section { min-height: 120vh; display: grid; place-items: center; font: 700 48px/1 var(--kf-font-display); }
  .a { background: var(--kf-bg); }
  .b { background: var(--kf-accent); color: var(--kf-on-accent); }
  .c { background: var(--kf-contrast-bg); color: var(--kf-contrast-ink); }
</style>
</head>
<body>
<p class="demo-hint"><b>cell-seam-eat</b> Roll down. The section boundary is eaten upward by the edges of a cell bubble (the second boundary is out·dissolve). <span style="color:var(--kf-dim)">(After 1s one more boundary comes in, and after 2.5s one drops out)</span></p>
<section class="a">Section One</section>
<div data-fx="cell-seam-eat"></div>
<section class="b">Section Two</section>
<div data-fx="cell-seam-eat" data-fx-cell-seam-eat="direction: out; look: dissolve"></div>
<section class="c">Section Three</section>
<div data-fx="cell-seam-eat" data-demo-remove></div>
<section class="a">Section Four</section>
<template data-demo-late><div data-fx="cell-seam-eat"></div></template>
<section class="b">Section Five</section>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script>gsap.registerPlugin(ScrollTrigger);</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
