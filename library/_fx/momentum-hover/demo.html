<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>momentum-hover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { position: relative; display: flex; flex-wrap: wrap; gap: 48px; align-items: center; justify-content: center; padding: 96px 20px; }
  .demo-photo { width: 220px; aspect-ratio: 4 / 5; }
  .demo-sticker { display: grid; place-items: center; width: 140px; height: 90px; border-radius: 999px; background: var(--kf-accent); color: var(--kf-on-accent); font: 700 22px/1 var(--kf-font-display); rotate: -8deg; }
</style>
</head>
<body>
<p class="demo-hint"><b>momentum-hover</b> — Swipe the mouse quickly across the photos or stickers. They bounce and return in the direction you came from.</p>
<section class="demo" data-fx="momentum-hover">
  <figure data-fx-part="item"><div class="demo-photo wf-img" data-fx-part="target" data-label="Person half-length · Vertical 4:5"></div></figure>
  <span class="demo-sticker" data-fx-part="item">Sticker</span>
  <figure data-fx-part="item"><div class="demo-photo wf-img" data-fx-part="target" data-label="Prop shot · Portrait 4:5"></div></figure>
  <span class="demo-sticker" data-fx-part="item">Here</span>
</section>
<script>
// Late arrivals and removals — checks that fx-core attaches to an element added after 1s and detaches from an element removed after 2.5s
(() => {
  const src = document.querySelector('[data-fx~="momentum-hover"]');
  if (!src) return;
  const html = src.outerHTML.replace(/\sid="[^"]*"/g, "");
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => src.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical one comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/InertiaPlugin.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
