<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>seat-line-up — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: sticky; top: 0; z-index: 100; margin: 0; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-spacer { height: 90vh; display: grid; place-items: center; color: var(--kf-dim); }
  .stage { min-height: 540px; display: grid; place-items: center; text-align: center; overflow: hidden; background: var(--kf-contrast-bg); color: var(--kf-contrast-ink); }
  .field { position: absolute; inset: 64px 0; pointer-events: none; }
  .row { display: flex; justify-content: center; gap: 16px; height: 68px; margin: 40px 0; }
  .row i { width: 68px; flex: none; border-radius: 50%; box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--kf-contrast-ink) 20%, transparent); }
  .blob { position: absolute; inset: 0; border-radius: 32%; background: var(--kf-accent); }
  .stage h2 { margin: 0; font-size: 32px; position: relative; z-index: 1; }
</style>
</head>
<body>
<p class="demo-hint"><b>seat-line-up</b> — Scroll down, when the section is half visible, scattered bubbles fly into a row and settle. Scroll back up and they scatter again.</p>
<div class="demo-spacer">Scroll down ↓</div>
<section class="stage" data-fx="seat-line-up">
  <div class="field">
    <span data-fx-part="flier" style="--x:9;--y:27;--size:150;--tip:-12deg;--float:3.4s;--delay:-1.2s"><span data-fx-part="body"><span class="blob"></span></span></span>
    <span data-fx-part="flier" style="--x:20;--y:84;--size:170;--tip:8deg;--float:4.1s;--delay:-.4s"><span data-fx-part="body"><span class="blob"></span></span></span>
    <span data-fx-part="flier" style="--x:27;--y:8;--size:64;--tip:14deg;--float:4s;--delay:-2s"><span data-fx-part="body"><span class="blob"></span></span></span>
    <span data-fx-part="flier" style="--x:73;--y:9;--size:84;--tip:-8deg;--float:3.6s;--delay:-.9s"><span data-fx-part="body"><span class="blob"></span></span></span>
    <span data-fx-part="flier" style="--x:90;--y:25;--size:170;--tip:10deg;--float:3.8s;--delay:-1.6s"><span data-fx-part="body"><span class="blob"></span></span></span>
    <span data-fx-part="flier" style="--x:80;--y:83;--size:156;--tip:-8deg;--float:3.3s;--delay:-.2s"><span data-fx-part="body"><span class="blob"></span></span></span>
  </div>
  <div>
    <h2>Your title here</h2>
    <div class="row"><i data-fx-part="seat"></i><i data-fx-part="seat"></i><i data-fx-part="seat"></i><i data-fx-part="seat"></i><i data-fx-part="seat"></i><i data-fx-part="seat"></i></div>
  </div>
</section>
<div class="demo-spacer"></div>
<script>
// Late arrivals and removals — checks that fx-core attaches to an element added after 1s and detaches from an element removed after 2.5s
(() => {
  const src = document.querySelector('[data-fx~="seat-line-up"]');
  if (!src) return;
  const html = src.outerHTML;
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => src.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical section comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
