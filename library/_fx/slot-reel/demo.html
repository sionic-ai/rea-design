<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>slot-reel — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { padding: 48px 20px; }
  .demo-spacer { height: 90vh; display: grid; place-items: center; color: var(--kf-dim); }
  .slot { display: flex; align-items: center; gap: 10px; perspective: 400px; margin-bottom: 40px; }
  .slot [data-fx-part="reel"] { width: 64px; height: 76px; border: 3px solid var(--kf-ink); border-radius: 12px; }
  .slot .cell { height: 76px; display: grid; place-items: center; font: 700 34px/1 var(--kf-font-display); }
  .slot [data-fx-part="lever"] { width: 12px; height: 90px; border-radius: 6px; background: var(--kf-accent); }
</style>
</head>
<body>
<p class="demo-hint"><b>slot-reel</b> — On open the reel spins and stops at 7. Click the reel to spin again, and the second row (step) rolls one notch per click. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<section class="demo">
<div class="slot" data-demo-remove data-fx="slot-reel"><div data-fx-part="reel"><div class="cell">7</div><div class="cell">★</div><div class="cell">♪</div><div class="cell">◆</div><div class="cell">●</div></div><div data-fx-part="reel"><div class="cell">7</div><div class="cell">★</div><div class="cell">♪</div><div class="cell">◆</div><div class="cell">●</div></div><div data-fx-part="reel"><div class="cell">7</div><div class="cell">★</div><div class="cell">♪</div><div class="cell">◆</div><div class="cell">●</div></div><span data-fx-part="lever"></span></div>
<div class="slot" data-fx="slot-reel" data-fx-slot-reel="look: step"><div data-fx-part="reel"><div class="cell">7</div><div class="cell">★</div><div class="cell">♪</div><div class="cell">◆</div><div class="cell">●</div></div><div data-fx-part="reel"><div class="cell">7</div><div class="cell">★</div><div class="cell">♪</div><div class="cell">◆</div><div class="cell">●</div></div><div data-fx-part="reel"><div class="cell">7</div><div class="cell">★</div><div class="cell">♪</div><div class="cell">◆</div><div class="cell">●</div></div></div>
<template data-demo-late><div class="slot" data-fx="slot-reel" data-fx-slot-reel="stop: 0"><div data-fx-part="reel"><div class="cell">7</div><div class="cell">★</div><div class="cell">♪</div><div class="cell">◆</div><div class="cell">●</div></div><div data-fx-part="reel"><div class="cell">7</div><div class="cell">★</div><div class="cell">♪</div><div class="cell">◆</div><div class="cell">●</div></div></div></template>
<div data-fx="slot-reel"></div>
</section>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); window.ScrollTrigger?.refresh(); }, 2500);
</script>
</body>
</html>
