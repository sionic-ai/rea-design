<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>collage-widen-pin — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .pad { height: 70vh; display: grid; place-items: center; color: var(--kf-dim); }
  .ph { background: var(--kf-raised); border: 1px solid var(--kf-line); }
  .ph--main { background: var(--kf-accent); }
</style>
</head>
<body>
<p class="demo-hint"><b>collage-widen-pin</b> — Scroll down (on windows wider than 835px). The panel stops at screen center, the center photo widens to the panel width, and the surrounding photos are pushed away. <span style="color:var(--kf-dim)">(After 1s one more panel comes in, and it leaves 2.5s later)</span></p>
<div class="pad">Top margin</div>
<section data-fx="collage-widen-pin">
  <div data-fx-part="inner"><div data-fx-part="frame">
    <span data-fx-part="item" class="ph" style="left:-62%;top:-48%;width:42%"></span>
    <span data-fx-part="item" class="ph" style="left:118%;top:-20%;width:36%"></span>
    <span data-fx-part="item" class="ph" style="left:-48%;top:78%;width:32%"></span>
    <span data-fx-part="item" class="ph" style="left:104%;top:92%;width:40%"></span>
    <div class="ph ph--main"></div>
  </div></div>
</section>
<div id="late"></div>
<div class="pad">Bottom margin</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.getElementById("late").insertAdjacentHTML("beforeend", '<section data-fx="collage-widen-pin" data-fx-collage-widen-pin="end: 600" id="gone"><div data-fx-part="inner"><div data-fx-part="frame"><div class="ph"></div></div></div></section>'), 1000);
setTimeout(() => document.getElementById("gone")?.remove(), 2500);
</script>
</body>
</html>
