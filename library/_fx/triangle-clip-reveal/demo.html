<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>triangle-clip-reveal — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { display: grid; grid-template-columns: repeat(3, 270px); gap: 24px; padding: 48px 20px; }
  .card { position: relative; display: block; }
  .card figure { position: relative; margin: 0; aspect-ratio: 1; background: var(--kf-raised); }
  .card [data-fx-part="shape"] { position: absolute; inset: 0; }
  .card .cut { position: absolute; left: 30%; top: 20%; width: 40%; height: 80%; background: var(--kf-dim); border-radius: 50% 50% 0 0; z-index: 2; }
  .card p { margin: 12px 0 0; }
  .spacer { height: 90vh; display: grid; place-items: center; color: var(--kf-dim); }
</style>
</head>
<body>
<p class="demo-hint"><b>triangle-clip-reveal</b> — Hover over a card. The triangle unfolds one vertex at a time. Scroll down for a card that unfolds once when it becomes visible.</p>
<div class="demo">
  <a class="card" href="#" data-fx="triangle-clip-reveal" data-fx-triangle-clip-reveal="on: hover; points: 10.9,37,28.3,58.7,92.4,26.1"><figure><span data-fx-part="shape"></span><span class="cut"></span></figure><p>Your name here</p></a>
  <a class="card" href="#" data-fx="triangle-clip-reveal" data-fx-triangle-clip-reveal="on: hover; points: 63,66.3,85.9,41.3,8.7,27.2"><figure><span data-fx-part="shape"></span><span class="cut"></span></figure><p>Your name two here</p></a>
  <a class="card" href="#" data-fx="triangle-clip-reveal" data-fx-triangle-clip-reveal="on: hover; points: 7.6,50,17.4,72,95.7,27.2"><figure><span data-fx-part="shape"></span><span class="cut"></span></figure><p>Your name three here</p></a>
</div>
<div class="spacer">Scroll down ↓</div>
<div class="demo"><div class="card" data-fx="triangle-clip-reveal" data-fx-triangle-clip-reveal="on: view; points: 0,87,13.27,100,100,53.51,100,52.22; with: 3"><figure><span data-fx-part="shape"></span><span class="cut"></span></figure><p>Square and triangle that unfold when visible (with: 3)</p></div></div>
<div class="spacer"></div>
<script>
(() => {
  const src = document.querySelector("[data-fx~=\"triangle-clip-reveal\"]");
  if (!src) return;
  const html = src.outerHTML.replace(/\sid="[^"]*"/g, "");
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => (src.closest(".pin-spacer") || src).after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical one comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/CustomEase.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
