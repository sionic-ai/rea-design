<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>photo-warp-tunnel — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { margin: 0; background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 2; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .stage { height: 80vh; margin: 20px; background: var(--kf-raised); }
  .stage figure { margin: 0; }
</style>
</head>
<body>
<p class="demo-hint"><b>photo-warp-tunnel</b> — Just watch. Photos are born in the back and fly out to the edges, tumbling. <span style="color:var(--kf-dim)">(After 1s one more panel comes in, and after 2s one drops out)</span></p>
<section class="stage" data-fx="photo-warp-tunnel">
  <figure data-fx-part="photo" class="wf-img" data-label="Person under the sky · landscape 3:2"></figure>
  <figure data-fx-part="photo" class="wf-img" data-label="Waterside scenery · landscape 3:2"></figure>
  <figure data-fx-part="photo" class="wf-img" data-label="Person exercising · landscape 3:2"></figure>
  <figure data-fx-part="photo" class="wf-img" data-label="Hand by the window · landscape 3:2"></figure>
  <figure data-fx-part="photo" class="wf-img" data-label="Forest path · landscape 3:2"></figure>
  <figure data-fx-part="photo" class="wf-img" data-label="Child and adult · Landscape 3:2"></figure>
  <figure data-fx-part="photo" class="wf-img" data-label="On the desk · Landscape 3:2"></figure>
  <figure data-fx-part="photo" class="wf-img" data-label="Sea · landscape 3:2"></figure>
  <figure data-fx-part="photo" class="wf-img" data-label="Person under the sky · landscape 3:2"></figure>
  <figure data-fx-part="photo" class="wf-img" data-label="Waterside scenery · landscape 3:2"></figure>
  <figure data-fx-part="photo" class="wf-img" data-label="Person exercising · landscape 3:2"></figure>
  <figure data-fx-part="photo" class="wf-img" data-label="Hand by the window · landscape 3:2"></figure>
  <figure data-fx-part="photo" class="wf-img" data-label="Forest path · landscape 3:2"></figure>
  <figure data-fx-part="photo" class="wf-img" data-label="Child and adult · Landscape 3:2"></figure>
  <figure data-fx-part="photo" class="wf-img" data-label="On the desk · Landscape 3:2"></figure>
  <figure data-fx-part="photo" class="wf-img" data-label="Sea · landscape 3:2"></figure>
</section>
<section class="stage" data-fx="photo-warp-tunnel" data-fx-photo-warp-tunnel="speed: 1600; roll: 0" style="--fx-w: 220px" data-demo-remove>
  <figure data-fx-part="photo" class="wf-img" data-label="Dropping panel"></figure>
  <figure data-fx-part="photo" class="wf-img" data-label="Dropping panel"></figure>
</section>
<template data-demo-late><section class="stage" data-fx="photo-warp-tunnel" data-fx-photo-warp-tunnel="depth: 3000; radius: 300">  <figure data-fx-part="photo" class="wf-img" data-label="Person under the sky · landscape 3:2"></figure>
  <figure data-fx-part="photo" class="wf-img" data-label="Waterside scenery · landscape 3:2"></figure>
  <figure data-fx-part="photo" class="wf-img" data-label="Person exercising · landscape 3:2"></figure>
  <figure data-fx-part="photo" class="wf-img" data-label="Hand by the window · landscape 3:2"></figure>
  <figure data-fx-part="photo" class="wf-img" data-label="Forest path · landscape 3:2"></figure>
  <figure data-fx-part="photo" class="wf-img" data-label="Child and adult · Landscape 3:2"></figure>
  <figure data-fx-part="photo" class="wf-img" data-label="On the desk · Landscape 3:2"></figure>
  <figure data-fx-part="photo" class="wf-img" data-label="Sea · landscape 3:2"></figure>
  <figure data-fx-part="photo" class="wf-img" data-label="Person under the sky · landscape 3:2"></figure>
  <figure data-fx-part="photo" class="wf-img" data-label="Waterside scenery · landscape 3:2"></figure>
  <figure data-fx-part="photo" class="wf-img" data-label="Person exercising · landscape 3:2"></figure>
  <figure data-fx-part="photo" class="wf-img" data-label="Hand by the window · landscape 3:2"></figure>
  <figure data-fx-part="photo" class="wf-img" data-label="Forest path · landscape 3:2"></figure>
  <figure data-fx-part="photo" class="wf-img" data-label="Child and adult · Landscape 3:2"></figure>
  <figure data-fx-part="photo" class="wf-img" data-label="On the desk · Landscape 3:2"></figure>
  <figure data-fx-part="photo" class="wf-img" data-label="Sea · landscape 3:2"></figure></section></template>
<section class="stage" data-fx="photo-warp-tunnel"></section>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2000);
</script>
</body>
</html>
