<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>roll-split-link — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .row { display: flex; gap: 28px; padding: 40px; align-items: flex-start; font-size: 16px; }
  .row a { color: var(--kf-ink); }
</style>
</head>
<body>
<p class="demo-hint"><b>roll-split-link</b> — Hover over the menu and links. The text rolls up and swaps, and underlined links split from the center and rejoin when you release. <span style="color:var(--kf-dim)">(After 1s one more link comes in, and after 2.5s one drops out)</span></p>
<nav class="row" aria-label="Demo Menu">
  <a href="#" data-fx="roll-split-link"><span data-fx-part="label">About</span></a>
  <a href="#" data-fx="roll-split-link"><span data-fx-part="label">News</span></a>
  <a href="#" data-fx="roll-split-link" data-demo-remove><span data-fx-part="label">Works</span></a>
  <a href="#" data-fx="roll-split-link"></a>
  <template data-demo-late><a href="#" data-fx="roll-split-link"><span data-fx-part="label">Recruit</span></a></template>
</nav>
<div class="row">
  <a href="#" data-fx="roll-split-link" data-fx-roll-split-link="look: tint; line: 1"><span data-fx-part="label">Your see more link here</span></a>
  <a href="#" data-fx="roll-split-link" data-fx-roll-split-link="line: 1; in: .8; out: .4" style="--fx-weight: 2px"><span data-fx-part="label">Slow Type · 2px underline</span></a>
</div>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); }, 2500);
</script>
</body>
</html>
