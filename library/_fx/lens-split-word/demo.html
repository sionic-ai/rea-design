<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lens-split-word — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 14px/1.4 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { display: grid; gap: 64px; padding: 40px 24px 120px; }
  .demo figure { display: grid; gap: 12px; color: var(--kf-dim); }
  .demo [data-fx] { display: block; color: var(--kf-ink); }
  .demo svg { display: block; width: 100%; height: auto; }
</style>
</head>
<body>
<p class="demo-hint"><b>lens-split-word</b> — Move the cursor over the wordmark. A flipped circle follows the cursor and the letter cells split apart to both sides at that spot. When you let go, the split sweeps away to the left. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<div class="demo">
  <figure><a data-fx="lens-split-word" href="#" aria-label="Back to start"><svg data-fx-part="word" viewBox="0 0 23 7" fill="currentColor" aria-hidden="true"></svg></a><figcaption>Default · 7×23 cells 「KASA」</figcaption></figure>
  <figure data-demo-remove><a data-fx="lens-split-word" data-fx-lens-split-word="strength: .06; spread: .08" href="#"><svg data-fx-part="word" viewBox="0 0 23 7" fill="currentColor" aria-hidden="true"></svg></a><figcaption>Wider split .06 · spread .08 (drops off after 2.5s)</figcaption></figure>
  <template data-demo-late><figure><a data-fx="lens-split-word" data-fx-lens-split-word="radius: .04; follow: .08" href="#"><svg data-fx-part="word" viewBox="0 0 23 7" fill="currentColor" aria-hidden="true"></svg></a><figcaption>Late · big circle · follows slowly</figcaption></figure></template>
  <figure><a data-fx="lens-split-word" href="#"><span>no svg (silent)</span></a><figcaption>No cell</figcaption></figure>
</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script>
// Four 5×7 cell letters (K·A·S·A) drawn as one rect per cell — drawn once since it’s a demo backdrop
const G = { K: ["10001","10010","10100","11000","10100","10010","10001"], A: ["01110","10001","10001","11111","10001","10001","10001"], S: ["01111","10000","10000","01110","00001","00001","11110"] };
const fill = (svg) => { let x = 0; for (const ch of "KASA") { G[ch].forEach((row, y) => [...row].forEach((b, i) => { if (b === "1") svg.insertAdjacentHTML("beforeend", `<rect x="${x + i}" y="${y}" width="1.04" height="1.04" rx=".22"/>`); })); x += 6; } };
document.querySelectorAll('[data-fx-part="word"]').forEach(fill);
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => { const f = t.content.cloneNode(true); f.querySelectorAll('[data-fx-part="word"]').forEach(fill); t.replaceWith(f); }), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
