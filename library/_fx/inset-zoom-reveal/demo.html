<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>inset-zoom-reveal — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 9; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .gap { height: 70vh; display: grid; place-items: center; color: var(--kf-dim); }
  .row { display: flex; gap: 24px; padding: 0 24px; }
  .frame { width: 320px; aspect-ratio: 3 / 4; }
  .frame .wf-img { position: absolute; inset: 0; height: 100%; }
</style>
</head>
<body>
<p class="demo-hint"><b>inset-zoom-reveal</b> — Scroll down. The photo cell opens from the center and the inner photo sinks back.</p>
<div class="gap">Downward</div>
<div class="row" id="row">
  <figure class="frame" data-fx="inset-zoom-reveal"><div class="wf-img" data-fx-part="media" data-label="Vertical 3:4 photo"></div></figure>
  <figure class="frame" data-fx="inset-zoom-reveal" data-fx-inset-zoom-reveal="from: .4; zoom: 1.2; dur: 1.2"><div class="wf-img" data-label="from .4 · zoom 1.2"></div></figure>
  <figure class="frame" data-fx="inset-zoom-reveal" data-fx-inset-zoom-reveal="from: .8; round: 100; zoom: 1; dur: 1; ease: 0.5,1,0.89,1; fade: 1.5"><div class="wf-img" data-label="Round window · fade 1.5"></div></figure>
  <figure class="frame" id="gone" data-fx="inset-zoom-reveal"><div class="wf-img" data-label="Deleting soon"></div></figure>
</div>
<div class="gap"></div>
<script>
  setTimeout(() => { const f = document.createElement("figure"); f.className = "frame"; f.dataset.fx = "inset-zoom-reveal"; f.innerHTML = '<div class="wf-img" data-label="Cell after 1s"></div>'; document.getElementById("row").append(f); }, 1000);
  setTimeout(() => document.getElementById("gone").remove(), 1500);
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script>gsap.registerPlugin(ScrollTrigger);</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
