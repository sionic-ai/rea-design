<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sheet-card-hover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { margin: 0; padding: 12px 20px; border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .board { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); max-width: 960px; margin: 40px auto; background: var(--kf-contrast-bg); }
  .cell { aspect-ratio: 1; padding: 5%; color: var(--kf-ink); }
  .cell h3 { font-weight: 400; font-size: 22px; }
  .cell .box { width: 58%; margin: 12px auto 0; overflow: hidden; }
  .cell .wf-img { aspect-ratio: 1; border: 0; }
  .cell p { margin-top: 18px; text-align: right; font-size: 14px; }
</style>
</head>
<body>
<p class="demo-hint"><b>sheet-card-hover</b> — Hover over a cell on the dark panel. A white card lights up revealing the name·price and the photo grows.</p>
<div class="board">
  <a href="#" class="cell" data-fx="sheet-card-hover"><span data-fx-part="sheet"></span><h3>Model Name 01</h3><div class="box"><div class="wf-img" data-fx-part="media" data-label="Car front · square"></div></div><p data-fx-part="reveal">PRICE ₩00,000〜</p></a>
  <a href="#" class="cell" data-fx="sheet-card-hover" style="--fx-zoom: 1.15; --fx-dur: .6s"><span data-fx-part="sheet"></span><h3>Model Name 02</h3><div class="box"><div class="wf-img" data-fx-part="media" data-label="Motorcycle · Square"></div></div><p data-fx-part="reveal">Slower · 1.15x</p></a>
  <a href="#" class="cell" data-fx="sheet-card-hover"><span data-fx-part="sheet"></span><h3>Cell without photo</h3></a>
</div>
<script>
// Late-arriving and removed cells — CSS-only part, checking that it applies as is
(() => {
  const board = document.querySelector(".board"), src = board.firstElementChild;
  const gone = src.cloneNode(true);
  board.append(gone);
  setTimeout(() => { const late = src.cloneNode(true); late.querySelector("h3").textContent = "Late cell"; board.append(late); }, 1000);
  setTimeout(() => gone.remove(), 2500);
})();
</script>
<script src="../fx-core.js"></script>
</body>
</html>
