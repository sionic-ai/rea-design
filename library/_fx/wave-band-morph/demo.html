<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>wave-band-morph — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { margin: 0; background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); overflow-x: clip; }
  .demo-hint { margin: 0; padding: 12px 20px; border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .gap { height: 220px; }
  .band { padding: 80px 8%; text-align: center; }
  .band h2 { margin: 0; font: 700 32px/1.3 var(--kf-font-display); }
  .rider { width: 200px; }
  .rider path { fill: var(--kf-accent); }
  .rider circle { fill: var(--kf-on-accent); }
  .rider.is-top { top: -90px; left: 6%; }
  .rider.is-bottom { bottom: -90px; right: 6%; }
</style>
</head>
<body>
<p class="demo-hint"><b>wave-band-morph</b> — The top and bottom waves of the band surge off-beat, and the character behind the waves bounces. After 1 second another band is added, and after 3 seconds a part of the first band is detached.</p>
<div class="gap"></div>
<section class="band" id="first" data-fx="wave-band-morph">
  <svg class="rider is-top" data-fx-part="rider" data-key="top" viewBox="0 0 200 200" aria-hidden="true"><path d="M6 200C14 170 28 150 42 126C54 76 76 38 108 38C146 38 162 82 168 124C174 160 186 182 198 200Z"/><circle cx="96" cy="86" r="6"/><circle cx="120" cy="84" r="6"/></svg>
  <svg class="rider is-bottom" data-fx-part="rider" data-key="bottom" viewBox="0 0 200 200" aria-hidden="true"><path d="M6 200C14 170 28 150 42 126C54 76 76 38 108 38C146 38 162 82 168 124C174 160 186 182 198 200Z"/><circle cx="96" cy="86" r="6"/><circle cx="120" cy="84" r="6"/></svg>
  <h2>Your band title here</h2>
  <p>One line of body text inside the band here.</p>
</section>
<div class="gap" id="after"></div>
<script>
setTimeout(() => {
  const s = document.createElement("section");
  s.className = "band";
  s.dataset.fx = "wave-band-morph";
  s.setAttribute("data-fx-wave-band-morph", "top: 6; bottom: 7");
  s.innerHTML = "<h2>Late-attached band — wave 6·7s</h2>";
  document.getElementById("after").after(s, Object.assign(document.createElement("div"), { className: "gap" }));
}, 1000);
setTimeout(() => { document.getElementById("first").dataset.fx = ""; }, 3000);
</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
