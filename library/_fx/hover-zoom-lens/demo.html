<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hover-zoom-lens — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { padding: 64px 20px; }
  .demo-title { margin: 0 0 40px; font: 600 72px/1 var(--kf-font-display); letter-spacing: -.03em; }
  .demo-photo { margin: 0; max-width: 640px; aspect-ratio: 4/3; border-radius: var(--kf-radius-md); } .demo-art { width: 100%; height: 100%; display: grid; place-items: center; background: repeating-linear-gradient(45deg, var(--kf-surface) 0 12px, var(--kf-bg) 12px 24px); font: 13px var(--kf-font-mono); color: var(--kf-dim); } .demo-art span { padding: 6px 10px; border: 1px solid var(--kf-accent); color: var(--kf-accent); }
</style>
</head>
<body>
<p class="demo-hint"><b>hover-zoom-lens</b> — Hover over the photo. A round glass sticks to the cursor and shows what is below at 2.2x.</p>
<section class="demo"><figure class="demo-photo" data-fx="hover-zoom-lens"><div data-fx-part="image" class="demo-art"><span>Your photo · landscape 4:3 here</span></div></figure></section>
<script>
// Late arrivals and removals — checks that fx-core attaches to an element added after 1s and detaches from an element removed after 2.5s
(() => {
  const src = document.querySelector('[data-fx~="hover-zoom-lens"]');
  if (!src) return;
  const html = src.outerHTML.replace(/\sid="[^"]*"/g, "");
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => src.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical one comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
