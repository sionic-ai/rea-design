<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bar-blind-reveal — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .gap { height: 80vh; }
  .ph { width: min(760px, 90vw); margin: 0 auto 60px; aspect-ratio: 3 / 2; }
  .ph .wf-img { height: 100%; }
</style>
</head>
<body>
<p class="demo-hint"><b>bar-blind-reveal</b> — Scroll down — vertical bars covering the photo peel away downward at their own pace. <span style="color:var(--kf-dim)">(After 1s one more cell comes in, and one leaves 2.5s later)</span></p>
<div class="gap"></div>
<figure class="ph" data-fx="bar-blind-reveal"><div class="wf-img" data-label="Section photo 1"></div></figure>
<figure class="ph" data-fx="bar-blind-reveal" data-fx-bar-blind-reveal="bars: 30; dur: 1.2" data-demo-remove><div class="wf-img" data-label="Dropping cell"></div></figure>
<span data-late-slot></span>
<figure class="ph" data-fx="bar-blind-reveal" data-fx-bar-blind-reveal="once: false" style="--fx-fill: var(--kf-surface)"><div class="wf-img" data-label="Cell that covers again (once: false)"></div></figure>
<div class="gap"></div>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelector("[data-late-slot]").outerHTML = '<figure class="ph" data-fx="bar-blind-reveal"><div class="wf-img" data-label="Late cell"></div></figure>', 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
