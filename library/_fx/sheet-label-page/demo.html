<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sheet-label-page — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { margin: 0; background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { display: flex; gap: 16px; padding: 40px 20px; }
  .demo a { padding: 10px 18px; border: 1px solid var(--kf-line); border-radius: var(--kf-radius-pill); }
</style>
</head>
<body>
<p class="demo-hint"><b>sheet-label-page</b> — Click the link below: a cover drops from the top and the name rises, then it moves back to this page and the cover lifts.</p>
<nav class="demo"><a href="demo.html" data-page-label="Projects">Through work</a><a href="demo.html?x=1" data-page-label="About">By referral</a><a href="#top">Same page (no page turn)</a></nav>
<div data-fx="sheet-label-page"></div>
<script>
(() => {
  const late = document.createElement("div");
  late.setAttribute("data-fx", "sheet-label-page");
  late.dataset.demo = "late";
  setTimeout(() => document.body.append(late), 1000);
  setTimeout(() => late.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s one more panel comes in and leaves after 2.5s (detach).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
