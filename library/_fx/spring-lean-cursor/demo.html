<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>spring-lean-cursor — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-stage { position: relative; height: 70vh; display: grid; place-items: center; overflow: hidden; }
  .demo-sun { width: 220px; aspect-ratio: 1; border-radius: 50%; background: var(--kf-accent); mix-blend-mode: multiply; }
  .demo-row { display: flex; gap: 40px; justify-content: center; padding: 40px; }
  .demo-row > span { width: 90px; aspect-ratio: 1; border-radius: 50%; background: var(--kf-ink-soft); }
</style>
</head>
<body>
<p class="demo-hint"><b>spring-lean-cursor</b> — Move the mouse near the circle. It gets pulled like a spring and snaps back.</p>
<div class="demo-stage"><span class="demo-sun" data-fx="spring-lean-cursor" data-fx-spring-lean-cursor="bound: .demo-stage"></span></div>
<div class="demo-row"><span data-fx="spring-lean-cursor" data-demo-remove></span><template data-demo-late><span data-fx="spring-lean-cursor" data-fx-spring-lean-cursor="max: .3; reach: 3"></span></template></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
