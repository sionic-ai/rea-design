<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mega-morph-nav — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); min-height: 150vh; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { padding: 24px 20px; }
  nav[data-fx] { z-index: 10; max-width: 960px; margin: 0 auto; border: 1px solid var(--kf-line); border-radius: var(--kf-radius-md); background: var(--kf-surface); }
  .row { display: flex; gap: 8px; padding: 12px 16px; }
  .row button { border: 0; background: none; font: inherit; color: inherit; padding: 6px 10px; cursor: pointer; }
  [data-fx-part="panel"] { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; padding: 24px 16px; }
  [data-fx-part="item"] { display: block; padding: 8px 0; border-bottom: 1px solid var(--kf-line); color: inherit; text-decoration: none; }
</style>
</head>
<body>
<p class="demo-hint"><b>mega-morph-nav</b> — Hover a menu item, then with it open move to a neighboring item. The panel height changes and the content slides in that direction.</p>
<section class="demo">
  <nav data-fx="mega-morph-nav">
    <div class="row"><button data-fx-part="toggle" data-key="a">Menu 1</button><button data-fx-part="toggle" data-key="b">Menu 2</button><button data-fx-part="toggle" data-key="c">Menu 3</button></div>
    <div data-fx-part="box">
      <div data-fx-part="panel" data-key="a"><a href="#" data-fx-part="item">Item 1</a><a href="#" data-fx-part="item">Item 2</a><a href="#" data-fx-part="item">Item 3</a></div>
      <div data-fx-part="panel" data-key="b"><a href="#" data-fx-part="item">Item 1</a><a href="#" data-fx-part="item">Item 2</a><a href="#" data-fx-part="item">Item 3</a><a href="#" data-fx-part="item">Item 4</a><a href="#" data-fx-part="item">Item 5</a><a href="#" data-fx-part="item">Item 6</a></div>
      <div data-fx-part="panel" data-key="c"><a href="#" data-fx-part="item">Only one item</a></div>
    </div>
    <div data-fx-part="backdrop"></div>
  </nav>
</section>
<section class="demo">
  <nav data-fx="mega-morph-nav"><div class="row"><button data-fx-part="toggle" data-key="x">Blank board</button></div><div data-fx-part="box"><div data-fx-part="panel" data-key="x"></div></div></nav>
  <nav data-fx="mega-morph-nav"></nav>
</section>
<script>
(() => {
  const src = document.querySelector('[data-fx~="mega-morph-nav"]');
  if (!src) return;
  const html = src.outerHTML.replace(/\sid="[^"]*"/g, "");
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => src.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical one comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
