<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>shadow-drag-in — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.6 var(--kf-font-sans); overflow-x: hidden; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-spacer { height: 80vh; display: grid; place-items: center; color: var(--kf-dim); }
  h2 { margin: 0 auto 160px; max-width: 1000px; padding: 0 20px; font: 900 min(14vw, 140px)/1 var(--kf-font-display); letter-spacing: -0.03em; color: var(--kf-accent); -webkit-text-stroke: 2px var(--kf-ink); paint-order: stroke fill; }
</style>
</head>
<body>
<p class="demo-hint"><b>shadow-drag-in</b> — The first title appears 1 second after opening, the titles below drag a shadow in from the lower left when they reach 80% of the screen. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<h2 data-fx="shadow-drag-in" data-fx-shadow-drag-in="on: load; delay: 1">HELLO</h2>
<div class="demo-spacer">Scroll down</div>
<h2 data-fx="shadow-drag-in">INTERVIEW</h2>
<h2 data-fx="shadow-drag-in" data-demo-remove>REMOVED</h2>
<h2 data-fx="shadow-drag-in" style="--fx-shadow: var(--kf-accent)" data-fx-shadow-drag-in="sx: 60; sy: -60; dur: 1">MESSAGE</h2>
<div id="late"></div>
<template data-demo-late><h2 data-fx="shadow-drag-in">ENTRY</h2></template>
<h2 data-fx="shadow-drag-in"></h2>
<div class="demo-spacer">Footer</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script>gsap.registerPlugin(ScrollTrigger);</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => { document.querySelectorAll("template[data-demo-late]").forEach((t) => document.getElementById("late").append(t.content.cloneNode(true))); ScrollTrigger.refresh(); }, 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
