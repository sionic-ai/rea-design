<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cover-flow-follow — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .deck { height: 60vh; }
  .face { background: var(--kf-raised); border: 1px solid var(--kf-line); display: grid; place-items: center; font: 600 24px/1 var(--kf-font-mono); color: var(--kf-dim); }
</style>
</head>
<body>
<p class="demo-hint"><b>cover-flow-follow</b> — Move the mouse left and right over the board. The card in the cursor’s cell stands front and center.</p>
<div class="deck" data-fx="cover-flow-follow">
  <div data-fx-part="row">
    <div data-fx-part="card"><div class="face" data-fx-part="face">1</div></div><div data-fx-part="card"><div class="face" data-fx-part="face">2</div></div>
    <div data-fx-part="card"><div class="face" data-fx-part="face">3</div></div><div data-fx-part="card"><div class="face" data-fx-part="face">4</div></div>
    <div data-fx-part="card"><div class="face" data-fx-part="face">5</div></div><div data-fx-part="card"><div class="face" data-fx-part="face">6</div></div>
    <div data-fx-part="card"><div class="face" data-fx-part="face">7</div></div>
  </div>
</div>
<div class="deck" data-demo-remove data-fx="cover-flow-follow"><div data-fx-part="row"><div data-fx-part="card"><div class="face" data-fx-part="face">A</div></div></div></div>
<template data-demo-late><div class="deck" data-fx="cover-flow-follow" data-fx-cover-flow-follow="turn: 30; dur: .5"><div data-fx-part="row"><div data-fx-part="card"><div class="face" data-fx-part="face">Go</div></div><div data-fx-part="card"><div class="face" data-fx-part="face">Me</div></div><div data-fx-part="card"><div class="face" data-fx-part="face">All</div></div></div></div></template>
<div class="deck" data-fx="cover-flow-follow"></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
