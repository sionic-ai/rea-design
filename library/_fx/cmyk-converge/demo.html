<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cmyk-converge — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-spacer { height: 90vh; display: grid; place-items: center; color: var(--kf-dim); }
  .ph { background: linear-gradient(135deg, var(--kf-surface), var(--kf-line)); }
</style>
</head>
<body>
<p class="demo-hint"><b>cmyk-converge</b> — Scroll down. Four scattered C·M·Y·K plates gather in one spot while the screen is pinned, and after the full-color photo turns on it widens to the screen width. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<div class="demo-spacer">Scroll down</div>
<section data-demo-remove data-fx="cmyk-converge"><div data-fx-part="plate" data-key="c"><span data-fx-part="frame"><span class="ph"></span></span></div><div data-fx-part="plate" data-key="m"><span data-fx-part="frame"><span class="ph"></span></span></div><div data-fx-part="plate" data-key="y"><span data-fx-part="frame"><span class="ph"></span></span></div><div data-fx-part="plate" data-key="k"><span data-fx-part="frame"><span class="ph"></span></span></div><div data-fx-part="full"><span data-fx-part="frame"><span class="ph"></span></span></div></section>
<section data-fx="cmyk-converge"><div data-fx-part="plate" data-key="c"><span data-fx-part="frame"><span class="ph"></span></span></div><div data-fx-part="plate" data-key="m"><span data-fx-part="frame"><span class="ph"></span></span></div><div data-fx-part="plate" data-key="y"><span data-fx-part="frame"><span class="ph"></span></span></div><div data-fx-part="plate" data-key="k"><span data-fx-part="frame"><span class="ph"></span></span></div><div data-fx-part="full"><span data-fx-part="frame"><span class="ph"></span></span></div></section>
<div><div data-fx-part="after"></div></div>
<template data-demo-late><section data-fx="cmyk-converge" data-fx-cmyk-converge="grow: none; span: 3"><div data-fx-part="plate" data-key="c"><span data-fx-part="frame"><span class="ph"></span></span></div><div data-fx-part="plate" data-key="k"><span data-fx-part="frame"><span class="ph"></span></span></div><div data-fx-part="full"><span data-fx-part="frame"><span class="ph"></span></span></div></section></template>
<div class="demo-spacer"></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); window.ScrollTrigger?.refresh(); }, 2500);
</script>
</body>
</html>
