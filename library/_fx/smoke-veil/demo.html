<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>smoke-veil — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .lead { height: 60vh; display: grid; place-items: center; font: var(--kf-weight-display) clamp(28px, 5vw, 56px)/1.2 var(--kf-font-display); }
  .flip { height: 250vh; }
  .flip p { position: sticky; top: 40vh; text-align: center; font: var(--kf-weight-display) clamp(28px, 5vw, 56px)/1.2 var(--kf-font-display); mix-blend-mode: difference; color: var(--kf-contrast-bg); }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; padding: 40px 20px 120px; }
  .card { display: flex; flex-direction: column; justify-content: space-between; min-height: 260px; padding: 24px; border: 1px solid var(--kf-line); border-radius: var(--kf-radius-md); overflow: hidden; }
  .card h3 { font: var(--kf-weight-display) 28px/1.1 var(--kf-font-display); mix-blend-mode: difference; color: var(--kf-contrast-bg); }
</style>
</head>
<body>
<p class="demo-hint"><b>smoke-veil</b> Scroll down. Smoke rises and the section flips over. Hover over the cards below. <span style="color:var(--kf-dim)">(One more card comes in after 1s, and one drops out after 2.5s)</span></p>
<div class="lead">Your first section title here</div>
<section class="flip" data-fx="smoke-veil" data-fx-smoke-veil="from: transparent; to: --kf-contrast-bg; fade: on"><p>Your flipped section title here</p></section>
<section class="cards">
  <a class="card" href="#" data-fx="smoke-veil" data-fx-smoke-veil="on: hover"><span>Your label here</span><h3>Your card title here</h3></a>
  <a class="card" href="#" data-demo-remove data-fx="smoke-veil" data-fx-smoke-veil="on: hover; fill: 1.2"><span>Exit card</span><h3>Your card title here</h3></a>
  <template data-demo-late><a class="card" href="#" data-fx="smoke-veil" data-fx-smoke-veil="on: hover; to: --kf-accent"><span>Late-arrived card</span><h3>Your card title here</h3></a></template>
</section>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../../_vendor/ogl@1.0.11/ogl.min.js"></script>
<script>gsap.registerPlugin(ScrollTrigger);</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
