<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>wipe-banner-stack — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo-spacer { height: 70vh; display: grid; place-items: center; color: var(--kf-dim); }
  [data-fx-part="slide"] { display: grid; place-items: center; font-size: 120px; color: var(--kf-contrast-ink); }
  [data-fx-part="slide"]:nth-child(1) { background: var(--kf-ink); }
  [data-fx-part="slide"]:nth-child(2) { background: var(--kf-dim); }
  [data-fx-part="slide"]:nth-child(3) { background: var(--kf-accent); }
  .ring { position: absolute; left: 50%; top: 50%; z-index: 9; width: 240px; transform: translate(-50%, -50%) rotate(-90deg); }
  .ring circle { stroke-width: .6; }
</style>
</head>
<body>
<p class="demo-hint"><b>wipe-banner-stack</b> — Scrolling down peels the upper panel away from the bottom, revealing the next panel as the ring fills. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<div class="demo-spacer">Downward</div>
<section data-fx="wipe-banner-stack" data-demo-remove><div data-fx-part="view">
  <div data-fx-part="slide">01<i data-fx-part="shade"></i></div><div data-fx-part="slide">02<i data-fx-part="shade"></i></div><div data-fx-part="slide">03<i data-fx-part="shade"></i></div>
</div></section>
<section data-fx="wipe-banner-stack" data-fx-wipe-banner-stack="dark: 0"><div data-fx-part="view">
  <div data-fx-part="slide">A<i data-fx-part="shade"></i></div><div data-fx-part="slide">B<i data-fx-part="shade"></i></div><div data-fx-part="slide">C</div>
  <svg class="ring" viewBox="0 0 100 100"><circle data-fx-part="ring" cx="50" cy="50" r="48" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/></svg>
</div></section>
<template data-demo-late><section data-fx="wipe-banner-stack"><div data-fx-part="view"><div data-fx-part="slide">Late 1</div><div data-fx-part="slide">Late 2</div></div></section></template>
<section data-fx="wipe-banner-stack"><div data-fx-part="view"></div></section>
<div class="demo-spacer"></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); window.ScrollTrigger?.refresh(); }, 2500);
</script>
</body>
</html>
