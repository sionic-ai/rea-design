<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tilt-loop-slider — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<link rel="stylesheet" href="../../_vendor/splide@4.1.2/splide-core.min.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo-spacer { height: 90vh; display: grid; place-items: center; color: var(--kf-dim); }
  .tl { width: 50%; margin: 0 auto; padding-bottom: 200px; }
  .tl [data-fx-part="media"] { aspect-ratio: 4 / 3; border-radius: 40px; background: var(--kf-accent); display: grid; place-items: center; color: var(--kf-on-accent); font: 500 32px/1 var(--kf-font-display); }
  .tl li:nth-child(2) [data-fx-part="media"] { background: var(--kf-ink); }
  .tl li:nth-child(3) [data-fx-part="media"] { background: var(--kf-dim); }
  body { overflow-x: hidden; }
</style>
</head>
<body>
<p class="demo-hint"><b>tilt-loop-slider</b> — Tilted, staggered photo panels flip over every 4s taking 2s, and the center panel settles down while tilting less. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<div class="demo-spacer">Scroll down</div>
<section class="splide tl" data-demo-remove data-fx="tilt-loop-slider" aria-label="Photo"><div class="splide__track"><ul class="splide__list"><li class="splide__slide"><div data-fx-part="media">Photo 1</div></li><li class="splide__slide"><div data-fx-part="media">Photo 2</div></li><li class="splide__slide"><div data-fx-part="media">Photo 3</div></li></ul></div></section>
<section class="splide tl" data-fx="tilt-loop-slider" aria-label="Photo"><div class="splide__track"><ul class="splide__list"><li class="splide__slide"><div data-fx-part="media">Photo 1</div></li><li class="splide__slide"><div data-fx-part="media">Photo 2</div></li><li class="splide__slide"><div data-fx-part="media">Photo 3</div></li></ul></div></section>
<template data-demo-late><section class="splide tl" data-fx="tilt-loop-slider" aria-label="Photo"><div class="splide__track"><ul class="splide__list"><li class="splide__slide"><div data-fx-part="media">Photo 1</div></li><li class="splide__slide"><div data-fx-part="media">Photo 2</div></li><li class="splide__slide"><div data-fx-part="media">Photo 3</div></li></ul></div></section></template>
<div class="demo-spacer"></div>
<script src="../../_vendor/splide@4.1.2/splide.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); window.ScrollTrigger?.refresh(); }, 2500);
</script>
</body>
</html>
