<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>doodle-tic — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { margin: 0; background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; margin: 0; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .dt-row { display: flex; flex-wrap: wrap; gap: 48px; padding: 80px 40px; align-items: end; }
  .dt-row figure { margin: 0; display: grid; justify-items: center; gap: 10px; font: 500 12px/1 var(--kf-font-mono); color: var(--kf-dim); }
  .dt-ico { width: 56px; }
  .dt-ico svg { display: block; width: 100%; fill: none; stroke: var(--kf-accent); stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
</style>
</head>
<body>
<p class="demo-hint"><b>doodle-tic</b> — Hand-drawn icons each flip, bounce up, tilt and jump at their own tempo. Just watch.</p>
<div class="dt-row" data-demo-host>
  <figure><i class="dt-ico" data-fx="doodle-tic" style="--fx-dur: 4s"><svg viewBox="0 0 60 60"><path d="M4 30c10-12 22-14 30-6 6-12 18-18 30-16-8 6-14 14-16 24-14 6-30 4-44-2z"/></svg></i>flip</figure>
  <figure><i class="dt-ico" data-fx="doodle-tic" data-fx-doodle-tic="look: pop" style="--fx-dur: 2.8s"><svg viewBox="0 0 60 60"><circle cx="30" cy="30" r="22"/></svg></i>pop</figure>
  <figure><i class="dt-ico" data-fx="doodle-tic" data-fx-doodle-tic="look: swing" style="--fx-dur: 4s"><svg viewBox="0 0 60 60"><path d="M8 28 30 10l22 18M14 24v26h32V24"/></svg></i>swing</figure>
  <figure><i class="dt-ico" data-fx="doodle-tic" data-fx-doodle-tic="look: swing-step" style="--fx-dur: 3s"><svg viewBox="0 0 60 60"><path d="M10 20h36l-4 28H14z"/></svg></i>swing-step</figure>
  <figure><i class="dt-ico" data-fx="doodle-tic" data-fx-doodle-tic="look: flip-y" style="--fx-dur: 3s"><svg viewBox="0 0 60 60"><path d="M10 50C10 24 26 10 52 8c0 26-16 42-42 42z"/></svg></i>flip-y</figure>
  <figure><i class="dt-ico" data-fx="doodle-tic" data-fx-doodle-tic="look: jump" style="--fx-dur: 4s"><svg viewBox="0 0 60 60"><circle cx="30" cy="14" r="8"/><path d="M20 54V28h20v26"/></svg></i>jump</figure>
  <figure><i class="dt-ico" data-fx="doodle-tic" data-fx-doodle-tic="look: spin" style="--fx-dur: 3s"><svg viewBox="0 0 60 60"><path d="m30 6 7 15 16 2-12 11 3 16-14-8-14 8 3-16L7 23l16-2z"/></svg></i>spin</figure>
</div>
<script>
// Late arrivals and removals — checks that fx-core attaches to an element added after 1s and detaches from an element removed after 2.5s
(() => {
  const src = document.querySelector('[data-fx~="doodle-tic"]');
  if (!src) return;
  const html = src.outerHTML.replace(/\sid="[^"]*"/g, "");
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const host = src.closest("[data-demo-host]") || src;
  const gone = make("gone");
  host.after(gone);
  setTimeout(() => host.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical one comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="../fx-core.js"></script>
</body>
</html>
