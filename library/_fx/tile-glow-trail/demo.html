<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tile-glow-trail — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { padding: 32px 20px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(64px, 1fr)); gap: 0; max-width: 960px; }
  .grid [data-fx-part="tile"] { aspect-ratio: 1; background: var(--kf-surface); border: 1px solid var(--kf-line); }
  .grid [data-fx-part="tile"]:nth-child(3n) { background: var(--kf-raised); }
</style>
</head>
<body>
<p class="demo-hint"><b>tile-glow-trail</b> — Sweep the mouse over the cells. Cells you pass light up in the accent color and fade over 10s.</p>
<div class="demo"><div class="grid" data-fx="tile-glow-trail">
<div data-fx-part="tile"></div><div data-fx-part="tile"></div><div data-fx-part="tile"></div><div data-fx-part="tile"></div><div data-fx-part="tile"></div><div data-fx-part="tile"></div><div data-fx-part="tile"></div><div data-fx-part="tile"></div><div data-fx-part="tile"></div><div data-fx-part="tile"></div><div data-fx-part="tile"></div><div data-fx-part="tile"></div><div data-fx-part="tile"></div><div data-fx-part="tile"></div><div data-fx-part="tile"></div><div data-fx-part="tile"></div><div data-fx-part="tile"></div><div data-fx-part="tile"></div><div data-fx-part="tile"></div><div data-fx-part="tile"></div><div data-fx-part="tile"></div><div data-fx-part="tile"></div><div data-fx-part="tile"></div><div data-fx-part="tile"></div><div data-fx-part="tile"></div><div data-fx-part="tile"></div><div data-fx-part="tile"></div><div data-fx-part="tile"></div><div data-fx-part="tile"></div><div data-fx-part="tile"></div><div data-fx-part="tile"></div><div data-fx-part="tile"></div><div data-fx-part="tile"></div><div data-fx-part="tile"></div><div data-fx-part="tile"></div><div data-fx-part="tile"></div><div data-fx-part="tile"></div><div data-fx-part="tile"></div><div data-fx-part="tile"></div><div data-fx-part="tile"></div><div data-fx-part="tile"></div><div data-fx-part="tile"></div><div data-fx-part="tile"></div><div data-fx-part="tile"></div><div data-fx-part="tile"></div><div data-fx-part="tile"></div><div data-fx-part="tile"></div><div data-fx-part="tile"></div>
</div></div>
<script>
// Late arrivals and removals — CSS-only parts, so they apply as is even to late-arriving planes
(() => {
  const src = document.querySelector('[data-fx~="tile-glow-trail"]');
  if (!src) return;
  const make = () => { const t = document.createElement("template"); t.innerHTML = src.outerHTML; return t.content.firstElementChild; };
  const gone = make();
  src.after(gone);
  setTimeout(() => src.after(make()), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s one more of the same panel comes in, and after 2.5s one drops out.");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
</body>
</html>
