<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>icon-hop-pill — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 500 15px/1.6 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 10; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .row { display: flex; flex-wrap: wrap; gap: 20px; max-width: 760px; margin: 48px auto; padding: 0 20px; font-size: 15px; }
</style>
</head>
<body>
<p class="demo-hint"><b>icon-hop-pill</b> — Hover over the button and then leave. The corners turn sharp and ▶ crosses to the left and returns. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<div class="row">
  <a href="#" data-fx="icon-hop-pill">Browse work</a>
  <a href="#" data-fx="icon-hop-pill" data-fx-icon-hop-pill="look: plain">Inquiry</a>
  <a href="#" data-fx="icon-hop-pill" data-demo-remove>Exit button</a>
</div>
<template data-demo-late><div class="row"><a href="#" data-fx="icon-hop-pill" style="--fx-bg: var(--kf-raised); --fx-ink: var(--kf-ink); --fx-dur: .6s">Late-arriving gray button</a></div></template>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); window.ScrollTrigger?.refresh(); }, 2500);
</script>
</body>
</html>
