<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tilt-backing-hover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { display: grid; grid-template-columns: repeat(3, 1fr); gap: 56px; padding: 10vh 6vw; }
  .demo a { display: block; color: inherit; text-decoration: none; }
  .demo [data-fx-part="frame"] { border-radius: 12px; }
  .demo [data-fx-part="frame"] > div { aspect-ratio: 16 / 8.4; border-radius: 12px; background: var(--kf-raised); }
  .demo h3 { margin-top: 18px; font-size: 16px; font-weight: 400; }
</style>
</head>
<body>
<p class="demo-hint"><b>tilt-backing-hover</b> — Hover over the card. A color plate behind the thumbnail tilts and sticks out. <span style="color:var(--kf-dim)">(One more card comes in after 1s, and one drops out after 2.5s)</span></p>
<section class="demo" id="box">
  <a href="#" data-fx="tilt-backing-hover"><div data-fx-part="frame"><span data-fx-part="back"></span><div></div></div><h3>Your card title here</h3></a>
  <a href="#" data-fx="tilt-backing-hover" style="--fx-back: var(--kf-ink); --fx-rest: -5deg"><div data-fx-part="frame"><span data-fx-part="back"></span><div></div></div><h3>Featured card that rests tilted from the start</h3></a>
  <a href="#" data-fx="tilt-backing-hover" data-demo-remove><div data-fx-part="frame"><span data-fx-part="back"></span><div></div></div><h3>Card to drop</h3></a>
</section>
<script src="../fx-core.js"></script>
<script>
setTimeout(() => { const a = document.createElement("a"); a.href = "#"; a.dataset.fx = "tilt-backing-hover"; a.innerHTML = '<div data-fx-part="frame"><span data-fx-part="back"></span><div></div></div><h3>Late-arrived card</h3>'; document.getElementById("box").append(a); }, 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
