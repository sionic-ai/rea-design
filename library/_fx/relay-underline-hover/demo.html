<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>relay-underline-hover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { margin: 0; padding: 12px 20px; border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-row { display: flex; gap: 48px; justify-content: center; padding: 60px 20px; }
  .demo-row a { display: inline-flex; gap: 8px; padding: 12px 0; letter-spacing: .1em; }
  .demo-wide { width: 320px; justify-content: flex-end; }
</style>
</head>
<body>
<p class="demo-hint"><b>relay-underline-hover</b> — Hover over the link and leave. The underline exits to the right and a new line is drawn from the left. <span style="color:var(--kf-dim)">(After 1s one more link comes in, and after 2.5s one drops out)</span></p>
<div class="demo-row">
  <a href="#" data-fx="relay-underline-hover">Your link › here</a>
  <a href="#" class="demo-wide" data-fx="relay-underline-hover">Wide cell right-aligned link ›</a>
  <a href="#" data-fx="relay-underline-hover" data-fx-relay-underline-hover="look: sweep" style="--fx-lag: .3s">Single-stroke sweep link (sweep)</a>
  <a href="#" data-demo-remove data-fx="relay-underline-hover">Omitted link</a>
</div>
<script src="../fx-core.js"></script>
<script>
setTimeout(() => document.querySelector(".demo-row").insertAdjacentHTML("beforeend", '<a href="#" data-fx="relay-underline-hover" style="--fx-dur: .3s; --fx-lag: .1s">Late-arriving quick link</a>'), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
