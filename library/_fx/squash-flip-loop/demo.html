<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>squash-flip-loop — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .row { display: flex; gap: 40px; padding: 60px 40px; }
  .doll { position: relative; width: 140px; height: 160px; }
  .doll svg { position: absolute; inset: 0; width: 100%; height: 100%; color: var(--kf-ink); }
  .doll .face { fill: var(--kf-surface); stroke: currentColor; stroke-width: 3; }
  .doll .body { fill: var(--kf-accent); }
</style>
</head>
<body>
<p class="demo-hint"><b>squash-flip-loop</b> — The hand drawing flattens, then unfolds in a different pose, rests 3 seconds, and repeats.</p>
<div class="row">
  <div class="doll" data-fx="squash-flip-loop"><svg data-fx-part="front" viewBox="0 0 140 160"><circle class="face" cx="70" cy="40" r="22"/><rect class="body" x="48" y="66" width="44" height="60" rx="8"/><path d="M48 80 20 60M92 80 120 100" stroke="currentColor" stroke-width="4"/></svg><svg data-fx-part="back" viewBox="0 0 140 160"><circle class="face" cx="70" cy="40" r="22"/><rect class="body" x="48" y="66" width="44" height="60" rx="8"/><path d="M48 80 20 100M92 80 120 60" stroke="currentColor" stroke-width="4"/></svg></div>
  <div class="doll" data-fx="squash-flip-loop" data-fx-squash-flip-loop="rest: 1"><svg viewBox="0 0 140 160"><circle class="face" cx="60" cy="40" r="22"/><rect class="body" x="40" y="66" width="44" height="60" rx="8"/><path d="M84 80 124 60" stroke="currentColor" stroke-width="4"/></svg></div>
</div>
<script>
(() => {
  const src = document.querySelector('[data-fx~="squash-flip-loop"]');
  if (!src) return;
  const html = src.outerHTML.replace(/\sid="[^"]*"/g, "");
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => src.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical one comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
