<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>letter-bob-loader — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { padding: 48px 20px; }
  .demo-hero { display: grid; place-items: center; height: 70vh; border-radius: var(--kf-radius-lg); background: var(--kf-raised); font: 400 40px/1.2 var(--kf-font-display); }
  .demo-btn { margin-top: 16px; height: 40px; padding: 0 16px; border: 1px solid var(--kf-line); border-radius: var(--kf-radius-sm); background: var(--kf-surface); color: var(--kf-ink); cursor: pointer; }
</style>
</head>
<body>
<div data-fx="letter-bob-loader" data-fx-letter-bob-loader="every: true" aria-hidden="true"><span data-fx-part="text">Loading</span></div>
<p class="demo-hint"><b>letter-bob-loader</b> — On open, the Loading text fades up twice, then the curtain lifts over 1.5s. Replay with the button.</p>
<section class="demo"><div class="demo-hero">Your Hero here</div><button class="demo-btn" type="button" onclick="location.reload()">View again</button></section>
<script>
// Late arrivals and removals — checks that fx-core attaches to an element added after 1s and detaches from an element removed after 2.5s
(() => {
  const src = document.querySelector('[data-fx~="letter-bob-loader"]');
  if (!src) return;
  const html = src.outerHTML;
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; el.style.inset = "auto 0 0 auto"; el.style.width = "160px"; el.style.height = "60px"; return el; };
  const gone = make("gone");
  document.body.append(gone);
  setTimeout(() => document.body.append(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s one more small cover slides in at the bottom right (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
