<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lottie-path-draw — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { margin: 0; padding: 12px 20px; border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .gap { height: 70vh; display: grid; place-items: center; color: var(--kf-dim); }
  .stage { position: relative; max-width: 760px; margin: 0 auto 30vh; padding: 0 20px; }
  .stage > p { margin: 0 0 40px; }
  .line-ink [data-fx-part="art"] path { stroke: var(--kf-ink); }
  button { padding: 6px 14px; border: 1px solid var(--kf-line); border-radius: 999px; background: var(--kf-surface); color: var(--kf-ink); font: inherit; cursor: pointer; }
</style>
</head>
<body>
<p class="demo-hint"><b>lottie-path-draw</b> — Scroll down. When ⅔ of the panel is on screen the line is drawn. The last panel is redrawn with a button.</p>
<div class="gap">Downward</div>
<div class="stage" id="stage">
  <p data-fx="lottie-path-draw" class="line-ink">
    <svg data-fx-part="art" viewBox="0 0 900 520"><path d="M450 20 C220 20 40 40 40 200 C40 300 120 300 200 300 L640 300 C760 300 860 340 860 500 M450 60 C260 60 90 80 90 200 C90 260 150 260 210 260 L640 260 C790 260 880 320 880 500 M450 100 C300 100 140 120 140 200 C140 225 180 225 220 225 L640 225 C820 225 900 300 900 500"/></svg>
  </p>
  <p data-fx="lottie-path-draw" data-fx-lottie-path-draw="dur: 1; each: .3; at: .333">
    <svg data-fx-part="art" viewBox="0 0 600 200"><circle cx="100" cy="100" r="80"/><polyline points="220,160 280,40 340,160 400,40 460,160"/><circle data-kind="pop" data-at="1.2" cx="540" cy="100" r="24"/></svg>
  </p>
  <p id="again" data-fx="lottie-path-draw" data-fx-lottie-path-draw="when: event; dur: 1.2">
    <svg data-fx-part="art" viewBox="0 0 600 160"><path d="M20 120 C120 20 220 20 300 80 C380 140 480 140 580 40"/></svg>
  </p>
  <button type="button" id="play">Redraw the last line</button>
</div>
<script src="../../_vendor/lottie-web@5.6.6/lottie.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
  document.getElementById("play").addEventListener("click", () => document.getElementById("again")?.dispatchEvent(new CustomEvent("fx:play")));
  // Checks whether it attaches to late-arriving boards and whether missing boards get detached
  setTimeout(() => {
    const p = document.createElement("p");
    p.dataset.fx = "lottie-path-draw";
    p.innerHTML = '<svg data-fx-part="art" viewBox="0 0 400 120"><rect x="20" y="20" width="160" height="80"/><line x1="220" y1="100" x2="380" y2="20"/></svg>';
    document.getElementById("stage").prepend(p);
  }, 1000);
  setTimeout(() => document.querySelectorAll("#stage > p")[0]?.remove(), 2500);
</script>
</body>
</html>
