<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>water-warp-swap — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { margin: 0; background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint button { margin-left: 10px; padding: 4px 10px; border: 1px solid var(--kf-line); border-radius: var(--kf-radius-pill); background: none; cursor: pointer; }
  .card { margin: 60px 40px; max-width: 520px; display: grid; gap: 12px; }
  .card h2 { margin: 0; font: 500 64px/1 var(--kf-font-display); }
</style>
</head>
<body>
<p class="demo-hint"><b>water-warp-swap</b> — Press the button and the text switches across a wave. <button type="button" data-demo-next>Next task</button> (After 1s one more comes in, and after 2.5s one drops out)</p>
<div class="card" data-fx="water-warp-swap" data-demo-main><h2>Work name 1</h2><p>Two lines introducing the work go here.</p></div>
<div class="card" data-fx="water-warp-swap" data-demo-remove><h2>Card to drop</h2></div>
<div data-demo-late-host></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
const main = document.querySelector("[data-demo-main]");
let n = 1;
document.querySelector("[data-demo-next]").addEventListener("click", () => main.dispatchEvent(new CustomEvent("fx:swap", { detail: { apply: () => { main.querySelector("h2").textContent = `Work name ${++n}`; } } })));
setTimeout(() => {
  const d = document.createElement("div");
  d.className = "card"; d.dataset.fx = "water-warp-swap";
  d.innerHTML = "<h2>Late-arriving card</h2>";
  document.querySelector("[data-demo-late-host]").append(d);
  d.dispatchEvent(new CustomEvent("fx:swap", { detail: { apply: () => { d.querySelector("h2").textContent = "Instantly swapped card"; } } }));
}, 1000);
setTimeout(() => document.querySelector("[data-demo-remove]")?.remove(), 2500);
</script>
</body>
</html>
