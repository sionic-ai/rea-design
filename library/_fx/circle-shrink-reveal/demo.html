<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>circle-shrink-reveal — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 500 15px/1.6 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 10; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .spacer { height: 90vh; display: grid; place-items: center; color: var(--kf-dim); }
  .row { display: flex; gap: 40px; justify-content: center; padding: 40px 20px 60vh; }
  .row > div { width: 300px; height: 420px; }
</style>
</head>
<body>
<p class="demo-hint"><b>circle-shrink-reveal</b> Scroll down. When the photo enters the screen, the dark circle at top left shrinks and reveals the photo. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<div class="spacer">Scroll down</div>
<div class="row">
  <div data-fx="circle-shrink-reveal" style="border-radius: 150px 150px 0 0"><div style="height:100%;display:grid;place-items:center;background:var(--kf-raised);color:var(--kf-dim)">Arch photo</div></div>
  <div data-fx="circle-shrink-reveal" data-fx-circle-shrink-reveal="look: large" style="border-radius: 120px 0 0 0"><div style="height:100%;display:grid;place-items:center;background:var(--kf-raised);color:var(--kf-dim)">Large photo</div></div>
  <div data-fx="circle-shrink-reveal" data-demo-remove><div style="height:100%;display:grid;place-items:center;background:var(--kf-raised);color:var(--kf-dim)">Being removed soon</div></div>
  <template data-demo-late><div data-fx="circle-shrink-reveal" style="--fx-dur: 1.2s"><div style="height:100%;display:grid;place-items:center;background:var(--kf-raised);color:var(--kf-dim)">Enters late</div></div></template>
</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); window.ScrollTrigger?.refresh(); }, 2500);
</script>
</body>
</html>
