<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>spring-node-graph — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: sticky; top: 0; z-index: 10; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .graph { position: relative; width: min(90vw, 520px); aspect-ratio: 100 / 92; margin: 40px auto; }
  .graph svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .node { position: absolute; width: 72px; height: 72px; margin: -36px 0 0 -36px; border-radius: 50%; background: var(--kf-accent-soft); display: grid; place-items: center; text-decoration: none; color: inherit; }
  .graph:has(.n-a:hover) .l-a, .graph:has(.n-b:hover) .l-b, .graph:has(.n-c:hover) .l-c { stroke: var(--kf-accent); }
</style>
</head>
<body>
<p class="demo-hint"><b>spring-node-graph</b> — Drag the circle and release. The line bends along with it, and on release it springs back. <span style="color:var(--kf-dim)">(After 1s one more diagram comes in, and after 2.5s one drops out)</span></p>
<nav class="graph" data-fx="spring-node-graph" aria-label="Diagram">
  <svg viewBox="0 0 100 92" aria-hidden="true">
    <path class="l-a l-b" data-fx-part="line" data-from="a" data-to="b" data-points="50 10 70 10 85 25 85 60" d="M 50 10 C 70 10 85 25 85 60"/>
    <path class="l-b l-c" data-fx-part="line" data-from="b" data-to="c" data-points="85 60 85 85 30 85 15 60" d="M 85 60 C 85 85 30 85 15 60"/>
    <path class="l-c l-a" data-fx-part="line" data-from="c" data-to="a" data-points="15 60 15 25 30 10 50 10" d="M 15 60 C 15 25 30 10 50 10"/>
  </svg>
  <a class="node n-a" data-fx-part="node" data-key="a" href="#a" style="left: 50%; top: 10.87%">A</a>
  <a class="node n-b" data-fx-part="node" data-key="b" href="#b" style="left: 85%; top: 65.2%">B</a>
  <a class="node n-c" data-fx-part="node" data-key="c" href="#c" style="left: 15%; top: 65.2%">C</a>
</nav>
<nav class="graph" data-fx="spring-node-graph" data-demo-remove><a class="node" data-fx-part="node" data-key="z" href="#z" style="left: 50%; top: 50%">Being removed soon</a></nav>
<template data-demo-late><nav class="graph" data-fx="spring-node-graph" data-fx-spring-node-graph="stiff: 90; damp: 6"><a class="node" data-fx-part="node" data-key="late" href="#late" style="left: 50%; top: 50%">Loose</a></nav></template>
<nav class="graph" data-fx="spring-node-graph"></nav>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
