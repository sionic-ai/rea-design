<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>flip-card-path — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo-spacer { height: 90vh; display: grid; place-items: center; color: var(--kf-dim); }
  .path { position: relative; z-index: 1; display: grid; grid-template-columns: repeat(6, 1fr); gap: 20px; padding: 0 20px; }
  .path [data-fx-part="slot"] { aspect-ratio: 9/16; border: 1px dashed var(--kf-line); }
  .path .t { grid-column: 3 / 7; font: 500 22px/1.3 var(--kf-font-sans); }
  .gap { height: 70vh; grid-column: 1 / -1; }
</style>
</head>
<body>
<p class="demo-hint"><b>flip-card-path</b> Scroll slowly — a vertical card passes three dotted placeholders, tilts forward and flips half a turn at each one, and bulges in the middle when scrolled fast.</p>
<div class="demo-spacer">Scroll down</div>
<main class="path" data-fx="flip-card-path"><div data-fx-part="slot" style="grid-column:1/3"></div><p class="t">Text beside first slot</p><div class="gap"></div><div data-fx-part="slot" style="grid-column:4/6"></div><div class="gap"></div><div data-fx-part="slot" style="grid-column:1/3"></div><p class="t">Last spot</p><span data-fx-part="face" data-label="Figure 1"></span><span data-fx-part="face" data-label="Figure 2"></span><span data-fx-part="face" data-label="Figure 3"></span></main>
<div class="demo-spacer">Footer</div>
<script>
// Late arrivals and removals — checks that fx-core attaches to an element added after 1s and detaches from an element removed after 2.5s
(() => {
  const src = document.querySelector('[data-fx~="flip-card-path"]');
  if (!src) return;
  const html = src.outerHTML.replace(/\sid="[^"]*"/g, "");
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => (src.closest(".pin-spacer") || src).after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical one comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="three-global.js"></script>
<script src="../../_vendor/three@0.185.0/build/three.cjs"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
