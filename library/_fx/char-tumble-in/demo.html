<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>char-tumble-in — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.6 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .col { width: min(900px, 92vw); margin: 0 auto; padding: 12vh 0 60vh; }
  .big { font: italic 400 clamp(44px, 8vw, 110px)/1 var(--kf-font-display); margin: 0 0 80vh; }
  .ko { font: 700 40px/1.3 var(--kf-font-display); word-break: keep-all; margin: 40px 0; }
</style>
</head>
<body>
<p class="demo-hint"><b>char-tumble-in</b> — On open the big phrase flips into place one letter at a time. The Korean title below plays when scrolled into view. <span style="color:var(--kf-dim)">(One more title comes in after 1s, and one drops out after 2.5s)</span></p>
<div class="col">
  <p class="big" data-fx="char-tumble-in">A big phrase,<br>across two lines</p>
  <p class="ko" data-fx="char-tumble-in" data-demo-remove>Exit title</p>
  <p class="ko" data-fx="char-tumble-in" data-fx-char-tumble-in="on: scroll; ease: power2.out; dur: 1">Your two-line Korean title here, without breaking words</p>
  <div data-late-slot></div>
</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script>gsap.registerPlugin(ScrollTrigger);</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelector("[data-late-slot]").outerHTML = '<p class="ko" data-fx="char-tumble-in" data-fx-char-tumble-in="delay: 0">Late-arrived title</p>', 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
