<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ring-caption-type — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { display: flex; flex-wrap: wrap; gap: 60px; padding: 60px 40px; }
  .chara { width: 180px; }
  .chara svg.face { width: 62%; }
</style>
</head>
<body>
<p class="demo-hint"><b>ring-caption-type</b> — Words are written letter by letter around the character and change every 3 seconds. Click the character <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<section class="demo">
  <div class="chara" data-fx="ring-caption-type">
    <span data-fx-part="caption">Your one-line character monologue here.</span><span data-fx-part="caption">Second monologue</span>
    <span data-fx-part="face"><svg class="face" viewBox="0 0 100 100"><circle cx="50" cy="55" r="38" fill="currentColor"/><circle cx="38" cy="50" r="8" fill="var(--kf-bg)"/><circle cx="62" cy="50" r="8" fill="var(--kf-bg)"/></svg></span>
    <span data-fx-part="face"><svg class="face" viewBox="0 0 100 100"><rect x="18" y="20" width="64" height="70" rx="30" fill="currentColor"/><circle cx="38" cy="50" r="7" fill="var(--kf-bg)"/><circle cx="62" cy="50" r="7" fill="var(--kf-bg)"/></svg></span>
  </div>
  <div class="chara" data-demo-remove data-fx="ring-caption-type" data-fx-ring-caption-type="play: wait"><span data-fx-part="caption">Wait-then-spin type</span><span data-fx-part="caption">Next word</span></div>
  <template data-demo-late><div class="chara" data-fx="ring-caption-type" data-fx-ring-caption-type="play: click; start: 15"><span data-fx-part="caption">Changes only when pressed</span><span data-fx-part="caption">Late-arriving character</span></div></template>
</section>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
