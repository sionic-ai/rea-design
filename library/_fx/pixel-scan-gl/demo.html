<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pixel-scan-gl — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { margin: 0; background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; margin: 0; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .box { position: relative; height: 70vh; margin: 24px; border-radius: var(--kf-radius-md); overflow: hidden; display: grid; place-items: center; }
  .box > [data-fx] { position: absolute; inset: 0; }
  .box h2 { position: relative; z-index: 2; margin: 0; font: 600 48px/1 var(--kf-font-display); }
</style>
</head>
<body>
<p class="demo-hint"><b>pixel-scan-gl</b> — The first panel is a CRT veil over a photo, the second a scan bar moving up and down, the third a square tunnel that deepens with scroll. After 1s a spiral card attaches and after 2.5s the second panel is detached.</p>
<div class="box"><div class="wf-img" style="position:absolute;inset:0" data-label="Night city building photo"></div><div data-fx="pixel-scan-gl" data-fx-pixel-scan-gl="look: crt"></div><h2>Your title here</h2></div>
<div class="box"><div data-fx="pixel-scan-gl" data-fx-pixel-scan-gl="look: scan; warn: .6" data-demo-remove></div><h2>Scan Bar</h2></div>
<div class="box"><div data-fx="pixel-scan-gl" data-fx-pixel-scan-gl="look: tunnel"></div><h2>Square Tunnel</h2></div>
<template data-demo-late><div class="box" style="background:var(--kf-surface)"><div data-fx="pixel-scan-gl" data-fx-pixel-scan-gl="look: spiral"></div><h2>Spiral Card</h2></div></template>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
