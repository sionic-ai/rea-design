<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>edge-fill-hover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; min-height: 100vh; }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-row { display: grid; gap: 12px; padding: 40px 20px; max-width: 520px; }
  .demo-row a { display: block; padding: 22px 28px; border: 1px solid var(--kf-line); border-radius: 40px; text-decoration: none; }
</style>
</head>
<body>
<p class="demo-hint"><b>edge-fill-hover</b> — Move the mouse in and out over the top or bottom of the button. The background fills from the side you entered and drains to the side you left.</p>
<div class="demo-row" data-demo-row>
  <a href="#" data-fx="edge-fill-hover"><span data-fx-part="bg"></span>Your button text here</a>
  <a href="#" data-fx="edge-fill-hover"><span data-fx-part="bg"></span>Second button</a>
</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
const row = document.querySelector("[data-demo-row]");
// After 1s add one button and an empty button with no backing plate, then remove the first button to see it detach
setTimeout(() => {
  const a = document.createElement("a");
  a.href = "#";
  a.dataset.fx = "edge-fill-hover";
  a.innerHTML = '<span data-fx-part="bg"></span>Late-arrived Button';
  const empty = document.createElement("a");
  empty.dataset.fx = "edge-fill-hover";
  row.append(a, empty);
  setTimeout(() => { row.firstElementChild.remove(); empty.remove(); }, 1500);
}, 1000);
</script>
</body>
</html>
