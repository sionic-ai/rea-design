<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>step-progress — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { padding: 48px 20px; }
  .demo-spacer { height: 90vh; display: grid; place-items: center; color: var(--kf-dim); }

  ol[data-fx] { display: flex; align-items: center; gap: 0; max-width: 720px; padding: 0; }
  ol[data-fx] li { list-style: none; display: grid; justify-items: center; gap: 8px; font: 500 11px/1 var(--kf-font-mono); color: var(--kf-dim); }
  [data-fx-part="box"] { width: 28px; height: 28px; border: 1px solid var(--kf-line); background: var(--kf-surface); }
  li[data-state="done"] [data-fx-part="box"] { background: var(--kf-ink); } li[data-state="current"] [data-fx-part="box"] { border-color: var(--kf-accent); background: var(--kf-accent); } li[data-state="current"] { color: var(--kf-ink); }
  [data-fx-part="link"] { flex: 1; height: 2px; margin: 0 8px 18px; background: var(--kf-ink); }
</style>
</head>
<body>
<p class="demo-hint"><b>step-progress</b> — The step advances one at a time every two beats. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<section class="demo"><ol data-demo-remove data-fx="step-progress"><li><b data-fx-part="box"></b>Step 1</li><i data-fx-part="link"></i><li><b data-fx-part="box"></b>Step 2</li><i data-fx-part="link"></i><li><b data-fx-part="box"></b>Step 3</li><i data-fx-part="link"></i><li><b data-fx-part="box"></b>Step 4</li></ol><ol data-fx="step-progress"><li><b data-fx-part="box"></b>Step 1</li><i data-fx-part="link"></i><li><b data-fx-part="box"></b>Step 2</li><i data-fx-part="link"></i><li><b data-fx-part="box"></b>Step 3</li><i data-fx-part="link"></i><li><b data-fx-part="box"></b>Step 4</li></ol><template data-demo-late><ol data-fx="step-progress"><li><b data-fx-part="box"></b>Step 1</li><i data-fx-part="link"></i><li><b data-fx-part="box"></b>Step 2</li><i data-fx-part="link"></i><li><b data-fx-part="box"></b>Step 3</li><i data-fx-part="link"></i><li><b data-fx-part="box"></b>Step 4</li></ol></template></section>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../../../_shared/vendor/gsap/CustomEase.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); window.ScrollTrigger?.refresh(); }, 2500);
</script>
</body>
</html>
