<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>paper-stack-reveal — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); overflow-x: hidden; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-spacer { height: 90vh; display: grid; place-items: center; color: var(--kf-dim); }
  .wrap { width: 400px; margin: 0 auto 160px; }
  .card { padding: 60px 20px; border: 1px solid var(--kf-line); border-radius: var(--kf-radius-md); background: var(--kf-surface); text-align: center; }
  .sheet { border: 1px solid var(--kf-line); border-radius: var(--kf-radius-md); background: var(--kf-accent-soft); }
  .sticker { top: -20px; right: 10px; width: 50px; height: 50px; border-radius: 50%; background: var(--kf-accent); }
</style>
</head>
<body>
<p class="demo-hint"><b>paper-stack-reveal</b> — Scroll and the card rises into place while two sheets of paper behind it slide in from where they moved aside.</p>
<div class="demo-spacer">Scroll down</div>
<section class="wrap" data-fx="paper-stack-reveal"><i class="sheet" data-fx-part="sheet" style="--fx-tilt: -10deg"></i><i class="sheet" data-fx-part="sheet" style="--fx-tilt: -5deg"></i><div class="card" data-fx-part="card">Your card content here</div><i class="sticker" data-fx-part="sticker"></i></section>
<section class="wrap" data-fx="paper-stack-reveal" data-fx-paper-stack-reveal="side: right"><i class="sheet" data-fx-part="sheet" style="--fx-tilt: 10deg"></i><i class="sheet" data-fx-part="sheet" style="--fx-tilt: 5deg"></i><div class="card" data-fx-part="card">Paper coming from the right</div></section>
<div class="demo-spacer"></div>
<script>
(() => {
  const src = document.querySelector('[data-fx~="paper-stack-reveal"]');
  const html = src.outerHTML;
  const make = () => { const t = document.createElement("template"); t.innerHTML = html; return t.content.firstElementChild; };
  const gone = make(); src.after(gone);
  setTimeout(() => src.after(make()), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s one more of the same comes in, and after 2.5s one drops out.");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
