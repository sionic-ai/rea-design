<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>edge-hover-drawer — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); padding: 24px; min-height: 100vh; }
  .demo-hint { margin-bottom: 24px; font: 500 13px/1.4 var(--kf-font-mono); max-width: 60ch; }
  nav ul { list-style: none; margin: 0; padding: 0; }
  [data-fx-part="inner"] { position: absolute; left: 32px; bottom: 32px; }
  [data-fx-part="inner"] li { margin-bottom: 10px; font-size: 18px; }
  [data-fx-part="toggle"] { padding: 8px 12px; border: 1px solid var(--kf-line); background: var(--kf-surface); color: var(--kf-ink); }
</style>
</head>
<body>
<p class="demo-hint"><b>edge-hover-drawer</b> — Hover the mouse over the right edge of the screen — a drawer slides out (at first it peeks halfway, then hides). On devices without a pointer, press ”Menu”. (After 1 second one more empty drawer slides in, and after 2.5 seconds it leaves)</p>
<div data-fx="edge-hover-drawer" data-fx-edge-hover-drawer="peek: on">
  <nav data-fx-part="panel"><div data-fx-part="inner"><ul><li>Menu 1</li><li>Menu 2</li><li>Menu 3</li></ul></div></nav>
  <button type="button" data-fx-part="toggle">Menu</button>
</div>
<template data-demo-late><div data-demo-remove data-fx="edge-hover-drawer" style="width:40px;top:auto;bottom:0;height:120px"><div data-fx-part="panel"></div></div></template>
<div data-fx="edge-hover-drawer" style="display:none"></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
