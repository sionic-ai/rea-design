<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>grad-blob-breathe — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { margin: 0; padding: 12px 20px; border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .stage { position: relative; height: 70vh; overflow: hidden; border-bottom: 1px solid var(--kf-line); }
  .stage h2 { position: relative; z-index: 1; padding: 60px 40px; font-size: 40px; }
  .blob { position: absolute; width: 420px; height: 380px; }
  .spacer { height: 60vh; }
</style>
</head>
<body>
<p class="demo-hint"><b>grad-blob-breathe</b> — Scroll down. When a blob comes into view it floats up and wobbles, it hides when out of view.</p>
<section class="stage" id="stage">
  <h2>Section Title</h2>
  <div class="blob" data-fx="grad-blob-breathe" style="left: -120px; top: 120px"></div>
  <div class="blob" data-fx="grad-blob-breathe" data-fx-grad-blob-breathe="dur: 8.3" style="right: -100px; top: 0; --fx-c1: oklch(from var(--kf-accent) l c calc(h + 70)); --fx-c2: oklch(from var(--kf-accent) l c calc(h + 150))"></div>
</section>
<div class="spacer"></div>
<section class="stage" id="stage2"><h2>Second Section</h2><div class="blob" data-fx="grad-blob-breathe" style="left: 30%; top: 10%"></div></section>
<div class="spacer"></div>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
  // Checks whether it attaches to late-added blocks and whether removed blocks get detached
  setTimeout(() => {
    const d = document.createElement("div");
    d.className = "blob";
    d.dataset.fx = "grad-blob-breathe";
    d.style.cssText = "right: 10%; bottom: -120px; --fx-c1: oklch(from var(--kf-accent) l c calc(h - 115))";
    document.getElementById("stage").append(d);
  }, 1000);
  setTimeout(() => document.querySelector("#stage2 .blob")?.remove(), 2500);
</script>
</body>
</html>
