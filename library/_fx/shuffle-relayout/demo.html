<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>shuffle-relayout — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { padding: 48px 20px; overflow: hidden; }
  .board { font: var(--kf-weight-display) clamp(40px, 7vw, 96px)/1 var(--kf-font-mono); height: 3.6em; }
  .board p { height: 0.8em; line-height: 0.8em; overflow: hidden; margin-bottom: 0.1em; }
  .board a:hover { color: var(--kf-accent); }
  .demo-spacer { height: 90vh; display: grid; place-items: center; color: var(--kf-dim); }
</style>
</head>
<body>
<p class="demo-hint"><b>shuffle-relayout</b> — Four words move to a different cell layout every 4 seconds while the letters shuffle into place. On narrow screens they stay stacked and only shuffle.</p>
<section class="demo">
  <div class="board" data-fx="shuffle-relayout" data-fx-shuffle-relayout="every: 4; dur: 2">
    <p data-fx-part="row" data-at="0 0, 3 0, 1 0"><a href="#"><span data-fx-part="text">H</span></a><a href="#"><span data-fx-part="text">O</span></a><a href="#"><span data-fx-part="text">L</span></a><a href="#"><span data-fx-part="text">D</span></a></p>
    <p data-fx-part="row" data-at="5 0, 0 1, 6 0"><a href="#"><span data-fx-part="text">T</span></a><a href="#"><span data-fx-part="text">H</span></a><a href="#"><span data-fx-part="text">I</span></a><a href="#"><span data-fx-part="text">S</span></a></p>
    <p data-fx-part="row" data-at="2 1, 5 1, 0 2"><a href="#"><span data-fx-part="text">P</span></a><a href="#"><span data-fx-part="text">L</span></a><a href="#"><span data-fx-part="text">A</span></a><a href="#"><span data-fx-part="text">C</span></a><a href="#"><span data-fx-part="text">E</span></a></p>
    <p data-fx-part="row" data-at="1 2, 2 2, 4 3"><a href="#"><span data-fx-part="text">N</span></a><a href="#"><span data-fx-part="text">O</span></a><a href="#"><span data-fx-part="text">W</span></a></p>
  </div>
</section>
<div class="demo-spacer">Scroll down — the beat stops once it leaves view, and when you return it shifts one step right away</div>
<script>
(() => {
  const src = document.querySelector('[data-fx~="shuffle-relayout"]');
  const html = src.outerHTML;
  const make = () => { const t = document.createElement("template"); t.innerHTML = html; return t.content.firstElementChild; };
  // If devtools opens it with an empty element, src changes and 1 second later there is no parent — grab the parent at the start
  const host = src.parentElement;
  const gone = make(); src.after(gone);
  setTimeout(() => host.append(make()), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s one more of the same panel comes in, and after 2.5s one drops out.");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../_vendor/shuffle-text@0.3.6/shuffle-text.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
