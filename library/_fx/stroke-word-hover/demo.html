<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>stroke-word-hover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .menu { display: grid; grid-template-columns: repeat(4, 1fr); align-items: center; gap: 20px; min-height: 50vh; padding: 40px 20px; }
  .menu.two { grid-template-columns: repeat(2, 1fr); --fx-height: 60px; }
</style>
</head>
<body>
<p class="demo-hint"><b>stroke-word-hover</b> — Hover over a word. Only that word stays and the rest fade away. <span style="color:var(--kf-dim)">(One more list comes in after 1s, and one drops out after 2.5s)</span></p>
<ul class="menu" data-fx="stroke-word-hover">
  <li><a href="#" data-fx-part="word">About</a></li>
  <li><a href="#" data-fx-part="word">Backstage</a></li>
  <li><a href="#" data-fx-part="word">Credits</a></li>
  <li><a href="#" data-fx-part="word">Movies</a></li>
</ul>
<ul class="menu two" data-fx="stroke-word-hover" data-fx-stroke-word-hover="first: 1.2" data-demo-remove><li><a href="#" data-fx-part="word">Goodbye</a></li><li><a href="#" data-fx-part="word">About</a></li></ul>
<template data-demo-late><ul class="menu two" data-fx="stroke-word-hover"><li>No words — quiet</li></ul></template>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
