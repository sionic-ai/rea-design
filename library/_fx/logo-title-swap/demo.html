<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>logo-title-swap — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .head { position: sticky; top: 44px; z-index: 90; display: flex; justify-content: center; gap: 24px; height: 68px; background: var(--kf-bg); border-bottom: 1px solid var(--kf-line); }
  .swap { display: block; width: 160px; height: 100%; }
  .swap b { font: 700 22px/1 var(--kf-font-display); letter-spacing: .1em; }
  .body { height: 300vh; padding: 40px; }
</style>
</head>
<body>
<p class="demo-hint"><b>logo-title-swap</b> — After 2 seconds the logo slides up and out and the page name rises in. Scroll down for the name, scroll up for the logo. <span style="color:var(--kf-dim)">(After 1s one more cell comes in, and one leaves 2.5s later)</span></p>
<header class="head">
  <a class="swap" href="#" data-demo-remove data-fx="logo-title-swap"><span data-fx-part="logo"><b>LOGO</b></span><span data-fx-part="title">Page name</span></a>
  <a class="swap" href="#" data-fx="logo-title-swap" data-fx-logo-title-swap="delay: 0.5; dur: 0.3"><span data-fx-part="logo"><b>LOGO</b></span><span data-fx-part="title">Fast Cell</span></a>
  <a class="swap" href="#" data-fx="logo-title-swap"><span>Childless cell</span></a>
  <template data-demo-late><a class="swap" href="#" data-fx="logo-title-swap"><span data-fx-part="logo"><b>LATE</b></span><span data-fx-part="title">Late-arriving cell</span></a></template>
</header>
<div class="body">Scroll the page down and back up.</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
