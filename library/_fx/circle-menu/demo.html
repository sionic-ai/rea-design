<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>circle-menu — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { display: flex; justify-content: flex-end; gap: 12px; padding: 48px 20px; }
  .demo-btn { position: relative; z-index: 60; height: 44px; padding: 0 18px; border: 1px solid var(--kf-line); border-radius: var(--kf-radius-pill); background: var(--kf-surface); color: var(--kf-ink); cursor: pointer; }
  nav[data-fx-part="panel"] { display: grid; align-content: center; gap: 12px; padding: 80px 40px; background: var(--kf-accent); color: var(--kf-on-accent); }
  nav a { font: 800 clamp(28px, 5vw, 56px)/1.1 var(--kf-font-display); color: inherit; text-decoration: none; }
</style>
</head>
<body>
<p class="demo-hint"><b>circle-menu</b> — Press the Menu button on the right. Press it again or hit Esc to close.</p>
<section class="demo">
  <div data-fx="circle-menu"><button class="demo-btn" data-fx-part="trigger" aria-label="Menu">Menu</button>
    <nav data-fx-part="panel"><a data-fx-part="item" href="#">Menu 1</a><a data-fx-part="item" href="#">Menu 2</a><a data-fx-part="item" href="#">Menu 3</a><a data-fx-part="item" href="#">Menu 4</a></nav></div>
</section>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script>
// Late arrivals and removals — checks that fx-core attaches to an element added after 1s and detaches from an element removed after 2.5s
(() => {
  const src = document.querySelector('[data-fx~="circle-menu"]');
  if (!src) return;
  const html = src.outerHTML.replace(/\sid="[^"]*"/g, "");
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => (src.closest(".pin-spacer") || src).after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical one comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
