<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>crt-panel-menu — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: sticky; top: 0; z-index: 10; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-toggle { position: fixed; top: 0; right: 0; z-index: 80; width: 80px; height: 80px; background: var(--kf-contrast-bg); color: var(--kf-contrast-ink); border: 0; font: 500 12px var(--kf-font-sans); letter-spacing: .1em; }
  .demo-panel { position: fixed; inset: 0; z-index: 70; display: grid; grid-template-rows: 1fr auto; padding: 120px 40px 24px; background: var(--kf-contrast-bg); color: var(--kf-contrast-ink); }
  .demo-panel ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; font: 400 48px/1.1 var(--kf-font-display); }
  .demo-panel [data-fx-part="channel"] { position: absolute; top: 30px; left: 40px; margin: 0; font: 12px var(--kf-font-mono); letter-spacing: .16em; }
  .demo-panel [data-fx-part="wave"] { width: 100%; height: 56px; }
  section.page { height: 70vh; padding: 40px; border-bottom: 1px solid var(--kf-line); }
</style>
</head>
<body>
<p class="demo-hint"><b>crt-panel-menu</b> — Press the top-right button. The panel switches on like a CRT, and hovering over the list changes the channel number and waveform. <span style="color:var(--kf-dim)">(After 1s one more menu item comes in, and after 2.5s one drops out)</span></p>
<section class="page" id="one">Section 1</section>
<section class="page" id="two">Section 2</section>
<div data-fx="crt-panel-menu">
  <button class="demo-toggle" data-fx-part="toggle" type="button" aria-controls="demo-menu">MENU</button>
  <nav class="demo-panel" id="demo-menu" data-fx-part="panel" aria-label="Menu">
    <div data-fx-part="noise"></div>
    <div data-fx-part="static"></div>
    <p data-fx-part="channel">CH <span data-fx-part="channel-num">01</span></p>
    <div data-fx-part="body"><ol><li><a data-channel="01" data-cycles="5" href="#one">Menu One</a></li><li><a data-channel="02" data-cycles="9" href="#two">Menu Two</a></li></ol></div>
    <svg data-fx-part="wave" aria-hidden="true"></svg>
  </nav>
</div>
<div data-fx="crt-panel-menu" data-demo-remove><button data-fx-part="toggle" type="button" hidden>Being removed soon</button><nav data-fx-part="panel" hidden></nav></div>
<template data-demo-late><div data-fx="crt-panel-menu" data-fx-crt-panel-menu="cycles: 4"><button data-fx-part="toggle" type="button" hidden>Late-arrived Menu</button><nav data-fx-part="panel" hidden></nav></div></template>
<div data-fx="crt-panel-menu"></div>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
