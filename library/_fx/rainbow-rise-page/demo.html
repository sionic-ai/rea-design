<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rainbow-rise-page — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { padding: 40px 20px; display: flex; gap: 12px; flex-wrap: wrap; min-height: 60vh; }
  .demo a, .demo button { padding: 12px 18px; border-radius: var(--kf-radius-pill); background: var(--kf-raised); }
</style>
</head>
<body>
<p class="demo-hint"><b>rainbow-rise-page</b> — Click a link — a color band rises from the bottom to cover the page, the same page reopens and the band lifts upward. <span style="color:var(--kf-dim)">(After 1s one more panel comes in, and one leaves 2.5s later)</span></p>
<main class="demo" data-fx="rainbow-rise-page">
  <a href="demo.html?p=2">Same-site link</a>
  <a href="#here">Same page #</a>
  <button type="button" onclick="this.closest('main').fxRainbowRisePage.cover().then(() => this.closest('main').fxRainbowRisePage.reveal())">Calling cover → reveal</button>
</main>
<div class="demo" data-fx="rainbow-rise-page" data-fx-rainbow-rise-page="links: off" data-demo-remove></div>
<template data-demo-late><div class="demo" data-fx="rainbow-rise-page" data-fx-rainbow-rise-page="leave: 0.3; enter: 0.3; links: off"></div></template>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => { const t = document.querySelector("template[data-demo-late]"); document.body.append(t.content.cloneNode(true)); }, 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
