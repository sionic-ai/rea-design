<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bar-curtain-cover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .pad { height: 110vh; display: grid; place-content: center; font: 600 32px/1.2 var(--kf-font-display); }
  .philo { min-height: 220vh; }
  .philo__text { position: relative; z-index: 2; padding: 30vh 10vw; font: 600 48px/1.3 var(--kf-font-display); }
</style>
</head>
<body>
<p class="demo-hint"><b>bar-curtain-cover</b> Scroll down. Bars rise one by one to cover the screen, then slide up and out when the section ends. <span style="color:var(--kf-dim)">(After 1s one more empty section comes in, after 2.5s another empty section leaves)</span></p>
<section class="pad">Your previous page here</section>
<section class="philo" data-fx="bar-curtain-cover"><div data-fx-part="curtain"></div><div class="philo__text">Your philosophy title here<br>Keep it to two lines.</div></section>
<section class="pad">Your next section here</section>
<div data-fx="bar-curtain-cover" data-demo-remove></div>
<template data-demo-late><div data-fx="bar-curtain-cover" data-fx-bar-curtain-cover="bars: 9"></div></template>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script>gsap.registerPlugin(ScrollTrigger);</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
