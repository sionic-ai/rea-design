<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>confetti-fall — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .sec { min-height: 120vh; margin-top: 260px; padding: 60px 20px; background: var(--kf-accent-soft); }
  .sec p { position: relative; z-index: 1; }
</style>
</head>
<body>
<p class="demo-hint"><b>confetti-fall</b> Confetti slowly falls behind the section, swaying and spinning (it stays still at 1279px and below). Just watch.</p>
<section class="sec" data-fx="confetti-fall"><p>Your section title, one line, here.</p></section>
<script>
// Late arrivals and removals — checks that fx-core attaches to an element added after 1s and detaches from an element removed after 2.5s
(() => {
  const make = (tag) => { const s = document.createElement("section"); s.className = "sec"; s.dataset.fx = "confetti-fall"; s.dataset.demo = tag; s.style.minHeight = "60vh"; return s; };
  const gone = make("gone");
  document.body.append(gone);
  setTimeout(() => document.body.append(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical section comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
