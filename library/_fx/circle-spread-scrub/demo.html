<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>circle-spread-scrub — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo-spacer { height: 90vh; display: grid; place-items: center; color: var(--kf-dim); }
  .cs { padding: 280px 40px 120px; display: grid; gap: 80px; }
  .cs [data-fx-part="circle"] { background-color: var(--kf-raised); }
  .cs .box { max-width: 900px; margin: 0 auto; width: 100%; padding: 60px; border: 1px dashed var(--kf-dim); border-radius: 10px; background: var(--kf-surface); }
</style>
</head>
<body>
<p class="demo-hint"><b>circle-spread-scrub</b> — Scroll down and the small circle at the top of the section spreads into a large ellipse covering the whole section. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<div class="demo-spacer">Scroll down</div>
<div class="cs" data-demo-remove data-fx="circle-spread-scrub"><div data-fx-part="circle"></div><div class="box">One box</div><div class="box">Box two</div></div>
<div class="cs" data-fx="circle-spread-scrub"><div data-fx-part="circle"></div><div class="box">One box</div><div class="box">Box two</div><div class="box">Box three</div></div>
<template data-demo-late><div class="cs" data-fx="circle-spread-scrub"><div data-fx-part="circle"></div><div class="box">Late-arriving section</div></div></template>
<div class="demo-spacer"></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); window.ScrollTrigger?.refresh(); }, 2500);
</script>
</body>
</html>
