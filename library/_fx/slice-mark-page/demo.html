<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>slice-mark-page — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { padding: 40px 20px; display: flex; gap: 16px; }
  .demo a { padding: 12px 18px; border: 1px solid var(--kf-line); }
</style>
</head>
<body>
<p class="demo-hint"><b>slice-mark-page</b> — Click the link below: a black curtain rises to cover, the logo top piece blinks, then it returns to this page and the curtain lifts up.</p>
<div class="demo"><a href="demo.html?again=1">Reopen this page</a><a href="#top">Same-spot link (no page turn)</a></div>
<div data-fx="slice-mark-page" aria-hidden="true">
  <svg data-fx-part="mark" viewBox="0 0 100 100" fill="currentColor"><rect x="0" y="20" width="16" height="60"/><rect x="21" y="20" width="16" height="60"/><rect x="42" y="20" width="16" height="60"/><rect x="63" y="20" width="16" height="60"/><rect x="84" y="20" width="16" height="60"/></svg>
</div>
<script>
(() => {
  const src = document.querySelector('[data-fx~="slice-mark-page"]');
  if (!src) return;
  const gone = document.createElement("div");
  gone.dataset.fx = "slice-mark-page"; gone.dataset.demo = "gone"; gone.setAttribute("aria-hidden", "true");
  document.body.append(gone);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · A curtain without a logo comes in and leaves 2.5s later (detach).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
