<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>speed-parallax — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); overflow-x: hidden; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-spacer { height: 90vh; display: grid; place-items: center; color: var(--kf-dim); }
  .stage { position: relative; height: 140vh; }
  .orb { position: absolute; width: 90px; aspect-ratio: 1; border-radius: 50%; background: radial-gradient(circle at 35% 30%, var(--kf-surface), var(--kf-accent)); }
  .orb span { position: absolute; inset: 0; display: grid; place-items: center; font: 600 12px/1 var(--kf-font-mono); }
</style>
</head>
<body>
<p class="demo-hint"><b>speed-parallax</b> — Scroll and the balls with bigger numbers (speed multiplier) pass by faster.</p>
<div class="demo-spacer">Scroll down</div>
<section class="stage"><div class="orb" style="left: 10%; top: 30%" data-fx="speed-parallax" data-fx-speed-parallax="speed: .5"><span>.5</span></div><div class="orb" style="left: 35%; top: 40%" data-fx="speed-parallax" data-fx-speed-parallax="speed: 2"><span>2</span></div><div class="orb" style="left: 60%; top: 30%" data-fx="speed-parallax" data-fx-speed-parallax="speed: 5"><span>5</span></div><div class="orb" style="left: 82%; top: 50%" data-fx="speed-parallax"><span>1</span></div></section>
<div class="demo-spacer"></div>
<script>
(() => {
  const src = document.querySelector('[data-fx~="speed-parallax"]');
  const html = src.outerHTML;
  const make = () => { const t = document.createElement("template"); t.innerHTML = html; return t.content.firstElementChild; };
  const gone = make(); src.after(gone);
  setTimeout(() => src.after(make()), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s one more of the same comes in, and after 2.5s one drops out.");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
