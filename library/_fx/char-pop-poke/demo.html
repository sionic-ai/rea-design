<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>char-pop-poke — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { padding: 48px 20px; display: grid; gap: 60px; }
  .demo-spacer { height: 90vh; display: grid; place-items: center; color: var(--kf-dim); }
  h2 { font: 700 64px/1 var(--kf-font-display); text-transform: uppercase; }
  .mark { display: flex; gap: 6px; font: 800 120px/1 var(--kf-font-display); }
</style>
</head>
<body>
<p class="demo-hint"><b>char-pop-poke</b> — Scroll down to see the title pop up, then move the mouse over the letters. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<section class="demo">
  <h1 class="mark" data-fx="char-pop-poke" data-fx-char-pop-poke="pop: off"><span data-fx-part="char">P</span><span data-fx-part="char">O</span><span data-fx-part="char">K</span><span data-fx-part="char">E</span></h1>
  <h2 data-fx="char-pop-poke" data-demo-remove>Soon removed</h2>
</section>
<div class="demo-spacer">Downward</div>
<section class="demo">
  <h2 data-fx="char-pop-poke">A big headline set across two lines</h2>
  <h2 data-fx="char-pop-poke">Your two-line title here</h2>
  <template data-demo-late><h2 data-fx="char-pop-poke" data-fx-char-pop-poke="each: .05">Late arrival</h2></template>
</section>
<div class="demo-spacer"></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script>gsap.registerPlugin(ScrollTrigger);</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); window.ScrollTrigger?.refresh(); }, 2500);
</script>
</body>
</html>
