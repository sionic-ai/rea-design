<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tag-hole-wipe — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { padding: 24px 20px; display: grid; gap: 24px; }
  .box { position: relative; height: 320px; border: 1px solid var(--kf-line); overflow: hidden; }
  .box .page { position: absolute; inset: 0; background: var(--kf-accent); color: var(--kf-on-accent); display: grid; place-items: center; font-size: 28px; }
  button { padding: 8px 14px; border: 1px solid var(--kf-line); background: var(--kf-surface); color: var(--kf-ink); cursor: pointer; }
</style>
</head>
<body>
<div data-fx="tag-hole-wipe" id="loader"></div>
<p class="demo-hint"><b>tag-hole-wipe</b> — On first open a logo-shaped hole forms in the curtain and grows past the screen. The lower panel opens like a new page in a tab shape. <button onclick="document.querySelectorAll('[data-fx~=tag-hole-wipe]').forEach((e) => { e.style.visibility = ''; e.dispatchEvent(new CustomEvent('fx:play')); })">Again</button> <span style="color:var(--kf-dim)">(After 1s one more panel comes in, and one leaves 2.5s later)</span></p>
<section class="demo">
  <div class="box"><div class="page" data-fx="tag-hole-wipe" data-fx-tag-hole-wipe="mode: reveal">New page</div></div>
  <div class="box" data-demo-remove><div class="page" data-fx="tag-hole-wipe" data-fx-tag-hole-wipe="mode: reveal; dur: 2">Dropped Panel</div></div>
  <template data-demo-late><div class="box"><div class="page" data-fx="tag-hole-wipe" data-fx-tag-hole-wipe="mode: reveal; delay: .3">Late-entering Panel</div></div></template>
</section>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/CustomEase.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); }, 2500);
</script>
</body>
</html>
