<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>light-on-photo — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.6 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: sticky; top: 0; z-index: 100; margin: 0; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo-stage { height: 70vh; margin: 24px; border: 1px solid var(--kf-line); }
  .demo-stage .wf-img { position: absolute; inset: 0; }
  .demo-spacer { height: 60vh; display: grid; place-items: center; color: var(--kf-dim); }
</style>
</head>
<body>
<p class="demo-hint"><b>light-on-photo</b> — 2 seconds after opening, the ”lit photo” on the top panel brightens as if overflowing, and the panel recedes over 4 seconds. The bottom panel lights up when it enters the screen. <span style="color:var(--kf-dim)">(After 1s one more panel comes in, and one leaves 2.5s later)</span></p>
<div class="demo-stage" data-fx="light-on-photo" data-fx-light-on-photo="wait: demo:open"><div data-fx-part="frame"><div class="wf-img" data-label="Unlit building main entrance · night · full-width landscape"></div><div class="wf-img" data-fx-part="lit" data-label="Same front gate · Lights on in door and windows"></div></div></div>
<div class="demo-stage" data-fx="light-on-photo" data-demo-remove><div data-fx-part="frame"><div class="wf-img" data-label="Panel that drops out after 2.5s"></div><div class="wf-img" data-fx-part="lit" data-label="Active panel"></div></div></div>
<div class="demo-spacer">Scroll down</div>
<template data-demo-late><div class="demo-stage" data-fx="light-on-photo" data-fx-light-on-photo="delay: .5; zoom: 1"><div data-fx-part="frame"><div class="wf-img" data-label="Late-arriving panel · no zoom"></div><div class="wf-img" data-fx-part="lit" data-label="Active panel"></div></div></div></template>
<div class="demo-spacer"></div>

<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
addEventListener("load", () => setTimeout(() => document.dispatchEvent(new Event("demo:open")), 300));
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); window.ScrollTrigger?.refresh(); }, 2500);
</script>
</body>
</html>
