<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>vt-swap-page — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); min-height: 100vh; }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  main { padding: 40px 20px; display: grid; gap: 16px; }
  main a { text-decoration: underline; }
  ::view-transition-new(root) { animation-duration: .6s; }
</style>
</head>
<body>
<p class="demo-hint"><b>vt-swap-page</b> — Open over http and click the links below. This line stays and only the panel below changes.</p>
<div data-fx="vt-swap-page"><main><a href="demo.html?n=2">Switch to another address of the same demo</a><p>Rotating panel — time of day each time it opens: <span class="t"></span></p><script>document.querySelectorAll(".t").forEach((n) => (n.textContent = new Date().toLocaleTimeString()));</script></main></div>
<div data-fx="vt-swap-page" data-demo-remove>Second wrapper (wraps nothing)</div>
<template data-demo-late><div data-fx="vt-swap-page" data-fx-vt-swap-page="vt: 0; lag: 0.1">Late-arrived Rapper</div></template>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
