<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pill-drawer-menu — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { margin: 0; min-height: 200vh; background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .bar { position: fixed; left: 50%; bottom: 28px; translate: -50% 0; z-index: 50; }
  .bar.is-late { bottom: 120px; }
  .bar a { display: block; padding: 22px 20px; color: inherit; font: 500 16px/1 var(--kf-font-display); text-decoration: none; }
  .bar [data-fx-part="inner"] a { padding: 0; font-size: 22px; }
  .bar [data-fx-part="inner"] a + a { margin-top: 44px; }
</style>
</head>
<body>
<p class="demo-hint"><b>pill-drawer-menu</b> — Press the right circle (menu) of the pill at the bottom of the screen. Click outside or press Esc to close.</p>
<nav class="bar" data-fx="pill-drawer-menu">
  <div data-fx-part="pill">
    <a data-fx-part="item" href="#">Home</a>
    <a data-fx-part="item" href="#">Access</a>
    <a data-fx-part="item" href="#">Contact</a>
    <div data-fx-part="panel"><div data-fx-part="inner">
      <a data-fx-part="link" href="#">Menu 1</a><a data-fx-part="link" href="#">Menu 2</a><a data-fx-part="link" href="#">Menu 3</a>
      <a data-fx-part="link" href="#">Menu 4</a><a data-fx-part="link" href="#">Menu 5</a><a data-fx-part="link" href="#">Menu 6</a>
    </div></div>
  </div>
  <button data-fx-part="toggle" type="button" aria-label="Menu"><span></span><span></span><span></span></button>
</nav>
<script>
// Late arrivals and removals — checks that fx-core attaches to an element added after 1s and detaches from an element removed after 2.5s
(() => {
  const src = document.querySelector('[data-fx~="pill-drawer-menu"]');
  const make = () => { const el = src.cloneNode(true); el.classList.add("is-late"); return el; };
  const gone = make();
  document.body.append(gone);
  setTimeout(() => document.body.append(make()), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical one comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
