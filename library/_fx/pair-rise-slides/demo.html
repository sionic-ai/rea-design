<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pair-rise-slides — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 1000; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .stage { display: grid; gap: 40px; padding: 40px; }
  .box { height: 70vh; border-radius: var(--kf-radius-md); }
  .box.is-small { height: 40vh; }
  .box .wf-img { height: 100%; border: 0; }
</style>
</head>
<body>
<p class="demo-hint"><b>pair-rise-slides</b> On open, two accent-color curtains lift away, and every 3 seconds a new photo pair fills in from below (the right one .3s later). <span style="color:var(--kf-dim)">(After 1s one more panel comes in, and one leaves 2.5s later)</span></p>
<div class="stage">
  <div class="box" data-fx="pair-rise-slides" data-fx-pair-rise-slides="every: 3">
    <div data-fx-part="veil"></div>
    <div data-fx-part="slide"><div data-fx-part="half"><div class="wf-img" data-label="Pair 1 left"></div></div><div data-fx-part="half"><div class="wf-img" data-label="Pair 1 right"></div></div></div>
    <div data-fx-part="slide"><div data-fx-part="half"><div class="wf-img" data-label="Pair 2 left"></div></div><div data-fx-part="half"><div class="wf-img" data-label="Pair 2 right"></div></div></div>
    <div data-fx-part="slide"><div data-fx-part="half"><div class="wf-img" data-label="Pair 3 left"></div></div><div data-fx-part="half"><div class="wf-img" data-label="Pair 3 right"></div></div></div>
  </div>
  <div class="box is-small" data-demo-remove data-fx="pair-rise-slides" data-fx-pair-rise-slides="every: 2">
    <div data-fx-part="slide"><div data-fx-part="half"><div class="wf-img" data-label="Removed soon 1"></div></div><div data-fx-part="half"><div class="wf-img" data-label="Removed soon 1"></div></div></div>
    <div data-fx-part="slide"><div data-fx-part="half"><div class="wf-img" data-label="Removed soon 2"></div></div><div data-fx-part="half"><div class="wf-img" data-label="Removed soon 2"></div></div></div>
  </div>
  <template data-demo-late><div class="box is-small" data-fx="pair-rise-slides" data-fx-pair-rise-slides="every: 2; dur: .8; lag: .2; hold: 1; ease: 0.65,0,0.35,1"><div data-fx-part="veil"></div><div data-fx-part="slide"><div data-fx-part="half"><div class="wf-img" data-label="Late 1"></div></div><div data-fx-part="half"><div class="wf-img" data-label="Late 1"></div></div></div><div data-fx-part="slide"><div data-fx-part="half"><div class="wf-img" data-label="Late 2"></div></div><div data-fx-part="half"><div class="wf-img" data-label="Late 2"></div></div></div></div></template>
  <div class="box is-small" data-fx="pair-rise-slides"></div>
</div>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
