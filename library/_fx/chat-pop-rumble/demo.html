<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>chat-pop-rumble — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { margin: 0; padding: 12px 20px; border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .gap { height: 70vh; }
  .chat { display: flex; flex-direction: column; gap: 28px; max-width: 720px; margin: 0 auto 60vh; padding: 0 20px; }
  .row { display: flex; align-items: flex-start; gap: 16px; width: fit-content; }
  .row[data-fx-chat-pop-rumble*="right"] { flex-direction: row-reverse; margin-left: auto; }
  .face { flex: none; width: 56px; height: 56px; border-radius: 50%; background: var(--kf-accent-soft); }
  .bub { padding: 16px 22px; border-radius: 28px; background: var(--kf-surface); box-shadow: var(--kf-shadow-soft); }
  .row[data-fx-chat-pop-rumble*="right"] .bub { background: var(--kf-contrast-bg); color: var(--kf-contrast-ink); }
</style>
</head>
<body>
<p class="demo-hint"><b>chat-pop-rumble</b> — Scroll down. Question and answer speech bubbles grow and wobble at 80% of the screen height and the face circle opens.</p>
<div class="gap"></div>
<ul class="chat">
  <li class="row" data-fx="chat-pop-rumble"><span class="face" data-fx-part="icon"></span><div data-fx-part="wrap"><div class="bub" data-fx-part="bubble">Q How long does a transaction take?</div></div></li>
  <li class="row" data-fx="chat-pop-rumble" data-fx-chat-pop-rumble="look: right"><span class="face" data-fx-part="icon"></span><div data-fx-part="wrap"><div class="bub" data-fx-part="bubble">A It usually takes about a month.</div></div></li>
  <li class="row" data-fx="chat-pop-rumble"><div data-fx-part="wrap"><div class="bub" data-fx-part="bubble">Faceless row</div></div></li>
</ul>
<script>
// Late-arriving and removed lines — check that detaching still works
(() => {
  const chat = document.querySelector(".chat"), src = chat.firstElementChild;
  const gone = src.cloneNode(true);
  chat.append(gone);
  setTimeout(() => { const late = src.cloneNode(true); late.querySelector(".bub").textContent = "Q Late question"; chat.append(late); }, 1000);
  setTimeout(() => gone.remove(), 2500);
})();
</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
