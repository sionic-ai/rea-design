<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>glow-piano-keys — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .stage { margin: 40px 0; padding: 40px 0; background: var(--kf-contrast-bg); --kf-ink: var(--kf-contrast-ink); }
</style>
</head>
<body>
<p class="demo-hint"><b>glow-piano-keys</b> — Move the mouse over the keys and sweep with the button held down. Left idle, keys occasionally light up on their own. <span style="color:var(--kf-dim)">(After 1s one more key comes in, and after 2.5s one drops out)</span></p>
<div class="stage"><canvas data-fx="glow-piano-keys" role="img" aria-label="Piano keys"></canvas></div>
<div class="stage" data-demo-remove><canvas data-fx="glow-piano-keys" data-fx-glow-piano-keys="decay: .97; idle: 20; sound: off" role="img" aria-label="Piano keys"></canvas></div>
<template data-demo-late><div class="stage"><div data-fx="glow-piano-keys" data-fx-glow-piano-keys="sound: off"></div></div></template>
<canvas data-fx="glow-piano-keys" style="height:0"></canvas>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
