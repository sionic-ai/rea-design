<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>clip-curtain-nav — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { margin: 0; background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { padding: 48px 20px; display: grid; gap: 16px; }
  .mark { width: 124px; height: 24px; margin-left: 20px; background: currentColor; border-radius: 4px; }
</style>
</head>
<body>
<p class="demo-hint"><b>clip-curtain-nav</b> — Press the link below. A two-layer curtain fills from the bottom and reopens this page, then on the opened page the curtain lifts upward while still covering it.</p>
<div class="demo"><a href="demo.html">Reopen this page (same-site link)</a><a href="#here">In-page links (no overlay)</a></div>
<div data-fx="clip-curtain-nav" aria-hidden="true"><span data-fx-part="inner"></span><div><span class="mark" data-fx-part="mark"></span></div></div>
<script>
(() => {
  const src = document.querySelector('[data-fx~="clip-curtain-nav"]');
  const gone = src.cloneNode(true);
  src.after(gone);
  setTimeout(() => gone.remove(), 2500);
  document.addEventListener("fx:curtain-open", () => document.querySelector(".demo-hint").dataset.open = "1");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
