<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pixel-logo-loader — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); min-height: 100vh; }
  .demo-hint { position: sticky; top: 0; z-index: 2000; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint button { margin-left: 8px; }
  .demo-page { padding: 120px 20px; font: 700 48px/1.1 var(--kf-font-display); }
</style>
</head>
<body>
<p class="demo-hint"><b>pixel-logo-loader</b> — On open, the logo coarsens into pixel cells, is covered by the accent color, then clears away. <button type="button" data-again>View again</button></p>
<div data-fx="pixel-logo-loader" aria-hidden="true">
  <svg data-fx-part="logo" viewBox="0 0 61 35" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6 4 4 31"/><circle cx="11" cy="23" r="7"/><circle cx="27" cy="23" r="6.5"/><path d="M41 3 37 32M39.5 19 47 10M40 20l5 10"/><circle cx="55" cy="21" r="5.5"/>
  </svg>
</div>
<main class="demo-page">Your Hero title here</main>
<script>
// Replay — remove the old curtain (detach) and add a new one (does it attach to late-arriving elements too?)
(() => {
  const html = document.querySelector('[data-fx="pixel-logo-loader"]').outerHTML;
  document.querySelector("[data-again]").addEventListener("click", () => {
    document.querySelector('[data-fx="pixel-logo-loader"]')?.remove();
    const t = document.createElement("template");
    t.innerHTML = html;
    document.body.prepend(t.content.firstElementChild);
  });
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
