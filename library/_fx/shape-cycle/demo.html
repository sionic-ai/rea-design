<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>shape-cycle — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { min-height: 90vh; display: grid; place-items: center; }
  [data-fx~="shape-cycle"] { width: 60vw; aspect-ratio: 5 / 3; font: 700 40px/1 var(--kf-font-display); color: var(--kf-accent); }
  [data-fx-part="pic"] { display: grid; place-items: end start; padding: 12px; font: 400 13px/1.3 var(--kf-font-sans); color: var(--kf-bg); }
  [data-fx-part="pic"]:nth-child(1) { background: var(--kf-ink); }
  [data-fx-part="pic"]:nth-child(2) { background: var(--kf-accent); }
  [data-fx-part="pic"]:nth-child(3) { background: var(--kf-dim); }
</style>
</head>
<body>
<p class="demo-hint"><b>shape-cycle</b> — After the polygon window grows it changes shape, and the panel inside and the word at the bottom right change. The corner words also move.</p>
<section class="demo">
  <div data-fx="shape-cycle"><div data-fx-part="shape"><div data-fx-part="pic">Panel 1</div><div data-fx-part="pic">Panel 2</div><div data-fx-part="pic">Panel 3</div></div><span data-fx-part="corner">We</span><span data-fx-part="corner">Bring it</span><span data-fx-part="corner"><span data-fx-part="word">Event</span><span data-fx-part="word">Atmosphere</span><span data-fx-part="word">Everything</span></span></div>
</section>
<section class="demo"><div data-fx="shape-cycle"></div><div data-fx="shape-cycle"><div data-fx-part="shape"></div></div></section>
<script>
(() => {
  const src = document.querySelector('[data-fx~="shape-cycle"]');
  if (!src) return;
  const html = src.outerHTML.replace(/\sid="[^"]*"/g, "");
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => src.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical one comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../../../_shared/vendor/gsap/MorphSVGPlugin.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
