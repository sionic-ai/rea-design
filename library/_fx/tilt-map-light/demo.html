<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tilt-map-light — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { padding: 48px 20px; display: grid; gap: 32px; }
  .map { width: min(100%, 960px); }
  .pin { display: grid; justify-items: center; gap: 4px; font-size: 12px; color: var(--kf-accent-text); }
  .pin i { width: 14px; height: 14px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); background: currentColor; }
</style>
</head>
<body>
<p class="demo-hint"><b>tilt-map-light</b> — Move the mouse and the map panel tilts to follow. Hover over a panel and the cursor spot lights up.</p>
<section class="demo">
  <div class="map" data-fx="tilt-map-light" data-demo-remove>
    <span class="pin" data-fx-part="pin" data-at="-2.7,-0.9,0"><i></i>Place 1</span>
    <span class="pin" data-fx-part="pin" data-at="-2.02,-1.24,0"><i></i>Place 2</span>
    <span class="pin" data-fx-part="home" data-at="-2.42,-1.08,0.01"><i></i>House</span>
  </div>
  <template data-demo-late><div class="map" data-fx="tilt-map-light" data-fx-tilt-map-light="radius: .08; light: .6">
    <span class="pin" data-fx-part="pin" data-at="-2.15,-1.38,0"><i></i>Place 3</span>
  </div></template>
  <div class="map" data-fx="tilt-map-light"></div>
</section>
<script src="three-global.js"></script>
<script src="../../_vendor/three@0.184.0/build/three.cjs"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
