<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>circle-trio-scrub — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .pad { height: 70vh; display: grid; place-items: center; font-size: 40px; font-weight: 700; }
  h2 { font-size: 28px; line-height: 1.15; }
</style>
</head>
<body>
<p class="demo-hint"><b>circle-trio-scrub</b> — Scroll down. Three circles in the center grow and cover the screen. <span style="color:var(--kf-dim)">(After 1s one more section comes in, and one leaves 2.5s later)</span></p>
<div class="pad">A big headline<br>above the circles</div>
<section data-fx="circle-trio-scrub"><div data-fx-part="stage"><h2 data-fx-part="title">A line of text the<br>circles wrap around</h2><div data-fx-part="core"><span data-fx-part="c1"></span><span data-fx-part="c2"></span></div><span data-fx-part="c3"></span></div></section>
<section data-fx="circle-trio-scrub" data-demo-remove><div data-fx-part="stage"><div data-fx-part="core"><span data-fx-part="c1"></span></div></div></section>
<template data-demo-late><section data-fx="circle-trio-scrub" data-fx-circle-trio-scrub="grow: 90vw; scrub: 1" style="--fx-length: 200vh"><div data-fx-part="stage"><h2 data-fx-part="title">A later section</h2><div data-fx-part="core"><span data-fx-part="c1"></span><span data-fx-part="c2"></span></div><span data-fx-part="c3"></span></div></section></template>
<div class="pad">The next section</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
