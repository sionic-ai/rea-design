<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>glass-roll-btn — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { display: flex; flex-wrap: wrap; gap: 24px; align-items: center; padding: 64px 20px; }
  .stage { background: var(--kf-accent-soft); }
</style>
</head>
<body>
<p class="demo-hint"><b>glass-roll-btn</b> — Hover over the button. The text rolls up one line and light spreads below. After 1s one more button is added, and after 2s the first button is removed.</p>
<section class="demo" id="row">
  <a href="#" data-fx="glass-roll-btn"><span data-fx-part="label">Contact Us</span></a>
  <button type="button" data-fx="glass-roll-btn" data-fx-glass-roll-btn="speed: 1.2; glow: .8"><span data-fx-part="label">Enter with sound</span></button>
  <a href="#" data-fx="glass-roll-btn" data-fx-glass-roll-btn="speed: 0"><span data-fx-part="label">Still light</span></a>
</section>
<section class="demo stage"><a href="#" data-fx="glass-roll-btn"><span data-fx-part="label">On the light panel</span></a></section>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
  setTimeout(() => { const a = document.createElement("a"); a.href = "#"; a.dataset.fx = "glass-roll-btn"; a.innerHTML = '<span data-fx-part="label">Late-attached button</span>'; document.getElementById("row").append(a); }, 1000);
  setTimeout(() => document.querySelector("#row > :first-child").remove(), 2000);
</script>
</body>
</html>
