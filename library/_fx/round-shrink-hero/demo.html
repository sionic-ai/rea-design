<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>round-shrink-hero — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: fixed; top: 0; left: 0; right: 0; z-index: 9; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .hero [data-fx-part="media"] .wf-img { height: 100%; }
  .hero [data-fx-part="content"] { display: grid; place-items: end center; padding: 60px; color: var(--kf-contrast-ink); }
  .hero h1 { font: var(--kf-weight-display) 7vw/0.9 var(--kf-font-display); text-transform: uppercase; text-align: center; }
  .after { height: 160vh; padding: 40px 20px; }
</style>
</head>
<body>
<p class="demo-hint"><b>round-shrink-hero</b> — Scroll down (it shrinks and rounds off over the first 100px). <span style="color:var(--kf-dim)">(After 1s a second hero comes in, and after 2.5s one drops out)</span></p>
<section class="hero" data-fx="round-shrink-hero">
  <div data-fx-part="media"><span class="wf-img wf-video" data-label="Full-bleed looping video · 16:9"></span></div>
  <div data-fx-part="content"><h1>A big headline<br>in two lines.</h1></div>
</section>
<div class="after">Your body text here.</div>
<section class="hero" data-fx="round-shrink-hero" data-demo-remove><div data-fx-part="media"><span class="wf-img" data-label="Hero to be removed"></span></div></section>
<section data-fx="round-shrink-hero" style="height:50vh">Childless board</section>
<template data-demo-late><section class="hero" data-fx="round-shrink-hero" data-fx-round-shrink-hero="corner: 24; margin: 40"><div data-fx-part="media"><span class="wf-img" data-label="Late-arriving hero · radius 24 · padding 40"></span></div></section><div class="after"></div></template>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
