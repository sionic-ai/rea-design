<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>flank-pop-list — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  nav { padding: 18vh 0; }
  nav ul { display: flex; flex-direction: column; align-items: center; gap: 2vw; font: 500 3.6vw/1.3 var(--kf-font-sans); }
  .p { background: var(--kf-raised); border: 1px solid var(--kf-line); }
  .p:nth-child(2) { background: var(--kf-accent-soft); }
  .p:nth-child(3) { background: var(--kf-surface); }
  .tip { padding: 6px 12px; border-radius: var(--kf-radius-pill); background: var(--kf-ink); color: var(--kf-bg); font: 500 13px/1 var(--kf-font-sans); }
</style>
</head>
<body>
<p class="demo-hint"><b>flank-pop-list</b> — Hover over the large text row and move left and right. Thumbnails pop out on both sides.</p>
<nav data-fx="flank-pop-list">
  <ul><li data-fx-part="line"><span data-fx-part="label">Menu First</span></li><li data-fx-part="line"><span data-fx-part="label">Menu Two</span></li><li data-fx-part="line"><span data-fx-part="label">All items</span></li></ul>
  <div data-fx-part="medias">
    <div data-fx-part="media"><i class="p"></i><i class="p"></i><i class="p"></i></div><div data-fx-part="media"><i class="p"></i><i class="p"></i><i class="p"></i></div>
    <div data-fx-part="media"><i class="p"></i><i class="p"></i><i class="p"></i></div><div data-fx-part="media"><i class="p"></i><i class="p"></i><i class="p"></i></div>
    <div data-fx-part="media"><i class="p"></i><i class="p"></i><i class="p"></i></div><div data-fx-part="media"><i class="p"></i><i class="p"></i><i class="p"></i></div>
    <div data-fx-part="media"><i class="p"></i><i class="p"></i><i class="p"></i></div><div data-fx-part="media"><i class="p"></i><i class="p"></i><i class="p"></i></div>
    <div data-fx-part="media"><i class="p"></i><i class="p"></i><i class="p"></i></div><div data-fx-part="media"><i class="p"></i><i class="p"></i><i class="p"></i></div>
    <div data-fx-part="media"><i class="p"></i><i class="p"></i><i class="p"></i></div><div data-fx-part="media"><i class="p"></i><i class="p"></i><i class="p"></i></div>
    <div data-fx-part="media"><i class="p"></i><i class="p"></i><i class="p"></i></div><div data-fx-part="media"><i class="p"></i><i class="p"></i><i class="p"></i></div>
    <div data-fx-part="media"><i class="p"></i><i class="p"></i><i class="p"></i></div><div data-fx-part="media"><i class="p"></i><i class="p"></i><i class="p"></i></div>
  </div>
  <span class="tip" data-fx-part="cursor">View all</span>
</nav>
<nav data-demo-remove data-fx="flank-pop-list"><ul><li data-fx-part="line">One</li></ul><div data-fx-part="medias"><div data-fx-part="media"><i class="p"></i></div><div data-fx-part="media"><i class="p"></i></div></div></nav>
<template data-demo-late><nav data-fx="flank-pop-list" data-fx-flank-pop-list="gap: .03"><ul><li data-fx-part="line"><span data-fx-part="label">Late row</span></li></ul><div data-fx-part="medias"><div data-fx-part="media"><i class="p"></i></div><div data-fx-part="media"><i class="p"></i></div><div data-fx-part="media"><i class="p"></i></div><div data-fx-part="media"><i class="p"></i></div></div></nav></template>
<nav data-fx="flank-pop-list"></nav>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
