<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>coin-drop-physics — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { margin: 0; background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { height: 80vh; margin: 20px; border-radius: var(--kf-radius-lg); background: var(--kf-accent); color: var(--kf-on-accent); display: flex; flex-direction: column; justify-content: space-between; padding: 40px; box-sizing: border-box; }
  .demo h2 { position: relative; z-index: 1; margin: 0; font: 600 64px/1 var(--kf-font-display); text-transform: uppercase; }
  .demo h2 span { display: inline-block; }
  .demo footer { position: relative; z-index: 1; padding-top: 16px; border-top: 1px solid currentColor; }
</style>
</head>
<body>
<p class="demo-hint"><b>coin-drop-physics</b> — Coins are piled inside the panel and every few seconds one is tossed in from the left. Grab a coin, drag it and throw it.</p>
<section class="demo" data-fx="coin-drop-physics">
  <h2><span data-fx-part="solid">Here</span> <span data-fx-part="solid">Large title</span></h2>
  <footer data-fx-part="floor">Your bottom row here</footer>
</section>
<script>
(() => {
  const late = document.createElement("section");
  late.setAttribute("data-fx", "coin-drop-physics");
  late.style.height = "60px";
  setTimeout(() => document.body.append(late), 1000);
  setTimeout(() => late.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s a panel with no base comes in (nothing attached), and after 2.5s it drops out (detach).");
})();
</script>
<script src="../../_vendor/matter-js@0.20.0/matter.min.js"></script>
<script src="three-global.js"></script>
<script src="../../_vendor/three@0.174.0/build/three.cjs"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
