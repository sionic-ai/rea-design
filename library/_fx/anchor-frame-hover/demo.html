<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>anchor-frame-hover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { padding: 48px 20px; }
  .logos { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px 0; }
  .logos li { display: grid; place-items: center; aspect-ratio: 210 / 162; font: 700 20px/1 var(--kf-font-display); }
</style>
</head>
<body>
<p class="demo-hint"><b>anchor-frame-hover</b> — Move the mouse over the logo. A four-corner bracket frame slides along.</p>
<section class="demo">
  <ul class="logos" data-fx="anchor-frame-hover">
    <li data-fx-part="item">LOGO 01</li><li data-fx-part="item">LOGO 02</li><li data-fx-part="item">LOGO 03</li><li data-fx-part="item">LOGO 04</li>
    <li data-fx-part="item">LOGO 05</li><li data-fx-part="item">LOGO 06</li><li data-fx-part="item">LOGO 07</li><li data-fx-part="item">LOGO 08</li>
  </ul>
</section>
<section class="demo">
  <ul class="logos" data-fx="anchor-frame-hover" data-fx-anchor-frame-hover="dur: .5; pad: 6" style="--fx-color: var(--kf-accent)">
    <li data-fx-part="item">CARD A</li><li data-fx-part="item">CARD B</li><li data-fx-part="item">CARD C</li><li data-fx-part="item">CARD D</li>
  </ul>
</section>
<script>
(() => {
  const src = document.querySelector('[data-fx~="anchor-frame-hover"]');
  const html = src.outerHTML;
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => src.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s one more group comes in, and after 2.5s one drops out.");
})();
</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
