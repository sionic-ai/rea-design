<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>path-square-trail — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); overflow-x: clip; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .stage { position: relative; height: 80vh; margin: 20px; overflow: hidden; border-radius: var(--kf-radius-lg); background: var(--kf-ink); }
  .stage [data-fx] { position: absolute; top: 0; right: 0; width: 70%; color: var(--kf-accent); }
</style>
</head>
<body>
<p class="demo-hint"><b>path-square-trail</b> — Just watch. Every 3s a chunky pixel block crosses the stair path in 1s and vanishes in 1s. <span style="color:var(--kf-dim)">(After 1s one more panel comes in, and one leaves 2.5s later)</span></p>
<div class="stage"><div data-demo-remove data-fx="path-square-trail" data-fx-path-square-trail="rest: 1"><svg viewBox="0 0 1200 900"><path data-fx-part="path" d="M520 0L0 420L840 140L300 600L1200 300L460 900"/><path data-fx-part="path" d="M0 80L700 0L200 500L1000 260L600 900"/></svg></div></div>
<div class="stage"><div data-fx="path-square-trail" data-fx-path-square-trail="size: 60; count: 80; rest: 1"><svg viewBox="0 0 1200 900"><path data-fx-part="path" d="M600 0L120 400L900 180L400 900"/></svg></div></div>
<template data-demo-late><div class="stage"><div data-fx="path-square-trail" data-fx-path-square-trail="rest: 0"><svg viewBox="0 0 1200 900"><path data-fx-part="path" d="M0 0L1200 900"/></svg></div></div></template>
<div data-fx="path-square-trail"></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); window.ScrollTrigger?.refresh(); }, 2500);
</script>
</body>
</html>
