<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>roll-fade-label — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 500 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .stage { display: grid; gap: 16px; padding: 40px; max-width: 420px; }
  .btn { display: flex; justify-content: space-between; align-items: center; padding: 16px; border-radius: var(--kf-radius-sm); background: var(--kf-surface); border: 1px solid var(--kf-line); }
</style>
</head>
<body>
<p class="demo-hint"><b>roll-fade-label</b> — Hover over the button. The text slides up and out while the same text rises in from below. <span style="color:var(--kf-dim)">(After 1s one more button comes in, and after 2.5s one drops out)</span></p>
<div class="stage">
  <a class="btn" href="#"><span data-fx="roll-fade-label">View details</span><span>→</span></a>
  <a class="btn" href="#" data-demo-remove><span data-fx="roll-fade-label">Soon-Removed Button</span><span>→</span></a>
  <button class="btn" type="button"><span data-fx="roll-fade-label" style="--fx-dur: .3s">Book now</span></button>
  <a class="btn" href="#"><span data-fx="roll-fade-label" data-fx-roll-fade-label="look: plain" style="--fx-dur: .5s; --fx-ease: cubic-bezier(0,0,.2,1)">Roll without blur</span></a>
  <a class="btn" href="#"><span data-fx="roll-fade-label"></span><span>Empty Post (not hooked)</span></a>
  <template data-demo-late><a class="btn" href="#"><span data-fx="roll-fade-label">Late-arriving button</span><span>→</span></a></template>
</div>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
