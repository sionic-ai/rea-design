<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>digit-roll-loader — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 500 15px/1.6 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 10; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  main { max-width: 760px; margin: 48px auto; padding: 0 20px; }
  .mini { position: relative; height: 260px; margin-top: 24px; overflow: hidden; border-radius: 8px; }
  .mini [data-fx] { position: absolute; --fx-size: 120px; padding: 24px; }
</style>
</head>
<body>
<div data-fx="digit-roll-loader" data-fx-digit-roll-loader="every: visit" aria-hidden="true"></div>
<p class="demo-hint"><b>digit-roll-loader</b> — On open, a three-digit number rolls and stops at 100, then the panel lifts. Refresh and it runs again (every: visit). <span style="color:var(--kf-dim)">(After 1s one more small panel comes in, and after 2.5s one leaves)</span></p>
<main>
  <p>The small panels below hold the same part inside the panel — a late arrival counts 0 → 42.</p>
  <div class="mini" data-demo-remove><div data-fx="digit-roll-loader" data-fx-digit-roll-loader="every: visit"></div></div>
  <template data-demo-late><div class="mini"><div data-fx="digit-roll-loader" data-fx-digit-roll-loader="every: visit; to: 42; durs: 1,1.6; delays: .6,.2" style="--fx-bg: var(--kf-ink); --fx-ink: var(--kf-bg)"></div></div></template>
</main>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); window.ScrollTrigger?.refresh(); }, 2500);
</script>
</body>
</html>
