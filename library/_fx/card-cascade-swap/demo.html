<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>card-cascade-swap — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 10; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  section { display: flex; align-items: center; gap: 16px; justify-content: center; margin: 8vh 4vw; }
  .pages { display: grid; flex: 1; max-width: 900px; }
  .pages > div { grid-area: 1 / 1; display: flex; gap: 16px; }
  .pages a { flex: 1; aspect-ratio: 3 / 4; display: grid; place-items: center; background: var(--kf-surface); border: 1px solid var(--kf-line); border-radius: var(--kf-radius-md); font: 700 24px var(--kf-font-display); }
  button { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--kf-line); background: var(--kf-surface); color: var(--kf-ink); cursor: pointer; }
  button:disabled { opacity: 0.4; }
</style>
</head>
<body>
<p class="demo-hint"><b>card-cascade-swap</b> — Press the arrows. Cards disappear one after another and the next page appears in turn.</p>
<section data-fx="card-cascade-swap">
  <button type="button" data-fx-part="prev" aria-label="Front">←</button>
  <div class="pages">
    <div data-fx-part="page" class="is-active"><a data-fx-part="card">1</a><a data-fx-part="card">2</a><a data-fx-part="card">3</a></div>
    <div data-fx-part="page"><a data-fx-part="card">4</a><a data-fx-part="card">5</a><a data-fx-part="card">6</a></div>
  </div>
  <button type="button" data-fx-part="next" aria-label="Back">→</button>
</section>
<section data-fx="card-cascade-swap" data-fx-card-cascade-swap="dur: 0.3; each: 0.05; shift: 24" data-demo-remove>
  <div class="pages"><div data-fx-part="page"><a data-fx-part="card">Fan</a><a data-fx-part="card">Luggage</a></div><div data-fx-part="page"><a data-fx-part="card">Both</a></div></div>
  <button type="button" data-fx-part="next" aria-label="Back">→</button>
</section>
<template data-demo-late><section data-fx="card-cascade-swap"><div class="pages"><div data-fx-part="page"><a data-fx-part="card">Late</a><a data-fx-part="card">Crab</a></div><div data-fx-part="page"><a data-fx-part="card">Coming</a></div></div><button type="button" data-fx-part="next" aria-label="Back">→</button></section></template>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
