<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pin-stack — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { padding: 48px 20px; }
  .demo-btn { display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 16px; border: 1px solid var(--kf-line); border-radius: var(--kf-radius-sm); background: var(--kf-surface); color: var(--kf-ink); cursor: pointer; }
  .demo-card { padding: 20px; border: 1px solid var(--kf-line); border-radius: var(--kf-radius-md); background: var(--kf-surface); }
  .demo-spacer { height: 90vh; display: grid; place-items: center; color: var(--kf-dim); }
  .fold { --w: min(30vw, 60svh); height: 100svh; }
  .fold h2 { position: absolute; left: 40px; right: 40px; top: 50%; translate: 0 -50%; text-align: center; font: 400 96px/.9 var(--kf-font-display); }
  .fold a { position: absolute; width: var(--w); height: var(--w); top: 12svh; } .fold .wf-img { height: 100%; border-radius: var(--kf-radius-md); }
</style>
</head>
<body>
<p class="demo-hint"><b>pin-stack</b> — Scrolling pins the section, and tilted cards rise from below one by one and stack above the title (width 810px or more).</p>
<div class="demo-spacer">Scroll down ↓</div><section class="fold" data-fx="pin-stack"><h2>Your showcase of proud work here.</h2>
<a data-fx-part="card" href="#" style="left:6%;rotate:-5deg"><div class="wf-img" data-label="Work 1 · collage · square"></div></a><a data-fx-part="card" href="#" style="left:26%;top:18svh;rotate:4deg"><div class="wf-img" data-label="Work 2"></div></a><a data-fx-part="card" href="#" style="left:46%;top:10svh;rotate:-3deg"><div class="wf-img" data-label="Work 3"></div></a><a data-fx-part="card" href="#" style="left:66%;top:20svh;rotate:6deg"><div class="wf-img" data-label="Work 4"></div></a></section><div class="demo-spacer"></div>
<script>
// Late arrivals and removals — checks that fx-core attaches to an element added after 1s and detaches from an element removed after 2.5s
(() => {
  const src = document.querySelector('[data-fx~="pin-stack"]');
  if (!src) return;
  const html = src.outerHTML.replace(/\sid="[^"]*"/g, "");
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => (src.closest(".pin-spacer") || src).after(make("late")), 1000); // Once pinned the panel gets wrapped in a pin-spacer, so place it outside that
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical one comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
