<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>arrow-push-btn — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { padding: 48px 20px; display: flex; flex-wrap: wrap; gap: 24px; }
  .demo-btn { display: inline-block; border-radius: var(--kf-radius-sm); background: var(--kf-accent); color: var(--kf-on-accent); font: 600 14px/1 var(--kf-font-sans); letter-spacing: .02em; }
  .demo-btn [data-fx-part="inner"] { display: flex; align-items: center; padding: 8px 8px 8px 0; }
  .demo-btn [data-fx-part="label"] { padding: 0 40px 0 20px; line-height: 1; }
  .demo-btn [data-fx-part="front"], .demo-btn [data-fx-part="arrow"] { display: grid; place-items: center; width: 30px; aspect-ratio: 1; border-radius: var(--kf-radius-sm); background: color-mix(in oklab, var(--kf-accent) 85%, var(--kf-on-accent)); }
</style>
</head>
<body>
<p class="demo-hint"><b>arrow-push-btn</b> — Hover over the button. An arrow pushes in from the left and the text rolls up.</p>
<section class="demo" id="box">
  <a class="demo-btn" data-fx="arrow-push-btn" href="#" id="src"><span data-fx-part="inner"><span data-fx-part="front">→</span><span data-fx-part="label"><span data-fx-part="text">View details</span><span data-fx-part="next" aria-hidden="true">View details</span></span><span data-fx-part="arrow">→</span></span></a>
  <a class="demo-btn" data-fx="arrow-push-btn" data-fx-arrow-push-btn="push: 1; roll: .4" href="#"><span data-fx-part="inner"><span data-fx-part="front">→</span><span data-fx-part="label"><span data-fx-part="text">Short Roll</span><span data-fx-part="next" aria-hidden="true">Short Roll</span></span><span data-fx-part="arrow">→</span></span></a>
</section>
<script>
(() => {
  const src = document.getElementById("src");
  const html = src.outerHTML.replace(/\sid="[^"]*"/g, "");
  const make = () => { const t = document.createElement("template"); t.innerHTML = html; return t.content.firstElementChild; };
  const gone = make();
  src.after(gone);
  setTimeout(() => src.after(make()), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1 second one more button comes in (a late arrival), and after 2.5 seconds one is removed (detach).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
