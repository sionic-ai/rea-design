<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>flashlight-reveal — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .board { height: 80vh; margin: 24px 20px; background: var(--kf-raised); display: grid; grid-template-columns: repeat(3, 1fr); gap: 40px; padding: 60px; align-content: center; overflow: hidden; }
  .paper { aspect-ratio: 3 / 4; background: var(--kf-surface); border: 1px solid var(--kf-line); display: grid; place-items: center; font: 500 14px/1.3 var(--kf-font-display); }
</style>
</head>
<body>
<p class="demo-hint"><b>flashlight-reveal</b> — Move the mouse over the panel to shine a flashlight. The circle narrows when over paper. <span style="color:var(--kf-dim)">(After 1s one more panel comes in, and one leaves 2.5s later)</span></p>
<section data-demo-remove class="board" data-fx="flashlight-reveal">
  <div class="paper" data-fx-part="spot">Evidence 1</div><div class="paper" data-fx-part="spot">Evidence 2</div><div class="paper" data-fx-part="spot">Evidence 3</div>
</section>
<section class="board" data-fx="flashlight-reveal" data-fx-flashlight-reveal="dark: .85; radius: .22; min: 3; max: 6">
  <div class="paper" data-fx-part="spot">Evidence 4</div><div class="paper" data-fx-part="spot">Evidence 5</div><div class="paper" data-fx-part="spot">Evidence 6</div>
</section>
<template data-demo-late><section class="board" data-fx="flashlight-reveal"><div class="paper" data-fx-part="spot">Late panel</div></section></template>
<section data-fx="flashlight-reveal"></section>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/EasePack.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
