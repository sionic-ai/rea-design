<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>photo-hotspot-toggle — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .col { max-width: 672px; margin: 40px auto; padding: 0 20px; display: grid; gap: 32px; }
  figure { margin: 0; }
  .ph { aspect-ratio: 3 / 2; border-radius: 4px; background: var(--kf-ink-soft); }
  .ic { width: 16px; height: 16px; }
</style>
</head>
<body>
<p class="demo-hint"><b>photo-hotspot-toggle</b> — Hover over the photo and press the button at the bottom right. Hover over a dot to show its label.</p>
<div class="col">
  <figure data-fx="photo-hotspot-toggle" data-fx-photo-hotspot-toggle="base: 672">
    <div class="ph" role="img" aria-label="Desk photo slot"></div>
    <button type="button" data-fx-part="toggle" aria-pressed="false" aria-label="View item"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5.5 7.5h13l1.3 12.3a1.1 1.1 0 0 1-1.1 1.2H5.3a1.1 1.1 0 0 1-1.1-1.2z"/></svg></button>
    <button type="button" data-fx-part="dot" data-x="40" data-y="320" aria-label="Item 1"><span data-fx-part="tip">Your item name here</span></button>
    <button type="button" data-fx-part="dot" data-x="155" data-y="120" aria-label="Item 2"><span data-fx-part="tip">Your second item here</span></button>
    <button type="button" data-fx-part="dot" data-x="470" data-y="210" aria-label="Item 3"><span data-fx-part="tip">Your third item here</span></button>
  </figure>
  <template data-demo-late><figure data-fx="photo-hotspot-toggle" data-fx-photo-hotspot-toggle="each: 0"><div class="ph"></div><button type="button" data-fx-part="toggle" aria-pressed="false" aria-label="View item">+</button><button type="button" data-fx-part="dot" data-x="50%" data-y="40%" aria-label="Item"><span data-fx-part="tip">Late-arriving photo</span></button></figure></template>
  <figure data-demo-remove data-fx="photo-hotspot-toggle"><div class="ph"></div></figure>
</div>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
