<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>wiggle-line-draw — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-box { position: relative; margin: 24px 20px; height: 380px; border: 1px solid var(--kf-line); background: var(--kf-dim); }
  .demo-box > [data-fx] { position: absolute; inset: 0; }
  .demo-box p { position: absolute; left: 16px; top: 12px; z-index: 1; color: var(--kf-surface); }
  .demo-box button { position: absolute; right: 16px; top: 12px; z-index: 1; padding: 6px 12px; border: 1px solid var(--kf-surface); background: none; color: var(--kf-surface); cursor: pointer; }
</style>
</head>
<body>
<p class="demo-hint"><b>wiggle-line-draw</b> — A thick line is drawn over 3.6 seconds and each dot sways along a small ellipse. Try pressing ”Draw once and erase”.</p>
<div class="demo-box">
  <p>Line chart · draws when opened</p>
  <div data-fx="wiggle-line-draw" data-fx-wiggle-line-draw="pts: -.1 .81 .4 1, .16 .81 .4 1, .32 .24 -.2 -1, .47 .51 .6 1, .63 .1 .3 -1, .84 .61 -.1 1, 1.1 .32 -.4 1; color: --kf-surface"></div>
</div>
<div class="demo-box">
  <p>Curve · Press to draw and erase</p>
  <button type="button" data-demo="pulse">Draw one line and erase</button>
  <div data-fx="wiggle-line-draw" data-fx-wiggle-line-draw="curve: 1; on: manual; pts: -.1 .2 0 0 .4 1, .15 .8 0 .8 .2 1, .35 .2 .2 .2 -.2 -1, .6 .8 .45 .8 .6 1, .85 .2 .7 .2 .8 -1, 1.1 .8 1 .8 -.1 1; color: --kf-surface"></div>
</div>
<script>
(() => {
  document.querySelector('[data-demo="pulse"]').addEventListener("click", (e) => {
    e.currentTarget.parentElement.querySelector('[data-fx~="wiggle-line-draw"]')?.dispatchEvent(new CustomEvent("fx:pulse"));
  });
  const src = document.querySelector('[data-fx~="wiggle-line-draw"]');
  const make = (tag) => { const el = src.cloneNode(true); el.querySelector("canvas")?.remove(); el.dataset.demo = tag; return el; };
  const box = (el) => { const b = document.createElement("div"); b.className = "demo-box"; b.append(el); return b; };
  const host = src.parentElement;
  const gone = box(make("gone"));
  host.after(gone);
  setTimeout(() => host.after(box(make("late"))), 1000);
  setTimeout(() => gone.remove(), 2500);
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
