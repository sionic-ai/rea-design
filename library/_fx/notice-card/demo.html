<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>notice-card — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .stack { position: fixed; right: 20px; top: 76px; z-index: 10; width: min(370px, calc(100vw - 40px)); display: grid; gap: 10px; }
  .demo-spacer { height: 260vh; padding: 140px 20px; color: var(--kf-dim); }
</style>
</head>
<body>
<p class="demo-hint"><b>notice-card</b> — Hover over a card, and scroll down and up. <span style="color:var(--kf-dim)">(One more card comes in after 1s, and one drops out after 2.5s)</span></p>
<div class="stack">
  <a data-demo-remove data-fx="notice-card" data-fx-notice-card="shift: -34" href="#"><span data-fx-part="icon"><svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M4 6h4l4 6-4 6H4l4-6zM12 6h4l4 6-4 6h-4l4-6z"/></svg></span><span data-fx-part="text"><span>Your title here</span><span data-fx-part="sub">Your one-line guide here</span></span><span data-fx-part="label">CONTACT</span><span data-fx-part="arrow"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M2 6h8M6.5 2.5 10 6l-3.5 3.5"/></svg></span></a>
  <a data-fx="notice-card" data-fx-notice-card="shift: -34" href="#"><span data-fx-part="icon"><svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><rect x="4" y="5" width="16" height="3" rx="1.5"/><rect x="4" y="10.5" width="16" height="3" rx="1.5"/><rect x="4" y="16" width="16" height="3" rx="1.5"/></svg></span><span data-fx-part="text"><span>Client Name</span><span data-fx-part="sub">New Work Guide</span></span><span data-fx-part="label">VIEW</span><span data-fx-part="arrow"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M2 6h8M6.5 2.5 10 6l-3.5 3.5"/></svg></span></a>
  <template data-demo-late><a data-fx="notice-card" data-fx-notice-card="shift: -34" href="#"><span data-fx-part="icon"><svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><circle cx="12" cy="12" r="7"/></svg></span><span data-fx-part="text"><span>Late-arriving card</span><span data-fx-part="sub">Your one-liner here</span></span><span data-fx-part="label">OPEN</span><span data-fx-part="arrow"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M2 6h8M6.5 2.5 10 6l-3.5 3.5"/></svg></span></a></template>
  <a data-fx="notice-card" href="#"><span data-fx-part="icon"></span><span data-fx-part="text"><span>Card without shift</span></span><span data-fx-part="label">VIEW</span></a>
</div>
<div class="demo-spacer">Scroll down and the card group rises 34px, scroll up and it comes back down.</div>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); window.ScrollTrigger?.refresh(); }, 2500);
</script>
</body>
</html>
