<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>glyph-heat-trail — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-contrast-bg); color: var(--kf-contrast-ink); font: 400 15px/1.5 var(--kf-font-sans); min-height: 100vh; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); color: var(--kf-ink); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { padding: 20vh 20px; text-align: center; font: 600 48px/1.1 var(--kf-font-display); }
  .demo-light { background: var(--kf-bg); color: var(--kf-ink); }
</style>
</head>
<body>
<p class="demo-hint"><b>glyph-heat-trail</b> — Swipe the mouse widely. Dot characters blaze up where it passed, then cool down. <span style="color:var(--kf-dim)">(After 1s one more canvas is attached, and after 2.5s the first one is removed)</span></p>
<canvas data-demo-remove data-fx="glyph-heat-trail" aria-hidden="true"></canvas>
<template data-demo-late><canvas data-fx="glyph-heat-trail" data-fx-glyph-heat-trail="cell: 12; size: 14" aria-hidden="true"></canvas></template>
<div data-fx="glyph-heat-trail"></div>
<section class="demo">Move your mouse</section>
<section class="demo demo-light">Even on Light Backgrounds</section>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
