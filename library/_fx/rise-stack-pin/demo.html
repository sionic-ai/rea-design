<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rise-stack-pin — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .pad { height: 60vh; display: grid; place-items: center; color: var(--kf-dim); }
  .stack { position: relative; height: 100vh; overflow: hidden; --fx-rise: calc(100vh - 8rem); }
  .stack .wf-img { position: absolute; inset: 0; height: 100%; }
  .stack ul { position: absolute; inset: 6rem 3rem 0; }
  .stack li { position: absolute; left: 0; right: 0; padding: 1.5rem 2rem; background: var(--kf-surface); border-radius: var(--kf-radius-md) var(--kf-radius-md) 0 0; border-top: 1px solid var(--kf-line); }
  .stack li:nth-child(1) { top: 0; height: calc(100vh - 6rem); z-index: 1; }
  .stack li:nth-child(2) { top: 4rem; height: calc(100vh - 10rem); z-index: 2; }
  .stack li:nth-child(3) { top: 8rem; height: calc(100vh - 14rem); z-index: 3; }
</style>
</head>
<body>
<p class="demo-hint"><b>rise-stack-pin</b> — Scroll down. The panel pins and cards rise one at a time to stack up. <span style="color:var(--kf-dim)">(After 1s one more panel comes in, and one leaves 2.5s later)</span></p>
<div class="pad">Downward</div>
<section class="stack" data-fx="rise-stack-pin"><div class="wf-img" data-fx-part="back" data-label="Dark interior view · landscape 16:9"></div><ul><li data-fx-part="card">01 Card</li><li data-fx-part="card">02 Card</li><li data-fx-part="card">03 Card</li></ul></section>
<section class="stack" data-fx="rise-stack-pin" data-fx-rise-stack-pin="ease: none; scrub: 1; hold: .5"><ul><li data-fx-part="card">Photo 1</li><li data-fx-part="card">Photo 2</li></ul><p style="position:absolute;right:5%;top:40%;margin:0"><span data-fx-part="caption" style="position:absolute;white-space:nowrap">Scene name 1</span><span data-fx-part="caption" style="position:absolute;white-space:nowrap">Scene name 2</span><span data-fx-part="caption" style="position:absolute;white-space:nowrap">Scene name 3</span></p></section>
<section class="stack" data-demo-remove data-fx="rise-stack-pin"><ul><li data-fx-part="card">Panel to be removed soon</li></ul></section>
<template data-demo-late><section class="stack" data-fx="rise-stack-pin" data-fx-rise-stack-pin="per: .6"><ul><li data-fx-part="card">Late 01</li><li data-fx-part="card">Late 02</li></ul></section></template>
<div class="pad">Footer</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
