<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>square-grow-pin — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .sq { position: relative; }
  .sq__stage { position: sticky; top: 0; z-index: 2; display: grid; place-items: center; height: 100vh; }
  .sq__side { position: absolute; top: 50%; translate: 0 -50%; }
  .sq__side.is-left { left: 40px; } .sq__side.is-right { right: 40px; }
  .sq [data-fx-part="square"] { width: 170px; height: 185px; }
  .sq [data-fx-part="tile"]:nth-child(1) { background: var(--kf-accent); }
  .sq [data-fx-part="tile"]:nth-child(2) { background: var(--kf-ink); }
  .sq [data-fx-part="tile"]:nth-child(3) { background: var(--kf-dim); }
  .sq [data-fx-part="tile"]:nth-child(4) { background: var(--kf-accent-soft); }
  .sq [data-fx-part="track"] { height: 200vh; margin-top: -100vh; }
  .after { height: 100vh; display: grid; place-items: center; color: var(--kf-dim); }
</style>
</head>
<body>
<p class="demo-hint"><b>square-grow-pin</b> — The square changes color every 2s. Scroll down and the square grows to fill the screen. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s the first one leaves)</span></p>
<section class="sq" data-demo-remove data-fx="square-grow-pin">
  <div class="sq__stage"><p class="sq__side is-left" data-fx-part="fade">Your left text here</p><div data-fx-part="square"><span data-fx-part="tile"></span><span data-fx-part="tile"></span><span data-fx-part="tile"></span><span data-fx-part="tile"></span></div><p class="sq__side is-right" data-fx-part="fade">make a better life.</p></div>
  <div style="height: 50vh"></div>
  <div data-fx-part="track"></div>
</section>
<section class="sq" data-fx="square-grow-pin" data-fx-square-grow-pin="cycle: 1200">
  <div class="sq__stage"><div data-fx-part="square"><span data-fx-part="tile"></span><span data-fx-part="tile"></span><span data-fx-part="tile"></span></div></div>
  <div style="height: 50vh"></div>
  <div data-fx-part="track"></div>
</section>
<template data-demo-late><section class="sq" data-fx="square-grow-pin" data-fx-square-grow-pin="auto: 0"><div class="sq__stage"><div data-fx-part="square"><span data-fx-part="tile"></span><span data-fx-part="tile"></span></div></div></section></template>
<div class="after">Next section</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); window.ScrollTrigger?.refresh(); }, 2500);
</script>
</body>
</html>
