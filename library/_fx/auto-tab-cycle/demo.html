<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>auto-tab-cycle — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { padding: 48px 20px; }
  .demo-spacer { height: 90vh; display: grid; place-items: center; color: var(--kf-dim); }

  [data-fx-part="tabs"] { gap: 8px; padding: 4px; width: max-content; border: 1px solid var(--kf-line); }
  [data-fx-part="tabs"] button { position: relative; z-index: 1; width: 28px; height: 28px; border: 1px solid var(--kf-line); background: var(--kf-surface); }
  [data-fx-part="indicator"] { border: 2px solid var(--kf-accent); }
  [data-fx-part="rooms"] { margin-top: 16px; max-width: 520px; }
  [data-fx-part="rooms"] > div { padding: 24px; min-height: 160px; border: 1px solid var(--kf-line); }
  [data-fx-part="rooms"] > div:nth-child(1) { background: var(--kf-surface); } [data-fx-part="rooms"] > div:nth-child(2) { background: var(--kf-raised); }
  [data-fx-part="rooms"] > div:nth-child(3) { background: var(--kf-ink); color: var(--kf-bg); } [data-fx-part="rooms"] > div:nth-child(4) { background: var(--kf-accent); color: var(--kf-on-accent); }
</style>
</head>
<body>
<p class="demo-hint"><b>auto-tab-cycle</b> — The indicator bar advances by itself every two beats. Click a sample to hold on it. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<section class="demo"><div data-demo-remove data-fx="auto-tab-cycle"><div data-fx-part="tabs"><i data-fx-part="indicator"></i><button type="button" aria-label="Theme 1"></button><button type="button" aria-label="Theme 2"></button><button type="button" aria-label="Theme 3"></button><button type="button" aria-label="Theme 4"></button></div>
<div data-fx-part="rooms"><div>Theme 1 Version</div><div>Theme 2 Version</div><div>Theme 3 Version</div><div>Theme 4 Version</div></div></div><div data-fx="auto-tab-cycle"><div data-fx-part="tabs"><i data-fx-part="indicator"></i><button type="button" aria-label="Theme 1"></button><button type="button" aria-label="Theme 2"></button><button type="button" aria-label="Theme 3"></button><button type="button" aria-label="Theme 4"></button></div>
<div data-fx-part="rooms"><div>Theme 1 Version</div><div>Theme 2 Version</div><div>Theme 3 Version</div><div>Theme 4 Version</div></div></div><template data-demo-late><div data-fx="auto-tab-cycle"><div data-fx-part="tabs"><i data-fx-part="indicator"></i><button type="button" aria-label="Theme 1"></button><button type="button" aria-label="Theme 2"></button><button type="button" aria-label="Theme 3"></button><button type="button" aria-label="Theme 4"></button></div>
<div data-fx-part="rooms"><div>Theme 1 Version</div><div>Theme 2 Version</div><div>Theme 3 Version</div><div>Theme 4 Version</div></div></div></template></section>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../../../_shared/vendor/gsap/CustomEase.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); window.ScrollTrigger?.refresh(); }, 2500);
</script>
</body>
</html>
