<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pixel-stairs — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { padding: 48px 20px; }
  .demo-spacer { height: 90vh; display: grid; place-items: center; color: var(--kf-dim); }

  .panel { position: relative; height: 70vh; overflow: hidden; border-radius: 20px; background: var(--kf-surface); color: var(--kf-accent); border: 1px solid var(--kf-line); }
  .panel + .panel { margin-top: 40px; color: var(--kf-dim); }
</style>
</head>
<body>
<p class="demo-hint"><b>pixel-stairs</b> — The stair-step strip lights up cell by cell from the left. The panel below lights up when it enters the screen. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<section class="demo"><div class="panel"><svg data-demo-remove data-fx="pixel-stairs" aria-hidden="true" data-fx-pixel-stairs="cell: 44; slope: .5; start: .95; seed: 11"></svg><svg data-fx="pixel-stairs" aria-hidden="true" data-fx-pixel-stairs="cell: 44; slope: .5; start: .95; seed: 11"></svg><template data-demo-late><svg data-fx="pixel-stairs" aria-hidden="true" data-fx-pixel-stairs="cell: 44; slope: .5; start: .95; seed: 11"></svg></template></div>
<div class="demo-spacer">Scroll down</div><div class="panel"><svg data-fx="pixel-stairs" aria-hidden="true" data-fx-pixel-stairs="cell: 80; thick: 3; slope: .4; start: 1.05; seed: 5; draw: enter"></svg></div></section><div class="demo-spacer"></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); window.ScrollTrigger?.refresh(); }, 2500);
</script>
</body>
</html>
