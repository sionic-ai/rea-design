<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>idle-saver — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.6 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: sticky; top: 0; z-index: 100; margin: 0; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo-body { min-height: 150vh; padding: 40px; }
  .demo-btn { padding: 12px 20px; border: 1px solid var(--kf-line); background: var(--kf-surface); color: var(--kf-ink); font: 600 14px/1 var(--kf-font-sans); cursor: pointer; }
  [data-fx-part="card"] { width: min(80vw, 520px); padding: 32px; border: 1px solid var(--kf-ink); background: var(--kf-bg); }
  [data-fx-part="card"] h2 { margin: 0 0 8px; font: 600 20px/1.3 var(--kf-font-display); }
</style>
</head>
<body>
<p class="demo-hint"><b>idle-saver</b> — Don’t touch the mouse or keys for 5 seconds (or press the button). Once the panel shows, any input dismisses it. <span style="color:var(--kf-dim)">(After 1s one more panel comes in, and one leaves 2.5s later)</span></p>
<div class="demo-body"><button class="demo-btn" id="demo-open" type="button">Launch Now</button></div>
<div data-fx="idle-saver" data-fx-idle-saver="idle: 4; open: #demo-open" data-demo-remove>
  <div data-fx-part="card"><h2>Dropped Panel</h2><p>This panel drops out after 2.5 seconds and the clock stops with it.</p></div>
</div>
<template data-demo-late><div data-fx="idle-saver" data-fx-idle-saver="idle: 5; open: #demo-open"><div data-fx-part="card"><h2>Record 01</h2><p>Put a piece of the record here.</p></div><div data-fx-part="card"><h2>Record 02</h2><p>Your second record here.</p></div><div data-fx-part="card"><h2>Record 03</h2><p>Your third record goes here.</p></div></div></template>

<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); window.ScrollTrigger?.refresh(); }, 2500);
</script>
</body>
</html>
