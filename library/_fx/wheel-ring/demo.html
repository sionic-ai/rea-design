<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>wheel-ring — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  html, body { height: 100%; overflow: hidden; }
  body { margin: 0; background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: absolute; top: 0; left: 0; right: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .ring { height: 100svh; }
  .card { display: grid; place-items: center; border-radius: var(--kf-radius-lg); background: var(--kf-surface); border: 1px solid var(--kf-line); font: 700 28px var(--kf-font-display); color: var(--kf-ink); text-decoration: none; }
  .card.is-center { border-color: var(--kf-accent); }
</style>
</head>
<body>
<p class="demo-hint"><b>wheel-ring</b> Roll the wheel or drag sideways. The ring spins, the center item grows, and items near the cursor are pulled in.</p>
<section class="ring" data-fx="wheel-ring">
  <a class="card" data-fx-part="item" href="#">01</a><a class="card" data-fx-part="item" href="#">02</a><a class="card" data-fx-part="item" href="#">03</a><a class="card" data-fx-part="item" href="#">04</a>
  <a class="card" data-fx-part="item" href="#">05</a><a class="card" data-fx-part="item" href="#">06</a><a class="card" data-fx-part="item" href="#">07</a><a class="card" data-fx-part="item" href="#">08</a>
</section>
<script>
// Late arrivals and removals — checks that fx-core attaches to an element added after 1s and detaches from an element removed after 2.5s
(() => {
  const src = document.querySelector('[data-fx~="wheel-ring"]');
  if (!src) return;
  const html = src.outerHTML.replace(/\sid="[^"]*"/g, "");
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => src.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical one comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
