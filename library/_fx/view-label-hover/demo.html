<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>view-label-hover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; padding: 48px 20px; }
  .demo a { display: block; color: inherit; text-decoration: none; }
  .demo .wf-img { aspect-ratio: 4 / 5; border: 0; }
  .demo p { padding: 10px 0; }
</style>
</head>
<body>
<p class="demo-hint"><b>view-label-hover</b> — Hover over the photo. <span style="color:var(--kf-dim)">(One more card comes in after 1s, and one drops out after 2.5s)</span></p>
<section class="demo" id="demo">
  <a href="#" data-demo-remove><span data-fx="view-label-hover"><span class="wf-img" data-fx-part="media" data-label="Product photo 1"></span></span><p>Product 1</p></a>
  <a href="#"><span data-fx="view-label-hover"><span class="wf-img" data-fx-part="media" data-label="Product photo 2"></span></span><p>Product 2</p></a>
  <a href="#"><span data-fx="view-label-hover" data-fx-view-label-hover="look: read"><span class="wf-img" data-fx-part="media" data-label="Post photo · READ MORE"></span></span><p>Text 1</p></a>
  <a href="#" data-fx="view-label-hover"><span class="wf-img" data-label="The element itself is the link · first child is the photo"></span></a>
</section>
<script>
setTimeout(() => document.getElementById("demo").insertAdjacentHTML("beforeend", '<a href="#"><span data-fx="view-label-hover"><span class="wf-img" data-fx-part="media" data-label="Late-arrived Photo"></span></span><p>Product 4</p></a>'), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
