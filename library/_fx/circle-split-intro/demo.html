<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>circle-split-intro — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-nav { display: flex; justify-content: space-between; align-items: center; padding: 22px 20px; border-bottom: 1px solid var(--kf-line); }
  .demo-logo { display: inline-flex; align-items: center; gap: 12px; color: var(--kf-ink); text-decoration: none; }
  .demo-logo svg { height: 30px; width: auto; overflow: visible; }
  .demo-logo span { font: var(--kf-weight-display) 30px/1.2 var(--kf-font-display); letter-spacing: .02em; }
  .demo-body { padding: 40px 20px; min-height: 60vh; }
</style>
</head>
<body>
<p class="demo-hint"><b>circle-split-intro</b> — On open, the circle splits in two and becomes the logo, flying to the nav spot. Click to skip.</p>
<header class="demo-nav">
  <a class="demo-logo" href="#" data-fx="circle-split-intro" data-fx-circle-split-intro="hold: .6">
    <svg data-fx-part="mark" viewBox="0 0 100 166" aria-hidden="true"><circle cx="50" cy="50" r="50" style="fill: var(--kf-accent)"/><circle cx="50" cy="116" r="50" style="fill: var(--kf-ink-soft)"/></svg>
    <span data-fx-part="word">STUDIO</span>
  </a>
  <span>Menu 1 · Menu 2</span>
</header>
<div class="demo-body">
  <p>Your two body lines here.</p>
  <div data-fx="circle-split-intro" data-demo-remove></div>
  <template data-demo-late><div data-fx="circle-split-intro"></div></template>
</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
