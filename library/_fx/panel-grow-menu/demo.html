<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>panel-grow-menu — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-raised); color: var(--kf-ink); font: 500 15px/1.6 var(--kf-font-sans); margin: 0; min-height: 140vh; }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .row { display: flex; justify-content: center; gap: 24px; padding-top: 24px; align-items: flex-start; }
  [data-fx-part="toggle"] { width: 32px; height: 32px; border: 0; border-radius: var(--kf-radius-sm); background: var(--kf-raised); cursor: pointer; }
  nav { display: flex; flex-direction: column; padding: 20px 16px; gap: 6px; font: 500 32px/1.1 var(--kf-font-display); letter-spacing: -0.04em; }
</style>
</head>
<body>
<p class="demo-hint"><b>panel-grow-menu</b> — Press the button on the center panel. The panel grows into a menu in place. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<div class="row" id="row">
  <div data-fx="panel-grow-menu"><div data-fx-part="veil"></div><div data-fx-part="panel"><div data-fx-part="bar"><b>Logo</b><button data-fx-part="toggle" type="button" aria-label="Menu">=</button></div><div data-fx-part="body"><nav><a href="#">Menu 1</a><a href="#">Menu 2</a><a href="#">Menu 3</a><a href="#">Menu 4</a></nav></div></div></div>
  <div data-fx="panel-grow-menu" data-fx-panel-grow-menu="to: 420; dur: 0.3" data-demo-remove><div data-fx-part="panel"><div data-fx-part="bar"><b>Omission</b><button data-fx-part="toggle" type="button" aria-label="Menu">=</button></div><div data-fx-part="body"><nav><a href="#">Menu 1</a></nav></div></div></div>
</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => { const t = document.createElement("div"); t.innerHTML = '<div data-fx="panel-grow-menu" data-fx-panel-grow-menu="to: 360"><div data-fx-part="panel"><div data-fx-part="bar"><b>Arrives late</b><button data-fx-part="toggle" type="button" aria-label="Menu">=</button></div><div data-fx-part="body"><nav><a href="#">Menu 1</a><a href="#">Menu 2</a></nav></div></div></div>'; document.getElementById("row").append(t.firstChild); }, 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
