<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pill-tab-slide — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { display: grid; gap: 48px; padding: 48px 20px; max-width: 900px; }
  .bar { position: relative; display: flex; padding: 10px; border-radius: var(--kf-radius-pill); background: var(--kf-raised); }
  .bar button { flex: 1; padding: 14px 20px; border: 0; border-radius: var(--kf-radius-pill); background: none; cursor: pointer; }
  .bar button.is-fx-on { color: var(--kf-on-accent); }
  .panel { padding: 32px 4px; font: 500 28px/1.2 var(--kf-font-display); }
</style>
</head>
<body>
<p class="demo-hint"><b>pill-tab-slide</b> — Press the tab cells (left and right arrow keys work too). <span style="color:var(--kf-dim)">(After 1s one more tab row comes in, and after 2.5s one is removed)</span></p>
<div class="demo">
  <div data-fx="pill-tab-slide">
    <div class="bar" role="tablist"><span data-fx-part="pill"></span><button data-fx-part="tab" role="tab" aria-selected="true">Problem</button><button data-fx-part="tab" role="tab">Answer</button><button data-fx-part="tab" role="tab">Evidence</button></div>
    <div class="panel" data-fx-part="panel">First panel — space to write the problem in two lines.</div>
    <div class="panel" data-fx-part="panel">Second panel — space to write the answer in three cells.</div>
    <div class="panel" data-fx-part="panel">Third panel — a place for numeric evidence.</div>
  </div>
  <div data-fx="pill-tab-slide" data-demo-remove>
    <div class="bar" role="tablist"><span data-fx-part="pill"></span><button data-fx-part="tab" role="tab" aria-selected="true">Dropped Line</button><button data-fx-part="tab" role="tab">Both</button></div>
  </div>
  <template data-demo-late><div data-fx="pill-tab-slide" data-fx-pill-tab-slide="dur: 0"><div class="bar" role="tablist"><button data-fx-part="tab" role="tab" aria-selected="true">No pill</button><button data-fx-part="tab" role="tab">Instant Change</button></div><div class="panel" data-fx-part="panel">Late-arriving first panel</div><div class="panel" data-fx-part="panel">Late second version</div></div></template>
  <div data-fx="pill-tab-slide"></div>
</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
