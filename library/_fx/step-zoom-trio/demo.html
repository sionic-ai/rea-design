<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>step-zoom-trio — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  [data-fx-part="stick"] { display: flex; align-items: center; background: var(--kf-contrast-bg); color: var(--kf-contrast-ink); }
  .frame { position: relative; width: 100%; height: 440px; }
  [data-fx-part="step"] { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 32px; }
  .card { width: 260px; flex: none; }
  .ph { position: relative; aspect-ratio: 4 / 5; border-radius: 12px; overflow: hidden; background: color-mix(in oklab, var(--kf-contrast-ink) 15%, transparent); }
  [data-fx-part="vid2"] > div, [data-fx-part="vid3"] > div { border-radius: 12px; background: color-mix(in oklab, var(--kf-contrast-ink) 25%, transparent); }
  [data-fx-part="title2"] { top: 10%; font: 700 32px/1.1 var(--kf-font-display); }
  .bars { position: absolute; left: 32px; top: 50%; translate: 0 -50%; display: flex; flex-direction: column; gap: 8px; }
  .bars span { position: relative; width: 3px; height: 80px; background: color-mix(in oklab, var(--kf-contrast-ink) 10%, transparent); }
  .bars i { position: absolute; inset: 0 0 auto; background: var(--kf-contrast-ink); }
  .after { height: 60vh; padding: 40px 20px; }
</style>
</head>
<body>
<p class="demo-hint"><b>step-zoom-trio</b> — Scroll slowly (window wider than 768px). Step 1 turns into step 2, the result cell grows and moves left, and the center and right cells float up.</p>
<div data-fx="step-zoom-trio">
  <div data-fx-part="stick">
    <div class="bars" data-fx-part="fade"><span><i data-fx-part="bar"></i></span><span><i data-fx-part="bar"></i></span></div>
    <div class="frame">
      <div data-fx-part="step"><div class="card"><div class="ph"></div></div><span>→</span><div class="card"><div class="ph"></div></div></div>
      <div data-fx-part="step"><div class="card" data-fx-part="fade"><div class="ph"></div></div><span data-fx-part="fade">→</span><figure class="card" data-fx-part="result"><div class="ph" data-fx-part="zoom"></div></figure></div>
    </div>
    <h2 data-fx-part="title2">Your new title here</h2>
    <div data-fx-part="vid2"><div></div></div>
    <div data-fx-part="vid3"><div></div></div>
    <p data-fx-part="cap1">Description 1</p><p data-fx-part="cap2">Description 2</p><p data-fx-part="cap3">Description 3</p>
  </div>
</div>
<div class="after"><p>Your next section here.</p></div>
<script>
// Late arrivals and removals — checks that fx-core attaches to an element added after 1s and detaches from an element removed after 2.5s
(() => {
  const host = document.querySelector('[data-fx~="step-zoom-trio"]');
  if (!host) return;
  const html = host.outerHTML;
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  host.after(gone);
  setTimeout(() => host.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical one comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
