<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>frost-clear-grid — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 14px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; padding: 30px 20px; }
  .demo [data-fx-part="media"] { aspect-ratio: 4 / 5; border-radius: var(--kf-radius-sm); }
  .demo .pic { position: absolute; inset: 0; background: repeating-linear-gradient(45deg, var(--kf-raised) 0 14px, var(--kf-line) 14px 16px); display: grid; place-items: center; color: var(--kf-ink); font: 600 28px/1 var(--kf-font-display); }
  .demo p { margin: 8px 0 0; }
</style>
</head>
<body>
<p class="demo-hint"><b>frost-clear-grid</b> — When a card appears the frost clears. Hover a card — only that card is clear and the rest frost over again. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<div class="demo" data-fx="frost-clear-grid">
  <article data-fx-part="card"><div data-fx-part="media"><div class="pic">Figure 1</div></div><p data-fx-part="text">Card title one</p></article>
  <article data-fx-part="card"><div data-fx-part="media"><div class="pic">Figure 2</div></div><p data-fx-part="text">Card title two</p></article>
  <article data-fx-part="card" data-demo-remove><div data-fx-part="media"><div class="pic">Being removed soon</div></div><p data-fx-part="text">Soon-Removed Card</p></article>
  <template data-demo-late><article data-fx-part="card"><div data-fx-part="media"><div class="pic">Arrives late</div></div><p data-fx-part="text">Late-arriving card</p></article></template>
</div>
<div class="demo" data-fx="frost-clear-grid" data-fx-frost-clear-grid="min: 0; max: 0" style="--fx-blur: 6px; --fx-scale: 1.1"><article data-fx-part="card"><div data-fx-part="media"><div class="pic">Delay 0</div></div></article><article data-fx-part="card"><div data-fx-part="media"></div></article></div>
<div class="demo" data-fx="frost-clear-grid"></div>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
