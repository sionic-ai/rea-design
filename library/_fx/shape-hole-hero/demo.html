<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>shape-hole-hero — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-contrast-bg); color: var(--kf-contrast-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); color: var(--kf-ink); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .behind { position: fixed; inset: 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; padding: 12vh 8vw; }
  .behind .wf-img { height: 100%; }
  .hero { height: 100vh; }
  .after { position: relative; height: 150vh; padding: 40px 20px; }
</style>
</head>
<body>
<p class="demo-hint"><b>shape-hole-hero</b> — When opened, it expands from a dot into a hole shape. Move the mouse and scroll down. <span style="color:var(--kf-dim)">(After 1s one more panel attaches, and leaves after 2.5s)</span></p>
<div class="behind" aria-hidden="true"><div class="wf-img" data-label="Runner · dawn · portrait"></div><div class="wf-img" data-label="Mountain trail rock · midday · portrait"></div><div class="wf-img" data-label="Finish line crowd · dusk · portrait"></div></div>
<section class="hero" data-fx="shape-hole-hero"></section>
<div class="hero" data-fx="shape-hole-hero" data-fx-shape-hole-hero="reveal: manual" data-demo-remove></div>
<section class="after"><p>Your next section here</p></section>
<template data-demo-late><div style="height:10px" data-fx="shape-hole-hero" data-fx-shape-hole-hero="barrel: 2; pulse: 0"></div></template>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../scroll-sag-warp/three-pre.js"></script>
<script src="../../_vendor/three@0.183.0/build/three.cjs"></script>
<script src="../scroll-sag-warp/three-post.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => { const t = document.querySelector("template[data-demo-late]"); document.body.append(t.content.cloneNode(true)); }, 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
