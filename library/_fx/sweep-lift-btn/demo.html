<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sweep-lift-btn — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { display: flex; flex-wrap: wrap; gap: 24px; align-items: center; padding: 48px 20px; }
  .demo.dark { background: var(--kf-accent); }
  .btn { display: inline-flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 4px; font-weight: 700; }
  .btn i { width: 1px; height: 2rem; background: currentColor; opacity: .4; }
</style>
</head>
<body>
<p class="demo-hint"><b>sweep-lift-btn</b> — Hover over the button. It lifts 2px while a band of light sweeps across. Release and it returns.</p>
<section class="demo">
  <a class="btn" href="#" data-fx="sweep-lift-btn">View list <i></i><span data-fx-part="icon">→</span></a>
  <a class="btn" href="#" data-fx="sweep-lift-btn" style="--fx-dur: 1.2s">Slow light beam 1.2s <span data-fx-part="icon">→</span></a>
</section>
<section class="demo dark">
  <a class="btn" href="#" data-fx="sweep-lift-btn" data-fx-sweep-lift-btn="look: light">White button <i></i><span data-fx-part="icon">→</span></a>
</section>
</body>
</html>
