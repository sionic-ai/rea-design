<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dot-stage-grow — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-surface); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; overflow-x: hidden; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-bg); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-spacer { height: 90vh; display: grid; place-items: center; color: var(--kf-dim); }
  .ds { padding: 160px 20px 200px; text-align: center; }
  .ds .box { max-width: 720px; margin: 0 auto; padding: 40px; border: 1px dashed var(--kf-dim); border-radius: 10px; }
  .ds + .ds { margin-top: 120px; }
</style>
</head>
<body>
<p class="demo-hint"><b>dot-stage-grow</b> Scroll down and the dot at the center of the section spreads once into a white ellipse wider than the screen, then a box floats up. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<div class="demo-spacer">Scroll down</div>
<section class="ds" data-demo-remove data-fx="dot-stage-grow"><i data-fx-part="dot"></i><div class="box" data-fx-part="content">Section to Be Removed</div></section>
<section class="ds" data-fx="dot-stage-grow"><i data-fx-part="dot"></i><div class="box" data-fx-part="content">Spot for the logo and four services</div></section>
<template data-demo-late><section class="ds" data-fx="dot-stage-grow" data-fx-dot-stage-grow="dur: 1.6"><i data-fx-part="dot"></i><div class="box" data-fx-part="content">Late-entering section (1.6s)</div></section></template>
<section data-fx="dot-stage-grow"></section>
<div class="demo-spacer"></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); window.ScrollTrigger?.refresh(); }, 2500);
</script>
</body>
</html>
