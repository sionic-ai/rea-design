<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>name-gap-open — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hero { height: 80vh; margin: 20px; }
  .demo-hero [data-fx-part="intro"] { font: 300 clamp(48px, 10vw, 140px)/1.4 var(--kf-font-display); letter-spacing: -0.065em; }
  .demo-hero [data-fx-part="title"] { position: absolute; left: 60px; bottom: 60px; z-index: 3; margin: 0; color: var(--kf-bg); font: 300 clamp(48px, 7vw, 110px)/0.88 var(--kf-font-display); letter-spacing: -0.06em; }
  .demo-hero .wf-img { height: 100%; }
</style>
</head>
<body>
<p class="demo-hint"><b>name-gap-open</b> — On open, a photo window opens between the two halves of the name, fills the panel, and the title rises.</p>
<section class="demo-hero" data-fx="name-gap-open" id="src">
  <div data-fx-part="intro">
    <span data-fx-part="start">Hospital</span>
    <span data-fx-part="box"><span data-fx-part="image"><span class="wf-img" data-label="Treatment scene · bright light · landscape"></span></span></span>
    <span data-fx-part="end">Name</span>
  </div>
  <h1 data-fx-part="title">Your big title here</h1>
</section>
<script>
(() => {
  const src = document.getElementById("src");
  const html = src.outerHTML.replace(/\sid="[^"]*"/g, "").replace('data-fx="name-gap-open"', 'data-fx="name-gap-open" data-fx-name-gap-open="speed: 2"');
  const make = () => { const t = document.createElement("template"); t.innerHTML = html; return t.content.firstElementChild; };
  const gone = make();
  src.after(gone);
  setTimeout(() => src.after(make()), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s a second panel at double speed comes in (the late arrival), and after 2.5s one drops out (the release).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
