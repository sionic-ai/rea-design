<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>char-seq-rise — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.6 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo-spacer { height: 80vh; display: grid; place-items: center; color: var(--kf-dim); }
  h2 { font: 400 30px/1.5 var(--kf-font-display); letter-spacing: 0.2rem; margin: 0 auto 80px; max-width: 640px; padding: 0 20px; word-break: keep-all; }
</style>
</head>
<body>
<p class="demo-hint"><b>char-seq-rise</b> — Scroll down and the title rises one character at a time. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<h2 data-fx="char-seq-rise">Your season here</h2>
<div class="demo-spacer">Scroll down</div>
<h2 data-fx="char-seq-rise" data-demo-remove>Your outcome here</h2>
<h2 data-fx="char-seq-rise" data-fx-char-seq-rise="each: 0.05; rise: 60">Long multi-word titles break to a new line word by word</h2>
<template data-demo-late><h2 data-fx="char-seq-rise">Late-arriving title</h2></template>
<h2 data-fx="char-seq-rise"></h2>
<div class="demo-spacer">Footer</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
