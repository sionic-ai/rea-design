<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>seam-split-btn — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { display: flex; flex-wrap: wrap; gap: 20px; align-items: center; max-width: 760px; padding: 48px 20px; font-size: 14px; }
</style>
</head>
<body>
<p class="demo-hint"><b>seam-split-btn</b> — Hover over the button. The arrow cell separates and becomes a circle.</p>
<main class="demo" id="demo">
  <a href="#" data-fx="seam-split-btn"><span data-fx-part="label">Go to post</span><span data-fx-part="icon"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h10M9 4l4 4-4 4"/></svg></span></a>
  <button type="button" data-fx="seam-split-btn" data-fx-seam-split-btn="look: accent"><span data-fx-part="label">Subscribe</span><span data-fx-part="icon"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 4h12v8H2z M2 4l6 5 6-5"/></svg></span></button>
  <a href="#" data-fx="seam-split-btn"><span data-fx-part="label">Button without image</span><span data-fx-part="icon"></span></a>
</main>
<script>
(() => {
  const host = document.getElementById("demo");
  const make = (t) => {
    const a = document.createElement("a");
    a.href = "#";
    a.setAttribute("data-fx", "seam-split-btn");
    a.innerHTML = '<span data-fx-part="label"></span><span data-fx-part="icon"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 8h10M9 4l4 4-4 4"/></svg></span>';
    a.firstElementChild.textContent = t;
    return a;
  };
  const gone = make("Soon-Removed Button");
  host.append(gone);
  setTimeout(() => host.append(make("Late-arrived Button")), 1000);
  setTimeout(() => gone.remove(), 600);
  document.querySelector(".demo-hint").append(" · After 1s one more button comes in (the late arrival), and after .6s one drops out (detach).");
})();
</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
