<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>aurora-pillars-bg — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { padding: 48px 20px; display: grid; gap: 32px; }
  .panel { min-height: 360px; padding: 48px; border-radius: 48px; }
  .card { margin-top: 40px; max-width: 520px; padding: 32px; border-radius: 24px; background: var(--kf-surface); color: var(--kf-ink); }
</style>
</head>
<body>
<p class="demo-hint"><b>aurora-pillars-bg</b> — Light beams behind the panel rotate and flicker very slowly (watch closely). The second panel is fast with --fx-speed: 6. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<section class="demo">
  <div class="panel" data-fx="aurora-pillars-bg"><h2>Dark panel</h2><div class="card">Spot where a white card lands</div></div>
  <div class="panel" data-fx="aurora-pillars-bg" style="--fx-speed: 6"><h2>Quick-look version</h2></div>
  <div class="panel" data-demo-remove data-fx="aurora-pillars-bg"><h2>Panel to Be Removed</h2></div>
  <template data-demo-late><div class="panel" data-fx="aurora-pillars-bg"><h2>Late panel</h2></div></template>
</section>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
