<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>knockout-logo-splash — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.6 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 10; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .splash { height: 80vh; }
  .splash [data-fx-part="photo"] { background: linear-gradient(170deg, var(--kf-accent) 0%, var(--kf-raised) 45%, var(--kf-ink) 100%); }
  .splash svg { width: min(60vw, 320px); height: auto; }
  .splash text { font-family: var(--kf-font-display); }
  .demo-body { min-height: 80vh; padding: 40px 20px; }
</style>
</head>
<body>
<p class="demo-hint"><b>knockout-logo-splash</b> — Plays for 9 seconds when opened. Photos show through the text slots of a white curtain, then at about 5 seconds the curtain lifts and a white logo lights up.</p>
<section class="splash" data-fx="knockout-logo-splash">
  <div data-fx-part="photo"></div>
  <div data-fx-part="veil">
    <svg viewBox="0 0 220 132" aria-label="Logo">
      <path data-fx-part="stroke" d="M38 40 C58 34 70 20 86 12 C96 7 104 9 112 16 C120 24 128 22 138 18 C152 12 166 22 182 40" fill="none" stroke="currentColor" stroke-width="3"/>
      <g fill="currentColor" font-size="36" font-weight="700"><text data-fx-part="letter" x="38" y="92">Prize</text><text data-fx-part="letter" x="76" y="92">Call</text><text data-fx-part="letter" x="114" y="92">This</text><text data-fx-part="letter" x="152" y="92">Reum</text></g>
      <text data-fx-part="sub" x="110" y="122" text-anchor="middle" fill="currentColor" font-size="12" letter-spacing="4">BRAND NAME</text>
    </svg>
  </div>
  <div data-fx-part="mark">
    <svg viewBox="0 0 220 132" aria-hidden="true"><path d="M38 40 C58 34 70 20 86 12 C96 7 104 9 112 16 C120 24 128 22 138 18 C152 12 166 22 182 40" fill="none" stroke="currentColor" stroke-width="3"/><g fill="currentColor" font-size="36" font-weight="700"><text x="38" y="92">Prize</text><text x="76" y="92">Call</text><text x="114" y="92">This</text><text x="152" y="92">Reum</text></g><text x="110" y="122" text-anchor="middle" fill="currentColor" font-size="12" letter-spacing="4">BRAND NAME</text></svg>
  </div>
</section>
<div class="demo-body" id="late-host"><p>After 1s one more blank splash panel comes in (quietly does nothing) and leaves after 2.5s.</p></div>
<template data-demo-late><section data-fx="knockout-logo-splash" data-demo-remove style="height:40px"></section></template>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => document.getElementById("late-host").append(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
