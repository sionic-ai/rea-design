<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>glyph-spin-scroll — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { padding: 30vh 40px 150vh; font: var(--kf-weight-display) 96px/1 var(--kf-font-display); }
  .demo [data-fx] { color: var(--kf-accent); }
</style>
</head>
<body>
<p class="demo-hint"><b>glyph-spin-scroll</b> — The star keeps spinning. Scroll the page quickly — it speeds up, then returns to its normal speed. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<section class="demo" id="box">
  <p>Storage box<span data-fx="glyph-spin-scroll" aria-hidden="true">*</span></p>
  <p>Reverse<span data-fx="glyph-spin-scroll" data-fx-glyph-spin-scroll="speed: 40; gain: -.5; min: 10; max: 170" aria-hidden="true">✳</span></p>
  <p data-demo-remove>Dropping row<span data-fx="glyph-spin-scroll" aria-hidden="true">*</span></p>
  <p>Blank character<span data-fx="glyph-spin-scroll"></span></p>
</section>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => { const p = document.createElement("p"); p.innerHTML = 'Late row<span data-fx="glyph-spin-scroll" aria-hidden="true">*</span>'; document.getElementById("box").append(p); }, 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
