<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>anchor-glide-open — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="../height-fold/fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.6 var(--kf-font-sans); }
  .demo-head { position: sticky; top: 0; z-index: 10; height: 64px; display: flex; align-items: center; gap: 16px; padding: 0 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-head b { font-weight: 700; }
  .demo { max-width: 640px; margin: 0 auto; padding: 40px 20px 120px; }
  .demo-nav { display: flex; flex-wrap: wrap; gap: 10px; padding: 24px; border-radius: var(--kf-radius-md); background: var(--kf-raised); }
  .demo-nav a { padding: 8px 16px; border: 2px solid var(--kf-accent); border-radius: var(--kf-radius-pill); background: var(--kf-surface); color: var(--kf-accent-text); font-weight: 700; }
  .demo-gap { height: 120vh; display: grid; place-items: center; color: var(--kf-dim); }
  .demo-list { display: grid; gap: 8px; }
  .q { border-radius: var(--kf-radius-sm); background: var(--kf-surface); border: 1px solid var(--kf-line); }
  .q button { display: flex; justify-content: space-between; width: 100%; padding: 16px 20px; border: 0; background: none; font-weight: 700; text-align: left; cursor: pointer; }
  .q button::after { content: "+"; }
  .q.is-opened button::after { content: "−"; }
  .q [data-fx-part="body"] > div { padding: 0 20px 20px; color: var(--kf-dim); }
  .demo-top { display: inline-block; margin-top: 40px; color: var(--kf-accent-text); font-weight: 700; }
</style>
</head>
<body>
<header class="demo-head"><span><b>anchor-glide-open</b> — Press the button. It lifts by the header row height and descends in .8s, and if the row is folded it opens too.</span></header>
<main class="demo">
  <nav class="demo-nav">
    <a href="#area-1" data-fx="anchor-glide-open" data-fx-anchor-glide-open="offset: .demo-head">Region 1</a>
    <a href="#area-2" data-fx="anchor-glide-open" data-fx-anchor-glide-open="offset: .demo-head">Region 2</a>
    <a href="#area-3" data-fx="anchor-glide-open" data-fx-anchor-glide-open="offset: .demo-head; open: false">Region 3 (not open)</a>
  </nav>
  <div class="demo-gap">Scrolls down</div>
  <div class="demo-list">
    <div class="q" id="area-1" data-fx="height-fold" data-fx-height-fold="dur: .6; ease: 0.25,0.1,0.25,1; fade: false"><button type="button" data-fx-part="head">Region 1</button><div data-fx-part="body"><div>Your two-line list of local places here.</div></div></div>
    <div class="q" id="area-2" data-fx="height-fold" data-fx-height-fold="dur: .6; ease: 0.25,0.1,0.25,1; fade: false"><button type="button" data-fx-part="head">Region 2</button><div data-fx-part="body"><div>Your local list here.</div></div></div>
    <div class="q" id="area-3" data-fx="height-fold" data-fx-height-fold="dur: .6; ease: 0.25,0.1,0.25,1; fade: false"><button type="button" data-fx-part="head">Region 3</button><div data-fx-part="body"><div>Your local list here.</div></div></div>
  </div>
  <a class="demo-top" href="#" data-fx="anchor-glide-open" data-fx-anchor-glide-open="offset: 0">Back to top</a>
  <div class="demo-gap"></div>
</main>
<script>
// Late arrivals and removals — checks that fx-core attaches to an element added after 1s and detaches from an element removed after 2.5s
(() => {
  const nav = document.querySelector(".demo-nav");
  const make = (txt, href) => { const a = document.createElement("a"); a.href = href; a.textContent = txt; a.dataset.fx = "anchor-glide-open"; a.setAttribute("data-fx-anchor-glide-open", "offset: .demo-head"); return a; };
  const gone = make("Being removed soon", "#area-2");
  nav.append(gone);
  setTimeout(() => nav.append(make("Late one", "#area-3")), 1000);
  setTimeout(() => gone.remove(), 2500);
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/CustomEase.min.js"></script>
<script src="../fx-core.js"></script>
<script src="../height-fold/fx.js"></script>
<script src="fx.js"></script>
</body>
</html>
