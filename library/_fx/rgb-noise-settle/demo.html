<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rgb-noise-settle — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { padding: 12px 20px; border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .stage { height: 60vh; margin: 20px; }
  .stage canvas[data-fx-part] { width: 100%; height: 100%; display: block; }
  .tall { height: 120vh; }
</style>
</head>
<body>
<p class="demo-hint"><b>rgb-noise-settle</b> — The photo gathers in 2 seconds from noise scattered into red, green and blue. Scroll down and the second photo gathers as it enters the screen.</p>
<div class="stage" data-fx="rgb-noise-settle" data-demo-remove><canvas data-fx-part="image" width="1600" height="900"></canvas></div>
<div class="tall"></div>
<template data-demo-late><div class="stage" data-fx="rgb-noise-settle" data-fx-rgb-noise-settle="on: scroll; spread: 0.1 0.2 0.3; rate: 0.5"><canvas data-fx-part="image" width="900" height="900"></canvas></div></template>
<div class="tall"></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../../_vendor/three@0.141.0/build/three.min.js"></script>
<script>
// Demo graphic — draws the skin’s accent light beam and ink-black band
function paint(cv) {
  const c = cv.getContext("2d"), css = getComputedStyle(document.documentElement);
  const bg = css.getPropertyValue("--kf-raised").trim(), a = css.getPropertyValue("--kf-accent").trim(), ink = css.getPropertyValue("--kf-ink").trim();
  c.fillStyle = bg; c.fillRect(0, 0, cv.width, cv.height);
  const g = c.createLinearGradient(0, 0, 0, cv.height); g.addColorStop(0, a); g.addColorStop(1, bg);
  c.fillStyle = g; c.fillRect(cv.width * 0.35, 0, cv.width * 0.3, cv.height);
  c.fillStyle = ink; c.font = `600 ${cv.height * 0.12}px sans-serif`; c.textAlign = "center"; c.fillText("SAMPLE", cv.width / 2, cv.height * 0.55);
}
document.querySelectorAll('canvas[data-fx-part="image"]').forEach(paint);
</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => { const n = t.content.cloneNode(true); n.querySelectorAll("canvas").forEach(paint); t.replaceWith(n); }), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
