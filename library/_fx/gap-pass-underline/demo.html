<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gap-pass-underline — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { padding: 40px 20px; display: grid; gap: 32px; justify-items: start; font-size: 20px; }
  .panel { padding: 32px; background: var(--kf-accent-soft); }
</style>
</head>
<body>
<p class="demo-hint"><b>gap-pass-underline</b> — Hover over an underlined link and move away — a gap sweeps across the underline. <span style="color:var(--kf-dim)">(After 1s one more link comes in, and after 2.5s one drops out)</span></p>
<main class="demo">
  <a href="#" data-fx="gap-pass-underline">Browse Projects</a>
  <a href="#" data-fx="gap-pass-underline" data-fx-gap-pass-underline="dur: .8" data-demo-remove>Quick underline</a>
  <div class="panel"><a href="#" data-fx="gap-pass-underline" style="--fx-gap: var(--kf-accent-soft)">Link on panel</a></div>
  <template data-demo-late><a href="#" data-fx="gap-pass-underline">Late-arriving link</a></template>
</main>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => { const t = document.querySelector("template[data-demo-late]"); document.querySelector(".demo").append(t.content.cloneNode(true)); }, 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
