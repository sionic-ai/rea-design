<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dot-sphere-morph — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-row { display: flex; flex-wrap: wrap; gap: 24px; padding: 40px 20px; }
  .demo-card { width: min(420px, 100%); aspect-ratio: 1; border-radius: 16px; }
</style>
</head>
<body>
<p class="demo-hint"><b>dot-sphere-morph</b> — Just watch. The dot sphere spins, scatters into a cloud, forms a donut ring, then returns to a sphere (one loop every 10s).</p>
<div class="demo-row">
  <div class="demo-card" data-fx="dot-sphere-morph"></div>
  <div class="demo-card" data-fx="dot-sphere-morph" data-fx-dot-sphere-morph="points: 1200; period: 6; spin: 40"></div>
</div>
<script>
(() => {
  const row = document.querySelector(".demo-row");
  const make = () => { const d = document.createElement("div"); d.className = "demo-card"; d.dataset.fx = "dot-sphere-morph"; return d; };
  const gone = make();
  row.append(gone);
  setTimeout(() => row.append(make()), 1000);
  setTimeout(() => gone.remove(), 2500);
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
