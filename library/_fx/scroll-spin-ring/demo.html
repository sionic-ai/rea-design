<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>scroll-spin-ring — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .pad { height: 60vh; }
  .stage { position: relative; height: 140vh; overflow: hidden; background: var(--kf-surface); }
  .disc { position: absolute; left: 50%; bottom: 0; width: 120vh; translate: -50% 50%; border-radius: 50%; aspect-ratio: 1; background: var(--kf-accent-soft); }
  .ring { position: absolute; left: 50%; bottom: 0; width: 128vh; translate: -50% 50%; color: var(--kf-accent); }
  #row { display: flex; gap: 20px; padding: 20px; }
  #row > div { width: 200px; color: var(--kf-ink); }
</style>
</head>
<body>
<p class="demo-hint"><b>scroll-spin-ring</b> — Scroll down. The text line around the circle rotates as much as the section passes. After 1 second a small ring is added and one is removed.</p>
<div class="pad"></div>
<section class="stage">
  <div class="disc"></div>
  <div class="ring" data-fx="scroll-spin-ring" data-fx-scroll-spin-ring="trigger: .stage; start: top top; end: bottom top; size: 10" aria-label="Your one-line circle slogan here"></div>
</section>
<div id="row">
  <div id="gone" data-fx="scroll-spin-ring" aria-label="Ring to Be Removed"></div>
  <div data-fx="scroll-spin-ring"></div>
</div>
<div class="pad"></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
  setTimeout(() => {
    const d = document.createElement("div");
    d.setAttribute("data-fx", "scroll-spin-ring");
    d.setAttribute("aria-label", "Late-arrived Ring");
    d.setAttribute("data-fx-scroll-spin-ring", "turns: 2; dir: back; scale: 1.05");
    document.getElementById("row")?.appendChild(d);
    document.getElementById("gone")?.remove();
  }, 1000);
</script>
</body>
</html>
