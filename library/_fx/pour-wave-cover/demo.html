<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pour-wave-cover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); min-height: 100vh; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { padding: 48px 20px; display: flex; flex-wrap: wrap; gap: 16px; }
  .b { display: inline-grid; place-items: center; padding: 10px 22px; border: 1px solid var(--kf-line); border-radius: var(--kf-radius-pill); background: var(--kf-surface); color: var(--kf-ink); }
</style>
</head>
<body>
<p class="demo-hint"><b>pour-wave-cover</b> — Press the button. A rippling curtain pours down from the top and covers the screen, then is drawn back. Attached to a link, it covers the screen, then navigates, and slides away downward on the next page.</p>
<section class="demo">
  <button class="b" type="button" data-fx="pour-wave-cover" data-demo-remove>Being removed soon</button>
  <button class="b" type="button" data-fx="pour-wave-cover">Cover then retract</button>
  <button class="b" type="button" data-fx="pour-wave-cover" data-fx-pour-wave-cover="dur: .85; look: ink">To stage color in .85s</button>
  <a class="b" href="demo.html?again" data-fx="pour-wave-cover">Go to this page</a>
  <template data-demo-late><button class="b" type="button" data-fx="pour-wave-cover" data-fx-pour-wave-cover="amp: 30">Late-arriving button · wave 30</button></template>
</section>
<script>
(() => {
  const late = document.querySelector("[data-demo-late]");
  setTimeout(() => late.after(late.content.firstElementChild.cloneNode(true)), 1000);
  setTimeout(() => document.querySelector("[data-demo-remove]")?.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s one more button comes in, and after 2.5s one drops out.");
})();
</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
