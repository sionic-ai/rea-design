<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>glass-magnet-pill — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { min-height: 70vh; padding: 64px 20px; display: flex; flex-wrap: wrap; gap: 48px; align-items: center; justify-content: center; background: var(--kf-contrast-bg); }
  .demo [data-fx-part="surface"] { padding: 0.75rem 1.75rem; }
  .demo .label { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--kf-contrast-ink); }
  .demo .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
</style>
</head>
<body>
<p class="demo-hint"><b>glass-magnet-pill</b> — Hover and move the mouse over the button. The glass surface is pulled toward the cursor and springs back when you leave. <span style="color:var(--kf-dim)">(After 1s one more button comes in, and after 2.5s one drops out)</span></p>
<main class="demo">
  <button data-fx="glass-magnet-pill"><span data-fx-part="surface"><span data-fx-part="content" class="label"><span class="dot"></span>Your button here</span></span></button>
  <a href="#" data-fx="glass-magnet-pill" data-fx-glass-magnet-pill="pull: .5; max: 20; reach: 30"><span data-fx-part="surface"><span data-fx-part="content" class="label">Pulled harder</span></span></a>
  <button data-fx="glass-magnet-pill" data-demo-remove><span data-fx-part="surface"><span data-fx-part="content" class="label">Soon-Removed Button</span></span></button>
  <template data-demo-late><button data-fx="glass-magnet-pill"><span data-fx-part="surface"><span class="label">Button without a post group</span></span></button></template>
</main>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
