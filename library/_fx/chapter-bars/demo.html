<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>chapter-bars — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-stage { margin: 40px 20px; padding: 40px; border-radius: var(--kf-radius-lg); background: var(--kf-accent); color: var(--kf-on-accent); display: grid; gap: 24px; }
  .demo-scene { font-size: 28px; font-weight: 700; }
</style>
</head>
<body>
<p class="demo-hint"><b>chapter-bars</b> — Watch. In each scene a bar fills and drains, and the text above changes to the scene number.</p>
<div class="demo-stage" id="stage">
  <p class="demo-scene" id="scene">Scene 1</p>
  <div data-fx="chapter-bars" data-fx-chapter-bars="cuts: 0 3, 2.8 6, 5.8 9, 8.8 12; length: 12.4">
    <i data-fx-part="bar"><b data-fx-part="fill"></b></i><i data-fx-part="bar"><b data-fx-part="fill"></b></i><i data-fx-part="bar"><b data-fx-part="fill"></b></i><i data-fx-part="bar"><b data-fx-part="fill"></b></i>
  </div>
  <div data-fx="chapter-bars" data-fx-chapter-bars="length: 4; drop: 0" data-demo-remove><i data-fx-part="bar"></i><i data-fx-part="bar"></i></div>
  <div data-fx="chapter-bars"></div>
</div>
<template data-demo-late><div data-fx="chapter-bars" data-fx-chapter-bars="length: 6" style="--fx-w: 60px"><i data-fx-part="bar"><b data-fx-part="fill"></b></i><i data-fx-part="bar"><b data-fx-part="fill"></b></i></div></template>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
document.getElementById("stage").addEventListener("fx:chapter", (e) => { if (e.target.closest("[data-fx-chapter-bars*='12.4']")) document.getElementById("scene").textContent = "Scene " + (e.detail.index + 1); });
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => document.getElementById("stage").append(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
