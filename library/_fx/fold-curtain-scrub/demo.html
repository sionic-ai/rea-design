<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fold-curtain-scrub — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo-gap { height: 60vh; display: grid; place-items: center; background: var(--kf-surface); }
  .demo-screen { }
  .demo-photo { position: absolute; inset: 0; height: 100%; }
  .demo-title { position: relative; display: grid; place-items: center; height: 100%; font: 700 48px/1 var(--kf-font-display); }
</style>
</head>
<body>
<p class="demo-hint"><b>fold-curtain-scrub</b> — Scroll down. The video panel is revealed as sagging folds from above lift away, and further down round folds rise from below to cover it. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<div class="demo-gap">Previous section</div>
<section data-fx="fold-curtain-scrub" data-fx-fold-curtain-scrub="mode: both; length: .6; drift: 2" style="--fx-before: var(--kf-surface); --fx-after: var(--kf-raised)" data-demo-remove>
  <div data-fx-part="screen"><div class="demo-photo wf-img" data-label="Camping site audience video · overcast daylight · full-width horizontal"></div><div class="demo-title">Your title here</div></div>
</section>
<template data-demo-late><section data-fx="fold-curtain-scrub" data-fx-fold-curtain-scrub="mode: cover" style="--fx-after: var(--kf-raised)"><div data-fx-part="screen"><div class="demo-photo wf-img" data-label="Event venue night view video · neon · full-width landscape"></div><div class="demo-title">Late-entering Panel (cover only)</div></div></section></template>
<section data-fx="fold-curtain-scrub" data-fx-fold-curtain-scrub="mode: cover; folds: 6"><div data-fx-part="screen"><div class="demo-photo wf-img" data-label="Stage video · red lighting · full-width landscape"></div><div class="demo-title">Cover only · 6 wide</div></div></section>
<div class="demo-gap">Footer</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
