<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>split-rule-heading — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { padding: 48px 20px; display: grid; gap: 30vh; }
  .demo-spacer { height: 90vh; display: grid; place-items: center; color: var(--kf-dim); }
  .head { width: min(300px, 100%); }
  .head [data-fx-part="rule-label"] { font: 600 11px/1.7 var(--kf-font-display); color: var(--kf-ink-soft); }
  .head h2 { margin: 14px 0 0; font: 500 26px/1.45 var(--kf-font-sans); letter-spacing: .1em; white-space: nowrap; }
</style>
</head>
<body>
<p class="demo-hint"><b>split-rule-heading</b> — Scroll down. When the title head enters the screen, the label underline is drawn from the second color → the accent color, and the two title lines come in from above and below.</p>
<div class="demo-spacer">Pull down</div>
<div class="demo">
  <div class="head" data-fx="split-rule-heading">
    <div data-fx-part="rule"><p data-fx-part="rule-label">WHAT IS</p></div>
    <h2><span data-fx-part="rise-line"><span>Your first-line title here</span></span><span data-fx-part="drop-line"><span>Second line title</span></span></h2>
  </div>
  <div class="head" data-fx="split-rule-heading">
    <div data-fx-part="rule"><p data-fx-part="rule-label">CASE STUDIES</p></div>
    <h2><span data-fx-part="rise-line"><span>Your case title here</span></span></h2>
  </div>
</div>
<div class="demo-spacer"></div>
<script>
// Late arrivals and removals — checks that fx-core attaches to an element added after 1s and detaches from an element removed after 2.5s
(() => {
  const src = document.querySelector('[data-fx~="split-rule-heading"]');
  if (!src) return;
  const html = src.outerHTML.replace(/\sid="[^"]*"/g, "");
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => src.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical one comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
