<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>split-gate-portal — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: fixed; left: 0; right: 0; bottom: 0; z-index: 1100; margin: 0; padding: 10px 20px; background: var(--kf-surface); border-top: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .page { min-height: 100svh; display: grid; place-items: center; padding: 40px; background: var(--kf-surface); }
  .page h1 { font: 300 clamp(40px, 8vw, 120px)/0.95 var(--kf-font-display); letter-spacing: -0.04em; }
  .label { display: inline-flex; align-items: center; gap: 0.6em; font-size: 1.5em; }
  .label i { width: 1.6em; aspect-ratio: 1; background: var(--kf-contrast-ink); }
  .mark { font: 600 22px/1 var(--kf-font-mono); letter-spacing: 0.02em; }
  [data-demo-late] { position: fixed; right: 20px; top: 20px; z-index: 1200; }
</style>
</head>
<body>
<p class="demo-hint"><b>split-gate-portal</b> — Hover over the door (the door widens and photos bloom in turn in the center window). Pressing the door unfolds the page behind it from the center.</p>
<div class="gate" data-fx="split-gate-portal" data-fx-split-gate-portal="target: #demo-page">
  <a href="#" data-fx-part="door">
    <div data-fx-part="inner"><span class="label" data-fx-part="label"><i></i>City One</span></div>
    <div data-fx-part="peek">
      <div class="wf-img" data-label="Interior shot 1"></div><div class="wf-img" data-label="Interior shot 2"></div><div class="wf-img" data-label="Interior shot 3"></div>
    </div>
    <div data-fx-part="bg"><div class="wf-img" data-label="Wide living room shot · daytime window light · fills the portrait frame"></div></div>
  </a>
  <a href="#" data-fx-part="door">
    <div data-fx-part="inner"><span class="label" data-fx-part="label"><i></i>City Two</span></div>
    <div data-fx-part="peek">
      <div class="wf-img" data-label="Interior shot 4"></div><div class="wf-img" data-label="Interior shot 5"></div>
    </div>
    <div data-fx-part="bg"><div class="wf-img" data-label="White living room · fireplace · fills the portrait frame"></div></div>
  </a>
  <div data-fx-part="brand"><span class="mark"><span data-fx-part="glyph">B</span><span data-fx-part="glyph">R</span><span data-fx-part="glyph">A</span><span data-fx-part="glyph">N</span><span data-fx-part="glyph">D</span><span data-fx-part="glyph">.</span></span></div>
</div>
<main id="demo-page" class="page"><h1>Revealed page</h1></main>
<div data-demo-remove data-fx="split-gate-portal" style="display:none"><a href="#" data-fx-part="door"></a></div>
<template data-demo-late><div data-fx="split-gate-portal" data-fx-split-gate-portal="dur: 0.6" style="position:fixed;inset:auto;right:20px;top:20px;width:220px;height:120px;z-index:1200"><a href="#" data-fx-part="door"><div data-fx-part="inner"><span data-fx-part="label">Late door</span></div></a></div></template>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/CustomEase.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
