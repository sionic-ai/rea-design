<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>clip-circle-pop-hover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { display: flex; flex-wrap: wrap; align-items: center; gap: 32px; padding: 64px 32px; }
  .demo-btn { display: block; width: 260px; height: 64px; color: var(--kf-ink); text-decoration: none; }
  .demo-face { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 8px; border: 3px solid var(--kf-ink); border-radius: var(--kf-radius-sm); background: var(--kf-surface); font: 700 16px/1 var(--kf-font-sans); }
  .demo-face--back { background: var(--kf-ink); color: var(--kf-surface); }
  .demo-oval { display: block; width: 180px; height: 116px; color: var(--kf-ink); }
  .demo-oval .demo-face { border-radius: 50%; flex-direction: column; gap: 4px; }
  .demo-row { display: flex; align-items: center; justify-content: space-between; width: 420px; padding: 14px 0; border-bottom: 1px solid var(--kf-line); cursor: pointer; }
  .demo-ic { position: relative; display: block; width: 28px; height: 28px; }
  .demo-ic .demo-face { border-width: 1.5px; border-radius: 50%; font-size: 18px; }
</style>
</head>
<body>
<p class="demo-hint"><b>clip-circle-pop-hover</b> — Hover over a button, oval or row. The back panel spreads from the center as a circle and the button pops larger.</p>
<div class="demo">
  <a class="demo-btn" href="#" data-fx="clip-circle-pop-hover"><span class="demo-face" data-fx-part="base">Learn more ↗</span><span class="demo-face demo-face--back" data-fx-part="fill" aria-hidden="true">Learn more ↗</span></a>
  <a class="demo-oval" href="#" data-fx="clip-circle-pop-hover"><span class="demo-face" data-fx-part="base"><b>BUY</b>Your description here</span><span class="demo-face demo-face--back" data-fx-part="fill" aria-hidden="true"><b>BUY</b>Your description here</span></a>
  <div class="demo-row" tabindex="0" data-fx="clip-circle-pop-hover" style="--fx-scale: 1.2"><span>Your one-line question here?</span><span class="demo-ic" data-fx-part="pop"><span class="demo-face" data-fx-part="base">+</span><span class="demo-face demo-face--back" data-fx-part="fill">+</span></span></div>
</div>
<script>
// Late arrivals and removals — as a css part, it applies as-is to late elements, and nothing is left behind when removed
(() => {
  const src = document.querySelector('[data-fx~="clip-circle-pop-hover"]');
  if (!src) return;
  const html = src.outerHTML;
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => src.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical one comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="../fx-core.js"></script>
</body>
</html>
