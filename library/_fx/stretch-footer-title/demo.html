<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>stretch-footer-title — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .page { height: 140vh; padding: 40px 20px; font: var(--kf-weight-display) 64px/1 var(--kf-font-display); }
  footer { position: relative; z-index: 1; background: var(--kf-surface); padding: 80px 20px; border-top: 1px solid var(--kf-line); }
  .post { background: var(--kf-accent); color: var(--kf-on-accent); }
  .post [data-fx-part="stage"] { padding: 16px; }
  .post [data-fx-part="title"] { font: var(--kf-weight-display) 9.7vw/0.75 var(--kf-font-display); text-align: center; text-transform: uppercase; margin: 0; }
</style>
</head>
<body>
<p class="demo-hint"><b>stretch-footer-title</b> — Scroll all the way down. The panel under the footer is revealed and the title stretches vertically from a flat .1x.</p>
<main class="page">Your page body here</main>
<footer>Footer — contact, address · links go here</footer>
<div class="post" data-fx="stretch-footer-title">
  <div data-fx-part="spacer"></div>
  <div data-fx-part="stage"><p data-fx-part="title">Your short line here<br>Two-line sentence</p></div>
</div>
<div class="post late-host"></div>
<script>
(() => {
  const host = document.querySelector(".late-host");
  setTimeout(() => { host.setAttribute("data-fx", "stretch-footer-title"); }, 1000);
  const gone = document.createElement("div");
  gone.setAttribute("data-fx", "stretch-footer-title");
  gone.innerHTML = '<div data-fx-part="spacer"></div><div data-fx-part="stage"><p data-fx-part="title">Being removed soon</p></div>';
  gone.style.display = "none";
  document.body.append(gone);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1 second, attaching to a panel with no children stays quiet, and after 2.5 seconds one panel drops out (detach).");
})();
</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
