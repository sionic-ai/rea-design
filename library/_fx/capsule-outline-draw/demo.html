<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>capsule-outline-draw — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: sticky; top: 0; z-index: 10; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-title { font: 400 16vw/0.8 var(--kf-font-display); letter-spacing: -0.03em; word-spacing: 0.3em; margin: 12vh 6vw; padding: 0.1em 0.3em 0.2em; }
  .demo-gap { height: 60vh; }
</style>
</head>
<body>
<p class="demo-hint"><b>capsule-outline-draw</b> — Scroll down and when the heading appears, the pill fills up, thins to an outline, and the words appear.</p>
<h2 class="demo-title" data-fx="capsule-outline-draw"><span data-fx-part="line"><span data-fx-part="word">head</span> <span data-fx-part="word">–</span></span><br><span data-fx-part="line"><span data-fx-part="word">line</span></span></h2>
<div class="demo-gap"></div>
<h2 class="demo-title" data-fx="capsule-outline-draw" data-fx-capsule-outline-draw="line: 4"><span data-fx-part="line"><span data-fx-part="word">pro</span> <span data-fx-part="word">–</span></span><br><span data-fx-part="line"><span data-fx-part="word">gram</span></span></h2>
<div class="demo-gap"></div>
<script>
(() => {
  const src = document.querySelector('[data-fx~="capsule-outline-draw"]');
  if (!src) return;
  const html = src.outerHTML;
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => src.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical one comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
