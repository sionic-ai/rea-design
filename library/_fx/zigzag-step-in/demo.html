<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>zigzag-step-in — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); overflow-x: clip; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo-spacer { height: 90vh; display: grid; place-items: center; color: var(--kf-dim); }
  .demo { display: grid; grid-template-columns: repeat(3, 1fr); gap: 32px; padding: 48px 40px 30vh; }
  .demo-card { aspect-ratio: 3 / 4; padding: 20px; border-radius: var(--kf-radius-sm); background: var(--kf-surface); border: 1px solid var(--kf-line); }
</style>
</head>
<body>
<p class="demo-hint"><b>zigzag-step-in</b> — Scroll down. The cards pop out and return in a zigzag staircase in place as they appear (as in the original). ”Card 3” gets z3·x so it flies in from the side. The kink positions differ each time you open it.</p>
<div class="demo-spacer">↓ Scroll</div>
<section class="demo" id="demo">
  <article class="demo-card" data-fx="zigzag-step-in" data-fx-zigzag-step-in="dir: left">Card 1</article>
  <article class="demo-card" data-fx="zigzag-step-in" data-fx-zigzag-step-in="dir: center">Card 2</article>
  <article class="demo-card" data-fx="zigzag-step-in" data-fx-zigzag-step-in="z3: 40; x: 0">Card 3</article>
</section>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
  // Check that it attaches to late-added elements, and that triggers of removed elements are detached
  setTimeout(() => { const a = document.createElement("article"); a.className = "demo-card"; a.dataset.fx = "zigzag-step-in"; a.setAttribute("data-fx-zigzag-step-in", "dir: left"); a.textContent = "Late-arriving card"; document.getElementById("demo").append(a); }, 1000);
  setTimeout(() => document.querySelector("#demo > article:nth-child(2)")?.remove(), 1500);
</script>
</body>
</html>
