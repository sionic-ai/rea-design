<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>held-zoom-parallax — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); overflow-x: hidden; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-spacer { height: 90vh; display: grid; place-items: center; color: var(--kf-dim); }
  .row { display: flex; gap: 40px; justify-content: center; align-items: center; padding: 10vh 20px; }
  .frame { width: min(420px, 80vw); aspect-ratio: 3 / 4; border: 1px solid var(--kf-line); }
  .frame .wf-img { height: 100%; border: 0; }
  .band { height: 60vh; }
  .circle { display: block; width: 260px; aspect-ratio: 1; border-radius: 50%; background: var(--kf-accent); }
</style>
</head>
<body>
<p class="demo-hint"><b>held-zoom-parallax</b> — Scroll and the photo inside the cell slowly rises while enlarged, and the circle on the right floats up at its own size.</p>
<div class="demo-spacer">Scroll down</div>
<section class="row">
  <div class="frame" data-fx="held-zoom-parallax"><div class="wf-img" data-fx-part="media" data-label="Vertical 3:4 photo"></div></div>
  <span class="circle" data-fx="held-zoom-parallax" data-fx-held-zoom-parallax="to: -20"></span>
</section>
<section class="frame band" style="width: 100%" data-fx="held-zoom-parallax"><div class="wf-img" data-fx-part="media" data-label="Full-width photo strip"></div></section>
<div class="demo-spacer"></div>
<script>
(() => {
  const src = document.querySelector('[data-fx~="held-zoom-parallax"]');
  const html = src.outerHTML;
  const make = () => { const t = document.createElement("template"); t.innerHTML = html; return t.content.firstElementChild; };
  const gone = make(); src.after(gone);
  setTimeout(() => src.after(make()), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s one more of the same comes in, and after 2.5s one drops out.");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
