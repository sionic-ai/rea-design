<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>paper-curl — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { display: flex; flex-direction: column; align-items: center; padding: 0 0 60vh; background: var(--kf-contrast-bg); color: var(--kf-contrast-ink); }
  .curl { width: min(100%, calc(100svh * 5 / 8)); aspect-ratio: 5 / 8; }
  .demo p { max-width: 640px; margin-top: -6em; text-align: center; font: 500 32px/1.2 var(--kf-font-sans); }
  .demo-spacer { height: 60vh; display: grid; place-items: center; color: var(--kf-dim); }
</style>
</head>
<body>
<p class="demo-hint"><b>paper-curl</b> — Scroll down. The photo curls like paper from the bottom-right corner and rolls toward the top left. <span style="color:var(--kf-dim)">(After 1s one more panel comes in, and one leaves 2.5s later)</span></p>
<div class="demo-spacer">Scroll down</div>
<section class="demo">
  <div class="curl" data-fx="paper-curl" data-fx-paper-curl="trigger: .demo"><div class="wf-img" data-fx-part="photo" data-label="Person full-body photo · daylight · portrait 5:8"></div></div>
  <p>Your intro sentence here in two lines. The photo rolls up as the text is revealed.</p>
</section>
<section class="demo" data-demo-remove><div class="curl" data-fx="paper-curl" data-fx-paper-curl="trigger: .demo"><div class="wf-img" data-fx-part="photo" data-label="Soon-Removed Photo"></div></div></section>
<template data-demo-late><section class="demo"><div class="curl" data-fx="paper-curl" data-fx-paper-curl="trigger: .demo; end: +=120%" style="--fx-paper: var(--kf-accent-soft)"><div class="wf-img" data-fx-part="photo" data-label="Late photo · paper back accent color"></div></div></section></template>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="three-global.js"></script>
<script src="../../_vendor/three@0.185.0/build/three.cjs"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); window.ScrollTrigger?.refresh(); }, 2500);
</script>
</body>
</html>
