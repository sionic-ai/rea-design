<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>word-tilt-rise — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.6 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .col { width: min(760px, 90vw); margin: 0 auto; padding: 40px 0 60vh; text-align: center; }
  .col h1 { font-size: 64px; line-height: 1.1; margin: 40px 0; word-break: keep-all; }
  .col h2 { font-size: 40px; margin: 70vh 0 20px; word-break: keep-all; }
  .hl { color: var(--kf-accent-text); }
</style>
</head>
<body>
<p class="demo-hint"><b>word-tilt-rise</b> — The first heading appears on load. Headings below stand up from lying backward once they enter the screen. <span style="color:var(--kf-dim)">(One more title comes in after 1s, and one drops out after 2.5s)</span></p>
<div class="col">
  <h1 data-fx="word-tilt-rise" data-fx-word-tilt-rise="on: load">A big headline across <span class="hl">two lines</span></h1>
  <p data-fx="word-tilt-rise" data-demo-remove>Dropping text</p>
  <h2 data-fx="word-tilt-rise">Your section title goes here</h2>
  <div data-late-slot></div>
</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../../../_shared/vendor/gsap/CustomEase.min.js"></script>
<script>gsap.registerPlugin(ScrollTrigger, CustomEase);</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelector("[data-late-slot]").outerHTML = '<h2 data-fx="word-tilt-rise" data-fx-word-tilt-rise="each: .1">Late title · .1s between words</h2>', 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
