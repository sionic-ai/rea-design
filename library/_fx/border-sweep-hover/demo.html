<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>border-sweep-hover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .row { display: flex; flex-wrap: wrap; gap: 24px; align-items: center; padding: 60px 40px; }
  .pill { display: inline-flex; align-items: center; gap: 20px; padding: 10px 25px; border-radius: var(--kf-radius-pill); color: var(--kf-ink); }
  .pill svg { width: 11px; height: 11px; fill: none; stroke: currentColor; stroke-width: 1.2; }
  .card { display: block; width: 280px; padding: 15px; border-radius: var(--kf-radius-md); background: var(--kf-surface); color: var(--kf-ink); }
</style>
</head>
<body>
<p class="demo-hint"><b>border-sweep-hover</b> — Hover over a button or card (moving focus with Tab fills it too). <span style="color:var(--kf-dim)">(After 1s one more button comes in, and after 2.5s the first card leaves)</span></p>
<div class="row" id="row">
  <a class="pill" data-fx="border-sweep-hover" href="#">View more <svg data-fx-part="icon" viewBox="0 0 12 12"><path d="M6 0v12M0 6h12"/></svg></a>
  <a class="card" data-fx="border-sweep-hover" href="#" id="gone">Job listing — square card</a>
  <a class="card" data-fx="border-sweep-hover" href="#" style="--fx-dur: 1.2s; --fx-from: 90deg">From 3 o’clock 1.2s</a>
</div>
<script src="../fx-core.js"></script>
<script>
setTimeout(() => document.getElementById("row").insertAdjacentHTML("beforeend", '<a class="pill" data-fx="border-sweep-hover" href="#">Late-arriving button</a>'), 1000);
setTimeout(() => document.getElementById("gone").remove(), 2500);
</script>
</body>
</html>
