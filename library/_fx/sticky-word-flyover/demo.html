<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sticky-word-flyover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-pad { height: 60vh; display: grid; place-items: center; color: var(--kf-dim); }
  .demo-fly { background: linear-gradient(180deg, var(--kf-dim) 0, var(--kf-bg) 65%); padding-bottom: 48px; }
  .demo-fly [data-fx-part="word"] { display: flex; justify-content: center; padding: 32px 0; }
  .demo-fly h2 { margin: 0; font-size: clamp(80px, 30vw, 900px); line-height: .9; letter-spacing: -.04em; color: var(--kf-bg); white-space: nowrap; }
  .demo-fly svg { display: block; width: 100%; height: auto; }
</style>
</head>
<body>
<p class="demo-hint"><b>sticky-word-flyover</b> — Scroll down. The big text stays and the image below passes over it.</p>
<div class="demo-pad">Scroll down from here</div>
<section class="demo-fly" data-fx="sticky-word-flyover" style="--fx-top: 48px">
  <div data-fx-part="word"><h2>AB-12</h2></div>
  <div data-fx-part="over"><svg viewBox="0 0 1440 900" fill="none"><path d="M720 20c38 0 58 70 62 170l10 560c2 70-20 110-72 140-52-30-74-70-72-140l10-560c4-100 24-170 62-170z" fill="var(--kf-surface)" stroke="var(--kf-line)" stroke-width="3"/><path d="M790 300 1440 470v36L790 420zM650 300 0 470v36l650-86z" fill="var(--kf-surface)" stroke="var(--kf-line)" stroke-width="3"/></svg></div>
</section>
<div class="demo-pad">Footer</div>
<script>
// Late arrivals and removals — a css-only part, so the plate added after 1 second has the same look, and one is removed after 2.5 seconds
(() => {
  const src = document.querySelector(".demo-fly");
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = src.outerHTML; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => src.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s one more panel comes in, and after 2.5s one leaves.");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
</body>
</html>
