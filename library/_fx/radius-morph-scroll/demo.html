<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>radius-morph-scroll — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 2; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .spacer { height: 90vh; display: grid; place-items: center; color: var(--kf-dim); }
  .row { display: flex; gap: 12px; padding: 0 20px; }
  .row > div { height: 160px; flex: 1; background: var(--kf-contrast-bg); color: var(--kf-contrast-ink); display: grid; place-items: center; }
</style>
</head>
<body>
<p class="demo-hint"><b>radius-morph-scroll</b> — Scroll down. As the two panels come to the center of the screen, the left becomes angular and the right rounder. After 1 second one more panel row attaches, and after 2 seconds the left panel of the first row drops out.</p>
<div class="spacer">↓</div>
<div class="row" id="r1"><div data-fx="radius-morph-scroll">Straight</div><div data-fx="radius-morph-scroll" data-fx-radius-morph-scroll="to: round">Rounded</div></div>
<div class="spacer">↓</div>
<div id="more"></div>
<div class="spacer"></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
  setTimeout(() => { document.getElementById("more").innerHTML = '<div class="row"><div data-fx="radius-morph-scroll" data-fx-radius-morph-scroll="radius: 40">Late panel</div><div data-fx="radius-morph-scroll" data-fx-radius-morph-scroll="to: round; radius: 40">Late panel</div></div>'; }, 1000);
  setTimeout(() => document.querySelector("#r1 > :first-child").remove(), 2000);
</script>
</body>
</html>
