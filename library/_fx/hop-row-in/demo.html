<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hop-row-in — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 2; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .gap { height: 80vh; }
  .sec { padding: 60px 0; text-align: center; border-top: 1px solid var(--kf-line); }
  .sec p { font-size: 24px; font-weight: 700; }
  .row { display: flex; justify-content: center; align-items: flex-end; gap: 10px; margin-top: 24px; }
  .row span { width: 56px; height: 64px; border-radius: 40% 40% 12px 12px; background: var(--kf-accent); }
  .row span:nth-child(2n) { height: 52px; background: var(--kf-ink); }
</style>
</head>
<body>
<p class="demo-hint"><b>hop-row-in</b> — Scroll down. When the rows appear they rise from the center, then hop one by one. <span style="color:var(--kf-dim)">(After 1s one more line comes in, and one leaves 2.5s later)</span></p>
<div class="gap"></div>
<section class="sec" data-fx="hop-row-in"><p data-fx-part="lead">Please follow us</p><div class="row"><span data-fx-part="item"></span><span data-fx-part="item"></span><span data-fx-part="item"></span><span data-fx-part="item"></span><span data-fx-part="item"></span><span data-fx-part="item"></span></div></section>
<section class="sec" data-fx="hop-row-in" data-fx-hop-row-in="hop: 60; from: start" data-demo-remove><div class="row"><span data-fx-part="item"></span><span data-fx-part="item"></span></div></section>
<div id="late"></div>
<div class="gap"></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.getElementById("late").insertAdjacentHTML("beforeend", '<section class="sec" data-fx="hop-row-in"><div class="row"><span data-fx-part="item"></span><span data-fx-part="item"></span><span data-fx-part="item"></span></div></section>'), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
