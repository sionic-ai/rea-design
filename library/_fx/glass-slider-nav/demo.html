<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>glass-slider-nav — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css"><link rel="stylesheet" href="../../../_shared/kf-defaults.css"><link rel="stylesheet" href="fx.css">
<style>body{margin:0;background:var(--kf-bg);color:var(--kf-ink);font:400 14px/1.5 var(--kf-font-sans)}.demo-hint{padding:12px 20px;background:var(--kf-surface);border-bottom:1px solid var(--kf-line);font:500 13px/1.4 var(--kf-font-mono)}.row{padding:60px 40px;display:grid;gap:30px;justify-items:start}</style></head>
<body>
<p class="demo-hint"><b>glass-slider-nav</b> — Hover over the menu links. The cell slides, and when you leave it returns to the current page. (after 1s one more menu comes in, after 2.5s one drops out)</p>
<div class="row" data-demo-host>
  <nav data-fx="glass-slider-nav"><a href="#" data-fx-part="link" aria-current="page">Home</a><a href="#" data-fx-part="link">Menu 1</a><a href="#" data-fx-part="link">Menu 2 Long</a><a href="#" data-fx-part="link">Menu 3</a></nav>
  <nav data-fx="glass-slider-nav" data-demo-remove><a href="#" data-fx-part="link">Omitted menu</a></nav>
  <nav data-fx="glass-slider-nav"></nav>
</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script><script src="../fx-core.js"></script><script src="fx.js"></script>
<script>
setTimeout(() => { const n = document.createElement("nav"); n.dataset.fx = "glass-slider-nav"; n.setAttribute("data-fx-glass-slider-nav", "dur: .3"); n.innerHTML = '<a href="#" data-fx-part="link">Late</a><a href="#" data-fx-part="link" aria-current="page">Came in</a><a href="#" data-fx-part="link">Menu</a>'; document.querySelector("[data-demo-host]").append(n); }, 1000);
setTimeout(() => document.querySelector("[data-demo-remove]")?.remove(), 2500);
</script></body></html>
