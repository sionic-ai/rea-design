<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>glyph-dither-scene — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { margin: 0; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .stage { height: 62vh; border-bottom: 1px solid var(--kf-line); }
  .stage--small { height: 36vh; }
</style>
</head>
<body>
<p class="demo-hint"><b>glyph-dither-scene</b> — Move the mouse quickly over the panel to leave trails, and press and hold the panel to speed up time (back to 1x on release).</p>
<section class="stage" data-fx="glyph-dither-scene" data-fx-glyph-dither-scene="shape: hand; dust: 300"><span data-fx-part="hint">Let go and it slows down again · </span></section>
<script>
// Late arrivals and removals — after 1s one more knot-shaped panel enters (late arrival), and after 2.5s one pre-placed panel drops out (removal)
(() => {
  const src = document.querySelector('[data-fx~="glyph-dither-scene"]');
  const make = (shape) => { const s = document.createElement("section"); s.className = "stage stage--small"; s.dataset.fx = "glyph-dither-scene"; s.dataset.fxGlyphDitherScene = `shape: ${shape}; dust: 80`; return s; };
  const gone = make("orb");
  src.after(gone);
  setTimeout(() => document.body.append(make("knot")), 1000);
  setTimeout(() => gone.remove(), 2500);
  // Kick imitation — once every 0.5s
  setInterval(() => document.querySelectorAll('[data-fx~="glyph-dither-scene"]').forEach((el) => el.dispatchEvent(new CustomEvent("fx:kick"))), 500);
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="three-global.js"></script>
<script src="../../_vendor/three@0.180.0/build/three.cjs"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
