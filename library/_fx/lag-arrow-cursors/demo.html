<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lag-arrow-cursors — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { margin: 0; min-height: 100vh; background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { margin: 0; padding: 12px 20px; border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); background: var(--kf-surface); }
  .row { display: flex; gap: 16px; padding: 40px 20px; }
  .row a { padding: 12px 24px; border-radius: 999px; background: var(--kf-surface); border: 1px solid var(--kf-line); }
  ul { margin: 0 20px; padding: 0; list-style: none; border-top: 1px solid var(--kf-line); }
  li { padding: 16px 0; border-bottom: 1px dashed var(--kf-line); }
</style>
</head>
<body data-fx="lag-arrow-cursors">
<p class="demo-hint"><b>lag-arrow-cursors</b> — Move the mouse. Six arrows follow in a line, and over a button they gather in the center and tremble. Over the list rows below, the tail hides.</p>
<div class="row"><a href="#">One button</a><a href="#">Button two</a></div>
<ul><li data-fx-part="hide">One list row — where the tail hides</li><li data-fx-part="hide">List line two</li></ul>
<script>
// Late arrivals·removals — add one button after 1 second, remove one after 2.5 seconds
(() => {
  const row = document.querySelector(".row");
  if (row) setTimeout(() => { const a = document.createElement("a"); a.href = "#"; a.textContent = "Late-arrived Button"; row.append(a); setTimeout(() => row.querySelector("a")?.remove(), 1500); }, 1000);
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
