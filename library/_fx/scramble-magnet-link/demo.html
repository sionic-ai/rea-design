<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>scramble-magnet-link — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { min-height: 80vh; display: grid; place-content: center; text-align: center; }
  .demo ul { display: flex; flex-direction: column; align-items: center; gap: .2em; }
  .demo a { font: 400 clamp(2rem, 4vw, 3rem)/1.4 var(--kf-font-display); letter-spacing: .04em; text-transform: uppercase; }
</style>
</head>
<body>
<p class="demo-hint"><b>scramble-magnet-link</b> — Hover and move over a menu word. The letters scramble, then lock into another word, and the link is pulled toward the cursor.</p>
<nav class="demo">
  <ul>
    <li><a href="#" data-fx="scramble-magnet-link" data-fx-scramble-magnet-link="chars: ABCDEFGHIJKLMNOPQRSTUVWXYZ">Studio</a></li>
    <li><a href="#" data-fx="scramble-magnet-link" data-fx-scramble-magnet-link="to: Gallery; chars: ABCDEFGHIJKLMNOPQRSTUVWXYZ">Portfolio</a></li>
    <li><a href="#" data-fx="scramble-magnet-link" data-fx-scramble-magnet-link="to: Contact; magnet: .5; chars: ABCDEFGHIJKLMNOPQRSTUVWXYZ">Get in touch</a></li>
  </ul>
</nav>
<script>
(() => {
  const list = document.querySelector(".demo ul");
  const html = list.querySelector("li").outerHTML;
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const li = t.content.firstElementChild; const a = li.querySelector("a"); a.dataset.demo = tag; a.textContent = tag === "late" ? "Late item" : "Gone item"; return li; };
  const gone = make("gone");
  list.append(gone);
  setTimeout(() => list.append(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s, one more line comes in (the late one), and after 2.5s one drops out (the removal).");
})();
</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
