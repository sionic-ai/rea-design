<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pin-swing-cards — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .sp { height: 70vh; display: grid; place-items: center; color: var(--kf-dim); }
  h2 { font: 400 clamp(48px, 6vw, 80px)/1.1 var(--kf-font-display); }
  figure { margin: 0; }
  figure .wf-img { height: 100%; }
</style>
</head>
<body>
<p class="demo-hint"><b>pin-swing-cards</b> — Scroll down and the section pins while tilted photo cards flow past from the right.</p>
<div class="sp">Scroll down</div>
<section data-fx="pin-swing-cards">
  <div data-fx-part="stage">
    <h2 data-fx-part="start">From here</h2>
    <h2 data-fx-part="end">Up to there</h2>
    <div data-fx-part="track" id="track">
      <figure data-fx-part="card"><div class="wf-img" data-label="Photo 1"></div></figure>
      <figure data-fx-part="card"><div class="wf-img" data-label="Photo 2"></div></figure>
      <figure data-fx-part="card" data-demo-remove><div class="wf-img" data-label="Photo to Be Removed"></div></figure>
      <figure data-fx-part="card"><div class="wf-img" data-label="Photo 4"></div></figure>
      <figure data-fx-part="card"><div class="wf-img" data-label="Photo 5"></div></figure>
    </div>
  </div>
</section>
<div class="sp" id="late"></div>
<template data-demo-late><section data-fx="pin-swing-cards" data-fx-pin-swing-cards="tilt: 4; scrub: 1"><div data-fx-part="stage"><div data-fx-part="track"><figure data-fx-part="card"><div class="wf-img" data-label="Late-arriving A"></div></figure><figure data-fx-part="card"><div class="wf-img" data-label="Late-arriving B"></div></figure></div></div></section></template>
<div class="sp"></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => document.getElementById("late").append(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); window.ScrollTrigger?.refresh(); }, 2500);
</script>
</body>
</html>
