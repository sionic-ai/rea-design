<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>zoom-drift-parallax — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 2; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .gap { height: 80vh; }
  .band { border-block: 1px solid var(--kf-ink); margin: 40px 0; }
  .band .wf-img { height: 420px; border: 0; }
</style>
</head>
<body>
<p class="demo-hint"><b>zoom-drift-parallax</b> — Scroll down. The image inside the band stays slightly enlarged and drifts up and down with the scroll. <span style="color:var(--kf-dim)">(After 1s one more band comes in, and one leaves 2.5s later)</span></p>
<div class="gap"></div>
<figure class="band"><div class="wf-img" data-fx="zoom-drift-parallax" data-label="Park lawn view · Clear daytime · Landscape strip"></div></figure>
<figure class="band" data-demo-remove><div class="wf-img" data-fx="zoom-drift-parallax" data-fx-zoom-drift-parallax="strength: 120" data-label="Intensity 120px"></div></figure>
<div class="gap" id="late"></div>
<template data-demo-late><figure class="band"><div class="wf-img" data-fx="zoom-drift-parallax" data-label="Late-arriving band"></div></figure></template>
<div class="gap"></div>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
