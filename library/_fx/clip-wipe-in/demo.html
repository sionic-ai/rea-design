<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>clip-wipe-in — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { padding: 48px 20px; }
  .demo-spacer { height: 90vh; display: grid; place-items: center; color: var(--kf-dim); }
 .wide { aspect-ratio: 16 / 7; border-radius: 16px; background: var(--kf-ink); }
</style>
</head>
<body>
<p class="demo-hint"><b>clip-wipe-in</b> — Scroll down and the wide photo opens from the left. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<div class="demo-spacer">Scroll down</div><section class="demo"><figure data-demo-remove class="wide" data-fx="clip-wipe-in"></figure><figure class="wide" data-fx="clip-wipe-in"></figure><hr data-fx="clip-wipe-in" data-fx-clip-wipe-in="radius: 0; dur: 1; ease: power1.out; start: top 80%; fade: 1" style="margin: 40px 0; border: 0; border-top: 3px dotted var(--kf-accent)"><figure class="wide" data-fx="clip-wipe-in" data-fx-clip-wipe-in="radius: 0; dur: 1.2; from: top; zoom: 1.1; start: top 70%"><span data-fx-part="zoom" style="display:block;height:100%;background:var(--kf-accent)"></span></figure><figure class="wide" data-fx="clip-wipe-in" data-fx-clip-wipe-in="radius: 0; dur: 1.3; ease: 0.76,0,0.24,1; start: top 95%; fade: 1; fade-dur: 1.5; fade-ease: 0.25,0.1,0.25,1; zoom: 1.5; zoom-dur: 1.5; zoom-ease: 0.25,0.1,0.25,1; zoom-delay: .08"><span data-fx-part="zoom" style="display:block;height:100%;background:var(--kf-accent-soft)"></span></figure><div style="display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-top:40px"><figure class="tile" data-fx="clip-wipe-in" data-fx-clip-wipe-in="radius: 0; from: top; dur: .55; ease: 0.77,0,0.18,1; zoom: 1.15; zoom-y: -6; zoom-dur: .7; zoom-ease: 0.22,1,0.36,1; start: top 92%; batch: .04" style="aspect-ratio:3/4;overflow:hidden"><span data-fx-part="zoom" style="display:block;height:100%;background:var(--kf-accent-soft)"></span></figure><figure class="tile" data-fx="clip-wipe-in" data-fx-clip-wipe-in="radius: 0; from: top; dur: .55; ease: 0.77,0,0.18,1; zoom: 1.15; zoom-y: -6; zoom-dur: .7; start: top 92%; batch: .04" style="aspect-ratio:3/2;overflow:hidden"><span data-fx-part="zoom" style="display:block;height:100%;background:var(--kf-accent)"></span></figure><figure data-fx="clip-wipe-in" data-fx-clip-wipe-in="radius: 0; from: top; dur: .55; zoom: 1.15; zoom-y: -6; start: top 92%; batch: .04" style="aspect-ratio:1;overflow:hidden"><span data-fx-part="zoom" style="display:block;height:100%;background:var(--kf-ink)"></span></figure><figure data-fx="clip-wipe-in" data-fx-clip-wipe-in="radius: 0; from: top; dur: .55; start: top 92%; batch: .04" style="aspect-ratio:2/3;background:var(--kf-accent-soft)"></figure></div><template data-demo-late><figure class="wide" data-fx="clip-wipe-in"></figure></template></section><div class="demo-spacer"></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); window.ScrollTrigger?.refresh(); }, 2500);
</script>
</body>
</html>
