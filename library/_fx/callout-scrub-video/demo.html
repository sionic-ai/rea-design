<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>callout-scrub-video — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .stick { position: sticky; top: 0; height: 100svh; display: flex; flex-direction: column; align-items: center; padding-top: 80px; overflow: hidden; }
  .stick h1 { font: 700 40px/1.1 var(--kf-font-display); margin-bottom: 24px; }
  [data-fx-part="stage"] { width: min(90vw, 900px); aspect-ratio: 16 / 9; background: var(--kf-raised); border-radius: 12px; }
  [data-fx-part="status"] { position: absolute; top: 80px; display: flex; align-items: center; height: 44px; padding: 0 16px; border-radius: 99px; background: var(--kf-surface); border: 1px solid var(--kf-line); }
  [data-fx-part="status"] svg { width: 16px; height: 16px; margin-right: 8px; rotate: -90deg; fill: none; stroke: var(--kf-ink); stroke-width: 1.5; }
  [data-fx-part="checks"] { position: absolute; bottom: 24px; }
  .after { height: 60vh; padding: 40px 20px; }
</style>
</head>
<body>
<p class="demo-hint"><b>callout-scrub-video</b> — Scroll down slowly. The title disappears and five name tags connect in turn with lines and get checked.</p>
<div data-fx="callout-scrub-video">
  <div class="stick">
    <h1 data-fx-part="title">Your big title here</h1>
    <div data-fx-part="stage">
      <div data-fx-part="callout" data-start=".36" data-side="right" data-x="58" data-y="51.5" data-ly="52" data-ox="70">Point one</div>
      <div data-fx-part="callout" data-start=".44" data-side="left" data-x="34.3" data-y="26" data-ly="18" data-ox="34">Point two</div>
      <div data-fx-part="callout" data-start=".52" data-side="right" data-x="55.7" data-y="39.5" data-ly="28" data-ox="66.5">Point three</div>
    </div>
    <div data-fx-part="status"><div data-fx-part="status-busy"><svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="8" data-fx-part="ring" pathLength="1"/></svg>In the making</div><div data-fx-part="status-done">All done</div></div>
    <div data-fx-part="checks"></div>
  </div>
</div>
<div class="after"><p>Your next section here.</p></div>
<script>
// Late arrivals and removals — checks that fx-core attaches to an element added after 1s and detaches from an element removed after 2.5s
(() => {
  const host = document.querySelector('[data-fx~="callout-scrub-video"]');
  if (!host) return;
  const html = host.outerHTML;
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  host.after(gone);
  setTimeout(() => host.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical one comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
