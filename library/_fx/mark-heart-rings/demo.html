<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mark-heart-rings — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; padding: 20px; }
  .tile { height: 320px; border: 1px solid var(--kf-line); }
  .dark { background: var(--kf-contrast-bg); color: var(--kf-contrast-ink); }
</style>
</head>
<body>
<p class="demo-hint"><b>mark-heart-rings</b> — While in view, a pulse spreads outward from the symbol along the rings. <span style="color:var(--kf-dim)">(After 1s one more panel comes in, and one leaves 2.5s later)</span></p>
<section class="grid">
  <div class="tile" data-fx="mark-heart-rings"></div>
  <div class="tile" data-fx="mark-heart-rings"><svg data-fx-part="mark" viewBox="0 0 100 100"><path d="M50 5 L95 50 L50 95 L5 50 Z"/></svg></div>
  <div class="tile dark" data-demo-remove data-fx="mark-heart-rings" data-fx-mark-heart-rings="rings: 10; gap: 30"></div>
  <template data-demo-late><div class="tile dark" data-fx="mark-heart-rings" data-fx-mark-heart-rings="lag: .15"></div></template>
  <div data-fx="mark-heart-rings" style="height:0"></div>
</section>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
