<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sticky-tilt-bounce — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { padding: 48px 20px; }
  .demo-spacer { height: 70vh; display: grid; place-items: center; color: var(--kf-dim); }
  .demo-card { height: 420px; padding: 32px; border: 1px solid var(--kf-line); border-radius: var(--kf-radius-sm); background: var(--kf-surface); font: 700 32px/1.1 var(--kf-font-display); }
  .demo-card:nth-child(2n) { background: var(--kf-accent); color: var(--kf-on-accent); }
  .demo-chip { padding: 16px 24px; margin-right: 12px; border: 1px solid var(--kf-line); border-radius: var(--kf-radius-md); background: var(--kf-surface); font: 700 28px/1 var(--kf-font-display); white-space: nowrap; }
  .demo-scene svg { width: 100%; height: 100%; }
  .demo-actor { position: absolute; width: 140px; height: 140px; border-radius: 50%; background: var(--kf-accent); display: grid; place-items: center; font-weight: 700; }
  .demo-stack { max-width: 720px; margin: 0 auto; }
</style>
</head>
<body>
<p class="demo-hint"><b>sticky-tilt-bounce</b> — Scroll down. The card tilts and sticks, then bounces like jelly the moment it sticks.</p>
<section class="demo"><div class="demo-spacer">Scroll down</div>
<div class="demo-stack" data-fx="sticky-tilt-bounce" data-fx-sticky-tilt-bounce="rotate: 0,4,-4" style="--fx-top: 100px; --fx-gap: 80px">
  <div data-fx-part="item"><article class="demo-card" data-fx-part="card">One card</article></div>
  <div data-fx-part="item"><article class="demo-card" data-fx-part="card">Card two</article></div>
  <div data-fx-part="item"><article class="demo-card" data-fx-part="card">Card three</article></div>
</div>
<div class="demo-spacer">Footer</div></section>
<script>
// Late arrivals and removals — checks that fx-core attaches to an element added after 1s and detaches from an element removed after 2.5s
(() => {
  const src = document.querySelector('[data-fx~="sticky-tilt-bounce"]');
  if (!src) return;
  const html = src.outerHTML.replace(/\sid="[^"]*"/g, "");
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => (src.closest(".pin-spacer") || src).after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical one comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script>gsap.registerPlugin(ScrollTrigger);</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
