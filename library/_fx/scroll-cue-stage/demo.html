<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>scroll-cue-stage — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { margin: 0; padding: 12px 20px; border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .act { position: fixed; inset: 0; margin: auto; z-index: 2; }
  .act--stage { width: 260px; height: 180px; border-radius: 50%; background: var(--kf-accent-soft); }
  .act--chip { width: 80px; height: 80px; border-radius: var(--kf-radius-md); background: var(--kf-accent); top: -40px; --fx-from-y: 20px; }
  .act--fly { width: 200px; height: 120px; bottom: 260px; border: 2px solid var(--kf-ink); border-radius: var(--kf-radius-lg); background: var(--kf-surface); }
  .block { position: relative; height: 110vh; padding: 40px; color: var(--kf-dim); }
  .text { position: relative; z-index: 3; max-width: 520px; padding: 40px; background: var(--kf-surface); }
</style>
</head>
<body>
<p class="demo-hint"><b>scroll-cue-stage</b> — Scroll down. The center stage lights up, and between steps a panel flies in from the right and exits to the left.</p>
<section data-fx="scroll-cue-stage" id="stage" style="position:relative">
  <i class="act act--stage" data-fx-part="actor" data-key="stage"></i>
  <i class="act act--chip" data-fx-part="actor" data-key="chip"></i>
  <i class="act act--fly" data-fx-part="actor" data-key="fly" data-enter="right"></i>
  <div class="block"><i data-fx-part="cue" style="top:0" data-cue="stage= chip="></i><i data-fx-part="cue" style="top:50%" data-cue="stage=on chip=on"></i>Section where the stage lights up</div>
  <div class="block"><i data-fx-part="cue" style="top:0" data-cue="chip= fly="></i><i data-fx-part="cue" style="top:50%" data-cue="fly=center"></i>Section where panels fly in</div>
  <div class="block"><i data-fx-part="cue" style="top:0" data-cue="stage=off fly=left"></i><p class="text">When the article rises, the stage blurs and the panel slides out to the left.</p></div>
  <div class="block"><i data-fx-part="cue" style="top:0" data-cue="stage= fly="></i>Footer — all cleared</div>
</section>
<script>
// Late arrivals and removals — one more actor enters after 1 second and leaves after 2.5 seconds
(() => {
  const stage = document.getElementById("stage");
  const late = document.createElement("i");
  late.className = "act act--chip";
  late.style.left = "300px";
  late.dataset.fxPart = "actor";
  late.dataset.key = "chip";
  setTimeout(() => stage.prepend(late), 1000);
  setTimeout(() => late.remove(), 2500);
})();
</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
