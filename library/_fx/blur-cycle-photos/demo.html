<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>blur-cycle-photos — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .stage { position: relative; height: 480px; margin: 30px; border: 1px solid var(--kf-line); overflow: hidden; }
  .stage [data-fx-part="photo"] { position: absolute; padding: 10px; }
  .stage .wf-img { aspect-ratio: 3 / 2; border: 0; border-radius: var(--kf-radius-lg); box-shadow: var(--kf-shadow-soft); }
</style>
</head>
<body>
<p class="demo-hint"><b>blur-cycle-photos</b> — Just watch. Each photo goes from blurry to clear and back to blurry at its own tempo, then switches to another photo (the demo is short, 2 to 5 seconds). <span style="color:var(--kf-dim)">(After 1s one more panel comes in, and one leaves 2.5s later)</span></p>
<section class="stage" data-fx="blur-cycle-photos" data-fx-blur-cycle-photos="first: 2-5; next: 3-6; delay: 0-1">
  <span data-fx-part="photo" style="left:4%;top:6%;width:240px"><span class="wf-img" data-fx-part="shot" data-label="Photo 1-A"></span><span class="wf-img" data-fx-part="shot" data-label="Photo 1-B"></span></span>
  <span data-fx-part="photo" style="left:40%;top:30%;width:180px"><span class="wf-img" data-fx-part="shot" data-label="Photo 2-A"></span><span class="wf-img" data-fx-part="shot" data-label="Photo 2-B"></span></span>
  <span data-fx-part="photo" style="right:6%;top:10%;width:280px"><span class="wf-img" data-fx-part="shot" data-label="Photo 3"></span></span>
  <span data-fx-part="photo" style="left:16%;bottom:6%;width:200px"><span class="wf-img" data-fx-part="shot" data-label="Photo 4-A"></span><span class="wf-img" data-fx-part="shot" data-label="Photo 4-B"></span></span>
</section>
<section class="stage" data-fx="blur-cycle-photos" data-fx-blur-cycle-photos="first: 3; next: 3; delay: 0; gap: 0" style="--fx-blur: 20px" data-demo-remove>
  <span data-fx-part="photo" style="left:30%;top:20%;width:300px"><span class="wf-img" data-fx-part="shot" data-label="Dropping panel"></span></span>
</section>
<template data-demo-late><section class="stage" data-fx="blur-cycle-photos" data-fx-blur-cycle-photos="first: 2-4; delay: 0"><span data-fx-part="photo" style="left:10%;top:20%;width:260px"><span class="wf-img" data-fx-part="shot" data-label="Enters late"></span></span></section></template>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
