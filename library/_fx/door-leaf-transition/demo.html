<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>door-leaf-transition — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { margin: 0; padding: 48px; font-family: var(--kf-font-sans); background: var(--kf-bg); color: var(--kf-ink); display: grid; gap: 24px; justify-items: start; }
  .btn { display: inline-block; padding: 14px 22px; background: var(--kf-ink); color: var(--kf-bg); }
</style>
</head>
<body>
  <p class="demo-hint"><b>door-leaf-transition</b> — Press the button — the door closes, the name rises, then it moves on to the same demo (next page) and the door opens.</p>
  <a class="btn" data-fx="door-leaf-transition" data-fx-door-leaf-transition="name: Next Page" href="demo.html?page=2">To the next page</a>
  <a class="btn" data-fx="door-leaf-transition" data-fx-door-leaf-transition="close: .4; open: .5" data-name="Quick" href="demo.html?page=3">Fast door (.4s)</a>
  <template data-demo-late><a class="btn" data-fx="door-leaf-transition" href="demo.html?late=1" data-name="Late link">Link that came in after 1s</a></template>
  <a class="btn" data-fx="door-leaf-transition" data-demo-remove href="demo.html?gone=1">Link that drops out after 2.5s</a>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
