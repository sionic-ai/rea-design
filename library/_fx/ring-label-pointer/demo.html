<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ring-label-pointer — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { margin: 0; padding: 12px 20px; border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 40px; max-width: 900px; margin: 40px auto; padding: 0 20px; }
  .grid figure { margin: 0; cursor: pointer; }
  .grid .wf-img { aspect-ratio: 1; border-radius: 50% 50% 50% 0; }
  .grid figcaption { margin-top: 10px; text-align: center; }
</style>
</head>
<body>
<p class="demo-hint"><b>ring-label-pointer</b> — Hover over a photo. A circle lights up and a ring of text rotates. The third cell is “Open”, the fourth is a shadow.</p>
<main class="grid" id="grid" data-fx="ring-label-pointer" data-fx-ring-label-pointer="ring: Studio Name Design Team">
  <figure data-fx-part="target"><div class="wf-img" data-label="Person front view · gray wall · square"></div><figcaption>Name 01</figcaption></figure>
  <figure data-fx-part="target"><div class="wf-img" data-label="Person front view · gray wall · square"></div><figcaption>Name 02</figcaption></figure>
  <figure data-fx-part="target" data-label="Open"><div class="wf-img" data-label="Person front view · gray wall · square"></div><figcaption>Name 03</figcaption></figure>
</main>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
  // Check it lights up even in late-arriving cells, and that circles are detached when the board is cleared
  setTimeout(() => {
    const f = document.createElement("figure");
    f.dataset.fxPart = "target";
    f.dataset.shadow = "";
    f.innerHTML = '<div class="wf-img" data-label="Late-arriving photo"></div><figcaption>Name 04</figcaption>';
    document.getElementById("grid")?.append(f);
  }, 1000);
  setTimeout(() => {
    const m = document.createElement("main");
    m.dataset.fx = "ring-label-pointer";
    document.body.append(m);
    setTimeout(() => m.remove(), 500);
  }, 1500);
</script>
</body>
</html>
