<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>spiral-orbit-cards — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 300; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { padding: 24px 20px 400px; display: grid; gap: 40px; }
  .orbit { border: 1px solid var(--kf-line); }
  .orbit .wf-img { position: absolute; inset: 0; height: 100%; }
  .orbit .wf-img::after { font-size: 9px; }
  .center { position: absolute; z-index: 150; left: 50%; top: 50%; translate: -50% -50%; text-align: center; font-size: 28px; }
</style>
</head>
<body>
<p class="demo-hint"><b>spiral-orbit-cards</b> Cards slowly orbit along a spiral ellipse. The panel below keeps orbiting even as you scroll (scroll: 1.4). <span style="color:var(--kf-dim)">(After 1s a panel holding one more card comes in, and after 2.5s the top panel drops out)</span></p>
<section class="demo">
  <div class="orbit" data-demo-remove data-fx="spiral-orbit-cards">
    <span data-fx-part="card"><span class="wf-img" data-label="Card 1"></span></span><span data-fx-part="card"><span class="wf-img" data-label="Card 2"></span></span>
    <span data-fx-part="card"><span class="wf-img" data-label="Card 3"></span></span><span data-fx-part="card"><span class="wf-img" data-label="Card 4"></span></span>
    <span data-fx-part="card"><span class="wf-img" data-label="Card 5"></span></span><span data-fx-part="card"><span class="wf-img" data-label="Card 6"></span></span>
    <span data-fx-part="card"><span class="wf-img" data-label="Card 7"></span></span><span data-fx-part="card"><span class="wf-img" data-label="Card 8"></span></span>
    <span data-fx-part="card"><span class="wf-img" data-label="Card 9"></span></span><span data-fx-part="card"><span class="wf-img" data-label="Card 10"></span></span>
    <span data-fx-part="card"><span class="wf-img" data-label="Card 11"></span></span><span data-fx-part="card"><span class="wf-img" data-label="Card 12"></span></span>
    <p class="center">Center intro text</p>
  </div>
  <template data-demo-late>
    <div class="orbit" data-fx="spiral-orbit-cards" data-fx-spiral-orbit-cards="scroll: 1.4; speed: .05">
      <span data-fx-part="card"><span class="wf-img" data-label="Card 1"></span></span><span data-fx-part="card"><span class="wf-img" data-label="Card 2"></span></span>
      <span data-fx-part="card"><span class="wf-img" data-label="Card 3"></span></span><span data-fx-part="card"><span class="wf-img" data-label="Card 4"></span></span>
      <span data-fx-part="card"><span class="wf-img" data-label="Card 5"></span></span><span data-fx-part="card"><span class="wf-img" data-label="Card 6"></span></span>
      <span data-fx-part="card"><span class="wf-img" data-label="Card 7"></span></span><span data-fx-part="card"><span class="wf-img" data-label="Card 8"></span></span>
      <span data-fx-part="card"><span class="wf-img" data-label="Card 9"></span></span>
    </div>
  </template>
</section>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); }, 2500);
</script>
</body>
</html>
