<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>leaf-gobo-shadow — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: relative; z-index: 10; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-stage { position: relative; height: 80vh; display: grid; place-items: center; border-bottom: 1px solid var(--kf-line); background: var(--kf-surface); }
  .demo-stage h2 { font-size: 64px; font-weight: 800; }
</style>
</head>
<body>
<p class="demo-hint"><b>leaf-gobo-shadow</b> — Leaf shadows sway in the wind over the panel. Moving the mouse nudges the shadows slightly the other way (parallax). <span style="color:var(--kf-dim)">(After 1s one more panel comes in, and one leaves 2.5s later)</span></p>
<section class="demo-stage"><h2>Large title slot</h2><div data-fx="leaf-gobo-shadow" data-fx-leaf-gobo-shadow="shift: 35; from: .35"></div></section>
<section class="demo-stage" data-demo-remove><h2>Panel to Be Removed</h2><div data-fx="leaf-gobo-shadow"></div></section>
<template data-demo-late><section class="demo-stage"><h2>Late-arriving panel</h2><div data-fx="leaf-gobo-shadow" data-fx-leaf-gobo-shadow="sway: .8; opacity: .6"></div></section></template>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
