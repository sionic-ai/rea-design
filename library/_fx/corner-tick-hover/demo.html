<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>corner-tick-hover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); padding: 40px 20px; }
  .demo article { border: 1px solid var(--kf-line); margin: 0 -1px -1px 0; padding: 14px 16px; min-height: 180px; display: flex; flex-direction: column; justify-content: space-between; }
  .demo article.is-dark { background: var(--kf-contrast-bg); color: var(--kf-contrast-ink); }
  .demo h3 { margin: 0; font: 400 13px/1 var(--kf-font-mono); text-transform: uppercase; }
  .demo p { margin: 0; font-size: 40px; font-family: var(--kf-font-mono); }
</style>
</head>
<body>
<p class="demo-hint"><b>corner-tick-hover</b> — Hover over the cell. The four corner ticks grow 2.5 times longer.</p>
<section class="demo" id="demo">
  <article data-fx="corner-tick-hover"><h3>Label one</h3><p>0'000</p></article>
  <article data-fx="corner-tick-hover"><h3>Label two</h3><p>00</p></article>
  <article data-fx="corner-tick-hover" class="is-dark" data-fx-corner-tick-hover="look: light"><h3>On dark</h3><p>000</p></article>
  <article data-fx="corner-tick-hover" style="--fx-grow: 1"><h3>No grow</h3><p>0000</p></article>
</section>
<script>
// Late cells and removed cells — a cell that arrives after 1s also gets tick marks, and a cell removed after 2.5s runs detach
(() => {
  const demo = document.getElementById("demo");
  const make = (t) => { const a = document.createElement("article"); a.dataset.fx = "corner-tick-hover"; a.innerHTML = `<h3>${t}</h3><p>00</p>`; return a; };
  const gone = make("Leaves soon");
  demo.append(gone);
  setTimeout(() => demo.append(make("Late cell")), 1000);
  setTimeout(() => gone.remove(), 2500);
})();
</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
