<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>band-trail — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .stage { display: grid; place-items: center; height: 80vh; margin: 20px; border: 1px solid var(--kf-line); font: 800 64px/1 var(--kf-font-display); }
  .stage.is-small { height: 40vh; }
</style>
</head>
<body>
<p class="demo-hint"><b>band-trail</b> — Move the mouse widely over the panel. Wherever it passes, a photo opens in a strip and closes again. <span style="color:var(--kf-dim)">(After 1s one more panel comes in, and one leaves 2.5s later)</span></p>
<section class="stage" data-fx="band-trail">
  <div class="wf-img" data-fx-part="photo" data-label="Work photo · Collage portrait"></div>
  <div class="wf-img" data-fx-part="photo" data-label="Studio photo · Daylight"></div>
  <div class="wf-img" data-fx-part="photo" data-label="Performance photo · green lighting"></div>
  <p>Your name here</p>
</section>
<section class="stage is-small" data-fx="band-trail" data-fx-band-trail="size: 180; gap: 90" data-demo-remove><div class="wf-img" data-fx-part="photo" data-label="Panel to be removed soon"></div><p>Small · Dense</p></section>
<template data-demo-late><section class="stage is-small" data-fx="band-trail"><div class="wf-img" data-fx-part="photo" data-label="Late panel"></div><p>Late-arriving panel</p></section></template>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
