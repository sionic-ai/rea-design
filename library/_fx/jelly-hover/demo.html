<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>jelly-hover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { display: flex; flex-wrap: wrap; align-items: center; gap: 40px; padding: 48px 20px; }
  .blob { display: block; width: 180px; }
  .blob [data-fx-part] { aspect-ratio: 1; border-radius: 46% 54% 42% 58% / 52% 40% 60% 48%; background: var(--kf-accent); }
  .pill { display: inline-flex; align-items: center; justify-content: center; width: 112px; height: 112px; border-radius: 40px; background: var(--kf-accent); color: var(--kf-on-accent); text-decoration: none; }
  .dot { display: inline-block; width: 14px; height: 14px; border-radius: 50%; background: var(--kf-accent); }
</style>
</head>
<body>
<p class="demo-hint"><b>jelly-hover</b> — Hover over the blue drops, buttons and dots. The second row is look: soft (logo) · look: pop (dot) · look: settle (round button). <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<section class="demo">
  <a class="blob" href="#" data-demo-remove data-fx="jelly-hover" data-fx-jelly-hover="target: visual"><div data-fx-part="visual"></div></a>
  <a class="pill" href="#" data-fx="jelly-hover">Your button here</a>
  <a class="pill" href="#" data-fx="jelly-hover" data-fx-jelly-hover="look: soft">Logo Type</a>
  <a class="pill" href="#" data-fx="jelly-hover" data-fx-jelly-hover="look: squash">Squash shape (wobbles on release too)</a>
  <span data-fx="jelly-hover" data-fx-jelly-hover="look: pop" tabindex="0"><i class="dot"></i></span>
  <a class="pill" href="#" data-fx="jelly-hover" data-fx-jelly-hover="look: settle">Round Button Type</a>
  <template data-demo-late><a class="pill" href="#" data-fx="jelly-hover">Enters late</a></template>
</section>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
