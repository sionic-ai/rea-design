<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>corner-chip-expand — motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { padding: 48px 20px; display: flex; flex-wrap: wrap; gap: 16px; }
  .card { position: relative; width: 280px; height: 280px; border-radius: 32px; background: var(--kf-raised); }
  .card a { font-size: 14px; letter-spacing: .3px; }
  .card svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
</style>
<script src="../../../_shared/vendor/gsap/gsap.min.js" defer></script>
<script src="../fx-core.js" defer></script>
<script src="fx.js" defer></script>
</head>
<body>
<p class="demo-hint"><b>corner-chip-expand</b> — Hover over the card. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<section class="demo">
  <article class="card" data-demo-remove data-fx="corner-chip-expand"><a data-fx-part="chip" href="#"><span data-fx-part="label">Project Name</span><span data-fx-part="icon"><svg viewBox="0 0 18 18"><path d="M6 12l6-6M7.5 6H12v4.5"/></svg></span></a></article>
  <article class="card" data-fx="corner-chip-expand"><a data-fx-part="chip" href="#"><span data-fx-part="label">Another Project</span><span data-fx-part="icon"><svg viewBox="0 0 18 18"><path d="M6 12l6-6M7.5 6H12v4.5"/></svg></span></a></article>
  <article class="card" data-fx="corner-chip-expand"><a data-fx-part="chip" href="#"><span data-fx-part="icon"><svg viewBox="0 0 18 18"><path d="M6 12l6-6M7.5 6H12v4.5"/></svg></span></a></article>
  <template data-demo-late><article class="card" data-fx="corner-chip-expand" data-fx-corner-chip-expand="dur: .3; delay: .1"><a data-fx-part="chip" href="#"><span data-fx-part="label">Late Card</span><span data-fx-part="icon"><svg viewBox="0 0 18 18"><path d="M6 12l6-6M7.5 6H12v4.5"/></svg></span></a></article></template>
</section>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
