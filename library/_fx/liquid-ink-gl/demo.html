<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>liquid-ink-gl — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { margin: 0; color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { position: relative; height: 90vh; margin: 20px; overflow: hidden; border-radius: var(--kf-radius-md); }
  .demo ul { position: relative; z-index: 1; list-style: none; margin: 0; padding: 40vh 40px 0; }
  .demo li { padding: 14px 0; border-top: 1px solid var(--kf-line); font: 400 32px/1 var(--kf-font-display); }
  .demo button { position: relative; z-index: 1; margin: 20px 40px; }
</style>
</head>
<body>
<p class="demo-hint"><b>liquid-ink-gl</b> — Move the mouse over the panel and black liquid follows, hold an empty spot for 1 second and the panel flips, hover over a line and the liquid fills the line. The button is a shockwave.</p>
<section class="demo" data-fx="liquid-ink-gl" data-fx-liquid-ink-gl="layer: box">
  <button type="button" class="wf-btn">Shockwave</button>
  <ul>
    <li data-fx-part="target">List row one</li>
    <li data-fx-part="target">List line two</li>
    <li data-fx-part="target">List line three</li>
  </ul>
</section>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../_vendor/three@0.186.0/three.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
(() => {
  const demo = document.querySelector(".demo");
  demo.querySelector("button").addEventListener("click", (e) => demo.dispatchEvent(new CustomEvent("fx:shock", { detail: { x: e.clientX, y: e.clientY } })));
  const late = document.createElement("section");
  late.setAttribute("data-fx", "liquid-ink-gl");
  late.setAttribute("data-fx-liquid-ink-gl", "layer: box; intro: 0");
  late.style.cssText = "position:relative;height:80px;margin:20px";
  setTimeout(() => document.body.append(late), 1000);
  setTimeout(() => late.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s a small panel comes in and leaves after 2.5s (detach).");
})();
</script>
</body>
</html>
