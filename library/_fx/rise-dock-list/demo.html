<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>rise-dock-list — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { margin: 0; font-family: var(--kf-font-sans); background: var(--kf-bg); color: var(--kf-ink); }
  #hero { height: 100vh; display: grid; place-content: center; font-size: 40px; }
  .long { height: 300vh; padding: 16px; }
  .row a { display: flex; justify-content: space-between; gap: 1rem; padding-bottom: 1rem; border-bottom: 1px solid currentColor; color: inherit; text-decoration: none; }
  .demo-hint { position: fixed; top: 0; left: 0; z-index: 20; padding: 16px; font-size: 14px; background: var(--kf-bg); }
</style>
</head>
<body>
  <p class="demo-hint"><b>rise-dock-list</b> — Scroll past the hero, then roll up a little. A pill rises from the bottom, and pressing it spreads out into a list panel.</p>
  <section id="hero">Hero</section>
  <div class="long">Body text</div>
  <div data-fx="rise-dock-list" data-fx-rise-dock-list="after: #hero">
    <div data-fx-part="box">
      <nav data-fx-part="list" aria-label="Work List" inert>
        <ul>
          <li class="row" data-fx-part="row"><a href="#">Work Name One <span>0000</span></a></li>
          <li class="row" data-fx-part="row"><a href="#">Work Name Two <span>0000</span></a></li>
          <li class="row" data-fx-part="row"><a href="#">Work Name Three <span>0000</span></a></li>
        </ul>
      </nav>
      <button type="button" data-fx-part="toggle" aria-expanded="false"><span data-fx-part="label">More Works</span><span data-fx-part="icon" aria-hidden="true"><span></span><span></span></span></button>
    </div>
  </div>
  <template data-demo-late><div data-fx="rise-dock-list"><div data-fx-part="box"></div></div></template>
  <div data-fx="rise-dock-list" data-demo-remove></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
