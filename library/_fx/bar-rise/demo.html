<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bar-rise — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; padding: 48px 20px; }
  .card { display: block; height: 240px; padding: 20px; border-radius: var(--kf-radius-md); background: var(--kf-surface); color: var(--kf-ink); text-decoration: none; font: var(--kf-weight-display) 28px/1 var(--kf-font-display); }
</style>
</head>
<body>
<p class="demo-hint"><b>bar-rise</b> — Hover over the card and move away — the bar fills up and slips out upward. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<section class="demo">
  <a class="card" href="#" data-demo-remove data-fx="bar-rise">Your opening 1 here</a>
  <a class="card" href="#" data-fx="bar-rise">Your opening 2 here</a>
  <a class="card" href="#" data-fx="bar-rise" data-fx-bar-rise="count: 12; wide: 3; look: flat">12 angular bars</a>
  <template data-demo-late><a class="card" href="#" data-fx="bar-rise">Late-arriving card</a></template>
</section>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); window.ScrollTrigger?.refresh(); }, 2500);
</script>
</body>
</html>
