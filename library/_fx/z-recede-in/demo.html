<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>z-recede-in — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-pad { height: 90vh; display: grid; place-items: center; }
  .demo-fig { width: min(600px, 90%); aspect-ratio: 3 / 2; margin: 0 auto 60px; }
  .demo-fig [data-fx-part="image"] { width: 100%; height: 100%; background: var(--kf-accent-soft); display: grid; place-items: center; }
</style>
</head>
<body>
<p class="demo-hint"><b>z-recede-in</b> — Scroll down. The photo recedes from the front and settles into the frame.</p>
<div class="demo-pad">Top section</div>
<figure class="demo-fig" data-fx="z-recede-in"><div data-fx-part="image">Photo 1</div></figure>
<figure class="demo-fig" data-fx="z-recede-in" data-fx-z-recede-in="z: 200; dur: .6"><div data-fx-part="image">Photo 2</div></figure>
<figure class="demo-fig" data-fx="z-recede-in" data-demo-remove><div data-fx-part="image">Photo to Be Removed</div></figure>
<figure class="demo-fig" data-fx="z-recede-in"></figure>
<template data-demo-late><figure class="demo-fig" data-fx="z-recede-in" data-fx-z-recede-in="back: off"><div data-fx-part="image">Late-arrived Photo</div></figure></template>
<div class="demo-pad">Lower section</div>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
