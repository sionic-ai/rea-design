<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>clip-scale-pin — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .gap { height: 70vh; display: grid; place-items: center; color: var(--kf-dim); }
  .stage { height: 140vh; }
  .stage [data-fx-part="media"] { position: absolute; inset: 0; }
  .stage .wf-img { height: 100%; }
</style>
</head>
<body>
<p class="demo-hint"><b>clip-scale-pin</b> Scroll down — the background photo stays pinned and scales from .8 to 1, revealing the clip below. <span style="color:var(--kf-dim)">(After 1s one more panel comes in, and one leaves 2.5s later)</span></p>
<div class="gap">Top section</div>
<div class="stage" data-fx="clip-scale-pin"><div data-fx-part="media"><div class="wf-img" data-label="Annex background photo"></div></div></div>
<div class="gap">Between</div>
<div class="stage" data-fx="clip-scale-pin" data-fx-clip-scale-pin="from: .6; clip: 30" data-demo-remove><div data-fx-part="media"><div class="wf-img" data-label="Dropping panel"></div></div></div>
<span data-late-slot></span>
<div data-fx="clip-scale-pin"><p>A version without photos hooks nothing</p></div>
<div class="gap">Lower section</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelector("[data-late-slot]").outerHTML = '<div class="stage" data-fx="clip-scale-pin"><div data-fx-part="media"><div class="wf-img" data-label="Late panel"></div></div></div>', 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
