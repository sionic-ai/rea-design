<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cloud-pan-pin — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .spacer { height: 80vh; display: grid; place-items: center; color: var(--kf-dim); }
  .strip { display: block; aspect-ratio: 3.6 / 1; background: repeating-linear-gradient(90deg, var(--kf-raised) 0 200px, var(--kf-line) 200px 400px); }
  .cloud { position: absolute; bottom: 0; width: 60vh; aspect-ratio: 1; border-radius: 50%; background: radial-gradient(closest-side, var(--kf-surface), transparent); filter: blur(10px); }
  .mark { position: absolute; top: 50%; font-size: 64px; }
  h2 { position: absolute; top: 15%; left: 50%; width: 100%; transform: translateX(-50%); text-align: center; font-size: 72px; }
</style>
</head>
<body>
<p class="demo-hint"><b>cloud-pan-pin</b> — Scrolling lifts the cover, then the section stays pinned while the strip flows horizontally and clouds pass at different speeds.</p>
<div class="spacer">Scroll down</div>
<section data-fx="cloud-pan-pin" data-demo-remove>
  <i data-fx-part="curtain"></i><i data-fx-part="curtain"></i>
  <span class="strip" data-fx-part="track"></span>
  <div data-fx-part="layer"><b class="mark" style="left:40%">A</b><b class="mark" style="left:60%">B</b><i class="cloud" data-fx-part="drift" data-shift="10" style="left:10%"></i><i class="cloud" data-fx-part="drift" data-shift="30" style="left:55%"></i></div>
  <h2 data-fx-part="title">Top-down view</h2>
</section>
<template data-demo-late><section data-fx="cloud-pan-pin" data-fx-cloud-pan-pin="ratio: 1; fade: .5"><span class="strip" data-fx-part="track"></span><h2 data-fx-part="title">Late section</h2></section></template>
<div class="spacer"></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => { document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))); }, 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); window.ScrollTrigger?.refresh(); }, 2500);
</script>
</body>
</html>
