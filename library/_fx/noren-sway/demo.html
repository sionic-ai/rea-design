<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>noren-sway — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { padding: 32px 20px; display: grid; gap: 40px; }
  .noren { display: flex; gap: 2px; }
  .noren [data-fx-part="cloth"] { flex: 1; aspect-ratio: 1 / 0.53; }
  .noren .wf-img { height: 100%; border: 0; background-color: var(--kf-raised); color: var(--kf-ink); }
</style>
</head>
<body>
<p class="demo-hint"><b>noren-sway</b> — Just watch. Three cloth panels hang from the top edge and sway slowly (it takes a few seconds for the intensity to build up). <span style="color:var(--kf-dim)">(After 1s one more panel comes in, and one leaves 2.5s later)</span></p>
<section class="demo">
  <div class="noren" data-fx="noren-sway">
    <div data-fx-part="cloth"><div class="wf-img" data-label="Fabric 1 · Stamp"></div></div>
    <div data-fx-part="cloth"><div class="wf-img" data-label="Fabric 2 · Logo"></div></div>
    <div data-fx-part="cloth"><div class="wf-img" data-label="Fabric 3"></div></div>
  </div>
  <div class="noren" data-demo-remove data-fx="noren-sway" data-fx-noren-sway="max: 1; damping: .02">
    <div data-fx-part="cloth"><div class="wf-img" data-label="Dropped Panel"></div></div>
  </div>
  <template data-demo-late>
    <div class="noren" data-fx="noren-sway" data-fx-noren-sway="max: 1.2; damping: .02; fold: 12">
      <div data-fx-part="cloth"><div class="wf-img" data-label="Late-arriving cloth 1"></div></div>
      <div data-fx-part="cloth"><div class="wf-img" data-label="Late-arriving cloth 2"></div></div>
    </div>
  </template>
</section>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../_vendor/curtainsjs@8.1.6/curtains.umd.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
