<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bend-strip-gl — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .g { height: 70vh; margin: 16px 0; }
  .row { display: flex; gap: 12px; padding: 0 20px; }
</style>
</head>
<body>
<p class="demo-hint"><b>bend-strip-gl</b> — Roll the wheel. The tilted band bends as it flows, and names blur when scrolling fast. Change the category with the buttons below.</p>
<div class="row"><button type="button" data-cat="all">All</button><button type="button" data-cat="a">Category A</button><button type="button" data-cat="b">Category B</button></div>
<section class="g s1" data-fx="bend-strip-gl">
  <figure data-fx-part="item" data-ratio="0.56" data-tone="dark" data-top="Name" data-bottom="One" data-category="a" data-video data-label="Vertical portrait video · Dark interior"></figure>
  <figure data-fx-part="item" data-ratio="0.8" data-tone="mid" data-top="Name" data-bottom="Both" data-category="b" data-label="Fashion photo · gray background"></figure>
  <figure data-fx-part="item" data-ratio="0.75" data-top="Name" data-bottom="Three (native Korean)" data-category="a" data-label="Magazine cover · bright light"></figure>
  <figure data-fx-part="item" data-ratio="0.56" data-tone="dark" data-top="Name" data-category="b" data-video data-label="Stage video · red lighting"></figure>
  <figure data-fx-part="item" data-ratio="0.8" data-tone="mid" data-top="Name" data-bottom="Five" data-category="a" data-label="Person, half-length · Window light"></figure>
</section>
<section class="g" data-fx="bend-strip-gl" data-fx-bend-strip-gl="axis: y" data-demo-remove><figure data-fx-part="item" data-ratio="0.67" data-label="Board to erase"></figure></section>
<template data-demo-late><section class="g" data-fx="bend-strip-gl" data-fx-bend-strip-gl="axis: y; pos: 0,0,0.35"><figure data-fx-part="item" data-ratio="0.67" data-label="Late-arriving panel 1"></figure><figure data-fx-part="item" data-ratio="0.8" data-tone="mid" data-label="Late-arriving panel 2"></figure></section></template>
<section class="g" data-fx="bend-strip-gl"></section>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="three-global.js"></script>
<script src="../../_vendor/three@0.184.0/build/three.cjs"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
document.querySelectorAll("[data-cat]").forEach((b) => b.addEventListener("click", () => document.querySelector(".s1").dispatchEvent(new CustomEvent("fx:filter", { detail: { category: b.dataset.cat } }))));
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
