<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>corner-circle-slides — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { display: grid; grid-template-columns: repeat(2, 1fr); gap: 24px; padding: 48px 20px; }
  .demo-reel { aspect-ratio: 4 / 3; border-start-end-radius: var(--kf-radius-lg); }
  .demo-reel > [data-fx-part="slide"] > div { height: 100%; }
  .demo-reel > [data-fx-part="slide"]:nth-child(2) > div { background-color: var(--kf-accent-soft); }
  .demo-reel > [data-fx-part="slide"]:nth-child(3) > div { background-color: var(--kf-raised); }
  .demo-cap { position: absolute; left: 20px; bottom: 16px; z-index: 4; font: 700 18px/1 var(--kf-font-display); }
</style>
</head>
<body>
<p class="demo-hint"><b>corner-circle-slides</b> — Every 2.6s the next slide covers the screen in a circle from the top right. Hovering pauses it.</p>
<section class="demo">
  <div class="demo-reel" data-fx="corner-circle-slides">
    <div data-fx-part="slide" data-title="Section One" data-href="#1"><div class="wf-img" data-label="Photo 1"></div></div>
    <div data-fx-part="slide" data-title="Section Two" data-href="#2"><div class="wf-img" data-label="Photo 2"></div></div>
    <div data-fx-part="slide" data-title="Section Three" data-href="#3"><div class="wf-img" data-label="Photo 3"></div></div>
    <a data-fx-part="link" href="#1" aria-hidden="true" tabindex="-1"></a>
    <a class="demo-cap" data-fx-part="title" href="#1">Section One</a>
  </div>
</section>
<section class="demo">
  <div class="demo-reel" data-fx="corner-circle-slides" data-fx-corner-circle-slides="every: 4; dur: 1; ease: 0.39,0.575,0.565,1; at: 90% 50%; size: 120; from: 25px; zoom: 1.05; pause: none">
    <div data-fx-part="slide"><div class="wf-img" data-label="Section 1 spreading from the right-hand dot"></div></div>
    <div data-fx-part="slide"><div class="wf-img" data-label="Section 2"></div></div>
    <div data-fx-part="slide"><div class="wf-img" data-label="Section 3"></div></div>
    <p class="demo-cap"><button type="button" data-fx-part="dot">1</button> <button type="button" data-fx-part="dot">2</button> <button type="button" data-fx-part="dot">3</button></p>
  </div>
</section>
<script>
(() => {
  const src = document.querySelector('[data-fx~="corner-circle-slides"]');
  if (!src) return;
  const html = src.outerHTML;
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => src.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical one comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
