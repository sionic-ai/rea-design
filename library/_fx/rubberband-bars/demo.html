<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rubberband-bars — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 50; padding: 12px 20px; background: var(--kf-surface); font: 500 13px/1.4 var(--kf-font-mono); }
  .tall { height: 180vh; display: grid; place-items: center; color: var(--kf-dim); }
</style>
</head>
<body>
<p class="demo-hint"><b>rubberband-bars</b> — Scroll to the very bottom and keep rolling — the bars stretch and snap back when the wheel stops. (One more line comes in after 1s, one drops out after 2.5s)</p>
<div class="tall">Downward</div>
<div data-demo-remove data-fx="rubberband-bars"><div data-fx-part="strip"><i data-fx-part="bar"></i><i data-fx-part="bar"></i></div></div>
<template data-demo-late><div data-fx="rubberband-bars"><div data-fx-part="strip"><i data-fx-part="bar"></i><i data-fx-part="bar" style="background: var(--kf-accent-soft)"></i><i data-fx-part="bar" style="background: var(--kf-ink)"></i><i data-fx-part="bar" style="background: var(--kf-accent-soft)"></i><i data-fx-part="bar"></i></div></div></template>
<div data-fx="rubberband-bars"></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script>gsap.registerPlugin(ScrollTrigger);</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); window.ScrollTrigger?.refresh(); }, 2500);
</script>
</body>
</html>
