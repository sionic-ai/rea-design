<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>zoom-fade-slides — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); padding: 24px; }
  .demo-hint { margin-bottom: 16px; font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-stage { height: 60vh; background: var(--kf-accent); margin-bottom: 24px; }
  .demo-stage [data-fx-part="slide"] { display: grid; place-items: center; font: 700 40px/1 var(--kf-font-sans); color: var(--kf-on-accent); }
  .demo-stage [data-fx-part="slide"]:nth-child(1) { background: color-mix(in oklab, var(--kf-ink) 70%, var(--kf-accent)); }
  .demo-stage [data-fx-part="slide"]:nth-child(2) { background: color-mix(in oklab, var(--kf-ink) 40%, var(--kf-accent)); }
  .demo-stage [data-fx-part="slide"]:nth-child(3) { background: color-mix(in oklab, var(--kf-ink) 10%, var(--kf-accent)); }
</style>
</head>
<body>
<p class="demo-hint"><b>zoom-fade-slides</b> — Leave it alone. Every 3s (for demo, default 10s) the next slide comes in from 1.4x to 1.25x and cross-fades over 2s.</p>
<figure class="demo-stage" data-fx="zoom-fade-slides" data-fx-zoom-fade-slides="every: 3">
  <div data-fx-part="slide">Photo 1</div>
  <div data-fx-part="slide">Photo 2</div>
  <div data-fx-part="slide">Photo 3</div>
</figure>
<script>
// Late arrivals and removals — checks that fx-core attaches to an element added after 1s and detaches from an element removed after 2.5s
(() => {
  const src = document.querySelector('[data-fx~="zoom-fade-slides"]');
  if (!src) return;
  const html = src.outerHTML.replace(/\sid="[^"]*"/g, "");
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => src.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical one comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
