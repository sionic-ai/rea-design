<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>scatter-settle-scrub — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .spacer { height: 90vh; display: grid; place-items: center; color: var(--kf-dim); }
  .big { padding: 0 10px; font-family: var(--kf-font-display); font-size: clamp(40px, 7vw, 96px); line-height: 1; text-indent: 9vw; }
  .big + .big { margin-top: 30vh; text-indent: 0; }
</style>
</head>
<body>
<p class="demo-hint"><b>scatter-settle-scrub</b> — Scroll down. Scattered letters settle into place as far as you scroll. <span style="color:var(--kf-dim)">(One more sentence comes in after 1s, and one drops out after 2.5s)</span></p>
<div class="spacer">↓</div>
<p class="big" data-fx="scatter-settle-scrub"><em>Studio</em> is a <em>talent management</em> and <em>production</em> company.</p>
<p class="big" data-fx="scatter-settle-scrub" data-fx-scatter-settle-scrub="rot: 40; each: .05" data-demo-remove>Your Korean copy here, about two lines.</p>
<p class="big" data-fx="scatter-settle-scrub"></p>
<template data-demo-late><p class="big" data-fx="scatter-settle-scrub">A late sentence <em>arrives</em> here.</p></template>
<div class="spacer">Footer</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
