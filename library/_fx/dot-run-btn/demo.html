<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dot-run-btn — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { padding: 48px 20px; display: flex; flex-wrap: wrap; gap: 24px; align-items: center; font-size: 14px; }
</style>
</head>
<body>
<p class="demo-hint"><b>dot-run-btn</b> — Hover over the button. The left dot runs to the right end and the text moves aside. Press it and it returns with a bounce.</p>
<section class="demo">
  <a href="#" data-fx="dot-run-btn"><span data-fx-part="label">Request a Demo</span></a>
  <a href="#" data-fx="dot-run-btn" style="--fx-run: 2rem"><span data-fx-part="label">Slightly longer button text</span></a>
  <button type="button" data-fx="dot-run-btn" style="border:0;background:none;font:inherit;padding:0"><span data-fx-part="label">button element</span></button>
  <a href="#" data-fx="dot-run-btn"></a>
</section>
<script>
(() => {
  const src = document.querySelector('[data-fx~="dot-run-btn"]');
  if (!src) return;
  const html = src.outerHTML.replace(/\sid="[^"]*"/g, "");
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => src.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical one comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
