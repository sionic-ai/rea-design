<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>zoom-settle-hero — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .hero { display: flex; align-items: center; justify-content: center; height: 70svh; color: var(--kf-on-accent); text-align: center; }
  .hero [data-fx-part="media"] { background: var(--kf-accent); }
  .hero h1 { font: 300 64px/1.1 var(--kf-font-display); }
  .hero span { font-size: 11px; letter-spacing: .2em; }
  .small { height: 240px; margin: 20px; }
</style>
</head>
<body>
<p class="demo-hint"><b>zoom-settle-hero</b> — Refresh. The panel slowly sinks over 12 seconds as the text rises, and the line below pulses. <span style="color:var(--kf-dim)">(After 1s one more small panel comes in, and after 2.5s one leaves)</span></p>
<section class="hero" data-fx="zoom-settle-hero"><div data-fx-part="media"></div><div data-fx-part="content"><h1>Gallery</h1><p>Your one-liner here</p></div><div data-fx-part="cue"><i data-fx-part="line"></i><span>SCROLL</span></div></section>
<section class="hero small" data-fx="zoom-settle-hero" data-demo-remove><div data-fx-part="media"></div><div data-fx-part="content"><h1>Dropped Panel</h1></div></section>
<section class="hero small" data-fx="zoom-settle-hero"></section>
<template data-demo-late><section class="hero small" data-fx="zoom-settle-hero" style="--fx-dur: 4s"><div data-fx-part="media"></div><div data-fx-part="content"><h1>Late panel</h1></div></section></template>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((x) => x.remove()), 2500);
</script>
</body>
</html>
