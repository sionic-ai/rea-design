<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>slash-bar-sweep — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .mark { position: relative; width: min(640px, 90vw); aspect-ratio: 170 / 60; margin: 48px auto; }
  .mark i { position: absolute; height: 3.5%; transform-origin: left center; }
  .mark b { position: absolute; left: 0; bottom: 0; font: 800 clamp(32px, 9vw, 96px)/1 var(--kf-font-display); letter-spacing: -0.02em; }
</style>
</head>
<body>
<p class="demo-hint"><b>slash-bar-sweep</b> — Five comb lines are drawn in turn, and every 9s they slide out to the right and are drawn again. Just watch. <span style="color:var(--kf-dim)">(After 1s one more line comes in, and one leaves 2.5s later)</span></p>
<div class="mark" data-fx="slash-bar-sweep">
  <i data-fx-part="bar" style="width:46%;bottom:40%;left:2.2%;rotate:-53.9deg"></i>
  <i data-fx-part="bar" style="width:21.5%;bottom:58%;left:17.6%;rotate:-38.5deg"></i>
  <i data-fx-part="bar" style="width:73.7%;bottom:46%;left:17.6%;rotate:-27.6deg"></i>
  <i data-fx-part="bar" style="width:54%;bottom:60%;left:39.7%;rotate:-21.3deg"></i>
  <i data-fx-part="bar" style="width:68.7%;bottom:41%;left:31%;rotate:-16.3deg"></i>
  <b>LOGOTYPE</b>
</div>
<div class="mark" data-demo-remove data-fx="slash-bar-sweep" data-fx-slash-bar-sweep="dur: .8; each: .1; every: 4; gap: 1.2">
  <i data-fx-part="bar" style="width:60%;bottom:50%;left:4%;rotate:-20deg"></i>
  <b>Line to be removed soon</b>
</div>
<div class="mark" data-fx="slash-bar-sweep"><b>No bar — nothing hangs on it</b></div>
<template data-demo-late><div class="mark" data-fx="slash-bar-sweep" data-fx-slash-bar-sweep="dur: .9; every: 3; gap: 1.2" style="--fx-bar-color: var(--kf-accent)">
  <i data-fx-part="bar" style="width:70%;bottom:44%;left:6%;rotate:-12deg"></i>
  <i data-fx-part="bar" style="width:40%;bottom:62%;left:20%;rotate:-30deg"></i>
  <b>Late-arriving line</b>
</div></template>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
