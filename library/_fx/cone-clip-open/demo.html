<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cone-clip-open — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { padding: 24px 20px 60vh; display: grid; gap: 40px; }
  .cone { height: 320px; background: var(--kf-accent); }
  .gap { height: 80vh; }
</style>
</head>
<body>
<p class="demo-hint"><b>cone-clip-open</b> The top panel unfolds like rays as soon as it opens, and scrolling down opens a cone sideways (it folds back when scrolling up).</p>
<div class="demo">
  <div class="cone" data-fx="cone-clip-open" data-fx-cone-clip-open="on: load; delay: .3"></div>
  <div class="gap"></div>
  <div class="cone" data-fx="cone-clip-open" data-fx-cone-clip-open="dir: right"></div>
</div>
<script>
// Late arrivals and removals — checks that fx-core attaches to an element added after 1s and detaches from an element removed after 2.5s
(() => {
  const src = document.querySelector('[data-fx~="cone-clip-open"]');
  if (!src) return;
  const make = (tag) => { const el = src.cloneNode(true); el.dataset.demo = tag; el.removeAttribute("style"); return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => src.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s, one more panel comes in (the late one), and after 2.5s one drops out (the removal).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script>gsap.registerPlugin(ScrollTrigger);</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
