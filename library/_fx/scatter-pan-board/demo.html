<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>scatter-pan-board — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { margin: 0; background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { height: 80vh; margin: 20px; border-radius: var(--kf-radius-md); }
  .demo [data-fx-part="item"] { display: block; color: inherit; text-decoration: none; }
  .demo i { display: block; aspect-ratio: 380 / 440; border-radius: var(--kf-radius-md); background: var(--kf-surface); border: 1px solid var(--kf-line); }
  .demo b { display: block; margin-top: 10px; font: 500 18px/1 var(--kf-font-sans); }
  .demo nav { position: absolute; right: 16px; bottom: 16px; z-index: 4; display: flex; gap: 4px; }
</style>
</head>
<body>
<p class="demo-hint"><b>scatter-pan-board</b> — Drag the panel. It glides on release, zoom with ctrl+wheel, and moving the cursor to the edge makes the panel drift.</p>
<section class="demo" data-fx="scatter-pan-board">
  <a data-fx-part="item" href="#"><i></i><b>Your case 1 here</b></a>
  <a data-fx-part="item" href="#"><i></i><b>Your case 2 here</b></a>
  <a data-fx-part="item" href="#"><i></i><b>Your case 3 here</b></a>
  <a data-fx-part="item" href="#"><i></i><b>Your case 4 here</b></a>
  <nav><button type="button" data-fx-part="zoom" data-dir="out">−</button><button type="button" data-fx-part="zoom" data-dir="in">+</button></nav>
</section>
<script>
(() => {
  const late = document.createElement("section");
  late.setAttribute("data-fx", "scatter-pan-board");
  late.style.height = "60px";
  setTimeout(() => document.body.append(late), 1000);
  setTimeout(() => late.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s a card-less panel comes in and leaves after 2.5s (detach).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
