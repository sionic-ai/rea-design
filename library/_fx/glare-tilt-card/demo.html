<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>glare-tilt-card — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  #box { display: flex; flex-wrap: wrap; gap: 48px; padding: 60px; }
  .card { width: 200px; aspect-ratio: 1; background: var(--kf-raised); border: 1px solid var(--kf-line); display: grid; place-items: center; color: var(--kf-dim); font-size: 13px; }
</style>
</head>
<body>
<p class="demo-hint"><b>glare-tilt-card</b> — Move the mouse over the card. The card tilts and lifts, with a glare reflecting on it. <span style="color:var(--kf-dim)">(One more card comes in after 1s, and one drops out after 2.5s)</span></p>
<main id="box">
  <div class="card" data-fx="glare-tilt-card">Album cover 1</div>
  <div class="card" data-fx="glare-tilt-card" data-fx-glare-tilt-card="max: 10; glare: false">Tilt 10° · no glare</div>
  <div class="card" data-fx="glare-tilt-card" data-demo-remove>Soon-Removed Card</div>
</main>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../_vendor/vanilla-tilt@1.8.1/vanilla-tilt.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => { const s = document.createElement("div"); s.className = "card"; s.dataset.fx = "glare-tilt-card"; s.textContent = "Late-arrived card"; document.getElementById("box").append(s); }, 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
