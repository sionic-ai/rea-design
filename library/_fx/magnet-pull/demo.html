<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>magnet-pull — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { min-height: 70vh; padding: 80px 40px; display: flex; flex-wrap: wrap; gap: 60px; align-items: center; }
  .btn { position: relative; overflow: hidden; isolation: isolate; display: inline-flex; padding: 18px 30px; border-radius: var(--kf-radius-pill); background: var(--kf-ink); color: var(--kf-bg); text-decoration: none; }
  .btn::before { content: ""; position: absolute; z-index: -1; left: var(--fx-x, 50%); top: var(--fx-y, 120%); width: 300%; aspect-ratio: 1; border-radius: 50%; background: var(--kf-accent); transform: translate(-50%, -50%) scale(0); transition: transform .6s var(--kf-ease-out); }
  .btn:hover::before { transform: translate(-50%, -50%) scale(1); }
</style>
</head>
<body>
<p class="demo-hint"><b>magnet-pull</b> — Move the mouse over the button, then release. The button is pulled in, the text less so, and it bounces back on release. <span style="color:var(--kf-dim)">(After 1s one more button comes in, and after 2.5s one drops out)</span></p>
<main class="demo">
  <a class="btn" href="#" data-fx="magnet-pull"><span data-fx-part="label">Your button here</span></a>
  <a class="btn" href="#" data-fx="magnet-pull" data-fx-magnet-pull="pull: .5; label: 0" data-demo-remove><span>Letters together</span></a>
  <a class="btn" href="#" data-fx="magnet-pull">No text shown</a>
  <template data-demo-late><a class="btn" href="#" data-fx="magnet-pull"><span data-fx-part="label">Late-arriving button</span></a></template>
</main>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
