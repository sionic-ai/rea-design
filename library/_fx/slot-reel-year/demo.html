<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>slot-reel-year — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { display: flex; flex-wrap: wrap; gap: 40px; padding: 60px 20px; }
  .machine { display: grid; justify-items: center; gap: 18px; padding: 28px; border-radius: var(--kf-radius-lg); background: var(--kf-accent); }
  .reels { display: flex; gap: 10px; padding: 14px; border-radius: var(--kf-radius-md); background: var(--kf-surface); }
  [data-fx-part="reel"] { width: 56px; height: 76px; border-radius: var(--kf-radius-sm); background: var(--kf-bg); font: 700 48px/1 var(--kf-font-display); color: var(--kf-accent-text); }
  button { padding: 8px 28px; border: 2px solid var(--kf-on-accent); border-radius: var(--kf-radius-pill); background: none; color: var(--kf-on-accent); font: 700 13px/1 var(--kf-font-display); cursor: pointer; }
  output { display: block; padding: 0 20px; font: 500 14px/1.4 var(--kf-font-mono); }
</style>
</head>
<body>
<p class="demo-hint"><b>slot-reel-year</b> — Press START. The four-digit reel spins one digit at a time, then stops on the year with a slight bounce. <span style="color:var(--kf-dim)">(After 1s one more machine comes in, and after 2.5s one drops out)</span></p>
<section class="demo">
  <div class="machine" data-fx="slot-reel-year" data-fx-slot-reel-year="values: 1976,1980,1994,2008,2022"><div class="reels"><span data-fx-part="reel"></span><span data-fx-part="reel"></span><span data-fx-part="reel"></span><span data-fx-part="reel"></span></div><button data-fx-part="start" type="button">START</button></div>
  <div class="machine" data-fx="slot-reel-year" data-demo-remove><div class="reels"><span data-fx-part="reel"></span><span data-fx-part="reel"></span></div><button data-fx-part="start" type="button">Being removed soon</button></div>
  <template data-demo-late><div class="machine" data-fx="slot-reel-year" data-fx-slot-reel-year="init: 2026"><div class="reels"><span data-fx-part="reel"></span><span data-fx-part="reel"></span><span data-fx-part="reel"></span><span data-fx-part="reel"></span></div><button data-fx-part="start" type="button">Late-arrived Machine</button></div></template>
</section>
<output>Result: —</output>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
document.addEventListener("fx:result", (e) => (document.querySelector("output").textContent = `Result: ${e.detail.value}`));
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
