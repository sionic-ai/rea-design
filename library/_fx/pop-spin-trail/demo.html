<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pop-spin-trail — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: sticky; top: 0; z-index: 100; margin: 0; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .field { height: 70vh; margin: 20px; border: 1px solid var(--kf-line); display: grid; place-items: center; background: var(--kf-surface); }
  .field p { position: relative; z-index: 0; }
</style>
</head>
<body>
<p class="demo-hint"><b>pop-spin-trail</b> — Move the mouse over the panel. Photos pop out, spin and vanish.</p>
<section class="field" data-fx="pop-spin-trail">
  <div data-fx-part="layer"></div>
  <p>Move your mouse here</p>
  <div class="wf-img" data-fx-part="source" data-label="Person photo 1"></div>
  <div class="wf-img" data-fx-part="source" data-label="Person photo 2"></div>
  <div class="wf-img" data-fx-part="source" data-label="Person photo 3"></div>
</section>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script>
// Late arrivals and removals — fx-core also attaches to a panel added after 1 second, and checks that a panel removed after 2.5 seconds gets detached
(() => {
  const src = document.querySelector(".field");
  const html = src.outerHTML;
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => src.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s, one more panel comes in (the late one), and after 2.5s one drops out (the removal).");
})();
</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
