<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pop-swap-cycle — a cell that swaps in steps and pops out</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { padding: 40px; font-family: var(--kf-font-sans); color: var(--kf-ink); background: var(--kf-bg); }
  .stage { display: flex; gap: 32px; flex-wrap: wrap; }
  .swap { width: 220px; height: 300px; }
  .swap .wf-img { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<p>Wait and see — every 2s it switches to the next box with a pop. Hover to pause (after 1s a second panel is added, after 2s the first panel leaves).</p>
<div class="stage" id="stage">
  <div class="swap" id="first" data-fx="pop-swap-cycle" data-fx-pop-swap-cycle="every: 2; pause: hover">
    <a data-fx-part="item" class="is-on" href="#"><span data-fx-part="pop" class="wf-img" data-label="Box 1"></span></a>
    <a data-fx-part="item" href="#"><span data-fx-part="pop" class="wf-img" data-label="Box 2"></span></a>
    <a data-fx-part="item" href="#"><span data-fx-part="pop" class="wf-img" data-label="Box 3"></span></a>
  </div>
</div>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
  setTimeout(() => {
    const el = document.createElement("div");
    el.className = "swap";
    el.setAttribute("data-fx", "pop-swap-cycle");
    el.setAttribute("data-fx-pop-swap-cycle", "every: 1.5");
    el.innerHTML = '<span data-fx-part="item" class="wf-img" data-label="Cell A"></span><span data-fx-part="item" class="wf-img" data-label="Cell B"></span>';
    document.getElementById("stage").append(el);
  }, 1000);
  setTimeout(() => document.getElementById("first").remove(), 2000);
</script>
</body>
</html>
