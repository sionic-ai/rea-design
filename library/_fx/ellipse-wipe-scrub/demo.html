<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ellipse-wipe-scrub — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 10; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .wrap { position: relative; }
  .stage { position: sticky; top: 0; height: 100vh; overflow: hidden; }
  .plate { position: absolute; inset: -2px; display: grid; place-items: center; font: 700 40px var(--kf-font-display); }
  .plate.a { background: var(--kf-surface); } .plate.b { background: var(--kf-accent); color: var(--kf-on-accent); } .plate.c { background: var(--kf-ink); color: var(--kf-bg); }
  .scene { height: 100vh; }
</style>
</head>
<body>
<p class="demo-hint"><b>ellipse-wipe-scrub</b> — Scroll down and the next photo panel is revealed in an ellipse from the top right.</p>
<div class="wrap">
  <div class="stage">
    <div class="plate a">First round</div>
    <div class="plate b" data-fx="ellipse-wipe-scrub" data-fx-ellipse-wipe-scrub="trigger: #s2">Second edition</div>
    <div class="plate c" data-fx="ellipse-wipe-scrub" data-fx-ellipse-wipe-scrub="trigger: #s3; dist: 600" data-demo-remove>Third panel (exits after 2.5s)</div>
    <template data-demo-late><div class="plate a" data-fx="ellipse-wipe-scrub" data-fx-ellipse-wipe-scrub="trigger: #s4; start: top 60%">Late panel</div></template>
  </div>
  <div class="scene" style="margin-top:-100vh"></div>
  <div class="scene" id="s2"></div>
  <div class="scene" id="s3"></div>
  <div class="scene" id="s4"></div>
  <div class="scene"></div>
</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); window.ScrollTrigger?.refresh(); }, 2500);
</script>
</body>
</html>
