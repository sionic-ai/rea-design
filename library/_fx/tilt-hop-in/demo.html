<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tilt-hop-in — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 500 15px/1.6 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 10; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .row { display: flex; gap: 32px; align-items: end; justify-content: center; height: 220px; border-bottom: 2px solid var(--kf-line); max-width: 900px; margin: 48px auto; }
  .fig { display: block; width: 48px; height: 96px; border-radius: 24px 24px 6px 6px; background: var(--kf-accent-soft); border: 1px solid var(--kf-line); }
  .gap { height: 70vh; display: grid; place-items: center; color: var(--kf-dim); }
  button { padding: 8px 16px; }
</style>
</head>
<body>
<p class="demo-hint"><b>tilt-hop-in</b> — The top row bounces as soon as it opens, pressing the button bounces the middle row again, and scrolling down bounces the last row. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<div class="row" data-fx="tilt-hop-in" data-fx-tilt-hop-in="on: load"><i class="fig" data-fx-part="item"></i><i class="fig" data-fx-part="item"></i><i class="fig" data-fx-part="item"></i></div>
<p style="text-align:center"><button type="button" onclick="document.querySelector('#ev').dispatchEvent(new Event('fx:play'))">send fx:play</button></p>
<div class="row" id="ev" data-fx="tilt-hop-in" data-fx-tilt-hop-in="on: event; y: 10,15; x: 3,8; stagger: .06"><i class="fig" data-fx-part="item"></i><i class="fig" data-fx-part="item"></i><i class="fig" data-fx-part="item"></i><i class="fig" data-fx-part="item"></i></div>
<div class="gap">↓ Scroll</div>
<div class="row"><i class="fig" data-fx="tilt-hop-in"></i><i class="fig" data-fx="tilt-hop-in" data-fx-tilt-hop-in="delay: .2"></i></div>
<div class="row" data-fx="tilt-hop-in" data-demo-remove><i class="fig" data-fx-part="item"></i></div>
<template data-demo-late><div class="row" data-fx="tilt-hop-in" data-fx-tilt-hop-in="on: load; dur: 1.2"><i class="fig" data-fx-part="item"></i><i class="fig" data-fx-part="item"></i></div></template>
<div class="gap">Footer</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
