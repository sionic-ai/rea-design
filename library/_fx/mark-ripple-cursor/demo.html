<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mark-ripple-cursor — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { margin: 0; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .hero { height: 70vh; display: grid; place-items: center; border-bottom: 1px solid var(--kf-line); }
  .hero svg { height: 55vh; width: auto; color: var(--kf-ink); }
</style>
</head>
<body>
<p class="demo-hint"><b>mark-ripple-cursor</b> — Move the mouse quickly over the mark. The passed area smears and ripples and swirls spread out.</p>
<section class="hero" data-fx="mark-ripple-cursor">
  <svg data-fx-part="mark" viewBox="0 0 100 134" aria-hidden="true">
    <path fill="currentColor" fill-rule="evenodd" d="M85 92a38 38 0 1 1-76 0a38 38 0 1 1 76 0Z M69 90a19 19 0 1 0-38 0a19 19 0 1 0 38 0Z"/>
    <path fill="currentColor" d="M58 60C38 48 21 35 25 20C29 6 52 0 74 6C80 8 86 11 90 15L87 18C76 11 60 9 50 12C40 15 38 26 48 36C56 44 68 54 76 70Z"/>
  </svg>
</section>
<script>
// Late arrivals·removals — after 1s one more of the same panel comes in (late arrival), after 2.5s one of them is removed (detach)
(() => {
  const src = document.querySelector('[data-fx~="mark-ripple-cursor"]');
  const html = src.outerHTML;
  const make = () => { const t = document.createElement("template"); t.innerHTML = html; return t.content.firstElementChild; };
  const gone = make();
  src.after(gone);
  setTimeout(() => document.body.append(make()), 1000);
  setTimeout(() => gone.remove(), 2500);
})();
</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
