<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>speed-smear-video — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .gap { height: 50vh; }
  .box { width: min(720px, 90vw); aspect-ratio: 16 / 9; margin: 0 auto 30vh; }
  .box.is-tall { width: 200px; aspect-ratio: 220 / 840; }
</style>
</head>
<body>
<p class="demo-hint"><b>speed-smear-video</b> — Scroll quickly. The video blurs in proportion to scroll speed and sharpens when it stops. The second panel removes the background. <span style="color:var(--kf-dim)">(After 1s one more panel comes in, and one leaves 2.5s later)</span></p>
<div class="gap"></div>
<div class="box" data-fx="speed-smear-video" data-fx-speed-smear-video="angle: 90"><video src="../../wheel-driven-video-stage/use-placeholder.mp4" muted loop playsinline autoplay></video></div>
<div class="box is-tall" data-fx="speed-smear-video" data-fx-speed-smear-video="key: true; angle: 90" data-demo-remove><video src="../../wheel-driven-video-stage/loop-placeholder.mp4" muted loop playsinline autoplay></video></div>
<div class="box" data-fx="speed-smear-video"></div>
<template data-demo-late><div class="box is-tall" data-fx="speed-smear-video" data-fx-speed-smear-video="key: true; smear: .03"><video src="../../wheel-driven-video-stage/loop-placeholder.mp4" muted loop playsinline autoplay></video></div></template>
<div class="gap"></div>
<script src="three-global.js"></script>
<script src="../../_vendor/three@0.170.0/build/three.cjs"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
