<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pass-tint — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo-spacer { height: 70vh; display: grid; place-items: center; color: var(--kf-dim); }
  [data-fx="pass-tint"] { padding: 10vh 20px; }
  [data-fx-part="bg"] { position: absolute; inset: 0; }
  [data-fx-part="rows"] { position: sticky; top: 30vh; height: 1.1em; overflow: hidden; font: 700 15vw/1 var(--kf-font-display); color: color-mix(in oklab, var(--kf-bg) 20%, transparent); }
  [data-fx-part="row"] { position: absolute; white-space: nowrap; }
  [data-fx-part="item"] { position: relative; height: 80vh; margin: 10vh 0; padding: 24px; border: 1px solid var(--kf-line); }
  [data-tint] [data-fx-part="item"] { color: var(--kf-on-accent); }
</style>
</head>
<body>
<p class="demo-hint"><b>pass-tint</b> Scroll down. While a cell passes the 30% line from the top of the screen, the background tints to that cell’s color. <span style="color:var(--kf-dim)">(After 1s one more section comes in, and one leaves 2.5s later)</span></p>
<div class="demo-spacer">↓ Scroll down</div>
<template id="tpl"><section data-fx="pass-tint">
  <div data-fx-part="bg"></div>
  <div data-fx-part="rows"><p data-fx-part="row">FIRST WORLD</p><p data-fx-part="row">SECOND WORLD</p><p data-fx-part="row">THIRD WORLD</p></div>
  <article data-fx-part="item" style="--fx-color:var(--kf-accent)">Cell 1</article>
  <article data-fx-part="item" style="--fx-color:var(--kf-ink)">Cell 2</article>
  <article data-fx-part="item" style="--fx-color:var(--kf-ink-soft)">Cell 3</article>
</section></template>
<div id="a" data-demo-remove></div><div id="b"></div><div id="late"></div>
<section data-fx="pass-tint"></section>
<div class="demo-spacer">Footer</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
const tpl = document.getElementById("tpl");
document.getElementById("a").append(tpl.content.cloneNode(true));
document.getElementById("b").append(tpl.content.cloneNode(true));
// Check it attaches to late-added elements and detaches from removed ones
setTimeout(() => document.getElementById("late").append(tpl.content.cloneNode(true)), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
