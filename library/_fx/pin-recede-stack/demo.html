<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pin-recede-stack — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo-spacer { height: 90vh; display: grid; place-items: center; color: var(--kf-dim); }
  .stack figure { margin: 0; padding: 0 8vw; }
  .stack .wf-img { aspect-ratio: 600 / 340; max-height: 80vh; border-radius: var(--kf-radius-md); }
  .stack figcaption { margin-top: 12px; font-weight: 700; }
</style>
</head>
<body>
<p class="demo-hint"><b>pin-recede-stack</b> Scroll and the photo stack stays pinned. While the front photo recedes to .8x, the next photo rises from below and covers it.</p>
<div class="demo-spacer">Scroll down ↓</div>
<div class="stack" data-fx="pin-recede-stack" style="--fx-count: 4">
  <figure data-fx-part="item"><div class="wf-img" data-label="Photo 1 · Building exterior · Landscape"></div><figcaption data-fx-part="caption">01 / 04 · Your photo caption here</figcaption></figure>
  <figure data-fx-part="item"><div class="wf-img" data-label="Photo 2 · interior · landscape"></div><figcaption data-fx-part="caption">02 / 04 · Your photo caption here</figcaption></figure>
  <figure data-fx-part="item"><div class="wf-img" data-label="Photo 3 · Lounge · landscape"></div><figcaption data-fx-part="caption">03 / 04 · Your photo caption here</figcaption></figure>
  <figure data-fx-part="item"><div class="wf-img" data-label="Photo 4 · exterior at dusk · landscape"></div><figcaption data-fx-part="caption">04 / 04 · Your photo caption here</figcaption></figure>
</div>
<div class="demo-spacer"></div>
<script>
// Late arrivals and removals — checks that fx-core attaches to an element added after 1s and detaches from an element removed after 2.5s
(() => {
  const src = document.querySelector('[data-fx~="pin-recede-stack"]');
  const html = src.outerHTML;
  const make = () => { const t = document.createElement("template"); t.innerHTML = html; return t.content.firstElementChild; };
  const gone = make();
  (src.closest(".pin-spacer") || src).after(gone);
  setTimeout(() => document.body.lastElementChild.before(make()), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical stack comes in (a late arrival), and after 2.5s one is removed (detach).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
