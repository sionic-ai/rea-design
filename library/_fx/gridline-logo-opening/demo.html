<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gridline-logo-opening — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-contrast-bg); color: var(--kf-contrast-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: relative; z-index: 600; padding: 12px 20px; background: var(--kf-surface); color: var(--kf-ink); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .head { position: sticky; top: 0; padding: 20px; font-weight: 700; }
  .hero { height: 80vh; display: flex; align-items: flex-end; padding: 60px; font: 700 56px/1 var(--kf-font-display); }
  .logo-text { font: 700 64px/1 var(--kf-font-display); letter-spacing: 0.02em; }
</style>
</head>
<body>
<p class="demo-hint"><b>gridline-logo-opening</b> — Refresh — guide lines are drawn and the logo forms, then a circle grows and the curtain lifts. <span style="color:var(--kf-dim)">(After 1s an act with no panel comes in, and after 2.5s it leaves)</span></p>
<div data-fx="gridline-logo-opening" data-fx-gridline-logo-opening="reveal: .hero; head: .head">
  <div data-fx-part="box">
    <svg viewBox="0 0 449 122" aria-hidden="true">
      <path data-fx-part="grid-h" d="M0 30H449M0 61H449M0 92H449"/>
      <path data-fx-part="grid-v" d="M60 0V122M224 0V122M388 0V122"/>
      <text data-fx-part="fill" class="logo-text" x="30" y="86">studioNa</text>
      <text data-fx-part="stroke" class="logo-text" x="30" y="86">studioNa</text>
      <circle data-fx-part="dot" cx="420" cy="40" r="6"/>
    </svg>
  </div>
  <div data-fx-part="circle"></div>
</div>
<header class="head">Headline</header>
<section class="hero">Big Headline</section>
<span data-late-slot></span>
<div data-fx="gridline-logo-opening" data-demo-remove></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelector("[data-late-slot]").outerHTML = '<div data-fx="gridline-logo-opening"></div>', 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
