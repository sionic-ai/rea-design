<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>leaf-fall-sway — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .stage { position: relative; height: 760px; margin: 0 40px; overflow: hidden; }
  .leaf { display: block; width: 5em; height: 2em; border-radius: 50% 0 50% 0; background: var(--kf-accent); }
</style>
</head>
<body>
<p class="demo-hint"><b>leaf-fall-sway</b> — Leaves fall, drifting left and right and spinning (four types). <span style="color:var(--kf-dim)">(After 1s one more leaf comes in, and one leaves 2.5s later)</span></p>
<div class="stage">
  <span data-fx="leaf-fall-sway" style="left: 10%; --fx-dur: 8s"><i class="leaf"></i></span>
  <span data-fx="leaf-fall-sway" data-fx-leaf-fall-sway="look: back" style="left: 35%; --fx-dur: 10s; --fx-sway-dur: 6s"><i class="leaf"></i></span>
  <span data-fx="leaf-fall-sway" data-fx-leaf-fall-sway="look: tilt" style="left: 60%; --fx-dur: 9s" data-demo-remove><i class="leaf"></i></span>
  <template data-demo-late><span data-fx="leaf-fall-sway" data-fx-leaf-fall-sway="look: flip" style="left: 80%; --fx-dur: 7s"><i class="leaf"></i></span></template>
</div>
<script src="../fx-core.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
