<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ridge-dissolve — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: fixed; top: 0; left: 0; right: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .hero-in { height: 100vh; display: grid; place-items: center; font-size: 48px; }
  .below .wf-img { height: 124vh; border: 0; background-color: var(--kf-accent); }
  .tail { height: 60vh; background: var(--kf-surface); }
</style>
</head>
<body>
<p class="demo-hint"><b>ridge-dissolve</b> — Scroll down. The area below the Hero tears like a mountain ridge and reveals the photo panel behind it.</p>
<section class="hero" data-fx="ridge-dissolve"><div class="hero-in" data-fx-part="content">Your title here</div></section>
<section class="below"><div class="wf-img" data-label="Trailer scene photo · full-width landscape band"></div></section>
<section class="tail"></section>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script>gsap.registerPlugin(ScrollTrigger);</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
