<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pin-layer-pan — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .sec { display: grid; place-items: center; font: 700 48px/1 var(--kf-font-display); color: var(--kf-dim); }
  .sec.is-wide { width: 200%; }
  .chip { position: absolute; width: 180px; aspect-ratio: 3 / 2; border-radius: var(--kf-radius-md); background: var(--kf-accent-soft); }
  .subject { position: absolute; left: 50%; top: 50%; translate: -50% -50%; width: 280px; height: 280px; border-radius: 50%; background: var(--kf-accent); z-index: 3; }
  .after { height: 80vh; display: grid; place-items: center; color: var(--kf-dim); }
</style>
</head>
<body>
<p class="demo-hint"><b>pin-layer-pan</b> — Scroll down and the screen stays pinned while panels flow sideways, and the center circle stays put. <span style="color:var(--kf-dim)">(After 1s one more panel comes in, and after 2.5s one tile leaves)</span></p>
<div data-fx="pin-layer-pan">
  <div class="sec" data-fx-part="section" data-sec="1">Panel 1</div>
  <div class="sec is-wide" data-fx-part="section" data-sec="2">Panel 2 — double width<span class="chip" style="left: 20%; top: 15%" data-speed=".7"></span><span class="chip" style="left: 60%; bottom: 15%" data-speed="1.3" data-demo-remove></span></div>
  <div class="sec" data-fx-part="section" data-sec="3">Panel 3</div>
  <span class="subject"></span>
</div>
<template data-demo-late><div class="after" data-fx="pin-layer-pan" style="height: 60vh"><div class="sec" data-fx-part="section" data-sec="1">Late panel</div><div class="sec" data-fx-part="section" data-sec="2">Next round</div></div></template>
<div class="after">After the fixing is released</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); window.ScrollTrigger?.refresh(); }, 2500);
</script>
</body>
</html>
