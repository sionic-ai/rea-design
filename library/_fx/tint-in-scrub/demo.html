<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tint-in-scrub — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-spacer { height: 80vh; display: grid; place-items: center; color: var(--kf-dim); }
  .stage { min-height: 900px; padding: 120px 20px; border-top: 1px solid var(--kf-line); text-align: center; }
  .stage h2 { font-size: 32px; margin-bottom: 20px; }
</style>
</head>
<body>
<p class="demo-hint"><b>tint-in-scrub</b> — Scroll down. From the moment a section enters the bottom of the screen the background fills with the accent color, and past halfway the title flips to the background color.</p>
<div class="demo-spacer">Downward</div>
<section class="stage" data-fx="tint-in-scrub" data-fx-tint-in-scrub="color: var(--kf-accent); head: .demo-hint">
  <h2 data-fx-part="flip">Meet the experts section</h2>
  <p data-fx-part="flip">Your one-line lead sentence here.</p>
</section>
<div class="demo-spacer">Bottom margin</div>
<script>
// Late arrivals and removals — checks that fx-core attaches to an element added after 1s and detaches from an element removed after 2.5s
(() => {
  const src = document.querySelector('[data-fx~="tint-in-scrub"]');
  if (!src) return;
  const html = src.outerHTML.replace(/\sid="[^"]*"/g, "");
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => src.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical one comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
