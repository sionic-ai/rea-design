<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>brush-draw-fill — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .gap { height: 90vh; }
  .part { padding: 60px 40px; display: flex; gap: 60px; align-items: flex-start; }
  .part svg { width: 124px; height: auto; }
  .part.dark { background: var(--kf-contrast-bg); color: var(--kf-contrast-ink); }
</style>
</head>
<body>
<p class="demo-hint"><b>brush-draw-fill</b> — Scroll down — vertical brush lettering is drawn as a line, then filled in as a surface. <span style="color:var(--kf-dim)">(One more title comes in after 1s, and one drops out after 2.5s)</span></p>
<div class="gap"></div>
<section class="part">
  <h2 data-fx="brush-draw-fill"><svg viewBox="0 0 124 464"><text x="88" y="4" style="writing-mode:vertical-rl" font-size="50">Worth remembering,</text><text x="30" y="70" style="writing-mode:vertical-rl" font-size="50">There is a day.</text></svg></h2>
  <h2 data-fx="brush-draw-fill" style="--fx-fill: var(--kf-accent)" data-fx-brush-draw-fill="dur: 2; split: .5"><svg viewBox="0 0 62 360"><text x="31" y="2" style="writing-mode:vertical-rl" font-size="46">Wholehearted Hospitality</text></svg></h2>
</section>
<section class="part dark" data-demo-remove>
  <h2 data-fx="brush-draw-fill"><svg viewBox="0 0 80 480"><text x="40" y="2" style="writing-mode:vertical-rl" font-size="58">Exit title</text></svg></h2>
</section>
<span data-late-slot></span>
<section class="part"><h2 data-fx="brush-draw-fill">A title without SVG gets nothing attached</h2></section>
<div class="gap"></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelector("[data-late-slot]").outerHTML = '<section class="part"><h2 data-fx="brush-draw-fill"><svg viewBox="0 0 80 400"><text x="40" y="2" style="writing-mode:vertical-rl" font-size="56">Late-arrived title</text></svg></h2></section>', 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
