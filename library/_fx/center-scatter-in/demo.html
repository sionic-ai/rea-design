<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>center-scatter-in — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .field { display: grid; grid-template-columns: repeat(4, 1fr); gap: 60px 6vw; padding: 40px 6vw; }
  .cell { position: relative; height: 26vh; }
  .cell .wf-img { position: absolute; inset: 0; margin: auto; width: 70%; height: 90%; }
  .cell:nth-child(2n) .wf-img { width: 90%; height: 60%; }
</style>
</head>
<body>
<p class="demo-hint"><b>center-scatter-in</b> On open, photos stack up one by one in the center, then scatter. After 1.5s a Start signal is sent. <span style="color:var(--kf-dim)">(After 1s one more cell comes in, and after 3s one drops out)</span></p>
<div class="field" data-fx="center-scatter-in" data-fx-center-scatter-in="on: demo:go">
  <div class="cell" data-fx-part="item"><span class="wf-img" data-fx-part="media" data-label="Photo 1"></span></div>
  <div class="cell" data-fx-part="item"><span class="wf-img" data-fx-part="media" data-label="Photo 2"></span></div>
  <div class="cell" data-fx-part="item"><span class="wf-img" data-fx-part="media" data-label="Photo 3"></span></div>
  <div class="cell" data-fx-part="item"><span class="wf-img" data-fx-part="media" data-label="Photo 4"></span></div>
  <div class="cell" data-fx-part="item"><span class="wf-img" data-fx-part="media" data-label="Photo 5"></span></div>
  <div class="cell" data-fx-part="item" data-demo-remove><span class="wf-img" data-fx-part="media" data-label="Photo to Be Removed"></span></div>
  <div class="cell" data-fx-part="item"><span class="wf-img" data-fx-part="media" data-label="Photo 7"></span></div>
  <div class="cell" data-fx-part="item"><span class="wf-img" data-fx-part="media" data-label="Photo 8"></span></div>
</div>
<template data-demo-late><div class="field" data-fx="center-scatter-in" data-fx-center-scatter-in="hold: .6"><div class="cell" data-fx-part="item"><span class="wf-img" data-fx-part="media" data-label="Late panel"></span></div><div class="cell" data-fx-part="item"><span class="wf-img" data-label="Slot with no image label"></span></div></div></template>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.dispatchEvent(new Event("demo:go")), 1500);
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 3000);
</script>
</body>
</html>
