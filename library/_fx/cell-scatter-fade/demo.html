<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cell-scatter-fade — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .row { display: flex; gap: 48px; align-items: center; justify-content: center; min-height: 60vh; }
  .row svg { width: 88px; height: 88px; color: var(--kf-ink); }
  button { font: inherit; padding: 8px 16px; border: 1px solid var(--kf-line); border-radius: var(--kf-radius-pill); background: var(--kf-surface); color: var(--kf-ink); cursor: pointer; }
</style>
</head>
<body>
<p class="demo-hint"><b>cell-scatter-fade</b> — On open, the cell logos fade on at different times per cell. Press “Off · On” — the order changes each time it turns off. <span style="color:var(--kf-dim)">(After 1s one more logo comes in, and after 2.5s one drops out)</span></p>
<p style="text-align:center"><button type="button" id="toggle">Off · On</button></p>
<div class="row" id="row">
  <svg data-fx="cell-scatter-fade" viewBox="0 0 44 44" aria-hidden="true"></svg>
  <svg data-fx="cell-scatter-fade" data-fx-cell-scatter-fade="spread: .8; dur: 1.6" viewBox="0 0 44 44" aria-hidden="true"></svg>
  <svg data-fx="cell-scatter-fade" viewBox="0 0 44 44" aria-hidden="true" data-demo-remove></svg>
  <svg data-fx="cell-scatter-fade" viewBox="0 0 44 44" aria-hidden="true" data-empty></svg>
</div>
<script>
  const cells = () => Array.from({ length: 9 }, (_, i) => `<rect data-fx-part="cell" x="${(i % 3) * 16}" y="${Math.floor(i / 3) * 16}" width="12" height="12" rx="2" fill="currentColor"/>`).join("");
  document.querySelectorAll("#row svg:not([data-empty])").forEach((s) => (s.innerHTML = cells()));
</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
  let on = true;
  document.getElementById("toggle").addEventListener("click", () => {
    on = !on;
    document.querySelectorAll('[data-fx~="cell-scatter-fade"]').forEach((s) => s.dispatchEvent(new CustomEvent(on ? "fx:on" : "fx:off")));
  });
  setTimeout(() => { const ns = "http://www.w3.org/2000/svg"; const s = document.createElementNS(ns, "svg"); s.setAttribute("viewBox", "0 0 44 44"); s.setAttribute("data-fx", "cell-scatter-fade"); s.innerHTML = cells(); document.getElementById("row").append(s); }, 1000);
  setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
