<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>focus-grow-column — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 14px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { width: min(720px, 60vw); margin: 30vh 5vw 60vh auto; }
  .demo [data-fx-part="item"] { display: grid; place-items: center; background: var(--kf-raised); color: var(--kf-dim); border: 1px solid var(--kf-line); }
</style>
</head>
<body>
<p class="demo-hint"><b>focus-grow-column</b> — Scroll down and the cells grow as they approach the one-third line from the top of the screen. Focus cell: <b data-out>0</b> <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<div class="demo" data-fx="focus-grow-column" data-fx-focus-grow-column="base: 30">
  <div data-fx-part="item">Figure 1</div><div data-fx-part="item">Figure 2</div><div data-fx-part="item">Figure 3</div><div data-fx-part="item">Figure 4</div><div data-fx-part="item">Figure 5</div><div data-fx-part="item">Figure 6</div>
</div>
<div class="demo" data-fx="focus-grow-column" data-fx-focus-grow-column="base: 10" data-demo-remove><div data-fx-part="item">Being removed soon</div></div>
<template data-demo-late><div class="demo" data-fx="focus-grow-column" data-fx-focus-grow-column="base: 20; side: left; min: .5"><div data-fx-part="item">Late cell · stuck left</div><div data-fx-part="item">Min .5</div></div></template>
<div class="demo" data-fx="focus-grow-column"></div>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
document.addEventListener("fx:focus", (e) => { document.querySelector("[data-out]").textContent = e.detail.index; });
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
