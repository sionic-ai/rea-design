<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sticker-press-btn — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { padding: 48px 20px; display: flex; gap: 16px; flex-wrap: wrap; align-items: center; }
  .demo button { height: 44px; padding: 0 28px; font: 700 15px/1 var(--kf-font-display); letter-spacing: 0.045em; text-transform: uppercase; }
</style>
</head>
<body>
<p class="demo-hint"><b>sticker-press-btn</b> — Hover over the button and press it. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<section class="demo">
  <button data-demo-remove type="button" data-fx="sticker-press-btn">Start</button>
  <button type="button" data-fx="sticker-press-btn">Start</button>
  <button type="button" data-fx="sticker-press-btn" data-fx-sticker-press-btn="look: quiet">Browse</button>
  <template data-demo-late><button type="button" data-fx="sticker-press-btn" style="--fx-lift: 8px; --fx-tilt: 2deg">Higher</button></template>
</section>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
