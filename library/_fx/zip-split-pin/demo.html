<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>zip-split-pin — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .spacer { height: 60vh; display: grid; place-items: center; color: var(--kf-dim); }
  .box { height: 100vh; }
  .box .wf-img { position: absolute; inset: 0; height: 100%; }
  .lid { display: grid; place-items: center; background: var(--kf-contrast-bg); color: var(--kf-contrast-ink); font: 300 48px var(--kf-font-display); }
</style>
</head>
<body>
<p class="demo-hint"><b>zip-split-pin</b> — Scroll down. The screen stays pinned while a zipper opens and the cover splits top and bottom.</p>
<div class="spacer">Downward</div>
<section class="box" data-fx="zip-split-pin">
  <div class="wf-img" data-label="Inner illustration · Full screen"></div>
  <div class="lid" data-fx-part="top">Top cover</div>
  <div class="lid" data-fx-part="bottom">Bottom cover</div>
  <div data-fx-part="zip"><span data-fx-part="chain"></span><span data-fx-part="slider"></span></div>
</section>
<div class="spacer">Footer</div>
<script>
(() => {
  const src = document.querySelector('[data-fx~="zip-split-pin"]');
  const make = (tag) => { const el = src.cloneNode(true); el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => (src.closest(".pin-spacer") || src).after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical section comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
