<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tilted-drop-menu — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { padding: 48px 20px; }
  .demo-spacer { height: 90vh; display: grid; place-items: center; color: var(--kf-dim); }

  .bar { position: fixed; top: 60px; right: 20px; z-index: 106; }
  [data-fx-part="toggle"] { padding: 10px 12px; border: 0; border-radius: 8px; background: var(--kf-surface); font: 600 12px/1 var(--kf-font-display); }
  [data-fx-part="toggle"][aria-expanded="true"] { background: var(--kf-ink); color: var(--kf-bg); }
  [data-fx-part="panel"] a { padding: 6px 0; font: 700 54px/.82 var(--kf-font-display); }
</style>
</head>
<body>
<p class="demo-hint"><b>tilted-drop-menu</b> — Press the Menu button at top right to open and close. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<div data-demo-remove class="bar" style="top:110px" data-fx="tilted-drop-menu"><button data-fx-part="toggle" type="button">Being removed soon</button>
  <nav data-fx-part="panel"><a href="#">Menu 1</a><a href="#">Menu 2</a><a href="#">Inquiry</a></nav></div><div class="bar" data-fx="tilted-drop-menu"><button data-fx-part="toggle" type="button">Menu</button>
  <nav data-fx-part="panel"><a href="#">Menu 1</a><a href="#">Menu 2</a><a href="#">Inquiry</a></nav></div><template data-demo-late><div class="bar" style="top:110px" data-fx="tilted-drop-menu"><button data-fx-part="toggle" type="button">Late-arrived Menu</button>
  <nav data-fx-part="panel"><a href="#">Menu 1</a><a href="#">Menu 2</a><a href="#">Inquiry</a></nav></div></template>
<div class="demo-spacer">Your page content here</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); window.ScrollTrigger?.refresh(); }, 2500);
</script>
</body>
</html>
