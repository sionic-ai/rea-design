<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>arrow-swap-pill — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { margin: 0; padding: 48px; font-family: var(--kf-font-sans); background: var(--kf-bg); color: var(--kf-ink); display: grid; gap: 32px; justify-items: start; }
  .row { display: flex; gap: 24px; align-items: center; flex-wrap: wrap; }
  .dark { padding: 32px; background: var(--kf-contrast-bg); }
</style>
</head>
<body>
  <p class="demo-hint"><b>arrow-swap-pill</b> — Hover over the button — the arrow cell grows again from the left and the right cell shrinks.</p>
  <div class="row" id="row">
    <a data-fx="arrow-swap-pill" href="#"><span data-fx-part="lead"><svg data-fx-part="arrow" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M14 19L21 12L14 5M21 12H2" stroke="currentColor" stroke-width="2"/></svg></span><span data-fx-part="label">See more</span><span data-fx-part="tail"><svg data-fx-part="arrow" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M14 19L21 12L14 5M21 12H2" stroke="currentColor" stroke-width="2"/></svg></span></a>
    <a data-fx="arrow-swap-pill" data-fx-arrow-swap-pill="look: ghost" href="#"><span data-fx-part="lead"><svg data-fx-part="arrow" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M14 19L21 12L14 5M21 12H2" stroke="currentColor" stroke-width="2"/></svg></span><span data-fx-part="label">Outline Button</span><span data-fx-part="tail"><svg data-fx-part="arrow" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M14 19L21 12L14 5M21 12H2" stroke="currentColor" stroke-width="2"/></svg></span></a>
    <a data-fx="arrow-swap-pill" href="#" aria-label="In detail"><span data-fx-part="lead"><svg data-fx-part="arrow" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M14 19L21 12L14 5M21 12H2" stroke="currentColor" stroke-width="2"/></svg></span><span data-fx-part="tail"><svg data-fx-part="arrow" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M14 19L21 12L14 5M21 12H2" stroke="currentColor" stroke-width="2"/></svg></span></a>
  </div>
  <template data-demo-late><a data-fx="arrow-swap-pill" href="#"><span data-fx-part="lead"><svg data-fx-part="arrow" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M14 19L21 12L14 5M21 12H2" stroke="currentColor" stroke-width="2"/></svg></span><span data-fx-part="label">Button that came in after 1s</span><span data-fx-part="tail"><svg data-fx-part="arrow" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M14 19L21 12L14 5M21 12H2" stroke="currentColor" stroke-width="2"/></svg></span></a></template>
  <a data-fx="arrow-swap-pill" data-demo-remove href="#"><span data-fx-part="label">Button that drops out after 2.5s</span></a>
  <div class="dark"><a data-fx="arrow-swap-pill" href="#" style="--fx-bg: var(--kf-contrast-ink); --fx-ink: var(--kf-contrast-bg)"><span data-fx-part="lead"><svg data-fx-part="arrow" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M14 19L21 12L14 5M21 12H2" stroke="currentColor" stroke-width="2"/></svg></span><span data-fx-part="label">On the dark board</span><span data-fx-part="tail"><svg data-fx-part="arrow" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M14 19L21 12L14 5M21 12H2" stroke="currentColor" stroke-width="2"/></svg></span></a></div>
<script src="../fx-core.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
