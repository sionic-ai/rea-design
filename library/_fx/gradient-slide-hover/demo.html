<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gradient-slide-hover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.6 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .col { width: min(540px, 90vw); margin: 60px auto; display: grid; gap: 20px; }
  .col a { display: flex; justify-content: space-between; padding: 24px 32px; border: 1px solid var(--kf-ink); }
  .col .dark { color: var(--kf-on-accent); border: 0; --fx-fill: var(--kf-accent); --fx-rest: var(--kf-ink); }
</style>
</head>
<body>
<p class="demo-hint"><b>gradient-slide-hover</b> — Hover over the button. The fill color slides in from the left in .3s. <span style="color:var(--kf-dim)">(After 1s one more button comes in, and after 2.5s one drops out)</span></p>
<div class="col">
  <a href="#" data-fx="gradient-slide-hover">Your menu line here <span>→</span></a>
  <a href="#" class="dark" data-fx="gradient-slide-hover">Your contact button here <span>→</span></a>
  <a href="#" data-fx="gradient-slide-hover" data-demo-remove>Exit button</a>
  <div data-late-slot></div>
</div>
<script src="../fx-core.js"></script>
<script>
setTimeout(() => document.querySelector("[data-late-slot]").outerHTML = '<a href="#" data-fx="gradient-slide-hover" style="--fx-dur: .6s">Late Button · .6s</a>', 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
