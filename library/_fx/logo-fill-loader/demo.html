<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>logo-fill-loader — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { padding: 48px 20px; display: grid; gap: 24px; }
  .demo-btn { justify-self: start; height: 40px; padding: 0 16px; border: 1px solid var(--kf-line); border-radius: var(--kf-radius-sm); background: var(--kf-surface); color: var(--kf-ink); cursor: pointer; }
  .demo-card { padding: 20px; border: 1px solid var(--kf-line); border-radius: var(--kf-radius-md); background: var(--kf-surface); }
  [data-fx-part="logo"] { width: min(400px, 60vw); }
  [data-fx-part="logo"] svg { display: block; width: 100%; height: auto; font-family: var(--kf-font-display); }
</style>
</head>
<body>
<p class="demo-hint"><b>logo-fill-loader</b> — On open, after 1s the logo fills with ink color from the bottom, and at 3.4s the curtain lifts upward. Press the button to replay with a new loader.</p>
<section class="demo">
  <button class="demo-btn" type="button" id="again">Replay loader</button>
  <div class="demo-card">First body card — appears when the curtain lifts.</div>
  <div class="demo-card">Body second card</div>
</section>
<div data-fx="logo-fill-loader" id="loader" aria-hidden="true">
  <div data-fx-part="logo">
    <svg viewBox="0 0 242 137" fill="currentColor" aria-hidden="true"><g text-anchor="middle">
      <text x="121" y="32" font-size="31" font-weight="600" letter-spacing="10">Four-character name</text>
      <text x="121" y="70" font-size="26" letter-spacing="12">How to Read the Name</text>
      <text x="121" y="98" font-size="17" font-weight="600" letter-spacing="4">ENGLISH NAME</text>
      <text x="121" y="132" font-size="27" font-weight="800" letter-spacing="3">Decorative Font Name</text>
    </g></svg>
  </div>
</div>
<script>
// Late arrivals and removals — checks that fx-core attaches to a loader added after 1s and detaches from a loader removed after 2.5s
(() => {
  const src = document.getElementById("loader");
  if (!src) return;
  const html = src.outerHTML.replace(/\sid="[^"]*"/g, "");
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => src.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.getElementById("again").addEventListener("click", () => document.body.append(make("again")));
  document.addEventListener("fx:done", (e) => e.target.dataset.demo && e.target.remove());
  document.querySelector(".demo-hint").append(" · After 1 second one more loader comes in (a late arrival), and after 2.5 seconds one is removed (detach).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/CustomEase.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
