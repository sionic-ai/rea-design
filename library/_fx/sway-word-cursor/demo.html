<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sway-word-cursor — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .board { height: 70vh; margin: 24px; border: 1px dashed var(--kf-line); border-radius: var(--kf-radius-md); display: grid; place-items: center; color: var(--kf-dim); cursor: grab; }
  .board [data-fx-part="word"] { font-size: 20px; }
</style>
</head>
<body>
<p class="demo-hint"><b>sway-word-cursor</b> — Move the mouse left and right over the dotted-line panel. After 1s the lower panel attaches late, and after 3s parts fall from the upper panel.</p>
<section class="board" data-fx="sway-word-cursor">
  <div data-fx-part="label" aria-hidden="true"><span data-fx-part="word">Drag</span><span data-fx-part="word">to</span><span data-fx-part="word">Discover</span></div>
  Drag-to-view board
</section>
<section class="board" id="late">Late-attaching Board</section>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
  setTimeout(() => {
    const late = document.getElementById("late"), src = document.querySelector('.board[data-fx] [data-fx-part="label"]');
    if (!late || !src) return;
    late.prepend(src.cloneNode(true));
    late.setAttribute("data-fx", "sway-word-cursor");
  }, 1000);
  setTimeout(() => document.querySelector(".board")?.removeAttribute("data-fx"), 3000);
</script>
</body>
</html>
