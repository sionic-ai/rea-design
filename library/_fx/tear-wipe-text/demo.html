<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tear-wipe-text — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { padding: 48px 40px; display: grid; gap: 56px; }
  .demo h2 { font: var(--kf-weight-display) clamp(2.5rem, 7vw, 5.5rem)/.95 var(--kf-font-display); letter-spacing: -.03em; text-transform: uppercase; max-width: 14ch; }
  .demo [data-fx-part="tilt"] { display: inline-block; transform: skewX(-7deg); }
  .demo-btn { justify-self: start; height: 40px; padding: 0 16px; border: 1px solid var(--kf-line); border-radius: var(--kf-radius-sm); background: var(--kf-surface); color: var(--kf-ink); cursor: pointer; }
  .demo-spacer { height: 90vh; display: grid; place-items: center; color: var(--kf-dim); }
</style>
</head>
<body>
<p class="demo-hint"><b>tear-wipe-text</b> — The title tears in from the left and reveals over 2 seconds. Scrolling down, the next title also unravels as it enters the screen. The button eats into the first title and erases it.</p>
<section class="demo">
  <h2 data-fx="tear-wipe-text"><span data-fx-part="tilt" data-skew="-7">Your slanted large headline here, two lines</span></h2>
  <button class="demo-btn" type="button" onclick="document.querySelector('[data-fx~=tear-wipe-text]').dispatchEvent(new CustomEvent('fx:conceal', { detail: .6 }))">Clear first title</button>
</section>
<div class="demo-spacer">Scroll down</div>
<section class="demo">
  <h2 data-fx="tear-wipe-text">Your straight title here</h2>
</section>
<div class="demo-spacer"></div>
<script>
// Late arrivals and removals — checks that fx-core attaches to an element added after 1s and detaches from an element removed after 2.5s
(() => {
  const src = document.querySelector('[data-fx~="tear-wipe-text"]');
  if (!src) return;
  const html = src.outerHTML.replace(/\sid="[^"]*"/g, "");
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => src.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical one comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../../_vendor/three@0.186.0/three.min.js"></script>
<script>gsap.registerPlugin(ScrollTrigger);</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
