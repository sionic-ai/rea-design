<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sticky-clip-swap — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo-spacer { height: 60vh; display: grid; place-items: center; color: var(--kf-dim); }
  .swap { position: relative; background: var(--kf-contrast-bg); color: var(--kf-contrast-ink); transition: background-color 1s ease-in-out; }
  .swap.is-change { background: var(--kf-ink-soft); }
  .stage { position: sticky; top: 0; height: 100vh; overflow: hidden; }
  .stage .box { position: absolute; left: 6%; bottom: 28px; width: 40%; }
  .stage .wf-img { aspect-ratio: 3 / 4; }
  .stage .lab { position: relative; z-index: 2; display: block; margin: -40% 0 0 -24px; writing-mode: vertical-rl; transform: rotate(180deg); font: 400 64px/1 var(--kf-font-display); }
  .copy { position: relative; z-index: 2; width: 45%; margin-left: auto; padding: 0 40px 120px 0; }
  .copy h3 { font: 400 32px/1.4 var(--kf-font-display); }
  .gap { height: 100vh; }
</style>
</head>
<body>
<p class="demo-hint"><b>sticky-clip-swap</b> Scroll down and the second photo fills in from the bottom, the large section name changes, and the text blurs as it passes.</p>
<div class="demo-spacer">Scroll down ↓</div>
<div class="swap" data-fx="sticky-clip-swap">
  <div class="stage">
    <div class="box"><div class="wf-img" data-label="First photo · portrait 3:4"></div><span class="lab" data-fx-part="label-a">FIRST</span></div>
    <div class="box"><div class="wf-img" data-fx-part="reveal" data-label="Second photo · portrait 3:4"></div><span class="lab" data-fx-part="label-b">SECOND</span></div>
  </div>
  <div style="margin-top:-100vh">
    <div class="copy" data-fx-part="fade"><h3>First chapter</h3><p>Your first text goes here in two lines.</p></div>
    <div class="gap"></div>
  </div>
  <div data-fx-part="switch">
    <div class="gap"></div>
    <div class="copy" data-fx-part="fade" data-key="drive"><h3>Second chapter</h3><p>Your second post goes here in two lines.</p></div>
    <div class="gap"></div>
  </div>
</div>
<div class="demo-spacer"></div>
<script>
(() => {
  const src = document.querySelector('[data-fx~="sticky-clip-swap"]');
  const html = src.outerHTML.replace(/\sid="[^"]*"/g, "");
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => src.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical one comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
