<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>twin-column-loop — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .board { height: 80vh; margin: 24px 20px; border: 1px solid var(--kf-line); }
  .blk { display: grid; place-items: center; border-bottom: 1px solid var(--kf-line); background: var(--kf-surface); font: 500 13px var(--kf-font-mono); }
  .blk.is-tone { background: var(--kf-accent-soft); }
  .blk.is-ink { background: var(--kf-contrast-bg); color: var(--kf-contrast-ink); }
</style>
</head>
<body>
<p class="demo-hint"><b>twin-column-loop</b> — Once the lower panel fits fully on screen, roll the wheel over it. The left column goes down and the right column goes up, and they keep gliding after you let go before stopping.</p>
<section class="board" data-fx="twin-column-loop">
  <div data-fx-part="col" data-key="end">
    <div class="blk" style="height:220px">Block 1</div><div class="blk is-tone" style="height:340px">Block 2</div><div class="blk" style="height:180px">Block 3</div><div class="blk is-ink" style="height:260px">Block 4</div><div class="blk is-tone" style="height:300px">Block 5</div>
  </div>
  <div data-fx-part="col">
    <div class="blk is-ink" style="height:280px">Block A</div><div class="blk" style="height:200px">Block B</div><div class="blk is-tone" style="height:320px">Block C</div><div class="blk" style="height:240px">Block D</div><div class="blk is-tone" style="height:260px">Block E</div>
  </div>
</section>
<script>
// Late arrivals and removals — fx-core also attaches to a panel added after 1 second, and checks that a panel removed after 2.5 seconds gets detached
(() => {
  const src = document.querySelector('[data-fx~="twin-column-loop"]');
  const html = src.outerHTML;
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => src.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical panel comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="../../_vendor/virtual-scroll@2.2.1/virtualscroll.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
