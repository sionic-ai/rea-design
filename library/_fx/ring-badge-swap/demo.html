<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ring-badge-swap — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { padding: 48px 20px; display: flex; flex-wrap: wrap; gap: 40px; align-items: center; }
  .badge { color: var(--kf-accent); }
  .badge .disc { position: absolute; width: 76%; aspect-ratio: 1; margin-top: -10px; border-radius: 50%; background: var(--kf-contrast-bg); z-index: -1; }
  .badge [data-fx-part="ring"] text { fill: currentColor; font: 700 12px/1 var(--kf-font-sans); letter-spacing: .12em; }
  .badge [data-fx-part="figure"] { width: 60%; aspect-ratio: 272 / 164; border-radius: 6px; }
  .badge [data-fx-part="icon"] { aspect-ratio: 1; }
  .badge [data-fx-part="icon"] circle { fill: var(--kf-accent); }
  .badge [data-fx-part="icon"] path { fill: var(--kf-contrast-bg); }
</style>
</head>
<body>
<p class="demo-hint"><b>ring-badge-swap</b> — Hover the badge. The center image shrinks while an icon rises and grows. The ring keeps spinning in reverse.</p>
<section class="demo">
  <a class="badge" href="#" data-fx="ring-badge-swap" aria-label="Your contact button here">
    <svg data-fx-part="ring" viewBox="0 0 200 200" aria-hidden="true"><defs><path id="demo-ring" d="M100 100m-84 0a84 84 0 1 1 168 0a84 84 0 1 1-168 0"/></defs><text><textPath href="#demo-ring">Loop text · Brand Name · Contact us here ·</textPath></text></svg>
    <span class="disc" aria-hidden="true"></span>
    <span data-fx-part="body"><span data-fx-part="figure" class="wf-img" data-label="Car cutout"></span><svg data-fx-part="icon" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="16"/><path d="M9 13h14v7H9z"/></svg></span>
  </a>
  <a class="badge" href="#" data-fx="ring-badge-swap" aria-label="Small badge" style="--fx-size: 120px; --fx-grow: 67px; --fx-rise: 28px">
    <svg data-fx-part="ring" viewBox="0 0 200 200" aria-hidden="true"><defs><path id="demo-ring-2" d="M100 100m-84 0a84 84 0 1 1 168 0a84 84 0 1 1-168 0"/></defs><text><textPath href="#demo-ring-2">Loop text · Brand Name · Contact us here ·</textPath></text></svg>
    <span class="disc" aria-hidden="true"></span>
    <span data-fx-part="body"><span data-fx-part="figure" class="wf-img" data-label="Tea"></span><svg data-fx-part="icon" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="16"/><path d="M9 13h14v7H9z"/></svg></span>
  </a>
</section>
<script>
(() => {
  const src = document.querySelector('[data-fx~="ring-badge-swap"]');
  if (!src) return;
  const html = src.outerHTML;
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html.replaceAll("demo-ring", "demo-ring-" + tag); const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => src.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical one comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
</body>
</html>
