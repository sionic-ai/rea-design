<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>frame-dock-video — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { margin: 0; background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: fixed; top: 0; left: 0; right: 0; z-index: 100; margin: 0; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  [data-fx-part="clip"] .wf-img { height: 100%; border: 0; }
  [data-fx-part="follow"] { display: flex; justify-content: center; align-items: center; aspect-ratio: 1920 / 800; color: var(--kf-on-accent); opacity: 0; transition: opacity 1.8s; }
  .is-text [data-fx-part="follow"] { opacity: 1; }
  .rest { display: grid; gap: 24px; max-width: 640px; margin: 0 auto; padding: 80px 20px 120vh; }
  .late { margin-top: 60vh; }
</style>
</head>
<body>
<p class="demo-hint"><b>frame-dock-video</b> Scroll down. The full-screen video panel shrinks into a frame and settles 380px from the top of the screen. Once a full section is scrolled, it attaches to the document.</p>
<section class="hero" data-fx="frame-dock-video">
  <div data-fx-part="clip"><div class="wf-img wf-video" data-fx-part="media" data-label="Video of the month · lanterns in a night alley · landscape 1920:800"></div></div>
  <div data-fx-part="follow">Month name</div>
</section>
<div class="rest"><p>Your next section text here. An essay area that continues below the frame.</p></div>
<script>
// Late arrivals and removals — fx-core also attaches to elements added after 1 second, and checks that it detaches from elements removed after 2.5 seconds (the lower panel is for checking within document flow)
(() => {
  const rest = document.querySelector(".rest");
  const make = (tag) => { const s = document.createElement("section"); s.className = "late"; s.dataset.demo = tag; s.dataset.fxScroller = ""; s.innerHTML = '<div data-fx="frame-dock-video"><div data-fx-part="clip"><div class="wf-img" data-fx-part="media" data-label="' + tag + '"></div></div></div>'; return s; };
  const gone = make("Panel to be removed soon");
  rest.append(gone);
  setTimeout(() => rest.append(make("Late panel")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s one more panel comes in, and after 2.5s one leaves.");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
