<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>logo-dock-scrub — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-contrast-bg); color: var(--kf-contrast-ink); font: 400 15px/1.5 var(--kf-font-sans); min-height: 300vh; }
  .demo-hint { position: relative; z-index: 2; margin-top: 70vh; padding: 12px 20px; background: var(--kf-surface); color: var(--kf-ink); font: 500 13px/1.4 var(--kf-font-mono); }
  .head { position: fixed; inset: 0 0 auto 0; z-index: 10; display: flex; align-items: center; justify-content: center; gap: calc(40px + 200px * var(--fx-dock, 0)); padding: 15px 30px; }
  .slot { display: block; width: 240px; }
  .mark-svg { fill: currentColor; }
</style>
</head>
<body>
<header class="head" data-fx="logo-dock-scrub">
  <a href="#">Menu 1</a><a href="#">Menu 2</a>
  <a class="slot" href="#" data-fx-part="slot"><svg class="mark-svg" viewBox="0 0 400 70"><text x="0" y="56" font-size="64" style="font-family: var(--kf-font-display)">wordmark</text></svg></a>
  <a href="#">Menu 3</a><a href="#">Menu 4</a>
  <figure data-fx-part="mark"><svg class="mark-svg" viewBox="0 0 400 70"><text x="0" y="56" font-size="64" style="font-family: var(--kf-font-display)">wordmark</text></svg></figure>
</header>
<p class="demo-hint"><b>logo-dock-scrub</b> Scroll down. The large wordmark in the center shrinks up to the middle of the header and the menu spreads out. <span style="color:var(--kf-dim)">(After 1s another identical header comes in, and leaves 2.5s later)</span></p>
<template data-demo-late><div data-fx="logo-dock-scrub" data-demo-remove style="position:relative"><span data-fx-part="slot" style="display:block;width:120px"></span><figure data-fx-part="mark"><svg viewBox="0 0 400 70"></svg></figure></div></template>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
gsap.registerPlugin(ScrollTrigger);
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); }, 2500);
</script>
</body>
</html>
