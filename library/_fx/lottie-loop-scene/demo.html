<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lottie-loop-scene — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 101; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .wrap { max-width: 1100px; margin: 40px auto; display: grid; gap: 40px; padding: 0 20px; }
  .ln { fill: none; stroke: var(--kf-dim); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  .hi { fill: none; stroke: var(--kf-ink); stroke-width: 3; stroke-linecap: round; }
  .hd { fill: var(--kf-bg); stroke: var(--kf-dim); stroke-width: 3; stroke-linejoin: round; }
  .dt { fill: var(--kf-accent); }
  [data-fx~="lottie-loop-scene"] { border: 1px solid var(--kf-line); border-radius: 12px; }
  [data-paused] { border-color: var(--kf-accent); }
</style>
</head>
<body>
<p class="demo-hint"><b>lottie-loop-scene</b> — The line drawing runs on a 5s loop. Click the panel to pause, click again to resume. <span style="color:var(--kf-dim)">(1 second later one more panel attaches, and it drops off after 2.5 seconds)</span></p>
<div class="wrap" id="late">
  <div data-fx="lottie-loop-scene" aria-label="Line-art loop demo">
    <svg data-fx-part="art" viewBox="0 0 1920 1080">
      <line class="ln" x1="80" y1="900" x2="1840" y2="900"/>
      <g data-kind="ripple" data-at="0" data-dur="2.5" data-to="260"><circle class="ln" cx="960" cy="520" r="120"/></g>
      <g data-kind="ripple" data-at="2.5" data-dur="2.5" data-to="260"><circle class="ln" cx="960" cy="520" r="120"/></g>
      <g data-kind="sweep" data-dur="2"><path class="hi" d="M 120 520 C 360 360 520 680 760 520"/></g>
      <g data-kind="sweep" data-at="1" data-dur="2"><path class="hi" d="M 1160 520 C 1400 360 1560 680 1800 520"/></g>
      <g data-kind="spin"><rect class="ln" x="1500" y="150" width="120" height="120"/></g>
      <g data-kind="drift" data-from="0,-40"><rect class="ln" x="260" y="160" width="220" height="100"/></g>
      <g data-kind="blink" data-at="0" data-dur="1" data-to="0"><circle class="dt" cx="1700" cy="780" r="16"/></g>
      <g data-kind="sway" data-to="10" data-origin="300,900"><line class="hi" x1="300" y1="900" x2="300" y2="660"/></g>
      <path class="hd" d="M 860 760 C 870 700 840 660 830 600 C 810 480 870 340 1000 330 C 1100 322 1160 380 1168 460 C 1172 500 1172 515 1180 535 L 1205 585 C 1210 592 1205 598 1192 600 L 1195 618 C 1198 626 1192 630 1188 634 L 1192 650 C 1194 672 1180 682 1150 684 C 1120 686 1100 692 1100 720 L 1100 760"/>
      <g data-kind="pulse" data-to="140"><circle class="hi" cx="1010" cy="460" r="30"/></g>
    </svg>
  </div>
</div>
<template data-demo-late><div data-fx="lottie-loop-scene" data-fx-lottie-loop-scene="len: 2; click: none" data-demo-remove><svg data-fx-part="art" viewBox="0 0 800 200"><g data-kind="sweep"><line class="hi" x1="40" y1="100" x2="760" y2="100"/></g></svg></div></template>
<script src="../../_vendor/lottie-web@5.7.14/lottie_svg.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => document.getElementById("late").append(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
