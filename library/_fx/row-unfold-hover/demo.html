<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>row-unfold-hover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.6 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  ul { width: min(1100px, 92vw); margin: 40px auto 60vh; }
  .row { display: grid; grid-template-columns: 2fr 1fr; gap: 24px; padding-top: 16px; border-bottom: 1px solid var(--kf-line); }
  .row .wf-img { aspect-ratio: 16 / 9; }
</style>
</head>
<body>
<p class="demo-hint"><b>row-unfold-hover</b> — Hover over the row. The folded row unfolds to the photo height. <span style="color:var(--kf-dim)">(After 1s one more row comes in, and after 2.5s an empty row drops out)</span></p>
<ul>
  <li><a class="row" data-fx="row-unfold-hover" href="#"><span>Your work name here</span><span class="wf-img" data-label="Work photo · 16:9"></span></a></li>
  <li><a class="row" data-fx="row-unfold-hover" data-demo-remove href="#"></a></li>
  <li><a class="row" data-fx="row-unfold-hover" href="#"><span>Work name two</span><span class="wf-img" data-label="Work photo · 16:9"></span></a></li>
  <li data-late-slot></li>
</ul>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelector("[data-late-slot]").innerHTML = '<a class="row" data-fx="row-unfold-hover" data-fx-row-unfold-hover="closed: 120; dur: .6" href="#"><span>Late line · 120px</span><span class="wf-img" data-label="Work photo · 16:9"></span></a>', 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
