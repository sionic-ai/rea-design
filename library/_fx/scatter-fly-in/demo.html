<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>scatter-fly-in — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); overflow-x: hidden; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-spacer { height: 90vh; display: grid; place-items: center; color: var(--kf-dim); }
  .cards { display: flex; justify-content: center; gap: 0; padding: 80px 20px; }
  .cards a { display: grid; place-items: center; width: 220px; height: 170px; margin-left: -30px; border: 2px solid var(--kf-ink); border-radius: var(--kf-radius-md); background: var(--kf-surface); rotate: -4deg; }
  .cards a:nth-child(even) { background: var(--kf-accent); rotate: 5deg; }
  .cards .s { width: 40px; height: 40px; border-radius: 50%; background: var(--kf-accent-soft); }
</style>
</head>
<body>
<p class="demo-hint"><b>scatter-fly-in</b> — The first row appears immediately, for the rows below, cards fly in from scattered spots and stack as you scroll.</p>
<section class="cards" data-fx="scatter-fly-in" data-fx-scatter-fly-in="on: load; delay: .3"><a data-fx-part="item" href="#">Card 1</a><a data-fx-part="item" href="#">Card 2</a><a data-fx-part="item" href="#">Card 3</a><a data-fx-part="item" href="#">Card 4</a><span class="s" data-fx-part="after"></span></section>
<div class="demo-spacer">Scroll down</div>
<section class="cards" data-fx="scatter-fly-in" data-fx-scatter-fly-in="x: 500; y: 300"><a data-fx-part="item" href="#">Table 1</a><a data-fx-part="item" href="#">Table 2</a><a data-fx-part="item" href="#">Table 3</a></section>
<div class="demo-spacer"></div>
<script>
(() => {
  const src = document.querySelector('[data-fx~="scatter-fly-in"]');
  const html = src.outerHTML;
  const make = () => { const t = document.createElement("template"); t.innerHTML = html; return t.content.firstElementChild; };
  const gone = make(); src.after(gone);
  setTimeout(() => src.after(make()), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s one more of the same comes in, and after 2.5s one drops out.");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
