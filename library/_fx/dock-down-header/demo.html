<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dock-down-header — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .bar { display: flex; justify-content: space-between; align-items: center; height: 72px; padding: 0 32px; }
  .hero { height: 100vh; }
  .hero .wf-img { height: 100%; }
  .long { height: 200vh; padding: 40px; }
</style>
</head>
<body>
<p class="demo-hint"><b>dock-down-header</b> — Scroll down past 600px. The header drops in from the top and sticks. Scroll back up and it slides away upward.</p>
<header data-fx="dock-down-header" data-fx-dock-down-header="after: 600"><div class="bar"><b>Logo</b><nav>Menu 1 · Menu 2 · Menu 3</nav></div></header>
<section class="hero"><div class="wf-img" data-label="Hero photo · full width"></div></section>
<section class="long">Your long body text here</section>
<script>
(() => {
  const src = document.querySelector('[data-fx~="dock-down-header"]');
  if (!src) return;
  const html = src.outerHTML;
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; el.style.top = "80px"; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => src.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical one comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
