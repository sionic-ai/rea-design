<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>inset-open-pin — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .gap { height: 60vh; display: grid; place-items: center; color: var(--kf-dim); }
  .scr { background: var(--kf-accent-soft); display: grid; place-items: center; font: 600 28px/1 var(--kf-font-mono); }
  .fr i { position: absolute; width: 22px; height: 22px; border: 2px solid var(--kf-ink); }
  .fr i:nth-child(1) { top: 0; left: 0; border-right: 0; border-bottom: 0; } .fr i:nth-child(2) { top: 0; right: 0; border-left: 0; border-bottom: 0; }
  .fr i:nth-child(3) { bottom: 0; left: 0; border-right: 0; border-top: 0; } .fr i:nth-child(4) { bottom: 0; right: 0; border-left: 0; border-top: 0; }
  .hd { position: absolute; top: 12%; left: 6%; z-index: 2; font: 700 40px/1 var(--kf-font-display); }
</style>
</head>
<body>
<p class="demo-hint"><b>inset-open-pin</b> — Scroll down. A small window opens to fill the screen and top and bottom bars close at the end.</p>
<div class="gap">↓</div>
<section data-fx="inset-open-pin"><div data-fx-part="stage"><i data-fx-part="wall"></i><div class="hd" data-fx-part="head">Your title here</div><div class="scr" data-fx-part="screen">Video slot</div><i data-fx-part="band" data-key="top"></i><i data-fx-part="band" data-key="bottom"></i><div class="fr" data-fx-part="frame"><i></i><i></i><i></i><i></i></div></div></section>
<div class="gap">Footer</div>
<section data-demo-remove data-fx="inset-open-pin"><div data-fx-part="stage"><div class="scr" data-fx-part="screen">Erase</div></div></section>
<template data-demo-late><section data-fx="inset-open-pin" data-fx-inset-open-pin="from: 20; to: 0; end: +=80%"><div data-fx-part="stage"><div class="scr" data-fx-part="screen">Late section</div></div></section></template>
<section data-fx="inset-open-pin"><div data-fx-part="stage"></div></section>
<div class="gap"></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
