<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>paper-unfold-card — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); min-height: 100vh; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { display: flex; gap: 40px; flex-wrap: wrap; padding: 80px 24px; }
  .card { width: 21.5rem; }
  .card [data-fx-part="content"] { padding: 1.25rem 1.25rem 1rem; }
  .card h2 { margin: 0 0 .45rem; font: 700 1.5rem/1 var(--kf-font-display); }
  .card p { margin: 0 0 .6rem; color: var(--kf-dim); font-size: .875rem; }
  .card button { position: absolute; top: .7rem; right: .7rem; border: 0; background: none; color: var(--kf-dim); cursor: pointer; }
  .again { padding: 8px 14px; border: 1px solid var(--kf-line); background: var(--kf-surface); cursor: pointer; }
</style>
</head>
<body>
<p class="demo-hint"><b>paper-unfold-card</b> — The card sits folded, then unfolds. Close (×) or Esc folds it away. “Again” brings up a new card.</p>
<main class="demo">
  <section class="card" data-fx="paper-unfold-card" tabindex="-1"><div data-fx-part="content"><button type="button" data-fx-part="close" aria-label="Close">×</button><p>Newsletter</p><h2>Your title here</h2><p>Your two-line description here. Sent only a few times a year.</p><p>You can cancel anytime.</p></div></section>
  <button type="button" class="again">Again</button>
</main>
<script>
// Check that a card arriving late after 1s also expands, and that when a closed card is removed after fx:closed the detach runs
(() => {
  const main = document.querySelector(".demo"), src = document.querySelector(".card").outerHTML;
  const add = () => { const t = document.createElement("template"); t.innerHTML = src; main.prepend(t.content.firstElementChild); };
  setTimeout(add, 1000);
  document.querySelector(".again").addEventListener("click", add);
  main.addEventListener("fx:closed", (e) => e.target.remove());
})();
</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
