<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>drift-follow — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { display: flex; flex-wrap: wrap; gap: 48px; padding: 64px 40px; }
  .item { position: relative; display: block; width: 220px; }
  .blob { aspect-ratio: 1 / 1.1; border-radius: 46% 54% 42% 58% / 52% 40% 60% 48%; overflow: hidden; background: var(--kf-accent); }
  .blob .wf-img { height: 100%; border: 0; opacity: 0.6; }
  .tag { position: absolute; top: 20px; right: -10px; z-index: 2; padding: 10px 14px; border-radius: var(--kf-radius-md); background: var(--kf-surface); transform: translate3d(calc(var(--fx-follow-x, 0px) * 0.45), calc(var(--fx-follow-y, 0px) * 0.45), 0); }
</style>
</head>
<body>
<p class="demo-hint"><b>drift-follow</b> — Left alone it drifts slowly, and when you hover and move the mouse it follows toward the cursor (the name tag follows at .45x). <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<section class="demo">
  <a class="item" href="#" data-demo-remove><span class="tag">Name tag</span><div data-fx="drift-follow" data-fx-drift-follow="area: a"><div class="blob"><div data-fx-part="inner" class="wf-img" data-label="Photo"></div></div></div></a>
  <a class="item" href="#"><span class="tag">Name tag</span><div data-fx="drift-follow" data-fx-drift-follow="area: a; follow: 30"><div class="blob"><div data-fx-part="inner" class="wf-img" data-label="Follows 30px further"></div></div></div></a>
  <div class="item"><div data-fx="drift-follow" data-fx-drift-follow="follow: 0; min: 4; max: 8; dur: 20"><div class="blob"></div></div></div>
  <template data-demo-late><a class="item" href="#"><span class="tag">Late</span><div data-fx="drift-follow" data-fx-drift-follow="area: a"><div class="blob"><div data-fx-part="inner" class="wf-img" data-label="Enters late"></div></div></div></a></template>
</section>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
