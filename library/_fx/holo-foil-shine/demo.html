<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>holo-foil-shine — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { display: flex; flex-wrap: wrap; justify-content: center; gap: 60px; padding: 100px 20px; }
  .demo .rim { fill: var(--kf-surface); stroke: var(--kf-surface); stroke-width: 10px; }
  .demo .gloss { mix-blend-mode: soft-light; opacity: .9; }
</style>
</head>
<body>
<p class="demo-hint"><b>holo-foil-shine</b> — Move the mouse over the badge. The gold foil pattern and sheen slide toward the cursor (without a mouse it sways on its own).</p>
<section class="demo">
  <span data-fx="holo-foil-shine"><svg viewBox="0 0 120 120" width="160" height="160"><defs>
    <linearGradient id="d1-f" data-fx-part="foil" gradientUnits="userSpaceOnUse" spreadMethod="reflect" x1="0" y1="0" x2="72" y2="72"><stop offset="0" style="stop-color:var(--kf-accent)"/><stop offset=".33" style="stop-color:var(--kf-accent-soft)"/><stop offset=".66" style="stop-color:var(--kf-surface)"/><stop offset="1" style="stop-color:var(--kf-accent)"/></linearGradient>
    <radialGradient id="d1-s" data-fx-part="shine" gradientUnits="userSpaceOnUse" cx="60" cy="60" r="54"><stop offset="0" style="stop-color:var(--kf-surface);stop-opacity:.95"/><stop offset="1" style="stop-color:var(--kf-surface);stop-opacity:0"/></radialGradient></defs>
    <circle class="rim" cx="60" cy="60" r="52"/><circle cx="60" cy="60" r="52" style="fill:url(#d1-f)"/><circle class="gloss" cx="60" cy="60" r="52" style="fill:url(#d1-s)"/></svg></span>
</section>
<script>
(() => {
  const src = document.querySelector('[data-fx~="holo-foil-shine"]');
  if (!src) return;
  const make = (tag, n) => { const t = document.createElement("template"); t.innerHTML = src.outerHTML.replace(/d1-/g, `d${n}-`); const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone", 2);
  src.after(gone);
  setTimeout(() => src.after(make("late", 3)), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1 second one more badge comes in (a late arrival), and after 2.5 seconds one is removed (detach).");
})();
</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
