<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>stepped-brush-title — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { display: grid; gap: 60px; padding: 60px 20px; max-width: 1000px; margin: 0 auto; }
  .demo h2 { font: 400 72px/1.05 var(--kf-font-display); }
  .demo button { justify-self: start; padding: 8px 14px; border: 1px solid var(--kf-line); background: var(--kf-surface); cursor: pointer; }
</style>
</head>
<body>
<p class="demo-hint"><b>stepped-brush-title</b> — On open, the title is painted with brush strokes. Use the button below to erase and repaint it. <span style="color:var(--kf-dim)">(One more title comes in after 1s, and one drops out after 2.5s)</span></p>
<section class="demo">
  <h2 data-fx="stepped-brush-title" id="a">A title set<br>across two lines</h2>
  <button type="button" onclick="a.dispatchEvent(new Event(a.dataset.out ? 'fx:play' : 'fx:out')); a.dataset.out = a.dataset.out ? '' : '1'">Erase / Repaint</button>
  <h2 data-fx="stepped-brush-title" data-fx-stepped-brush-title="shift: 15; dur: .8">Your two-line title goes here</h2>
  <h2 data-fx="stepped-brush-title" data-demo-remove>Soon-Removed Title</h2>
  <template data-demo-late><h2 data-fx="stepped-brush-title"></h2></template>
</section>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
