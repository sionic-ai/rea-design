<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>margin-dot-field — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-col { width: min(720px, calc(100% - 120px)); margin: 40px auto; height: 460px; border-inline: 1px solid var(--kf-line); padding: 24px; }
</style>
</head>
<body>
<p class="demo-hint"><b>margin-dot-field</b> — Move the mouse over the margins on both sides of the center column and press the margin. Dots light up green and a ripple spreads.</p>
<div class="demo-col" data-fx="margin-dot-field"><p>Center body column — dots appear only in the outer margins.</p></div>
<div class="demo-col" data-fx="margin-dot-field" data-fx-margin-dot-field="look: full; pitch: 18" style="height:300px"><p>look: full — entire sheet</p></div>
<script>
(() => {
  const src = document.querySelector('[data-fx~="margin-dot-field"]');
  const make = (tag) => { const el = src.cloneNode(true); el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => src.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
