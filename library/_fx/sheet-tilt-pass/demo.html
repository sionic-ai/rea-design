<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sheet-tilt-pass — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-contrast-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); overflow-x: clip; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-spacer { height: 90vh; display: grid; place-items: center; color: var(--kf-contrast-ink); }
  .sheet { min-height: 140vh; padding: 60px 40px; background: var(--kf-bg); color: var(--kf-ink); }
  .sheet h2 { margin: 0; font: var(--kf-weight-display) clamp(40px, 6vw, 88px)/0.9 var(--kf-font-display); }
</style>
</head>
<body>
<p class="demo-hint"><b>sheet-tilt-pass</b> Scroll down and a paper sheet enters small and tilted, straightens up, then tilts the opposite way and shrinks as it passes. <span>(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<div class="demo-spacer">Scroll down</div>
<section class="sheet" data-fx="sheet-tilt-pass"><h2>Your section title here</h2><p>Your body copy goes here</p></section>
<div class="demo-spacer"></div>
<section class="sheet" data-demo-remove data-fx="sheet-tilt-pass" data-fx-sheet-tilt-pass="rot: 4; shrink: .1"><h2>Omitted sheet</h2></section>
<template data-demo-late><section class="sheet" data-fx="sheet-tilt-pass" data-fx-sheet-tilt-pass="out: off"><h2>Late-arrived Sheet</h2></section></template>
<div class="demo-spacer"></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); window.ScrollTrigger?.refresh(); }, 2500);
</script>
</body>
</html>
