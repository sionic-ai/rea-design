<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bounce-drift — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .stage { position: relative; height: 70vh; margin: 32px 20px; border: 1px solid var(--kf-line); border-radius: var(--kf-radius-lg); overflow: hidden; }
  .card { position: absolute; top: 0; left: 0; display: flex; gap: 8px; align-items: center; padding: 8px 12px 8px 8px; min-width: 200px; background: var(--kf-surface); color: var(--kf-ink); text-decoration: none; border-radius: var(--kf-radius-sm); box-shadow: var(--kf-shadow-soft); }
  .card i { width: 48px; height: 48px; background: var(--kf-raised); border-radius: var(--kf-radius-sm); }
</style>
</head>
<body>
<p class="demo-hint"><b>bounce-drift</b> Cards float inside the panel and bounce off the walls. Hover over a card and it glides to a stop. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<section class="stage">
  <a class="card" href="#" data-demo-remove data-fx="bounce-drift" data-fx-bounce-drift="within: parent; x: 120; y: 80"><i></i>Your work name here</a>
  <a class="card" href="#" data-fx="bounce-drift" data-fx-bounce-drift="within: parent; x: 400; y: 40; vx: 1.6; vy: 1.2"><i></i>Quick card</a>
  <template data-demo-late><a class="card" href="#" data-fx="bounce-drift" data-fx-bounce-drift="within: parent; x: 20; y: 200"><i></i>Late-arriving card</a></template>
</section>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); window.ScrollTrigger?.refresh(); }, 2500);
</script>
</body>
</html>
