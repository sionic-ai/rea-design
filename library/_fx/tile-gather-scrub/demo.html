<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tile-gather-scrub — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: sticky; top: 0; z-index: 10; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-pin { height: 400vh; }
  .demo-stage { position: sticky; top: 0; height: 100vh; display: grid; place-items: end center; padding-bottom: 12vh; overflow: hidden; }
  .demo-frame { width: 40%; aspect-ratio: 16 / 9; }
  .demo-frame .wf-img { position: absolute; inset: 0; height: 100%; }
  .demo-pad { height: 60vh; display: grid; place-items: center; }
</style>
</head>
<body>
<p class="demo-hint"><b>tile-gather-scrub</b> — Scattered pieces fly in and float. Scrolling down joins them into one sheet and the panel widens.</p>
<section class="demo-pin" data-fx="tile-gather-scrub"><div class="demo-stage"><div class="demo-frame" data-fx-part="frame"><div class="wf-img" data-fx-part="image" data-label="Moss-covered rock photo · 16:9"></div></div></div></section>
<div class="demo-pad">Footer</div>
<section class="demo-pin" data-fx="tile-gather-scrub" data-fx-tile-gather-scrub="cols: 4; rows: 3; widen: off" data-demo-remove><div class="demo-stage"><div class="demo-frame" data-fx-part="frame"><div class="wf-img" data-fx-part="image" data-label="Panel to Be Removed"></div></div></div></section>
<template data-demo-late><section class="demo-pin" data-fx="tile-gather-scrub" data-fx-tile-gather-scrub="cols: 5; rows: 4; intro: 1"><div class="demo-stage"><div class="demo-frame" data-fx-part="frame"><div class="wf-img" data-fx-part="image" data-label="Late panel"></div></div></div></section></template>
<section data-fx="tile-gather-scrub"></section>
<div class="demo-pad">Footer</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../../../_shared/vendor/gsap/CustomEase.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
