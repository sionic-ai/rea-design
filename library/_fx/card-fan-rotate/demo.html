<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>card-fan-rotate — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { padding: 48px 20px; }
  .demo-spacer { height: 90vh; display: grid; place-items: center; color: var(--kf-dim); }
  .fan { height: 420px; margin: 30px auto; max-width: 600px; }
  .fan [data-fx-part="card"] { width: 220px; height: 360px; border-radius: 40px; background: var(--kf-accent); color: var(--kf-surface); display: grid; place-items: center; font: 700 48px/1 var(--kf-font-display); }
  .fan [data-fx-part="card"]:nth-child(2) { background: var(--kf-ink); } .fan [data-fx-part="card"]:nth-child(3) { background: var(--kf-dim); }
  .fan button { position: absolute; top: 50%; z-index: 9; width: 48px; height: 48px; border-radius: 50%; border: 0; background: var(--kf-surface); font-size: 24px; }
  .fan [data-fx-part="prev"] { left: 0; } .fan [data-fx-part="next"] { right: 0; }
</style>
</head>
<body>
<p class="demo-hint"><b>card-fan-rotate</b> — Press the side buttons and the card positions rotate one step at a time. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<section class="demo"><div class="fan" data-demo-remove data-fx="card-fan-rotate"><ul><li data-fx-part="card">1</li><li data-fx-part="card">2</li><li data-fx-part="card">3</li><li data-fx-part="card">4</li></ul><button data-fx-part="prev" aria-label="Previous">‹</button><button data-fx-part="next" aria-label="Next">›</button></div><div class="fan" data-fx="card-fan-rotate" style="--fx-angle: 8deg"><ul><li data-fx-part="card">1</li><li data-fx-part="card">2</li><li data-fx-part="card">3</li><li data-fx-part="card">4</li></ul><button data-fx-part="prev" aria-label="Previous">‹</button><button data-fx-part="next" aria-label="Next">›</button></div><template data-demo-late><div class="fan" data-fx="card-fan-rotate"><ul><li data-fx-part="card">1</li><li data-fx-part="card">2</li><li data-fx-part="card">3</li><li data-fx-part="card">4</li></ul></div></template><div data-fx="card-fan-rotate"></div></section>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); window.ScrollTrigger?.refresh(); }, 2500);
</script>
</body>
</html>
