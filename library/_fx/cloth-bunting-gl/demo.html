<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cloth-bunting-gl — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 50; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .sky { position: relative; height: 70vh; overflow: hidden; background: var(--kf-surface); }
  .sky canvas { position: absolute; top: 0; }
  .l { left: 0; width: 46vw; height: 24vw; }
  .r { right: 0; width: 46vw; height: 24vw; }
  .m { left: 25vw; top: 30vh !important; width: 50vw; height: 14vw; }
</style>
</head>
<body>
<p class="demo-hint"><b>cloth-bunting-gl</b> — Move the mouse across the flag. The cloth is pushed away, then flutters back in the wind. <span style="color:var(--kf-dim)">(After 1s one more line comes in, and one leaves 2.5s later)</span></p>
<div class="sky">
  <canvas class="l" data-fx="cloth-bunting-gl" data-fx-cloth-bunting-gl="start: 85 -8; end: -7 62; count: 11"></canvas>
  <canvas class="r" data-fx="cloth-bunting-gl" data-fx-cloth-bunting-gl="start: 15 -8; end: 107 62; count: 11; offset: 3; delay: .07" data-demo-remove></canvas>
  <template data-demo-late><canvas class="m" data-fx="cloth-bunting-gl" data-fx-cloth-bunting-gl="start: 0 0; end: 100 10; count: 9; flag: 4.5"></canvas></template>
</div>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
