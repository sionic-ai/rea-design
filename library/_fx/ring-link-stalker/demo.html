<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ring-link-stalker — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .grid { display: grid; grid-template-columns: repeat(3, 260px); gap: 24px; margin: 30px 20px; }
  .grid a { display: block; }
  .grid .wf-img { aspect-ratio: 4 / 3; }
</style>
</head>
<body>
<p class="demo-hint"><b>ring-link-stalker</b> — Hover over a photo. The ring follows late and lights up only over the photo. (After 1s one more photo comes in and after 2.5s one is removed)</p>
<main data-fx="ring-link-stalker">
  <div class="grid" data-demo-row>
    <a href="#a" data-fx-part="target"><div class="wf-img" data-label="Photo 1"></div></a>
    <a href="#b" data-fx-part="target"><div class="wf-img" data-label="Photo 2"></div></a>
    <a href="#c" data-fx-part="target" data-demo-remove><div class="wf-img" data-label="Photo to Be Removed"></div></a>
  </div>
</main>
<section data-fx="ring-link-stalker" style="--fx-ring: var(--kf-ink)"><p style="margin:20px">Empty slate — stays quiet even without a link</p></section>
<template data-demo-late><a href="#d" data-fx-part="target"><div class="wf-img" data-label="Late-arrived Photo"></div></a></template>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => (document.querySelector(".grid") || document.body).append(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
