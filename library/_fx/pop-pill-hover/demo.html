<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pop-pill-hover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { padding: 48px 20px; }
  .demo-spacer { height: 90vh; display: grid; place-items: center; color: var(--kf-dim); }
  .big { margin: 0 0 40px; font: 900 64px/1.3 var(--kf-font-display); color: var(--kf-accent); }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin: 0 0 80px; }
  .grid li { height: 200px; border-radius: 16px; background: var(--kf-surface); border: 1px solid var(--kf-line); }
  .wave { height: 420px; margin: 0 0 40px; }
</style>
</head>
<body>
<p class="demo-hint"><b>pop-pill-hover</b> — Hover over the white pill button. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<section class="demo"><p style="display:flex;gap:30px;flex-wrap:wrap"><a href="#" data-demo-remove data-fx="pop-pill-hover"><svg data-fx-part="shape"><rect rx="30" ry="30"/></svg><span>Your button text here</span></a><a href="#" data-fx="pop-pill-hover" style="--fx-pop:1.06"><svg data-fx-part="shape"><rect rx="30" ry="30"/></svg><span>Button that grows slightly</span></a><template data-demo-late><a href="#" data-fx="pop-pill-hover"><svg data-fx-part="shape"><rect rx="30" ry="30"/></svg><span>Late-arriving button</span></a></template><a href="#" data-fx="pop-pill-hover"><span>Button with no background image</span></a></p></section>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); window.ScrollTrigger?.refresh(); }, 2500);
</script>
</body>
</html>
