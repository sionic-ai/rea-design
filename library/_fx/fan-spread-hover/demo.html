<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fan-spread-hover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 24px; padding: 48px 20px; }
  .demo-card { display: flex; flex-direction: column; justify-content: space-between; aspect-ratio: 1 / 1.34; padding: 20px 16px 16px; border-radius: var(--kf-radius-lg); background: var(--kf-surface); }
  .demo-card h3 { font: 500 20px/1.1 var(--kf-font-display); }
  .demo-card [data-fx-part="stack"] { flex: 1; }
  .demo-card [data-fx-part="item"] { display: grid; place-items: center; font-size: 11px; color: var(--kf-dim); }
</style>
</head>
<body>
<p class="demo-hint"><b>fan-spread-hover</b> — Hover over the card. The stacked photos fan out with double the spacing and opposite rotation (.9s bounce).</p>
<section class="demo">
  <article class="demo-card" data-fx="fan-spread-hover"><h3>Your bundle title here</h3><div data-fx-part="stack"><div data-fx-part="item">Photo 1</div><div data-fx-part="item">Photo 2</div><div data-fx-part="item">Photo 3</div></div><small>Bundle</small></article>
  <article class="demo-card" data-fx="fan-spread-hover" style="--fx-open-rotate: -8deg"><h3>Group that twists more</h3><div data-fx-part="stack"><div data-fx-part="item">Photo 1</div><div data-fx-part="item">Photo 2</div><div data-fx-part="item">Photo 3</div><div data-fx-part="item">Photo 4</div></div><small>--fx-open-rotate: -8deg</small></article>
</section>
<script>
// Late arrivals and removals — a CSS-only motion part, so it applies as-is to late arrivals, and nothing is left behind from removed ones
(() => {
  const src = document.querySelector('[data-fx~="fan-spread-hover"]');
  if (!src) return;
  const make = (tag) => { const el = src.cloneNode(true); el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => src.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical one comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
</body>
</html>
