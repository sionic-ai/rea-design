<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>feather-mask-sweep — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .stage { position: relative; height: 70vh; margin: 40px 20px; overflow: hidden; background: var(--kf-accent); border-radius: var(--kf-radius-md); }
  .band { position: absolute; left: 0; right: 0; bottom: 0; height: 60%; background: linear-gradient(var(--kf-surface), color-mix(in srgb, var(--kf-surface) 40%, transparent)); }
  .again { margin: 0 20px 80px; }
</style>
</head>
<body>
<p class="demo-hint"><b>feather-mask-sweep</b> — On open, a white band is drawn from the left, trailing a smeared edge. Replay it with the button.</p>
<div class="stage"><div class="band" data-fx="feather-mask-sweep"></div></div>
<button class="again wf-btn" type="button">Sweep again (fx:sweep)</button>
<script>
document.querySelector(".again").addEventListener("click", () => document.querySelectorAll('[data-fx~="feather-mask-sweep"]').forEach((el) => el.dispatchEvent(new Event("fx:sweep"))));
// Late arrivals and removals — checks that fx-core attaches to an element added after 1s and detaches from an element removed after 2.5s
(() => {
  const host = document.querySelector(".stage");
  if (!host) return;
  const html = host.outerHTML;
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  host.after(gone);
  setTimeout(() => host.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical one comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
