<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hero-cue-intro — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .stage { position: relative; height: 70vh; margin: 20px; overflow: hidden; border: 1px solid var(--kf-line); }
  .bar { position: absolute; left: 0; width: 100%; display: flex; justify-content: space-between; padding: 14px 20px; background: var(--kf-surface); }
  .bar.is-top { top: 0; }
  .bar.is-bottom { bottom: 0; }
  .bg { position: absolute; inset: 0; background: linear-gradient(135deg, var(--kf-accent-soft), var(--kf-accent)); }
  .logo { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); font: 700 40px/1 var(--kf-font-display); letter-spacing: 0.4em; color: var(--kf-on-accent); }
  .replay { margin: 0 20px; }
</style>
</head>
<body>
<p class="demo-hint"><b>hero-cue-intro</b> — When opened: background → logo → top header line and bottom text line turn on in turn. <span style="color:var(--kf-dim)">(After 1s one more panel comes in, and one leaves 2.5s later)</span></p>
<button class="replay" type="button">View again</button>
<section class="stage" data-fx="hero-cue-intro">
  <div class="bg" data-fx-part="bg"></div>
  <div class="bar is-top" data-fx-part="top"><span>Menu 1 · Menu 2 · Menu 3</span><span>Icon</span></div>
  <div class="logo" data-fx-part="logo">LOGO</div>
  <div class="bar is-bottom" data-fx-part="bottom"><span>with cats &amp; dogs</span><span>scroll</span></div>
</section>
<section class="stage" data-demo-remove data-fx="hero-cue-intro" data-fx-hero-cue-intro="bg-dur: 0.6; logo-at: 0.3; bar-at: 0.4">
  <div class="bg" data-fx-part="bg"></div>
  <div class="logo" data-fx-part="logo">QUICK</div>
</section>
<template data-demo-late><section class="stage" data-fx="hero-cue-intro" data-fx-hero-cue-intro="slide: power3.out; top-dur: 0.8"><div class="bg" data-fx-part="bg"></div><div class="bar is-top" data-fx-part="top"><span>Late-arriving panel</span></div><div class="logo" data-fx-part="logo">LATE</div></section></template>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/CustomEase.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
document.querySelector(".replay").addEventListener("click", () => {
  const s = document.querySelector(".stage");
  const v = s.getAttribute("data-fx");
  s.setAttribute("data-fx", "");
  requestAnimationFrame(() => s.setAttribute("data-fx", v));
});
</script>
</body>
</html>
