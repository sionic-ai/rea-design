<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>edge-peel-scroll — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 3; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .stage { position: relative; width: 380px; margin: 60px auto; }
  .card { height: 520px; border: 6px solid var(--kf-accent); border-radius: 60px; background: var(--kf-surface); display: grid; place-items: center; font-weight: 700; }
  .piece { position: absolute; width: 70px; height: 80px; border-radius: 45% 55% 30% 30%; background: var(--kf-ink); }
  .gap { height: 150vh; }
</style>
</head>
<body>
<p class="demo-hint"><b>edge-peel-scroll</b> — After 1.2 seconds the pieces attach, and if you scroll down a little the pieces move outward and hide. Scroll back to the top and they return. <span style="color:var(--kf-dim)">(One more piece comes in after 1s, and one drops out after 2.5s)</span></p>
<div class="stage" id="stage" data-fx="edge-peel-scroll" data-fx-edge-peel-scroll="enter: 1.2">
  <div class="card">Your first card here</div>
  <i class="piece" data-fx-part="piece" style="left: -20px; top: -10px; --fx-out: translate(-108px, -12px) rotate(-90deg)"></i>
  <i class="piece" data-fx-part="piece" style="right: -20px; top: 40px; --fx-out: translate(96px, -12px) rotate(20deg)"></i>
  <i class="piece" data-fx-part="piece" style="left: -26px; top: 260px; --fx-out: translate(-108px, 6px) rotate(-90deg)" data-demo-remove></i>
  <i class="piece" data-fx-part="piece" style="right: -24px; top: 440px; --fx-out: translate(96px, 12px) rotate(20deg)"></i>
</div>
<template data-demo-late><div class="stage" data-fx="edge-peel-scroll"><div class="card">Late-arriving card</div><i class="piece" data-fx-part="piece" style="left: -20px; top: 20px; --fx-out: translate(-108px, 0) rotate(-90deg)"></i></div></template>
<div class="gap"></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
