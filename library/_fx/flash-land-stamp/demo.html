<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>flash-land-stamp — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { margin: 0; padding: 40px; font-family: var(--kf-font-sans); background: var(--kf-bg); color: var(--kf-ink); display: grid; gap: 70vh; }
  article { display: grid; grid-template-columns: 1fr 1.1fr; gap: 32px; align-items: center; padding: 24px; border: 1px solid var(--kf-line); background: var(--kf-surface); }
  h3 { position: relative; width: fit-content; font-size: 32px; margin: 0; }
  h3 [data-fx-part="stamp"] { right: -2em; bottom: -0.9em; font-size: 0.55em; }
  [data-fx-part="media"] { display: block; aspect-ratio: 16 / 10; }
  [data-fx-part="shade"] { position: absolute; left: 0; right: 0; bottom: 0; height: 40%; background: linear-gradient(transparent, var(--kf-bg)); }
</style>
</head>
<body>
  <p class="demo-hint"><b>flash-land-stamp</b> Scroll down. When a card reaches 75% of the screen it pops with a flash and a stamp is pressed.</p>
  <article data-fx="flash-land-stamp"><div><h3>Client Name <span data-fx-part="stamp">Shipped.</span></h3><p data-fx-part="fact">Your one-line description here</p><p data-fx-part="fact">★★★★★</p></div><a data-fx-part="media" class="wf-img" data-label="Case screen"><span data-fx-part="shade"></span></a></article>
  <article data-fx="flash-land-stamp"><div><h3>Client Name 2 <span data-fx-part="stamp">Shipped.</span></h3><p data-fx-part="fact">Your one-line description here</p></div><a data-fx-part="media" class="wf-img" data-label="Case screen"></a></article>
  <template data-demo-late><article data-fx="flash-land-stamp" data-fx-flash-land-stamp="at: .9"><div><h3>Card that came in after 1s</h3></div><a data-fx-part="media" class="wf-img" data-label="Case screen"></a></article></template>
  <article data-fx="flash-land-stamp" data-demo-remove>Card to drop</article>
  <div style="height: 40vh"></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
