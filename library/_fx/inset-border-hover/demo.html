<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>inset-border-hover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 9; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .grid { display: grid; grid-template-columns: 2fr 1fr; gap: 0; margin: 40px 20px; }
  .grid a { display: block; height: 180px; }
  .grid .wf-img { display: block; height: 100%; }
</style>
</head>
<body>
<p class="demo-hint"><b>inset-border-hover</b> — Hover over the banner. <span style="color:var(--kf-dim)">(One more banner comes in after 1s, and one drops out after 2.5s)</span></p>
<div class="grid">
  <a href="#" data-fx="inset-border-hover"><span class="wf-img" data-label="Banner image · landscape"></span></a>
  <a href="#" data-fx="inset-border-hover" data-demo-remove><span class="wf-img" data-label="Banner to Be Removed"></span></a>
  <a href="#" data-fx="inset-border-hover" style="--fx-width: 12px"><span class="wf-img" data-label="Thickness 12px"></span></a>
  <a href="#" data-fx="inset-border-hover"></a>
  <template data-demo-late><a href="#" data-fx="inset-border-hover"><span class="wf-img" data-label="Late-arriving banner"></span></a></template>
</div>
<script src="../fx-core.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
