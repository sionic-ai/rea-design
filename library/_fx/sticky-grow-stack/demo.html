<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sticky-grow-stack — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { margin: 0; background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; margin: 0; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .gap { height: 50vh; display: grid; place-items: center; color: var(--kf-dim); }
  [data-fx-part="card"] { display: block; padding: 16px 20px; }
  [data-fx-part="frame"] { border-radius: var(--kf-radius-md); background: var(--kf-contrast-bg); color: var(--kf-contrast-ink); display: flex; align-items: flex-end; padding: 40px; box-sizing: border-box; font-size: 32px; }
  [data-fx-part="card"]:nth-child(2n) [data-fx-part="frame"] { background: color-mix(in oklab, var(--kf-contrast-bg) 80%, var(--kf-contrast-ink)); }
</style>
</head>
<body>
<p class="demo-hint"><b>sticky-grow-stack</b> — Scroll down — the next card grows from .9x and covers the previous card. <span style="color:var(--kf-dim)">(One more card comes in after 1s, and one drops out after 2.5s)</span></p>
<div class="gap">Top section</div>
<div data-fx="sticky-grow-stack">
  <a data-fx-part="card" href="#"><div data-fx-part="frame">One card</div></a>
  <a data-fx-part="card" href="#"><div data-fx-part="frame">Card two</div></a>
  <a data-fx-part="card" href="#" data-demo-remove><div data-fx-part="frame">Card to Be Removed</div></a>
  <a data-fx-part="card" href="#"><div data-fx-part="frame">Card four</div></a>
</div>
<template data-demo-late><div data-fx="sticky-grow-stack"><a data-fx-part="card" href="#"><div data-fx-part="frame">Late-arrived card</div></a></div></template>
<div class="gap">Lower section</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>

<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); window.ScrollTrigger?.refresh(); }, 2500);
</script>
</body>
</html>
