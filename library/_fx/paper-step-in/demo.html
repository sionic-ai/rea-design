<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>paper-step-in — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { padding: 48px 20px; }
  .demo-spacer { height: 90vh; display: grid; place-items: center; color: var(--kf-dim); }
  .row { display: flex; gap: 40px; flex-wrap: wrap; }
  .demo-card { width: 220px; aspect-ratio: 1.15; display: grid; place-items: center; border-radius: var(--kf-radius-lg); background: var(--kf-accent-soft); color: var(--kf-ink); }
  .demo-card span { display: block; padding: 20px; border-radius: var(--kf-radius-md); background: var(--kf-surface); }
</style>
</head>
<body>
<p class="demo-hint"><b>paper-step-in</b> — Scroll down and the panel comes into place in choppy steps like a paper puppet.</p>
<div class="demo-spacer">Scroll down ↓</div>
<section class="demo"><div class="row">
  <div class="demo-card" data-fx="paper-step-in" data-fx-paper-step-in="x: -12; y: 0; steps: 2; dur: .8; deg: -.5"><span data-fx-part="inner">Second from the left</span></div>
  <div class="demo-card" data-fx="paper-step-in"><span>Default — from below</span></div>
  <div class="demo-card" data-fx="paper-step-in" data-fx-paper-step-in="x: 12; y: 0; steps: 3; dur: 1.4; deg: .5"><span data-fx-part="inner">Third from the right</span></div>
</div></section>
<div class="demo-spacer"></div>
<script>
// Late arrivals and removals — checks that fx-core attaches to an element added after 1s and detaches from an element removed after 2.5s
(() => {
  const src = document.querySelector('[data-fx~="paper-step-in"]');
  if (!src) return;
  const html = src.outerHTML.replace(/\sid="[^"]*"/g, "");
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => src.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical one comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
