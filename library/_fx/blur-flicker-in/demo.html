<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>blur-flicker-in — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-ink); color: var(--kf-bg); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); color: var(--kf-ink); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .logo { display: flex; flex-wrap: wrap; gap: 12px; padding: 60px 20px; color: var(--kf-accent); font: 800 72px/1 var(--kf-font-display); }
  .logo [data-look="fade"] { font-weight: 300; }
  .demo-spacer { height: 90vh; display: grid; place-items: center; color: var(--kf-dim); }
</style>
</head>
<body>
<p class="demo-hint"><b>blur-flicker-in</b> — On open, pieces light up one by one with a flash out of blur (the lower ones when they enter the screen). <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<h1 class="logo" data-fx="blur-flicker-in" data-fx-blur-flicker-in="delay: .3"><span data-fx-part="piece" data-look="fade" data-delay="1.94">Woman</span><span data-fx-part="piece" data-look="fade" data-delay="1.4">Flag</span><span data-fx-part="piece" data-delay="2.1">S</span><span data-fx-part="piece" data-delay="2.3">A</span><span data-fx-part="piece" data-delay="2.2">M</span><span data-fx-part="piece" data-delay="2.6">P</span><span data-fx-part="piece" data-delay="2.4">L</span><span data-fx-part="piece" data-delay="2.8">E</span></h1>
<h1 class="logo" data-demo-remove data-fx="blur-flicker-in"><span data-fx-part="piece" data-delay="1">Fan</span><span data-fx-part="piece" data-delay="1.4">Quality</span></h1>
<div class="demo-spacer">Scroll down</div>
<h1 class="logo" data-fx="blur-flicker-in" data-fx-blur-flicker-in="on: view"><span data-fx-part="piece" data-delay="1">T</span><span data-fx-part="piece" data-delay="1.3">I</span><span data-fx-part="piece" data-delay="1.1">T</span><span data-fx-part="piece" data-delay="1.6">L</span><span data-fx-part="piece" data-delay="1.4">E</span></h1>
<template data-demo-late><h1 class="logo" data-fx="blur-flicker-in"><span data-fx-part="piece" data-delay="1.2">Late</span><span data-fx-part="piece" data-look="fade" data-delay="1.6">Crab</span></h1></template>
<div class="demo-spacer"></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); window.ScrollTrigger?.refresh(); }, 2500);
</script>
</body>
</html>
