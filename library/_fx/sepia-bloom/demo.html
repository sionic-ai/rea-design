<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sepia-bloom — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .row { display: flex; gap: 20px; padding: 30px 20px; }
  .card { width: 260px; height: 180px; border-radius: var(--kf-radius-md); background: linear-gradient(135deg, var(--kf-accent), var(--kf-accent-soft) 60%, var(--kf-ink)); }
  button { padding: 10px 18px; border: 1px solid var(--kf-line); border-radius: var(--kf-radius-pill); background: var(--kf-surface); }
</style>
</head>
<body>
<p class="demo-hint"><b>sepia-bloom</b> — The left panel regains its color over 1.5s, starting 1s after opening. The center panel only unlocks when you press the Start button. <span style="color:var(--kf-dim)">(After 1s one more panel comes in, and one leaves 2.5s later)</span></p>
<div class="row">
  <div class="card" data-fx="sepia-bloom" data-fx-sepia-bloom="delay: 1; dur: 1.5"></div>
  <div class="card" data-fx="sepia-bloom" data-fx-sepia-bloom="delay: 0; on: event"></div>
  <div class="card" data-fx="sepia-bloom" data-fx-sepia-bloom="delay: 3" data-demo-remove></div>
  <template data-demo-late><div class="card" data-fx="sepia-bloom" data-fx-sepia-bloom="delay: .5; dur: 2; sepia: 1; gray: 100"></div></template>
  <div data-fx="sepia-bloom"></div>
</div>
<div class="row"><button type="button" onclick="document.dispatchEvent(new Event('fx:bloom'))">Start</button></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
