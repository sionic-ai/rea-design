<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>flap-bird-flock — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; overflow-x: hidden; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .stage { height: 70vh; overflow: hidden; border-bottom: 1px solid var(--kf-line); }
  .stage h2 { position: absolute; left: 8%; top: 18%; z-index: 2; font-size: 44px; margin: 0; }
  .demo-spacer { height: 60vh; display: grid; place-items: center; color: var(--kf-dim); }
</style>
</head>
<body>
<p class="demo-hint"><b>flap-bird-flock</b> — On open, a flock of birds rises one after another from below and flaps. Scroll down and the flock in the second section takes off. <span style="color:var(--kf-dim)">(After 1s a new section comes in, and after 2.5s the first section drops out)</span></p>
<section class="stage" data-demo-remove data-fx="flap-bird-flock" data-fx-flap-bird-flock="on: load; delay: .4">
  <h2>Your big title here</h2>
  <i data-fx-part="bird" data-key="1" style="left: 12%; top: 80%; --fx-size: 17vw"></i>
  <i data-fx-part="bird" data-key="2" style="left: 26%; top: 62%; --fx-size: 17vw"></i>
  <i data-fx-part="bird" data-key="3" style="left: 46%; top: 58%; --fx-size: 17vw"></i>
  <i data-fx-part="bird" data-key="1" style="left: 60%; top: 72%; --fx-size: 16vw"></i>
  <i data-fx-part="bird" data-key="4" style="left: 86%; top: 40%; --fx-size: 25vw"></i>
  <i data-fx-part="bird" data-key="5" style="left: 64%; top: 42%; --fx-size: 19vw"></i>
</section>
<div class="demo-spacer">Scroll down</div>
<section class="stage" data-fx="flap-bird-flock" data-fx-flap-bird-flock="start: top 60%; ease: power1.out">
  <i data-fx-part="bird" data-key="1" style="left: 10%; top: 60%; --fx-size: 17vw"></i>
  <i data-fx-part="bird" data-key="2" style="left: 24%; top: 40%; --fx-size: 17vw"></i>
  <i data-fx-part="bird" data-key="5" style="left: 72%; top: 70%; --fx-size: 17vw"></i>
  <i data-fx-part="bird" data-key="4" style="left: 86%; top: 30%; --fx-size: 24vw"></i>
</section>
<section class="stage" data-fx="flap-bird-flock"></section>
<template data-demo-late><section class="stage" data-fx="flap-bird-flock" data-fx-flap-bird-flock="on: load"><i data-fx-part="bird" data-key="3" style="left: 50%; top: 50%; --fx-size: 20vw"></i></section></template>
<div class="demo-spacer"></div>

<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../../_vendor/lottie-web@5.11.0/lottie_svg.min.js"></script>
<script src="../fx-core.js"></script>
<script>gsap.registerPlugin(ScrollTrigger);</script>
<script src="fx.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); window.ScrollTrigger?.refresh(); }, 2500);
</script>
</body>
</html>
