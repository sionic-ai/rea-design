<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>field-ring — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { padding: 48px 20px; }
  .demo-spacer { height: 90vh; display: grid; place-items: center; color: var(--kf-dim); }

  form { display: grid; gap: 8px; max-width: 480px; }
  input, textarea { width: 100%; height: 52px; border: 0; border-radius: 8px; background: var(--kf-raised); font: inherit; padding: 0 16px; }
  textarea { height: 140px; padding-top: 14px; }
</style>
</head>
<body>
<p class="demo-hint"><b>field-ring</b> — Hover over the field, then click to type. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<section class="demo"><form data-demo-remove data-fx="field-ring" onsubmit="return false"><input placeholder="Name"><input placeholder="Mail"><textarea placeholder="Message"></textarea></form><form data-fx="field-ring" onsubmit="return false"><input placeholder="Name"><input placeholder="Mail"><textarea placeholder="Message"></textarea></form><template data-demo-late><form data-fx="field-ring" onsubmit="return false"><input placeholder="Name"><input placeholder="Mail"><textarea placeholder="Message"></textarea></form></template></section>

<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); window.ScrollTrigger?.refresh(); }, 2500);
</script>
</body>
</html>
