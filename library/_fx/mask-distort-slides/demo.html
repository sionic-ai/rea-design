<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mask-distort-slides — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo-stage { height: 80vh; }
  .demo-stage [data-fx-part="slide"] { position: absolute; inset: 0; }
  .demo-stage .wf-img { height: 100%; }
  .demo-spacer { height: 60vh; }
</style>
</head>
<body>
<p class="demo-hint"><b>mask-distort-slides</b> — On opening a capsule grows from the center and opens the photo, and every 4 seconds the next photo bends and is pulled in. Scrolling down brings the photo closer.</p>
<section class="demo-stage" id="demo-stage" data-fx="mask-distort-slides" data-fx-mask-distort-slides="scroll: #demo-stage">
  <div data-fx-part="slide"><div class="wf-img" data-label="Photo 01 · close-up of a person · landscape full screen"></div></div>
  <div data-fx-part="slide"><div class="wf-img" data-label="Photo 02 · office overview · full-screen landscape"></div></div>
  <div data-fx-part="slide"><div class="wf-img" data-label="Photo 03 · conversation on site · landscape full screen"></div></div>
</section>
<div class="demo-spacer"></div>
<script>
(() => {
  // Late arrivals and removals — after 1s one more of the same panel comes in (the late one), after 2.5s one is removed (detach)
  const src = document.querySelector('[data-fx~="mask-distort-slides"]');
  const html = src.outerHTML.replace(/\sid="[^"]*"/g, "").replace(/scroll: #demo-stage/, "mask: none");
  const make = () => { const t = document.createElement("template"); t.innerHTML = html; return t.content.firstElementChild; };
  const gone = make();
  src.after(gone);
  setTimeout(() => src.after(make()), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s one more panel comes in, and after 2.5s one leaves.");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="three-global.js"></script>
<script src="../../_vendor/three@0.184.0/build/three.cjs"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
