<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>char-dim-hover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { display: flex; flex-wrap: wrap; gap: 40px; padding: 60px 20px; font: 700 20px/1 var(--kf-font-sans); text-transform: uppercase; }
  .demo a, .demo button { color: inherit; background: none; border: 0; font: inherit; cursor: pointer; }
</style>
</head>
<body>
<p class="demo-hint"><b>char-dim-hover</b> — Hover over a link or button. Letters blur out in turn from the first one. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<div class="demo">
  <a href="#" data-fx="char-dim-hover">View more work</a>
  <button type="button" data-fx="char-dim-hover">View all</button>
  <a href="#" data-fx="char-dim-hover" data-fx-char-dim-hover="dim: .2; spread: .5">See more work</a>
  <a href="#" data-fx="char-dim-hover" data-demo-remove>Being removed soon</a>
  <a href="#" data-fx="char-dim-hover"></a>
  <template data-demo-late><a href="#" data-fx="char-dim-hover">Late-arrived Link</a></template>
</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/SplitText.min.js"></script>
<script src="../../../_shared/vendor/gsap/CustomEase.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
