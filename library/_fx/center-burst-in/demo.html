<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>center-burst-in — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo-spacer { height: 80vh; display: grid; place-items: center; color: var(--kf-dim); }
  .row { position: relative; max-width: 840px; height: 250px; margin-inline: auto; }
  .ball { position: absolute; width: 180px; aspect-ratio: 1.4; border-radius: 50% 50% 50% 8px; background: var(--kf-accent-soft); border: 3px solid var(--kf-ink); }
  .ball .r { position: absolute; top: -40px; left: 30px; width: 44px; height: 44px; border-radius: 50%; background: var(--kf-accent); }
  .card { max-width: 840px; height: 160px; margin: 0 auto; border-radius: var(--kf-radius-sm); background: var(--kf-surface); }
</style>
</head>
<body>
<p class="demo-hint"><b>center-burst-in</b> — Scroll down — the speech bubbles above and below the card pop out from the center at 0 scale and settle in place.</p>
<div class="demo-spacer">↓ Scroll</div>
<div class="row" data-fx="center-burst-in" data-demo-remove><div class="ball" data-fx-part="item" style="left: 0; bottom: 20px"></div></div>
<div class="row" data-fx="center-burst-in">
  <div class="ball" data-fx-part="item" style="left: -60px; bottom: 15px"><span class="r" data-fx-part="rider"></span></div>
  <div class="ball" data-fx-part="item" style="left: 260px; bottom: 60px; width: 140px"></div>
  <div class="ball" data-fx-part="item" style="left: 560px; bottom: 24px"><span class="r" data-fx-part="rider"></span></div>
</div>
<div class="card"></div>
<template data-demo-late><div class="row" data-fx="center-burst-in" data-fx-center-burst-in="from: top"><div class="ball" data-fx-part="item" style="left: 40px; top: 40px"></div><div class="ball" data-fx-part="item" style="left: 600px; top: 20px"></div></div></template>
<div class="row" data-fx="center-burst-in"></div>
<div class="demo-spacer">Footer</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script>gsap.registerPlugin(ScrollTrigger);</script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); window.ScrollTrigger?.refresh(); }, 2500);
</script>
</body>
</html>
