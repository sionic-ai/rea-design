<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bow-gallery — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo-spacer { height: 90vh; display: grid; place-items: center; color: var(--kf-dim); }
  .demo-ui { position: absolute; inset: 0; z-index: 1; pointer-events: none; }
  .demo-ui p { position: sticky; top: 30vh; margin: 0; text-align: center; font: 700 64px/1 var(--kf-font-display); }
  .demo-dot { display: grid; place-items: center; width: 120px; aspect-ratio: 1; border-radius: 50%; background: var(--kf-ink); color: var(--kf-bg); font: 600 13px var(--kf-font-mono); }
</style>
</head>
<body>
<p class="demo-hint"><b>bow-gallery</b> — Scrolling down brings the board in from the right, and each cell moves one by one to the center. Hover over the board (monochrome smear · pull-back · following circle).</p>
<div class="demo-spacer">Top section</div>
<section data-fx="bow-gallery">
  <div data-fx-part="item" data-label="Panel 01 · landscape photo" data-href="#"></div>
  <div data-fx-part="item" data-label="Panel 02 · landscape photo" data-href="#"></div>
  <div data-fx-part="item" data-label="Panel 03 · landscape photo" data-href="#"></div>
  <div data-fx-part="item" data-label="Panel 04 · landscape photo" data-href="#"></div>
  <div data-fx-part="item" data-label="Panel 05 · landscape photo" data-href="#"></div>
  <div class="demo-ui"><p class="demo-now">01</p></div>
  <span class="demo-dot" data-fx-part="pointer">NEW TAB</span>
</section>
<div class="demo-spacer">Lower section</div>
<script>
// Late arrivals and removals — checks that fx-core attaches to an element added after 1s and detaches from an element removed after 2.5s
(() => {
  const src = document.querySelector('[data-fx~="bow-gallery"]');
  if (!src) return;
  src.addEventListener("fx:bow-gallery", (e) => (src.querySelector(".demo-now").textContent = String(e.detail.index + 1).padStart(2, "0")));
  const html = src.outerHTML.replace(/\sid="[^"]*"/g, "");
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => src.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1 second one more identical gallery comes in (the late arrival), and after 2.5 seconds one is removed (detached).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="three-global.js"></script>
<script src="../../_vendor/three@0.174.0/build/three.cjs"></script>
<script>gsap.registerPlugin(ScrollTrigger);</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
