<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>drive-in-gate — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); min-height: 200vh; }
  .demo-hint { position: sticky; top: 0; z-index: 10; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-card { position: relative; width: min(90%, 900px); padding: 40px 40px 0; background: var(--kf-surface); }
  .demo-card p { margin: 0 0 120px; max-width: 30em; }
  .demo-go { position: absolute; right: 40px; bottom: 120px; height: 60px; padding: 0 24px; border: 0; background: var(--kf-ink); color: var(--kf-bg); font: inherit; cursor: pointer; }
  .demo-lane { border-bottom: 1px solid var(--kf-line); margin-bottom: 40px; display: flex; align-items: center; justify-content: flex-end; padding-right: 80px; }
  .demo-car svg { display: block; height: 48px; width: auto; }
  .demo-car rect, .demo-car circle { fill: var(--kf-ink); }
  .demo-car .w { fill: var(--kf-surface); }
</style>
</head>
<body>
<p class="demo-hint"><b>drive-in-gate</b> — Once the car pulls in and stops, press ‹Enter›. <span style="color:var(--kf-dim)">(After 1s one more layer comes in, and one leaves 2.5s later)</span></p>
<div data-fx="drive-in-gate">
  <div class="demo-card" data-fx-part="card">
    <p>Your entry guide text here. Press the button and the car pulls away and the curtain opens.</p>
    <button type="button" class="demo-go" data-fx-part="go">Enter →</button>
    <div class="demo-lane" data-fx-part="lane"><span class="demo-car" data-fx-part="car"><svg viewBox="0 0 120 50" aria-hidden="true"><rect x="10" y="18" width="100" height="20" rx="6"/><rect x="30" y="6" width="56" height="18" rx="5"/><rect class="w" x="38" y="10" width="18" height="10" rx="2"/><rect class="w" x="60" y="10" width="20" height="10" rx="2"/><circle cx="32" cy="40" r="8"/><circle cx="90" cy="40" r="8"/></svg></span></div>
  </div>
</div>
<div data-demo-remove data-fx="drive-in-gate" style="display:none"><button data-fx-part="go">Dropped Curtain</button></div>
<template data-demo-late><div data-fx="drive-in-gate" data-fx-drive-in-gate="in: .8; out: .4" style="display:none"><div data-fx-part="card"><button data-fx-part="go">Late layer</button></div></div></template>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
