<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>curve-reel-scrub — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: sticky; top: 0; z-index: 200; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .gap { height: 80vh; display: grid; place-items: center; color: var(--kf-dim); }
  [data-fx-part="card"] { background: var(--kf-raised); border: 1px solid var(--kf-line); padding: 18px; font: 500 14px/1.3 var(--kf-font-mono); }
  [data-fx-part="card"]:nth-child(2n) { background: var(--kf-accent-soft); }
</style>
</head>
<body>
<p class="demo-hint"><b>curve-reel-scrub</b> Scroll down. Cards swing in from behind, then flow along curved lines inside a pinned panel.</p>
<div class="gap">Scroll</div>
<section data-fx="curve-reel-scrub">
  <div data-fx-part="stage">
    <article data-fx-part="card">Card 1</article><article data-fx-part="card">Card 2</article><article data-fx-part="card">Card 3</article>
    <article data-fx-part="card">Card 4</article><article data-fx-part="card">Card 5</article><article data-fx-part="card">Card 6</article>
  </div>
</section>
<div class="gap">Footer</div>
<section data-fx="curve-reel-scrub" data-demo-remove></section>
<div id="late"></div>
<template data-demo-late><section data-fx="curve-reel-scrub" data-fx-curve-reel-scrub="per: 40; lerp: .3"><div data-fx-part="stage"><article data-fx-part="card">Late 1</article><article data-fx-part="card">Late 2</article><article data-fx-part="card">Late 3</article></div></section><div class="gap">Footer</div></template>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => document.getElementById("late").append(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
