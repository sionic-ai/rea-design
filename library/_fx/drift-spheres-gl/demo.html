<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>drift-spheres-gl — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .box { height: 60vh; min-height: 320px; margin: 24px 20px; border-radius: var(--kf-radius-lg); }
  .box .wf-img { position: absolute; inset: 0; height: 100%; }
  .box h2 { position: absolute; left: 40px; bottom: 40px; z-index: 2; font-size: 32px; }
  .small { height: 240px; }
</style>
</head>
<body>
<p class="demo-hint"><b>drift-spheres-gl</b> — A ball drifts slowly inside the box and circles out around the edge. Move the mouse and the light follows, changing the ball’s bright side.</p>
<section class="box" data-fx="drift-spheres-gl">
  <div class="wf-img" data-label="Photo slot · landscape 16:9"></div>
  <h2>Your title line here</h2>
</section>
<div id="host"></div>
<script src="three-global.js"></script>
<script src="../../_vendor/three@0.169.0/build/three.cjs"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Late arrivals and removals — after 1 second add one more small box (late arrival), and after 2.5 seconds remove it (detach)
(() => {
  const late = document.createElement("section");
  late.className = "box small";
  late.setAttribute("data-fx", "drift-spheres-gl");
  late.setAttribute("data-fx-drift-spheres-gl", "count: 5; size: 8");
  setTimeout(() => document.getElementById("host").append(late), 1000);
  setTimeout(() => late.remove(), 2500);
})();
</script>
</body>
</html>
