<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>water-particles — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { display: flex; flex-wrap: wrap; gap: 40px; padding: 60px 40px; }
  .photo { width: min(420px, 90vw); aspect-ratio: 680 / 940; border-radius: var(--kf-radius-lg); overflow: hidden; background: var(--kf-contrast-bg); }
  .photo.is-wide { aspect-ratio: 16 / 10; }
  .photo .wf-img { height: 100%; color: var(--kf-ink-soft); }
</style>
</head>
<body>
<p class="demo-hint"><b>water-particles</b> Hover and move over the photo. It scatters into gold particles and the area around the cursor is pushed away. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<section class="demo">
  <div class="photo" data-fx="water-particles"><div class="wf-img" data-fx-part="image" data-label="Autumn leaves reflected on a pond surface · daylight · portrait"></div></div>
  <div class="photo is-wide" data-demo-remove data-fx="water-particles" data-fx-water-particles="enter: 900; spread: 120"><div class="wf-img" data-fx-part="image" data-label="Moss garden · overcast day · landscape"></div></div>
  <template data-demo-late><div class="photo is-wide" data-fx="water-particles" data-fx-water-particles="gap: 4"><div class="wf-img" data-fx-part="image" data-label="Late-arriving photo"></div></div></template>
</section>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
