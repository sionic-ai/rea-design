<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>title-drop-fall — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { min-height: 80vh; display: flex; flex-direction: column; justify-content: flex-end; padding: 40px; }
  .demo h1 { font: var(--kf-weight-display) clamp(48px, 9vw, 130px)/1 var(--kf-font-display); color: var(--kf-accent); }
  .demo hr { border: 0; border-top: 1px solid var(--kf-line); margin: 32px 0 0; }
</style>
</head>
<body>
<p class="demo-hint"><b>title-drop-fall</b> — As soon as it opens, the title drops down and unblurs, and the last letter falls. <span style="color:var(--kf-dim)">(One more title comes in after 1s, and one drops out after 2.5s)</span></p>
<section class="demo"><h1 data-fx="title-drop-fall">Enter your title here<br>Placed in two lines</h1><hr data-fx-part="floor"></section>
<section class="demo" data-demo-remove><h1 data-fx="title-drop-fall" data-fx-title-drop-fall="dur: 1; scramble: 0">Omitted title</h1><hr></section>
<section class="demo"><template data-demo-late><h1 data-fx="title-drop-fall" data-fx-title-drop-fall="which: first-of-last-word; tilt: -8; dur: 1.5">Late-arriving TITLE</h1></template><hr data-fx-part="floor"></section>
<section class="demo"><h1 data-fx="title-drop-fall"></h1><hr></section>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); }, 2500);
</script>
</body>
</html>
