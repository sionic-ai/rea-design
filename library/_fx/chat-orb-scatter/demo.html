<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>chat-orb-scatter — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-spacer { height: 90vh; display: grid; place-items: center; color: var(--kf-dim); }
  .stage { background: var(--kf-accent-soft); }
  .stage [data-fx-part="end"] { display: grid; place-items: center; background: color-mix(in oklab, var(--kf-contrast-bg) 60%, transparent); color: var(--kf-contrast-ink); font-size: 20px; }
</style>
</head>
<body>
<p class="demo-hint"><b>chat-orb-scatter</b> — Scroll and conversations rise one by one inside the circle, a photo pile spins, then the circle covers the screen and scatters.</p>
<div class="demo-spacer">Scroll down ↓</div>
<section class="stage" data-fx="chat-orb-scatter" data-fx-chat-orb-scatter="length: 5000">
  <div data-fx-part="orb"><div data-fx-part="feed">
    <p data-fx-part="bubble">Your first words here</p>
    <p data-fx-part="bubble" data-side="me">Your answer here<br>Two lines</p>
    <p data-fx-part="bubble">Your third word here</p>
    <p data-fx-part="bubble" data-side="me">Your closing words here</p>
  </div></div>
  <div data-fx-part="photo" data-x="-30vw" data-y="-18vw" data-r="-12" data-sp-x="-20vw" data-sp-y="-30vh" data-sp-r="-10"><div class="wf-img wf-r-3x2" data-label="Photo 1"></div></div>
  <div data-fx-part="photo" data-x="30vw" data-y="-16vw" data-r="10" data-sp-x="20vw" data-sp-y="-10vh" data-sp-r="8"><div class="wf-img wf-r-3x2" data-label="Photo 2"></div></div>
  <div data-fx-part="photo" data-x="-26vw" data-y="20vw" data-r="8" data-sp-x="-18vw" data-sp-y="25vh" data-sp-r="6"><div class="wf-img wf-r-3x2" data-label="Photo 3"></div></div>
  <div data-fx-part="photo" data-x="0" data-y="0" data-r="6"><div class="wf-img wf-r-3x2" data-label="Photo 4"></div></div>
  <div data-fx-part="end">Final section — contact button spot</div>
</section>
<div class="demo-spacer"></div>
<script>
(() => {
  const src = document.querySelector('[data-fx~="chat-orb-scatter"]');
  if (!src) return;
  const html = src.outerHTML;
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => (src.closest(".pin-spacer") || src).after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical one comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
