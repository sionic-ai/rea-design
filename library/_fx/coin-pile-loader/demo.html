<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>coin-pile-loader — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { padding: 24px 20px; display: grid; gap: 16px; }
  .demo button { justify-self: start; padding: 8px 14px; border: 1px solid var(--kf-line); border-radius: var(--kf-radius-sm); background: var(--kf-surface); }
  .box { position: relative; height: 320px; border: 1px solid var(--kf-line); overflow: hidden; }
  .box [data-fx~="coin-pile-loader"] { position: absolute; }
</style>
</head>
<body>
<p class="demo-hint"><b>coin-pile-loader</b> — Coins pile up and vanish, repeating every 5s. Use the button to lift the veil (fx:hide). <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<section class="demo">
  <button type="button" id="hide">fx:hide</button>
  <div class="box"><div id="main" data-fx="coin-pile-loader" data-fx-coin-pile-loader="hold: 800"><div data-fx-part="pile"></div><span data-fx-part="label">Loading</span></div></div>
  <div class="box" data-demo-remove><div data-fx="coin-pile-loader"><div data-fx-part="pile"></div></div></div>
  <template data-demo-late><div class="box"><div data-fx="coin-pile-loader" style="--fx-fade: 200ms"><div data-fx-part="pile"></div><span data-fx-part="label">Enters late</span></div></div></template>
</section>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
document.getElementById("hide").addEventListener("click", () => document.getElementById("main").dispatchEvent(new CustomEvent("fx:hide")));
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
