<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>shrink-to-card — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .wrap { width: calc(100% - 96px); margin: 0 auto; }
  .demo-spacer { height: 60vh; display: grid; place-items: center; color: var(--kf-dim); }
  .reel { margin-bottom: 40px; }
  .reel .wf-img { aspect-ratio: 16 / 9; border: 0; }
</style>
</head>
<body>
<p class="demo-hint"><b>shrink-to-card</b> — Scroll down — the full-width band shrinks into a body-width card. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<div class="wrap"><div class="demo-spacer">Your Hero sentence here</div></div>
<div class="reel" data-fx="shrink-to-card" data-fx-shrink-to-card="to: .wrap"><div data-fx-part="frame"><div class="wf-img" data-label="Showreel video · 16:9 landscape"></div></div></div>
<div class="reel" data-demo-remove data-fx="shrink-to-card"><div data-fx-part="frame"><div class="wf-img" data-label="Band to Be Removed"></div></div></div>
<template data-demo-late><div class="reel" data-fx="shrink-to-card" data-fx-shrink-to-card="inset: 24; radius: 2rem"><div data-fx-part="frame"><div class="wf-img" data-label="Late-arriving band · inset 24 · 2rem"></div></div></div></template>
<div class="demo-spacer">Your work list here</div>
<div class="demo-spacer">Footer</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); window.ScrollTrigger?.refresh(); }, 2500);
</script>
</body>
</html>
