<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>track-in-menu — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: sticky; top: 0; z-index: 0; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { padding: 48px 20px; display: flex; gap: 16px; flex-wrap: wrap; }
  .demo-btn { height: 48px; padding: 0 20px; border: 1px solid var(--kf-line); border-radius: var(--kf-radius-pill); background: var(--kf-surface); color: var(--kf-ink); cursor: pointer; }
  [data-fx~="track-in-menu"].is-open .demo-btn { color: var(--kf-contrast-ink); background: transparent; border-color: currentColor; }
  [data-fx-part="panel"] ul { margin: 0; padding: 0; list-style: none; }
  [data-fx-part="item"] { margin-bottom: 22px; font: 600 18px/1.4 var(--kf-font-display); }
  [data-fx-part="item"] a { color: inherit; text-decoration: none; }
</style>
</head>
<body>
<p class="demo-hint"><b>track-in-menu</b> — Press ”Menu”. The panel turns on and the links come in one by one, tightening their letter spacing. Links or Esc close it.</p>
<section class="demo" id="demo">
  <div data-fx="track-in-menu" id="menu">
    <button class="demo-btn" type="button" data-fx-part="toggle">Menu</button>
    <nav data-fx-part="panel"><ul>
      <li data-fx-part="item"><a href="#">Menu 1</a></li>
      <li data-fx-part="item"><a href="#">Menu Two</a></li>
      <li data-fx-part="item"><a href="#">Your menu 3 here</a></li>
      <li data-fx-part="item"><a href="#">Menu 4</a></li>
      <li data-fx-part="item"><a href="#">Inquiry</a></li>
    </ul></nav>
  </div>
</section>
<script>
// Late arrivals and removals — also applies to a menu added after 1 second, and a menu removed after 2.5 seconds detaches its Esc listener
(() => {
  const src = document.getElementById("menu");
  const make = (tag) => { const el = src.cloneNode(true); el.removeAttribute("id"); el.dataset.demo = tag; el.querySelector("button").textContent = tag === "late" ? "Late-arrived Menu" : "Omitted menu"; return el; };
  const gone = make("gone");
  document.getElementById("demo").append(gone);
  setTimeout(() => document.getElementById("demo").append(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s one more menu button comes in, and after 2.5s one drops out.");
})();
</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
