<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ball-hop-pill — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 500 15px/1.6 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 10; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 700 13px/1.4 var(--kf-font-mono); }
  .row { display: flex; gap: 32px; justify-content: center; margin: 96px auto; }
  .pill { display: inline-flex; align-items: center; padding: 0 28px; border-radius: 999px; background: var(--kf-accent); color: var(--kf-on-accent); font: 700 14px/44px var(--kf-font-sans); letter-spacing: .04em; }
  .rider { background: var(--kf-accent-soft); border-radius: 12px 12px 3px 3px; }
</style>
</head>
<body>
<p class="demo-hint"><b>ball-hop-pill</b> — Hover over the button. A dot bounces across the letters and an image rises over the third letter. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<div class="row">
  <a href="#" class="pill" data-fx="ball-hop-pill"><span data-fx-part="label">MORE</span><span class="rider" data-fx-part="rider"></span></a>
  <a href="#" class="pill" data-fx="ball-hop-pill" data-fx-ball-hop-pill="char: 0"><span data-fx-part="label">CONTACT</span></a>
  <a href="#" class="pill" data-fx="ball-hop-pill" data-demo-remove><span data-fx-part="label">Omitted button</span></a>
</div>
<template data-demo-late><div class="row"><a href="#" class="pill" data-fx="ball-hop-pill" data-fx-ball-hop-pill="dur: .8; shift: 0">Late-arriving button<span class="rider" data-fx-part="rider"></span></a></div></template>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
