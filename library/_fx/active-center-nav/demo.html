<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>active-center-nav — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .bar { padding: 40px 40px 0; }
  .bar ul { height: 60px; margin: 0 0 40px; padding: 0; list-style: none; font: 500 48px/1 var(--kf-font-display); }
  .bar a { color: inherit; text-decoration: none; }
</style>
</head>
<body>
<p class="demo-hint"><b>active-center-nav</b> — Click the menus at both ends. The clicked item slides to the center and sharpens, while the others return to their own ends and fade. <span style="color:var(--kf-dim)">(After 1s one more menu item comes in, and after 2.5s one drops out)</span></p>
<div class="bar" id="bars">
  <ul data-fx="active-center-nav"><li data-fx-part="item"><a href="#" onclick="return false">Projects</a></li><li data-fx-part="item"><a href="#" onclick="return false">Studio</a></li></ul>
  <ul data-fx="active-center-nav"><li data-fx-part="item"><a href="#" onclick="return false">Work</a></li><li data-fx-part="item" class="is-current"><a href="#" onclick="return false">About</a></li></ul>
  <ul data-fx="active-center-nav" data-demo-remove><li data-fx-part="item"><a href="#" onclick="return false">Gone</a></li><li data-fx-part="item"><a href="#" onclick="return false">Soon</a></li></ul>
  <ul data-fx="active-center-nav"></ul>
</div>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
  setTimeout(() => { const u = document.createElement("ul"); u.dataset.fx = "active-center-nav"; u.innerHTML = '<li data-fx-part="item"><a href="#" onclick="return false">Late</a></li><li data-fx-part="item"><a href="#" onclick="return false">Comer</a></li>'; document.getElementById("bars").append(u); }, 1000);
  setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
