<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>displace-mix-gl — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 9; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .row { display: flex; flex-wrap: wrap; gap: 24px; margin: 40px 20px; }
  .row > div { width: 260px; aspect-ratio: 1 / 1; }
</style>
</head>
<body>
<p class="demo-hint"><b>displace-mix-gl</b> — From 2s on, every 3s the panel ripples and switches to the next photo. <span style="color:var(--kf-dim)">(After 1s one more panel comes in, and one leaves 2.5s later)</span></p>
<div class="row">
  <div data-fx="displace-mix-gl" data-fx-displace-mix-gl="at: enter; labels: Garden|Rooms|Dining"></div>
  <div data-fx="displace-mix-gl" data-fx-displace-mix-gl="at: enter; labels: Panel to be erased|Second" data-demo-remove></div>
  <div data-fx="displace-mix-gl" data-fx-displace-mix-gl="at: enter; every: 2; dur: .8; intensity: 2; labels: Fast|Hard"></div>
  <template data-demo-late><div data-fx="displace-mix-gl" data-fx-displace-mix-gl="at: enter; labels: Late edition|Second"></div></template>
</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../_vendor/three@0.109.0/build/three.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
