<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>stroke-bar-loader — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { margin: 0; padding: 12px 20px; border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .page { padding: 40px; }
  [data-fx-part="logo"] { width: 240px; stroke-width: 14; }
  .again { margin-top: 16px; }
</style>
</head>
<body>
<p class="demo-hint"><b>stroke-bar-loader</b> — Reload. Logo lines are drawn, the text rises one letter at a time, bars fill, then the curtain lifts.</p>
<div data-fx="stroke-bar-loader">
  <div data-fx-part="mark">
    <svg data-fx-part="logo" viewBox="0 0 240 90"><path d="M20 12v66"/><path d="M20 58 58 22"/><path d="M34 46c4 20 18 30 34 28"/><circle cx="120" cy="52" r="24"/><path d="M180 30v34c0 10 8 14 16 14s16-4 16-14V30"/></svg>
    <p data-fx-part="copy">Your one-liner here</p>
  </div>
  <span data-fx-part="bar"></span>
</div>
<div class="page">Page after the loader clears <div class="wf-img wf-r-16x9" data-label="Photo slot" style="max-width:480px"></div><button class="wf-btn again" type="button">Reinsert loader</button></div>
<script>
// Late-arriving and removed items — a button inserts the same loader anew to check it also applies to late elements, and removes it after 2.5s to see the detach run
(() => {
  const src = document.querySelector('[data-fx~="stroke-bar-loader"]').cloneNode(true);
  document.querySelector(".again").addEventListener("click", () => {
    const el = src.cloneNode(true);
    document.body.append(el);
    setTimeout(() => el.remove(), 2500);
  });
  setTimeout(() => document.querySelector(".again").click(), 1000);
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
