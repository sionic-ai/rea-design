<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>shuffle-blink — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-contrast-bg); color: var(--kf-contrast-ink); font: 400 15px/1.6 var(--kf-font-sans); }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); color: var(--kf-ink); font: 500 13px/1.4 var(--kf-font-mono); }
  ul { max-width: 900px; margin: 60px auto; padding: 0 20px; }
  li a { display: flex; justify-content: space-between; align-items: center; height: 91px; border-bottom: 1px dotted currentColor; }
  h3 { font: 900 48px/1.2 var(--kf-font-display); letter-spacing: 0.08em; }
</style>
</head>
<body>
<p class="demo-hint"><b>shuffle-blink</b> — Hover over the line. The big letters flash in a shuffled order. <span style="color:var(--kf-dim)">(After 1s one more line comes in, and one leaves 2.5s later)</span></p>
<ul>
  <li><a href="#" data-fx="shuffle-blink"><h3 data-fx-part="text">BE VALUE ONE</h3><span>Your first guideline meaning here</span></a></li>
  <li data-demo-remove><a href="#" data-fx="shuffle-blink"><h3 data-fx-part="text">BE TWO</h3><span>Dropped Line</span></a></li>
  <li><a href="#" data-fx="shuffle-blink" data-fx-shuffle-blink="each: .1; dur: .3"><h3 data-fx-part="text">SLOW BLINK</h3><span>each .1 · dur .3</span></a></li>
  <template data-demo-late><li><a href="#" data-fx="shuffle-blink"><h3 data-fx-part="text">LATE ROW</h3><span>Late-arriving line</span></a></li></template>
  <li><a href="#" data-fx="shuffle-blink"><h3 data-fx-part="text"></h3><span>Line Without Text</span></a></li>
</ul>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
