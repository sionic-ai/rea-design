<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>stamp-chars-in — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { display: grid; gap: 64px; justify-items: center; padding: 48px 20px; }
  .demo-spacer { height: 90vh; display: grid; place-items: center; color: var(--kf-dim); }
  .demo-line { margin: 0; font-family: var(--kf-font-display); font-size: 40px; line-height: 1.35; }
</style>
</head>
<body>
<p class="demo-hint"><b>stamp-chars-in</b> — Scroll down and the letters of one brush-script line are stamped into place one by one with a thud.</p>
<div class="demo-spacer">Scroll down ↓</div>
<section class="demo">
  <p class="demo-line" data-fx="stamp-chars-in" aria-label="Your calligraphy line here"><span data-fx-part="char">Woman</span><span data-fx-part="char">Flag</span><span data-fx-part="char">At</span><span data-fx-part="char">　</span><span data-fx-part="char">Brush</span><span data-fx-part="char">Text</span><span data-fx-part="char">Seed</span><span data-fx-part="char">　</span><span data-fx-part="char">One</span><span data-fx-part="char">Line</span></p>
  <p class="demo-line" data-fx="stamp-chars-in" data-fx-stamp-chars-in="lift: 1; seq: tilt 0 .3, lift .3 .6, press .6 1.2"><span data-fx-part="char">Tea</span><span data-fx-part="char">Example</span><span data-fx-part="char">Object marker</span><span data-fx-part="char">Bar</span><span data-fx-part="char">Pro</span><span data-fx-part="char">Line</span></p>
</section>
<div class="demo-spacer"></div>
<script>
// Late arrivals and removals — checks that fx-core attaches to an element added after 1s and detaches from an element removed after 2.5s
(() => {
  const src = document.querySelector('[data-fx~="stamp-chars-in"]');
  if (!src) return;
  const html = src.outerHTML.replace(/\sid="[^"]*"/g, "");
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => src.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical one comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
