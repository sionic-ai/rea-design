<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>menu-spread-hover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .stack { width: 420px; margin: 160px auto; }
  .stack li { margin-top: -6px; }
  .stack a { display: block; padding: 18px 28px; border: 2px solid var(--kf-ink); border-radius: var(--kf-radius-sm); background: var(--kf-surface); font: var(--kf-weight-display) 28px/1 var(--kf-font-display); }
  .stack li:nth-child(odd) a { background: var(--kf-accent); color: var(--kf-on-accent); }
</style>
</head>
<body>
<p class="demo-hint"><b>menu-spread-hover</b> — Hover over a row. The other rows shift up and down out of the way.</p>
<ul class="stack" data-fx="menu-spread-hover"><li data-fx-part="item"><a href="#">Menu 1</a></li><li data-fx-part="item"><a href="#">Menu 2</a></li><li data-fx-part="item"><a href="#">Menu 3</a></li><li data-fx-part="item"><a href="#">Menu 4</a></li><li data-fx-part="item"><a href="#">Menu 5</a></li><li data-fx-part="item"><a href="#">Menu 6</a></li></ul>
<script>
(() => {
  const src = document.querySelector('[data-fx~="menu-spread-hover"]');
  const html = src.outerHTML;
  const make = () => { const t = document.createElement("template"); t.innerHTML = html; return t.content.firstElementChild; };
  const gone = make(); src.after(gone);
  setTimeout(() => src.after(make()), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s one more of the same comes in, and after 2.5s one drops out.");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
