<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cursor-preview-slide — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  ul { padding: 48px 20px; }
  li { padding: 16px 0; border-bottom: 1px solid var(--kf-line); font: 700 28px/1 var(--kf-font-display); }
  .v { background: var(--kf-accent); }
</style>
</head>
<body>
<p class="demo-hint"><b>cursor-preview-slide</b> — Move the mouse up and down over the list rows. A window follows and the image is pushed up or down and swapped.</p>
<ul data-fx="cursor-preview-slide">
  <li data-fx-part="row">Line one<span class="v" data-fx-part="visual"></span></li>
  <li data-fx-part="row" data-label="Image caption two">Line Two</li>
  <li data-fx-part="row">Line Three<span data-fx-part="visual">Third Picture</span></li>
</ul>
<ul data-fx="cursor-preview-slide" data-demo-remove><li data-fx-part="row">Line to erase</li></ul>
<template data-demo-late><ul data-fx="cursor-preview-slide" data-fx-cursor-preview-slide="dur: .3; follow: .3"><li data-fx-part="row" data-label="Late-arrived Image">Late row</li></ul></template>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
