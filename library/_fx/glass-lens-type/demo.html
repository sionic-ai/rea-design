<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>glass-lens-type — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { margin: 0; background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .stage { padding: 10vh 8vw; display: grid; gap: 2rem; }
  h2 { margin: 0; font-family: var(--kf-font-display); font-size: clamp(3rem, 10vw, 9rem); line-height: .9; font-weight: 300; }
  p { margin: 0; font-size: clamp(1.4rem, 2.9vw, 2.9rem); }
</style>
</head>
<body>
<p class="demo-hint"><b>glass-lens-type</b> — Move the mouse quickly over the text, or press it. Letters around the cursor ripple as if seen through a glass lens. <span style="color:var(--kf-dim)">(After 1s one more line comes in, and one leaves 2.5s later)</span></p>
<div class="stage">
  <h2 data-fx="glass-lens-type">immersive</h2>
  <h2 data-fx="glass-lens-type" data-fx-glass-lens-type="strength: .3">headline</h2>
  <p data-fx="glass-lens-type" data-demo-remove>Your struck-through line goes here.</p>
  <template data-demo-late><p data-fx="glass-lens-type">Late-arriving rows get the lens too.</p></template>
</div>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
