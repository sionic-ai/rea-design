<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>diagonal-mask-scrub — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.6 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { display: grid; gap: 30vh; padding: 50vh 20px; }
  .ribbon { height: 120vh; }
  .ribbon svg { width: 100%; height: 100%; }
  .ribbon path { fill: none; stroke: var(--kf-accent); stroke-width: 80; stroke-linecap: round; opacity: 0.5; }
</style>
</head>
<body>
<p class="demo-hint"><b>diagonal-mask-scrub</b> — Scroll down. The ribbon image is drawn from the top with a slanted edge. <span style="color:var(--kf-dim)">(After 1s one more panel comes in, and one leaves 2.5s later)</span></p>
<main class="demo">
  <div class="ribbon" data-fx="diagonal-mask-scrub"><svg viewBox="0 0 1000 1000" preserveAspectRatio="none"><path d="M800 -40C980 200 700 360 420 420S40 640 120 820 640 980 1040 1040"/></svg></div>
  <div class="ribbon" data-fx="diagonal-mask-scrub" data-fx-diagonal-mask-scrub="angle: 225; from: 100"><svg viewBox="0 0 1000 1000" preserveAspectRatio="none"><path d="M600 -40C760 300 900 520 560 640S240 900 420 1040"/></svg></div>
  <div class="ribbon" data-fx="diagonal-mask-scrub" data-demo-remove></div>
</main>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => { const d = document.createElement("div"); d.className = "ribbon"; d.dataset.fx = "diagonal-mask-scrub"; d.innerHTML = '<svg viewBox="0 0 1000 1000" preserveAspectRatio="none"><path d="M100 -40C300 400 900 600 960 1040"/></svg>'; document.querySelector(".demo")?.append(d); }, 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); }, 2500);
</script>
</body>
</html>
