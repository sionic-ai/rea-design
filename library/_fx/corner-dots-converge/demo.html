<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>corner-dots-converge — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); overflow-x: clip; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-spacer { height: 80vh; display: grid; place-items: center; color: var(--kf-dim); }
  .demo { margin: 60px auto; width: min(1000px, 90vw); display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--kf-line); padding: 1px; }
  .demo div { background: var(--kf-bg); padding: 28px; min-height: 110px; }
</style>
</head>
<body>
<p class="demo-hint"><b>corner-dots-converge</b> — Scroll down and squares at the four grid corners gather from outside, and top and bottom lines are drawn.</p>
<div class="demo-spacer">Scroll down ↓</div>
<div class="demo" data-fx="corner-dots-converge"><div>Your cell one here</div><div>Your box two here</div><div>Your box three here</div><div>Your box four here</div><div>Your cell five here</div><div>Your cell six here</div></div>
<div class="demo-spacer"></div>
<script>
(() => {
  const src = document.querySelector('[data-fx~="corner-dots-converge"]');
  if (!src) return;
  const make = (tag) => { const el = document.createElement("div"); el.className = "demo"; el.dataset.fx = "corner-dots-converge"; el.dataset.demo = tag; el.innerHTML = "<div>Late cell</div><div>Slot</div><div>Slot</div>"; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => src.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s one more grid comes in, and after 2.5s one drops out (detach).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script>gsap.registerPlugin(ScrollTrigger);</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
