<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>glass-bevel-refract — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .stage { position: relative; height: 80vh; background: var(--kf-contrast-bg); color: var(--kf-contrast-ink); display: grid; place-items: center; overflow: hidden; }
  .stage h2 { font: 400 72px/1 var(--kf-font-display); text-align: center; max-width: 12ch; margin: 0; }
  .row { position: absolute; inset: 0; display: flex; justify-content: center; align-items: center; gap: 2.5rem; }
  .row > div { width: min(22rem, 34vw); }
</style>
</head>
<body>
<p class="demo-hint"><b>glass-bevel-refract</b> — Move the mouse. A glass square and a glass circle refract the big letters behind them and tilt toward the cursor. <span style="color:var(--kf-dim)">(After 1s one more circle comes in, and one leaves 2.5s later)</span></p>
<section class="stage">
  <h2 class="big">A headline behind glass</h2>
  <div class="row">
    <div data-fx="glass-bevel-refract" data-fx-glass-bevel-refract="shape: square; text: .big"></div>
    <div data-fx="glass-bevel-refract" data-fx-glass-bevel-refract="text: .big" data-demo-remove></div>
  </div>
</section>
<template data-demo-late><div data-fx="glass-bevel-refract" data-fx-glass-bevel-refract="text: .big; tilt: .4"></div></template>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => { document.querySelector(".row").append(t.content.cloneNode(true)); t.remove(); }), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); }, 2500);
</script>
</body>
</html>
