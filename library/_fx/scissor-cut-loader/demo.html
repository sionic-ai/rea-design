<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>scissor-cut-loader — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .box { position: relative; height: 300px; margin: 24px; border: 1px solid var(--kf-line); overflow: hidden; transform: translateZ(0); }
  .box [data-fx] { position: absolute; }
</style>
</head>
<body>
<p class="demo-hint"><b>scissor-cut-loader</b> — On open, scissors cut along the dotted line and the curtain parts up and down. The box below is a short panel that came in 1s later.</p>
<div data-fx="scissor-cut-loader"><span data-fx-part="label">Cut along the line</span></div>
<div class="box"><div data-fx="scissor-cut-loader" data-demo-remove></div></div>
<div class="box" id="late"></div>
<template data-demo-late><div data-fx="scissor-cut-loader" data-fx-scissor-cut-loader="dur: 1.2; open: .6; split: .5"></div></template>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => document.getElementById("late").append(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
