<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>frame-text-ring — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .box { position: relative; height: 320px; margin: 40px 24px; border: 28px solid var(--kf-surface); background: var(--kf-raised); }
  .box.-small { height: 200px; }
</style>
</head>
<body>
<p class="demo-hint"><b>frame-text-ring</b> — Just watch — a band of English letters circles the panel clockwise at 50px per second (below 767px width, only the two sides).</p>
<div class="box" data-fx="frame-text-ring" aria-label="COMPANY NAME RECRUITING Site"></div>
<div class="box -small" data-demo-remove data-fx="frame-text-ring" aria-label="REMOVED FRAME"></div>
<template data-demo-late><div class="box -small" data-fx="frame-text-ring" data-fx-frame-text-ring="speed: 80; sides: lr" aria-label="LATE FRAME"></div></template>
<div class="box -small" data-fx="frame-text-ring"></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
