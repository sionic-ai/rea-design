<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bracket-odometer-loader — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); min-height: 100vh; }
  .demo-hint { position: relative; z-index: 60; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-again { margin: 20px; }
</style>
</head>
<body>
<p class="demo-hint"><b>bracket-odometer-loader</b> — Refresh the page. The brackets tighten into a bar and the % wheel spins, then it flashes and lifts away. The button below sends progress values directly.</p>
<div data-fx="bracket-odometer-loader">
  <p data-fx-part="mark">Studio
Name</p>
  <span data-fx-part="focus"></span>
  <p data-fx-part="readout"><span>ISO 100</span><span>f/8</span><span>1/125</span></p>
</div>
<button class="wf-btn demo-again" type="button">Open the panel that sends progress values</button>
<template data-demo-late><div data-fx="bracket-odometer-loader" data-fx-bracket-odometer-loader="auto: false" data-demo-remove><p data-fx-part="mark">Late
Loader</p></div></template>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
document.querySelector(".demo-again").addEventListener("click", () => {
  const el = document.createElement("div");
  el.setAttribute("data-fx", "bracket-odometer-loader");
  el.setAttribute("data-fx-bracket-odometer-loader", "auto: false");
  document.body.appendChild(el);
  [0.2, 0.45, 0.8, 1].forEach((v, i) => setTimeout(() => el.dispatchEvent(new CustomEvent("fx:progress", { detail: v })), 400 + i * 700));
  el.addEventListener("fx:gone", () => el.remove());
});
</script>
</body>
</html>
