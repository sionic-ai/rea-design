<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>random-tilt-hover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 32px; max-width: 1100px; margin: 48px auto; padding: 0 24px; }
  .demo-card { padding: 24px; border-radius: 6px; background: var(--kf-surface); border: 1px solid var(--kf-line); box-shadow: var(--kf-shadow-soft); }
  .demo-card h3 { font-size: 18px; margin-bottom: 8px; }
</style>
</head>
<body>
<p class="demo-hint"><b>random-tilt-hover</b> — On a wide screen, hover over the cards. Each card tilts slightly at its own angle as it grows.</p>
<div class="demo-grid">
  <a class="demo-small" href="#" data-fx="random-tilt-hover"><div class="demo-card"><h3>Post title one</h3><p>Your three-line summary here.</p></div></a>
  <a href="#" data-fx="random-tilt-hover"><div class="demo-card"><h3>Post title two</h3><p>Your three-line summary here.</p></div></a>
  <a href="#" data-fx="random-tilt-hover" data-fx-random-tilt-hover="min: 3; max: 6"><div class="demo-card"><h3>Card that tilts more</h3><p>min 3 · max 6</p></div></a>
</div>
<script>
// Late arrivals and removals — checks that fx-core attaches to an element added after 1s and detaches from an element removed after 2.5s
(() => {
  const src = document.querySelector(".demo-small");
  if (!src) return;
  const html = src.outerHTML;
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => gone.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1 second one more card comes in (a late arrival), and after 2.5 seconds one is removed (detach).");
})();
</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
