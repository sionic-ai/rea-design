<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tile-count-loader — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: sticky; top: 0; z-index: 100; margin: 0; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .band { height: 200px; background: var(--kf-accent); color: var(--kf-on-accent); display: grid; place-items: center; font: var(--kf-weight-display) 40px/1 var(--kf-font-display); }
  .demo-btn { margin: 20px; height: 40px; padding: 0 16px; border: 1px solid var(--kf-line); border-radius: var(--kf-radius-sm); background: var(--kf-surface); color: var(--kf-ink); cursor: pointer; }
</style>
</head>
<body>
<p class="demo-hint"><b>tile-count-loader</b> — On open, the tile counts 3, 2, 1 then grows into the top band. A button re-attaches the loader.</p>
<div class="band">Top Bar</div>
<button class="demo-btn" type="button" id="again">Reattach loader</button>
<div class="loader" data-fx="tile-count-loader" data-fx-tile-count-loader="target: .band"></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script>
// Late arrivals and removals — attaching a new loader with a button (late arrival) makes fx-core re-bind, and the previous loader is removed so detach runs
(() => {
  const html = document.querySelector(".loader").outerHTML;
  document.getElementById("again").addEventListener("click", () => {
    document.querySelectorAll(".loader").forEach((n) => n.remove());
    const t = document.createElement("template");
    t.innerHTML = html;
    document.body.append(t.content.firstElementChild);
  });
  const extra = document.createElement("template");
  extra.innerHTML = html;
  const gone = extra.content.firstElementChild;
  gone.dataset.demo = "gone";
  document.body.append(gone);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 2.5s, one of the stacked loaders drops out (peeled off).");
})();
</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
