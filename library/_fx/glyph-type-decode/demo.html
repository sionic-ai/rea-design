<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>glyph-type-decode — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 500 13px/1.4 var(--kf-font-sans); }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .stage { display: grid; gap: 14px; padding: 60px 40px; }
  .stage h2 { font: 400 56px/1.2 var(--kf-font-mono); text-transform: uppercase; }
  .stage .code { font: 400 32px/1 var(--kf-font-mono); letter-spacing: .1em; }
  .stage button { justify-self: start; padding: 6px 14px; border: 1px solid var(--kf-line); border-radius: var(--kf-radius-pill); background: var(--kf-surface); cursor: pointer; }
</style>
</head>
<body>
<p class="demo-hint"><b>glyph-type-decode</b> — Press ”Again”. The title widens one slot at a time and resolves from symbols (the lower row goes in random order). <span style="color:var(--kf-dim)">(One more title comes in after 1s, and one drops out after 2.5s)</span></p>
<div class="stage" data-demo-stage>
  <h2 data-fx="glyph-type-decode">works</h2>
  <p class="code" data-fx="glyph-type-decode" data-fx-glyph-type-decode="order: random">myWorks</p>
  <p data-fx="glyph-type-decode" data-fx-glyph-type-decode="each: 70" data-demo-remove>Dropped Text</p>
  <button type="button" data-demo-again>Again</button>
</div>
<template data-demo-late><h2 data-fx="glyph-type-decode" data-fx-glyph-type-decode="delay: .2">Late-arrived title</h2></template>
<span data-fx="glyph-type-decode"></span>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
document.querySelector("[data-demo-again]").addEventListener("click", () => document.querySelectorAll('[data-fx="glyph-type-decode"]').forEach((el) => { const v = el.getAttribute("data-fx"); el.setAttribute("data-fx", ""); requestAnimationFrame(() => el.setAttribute("data-fx", v)); }));
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => document.querySelector("[data-demo-stage]").append(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
