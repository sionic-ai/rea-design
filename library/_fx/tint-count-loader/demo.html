<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tint-count-loader — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 1001; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  main { padding: 48px 20px; }
</style>
</head>
<body>
<p class="demo-hint"><b>tint-count-loader</b> — When opened, the number next to the name fills up to 100 while turning from orange to blue, then the black curtain lifts upward (once per window — open a new tab to see it again).</p>
<div data-fx="tint-count-loader" data-fx-tint-count-loader="every: true" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span>Your name here</span><span data-fx-part="count">0</span></div>
<div data-fx="tint-count-loader" data-demo-remove><span data-fx-part="count">0</span></div>
<template data-demo-late><div data-fx="tint-count-loader"><span data-fx-part="count">0</span></div></template>
<main>Hero Behind the Curtain</main>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
document.addEventListener("fx:done", () => { const m = document.querySelector("main"); if (m) m.textContent = "fx:done received — Hero opens"; });
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 300);
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 4000);
</script>
</body>
</html>
