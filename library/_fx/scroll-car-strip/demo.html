<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>scroll-car-strip — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-rail { display: flex; gap: 20px; overflow-x: auto; margin: 24px 20px 0; padding-bottom: 12px; }
  .demo-rail > div { flex: none; width: 320px; height: 220px; border: 1px solid var(--kf-line); background: var(--kf-surface); }
  .demo-page { height: 2400px; }
  .demo-strip { position: fixed; left: 0; bottom: 0; width: 100%; z-index: 50; }
  .demo-strip [data-fx-part="bg"] { background-image: repeating-linear-gradient(90deg, var(--kf-line) 0 2px, transparent 2px 60px); opacity: 0.5; }
  .demo-rail-strip { position: relative; margin: 0 20px; border-bottom: 2px solid var(--kf-line); }
</style>
</head>
<body>
<p class="demo-hint"><b>scroll-car-strip</b> Scroll the page or drag the horizontal panel above sideways. The car runs as far as the progress and turns around depending on direction.</p>
<div class="demo-rail" id="rail"><div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div></div>
<div class="demo-rail-strip" data-fx="scroll-car-strip" data-fx-scroll-car-strip="scroller: #rail" style="--fx-height: 3rem; --fx-car: 4rem">
  <div data-fx-part="bg"></div>
  <a data-fx-part="car" href="#" aria-label="Back to start"><svg viewBox="0 0 80 35"><path d="M6 24c0-5 3-8 8-9l8-8c2-2 4-3 7-3h17c3 0 5 1 7 3l8 8h6c4 0 7 3 7 7v6H6z" style="fill:var(--kf-accent);stroke:currentColor" stroke-width="2.5"/><circle cx="20" cy="29" r="5.5" style="fill:var(--kf-ink)"/><circle cx="60" cy="29" r="5.5" style="fill:var(--kf-ink)"/></svg></a>
</div>
<div class="demo-page"></div>
<div class="demo-strip" data-fx="scroll-car-strip">
  <div data-fx-part="bg"></div>
  <a data-fx-part="car" href="#" aria-label="Back to top"><svg viewBox="0 0 80 35"><path d="M6 24c0-5 3-8 8-9l8-8c2-2 4-3 7-3h17c3 0 5 1 7 3l8 8h6c4 0 7 3 7 7v6H6z" style="fill:var(--kf-accent);stroke:currentColor" stroke-width="2.5"/><circle cx="20" cy="29" r="5.5" style="fill:var(--kf-ink)"/><circle cx="60" cy="29" r="5.5" style="fill:var(--kf-ink)"/></svg></a>
</div>
<script>
(() => {
  const src = document.querySelector(".demo-rail-strip");
  const make = (tag) => { const el = src.cloneNode(true); el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => src.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
})();
</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
