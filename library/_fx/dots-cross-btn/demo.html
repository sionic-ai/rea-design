<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dots-cross-btn — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { display: flex; gap: 40px; align-items: center; padding: 48px 20px; }
  .dark { background: var(--kf-contrast-bg); }
  .dark [data-fx~="dots-cross-btn"] { color: var(--kf-contrast-ink); }
</style>
</head>
<body>
<p class="demo-hint"><b>dots-cross-btn</b> — Hover over the button to see the dot blink, then click to see it turn into an X. <span style="color:var(--kf-dim)">(After 1s one more button comes in, and after 2.5s one drops out)</span></p>
<section class="demo">
  <button data-fx="dots-cross-btn" type="button" aria-label="Menu" aria-expanded="false"><span data-fx-part="dots"><i data-fx-part="dot"></i><i data-fx-part="dot"></i><i data-fx-part="dot"></i></span></button>
  <button data-fx="dots-cross-btn" type="button" aria-label="Menu" data-demo-remove><span data-fx-part="dots"><i data-fx-part="dot"></i><i data-fx-part="dot"></i><i data-fx-part="dot"></i></span></button>
  <template data-demo-late><button data-fx="dots-cross-btn" type="button" aria-label="Late-arriving menu" style="--fx-size: 56px"><span data-fx-part="dots"><i data-fx-part="dot"></i><i data-fx-part="dot"></i><i data-fx-part="dot"></i></span></button></template>
  <button data-fx="dots-cross-btn" type="button" aria-label="Empty button"></button>
</section>
<section class="demo dark">
  <button data-fx="dots-cross-btn" type="button" aria-label="Menu" aria-expanded="true"><span data-fx-part="dots"><i data-fx-part="dot"></i><i data-fx-part="dot"></i><i data-fx-part="dot"></i></span></button>
</section>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); }, 2500);
</script>
</body>
</html>
