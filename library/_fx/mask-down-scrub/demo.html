<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mask-down-scrub — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo-spacer { height: 70vh; display: grid; place-items: center; color: var(--kf-dim); }
  .stage { position: relative; height: 180vh; margin: 0 20px; border-radius: var(--kf-radius-lg); background: var(--kf-surface); overflow: hidden; }
  .road { position: absolute; inset: 120px 0 0; }
  .road svg { width: 100%; height: 100%; }
  .road path { fill: none; stroke: var(--kf-accent-soft); stroke-width: 80; }
  .bar { position: absolute; right: 40px; top: 40px; width: 24px; height: 60%; border-radius: 12px; background: var(--kf-accent); }
</style>
</head>
<body>
<p class="demo-hint"><b>mask-down-scrub</b> — Scroll down and watch the winding path being drawn from the top to the center of the screen. <span style="color:var(--kf-dim)">(After 1s one more bar comes in, and after 2.5s one drops out)</span></p>
<div class="demo-spacer">Scroll down</div>
<section class="stage">
  <div class="road" data-fx="mask-down-scrub" data-fx-mask-down-scrub="on: parent"><svg viewBox="0 0 400 1000" preserveAspectRatio="none" aria-hidden="true"><path d="M420 20C200 60 80 160 80 260S330 380 330 520 60 680 60 820 260 960 380 1010"/></svg></div>
  <span data-demo-remove class="bar" data-fx="mask-down-scrub" style="right:80px"></span>
  <template data-demo-late><span class="bar" data-fx="mask-down-scrub" data-fx-mask-down-scrub="soft: 80"></span></template>
</section>
<div class="demo-spacer"></div>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
