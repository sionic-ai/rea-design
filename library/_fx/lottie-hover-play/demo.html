<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lottie-hover-play — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { margin: 0; padding: 12px 20px; border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .menu { display: flex; flex-direction: column; gap: 32px; max-width: 420px; margin: 60px auto; }
  .menu a { position: relative; width: fit-content; padding-left: 80px; font: 700 32px/1 var(--kf-font-display); }
  .menu .bird { position: absolute; top: -8px; left: 0; width: 70px; }
  .menu .bird path { fill: var(--kf-accent); }
</style>
</head>
<body>
<p class="demo-hint"><b>lottie-hover-play</b> — Hover over the menu text. The bird beside it flaps its wings.</p>
<nav class="menu" id="menu">
  <a href="#">ABOUT<span class="bird" data-fx="lottie-hover-play" data-fx-lottie-hover-play="data: bird"></span></a>
  <a href="#" class="gone">Link to be removed soon<span class="bird" data-fx="lottie-hover-play" data-fx-lottie-hover-play="data: bird"></span></a>
</nav>
<script src="../../_vendor/lottie-web@5.12.2/lottie_svg.min.js"></script>
<script>
// Tiny demo bird drawing (body + one wing that flaps twice in .9s)
(() => {
  const st = (k) => ({ a: 0, k });
  const tr = { ty: "tr", p: st([0, 0]), a: st([0, 0]), s: st([100, 100]), r: st(0), o: st(100), sk: st(0), sa: st(0) };
  const shape = (v) => ({ ty: "gr", it: [{ ty: "sh", ks: st({ i: v.map(() => [0, 0]), o: v.map(() => [0, 0]), v, c: true }) }, { ty: "fl", c: st([0.5, 0.5, 0.5, 1]), o: st(100), r: 1 }, tr] });
  const flap = { a: 1, k: [{ t: 0, s: [0], i: { x: [0.4], y: [1] }, o: { x: [0.6], y: [0] } }, { t: 9, s: [-38], i: { x: [0.4], y: [1] }, o: { x: [0.6], y: [0] } }, { t: 18, s: [22], i: { x: [0.4], y: [1] }, o: { x: [0.6], y: [0] } }, { t: 27, s: [-34], i: { x: [0.4], y: [1] }, o: { x: [0.6], y: [0] } }, { t: 54, s: [0] }] };
  const layer = (ind, v, r, a) => ({ ddd: 0, ind, ty: 4, sr: 1, ao: 0, ip: 0, op: 54, st: 0, bm: 0, ks: { o: st(100), r: r || st(0), p: st([a[0], a[1], 0]), a: st([a[0], a[1], 0]), s: st([100, 100, 100]) }, shapes: [shape(v)] });
  window.fxLottie = { bird: { v: "5.12.2", fr: 60, ip: 0, op: 54, w: 98, h: 67, ddd: 0, assets: [], layers: [layer(1, [[44, 38], [36, 14], [52, 4], [62, 34]], flap, [50, 38]), layer(2, [[18, 44], [66, 34], [84, 26], [58, 50]], null, [0, 0])] } };
})();
// Check it attaches to late-arriving links, and that detach runs for removed links
setTimeout(() => { const a = document.createElement("a"); a.href = "#"; a.innerHTML = 'LATE<span class="bird" data-fx="lottie-hover-play" data-fx-lottie-hover-play="data: bird"></span>'; document.getElementById("menu").append(a); }, 1000);
setTimeout(() => document.querySelector(".gone")?.remove(), 2500);
</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
