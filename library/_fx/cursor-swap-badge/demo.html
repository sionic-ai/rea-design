<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cursor-swap-badge — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .row { display: flex; gap: 40px; justify-content: center; padding: 100px 20px; }
  .round { display: grid; place-items: center; width: 180px; height: 180px; border-radius: 50%; background: var(--kf-ink); color: var(--kf-bg); font-weight: 700; text-decoration: none; }
  .cur { width: 102px; height: 103px; display: grid; place-items: center; }
  .cur svg { position: absolute; inset: 0; width: 100%; height: 100%; animation: spin 20s linear infinite; color: var(--kf-accent); }
  .cur b { font-size: 12px; color: var(--kf-accent); }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<p class="demo-hint"><b>cursor-swap-badge</b> — Hover over the black circle and move around. The cursor turns into a spinning ring badge and follows you.</p>
<div class="row">
  <a class="round" href="#" data-fx="cursor-swap-badge">PAGE TOP
    <span class="cur" data-fx-part="badge"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" fill="none" stroke="currentColor" stroke-width="3" stroke-dasharray="6 5"/></svg><b>TOP</b></span>
  </a>
</div>
<script>
(() => {
  const src = document.querySelector('[data-fx~="cursor-swap-badge"]');
  if (!src || !src.parentNode) return;
  const host = src.parentNode;
  const gone = src.cloneNode(true);
  src.after(gone);
  setTimeout(() => host.append(src.cloneNode(true)), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s one more circle comes in, and after 2.5s one leaves.");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
