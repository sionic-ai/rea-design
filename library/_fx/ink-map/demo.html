<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ink-map — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { padding: 48px 20px; }
  .demo-btn { display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 16px; border: 1px solid var(--kf-line); border-radius: var(--kf-radius-sm); background: var(--kf-surface); color: var(--kf-ink); cursor: pointer; }
  .demo-card { padding: 20px; border: 1px solid var(--kf-line); border-radius: var(--kf-radius-md); background: var(--kf-surface); }
  .demo-spacer { height: 90vh; display: grid; place-items: center; color: var(--kf-dim); }
  .tools { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .tools button[aria-pressed="true"] { border-color: var(--kf-ink); font-weight: 600; }
  .paper { height: 70vh; border: 1px solid var(--kf-line); border-radius: var(--kf-radius-md); overflow: hidden; }
</style>
</head>
<body>
<p class="demo-hint"><b>ink-map</b> — Pick a tool and drag on the board — coastlines are drawn in circles, trees and mountains with a long drag, and buildings with a single click.</p>
<section class="demo">
<div class="tools" id="tools">
<button class="demo-btn" data-t="coast" aria-pressed="true">Coastline</button><button class="demo-btn" data-t="tree">Tree</button><button class="demo-btn" data-t="tree" data-o="round">Round Tree</button>
<button class="demo-btn" data-t="mountain" data-s="sm">Mountain small</button><button class="demo-btn" data-t="mountain" data-s="lg">Mountain large</button>
<button class="demo-btn" data-t="building" data-k="castle">Castle</button><button class="demo-btn" data-t="building" data-k="house">House</button><button class="demo-btn" data-t="building" data-k="tower">Tower</button>
<button class="demo-btn" data-t="route">Dotted path</button><button class="demo-btn" id="clear">Clear all</button></div>
<div class="paper" id="map" data-fx="ink-map" data-fx-ink-map="tool: coast"></div>
</section>
<script>
const map = document.getElementById("map"), tools = document.getElementById("tools");
tools.addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.id === "clear") return map.dispatchEvent(new Event("fx:clear"));
  tools.querySelectorAll("[data-t]").forEach((x) => x.setAttribute("aria-pressed", x === b));
  map.setAttribute("data-fx-ink-map", [`tool: ${b.dataset.t}`, b.dataset.o === "round" && "round: true", b.dataset.s && `size: ${b.dataset.s}`, b.dataset.k && `kind: ${b.dataset.k}`].filter(Boolean).join("; "));
});
</script>
<script>
// Late arrivals and removals — checks that fx-core attaches to an element added after 1s and detaches from an element removed after 2.5s
(() => {
  const src = document.querySelector('[data-fx~="ink-map"]');
  if (!src) return;
  const html = src.outerHTML.replace(/\sid="[^"]*"/g, "");
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => (src.closest(".pin-spacer") || src).after(make("late")), 1000); // Once pinned the panel gets wrapped in a pin-spacer, so place it outside that
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical one comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
