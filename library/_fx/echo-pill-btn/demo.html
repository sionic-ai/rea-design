<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>echo-pill-btn — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { margin: 0; padding: 48px; font-family: var(--kf-font-sans); background: var(--kf-bg); color: var(--kf-ink); display: grid; gap: 32px; justify-items: start; }
  .row { display: flex; gap: 24px; align-items: center; flex-wrap: wrap; }
  .dark { padding: 32px; background: var(--kf-contrast-bg); }
</style>
</head>
<body>
  <p class="demo-hint"><b>echo-pill-btn</b> — Hover over the button — the echoes on both sides fold into the pill and the letters roll over one by one.</p>
  <div class="row" id="row">
    <a data-fx="echo-pill-btn" href="#"><span data-fx-part="label">See how</span></a>
    <a data-fx="echo-pill-btn" href="#"><span data-fx-part="label">View details</span></a>
    <button data-fx="echo-pill-btn" data-fx-echo-pill-btn="stagger: 30" type="button"><span data-fx-part="label">Slow roll</span></button>
  </div>
  <template data-demo-late><a data-fx="echo-pill-btn" href="#"><span data-fx-part="label">Button that came in after 1s</span></a></template>
  <a data-fx="echo-pill-btn" data-demo-remove href="#"><span data-fx-part="label">Button that drops out after 2.5s</span></a>
  <a data-fx="echo-pill-btn" href="#"></a>
  <div class="dark"><a data-fx="echo-pill-btn" href="#" style="--fx-bg: var(--kf-contrast-ink); --fx-ink: var(--kf-contrast-bg)"><span data-fx-part="label">On the dark board</span></a></div>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
