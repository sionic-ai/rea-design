<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>stripe-edge-btn — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .row { display: flex; gap: 24px; padding: 60px 40px; flex-wrap: wrap; }
  .btn { display: flex; align-items: center; justify-content: space-between; width: 280px; height: 56px; padding: 0 20px 0 32px; font-weight: 700; }
  .btn i { width: 22px; height: 22px; border-radius: 50%; background: var(--kf-ink); }
</style>
</head>
<body>
<p class="demo-hint"><b>stripe-edge-btn</b> — Hover over the button. A striped border slides along and the inner panel grows slightly. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<div class="row" id="row">
  <a class="btn" href="#" data-fx="stripe-edge-btn"><span data-fx-part="label">View details</span><i data-fx-part="arrow"></i><span data-fx-part="edge"></span></a>
  <a class="btn" href="#" data-fx="stripe-edge-btn" style="--fx-edge: 5px; --fx-radius: 16px; --fx-stripe: linear-gradient(90deg, var(--kf-accent) 0 50%, var(--kf-ink) 50%)"><span data-fx-part="label">Thick border</span><span data-fx-part="edge"></span></a>
  <a class="btn" href="#" data-fx="stripe-edge-btn" data-demo-remove><span data-fx-part="label">Omission</span><span data-fx-part="edge"></span></a>
</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script>
setTimeout(() => document.getElementById("row").insertAdjacentHTML("beforeend", '<a class="btn" href="#" data-fx="stripe-edge-btn"><span data-fx-part="label">Late</span><span data-fx-part="edge"></span></a>'), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
