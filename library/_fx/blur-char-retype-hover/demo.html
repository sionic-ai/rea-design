<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>blur-char-retype-hover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 500 13px/1.4 var(--kf-font-sans); }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .row { display: flex; gap: 16px; margin: 40px; }
  .btn { display: inline-flex; align-items: center; height: 48px; padding: 0 24px; border-radius: var(--kf-radius-pill); background: var(--kf-accent); color: var(--kf-on-accent); font-size: 14px; }
  .btn.is-dark { background: var(--kf-contrast-bg); color: var(--kf-contrast-ink); }
</style>
</head>
<body>
<p class="demo-hint"><b>blur-char-retype-hover</b> — Hover over the button and then leave. Letters are re-stamped one by one from blur. <span style="color:var(--kf-dim)">(After 1s one more button comes in, and after 2.5s one drops out)</span></p>
<div class="row">
  <a href="#" class="btn" data-fx="blur-char-retype-hover"><span data-fx-part="text">Book a call</span></a>
  <a href="#" class="btn is-dark" data-fx="blur-char-retype-hover">Book a consultation</a>
  <a href="#" class="btn" data-fx="blur-char-retype-hover" data-demo-remove>Omitted button</a>
</div>
<template data-demo-late><div class="row"><a href="#" class="btn" data-fx="blur-char-retype-hover" data-fx-blur-char-retype-hover="blur: 10; each: .05">Late-arriving button</a></div></template>
<a data-fx="blur-char-retype-hover"></a>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); }, 2500);
</script>
</body>
</html>
