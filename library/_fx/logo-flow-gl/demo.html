<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>logo-flow-gl — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { margin: 0; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .stage { min-height: 70vh; display: grid; place-items: center; border-bottom: 1px solid var(--kf-line); }
  .mark { width: min(720px, 86vw); aspect-ratio: 105 / 58; }
</style>
</head>
<body>
<p class="demo-hint"><b>logo-flow-gl</b> — Patterns slowly melt and flow inside the logo. Sweep the mouse over the logo — the pattern where you passed is pushed and then settles back.</p>
<section class="stage">
  <div class="mark" data-fx="logo-flow-gl">
    <svg data-fx-part="shape" viewBox="0 0 105 58" aria-hidden="true">
      <circle cx="29" cy="29" r="22.5" fill="none" stroke="currentColor" stroke-width="13"/>
      <path d="M70.5 58V20.5a14 14 0 0 1 28 0V58" fill="none" stroke="currentColor" stroke-width="13"/>
    </svg>
  </div>
</section>
<script>
// Late arrivals·removals — after 1s one more of the same panel comes in (late arrival), after 2.5s one of them is removed (detach)
(() => {
  const src = document.querySelector(".stage");
  const html = src.outerHTML;
  const make = () => { const t = document.createElement("template"); t.innerHTML = html; return t.content.firstElementChild; };
  const gone = make();
  src.after(gone);
  setTimeout(() => document.body.append(make()), 1000);
  setTimeout(() => gone.remove(), 2500);
})();
</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
