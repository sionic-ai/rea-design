<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mask-shrink-intro — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { margin: 0; background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 5; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .box { position: relative; height: 80vh; margin: 24px; border: 1px solid var(--kf-line); display: grid; place-items: center; }
  .box [data-fx~="mask-shrink-intro"] { position: absolute; inset: 0; }
  .box .wf-img { width: 100%; height: 100%; }
  .windows { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 0 100px; margin: auto auto 91.78px; }
  .windows i { width: 279px; height: 333px; flex-shrink: 0; border-radius: 140px / 150px; border: 20px solid var(--kf-raised); }
  .windows i:nth-child(2) { visibility: hidden; }
</style>
</head>
<body>
<p class="demo-hint"><b>mask-shrink-intro</b> — Plays by itself when opened. The image inside the window shape looks larger than the screen, then after 4 seconds shrinks to a small window and the curtain lifts. <span style="color:var(--kf-dim)">(After 1s one more panel comes in, and one leaves 2.5s later)</span></p>
<div class="box"><p>Your Hero here</p>
  <div data-fx="mask-shrink-intro"><div data-fx-part="mask"><div class="wf-img" data-fx-part="media" data-label="Opening video · satellite-view map · landscape 16:9"></div></div><div class="windows"><i data-fx-part="frame"></i><i data-fx-part="frame"></i><i data-fx-part="frame"></i></div></div>
</div>
<div class="box" data-demo-remove><div data-fx="mask-shrink-intro" data-fx-mask-shrink-intro="hold: 1; dur: 1"><div data-fx-part="mask"><div class="wf-img" data-label="Dropped Panel"></div></div></div></div>
<div id="late"></div>
<template data-demo-late><div class="box"><div data-fx="mask-shrink-intro" data-fx-mask-shrink-intro="from: 200; to: 153; delay: 0"><div data-fx-part="mask"><div class="wf-img" data-fx-part="media" data-label="Late panel"></div></div></div></div></template>
<div class="box"><div data-fx="mask-shrink-intro"></div></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => document.getElementById("late").append(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
