<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sticky-shrink-dim — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 500 13px/1.4 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 5; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .stack { padding: 40px; --fx-gap: 40px; --fx-top: 60px; }
  .card { display: flex; height: 70vh; border-radius: var(--kf-radius-md); overflow: hidden; background: var(--kf-surface); border: 1px solid var(--kf-line); }
  .card p { flex: 1; padding: 24px; font-size: 22px; }
  .card .ph { flex: 1; overflow: hidden; }
  .card .wf-img { height: 100%; }
  .pad { height: 60vh; }
</style>
</head>
<body>
<p class="demo-hint"><b>sticky-shrink-dim</b> Scroll down. A card sticks at the top, and while the next card covers it, the previous card shrinks and darkens. <span style="color:var(--kf-dim)">(After 1s one more card bundle comes in, and after 2.5s one drops out)</span></p>
<div class="stack" data-fx="sticky-shrink-dim">
  <article class="card" data-fx-part="card"><p>Card 1</p><div class="ph"><div class="wf-img" data-fx-part="media" data-label="Photo 1"></div></div></article>
  <article class="card" data-fx-part="card"><p>Card 2</p><div class="ph"><div class="wf-img" data-fx-part="media" data-label="Photo 2"></div></div></article>
  <article class="card" data-fx-part="card"><p>Card 3</p><div class="ph"><div class="wf-img" data-fx-part="media" data-label="Photo 3"></div></div></article>
</div>
<div class="stack" data-fx="sticky-shrink-dim" data-demo-remove><article class="card" data-fx-part="card"><p>Card to drop</p></article></div>
<div data-demo-slot></div>
<template data-demo-late><div class="stack" data-fx="sticky-shrink-dim" data-fx-sticky-shrink-dim="scale: .95; bright: .5"><article class="card" data-fx-part="card"><p>Late 1</p></article><article class="card" data-fx-part="card"><p>Late 2</p></article></div></template>
<div data-fx="sticky-shrink-dim"></div>
<div class="pad"></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); }, 2500);
</script>
</body>
</html>
