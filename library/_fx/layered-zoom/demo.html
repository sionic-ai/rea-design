<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>layered-zoom — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo-spacer { height: 90vh; display: grid; place-items: center; color: var(--kf-dim); }
  .zoom { height: 320vh; }
  .zoom__sticky { position: sticky; top: 0; height: 100vh; padding: 4px; }
  .zoom__frame { height: 100%; border-radius: var(--kf-radius-md); background: var(--kf-accent); }
  .zoom .wf-img { height: 100%; border: 0; }
  .zoom__num { position: absolute; left: 24px; bottom: 20px; z-index: 3; color: var(--kf-on-accent); font: 400 48px/1 var(--kf-font-display); }
</style>
</head>
<body>
<p class="demo-hint"><b>layered-zoom</b> — Scroll down — a small photo inside the panel grows layer by layer and covers the panel.</p>
<div class="demo-spacer">↓ Scroll</div>
<section class="zoom" data-fx="layered-zoom">
  <div class="zoom__sticky">
    <div class="zoom__frame" data-fx-part="frame">
      <div data-fx-part="layer" style="opacity:.5"><div class="wf-img" data-label="Same photo layer 2"></div></div>
      <div data-fx-part="layer" style="opacity:.75"><div class="wf-img" data-label="Same photo layer 1"></div></div>
      <div data-fx-part="photo"><div class="wf-img" data-label="Living room photo · landscape 16:10"></div></div>
      <p class="zoom__num" data-fx-part="reveal">01 / 05</p>
    </div>
  </div>
</section>
<div class="demo-spacer">Footer</div>
<script>
// Late arrivals and removals — checks that fx-core attaches to an element added after 1s and detaches from an element removed after 2.5s
(() => {
  const src = document.querySelector('[data-fx~="layered-zoom"]');
  if (!src) return;
  const html = src.outerHTML.replace(/\sid="[^"]*"/g, "");
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => (src.closest(".pin-spacer") || src).after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical panel comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script>gsap.registerPlugin(ScrollTrigger);</script>
<script src="fx.js"></script>
</body>
</html>
