<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>shuffle-text — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { padding: 48px 20px; }
  .demo-spacer { height: 90vh; display: grid; place-items: center; color: var(--kf-dim); }
  .t { font: var(--kf-weight-display) 48px/1 var(--kf-font-display); }
  .digits { display: flex; gap: 7px; }
  .digits span { width: 39px; height: 64px; background: var(--kf-raised); font: 400 58px/64px var(--kf-font-mono); text-align: center; }
  .menu a { display: block; font: 500 20px/30px var(--kf-font-display); }
</style>
</head>
<body>
<p class="demo-hint"><b>shuffle-text</b> — On load the title, and on scroll the date cells, scramble into numbers then settle back. Hover over the menu.</p>
<section class="demo"><h1 class="t" data-fx="shuffle-text" data-fx-shuffle-text="on: load; delay: .3">SECTION TITLE</h1></section>
<section class="demo menu"><a href="#" data-fx="shuffle-text" data-fx-shuffle-text="on: hover">MENU 01</a><a href="#" data-fx="shuffle-text" data-fx-shuffle-text="on: hover; chars: ABCDEFGHIJKLMNOPQRSTUVWXYZ; empty: -">MENU 02</a></section>
<div class="demo-spacer">Scroll down</div>
<section class="demo"><p class="digits" data-fx="shuffle-text" data-fx-shuffle-text="dur: 2"><span data-fx-part="text">1</span><span data-fx-part="text">0</span><span data-fx-part="text">2</span><span data-fx-part="text">0</span></p></section>
<div class="demo-spacer"></div>
<script>
(() => {
  const src = document.querySelector('[data-fx~="shuffle-text"]');
  const html = src.outerHTML;
  const make = () => { const t = document.createElement("template"); t.innerHTML = html; return t.content.firstElementChild; };
  const gone = make(); src.after(gone);
  setTimeout(() => src.after(make()), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s one more of the same comes in, and after 2.5s one drops out.");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../../_vendor/shuffle-text@0.3.6/shuffle-text.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
