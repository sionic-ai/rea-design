<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>idle-return-bar — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { margin: 0; color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; margin: 0; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  section { min-height: 90vh; padding: 40px; border-bottom: 1px solid var(--kf-line); font: 600 32px/1.2 var(--kf-font-display); }
  .demo-bar { position: fixed; left: 20px; right: 20px; bottom: 0; z-index: 50; padding: 14px 16px; border-top: 1px solid var(--kf-ink-soft); background: var(--kf-bg); font: 500 12px/1.5 var(--kf-font-mono); }
  .demo-bar.is-left { right: auto; bottom: 60px; border: 1px solid var(--kf-line); }
</style>
</head>
<body>
<p class="demo-hint"><b>idle-return-bar</b> — Scroll. The bar below hides while moving and comes back 1 second after you stop <span style="opacity:.6">(After 1s one more bar comes in, and after 2.5s one drops out)</span></p>
<section>Section One</section>
<section>Section Two</section>
<section>Section Three</section>
<div class="demo-bar" data-fx="idle-return-bar">Your one line with today’s date · weather · temperature here</div>
<div class="demo-bar is-left" data-demo-remove data-fx="idle-return-bar">Bar to Be Removed</div>
<template data-demo-late><div class="demo-bar is-left" style="bottom: 120px" data-fx="idle-return-bar" data-fx-idle-return-bar="wait: .5">Delayed bar (.5s)</div></template>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
