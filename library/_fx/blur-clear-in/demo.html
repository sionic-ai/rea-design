<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>blur-clear-in — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.6 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo-spacer { height: 80vh; display: grid; place-items: center; color: var(--kf-dim); }
  .pic { width: min(90%, 900px); aspect-ratio: 3 / 2; margin: 0 auto 80px; }
  .pic > div { background: linear-gradient(135deg, var(--kf-accent), var(--kf-raised) 60%, var(--kf-ink)); }
</style>
</head>
<body>
<p class="demo-hint"><b>blur-clear-in</b> — Scroll down and the photo sharpens from a heavy blur while growing slightly. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<div class="demo-spacer">Scroll down</div>
<div class="pic" data-fx="blur-clear-in"><div data-fx-part="media"></div></div>
<div class="pic" data-fx="blur-clear-in" data-demo-remove><div></div></div>
<div class="pic" data-fx="blur-clear-in" style="--fx-blur: 10px; --fx-scale: 1; --fx-dur: 1.8s"><div data-fx-part="media"></div></div>
<template data-demo-late><div class="pic" data-fx="blur-clear-in"><div data-fx-part="media"></div></div></template>
<div data-fx="blur-clear-in"></div>
<div class="demo-spacer">Footer</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
