<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sticky-cover-drift — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: sticky; top: 0; z-index: 50; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .panel h2 { position: absolute; left: 24px; bottom: 40px; margin: 0; font: var(--kf-weight-display) 48px/1 var(--kf-font-display); }
  .panel [data-fx-part="media"] { background: linear-gradient(180deg, var(--kf-raised), var(--kf-line)); }
  .panel [data-fx-part="media"]::after { content: ""; position: absolute; inset: 20% 30%; border: 2px solid var(--kf-ink); border-radius: 50%; }
  .tail { height: 60vh; }
</style>
</head>
<body>
<p class="demo-hint"><b>sticky-cover-drift</b> — Scroll down. While a section stands on screen the next one covers it, and the image in the standing section drifts slowly upward. <span style="color:var(--kf-dim)">(After 1s one more section comes in, and one leaves 2.5s later)</span></p>
<main id="stack">
  <section class="panel" data-fx="sticky-cover-drift" style="z-index:1"><div data-fx-part="media"></div><h2>Project One</h2></section>
  <section class="panel" data-fx="sticky-cover-drift" style="z-index:2" data-demo-remove><div data-fx-part="media"></div><h2>Remove</h2></section>
  <section class="panel" data-fx="sticky-cover-drift" style="z-index:3; --fx-gap: 300px"><div data-fx-part="media"></div><h2>Project Two</h2></section>
  <section class="panel" data-fx="sticky-cover-drift" style="z-index:4" data-fx-sticky-cover-drift="drift: 0.15"><div data-fx-part="media"></div><h2>Project Three</h2></section>
</main>
<div class="tail"></div>
<template data-demo-late><section class="panel" data-fx="sticky-cover-drift" style="z-index:5"><div data-fx-part="media"></div><h2>Late</h2></section></template>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => document.getElementById("stack").append(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
