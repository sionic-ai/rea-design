<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>brush-swap-hover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 24px; padding: 40px; }
  .card { display: flex; flex-direction: column; gap: 10px; color: inherit; text-decoration: none; }
  .media { position: relative; height: 380px; border-radius: var(--kf-radius-md); }
  .media .wf-img { position: absolute; inset: 0; height: 100%; }
  .row { display: flex; justify-content: space-between; align-items: center; }
  .arrow { width: 32px; height: 32px; border-radius: 50%; align-items: center; justify-content: center; background: var(--kf-accent); color: var(--kf-on-accent); }
</style>
</head>
<body>
<p class="demo-hint"><b>brush-swap-hover</b> — Hover over the card. A brush stroke covers the photo, and the stroke reveals a second photo. <span style="color:var(--kf-dim)">(One more card comes in after 1s, and one drops out after 2.5s)</span></p>
<main class="demo">
  <a class="card" href="#" data-fx="brush-swap-hover"><div class="media" data-fx-part="media"><div class="wf-img" data-label="First photo · product front"></div><div class="wf-img" data-fx-part="swap" data-label="Second photo · worn shot"></div></div><div class="row"><span>Card name 01</span><span class="arrow" data-fx-part="arrow">→</span></div></a>
  <a class="card" href="#" data-fx="brush-swap-hover" data-fx-brush-swap-hover="width: 900; lag: 0" data-demo-remove><div class="media" data-fx-part="media"><div class="wf-img" data-label="First photo"></div><div class="wf-img" data-fx-part="swap" data-label="Second Photo"></div></div><div class="row"><span>Card name 02</span></div></a>
  <a class="card" href="#" data-fx="brush-swap-hover"><div class="media" data-fx-part="media"><div class="wf-img" data-label="No second photo — brushstroke only"></div></div><div class="row"><span>Card name 03</span></div></a>
  <template data-demo-late><a class="card" href="#" data-fx="brush-swap-hover"><div class="media" data-fx-part="media"><div class="wf-img" data-label="Late-arriving card"></div><div class="wf-img" data-fx-part="swap" data-label="Second Photo"></div></div><div class="row"><span>Card name 04</span></div></a></template>
</main>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
