<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pill-text-flow — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .stage { display: flex; gap: 24px; flex-wrap: wrap; padding: 60px 40px; }
  .face { fill: var(--kf-accent); }
</style>
</head>
<body>
<p class="demo-hint"><b>pill-text-flow</b> — Text flows inside the pill. Hover over it, then press Menu. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<div class="stage">
  <button type="button" class="m" data-fx="pill-text-flow" aria-expanded="false"><span data-fx-part="row"><span>Menu</span><svg viewBox="0 0 20 20" aria-hidden="true"><circle class="face" cx="10" cy="10" r="9"/></svg></span></button>
  <a href="#" data-demo-remove data-fx="pill-text-flow"><span data-fx-part="row"><span>Contact</span><svg viewBox="0 0 20 20" aria-hidden="true"><circle class="face" cx="10" cy="10" r="9"/></svg></span></a>
  <a href="#" data-fx="pill-text-flow" style="--fx-w: 200px"><span data-fx-part="row"><span>Your text here</span></span></a>
  <template data-demo-late><a href="#" data-fx="pill-text-flow"><span data-fx-part="row"><span>Late</span></span></a></template>
  <span data-fx="pill-text-flow"><span data-fx-part="row"></span></span>
</div>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
document.querySelector(".m").addEventListener("click", (e) => { const b = e.currentTarget; b.setAttribute("aria-expanded", String(b.getAttribute("aria-expanded") !== "true")); });
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
