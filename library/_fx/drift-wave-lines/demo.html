<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>drift-wave-lines — Wave lines flowing as if breathing</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { padding: 40px; font-family: var(--kf-font-sans); color: var(--kf-ink); background: var(--kf-bg); }
  .band { height: 400px; margin-bottom: 24px; border: 1px solid var(--kf-line); --fx-wave-color: var(--kf-ink); }
</style>
</head>
<body>
<p>Watch closely — four wavy lines flow and their height breathes (after 1s one more panel is added, after 2s the first panel drops out).</p>
<div id="stage">
  <div class="band" id="first" data-fx="drift-wave-lines"></div>
</div>
<script src="../../_vendor/createjs@1.0.1/createjs.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
  setTimeout(() => {
    const el = document.createElement("div");
    el.className = "band";
    el.setAttribute("data-fx", "drift-wave-lines");
    el.setAttribute("data-fx-drift-wave-lines", "dur: 4; scale: 0.6; shift-y: -60");
    document.getElementById("stage").append(el);
  }, 1000);
  setTimeout(() => document.getElementById("first").remove(), 2000);
</script>
</body>
</html>
