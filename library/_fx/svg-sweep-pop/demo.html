<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>svg-sweep-pop — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-spacer { height: 70vh; display: grid; place-items: center; color: var(--kf-dim); }
  .art { padding: 20px; }
  .art svg { width: 100%; height: auto; }
  .a { fill: var(--kf-accent); } .b { fill: var(--kf-accent-soft); } .c { fill: var(--kf-ink); }
</style>
</head>
<body>
<p class="demo-hint"><b>svg-sweep-pop</b> — Scroll down and the shapes rise one by one from the left. <span style="color:var(--kf-dim)">(After 1s one more picture comes in, and after 2.5s one drops out)</span></p>
<div class="demo-spacer">Scroll down</div>
<div class="art" data-fx="svg-sweep-pop" data-demo-art></div>
<div class="art" data-demo-remove data-fx="svg-sweep-pop" data-fx-svg-sweep-pop="step: .02; delay: 0" data-demo-art></div>
<template data-demo-late><div class="art" data-fx="svg-sweep-pop" data-fx-svg-sweep-pop="step: .004; dur: .6" data-demo-art></div></template>
<div class="art" data-fx="svg-sweep-pop"><p>Board with no shapes — should pass quietly</p></div>
<div class="demo-spacer"></div>
<script>
// The drawing is a demo: bars and triangular roofs joined together
const art = () => { let s = ""; for (let i = 0; i < 40; i++) { const x = i * 40, h = 60 + ((i * 37) % 90); s += `<rect class="a" x="${x}" y="${300 - h}" width="34" height="${h}"/><polygon class="b" points="${x},${300 - h} ${x + 17},${270 - h} ${x + 34},${300 - h}"/><rect class="c" x="${x + 12}" y="${310 - h}" width="10" height="10"/>`; } return `<svg viewBox="0 0 1600 320">${s}</svg>`; };
const fill = (root) => root.querySelectorAll("[data-demo-art]").forEach((n) => { if (!n.querySelector("svg")) n.innerHTML = art(); });
fill(document);
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => { const f = t.content.cloneNode(true); fill(f); t.replaceWith(f); }), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); window.ScrollTrigger?.refresh(); }, 2500);
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
