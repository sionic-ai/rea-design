<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>corner-wrap-fill — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  main { padding: 60px 40px; display: flex; flex-wrap: wrap; gap: 40px; }
  .demo-btn { display: flex; align-items: center; width: 220px; height: 50px; text-align: center; }
  .demo-btn span { display: block; width: 100%; padding: 0 30px; font-size: 14px; }
</style>
</head>
<body>
<p class="demo-hint"><b>corner-wrap-fill</b> — Hover over the button. Two corner brackets grow to wrap the button and fill with color. <span style="color:var(--kf-dim)">(After 1s one more button comes in, and after 2.5s the first button leaves)</span></p>
<main>
  <a class="demo-btn" href="#" data-fx="corner-wrap-fill" data-demo-remove><span>Exit button</span></a>
  <a class="demo-btn" href="#" data-fx="corner-wrap-fill"><span>See other stores</span></a>
  <a class="demo-btn" href="#" data-fx="corner-wrap-fill" style="--fx-tick: 15px; --fx-dur: .6s"><span>Bracket 15px · .6s</span></a>
  <template data-demo-late><a class="demo-btn" href="#" data-fx="corner-wrap-fill"><span>Late-arriving button</span></a></template>
</main>
<script src="../fx-core.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
