<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>veil-fade-loader — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .page { display: grid; place-items: center; height: 70vh; font-size: 28px; }
  .box { position: relative; height: 240px; margin: 20px; border: 1px solid var(--kf-line); }
  .box [data-fx~="veil-fade-loader"] { position: absolute; z-index: 1; }
</style>
</head>
<body>
<p class="demo-hint"><b>veil-fade-loader</b> — Try reloading. Once the document has fully loaded, the ring appears after .5s and the cover lifts after 1s, over .8s. <span style="color:var(--kf-dim)">(After 1s one more small panel comes in, and after 2.5s one leaves)</span></p>
<script type="application/json" id="demo-ring">{"v":"5.7.4","fr":50,"ip":0,"op":100,"w":400,"h":400,"nm":"demo","ddd":0,"assets":[],"layers":[{"ddd":0,"ind":1,"ty":4,"nm":"ring","sr":1,"ao":0,"bm":0,"ip":0,"op":100,"st":0,"ks":{"o":{"a":0,"k":100},"r":{"a":0,"k":0},"p":{"a":0,"k":[200,200,0]},"a":{"a":0,"k":[0,0,0]},"s":{"a":1,"k":[{"t":0,"s":[100,100,100],"o":{"x":[0.8,0.8,0.333],"y":[0,0,0]},"i":{"x":[0.5,0.5,0.667],"y":[1,1,1]}},{"t":50,"s":[0,0,100],"o":{"x":[0.667,0.667,0.167],"y":[0,0,0]},"i":{"x":[0.2,0.2,0.833],"y":[1,1,1]}},{"t":99,"s":[100,100,100]}]}},"shapes":[{"ty":"gr","it":[{"ty":"el","d":1,"p":{"a":0,"k":[0,0]},"s":{"a":0,"k":[360,360]}},{"ty":"el","d":1,"p":{"a":0,"k":[0,0]},"s":{"a":0,"k":[240,240]}},{"ty":"fl","c":{"a":0,"k":[0,0,0,1]},"o":{"a":0,"k":100},"r":2},{"ty":"tr","p":{"a":0,"k":[0,0]},"a":{"a":0,"k":[0,0]},"s":{"a":0,"k":[100,100]},"r":{"a":0,"k":0},"o":{"a":0,"k":100}}]}]}]}</script>
<div data-fx="veil-fade-loader" data-fx-veil-fade-loader="src: #demo-ring"><div data-fx-part="spinner"></div></div>
<main class="page">Page behind the curtain</main>
<div class="box" data-demo-remove><div data-fx="veil-fade-loader" data-fx-veil-fade-loader="delay: 2; fade: .8"><div data-fx-part="spinner">Loading</div></div></div>
<template data-demo-late><div class="box"><div data-fx="veil-fade-loader" data-fx-veil-fade-loader="src: #demo-ring; delay: 3"><div data-fx-part="spinner"></div></div></div></template>
<div class="box"><div data-fx="veil-fade-loader" data-fx-veil-fade-loader="delay: 4"></div></div>

<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../_vendor/lottie-web@5.8.1/lottie.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
