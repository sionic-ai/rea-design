<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tilt-rise-chars — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-spacer { height: 70vh; display: grid; place-items: center; color: var(--kf-dim); }
  .demo { padding: 48px 20px; }
  .demo h2 { font: 500 clamp(56px, 9vw, 140px)/0.95 var(--kf-font-display); letter-spacing: -0.06em; margin: 0 0 60px; }
</style>
</head>
<body>
<p class="demo-hint"><b>tilt-rise-chars</b> — Scroll down and large title letters pop up tilted and settle into place.</p>
<div class="demo-spacer">Scroll down ↓</div>
<section class="demo">
  <h2 data-fx="tilt-rise-chars">Let’s create<br>together.</h2>
  <h2 data-fx="tilt-rise-chars" data-fx-tilt-rise-chars="dur: 1.2; each: .05">Your big one-line title here</h2>
</section>
<div class="demo-spacer"></div>
<script>
(() => {
  const src = document.querySelector('[data-fx~="tilt-rise-chars"]');
  if (!src) return;
  const html = src.outerHTML;
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => src.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical one comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
