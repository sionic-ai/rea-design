<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>corner-grow-menu — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); min-height: 200vh; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .menu { position: fixed; top: 64px; right: 4vw; z-index: 200; }
  .menu.is-late { top: 150px; }
  .btn { display: grid; place-items: center; width: 64px; height: 64px; border: 3px solid var(--kf-accent); border-radius: 50%; background: var(--kf-surface); }
  .btn i { display: block; width: 24px; height: 3px; background: var(--kf-ink); transition: transform 0.3s ease; }
  .btn i + i { margin-top: -18px; }
  .menu.is-open .btn i:first-child { transform: translateY(4px) rotate(45deg); }
  .menu.is-open .btn i:last-child { transform: translateY(-4px) rotate(-45deg); }
  .links { display: grid; gap: 18px; font: 700 24px/1.3 var(--kf-font-display); }
  .links a:hover { color: var(--kf-accent); }
</style>
</head>
<body>
<p class="demo-hint"><b>corner-grow-menu</b> Click the round button at the top right. The panel grows from the corner, and clicking the panel or pressing Esc closes it. <span style="color:var(--kf-dim)">(After 1s one more button comes in, and after 2.5s one drops out)</span></p>
<div class="menu" data-fx="corner-grow-menu" data-demo-remove>
  <button class="btn" type="button" data-fx-part="toggle" aria-label="Menu"><i></i><i></i></button>
  <div data-fx-part="bg"></div>
  <nav class="links" data-fx-part="panel"><a href="#">Menu First</a><a href="#">Menu Two</a><a href="#">Menu Three</a></nav>
</div>
<div class="menu" data-fx="corner-grow-menu">
  <button class="btn" type="button" data-fx-part="toggle" aria-label="Menu"><i></i><i></i></button>
  <div data-fx-part="bg"></div>
  <nav class="links" data-fx-part="panel"><a href="#">What we do</a><a href="#">Notice</a><a href="#">Contact Us</a></nav>
</div>
<template data-demo-late>
  <div class="menu is-late" data-fx="corner-grow-menu" data-fx-corner-grow-menu="w: 60vw; h: 70dvh; dur: .5">
    <button class="btn" type="button" data-fx-part="toggle" aria-label="Small menu"><i></i><i></i></button>
    <div data-fx-part="bg"></div>
  </div>
</template>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
