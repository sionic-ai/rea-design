<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>text-ring-spin — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .row { display: flex; flex-wrap: wrap; gap: 32px; padding: 40px 24px; }
  .ring { width: min(420px, 80vw); color: var(--kf-dim); }
  .ring.-small { width: 220px; color: var(--kf-accent); }
  .bg { position: relative; height: 420px; margin: 0 24px 40px; overflow: hidden; background: var(--kf-surface); border: 1px solid var(--kf-line); }
  .bg .ring { position: absolute; width: 640px; left: -160px; top: 40px; opacity: .3; color: var(--kf-ink); }
  .bg h2 { position: relative; padding: 140px 0 0 30%; font-size: 40px; }
</style>
</head>
<body>
<p class="demo-hint"><b>text-ring-spin</b> — Just watch — the letter circle turns slowly once every 200 seconds (the small circle reverses at 20s). Below 1024px screen width, .7x length.</p>
<div class="row">
  <div class="ring" data-fx="text-ring-spin" role="img" aria-label="THANK YOU · GRACIAS · MERCI · DANKE · GRAZIE · OBRIGADO · TAK · KIITOS · ASANTE · SALAMAT"></div>
  <div class="ring -small" data-fx="text-ring-spin" data-fx-text-ring-spin="repeat: 2; size: 80; sep: ✦" role="img" aria-label="SCROLL DOWN " style="--fx-dur: 20s; --fx-dir: reverse"></div>
  <div class="ring -small" data-fx="text-ring-spin" data-fx-text-ring-spin="fit: off; pause: hover; case: keep; size: 110" role="img" aria-label="Play The Full Movie" style="--fx-dur: 15s"></div>
  <div class="ring -small" data-demo-remove data-fx="text-ring-spin" role="img" aria-label="REMOVED RING"></div>
  <div class="ring -small" data-fx="text-ring-spin"></div>
</div>
<div class="bg">
  <div class="ring" data-fx="text-ring-spin" role="img" aria-label="HELLO · BONJOUR · HOLA · CIAO · HALLO · OLÁ · HEJ · MOI"></div>
  <h2>Circle faintly laid on the background</h2>
</div>
<template data-demo-late><div class="ring -small" data-fx="text-ring-spin" data-fx-text-ring-spin="start: 90" role="img" aria-label="LATE RING · ADDED AFTER ONE SECOND"></div></template>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => document.querySelector(".row").append(t.content.cloneNode(true)) || t.remove()), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
