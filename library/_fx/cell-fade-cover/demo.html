<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cell-fade-cover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; min-height: 100vh; }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-row { display: flex; gap: 16px; padding: 40px 20px; flex-wrap: wrap; }
  .demo-row a, .demo-row button { display: inline-flex; align-items: center; height: 40px; padding: 0 20px; border: 1px solid currentColor; border-radius: 20px; color: inherit; background: none; font: inherit; cursor: pointer; text-decoration: none; }
  .demo-cover { --fx-cover-cell: var(--kf-surface); }
</style>
</head>
<body>
<p class="demo-hint"><b>cell-fade-cover</b> — Press a link below and cells light up at random to cover the screen, on the reopened page the cells switch off and clear away. The button covers and clears only the curtain.</p>
<div class="demo-row">
  <a href="demo.html?p=2">Reopen the same page</a>
  <button type="button" data-demo-cover>Cover and lift the curtain only (nav: off)</button>
</div>
<div class="demo-row" data-demo-late-host></div>
<div class="demo-cover" data-fx="cell-fade-cover"></div>
<div class="demo-cover" data-fx="cell-fade-cover" data-fx-cell-fade-cover="nav: off" data-demo-manual></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
const manual = document.querySelector("[data-demo-manual]");
document.querySelector("[data-demo-cover]").addEventListener("click", () => {
  manual.dispatchEvent(new CustomEvent("fx:cover", { detail: { done: () => manual.dispatchEvent(new CustomEvent("fx:uncover")) } }));
});
// Attach to one late-arriving curtain separately, detach after 1.5 sec (does detaching clear the cells?)
setTimeout(() => {
  const d = document.createElement("div");
  d.dataset.fx = "cell-fade-cover";
  d.dataset.fxCellFadeCover = "nav: off";
  document.querySelector("[data-demo-late-host]")?.append(d);
  setTimeout(() => d.remove(), 1500);
}, 1000);
</script>
</body>
</html>
