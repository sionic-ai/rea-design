<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ribbon-card-gl — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-list { display: flex; flex-direction: column; align-items: center; gap: 56px; padding: 30vh 0 60vh; }
  .demo-list [data-fx-part="card"] { display: block; width: min(52vw, 640px); aspect-ratio: 16 / 9; border-radius: 6px; background: var(--kf-accent); color: var(--kf-on-accent); }
  .demo-list [data-fx-part="photo"] { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<p class="demo-hint"><b>ribbon-card-gl</b> — Scroll fast. Cards twist and sag by the speed, unfurl like rolled paper as they enter, and press down on hover.</p>
<div class="demo-list" data-fx="ribbon-card-gl">
  <a data-fx-part="card" href="#"><span data-fx-part="photo" data-label="One card · landscape 16:9"></span></a>
  <a data-fx-part="card" href="#"><span data-fx-part="photo" data-label="Two cards · landscape 16:9"></span></a>
  <a data-fx-part="card" href="#"><span data-fx-part="photo" data-label="Three cards · landscape 16:9"></span></a>
</div>
<script>
// Late arrivals and removals — checks that fx-core attaches to an element added after 1s and detaches from an element removed after 2.5s
(() => {
  const src = document.querySelector('[data-fx~="ribbon-card-gl"]');
  const make = (tag) => { const el = src.cloneNode(true); el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => src.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another card row comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="three-global.js"></script>
<script src="../../_vendor/three@0.170.0/build/three.cjs"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
