<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sine-wave-toggle — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .row { display: flex; gap: 60px; align-items: center; padding: 120px 40px; }
  .w { width: 120px; height: 50px; }
</style>
</head>
<body>
<p class="demo-hint"><b>sine-wave-toggle</b> — Hover over the waves and click. Clicking calms the waves until they go flat.</p>
<div class="row">
  <div class="w" data-fx="sine-wave-toggle" role="button" tabindex="0" aria-label="Music on and off"><svg data-fx-part="wave" preserveAspectRatio="none" aria-hidden="true"></svg><span data-fx-part="tip" data-on="Turn music off" data-off="Turn music on"></span></div>
  <div class="w" data-demo-remove data-fx="sine-wave-toggle" role="button" tabindex="0" aria-label="Wave to be removed soon"><svg data-fx-part="wave" preserveAspectRatio="none" aria-hidden="true"></svg></div>
  <template data-demo-late><div class="w" data-fx="sine-wave-toggle" data-fx-sine-wave-toggle="cycles: 2; height: .35" role="button" tabindex="0" aria-pressed="false" aria-label="Two-cycle wave"><svg data-fx-part="wave" preserveAspectRatio="none" aria-hidden="true"></svg></div></template>
</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
