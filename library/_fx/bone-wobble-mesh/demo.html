<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bone-wobble-mesh — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .stage { display: flex; flex-wrap: wrap; gap: 40px; padding: 40px; }
  .chara { width: min(484px, 90vw); }
  .chara.is-small { width: 240px; }
  .chara [data-fx-part="shadow"] + [data-fx-part="body"] { position: absolute; left: 0; top: 0; width: 100%; }
  .chara [data-fx-part="shadow"] { aspect-ratio: 968 / 802; }
  .chara-limbs path { fill: none; stroke: var(--kf-ink); stroke-width: 128; stroke-linecap: round; }
  .chara-ink { fill: var(--kf-ink); }
  .chara-eye { fill: var(--kf-bg); }
  .chara-ball { fill: var(--kf-accent); }
  .chara-ball.b2, .chara-ball.b3 { fill: var(--kf-accent-soft); }
</style>
</head>
<body>
<p class="demo-hint"><b>bone-wobble-mesh</b> — Leave it open and watch. The character’s arms and legs wave every 1.6s and it closes its eyes once every few seconds. <span style="color:var(--kf-dim)">(After 1s a small character comes in, and after 2.5s one leaves)</span></p>
<section class="stage">
  <span class="chara" data-fx="bone-wobble-mesh"><span data-fx-part="shadow"></span><span data-fx-part="body"><svg viewBox="0 0 968 802" aria-hidden="true">
    <g class="chara-limbs"><path d="M470 245L232 222"/><path d="M720 212L898 182"/><path d="M517 336L377 558"/><path d="M690 330L878 513"/></g>
    <circle class="chara-ink" cx="600" cy="290" r="150"/><circle class="chara-ink" cx="601" cy="96" r="82"/>
    <circle class="chara-ball" cx="228" cy="222" r="36"/><circle class="chara-ball b2" cx="902" cy="181" r="34"/><circle class="chara-ball b3" cx="374" cy="562" r="38"/><circle class="chara-ball" cx="881" cy="516" r="38"/>
    <circle class="chara-eye" cx="587" cy="47" r="12"/><circle class="chara-eye" cx="616" cy="44" r="12"/><circle class="chara-ink" cx="590" cy="49" r="5.5"/><circle class="chara-ink" cx="619" cy="46" r="5.5"/>
  </svg></span></span>
  <span class="chara is-small" data-fx="bone-wobble-mesh" data-fx-bone-wobble-mesh="period: 900" data-demo-remove><span data-fx-part="body"><svg viewBox="0 0 968 802" aria-hidden="true">
    <g class="chara-limbs"><path d="M470 245L232 222"/><path d="M720 212L898 182"/><path d="M517 336L377 558"/><path d="M690 330L878 513"/></g>
    <circle class="chara-ink" cx="600" cy="290" r="150"/><circle class="chara-ink" cx="601" cy="96" r="82"/>
    <circle class="chara-eye" cx="587" cy="47" r="12"/><circle class="chara-eye" cx="616" cy="44" r="12"/>
  </svg></span></span>
  <template data-demo-late><span class="chara is-small" data-fx="bone-wobble-mesh" data-fx-bone-wobble-mesh="period: 2400"><span data-fx-part="shadow"></span><span data-fx-part="body"><svg viewBox="0 0 968 802" aria-hidden="true">
    <g class="chara-limbs"><path d="M470 245L232 222"/><path d="M720 212L898 182"/><path d="M517 336L377 558"/><path d="M690 330L878 513"/></g>
    <circle class="chara-ink" cx="600" cy="290" r="150"/><circle class="chara-ink" cx="601" cy="96" r="82"/>
    <circle class="chara-eye" cx="587" cy="47" r="12"/><circle class="chara-eye" cx="616" cy="44" r="12"/>
  </svg></span></span></template>
  <span class="chara is-small" data-fx="bone-wobble-mesh"></span>
</section>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
