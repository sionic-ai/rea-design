<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>arc-edge-scroll — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 10; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  section { position: relative; height: 100vh; display: grid; place-items: center; font: 700 40px var(--kf-font-display); overflow: clip; }
  .a { background: var(--kf-surface); --fx-arc: var(--kf-ink); } .b { background: var(--kf-ink); color: var(--kf-bg); --fx-arc: var(--kf-surface); }
</style>
</head>
<body>
<p class="demo-hint"><b>arc-edge-scroll</b> — Scroll down and the next section’s color panel fills up with its middle curved.</p>
<section class="a">Section One<div data-fx="arc-edge-scroll"></div></section>
<section class="b">Section Two<div data-fx="arc-edge-scroll" data-fx-arc-edge-scroll="mode: reveal" data-demo-remove></div></section>
<section class="a">Section Three<template data-demo-late><div data-fx="arc-edge-scroll" data-fx-arc-edge-scroll="curve: 20; scrub: 0"></div></template></section>
<section class="b">Footer</section>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); window.ScrollTrigger?.refresh(); }, 2500);
</script>
</body>
</html>
