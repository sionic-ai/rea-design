<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sticky-assemble — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-stage { display: flex; justify-content: center; gap: 80px; padding: 33vh 20px; background: var(--kf-contrast-bg); color: var(--kf-contrast-ink); }
  .demo-stage p { position: sticky; top: calc(50% - 100px); max-width: 30ch; align-self: flex-start; }
  .piece { border-radius: 8px; background: color-mix(in oklab, var(--kf-contrast-ink) 18%, var(--kf-contrast-bg)); outline: 1px solid color-mix(in oklab, var(--kf-contrast-ink) 30%, transparent); }
  .piece.is-tip { border-radius: 8px 8px 48px 48px; }
</style>
</head>
<body>
<p class="demo-hint"><b>sticky-assemble</b> — Scroll down. Pieces attach one by one to the bottom of the screen and gather into one bundle. <span style="color:var(--kf-dim)">(After 1s one more tile panel comes in, and after 2.5s one leaves)</span></p>
<section class="demo-stage">
  <figure data-fx="sticky-assemble">
    <div class="piece" data-fx-part="piece" data-bottom="100" style="height:115px"></div>
    <div class="piece" data-fx-part="piece" data-bottom="-151" style="height:276px"></div>
    <div class="piece" data-fx-part="piece" data-bottom="-461" style="height:592px"></div>
    <div class="piece" data-fx-part="piece" data-bottom="139" data-visible-y="1000" style="height:326px"></div>
    <div class="piece is-tip" data-fx-part="piece" data-bottom="71" data-origin-y="-532" data-start-y="1170" data-visible-y="1200" data-ease-start="1598" data-ease-end="1848" style="height:122px"></div>
    <div class="piece is-tip" data-fx-part="piece" data-bottom="57" data-origin-y="-678" data-visible-y="1000" data-sticky-y="1170" style="height:110px"></div>
  </figure>
  <p>Your three-line product description here. Once all the pieces are joined, it becomes one complete piece.</p>
  <figure data-demo-remove data-fx="sticky-assemble"><div class="piece" data-fx-part="piece" data-bottom="40" style="height:200px"></div><div class="piece" data-fx-part="piece" data-bottom="-200" style="height:300px"></div></figure>
  <template data-demo-late><figure data-fx="sticky-assemble"><div class="piece" data-fx-part="piece" data-bottom="60" style="height:160px"></div><div class="piece is-tip" data-fx-part="piece" data-bottom="20" data-visible-y="900" style="height:120px"></div></figure></template>
</section>
<div style="height: 60vh"></div>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
