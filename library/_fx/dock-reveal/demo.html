<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dock-reveal — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { margin: 0; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .head { display: flex; gap: 24px; align-items: center; height: 88px; padding: 0 24px; border-bottom: 1px solid var(--kf-line); }
  .demo-spacer { height: 160vh; display: grid; place-items: center; color: var(--kf-dim); }
  .foot { height: 60vh; display: grid; place-items: center; background: var(--kf-contrast-bg); color: var(--kf-contrast-ink); }
  .dock { position: fixed; left: 0; right: 0; bottom: 20px; z-index: 10; display: flex; gap: 20px; width: fit-content; margin: auto; padding: 12px 20px; background: var(--kf-surface); border-radius: var(--kf-radius-md); box-shadow: var(--kf-shadow-lift); }
  .dock.is-late { bottom: 84px; }
</style>
</head>
<body>
<p class="demo-hint"><b>dock-reveal</b> — Scrolling down, a pill appears below when the header disappears, and hides when the bottom tail comes into view. <span style="color:var(--kf-dim)">(After 1s one more pill comes in, and after 2.5s the first pill leaves)</span></p>
<header class="head"><b>Your logo here</b><span>Menu 1</span><span>Menu 2</span><span>Menu 3</span></header>
<nav class="dock" data-demo-remove data-fx="dock-reveal"><b>Logo</b><span>Menu 1</span><span>Menu 2</span><span>Menu 3</span></nav>
<template data-demo-late><nav class="dock is-late" data-fx="dock-reveal" data-fx-dock-reveal="after: .head; until: .foot"><b>Late-arrived Pill</b><span>Menu 1</span></nav></template>
<div class="demo-spacer">Scroll down</div>
<footer class="foot">Your tail text here</footer>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
