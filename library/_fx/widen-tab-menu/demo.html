<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>widen-tab-menu — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 500 15px/1.6 var(--kf-font-sans); margin: 0; min-height: 120vh; }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .bar { display: flex; margin: 20px 40px 0; }
  .bar + .bar { margin-top: 140px; }
  [data-fx-part="drop"] a { display: block; margin-bottom: -1px; padding: 12px 12px 60px; border: 1px solid var(--kf-line); background: var(--kf-bg); font-size: 22px; }
</style>
</head>
<body>
<p class="demo-hint"><b>widen-tab-menu</b> Hover over the menu cells on the right. The line widens all the way and the cell under the pointer doubles in size. <span style="color:var(--kf-dim)">(After 1s one more line comes in, and one leaves 2.5s later)</span></p>
<div class="bar" id="bars">
  <nav data-fx="widen-tab-menu"><div data-fx-part="tab">Menu 1<div data-fx-part="drop"><a href="#">Sub 1</a><a href="#">Sub 2</a></div></div><div data-fx-part="tab">Menu 2</div><div data-fx-part="tab">Menu 3</div><div data-fx-part="tab">Menu 4</div></nav>
</div>
<div class="bar" data-demo-remove><nav data-fx="widen-tab-menu" style="--fx-grow: 3"><div data-fx-part="tab">Drop 1</div><div data-fx-part="tab">Drop 2</div></nav></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script>
setTimeout(() => { const d = document.createElement("div"); d.className = "bar"; d.innerHTML = '<nav data-fx="widen-tab-menu" style="--fx-from: 40%"><div data-fx-part="tab">Late 1</div><div data-fx-part="tab">Late 2</div><div data-fx-part="tab">Late 3</div></nav>'; document.body.append(d); }, 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
