<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hill-clip-open — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .stage { position: relative; height: 70vh; background: linear-gradient(var(--kf-raised), var(--kf-accent-soft)); margin-bottom: 40px; }
  .stage [data-fx] { position: absolute; inset: 0; }
  .stage .wf-img { height: 100%; }
</style>
</head>
<body>
<p class="demo-hint"><b>hill-clip-open</b> — Open and wait 2s. The photo panel opens by coming down from the top along a hill curve (the second panel .3s later · straight slope). <span style="color:var(--kf-dim)">(After 1s one more panel comes in, and one leaves 2.5s later)</span></p>
<div class="stage"><div data-fx="hill-clip-open"><div class="wf-img" data-label="Hero photo · landscape"></div></div></div>
<div class="stage"><div data-fx="hill-clip-open" data-fx-hill-clip-open="delay: .3; dur: .9; to: 100,100 50,60 0,90"><div class="wf-img" data-label="Three points on a straight slope"></div></div></div>
<div class="stage" data-demo-remove><div data-fx="hill-clip-open"><div class="wf-img" data-label="Panel to be removed soon"></div></div></div>
<template data-demo-late><div class="stage"><div data-fx="hill-clip-open" data-fx-hill-clip-open="delay: 0"><div class="wf-img" data-label="Late panel"></div></div></div></template>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
