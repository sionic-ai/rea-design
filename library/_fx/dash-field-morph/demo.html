<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dash-field-morph — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .stage { height: 80vh; margin: 20px; border: 1px solid var(--kf-line); }
  .picks { position: absolute; left: 16px; top: 16px; display: flex; gap: 8px; z-index: 1; }
  .picks button { height: 36px; padding: 0 14px; border: 1px solid var(--kf-line); background: var(--kf-surface); color: var(--kf-ink); cursor: pointer; }
</style>
</head>
<body>
<p class="demo-hint"><b>dash-field-morph</b> — Hover the top-left button and strokes bend and fly to that picture. Drag the plate to spin it, and move the mouse past quickly.</p>
<section class="stage" data-fx="dash-field-morph" data-fx-dash-field-morph="cols: 200; rows: 250">
  <img data-fx-part="shape" data-key="ring" alt="">
  <img data-fx-part="shape" data-key="bars" alt="">
  <div class="picks"><button type="button" data-fx-part="pick" data-key="ring">Loop</button><button type="button" data-fx-part="pick" data-key="bars">Bar</button></div>
</section>
<script>
// Two drawings for demonstration — drawn on a transparent background in the skin’s light-side color (the brighter, the more strokes are lit)
(() => {
  const s = getComputedStyle(document.documentElement), light = s.getPropertyValue("--kf-surface").trim(), mid = s.getPropertyValue("--kf-dim").trim();
  const draw = (fn) => { const c = document.createElement("canvas"); c.width = 380; c.height = 475; const g = c.getContext("2d"); fn(g); return c.toDataURL(); };
  const ring = draw((g) => { const gr = g.createRadialGradient(190, 220, 40, 190, 237, 180); gr.addColorStop(0, mid); gr.addColorStop(1, light); g.fillStyle = gr; g.beginPath(); g.arc(190, 237, 170, 0, 7); g.arc(190, 237, 80, 0, 7, true); g.fill(); });
  const bars = draw((g) => { for (let i = 0; i < 5; i++) { g.fillStyle = i % 2 ? mid : light; g.fillRect(30 + i * 66, 120 + i * 40, 48, 320 - i * 40); } });
  const imgs = document.querySelectorAll('[data-fx-part="shape"]');
  imgs[0].src = ring; imgs[1].src = bars;
})();
// Late arrivals and removals — checks that fx-core attaches to an element added after 1s and detaches from an element removed after 2.5s
(() => {
  const src = document.querySelector('[data-fx~="dash-field-morph"]');
  const make = () => { const el = src.cloneNode(true); el.querySelectorAll(".fx-dash-field").forEach((c) => c.remove()); el.style.height = "40vh"; return el; };
  const gone = make();
  src.after(gone);
  setTimeout(() => src.after(make()), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s, one more panel comes in (the late one), and after 2.5s one drops out (the removal).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../sheet-curl-in/three-global.js"></script>
<script src="../../_vendor/three@0.185.0/build/three.cjs"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
