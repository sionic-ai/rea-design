<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sdf-lens-mark — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { display: flex; flex-wrap: wrap; justify-content: center; gap: 60px; padding: 80px 20px; background: var(--kf-contrast-bg); }
  .demo [data-fx] { width: 286px; aspect-ratio: 286 / 270; color: var(--kf-contrast-ink); }
  .demo .small { width: 140px; color: var(--kf-accent); }
</style>
</head>
<body>
<p class="demo-hint"><b>sdf-lens-mark</b> — Move the mouse over the line logo. Lines spread and darken only around the cursor, and the lens follows the cursor a little late.</p>
<section class="demo">
  <div data-fx="sdf-lens-mark"><svg data-fx-part="mark" viewBox="0 0 286 270" fill="none"><path d="M16 135C16 -8 140 0 143 135S270 278 270 135 146 -8 143 135 16 278 16 135Z" stroke="currentColor" stroke-width="6"/></svg></div>
  <div class="small" data-fx="sdf-lens-mark" data-fx-sdf-lens-mark="radius: 40; blur: 18"><svg data-fx-part="mark" viewBox="0 0 286 270" fill="none"><path d="M40 230 143 30 246 230Z" stroke="currentColor" stroke-width="8"/></svg></div>
</section>
<script>
(() => {
  const src = document.querySelector('[data-fx~="sdf-lens-mark"]');
  if (!src) return;
  const html = src.outerHTML;
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => src.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical logo comes in (a late arrival), and after 2.5s one is removed (detach).");
})();
</script>
<script src="../../_vendor/three@0.186.0/three.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
