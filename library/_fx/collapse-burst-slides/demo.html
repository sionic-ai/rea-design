<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>collapse-burst-slides — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 300; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .stage { height: 80vh; min-height: 520px; }
  .inner { position: relative; width: min(420px, 70vw); }
  .disc { position: absolute; inset: 0; margin: auto; width: min(620px, 90vw); aspect-ratio: 1.1; border: 1px solid var(--kf-ink); border-radius: 50%; z-index: -1; }
  .p { position: absolute; margin: 0; }
  .ph { position: relative; aspect-ratio: 16 / 9; border-radius: 20px; overflow: hidden; }
  .tag { padding: .4em 1em; border-radius: 50%; background: var(--kf-accent); font-weight: 700; }
  .ctl { position: absolute; bottom: 12%; right: 12%; display: flex; gap: 12px; z-index: 10; }
  .ctl button { width: 56px; height: 56px; border-radius: 50%; border: 1px solid var(--kf-ink); background: var(--kf-surface); cursor: pointer; }
  .dots { position: absolute; right: 24px; bottom: 24px; }
</style>
</head>
<body>
<p class="demo-hint"><b>collapse-burst-slides</b> — Press the arrows (it advances on its own every 5s) — the pieces are sucked into the center, then the next slide’s pieces burst out from the center.</p>
<div class="stage" data-fx="collapse-burst-slides" id="s1">
  <div data-fx-part="viewport"><div data-fx-part="track">
    <div data-fx-part="slide" style="--fx-disc: var(--kf-accent-soft)"><div class="inner"><div class="ph" data-fx-part="piece" data-delay=".65" data-dur="1.8"><div class="wf-img" style="height:100%" data-label="Classroom lesson · window light · 16:9"></div></div><p class="p tag" data-fx-part="piece" data-delay=".3" style="top:-20%;left:-10%">Your tag here</p></div></div>
    <div data-fx-part="slide" style="--fx-disc: var(--kf-raised)"><div class="inner"><div class="ph" data-fx-part="piece" data-delay=".65" data-dur="1.8"><div class="wf-img" style="height:100%" data-label="Library student · afternoon light · 16:9"></div></div><p class="p tag" data-fx-part="piece" data-delay=".3" style="bottom:-20%;right:-10%">Tag Two</p></div></div>
    <div data-fx-part="slide" style="--fx-disc: var(--kf-surface)"><div class="inner"><div class="ph" data-fx-part="piece" data-delay=".65" data-dur="1.8"><div class="wf-img" style="height:100%" data-label="Lecture scene · Studio · 16:9"></div></div><p class="p tag" data-fx-part="piece" data-delay=".2" style="top:-25%;right:0">Tag Three</p></div></div>
  </div></div>
  <div class="disc" data-fx-part="disc"></div>
  <div class="ctl" data-fx-part="controls"><button data-fx-part="prev" aria-label="Previous">‹</button><button data-fx-part="next" aria-label="Next">›</button></div>
  <nav class="dots" data-fx-part="dots"></nav>
</div>
<div id="late"></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../_vendor/embla-carousel@8.6.0/embla-carousel.umd.js"></script>
<script src="../../_vendor/embla-carousel-autoplay@8.6.0/embla-carousel-autoplay.umd.js"></script>
<script src="../../_vendor/embla-carousel-fade@8.6.0/embla-carousel-fade.umd.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
  // Checks whether it catches late-arriving panels and whether removed panels get detached
  const tpl = document.getElementById("s1")?.cloneNode(true);
  setTimeout(() => { if (!tpl) return; const d = tpl.cloneNode(true); d.removeAttribute("id"); d.querySelectorAll(".fx-cbs-dot").forEach((b) => b.remove()); document.getElementById("late")?.append(d); }, 1000);
  setTimeout(() => document.getElementById("late")?.firstElementChild?.remove(), 1500);
</script>
</body>
</html>
