<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>slide-popover-nav — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .bar { position: relative; display: flex; gap: 8px; align-items: center; height: 64px; max-width: 960px; margin: 0 auto; padding: 0 24px; border-bottom: 1px solid var(--kf-line); }
  .bar button { padding: 4px 8px; border: 0; border-radius: 8px; background: none; font-size: 14px; cursor: pointer; }
  .bar button[data-active="true"], .bar button:hover { background: var(--kf-raised); }
  .pop { position: absolute; top: 60px; left: 24px; z-index: 5; }
  .inner { position: absolute; padding: 8px; border: 1px solid var(--kf-line); border-radius: 12px; background: var(--kf-surface); box-shadow: var(--kf-shadow-lift); }
  .menu { display: grid; gap: 4px; padding: 8px; }
  .menu a { display: block; padding: 10px 12px; border-radius: 8px; }
  .menu a:hover { background: var(--kf-raised); }
  .wide { width: 520px; grid-template-columns: 1fr 1fr; }
  .narrow { width: 260px; }
</style>
</head>
<body>
<p class="demo-hint"><b>slide-popover-nav</b> — Hover menu A, B or C, then move sideways. A single panel changes its content and slides beneath the trigger. <span style="color:var(--kf-dim)">(After 1s one more header line joins, and drops out after 2.5s)</span></p>
<div class="bar" data-fx="slide-popover-nav" data-fx-slide-popover-nav="shift: 24">
  <b style="margin-right: 24px">LOGO</b>
  <button type="button" data-fx-part="trigger" data-key="a">Menu A</button>
  <button type="button" data-fx-part="trigger" data-key="b">Menu B</button>
  <button type="button" data-fx-part="trigger" data-key="c">Menu C</button>
  <div class="pop" data-fx-part="pop">
    <div class="inner" data-fx-part="inner">
      <div class="menu wide" data-fx-part="menu" data-key="a"><a href="#">Item 1</a><a href="#">Item 2</a><a href="#">Item 3</a><a href="#">Item 4</a></div>
      <div class="menu narrow" data-fx-part="menu" data-key="b"><a href="#">Item 5</a><a href="#">Item 6</a></div>
      <div class="menu wide" data-fx-part="menu" data-key="c"><a href="#">Item 7</a><a href="#">Item 8</a></div>
    </div>
  </div>
</div>
<div id="late" style="margin-top: 240px"></div>
<template data-demo-late><div class="bar" data-fx="slide-popover-nav" data-demo-remove><button type="button" data-fx-part="trigger" data-key="x">Late-arrived Menu</button><div class="pop" data-fx-part="pop"><div class="inner" data-fx-part="inner"><div class="menu narrow" data-fx-part="menu" data-key="x"><a href="#">Item</a></div></div></div></div></template>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => document.getElementById("late").append(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
