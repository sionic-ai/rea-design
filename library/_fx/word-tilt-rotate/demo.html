<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>word-tilt-rotate — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); padding: 20px; }
  .demo-hint { padding: 12px 0 24px; font: 500 13px/1.4 var(--kf-font-mono); }
  .big { font: 300 clamp(48px, 8vw, 112px)/1 var(--kf-font-display); letter-spacing: -0.03em; margin-bottom: 40px; }
  .bars { display: flex; gap: 16px; max-width: 600px; margin-top: 24px; font-size: 15px; }
  .bars [data-fx-part="bar"] { flex: 1; }
</style>
</head>
<body>
<p class="demo-hint"><b>word-tilt-rotate</b> — Words tilt and change every 2.75s. Click the bar below to jump to that word.</p>
<div class="big" data-fx="word-tilt-rotate">Everyone’s_<span data-fx-part="slot">Person</span><span data-fx-part="word">Person</span><span data-fx-part="word">Place</span><span data-fx-part="word">Earth</span><span data-fx-part="word">Neighborhood</span>
  <div class="bars"><button type="button" data-fx-part="bar" aria-label="1"></button><button type="button" data-fx-part="bar" aria-label="2"></button><button type="button" data-fx-part="bar" aria-label="3"></button><button type="button" data-fx-part="bar" aria-label="4"></button></div>
</div>
<div class="big" data-fx="word-tilt-rotate" data-demo-remove>To be erased_<span data-fx-part="slot">One</span><span data-fx-part="word">One</span><span data-fx-part="word">Both</span></div>
<template data-demo-late><div class="big" data-fx="word-tilt-rotate" data-fx-word-tilt-rotate="step: 1.5; tilt-in: 0">Arrived Late_<span data-fx-part="slot">Sentence</span><span data-fx-part="word">Sentence</span><span data-fx-part="word">Line</span></div></template>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
