<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>follow-badge-hover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { padding: 32px 20px; display: grid; gap: 16px; }
  .feature { display: block; height: 45vh; overflow: hidden; border-radius: var(--kf-radius-md); }
  .feature .wf-img { height: 100%; }
</style>
</head>
<body>
<p class="demo-hint"><b>follow-badge-hover</b> — Hover over a photo and move around. A round badge follows the cursor. <span style="color:var(--kf-dim)">(After 1s one more panel comes in, and one leaves 2.5s later)</span></p>
<section class="demo">
  <a class="feature" href="#" data-fx="follow-badge-hover"><span data-fx-part="badge"><span data-fx-part="label">In detail</span></span><div class="wf-img" data-label="Renovated living room · daytime · landscape 16:9"></div></a>
  <a class="feature" href="#" data-fx="follow-badge-hover" data-fx-follow-badge-hover="center: 1; from: .6; pop: .3; pop-ease: power2.out; out: .2; out-ease: power2.in; lag: .4; ease: power3.out" style="--fx-size: 120px"><span data-fx-part="badge"><span data-fx-part="label">View</span></span><div class="wf-img" data-label="Type that grows from .6x (mildsugar)"></div></a>
  <a class="feature" href="#" data-demo-remove data-fx="follow-badge-hover"><span data-fx-part="badge"></span><div class="wf-img" data-label="Panel to be removed soon"></div></a>
  <template data-demo-late><a class="feature" href="#" data-fx="follow-badge-hover" data-fx-follow-badge-hover="shift: 60; lag: .3" style="--fx-size: 100px"><span data-fx-part="badge"><span data-fx-part="label">View</span></span><div class="wf-img" data-label="Late-arriving panel"></div></a></template>
</section>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
