<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>blur-slide-swap-hover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { display: grid; gap: 4px; padding: 48px 20px; max-width: 640px; }
  .demo button { all: unset; cursor: pointer; display: block; font: 400 64px/1 var(--kf-font-display); letter-spacing: -0.04em; }
  .demo [data-fx-part="next"] { font-family: var(--kf-font-black, var(--kf-font-display)); font-weight: 700; color: var(--kf-accent-text); }
</style>
</head>
<body>
<p class="demo-hint"><b>blur-slide-swap-hover</b> — Hover over the big word (the front typeface blurs out to the right while the back typeface clears in from the left). <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<nav class="demo">
  <button type="button" data-demo-remove><span data-fx="blur-slide-swap-hover"><span data-fx-part="label">ARTIST</span><span data-fx-part="next" aria-hidden="true">ARTIST</span></span></button>
  <button type="button"><span data-fx="blur-slide-swap-hover"><span data-fx-part="label">Your menu here</span><span data-fx-part="next" aria-hidden="true">Your menu here</span></span></button>
  <button type="button" aria-current="page"><span data-fx="blur-slide-swap-hover"><span data-fx-part="label">CURRENT</span><span data-fx-part="next" aria-hidden="true">CURRENT</span></span></button>
  <template data-demo-late><button type="button"><span data-fx="blur-slide-swap-hover" style="--fx-shift: 40%; --fx-blur: 16px"><span data-fx-part="label">LATE 40%</span><span data-fx-part="next" aria-hidden="true">LATE 40%</span></span></button></template>
</nav>
<script src="../fx-core.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
