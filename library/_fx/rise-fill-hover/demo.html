<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>rise-fill-hover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { margin: 0; padding: 48px; background: var(--kf-bg); color: var(--kf-ink); font: 400 13px/1.5 var(--kf-font-sans); display: grid; gap: 32px; justify-items: start; }
  .demo-hint { font: 500 13px/1.4 var(--kf-font-mono); }
  nav { display: flex; }
  nav a { padding: 5px 10px; border: 1px solid var(--kf-ink); border-right: 0; text-transform: uppercase; font-size: 10px; }
  nav a:last-child { border-right: 1px solid var(--kf-ink); }
  .cta { display: flex; flex-direction: column; justify-content: space-between; width: 280px; height: 99px; padding: 14px 18px; border: 0; background: var(--kf-accent); color: var(--kf-on-accent); text-align: left; font: inherit; font-size: 16px; --fx-on: var(--kf-on-accent); }
</style>
</head>
<body>
<p class="demo-hint"><b>rise-fill-hover</b> — Hover a menu cell or button. The fill rises from the bottom. ”Menu 1” is the current cell, so it stays filled. <span style="color:var(--kf-dim)">(After 1s one more cell comes in, and one leaves 2.5s later)</span></p>
<nav id="nav"><a data-fx="rise-fill-hover" href="#" aria-current="true">Menu 1</a><a data-fx="rise-fill-hover" href="#">Menu 2</a><a data-fx="rise-fill-hover" href="#" data-demo-remove>Dropped Cell</a><template data-demo-late><a data-fx="rise-fill-hover" href="#">Late cell</a></template></nav>
<button class="cta" type="button" data-fx="rise-fill-hover">＋<span>Your action text here</span></button>
<a data-fx="rise-fill-hover" data-fx-rise-fill-hover="look: top" href="#" style="padding:8px 14px;border:1px solid var(--kf-ink)">Fills in from the Top</a>
<script src="../fx-core.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
