<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>chev-stem-hover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.6 var(--kf-font-sans); padding: 40px; }
  .demo-hint { margin: 0 0 32px; font: 500 13px/1.4 var(--kf-font-mono); }
  .row { display: flex; gap: 12px; flex-wrap: wrap; }
  .btn { display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 16px; border-radius: var(--kf-radius-pill); background: var(--kf-ink); color: var(--kf-bg); text-decoration: none; }
  .btn--light { background: var(--kf-raised); color: var(--kf-ink); }
  svg { width: 7px; height: 11px; overflow: visible; }
</style>
</head>
<body>
<p class="demo-hint"><b>chev-stem-hover</b> — Hover over the button. The chevron turns into an arrow. <span style="color:var(--kf-dim)">(After 1s one more button comes in, and after 2.5s one drops out)</span></p>
<div class="row" id="row">
  <a class="btn" href="#" data-fx="chev-stem-hover">Book a consultation <svg viewBox="0 0 7 11" aria-hidden="true"><path d="M1.5 1.5 5.5 5.5 1.5 9.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path data-fx-part="stem" d="M-2 5.5h7" stroke="currentColor" stroke-width="1.6"/></svg></a>
  <a class="btn btn--light" href="#" data-fx="chev-stem-hover" data-fx-chev-stem-hover="look: grow">Growing Type <svg viewBox="0 0 7 11" aria-hidden="true"><path d="M1.5 1.5 5.5 5.5 1.5 9.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path data-fx-part="stem" d="M-2 5.5h7" stroke="currentColor" stroke-width="1.6"/></svg></a>
  <a class="btn btn--light" href="#" data-fx="chev-stem-hover" data-demo-remove>Omitted button <svg viewBox="0 0 7 11" aria-hidden="true"><path d="M1.5 1.5 5.5 5.5 1.5 9.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path data-fx-part="stem" d="M-2 5.5h7" stroke="currentColor" stroke-width="1.6"/></svg></a>
  <a class="btn" href="#" data-fx="chev-stem-hover">Stemless button</a>
</div>
<script src="../fx-core.js"></script>
<script>
setTimeout(() => { const b = document.querySelector(".btn"), row = document.getElementById("row"); if (!b || !row) return; const a = b.cloneNode(true); a.firstChild.textContent = "Late-arrived Button "; row.append(a); }, 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
