<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>counter-ticker — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { padding: 8vh 0; display: grid; gap: 40px; }
  .demo [data-fx-part="row"] span { padding: 0 .3em; font: var(--kf-weight-display) 10vw/1 var(--kf-font-display); letter-spacing: -.03em; }
</style>
</head>
<body>
<p class="demo-hint"><b>counter-ticker</b> — Just watch. The top row flows left and the bottom row flows right, endlessly. <span style="color:var(--kf-dim)">(After 1s one more panel comes in, and one leaves 2.5s later)</span></p>
<section class="demo" id="box">
  <div data-fx="counter-ticker"><div data-fx-part="row"><span>Let’s work together.</span></div><div data-fx-part="row"><span>Let’s work together.</span></div></div>
  <div data-fx="counter-ticker" data-fx-counter-ticker="speed: .8" data-demo-remove><div data-fx-part="row"><span>Dropped Panel</span></div></div>
  <div data-fx="counter-ticker"><div data-fx-part="row"></div></div>
</section>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => { const d = document.createElement("div"); d.dataset.fx = "counter-ticker"; d.innerHTML = '<div data-fx-part="row"><span>Late-arriving line ·</span></div>'; document.getElementById("box").append(d); }, 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
