<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>veil-sweep-cover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.6 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .col { width: min(560px, 90vw); margin: 0 auto; padding: 60px 0; }
  .col .wf-img { aspect-ratio: 16 / 9; margin: 24px 0; }
  .col a { text-decoration: underline; }
</style>
</head>
<body>
<p class="demo-hint"><b>veil-sweep-cover</b> — On open the white curtain lifts and the pale indigo at the top drops away. Press “Reopen this page” and it covers the screen and then moves on. <span style="color:var(--kf-dim)">(After 1s a paragraph comes in, and after 2.5s one leaves)</span></p>
<div class="col">
  <h1>Your title here</h1>
  <div class="wf-img" data-label="Hero photo slot"></div>
  <p data-demo-remove>Dropping text</p>
  <p><a href="demo.html">Reopen this page</a></p>
  <div data-late-slot></div>
</div>
<div data-fx="veil-sweep-cover"><div data-fx-part="veil"></div><div data-fx-part="sweep"></div></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelector("[data-late-slot]").outerHTML = '<p>Late text</p><div data-fx="veil-sweep-cover" data-fx-veil-sweep-cover="on: manual; nav: off"><div data-fx-part="veil"></div><div data-fx-part="sweep"></div></div>', 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
