<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>float-rise-corner — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-spacer { height: 90vh; display: grid; place-items: center; color: var(--kf-dim); }
  .bottom { height: 70vh; background: var(--kf-raised); display: grid; place-items: center; }
  .float { position: fixed; right: 20px; bottom: 60px; z-index: 90; }
  .float + .float { right: 120px; }
  .float a { display: grid; place-items: center; width: 80px; height: 80px; border-radius: 50%; background: var(--kf-accent); color: var(--kf-on-accent); font-weight: 700; text-decoration: none; box-shadow: var(--kf-shadow-soft); }
</style>
</head>
<body>
<p class="demo-hint"><b>float-rise-corner</b> — Scroll down a little. A circle at the bottom right pops up, and disappears when it reaches the gray panel at the very bottom.</p>
<div class="demo-spacer">Scroll down</div>
<div class="demo-spacer">Scroll back up and it sinks down again</div>
<section class="bottom" id="bottom">Bottom section</section>
<div class="float" data-fx="float-rise-corner" data-fx-float-rise-corner="until: #bottom"><a href="#">Inquiry</a></div>
<script>
(() => {
  const src = document.querySelector('[data-fx~="float-rise-corner"]');
  if (!src || !src.parentNode) return;
  const host = src.parentNode;
  const gone = src.cloneNode(true);
  src.after(gone);
  setTimeout(() => host.append(src.cloneNode(true)), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s one more circle comes in, and after 2.5s one leaves.");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../../../_shared/vendor/gsap/CustomEase.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
