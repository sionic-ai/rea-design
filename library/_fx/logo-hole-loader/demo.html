<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>logo-hole-loader — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .page { min-height: 100vh; display: grid; place-items: center; background: var(--kf-raised); font: 600 40px/1.1 var(--kf-font-display); }
</style>
</head>
<body>
<p class="demo-hint"><b>logo-hole-loader</b> — Reload to see it again. After a number count, a logo-shaped window grows and reveals the page below. <span style="color:var(--kf-dim)">(After 1s one short curtain comes in, and one empty curtain leaves after 2.5s)</span></p>
<main class="page">Your Hero here</main>
<div data-fx="logo-hole-loader" data-fx-logo-hole-loader="hold: 1"><div data-fx-part="sheet"></div><p data-fx-part="label">Loading...</p><p data-fx-part="count">000%</p></div>
<div data-fx="logo-hole-loader" data-demo-remove><div data-fx-part="sheet"></div></div>
<div data-fx="logo-hole-loader"></div>
<template data-demo-late><div data-fx="logo-hole-loader" data-fx-logo-hole-loader="hold: 0; count: .4; grow: 1.2; fade-at: -1"><div data-fx-part="sheet"></div><p data-fx-part="count">000%</p></div></template>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/CustomEase.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
