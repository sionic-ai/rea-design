<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>scroll-journey — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  html { font-size: 10px; }
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: fixed; top: 0; left: 0; right: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .scene { display: grid; place-items: center; border-right: 1px dashed var(--kf-line); }
  .scene:nth-child(even) { background: var(--kf-raised); }
  .card { padding: 3rem 4rem; border-radius: var(--kf-radius-lg); background: var(--kf-surface); font: 700 3rem/1.2 var(--kf-font-display); }
  .late .card { background: var(--kf-accent-soft); }
</style>
</head>
<body>
<p class="demo-hint"><b>scroll-journey</b> — Scroll down. In the first and last scenes one wheel tick jumps one scene, and the wide middle scene slides sideways. You can also click the circle at the bottom right.</p>
<div class="journey" data-fx="scroll-journey" data-fx-scroll-journey="sizes: 1,1.38,1.38,1; fixed: 0,3">
  <div data-fx-part="track">
    <section class="scene" data-fx-part="scene"><p class="card">Your first scene here</p></section>
    <section class="scene" data-fx-part="scene"><p class="card" data-fx-part="enter" style="--fx-delay: .3s">Wide shot 1</p></section>
    <section class="scene" data-fx-part="scene"><p class="card" data-fx-part="enter" style="--fx-delay: .6s">Wide shot 2</p></section>
    <section class="scene" data-fx-part="scene"><p class="card" data-fx-part="enter">Footer scene</p></section>
  </div>
  <ol data-fx-part="dots"></ol>
</div>
<script>
// Late arrivals and removals — after 1 second add a trip with one scene, and after 2.5 seconds check whether removal and detach run
(() => {
  const late = document.createElement("div");
  late.className = "journey late";
  late.innerHTML = '<div data-fx-part="track"><section class="scene" data-fx-part="scene"><p class="card">Late-arrived scene</p></section></div>';
  setTimeout(() => { late.dataset.fx = "scroll-journey"; document.body.append(late); }, 1000);
  setTimeout(() => late.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s one more trip comes in (a late arrival), then drops out after 2.5s (removal).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollToPlugin.min.js"></script>
<script>gsap.registerPlugin(ScrollToPlugin);</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
