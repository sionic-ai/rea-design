<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>border-orbit-text — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .row { display: flex; flex-wrap: wrap; gap: 90px; padding: 90px 60px; }
  .reel { width: 280px; aspect-ratio: 16 / 9; transform: rotate(-15deg); font: 500 18px/1 var(--kf-font-sans); }
  .reel .wf-img { height: 100%; border-radius: 20px; }
</style>
</head>
<body>
<p class="demo-hint"><b>border-orbit-text</b> — Text circles around the cards. After 1 second one card attaches late, and after 3 seconds a part falls from the first card.</p>
<div class="row" id="row">
  <div class="reel" data-fx="border-orbit-text"><div class="wf-img" data-label="Showreel thumbnail · 16:9"></div><span data-fx-part="text">Showreel • 2025</span></div>
  <div class="reel" data-fx="border-orbit-text" data-fx-border-orbit-text="text: View new work; dur: 8; each: .1; gap: 16"><div class="wf-img" data-label="Option type · dur 8"></div></div>
</div>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
  setTimeout(() => {
    const d = document.createElement("div");
    d.className = "reel"; d.innerHTML = '<div class="wf-img" data-label="Late-attached card"></div><span data-fx-part="text">Attached Late</span>';
    d.setAttribute("data-fx", "border-orbit-text");
    document.getElementById("row").append(d);
  }, 1000);
  setTimeout(() => document.querySelector(".reel")?.removeAttribute("data-fx"), 3000);
</script>
</body>
</html>
