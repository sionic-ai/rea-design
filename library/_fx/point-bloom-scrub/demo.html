<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>point-bloom-scrub — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-contrast-bg); color: var(--kf-contrast-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { margin: 0; padding: 12px 20px; background: var(--kf-surface); color: var(--kf-ink); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .gap { height: 60vh; display: grid; place-items: center; }
  .field { height: 400vh; }
  .stage { position: sticky; top: 0; height: 100vh; overflow: hidden; }
  .stage p { position: absolute; left: 62%; top: 50%; margin: 0; font: 400 14px/1.3 var(--kf-font-mono); }
  .field.empty { height: 120vh; }
</style>
</head>
<body>
<p class="demo-hint"><b>point-bloom-scrub</b> — Scroll down and dots light up on the fixed screen to form a cloud. <span style="opacity:.6">(After 1 second one more section without a canvas comes in and disappears after 2.5 seconds — it must pass quietly)</span></p>
<div class="gap">Scroll down</div>
<section class="field" data-fx="point-bloom-scrub"><div class="stage"><canvas data-fx-part="canvas"></canvas><p id="out">Progress 0</p></div></section>
<template data-demo-late><section class="field empty" data-demo-remove data-fx="point-bloom-scrub"></section></template>
<div class="gap">Footer</div>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
document.querySelector(".field").addEventListener("fx:progress", (e) => { out.textContent = "Progress " + e.detail.progress.toFixed(2); });
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
