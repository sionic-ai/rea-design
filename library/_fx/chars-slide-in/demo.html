<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>chars-slide-in — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; overflow-x: hidden; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo-spacer { height: 70vh; display: grid; place-items: center; color: var(--kf-dim); }
  .demo { padding: 0 20px 80vh; display: grid; gap: 80px; }
  .demo h2 { margin: 0; font: 400 clamp(48px, 12vw, 184px)/1 var(--kf-font-display); color: var(--kf-accent); }
  .demo h3 { margin: 0; max-width: 12em; font: 600 40px/1.3 var(--kf-font-display); }
</style>
</head>
<body>
<p class="demo-hint"><b>chars-slide-in</b> — Scroll down. The big title letters slide in one after another from 50px to the right.</p>
<div class="demo-spacer">Scroll</div>
<section class="demo" id="demo">
  <h2 data-fx="chars-slide-in">TITLE</h2>
  <h3 data-fx="chars-slide-in" data-fx-chars-slide-in="x: 30">Your section title here that wraps onto two lines</h3>
  <h2 data-fx="chars-slide-in" data-fx-chars-slide-in="x: -35; scale: .9; duration: .6; ease: back.out(1.7); stagger: .06">PRODUCTS</h2>
</section>
<script>
// Late arrivals and removals — headings added after 1s are also covered, and headings removed after 2.5s run the detach (restoring split letters)
(() => {
  const demo = document.getElementById("demo");
  const make = (tag) => { const el = document.createElement("h3"); el.dataset.fx = "chars-slide-in"; el.dataset.demo = tag; el.textContent = tag === "late" ? "Heading that came in after 1s" : "Title that drops out after 2.5s"; return el; };
  const gone = make("gone");
  demo.append(gone);
  setTimeout(() => demo.append(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s one more heading comes in, and after 2.5s one drops out.");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../../../_shared/vendor/gsap/SplitText.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
