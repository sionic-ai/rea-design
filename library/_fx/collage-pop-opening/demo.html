<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>collage-pop-opening — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .page { min-height: 80vh; display: grid; place-items: center; font-size: 28px; }
  .logo { position: absolute; inset: 0; display: grid; place-items: center; font: 700 40px/1 var(--kf-font-sans); }
  .a { fill: var(--kf-accent); } .b { fill: var(--kf-ink); } .c { fill: var(--kf-surface); } .d { fill: var(--kf-line); }
</style>
</head>
<body>
<p class="demo-hint"><b>collage-pop-opening</b> — On open, pieces burst out to cover the screen and the curtain lifts at 1.45s (once: none, so it plays on every refresh). <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<div class="page">Page</div>
<div data-fx="collage-pop-opening" data-fx-collage-pop-opening="once: none; narrow: 0" aria-hidden="true"><div class="logo">BRAND</div><svg viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice"><rect data-fx-part="piece" class="a" x="100" y="100" width="400" height="300"/><rect data-fx-part="piece" class="b" x="1400" y="80" width="420" height="320"/><rect data-fx-part="piece" class="c" x="200" y="600" width="500" height="360"/><rect data-fx-part="piece" class="d" x="700" y="300" width="600" height="400"/><rect data-fx-part="piece" class="a" x="1300" y="650" width="500" height="330"/><rect data-fx-part="piece" class="b" x="800" y="40" width="300" height="200"/></svg></div>
<div data-demo-remove data-fx="collage-pop-opening" data-fx-collage-pop-opening="once: none; narrow: 0; close: 4000"><svg viewBox="0 0 1920 1080"><rect data-fx-part="piece" class="d" width="300" height="300"/></svg></div>
<template data-demo-late><div data-fx="collage-pop-opening" data-fx-collage-pop-opening="once: none; narrow: 0; close: 300; fade: .2"><svg viewBox="0 0 1920 1080"><rect data-fx-part="piece" class="a" x="900" y="400" width="300" height="300"/></svg></div></template>
<div data-fx="collage-pop-opening" data-fx-collage-pop-opening="once: none"></div>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
