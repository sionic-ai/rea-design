<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tile-push-hover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { padding: 48px 20px; display: grid; gap: 24px; justify-items: start; }
  .demo a { display: inline-flex; align-items: center; gap: 12px; padding-bottom: 6px; border-bottom: 1px solid var(--kf-line); }
  .soft { --fx-on: var(--kf-accent-soft); --fx-off: var(--kf-surface); --fx-mark-on: var(--kf-surface); --fx-mark-off: var(--kf-accent); --fx-line: var(--kf-accent-soft); }
</style>
</head>
<body>
<p class="demo-hint"><b>tile-push-hover</b> — Hover over the link. The cell pushes in from the left and the colors invert, then on release it pushes one more cell out to the right and returns.</p>
<section class="demo">
  <a href="#">Your see more link here<i data-fx="tile-push-hover"><span data-fx-part="bg"></span><span data-fx-part="mark"></span></i></a>
  <a href="#">Your small button here<i data-fx="tile-push-hover" style="--fx-size: 18px; --fx-radius: 40%"><span data-fx-part="bg"></span><span data-fx-part="mark"></span></i></a>
  <a href="#">Your news line here<i class="soft" data-fx="tile-push-hover" style="--fx-size: 40px"><span data-fx-part="bg"></span><span data-fx-part="mark"></span></i></a>
</section>
<script>
// Late arrivals and removals — checks that fx-core attaches to an element added after 1s and detaches from an element removed after 2.5s
(() => {
  const host = document.querySelector(".demo a"), html = host.outerHTML;
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  host.after(gone);
  setTimeout(() => host.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical one comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
</body>
</html>
