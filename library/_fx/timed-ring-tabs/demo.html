<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>timed-ring-tabs — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-box { margin: 40px 20px; padding: 24px; border: 1px solid var(--kf-line); border-radius: 12px; max-width: 640px; }
  .demo-tabs { display: flex; gap: 6px; margin-bottom: 20px; font: 500 15px var(--kf-font-sans); }
  .demo-box [data-fx-part="item"] { font: 400 28px/1.2 var(--kf-font-sans); min-height: 120px; }
  .demo-nav { display: flex; gap: 8px; margin-top: 16px; }
  .demo-nav button { padding: 6px 14px; border: 1px solid var(--kf-line); border-radius: 10px; background: var(--kf-surface); }
</style>
</head>
<body>
<p class="demo-hint"><b>timed-ring-tabs</b> — Every 3s it switches to the next panel while the ring around the number is drawn in the meantime. Try clicking a number or an arrow.</p>
<div class="demo-box" data-fx="timed-ring-tabs" data-fx-timed-ring-tabs="every: 3">
  <div class="demo-tabs"><button type="button" data-fx-part="tab">1</button><button type="button" data-fx-part="tab">2</button><button type="button" data-fx-part="tab">3</button></div>
  <div style="display:grid">
    <div data-fx-part="item">First panel — step description here</div>
    <div data-fx-part="item">Second panel — step description here</div>
    <div data-fx-part="item">Third panel — Your step description here</div>
  </div>
  <div class="demo-nav"><button type="button" data-fx-part="prev">←</button><button type="button" data-fx-part="next">→</button></div>
</div>
<div class="demo-box" data-fx="timed-ring-tabs"></div>
<script>
// Late arrivals and removals — checks that fx-core attaches to an element added after 1s and detaches from an element removed after 2.5s
(() => {
  const src = document.querySelector('[data-fx~="timed-ring-tabs"]');
  const html = src.outerHTML;
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => src.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s one more panel comes in, and after 2.5s one drops out (detach).");
})();
</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
