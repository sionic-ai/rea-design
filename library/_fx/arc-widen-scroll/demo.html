<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>arc-widen-scroll — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { margin: 0; background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; margin: 0; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-spacer { height: 90vh; display: grid; place-items: center; color: var(--kf-dim); }
  .aw-sec { position: relative; height: 100vh; overflow: hidden; }
  .aw-sec + .aw-sec { margin-top: 20px; }
  .aw-fill { background: linear-gradient(10deg, var(--kf-ink), var(--kf-accent)); }
</style>
</head>
<body>
<p class="demo-hint"><b>arc-widen-scroll</b> — Scroll down and the arc curve beneath the photo panel straightens, and the curve above the next section straightens with it (992px or more).</p>
<div class="demo-spacer">Scroll down ↓</div>
<section class="aw-sec" data-demo-host>
  <div class="aw-box" data-fx="arc-widen-scroll" data-fx-arc-widen-scroll="to: 400" style="bottom:0;left:-50%;width:200vw;height:200vw;border-radius:100vw">
    <div class="aw-fill" data-fx-part="fill" style="bottom:0;height:100vh"></div>
  </div>
</section>
<div class="demo-spacer"></div><div class="demo-spacer"></div>
<script>
// Late arrivals and removals — checks that fx-core attaches to an element added after 1s and detaches from an element removed after 2.5s
(() => {
  const src = document.querySelector('[data-fx~="arc-widen-scroll"]');
  if (!src) return;
  const html = src.outerHTML.replace(/\sid="[^"]*"/g, "");
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const host = src.closest("[data-demo-host]") || src;
  const gone = make("gone");
  host.after(gone);
  setTimeout(() => (src.closest(".pin-spacer") || host).after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical one comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
