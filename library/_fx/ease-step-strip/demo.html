<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ease-step-strip — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.7 var(--kf-font-sans); margin: 0; }
  .demo-hint { margin: 0; padding: 12px 20px; border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .strip { margin: 60px 40px; }
  .card { width: 320px; height: 220px; padding: 24px; border-radius: var(--kf-radius-md); background: var(--kf-contrast-bg); color: var(--kf-contrast-ink); }
</style>
</head>
<body>
<p class="demo-hint"><b>ease-step-strip</b> — Slowly advances one screen every 5 seconds. Hover over a card to pause, and you can also drag sideways.</p>
<div class="strip" data-fx="ease-step-strip" data-fx-ease-step-strip="every: 3"><div data-fx-part="track">
  <article class="card">Card 01</article><article class="card">Card 02</article><article class="card">Card 03</article>
  <article class="card">Card 04</article><article class="card">Card 05</article><article class="card">Card 06</article>
</div></div>
<div class="strip" id="late"><div data-fx-part="track"><article class="card">Late-arrived 01</article><article class="card">Late-arrived 02</article><article class="card">Late-arrived 03</article><article class="card">Late-arrived 04</article></div></div>
<div class="strip" id="gone" data-fx="ease-step-strip"><div data-fx-part="track"><article class="card">Row to be removed soon</article></div></div>
<div class="strip" data-fx="ease-step-strip"><div data-fx-part="track"></div></div>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
(() => {
  setTimeout(() => document.getElementById("late").setAttribute("data-fx", "ease-step-strip"), 1000);
  setTimeout(() => document.getElementById("gone")?.remove(), 2500);
})();
</script>
</body>
</html>
