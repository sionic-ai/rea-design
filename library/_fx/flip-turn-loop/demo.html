<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>flip-turn-loop — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .row { display: flex; gap: 24px; align-items: center; margin: 40px 20px; padding: 0; list-style: none; }
  .row li { flex: none; }
  .row .wf-img { width: 180px; }
</style>
</head>
<body>
<p class="demo-hint"><b>flip-turn-loop</b> — The photo cells flip in a staggered turn every 1.5s. Watch. <span style="color:var(--kf-dim)">(After 1s one more line comes in, and one leaves 2.5s later)</span></p>
<ul class="row" data-fx="flip-turn-loop">
  <li data-fx-part="tile"><div class="wf-img" style="aspect-ratio:3/4" data-label="Poster · portrait 3:4"></div></li>
  <li data-fx-part="tile"><div class="wf-img" style="aspect-ratio:16/10" data-label="Web screen · 16:10"></div></li>
  <li data-fx-part="tile"><div class="wf-img" style="aspect-ratio:1" data-label="Logo · Square"></div></li>
  <li data-fx-part="tile"><div class="wf-img" style="aspect-ratio:3/2" data-label="Aerial photo · 3:2"></div></li>
</ul>
<ul class="row" data-demo-remove data-fx="flip-turn-loop" data-fx-flip-turn-loop="axis: y">
  <li><div class="wf-img" style="aspect-ratio:1" data-label="Line to Be Removed"></div></li>
  <li><div class="wf-img" style="aspect-ratio:1" data-label="Vertical axis only"></div></li>
</ul>
<div class="row" data-fx="flip-turn-loop"></div>
<template data-demo-late><ul class="row" data-fx="flip-turn-loop" data-fx-flip-turn-loop="every: 0.9; dur: 0.5"><li><div class="wf-img" style="aspect-ratio:4/3" data-label="Late-arriving line · every 0.9s"></div></li><li><div class="wf-img" style="aspect-ratio:4/3" data-label="Mismatch"></div></li></ul></template>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
