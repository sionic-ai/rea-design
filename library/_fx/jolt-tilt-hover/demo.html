<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>jolt-tilt-hover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { display: flex; flex-wrap: wrap; gap: 56px; align-items: center; padding: 64px 20px; }
  .stone-btn { display: inline-flex; align-items: center; gap: 12px; color: var(--kf-ink); text-decoration: none; font-size: 20px; }
  .stone-btn .arrow { display: grid; place-items: center; width: 71px; }
  .stone-btn .arrow > * { grid-area: 1 / 1; }
  .stone-btn [data-fx-part="plate"] { width: 100%; height: auto; color: var(--kf-contrast-bg); }
  .stone-btn [data-fx-part="arrow"] { width: 17px; color: var(--kf-contrast-ink); z-index: 1; }
  .paper-btn { position: relative; display: grid; grid-template-columns: 1fr auto; align-items: center; width: 420px; height: 90px; padding-inline: 32px; box-sizing: border-box; color: var(--kf-contrast-ink); text-decoration: none; font-weight: 700; }
  .paper-btn > span, .paper-btn > svg { position: relative; z-index: 1; }
  .paper-btn .label { grid-column: 1 / -1; grid-row: 1; justify-self: center; }
  .paper-btn [data-fx-part="arrow"] { grid-column: 2; grid-row: 1; width: 20px; }
  .paper-btn [data-fx-part="plate"] { position: absolute; inset: 0; z-index: 0; width: 100%; height: 100%; color: var(--kf-contrast-bg); }
</style>
</head>
<body>
<p class="demo-hint"><b>jolt-tilt-hover</b> — Hover over the button. The back plate tilts twice with a jolt and no in-between values, and the arrow is pushed out.</p>
<section class="demo">
  <a class="stone-btn" data-fx="jolt-tilt-hover" href="#"><span class="arrow"><svg data-fx-part="plate" viewBox="0 0 71 53"><path d="M10 6L40 0L68 14L71 36L48 53L14 50L0 30z" fill="currentColor"/></svg><svg data-fx-part="arrow" viewBox="0 0 17 14"><path d="M0 7h15M9 1l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2"/></svg></span>Pebble button</a>
  <a class="paper-btn" data-fx="jolt-tilt-hover" data-fx-jolt-tilt-hover="look: fill" href="#" style="--fx-r1: .5deg; --fx-r2: -1.2deg; --fx-r3: -1.2deg; --fx-ease: linear; --fx-ax: 25%; --fx-ay: -25%; --fx-arrow-delay: .16s"><svg data-fx-part="plate" viewBox="0 0 420 90" preserveAspectRatio="none"><path d="M3 4L417 0L420 86L0 90z" fill="currentColor"/></svg><span class="label">Cut-out paper button</span><svg data-fx-part="arrow" viewBox="0 0 20 20"><path d="M5 15L15 5M7 5h8v8" fill="none" stroke="currentColor" stroke-width="2"/></svg></a>
</section>
<script>
// Late-entering and removed items — a CSS-only part, so it applies right on entry and leaves nothing behind when removed
(() => {
  const src = document.querySelector('[data-fx~="jolt-tilt-hover"]');
  if (!src) return;
  const html = src.outerHTML.replace(/\sid="[^"]*"/g, "");
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => src.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical one comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="../fx-core.js"></script>
</body>
</html>
