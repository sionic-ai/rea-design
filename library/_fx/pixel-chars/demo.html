<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pixel-chars — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { padding: 40px 20px 80vh; display: grid; gap: 40px; }
  .big { font: 800 48px/1 var(--kf-font-display); text-transform: uppercase; max-width: 12em; }
  .demo button { justify-self: start; padding: 8px 14px; border: 1px solid var(--kf-line); background: var(--kf-surface); font: 700 14px/1 var(--kf-font-display); text-transform: uppercase; }
</style>
</head>
<body>
<p class="demo-hint"><b>pixel-chars</b> — Large text forms in dots. Toggle it on and off with the button, and hover over the menu text. <span style="color:var(--kf-dim)">(After 1s one more text comes in, and one leaves 2.5s later)</span></p>
<main class="demo">
  <p class="big" id="hero" data-fx="pixel-chars">Your first Hero copy in two lines here.</p>
  <button type="button" onclick="const h = document.getElementById('hero'); h.style.opacity === '0' ? h.fxPixelChars.show() : h.fxPixelChars.hide()">On · Off</button>
  <button type="button" data-fx="pixel-chars" data-fx-pixel-chars="show: on; flicker: on">Menu First</button>
  <p class="big" data-fx="pixel-chars" data-fx-pixel-chars="show: view; delay: 0.2" data-demo-remove>Text to Be Removed</p>
  <template data-demo-late><p class="big" data-fx="pixel-chars" data-fx-pixel-chars="dur: 0.3; amount: 0.8">Late text</p></template>
</main>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/SplitText.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => { const t = document.querySelector("template[data-demo-late]"); document.querySelector(".demo").append(t.content.cloneNode(true)); }, 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
