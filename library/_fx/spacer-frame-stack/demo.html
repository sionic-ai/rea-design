<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>spacer-frame-stack — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .frame { display: grid; place-items: center; text-align: center; }
  .frame h2 { margin: 0; font: 700 clamp(40px, 8vw, 110px) / 0.9 var(--kf-font-display); text-transform: uppercase; letter-spacing: -0.03em; }
  .meter { position: fixed; right: 16px; bottom: 16px; z-index: 50; padding: 8px 12px; border: 1px solid var(--kf-line); background: var(--kf-surface); font: 600 13px/1 var(--kf-font-mono); }
  .end { height: 60vh; display: grid; place-items: center; color: var(--kf-dim); }
</style>
</head>
<body>
<p class="demo-hint"><b>spacer-frame-stack</b> — Scroll — on a fixed stage each frame stays for its own span, then hands off. The bottom right shows the progress sum (fx:progress). <span style="color:var(--kf-dim)">(1s later one more frame comes in, and 2.5s later one drops out)</span></p>
<div class="stack" data-fx="spacer-frame-stack">
  <div data-fx-part="stage">
    <section class="frame" data-fx-part="frame" data-height="50svh"><h2>First Frame</h2></section>
    <section class="frame" data-fx-part="frame" data-cut><h2>Cut In</h2></section>
    <section class="frame" data-fx-part="frame" data-height="200svh"><h2>Long Stay</h2></section>
    <section class="frame" data-fx-part="frame" data-demo-remove><h2>Removed</h2></section>
    <section class="frame" data-fx-part="frame"><h2>Last One</h2></section>
  </div>
</div>
<template data-demo-late><div data-fx="spacer-frame-stack"><div data-fx-part="stage"><section class="frame" data-fx-part="frame"><h2>Late Stack</h2></section><section class="frame" data-fx-part="frame"><h2>Late Two</h2></section></div></div></template>
<div class="end">Footer</div>
<div class="meter">total <span id="t">0.00</span></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
document.querySelector(".stack").addEventListener("fx:progress", (e) => (document.getElementById("t").textContent = e.detail.total.toFixed(2)));
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); window.ScrollTrigger?.refresh(); }, 2500);
</script>
</body>
</html>
