<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ring-mask-scrub — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .pad { height: 60vh; display: grid; place-content: center; }
  .wf-img { height: 100%; }
  h2 { font: 700 40px/1.1 var(--kf-font-display); color: var(--kf-contrast-ink); }
</style>
</head>
<body>
<p class="demo-hint"><b>ring-mask-scrub</b> — Scroll down. With the panel pinned, a center ring becomes a disc and the photo covers the screen. <span style="color:var(--kf-dim)">(After 1s one more section comes in, and one leaves 2.5s later)</span></p>
<div class="pad">Top margin</div>
<section data-fx="ring-mask-scrub"><div data-fx-part="media"><div class="wf-img" data-label="Hands working with fabric in a workshop · warm lighting · full-bleed landscape"></div></div><div data-fx-part="overlay"><h2>Your title here</h2></div></section>
<section data-fx="ring-mask-scrub" data-demo-remove style="--fx-ring: var(--kf-accent-soft)"><div data-fx-part="media"><div class="wf-img" data-label="Dropped Section"></div></div></section>
<template data-demo-late><section data-fx="ring-mask-scrub" data-fx-ring-mask-scrub="pin: false"><div data-fx-part="media"><div class="wf-img" data-label="Late-added section · not attached"></div></div></section></template>
<div class="pad">Bottom margin</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
gsap.registerPlugin(ScrollTrigger);
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); }, 2500);
</script>
</body>
</html>
