<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>inset-pop-swap — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.6 var(--kf-font-sans); margin: 0; }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; padding: 20px; }
  .demo-grid a { aspect-ratio: 3 / 4; }
  .demo-base { background: linear-gradient(160deg, var(--kf-raised), var(--kf-dim)); }
  .demo-pop { background: linear-gradient(160deg, var(--kf-accent-soft), var(--kf-accent)); }
</style>
</head>
<body>
<p class="demo-hint"><b>inset-pop-swap</b> — Hover over a card. A color photo pops in lightly over the grayscale photo as it opens. Click to keep it on. (One more card comes in after 1s and one leaves after 2.5s)</p>
<div class="demo-grid" data-demo-late-host>
  <a data-fx="inset-pop-swap" href="#"><span class="demo-base" data-fx-part="base"></span><span class="demo-pop" data-fx-part="pop"></span></a>
  <a data-fx="inset-pop-swap" href="#" style="--fx-inset: 12%"><span class="demo-base" data-fx-part="base"></span><span class="demo-pop" data-fx-part="pop"></span></a>
  <a data-fx="inset-pop-swap" href="#" data-demo-remove><span class="demo-base" data-fx-part="base"></span></a>
  <a data-fx="inset-pop-swap" href="#"></a>
</div>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
document.addEventListener("click", (e) => { if (e.target.closest("a")) e.preventDefault(); });
setTimeout(() => {
  const a = document.createElement("a");
  a.href = "#";
  a.dataset.fx = "inset-pop-swap";
  a.innerHTML = '<span class="demo-base" data-fx-part="base"></span><span class="demo-pop" data-fx-part="pop"></span>';
  document.querySelector("[data-demo-late-host]").append(a);
}, 1000);
setTimeout(() => document.querySelector("[data-demo-remove]")?.remove(), 2500);
</script>
</body>
</html>
