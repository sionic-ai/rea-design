<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bend-wall-recede — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { margin: 0; background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: relative; z-index: 2; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .track { height: 300vh; }
  .pin { position: sticky; top: 0; height: 100vh; overflow: hidden; }
  [data-fx-part="tile"] { background: var(--kf-raised); border: 1px solid var(--kf-line); }
  [data-fx-part="tile"]:nth-child(3n) { background: color-mix(in oklab, var(--kf-accent) 25%, var(--kf-bg)); }
  .end { height: 60vh; display: grid; place-items: center; color: var(--kf-dim); }
</style>
</head>
<body>
<p class="demo-hint"><b>bend-wall-recede</b> — The photo wall flows sideways. Scroll down and it wraps around a cylinder and recedes. <span style="color:var(--kf-dim)">(After 1s one more cell comes in, and one leaves 2.5s later)</span></p>
<section class="track" data-fx-part="track">
  <div class="pin">
    <div data-fx="bend-wall-recede">
      <div data-fx-part="stage" id="stage">
        <div data-fx-part="tile"></div><div data-fx-part="tile"></div><div data-fx-part="tile"></div><div data-fx-part="tile"></div><div data-fx-part="tile"></div><div data-fx-part="tile"></div>
        <div data-fx-part="tile"></div><div data-fx-part="tile"></div><div data-fx-part="tile"></div><div data-fx-part="tile"></div><div data-fx-part="tile"></div><div data-fx-part="tile"></div>
        <div data-fx-part="tile"></div><div data-fx-part="tile"></div><div data-fx-part="tile"></div><div data-fx-part="tile"></div><div data-fx-part="tile"></div><div data-fx-part="tile"></div>
        <div data-fx-part="tile"></div><div data-fx-part="tile"></div><div data-fx-part="tile"></div><div data-fx-part="tile"></div><div data-fx-part="tile"></div><div data-fx-part="tile"></div>
      </div>
    </div>
  </div>
</section>
<div class="end" data-demo-remove>Footer</div>
<template data-demo-late><div style="position:relative;height:40vh"><div data-fx="bend-wall-recede" data-fx-bend-wall-recede="speed: 60"><div data-fx-part="stage"><div data-fx-part="tile"></div><div data-fx-part="tile"></div><div data-fx-part="tile"></div></div></div></div></template>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
gsap.registerPlugin(ScrollTrigger);
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
