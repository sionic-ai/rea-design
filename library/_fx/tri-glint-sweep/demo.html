<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>tri-glint-sweep — triangular lattice glint behind the button</title>
  <link rel="stylesheet" href="../../../_shared/wire.css">
  <link rel="stylesheet" href="../../../_shared/kf-defaults.css">
  <link rel="stylesheet" href="fx.css">
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-content: center; gap: 3rem; justify-items: center; background: var(--kf-bg); color: var(--kf-ink); font-family: var(--kf-font-sans); }
    .hint { color: var(--kf-dim); font-size: 14px; }
    .big { font-size: 64px; letter-spacing: -.04em; color: var(--kf-ink); text-decoration: none; }
    .link { font-size: 15px; color: var(--kf-ink); text-decoration: none; }
  </style>
</head>
<body>
  <p class="hint">Hover over the button — left alone, a shine sweeps across from the left every few seconds</p>
  <a class="big" data-fx="tri-glint-sweep" href="#">Let's talk.</a>
  <a class="link" data-fx="tri-glint-sweep" data-fx-tri-glint-sweep="idle: 0" href="#">Sparkles only when you hover over it</a>
  <div id="late"></div>
  <script src="../fx-core.js"></script>
  <script src="fx.js"></script>
  <script>
    setTimeout(() => {
      const a = document.createElement("a");
      a.className = "big"; a.href = "#"; a.dataset.fx = "tri-glint-sweep"; a.textContent = "Late-arriving button";
      document.getElementById("late").append(a);
      document.querySelector(".link")?.remove();
    }, 1000);
  </script>
</body>
</html>
