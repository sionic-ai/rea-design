<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lead-line-nudge — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { padding: 48px 20px; display: flex; flex-direction: column; align-items: flex-end; gap: 40px; max-width: 520px; font-size: 14px; }
</style>
</head>
<body>
<p class="demo-hint"><b>lead-line-nudge</b> — Hover over the link — the line in front moves 10px closer. <span style="color:var(--kf-dim)">(After 1s one more link comes in, and after 2.5s one drops out)</span></p>
<section class="demo" id="list">
  <a data-fx="lead-line-nudge" href="#">About Us</a>
  <a data-fx="lead-line-nudge" href="#">Back Number</a>
  <a data-fx="lead-line-nudge" href="#" style="--fx-line: 32px; --fx-shift: 6px" data-demo-remove>See more</a>
</section>
<script>
setTimeout(() => { const a = document.createElement("a"); a.href = "#"; a.dataset.fx = "lead-line-nudge"; a.textContent = "Late Link"; document.getElementById("list").append(a); }, 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
