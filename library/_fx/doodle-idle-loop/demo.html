<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>doodle-idle-loop — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { margin: 0; padding: 12px 20px; border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .row { display: flex; gap: 60px; align-items: flex-end; justify-content: center; margin: 80px auto 0; padding-bottom: 0; border-bottom: 1px solid var(--kf-ink); }
  .row > span { display: block; width: 160px; color: var(--kf-ink); }
  svg { width: 100%; height: auto; overflow: visible; }
  .ink { fill: var(--kf-ink); }
  .card { fill: var(--kf-surface); }
  .ln { fill: none; stroke: var(--kf-ink); stroke-width: 3; }
</style>
</head>
<body>
<p class="demo-hint"><b>doodle-idle-loop</b> — The character on the line rolls its eyes and blinks, and the cat walks while wagging its tail.</p>
<div class="row" id="row">
  <span data-fx="doodle-idle-loop"><svg viewBox="0 0 72 84"><path data-fx-part="tail" d="M42 76c16 2 24-10 18-26"/><path class="ink" d="M8 80C2 62 4 40 12 30L9 4l13 13h12L46 4l-3 26c8 10 10 32 4 50Z"/><g data-fx-part="eye"><ellipse class="card" cx="19" cy="28" rx="4.7" ry="3"/><circle class="ink" data-fx-part="pupil" cx="19" cy="28" r="1.7"/></g><g data-fx-part="eye"><ellipse class="card" cx="35" cy="28" rx="4.7" ry="3"/><circle class="ink" data-fx-part="pupil" cx="35" cy="28" r="1.7"/></g></svg></span>
  <span data-fx="doodle-idle-loop" style="--fx-dur: 4.44s; width: 220px"><svg viewBox="-10 -10 120 80"><path data-fx-part="tail" d="M6 22C-6 16-6 2 4-4"/><g data-fx-part="leg-a" class="ink"><path d="M16 30 9 58h7l9-26zM74 30l6 28h7l-4-30z"/></g><g data-fx-part="leg-b" class="ink"><path d="M22 30l4 28h7l-2-28zM70 30l-7 28h7l8-26z"/></g><path class="ink" d="M6 22c12-12 50-14 70-8l9-13 4 9 7-9 2 13c7 7 4 18-4 20-8 4-14 2-18 7-16 4-42 4-58-2C6 32-2 30 6 22z"/><g data-fx-part="eye"><ellipse class="card" cx="92" cy="14" rx="3.4" ry="2.1"/><circle class="ink" data-fx-part="pupil" cx="92" cy="14" r="1.2"/></g></svg></span>
</div>
<script src="../fx-core.js"></script>
<script>
  // Checks whether it attaches to late-added characters and whether removed characters get detached
  const cat = '<svg viewBox="0 0 72 84"><path data-fx-part="tail" d="M42 76c16 2 24-10 18-26"/><path class="ink" d="M8 80C2 62 4 40 12 30L9 4l13 13h12L46 4l-3 26c8 10 10 32 4 50Z"/><g data-fx-part="eye"><ellipse class="card" cx="19" cy="28" rx="4.7" ry="3"/><circle class="ink" data-fx-part="pupil" cx="19" cy="28" r="1.7"/></g><g data-fx-part="eye"><ellipse class="card" cx="35" cy="28" rx="4.7" ry="3"/><circle class="ink" data-fx-part="pupil" cx="35" cy="28" r="1.7"/></g></svg>';
  setTimeout(() => {
    const row = document.getElementById("row");
    if (!row) return;
    const s = document.createElement("span");
    s.dataset.fx = "doodle-idle-loop";
    s.style.setProperty("--fx-delay", "-1.3s");
    s.innerHTML = cat;
    row.append(s);
  }, 1000);
  setTimeout(() => document.querySelectorAll("#row > span")[1]?.remove(), 2500);
</script>
</body>
</html>
