<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>spiral-ring-loader — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: sticky; top: 0; z-index: 1100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .page { min-height: 120vh; display: grid; place-items: center; background: var(--kf-accent); color: var(--kf-on-accent); font: var(--kf-weight-display) 64px/1 var(--kf-font-display); }
  .page h1 { opacity: 0; transition: opacity .5s ease; margin: 0; font: inherit; }
  .page.is-cue h1 { opacity: 1; }
  .again { position: fixed; right: 20px; bottom: 20px; z-index: 2000; padding: 8px 14px; border: 1px solid var(--kf-line); border-radius: var(--kf-radius-pill); background: var(--kf-surface); }
</style>
</head>
<body>
<p class="demo-hint"><b>spiral-ring-loader</b> — Refresh. Six rings of text grow and rotate, and a circular hole opens in the center to reveal the Hero. <span style="color:var(--kf-dim)">(After 1s one more layer joins, and one drops out after 2s)</span></p>
<div class="page"><h1>Your Hero here</h1></div>
<div data-fx="spiral-ring-loader" data-fx-spiral-ring-loader="text: YOUR TAGLINE AROUND THE RING · " aria-hidden="true">
  <div data-fx-part="logo"><svg viewBox="0 0 87 29"><path d="M2 26 C 30 22, 60 14, 85 2 C 70 18, 40 27, 2 26 Z" fill="var(--kf-accent)"/></svg></div>
  <div data-fx-part="cloud"><svg viewBox="0 0 100 60" preserveAspectRatio="none"><ellipse cx="30" cy="30" rx="30" ry="18" fill="var(--kf-surface)"/></svg></div>
</div>
<div data-demo-remove data-fx="spiral-ring-loader" data-fx-spiral-ring-loader="lock: off; rings: 3; speed: 2" aria-hidden="true"></div>
<div data-late-slot></div>
<template data-demo-late><div data-fx="spiral-ring-loader" data-fx-spiral-ring-loader="lock: off; speed: 3" aria-hidden="true"></div></template>
<button class="again" type="button">Play again</button>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
document.addEventListener("fx:cue", () => document.querySelector(".page").classList.add("is-cue"));
setTimeout(() => { document.querySelectorAll("template[data-demo-late]").forEach((t) => document.querySelector("[data-late-slot]").replaceWith(t.content.cloneNode(true))); }, 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); }, 2000);
document.querySelector(".again").addEventListener("click", () => {
  document.querySelector(".page").classList.remove("is-cue");
  const old = document.querySelector('[data-fx="spiral-ring-loader"]');
  const fresh = old.cloneNode(true);
  fresh.hidden = false; fresh.removeAttribute("style"); fresh.classList.remove("is-running");
  fresh.querySelectorAll("[style]").forEach((n) => n.removeAttribute("style"));
  fresh.querySelectorAll('[data-fx-part="spiral"]').forEach((n) => n.remove());
  old.replaceWith(fresh);
});
</script>
</body>
</html>
