<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>thumb-to-cursor — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .list { padding: 32px 20px; }
  .row { display: grid; grid-template-columns: 1fr 160px 1fr; align-items: center; gap: 20px; padding: 18px 0; border-top: 1px solid var(--kf-line); color: inherit; text-decoration: none; }
  .row b { font: var(--kf-weight-display) 40px/1 var(--kf-font-display); }
  .thumb { width: 160px; aspect-ratio: 3 / 4; background: var(--kf-accent-soft); }
  .arrow { justify-self: end; font: 500 20px var(--kf-font-mono); }
</style>
</head>
<body>
<p class="demo-hint"><b>thumb-to-cursor</b> — Hover over a row. The row’s image sticks to the cursor, and returns to its place when you leave the row.</p>
<section class="list">
  <a class="row" href="#" data-fx="thumb-to-cursor"><b>One case</b><span class="thumb" data-fx-part="thumb"></span><span class="arrow" data-fx-part="hover">→</span></a>
  <a class="row" href="#" data-fx="thumb-to-cursor"><b>Work Two</b><span class="thumb" data-fx-part="thumb"></span><span class="arrow" data-fx-part="hover">→</span></a>
  <a class="row" href="#" data-fx="thumb-to-cursor"><b>Work Three</b><span class="thumb" data-fx-part="thumb"></span><span class="arrow" data-fx-part="hover">→</span></a>
</section>
<script>
// Late arrivals and removals — adds a line after 1 s, removes one after 2.5 s
(() => {
  const list = document.querySelector(".list");
  setTimeout(() => {
    const a = document.createElement("a");
    a.className = "row"; a.href = "#"; a.dataset.fx = "thumb-to-cursor"; a.dataset.demo = "late";
    a.innerHTML = '<b>Late-arrived Work</b><span class="thumb" data-fx-part="thumb"></span><span class="arrow" data-fx-part="hover">→</span>';
    list.append(a);
  }, 1000);
  setTimeout(() => list.children[1]?.remove(), 2500);
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
