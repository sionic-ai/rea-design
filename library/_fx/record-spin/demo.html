<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>record-spin — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { padding: 48px 20px; display: flex; flex-wrap: wrap; gap: 48px; align-items: center; perspective: 1400px; }
  .rec { width: 260px; aspect-ratio: 1; }
  .rec .wf-img { border-radius: 50%; }
</style>
</head>
<body>
<p class="demo-hint"><b>record-spin</b> — Drag across the panel with the mouse to scratch it. A button flips the side.</p>
<section class="demo">
  <div class="rec" data-fx="record-spin"><div data-fx-part="disc" class="wf-img" data-label="Panel art · center label"></div></div>
  <div class="rec" data-fx="record-spin" data-fx-record-spin="turn: 1.333"><div data-fx-part="disc" class="wf-img" data-label="45rpm Record"></div></div>
  <button type="button" onclick="document.querySelectorAll('[data-fx~=record-spin]').forEach((e) => e.dispatchEvent(new CustomEvent('fx:flip', { detail: e.dataset.side = e.dataset.side === 'B' ? 'A' : 'B' })))">Flip side</button>
</section>
<script>
(() => {
  const src = document.querySelector('[data-fx~="record-spin"]');
  const html = src.outerHTML;
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => src.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical one comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
