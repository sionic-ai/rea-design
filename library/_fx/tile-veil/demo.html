<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tile-veil — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-grid { min-height: 160vh; background-image: linear-gradient(0deg, transparent calc(19.1vw), var(--kf-line) 0, var(--kf-line) calc(19.1vw + 1px)), linear-gradient(90deg, var(--kf-line) 1px, transparent 0); background-size: calc(19.1vw + 1px) calc(19.1vw + 1px); background-position: 2.08vw 7.2vw; display: grid; place-items: center; }
  .demo-intro { position: absolute; inset: 0; display: grid; place-items: center; background: var(--kf-bg); font: 700 64px/1 var(--kf-font-display); }
</style>
</head>
<body>
<p class="demo-hint"><b>tile-veil</b> — On first open the panel shows and cells cover then clear. Click the link below and cells light up to cover, then the same page opens again. <span style="color:var(--kf-dim)">(After 1s one more cover comes in, and after 2.5s one drops out)</span></p>
<div data-fx="tile-veil" data-demo-remove><div data-fx-part="intro" class="demo-intro">First-visit version</div></div>
<main class="demo-grid"><a href="demo.html?next" style="font:700 28px/1 var(--kf-font-display);text-decoration:underline">Go to another page</a></main>
<template data-demo-late><div data-fx="tile-veil" data-fx-tile-veil="open: 0.3"></div></template>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); window.ScrollTrigger?.refresh(); }, 2500);
</script>
</body>
</html>
