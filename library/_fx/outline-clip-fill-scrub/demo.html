<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>outline-clip-fill-scrub — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .spacer { height: 80vh; display: grid; place-items: center; color: var(--kf-dim); }
  .demo { padding: 0 5vw; }
  .demo p { font-size: clamp(48px, 9vw, 136px); line-height: .9; letter-spacing: -.05em; font-weight: 500; }
  .demo p:nth-of-type(2) { margin-left: 8vw; } .demo p:nth-of-type(3) { margin-left: 16vw; }
  .demo .n { font: 12px/1.4 var(--kf-font-mono); color: var(--kf-accent); text-transform: uppercase; }
</style>
</head>
<body>
<p class="demo-hint"><b>outline-clip-fill-scrub</b> — Scroll down. The outlined line fills with solid text from the left. <span style="color:var(--kf-dim)">(After 1s one more panel comes in, and one leaves 2.5s later)</span></p>
<div class="spacer">↓</div>
<section class="demo" data-fx="outline-clip-fill-scrub">
  <span class="n" data-fx-part="note">↤ 12 col ↦</span>
  <p data-fx-part="line"><span data-fx-part="ghost" aria-hidden="true">Keep the idea.</span><span data-fx-part="solid">Keep the idea.</span></p>
  <p data-fx-part="line"><span data-fx-part="ghost" aria-hidden="true">Change what gets</span><span data-fx-part="solid">Change what gets</span></p>
  <p data-fx-part="line"><span data-fx-part="ghost" aria-hidden="true">in its way.</span><span data-fx-part="solid">in its way.</span></p>
</section>
<section class="demo" data-fx="outline-clip-fill-scrub" data-demo-remove><p data-fx-part="line"><span data-fx-part="solid">That it would vanish</span></p></section>
<section class="demo" data-fx="outline-clip-fill-scrub"></section>
<template data-demo-late><section class="demo" data-fx="outline-clip-fill-scrub" data-fx-outline-clip-fill-scrub="each: .3"><p data-fx-part="line"><span data-fx-part="ghost" aria-hidden="true">Late-arriving single line</span><span data-fx-part="solid">Late-arriving single line</span></p></section></template>
<div class="spacer">Footer</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
