<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pin-circle-grow — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: fixed; top: 0; left: 0; right: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo-spacer { height: 80vh; display: grid; place-items: center; color: var(--kf-dim); }
  [data-fx-part="media"].wf-img { border: 0; }
</style>
</head>
<body>
<p class="demo-hint"><b>pin-circle-grow</b> Scroll down. The panel stays pinned while the circular window at the bottom grows beyond the screen and the circle’s rim loosens. <span style="color:var(--kf-dim)">(After 1s one more panel comes in, and one leaves 2.5s later)</span></p>
<section data-demo-remove data-fx="pin-circle-grow">
  <figure data-fx-part="circle"><span class="wf-img wf-dark" data-fx-part="media" data-label="Dropped panel · signature dish close-up"></span></figure>
</section>
<section data-fx="pin-circle-grow">
  <figure data-fx-part="circle"><span class="wf-img wf-dark" data-fx-part="media" data-label="Lead dish close-up · seen through a round window"></span></figure>
</section>
<div class="demo-spacer">After the circle fully opens</div>
<template data-demo-late><section data-fx="pin-circle-grow" data-fx-pin-circle-grow="grow: 90vh; scrub: 0">
  <figure data-fx-part="circle"><span class="wf-img" data-fx-part="media" data-label="Late-arriving panel · Up to 90vh · Immediate"></span></figure>
</section></template>
<div class="demo-spacer">Footer</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); window.ScrollTrigger?.refresh(); }, 2500);
</script>
</body>
</html>
