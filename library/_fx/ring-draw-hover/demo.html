<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ring-draw-hover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { padding: 48px 20px; display: grid; gap: 28px; max-width: 560px; }
  .btn { display: inline-flex; align-items: center; width: fit-content; }
  .btn > svg { width: 64px; height: 64px; }
  .btn [data-fx-part="arrow"] { position: absolute; top: 0; bottom: 0; left: 25px; width: 13px; height: 11px; margin: auto; }
  .btn [data-fx-part="arrow"] svg { display: block; width: 13px; height: 11px; }
  .btn [data-fx-part="label"] { margin-left: 15px; font-size: 13px; font-weight: 700; }
  .dark { padding: 24px; border-radius: var(--kf-radius-md); background: var(--kf-accent); color: var(--kf-on-accent); }
</style>
</head>
<body>
<p class="demo-hint"><b>ring-draw-hover</b> — Hover over the button. The round border is drawn once around, and the inner arrow slips out and comes back.</p>
<section class="demo">
  <a href="#" class="btn" data-fx="ring-draw-hover"><svg data-fx-part="ring" viewBox="0 0 64 64"><circle cx="32" cy="32" r="31.5"/><circle cx="32" cy="32" r="31.5"/></svg><i data-fx-part="arrow"><svg viewBox="0 0 13 11" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M0 5.5h12M7.5 1l4.5 4.5L7.5 10"/></svg></i><span data-fx-part="label">Your button text here</span></a>
  <a href="#" class="btn" data-fx="ring-draw-hover"><svg data-fx-part="ring" viewBox="0 0 64 64"><circle cx="32" cy="32" r="31.5"/><circle cx="32" cy="32" r="31.5"/></svg><span data-fx-part="label">Type Without Arrow</span></a>
  <div class="dark"><a href="#" class="btn" data-fx="ring-draw-hover" style="--fx-track: var(--kf-on-accent); --fx-ink: var(--kf-on-accent)"><svg data-fx-part="ring" viewBox="0 0 64 64"><circle cx="32" cy="32" r="31.5" opacity=".2"/><circle cx="32" cy="32" r="31.5"/></svg><i data-fx-part="arrow"><svg viewBox="0 0 13 11" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M0 5.5h12M7.5 1l4.5 4.5L7.5 10"/></svg></i><span data-fx-part="label">On a dark background</span></a></div>
</section>
<script>
// Late arrivals and removals — checks that fx-core attaches to an element added after 1s and detaches from an element removed after 2.5s
(() => {
  const src = document.querySelector('[data-fx~="ring-draw-hover"]');
  if (!src) return;
  const html = src.outerHTML;
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => src.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical one comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
</body>
</html>
