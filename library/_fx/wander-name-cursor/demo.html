<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>wander-name-cursor — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 500 13px/1.4 var(--kf-font-sans); }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .board { margin: 40px; height: 260px; max-width: 520px; border-radius: var(--kf-radius-md); background: var(--kf-surface); border: 1px solid var(--kf-line); }
</style>
</head>
<body>
<p class="demo-hint"><b>wander-name-cursor</b> — Just watch. A name-tag cursor drifts around the panel every 1–3 seconds. <span style="color:var(--kf-dim)">(After 1s one more panel comes in, and one leaves 2.5s later)</span></p>
<div class="board" data-fx="wander-name-cursor"><div data-fx-part="walker"><svg width="20" height="20" viewBox="0 0 24 24"><path d="M2 2l20 8-8 2-2 8z" fill="currentColor"/></svg><span data-fx-part="tag">Your Name</span></div></div>
<div class="board" data-fx="wander-name-cursor" data-demo-remove><div data-fx-part="walker"><span data-fx-part="tag">Cursor to drop</span></div></div>
<template data-demo-late><div class="board" data-fx="wander-name-cursor" data-fx-wander-name-cursor="min: 500; max: 1200; start: 0"><div data-fx-part="walker"><span data-fx-part="tag">Late-arrived cursor</span></div></div></template>
<div data-fx="wander-name-cursor"></div>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); }, 2500);
</script>
</body>
</html>
