<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>contour-dive — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .gap { height: 150vh; }
  .after { min-height: 120vh; padding: 40px; background: var(--kf-surface); }
</style>
</head>
<body>
<p class="demo-hint"><b>contour-dive</b> — Scroll down. The camera descends into the contour steps, and at the very bottom the spot the mouse passes over heaves up. <span style="color:var(--kf-dim)">(After 1s one more panel joins, then drops out after 2.5s)</span></p>
<div data-fx="contour-dive" data-fx-contour-dive="start: #dive-start; end: #dive-end; footer: #dive-foot; layers: 40"></div>
<div id="dive-start" class="gap"></div>
<div class="gap"></div>
<div id="dive-end"></div>
<div class="after">The stairs end here and the main content continues.</div>
<div id="dive-foot" style="height: 100vh"></div>
<div data-fx="contour-dive" data-demo-remove style="position: absolute; inset: auto 0 0 auto; width: 200px; height: 120px; z-index: 1"></div>
<template data-demo-late><div data-fx="contour-dive" data-fx-contour-dive="layers: 12; intro: .5" style="position: absolute; top: 60px; right: 20px; inset-inline-start: auto; width: 240px; height: 150px; z-index: 1"></div></template>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="three-global.js"></script>
<script src="../../_vendor/three@0.162.0/build/three.cjs"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script src="demo.js"></script>
</body>
</html>
