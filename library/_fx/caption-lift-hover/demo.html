<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>caption-lift-hover — Motion part</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 14px/1.21 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; padding: 48px 20px; max-width: 900px; }
  .card { display: block; }
  .card .pic { aspect-ratio: 4 / 5; border-radius: var(--kf-radius-md); background: var(--kf-raised); }
  .card p { margin-top: 10px; font-weight: 500; }
  .card ul li span { margin-right: 6px; white-space: nowrap; }
</style>
</head>
<body>
<p class="demo-hint"><b>caption-lift-hover</b> — Hover over the card. <span style="color:var(--kf-dim)">(One more card comes in after 1s, and one drops out after 2.5s)</span></p>
<div class="demo">
  <a class="card" href="#" data-fx="caption-lift-hover"><div class="pic"></div><p>Work Title One</p><span data-fx-part="line"><ul data-fx-part="out"><li><span>#Cover</span></li><li><span>#Person</span></li><li><span>#Line Art</span></li></ul><span data-fx-part="in"><span>Work</span> <span>View</span></span></span></a>
  <a class="card" href="#" data-fx="caption-lift-hover" data-demo-remove><div class="pic"></div><p>Card to drop</p><span data-fx-part="line"><ul data-fx-part="out"><li><span>#One</span></li></ul><span data-fx-part="in"><span>Work</span> <span>View</span></span></span></a>
  <template data-demo-late><a class="card" href="#" data-fx="caption-lift-hover" style="--fx-dur: .3s; --fx-each: 0s"><div class="pic"></div><p>Late-arrived card</p><span data-fx-part="line"><ul data-fx-part="out"><li><span>#Slow</span></li><li><span>#Fast</span></li></ul><span data-fx-part="in"><span>All together</span></span></span></a></template>
  <a class="card" href="#" data-fx="caption-lift-hover"><div class="pic"></div><p>Card without caption</p></a>
</div>
<script src="../fx-core.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
