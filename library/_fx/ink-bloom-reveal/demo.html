<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ink-bloom-reveal — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .stage { display: grid; place-items: center; height: 80vh; font: 300 64px/1 var(--kf-font-display); background: var(--kf-accent-soft); }
  button { margin: 20px; padding: 10px 16px; }
</style>
</head>
<body>
<p class="demo-hint"><b>ink-bloom-reveal</b> — On open, the curtain lifts like ink spreading from the center (3.5s). Use the button below to replay.</p>
<main class="stage" data-fx="ink-bloom-reveal" data-fx-ink-bloom-reveal="delay: 0.3" data-demo-remove>Your first section here</main>
<button type="button" onclick="const m=document.createElement('div');m.className='stage';m.textContent='Reopen';m.dataset.fx='ink-bloom-reveal';m.dataset.fxInkBloomReveal='dur: 2';document.body.append(m)">Reopen</button>
<template data-demo-late><div class="stage" data-fx="ink-bloom-reveal" data-fx-ink-bloom-reveal="x: 0.2; y: 0.8; dur: 1.5">Late-arriving panel</div></template>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
