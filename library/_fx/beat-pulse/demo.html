<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>beat-pulse — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .row { display: flex; gap: 60px; padding: 80px 40px; }
  .logo { display: grid; place-items: center; width: 220px; height: 220px; border-radius: 50%; background: var(--kf-accent); color: var(--kf-on-accent); font: 700 32px/1 var(--kf-font-display); }
</style>
</head>
<body>
<p class="demo-hint"><b>beat-pulse</b> — Just watch. The logos bounce to the time signature (one joins late after 1s, and the first one drops off after 3s).</p>
<div class="row" id="row">
  <div class="logo" data-fx="beat-pulse">LOGO</div>
  <div class="logo" data-fx="beat-pulse" data-fx-beat-pulse="loop: 2; beats: 0:1.05/.97, 1:1.05/.97">2 sec, 2 beats</div>
</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
  setTimeout(() => {
    const row = document.getElementById("row");
    if (!row) return;
    const d = document.createElement("div");
    d.className = "logo"; d.textContent = "Late"; d.setAttribute("data-fx", "beat-pulse");
    row.append(d);
  }, 1000);
  setTimeout(() => document.querySelector(".logo")?.removeAttribute("data-fx"), 3000);
</script>
</body>
</html>
