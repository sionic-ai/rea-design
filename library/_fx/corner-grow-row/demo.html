<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>corner-grow-row — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { display: grid; gap: 80px; padding: 40px 4vw 60vh; }
  .row { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 1rem; }
  .row > [data-fx-part="rule"] { grid-column: 1 / -1; }
  .row figure { margin: 0; aspect-ratio: 3 / 4; }
  .row figure .wf-img { height: 100%; }
  .row .is-wide { display: none; }
  .demo-spacer { height: 90vh; display: grid; place-items: center; color: var(--kf-dim); }
</style>
</head>
<body>
<p class="demo-hint"><b>corner-grow-row</b> — Scroll down. An underline is drawn on each row and thumbnails grow one by one from the top-left point. <span style="color:var(--kf-dim)">(After 1s one more line comes in, and one leaves 2.5s later)</span></p>
<div class="demo-spacer">Scroll down</div>
<section class="demo">
  <div class="row" data-fx="corner-grow-row">
    <span data-fx-part="rule"></span>
    <figure data-fx-part="item"><div class="wf-img" data-label="Indoor · window light · portrait 3:4"></div></figure>
    <figure data-fx-part="item"><div class="wf-img" data-label="Interior · portrait 3:4"></div></figure>
    <figure data-fx-part="item"><div class="wf-img" data-label="Interior · portrait 3:4"></div></figure>
    <figure data-fx-part="item"><div class="wf-img" data-label="Interior · portrait 3:4"></div></figure>
    <figure data-fx-part="item"><div class="wf-img" data-label="Interior · portrait 3:4"></div></figure>
    <figure data-fx-part="item" class="is-wide"><div class="wf-img" data-label="Hidden thumbnail (skipped)"></div></figure>
  </div>
  <div class="row" data-fx="corner-grow-row" data-fx-corner-grow-row="corner: bottom right; stagger: .15; dur: .8">
    <figure><div class="wf-img" data-label="No label · from bottom right"></div></figure>
    <figure><div class="wf-img" data-label="Vertical 3:4"></div></figure>
    <figure><div class="wf-img" data-label="Vertical 3:4"></div></figure>
  </div>
  <div class="row" data-fx="corner-grow-row" data-demo-remove>
    <figure data-fx-part="item"><div class="wf-img" data-label="Line to be removed soon"></div></figure>
  </div>
  <template data-demo-late><div class="row" data-fx="corner-grow-row"><span data-fx-part="rule"></span><figure data-fx-part="item"><div class="wf-img" data-label="Late row"></div></figure><figure data-fx-part="item"><div class="wf-img" data-label="Late row"></div></figure></div></template>
</section>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); window.ScrollTrigger?.refresh(); }, 2500);
</script>
</body>
</html>
