<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>border-frame-open — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 16px/1.7 var(--kf-font-sans); }
  .demo-hint { position: fixed; top: 0; left: 0; right: 0; z-index: 20; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .hero { position: relative; height: 100dvh; display: grid; place-items: center; }
  .stage { position: fixed; inset: 0; z-index: -1; overflow: hidden; background: var(--kf-bg); }
  .scene { position: absolute; inset: 0; }
  .photo { position: absolute; inset: 0; background: linear-gradient(180deg, color-mix(in oklab, var(--kf-accent) 30%, var(--kf-bg)) 0 48%, color-mix(in oklab, var(--kf-accent) 85%, var(--kf-ink)) 52% 100%); }
  .logo { position: absolute; left: 50%; top: 50%; translate: -50% -50%; font: 400 22px/1 var(--kf-font-display); letter-spacing: .3em; }
  .logo.is-alt { color: var(--kf-on-accent); }
  .title { font: 400 clamp(40px, 9vw, 120px)/1 var(--kf-font-display); letter-spacing: .1em; color: var(--kf-on-accent); }
  .after { min-height: 80vh; padding: 10vh 10vw; background: var(--kf-bg); }
</style>
</head>
<body>
<p class="demo-hint"><b>border-frame-open</b> — Refresh. After 1.8 seconds the white window frame lifts and the photo grows, and the title lights up at 4.2 seconds. <span style="color:var(--kf-dim)">(After 1s one more small panel comes in, and after 2.5s one leaves)</span></p>
<section class="hero" data-fx="border-frame-open">
  <div class="stage">
    <span class="logo" data-fx-part="mark">LOGO</span>
    <div class="scene" data-fx-part="scene">
      <div class="photo"></div>
      <i data-fx-part="frame"></i>
      <span class="logo is-alt" data-fx-part="mark-alt">LOGO</span>
    </div>
  </div>
  <h1 class="title" data-fx-part="reveal">Studio Name</h1>
</section>
<section class="after"><p>Your next chapter text here.</p><div data-fx="border-frame-open" data-demo-remove><i data-fx-part="frame"></i></div></section>
<template data-demo-late><div data-fx="border-frame-open" data-fx-border-frame-open="delay: 0; reveal: .5"><p data-fx-part="reveal">Late-arriving panel — switches on right away</p></div></template>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
