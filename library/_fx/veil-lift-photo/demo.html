<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>veil-lift-photo — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: sticky; top: 0; z-index: 10; margin: 0; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 40px; width: min(1000px, 90vw); margin: 70vh auto 40vh; }
  .row figure { margin: 0; aspect-ratio: 4 / 5; }
  .row .wf-img { height: 100%; }
</style>
</head>
<body>
<p class="demo-hint"><b>veil-lift-photo</b> — Scroll down. The cover on the photo cell lifts up and the photo rises from 100px below. Scroll back up and down to repeat.</p>
<div class="row" id="row">
  <figure data-fx="veil-lift-photo"><div class="wf-img" data-label="Hairstyle 01 · Portrait 4:5"></div></figure>
  <figure data-fx="veil-lift-photo" data-fx-veil-lift-photo="rise: 60; delay: .4"><div class="wf-img" data-label="Hairstyle 02 · Portrait 4:5"></div></figure>
</div>
<script>
// Late arrivals and removals — after 1 second one more cell comes in (late arrival), and after 2.5 seconds the first cell leaves (detach)
(() => {
  const row = document.getElementById("row");
  const first = row.firstElementChild;
  setTimeout(() => { const f = document.createElement("figure"); f.dataset.fx = "veil-lift-photo"; f.innerHTML = '<div class="wf-img" data-label="Late-arriving cell · portrait 4:5"></div>'; row.append(f); }, 1000);
  setTimeout(() => first.remove(), 2500);
})();
</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
