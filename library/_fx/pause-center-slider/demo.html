<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pause-center-slider — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { padding: 48px 0; display: grid; gap: 48px; }
  .slot { width: min(46vw, 420px); aspect-ratio: 620 / 570; border-radius: 48% 52% 46% 54% / 50% 46% 54% 50%; overflow: hidden; }
  .slot .wf-img { width: 100%; height: 100%; }
  .small .slot { width: 200px; }
</style>
</head>
<body>
<p class="demo-hint"><b>pause-center-slider</b> — Watch closely. The center cell pauses for 2.4 seconds, then slides to the next. <span style="color:var(--kf-dim)">(After 1s one more band comes in, and one leaves 2.5s later)</span></p>
<section class="demo">
  <div data-fx="pause-center-slider"><div data-fx-part="track">
    <figure class="slot"><div class="wf-img" data-label="Photo 1"></div></figure>
    <figure class="slot"><div class="wf-img" data-label="Photo 2"></div></figure>
    <figure class="slot"><div class="wf-img" data-label="Photo 3"></div></figure>
    <figure class="slot"><div class="wf-img" data-label="Photo 4"></div></figure>
  </div></div>
  <div data-demo-remove class="small" data-fx="pause-center-slider" data-fx-pause-center-slider="pause: 1; slide: .8; look: plain" style="--fx-gap: 20px"><div data-fx-part="track">
    <figure class="slot"><div class="wf-img" data-label="Exit band 1"></div></figure>
    <figure class="slot"><div class="wf-img" data-label="Exit band 2"></div></figure>
  </div></div>
  <template data-demo-late><div class="small" data-fx="pause-center-slider" data-fx-pause-center-slider="pause: 1.2; slide: 1" style="--fx-gap: 20px"><div data-fx-part="track">
    <figure class="slot"><div class="wf-img" data-label="Late 1"></div></figure>
    <figure class="slot"><div class="wf-img" data-label="Late 2"></div></figure>
    <figure class="slot"><div class="wf-img" data-label="Late 3"></div></figure>
  </div></div></template>
</section>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
