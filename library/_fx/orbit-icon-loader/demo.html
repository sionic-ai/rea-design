<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>orbit-icon-loader — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: relative; z-index: 2000; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .page { min-height: 80vh; display: grid; place-items: center; font-size: 32px; }
  .shape { fill: var(--kf-accent); }
  .shape.b { fill: var(--kf-ink); }
  .shape.c { fill: var(--kf-dim); }
</style>
</head>
<body>
<p class="demo-hint"><b>orbit-icon-loader</b> — On refresh, six shapes bloom around a circle, spin two turns and close up, then the curtain lifts. <button type="button" onclick="location.reload()">View again</button></p>
<main class="page">Your Hero here</main>
<div data-fx="orbit-icon-loader" data-fx-orbit-icon-loader="dur: 5.6">
  <div data-fx-part="ring"><div data-fx-part="spin">
    <span data-fx-part="icon"><svg viewBox="0 0 100 100"><path class="shape" d="M50 88 12 50a22 22 0 0 1 38-30 22 22 0 0 1 38 30Z"/></svg></span>
    <span data-fx-part="icon"><svg viewBox="0 0 100 100"><path class="shape b" d="M18 90V50a32 32 0 0 1 64 0v40H64V50a14 14 0 0 0-28 0v40Z"/></svg></span>
    <span data-fx-part="icon"><svg viewBox="0 0 100 100"><circle class="shape c" cx="50" cy="50" r="38"/></svg></span>
    <span data-fx-part="icon"><svg viewBox="0 0 100 100"><path class="shape" d="M50 6c4 26 18 40 44 44-26 4-40 18-44 44-4-26-18-40-44-44C32 46 46 32 50 6Z"/></svg></span>
    <span data-fx-part="icon"><svg viewBox="0 0 100 100"><rect class="shape b" x="16" y="16" width="68" height="68" rx="20"/></svg></span>
    <span data-fx-part="icon"><svg viewBox="0 0 100 100"><path class="shape c" d="M50 10 90 80H10Z"/></svg></span>
  </div></div>
</div>
<script>
(() => {
  const src = document.querySelector('[data-fx~="orbit-icon-loader"]');
  if (!src) return;
  src.addEventListener("fx:done", () => document.querySelector(".page").append(" · fx:done"));
  const gone = document.createElement("div");
  gone.setAttribute("data-fx", "orbit-icon-loader");
  gone.innerHTML = '<div data-fx-part="ring"><div data-fx-part="spin"></div></div>';
  document.body.append(gone);
  setTimeout(() => gone.remove(), 1000);
  document.querySelector(".demo-hint").append(" · A single empty loader drops out after 1 second.");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/CustomEase.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
