<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>scrub-frame-walker — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .gap { height: 60vh; }
  .road { position: relative; height: 140vh; margin: 0 6vw; border-bottom: 2px solid var(--kf-line); overflow: hidden; }
  .road + .road { margin-top: 20vh; }
  .kid { fill: var(--kf-accent); }
  .kid-b { fill: var(--kf-ink); }
</style>
</head>
<body>
<p class="demo-hint"><b>scrub-frame-walker</b> — Scroll down. A little character walks left as far as you scroll, alternating its step frames. <span style="color:var(--kf-dim)">(After 1s one more path comes in, and one leaves 2.5s later)</span></p>
<div class="gap"></div>
<section class="road">
  <div data-fx="scrub-frame-walker">
    <svg data-fx-part="frame" viewBox="0 0 96 107"><circle class="kid" cx="48" cy="30" r="24"/><rect class="kid" x="30" y="52" width="36" height="34" rx="8"/><rect class="kid-b" x="26" y="86" width="12" height="20"/><rect class="kid-b" x="58" y="86" width="12" height="20"/></svg>
    <svg data-fx-part="frame" viewBox="0 0 96 107"><circle class="kid" cx="48" cy="30" r="24"/><rect class="kid" x="30" y="52" width="36" height="34" rx="8"/><rect class="kid-b" x="38" y="86" width="12" height="20"/><rect class="kid-b" x="48" y="86" width="12" height="20"/></svg>
  </div>
</section>
<section class="road" data-demo-remove>
  <div data-fx="scrub-frame-walker" data-fx-scrub-frame-walker="frames: 12; scrub: 0; dir: right" style="--fx-w: 64px">
    <svg data-fx-part="frame" viewBox="0 0 96 107"><circle class="kid-b" cx="48" cy="30" r="24"/><rect class="kid-b" x="26" y="86" width="12" height="20"/></svg>
    <svg data-fx-part="frame" viewBox="0 0 96 107"><circle class="kid-b" cx="48" cy="30" r="24"/><rect class="kid-b" x="58" y="86" width="12" height="20"/></svg>
  </div>
</section>
<template data-demo-late><section class="road"><div data-fx="scrub-frame-walker" data-fx-scrub-frame-walker="frames: 30"><svg data-fx-part="frame" viewBox="0 0 96 107"><circle class="kid" cx="48" cy="40" r="30"/></svg><svg data-fx-part="frame" viewBox="0 0 96 107"><circle class="kid-b" cx="48" cy="40" r="30"/></svg></div></section></template>
<div class="gap"></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
