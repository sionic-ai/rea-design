<!doctype html>
<html lang="ko" data-fx="page-vt-reveal">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>page-vt-reveal — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); min-height: 100vh; }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  main { padding: 40px 20px; display: grid; gap: 16px; }
  main a { text-decoration: underline; }
</style>
</head>
<body>
<p class="demo-hint"><b>page-vt-reveal</b> — Click the link below. The current screen shrinks and blurs while the new screen opens from bottom to top (when opened over http).</p>
<main>
  <a href="demo.html?next=1">Reopen the same demo</a>
  <p data-demo-remove>Line to erase</p>
  <div data-fx="page-vt-reveal">Anything set on a non-html element does nothing</div>
</main>
<template data-demo-late><div data-fx="page-vt-reveal" data-fx-page-vt-reveal="dur: 0.6">Late-arrived Element</div></template>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
