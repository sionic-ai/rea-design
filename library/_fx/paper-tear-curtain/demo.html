<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>paper-tear-curtain — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); min-height: 100vh; }
  .demo-hint { position: relative; z-index: 5; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .row { position: relative; z-index: 5; display: flex; gap: 12px; padding: 20px; }
  .row button { padding: 10px 16px; border: 1px solid var(--kf-ink); background: var(--kf-surface); cursor: pointer; }
  [data-fx~="paper-tear-curtain"] { z-index: 2; }
</style>
</head>
<body>
<p class="demo-hint"><b>paper-tear-curtain</b> — Press the button to cover and clear the torn paper curtain.</p>
<div class="row">
  <button type="button" data-go="in">Cover (from above)</button>
  <button type="button" data-go="out">Walking</button>
  <button type="button" data-go="flip">Cover the photo slot from below</button>
</div>
<div class="a" data-fx="paper-tear-curtain"></div>
<div data-fx="paper-tear-curtain" data-fx-paper-tear-curtain="horizontal: 1; dur: 1.2" data-demo-remove></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../_vendor/ogl@0.0.74/ogl.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
const curtain = document.querySelector(".a");
document.querySelectorAll("[data-go]").forEach((b) => b.addEventListener("click", () => {
  const go = b.dataset.go;
  if (go === "flip") curtain.dispatchEvent(new CustomEvent("fx:in", { detail: { cover: "--kf-raised", invert: true, placeholder: true } }));
  else curtain.dispatchEvent(new CustomEvent("fx:" + go));
}));
setTimeout(() => {
  const late = document.createElement("div");
  late.setAttribute("data-fx", "paper-tear-curtain");
  late.setAttribute("data-fx-paper-tear-curtain", "dur: .8");
  document.body.append(late);
}, 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
