<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tint-hover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { padding: 48px 20px; }
  .demo-btn { display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 16px; border: 1px solid var(--kf-line); border-radius: var(--kf-radius-sm); background: var(--kf-surface); color: var(--kf-ink); cursor: pointer; }
  .demo-card { padding: 20px; border: 1px solid var(--kf-line); border-radius: var(--kf-radius-md); background: var(--kf-surface); }
  .demo-spacer { height: 90vh; display: grid; place-items: center; color: var(--kf-dim); }
  .menu { width: 240px; padding: 8px 0; border: 1px solid var(--kf-line); border-radius: var(--kf-radius-sm); background: var(--kf-surface); color: var(--kf-ink-soft); }
  .menu button { display: flex; width: 100%; min-height: 40px; align-items: center; padding: 4px 16px; border: 0; background: none; cursor: pointer; text-align: left; }
  .row { display: flex; gap: 8px; margin-top: 24px; }
  .row button { height: 44px; padding: 0 20px; border: 1px solid currentColor; border-radius: var(--kf-radius-sm); background: none; color: var(--kf-ink); cursor: pointer; }
</style>
</head>
<body>
<p class="demo-hint"><b>tint-hover</b> — Hover over the menu rows and the outlined button.</p>
<section class="demo"><div class="menu"><button data-fx="tint-hover">Create New</button><button data-fx="tint-hover">Export</button><button data-fx="tint-hover">Clear all</button></div>
<div class="row"><button data-fx="tint-hover">Cancel</button><button data-fx="tint-hover">Confirm</button></div></section>

</body>
</html>
