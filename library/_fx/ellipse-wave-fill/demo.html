<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ellipse-wave-fill — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { display: flex; flex-wrap: wrap; gap: 24px; align-items: center; padding: 64px 20px; }
  .btn { padding: 18px 32px; border: 1px solid var(--kf-line); border-radius: 18px; background: none; color: var(--kf-ink); font: 500 13px/1 var(--kf-font-sans); letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer; }
</style>
</head>
<body>
<p class="demo-hint"><b>ellipse-wave-fill</b> — Hover over the button — round water rises from below and fills it. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<div class="demo">
  <button class="btn" type="button" data-fx="ellipse-wave-fill"><span>Enter With Sound</span></button>
  <button class="btn" type="button" data-fx="ellipse-wave-fill" data-demo-remove><span>Removed</span></button>
  <a class="btn" href="#" data-fx="ellipse-wave-fill" style="--fx-wave-bg: var(--kf-accent); --fx-wave-fg: var(--kf-on-accent)"><span>Accent Wave</span></a>
  <template data-demo-late><button class="btn" type="button" data-fx="ellipse-wave-fill"><span>Late Button</span></button></template>
</div>
<script src="../fx-core.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
