<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>skew-text-roll — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { display: flex; flex-wrap: wrap; gap: 32px; align-items: center; padding: 64px 20px; }
  .nav a { font: 500 18px/1.2 var(--kf-font-sans); color: var(--kf-dim); transition: color 450ms cubic-bezier(0.51, 0.01, 0.2, 1); }
  .nav a:hover { color: var(--kf-ink); }
  .btn { padding: 14px 26px; border: 1px solid var(--kf-line); border-radius: var(--kf-radius-sm); font: 500 15px/1.2 var(--kf-font-sans); color: var(--kf-ink); }
</style>
</head>
<body>
<p class="demo-hint"><b>skew-text-roll</b> — Hover over a link or button — the text tilts out and the same text stands straight from below. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<div class="demo nav">
  <a href="#" data-fx="skew-text-roll"><span data-fx-part="label">Main Service</span></a>
  <a href="#" data-fx="skew-text-roll" data-demo-remove>Products</a>
  <a href="#" data-fx="skew-text-roll">Careers</a>
  <template data-demo-late><a href="#" data-fx="skew-text-roll">Late Link</a></template>
  <a class="btn" href="#" data-fx="skew-text-roll" data-fx-skew-text-roll="look: button"><span data-fx-part="label">Contact</span></a>
  <a href="#" data-fx="skew-text-roll" data-fx-skew-text-roll="look: tilt"><span data-fx-part="label">ARCHIVES</span></a>
</div>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
