<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mark-pass-tone — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { position: relative; background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.6 var(--kf-font-sans); }
  body[data-tone="1"], body[data-tone="2"] { color: var(--kf-contrast-ink); }
  body[data-tone="3"] { background: var(--kf-accent-soft); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); color: var(--kf-ink); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-veil { position: absolute; inset: 0; z-index: -1; background: var(--kf-contrast-bg); }
  .demo-sec { min-height: 110vh; padding: 20vh 8vw; font-size: 28px; }
</style>
</head>
<body data-fx="mark-pass-tone">
<p class="demo-hint"><b>mark-pass-tone</b> — Scroll down slowly. After passing the second section header the page darkens, and brightens again at the fourth section. Reversed on the way up.</p>
<div class="demo-veil" data-fx-part="veil" data-key="1 2"></div>
<section class="demo-sec">First Section — light background</section>
<i data-fx-part="mark" data-key="1"></i>
<section class="demo-sec">Second sheet — the dark cover turns on</section>
<i data-fx-part="mark" data-key="2"></i>
<section class="demo-sec">Third slide — still dark</section>
<i data-fx-part="mark" data-key="3"></i>
<section class="demo-sec">Fourth section — pale accent background</section>
<script>
// Late arrivals and removals — after 1 second add one more cover, and after 2.5 seconds detach the part name and reattach it
(() => {
  setTimeout(() => {
    const m = document.createElement("i");
    m.dataset.fxPart = "mark"; m.dataset.key = "1";
    document.querySelector(".demo-sec").after(m);
  }, 1000);
  setTimeout(() => { document.body.dataset.fx = ""; setTimeout(() => { document.body.dataset.fx = "mark-pass-tone"; }, 300); }, 2500);
  document.querySelector(".demo-hint").append(" · After 1s another cover comes in, and after 2.5s a part is briefly detached and reattached.");
})();
</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
