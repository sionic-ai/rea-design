<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fade-cycle-viewer — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { margin: 0; background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-show { position: relative; height: 60vh; min-height: 360px; display: flex; flex-direction: column; border-bottom: 1px solid var(--kf-line); transition: background-color 0.3s cubic-bezier(0, 0, 0.2, 1), color 0.3s; }
  .demo-show[data-viewer] { background: var(--kf-contrast-bg); color: var(--kf-contrast-ink); }
  .demo-show [data-fx-part="stage"] { flex: 1; display: flex; align-items: center; justify-content: center; }
  .demo-show [data-fx-part="item"] { width: 40%; aspect-ratio: 1; border-radius: 50%; background: var(--kf-accent); margin: 0; }
  .demo-show [data-fx-part="item"]:nth-child(2) { border-radius: 24%; background: var(--kf-ink); }
  .demo-show [data-fx-part="item"]:nth-child(3) { border-radius: 0; background: var(--kf-accent-soft); }
  .demo-bar { display: none; flex-direction: column; align-items: center; gap: 8px; padding: 12px; font: 500 11px/1.4 var(--kf-font-sans); text-transform: uppercase; letter-spacing: 0.025em; }
  .demo-show[data-viewer] .demo-bar { display: flex; }
  .demo-show [data-fx-part="close"] { background: none; border: 0; color: inherit; font: inherit; text-transform: inherit; }
</style>
</head>
<body>
<p class="demo-hint"><b>fade-cycle-viewer</b> — The picture turns off and on every 4 seconds. Click the picture for view mode (click left/right half · arrow keys to move, close with Esc · Close).</p>
<section class="demo-show" data-fx="fade-cycle-viewer" data-demo-src>
  <div data-fx-part="stage">
    <figure data-fx-part="item" data-title="Item One"></figure>
    <figure data-fx-part="item" data-title="Item Two"></figure>
    <figure data-fx-part="item" data-title="Item Three"></figure>
  </div>
  <div class="demo-bar"><p data-fx-part="title"></p><div data-fx-part="dots"></div><button type="button" data-fx-part="close">Close</button></div>
</section>
<script>
// Late and removed plates — checks that fx-core also attaches to a plate that arrives after 1 second and detaches the one removed after 2.5 seconds
(() => {
  const src = document.querySelector("[data-demo-src]");
  const html = src.outerHTML;
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; el.style.height = "240px"; el.style.minHeight = "0"; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => src.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s one more panel comes in, and after 2.5s one leaves.");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/CustomEase.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
