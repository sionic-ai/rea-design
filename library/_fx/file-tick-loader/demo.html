<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>file-tick-loader — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 500 14px/1 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 10; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .loader { display: grid; gap: 20px; padding: 60px 40px; max-width: 760px; }
  .loader [data-fx-part="item"], .loader [data-fx-part="info"] { color: var(--kf-dim); }
  #again { margin: 0 40px; }
</style>
</head>
<body>
<p class="demo-hint"><b>file-tick-loader</b> — On open, bars fill along with file names, and when full they fold up and vanish. Repeat with ”Again”. <span style="color:var(--kf-dim)">(After 1s one more loader comes in, and after 2.5s one drops out)</span></p>
<section class="loader" id="one" data-fx="file-tick-loader" data-fx-file-tick-loader="files: work_01/preview.mp4, work_02/preview.mp4, work_03/preview.mp4, work_04/preview.mp4; min: 1.5">
  <p data-fx-part="title">Loading media</p>
  <div data-fx-part="bar"></div>
  <p data-fx-part="item"></p>
  <p data-fx-part="info">Your one-line description under the loader here</p>
</section>
<section class="loader" data-demo-remove data-fx="file-tick-loader" data-fx-file-tick-loader="files: a.mp4, b.mp4"><div data-fx-part="bar"></div></section>
<template data-demo-late><section class="loader" data-fx="file-tick-loader" data-fx-file-tick-loader="files: late_01.mp4, late_02.mp4; dur: .5"><p data-fx-part="title">Late-arriving loader</p><div data-fx-part="bar"></div><p data-fx-part="item"></p></section></template>
<button id="again" type="button">Again</button>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/CustomEase.min.js"></script>
<script>gsap.registerPlugin(CustomEase);</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
document.getElementById("again").addEventListener("click", () => { const el = document.getElementById("one"); gsap.set(el, { clearProps: "all" }); el.removeAttribute("data-fx"); requestAnimationFrame(() => el.setAttribute("data-fx", "file-tick-loader")); });
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
