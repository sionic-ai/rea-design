<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pin-blur-cover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo-spacer { height: 60vh; display: grid; place-items: center; color: var(--kf-dim); }
  .stack { position: relative; overflow: hidden; }
  .stack > section:nth-child(1) { z-index: 1; } .stack > section:nth-child(2) { z-index: 2; } .stack > section:nth-child(3) { z-index: 3; }
  .pic { position: absolute; inset: 0; background: linear-gradient(135deg, var(--kf-accent), var(--kf-raised)); }
  .stack > section:nth-child(2) .pic { background: linear-gradient(45deg, var(--kf-raised), var(--kf-accent)); }
  .content { position: absolute; inset: 0 auto auto 5%; z-index: 3; padding-top: 100lvh; }
  .card { width: min(380px, 80vw); padding: 24px; background: var(--kf-surface); border-radius: var(--kf-radius-md); }
</style>
</head>
<body>
<p class="demo-hint"><b>pin-blur-cover</b> — Scroll down and the photo stays pinned while it blurs, and the next one covers it from below. <span style="color:var(--kf-dim)">(After 1s one more section comes in, and one leaves 2.5s later)</span></p>
<div class="demo-spacer">Scroll down</div>
<div class="stack">
  <section data-fx="pin-blur-cover"><div data-fx-part="image"><div data-fx-part="overlay"></div><div data-fx-part="blur"></div><div class="pic"></div></div><div class="content"><article class="card" data-fx-part="card">Feature 01 — Your feature line here</article></div></section>
  <section data-demo-remove data-fx="pin-blur-cover" data-fx-pin-blur-cover="scrub: true"><div data-fx-part="image"><div data-fx-part="blur"></div><div class="pic"></div></div><div class="content"><article class="card" data-fx-part="card">Dropped Section</article></div></section>
  <template data-demo-late><section data-fx="pin-blur-cover"><div data-fx-part="image"><div data-fx-part="overlay"></div><div data-fx-part="blur"></div><div class="pic"></div></div><div class="content"><article class="card" data-fx-part="card">Feature 03 — The late-arriving section</article></div></section></template>
</div>
<div class="demo-spacer"></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); window.ScrollTrigger?.refresh(); }, 2500);
</script>
</body>
</html>
