<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>edge-hover-scroll — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.6 var(--kf-font-sans); }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .strip { display: flex; margin: 48px 0; scrollbar-width: none; }
  .strip a { flex: none; width: 120px; height: 240px; padding: 14px; border: 6px solid var(--kf-bg); background: var(--kf-surface); text-align: center; font: 600 20px/1 var(--kf-font-display); }
</style>
</head>
<body>
<p class="demo-hint"><b>edge-hover-scroll</b> — Move the mouse to the left or right end of the strip. The nearer the end, the faster it flows, and in the middle it stops. <span style="color:var(--kf-dim)">(After 1s one more band comes in, and one leaves 2.5s later)</span></p>
<div class="strip" data-fx="edge-hover-scroll"><a>01</a><a>02</a><a>03</a><a>04</a><a>05</a><a>06</a><a>07</a><a>08</a><a>09</a><a>10</a><a>11</a><a>12</a><a>13</a><a>14</a><a>15</a><a>16</a></div>
<div class="strip" data-fx="edge-hover-scroll" data-fx-edge-hover-scroll="zone: .2; max: 10" data-demo-remove><a>A</a><a>B</a><a>C</a><a>D</a><a>E</a><a>F</a><a>G</a><a>H</a><a>I</a><a>J</a><a>K</a><a>L</a><a>M</a><a>N</a></div>
<template data-demo-late><div class="strip" data-fx="edge-hover-scroll" data-fx-edge-hover-scroll="gain: .1"><a>Late</a><a>1</a><a>2</a><a>3</a><a>4</a><a>5</a><a>6</a><a>7</a><a>8</a><a>9</a><a>10</a><a>11</a><a>12</a><a>13</a></div></template>
<div class="strip" data-fx="edge-hover-scroll"></div>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
