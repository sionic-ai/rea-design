<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>float-bob — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo-spacer { height: 90vh; display: grid; place-items: center; color: var(--kf-dim); }
  .fb { display: flex; gap: 48px; align-items: center; justify-content: center; padding: 60px; }
  .fb i { display: block; border-radius: 50%; }
  .fb .a { width: 120px; aspect-ratio: 1; background: var(--kf-accent); }
  .fb .b { width: 60px; aspect-ratio: 1; border: 1px solid var(--kf-ink); }
  .fb .c { width: 160px; aspect-ratio: 1; background: var(--kf-surface); }
</style>
</head>
<body>
<p class="demo-hint"><b>float-bob</b> — Round ornaments float up and down, each at its own tempo (3, 4, 5s). <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<div class="demo-spacer">Scroll down</div>
<div class="fb"><i class="a" data-demo-remove data-fx="float-bob" style="--fx-dur: 5s"></i><i class="b" data-fx="float-bob" data-fx-float-bob="look: reverse" style="--fx-dur: 3s"></i><i class="c" data-fx="float-bob"></i></div>
<div class="fb"><i class="a" data-fx="float-bob" style="--fx-dur: 5s"></i><i class="b" data-fx="float-bob" data-fx-float-bob="look: reverse" style="--fx-dur: 3s"></i><i class="c" data-fx="float-bob"></i></div>
<div class="fb"><i class="a" data-fx="float-bob" data-fx-float-bob="look: up" style="--fx-dur: 2s; --fx-delay: -.4s; --fx-amp: 12px"></i><i class="b" data-fx="float-bob" data-fx-float-bob="look: up" style="--fx-dur: 1.6s; --fx-delay: -1s; --fx-amp: 16px"></i><i class="c" data-fx="float-bob" data-fx-float-bob="look: up" style="--fx-dur: 2.3s; --fx-delay: -.2s; --fx-amp: 10px"></i></div>
<template data-demo-late><div class="fb"><i class="a" data-fx="float-bob" style="--fx-dur: 5s"></i><i class="b" data-fx="float-bob" data-fx-float-bob="look: reverse" style="--fx-dur: 3s"></i><i class="c" data-fx="float-bob"></i></div></template>
<div class="demo-spacer"></div>

<script src="../fx-core.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); window.ScrollTrigger?.refresh(); }, 2500);
</script>
</body>
</html>
