<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>shard-image-trail — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { margin: 0; background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { height: 75vh; margin: 20px; overflow: hidden; border-radius: var(--kf-radius-md); background: var(--kf-contrast-bg); color: var(--kf-contrast-ink); display: grid; place-items: center; }
  .demo h2 { position: relative; z-index: 999; margin: 0; font: 400 48px/1.1 var(--kf-font-display); pointer-events: none; }
  .demo [data-fx-part="inner"] { background: linear-gradient(135deg, var(--kf-accent), var(--kf-accent-soft)); }
  .demo [data-fx-part="item"]:nth-child(2n) [data-fx-part="inner"] { background: linear-gradient(135deg, var(--kf-surface), var(--kf-dim)); }
</style>
</head>
<body>
<p class="demo-hint"><b>shard-image-trail</b> — Move the mouse over the black panel. A photo is placed every 80px and scatters into 3×3 pieces (768px and up).</p>
<section class="demo" data-fx="shard-image-trail">
  <h2>Your sentence here</h2>
  <div data-fx-part="item"><div data-fx-part="inner"></div></div>
  <div data-fx-part="item"><div data-fx-part="inner"></div></div>
  <div data-fx-part="item"><div data-fx-part="inner"></div></div>
  <div data-fx-part="item"><div data-fx-part="inner"></div></div>
  <div data-fx-part="item"><div data-fx-part="inner"></div></div>
  <div data-fx-part="item"><div data-fx-part="inner"></div></div>
</section>
<script>
(() => {
  const src = document.querySelector('[data-fx~="shard-image-trail"]');
  if (!src) return;
  const html = src.outerHTML;
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => src.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  const empty = document.createElement("section");
  empty.setAttribute("data-fx", "shard-image-trail");
  document.body.append(empty);
  document.querySelector(".demo-hint").append(" · After 1s another identical panel comes in, and after 2.5s one drops out (detach).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
