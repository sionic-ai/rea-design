<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>split-stroke-wipe — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { display: grid; gap: 40px; padding: 48px 20px; }
  .demo svg { width: min(560px, 90vw); fill: var(--kf-ink); }
  .spacer { height: 100vh; display: grid; place-items: center; color: var(--kf-dim); }
  button { justify-self: start; padding: 8px 14px; border: 1px solid var(--kf-line); background: var(--kf-surface); cursor: pointer; }
</style>
</head>
<body>
<p class="demo-hint"><b>split-stroke-wipe</b> — As soon as it opens, the wordmark above is wiped in from both sides. Replay it with the button, scroll down and it plays once more when the second wordmark appears. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<section class="demo">
  <svg viewBox="0 0 543 216" data-fx="split-stroke-wipe" data-demo-mark aria-label="Wordmark">
    <g data-fx-part="a"><rect x="0" y="0" width="20" height="216"/><rect x="170" y="0" width="20" height="216"/><circle cx="267" cy="28" r="26"/><rect x="353" y="0" width="20" height="216"/><rect x="523" y="0" width="20" height="216"/></g>
    <g data-fx-part="b"><path d="M0 0h66l124 216h-66z"/><rect x="238" y="70" width="58" height="146"/><path d="M353 0h66l124 216h-66z"/></g>
  </svg>
  <button type="button" data-demo-replay>Play again</button>
  <svg viewBox="0 0 543 216" data-fx="split-stroke-wipe" data-demo-remove><g data-fx-part="b"><rect width="543" height="216"/></g></svg>
  <svg viewBox="0 0 100 40" data-fx="split-stroke-wipe"></svg>
</section>
<div class="spacer">↓</div>
<section class="demo">
  <svg viewBox="0 0 543 216" data-fx="split-stroke-wipe" data-fx-split-stroke-wipe="start: scroll">
    <g data-fx-part="a"><rect x="0" y="0" width="20" height="216"/><rect x="170" y="0" width="20" height="216"/><circle cx="267" cy="28" r="26"/><rect x="353" y="0" width="20" height="216"/><rect x="523" y="0" width="20" height="216"/></g>
    <g data-fx-part="b"><path d="M0 0h66l124 216h-66z"/><rect x="238" y="70" width="58" height="146"/><path d="M353 0h66l124 216h-66z"/></g>
  </svg>
  <template data-demo-late><svg viewBox="0 0 543 216" data-fx="split-stroke-wipe" data-fx-split-stroke-wipe="dur: .8"><g data-fx-part="a"><circle cx="271" cy="108" r="100"/></g></svg></template>
</section>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
document.querySelector("[data-demo-replay]").addEventListener("click", () => {
  const m = document.querySelector("[data-demo-mark]");
  m.removeAttribute("data-fx");
  requestAnimationFrame(() => m.setAttribute("data-fx", "split-stroke-wipe"));
});
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
