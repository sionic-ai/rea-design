<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cursor-swing-card — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo-sec { position: relative; min-height: 140vh; padding: 48px 20px; border-top: 1px solid var(--kf-line); }
  .demo-sec .wf-img { height: 100%; }
  .demo-spacer { height: 40vh; display: grid; place-items: center; color: var(--kf-dim); }
</style>
</head>
<body>
<p class="demo-hint"><b>cursor-swing-card</b> Scroll down to this section and move the mouse. The card follows with a lag and tilts, and the photo changes every 300px (width 1024+ with mouse).</p>
<div class="demo-spacer">Scroll down</div>
<section class="demo-sec" data-fx="cursor-swing-card">
  <div data-fx-part="card"><div data-fx-part="media">
    <div class="wf-img" data-fx-part="img" data-label="Photo 1 · Vertical 3:4"></div>
    <div class="wf-img" data-fx-part="img" data-label="Photo 2 · Vertical 3:4"></div>
    <div class="wf-img" data-fx-part="img" data-label="Photo 3 · Portrait 3:4"></div>
  </div></div>
  <p>Your section text goes here.</p>
</section>
<div class="demo-spacer"></div>
<script>
(() => {
  const src = document.querySelector('[data-fx~="cursor-swing-card"]');
  if (!src) return;
  const html = src.outerHTML.replace(/\sid="[^"]*"/g, "");
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => src.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical one comes in, and after 2.5s one drops out (detach).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
