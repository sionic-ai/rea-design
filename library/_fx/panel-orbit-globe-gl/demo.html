<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>panel-orbit-globe-gl — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { margin: 0; background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: relative; z-index: 2; margin: 0; padding: 12px 20px; border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); background: var(--kf-surface); }
  .stage { position: relative; height: 80vh; }
  .demo-row { position: relative; z-index: 2; display: flex; gap: 8px; padding: 12px 20px; }
  .demo-row button { padding: 6px 14px; border: 1px solid var(--kf-line); border-radius: 999px; background: var(--kf-surface); color: var(--kf-ink); font: inherit; cursor: pointer; }
  .small { position: fixed; right: 20px; bottom: 20px; width: 260px; height: 180px; }
</style>
</head>
<body>
<p class="demo-hint"><b>panel-orbit-globe-gl</b> — Move the mouse over the panel. The photo panel follows with a lag, and the buttons below keep only the globe or restore it.</p>
<div class="stage" data-fx="panel-orbit-globe-gl" id="stage">
  <span data-fx-part="item" data-tone="0"></span><span data-fx-part="item" data-tone="2"></span><span data-fx-part="item" data-tone="4"></span>
</div>
<div class="demo-row"><button type="button" data-send="fx:globe">Earth only</button><button type="button" data-send="fx:all">Show All</button></div>
<script>
// Late arrivals and removals — after 1s one more small stage is added, and after 2.5s it is removed to check detaching
(() => {
  document.querySelectorAll("[data-send]").forEach((b) => b.addEventListener("click", () => document.getElementById("stage").dispatchEvent(new CustomEvent(b.dataset.send))));
  setTimeout(() => { const el = document.createElement("div"); el.className = "small"; el.dataset.fx = "panel-orbit-globe-gl"; el.setAttribute("data-fx-panel-orbit-globe-gl", "count: 36; intro-dur: 1"); document.body.append(el); setTimeout(() => el.remove(), 1500); }, 1000);
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="three-global.js"></script>
<script src="../../_vendor/three@0.160.0/build/three.cjs"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
