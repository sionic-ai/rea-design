<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pill-swap-hover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 500 15px/1 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 10; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  nav { display: flex; gap: 48px; padding: 60px 40px; }
  nav a { color: inherit; text-decoration: none; }
  .paper { background: var(--kf-contrast-bg); color: var(--kf-contrast-ink); }
</style>
</head>
<body>
<p class="demo-hint"><b>pill-swap-hover</b> — Hover over the menu. Menu 2 is the current page, so it stays flipped. <span style="color:var(--kf-dim)">(After 1s one more menu item comes in, and after 2.5s one drops out)</span></p>
<nav>
  <a href="#" data-fx="pill-swap-hover"><span data-fx-part="label">Menu 1</span></a>
  <a href="#" data-fx="pill-swap-hover" aria-current="page"><span data-fx-part="label">Menu 2</span></a>
  <a href="#" data-demo-remove data-fx="pill-swap-hover"><span data-fx-part="label">Menu 3</span></a>
  <template data-demo-late><a href="#" data-fx="pill-swap-hover" data-fx-pill-swap-hover="dur: .5"><span data-fx-part="label">Late Menu</span></a></template>
</nav>
<nav class="paper"><a href="#" data-fx="pill-swap-hover" data-fx-pill-swap-hover="look: dark"><span data-fx-part="label">hello@example.com</span></a></nav>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/CustomEase.min.js"></script>
<script>gsap.registerPlugin(CustomEase);</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
