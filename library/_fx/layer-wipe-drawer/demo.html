<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>layer-wipe-drawer — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { padding: 40px 20px; display: flex; gap: 16px; }
  .btn { padding: 12px 22px; border-radius: var(--kf-radius-pill); border: 1.5px solid var(--kf-ink); background: none; color: var(--kf-ink); font: 700 14px/1 var(--kf-font-sans); cursor: pointer; }
  [data-fx-part="inner"] { padding: 24px; display: flex; flex-direction: column; box-sizing: border-box; }
  [data-fx-part="inner"] nav { margin: auto 0; display: flex; flex-direction: column; gap: 8px; }
  [data-fx-part="line"] { font: 800 clamp(2rem, 6vw, 4.6rem)/1.04 var(--kf-font-display); text-decoration: none; color: inherit; text-transform: uppercase; }
  [data-fx-part="close"] { align-self: flex-start; background: none; border: 0; color: inherit; font: 800 16px/1 var(--kf-font-display); cursor: pointer; }
</style>
</head>
<body>
<p class="demo-hint"><b>layer-wipe-drawer</b> — Press ‹Menu› — three color curtains cover in turn and the menu lines rise up. Close with the backdrop·close button·Esc. After 1s one more drawer comes in and one drops out.</p>
<section class="demo" id="demo">
  <div data-fx="layer-wipe-drawer">
    <button class="btn" data-fx-part="open" type="button">Menu</button>
    <div data-fx-part="tint"></div>
    <div data-fx-part="panel"><div data-fx-part="inner"><button data-fx-part="close" type="button">Close ✕</button>
      <nav><a data-fx-part="line" href="#"><span>Projects</span></a><a data-fx-part="line" href="#"><span>Services</span></a><a data-fx-part="line" href="#"><span>Contact</span></a></nav>
      <div data-fx-part="foot">hello@studio.name</div></div></div>
  </div>
  <div data-fx="layer-wipe-drawer" id="gone"><button class="btn" data-fx-part="open" type="button">Drawer to Be Removed</button><div data-fx-part="panel"><div data-fx-part="inner"></div></div></div>
  <div data-fx="layer-wipe-drawer"><button class="btn" type="button">Drawer without panel</button></div>
</section>
<script>
  setTimeout(() => {
    const d = document.createElement("div");
    d.dataset.fx = "layer-wipe-drawer";
    d.innerHTML = '<button class="btn" data-fx-part="open" type="button">Late-arrived Drawer</button><div data-fx-part="tint"></div><div data-fx-part="panel" style="--fx-width: 40vw"><div data-fx-part="inner"><button data-fx-part="close" type="button">Close ✕</button><nav><a data-fx-part="line" href="#"><span>Menu 1</span></a></nav></div></div>';
    document.getElementById("demo").append(d);
    document.getElementById("gone")?.remove();
  }, 1000);
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
