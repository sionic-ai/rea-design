<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>scatter-orbit-zoom — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .stage { height: 80vh; background: var(--kf-surface); }
  .stage + .stage { margin-top: 20px; }
  [data-fx-part="grid"] > div { background: var(--kf-raised); border: 1px solid var(--kf-line); }
  .ctl { position: absolute; right: 24px; bottom: 24px; z-index: 20; width: 240px; color: var(--kf-on-accent); }
  .ctl p { display: flex; align-items: center; justify-content: space-between; }
  .ctl button { width: 32px; height: 32px; border: 0; background: var(--kf-ink); color: var(--kf-bg); }
  [data-fx-part="label"] { position: absolute; right: 24px; bottom: 90px; z-index: 20; padding: 4px 10px; background: var(--kf-ink); color: var(--kf-bg); }
</style>
</head>
<body>
<p class="demo-hint"><b>scatter-orbit-zoom</b> — Scattered chunks rotate every 5s and the middle one expands to fill the space. Press the prev/next buttons and the bar. <span style="color:var(--kf-dim)">(After 1s one more panel comes in, and one leaves 2.5s later)</span></p>
<template id="tpl"><section class="stage" data-fx="scatter-orbit-zoom">
  <div data-fx-part="block"><div data-fx-part="grid"><div style="grid-area:1/1/3/2"></div><div></div><div></div></div></div>
  <div data-fx-part="block" style="--fx-color:var(--kf-ink)"><div data-fx-part="grid"><div style="grid-area:1/1/2/3"></div><div></div><div></div></div></div>
  <div data-fx-part="block"><div data-fx-part="grid"><div style="grid-area:1/1/2/3"></div><div></div><div></div></div></div>
  <div data-fx-part="block" style="--fx-color:var(--kf-ink-soft)"><div data-fx-part="grid"><div style="grid-area:1/1/2/3"></div><div></div><div></div></div></div>
  <div data-fx-part="block"><div data-fx-part="grid"><div style="grid-area:1/1/2/3"></div><div></div><div></div></div></div>
  <div data-fx-part="block" style="--fx-color:var(--kf-dim)"><div data-fx-part="grid"><div style="grid-area:1/1/2/3"></div><div></div><div></div></div></div>
  <a data-fx-part="label">Name 1</a><a data-fx-part="label">Name 2</a><a data-fx-part="label">Name 3</a><a data-fx-part="label">Name 4</a><a data-fx-part="label">Name 5</a><a data-fx-part="label">Name 6</a>
  <div class="ctl"><p><button type="button" data-fx-part="prev" aria-label="Previous">‹</button><span><span data-fx-part="count"></span> — <span data-fx-part="total"></span></span><button type="button" data-fx-part="next" aria-label="Next">›</button></p><div data-fx-part="bar"></div></div>
</section></template>
<div id="a" data-demo-remove></div><div id="b"></div><div id="late"></div>
<section class="stage" data-fx="scatter-orbit-zoom"></section>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/CustomEase.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
const tpl = document.getElementById("tpl");
document.getElementById("a").append(tpl.content.cloneNode(true));
document.getElementById("b").append(tpl.content.cloneNode(true));
// Checks whether it also applies to late-arriving elements and whether removed elements are detached — insert a panel after 1 second and remove [data-demo-remove] after 2.5 seconds
setTimeout(() => document.getElementById("late").append(tpl.content.cloneNode(true)), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
