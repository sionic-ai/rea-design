<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>press-sink — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .front { min-height: 120vh; padding: 80px 40px; background: var(--kf-raised); border-radius: var(--kf-radius-md); }
  .front h2 { font: 400 72px/1 var(--kf-font-display); }
  .cover { position: relative; z-index: 2; min-height: 90vh; padding: 80px 40px; border-radius: var(--kf-radius-lg) var(--kf-radius-lg) 0 0; background: var(--kf-contrast-bg); color: var(--kf-contrast-ink); }
</style>
</head>
<body>
<p class="demo-hint"><b>press-sink</b> — Scroll down — as the dark panel rises, the previous panel drops 150px, shrinks to .9x and is covered in black.</p>
<div data-fx="press-sink" data-demo-remove><div data-fx-part="content" class="front"><h2>Board to erase</h2></div></div>
<div data-fx="press-sink"><div data-fx-part="content" class="front"><h2>Previous section</h2><p>Your two body lines here.</p></div></div>
<section class="cover"><h2>Overlay Section</h2></section>
<template data-demo-late><div data-fx="press-sink" data-fx-press-sink="drop: 80; min: .95"><div data-fx-part="content" class="front"><h2>Late-entering Panel</h2></div></div><section class="cover"><h2>Covering Section 2</h2></section></template>
<div data-fx="press-sink"></div>
<div style="height: 60vh"></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); }, 2500);
</script>
</body>
</html>
