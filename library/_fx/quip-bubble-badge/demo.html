<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>quip-bubble-badge — Badge speech bubble</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { min-height: 100vh; padding: 40px; }
  .demo-badge { position: fixed; right: 20px; bottom: 70px; display: flex; align-items: flex-start; gap: 16px; }
  .demo-bubble { padding: 14px 16px; max-width: 170px; border: 1px solid var(--kf-ink); border-radius: var(--kf-radius-sm); background: var(--kf-surface); font-size: 12px; }
  .demo-icon { width: 75px; height: 75px; border: 2px solid var(--kf-accent); border-radius: 50%; background: var(--kf-surface); color: var(--kf-accent); font-weight: 700; }
</style>
</head>
<body>
<p>Hover over or press the round badge at the bottom right — one speech bubble appears at random for 4 seconds and then disappears.</p>
<div class="demo-badge" data-fx="quip-bubble-badge">
  <div>
    <p class="demo-bubble" data-fx-part="item">Dressing up with joy even on rainy days</p>
    <p class="demo-bubble" data-fx-part="item">For an exciting summer!</p>
    <p class="demo-bubble" data-fx-part="item">Our first fishing trip!</p>
  </div>
  <button class="demo-icon" type="button" data-fx-part="trigger">Badge</button>
</div>
<div data-fx="quip-bubble-badge" data-demo-remove><p data-fx-part="item">Removable speech bubble</p><button type="button" data-fx-part="trigger">Badge to Be Removed</button></div>
<template data-demo-late><div data-fx="quip-bubble-badge" data-fx-quip-bubble-badge="hold: 2000; order: 1"><p data-fx-part="item">Late-arriving speech bubble 1</p><p data-fx-part="item">Late-arriving speech bubble 2</p><button type="button" data-fx-part="trigger">Late-arriving badge</button></div></template>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
