<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>wave-rise-text — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { margin: 60px auto; text-align: center; font: 600 44px/1.2 var(--kf-font-display); }
  button { margin: 0 auto; display: block; padding: 8px 14px; border: 1px solid var(--kf-line); background: var(--kf-surface); color: var(--kf-ink); font: inherit; cursor: pointer; }
</style>
</head>
<body>
<p class="demo-hint"><b>wave-rise-text</b> — On open, letters rise in a wave from the center outward. Press the button and the text changes with the same wave. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<h1 class="demo" data-fx="wave-rise-text" data-fx-wave-rise-text="when: load" data-main><span data-fx-part="line">Your big one-line title here</span><span data-fx-part="line">Second line spreading from the center</span></h1>
<button type="button" data-swap>Swap post</button>
<p class="demo" data-fx="wave-rise-text" data-demo-remove>Line to be removed soon</p>
<template data-demo-late><p class="demo" data-fx="wave-rise-text" data-fx-wave-rise-text="dur: 0.9; spread: 0.8; delay: 0">Late-arriving line · slow wave</p></template>
<p class="demo" data-fx="wave-rise-text"></p>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
let n = 0;
document.querySelector("[data-swap]").addEventListener("click", () => document.querySelector("[data-main]").dispatchEvent(new CustomEvent("fx:swap", { detail: { text: ["Newly changed title", "A slightly longer title, changed again", "Third Title"][n++ % 3] } })));
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((x) => x.remove()), 2500);
</script>
</body>
</html>
