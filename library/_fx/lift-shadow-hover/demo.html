<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lift-shadow-hover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { margin: 0; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .row { display: flex; gap: 40px; padding: 60px 40px; flex-wrap: wrap; }
  .card { position: relative; width: 300px; border-radius: 8px; overflow: hidden; background: var(--kf-surface); }
  .card .wf-img { aspect-ratio: 4 / 3; border: 0; }
  .card a { display: block; padding: 20px 24px; font-weight: 500; }
  .card a::before { content: ""; position: absolute; inset: 0; }
</style>
</head>
<body>
<p class="demo-hint"><b>lift-shadow-hover</b> — Hover over a card. The second card is the “link” type (only on hover over a link). <span style="color:var(--kf-dim)">(One more card comes in after 1s, and one drops out after 1.5s)</span></p>
<div class="row" id="row">
  <article class="card" data-fx="lift-shadow-hover"><div class="wf-img" data-label="Photo 4:3"></div><a href="#a">Find a Lodging</a></article>
  <article class="card" data-fx="lift-shadow-hover" data-fx-lift-shadow-hover="look: link"><div class="wf-img" data-label="link Type"></div><a href="#b">Find experiences</a></article>
  <article class="card" id="gone" data-fx="lift-shadow-hover" style="--fx-scale: 1.05"><div class="wf-img" data-label="Erased soon · 1.05"></div><a href="#c">Being removed soon</a></article>
</div>
<script src="../fx-core.js"></script>
<script>
  setTimeout(() => {
    const a = document.createElement("article");
    a.className = "card"; a.dataset.fx = "lift-shadow-hover";
    a.innerHTML = '<div class="wf-img" data-label="Late-arrived card"></div><a href="#d">Late-arrived card</a>';
    document.getElementById("row").append(a);
  }, 1000);
  setTimeout(() => document.getElementById("gone").remove(), 1500);
</script>
</body>
</html>
