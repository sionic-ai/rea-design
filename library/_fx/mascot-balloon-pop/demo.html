<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mascot-balloon-pop — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .pad { height: 90vh; display: grid; place-items: center; color: var(--kf-dim); }
  .card { position: relative; width: 260px; height: 300px; margin: 40px auto; border: 1px solid var(--kf-line); border-radius: var(--kf-radius-md); background: var(--kf-surface); }
  .card [data-fx-part="person"] { position: absolute; left: 20px; bottom: 0; width: 150px; height: 220px; }
  .card [data-fx-part="person"] > .wf-img { height: 100%; }
  .card [data-fx-part="balloon"] { position: absolute; left: 150px; top: 40px; padding: 6px 12px; border: 2px solid var(--kf-ink); border-radius: 999px; background: var(--kf-surface); font-weight: 700; font-size: 12px; }
</style>
</head>
<body>
<p class="demo-hint"><b>mascot-balloon-pop</b> — Scroll down. When the cell appears, the figure rises up and a speech bubble pops out. <span style="color:var(--kf-dim)">(After 1s one more cell comes in, and one leaves 2.5s later)</span></p>
<div class="card" data-fx="mascot-balloon-pop" data-fx-mascot-balloon-pop="on: load"><div data-fx-part="person"><div class="wf-img" data-label="Staff cutout · Upper body"></div></div><p data-fx-part="balloon">Keep going today too!</p></div>
<div class="pad">Scroll ↓</div>
<div class="card" data-fx="mascot-balloon-pop"><div data-fx-part="person"><div class="wf-img" data-label="Staff cutout · full body"></div></div><p data-fx-part="balloon">Look here!</p></div>
<div class="card" data-demo-remove data-fx="mascot-balloon-pop"><div data-fx-part="person"><div class="wf-img" data-label="Cell to Be Removed"></div></div></div>
<template data-demo-late><div class="card" data-fx="mascot-balloon-pop"><p data-fx-part="balloon">Late-arriving speech bubble</p></div></template>
<div class="pad">Footer</div>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
