<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>crawl-draw-loader — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { padding: 16px 32px; font: 500 13px/1.4 var(--kf-font-mono); }
  main { padding: 80px 32px; font: 400 48px/1.15 var(--kf-font-display); opacity: 0; transition: opacity .2s; }
  .is-in main { opacity: 1; }
</style>
</head>
<body>
<p class="demo-hint"><b>crawl-draw-loader</b> — While loading, a chair line drawing is traced very slowly, and once loaded it finishes drawing, fades, and the curtain lifts (reload to see it again).</p>
<main>Hero Behind the Curtain</main>
<div data-fx="crawl-draw-loader" aria-hidden="true">
  <div data-fx-part="mark">
    <svg data-fx-part="line" viewBox="0 0 96 166"><path d="M30 6h36a10 10 0 0 1 10 10v52a10 10 0 0 1-10 10H30a10 10 0 0 1-10-10V16a10 10 0 0 1 10-10zM48 78v10M14 88h68a7 7 0 0 1 0 14H14a7 7 0 0 1 0-14zM10 70h12m-6 0v18M74 70h12m-6 0v18M44 102h8v32h-8zM48 134 8 150M48 134l40 16M48 134l-20 22M48 134l20 22M48 134v20M4 154a4 4 0 1 0 8 0a4 4 0 1 0-8 0M84 154a4 4 0 1 0 8 0a4 4 0 1 0-8 0M24 160a4 4 0 1 0 8 0a4 4 0 1 0-8 0M64 160a4 4 0 1 0 8 0a4 4 0 1 0-8 0M44 158a4 4 0 1 0 8 0a4 4 0 1 0-8 0"/></svg>
  </div>
</div>
<div data-fx="crawl-draw-loader" data-demo-remove></div>
<template data-demo-late><div data-fx="crawl-draw-loader" data-fx-crawl-draw-loader="ready: event; finish: 1; hold: .3; fade: .3; gap: 0" style="display: none"></div></template>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/CustomEase.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
document.addEventListener("fx:done", () => document.documentElement.classList.add("is-in"), { once: true });
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
