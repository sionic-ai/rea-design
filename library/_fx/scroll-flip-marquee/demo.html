<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>scroll-flip-marquee — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 16px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: sticky; top: 0; z-index: 2; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .pad { height: 70vh; }
  .mq p { margin: 0 0.2em 0 0; font: 300 max(6em, 12vw)/1.1 var(--kf-font-display); white-space: nowrap; }
  .mq p::after { content: "•"; margin-left: 0.2em; }
</style>
</head>
<body>
<p class="demo-hint"><b>scroll-flip-marquee</b> — Scroll down. The text band flows, and flows in reverse when you scroll back up. (One more band enters after 1s and one leaves after 2.5s)</p>
<div class="pad"></div>
<div class="mq" data-fx="scroll-flip-marquee"><div data-fx-part="track"><div data-fx-part="set"><p>Your big text band here</p></div></div></div>
<div class="mq" data-fx="scroll-flip-marquee" data-fx-scroll-flip-marquee="dir: right; scroll: 0" data-demo-remove><div data-fx-part="track"><div data-fx-part="set"><p>Band flowing to the right</p></div></div></div>
<div class="pad" data-demo-host></div>
<div class="mq" data-fx="scroll-flip-marquee"></div>
<div class="pad"></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
gsap.registerPlugin(ScrollTrigger);
setTimeout(() => { const d = document.createElement("div"); d.className = "mq"; d.dataset.fx = "scroll-flip-marquee"; d.innerHTML = '<div data-fx-part="track"><div data-fx-part="set"><p>Late-arriving band</p></div></div>'; document.querySelector("[data-demo-host]").append(d); }, 1000);
setTimeout(() => document.querySelector("[data-demo-remove]")?.remove(), 2500);
</script>
</body>
</html>
