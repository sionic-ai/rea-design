<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ring-rise-carousel — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { margin: 0; background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-spacer { height: 80vh; display: grid; place-items: center; color: var(--kf-dim); }
  .demo { background: var(--kf-contrast-bg); color: var(--kf-contrast-ink); }
  .demo [data-fx-part="step"] { position: absolute; left: 10%; top: 30%; z-index: 50; font: 400 48px/1.2 var(--kf-font-display); }
  .demo [data-fx-part="card"] > * { background: var(--kf-accent); border-radius: var(--kf-radius-sm); }
  .demo [data-fx-part="ring"]:nth-of-type(2n) [data-fx-part="card"] > * { background: var(--kf-surface); }
</style>
</head>
<body>
<p class="demo-hint"><b>ring-rise-carousel</b> — Scroll down: the stage holds still and three photo rings pass by, turning in turn, with the text changing for each ring.</p>
<div class="demo-spacer">Scroll down ↓</div>
<section class="demo" data-fx="ring-rise-carousel">
  <div data-fx-part="step">Your case 1 here</div>
  <div data-fx-part="step">Your case 2 here</div>
  <div data-fx-part="step">Your case 3 here</div>
  <div data-fx-part="ring"><div data-fx-part="card"><i></i></div><div data-fx-part="card"><i></i></div><div data-fx-part="card"><i></i></div><div data-fx-part="card"><i></i></div><div data-fx-part="card"><i></i></div><div data-fx-part="card"><i></i></div></div>
  <div data-fx-part="ring"><div data-fx-part="card"><i></i></div><div data-fx-part="card"><i></i></div><div data-fx-part="card"><i></i></div><div data-fx-part="card"><i></i></div><div data-fx-part="card"><i></i></div><div data-fx-part="card"><i></i></div></div>
  <div data-fx-part="ring"><div data-fx-part="card"><i></i></div><div data-fx-part="card"><i></i></div><div data-fx-part="card"><i></i></div><div data-fx-part="card"><i></i></div><div data-fx-part="card"><i></i></div><div data-fx-part="card"><i></i></div></div>
</section>
<div class="demo-spacer"></div>
<div class="demo-spacer"></div>
<script>
(() => {
  const hint = document.querySelector(".demo-hint");
  // Late-arriving and removed items — attach and detach an extra empty stage to check that the detaching runs
  const late = document.createElement("section");
  late.setAttribute("data-fx", "ring-rise-carousel");
  late.dataset.demo = "late";
  late.style.height = "0px";
  setTimeout(() => document.body.append(late), 1000);
  setTimeout(() => late.remove(), 2500);
  hint.append(" · After 1s an empty stage comes in and leaves after 2.5s (detach).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
