<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>step-shift-strip — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { padding: 48px 20px; display: grid; gap: 40px; }
  .logo { display: grid; place-items: center; height: 40px; padding: 0 12px; border: 1px dashed var(--kf-line); font: 600 13px/1 var(--kf-font-display); letter-spacing: .1em; }
</style>
</head>
<body>
<p class="demo-hint"><b>step-shift-strip</b> — From 3s in, every 2s the logo slides one slot to the right. <span style="color:var(--kf-dim)">(After 1s one more band comes in, and one leaves 2.5s later)</span></p>
<section class="demo">
  <div data-fx="step-shift-strip" data-demo-remove><div data-fx-part="track"><span class="logo" style="width:120px">LOGO 1</span><span class="logo" style="width:70px">LG 2</span><span class="logo" style="width:160px">BRAND 3</span><span class="logo" style="width:90px">LOGO 4</span><span class="logo" style="width:110px">LOGO 5</span></div></div>
  <div data-fx="step-shift-strip" data-fx-step-shift-strip="first: 1; every: 1; dir: left"><div data-fx-part="track"><span class="logo" style="width:120px">LOGO 1</span><span class="logo" style="width:70px">LG 2</span><span class="logo" style="width:160px">BRAND 3</span></div></div>
  <div data-fx="step-shift-strip"><div data-fx-part="track"></div></div>
  <template data-demo-late><div data-fx="step-shift-strip"><div data-fx-part="track"><span class="logo" style="width:100px">LATE 1</span><span class="logo" style="width:140px">LATE 2</span></div></div></template>
</section>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
