<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>swell-ball-cover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: relative; z-index: 30; margin: 0; padding: 12px 20px; border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hero { position: relative; height: 100vh; display: grid; place-items: center; }
  .demo-hero h1 { position: relative; z-index: 20; font-size: 40px; }
  .demo-ball { position: absolute; z-index: 5; left: 50%; bottom: -24%; width: 400px; height: 400px; translate: -50% 0; }
  .demo-ball[data-fx-part="over"] { z-index: 6; }
  .demo-next { position: relative; z-index: 20; min-height: 120vh; padding: 120px 20px; text-align: center; color: var(--kf-on-accent); }
  .demo-small { position: relative; height: 60vh; overflow: hidden; }
  .demo-small .demo-ball { width: 200px; height: 200px; bottom: -30%; }
</style>
</head>
<body>
<p class="demo-hint"><b>swell-ball-cover</b> — Scroll down. A ball at the bottom of the screen swells and becomes the next section’s background. <span style="color:var(--kf-dim)">(After 1s one more small panel comes in, and after 2.5s one leaves)</span></p>
<div class="demo-hero" data-fx="swell-ball-cover">
  <h1>Your Hero title here</h1>
  <i class="demo-ball" data-fx-part="ball"></i>
  <i class="demo-ball" data-fx-part="over"></i>
</div>
<div class="demo-next">Text here for the next section, covered by the ball</div>
<div class="demo-small" data-demo-remove data-fx="swell-ball-cover" data-fx-swell-ball-cover="from: enter; rate: .0038"><i class="demo-ball" data-fx-part="ball"></i></div>
<div class="demo-slot"></div>
<div style="height: 80vh"></div>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelector(".demo-slot").insertAdjacentHTML("beforeend", '<div class="demo-small" data-fx="swell-ball-cover" data-fx-swell-ball-cover="from: enter"><i class="demo-ball" data-fx-part="ball"></i><i class="demo-ball" data-fx-part="over"></i></div>'), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
