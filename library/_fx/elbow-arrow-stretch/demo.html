<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>elbow-arrow-stretch — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 9; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .row { display: flex; flex-direction: column; gap: 28px; margin: 48px 24px; font-size: 22px; }
  .card { display: block; width: 280px; padding: 20px; border: 1px solid var(--kf-line); }
  .card .wf-img { height: 140px; margin-bottom: 14px; }
</style>
</head>
<body>
<p class="demo-hint"><b>elbow-arrow-stretch</b> — Hover over the links and cards. <span style="color:var(--kf-dim)">(After 1s one more link comes in, and after 2.5s one drops out)</span></p>
<div class="row">
  <a href="#" data-fx="elbow-arrow-stretch"><span data-fx-part="arrow"></span>READ</a>
  <a href="#" data-fx="elbow-arrow-stretch" data-fx-elbow-arrow-stretch="grow: 4" data-demo-remove><span data-fx-part="arrow"></span>SEE ALL NEWS</a>
  <a href="#" class="card" data-fx="elbow-arrow-stretch"><span class="wf-img" data-label="Card Photo"></span><span data-fx-part="arrow"></span> Apply to the whole card</a>
  <a href="#" data-fx="elbow-arrow-stretch">No arrow slot — moves on quietly</a>
  <template data-demo-late><a href="#" data-fx="elbow-arrow-stretch"><span data-fx-part="arrow"></span>Late-arriving link</a></template>
</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
