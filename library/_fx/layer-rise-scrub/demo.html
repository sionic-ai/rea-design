<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>layer-rise-scrub — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); overflow-x: hidden; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-spacer { height: 60vh; display: grid; place-items: center; color: var(--kf-dim); }
  .stage { position: relative; height: 160vh; overflow: hidden; }
  .hill { position: absolute; left: 0; width: 100%; height: 70vh; border-radius: 50% 50% 0 0 / 30% 30% 0 0; display: grid; place-items: start center; padding-top: 24px; font: 600 13px/1 var(--kf-font-mono); }
  .hill.is-1 { top: 20vh; z-index: 1; background: var(--kf-raised); }
  .hill.is-2 { top: 70vh; z-index: 2; background: var(--kf-accent-soft); }
  .hill.is-3 { top: 90vh; z-index: 3; background: var(--kf-accent); color: var(--kf-on-accent); }
</style>
</head>
<body>
<p class="demo-hint"><b>layer-rise-scrub</b> — Scrolling down, three layers of hills rise fast by different distances and then stop.</p>
<div class="demo-spacer">Scroll down</div>
<section class="stage" data-fx="layer-rise-scrub" data-fx-layer-rise-scrub="rise: 600 1200 860; rise-sp: 600 800 590; width-sp: 390">
  <div class="hill is-1" data-fx-part="layer">Back 600</div>
  <div class="hill is-2" data-fx-part="layer">Center 1200</div>
  <div class="hill is-3" data-fx-part="layer">Front 860</div>
</section>
<div class="demo-spacer"></div>
<div class="demo-spacer"></div>
<script>
(() => {
  const src = document.querySelector('[data-fx~="layer-rise-scrub"]');
  const html = src.outerHTML;
  const make = () => { const t = document.createElement("template"); t.innerHTML = html; return t.content.firstElementChild; };
  const gone = make(); src.after(gone);
  setTimeout(() => src.after(make()), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s one more of the same panel comes in, and after 2.5s one drops out.");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
