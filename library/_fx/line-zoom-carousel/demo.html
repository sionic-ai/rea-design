<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>line-zoom-carousel — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 14px/1.5 var(--kf-font-sans); }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .stage { height: 70vh; margin: 20px; background: var(--kf-raised); border-radius: var(--kf-radius-md); }
  .stage figure { margin: 0; background: var(--kf-surface); border: 1px solid var(--kf-line); border-radius: var(--kf-radius-sm); display: grid; place-items: center; font: 600 13px/1 var(--kf-font-mono); }
  .stage.small { height: 30vh; }
</style>
</head>
<body>
<p class="demo-hint"><b>line-zoom-carousel</b> — Hover over a cell, and click one to spread out a carousel. Once open, flip through with the wheel, and fold it with empty space or Esc. <span style="color:var(--kf-dim)">(After 1s one more panel comes in, and one leaves 2.5s later)</span></p>
<div class="stage" data-fx="line-zoom-carousel">
  <figure data-fx-part="item">1</figure><figure data-fx-part="item">2</figure><figure data-fx-part="item">3</figure><figure data-fx-part="item">4</figure><figure data-fx-part="item">5</figure><figure data-fx-part="item">6</figure><figure data-fx-part="item">7</figure><figure data-fx-part="item">8</figure><figure data-fx-part="item">9</figure>
</div>
<div class="stage small" data-fx="line-zoom-carousel" data-demo-remove><figure data-fx-part="item">Dropping out</figure><figure data-fx-part="item">Board</figure></div>
<template data-demo-late><div class="stage small" data-fx="line-zoom-carousel" data-fx-line-zoom-carousel="ratio: 1; dim: .2"><figure data-fx-part="item">A</figure><figure data-fx-part="item">B</figure><figure data-fx-part="item">C</figure><figure data-fx-part="item">D</figure></div></template>
<div data-fx="line-zoom-carousel"></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
document.addEventListener("fx:open", (e) => console.info("Open", e.detail.index));
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); }, 2500);
</script>
</body>
</html>
