<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>shadow-press-hover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { margin: 0; background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; margin: 0; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-spacer { height: 90vh; display: grid; place-items: center; color: var(--kf-dim); }
  .sp-face { display: grid; place-items: center; height: 260px; border-radius: var(--kf-radius-lg); background: var(--kf-accent); color: var(--kf-on-accent); font: 700 20px/1.4 var(--kf-font-sans); }
</style>
</head>
<body>
<p class="demo-hint"><b>shadow-press-hover</b> — Hover over the card and it settles .6rem down onto the back plate.</p>
<main style="padding:60px 20px;display:grid;gap:40px;max-width:720px">
  <a href="#" class="sp-card" data-fx="shadow-press-hover"><div data-fx-part="face" class="sp-face">Brand card — Photo and text</div></a>
</main>
<script>
// Late arrivals and removals — checks that fx-core attaches to an element added after 1s and detaches from an element removed after 2.5s
(() => {
  const src = document.querySelector('[data-fx~="shadow-press-hover"]');
  if (!src) return;
  const html = src.outerHTML.replace(/\sid="[^"]*"/g, "");
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const host = src.closest("[data-demo-host]") || src;
  const gone = make("gone");
  host.after(gone);
  setTimeout(() => host.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical one comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>

<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
