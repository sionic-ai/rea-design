<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>shard-pop-drift — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { padding: 48px 20px; }
  .demo-spacer { height: 90vh; display: grid; place-items: center; color: var(--kf-dim); }
  .wall { position: relative; height: 900px; background: var(--kf-surface); }
  .wall [data-fx-part="shard"] { position: absolute; width: 90px; aspect-ratio: 1; background: var(--kf-accent); clip-path: polygon(50% 0, 100% 80%, 10% 100%); }
  .wall [data-fx-part="word"] { position: absolute; left: 30%; top: 30%; font: 900 32px/1 var(--kf-font-sans); }
</style>
</head>
<body>
<p class="demo-hint"><b>shard-pop-drift</b> — Scrolling makes pieces pop out, and scrolling further drifts each piece at a different speed. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<div class="demo-spacer">Scroll down</div><section class="wall" data-demo-remove data-fx="shard-pop-drift"><span data-fx-part="shard" style="left:8%;top:10%"></span><span data-fx-part="shard" style="left:40%;top:4%"></span><span data-fx-part="shard" style="left:72%;top:18%"></span><span data-fx-part="shard" style="left:20%;top:46%"></span><span data-fx-part="shard" style="left:55%;top:52%"></span><span data-fx-part="shard" style="left:84%;top:40%"></span><span data-fx-part="shard" style="left:32%;top:78%"></span><p data-fx-part="word">Word one</p></section><section class="wall" data-fx="shard-pop-drift"><span data-fx-part="shard" style="left:8%;top:10%"></span><span data-fx-part="shard" style="left:40%;top:4%"></span><span data-fx-part="shard" style="left:72%;top:18%"></span><span data-fx-part="shard" style="left:20%;top:46%"></span><span data-fx-part="shard" style="left:55%;top:52%"></span><span data-fx-part="shard" style="left:84%;top:40%"></span><span data-fx-part="shard" style="left:32%;top:78%"></span></section><template data-demo-late><section class="wall" data-fx="shard-pop-drift" data-fx-shard-pop-drift="rate: 0"><span data-fx-part="shard" style="left:8%;top:10%"></span><span data-fx-part="shard" style="left:40%;top:4%"></span><span data-fx-part="shard" style="left:72%;top:18%"></span><span data-fx-part="shard" style="left:20%;top:46%"></span><span data-fx-part="shard" style="left:55%;top:52%"></span><span data-fx-part="shard" style="left:84%;top:40%"></span><span data-fx-part="shard" style="left:32%;top:78%"></span></section></template><section data-fx="shard-pop-drift"></section><div class="demo-spacer"></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); window.ScrollTrigger?.refresh(); }, 2500);
</script>
</body>
</html>
