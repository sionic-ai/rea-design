<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>seal-fade-opening — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .opening .wf-img { height: 100%; }
  .opening [data-fx-part="seal"] { width: 36px; fill: var(--kf-ink); }
  .first { padding: 80px 20px; opacity: .3; transition: opacity 1s; }
  .first.is-open { opacity: 1; }
</style>
</head>
<body>
<p class="demo-hint"><b>seal-fade-opening</b> — On refresh (first time in a session) a vertical seal floats up over the cover photo and then the cover lifts. From the second time on it opens straight away.</p>
<aside class="opening" data-fx="seal-fade-opening" data-fx-seal-fade-opening="key: fx-demo-seal">
  <span class="wf-img" data-label="Cover photo · Seasonal scenery · Portrait"></span>
  <svg data-fx-part="seal" viewBox="0 0 32 160" aria-hidden="true"><rect x="6" y="0" width="20" height="20"/><rect x="6" y="40" width="20" height="20"/><rect x="6" y="80" width="20" height="20"/><circle cx="16" cy="140" r="10"/></svg>
</aside>
<section class="first"><h1>Hero — comes into focus on receiving fx:open</h1></section>
<script>
document.addEventListener("fx:open", () => document.querySelector(".first").classList.add("is-open"));
(() => {
  const src = document.querySelector('[data-fx~="seal-fade-opening"]');
  if (!src) return;
  const make = (tag) => { const el = document.createElement("aside"); el.dataset.fx = "seal-fade-opening"; el.setAttribute("data-fx-seal-fade-opening", "key: fx-demo-seal-" + tag); el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => src.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical one comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
