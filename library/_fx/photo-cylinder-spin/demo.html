<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>photo-cylinder-spin — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .ring { height: 80vh; }
  .ring h1 { position: absolute; left: 40px; top: 60px; z-index: 2; margin: 0; font: 400 72px/1 var(--kf-font-display); }
</style>
</head>
<body>
<p class="demo-hint"><b>photo-cylinder-spin</b> — The photo strip slowly rotates as a tilted cylinder (one turn every 40 seconds).</p>
<section class="ring" data-fx="photo-cylinder-spin"><h1>Value in motion</h1>
  <span data-fx-part="photo" data-label="Photo one"></span><span data-fx-part="photo" data-label="Photo Two"></span><span data-fx-part="photo" data-label="Photo Three"></span>
  <span data-fx-part="photo" data-label="Photo Four"></span><span data-fx-part="photo" data-label="Photo five"></span><span data-fx-part="photo" data-label="Photo six"></span></section>
<script>
(() => {
  const src = document.querySelector('[data-fx~="photo-cylinder-spin"]');
  if (!src) return;
  const html = src.outerHTML.replace(/\sid="[^"]*"/g, "");
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => src.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical one comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="three-global.js"></script>
<script src="../../_vendor/three@0.152.0/build/three.cjs"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
