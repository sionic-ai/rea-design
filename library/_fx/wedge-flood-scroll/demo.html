<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>wedge-flood-scroll — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .stage { position: relative; height: calc(100vh + 467px); }
  .stage__sticky { position: sticky; top: 0; height: 100vh; overflow-x: clip; display: grid; place-items: center; }
  .stage h1 { font: 700 96px/1.1 var(--kf-font-display); margin: 0; text-align: center; }
  .stage__box { position: absolute; inset: 0; margin: auto; width: min(100%, 1280px); aspect-ratio: 1280 / 800; pointer-events: none; }
  .stage__box svg { position: absolute; left: 39.86%; top: 35.26%; width: 45.53%; height: 24.78%; }
  .stage__lines { position: absolute; left: 10%; top: 180px; color: var(--kf-on-accent); font: 400 20px/45px var(--kf-font-sans); }
  .after { height: 120vh; padding: 40px 20px; }
</style>
</head>
<body>
<p class="demo-hint"><b>wedge-flood-scroll</b> — Scroll down. A red wedge grows to cover the screen, the title disappears, then white lines of text rise up.</p>
<section class="stage" data-fx="wedge-flood-scroll">
  <div class="stage__sticky">
    <h1 data-fx-part="out" data-at=".1">Your big title here<br>In two lines</h1>
    <div class="stage__box"><svg data-fx-part="wedge" viewBox="0 0 582.84 198.22" preserveAspectRatio="none"><polygon points="0,113.5 107.3,198.2 582.8,2.1 580.1,0"/></svg></div>
    <div class="stage__lines"><p data-fx-part="in" data-at=".35" data-y="16">Place one white line of text here.</p><p data-fx-part="in" data-at=".35" data-y="16">Your second line of text goes here.</p></div>
  </div>
</section>
<div class="after">Next section</div>
<script>
(() => {
  const src = document.querySelector("[data-fx~=\"wedge-flood-scroll\"]");
  if (!src) return;
  const html = src.outerHTML.replace(/\sid="[^"]*"/g, "");
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => (src.closest(".pin-spacer") || src).after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical one comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../../../_shared/vendor/gsap/CustomEase.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
