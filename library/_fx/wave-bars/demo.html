<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>wave-bars — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { padding: 48px 20px; }
  .demo-spacer { height: 90vh; display: grid; place-items: center; color: var(--kf-dim); }

  .top { position: sticky; top: 46px; z-index: 5; padding: 12px 20px; background: var(--kf-bg); border-bottom: 1px solid var(--kf-line); }
  .ab { display: grid; gap: 12px; } .ab > div:last-child { --fx-wave-on: var(--kf-ink-soft); }
  .long { height: 260vh; }
</style>
</head>
<body>
<p class="demo-hint"><b>wave-bars</b> — The top waveform fills as far as you scroll, and the same playhead sweeps across both tracks below every 16 beats. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<div class="top"><div data-demo-remove data-fx="wave-bars" data-fx-wave-bars="seed: 3; n: 140"></div><div data-fx="wave-bars" data-fx-wave-bars="seed: 3; n: 140"></div><template data-demo-late><div data-fx="wave-bars" data-fx-wave-bars="seed: 3; n: 140"></div></template></div>
<section class="demo"><div class="ab"><div data-fx="wave-bars" data-fx-wave-bars="seed: 21; play: loop"></div><div data-fx="wave-bars" data-fx-wave-bars="seed: 21; play: loop"></div></div></section><div class="long"></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../../../_shared/vendor/gsap/CustomEase.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); window.ScrollTrigger?.refresh(); }, 2500);
</script>
</body>
</html>
