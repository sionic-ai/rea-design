<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>peek-circle-loader — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { margin: 0; padding: 12px 20px; border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .page { display: grid; place-items: center; min-height: 140vh; font: 700 48px/1 var(--kf-font-display); }
  .ch { display: block; }
  .ch path { fill: var(--kf-accent); }
  .ch circle { fill: var(--kf-on-accent); }
  .ch.is-2 path { fill: var(--kf-ink-soft); }
  #again { position: fixed; right: 20px; bottom: 20px; z-index: 100001; padding: 10px 16px; }
  #log { position: fixed; left: 20px; bottom: 20px; z-index: 100001; font: 500 13px/1.4 var(--kf-font-mono); }
</style>
</head>
<body>
<p class="demo-hint"><b>peek-circle-loader</b> — On open, two characters peek out in turn inside a small circle → the circle spreads to the screen edge and the curtain lifts. Replay it with the bottom right button.</p>
<main class="page">Page body</main>
<button id="again" type="button">Play again</button>
<p id="log"></p>
<script>
const ch = (cls) => `<svg class="ch ${cls}" data-fx-part="peek" data-key="${cls === "is-1" ? "tl" : "br"}" viewBox="0 0 200 200" aria-hidden="true"><path d="M100 18C150 18 186 54 186 104C186 156 150 196 98 196C48 196 14 158 14 106C14 56 50 18 100 18Z"/><circle cx="84" cy="84" r="6"/><circle cx="108" cy="82" r="6"/></svg>`;
const make = () => {
  const s = document.createElement("div");
  s.dataset.fx = "peek-circle-loader";
  s.innerHTML = `<div data-fx-part="disc"><div data-fx-part="window">${ch("is-1")}${ch("is-2")}</div></div>`;
  s.addEventListener("fx:open", () => { document.getElementById("log").textContent = "fx:open"; });
  s.addEventListener("fx:done", () => { document.getElementById("log").textContent = "fx:done"; });
  document.body.append(s);
  return s;
};
make();
document.getElementById("again").addEventListener("click", () => { document.querySelectorAll('[data-fx="peek-circle-loader"]').forEach((e) => e.remove()); setTimeout(make, 50); });
// Also watches curtains attached late and removed midway (detach)
setTimeout(() => { const s = make(); setTimeout(() => s.remove(), 1500); }, 1000);
</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
