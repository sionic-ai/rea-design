<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>glass-shard-field — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { padding: 48px 20px; }
  .demo-spacer { height: 70vh; display: grid; place-items: center; color: var(--kf-dim); }
  .demo-card { height: 420px; padding: 32px; border: 1px solid var(--kf-line); border-radius: var(--kf-radius-sm); background: var(--kf-surface); font: 700 32px/1.1 var(--kf-font-display); }
  .demo-card:nth-child(2n) { background: var(--kf-accent); color: var(--kf-on-accent); }
  .demo-chip { padding: 16px 24px; margin-right: 12px; border: 1px solid var(--kf-line); border-radius: var(--kf-radius-md); background: var(--kf-surface); font: 700 28px/1 var(--kf-font-display); white-space: nowrap; }
<p class="demo-hint"><b>glass-shard-field</b> — Glass pieces spin over a purple panel. Move the mouse and scroll.</p>
<section class="demo"><div class="demo-spacer">Downward</div></section>
<section data-fx="glass-shard-field" data-fx-glass-shard-field="count: 22" style="height: 100vh; background: var(--kf-accent); color: var(--kf-on-accent); display: grid; place-items: center"><h2 style="font: 700 64px/1 var(--kf-font-display)">Glass shard</h2></section>
<section class="demo"><div class="demo-spacer">Footer</div></section>
<script>
// Late arrivals and removals — checks that fx-core attaches to an element added after 1s and detaches from an element removed after 2.5s
(() => {
  const src = document.querySelector('[data-fx~="glass-shard-field"]');
  if (!src) return;
  const html = src.outerHTML.replace(/\sid="[^"]*"/g, "");
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => (src.closest(".pin-spacer") || src).after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical one comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../pillar-gallery-gl/three-global.js"></script>
<script src="../../_vendor/three@0.181.0/build/three.cjs"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
