<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>swell-dot-cursor — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 24px; padding: 48px 20px; }
  .card { aspect-ratio: 16 / 9; display: grid; place-items: center; background: var(--kf-surface); border: 1px solid var(--kf-line); border-radius: var(--kf-radius-md); color: var(--kf-dim); }
  .btn { justify-self: start; align-self: center; padding: 12px 20px; border: 1px solid var(--kf-ink); border-radius: var(--kf-radius-pill); background: none; }
</style>
</head>
<body data-fx="swell-dot-cursor" data-fx-swell-dot-cursor="hide: 1">
<p class="demo-hint"><b>swell-dot-cursor</b> — Move the mouse over the buttons and cards. <span style="color:var(--kf-dim)">(One more card comes in after 1s, and one drops out after 2.5s)</span></p>
<div class="demo">
  <button class="btn" type="button">Button — 50px</button>
  <a class="card" href="#" data-cursor="View work">Card — 100px + text</a>
  <a class="card" href="#" data-cursor="Read more" data-demo-remove>Card to drop</a>
  <template data-demo-late><a class="card" href="#" data-cursor="Late">Late-arrived card</a></template>
</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
