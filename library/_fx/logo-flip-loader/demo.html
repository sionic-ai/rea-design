<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>logo-flip-loader — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-surface); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: relative; z-index: 10001; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  main { padding: 48px 20px; font: 400 64px/1 var(--kf-font-display); }
</style>
</head>
<body>
<p class="demo-hint"><b>logo-flip-loader</b> On open, the logo flips once on the X axis and the curtain lifts up (reload to see it again).</p>
<div data-fx="logo-flip-loader"><span data-fx-part="mark"><svg viewBox="0 0 52 52" aria-hidden="true"><path fill-rule="evenodd" d="M12 1a11 11 0 1 1 0 22a11 11 0 1 1 0-22Zm0 3.6a7.4 7.4 0 1 0 0 14.8a7.4 7.4 0 1 0 0-14.8ZM38 1a11 11 0 1 1 0 22a11 11 0 1 1 0-22Zm0 3.6a7.4 7.4 0 1 0 0 14.8a7.4 7.4 0 1 0 0-14.8ZM12 29a11 11 0 1 1 0 22a11 11 0 1 1 0-22Zm0 3.6a7.4 7.4 0 1 0 0 14.8a7.4 7.4 0 1 0 0-14.8ZM38 29a11 11 0 1 1 0 22a11 11 0 1 1 0-22Zm0 3.6a7.4 7.4 0 1 0 0 14.8a7.4 7.4 0 1 0 0-14.8Z"/></svg></span></div>
<div data-fx="logo-flip-loader" data-demo-remove></div>
<template data-demo-late><div data-fx="logo-flip-loader" data-fx-logo-flip-loader="flip: .5; lift: 1"></div></template>
<main>Hero Behind the Curtain</main>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
