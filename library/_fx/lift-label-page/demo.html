<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lift-label-page — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { display: flex; gap: 20px; padding: 48px 20px; }
  .demo a { padding: 14px 22px; border-radius: 99px; background: var(--kf-accent); color: var(--kf-on-accent); }
</style>
</head>
<body>
<main data-fx="lift-label-page">
  <span hidden data-fx-part="brand">Wordmark</span>
  <p class="demo-hint"><b>lift-label-page</b> — Press a button and a curtain covers from below and the page name rises before moving on. On the new page the curtain peels upward.</p>
  <section class="demo"><a href="demo.html?about" data-name="About">By referral</a><a href="demo.html?works" data-name="Projects">Through work</a><a href="#bottom">Downward (hash unchanged)</a></section>
</main>
<script>
(() => {
  const src = document.querySelector(".demo a");
  if (!src) return;
  const late = src.cloneNode(true);
  setTimeout(() => src.parentElement.append(late), 1000);
  document.querySelector(".demo-hint").append(" · After 1s one more button comes in (late arrivals also ride the paging).");
})();
</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
