<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sticky-drift-photos — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-spacer { height: 70vh; display: grid; place-items: center; color: var(--kf-dim); }
  .story { padding: 64px; background: var(--kf-contrast-bg); color: var(--kf-contrast-ink); }
  .story [data-fx-part="text"] { max-width: 560px; margin: 0 auto 100px; text-align: center; }
  .story h2 { font: var(--kf-weight-display) 48px/1.2 var(--kf-font-display); margin-bottom: 16px; }
  .story .ph { aspect-ratio: 340 / 480; }
</style>
</head>
<body>
<p class="demo-hint"><b>sticky-drift-photos</b> — Scroll down. The center text stays put while the side photos are pushed up slightly faster and follow with a delay.</p>
<div class="demo-spacer">Scroll down</div>
<section class="story" data-fx="sticky-drift-photos">
  <div data-fx-part="text"><h2>About Us</h2><p>Your intro text here, five lines. While it stays pinned in the center, photos scroll past behind it.</p></div>
  <div class="photos">
    <figure data-fx-part="photo"><span class="wf-img ph" data-label="Work hands · Portrait 3:4"></span></figure>
    <figure data-fx-part="photo"><span class="wf-img ph" data-label="Material · vertical 3:4"></span></figure>
    <figure data-fx-part="photo"><span class="wf-img ph" data-label="Finished product · Portrait 3:4"></span></figure>
  </div>
</section>
<div class="demo-spacer"></div>
<script>
(() => {
  const src = document.querySelector('[data-fx~="sticky-drift-photos"]');
  const host = src.parentElement;
  const twin = src.cloneNode(true);
  src.after(twin);
  setTimeout(() => host.append(src.cloneNode(true)), 1000);
  setTimeout(() => twin.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s one more of the same section comes in, and after 2.5s one drops out.");
})();
</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
