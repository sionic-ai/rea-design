<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pulse-ring-dot — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .scene { position: relative; height: 70vh; margin: 24px 20px; border-radius: var(--kf-radius-lg); background: var(--kf-contrast-bg); }
  .scene > * { position: absolute; translate: -50% -50%; width: 44px; height: 44px; padding: 0; border: 0; background: none; color: var(--kf-ink); }
</style>
</head>
<body>
<p class="demo-hint"><b>pulse-ring-dot</b> — Hover over a dot. The ring spreads every 2.4s, and the right dot (look: link) grows into a circle and shows an arrow.</p>
<div class="scene">
  <button data-fx="pulse-ring-dot" style="left: 30%; top: 40%" aria-label="Close-up 1"><span data-fx-part="mark"><span data-fx-part="pulse"></span></span></button>
  <button data-fx="pulse-ring-dot" style="left: 50%; top: 62%" aria-label="Close-up 2"><span data-fx-part="mark"><span data-fx-part="pulse"></span></span></button>
  <a data-fx="pulse-ring-dot" data-fx-pulse-ring-dot="look: link" href="#" style="left: 70%; top: 36%" aria-label="To another page"><span data-fx-part="mark"><span data-fx-part="pulse"></span></span><svg data-fx-part="arrow" viewBox="0 0 20 20" aria-hidden="true"><path d="M6 14 14 6M7.5 6H14v6.5" fill="none" stroke="currentColor" stroke-width="1.6"/></svg></a>
</div>
<script>
// Late arrivals and removals — a CSS-only part, checking that it applies immediately to late-added elements and that removed elements vanish without a trace
(() => {
  const scene = document.querySelector(".scene");
  const src = scene.querySelector('[data-fx~="pulse-ring-dot"]');
  const make = (x, y) => { const el = src.cloneNode(true); el.style.left = x; el.style.top = y; return el; };
  const gone = make("20%", "70%");
  scene.append(gone);
  setTimeout(() => scene.append(make("80%", "72%")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s one more dot comes in, and after 2.5s one leaves.");
})();
</script>
</body>
</html>
