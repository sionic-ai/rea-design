<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>roll-arrow-pill — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 500 15px/1.6 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 10; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .row { display: flex; flex-wrap: wrap; gap: 24px; max-width: 760px; margin: 48px auto; padding: 0 20px; font-size: 20px; }
</style>
</head>
<body>
<p class="demo-hint"><b>roll-arrow-pill</b> — Hover over the button. The text rolls up one line and the arrow in the circle slides across. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<div class="row">
  <a href="#" data-fx="roll-arrow-pill"><span data-fx-part="roll"><span>More About</span><span>More About</span></span><span data-fx-part="arrow"><svg viewBox="0 0 16 16"><path d="M2 8h11M9 4l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.6"/></svg></span></a>
  <a href="#" data-fx="roll-arrow-pill" data-demo-remove><span data-fx-part="roll"><span>Exit button</span></span><span data-fx-part="arrow"><svg viewBox="0 0 16 16"><path d="M2 8h11M9 4l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.6"/></svg></span></a>
  <button type="button" data-fx="roll-arrow-pill" data-fx-roll-arrow-pill="line: 0"><span data-fx-part="roll"><span>Button without arrow</span></span></button>
</div>
<template data-demo-late><div class="row"><a href="#" data-fx="roll-arrow-pill" data-fx-roll-arrow-pill="dur: 0.5; fade: 0.2" style="--fx-dot: var(--kf-accent)"><span data-fx-part="roll"><span>Late-arrived Button</span></span><span data-fx-part="arrow"><svg viewBox="0 0 16 16"><path d="M2 8h11M9 4l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.6"/></svg></span></a></div></template>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); window.ScrollTrigger?.refresh(); }, 2500);
</script>
</body>
</html>
