<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>scroll-push-columns — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .stage { width: 420px; height: 520px; margin: 24px; }
  .stage .wf-img { aspect-ratio: 1; }
  .band { height: 120px; margin: 24px; }
  .band .wf-img { width: 160px; height: 120px; }
  .gap { height: 80vh; }
</style>
</head>
<body>
<p class="demo-hint"><b>scroll-push-columns</b> — Two columns drift slowly in staggered directions. Scroll down and they get pushed faster, then settle.</p>
<div class="stage" data-fx="scroll-push-columns" data-fx-scroll-push-columns="dir: down, up">
  <div data-fx-part="col"><div><div class="wf-img" data-label="Photo 1"></div><div class="wf-img" data-label="Photo 2"></div><div class="wf-img" data-label="Photo 3"></div></div></div>
  <div data-fx-part="col"><div><div class="wf-img" data-label="Photo 4"></div><div class="wf-img" data-label="Photo 5"></div><div class="wf-img" data-label="Photo 6"></div></div></div>
</div>
<div class="band" data-demo-remove data-fx="scroll-push-columns" data-fx-scroll-push-columns="axis: x; base: 1.5">
  <div data-fx-part="col"><div><div class="wf-img" data-label="Removed Band 1"></div><div class="wf-img" data-label="Removed Band 2"></div></div></div>
</div>
<template data-demo-late><div class="band" data-fx="scroll-push-columns" data-fx-scroll-push-columns="axis: x; dir: right">
  <div data-fx-part="col"><div><div class="wf-img" data-label="Late-arriving band 1"></div><div class="wf-img" data-label="Late-arriving band 2"></div><div class="wf-img" data-label="Late-arriving band 3"></div></div></div>
</div></template>
<div class="band" data-fx="scroll-push-columns"></div>
<div class="gap"></div>
<div class="gap"></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
