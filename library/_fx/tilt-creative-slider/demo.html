<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tilt-creative-slider — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="../../_vendor/swiper@8.4.7/swiper-bundle.min.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); overflow-x: hidden; }
  .demo-hint { margin: 0; padding: 12px 20px; border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .stage { display: grid; place-items: center; gap: 16px; padding: 60px 20px; }
  .deck { width: min(320px, 70vw); rotate: -2deg; }
  .deck [data-fx-part="photo"] { aspect-ratio: 1; border-radius: 10px; overflow: hidden; }
  .peek { width: min(360px, 60vw); }
  .peek [data-fx-part="photo"] { aspect-ratio: 1; border-radius: 16px; }
  .wf-img { height: 100%; }
  .nav { display: flex; gap: 8px; justify-content: center; }
  .nav button { padding: 6px 14px; border: 1px solid var(--kf-line); border-radius: 999px; background: var(--kf-surface); color: var(--kf-ink); font: inherit; cursor: pointer; }
</style>
</head>
<body>
<p class="demo-hint"><b>tilt-creative-slider</b> — The overlapping photos above advance by themselves (the front photo vanishes before advancing). Use the buttons to move the slider below.</p>
<section class="stage">
  <div class="deck" data-fx="tilt-creative-slider">
    <div class="swiper" data-fx-part="track"><div class="swiper-wrapper">
      <div class="swiper-slide"><div data-fx-part="photo"><div class="wf-img" data-label="Photo 1"></div></div></div>
      <div class="swiper-slide"><div data-fx-part="photo"><div class="wf-img" data-label="Photo 2"></div></div></div>
      <div class="swiper-slide"><div data-fx-part="photo"><div class="wf-img" data-label="Photo 3"></div></div></div>
    </div></div>
  </div>
  <p>（<span id="cur">001</span> / 003）</p>
</section>
<section class="stage" id="peeks">
  <div class="peek" data-fx="tilt-creative-slider" data-fx-tilt-creative-slider="look: peek">
    <div class="swiper" data-fx-part="track"><div class="swiper-wrapper">
      <div class="swiper-slide"><a href="#" data-fx-part="photo"><div class="wf-img" data-label="Person 1"></div></a></div>
      <div class="swiper-slide"><a href="#" data-fx-part="photo"><div class="wf-img" data-label="Person 2"></div></a></div>
      <div class="swiper-slide"><a href="#" data-fx-part="photo"><div class="wf-img" data-label="Person 3"></div></a></div>
      <div class="swiper-slide"><a href="#" data-fx-part="photo"><div class="wf-img" data-label="Person 4"></div></a></div>
    </div></div>
    <p class="nav"><button type="button" data-fx-part="prev">Previous</button><span>（<span data-fx-part="cur">001</span> / <span data-fx-part="total">004</span>）</span><button type="button" data-fx-part="next">Next</button></p>
  </div>
</section>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../_vendor/swiper@8.4.7/swiper-bundle.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
  document.querySelector(".deck").addEventListener("fx:change", (e) => { document.getElementById("cur").textContent = String(e.detail.index + 1).padStart(3, "0"); });
  // Check it attaches to late-added sliders and that removed sliders are detached
  setTimeout(() => {
    const late = document.createElement("div");
    late.className = "peek";
    late.dataset.fx = "tilt-creative-slider";
    late.setAttribute("data-fx-tilt-creative-slider", "look: peek");
    late.innerHTML = '<div class="swiper" data-fx-part="track"><div class="swiper-wrapper">' + [1, 2, 3].map((n) => `<div class="swiper-slide"><a href="#" data-fx-part="photo"><div class="wf-img" data-label="Late ${n}"></div></a></div>`).join("") + "</div></div>";
    document.getElementById("peeks").append(late);
  }, 1000);
  setTimeout(() => document.querySelectorAll(".peek")[1]?.remove(), 2500);
</script>
</body>
</html>
