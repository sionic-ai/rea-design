<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>page-lift-cover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .page { min-height: 100vh; padding: 40px 20px; background: var(--kf-bg); }
  .page h1 { font: var(--kf-weight-display) clamp(40px, 8vw, 120px)/1 var(--kf-font-display); margin: 20vh 0 40px; }
  .page a { display: inline-block; margin-right: 16px; padding: 10px 16px; border: 1px solid var(--kf-line); border-radius: var(--kf-radius-md); }
</style>
</head>
<body>
<p class="demo-hint"><b>page-lift-cover</b> — Click the link below. This page moves up and darkens, while the reopened page covers it, rising from below. <span style="color:var(--kf-dim)">(After 1s one more panel comes in, and one leaves 2.5s later)</span></p>
<main class="page" data-fx="page-lift-cover">
  <h1>Your page title here</h1>
  <a href="demo.html?next=1">Next page</a><a href="demo.html?next=2">Other pages</a><a href="#top">Same-page spot (no page turn)</a>
</main>
<div class="page" data-demo-remove data-fx="page-lift-cover" data-fx-page-lift-cover="lift: 10; shade: 0.4"><p>Dropping panel</p></div>
<template data-demo-late><div class="page" data-fx="page-lift-cover" data-fx-page-lift-cover="rise: 0"><p>Late panel</p></div></template>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
