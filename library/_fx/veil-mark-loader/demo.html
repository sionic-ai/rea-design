<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>veil-mark-loader — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); padding: 24px; }
  .demo-hint { margin-bottom: 16px; font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-mark { border-radius: 50%; background: var(--kf-bg); }
  .demo-again { margin-top: 12px; padding: 8px 14px; border: 1px solid var(--kf-line); background: var(--kf-surface); cursor: pointer; }
</style>
</head>
<body>
<p class="demo-hint"><b>veil-mark-loader</b> — Refresh. A mark sits in the center of the accent-color curtain for 1.5s, rests 1s, then shrinks and disappears (4s total).</p>
<button class="demo-again" type="button">One more pass for returning visitors (background-color curtain only)</button>
<div data-fx="veil-mark-loader" data-fx-veil-mark-loader="mode: first"><div class="demo-mark" data-fx-part="mark"></div></div>
<script>
// Late arrivals and removals — checks that fx-core attaches to an element added after 1s and detaches from an element removed after 2.5s
(() => {
  const src = document.querySelector('[data-fx~="veil-mark-loader"]');
  if (!src) return;
  const html = src.outerHTML.replace(/\sid="[^"]*"/g, "");
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => src.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical one comes in (the late arrival), and after 2.5s one drops out (the detach).");
  document.querySelector(".demo-again").addEventListener("click", () => {
    const el = make("again");
    el.setAttribute("data-fx-veil-mark-loader", "mode: again");
    document.body.append(el);
  });
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
