<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>panel-swap-float — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .hero { height: 90vh; display: grid; place-items: center; font: 400 64px/.9 var(--kf-font-display); color: var(--kf-accent); }
  .demo-spacer { height: 160vh; display: grid; place-items: center; color: var(--kf-dim); }
  .panel { display: flex; gap: 40px; align-items: center; height: 100px; padding: 0 48px; background: var(--kf-contrast-bg); color: var(--kf-contrast-ink); }
  .panel b { display: block; font: 600 18px/1.1 var(--kf-font-display); }
  .float { display: grid; place-items: center; width: 120px; height: 72px; background: var(--kf-contrast-bg); color: var(--kf-contrast-ink); font: 600 18px/1 var(--kf-font-display); }
</style>
</head>
<body>
<p class="demo-hint"><b>panel-swap-float</b> — Scroll down. Past the first screen the large panel at bottom right drops away and a small panel rises. Scroll back up for the reverse.</p>
<section class="hero" data-fx="panel-swap-float">
  Your Hero here
  <nav class="panel" data-fx-part="panel"><span>Open today<b>9:00–17:00</b></span><a href="#"><b>TICKET</b>Ticket</a><a href="#"><b>SHOW</b>Performance</a></nav>
  <a class="float" data-fx-part="float" href="#">TICKET</a>
</section>
<div class="demo-spacer">More below</div>
<script>
// Late arrivals and removals — checks that fx-core attaches to an element added after 1s and detaches from an element removed after 2.5s
(() => {
  const src = document.querySelector('[data-fx~="panel-swap-float"]');
  if (!src) return;
  const html = src.outerHTML.replace(/\sid="[^"]*"/g, "");
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => src.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical one comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
