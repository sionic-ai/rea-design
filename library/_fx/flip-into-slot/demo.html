<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>flip-into-slot — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { margin: 0; font-family: var(--kf-font-sans); background: var(--kf-bg); color: var(--kf-ink); }
  .stage { position: relative; display: flex; height: 100lvh; align-items: center; justify-content: center; overflow-x: clip; }
  .stage .wf-img { height: 100%; }
  .credit { position: absolute; right: 16px; bottom: 16px; z-index: 11; font-size: 14px; transition: opacity 0.3s; }
  h1 { max-width: 66%; margin: 0; padding: 80px 16px 120vh; font-size: clamp(48px, 7vw, 96px); line-height: 1; font-weight: 500; letter-spacing: -0.05em; }
  .slot { display: inline-block; aspect-ratio: 16 / 10; height: 0.73em; }
  .demo-hint { position: fixed; top: 0; left: 0; z-index: 20; padding: 16px; font-size: 14px; background: var(--kf-bg); }
</style>
</head>
<body>
  <p class="demo-hint"><b>flip-into-slot</b> — Scroll down. The full-screen photo folds into a small cell in the title line, and the cell pushes the word out.</p>
  <section class="stage">
    <div data-fx="flip-into-slot" data-fx-flip-into-slot="slot: #slot; hide: #credit"><div class="wf-img" data-label="Main photo · full screen"></div></div>
    <p class="credit" id="credit">Photo: Credit</p>
  </section>
  <h1>Work Title Goes Here, <span class="slot" id="slot"></span> Place</h1>
  <template data-demo-late><div data-fx="flip-into-slot" data-fx-flip-into-slot="slot: #nothing" style="width:120px;height:80px"></div></template>
  <div data-fx="flip-into-slot" data-demo-remove></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../../../_shared/vendor/gsap/Flip.min.js"></script>
<script>gsap.registerPlugin(ScrollTrigger, Flip);</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
