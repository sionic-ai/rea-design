<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fly-grid-gl — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .g { height: 80vh; margin: 16px 0; }
  .g [data-fx-part="hint"] { position: absolute; bottom: 5%; left: 0; right: 0; text-align: center; font: 500 11px/1.1 var(--kf-font-sans); color: var(--kf-dim); }
</style>
</head>
<body>
<p class="demo-hint"><b>fly-grid-gl</b> — Drag or roll the wheel on the board. The grid wraps endlessly in all directions, and pressing a panel flies you into it (arrow keys for neighbors, Esc to exit).</p>
<section class="g" data-fx="fly-grid-gl">
  <div data-fx-part="loader"><span></span></div>
  <p data-fx-part="hint">Browse with arrows</p>
  <figure data-fx-part="item" data-format="portrait" data-label="Experimental video · black and white" data-video></figure>
  <figure data-fx-part="item" data-format="square" data-tone="dark" data-label="Particle graphic · Black background"></figure>
  <figure data-fx-part="item" data-format="landscape" data-label="Keyboard close-up · White background" data-href="https://example.com/"></figure>
  <figure data-fx-part="item" data-format="portrait" data-label="Doll 3D render · Gray"></figure>
  <figure data-fx-part="item" data-format="square" data-label="Face grid · 12 shots"></figure>
  <figure data-fx-part="item" data-format="portrait" data-tone="dark" data-label="Hand-tracking video · Dark room" data-video></figure>
</section>
<section class="g" data-fx="fly-grid-gl" data-demo-remove data-fx-fly-grid-gl="cols: 4; rows: 3; wait: 0"><figure data-fx-part="item" data-label="Board to erase"></figure></section>
<template data-demo-late><section class="g" data-fx="fly-grid-gl" data-fx-fly-grid-gl="cols: 6; rows: 4; wait: 0"><figure data-fx-part="item" data-format="portrait" data-label="Late-arriving panel 1"></figure><figure data-fx-part="item" data-format="landscape" data-label="Late-arriving panel 2"></figure></section></template>
<section class="g" data-fx="fly-grid-gl"></section>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="three-global.js"></script>
<script src="../../_vendor/three@0.181.0/build/three.cjs"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
