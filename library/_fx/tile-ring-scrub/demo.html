<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tile-ring-scrub — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { margin: 0; background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; margin: 0; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-spacer { height: 90vh; display: grid; place-items: center; color: var(--kf-dim); }
  .tr-sec { display: flex; justify-content: center; align-items: center; height: 650px; }
  .tr-sec h3 { max-width: 400px; margin: 0; font: 400 40px/1.12 var(--kf-font-display); text-align: center; }
  .tr-sec svg { width: 65%; height: 40%; }
  .tr-fade { position: absolute; inset: 0; background-image: linear-gradient(transparent 80%, var(--kf-bg)), linear-gradient(var(--kf-bg), transparent 20%); pointer-events: none; }
</style>
</head>
<body>
<p class="demo-hint"><b>tile-ring-scrub</b> — Scroll down and the three rings of logo tiles spin in opposite directions (inner 180° · middle -135° · outer 90°).</p>
<div class="demo-spacer">Scroll down ↓</div>
<section class="tr-sec" data-fx="tile-ring-scrub" data-demo-host>
  <div data-fx-part="tile"><svg viewBox="0 0 72 24" fill="currentColor"><circle cx="10" cy="12" r="7"/><rect x="21" y="8" width="44" height="8" rx="2"/></svg></div>
  <div data-fx-part="tile"><svg viewBox="0 0 72 24" fill="currentColor"><rect x="4" y="5" width="64" height="14" rx="7"/></svg></div>
  <div data-fx-part="tile"><svg viewBox="0 0 72 24" fill="currentColor"><path d="M4 19 12 5l8 14z"/><rect x="26" y="7" width="40" height="4" rx="1"/></svg></div>
  <div data-fx-part="tile"><svg viewBox="0 0 72 24" fill="currentColor"><rect x="4" y="4" width="16" height="16" rx="4"/><rect x="26" y="9" width="42" height="6" rx="3"/></svg></div>
  <div data-fx-part="tile"><svg viewBox="0 0 72 24" fill="currentColor"><path d="M12 3 21 12 12 21 3 12z"/><rect x="26" y="9" width="38" height="6" rx="3"/></svg></div>
  <div class="tr-fade"></div>
  <h3>Your trust statement here <em>Two lines</em>Toward</h3>
</section>
<div class="demo-spacer"></div>
<script>
// Late arrivals and removals — checks that fx-core attaches to an element added after 1s and detaches from an element removed after 2.5s
(() => {
  const src = document.querySelector('[data-fx~="tile-ring-scrub"]');
  if (!src) return;
  const html = src.outerHTML.replace(/\sid="[^"]*"/g, "");
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => src.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical one comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
