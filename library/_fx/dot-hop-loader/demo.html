<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dot-hop-loader — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.6 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: sticky; top: 0; z-index: 1000; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .head { display: flex; padding: 24px; } .head .logo { font: 600 28px/1 var(--kf-font-display); }
  .logo-big { font: 600 120px/1 var(--kf-font-display); letter-spacing: -0.04em; }
</style>
</head>
<body>
<p class="demo-hint"><b>dot-hop-loader</b> — On open, the dot bounces twice and the letters gather, then the logo flies to the top left as the curtain lifts. <span style="color:var(--kf-dim)">(After 1s an empty curtain slides in, and after 2.5s it leaves)</span></p>
<div class="head"><span class="logo">Mark.</span></div>
<div data-fx="dot-hop-loader" data-fx-dot-hop-loader="to: .head .logo"><span class="logo-big" data-fx-part="mark"><span data-fx-part="gather" data-x="120">M</span><span data-fx-part="fade">a</span><span data-fx-part="gather" data-x="-40">r</span><span data-fx-part="fade">k</span><span data-fx-part="dot">.</span></span></div>
<div data-late-slot></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelector("[data-late-slot]").outerHTML = '<div data-fx="dot-hop-loader" data-fx-dot-hop-loader="out: .3" data-demo-remove style="z-index:800"></div>', 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
