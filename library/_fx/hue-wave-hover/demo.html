<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hue-wave-hover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { display: flex; flex-wrap: wrap; gap: 40px; padding: 40px 20px; }
  .names { display: flex; flex-wrap: wrap; gap: 6px; }
  .names li { padding: 6px 14px; border: 1px solid var(--kf-line); font-weight: 700; cursor: default; }
</style>
</head>
<body>
<p class="demo-hint"><b>hue-wave-hover</b> — Hover over the name. A lime-to-sky panel spins around the color wheel once in 2s and returns.</p>
<section class="demo">
<ul class="names">
  <li data-fx="hue-wave-hover">Your name here</li>
  <li data-fx="hue-wave-hover">Your long performer name here</li>
  <li data-fx="hue-wave-hover">Your name three here</li>
  <li data-fx="hue-wave-hover" data-fx-hue-wave-hover="look: always">Endless loop band</li>
</ul>
</section>
<script>
// Late arrivals and removals — checks that fx-core attaches to an element added after 1s and detaches from an element removed after 2.5s
(() => {
  const src = document.querySelector('[data-fx~="hue-wave-hover"]');
  if (!src) return;
  const html = src.outerHTML.replace(/\sid="[^"]*"/g, "");
  const host = src.parentElement; // A place to attach a late arrival even if src is detached during the demo (inspector tools watch for detaching)
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => host.append(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical one comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
</body>
</html>
