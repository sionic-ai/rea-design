<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>branch-grow — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { padding: 48px 20px; }
  .demo-spacer { height: 90vh; display: grid; place-items: center; color: var(--kf-dim); }

  .map { width: 640px; height: 360px; margin: 0 auto; }
  .map svg { position: absolute; inset: 0; width: 100%; height: 100%; } .map path { stroke: var(--kf-dim); stroke-width: 2; }
  .map b { position: absolute; translate: -50% -50%; padding: 10px 20px; border-radius: 999px; background: var(--kf-accent); color: var(--kf-on-accent); font: 600 14px/1 var(--kf-font-sans); white-space: nowrap; }
</style>
</head>
<body>
<p class="demo-hint"><b>branch-grow</b> — Scroll down and the center node pops up, branches are drawn, and the end nodes pop up. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<div class="demo-spacer">Scroll down</div><section class="demo"><div data-demo-remove class="map" data-fx="branch-grow"><svg viewBox="0 0 640 360" aria-hidden="true"><path data-fx-part="edge" d="M320 180 C 420 180 440 70 540 70"/><path data-fx-part="edge" d="M320 180 C 420 180 440 290 540 290"/><path data-fx-part="edge" d="M320 180 C 220 180 200 100 100 100"/><path data-fx-part="edge" d="M320 180 C 220 180 200 260 100 260"/></svg>
<b data-fx-part="node" style="left:50%;top:50%">Center thought</b><b data-fx-part="node" style="left:84%;top:19%">Branch 1</b><b data-fx-part="node" style="left:84%;top:81%">Branch 2</b><b data-fx-part="node" style="left:16%;top:28%">Branch 3</b><b data-fx-part="node" style="left:16%;top:72%">Branch 4</b></div><div class="map" data-fx="branch-grow"><svg viewBox="0 0 640 360" aria-hidden="true"><path data-fx-part="edge" d="M320 180 C 420 180 440 70 540 70"/><path data-fx-part="edge" d="M320 180 C 420 180 440 290 540 290"/><path data-fx-part="edge" d="M320 180 C 220 180 200 100 100 100"/><path data-fx-part="edge" d="M320 180 C 220 180 200 260 100 260"/></svg>
<b data-fx-part="node" style="left:50%;top:50%">Center thought</b><b data-fx-part="node" style="left:84%;top:19%">Branch 1</b><b data-fx-part="node" style="left:84%;top:81%">Branch 2</b><b data-fx-part="node" style="left:16%;top:28%">Branch 3</b><b data-fx-part="node" style="left:16%;top:72%">Branch 4</b></div><template data-demo-late><div class="map" data-fx="branch-grow"><svg viewBox="0 0 640 360" aria-hidden="true"><path data-fx-part="edge" d="M320 180 C 420 180 440 70 540 70"/><path data-fx-part="edge" d="M320 180 C 420 180 440 290 540 290"/><path data-fx-part="edge" d="M320 180 C 220 180 200 100 100 100"/><path data-fx-part="edge" d="M320 180 C 220 180 200 260 100 260"/></svg>
<b data-fx-part="node" style="left:50%;top:50%">Center thought</b><b data-fx-part="node" style="left:84%;top:19%">Branch 1</b><b data-fx-part="node" style="left:84%;top:81%">Branch 2</b><b data-fx-part="node" style="left:16%;top:28%">Branch 3</b><b data-fx-part="node" style="left:16%;top:72%">Branch 4</b></div></template></section><div class="demo-spacer"></div><div class="demo-spacer"></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../../../_shared/vendor/gsap/CustomEase.min.js"></script>
<script src="../../../_shared/vendor/gsap/DrawSVGPlugin.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); window.ScrollTrigger?.refresh(); }, 2500);
</script>
</body>
</html>
