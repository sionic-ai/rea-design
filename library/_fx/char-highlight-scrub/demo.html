<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>char-highlight-scrub — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 10; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .sp { height: 80vh; display: grid; place-items: center; color: var(--kf-dim); }
  h2 { padding: 0 20px; max-width: 900px; font: 700 44px/1.2 var(--kf-font-display); word-break: keep-all; }
  h2 em { font-style: normal; color: var(--kf-accent); }
</style>
</head>
<body>
<p class="demo-hint"><b>char-highlight-scrub</b> — Scroll down and the faint text darkens from the front. Scroll back up and it fades again.</p>
<div class="sp">Scroll down</div>
<h2 data-fx="char-highlight-scrub">Your long title sentence goes here <em>Highlighted Word</em> Through the sentence that follows</h2>
<div class="sp"></div>
<h2 data-fx="char-highlight-scrub" data-demo-remove>Sentence to Be Removed</h2>
<template data-demo-late><h2 data-fx="char-highlight-scrub" data-fx-char-highlight-scrub="fade: .1; each: .05">Late-arriving sentences also darken in the same way</h2></template>
<div class="sp"></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../../../_shared/vendor/gsap/SplitText.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); window.ScrollTrigger?.refresh(); }, 2500);
</script>
</body>
</html>
