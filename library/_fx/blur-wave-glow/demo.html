<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>blur-wave-glow — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { margin: 0; background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; margin: 0; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .cta { position: relative; min-height: 90vh; display: grid; place-items: center; text-align: center; }
  .cta > div:not([data-fx]) { position: relative; z-index: 1; }
  .cta h2 { margin: 0 0 16px; font-size: clamp(32px, 5vw, 70px); font-weight: var(--kf-weight-display); letter-spacing: -2px; }
</style>
</head>
<body>
<p class="demo-hint"><b>blur-wave-glow</b> — Just leave it — three faint layers of waves ripple along the bottom. <span style="color:var(--kf-dim)">(After 1s one more section comes in, and one leaves 2.5s later)</span></p>
<section class="cta"><div data-fx="blur-wave-glow"></div><div><h2>Your footer title here<br>Place it in two lines</h2><p>Your one-line guide here</p></div></section>
<section class="cta" data-demo-remove><div data-fx="blur-wave-glow" data-fx-blur-wave-glow="blur: 8; speed: 2"></div><div><h2>Section to Be Removed</h2></div></section>
<template data-demo-late><section class="cta"><div data-fx="blur-wave-glow"></div><div><h2>Late section</h2></div></section></template>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); window.ScrollTrigger?.refresh(); }, 2500);
</script>
</body>
</html>
