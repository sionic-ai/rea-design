<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>counter-rise-reveal — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 9; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .gap { height: 70vh; display: grid; place-items: center; color: var(--kf-dim); }
  .row { display: flex; flex-wrap: wrap; gap: 24px; padding: 0 24px; }
  .frame { width: 360px; aspect-ratio: 3 / 2; margin: 0; }
  .frame [data-fx-part="media"], .frame .wf-img { position: absolute; inset: 0; height: 100%; }
</style>
</head>
<body>
<p class="demo-hint"><b>counter-rise-reveal</b> — Scroll down. Cells open from below and the photo inside settles down from 1.75x.</p>
<div class="gap">Downward</div>
<div class="row" id="row">
  <figure class="frame" data-fx="counter-rise-reveal"><div data-fx-part="media"><div class="wf-img" data-fx-part="photo" data-label="Landscape 3:2 photo"></div></div></figure>
  <figure class="frame" data-fx="counter-rise-reveal" data-fx-counter-rise-reveal="zoom: 1; dur: 1"><div><div class="wf-img" data-label="zoom 1 · dur 1"></div></div></figure>
  <figure class="frame" data-fx="counter-rise-reveal" data-fx-counter-rise-reveal="zoom: 1.3; delay: .3; ease: power3.out"><div><div class="wf-img" data-label="zoom 1.3 · delay .3"></div></div></figure>
  <figure class="frame" id="gone" data-fx="counter-rise-reveal"><div><div class="wf-img" data-label="Deleting soon"></div></div></figure>
  <figure class="frame" data-fx="counter-rise-reveal"></figure>
</div>
<div class="gap"></div>
<script>
  setTimeout(() => { const f = document.createElement("figure"); f.className = "frame"; f.dataset.fx = "counter-rise-reveal"; f.innerHTML = '<div><div class="wf-img" data-label="Cell after 1s"></div></div>'; document.getElementById("row").append(f); }, 1000);
  setTimeout(() => document.getElementById("gone").remove(), 1500);
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../../../_shared/vendor/gsap/CustomEase.min.js"></script>
<script>gsap.registerPlugin(ScrollTrigger, CustomEase);</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
