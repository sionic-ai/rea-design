<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sink-dim-scrub — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .slab { min-height: 90vh; padding: 60px 40px; font: 600 32px/1.3 var(--kf-font-display); }
  .slab.is-dark { background: var(--kf-contrast-bg); color: var(--kf-contrast-ink); }
  .slab.is-next { position: relative; z-index: 1; background: var(--kf-surface); border-radius: var(--kf-radius-lg) var(--kf-radius-lg) 0 0; }
</style>
</head>
<body>
<p class="demo-hint"><b>sink-dim-scrub</b> — Scroll down. The dark panel sags and darkens, and the next panel covers it <span style="color:var(--kf-dim)">(After 1s one more panel comes in, and one leaves 2.5s later)</span></p>
<section class="slab">Your first edition here</section>
<section class="slab is-dark" data-fx="sink-dim-scrub">Panel that sags and darkens</section>
<section class="slab is-next">The next page slides up over it</section>
<section class="slab is-dark" data-demo-remove data-fx="sink-dim-scrub" data-fx-sink-dim-scrub="y: .2; dim: .7">Dropped Panel</section>
<template data-demo-late><section class="slab is-dark" data-fx="sink-dim-scrub" data-fx-sink-dim-scrub="min: 0">Late-arriving panel</section></template>
<section class="slab is-next">Footer</section>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
gsap.registerPlugin(ScrollTrigger);
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
