<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>heartbeat-hover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .row { display: flex; flex-wrap: wrap; gap: 24px; padding: 40px; }
  .btn { display: inline-flex; align-items: center; gap: 12px; padding: 16px 24px; border-radius: var(--kf-radius-pill); background: var(--kf-surface); border: 1px solid var(--kf-line); color: var(--kf-ink); text-decoration: none; font-weight: 700; }
  .dot { display: inline-block; width: 28px; height: 28px; border-radius: 50%; background: var(--kf-accent); }
</style>
</head>
<body>
<p class="demo-hint"><b>heartbeat-hover</b> — Hover over the button. The circle on the right bounces twice. <span style="color:var(--kf-dim)">(After 1s one more button comes in, and after 2.5s one drops out)</span></p>
<section class="row">
  <a class="btn" href="#" data-fx="heartbeat-hover">View details <i class="dot" data-fx-part="beat"></i></a>
  <a class="btn" href="#" data-fx="heartbeat-hover" style="--fx-peak: 1.5; --fx-dur: .9s">Hard Jump <i class="dot" data-fx-part="beat"></i></a>
  <span class="dot" data-fx="heartbeat-hover" data-demo-remove></span>
  <template data-demo-late><a class="btn" href="#" data-fx="heartbeat-hover">Late-arrived Button <i class="dot" data-fx-part="beat"></i></a></template>
</section>
<script src="../fx-core.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
