<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>paper-curl-flip — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { display: flex; flex-wrap: wrap; gap: 80px; padding: 80px 60px; }
  .plan { width: 320px; aspect-ratio: 1; border-radius: 16px; padding: 20px; box-sizing: border-box; background: var(--kf-accent); color: var(--kf-on-accent); display: flex; flex-direction: column; }
  .plan.is-flipped, .plan.is-peek { background: var(--kf-accent-soft); }
  .plan.is-flipped.is-peek { background: var(--kf-accent); }
  .plan b { font: 600 72px/1 var(--kf-font-display); margin-top: auto; }
  .plan button { align-self: flex-start; margin-top: 12px; padding: 8px 14px; border-radius: var(--kf-radius-pill); border: 1px solid currentColor; background: var(--kf-surface); color: var(--kf-ink); cursor: pointer; font: inherit; }
</style>
</head>
<body>
<p class="demo-hint"><b>paper-curl-flip</b> — Hover “Change” and a corner lifts, press it and the paper rolls over. After 1 second one more card comes in and one drops out.</p>
<section class="demo" id="demo">
  <div class="plan" data-fx="paper-curl-flip"><div data-fx-part="front">Monthly fee</div><div data-fx-part="back">Annual rate</div><b>$12</b><button data-fx-part="flip">Switching</button></div>
  <div class="plan" data-fx="paper-curl-flip" data-fx-paper-curl-flip="corner: tr; dur: .8" id="gone"><div data-fx-part="front">Front</div><div data-fx-part="back">Back</div><b>A</b><button data-fx-part="flip">Switching</button></div>
  <div class="plan" data-fx="paper-curl-flip"></div>
</section>
<script>
  setTimeout(() => {
    const d = document.createElement("div");
    d.className = "plan"; d.dataset.fx = "paper-curl-flip";
    d.innerHTML = '<div data-fx-part="front">Late-arrived card</div><div data-fx-part="back">Turned panel</div><b>$10</b><button data-fx-part="flip">Switching</button>';
    document.getElementById("demo").append(d);
    document.getElementById("gone")?.remove();
  }, 1000);
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../_vendor/ogl@1.0.11/ogl.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
