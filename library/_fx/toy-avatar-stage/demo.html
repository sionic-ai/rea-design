<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>toy-avatar-stage — a doll that spins and changes its move when pressed</title>
  <link rel="stylesheet" href="../../../_shared/wire.css">
  <link rel="stylesheet" href="../../../_shared/kf-defaults.css">
  <link rel="stylesheet" href="fx.css">
  <style>
    body { padding: 32px; font-family: var(--kf-font-sans); }
    .hint { color: var(--kf-dim); font-size: 14px; margin-bottom: 16px; }
    .stage { height: 70vh; border-radius: var(--kf-radius-lg); background: var(--kf-surface); overflow: hidden; }
    .bar { position: absolute; left: 16px; bottom: 16px; z-index: 2; display: flex; flex-wrap: wrap; gap: 8px; }
    .bar button { padding: 8px 14px; border: 1px solid var(--kf-line); border-radius: var(--kf-radius-pill); background: var(--kf-surface); cursor: pointer; }
    .late { height: 40vh; margin-top: 20px; }
  </style>
</head>
<body>
  <p class="hint">Press the button below — the doll spins once and changes its pose. Click the panel for another pose, move the cursor and the camera follows. After 1 second an upper-body panel is added, and it is removed after 3 seconds.</p>
  <section class="stage" data-fx="toy-avatar-stage" data-fx-toy-avatar-stage="view: full">
    <div class="bar">
      <button type="button" data-fx-part="pose" data-pose="wave">Hand Wave</button>
      <button type="button" data-fx-part="pose" data-pose="draw">Drawing</button>
      <button type="button" data-fx-part="pose" data-pose="sing">Song</button>
      <button type="button" data-fx-part="pose" data-pose="dance">Dance</button>
      <button type="button" data-fx-part="pose" data-pose="think">Thought</button>
      <button type="button" data-fx-part="pose" data-pose="cheer">Cheers</button>
    </div>
  </section>
  <script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
  <script src="three-global.js"></script>
  <script src="../../_vendor/three@0.171.0/build/three.cjs"></script>
  <script src="../fx-core.js"></script>
  <script src="fx.js"></script>
  <script>
    setTimeout(() => {
      const s = document.createElement("section");
      s.className = "stage late";
      s.setAttribute("data-fx", "toy-avatar-stage");
      document.body.append(s);
      setTimeout(() => s.remove(), 2000);
    }, 1000);
  </script>
</body>
</html>
