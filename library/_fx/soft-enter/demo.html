<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>soft-enter — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { padding: 48px 20px; }
  .demo-spacer { height: 90vh; display: grid; place-items: center; color: var(--kf-dim); }
 h1 { font: 800 9vw/.9 var(--kf-font-display); } .demo p { margin-top: 20px; max-width: 46ch; } .demo a { display: inline-block; margin-top: 20px; padding: 12px 16px; background: var(--kf-accent); color: var(--kf-on-accent); }
</style>
</head>
<body>
<p class="demo-hint"><b>soft-enter</b> Right on open, the title appears half faded and then sharpens, followed by the description and button (reload to see it). <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<section class="demo"><h1 data-demo-remove data-fx="soft-enter" data-fx-soft-enter="soft: true">Your product name here.</h1><h1 data-fx="soft-enter" data-fx-soft-enter="soft: true">Your product name here.</h1><template data-demo-late><h1 data-fx="soft-enter" data-fx-soft-enter="soft: true">Your product name here.</h1></template><p data-fx="soft-enter">Your key phrase on two lines here.</p><a data-fx="soft-enter" href="#">Your button here</a></section>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/CustomEase.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); window.ScrollTrigger?.refresh(); }, 2500);
</script>
</body>
</html>
