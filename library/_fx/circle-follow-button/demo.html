<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>circle-follow-button — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { padding: 20vh 20px; display: flex; gap: 24px; justify-content: center; flex-wrap: wrap; }
  .btn { display: inline-flex; padding: 1em 1.4em; border-radius: 12px; font-weight: 700; }
  .btn.is-outline { --fx-bg: transparent; --fx-ink: var(--kf-ink); --fx-border: var(--kf-line); --fx-fill: var(--kf-accent); --fx-hover-ink: var(--kf-on-accent); }
</style>
</head>
<body>
<p class="demo-hint"><b>circle-follow-button</b> — Move the mouse onto and off the button from several directions. A circle fills from the entry point and drains out toward the exit side. <span style="color:var(--kf-dim)">(After 1s one more button comes in, and after 2.5s one drops out)</span></p>
<section class="demo">
  <a class="btn" href="#" data-fx="circle-follow-button">Your button text here →</a>
  <a class="btn is-outline" href="#" data-fx="circle-follow-button">Outline Button</a>
  <a class="btn" href="#" data-demo-remove data-fx="circle-follow-button">Soon-Removed Button</a>
  <template data-demo-late><a class="btn" href="#" data-fx="circle-follow-button" data-fx-circle-follow-button="grow: .6">Late-arriving button</a></template>
</section>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/CustomEase.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
