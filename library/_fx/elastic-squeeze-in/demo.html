<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>elastic-squeeze-in — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.6 var(--kf-font-sans); overflow-x: hidden; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-spacer { height: 80vh; display: grid; place-items: center; color: var(--kf-dim); }
  .row { display: flex; flex-wrap: wrap; justify-content: center; gap: 40px; margin: 0 auto 120px; max-width: 1000px; padding: 0 20px; }
  .card { width: 260px; padding: 40px; border: 1px solid var(--kf-line); border-radius: 40px; background: var(--kf-raised); text-align: center; }
  .card b { display: block; font: 700 64px/1 var(--kf-font-display); color: var(--kf-accent); }
</style>
</head>
<body>
<p class="demo-hint"><b>elastic-squeeze-in</b> — Scrolling down presses the card from 1.4x like a rubber stamp into its full size. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<div class="demo-spacer">Scroll down</div>
<div class="row" id="row">
  <div class="card" data-fx="elastic-squeeze-in"><b>100</b>Years and counting</div>
  <div class="card" data-fx="elastic-squeeze-in" data-fx-elastic-squeeze-in="delay: .15"><b>80</b>%</div>
  <div class="card" data-fx="elastic-squeeze-in" data-demo-remove><b>15</b>Card to drop</div>
  <div class="card" data-fx="elastic-squeeze-in" data-fx-elastic-squeeze-in="scale: 1.2; dur: 1.2"><b>120</b>Work · 1.2x</div>
</div>
<template data-demo-late><div class="card" data-fx="elastic-squeeze-in"><b>00</b>Late-arriving card</div></template>
<div class="demo-spacer">Footer</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script>gsap.registerPlugin(ScrollTrigger);</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => { document.querySelectorAll("template[data-demo-late]").forEach((t) => document.getElementById("row").append(t.content.cloneNode(true))); ScrollTrigger.refresh(); }, 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
