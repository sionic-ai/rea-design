<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>step-tilt-hover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .row { display: flex; flex-wrap: wrap; gap: 80px; justify-content: center; padding: 100px 20px 160px; }
  .btn { width: 232px; height: 122px; }
  .plate { display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 8px; border-radius: 40% 46% 38% 44% / 48% 40% 52% 44%; background: var(--kf-ink); color: var(--kf-bg); font-size: 17px; }
  .back { border-radius: 46% 40% 50% 38% / 44% 52% 40% 48%; background: var(--kf-surface); }
</style>
</head>
<body>
<p class="demo-hint"><b>step-tilt-hover</b> — Hover the button. The panel tilts in three clunky steps and reveals the image behind. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<div class="row">
  <a class="btn" href="#" data-fx="step-tilt-hover" style="--fx-x: 124px; --fx-y: 86px; --fx-r: 9deg; --fx-side: right; --fx-edge: bottom"><span class="back" data-fx-part="back"></span><span class="plate" data-fx-part="plate">More records →</span></a>
  <a class="btn" href="#" data-fx="step-tilt-hover" style="--fx-x: -15px; --fx-y: 3px; --fx-r: 1deg; --fx-side: right; --fx-edge: bottom"><span class="plate" data-fx-part="plate">No back image</span></a>
  <a class="btn" href="#" data-demo-remove data-fx="step-tilt-hover" style="--fx-x: -33px; --fx-y: -17px; --fx-r: 30deg; --fx-side: left; --fx-edge: bottom"><span class="back" data-fx-part="back"></span><span class="plate" data-fx-part="plate">Being removed soon</span></a>
  <template data-demo-late><a class="btn" href="#" data-fx="step-tilt-hover" style="--fx-x: 25px; --fx-y: 3px; --fx-r: -1deg; --fx-side: left; --fx-edge: bottom; --fx-steps: 5"><span class="back" data-fx-part="back"></span><span class="plate" data-fx-part="plate">Late · five slots</span></a></template>
  <a class="btn" href="#" data-fx="step-tilt-hover">Blank board</a>
</div>
<script src="../fx-core.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
