<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>season-wipe-swap — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { padding: 30px 20px; display: grid; gap: 24px; }
  nav { display: flex; gap: 6px; }
  nav button { padding: 10px 14px; border: 1px solid var(--kf-line); border-radius: var(--kf-radius-pill); background: var(--kf-bg); color: var(--kf-ink); font: inherit; cursor: pointer; }
  .row { display: grid; grid-template-columns: 2fr 1fr; gap: 16px; }
  .ph { position: relative; overflow: hidden; aspect-ratio: 3 / 2; border-radius: var(--kf-radius-md); }
  .ph > div { display: grid; place-items: end start; padding: 14px; color: var(--kf-on-accent); font-size: 13px; }
  .spring { background: color-mix(in oklab, var(--kf-accent) 40%, var(--kf-bg)); }
  .summer { background: color-mix(in oklab, var(--kf-accent) 70%, var(--kf-bg)); }
  .autumn { background: color-mix(in oklab, var(--kf-accent) 90%, var(--kf-ink)); }
  .winter { background: color-mix(in oklab, var(--kf-dim) 60%, var(--kf-bg)); }
</style>
</head>
<body data-fx="season-wipe-swap" data-fx-season-wipe-swap="remember: ">
<p class="demo-hint"><b>season-wipe-swap</b> — Press the Spring, Summer, Autumn and Winter buttons. All photo cells peel away from the right and change together. <span style="color:var(--kf-dim)">(After 1s one more cell comes in, and one leaves 2.5s later)</span></p>
<section class="demo">
  <nav><button data-fx-part="trigger" data-key="spring">Spring</button><button data-fx-part="trigger" data-key="summer">Summer</button><button data-fx-part="trigger" data-key="autumn">Autumn</button><button data-fx-part="trigger" data-key="winter">Winter</button></nav>
  <div class="row">
    <figure class="ph"><div data-fx-part="item" data-key="spring" class="spring">Spring photo · large slot</div><div data-fx-part="item" data-key="summer" class="summer">Summer photo</div><div data-fx-part="item" data-key="autumn" class="autumn">Autumn Photo</div><div data-fx-part="item" data-key="winter" class="winter">Winter photos</div></figure>
    <figure class="ph" data-demo-remove><div data-fx-part="item" data-key="spring" class="spring">Spring · omitted cell</div><div data-fx-part="item" data-key="summer" class="summer">Summer</div><div data-fx-part="item" data-key="autumn" class="autumn">Autumn</div><div data-fx-part="item" data-key="winter" class="winter">Winter</div></figure>
  </div>
  <div data-late-slot></div>
  <template data-demo-late><figure class="ph" style="max-width:420px"><div data-fx-part="item" data-key="spring" class="spring">Spring · late-arriving slot</div><div data-fx-part="item" data-key="summer" class="summer">Summer</div><div data-fx-part="item" data-key="autumn" class="autumn">Autumn</div><div data-fx-part="item" data-key="winter" class="winter">Winter</div></figure></template>
</section>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => document.querySelector("[data-late-slot]").replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
