<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>scatter-name-swap — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { height: 70vh; margin: 20px; background: var(--kf-contrast-bg); color: var(--kf-contrast-ink); }
  .demo .wf-img { position: absolute; inset: 0; height: 100%; }
  .demo-name { position: absolute; left: 24px; bottom: 60px; z-index: 2; font: 600 12vw/0.8 var(--kf-font-display); text-transform: uppercase; display: flex; gap: 2vw; }
  .demo-dots { position: absolute; left: 24px; bottom: 20px; z-index: 9; display: flex; gap: 8px; }
  .demo-dots button { width: 12px; height: 12px; border-radius: 50%; border: 1px solid currentColor; background: none; color: var(--kf-contrast-ink); padding: 0; }
  .demo-dots .is-active { background: currentColor; }
</style>
</head>
<body>
<p class="demo-hint"><b>scatter-name-swap</b> — Every 3s (immediately if a dot is clicked) the next page peels in from the right and the name letters scatter and regather.</p>
<section class="demo" data-fx="scatter-name-swap" data-fx-scatter-name-swap="every: 3">
  <article data-fx-part="slide" class="is-active"><div class="wf-img" data-fx-part="img" data-label="Photo 1"></div><div class="demo-name"><span data-fx-part="char">O</span><span data-fx-part="char">N</span><span data-fx-part="char">E</span></div></article>
  <article data-fx-part="slide"><div class="wf-img" data-fx-part="img" data-label="Photo 2"></div><div class="demo-name"><span data-fx-part="char">T</span><span data-fx-part="char">W</span><span data-fx-part="char">O</span></div></article>
  <article data-fx-part="slide"><div class="wf-img" data-fx-part="img" data-label="Photo 3"></div><div class="demo-name"><span data-fx-part="char">S</span><span data-fx-part="char">I</span><span data-fx-part="char">X</span></div></article>
  <div class="demo-dots"><button data-fx-part="dot" class="is-active" aria-label="1"></button><button data-fx-part="dot" aria-label="2"></button><button data-fx-part="dot" aria-label="3"></button></div>
</section>
<script>
(() => {
  const src = document.querySelector('[data-fx~="scatter-name-swap"]');
  if (!src) return;
  const t = document.createElement("template");
  t.innerHTML = src.outerHTML;
  const late = t.content.firstElementChild;
  late.dataset.demo = "late";
  setTimeout(() => src.after(late), 1000);
  setTimeout(() => late.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s one more of the same section comes in, then leaves after 2.5s (detach).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/CustomEase.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
