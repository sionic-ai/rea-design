<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mark-blink-sweep-loader — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo-page { min-height: 120vh; padding: 60px 20px; }
  .demo-page h1 { font-size: 48px; margin: 0 0 16px; }
  .demo-btn { padding: 10px 18px; border: 1px solid var(--kf-line); background: var(--kf-surface); color: var(--kf-ink); font: inherit; cursor: pointer; }
  [data-fx-part="mark"] svg { width: 100%; height: 100%; fill: currentColor; }
  #state { color: var(--kf-dim); }
</style>
</head>
<body>
<div data-fx="mark-blink-sweep-loader" id="loader" aria-hidden="true">
  <span data-fx-part="mark"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="40"/></svg></span>
  <span data-fx-part="mark"><svg viewBox="0 0 100 100"><rect x="14" y="14" width="72" height="72"/></svg></span>
  <span data-fx-part="mark"><svg viewBox="0 0 100 100"><polygon points="50,8 92,92 8,92"/></svg></span>
  <span data-fx-part="mark"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="40"/><circle cx="50" cy="50" r="22" fill-opacity="0"/></svg></span>
</div>
<p class="demo-hint"><b>mark-blink-sweep-loader</b> — On open, four marks blink in turn, and at 1.5 seconds a dark curtain sweeps off to the right. You can replay it with the button. <span id="state"></span></p>
<div class="demo-page">
  <h1>Your Hero title here</h1>
  <button class="demo-btn" type="button" id="again">View again</button>
  <div data-demo-remove data-fx="mark-blink-sweep-loader" style="display:none"></div>
  <div data-fx="mark-blink-sweep-loader" style="display:none"></div>
</div>
<template data-demo-late><div data-fx="mark-blink-sweep-loader" data-fx-mark-blink-sweep-loader="sweep: 0; dur: 0" style="display:none"><span data-fx-part="mark"></span></div></template>

<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
document.addEventListener("fx:done", (e) => { if (e.target.id === "loader") document.getElementById("state").textContent = "(fx:done received)"; });
document.getElementById("again").addEventListener("click", () => {
  const l = document.getElementById("loader"), c = l.cloneNode(true);
  l.replaceWith(c);
  document.getElementById("state").textContent = "";
});
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); }, 2500);
</script>
</body>
</html>
