<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bounce-in-drawer — Menu panel that bounces in</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { min-height: 160vh; padding: 40px; }
  .demo-head { position: sticky; top: 0; display: flex; justify-content: flex-end; padding: 16px; }
  .demo-toggle { position: relative; z-index: 20; padding: 10px 16px; border: 1px solid var(--kf-ink); background: var(--kf-bg); cursor: pointer; }
  .demo-panel { position: fixed; inset: 0; z-index: 10; background: var(--kf-accent); }
  .demo-panel__card { position: absolute; inset: 10px; padding: 80px 30px; border-radius: var(--kf-radius-lg); background: var(--kf-surface); }
  .demo-panel a { display: block; margin-top: 16px; font-size: 24px; }
</style>
</head>
<body>
<p>Press MENU at the top right — the panel bounces in from the right, and closes when you press again, hit Esc or click a link.</p>
<header class="demo-head" data-fx="bounce-in-drawer">
  <button class="demo-toggle" type="button" data-fx-part="toggle">MENU</button>
  <nav class="demo-panel" data-fx-part="panel" aria-label="Menu">
    <div class="demo-panel__card">
      <a href="#" data-fx-part="close">Menu 1</a>
      <a href="#" data-fx-part="close">Menu 2</a>
      <a href="#" data-fx-part="close">Menu 3</a>
    </div>
  </nav>
</header>
<div data-fx="bounce-in-drawer" data-demo-remove><button type="button" data-fx-part="toggle">Button to Be Removed</button><div data-fx-part="panel"></div></div>
<template data-demo-late><div data-fx="bounce-in-drawer" data-fx-bounce-in-drawer="dur: .6; lock: 0"><button type="button" data-fx-part="toggle">Late-arriving button</button><div data-fx-part="panel" style="position:fixed;inset:20%;background:var(--kf-raised)"><a href="#" data-fx-part="close">Close</a></div></div></template>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
