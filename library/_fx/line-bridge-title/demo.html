<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>line-bridge-title — title with two words joined by a line</title>
  <link rel="stylesheet" href="../../../_shared/wire.css">
  <link rel="stylesheet" href="../../../_shared/kf-defaults.css">
  <link rel="stylesheet" href="fx.css">
  <style>
    body { margin: 0; background: var(--kf-bg); color: var(--kf-ink); font-family: var(--kf-font-sans); }
    .hint { padding: 2rem; color: var(--kf-dim); }
    .gap { height: 80vh; }
    .big { margin: 0 2rem; font-size: clamp(2.5rem, 7vw, 6rem); font-weight: 700; letter-spacing: -.03em; text-transform: uppercase; line-height: .9; }
  </style>
</head>
<body>
  <p class="hint">Scroll down — when the title appears the line unfolds from the center and two words rise up</p>
  <div class="gap"></div>
  <h2 class="big" data-fx="line-bridge-title"><span data-fx-part="word">On</span><span data-fx-part="line"></span><span data-fx-part="word">Court</span></h2>
  <div class="gap"></div>
  <h2 class="big drop" data-fx="line-bridge-title" data-fx-line-bridge-title="once: true"><span data-fx-part="word">Off</span><span data-fx-part="line"></span><span data-fx-part="word">Court</span></h2>
  <div id="late"></div>
  <div class="gap"></div>
  <script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
  <script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
  <script src="../fx-core.js"></script>
  <script src="fx.js"></script>
  <script>
    gsap.registerPlugin(ScrollTrigger);
    setTimeout(() => {
      const h = document.createElement("h2");
      h.className = "big"; h.dataset.fx = "line-bridge-title";
      h.innerHTML = '<span data-fx-part="word">Late</span><span data-fx-part="line"></span><span data-fx-part="word">Title</span>';
      document.getElementById("late").append(h);
      document.querySelector(".drop")?.remove();
    }, 1000);
  </script>
</body>
</html>
