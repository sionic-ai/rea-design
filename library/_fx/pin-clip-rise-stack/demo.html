<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pin-clip-rise-stack — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: fixed; top: 0; left: 0; right: 0; z-index: 10; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .gap { height: 70vh; padding: 80px 40px; }
  .panel { display: grid; grid-template-columns: 1.2fr 1fr; gap: 40px; align-items: center; height: 70vh; padding: 0 40px; color: inherit; text-decoration: none; }
  .frame { height: 100%; overflow: hidden; }
  .media { height: 100%; background: linear-gradient(160deg, var(--kf-accent-soft), var(--kf-raised)); }
  .panel:nth-child(2) .media { background: linear-gradient(160deg, var(--kf-raised), var(--kf-accent)); }
  .panel:nth-child(3) .media { background: linear-gradient(160deg, var(--kf-line), var(--kf-accent-soft)); }
</style>
</head>
<body>
<p class="demo-hint"><b>pin-clip-rise-stack</b> — Scroll down. The panel stays pinned while the next panel opens from below and covers it. <span style="color:var(--kf-dim)">(After 1s one more panel group comes in, and after 2.5s one leaves)</span></p>
<div class="gap">Top section</div>
<div data-fx="pin-clip-rise-stack" data-fx-pin-clip-rise-stack="step: 900; open: 450">
  <div data-fx-part="stage">
    <a class="panel" data-fx-part="panel" href="#"><div class="frame"><div class="media" data-fx-part="media"></div></div><p>Panel 1</p></a>
    <a class="panel" data-fx-part="panel" href="#"><div class="frame"><div class="media" data-fx-part="media"></div></div><p>Panel 2</p></a>
    <a class="panel" data-fx-part="panel" href="#"><div class="frame"><div class="media" data-fx-part="media"></div></div><p>Panel 3</p></a>
  </div>
</div>
<div class="gap">Lower section</div>
<div data-fx="pin-clip-rise-stack" data-demo-remove><div data-fx-part="stage"><div data-fx-part="panel">Removed soon 1</div><div data-fx-part="panel">Removed soon 2</div></div></div>
<template data-demo-late><div data-fx="pin-clip-rise-stack" data-fx-pin-clip-rise-stack="step: 400; open: 200; zoom: 1.2"><div data-fx-part="stage"><div class="panel" data-fx-part="panel"><div class="frame"><div class="media" data-fx-part="media"></div></div><p>Late arrival 1</p></div><div class="panel" data-fx-part="panel"><div class="frame"><div class="media" data-fx-part="media"></div></div><p>Late arrival 2</p></div></div></div></template>
<div data-fx="pin-clip-rise-stack"></div>
<div class="gap">Footer</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
