<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>scroll-sideways-gallery — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-panel { height: 70vh; margin: 20px; background: var(--kf-surface); border: 1px solid var(--kf-line); }
  .demo-track { gap: 20px; padding: 40px; height: 70vh; }
  .demo-info { min-width: 320px; }
  .demo-track .wf-img { height: 100%; width: auto; }
</style>
</head>
<body>
<p class="demo-hint"><b>scroll-sideways-gallery</b> — Roll the wheel over the lower panel. The photo row flows sideways as much as you scroll (1024px and up).</p>
<div class="demo-panel" data-fx="scroll-sideways-gallery" data-demo-root>
  <div data-fx-part="inner">
    <div class="demo-track" data-fx-part="track">
      <div class="demo-info"><h3>Work title</h3><p>Your two-line work intro here.</p></div>
      <div class="wf-img" style="aspect-ratio: 2 / 3" data-label="Vertical Photo"></div>
      <div class="wf-img" style="aspect-ratio: 3 / 2" data-label="Landscape photo"></div>
      <div class="wf-img" style="aspect-ratio: 2 / 3" data-label="Vertical Photo"></div>
      <div class="wf-img" style="aspect-ratio: 3 / 2" data-label="Landscape photo"></div>
    </div>
  </div>
</div>
<div data-demo-late-host></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Attach to one late-arriving board and detach after 1.5s to test
setTimeout(() => {
  const root = document.querySelector("[data-demo-root]");
  if (!root) return;
  const late = root.cloneNode(true);
  late.removeAttribute("data-demo-root");
  document.querySelector("[data-demo-late-host]")?.append(late);
  setTimeout(() => late.remove(), 1500);
}, 1000);
</script>
</body>
</html>
