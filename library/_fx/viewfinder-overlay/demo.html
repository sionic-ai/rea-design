<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>viewfinder-overlay — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-bar { position: sticky; top: 0; z-index: 100; height: 64px; display: flex; align-items: center; padding: 0 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-band { height: 80vh; display: grid; place-items: center; }
  .demo-band.is-dark { background: var(--kf-contrast-bg); color: var(--kf-contrast-ink); }
</style>
</head>
<body>
<p class="demo-bar" id="demo-bar"><b>viewfinder-overlay</b>&nbsp;— Scroll. Corner brackets, center crosshair and REC stay fixed on screen and invert over light and dark sections.</p>
<div data-fx="viewfinder-overlay" data-fx-viewfinder-overlay="top: #demo-bar"></div>
<section class="demo-band">Light section</section>
<section class="demo-band is-dark">Dark Section</section>
<section class="demo-band">Light section</section>
<script>
// Late arrivals and removals — checks that fx-core attaches to an element added after 1s and detaches from an element removed after 2.5s
(() => {
  const src = document.querySelector('[data-fx~="viewfinder-overlay"]');
  if (!src) return;
  const html = src.outerHTML.replace(/\sid="[^"]*"/g, "");
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => src.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-bar").append(" · After 1s another identical one comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
