<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pin-photo-pass — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .gap { height: 60vh; display: grid; place-items: center; color: var(--kf-dim); }
  .demo { display: flex; align-items: center; justify-content: center; }
  .demo h2 { max-width: 12ch; text-align: center; font: var(--kf-weight-display) clamp(48px, 8vw, 120px)/1 var(--kf-font-display); }
  .demo figure { width: clamp(120px, 18vw, 280px); aspect-ratio: 1; margin: 0; }
</style>
</head>
<body>
<p class="demo-hint"><b>pin-photo-pass</b> — Scroll down. With the sentence attached, the photos pass from bottom to top. <span style="color:var(--kf-dim)">(One more photo comes in after 1s, and one drops out after 2.5s)</span></p>
<div class="gap">Downward</div>
<section class="demo" id="box" data-fx="pin-photo-pass">
  <h2 data-fx-part="title">Your center sentence here</h2>
  <figure class="wf-img" data-fx-part="photo" data-label="Work photo 1 · 1:1" style="top:60vh; right:15vw"></figure>
  <figure class="wf-img" data-fx-part="photo" data-label="Work photo 2 · 1:1" style="top:85vh; left:20vw"></figure>
  <figure class="wf-img" data-fx-part="photo" data-label="Work photo 3 · 1:1" style="top:120vh; right:25vw" data-demo-remove></figure>
  <figure class="wf-img" data-fx-part="photo" data-label="Work photo 4 · 1:1" style="top:150vh; left:6vw"></figure>
</section>
<section data-fx="pin-photo-pass" style="height:40vh"></section>
<div class="gap">Footer</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => { const s = document.createElement("section"); s.className = "demo"; s.dataset.fx = "pin-photo-pass"; s.style.height = "60vh"; s.innerHTML = '<h2 data-fx-part="title">Late section</h2><figure class="wf-img" data-fx-part="photo" data-label="Late Photo · 1:1" style="top:50vh; right:10vw"></figure>'; document.querySelector(".gap:last-of-type").before(s); }, 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
