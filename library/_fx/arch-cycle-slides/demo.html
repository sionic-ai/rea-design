<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>arch-cycle-slides — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { display: flex; gap: 30px; height: 70vh; padding: 40px 20px 0; }
  .demo [data-fx-part="frame"] { flex: 1; height: 100%; }
  .demo .wf-img { height: 100%; border: 0; }
  .single { width: 280px; height: 60vh; margin: 40px auto; }
  .single [data-fx-part="frame"] { height: 100%; }
</style>
</head>
<body>
<p class="demo-hint"><b>arch-cycle-slides</b> — After 1.6s the arch windows open in turn, every 6s the photos swap staggered cell by cell and slowly zoom in. After 1s one fixed cell comes in, and the second group drops out.</p>
<div class="demo" data-fx="arch-cycle-slides">
  <div data-fx-part="frame"><div data-fx-part="list"><div data-fx-part="item"><div class="wf-img" data-label="Photo 1"></div></div><div data-fx-part="item"><div class="wf-img" data-label="Photo 2"></div></div><div data-fx-part="item"><div class="wf-img" data-label="Photo 3"></div></div></div></div>
  <div data-fx-part="frame"><div data-fx-part="list"><div data-fx-part="item"><div class="wf-img" data-label="Photo 1"></div></div><div data-fx-part="item"><div class="wf-img" data-label="Photo 2"></div></div><div data-fx-part="item"><div class="wf-img" data-label="Photo 3"></div></div></div></div>
  <div data-fx-part="frame"><div data-fx-part="list"><div data-fx-part="item"><div class="wf-img" data-label="Photo 1"></div></div><div data-fx-part="item"><div class="wf-img" data-label="Photo 2"></div></div><div data-fx-part="item"><div class="wf-img" data-label="Photo 3"></div></div></div></div>
</div>
<div class="demo" id="gone" data-fx="arch-cycle-slides" data-fx-arch-cycle-slides="intro: clip; dur: 2; delay: 1"><div data-fx-part="frame"><div data-fx-part="list"><div data-fx-part="item"><div class="wf-img" data-label="Omitted group"></div></div></div></div></div>
<div id="late"></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/CustomEase.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
  setTimeout(() => {
    document.getElementById("late").innerHTML = '<div class="single" data-fx="arch-cycle-slides" data-fx-arch-cycle-slides="delay: 0"><div data-fx-part="frame"><div data-fx-part="list"><div data-fx-part="item"><div class="wf-img" data-label="Late 1"></div></div><div data-fx-part="item"><div class="wf-img" data-label="Late 2"></div></div></div></div></div>';
    document.getElementById("gone")?.remove();
  }, 1000);
</script>
</body>
</html>
