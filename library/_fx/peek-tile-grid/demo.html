<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>peek-tile-grid — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 40; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 2px; margin: 60px 0; }
  .grid a { aspect-ratio: 1; background: var(--kf-raised); }
  .grid .wf-img { position: absolute; inset: 0; height: 100%; border: 0; }
  .grid [data-fx-part="art"] { inset: 12% 17.5% auto; aspect-ratio: 1; display: grid; place-items: center; border: 2px solid var(--kf-ink); border-radius: 50%; font: 600 13px var(--kf-font-mono); }
  .grid .meta { position: absolute; left: 20px; right: 20px; bottom: 16px; display: flex; justify-content: space-between; align-items: flex-end; }
  .grid [data-fx-part="role"] { display: block; font-size: 13px; }
  .grid [data-fx-part="name"] { display: block; font: 600 20px var(--kf-font-display); }
  .grid [data-fx-part="arrow"] { width: 18px; color: var(--kf-accent); }
  .gap { height: 40vh; }
</style>
</head>
<body>
<p class="demo-hint"><b>peek-tile-grid</b> — Hover over a cell. One cell opens by itself every 2.6s. <span style="color:var(--kf-dim)">(After 1s one more grid comes in, and after 2.5s one drops out)</span></p>
<div class="grid" data-fx="peek-tile-grid" id="g"></div>
<div class="grid" data-fx="peek-tile-grid" data-demo-remove></div>
<div class="grid" data-fx="peek-tile-grid"></div>
<div class="gap"></div>
<template data-demo-late><div class="grid" data-fx="peek-tile-grid" data-fx-peek-tile-grid="every: 0; instant: 1"></div></template>
<script>
const tile = (i) => `<a data-fx-part="tile" href="#"><span data-fx-part="cover"><span class="wf-img" data-label="Portrait front · 1:1"></span><span class="wf-img" data-fx-part="after" data-label="Portrait playful pose · 1:1"></span></span><span data-fx-part="art">Figure ${i + 1}</span><span class="meta"><span><span data-fx-part="role">UI Design</span><b data-fx-part="name">Member Name ${i + 1}</b></span><svg data-fx-part="arrow" viewBox="0 0 20 20"><path d="M3 10h13M11 4.5 16.5 10 11 15.5" fill="none" stroke="currentColor" stroke-width="2"/></svg></span></a>`;
document.querySelectorAll(".grid").forEach((g, k) => { if (k < 2) g.innerHTML = Array.from({ length: 8 }, (_, i) => tile(i)).join(""); });
</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => { const n = t.content.cloneNode(true); n.firstElementChild.innerHTML = Array.from({ length: 4 }, (_, i) => tile(i)).join(""); t.replaceWith(n); }), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
