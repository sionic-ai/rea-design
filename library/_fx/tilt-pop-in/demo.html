<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tilt-pop-in — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-spacer { height: 80vh; display: grid; place-items: center; color: var(--kf-dim); }
  .row { display: flex; gap: 32px; justify-content: center; padding: 40px 20px 30vh; flex-wrap: wrap; }
  .card { width: 220px; height: 300px; border-radius: 150px 150px 0 0; background: var(--kf-surface); box-shadow: var(--kf-shadow-lift); display: grid; place-items: center; }
</style>
</head>
<body>
<p class="demo-hint"><b>tilt-pop-in</b> — Scroll down. The card rises tilted and then straightens up.</p>
<div class="demo-spacer">Scroll down</div>
<div class="row">
  <div class="card" data-fx="tilt-pop-in">Card 1</div>
  <div class="card" data-fx="tilt-pop-in">Card 2</div>
  <div class="card" data-fx="tilt-pop-in" data-fx-tilt-pop-in="tilt: 0; y: 80">Card 3 · tilt 0</div>
</div>
<script>
(() => {
  const src = document.querySelector('[data-fx~="tilt-pop-in"]');
  if (!src || !src.parentNode) return;
  const host = src.parentNode;
  const make = (tag) => { const el = src.cloneNode(true); el.textContent = tag; return el; };
  const gone = make("Card to drop");
  src.after(gone);
  setTimeout(() => host.append(make("Late-arrived card")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s one more card comes in, and after 2.5s one drops out.");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
