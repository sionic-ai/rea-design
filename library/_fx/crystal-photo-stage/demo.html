<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>crystal-photo-stage — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 500 15px/1.6 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 10; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .stage { height: 70vh; margin: 20px; }
  .stage.is-small { height: 40vh; }
</style>
</head>
<body>
<p class="demo-hint"><b>crystal-photo-stage</b> — Just watch. From 3s on, each time the photo changes a glass crystal turns at an angle and bends the photo behind it. <span style="color:var(--kf-dim)">(One more stage comes in after 1s, and one drops out after 2.5s)</span></p>
<div class="stage" data-fx="crystal-photo-stage" data-fx-crystal-photo-stage="cycle: 6"><canvas data-fx-part="photo" width="600" height="400"></canvas><canvas data-fx-part="photo" width="600" height="400"></canvas><canvas data-fx-part="photo" width="600" height="400"></canvas></div>
<div class="stage is-small" data-fx="crystal-photo-stage" data-demo-remove><canvas data-fx-part="photo" width="600" height="400"></canvas><canvas data-fx-part="photo" width="600" height="400"></canvas></div>
<div class="stage is-small" data-fx="crystal-photo-stage"></div>
<template data-demo-late><div class="stage is-small" data-fx="crystal-photo-stage"><canvas data-fx-part="photo" width="600" height="400"></canvas><canvas data-fx-part="photo" width="600" height="400"></canvas></div></template>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="three-pre.js"></script>
<script src="../../_vendor/three@0.182.0/build/three.cjs"></script>
<script src="three-post.js"></script>
<script>
// Demo photo slot — a striped panel painted with skin variables (so the grain the glass bends is visible)
const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const paint = (root) => root.querySelectorAll("canvas[data-fx-part=photo]").forEach((c, i) => {
  const g = c.getContext("2d");
  g.fillStyle = css(i % 2 ? "--kf-accent" : "--kf-ink-soft"); g.fillRect(0, 0, 600, 400);
  g.fillStyle = css("--kf-surface");
  for (let x = 0; x < 600; x += 60) g.fillRect(x + i * 10, 0, 18, 400);
});
paint(document);
</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => { const n = t.content.cloneNode(true); paint(n); t.replaceWith(n); }), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
