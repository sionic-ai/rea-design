<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sine-jiggle-hover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 600 18px/1.6 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 10; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  nav { display: flex; gap: 32px; justify-content: center; margin: 96px auto; }
</style>
</head>
<body>
<p class="demo-hint"><b>sine-jiggle-hover</b> — Hover over the menu text. The letters ripple with a quick shudder once. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<nav>
  <a href="#" data-fx="sine-jiggle-hover">Access</a>
  <a href="#" data-fx="sine-jiggle-hover">Menu one two</a>
  <a href="#" data-fx="sine-jiggle-hover" data-fx-sine-jiggle-hover="peak: 5">Shop &amp; Restaurant</a>
  <a href="#" data-fx="sine-jiggle-hover" data-demo-remove>Omitted link</a>
</nav>
<template data-demo-late><nav><a href="#" data-fx="sine-jiggle-hover" data-fx-sine-jiggle-hover="peak: 8; down: 1">Late-arriving link</a></nav></template>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
