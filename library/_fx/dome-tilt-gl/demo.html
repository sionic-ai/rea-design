<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dome-tilt-gl — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { margin: 0; background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .col { display: grid; gap: 40vh; padding: 60vh 20px; justify-items: start; }
  .pic { position: relative; width: min(670px, 90vw); aspect-ratio: 16 / 10; }
  .pic.s { width: min(440px, 70vw); justify-self: end; }
</style>
</head>
<body>
<p class="demo-hint"><b>dome-tilt-gl</b> — Scroll slowly. The photo panel stays still and the convex image inside rotates in space by how far it is off the screen center.</p>
<div class="col">
  <div class="pic" data-fx="dome-tilt-gl" data-label="Indoor photo · landscape 16:10"></div>
  <div class="pic s" data-fx="dome-tilt-gl" data-fx-dome-tilt-gl="flip: 1" data-label="Small photo · Rotates in reverse"></div>
  <div class="pic" data-demo-remove data-fx="dome-tilt-gl" data-label="Panel that disappears after 2.5s"></div>
  <template data-demo-late><div class="pic s" data-fx="dome-tilt-gl" data-fx-dome-tilt-gl="dome: 0; tilt: .2" data-label="Late-arriving flat panel"></div></template>
  <div class="pic" data-fx="dome-tilt-gl"></div>
</div>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
