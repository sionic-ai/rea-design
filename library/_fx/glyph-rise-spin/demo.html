<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>glyph-rise-spin — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.6 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .gap { height: 120vh; display: grid; place-items: center; color: var(--kf-dim); }
  footer { min-height: 70vh; padding: 40px; border-top: 1px solid var(--kf-line); display: flex; flex-direction: column; gap: 40px; justify-content: flex-end; }
  .mark { font: var(--kf-weight-display) 18vw/0.9 var(--kf-font-display); letter-spacing: -0.04em; white-space: nowrap; }
  .mark [data-fx-part="star"] { font-size: 0.6em; vertical-align: top; }
</style>
</head>
<body>
<p class="demo-hint"><b>glyph-rise-spin</b> Scroll down. When the top of the footer reaches the center of the screen, the letters rise in sequence and the asterisk spins twice. <span style="color:var(--kf-dim)">(After 1s a second footer comes in, after 2.5s one empty footer leaves)</span></p>
<div class="gap">Downward</div>
<footer data-fx="glyph-rise-spin" data-demo-remove></footer>
<footer data-fx="glyph-rise-spin">
  <div class="mark"><span data-fx-part="glyph">S</span><span data-fx-part="glyph">t</span><span data-fx-part="glyph">u</span><span data-fx-part="glyph">d</span><span data-fx-part="glyph">i</span><span data-fx-part="glyph">o</span><span data-fx-part="star">*</span></div>
</footer>
<div data-late-slot></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script>gsap.registerPlugin(ScrollTrigger);</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelector("[data-late-slot]").outerHTML = '<div class="gap">Further Down</div><footer data-fx="glyph-rise-spin" data-fx-glyph-rise-spin="each: .1; spin: 360"><div class="mark"><span data-fx-part="glyph">Late</span><span data-fx-part="glyph">Crab</span><span data-fx-part="star">*</span></div></footer>', 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
