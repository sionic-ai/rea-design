<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>logo-rise-veil — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { margin: 0; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .logo { width: 240px; max-width: 70vw; height: auto; color: var(--kf-on-accent); }
  main { padding: 40px 20px; }
  button { font: inherit; padding: 8px 14px; }
</style>
</head>
<body>
<p class="demo-hint"><b>logo-rise-veil</b> — Refresh to see it. A logo rises in the middle of the curtain, and 1.8s later the curtain blurs and lifts. Press the button to put the curtain back.</p>
<main id="main">
  <p>Your hero is here.</p>
  <button type="button" id="again">Reattach the curtain</button>
</main>
<div data-fx="logo-rise-veil" id="veil"><svg class="logo" data-fx-part="logo" viewBox="0 0 240 109" aria-label="Logo"><text x="120" y="80" text-anchor="middle" font-size="80" font-style="italic" fill="currentColor">LOGO</text></svg></div>
<script>
// Late arrivals and removals — after 1 second an empty curtain (no logo) comes in (late arrival), and after 2.5 seconds the first curtain is pulled out (detach)
(() => {
  const late = document.createElement("div");
  setTimeout(() => { late.dataset.fx = "logo-rise-veil"; late.setAttribute("data-fx-logo-rise-veil", "min: 0; max: .5; fade: .3"); document.body.append(late); }, 1000);
  setTimeout(() => document.getElementById("veil").remove(), 2500);
  document.getElementById("again").addEventListener("click", () => {
    const v = document.createElement("div");
    v.dataset.fx = "logo-rise-veil";
    v.innerHTML = '<svg class="logo" data-fx-part="logo" viewBox="0 0 240 109"><text x="120" y="80" text-anchor="middle" font-size="80" font-style="italic" fill="currentColor">LOGO</text></svg>';
    document.body.append(v);
  });
})();
</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
