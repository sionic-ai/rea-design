<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tri-grid-unveil — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo-board { height: 70vh; margin: 24px 20px; overflow: hidden; background: var(--kf-accent); color: var(--kf-on-accent); display: grid; place-items: center; }
  .demo-board h2 { position: relative; z-index: 1; font: 800 56px/1 var(--kf-font-display); }
  .demo-row { padding: 0 20px 48px; font: 13px var(--kf-font-mono); }
  .demo-row button { padding: 6px 12px; border: 1px solid var(--kf-line); background: var(--kf-surface); cursor: pointer; }
</style>
</head>
<body>
<p class="demo-hint"><b>tri-grid-unveil</b> — When opened, the triangular covers of the grid cells close in toward the corners from the center outward, revealing the accent-color panel. Press ”Again” to restart with a new panel.</p>
<div class="demo-board" data-fx="tri-grid-unveil"><h2>Your logo here</h2></div>
<p class="demo-row"><button type="button" id="again">Again</button></p>
<script>
document.getElementById("again").addEventListener("click", () => {
  const old = document.querySelector('.demo-board[data-fx~="tri-grid-unveil"]');
  const t = document.createElement("template"); t.innerHTML = '<div class="demo-board" data-fx="tri-grid-unveil"><h2>Your logo here</h2></div>';
  old.replaceWith(t.content.firstElementChild);
});
</script>
<script>
// Late arrivals and removals — checks that fx-core attaches to an element added after 1s and detaches from an element removed after 2.5s
(() => {
  const src = document.querySelector('[data-fx~="tri-grid-unveil"]');
  if (!src) return;
  const html = src.outerHTML.replace(/\sid="[^"]*"/g, "");
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => src.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical one comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
