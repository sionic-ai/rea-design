<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>wheel-swap-pin — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 5; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .gap { height: 60vh; display: grid; place-items: center; color: var(--kf-dim); }
  .bg { background: var(--kf-raised); } .bg + .bg { background: var(--kf-surface); }
  .it { display: flex; align-items: center; justify-content: center; gap: 40px; }
  .it .wf-img { width: min(280px, 40vw); aspect-ratio: 3 / 4; }
  .t { display: flex; align-items: center; justify-content: center; font: 700 12vw/1 var(--kf-font-display); color: var(--kf-line); }
</style>
</head>
<body>
<p class="demo-hint"><b>wheel-swap-pin</b> — Scroll down — the panel stays fixed on screen while items turn over like a wheel.</p>
<div class="gap">↓</div>
<section data-fx="wheel-swap-pin" id="w">
  <div data-fx-part="stage">
    <div class="bg" data-fx-part="bg"></div><div class="bg" data-fx-part="bg"></div><div class="bg" data-fx-part="bg"></div>
    <div class="t" data-fx-part="backdrop">TITLE</div>
    <article class="it" data-fx-part="item"><div class="wf-img" data-label="One cover · Vertical 3:4"></div><p>Your single intro here</p></article>
    <article class="it" data-fx-part="item"><div class="wf-img" data-label="Cover Two · Portrait 3:4"></div><p>Your second intro here</p></article>
    <article class="it" data-fx-part="item"><div class="wf-img" data-label="Cover Three · Portrait 3:4"></div><p>Your third intro here</p></article>
  </div>
  <div data-fx-part="step"></div><div style="height:33vh"></div><div data-fx-part="step"></div><div style="height:90vh"></div>
</section>
<div class="gap" id="late">Footer</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script>gsap.registerPlugin(ScrollTrigger);</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
  setTimeout(() => { const s = document.createElement("section"); s.dataset.fx = "wheel-swap-pin"; s.innerHTML = '<div data-fx-part="stage"><article data-fx-part="item">Late One</article><article data-fx-part="item">Late two</article></div><div data-fx-part="step"></div>'; document.getElementById("late")?.after(s); setTimeout(() => s.remove(), 500); }, 1000);
</script>
</body>
</html>
