<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>contour-blob-gl — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .stage { height: 78vh; }
  .row { display: flex; gap: 10px; padding: 0 20px 12px; }
  .row button { padding: 8px 14px; border: 1px solid var(--kf-line); border-radius: var(--kf-radius-pill); background: var(--kf-surface); color: var(--kf-ink); font: 500 13px/1 var(--kf-font-sans); cursor: pointer; }
  .small { height: 40vh; margin: 20px; border: 1px solid var(--kf-line); }
</style>
</head>
<body>
<p class="demo-hint"><b>contour-blob-gl</b> — Move the mouse toward the object. The closer you get, the thicker the lines, and dragging spins it. The buttons below change the shape. <span style="color:var(--kf-dim)">(After 1s one more panel comes in, and one leaves 2.5s later)</span></p>
<section class="stage" data-fx="contour-blob-gl" id="main"></section>
<div class="row">
  <button type="button" data-shape="sphere">Nine</button>
  <button type="button" data-shape="star">Star balloon</button>
  <button type="button" data-shape="blob">Chunk</button>
</div>
<section class="small" data-fx="contour-blob-gl" data-fx-contour-blob-gl="shape: blob; size: .7" data-demo-remove></section>
<template data-demo-late><section class="small" data-fx="contour-blob-gl" data-fx-contour-blob-gl="shape: star; boost: 0; width: .2"></section></template>
<script src="three-global.js"></script>
<script src="../../_vendor/three@0.174.0/build/three.cjs"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
document.querySelectorAll("[data-shape]").forEach((b) => b.addEventListener("click", () => document.getElementById("main").dispatchEvent(new CustomEvent("fx:shape", { detail: b.dataset.shape }))));
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
