<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>melt-count-loader — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: relative; z-index: 90; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .stage { height: 100vh; }
  .stage .wf-img { height: 100%; --wf-fill: var(--kf-ink); --wf-fill-ink: var(--kf-bg); }
  .logo { margin: 0; }
  .logo svg { width: 376px; max-width: 100%; height: auto; overflow: visible; }
  .count { margin-top: 14px; width: 28px; overflow: hidden; text-align: right; font-size: 18px; }
</style>
</head>
<body>
<p class="demo-hint"><b>melt-count-loader</b> — Reload. After counting the numbers the panel turns transparent and the logo becomes white text over the photo, then rises away (the demo is fast).</p>
<div data-fx="melt-count-loader" data-fx-melt-count-loader="count: 1; wait: .5; stay: 1; lock: false" style="--fx-wait: .5s; --fx-fade: 1.5s">
  <div style="display:flex;align-items:flex-start;gap:12px">
    <p class="logo" data-fx-part="logo"><svg viewBox="0 0 376 78"><text x="0" y="60" font-size="64" textLength="370" fill="currentColor">brand-name</text></svg></p>
    <div class="count"><span data-fx-part="count">0</span></div>
  </div>
</div>
<div class="stage"><div class="wf-img" data-label="Hero photo"></div></div>
<script>
(() => {
  const src = document.querySelector('[data-fx~="melt-count-loader"]');
  if (!src) return;
  const html = src.outerHTML;
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; el.style.display = "none"; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => src.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical one comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
