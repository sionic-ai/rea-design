<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>corner-slide-panel — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .btn { position: fixed; z-index: 960; width: 56px; height: 56px; border: 0; padding: 0; background: var(--kf-accent); cursor: pointer; }
  .tl { top: 0; left: 0; clip-path: polygon(0 0, 100% 0, 0 100%); }
  .br { bottom: 0; right: 0; border-radius: 50%; }
  nav ul { list-style: none; margin: 0; padding: 48px 24px 0; font-size: 40px; text-transform: uppercase; }
  .pics { position: relative; margin: 24px; aspect-ratio: 540 / 360; }
  .pics [data-fx-part="pic"] { position: absolute; inset: 0; height: 100%; }
  .x { position: absolute; right: 16px; bottom: 16px; }
</style>
</head>
<body>
<p class="demo-hint"><b>corner-slide-panel</b> — Click the top-left triangle or the bottom-right circle. Hover over a menu row and the photo changes. <span style="color:var(--kf-dim)">(After 1s one more panel comes in, and one leaves 2.5s later)</span></p>
<button class="btn tl" type="button" data-fx-part="toggle" aria-controls="p-left" aria-label="Left panel"></button>
<button class="btn br" type="button" data-fx-part="toggle" aria-controls="p-right" aria-label="Right panel"></button>
<nav id="p-left" data-fx="corner-slide-panel" data-fx-corner-slide-panel="side: left"><ul data-fx-part="content"><li data-fx-part="item" data-key="1">Field 1</li><li data-fx-part="item" data-key="2">Field 2</li></ul><div class="pics" data-fx-part="content"><span class="wf-img" data-fx-part="pic" data-key="1" data-label="Field 1 photo"></span><span class="wf-img" data-fx-part="pic" data-key="2" data-label="Field 2 photo"></span></div><button class="x" type="button" data-fx-part="close">Close</button></nav>
<nav id="p-right" data-fx="corner-slide-panel"><ul data-fx-part="content"><li data-fx-part="item" data-key="1">Menu 1</li><li data-fx-part="item" data-key="2">Menu 2</li><li>Menu 3</li></ul><button class="x" type="button" data-fx-part="close">Close</button></nav>
<nav data-demo-remove data-fx="corner-slide-panel" data-fx-corner-slide-panel="side: left"></nav>
<template data-demo-late><nav id="p-late" data-fx="corner-slide-panel" data-fx-corner-slide-panel="dur: .5; delay: .2"><p data-fx-part="content">Late-arriving panel</p></nav></template>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
