<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>flash-sweep-hover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { margin: 0; padding: 12px 20px; border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .row { display: flex; flex-wrap: wrap; gap: 24px; justify-content: center; padding: 48px 20px; }
  .btn { position: relative; display: block; width: 320px; padding: 18px 0 18px 22px; border: 1px solid currentColor; border-radius: 3px; }
  .btn [data-fx-part="icon"] { position: absolute; top: 0; bottom: 0; right: 20px; display: grid; place-items: center; width: 24px; height: 24px; margin-block: auto; border-radius: 50%; }
  .btn svg { width: 7px; height: 6px; }
  .stage { background: var(--kf-contrast-bg); color: var(--kf-contrast-ink); }
</style>
</head>
<body>
<p class="demo-hint"><b>flash-sweep-hover</b> — Hover over the button. A panel sweeps once from left to right and the letters flip briefly.</p>
<div class="row" id="row">
  <a class="btn" href="#" data-fx="flash-sweep-hover">What the company aims for<span data-fx-part="icon"><svg viewBox="0 0 7 6" fill="currentColor"><path d="M0 0l7 3-7 3 1.6-3z"/></svg></span></a>
  <a class="btn" href="#" data-fx="flash-sweep-hover">Button to be removed soon<span data-fx-part="icon"><svg viewBox="0 0 7 6" fill="currentColor"><path d="M0 0l7 3-7 3 1.6-3z"/></svg></span></a>
</div>
<div class="row stage">
  <a class="btn" href="#" data-fx="flash-sweep-hover" data-fx-flash-sweep-hover="look: keep" style="--fx-ink: var(--kf-contrast-ink)">Button on dark panel<span data-fx-part="icon"><svg viewBox="0 0 7 6" fill="currentColor"><path d="M0 0l7 3-7 3 1.6-3z"/></svg></span></a>
</div>
<script>
// A CSS-only part, so check that it still applies to late-arriving buttons and that deleted buttons leave nothing behind
(() => {
  const row = document.getElementById("row"), src = row.firstElementChild.cloneNode(true), gone = row.children[1];
  setTimeout(() => { const b = src.cloneNode(true); b.firstChild.textContent = "Late-arrived Button"; row.append(b); }, 1000);
  setTimeout(() => gone?.remove(), 2500);
})();
</script>
<script src="../fx-core.js"></script>
</body>
</html>
