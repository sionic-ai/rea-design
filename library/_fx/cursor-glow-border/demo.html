<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cursor-glow-border — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-contrast-bg); color: var(--kf-contrast-ink); font: 400 15px/1.5 var(--kf-font-sans); min-height: 100vh; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); color: var(--kf-ink); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-row { display: flex; gap: 6px; justify-content: center; margin: 80px 20px; }
  .demo-pill { display: flex; align-items: center; height: 40px; padding: 0 22px; border-radius: 2px; background: color-mix(in oklab, var(--kf-contrast-ink) 10%, transparent); }
  .demo-list { max-width: 720px; margin: 40px auto; display: grid; gap: 0; }
  .demo-list div { padding: 22px 24px; border-radius: 4px; }
</style>
</head>
<body>
<p class="demo-hint"><b>cursor-glow-border</b> — Move the mouse near the pill or line. Light falls only on the border.</p>
<div class="demo-row">
  <span class="demo-pill" data-fx="cursor-glow-border">Logo</span>
  <span class="demo-pill" data-fx="cursor-glow-border">Menu 1 · Menu 2 · Menu 3</span>
  <span class="demo-pill" data-fx="cursor-glow-border" data-fx-cursor-glow-border="size: 60">···</span>
</div>
<div class="demo-list">
  <div data-fx="cursor-glow-border">Your question line here</div>
  <div data-fx="cursor-glow-border">Your question line here</div>
  <div data-fx="cursor-glow-border">Your question line here</div>
</div>
<script>
// Late arrivals and removals — checks that fx-core attaches to an element added after 1s and detaches from an element removed after 2.5s
(() => {
  const src = document.querySelector(".demo-list");
  const html = src.outerHTML;
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => src.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another row group comes in, and after 2.5s one leaves.");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
