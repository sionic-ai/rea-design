<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>strike-replace — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { padding: 48px 20px; }
  .demo-spacer { height: 90vh; display: grid; place-items: center; color: var(--kf-dim); }
 h2 { max-width: 16ch; font: 800 6vw/1.1 var(--kf-font-display); letter-spacing: -.03em; } [data-fx-part="chip"] { margin-left: .3em; padding: 4px 8px; border: 1px solid var(--kf-line); font: 500 14px/1 var(--kf-font-mono); vertical-align: middle; }
</style>
</head>
<body>
<p class="demo-hint"><b>strike-replace</b> — Scroll down and a word is struck through and a new word rises (reverse when scrolling back). <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<div class="demo-spacer">Scroll down</div><section class="demo"><h2 data-demo-remove data-fx="strike-replace">Here <span data-fx-part="old">Word to erase</span> <span data-fx-part="new">New word</span> One line. <b data-fx-part="chip" data-to="v02">v01</b></h2><h2 data-fx="strike-replace">Here <span data-fx-part="old">Word to erase</span> <span data-fx-part="new">New word</span> One line. <b data-fx-part="chip" data-to="v02">v01</b></h2><template data-demo-late><h2 data-fx="strike-replace">Here <span data-fx-part="old">Word to erase</span> <span data-fx-part="new">New word</span> One line. <b data-fx-part="chip" data-to="v02">v01</b></h2></template></section><div class="demo-spacer"></div><div class="demo-spacer"></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../../../_shared/vendor/gsap/SplitText.min.js"></script>
<script src="../../../_shared/vendor/gsap/CustomEase.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrambleTextPlugin.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); window.ScrollTrigger?.refresh(); }, 2500);
</script>
</body>
</html>
