<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bubble-pill-menu — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .menu { --fx-tone-1: var(--kf-accent-soft); --fx-tone-2: var(--kf-raised); --fx-tone-3: var(--kf-surface); }
  .menu [data-fx-part="toggle"] { position: fixed; top: 60px; right: 24px; width: 80px; height: 60px; border: 0; border-radius: 20px; background: var(--kf-raised); color: var(--kf-ink); display: grid; place-content: center; }
  .pills { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; max-width: 70vw; }
  .pills a { display: flex; align-items: center; justify-content: center; min-width: 23vw; min-height: 120px; padding: 0 1em; border-radius: var(--kf-radius-pill); background: var(--kf-bg); color: var(--kf-ink); font: 600 clamp(1.5rem, 4vw, 4rem)/1 var(--kf-font-sans); box-shadow: var(--kf-shadow-soft); }
  .pills a[data-fx-part="sub"] { min-width: 8vw; min-height: 50px; font-size: 1.1rem; }
  .pills a:hover { background: var(--kf-ink); color: var(--kf-bg); transform: scale(1.06); }
  .social { margin-top: 32px; display: flex; gap: 16px; padding: 14px 20px; border-radius: var(--kf-radius-pill); background: var(--kf-bg); }
</style>
</head>
<body>
<p class="demo-hint"><b>bubble-pill-menu</b> — Press the button at the top right. Pills burst out tilted, and the panel color changes each time it opens. <span style="color:var(--kf-dim)">(One more pill comes in after 1s, and one drops out after 2.5s)</span></p>
<div class="menu" data-fx="bubble-pill-menu">
  <button type="button" data-fx-part="toggle" aria-label="Open Menu"><span></span><span></span></button>
  <nav data-fx-part="panel" aria-label="Menu">
    <div class="pills">
      <a href="#" data-fx-part="pill" data-key="-4">Menu 1</a>
      <a href="#" data-fx-part="pill" data-key="3">Menu 2</a>
      <a href="#" data-fx-part="pill" data-key="-2" data-demo-remove>Omitted menu</a>
      <a href="#" data-fx-part="pill" data-key="5">Menu 4</a>
      <a href="#" data-fx-part="sub" data-key="-6">Small 1</a>
      <a href="#" data-fx-part="sub" data-key="4">Small 2</a>
      <template data-demo-late><a href="#" data-fx-part="pill" data-key="-3">Late-added Menu</a></template>
    </div>
    <div class="social" data-fx-part="extra"><a href="#">Social 1</a><a href="#">Social 2</a></div>
  </nav>
</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); }, 2500);
</script>
</body>
</html>
