<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>collage-shut-opening — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .page { min-height: 80vh; display: grid; place-items: center; font-size: 28px; }
  .piece { position: absolute; display: block; background: var(--kf-raised); border: 2px solid var(--kf-line); }
</style>
</head>
<body>
<p class="demo-hint"><b>collage-shut-opening</b> — Refresh and the pieces light up in turn and disappear at 2.6s. At 3.3s the curtain folds up. <span style="color:var(--kf-dim)">(After 1s one more comes in, and one drops out after 2s)</span></p>
<div class="page">Page</div>
<div data-fx="collage-shut-opening" aria-hidden="true">
  <div data-fx-part="pieces">
    <span class="piece" data-fx-part="piece" data-delay=".3" style="left:8%;top:10%;width:14%;aspect-ratio:4/3"></span>
    <span class="piece" data-fx-part="piece" data-delay=".5" style="left:40%;top:22%;width:20%;aspect-ratio:3/2"></span>
    <span class="piece" data-fx-part="piece" data-delay=".8" style="right:10%;top:6%;width:12%;aspect-ratio:3/4"></span>
    <span class="piece" data-fx-part="piece" data-delay="1" style="left:20%;bottom:8%;width:10%;aspect-ratio:1"></span>
    <span class="piece" data-fx-part="piece" data-delay="1.2" style="right:16%;bottom:12%;width:18%;aspect-ratio:4/3"></span>
  </div>
</div>
<div data-demo-remove data-fx="collage-shut-opening" data-fx-collage-shut-opening="shut: 5"><span data-fx-part="piece"></span></div>
<template data-demo-late><div data-fx="collage-shut-opening" data-fx-collage-shut-opening="out: .4; shut: .6; shut-dur: .3"><span class="piece" data-fx-part="piece" style="left:45%;top:45%;width:10%;aspect-ratio:1"></span></div></template>
<div data-fx="collage-shut-opening" data-fx-collage-shut-opening="shut: .2"></div>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2000);
</script>
</body>
</html>
