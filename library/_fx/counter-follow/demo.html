<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>counter-follow — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .stage { height: 520px; margin: 30px; border: 1px solid var(--kf-line); overflow: hidden; }
  .stage [data-fx-part="layer"] { position: absolute; inset: 0; }
  .ph { position: absolute; border: 0; border-radius: var(--kf-radius-lg); }
  .title { position: absolute; inset: 0; display: grid; place-items: center; font: 600 48px/1 var(--kf-font-display); }
</style>
</head>
<body>
<p class="demo-hint"><b>counter-follow</b> Move the mouse from edge to edge of the screen. The front layer follows the cursor, and the back layer follows the opposite way a few px behind. <span style="color:var(--kf-dim)">(After 1s one more panel comes in, and one leaves 2.5s later)</span></p>
<section class="stage" data-fx="counter-follow" data-demo-remove>
  <div data-fx-part="layer" data-dir="-1"><span class="wf-img ph" data-label="Back photo" style="left:6%;top:10%;width:220px;aspect-ratio:3/2"></span><span class="wf-img ph" data-label="Back photo" style="right:8%;bottom:12%;width:260px;aspect-ratio:3/2"></span></div>
  <div data-fx-part="layer" data-dir="1"><span class="wf-img ph" data-label="Previous person" style="left:30%;bottom:8%;width:160px;aspect-ratio:3/4"></span><span class="wf-img ph" data-label="Previous person" style="right:30%;top:8%;width:140px;aspect-ratio:3/4"></span></div>
  <p class="title">Your logo here</p>
</section>
<section class="stage" data-fx="counter-follow" data-fx-counter-follow="sens: 20; ease: .05">
  <div data-fx-part="layer"><span class="wf-img ph" data-label="Big · Slow" style="left:20%;top:20%;width:200px;aspect-ratio:1"></span></div>
  <div data-fx-part="layer"><span class="wf-img ph" data-label="Reverse" style="right:20%;bottom:20%;width:200px;aspect-ratio:1"></span></div>
</section>
<template data-demo-late><section class="stage" data-fx="counter-follow"><div data-fx-part="layer"><span class="wf-img ph" data-label="Enters late" style="left:40%;top:30%;width:200px;aspect-ratio:1"></span></div></section></template>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
