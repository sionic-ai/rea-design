<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>elastic-bend-divider — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css"><link rel="stylesheet" href="../../../_shared/kf-defaults.css"><link rel="stylesheet" href="fx.css">
<style>body{margin:0;background:var(--kf-bg);color:var(--kf-ink);font:400 14px/1.5 var(--kf-font-sans)}.demo-hint{position:sticky;top:0;z-index:2;padding:12px 20px;background:var(--kf-surface);border-bottom:1px solid var(--kf-line);font:500 13px/1.4 var(--kf-font-mono)}section{padding:80px 40px}</style></head>
<body>
<p class="demo-hint"><b>elastic-bend-divider</b> — Move the mouse across the lines. They bend and return with a tremble. (One more line comes in after 1 second and one leaves after 2.5 seconds)</p>
<section><h2>Your section title here</h2></section>
<div data-fx="elastic-bend-divider"></div>
<section><h2>Next section</h2></section>
<div data-fx="elastic-bend-divider" data-demo-remove></div>
<section data-demo-late-host><h2>Last section</h2></section>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script><script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script><script src="../fx-core.js"></script><script src="fx.js"></script>
<script>gsap.registerPlugin(ScrollTrigger);
setTimeout(() => { const d = document.createElement("div"); d.dataset.fx = "elastic-bend-divider"; d.setAttribute("data-fx-elastic-bend-divider", "back: 2; amp: .05"); document.querySelector("[data-demo-late-host]").after(d); }, 1000);
setTimeout(() => document.querySelector("[data-demo-remove]")?.remove(), 2500);
</script></body></html>
