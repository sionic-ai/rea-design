<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lemniscate-orbit-reveal — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .hero { height: 80vh; }
  .hero figure { display: grid; place-content: center; font: 500 11px/1 var(--kf-font-mono); color: var(--kf-dim); }
  .hero [data-fx-part="media"] { background: var(--kf-contrast-bg); color: var(--kf-contrast-ink); display: grid; place-content: center; font: 700 40px/1 var(--kf-font-display); }
</style>
</head>
<body>
<p class="demo-hint"><b>lemniscate-orbit-reveal</b> — On open, the photos orbit along an ∞ path, and at the center one-photo spot the stage unfolds to fill the panel. Refresh to watch again.</p>
<section class="hero" data-fx="lemniscate-orbit-reveal">
  <div data-fx-part="orbit"><figure data-fx-part="photo">1</figure><figure data-fx-part="photo">2</figure><figure data-fx-part="photo">3</figure><figure data-fx-part="photo">4</figure><figure data-fx-part="photo">5</figure><figure data-fx-part="photo">6</figure><figure data-fx-part="photo">7</figure><figure data-fx-part="photo">8</figure></div>
  <div data-fx-part="stage"><div data-fx-part="media">Stage</div></div>
</section>
<section class="hero" data-fx="lemniscate-orbit-reveal" data-demo-remove><div data-fx-part="orbit"><figure data-fx-part="photo"></figure></div><div data-fx-part="stage"></div></section>
<template data-demo-late><section class="hero" data-fx="lemniscate-orbit-reveal" data-fx-lemniscate-orbit-reveal="orbit: 1; open: .8; delay: 0"><div data-fx-part="orbit"><figure data-fx-part="photo">a</figure><figure data-fx-part="photo">b</figure><figure data-fx-part="photo">c</figure><figure data-fx-part="photo">d</figure></div><div data-fx-part="stage"><div data-fx-part="media">Briefly</div></div></section></template>
<section class="hero" data-fx="lemniscate-orbit-reveal"><div data-fx-part="stage"></div></section>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
