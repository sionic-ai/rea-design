<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mask-sweep-reveal — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .gap { height: 70vh; display: grid; place-items: center; color: var(--kf-dim); }
  .ph { width: min(80vw, 760px); aspect-ratio: 3 / 2; margin: 0 auto 40vh; background: linear-gradient(160deg, var(--kf-accent), var(--kf-ink)); color: var(--kf-on-accent); display: grid; place-items: end start; padding: 16px; }
</style>
</head>
<body>
<p class="demo-hint"><b>mask-sweep-reveal</b> Scroll down. When the photo slot reaches about 70% of the screen, it fades in softly from the top. <span style="color:var(--kf-dim)">(After 1s one more cell comes in, and one leaves 2.5s later)</span></p>
<div class="gap">Your previous post here</div>
<figure class="ph" data-fx="mask-sweep-reveal">Photo slot · Open-air hot spring bath · Landscape 3:2</figure>
<figure class="ph" data-demo-remove data-fx="mask-sweep-reveal">Dropping cell</figure>
<div data-late-slot></div>
<template data-demo-late><figure class="ph" data-fx="mask-sweep-reveal" data-fx-mask-sweep-reveal="dur: 1.5">Late Cell · 1.5s</figure></template>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script>gsap.registerPlugin(ScrollTrigger);</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => document.querySelector("[data-late-slot]").replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); ScrollTrigger.refresh(); }, 2500);
</script>
</body>
</html>
