<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gradient-band-btn — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-surface); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { margin: 0; padding: 12px 20px; border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .row { display: flex; flex-wrap: wrap; gap: 24px; justify-content: center; margin: 60px auto; }
  .btn { display: inline-flex; align-items: center; justify-content: center; width: 360px; max-width: 80vw; height: 72px; border-radius: 100px; color: var(--kf-ink); font: 700 24px/1.5 var(--kf-font-display); text-decoration: none; box-shadow: var(--kf-shadow-soft); }
</style>
</head>
<body>
<p class="demo-hint"><b>gradient-band-btn</b> — Hover over the button, then leave. A band sweeps in from the left and the letters take on color one by one.</p>
<div class="row" id="row">
  <a class="btn" href="#" data-fx="gradient-band-btn"><span data-fx-part="label">Join Us</span></a>
  <a class="btn" href="#" data-fx="gradient-band-btn" data-fx-gradient-band-btn="each: .05"><span data-fx-part="label">Apply Now</span></a>
  <a class="btn" href="#" data-fx="gradient-band-btn"></a>
</div>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
  // Check that late-arriving buttons get hooked and removed buttons get released
  setTimeout(() => {
    const a = document.createElement("a");
    a.className = "btn"; a.href = "#"; a.dataset.fx = "gradient-band-btn";
    a.innerHTML = '<span data-fx-part="label">Late Button</span>';
    document.getElementById("row").append(a);
  }, 1000);
  setTimeout(() => document.querySelectorAll(".btn")[2]?.remove(), 2500);
</script>
</body>
</html>
