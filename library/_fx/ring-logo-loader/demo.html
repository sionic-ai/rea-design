<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ring-logo-loader — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: fixed; bottom: 0; left: 0; right: 0; z-index: 1000; padding: 12px 20px; background: var(--kf-surface); border-top: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .page { padding: 0 20px; }
  .nav { display: flex; justify-content: flex-end; gap: 12px; height: 60px; align-items: center; font-size: 13px; text-transform: uppercase; }
  .mark, [data-fx-part="logo"] { font-size: 9vw; line-height: 1; letter-spacing: -.02em; white-space: nowrap; }
  .mark { margin-top: 120px; }
  .photo { aspect-ratio: 16 / 9; margin-top: 20px; background: var(--kf-raised); }
  button { margin-top: 20px; }
</style>
</head>
<body>
<p class="demo-hint"><b>ring-logo-loader</b> — On refresh a circle fills and the wordmark letters rise, then the wordmark moves up to overlap the title above and the curtain lifts. <button type="button" onclick="location.reload()">View again</button></p>
<div data-fx="ring-logo-loader" data-fx-ring-logo-loader="to: .mark; reveal: .nav span">
  <div data-fx-part="ring-wrap"><svg viewBox="0 0 24 24"><circle data-fx-part="ring" r="12" cx="12" cy="12"/></svg></div>
  <p data-fx-part="logo"><span data-fx-part="char">B</span><span data-fx-part="char">R</span><span data-fx-part="char">A</span><span data-fx-part="char">N</span><span data-fx-part="char">D</span> <span data-fx-part="char">Series</span></p>
</div>
<div class="page">
  <nav class="nav"><span>Menu 1,</span><span>Menu 2,</span><span>Menu 3</span></nav>
  <h1 class="mark">BRAND Series</h1>
  <div class="photo"></div>
</div>
<div data-demo-remove data-fx="ring-logo-loader" style="display:none"></div>
<template data-demo-late><div data-fx="ring-logo-loader" style="display:none"><p data-fx-part="logo">Late</p></div></template>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
