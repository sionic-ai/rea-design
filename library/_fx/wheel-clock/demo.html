<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>wheel-clock — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: fixed; top: 0; left: 0; right: 0; z-index: 2; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  main { height: 100vh; }
  .card { position: absolute; left: 50%; top: 50%; width: 280px; height: 180px; margin: -90px 0 0 -140px; display: grid; place-items: center; background: var(--kf-raised); border: 1px solid var(--kf-line);
    font: 700 28px/1 var(--kf-font-display); transform: translate3d(calc((1 - var(--fx-k, 0)) * 60vw - var(--fx-k, 0) * 0vw), 0, 0) rotate(calc((1 - var(--fx-k, 0)) * 12deg)); opacity: var(--fx-k, 0); }
  .bar { position: absolute; left: 0; bottom: 0; height: 4px; width: calc(var(--fx-p, 0) / 4 * 100%); background: var(--kf-accent); }
  .read { position: absolute; left: 20px; bottom: 20px; font: 500 13px var(--kf-font-mono); }
</style>
</head>
<body>
<p class="demo-hint"><b>wheel-clock</b> — Roll the wheel over the panel or press the ↓ key. The document stays put while only the value p glides and the cards come in one by one. (One more card comes in after 1s and one leaves after 2.5s)</p>
<main data-fx="wheel-clock" data-fx-wheel-clock="max: 4; stops: 0,1,2,3,4">
  <div class="card" data-fx-part="layer" data-from="0" data-to="1">Card 1</div>
  <div class="card" data-fx-part="layer" data-from="1" data-to="2" data-demo-remove>Card 2</div>
  <div class="card" data-fx-part="layer" data-from="2" data-to="3">Card 3</div>
  <i class="bar"></i><p class="read">p = 0</p>
</main>
<div data-fx="wheel-clock"></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
const main = document.querySelector("main");
main.addEventListener("fx:clock", (e) => { document.querySelector(".read").textContent = "p = " + e.detail.p.toFixed(2); });
setTimeout(() => {
  const c = document.createElement("div");
  c.className = "card"; c.dataset.fxPart = "layer"; c.dataset.from = "3"; c.dataset.to = "4"; c.textContent = "Late-arriving card";
  main.append(c);
}, 1000);
setTimeout(() => document.querySelector("[data-demo-remove]")?.remove(), 2500);
</script>
</body>
</html>
