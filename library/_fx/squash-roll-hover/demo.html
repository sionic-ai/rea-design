<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>squash-roll-hover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { padding: 48px 20px; display: grid; gap: 24px; justify-items: start; }
  .pill { display: inline-flex; align-items: center; justify-content: center; min-width: 240px; height: 56px; border-radius: var(--kf-radius-pill); background: var(--kf-contrast-bg); color: var(--kf-contrast-ink); }
  .card { width: 220px; padding: 24px; border-radius: var(--kf-radius-md); background: var(--kf-surface); border: 1px solid var(--kf-line); }
</style>
</head>
<body>
<p class="demo-hint"><b>squash-roll-hover</b> — Hover over a button·text·card. The text flattens and slides up, and the same text rises in from below.</p>
<section class="demo">
  <a href="#" class="pill"><span data-fx="squash-roll-hover" data-text="Your button text here"><span>Your button text here</span></span></a>
  <a href="#"><span data-fx="squash-roll-hover" data-text="0000-00-0000" style="--fx-shift: 14"><span>0000-00-0000</span></span></a>
  <div class="card" data-fx-part="host"><p>Card anywhere</p><span data-fx="squash-roll-hover" data-text="Your name line here"><span>Your name line here</span></span></div>
  <span data-fx="squash-roll-hover"></span>
</section>
<script>
// Late arrivals and removals — a CSS-only motion part, so it spins as soon as it is attached. One more after 1 second, one removed after 2.5 seconds
(() => {
  const src = document.querySelector(".pill");
  if (!src) return;
  const make = () => src.cloneNode(true);
  const gone = make();
  src.after(gone);
  setTimeout(() => src.after(make()), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s one more of the same comes in, and after 2.5s one drops out.");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
</body>
</html>
