<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>block-pass-reveal — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: sticky; top: 0; z-index: 60; margin: 0; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 40px; width: min(1000px, 90vw); margin: 70vh auto 40vh; }
  .row figure { margin: 0; aspect-ratio: 3 / 4; }
  .row figure:nth-child(3) { aspect-ratio: 5 / 3; transform: rotate(-6deg); align-self: center; }
  .row .wf-img { height: 100%; }
</style>
</head>
<body>
<p class="demo-hint"><b>block-pass-reveal</b> — Scroll down. A color curtain comes in, covers, then shrinks to reveal the photo (the third starts covered and peels away: shrink).</p>
<div class="row" id="row">
  <figure data-fx="block-pass-reveal"><div class="wf-img" data-label="Couple photo on the street · portrait 3:4"></div></figure>
  <figure data-fx="block-pass-reveal" data-fx-block-pass-reveal="dir: down"><div class="wf-img" data-label="Couple on stairs · vertical 3:4"></div></figure>
  <figure data-fx="block-pass-reveal" data-fx-block-pass-reveal="look: shrink; dir: left; delay: .1"><div class="wf-img" data-label="Secondary photo in front of the station · landscape 5:3"></div></figure>
</div>
<script>
// Late arrivals and removals — after 1 second one more cell comes in (late arrival), and after 2.5 seconds the first cell leaves (detach)
(() => {
  const row = document.getElementById("row");
  const first = row.firstElementChild;
  setTimeout(() => { const f = document.createElement("figure"); f.dataset.fx = "block-pass-reveal"; f.setAttribute("data-fx-block-pass-reveal", "dir: up; fade: 1.2"); f.innerHTML = '<div class="wf-img" data-label="Late-arriving cell · portrait 3:4"></div>'; row.append(f); }, 1000);
  setTimeout(() => first.remove(), 2500);
})();
</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
