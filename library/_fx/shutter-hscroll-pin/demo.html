<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>shutter-hscroll-pin — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; overflow-x: hidden; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-spacer { height: 80vh; display: grid; place-items: center; color: var(--kf-dim); }
  .cell { width: 42vw; border: 0; }
  .cell.is-wide { width: 74vw; }
  .cell.is-intro { width: 50vw; display: flex; align-items: center; padding: 0 25px; border: 1px solid var(--kf-line); font-size: 20px; }
</style>
</head>
<body>
<p class="demo-hint"><b>shutter-hscroll-pin</b> — Scroll down. Top and bottom covers open and the photo strip flows sideways, then exits upward.</p>
<div class="demo-spacer">Scroll</div>
<section data-fx="shutter-hscroll-pin" id="demo">
  <div data-fx-part="sticky">
    <div data-fx-part="rail">
      <div data-fx-part="track">
        <div class="cell is-intro">Your opening line for the photo strip here.</div>
        <div class="wf-img cell" data-label="Photo 1 · Landscape"></div>
        <div class="wf-img cell is-wide" data-label="Photo 2 · wide landscape"></div>
        <div class="wf-img cell" data-label="Photo 3 · Landscape"></div>
        <div class="wf-img cell is-wide" data-label="Photo 4 · wide landscape"></div>
      </div>
      <i data-fx-part="cover" data-key="top"></i>
      <i data-fx-part="cover" data-key="bottom"></i>
    </div>
  </div>
</section>
<div class="demo-spacer">Footer</div>
<script>
// Late-arriving cell — one more cell attached after 1s is measured again and the flow reaches the last cell, and removing a whole strip after 2.5s runs the detach
(() => {
  const track = document.querySelector('[data-fx-part="track"]');
  setTimeout(() => { const c = document.createElement("div"); c.className = "wf-img cell"; c.dataset.label = "Photo that came in after 1s"; track.append(c); }, 1000);
  const extra = document.createElement("section");
  extra.dataset.fx = "shutter-hscroll-pin";
  extra.innerHTML = '<div data-fx-part="sticky"><div data-fx-part="rail"><div data-fx-part="track"><div class="wf-img cell" data-label="Dropped Band"></div><div class="wf-img cell is-wide"></div><div class="wf-img cell is-wide"></div></div></div></div>';
  document.body.append(extra);
  setTimeout(() => extra.remove(), 2500);
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
