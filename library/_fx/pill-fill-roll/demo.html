<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pill-fill-roll — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-contrast-bg); color: var(--kf-contrast-ink); font: 500 15px/1 var(--kf-font-sans); }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); color: var(--kf-ink); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .row { display: flex; flex-wrap: wrap; gap: 16px; padding: 48px 20px; }
  .row a { display: flex; align-items: center; justify-content: center; width: 250px; height: 70px; border: 1px solid currentColor; text-align: center; }
</style>
</head>
<body>
<p class="demo-hint"><b>pill-fill-roll</b> — Hover over the pill button. A bright pill fills up inside and the text is pushed up one line. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<div class="row">
  <a href="#" data-fx="pill-fill-roll"><span data-fx-part="box"><span>View Menu</span><span>View Menu</span></span></a>
  <a href="#" data-fx="pill-fill-roll"><span data-fx-part="box"><span>Phone Reservation</span><span>000-0000-0000</span></span></a>
  <a href="#" data-fx="pill-fill-roll" data-demo-remove><span data-fx-part="box"><span>Soon-Removed Button</span><span>Soon-Removed Button</span></span></a>
  <template data-demo-late><a href="#" data-fx="pill-fill-roll"><span data-fx-part="box"><span>Late-arriving button</span><span>Late-arriving button</span></span></a></template>
</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
