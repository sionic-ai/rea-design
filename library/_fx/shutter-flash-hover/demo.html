<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>shutter-flash-hover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; padding: 40px; }
  .card { display: block; padding: 16px; border: 1px solid var(--kf-line); border-radius: var(--kf-radius-md); }
  .card .ph { display: block; aspect-ratio: 1; background: var(--kf-accent); }
  .card b { display: block; margin-top: 12px; font-weight: 500; }
  @media (max-width: 640px) { .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<p class="demo-hint"><b>shutter-flash-hover</b> — Hover over the card. The photo goes dark, then flashes back. <span style="color:var(--kf-dim)">(One more card comes in after 1s, and one drops out after 2.5s)</span></p>
<div class="grid" id="grid">
  <a class="card" href="#" data-fx="shutter-flash-hover" data-demo-remove><span class="ph" data-fx-part="photo"></span><b>Your post title 1 here</b></a>
  <a class="card" href="#" data-fx="shutter-flash-hover"><span class="ph" data-fx-part="photo"></span><b>Your post title 2 here</b></a>
  <a class="card" href="#" data-fx="shutter-flash-hover" style="--fx-dur: 0.8s; --fx-peak: 1.3"><span class="ph" data-fx-part="photo"></span><b>Shorter and brighter (.8s · 1.3)</b></a>
  <a class="card" href="#" data-fx="shutter-flash-hover"><b>Card without a photo — quietly does nothing</b></a>
</div>
<template data-demo-late><a class="card" href="#" data-fx="shutter-flash-hover"><span class="ph" data-fx-part="photo"></span><b>Late-arriving card</b></a></template>
<script src="../fx-core.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => document.getElementById("grid").append(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
