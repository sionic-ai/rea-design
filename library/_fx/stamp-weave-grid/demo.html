<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>stamp-weave-grid — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { height: 70vh; border-bottom: 1px solid var(--kf-line); }
  .demo.small { height: 40vh; }
  .demo-log { padding: 12px 20px; font: 500 12px/1.4 var(--kf-font-mono); color: var(--kf-dim); }
</style>
</head>
<body>
<p class="demo-hint"><b>stamp-weave-grid</b> — A stamp grid walks in a staggered way, hops and spins, and with every step ten of them flip to show the seal face. Hover over a stamp and press it. <span style="color:var(--kf-dim)">(After 1s one more panel comes in, and one leaves 2.5s later)</span></p>
<section class="demo" data-fx="stamp-weave-grid">
  <span data-fx-part="face">Name</span><span data-fx-part="face">Name</span><span data-fx-part="face">Forest</span><span data-fx-part="face">River</span>
</section>
<p class="demo-log" id="log">Pressed stamp: —</p>
<section class="demo small" data-demo-remove data-fx="stamp-weave-grid" data-fx-stamp-weave-grid="flips: 4; step: .8; hop: 1.2; mix: .15"></section>
<template data-demo-late><section class="demo small" data-fx="stamp-weave-grid" data-fx-stamp-weave-grid="flips: 0; spin: 90"></section></template>
<section class="demo small"></section>
<div data-fx="stamp-weave-grid"></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
document.addEventListener("fx:open", (e) => (document.getElementById("log").textContent = `Pressed stamp: ${e.detail.kind} · ${Math.round(e.detail.x)}, ${Math.round(e.detail.y)}`));
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
