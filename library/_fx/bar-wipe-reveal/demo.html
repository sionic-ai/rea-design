<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bar-wipe-reveal — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { margin: 0; background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; margin: 0; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-spacer { height: 90vh; display: grid; place-items: center; color: var(--kf-dim); }
  .bw-title { font: 900 48px/1.6 var(--kf-font-display); color: var(--kf-on-accent); }
  .bw-title > span { padding: 0 16px; }
  .bw-title > span::before { background: var(--kf-accent); }
  .bw-photo { width: min(640px, 100%); }
  .bw-photo::before { background: var(--kf-accent); }
  .bw-img { display: block; aspect-ratio: 4 / 3; background: linear-gradient(135deg, var(--kf-raised), var(--kf-dim)); }
</style>
</head>
<body>
<p class="demo-hint"><b>bar-wipe-reveal</b> — Scrolling down paints an accent band from the left on each line, then white text is revealed from the left (.18s per line). Photos are revealed from the left after the band passes.</p>
<div class="demo-spacer">Scroll down ↓</div>
<section style="padding:40px 20px;display:grid;gap:40px">
  <h2 class="bw-title" data-fx="bar-wipe-reveal"><span>Your first-line title here</span><br><span>Your second line here</span><br><span>We place ”Your third item here”</span></h2>
  <div class="bw-photo" data-fx="bar-wipe-reveal" data-fx-bar-wipe-reveal="look: photo"><span data-fx-part="media" class="bw-img"></span></div>
</section>
<div class="demo-spacer"></div>
<script>
// Late arrivals and removals — checks that fx-core attaches to an element added after 1s and detaches from an element removed after 2.5s
(() => {
  const src = document.querySelector('[data-fx~="bar-wipe-reveal"]');
  if (!src) return;
  const html = src.outerHTML.replace(/\sid="[^"]*"/g, "");
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const host = src.closest("[data-demo-host]") || src;
  const gone = make("gone");
  host.after(gone);
  setTimeout(() => (src.closest(".pin-spacer") || host).after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical one comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>

<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
