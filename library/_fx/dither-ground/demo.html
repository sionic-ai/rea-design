<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dither-ground — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo-panel { height: 60vh; margin: 20px; border: 1px solid var(--kf-line); display: grid; place-items: center; color: var(--kf-dim); }
  .demo-panel.is-inv { background: var(--kf-contrast-bg); color: var(--kf-contrast-ink); --fx-dot: var(--kf-contrast-ink); --fx-fill: color-mix(in oklab, var(--kf-contrast-ink) 14%, transparent); }
</style>
</head>
<body>
<p class="demo-hint"><b>dither-ground</b> — Dotted land at the bottom of the panel slowly flows and changes shape. The second panel swaps the dot and surface colors for the opposite stage color.</p>
<section class="demo-panel" data-fx="dither-ground">Panel One</section>
<section class="demo-panel is-inv" data-fx="dither-ground" data-fx-dither-ground="height: .6; pitch: 6">Opposite stage</section>
<script>
(() => {
  const src = document.querySelector('[data-fx~="dither-ground"]');
  const html = src.outerHTML;
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => src.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical one comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
