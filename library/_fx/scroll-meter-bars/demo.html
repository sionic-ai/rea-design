<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>scroll-meter-bars — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; min-height: 300vh; }
  .demo-hint { position: sticky; top: 0; z-index: 10; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .row { display: flex; align-items: center; gap: 14px; padding: 40px; font: 400 64px var(--kf-font-display); }
  .row small { font: 500 13px var(--kf-font-sans); }
</style>
</head>
<body>
<p class="demo-hint"><b>scroll-meter-bars</b> — The bars sway gently and surge up when you scroll fast. <span style="color:var(--kf-dim)">(One more meter comes in after 1s, and one drops out after 2.5s)</span></p>
<div class="row">Title <span data-fx="scroll-meter-bars"></span><small>Section name</small></div>
<div class="row">Second <span data-fx="scroll-meter-bars" data-fx-scroll-meter-bars="seed: 42"></span><small>Seed 42</small></div>
<div class="row" data-demo-remove><span data-fx="scroll-meter-bars"></span>Being removed soon</div>
<template data-demo-late><div class="row">Late <span data-fx="scroll-meter-bars" data-fx-scroll-meter-bars="pitch: 4; bar: 1"></span></div></template>
<span data-fx="scroll-meter-bars" style="inline-size: 0"></span>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
