<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>shear-film-hero — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { padding: 20px; display: grid; gap: 20px; }
  .film { height: 70vh; display: grid; place-items: center; }
  .film h2 { position: relative; font: 800 8vw/1 var(--kf-font-display); color: var(--kf-bg); }
</style>
</head>
<body>
<p class="demo-hint"><b>shear-film-hero</b> — Move the mouse from the left edge of the screen to the right edge — the middle of the film bends and shifts the other way. <span style="color:var(--kf-dim)">(After 1s one more panel comes in, and one leaves 2.5s later)</span></p>
<main class="demo">
  <div class="film" data-fx="shear-film-hero"><h2>WORDMARK</h2></div>
  <div class="film" data-fx="shear-film-hero" data-fx-shear-film-hero="amount: 0.4; speed: 3" data-demo-remove></div>
  <template data-demo-late><div class="film" data-fx="shear-film-hero" data-fx-shear-film-hero="amount: 0"></div></template>
</main>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../scroll-sag-warp/three-pre.js"></script>
<script src="../../_vendor/three@0.177.0/build/three.cjs"></script>
<script src="../scroll-sag-warp/three-post.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => { const t = document.querySelector("template[data-demo-late]"); document.querySelector(".demo").append(t.content.cloneNode(true)); }, 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
