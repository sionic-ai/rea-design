<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bar-aurora-intro — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .hero { position: relative; overflow: hidden; height: 80vh; padding: 120px 48px; }
  .hero .bars { position: absolute; inset: auto 0 0 0; display: grid; grid-template-columns: repeat(24, 1fr); gap: 1px; z-index: 0; }
  .hero h2, .hero p { position: relative; max-width: 30em; }
  .hero h2 { font: 400 36px/1.4 var(--kf-font-display); }
  .hero p { margin-top: 48px; font-size: 14px; }
</style>
</head>
<body>
<p class="demo-hint"><b>bar-aurora-intro</b> — On reload, vertical bars light up one by one and the title and body go from blurred to clear. The bars keep floating upward.</p>
<section class="hero" data-fx="bar-aurora-intro">
  <div class="bars" data-fx-part="bars" aria-hidden="true"></div>
  <h2 data-fx-part="title">A big serif headline<br>set across two lines.</h2>
  <p data-fx-part="text">Your two-line body here. It clears up just as the bar fully lights.</p>
</section>
<script>
(() => {
  const box = document.querySelector(".bars");
  for (let i = 0; i < 24; i++) {
    const b = document.createElement("i");
    b.style.setProperty("--fx-w", (i % 5 ? 32 : 16) + "px");
    b.style.setProperty("--fx-h", (12 + i * 1.6 + (i % 3) * 2) + "rem");
    box.append(b);
  }
  const src = document.querySelector('[data-fx~="bar-aurora-intro"]');
  const html = src.outerHTML.replace(/\sid="[^"]*"/g, "");
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => src.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical one comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
