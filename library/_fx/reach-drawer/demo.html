<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>reach-drawer — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-open { margin: 24px 20px; padding: 10px 22px; border: 1px solid var(--kf-line); border-radius: 30px; background: var(--kf-surface); cursor: pointer; }
  .demo-page { height: 150vh; padding: 20px; color: var(--kf-dim); }
  [data-fx~="reach-drawer"] { padding: 84px 210px 33px 40px; color: var(--kf-on-accent); }
  .paw-arm { fill: var(--kf-accent); }
  .paw-claw { fill: var(--kf-accent-soft); }
  .demo-close { position: absolute; top: 30px; left: 30px; border: 0; background: none; color: inherit; cursor: pointer; font-weight: 700; }
  .demo-body p { margin-bottom: 14px; font-weight: 700; }
</style>
</head>
<body>
<p class="demo-hint"><b>reach-drawer</b> — Press “Menu”. A panel with a front paw illustration stretches diagonally in from the bottom right, and Close or Esc takes the same path back.</p>
<button class="demo-open" type="button" aria-controls="menu" aria-expanded="false">Menu</button>
<div class="demo-page">Even if you open it after scrolling down, the page stays pinned in place and returns when you close it.</div>
<nav id="menu" data-fx="reach-drawer">
  <div data-fx-part="bg"><svg viewBox="0 0 1848 6648" preserveAspectRatio="xMidYMin slice"><g class="paw-claw"><path d="M560 160 615 0l55 175z"/><path d="M1180 175 1235 0l55 160z"/><path d="M150 560l60-150 50 140z"/><path d="M1590 550l50-140 60 150z"/></g><path class="paw-arm" d="M330 1380c-60-30-180-110-270-250C-20 1000-10 830 90 700c120-150 330-170 450-100-55-180-10-300 90-410C760 50 980 70 1100 260l25 40 25-40c120-190 340-210 470-70 100 110 145 230 90 410 120-70 330-50 450 100 100 130 110 300 30 430-90 140-210 220-270 250-55 40-70 100-70 200 20 600 25 3600 30 5378H330c5-1778 10-4778 30-5378 0-100-15-160-70-200z"/></svg></div>
  <button class="demo-close" type="button" data-fx-part="close">Close</button>
  <div class="demo-body" data-fx-part="body"><p>Menu First</p><p>Menu Two</p><p>Menu Three</p></div>
</nav>
<script>
// Late arrivals and removals — checks that fx-core attaches to an element added after 1s and detaches from an element removed after 2.5s
(() => {
  const src = document.querySelector('[data-fx~="reach-drawer"]');
  if (!src) return;
  const html = src.outerHTML.replace(/\sid="[^"]*"/g, "");
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => src.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical one comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
