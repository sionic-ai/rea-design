<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cell-throb-loop — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 10; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .board { display: grid; grid-template-columns: repeat(2, 160px); gap: 12px; justify-content: center; margin: 12vh auto; color: var(--kf-accent); font: 700 140px/1 var(--kf-font-display); text-align: center; }
</style>
</head>
<body>
<p class="demo-hint"><b>cell-throb-loop</b> — A few large-text cells take turns swelling slightly, then settle back.</p>
<div class="board" data-fx="cell-throb-loop"><span data-fx-part="cell">Large</span><span data-fx-part="cell">Text</span><span data-fx-part="cell">Ruler</span><span data-fx-part="cell">Board</span></div>
<div class="board" data-fx="cell-throb-loop" data-fx-cell-throb-loop="max: 1; scale: 0.9-1.2" data-demo-remove><span>Fan</span><span>Ground</span><span>Topic marker</span><span>Board</span></div>
<template data-demo-late><div class="board" data-fx="cell-throb-loop" data-fx-cell-throb-loop="rest: 0.2-0.4"><span>Late</span><span>Crab</span><span>Whole</span><span>Board</span></div></template>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); window.ScrollTrigger?.refresh(); }, 2500);
</script>
</body>
</html>
