<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>wordmark-rise-intro — Motion part</title>
<script>document.documentElement.classList.add("is-fx-preload");</script>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 500 15px/1.6 var(--kf-font-sans); }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .band { padding: 40px 32px 20px; }
  .band svg, .mark { display: block; width: 100%; }
  .mark { width: 150px; }
  text { font-family: var(--kf-font-display); fill: currentColor; }
  .hero { height: 70vh; display: grid; place-items: center; background: var(--kf-raised); }
  .hero div { width: 30vh; aspect-ratio: 106 / 155; background: var(--kf-accent); }
  .tail { height: 60vh; padding: 32px; }
</style>
</head>
<body>
<p class="demo-hint"><b>wordmark-rise-intro</b> — Try refreshing. When the dark panel lifts, the photo panel settles down from above and large type rises inside the band. <span style="color:var(--kf-dim)">(After 1s one more pair comes in, and after 2.5s one leaves)</span></p>
<div data-fx="wordmark-rise-intro">
  <div data-fx-part="sheet"><svg class="mark" data-fx-part="mark" viewBox="0 0 1329 123"><text x="0" y="104" font-size="130" textLength="1329" lengthAdjust="spacingAndGlyphs">STUDIO NAME</text></svg></div>
  <header class="band" data-fx-part="band"><svg data-fx-part="rise" viewBox="0 0 1329 123"><text x="0" y="104" font-size="130" textLength="1329" lengthAdjust="spacingAndGlyphs">STUDIO NAME</text></svg></header>
  <section class="hero" data-fx-part="drop"><div></div></section>
</div>
<div data-fx="wordmark-rise-intro" data-demo-remove data-fx-wordmark-rise-intro="min: 300; hold: 0"><header class="band" data-fx-part="band"><svg data-fx-part="rise" viewBox="0 0 1329 123"><text x="0" y="104" font-size="130" textLength="1329" lengthAdjust="spacingAndGlyphs">REMOVED</text></svg></header><section class="hero" data-fx-part="drop"><div></div></section></div>
<template data-demo-late><div data-fx="wordmark-rise-intro" data-fx-wordmark-rise-intro="min: 0; hold: 0; slide: 0; drop: .8; rise: 1.2"><header class="band" data-fx-part="band"><svg data-fx-part="rise" viewBox="0 0 1329 123"><text x="0" y="104" font-size="130" textLength="1329" lengthAdjust="spacingAndGlyphs">LATE NAME</text></svg></header><section class="hero" data-fx-part="drop"><div></div></section></div></template>
<div class="tail">Scroll down.</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); }, 2500);
</script>
</body>
</html>
