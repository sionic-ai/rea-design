<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pill-sprout — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { display: flex; flex-wrap: wrap; align-items: center; gap: 40px; padding: 48px 20px; }
  .demo-gap { height: 90vh; }
  .wide { width: 350px; height: 80px; --fx-arrow: 35px; }
</style>
</head>
<body>
<p class="demo-hint"><b>pill-sprout</b> — The button sprouts from a dot. Scroll down, then hover over the button. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<section class="demo">
  <a href="#" data-fx="pill-sprout" data-fx-pill-sprout="on: load"><span data-fx-part="bg"></span><span data-fx-part="label">Your button text in two lines here</span><span data-fx-part="arrow"></span></a>
  <a href="#" data-demo-remove data-fx="pill-sprout" data-fx-pill-sprout="on: load; delay: .4"><span data-fx-part="bg"></span><span data-fx-part="label">Button to Be Removed</span><span data-fx-part="arrow"></span></a>
  <template data-demo-late><a href="#" data-fx="pill-sprout" data-fx-pill-sprout="on: load"><span data-fx-part="bg"></span><span data-fx-part="label">Enters late</span><span data-fx-part="arrow"></span></a></template>
</section>
<div class="demo-gap"></div>
<section class="demo">
  <a class="wide" href="#" data-fx="pill-sprout"><span data-fx-part="bg"></span><span data-fx-part="bg"></span><span data-fx-part="label">Double-layer button — pops up when in view</span><span data-fx-part="arrow"></span></a>
  <a href="#" data-fx="pill-sprout"><span data-fx-part="bg"></span></a>
</section>
<div class="demo-gap"></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../../../_shared/vendor/gsap/CustomEase.min.js"></script>
<script>gsap.registerPlugin(ScrollTrigger, CustomEase);</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
