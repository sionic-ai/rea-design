<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>twinkle-dot-ring — ring of twinkling dots</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { padding: 40px; font-family: var(--kf-font-sans); color: var(--kf-ink); background: var(--kf-bg); }
  .stage { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 24px; }
  .ring { height: 340px; border-radius: var(--kf-radius-md); }
  button { margin: 16px 0; padding: 8px 16px; border: 1px solid var(--kf-line); background: var(--kf-surface); border-radius: var(--kf-radius-pill); cursor: pointer; }
</style>
</head>
<body>
<p>Dots grow and shrink one by one, twinkling. Pressing Next spins the ring, which hides and returns (1s later another panel attaches, 2s later the first panel drops out).</p>
<button type="button" id="swap">Flipping over</button>
<div class="stage" id="stage">
  <div class="ring" id="first" data-fx="twinkle-dot-ring"></div>
</div>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
  document.getElementById("swap").addEventListener("click", () => document.querySelectorAll('[data-fx~="twinkle-dot-ring"]').forEach((el) => el.dispatchEvent(new Event("fx:swap"))));
  setTimeout(() => document.getElementById("stage").insertAdjacentHTML("beforeend", '<div class="ring" data-fx="twinkle-dot-ring" data-fx-twinkle-dot-ring="rings: 0.7; count: 40"></div>'), 1000);
  setTimeout(() => document.getElementById("first").remove(), 2000);
</script>
</body>
</html>
