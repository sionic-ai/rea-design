<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>drop-pile-physics — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 10; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .sp { height: 70vh; display: grid; place-items: center; color: var(--kf-dim); }
  .pile { height: 60vh; margin: 0 20px; border-radius: var(--kf-radius-lg); background: var(--kf-surface); }
  .pile h2 { position: absolute; left: 0; right: 0; top: 48%; margin: 0; text-align: center; font: 700 64px/1 var(--kf-font-display); }
  .shelf { position: absolute; left: 25%; width: 50%; top: 46%; height: 6px; }
  .disc { width: 110px; height: 110px; border-radius: 50%; background: var(--kf-accent); display: grid; place-items: center; color: var(--kf-on-accent); font-weight: 700; }
  .disc:nth-child(odd) { background: var(--kf-ink); color: var(--kf-bg); }
  .tag { width: 150px; height: 56px; border-radius: 14px; background: var(--kf-raised); box-shadow: var(--kf-shadow-soft); display: grid; place-items: center; }
</style>
</head>
<body>
<p class="demo-hint"><b>drop-pile-physics</b> — Scroll down and discs and tags drop onto the panel and pile up. Grab and throw them with the mouse.</p>
<div class="sp">Scroll down</div>
<section class="pile" data-fx="drop-pile-physics">
  <h2>Your wordmark here</h2>
  <span class="shelf" data-fx-part="shelf"></span>
  <span class="disc" data-fx-part="item" data-shape="circle">Won 1</span>
  <span class="disc" data-fx-part="item" data-shape="circle">Won 2</span>
  <span class="tag" data-fx-part="item">Tag</span>
  <span class="disc" data-fx-part="item" data-shape="circle">Won 3</span>
</section>
<div class="sp"></div>
<section class="pile" data-fx="drop-pile-physics" data-demo-remove><span class="disc" data-fx-part="item" data-shape="circle">Erased</span></section>
<template data-demo-late><section class="pile" data-fx="drop-pile-physics" data-fx-drop-pile-physics="gravity: .6; bounce: .6"><span class="tag" data-fx-part="item">Late panel</span><span class="disc" data-fx-part="item" data-shape="circle">Won</span></section></template>
<div class="sp"></div>
<section class="pile" data-fx="drop-pile-physics"></section>
<div class="sp"></div>
<script src="../../_vendor/matter-js@0.20.0/matter.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
