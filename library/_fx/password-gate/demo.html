<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>password-gate — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { padding: 48px 20px; display: grid; gap: 64px; justify-items: center; }

  form { width: 350px; max-width: 90%; }
  input { display: block; width: calc(100% - 25px / 1.5); margin: 0 auto 1rem; padding: .5rem; border: 0; border-bottom: 1px solid var(--kf-ink); border-radius: 0; background: transparent; font: 12px/1.2 var(--kf-font-sans); text-align: center; color: var(--kf-ink); }
  input:focus { outline: none; }
  input::placeholder { color: var(--kf-dim); text-transform: uppercase; opacity: 1; }
  button { display: block; width: 100%; margin-top: 1rem; padding: .75rem; border: 0; border-radius: var(--kf-radius-pill); background: transparent; box-shadow: var(--kf-shadow-soft); font: 12px/1.2 var(--kf-font-sans); text-transform: uppercase; color: var(--kf-ink); }
</style>
<script src="../fx-core.js" defer></script>
<script src="fx.js" defer></script>
</head>
<body>
<p class="demo-hint"><b>password-gate</b> — Hover the button, type any text and press it (the correct word is 0000). <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<section class="demo">
  <form data-demo-remove data-fx="password-gate" data-fx-password-gate="answer: 0000; focus: off"><input type="password" data-fx-part="field" placeholder="Password" data-wrong="Wrong password" aria-label="Password"><button data-fx-part="submit">Unlock</button></form>
  <form data-fx="password-gate" data-fx-password-gate="answer: 0000"><input type="password" data-fx-part="field" placeholder="Password" data-wrong="Wrong password" aria-label="Password"><button data-fx-part="submit">Unlock</button></form>
  <template data-demo-late><form data-fx="password-gate" data-fx-password-gate="reset: input; focus: off"><input type="password" data-fx-part="field" placeholder="Password" data-wrong="Try again" aria-label="Password"><button data-fx-part="submit">Unlock</button></form></template>
</section>

<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
