<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>collage-clip-intro — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .stage { position: relative; width: min(100%, 1100px); aspect-ratio: 1440 / 777; margin: 24px auto; }
  .stage > * { position: absolute; }
  .stage .wf-img { height: 100%; }
  .ring { color: var(--kf-accent); }
  .ring svg { display: block; width: 100%; height: auto; overflow: visible; }
  .flat { background: var(--kf-accent-soft); }
</style>
</head>
<body>
<p class="demo-hint"><b>collage-clip-intro</b> — On refresh, the left photo is cropped and rises from below first, a ring is drawn, then the filled shape rises. After 1s one more photo attaches, and after 1.5s the second panel is erased.</p>
<div class="stage" id="one" data-fx="collage-clip-intro">
  <figure data-fx-part="photo" style="left: 3%; top: 8%; width: 7.4%; aspect-ratio: 106 / 148"><div class="wf-img" data-label="Leaf macro"></div></figure>
  <figure data-fx-part="photo" style="left: 16.5%; top: 12%; width: 16.5%; aspect-ratio: 237 / 227"><div class="wf-img" data-label="Swing seat close-up"></div></figure>
  <figure data-fx-part="photo" style="left: 45.5%; top: 5%; width: 15.3%; aspect-ratio: 221 / 159"><div class="wf-img" data-label="Playground Panda"></div></figure>
  <figure data-fx-part="photo" style="left: 53.5%; top: 34%; width: 9.3%; aspect-ratio: 134 / 189"><div class="wf-img" data-label="Waterway"></div></figure>
  <figure data-fx-part="photo" style="left: 69%; top: 12.5%; width: 24%; aspect-ratio: 347 / 475"><div class="wf-img" data-label="Stroll Path Person"></div></figure>
  <div class="ring" data-fx-part="ring" style="left: 86.4%; top: 4.8%; width: 10.8%"><svg viewBox="0 0 156 156"><circle cx="78" cy="78" r="66" stroke-width="23" fill="none" stroke="currentColor" transform="rotate(-90 78 78)"/></svg></div>
  <div class="flat" data-fx-part="shape" style="left: 29%; top: 32%; width: 15%; aspect-ratio: 217 / 238"></div>
  <div class="flat" data-fx-part="shape" style="left: 4%; top: 20.5%; width: 8.5%; aspect-ratio: 123 / 68; clip-path: polygon(0 100%, 0 8%, 18% 43%, 18% 8%, 37% 43%, 37% 8%, 57% 43%, 57% 8%, 76% 43%, 100% 0, 100% 100%)"></div>
</div>
<div class="stage" id="two" data-fx="collage-clip-intro" data-fx-collage-clip-intro="each: .2; ring-dur: 2; gap: .5">
  <figure data-fx-part="photo" style="left: 10%; top: 10%; width: 20%; aspect-ratio: 1"><div class="wf-img" data-label="each .2"></div></figure>
  <figure data-fx-part="photo" style="left: 40%; top: 20%; width: 20%; aspect-ratio: 1"><div class="wf-img" data-label="Deleting soon"></div></figure>
</div>
<div class="stage" id="empty" data-fx="collage-clip-intro"></div>
<script>
  setTimeout(() => {
    const s = document.createElement("div");
    s.className = "stage"; s.dataset.fx = "collage-clip-intro";
    s.innerHTML = '<figure data-fx-part="photo" style="left: 30%; top: 10%; width: 30%; aspect-ratio: 4 / 3"><div class="wf-img" data-label="Panel after 1s"></div></figure><div class="ring" data-fx-part="ring" style="left: 66%; top: 6%; width: 14%"><svg viewBox="0 0 156 156"><circle cx="78" cy="78" r="66" stroke-width="23" fill="none" stroke="currentColor" transform="rotate(-90 78 78)"/></svg></div>';
    document.body.append(s);
  }, 1000);
  setTimeout(() => document.getElementById("two").remove(), 1500);
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/CustomEase.min.js"></script>
<script>gsap.registerPlugin(CustomEase);</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
