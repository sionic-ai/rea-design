<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>vortex-card-funnel — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-contrast-bg); color: var(--kf-contrast-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: relative; z-index: 3; padding: 12px 20px; background: var(--kf-surface); color: var(--kf-ink); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .v { position: relative; height: 320vh; }
  .v [data-fx-part="stage"] { position: sticky; top: 0; height: 100vh; }
  .v h1 { position: fixed; top: 50%; left: 50%; z-index: -1; margin: 0; transform: translate(-50%, -50%); font: 700 12vw/1 var(--kf-font-display); opacity: .3; }
  .v [data-fx-part="card"] { --fx-card: var(--kf-raised); color: var(--kf-ink); }
  .v [data-fx-part="card"]:nth-child(3n) { --fx-card: var(--kf-accent-soft); }
  .small { height: 300px; }
</style>
</head>
<body>
<p class="demo-hint"><b>vortex-card-funnel</b> — Move and drag the mouse. Scrolling down brings the color back to the cards and unfurls them in a funnel spiral.</p>
<section class="v" data-fx="vortex-card-funnel">
  <div data-fx-part="stage"></div>
  <h1 data-fx-part="title">Honors</h1>
  <span data-fx-part="card" data-sub="0000.00">Card 01</span><span data-fx-part="card" data-sub="0000.00">Card 02</span><span data-fx-part="card" data-sub="0000.00">Card 03</span>
  <span data-fx-part="card" data-sub="0000.00">Card 04</span><span data-fx-part="card" data-sub="0000.00">Card 05</span><span data-fx-part="card" data-sub="0000.00">Card 06</span>
  <span data-fx-part="card" data-sub="0000.00">Card 07</span><span data-fx-part="card" data-sub="0000.00">Card 08</span><span data-fx-part="card" data-sub="0000.00">Card 09</span>
  <span data-fx-part="card" data-sub="0000.00">Card 10</span><span data-fx-part="card" data-sub="0000.00">Card 11</span><span data-fx-part="card" data-sub="0000.00">Card 12</span>
</section>
<section class="small" data-fx="vortex-card-funnel" data-demo-remove><span data-fx-part="card">Erase</span></section>
<div id="late"></div>
<section class="small" data-fx="vortex-card-funnel"></section>
<template data-demo-late><section class="small" data-fx="vortex-card-funnel"><span data-fx-part="card">Late 1</span><span data-fx-part="card">Late 2</span></section></template>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../_vendor/three@0.128.0/build/three.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => document.getElementById("late").append(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
