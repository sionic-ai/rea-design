<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bell-stair-flow — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { padding: 60vh 20px 40px; }
  .stair { width: min(100%, 900px); aspect-ratio: 11 / 10; margin-left: auto; }
  .stair + .stair { margin-top: 40vh; width: min(100%, 520px); }
  .tile { background: color-mix(in oklab, var(--kf-ink) 14%, var(--kf-bg)); border: 1px solid var(--kf-line); display: grid; place-items: center; font: 600 28px/1 var(--kf-font-sans); color: var(--kf-dim); }
  .demo-spacer { height: 100vh; display: grid; place-items: center; color: var(--kf-dim); }
</style>
</head>
<body>
<p class="demo-hint"><b>bell-stair-flow</b> — Photo cells flow along the staircase on their own. Scroll down (scrolling pushes the flow further, and scrolling back up reverses it). <span style="color:var(--kf-dim)">(After 1s one more panel comes in, and one leaves 2.5s later)</span></p>
<section class="demo">
  <div class="stair" data-fx="bell-stair-flow" data-demo-remove>
    <div data-fx-part="item"><div class="tile">A</div></div><div data-fx-part="item"><div class="tile">B</div></div><div data-fx-part="item"><div class="tile">C</div></div>
  </div>
  <div class="stair" data-fx="bell-stair-flow">
    <div data-fx-part="item"><div class="tile">1</div></div><div data-fx-part="item"><div class="tile">2</div></div><div data-fx-part="item"><div class="tile">3</div></div><div data-fx-part="item"><div class="tile">4</div></div><div data-fx-part="item"><div class="tile">5</div></div><div data-fx-part="item"><div class="tile">6</div></div><div data-fx-part="item"><div class="tile">7</div></div>
  </div>
  <template data-demo-late><div class="stair" data-fx="bell-stair-flow" data-fx-bell-stair-flow="drift: .003; base: .5"><div data-fx-part="item"><div class="tile">Go</div></div><div data-fx-part="item"><div class="tile">Me</div></div><div data-fx-part="item"><div class="tile">All</div></div><div data-fx-part="item"><div class="tile">Ra</div></div></div></template>
</section>
<div class="demo-spacer">Footer</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script>gsap.registerPlugin(ScrollTrigger);</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); window.ScrollTrigger?.refresh(); }, 2500);
</script>
</body>
</html>
