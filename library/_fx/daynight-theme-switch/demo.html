<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>daynight-theme-switch — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  :root[data-theme="dark"] { --kf-bg: var(--kf-ink); --kf-ink: var(--wf-bg); }
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; min-height: 100vh; }
  .demo-hint { padding: 12px 20px; border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-row { display: flex; gap: 24px; align-items: center; padding: 40px 20px; }
  .dot { position: relative; display: block; width: 13px; height: 13px; }
  .dot input { position: absolute; inset: 0; opacity: 0; margin: 0; }
  .dot span { display: block; width: 13px; height: 13px; border-radius: 50%; background: currentColor; }
</style>
</head>
<body>
<p class="demo-hint"><b>daynight-theme-switch</b> — Click a dot. The day and night skins switch in 1.2 seconds and both dots follow along (at first it is set from the current time).</p>
<div class="demo-row" data-demo-root>
  <label class="dot"><input type="checkbox" data-fx="daynight-theme-switch" aria-label="Day/night toggle"><span></span></label>
  <label class="dot"><input type="checkbox" data-fx="daynight-theme-switch" aria-label="Day/night toggle"><span></span></label>
</div>
<div class="demo-row" data-demo-late-host></div>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Attach one late-arriving dot and detach it after 1.5s
setTimeout(() => {
  const l = document.createElement("label");
  l.className = "dot";
  l.innerHTML = '<input type="checkbox" data-fx="daynight-theme-switch" aria-label="Day/night toggle"><span></span>';
  document.querySelector("[data-demo-late-host]")?.append(l);
  setTimeout(() => l.remove(), 1500);
}, 1000);
</script>
</body>
</html>
