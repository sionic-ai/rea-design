<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fog-wipe-drops — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 14px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .stage { position: relative; height: 70vh; margin: 20px; background: repeating-linear-gradient(45deg, var(--kf-raised) 0 14px, var(--kf-line) 14px 16px); overflow: hidden; }
  .stage p { position: absolute; margin: 0; font: 600 34px/1.1 var(--kf-font-display); }
  .shard { position: absolute; }
  .s1 { left: 6%; top: 8%; width: 40%; height: 60%; clip-path: polygon(22% 0%, 11% 11%, 0% 94%, 2% 98%, 42% 100%, 47% 97%, 98% 7%, 95% 0%); }
  .s2 { left: 52%; top: 20%; width: 34%; height: 70%; clip-path: polygon(32% 2%, 22% 3%, 2% 28%, 3% 35%, 75% 97%, 87% 94%, 100% 52%, 98% 48%); }
  .wiped { background: color-mix(in oklab, var(--kf-accent) 14%, transparent); }
</style>
</head>
<body>
<p class="demo-hint"><b>fog-wipe-drops</b> — After 1.5 seconds two glass pieces fog up. Rub the mouse over a piece to wipe it clean — droplets run down, and 2.4 seconds after you let go it fogs up again. Wipe more than 35% and the piece takes a pale accent tint (fx:wiped).</p>
<div class="stage">
  <p style="left:12%; top:30%">Your translucent text here</p>
  <p style="left:58%; top:56%">Image in the back</p>
  <div class="shard s1" data-fx="fog-wipe-drops" data-fx-fog-wipe-drops="auto: on"></div>
  <div class="shard s2" data-fx="fog-wipe-drops" data-fx-fog-wipe-drops="auto: on; radius: 40" style="--fx-blur: 8px"></div>
</div>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
document.querySelectorAll(".shard").forEach((s) => s.addEventListener("fx:wiped", () => s.classList.add("wiped")));
</script>
</body>
</html>
