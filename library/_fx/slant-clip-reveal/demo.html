<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>slant-clip-reveal — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-stage { position: relative; height: 420px; margin: 30px 20px; }
  .demo-sheet { position: absolute; inset: 0; display: grid; place-items: center; background: var(--kf-contrast-bg); color: var(--kf-contrast-ink); font-size: 32px; }
  .demo-btn { margin: 0 20px; padding: 10px 18px; border: 1px solid var(--kf-line); border-radius: 4px; background: var(--kf-surface); cursor: pointer; }
</style>
</head>
<body>
<p class="demo-hint"><b>slant-clip-reveal</b> — The top panel unfolds as soon as it loads, the bottom panel opens and closes with a button.</p>
<div class="demo-stage"><div class="demo-sheet" data-fx="slant-clip-reveal">Your Hero here</div></div>
<button class="demo-btn" type="button">Open and close</button>
<div class="demo-stage"><div class="demo-sheet demo-menu" data-fx="slant-clip-reveal" data-fx-slant-clip-reveal="on: open; dur: 1.2; ease: 0.16,1,0.3,1" data-open="false">Menu 1 · Menu 2 · Menu 3</div></div>
<script>
document.querySelector(".demo-btn").addEventListener("click", () => {
  document.querySelectorAll(".demo-menu").forEach((m) => { m.dataset.open = m.dataset.open === "true" ? "false" : "true"; });
});
// Late arrivals and removals — checks that fx-core attaches to an element added after 1s and detaches from an element removed after 2.5s
(() => {
  const src = document.querySelector(".demo-stage");
  const html = src.outerHTML;
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => src.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s one more panel comes in and unfolds, and after 2.5s one drops out.");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/CustomEase.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
