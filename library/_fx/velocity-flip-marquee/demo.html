<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>velocity-flip-marquee — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { padding: 48px 20px; }
  .demo-spacer { height: 90vh; display: grid; place-items: center; color: var(--kf-dim); }
  .row { display: flex; gap: 1rem; }
  .cell { flex: none; width: calc(25% - 16px); aspect-ratio: 16 / 9; }
  .band { margin: 24px 0; }
</style>
</head>
<body>
<p class="demo-hint"><b>velocity-flip-marquee</b> — Scroll the page down and up — the band speeds up, and flows in reverse when you scroll up. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<div class="demo-spacer">Scroll down</div>
<section class="demo">
  <div class="band" data-fx="velocity-flip-marquee"><div class="row" data-fx-part="track"><div class="cell wf-img" data-label="Photo 1"></div><div class="cell wf-img" data-label="Photo 2"></div><div class="cell wf-img" data-label="Photo 3"></div><div class="cell wf-img" data-label="Photo 4"></div><div class="cell wf-img" data-label="Photo 5"></div></div></div>
  <div class="band" data-demo-remove data-fx="velocity-flip-marquee" data-fx-velocity-flip-marquee="dur: 10"><div class="row" data-fx-part="track"><div class="cell wf-img" data-label="Photo 1"></div><div class="cell wf-img" data-label="Photo 2"></div><div class="cell wf-img" data-label="Photo 3"></div><div class="cell wf-img" data-label="Photo 4"></div><div class="cell wf-img" data-label="Photo 5"></div></div></div>
  <div class="band" data-fx="velocity-flip-marquee"></div>
  <template data-demo-late><div class="band" data-fx="velocity-flip-marquee" data-fx-velocity-flip-marquee="flip: false"><div class="row" data-fx-part="track"><div class="cell wf-img" data-label="Photo 1"></div><div class="cell wf-img" data-label="Photo 2"></div><div class="cell wf-img" data-label="Photo 3"></div><div class="cell wf-img" data-label="Photo 4"></div><div class="cell wf-img" data-label="Photo 5"></div></div></div></template>
</section>
<div class="demo-spacer">Footer</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); window.ScrollTrigger?.refresh(); }, 2500);
</script>
</body>
</html>
