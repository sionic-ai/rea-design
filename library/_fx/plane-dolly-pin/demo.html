<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>plane-dolly-pin — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { margin: 0; background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .gap { height: 50vh; display: grid; place-items: center; color: var(--kf-dim); }
  .plate { background: var(--kf-raised); border: 1px solid var(--kf-line); aspect-ratio: 3 / 2; }
  .hero { background: color-mix(in oklab, var(--kf-accent) 30%, var(--kf-bg)); }
  .word { left: 0; right: 0; top: 40%; text-align: center; font-size: clamp(4rem, 15vw, 12rem); font-weight: 800; }
  h2 { position: absolute; left: 2rem; bottom: 2rem; margin: 0; font-size: clamp(2.5rem, 7vw, 6rem); }
</style>
</head>
<body>
<p class="demo-hint"><b>plane-dolly-pin</b> — Scroll down. Fly deep past the photo panel to reach the big panel and the name settles (it tilts with the mouse). <span style="color:var(--kf-dim)">(After 1s one more panel comes in, and one leaves 2.5s later)</span></p>
<div class="gap">Downward</div>
<section data-fx="plane-dolly-pin" style="--fx-height: 260vh">
  <div data-fx-part="pin">
    <div data-fx-part="world">
      <div class="hero" data-fx-part="hero" data-z="-2000"></div>
      <div class="plate" data-z="-450" style="top: 10%; left: 6%; width: 26vw"></div>
      <div class="plate" data-z="-950" style="top: 56%; left: 62%; width: 30vw" data-demo-remove></div>
      <p class="word" data-z="-1350">Name here</p>
    </div>
    <h2 data-fx-part="title">REGION ONE</h2>
  </div>
</section>
<template data-demo-late><section data-fx="plane-dolly-pin" style="--fx-height: 200vh"><div data-fx-part="pin"><div data-fx-part="world"><div class="hero" data-fx-part="hero" data-z="-2000"></div><div class="plate" data-z="-600" style="top: 30%; left: 30%; width: 30vw"></div></div><h2 data-fx-part="title">LATE</h2></div></section></template>
<div class="gap">Footer</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
gsap.registerPlugin(ScrollTrigger);
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
