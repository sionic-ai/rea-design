<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>step-wipe-loader — a cover loader like a GIF that plays through once</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { padding: 40px; font-family: var(--kf-font-sans); color: var(--kf-ink); background: var(--kf-bg); }
  .loader { display: grid; place-items: center; }
  .loader svg rect, .loader svg path { fill: var(--kf-accent); }
  .loader [data-fx-part="text"] { transform: rotate(-9deg) skew(-9deg, 0deg); color: var(--kf-on-accent); font-size: 40px; }
  .loader p { margin: 0; }
</style>
</head>
<body>
<p>Try refreshing — the curtain stands for 2.68s, then lifts in six stepped cuts, and the text above it slides in at a slant and disappears (1s later one small curtain is added, 2s later the first curtain drops out).</p>
<div class="loader" id="first" data-fx="step-wipe-loader">
  <svg data-fx-part="frame" viewBox="0 0 100 100" preserveAspectRatio="none"><rect width="100" height="100"/></svg>
  <svg data-fx-part="frame" viewBox="0 0 100 100" preserveAspectRatio="none"><path d="M0 0h100v100H40C30 80 10 70 0 70Z"/></svg>
  <svg data-fx-part="frame" viewBox="0 0 100 100" preserveAspectRatio="none"><path d="M0 0h100v100H70C50 60 20 40 0 30Z"/></svg>
  <svg data-fx-part="frame" viewBox="0 0 100 100" preserveAspectRatio="none"><path d="M30 0h70v70C80 50 60 40 30 0Z"/></svg>
  <svg data-fx-part="frame" viewBox="0 0 100 100" preserveAspectRatio="none"><path d="M60 0h30C85 15 75 20 70 20 66 15 64 8 60 0Z"/></svg>
  <svg data-fx-part="frame" viewBox="0 0 100 100" preserveAspectRatio="none"></svg>
  <div data-fx-part="text"><p data-fx-part="line">Your one-line greeting here</p></div>
</div>
<p>Body below the curtain</p>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
  setTimeout(() => document.body.insertAdjacentHTML("beforeend", '<div class="loader" style="inset:auto 20px 20px auto;width:200px;height:120px" data-fx="step-wipe-loader" data-fx-step-wipe-loader="hold: 1"><svg data-fx-part="frame" viewBox="0 0 100 100" preserveAspectRatio="none"><rect width="100" height="100"/></svg><svg data-fx-part="frame" viewBox="0 0 100 100"></svg></div>'), 1000);
  setTimeout(() => document.getElementById("first").remove(), 2000);
</script>
</body>
</html>
