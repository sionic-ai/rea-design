<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iris-hole-loader — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { margin: 0; padding: 12px 20px; border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .page { display: grid; place-items: center; min-height: 140vh; font: 700 48px/1 var(--kf-font-display); }
  .fig { width: 160px; aspect-ratio: 1; border-radius: 50%; background: var(--kf-raised); }
  .lbl { position: absolute; top: -24px; left: -24px; font: 700 22px/1 var(--kf-font-display); color: var(--kf-accent); }
  .logo { font: 800 64px/1 var(--kf-font-display); }
  #again { position: fixed; right: 20px; bottom: 20px; padding: 10px 16px; }
</style>
</head>
<body>
<p class="demo-hint"><b>iris-hole-loader</b> On open, a white curtain → accent-color circle → the page is revealed through the center hole. Replay it with the bottom-right button.</p>
<main class="page">Page body</main>
<button id="again" type="button">Play again</button>
<script>
const make = () => {
  const s = document.createElement("section");
  s.dataset.fx = "iris-hole-loader";
  s.innerHTML = '<div data-fx-part="figure"><div class="fig"></div><p class="lbl" data-fx-part="label">Loading...</p></div><div data-fx-part="cover"><span class="logo">logo</span></div>';
  document.body.append(s);
  return s;
};
make();
document.getElementById("again").addEventListener("click", () => { document.querySelectorAll('[data-fx="iris-hole-loader"]').forEach((e) => e.remove()); setTimeout(make, 50); });
// Also watches curtains attached late and removed midway (detach)
setTimeout(() => { const s = make(); setTimeout(() => s.remove(), 1500); }, 1000);
</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
