<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>blob-frame-open — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 200; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .hero { height: 80vh; margin: 20px; }
  .hero .wf-img { position: absolute; inset: 0; height: 100%; }
  .hero [data-fx-part="piece"] svg { width: 100%; height: 100%; display: block; }
  .hero [data-fx-part="piece"] path { fill: var(--kf-accent); }
  .hero [data-fx-part="piece"]:nth-of-type(even) path { fill: color-mix(in oklab, var(--kf-accent) 60%, var(--kf-surface)); }
  .hero h1 { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); font-size: 40px; color: var(--kf-surface); }
  .hero [data-fx-part="mark"] { font-size: 28px; color: var(--kf-surface); }
  button { margin: 0 20px; }
</style>
</head>
<body>
<p class="demo-hint"><b>blob-frame-open</b> — On open, chunky pieces cover the screen, then are pushed outward to reveal the center image. Use Replay to start over.</p>
<button type="button" onclick="location.reload()">Again</button>
<section class="hero" data-fx="blob-frame-open">
  <div class="wf-img" data-label="Hero video slot · 16:9"></div>
  <div data-fx-part="base"></div>
  <i data-fx-part="piece" style="top:0;left:0;width:45%;height:60%" data-from="-5vw -10vh" data-to="-20vw -30vh"><svg viewBox="0 0 100 100" preserveAspectRatio="none"><path d="M10 6C30 0 52 10 74 4 94 0 100 20 92 36 84 50 98 66 88 80 76 96 56 86 40 94 20 100 4 90 6 70 8 52 0 38 4 22 6 12 6 8 10 6Z"/></svg></i>
  <i data-fx-part="piece" style="top:0;right:0;width:50%;height:55%" data-from="5vw -8vh" data-to="20vw -30vh"><svg viewBox="0 0 100 100" preserveAspectRatio="none"><path d="M14 12C34 2 52 18 72 8 92 0 100 24 90 40 80 56 98 74 84 88 68 100 50 84 32 92 14 98 2 80 8 62 14 46 0 32 6 20 8 14 10 14 14 12Z"/></svg></i>
  <i data-fx-part="piece" style="bottom:0;left:0;width:55%;height:55%" data-from="-6vw 8vh" data-to="-24vw 30vh"><svg viewBox="0 0 100 100" preserveAspectRatio="none"><path d="M20 2C46 6 70-2 90 10 102 20 94 40 98 58 102 80 84 98 62 94 42 90 26 102 10 90-2 80 6 60 2 42-2 22 4 0 20 2Z"/></svg></i>
  <i data-fx-part="piece" style="bottom:0;right:0;width:50%;height:60%" data-from="6vw 10vh" data-to="22vw 32vh"><svg viewBox="0 0 100 100" preserveAspectRatio="none"><path d="M30 6C58-4 96 6 98 34 100 58 76 62 70 80 64 98 36 104 18 88 2 74 10 52 4 34 0 18 12 10 30 6Z"/></svg></i>
  <div data-fx-part="shade"></div>
  <div data-fx-part="mark">Your logo here</div>
  <div data-fx-part="cover"></div>
  <h1 data-fx-part="rise">Your first phrase here</h1>
</section>
<script>
(() => {
  const src = document.querySelector('[data-fx~="blob-frame-open"]');
  if (!src) return;
  const html = src.outerHTML;
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => src.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical one comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
