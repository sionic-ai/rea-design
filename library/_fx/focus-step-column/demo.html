<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>focus-step-column — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-spacer { height: 80vh; display: grid; place-items: center; color: var(--kf-dim); }
  .demo-col { position: relative; height: 100vh; overflow: hidden; background: var(--kf-surface); }
  .demo-col [data-fx-part="row"] { position: absolute; inset: 0; }
  .demo-col [data-fx-part="item"] { padding: 18px 28px; border: 1px solid var(--kf-line); background: var(--kf-bg); }
  .demo-col .is-active { border-color: var(--kf-accent); }
</style>
</head>
<body>
<p class="demo-hint"><b>focus-step-column</b> — Scroll down and the panel pins, the items in the center vertical column advance one slot at a time and only the center one is sharp. Scroll further and the column exits upward.</p>
<div class="demo-spacer">Downward</div>
<section class="demo-col" data-fx="focus-step-column"><div data-fx-part="row"><div data-fx-part="item">Item 1</div><div data-fx-part="item">Item 2</div><div data-fx-part="item">Item 3</div><div data-fx-part="item">Item 4</div><div data-fx-part="item">Item 5</div><div data-fx-part="item">Item 6</div></div></section>
<div class="demo-spacer">Footer</div>
<script>
(() => {
  const src = document.querySelector('[data-fx~="focus-step-column"]');
  const html = src.outerHTML;
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  (src.closest(".pin-spacer") || src).after(gone);
  setTimeout(() => (src.closest(".pin-spacer") || src).after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical one comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script>gsap.registerPlugin(ScrollTrigger);</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
