<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mosaic-shift — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hero { height: 112.5vw; }
  .demo-pic { background-image: repeating-linear-gradient(0deg, var(--kf-raised) 0 22px, var(--kf-line) 22px 24px), linear-gradient(90deg, var(--kf-surface), var(--kf-raised)); }
  .demo-spacer { height: 80vh; display: grid; place-items: center; color: var(--kf-dim); }
</style>
</head>
<body>
<p class="demo-hint"><b>mosaic-shift</b> — Photo layers rise and line up, then scrolling down shifts each cell differently so they drift out of alignment. The scene changes every 7 seconds. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<div class="demo-hero" data-fx="mosaic-shift" data-fx-mosaic-shift="start: load">
  <div data-fx-part="slide"><div class="wf-img demo-pic" data-label="Hands trimming a stack of tiles · low light · portrait"></div></div>
  <div data-fx-part="slide"><div class="wf-img demo-pic" data-label="Tile shelf in front of kiln · warm light · portrait"></div></div>
</div>
<div class="demo-hero" style="height:40vw" data-fx="mosaic-shift" data-fx-mosaic-shift="start: load; seed: 3" data-demo-remove><div data-fx-part="slide"><div class="wf-img demo-pic" data-label="Panel to be removed soon"></div></div></div>
<template data-demo-late><div class="demo-hero" style="height:40vw" data-fx="mosaic-shift" data-fx-mosaic-shift="start: load; seed: 11"><div data-fx-part="slide"><div class="wf-img demo-pic" data-label="Late panel"></div></div></div></template>
<div class="demo-spacer">Bottom end</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); window.ScrollTrigger?.refresh(); }, 2500);
</script>
</body>
</html>
