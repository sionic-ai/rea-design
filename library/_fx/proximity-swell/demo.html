<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>proximity-swell — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .board { position: relative; height: 80vh; margin: 20px; background: var(--kf-surface); border-radius: var(--kf-radius-lg); }
  .board li { position: absolute; width: 12%; aspect-ratio: 3 / 2; list-style: none; }
  .board .wf-img { height: 100%; }
</style>
</head>
<body>
<p class="demo-hint"><b>proximity-swell</b> — Move the mouse over the panel. Nearby cells swell up to 1.3x depending on distance. <span style="color:var(--kf-dim)">(After 1s one more panel comes in, and one leaves 2.5s later)</span></p>
<ul class="board" data-fx="proximity-swell">
  <li data-fx-part="item" style="left:8%;top:10%"><div class="wf-img" data-label="Scene 1"></div></li>
  <li data-fx-part="item" style="left:34%;top:22%"><div class="wf-img" data-label="Scene 2"></div></li>
  <li data-fx-part="item" style="left:62%;top:8%"><div class="wf-img" data-label="Scene 3"></div></li>
  <li data-fx-part="item" style="left:20%;top:58%"><div class="wf-img" data-label="Scene 4"></div></li>
  <li data-fx-part="item" style="left:52%;top:54%"><div class="wf-img" data-label="Scene 5"></div></li>
  <li data-fx-part="item" style="left:78%;top:62%"><div class="wf-img" data-label="Scene 6"></div></li>
</ul>
<ul class="board" data-demo-remove data-fx="proximity-swell" data-fx-proximity-swell="scale: 1.5; reach: .3" style="height:40vh">
  <li data-fx-part="item" style="left:20%;top:30%"><div class="wf-img" data-label="Exit panel 1"></div></li>
  <li data-fx-part="item" style="left:60%;top:30%"><div class="wf-img" data-label="Exit panel 2"></div></li>
</ul>
<template data-demo-late><ul class="board" data-fx="proximity-swell" style="height:40vh"><li data-fx-part="item" style="left:40%;top:30%"><div class="wf-img" data-label="Late-arriving cell"></div></li></ul></template>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
