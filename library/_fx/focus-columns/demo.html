<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>focus-columns — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-row { margin: 40px 20px; }
  .demo-row .wf-img { position: absolute; inset: 0; height: auto; }
  .demo-row p { margin: 8px 0 0; font-size: 13px; }
</style>
</head>
<body>
<p class="demo-hint"><b>focus-columns</b> — Move the mouse over a cell. The hovered cell grows wider and taller.</p>
<div class="demo-row" data-fx="focus-columns" data-fx-focus-columns="gap: 4">
  <div data-fx-part="col"><div data-fx-part="card"><div class="wf-img" data-label="Work main photo 1 · Portrait"></div></div><p>Your work name 1</p></div>
  <div data-fx-part="col"><div data-fx-part="card"><div class="wf-img" data-label="Work main photo 2 · Portrait"></div></div><p>Your work name 2</p></div>
  <div data-fx-part="col"><div data-fx-part="card"><div class="wf-img" data-label="Work main photo 3 · Portrait"></div></div><p>Your work name 3</p></div>
  <div data-fx-part="col"><div data-fx-part="card"><div class="wf-img" data-label="Work main photo 4 · Portrait"></div></div><p>Your work name 4</p></div>
  <div data-fx-part="col"><div data-fx-part="card"><div class="wf-img" data-label="Work main photo 5 · Portrait"></div></div><p>Your work name 5</p></div>
</div>
<script>
// Late arrivals and removals — checks that fx-core attaches to an element added after 1s and detaches from an element removed after 2.5s
(() => {
  const src = document.querySelector('[data-fx~="focus-columns"]');
  const html = src.outerHTML;
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => src.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s one more of the same row comes in, and after 2.5s one drops out.");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
