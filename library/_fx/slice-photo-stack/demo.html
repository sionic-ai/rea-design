<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>slice-photo-stack — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.6 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .gap { height: 80vh; display: grid; place-items: center; color: var(--kf-dim); }
  .stack { height: 400vh; }
  .stack figure { margin: 0; }
  .stack figure figcaption { position: absolute; right: 24px; bottom: 24px; font: 500 20px/1 var(--kf-font-display); }
  .stack .wf-img { border: 0; }
</style>
</head>
<body>
<p class="demo-hint"><b>slice-photo-stack</b> — Scroll down. The range is divided by the number of photos, and in each slot one photo fills the screen, cross-changing in .5s (1.1 → 1). <span style="color:var(--kf-dim)">(After 1s one more section comes in, and after 2.5s one photo drops out)</span></p>
<div class="gap">↓ Scroll</div>
<div class="stack" data-fx="slice-photo-stack">
  <figure data-fx-part="photo"><div class="wf-img" data-fx-part="image" data-label="Building exterior · overcast day · fills the screen"></div><figcaption>01</figcaption></figure>
  <figure data-fx-part="photo" data-demo-remove><div class="wf-img" data-fx-part="image" data-label="Omitted photo"></div><figcaption>02</figcaption></figure>
  <figure data-fx-part="photo"><div class="wf-img" data-fx-part="image" data-label="Indoors · window light · fills the screen"></div><figcaption>03</figcaption></figure>
  <figure data-fx-part="photo"><figcaption>04 Slot without image</figcaption></figure>
</div>
<div class="gap">Footer</div>
<div class="stack" data-fx="slice-photo-stack" style="height: 10vh"></div>
<template data-demo-late><div class="stack" data-fx="slice-photo-stack" style="height: 200vh"><figure data-fx-part="photo"><div class="wf-img" data-fx-part="image" data-label="Late-arrived Photo"></div><figcaption>Late-arrived Segment</figcaption></figure></div></template>

<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script>gsap.registerPlugin(ScrollTrigger);</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
