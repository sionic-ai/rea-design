<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tile-slide-puzzle — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { padding: 48px 20px; display: grid; gap: 40px; max-width: 1100px; margin: 0 auto; }
  .demo-logo { display: grid; place-items: center; border-radius: 50%; background: var(--kf-ink); color: var(--kf-bg); font: 700 14px/1 var(--kf-font-sans); }
</style>
</head>
<body>
<p class="demo-hint"><b>tile-slide-puzzle</b> — Tiles slide into empty cells. Moving the mouse over a tile shrinks the nearby tiles. After 1 second one more board comes in and one leaves.</p>
<section class="demo" id="demo"></section>
<script>
  const shapes = ["square", "circle", "diamond", "triTl", "arch", "square", "leaf", "square", "quarter", "square", "scoop"];
  const fills = ["var(--kf-accent)", "var(--kf-accent-soft)", "var(--kf-raised)", "var(--kf-ink-soft)"];
  const board = (cols, rows, id) => {
    const b = document.createElement("div");
    b.dataset.fx = "tile-slide-puzzle";
    b.setAttribute("data-fx-tile-slide-puzzle", `cols: ${cols}; rows: ${rows}`);
    if (id) b.id = id;
    let n = 0;
    for (let r = 1; r <= rows; r++) for (let c = 1; c <= cols; c++) {
      if ((c * 7 + r * 3) % 4 === 0) continue;
      if (c === Math.ceil(cols / 2) && r === 2) continue;
      const t = document.createElement("span");
      t.dataset.fxPart = "tile"; t.dataset.col = c; t.dataset.row = r; t.dataset.shape = shapes[n % shapes.length];
      t.style.setProperty("--fx-fill", fills[n++ % fills.length]);
      b.append(t);
    }
    const f = document.createElement("span");
    f.dataset.fxPart = "fixed"; f.dataset.col = Math.ceil(cols / 2); f.dataset.row = 2;
    f.style.setProperty("--fx-col", Math.ceil(cols / 2)); f.style.setProperty("--fx-row", 2);
    f.innerHTML = '<span class="demo-logo" style="width:100%;height:100%">LOGO</span>';
    b.append(f);
    return b;
  };
  const demo = document.getElementById("demo");
  demo.append(board(11, 3), board(7, 3, "gone"));
  const empty = document.createElement("div");
  empty.dataset.fx = "tile-slide-puzzle";
  demo.append(empty);
  setTimeout(() => { demo.append(board(9, 3)); document.getElementById("gone")?.remove(); }, 1000);
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/MorphSVGPlugin.min.js"></script>
<script>gsap.registerPlugin(MorphSVGPlugin);</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
