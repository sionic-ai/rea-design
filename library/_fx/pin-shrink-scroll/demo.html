<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pin-shrink-scroll — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.6 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .pin { position: fixed; left: 0; top: 0; width: 66vw; height: 100vh; overflow: hidden; }
  .pin .art { position: absolute; inset: 5% 10%; }
  .pin .art .wf-img { height: 100%; }
  .col { margin-left: 68vw; width: 28vw; padding: 60px 0 200vh; }
</style>
</head>
<body>
<p class="demo-hint"><b>pin-shrink-scroll</b> Scroll down just a little. The left image shrinks and settles into place, and when you scroll back to the top it grows again. <span style="color:var(--kf-dim)">(After 1s one more image is added, and after 2.5s one leaves)</span></p>
<div class="pin" data-late-pin>
  <div class="art" data-fx="pin-shrink-scroll"><div class="wf-img" data-label="Fixed large image"></div></div>
  <div class="art" data-fx="pin-shrink-scroll" data-demo-remove style="opacity:.3"><div class="wf-img" data-label="Exit image"></div></div>
</div>
<div class="col"><p>Your body text here, two lines. The image stays pinned while the right text column flows.</p></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelector("[data-late-pin]").insertAdjacentHTML("beforeend", '<div class="art" data-fx="pin-shrink-scroll" data-fx-pin-shrink-scroll="top: 1.2; topx: -10" style="inset:30% 30%"><div class="wf-img" data-label="Late-arrived Image"></div></div>'), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
