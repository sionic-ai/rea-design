<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>scroll-globe — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: relative; z-index: 2; margin: 0; padding: 12px 20px; border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); background: var(--kf-surface); }
  .globe { position: fixed; inset: 0; }
  .spacer { height: 400vh; }
  .small { width: 240px; height: 240px; position: fixed; right: 20px; bottom: 20px; }
</style>
</head>
<body>
<p class="demo-hint"><b>scroll-globe</b> — Scroll down to see. The Earth turns while the clouds drift separately.</p>
<div class="globe" data-fx="scroll-globe" data-fx-scroll-globe="turns: 1.5"></div>
<div class="spacer"></div>
<script>
// Late arrivals and removals — after 1s one more small globe is added, and after 2.5s it is removed to check detaching
(() => {
  setTimeout(() => { const el = document.createElement("div"); el.className = "small"; el.dataset.fx = "scroll-globe"; document.body.append(el); setTimeout(() => el.remove(), 1500); }, 1000);
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="three-global.js"></script>
<script src="../../_vendor/three@0.168.0/build/three.cjs"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
