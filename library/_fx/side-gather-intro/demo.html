<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>side-gather-intro — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.6 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 10; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .stage { height: 90vh; }
  .c { position: absolute; left: 40%; top: 18%; width: 20%; height: 64%; }
  .fig { position: absolute; inset: 20% 10% 0; border-radius: 40% 40% 8px 8px; background: var(--kf-raised); }
  .ball { position: absolute; left: 0; top: 0; width: 30%; aspect-ratio: 1; border-radius: 50%; background: var(--kf-accent); }
  .s { position: absolute; width: 10%; height: 40%; border-radius: 30% 30% 6px 6px; background: var(--kf-accent-soft); }
  .gap { height: 80vh; display: grid; place-items: center; color: var(--kf-dim); }
</style>
</head>
<body>
<p class="demo-hint"><b>side-gather-intro</b> — As soon as it opens, a ball floats up and the figure and the crowds on both sides gather. When it ends, scroll down (they scatter). <span style="color:var(--kf-dim)">(After 1s one more panel comes in, and one leaves 2.5s later)</span></p>
<section class="stage" data-fx="side-gather-intro">
  <div class="c" data-fx-part="center"><span class="fig" data-fx-part="figure"></span><span class="ball" data-fx-part="lead"></span></div>
  <span class="s" data-fx-part="left" style="left:8%;top:35%"></span><span class="s" data-fx-part="left" style="left:22%;top:25%"></span>
  <span class="s" data-fx-part="right" style="left:68%;top:30%"></span><span class="s" data-fx-part="right" style="left:82%;top:40%"></span>
</section>
<section class="stage" data-fx="side-gather-intro" data-fx-side-gather-intro="pace: .5; scatter: false" data-demo-remove><div class="c" data-fx-part="center"><span class="ball" data-fx-part="lead"></span></div></section>
<section class="stage" data-fx="side-gather-intro" id="late"></section>
<div class="gap">Footer</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
gsap.registerPlugin(ScrollTrigger);
setTimeout(() => { const s = document.createElement("section"); s.className = "stage"; s.dataset.fx = "side-gather-intro"; s.innerHTML = '<div class="c" data-fx-part="center"><span class="ball" data-fx-part="lead"></span></div>'; document.getElementById("late")?.after(s); }, 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
