<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>letter-hole-scramble — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { padding: 48px 20px; display: flex; flex-wrap: wrap; gap: 32px 64px; }
  .demo-nav { font: 400 14px/1.33 var(--kf-font-mono); text-transform: uppercase; display: flex; gap: 12px; }
  .demo-nav span { opacity: .5; }
  .demo-spacer { height: 90vh; display: grid; place-items: center; color: var(--kf-dim); }
</style>
</head>
<body>
<p class="demo-hint"><b>letter-hole-scramble</b> — Slowly move the mouse over the text. Touched letters go blank and the symbols on both sides wobble.</p>
<section class="demo">
  <a class="demo-nav" href="#"><span>[01]</span><b data-fx="letter-hole-scramble">Collection</b></a>
  <a class="demo-nav" href="#"><span>[02]</span><b data-fx="letter-hole-scramble">About</b></a>
  <a class="demo-nav" href="#"><span>[03]</span><b data-fx="letter-hole-scramble">Place your interest</b></a>
</section>
<div class="demo-spacer">Scroll down ↓</div>
<section class="demo">
  <p class="demo-nav" data-fx="letter-hole-scramble" data-fx-letter-hole-scramble="on: enter">Availability &amp; editions — reveals when in view</p>
</section>
<div class="demo-spacer"></div>
<script>
(() => {
  const src = document.querySelector('[data-fx~="letter-hole-scramble"]');
  const html = src.outerHTML;
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => document.querySelector(".demo").after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical one comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrambleTextPlugin.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
