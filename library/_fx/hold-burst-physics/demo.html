<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hold-burst-physics — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); min-height: 150vh; padding: 24px; }
  .demo-hint { font: 500 13px/1.4 var(--kf-font-mono); }
</style>
</head>
<body>
<p class="demo-hint"><b>hold-burst-physics</b> — Press and hold an empty spot for 1 second — a bar at the bottom fills and props burst and fall from that spot. (1 second later one more prop board comes in, and 2.5 seconds later the first board leaves)</p>
<div data-demo-remove data-fx="hold-burst-physics">
  <i data-fx-part="progress"></i>
  <div data-fx-part="icon" style="width: 80px"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" style="fill:var(--kf-accent)"/></svg></div>
</div>
<template data-demo-late><div data-fx="hold-burst-physics" data-fx-hold-burst-physics="hold: 800; speed: 3-6">
  <i data-fx-part="progress"></i>
  <div data-fx-part="icon" style="width: 96px"><svg viewBox="0 0 100 100"><path d="M50 4 96 92H4z" style="fill:var(--kf-accent-soft)"/></svg></div>
  <div data-fx-part="icon" style="width: 64px"><svg viewBox="0 0 100 100"><rect x="4" y="4" width="92" height="92" rx="18" style="fill:var(--kf-ink)"/></svg></div>
  <div data-fx-part="icon" style="width: 72px"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" style="fill:var(--kf-accent)"/></svg></div>
</div></template>
<div data-fx="hold-burst-physics"></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../_vendor/matter-js@0.20.0/matter.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
