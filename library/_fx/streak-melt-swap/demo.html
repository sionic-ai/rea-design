<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>streak-melt-swap — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .stage { margin: 30px 20px; height: 420px; }
  .stage .s1 { background: var(--kf-accent); }
  .stage .s2 { background: var(--kf-ink); }
  .stage .s3 { background: var(--kf-accent-soft); }
  .stage button { position: absolute; right: 16px; bottom: 16px; padding: 8px 14px; }
</style>
</head>
<body>
<p class="demo-hint"><b>streak-melt-swap</b> — Press “Next”. The panel melts into vertical stripes and changes to the next section. The lower panel advances by itself every 3 seconds.</p>
<div class="stage" data-fx="streak-melt-swap" data-demo-remove><canvas class="s1 is-active" data-fx-part="slide" width="64" height="36"></canvas><div class="s2" data-fx-part="slide"></div><div class="s3" data-fx-part="slide"></div><button type="button" data-fx-part="next">Next</button></div>
<template data-demo-late><div class="stage" data-fx="streak-melt-swap" data-fx-streak-melt-swap="every: 3; dur: 0.8"><div class="s3 is-active" data-fx-part="slide"></div><div class="s1" data-fx-part="slide"></div></div></template>
<div class="stage" data-fx="streak-melt-swap"><div class="s2 is-active" data-fx-part="slide"></div><div class="s3" data-fx-part="slide"></div><button type="button" data-fx-part="next">Next</button></div>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Draws one picture on the canvas section (so the stripes show up well)
const c = document.querySelector("canvas.s1"); if (c) { const g = c.getContext("2d"); for (let i = 0; i < 64; i += 8) { g.fillStyle = i % 16 ? getComputedStyle(document.body).color : getComputedStyle(c).backgroundColor; g.fillRect(i, 0, 8, 36); } }
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
