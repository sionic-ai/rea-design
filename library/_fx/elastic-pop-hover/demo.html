<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>elastic-pop-hover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 300; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { padding: 48px 20px; }
  .demo-spacer { height: 90vh; display: grid; place-items: center; color: var(--kf-dim); }
  .b { display: inline-flex; align-items: center; gap: 8px; padding: 11px 23px; border: 1px solid var(--kf-ink); border-radius: 999px; background: var(--kf-surface); color: var(--kf-ink); font-weight: 700; cursor: pointer; transition: background-color .1s, color .1s; }
  .b:hover, .b:active { background: var(--kf-ink); color: var(--kf-surface); }
  .r { width: 80px; height: 80px; border-radius: 50%; padding: 0; justify-content: center; }
  .row { display: flex; gap: 24px; align-items: center; flex-wrap: wrap; }
</style>
</head>
<body>
<p class="demo-hint"><b>elastic-pop-hover</b> — Hover over the button and leave, then press it — it bounces like rubber and stays, and on release it wobbles back.</p>
<section class="demo"><div class="row" id="row">
  <a class="b" href="#" data-fx="elastic-pop-hover">Your button here</a>
  <button class="b r" type="button" data-fx="elastic-pop-hover" data-fx-elastic-pop-hover="look: ring" aria-label="Next">›</button>
  <a class="b" href="#" data-fx="elastic-pop-hover" data-fx-elastic-pop-hover="scale: 1.2; dur: .8" id="gone">Button to Be Removed</a>
</div></section>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
  setTimeout(() => { const a = document.createElement("a"); a.className = "b"; a.href = "#"; a.textContent = "Late-arrived Button"; a.dataset.fx = "elastic-pop-hover"; document.getElementById("row").append(a); }, 1000);
  setTimeout(() => document.getElementById("gone").remove(), 1500);
</script>
</body>
</html>
