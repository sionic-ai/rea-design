<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ring-spread-cards — cards spreading out from concentric circles</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { padding: 40px; }
  .spacer { height: 90vh; }
  .demo { position: relative; display: grid; grid-template-columns: 1fr 1fr; gap: 120px 160px; max-width: 960px; margin: 0 auto; }
  .demo-hub { position: absolute; inset: 0; pointer-events: none; }
  .demo-ring { position: absolute; top: 50%; left: 50%; aspect-ratio: 1; border-radius: 50%; background: var(--kf-raised); border: 1px solid var(--kf-line); }
  .demo-card { position: relative; z-index: 1; padding: 30px; border: 1px solid var(--kf-line); background: var(--kf-surface); }
</style>
</head>
<body>
<p>Scroll down and once 30% of the panel is visible, the circles light up one by one and the cards spread out from the center.</p>
<div class="spacer"></div>
<div class="demo" data-fx="ring-spread-cards">
  <div class="demo-hub" data-fx-part="hub">
    <i class="demo-ring" data-fx-part="ring" style="width:280px;transform:translate(-50%,-50%)"></i>
    <i class="demo-ring" data-fx-part="ring" style="width:360px;transform:translate(-50%,-50%)"></i>
    <i class="demo-ring" data-fx-part="ring" style="width:470px;transform:translate(-50%,-50%)"></i>
  </div>
  <article class="demo-card" data-fx-part="card">Card 1</article>
  <article class="demo-card" data-fx-part="card">Card 2</article>
  <article class="demo-card" data-fx-part="card">Card 3</article>
  <article class="demo-card" data-fx-part="card">Card 4</article>
</div>
<div data-fx="ring-spread-cards" data-demo-remove><article data-fx-part="card">Card to Be Removed</article></div>
<template data-demo-late><div class="demo" data-fx="ring-spread-cards" data-fx-ring-spread-cards="pull: 60; keep: 0"><article class="demo-card" data-fx-part="card">Late 1</article><article class="demo-card" data-fx-part="card">Late 2</article></div></template>
<div data-fx="ring-spread-cards"></div>
<div class="spacer"></div>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
