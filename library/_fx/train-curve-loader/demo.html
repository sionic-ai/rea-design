<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>train-curve-loader — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 13px/1.7 var(--kf-font-mono); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { width: min(560px, 90vw); margin: 40px auto; display: grid; gap: 14px; padding: 24px; border: 1px solid var(--kf-line); border-radius: var(--kf-radius-md); }
  .demo svg { width: 100%; height: 90px; overflow: visible; }
  .demo .bar { height: 8px; background: var(--kf-accent-soft); }
  .demo .row { display: flex; justify-content: space-between; }
  .demo [data-fx-part="go"] { display: flex; gap: 10px; }
  .demo button { flex: 1; padding: 12px; border: 1px solid var(--kf-line); border-radius: var(--kf-radius-md); background: none; color: var(--kf-ink); font: inherit; }
</style>
</head>
<body>
<p class="demo-hint"><b>train-curve-loader</b> — A loss curve is drawn and logs pile up, press the Enter button and the panel lifts away.</p>
<div class="demo" data-fx="train-curve-loader">
  <p>$ python train.py --model name-1 --data ./room</p>
  <svg aria-hidden="true"><polyline data-fx-part="curve" points=""/><circle data-fx-part="dot" r="2.5"/></svg>
  <p class="row"><span>loss</span><b data-fx-part="now"></b></p>
  <ol data-fx-part="log"></ol>
  <p data-fx-part="live"></p>
  <p class="row"><span data-fx-part="msg">Booting</span><span data-fx-part="pct">0%</span></p>
  <div class="bar"><i data-fx-part="fill"></i></div>
  <div data-fx-part="go" hidden><button data-sound="on">Enter with sound</button><button data-sound="off">Enter without</button></div>
</div>
<script>
(() => {
  const src = document.querySelector('[data-fx~="train-curve-loader"]');
  if (!src) return;
  const make = (tag) => { const el = document.createElement("div"); el.className = "demo"; el.dataset.fx = "train-curve-loader"; el.dataset.demo = tag; el.textContent = "Childless board"; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => src.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another blank panel comes in, and after 2.5s one leaves (detach).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
