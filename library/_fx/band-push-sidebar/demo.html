<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>band-push-sidebar — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .side { position: fixed; left: 20px; top: 64px; z-index: 5; width: 120px; height: calc(100vh - 96px); min-height: 360px; border-radius: var(--kf-radius-lg); background: var(--kf-contrast-bg); color: var(--kf-contrast-ink); display: grid; place-items: center; font-weight: 700; }
  .side[data-demo="late"] { left: 150px; }
  .main { padding: 24px 24px 0 300px; }
  .card { height: 70vh; margin-bottom: 24px; border-radius: var(--kf-radius-lg); background: var(--kf-surface); display: grid; place-items: center; color: var(--kf-dim); }
  .band { position: relative; z-index: 6; height: 360px; padding: 40px 64px; background: var(--kf-raised); display: grid; place-items: center; }
  .foot { height: 300px; background: var(--kf-contrast-bg); color: var(--kf-contrast-ink); display: grid; place-items: center; }
</style>
</head>
<body>
<p class="demo-hint"><b>band-push-sidebar</b> — Scroll down. A wide band rises and, on reaching the sidebar, the sidebar is pushed up together over the band.</p>
<aside class="side" data-fx="band-push-sidebar" data-fx-band-push-sidebar="stop: .band">Sidebar</aside>
<main class="main">
  <div class="card">Your Hero here</div>
  <div class="card">Your second section here</div>
</main>
<section class="band">Full-width banner strip here (where the sidebar stops)</section>
<footer class="foot">Your footer here</footer>
<script>
// Late arrivals and removals — checks that fx-core attaches to an element added after 1s and detaches from an element removed after 2.5s
(() => {
  const src = document.querySelector('[data-fx~="band-push-sidebar"]');
  if (!src) return;
  const html = src.outerHTML.replace(/\sid="[^"]*"/g, "");
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => src.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical one comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
