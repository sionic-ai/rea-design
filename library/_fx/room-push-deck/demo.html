<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>room-push-deck — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .deck { height: 70vh; margin: 20px; border: 1px solid var(--kf-line); }
  .deck [data-fx-part="room"] { display: grid; place-items: center; font: 500 48px/1 var(--kf-font-sans); }
  .deck [data-fx-part="room"]:nth-child(odd) { background: var(--kf-raised); }
  .deck [data-fx-part="room"]:nth-child(even) { background: var(--kf-accent-soft); }
  .deck nav { position: absolute; left: 50%; bottom: 16px; translate: -50% 0; display: flex; gap: 10px; z-index: 2; }
  .deck [data-fx-part="dot"] { width: 14px; height: 14px; border: 1px solid currentColor; border-radius: 50%; }
  .deck [data-fx-part="dot"][aria-current="true"] { background: currentColor; }
</style>
</head>
<body>
<p class="demo-hint"><b>room-push-deck</b> — Scroll the wheel over the panel, or press the ←→ keys or the dots below. The current room is pushed out and the next one comes in from the side (up and down on narrow screens).</p>
<main class="deck" data-fx="room-push-deck" data-demo-remove>
  <section data-fx-part="room">1</section>
  <section data-fx-part="room">2</section>
  <section data-fx-part="room">3</section>
  <nav><a data-fx-part="dot" href="#" aria-label="Room 1"></a><a data-fx-part="dot" href="#" aria-label="Room 2"></a><a data-fx-part="dot" href="#" aria-label="Room 3"></a></nav>
</main>
<template data-demo-late><main class="deck" data-fx="room-push-deck"><section data-fx-part="room">A</section><section data-fx-part="room">B</section></main></template>
<main class="deck" data-fx="room-push-deck"></main>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/CustomEase.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
