<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>log-tilt-card — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.6 var(--kf-font-sans); }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .row { display: flex; gap: 48px; padding: 80px 40px; }
  .card { width: 300px; }
  .card [data-fx-part="inner"] { display: block; padding: 12px; background: var(--kf-surface); }
  .pic { position: relative; display: block; overflow: hidden; }
  .pic .wf-img { aspect-ratio: 3 / 2; }
  .card b { display: block; margin-top: 16px; }
</style>
</head>
<body>
<p class="demo-hint"><b>log-tilt-card</b> — Move the mouse over a card. The card tilts toward the mouse and the light follows. <span style="color:var(--kf-dim)">(One more card comes in after 1s, and one drops out after 2.5s)</span></p>
<div class="row" data-demo-row>
  <a class="card" href="#" data-fx="log-tilt-card"><span data-fx-part="inner"><span class="pic"><span class="wf-img" data-label="Lodging exterior · 3:2"></span><span data-fx-part="glow"></span></span><b>Book now</b></span></a>
  <a class="card" href="#" data-demo-remove data-fx="log-tilt-card"><span data-fx-part="inner"><span class="pic"><span class="wf-img" data-label="Card to Be Removed"></span></span><b>Item to Be Removed</b></span></a>
</div>
<template data-demo-late><a class="card" href="#" data-fx="log-tilt-card" data-fx-log-tilt-card="k: .8"><span data-fx-part="inner"><span class="pic"><span class="wf-img" data-label="Late card · k .8"></span><span data-fx-part="glow"></span></span><b>Late one</b></span></a></template>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => document.querySelector("[data-demo-row]").append(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
