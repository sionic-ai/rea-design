<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lag-thumb-follow — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 500 15px/1.6 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 10; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .list { max-width: 900px; margin: 48px auto; border-top: 1px solid var(--kf-ink); }
  .list a { display: flex; justify-content: space-between; padding: 22px 0 30px; border-bottom: 1px solid var(--kf-ink); }
  .ph { display: grid; place-items: center; background: var(--kf-raised); color: var(--kf-dim); font-size: 11px; }
</style>
</head>
<body>
<p class="demo-hint"><b>lag-thumb-follow</b> — Move the mouse over the list. A small card follows late and the photo changes for each row. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<div class="list" data-fx="lag-thumb-follow">
  <a href="#" data-fx-part="item"><time>0000.00.00</time><span>News line 1</span></a>
  <a href="#" data-fx-part="item"><time>0000.00.00</time><span>News line 2</span></a>
  <a href="#" data-fx-part="item"><time>0000.00.00</time><span>News line 3</span></a>
  <div data-fx-part="thumb"><div class="ph" data-fx-part="photo">Photo 1</div><div class="ph" data-fx-part="photo">Photo 2</div><div class="ph" data-fx-part="photo">Photo 3</div></div>
</div>
<div class="list" data-fx="lag-thumb-follow" data-demo-remove>
  <a href="#" data-fx-part="item"><span>Omitted list</span></a>
  <div data-fx-part="thumb"><div class="ph" data-fx-part="photo">Photo</div></div>
</div>
<template data-demo-late><div class="list" data-fx="lag-thumb-follow" data-fx-lag-thumb-follow="decay: 0.6" style="--fx-filter: none">
  <a href="#" data-fx-part="item"><span>Late-arriving list 1 (decay 0.6)</span></a>
  <a href="#" data-fx-part="item"><span>Late-added list 2</span></a>
  <div data-fx-part="thumb"><div class="ph" data-fx-part="photo">Photo A</div><div class="ph" data-fx-part="photo">Photo B</div></div>
</div></template>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
