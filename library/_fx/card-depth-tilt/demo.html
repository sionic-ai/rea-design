<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>card-depth-tilt — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { display: flex; flex-wrap: wrap; gap: 40px; justify-content: center; padding: 96px 20px; }
  .demo-card { width: 240px; padding: 10px; border-radius: 12px; background: var(--kf-surface); box-shadow: var(--kf-shadow-lift); display: flex; flex-direction: column; gap: 10px; }
  .demo-frame { position: relative; aspect-ratio: 4 / 5; border-radius: 8px; }
  .demo-frame .wf-img { position: absolute; inset: 0; height: 100%; }
  .demo-name { padding: 8px; border-radius: 999px; background: var(--kf-accent); color: var(--kf-on-accent); text-align: center; font-weight: 700; }
</style>
</head>
<body>
<p class="demo-hint"><b>card-depth-tilt</b> — Move the mouse over the card. The card tilts toward the cursor and the photo shifts the opposite way. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<main class="demo">
  <article class="demo-card" data-fx="card-depth-tilt"><div class="demo-frame" data-fx-part="frame"><div class="wf-img" data-fx-part="photo" data-label="Stage performance · portrait 4:5"></div></div><p class="demo-name" data-fx-part="near">Your name here</p></article>
  <article class="demo-card" data-fx="card-depth-tilt" data-fx-card-depth-tilt="tilt: 5; zoom: 1.07; shift: 2.25" data-demo-remove><div class="demo-frame" data-fx-part="frame"><div class="wf-img" data-fx-part="photo" data-label="Performer half-length shot · portrait 4:5"></div></div><p class="demo-name" data-fx-part="near">5° card</p></article>
  <article class="demo-card" data-fx="card-depth-tilt"><p class="demo-name">Card without photo</p></article>
  <template data-demo-late><article class="demo-card" data-fx="card-depth-tilt"><div class="demo-frame" data-fx-part="frame"><div class="wf-img" data-fx-part="photo" data-label="Late-entering card · vertical"></div></div><p class="demo-name" data-fx-part="near">Enters late</p></article></template>
</main>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
