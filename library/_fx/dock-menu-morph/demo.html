<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dock-menu-morph — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  html { font-size: 10px; }
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .tall { height: 180vh; padding: 40px 20px; }
  .demo-link { display: block; font-size: 3.2rem; line-height: 3.6rem; }
</style>
</head>
<body>
<p class="demo-hint"><b>dock-menu-morph</b> — Press a section name in the dock at bottom center, or ≡. It opens by itself when you reach the bottom. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<div class="tall">Body here — scroll to the end</div>
<nav data-fx="dock-menu-morph">
  <div data-fx-part="panel"><i data-fx-part="panel-bg"></i><p data-fx-part="panel-head">Menu</p>
    <a data-fx-part="link" class="demo-link" href="#">About</a><a data-fx-part="link" class="demo-link" href="#">Collection</a><a data-fx-part="link" class="demo-link" href="#">Work</a>
    <a data-fx-part="cta" href="#">Receive a quote</a></div>
  <div data-fx-part="dock"><i data-fx-part="bg"></i><a data-fx-part="mark" href="#">◇</a><span data-fx-part="title">Current Section</span><button data-fx-part="open" type="button">≡</button><button data-fx-part="close" type="button">×</button><button data-fx-part="top" type="button">↑</button></div>
</nav>
<nav data-fx="dock-menu-morph" data-demo-remove style="--fx-bottom: 12rem"><div data-fx-part="panel"></div><div data-fx-part="dock"><i data-fx-part="bg"></i><span data-fx-part="title">Being removed soon</span></div></nav>
<template data-demo-late><nav data-fx="dock-menu-morph" data-fx-dock-menu-morph="dur: .3; end: 0" style="--fx-bottom: 12rem"><div data-fx-part="panel"><i data-fx-part="panel-bg"></i><a data-fx-part="link" class="demo-link" href="#">Late-arrived Menu</a></div><div data-fx-part="dock"><i data-fx-part="bg"></i><span data-fx-part="title">Delayed dock · .3s</span><button data-fx-part="close" type="button">×</button></div></nav></template>
<nav data-fx="dock-menu-morph"></nav>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
