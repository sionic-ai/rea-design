<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fixed-zoom-window — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.6 var(--kf-font-sans); }
  .demo-hint { position: relative; z-index: 2; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .text { display: grid; place-items: center; height: 80vh; background: var(--kf-bg); }
</style>
</head>
<body>
<p class="demo-hint"><b>fixed-zoom-window</b> — Scroll down. The cell reflects a pinned photo, and while the cell slides up the photo returns from 1.2x to its normal size. <span style="color:var(--kf-dim)">(After 1s one more cell comes in, and one leaves 2.5s later)</span></p>
<div class="text">Text sheet</div>
<div data-fx="fixed-zoom-window" data-demo-list><div data-fx-part="frame"><div data-fx-part="media" class="wf-img" data-label="Sea view · Landscape 16:9"></div></div></div>
<div class="text">Text sheet</div>
<div data-fx="fixed-zoom-window" data-demo-remove><div data-fx-part="frame"><div data-fx-part="media" class="wf-img" data-label="Cell to Be Removed"></div></div></div>
<div class="text" data-demo-tail>Text sheet</div>
<template data-demo-late><div data-fx="fixed-zoom-window" data-fx-fixed-zoom-window="zoom: 1.4; y: 20%"><div data-fx-part="frame"><div data-fx-part="media" class="wf-img" data-label="Late Cell · 1.4x"></div></div></div></template>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => document.querySelector("[data-demo-tail]").before(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
