<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cover-darken — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: fixed; top: 0; left: 0; right: 0; z-index: 10; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-cover { display: grid; place-items: center; background: var(--kf-bg); }
  .demo-cover .wf-img { width: 40vw; aspect-ratio: 4 / 5; }
  .demo-body { position: relative; z-index: 1; background: var(--kf-bg); min-height: 150vh; padding: 40px 20px; font: 600 32px/1.2 var(--kf-font-display); }
</style>
</head>
<body>
<p class="demo-hint"><b>cover-darken</b> — Scroll down and the panel below covers the Hero while the Hero darkens.</p>
<div>
  <header class="demo-cover" data-fx="cover-darken"><div class="wf-img" data-label="Hero photo"></div></header>
  <main class="demo-body">Incoming overlay body<span data-fx="cover-darken" data-demo-remove></span><template data-demo-late><span data-fx="cover-darken" data-fx-cover-darken="amount: 0; distance: 0"></span></template></main>
</div>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
