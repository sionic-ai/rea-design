<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>peel-carry-sticker — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { position: relative; display: flex; flex-wrap: wrap; justify-content: center; gap: 60px; padding: 100px 20px; }
  .demo-pill { display: block; padding: 12px 20px; border: 4px solid var(--kf-surface); border-radius: 100px; font: 700 18px/1.2 var(--kf-font-sans); color: var(--kf-on-accent); background: var(--kf-accent); white-space: nowrap; }
  .demo-dot { display: block; width: 110px; height: 110px; border: 6px solid var(--kf-surface); border-radius: 50%; background: var(--kf-accent-soft); }
</style>
</head>
<body>
<p class="demo-hint"><b>peel-carry-sticker</b> — Press and drag the sticker. It peels from the edges, and once more than half is peeled it sticks to your hand, then when released it falls and re-sticks in place 2.5 seconds later.</p>
<section class="demo">
  <div data-fx="peel-carry-sticker" style="--rot:-10deg"><span data-fx-part="art"><span class="demo-pill">Your sticker text here</span></span></div>
  <div data-fx="peel-carry-sticker" style="--rot:8deg"><span data-fx-part="art"><span class="demo-dot"></span></span></div>
</section>
<script>
(() => {
  const src = document.querySelector('[data-fx~="peel-carry-sticker"]');
  if (!src) return;
  const html = src.outerHTML;
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => src.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s one more sticker comes in (a late arrival), and after 2.5s one drops out (detach).");
})();
</script>
<script src="../../_vendor/peel.js@1.0.1/peel.global.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
