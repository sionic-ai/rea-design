<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rolling-digits — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-box { margin: 32px 20px; padding: 24px; border: 1px solid var(--kf-line); display: flex; gap: 24px; align-items: center; flex-wrap: wrap; font: 500 28px/1.2 var(--kf-font-mono); }
  .demo-box button { font: 500 14px/1 var(--kf-font-sans); padding: 10px 14px; border: 1px solid var(--kf-line); background: var(--kf-surface); border-radius: var(--kf-radius-sm); cursor: pointer; }
</style>
</head>
<body>
<p class="demo-hint"><b>rolling-digits</b> The top two numbers count up by themselves (same key, so together), and the bottom number rolls when you press the button.</p>
<div class="demo-box">
  <span data-fx="rolling-digits" data-value="129951" data-fx-rolling-digits="live: 900; key: demo">129,951</span>
  <span data-fx="rolling-digits" data-value="129951" data-fx-rolling-digits="live: 900; key: demo">129,951</span>
</div>
<div class="demo-box">
  <span id="price" data-fx="rolling-digits" data-value="450" data-fx-rolling-digits="suffix: /mo">450</span>
  <button type="button" id="swap">450 ↔ 540</button>
  <span data-fx="rolling-digits" data-value="77.4051" data-fx-rolling-digits="decimals: 4; suffix: %">77.4051</span>
</div>
<script>
(() => {
  const price = document.getElementById("price");
  document.getElementById("swap").addEventListener("click", () => { price.dataset.value = price.dataset.value === "450" ? "540" : "450"; });
  const src = document.querySelector('[data-fx~="rolling-digits"]');
  const make = (tag) => { const el = document.createElement("span"); el.setAttribute("data-fx", "rolling-digits"); el.dataset.value = "21190"; el.dataset.demo = tag; el.textContent = "21,190"; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => src.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
