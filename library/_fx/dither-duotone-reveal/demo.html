<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dither-duotone-reveal — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: sticky; top: 0; z-index: 10; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-pad { height: 60vh; display: grid; place-items: center; color: var(--kf-dim); }
  .demo-row { display: flex; flex-wrap: wrap; gap: 32px; justify-content: center; padding: 40px 20px; }
  .demo-row figure { width: min(420px, 86vw); aspect-ratio: 16 / 10; margin: 0; }
  .demo-dark { background: var(--kf-ink); }
</style>
</head>
<body>
<p class="demo-hint"><b>dither-duotone-reveal</b> — Scroll down. Photos spread out as dots from the center, and the second-row photo at bottom right reveals the original photo on hover. (One more comes in after 1s and one leaves after 2.5s)</p>
<div class="demo-pad">↓</div>
<div class="demo-row">
  <figure data-fx="dither-duotone-reveal"><img data-fx-part="src" alt=""></figure>
  <figure data-demo-remove data-fx="dither-duotone-reveal"><img data-fx-part="src" alt=""></figure>
  <figure data-fx="dither-duotone-reveal"></figure>
</div>
<div class="demo-row demo-dark">
  <figure data-fx="dither-duotone-reveal" data-fx-dither-duotone-reveal="look: hover"><img data-fx-part="src" alt=""></figure>
  <template data-demo-late><figure data-fx="dither-duotone-reveal"><img data-fx-part="src" alt=""></figure></template>
</div>
<div class="demo-pad"></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Demo image: draw two spheres lit from the upper left and one tilted panel, and insert as a data URL
const shade = (v) => `rgb(${v} ${v} ${v})`; // Not skin: brightness of the graphic to be dotted
const art = (() => {
  const c = document.createElement("canvas"), x = c.getContext("2d");
  c.width = 640; c.height = 400;
  x.fillStyle = shade(170); x.fillRect(0, 0, 640, 400);
  const ball = (cx, cy, r) => {
    const g = x.createRadialGradient(cx - r * 0.4, cy - r * 0.4, r * 0.1, cx, cy, r);
    g.addColorStop(0, shade(250)); g.addColorStop(0.7, shade(90)); g.addColorStop(1, shade(20));
    x.fillStyle = g; x.beginPath(); x.arc(cx, cy, r, 0, Math.PI * 2); x.fill();
  };
  ball(200, 260, 120); ball(430, 120, 50);
  x.fillStyle = shade(60); x.beginPath(); x.moveTo(380, 400); x.lineTo(640, 180); x.lineTo(640, 400); x.fill();
  return c.toDataURL();
})();
const fill = (root) => root.querySelectorAll('[data-fx-part="src"]').forEach((i) => (i.src = art));
fill(document);
setTimeout(() => {
  const t = document.querySelector("template[data-demo-late]");
  const el = t.content.firstElementChild.cloneNode(true);
  fill(el);
  t.parentElement.append(el);
}, 1000);
setTimeout(() => document.querySelector("[data-demo-remove]")?.remove(), 2500);
</script>
</body>
</html>
