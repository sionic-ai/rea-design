<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>orbit-name-cursor — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .rows { padding: 40px 20px 120px; }
  .rows a { display: block; padding: 28px 0; border-bottom: 1px solid var(--kf-line); font: 800 clamp(2rem, 5vw, 4rem)/1 var(--kf-font-display); text-transform: uppercase; }
</style>
</head>
<body>
<p class="demo-hint"><b>orbit-name-cursor</b> — Hover over a list row. The circle grows and the name orbits around it. <span style="color:var(--kf-dim)">(After 1s one more line comes in, and one leaves 2.5s later)</span></p>
<main class="rows" data-fx="orbit-name-cursor">
  <a href="#" data-fx-part="view" data-cursor-label="Open" data-cursor-name="Project One">Project One</a>
  <a href="#" data-fx-part="view" data-cursor-label="Open" data-cursor-name="Project Two">Project Two</a>
  <a href="#" data-fx-part="view" data-demo-remove>Excluded row (no name)</a>
  <template data-demo-late><a href="#" data-fx-part="view" data-cursor-name="Late Item">Late Item</a></template>
</main>
<div data-fx="orbit-name-cursor"></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
