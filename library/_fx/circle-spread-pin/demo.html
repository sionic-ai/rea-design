<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>circle-spread-pin — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .sec { display: grid; place-items: center; min-height: 100vh; padding: 80px 24px; text-align: center; }
  .sec h2 { font-size: 40px; }
  .next { padding-top: calc(500px + 50svh); }
  .next .card { max-width: 520px; margin: 0 auto; padding: 40px; border-radius: var(--kf-radius-md); background: var(--kf-surface); box-shadow: var(--kf-shadow-soft); }
  .tail { height: 80vh; }
</style>
</head>
<body>
<p class="demo-hint"><b>circle-spread-pin</b> — Scroll down. While the next section rises over the pinned first one, a circle spreads from the center and changes the background.</p>
<section class="sec" data-fx="circle-spread-pin"><h2>Your section title here</h2></section>
<section class="sec next"><div class="card">A block of next Section content here</div></section>
<div id="host"></div>
<div class="tail"></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Late arrivals and removals — after 1 second a small plate that spreads only as a circle (pin: off) is added, and after 2.5 seconds it is removed (detach)
(() => {
  const late = document.createElement("section");
  late.className = "sec";
  late.setAttribute("data-fx", "circle-spread-pin");
  late.setAttribute("data-fx-circle-spread-pin", "pin: off; length: +=100%");
  late.innerHTML = "<h2>Your late-arriving section here</h2>";
  setTimeout(() => document.getElementById("host").append(late), 1000);
  setTimeout(() => late.remove(), 2500);
})();
</script>
</body>
</html>
