<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>clay-smear-drag — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { margin: 0; background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .paper { min-height: 70vh; padding: 40px 20px; border-bottom: 1px solid var(--kf-line); }
  .paper h2 { font: 400 64px/1 var(--kf-font-display); }
</style>
</head>
<body>
<p class="demo-hint"><b>clay-smear-drag</b> — Press on the paper, then drag while pressed. Clay marks remain and soak away a few seconds later.</p>
<section class="paper" data-fx="clay-smear-drag"><h2>Press and drag</h2><p>Press and drag anywhere here. <a href="#">Link above</a>It is not recorded here.</p></section>
<section class="paper" data-demo-remove data-fx="clay-smear-drag"><h2>Panel that disappears after 2.5s</h2></section>
<template data-demo-late><section class="paper" data-fx="clay-smear-drag" data-fx-clay-smear-drag="hold: 1; fade: 2; reach: 300"><h2>Late-arriving version (short stay)</h2></section></template>
<section class="paper" data-fx="clay-smear-drag"></section>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
