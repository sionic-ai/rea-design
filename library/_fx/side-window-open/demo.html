<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>side-window-open — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="../side-scroll-page/fx.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: fixed; left: 0; right: 0; top: 0; z-index: 100; margin: 0; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo > * { min-height: 60vh; }
  .intro { padding: 80px 40px; }
  .intro h2 { font-size: 40px; font-weight: var(--kf-weight-display); transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1); }
  .demo:has(.is-fx-open) .intro h2 { opacity: 0; }
  .shot { background: linear-gradient(135deg, var(--kf-contrast-bg), var(--kf-accent)); }
  .next { padding: 80px 40px; background: var(--kf-contrast-bg); color: var(--kf-contrast-ink); }
  @media (min-width: 782px) and (max-aspect-ratio: 3/1) {
    .intro, [data-fx~="side-window-open"] { width: 100vw; }
    .next { width: 1165px; }
  }
  @media (max-width: 781px), (min-aspect-ratio: 3/1) {
    [data-fx~="side-window-open"] { aspect-ratio: 390 / 500; }
  }
</style>
</head>
<body>
<p class="demo-hint"><b>side-window-open</b> Roll the wheel down. A narrow window on the right moves to the center, stops, and opens to fill the whole screen. <span style="color:var(--kf-dim)">(One more window pane is attached after 1s, and one drops out after 2.5s)</span></p>
<main class="demo" data-fx="side-scroll-page">
  <section class="intro"><h2>Your Hero title here</h2></section>
  <div data-fx="side-window-open"><div data-fx-part="media" class="shot"></div></div>
  <section class="next"><h2>Next section</h2></section>
  <div data-fx="side-window-open" data-demo-remove><div data-fx-part="media" class="shot"></div></div>
  <section class="next"><h2>Last section</h2></section>
</main>
<script src="../../_vendor/lenis@1.1.21/lenis.min.js"></script>
<script src="../fx-core.js"></script>
<script src="../side-scroll-page/fx.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => { const d = document.createElement("div"); d.dataset.fx = "side-window-open"; d.innerHTML = '<div data-fx-part="media" class="shot"></div>'; document.querySelector(".demo")?.append(d); }, 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); }, 2500);
</script>
</body>
</html>
