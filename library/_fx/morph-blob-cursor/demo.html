<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>morph-blob-cursor — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { margin: 0; min-height: 100vh; background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { margin: 0; padding: 12px 20px; border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { display: flex; flex-wrap: wrap; gap: 16px; padding: 48px 20px; }
  .demo a, .demo button { padding: 14px 24px; border: 2px solid var(--kf-ink); border-radius: var(--kf-radius-md); background: none; color: var(--kf-ink); font: inherit; cursor: pointer; }
</style>
</head>
<body>
<p class="demo-hint"><b>morph-blob-cursor</b> — Move the mouse. Over links the blob grows and tints, and pressing Transition curtain covers the screen and lifts 1.2 seconds later.</p>
<section class="demo" id="demo">
  <div data-fx="morph-blob-cursor" id="one"></div>
  <a href="#a">Base color link</a>
  <a href="#b" data-blob-color="var(--kf-accent)">Accent link</a>
  <button type="button" data-blob-color="var(--kf-ink)" id="flood">Flip bar</button>
  <div data-fx="morph-blob-cursor" id="gone" data-fx-morph-blob-cursor="follow: .3"></div>
</section>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
  document.getElementById("flood").addEventListener("click", () => {
    document.dispatchEvent(new CustomEvent("fx:flood", { detail: { on: true } }));
    setTimeout(() => document.dispatchEvent(new CustomEvent("fx:flood", { detail: { on: false } })), 1200);
  });
  // Checks that it attaches to late elements (after 1s) and that detach runs when removed (after 2.5s)
  setTimeout(() => {
    const late = document.createElement("div");
    late.setAttribute("data-fx", "morph-blob-cursor");
    late.setAttribute("data-fx-morph-blob-cursor", "follow: .05");
    document.getElementById("demo").append(late);
  }, 1000);
  setTimeout(() => document.getElementById("gone")?.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s one more droplet attaches, and after 2.5s one drops off.");
</script>
</body>
</html>
