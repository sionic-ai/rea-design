<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>webgl-photo-strip — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { margin: 0; background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); overflow: hidden; }
  .demo-hint { position: fixed; top: 0; left: 0; right: 0; z-index: 3; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .stage { position: fixed; inset: 0; }
  .stage [data-fx-part="item"] { display: block; margin: 8px auto; width: 200px; aspect-ratio: 217 / 269; }
  .title { position: fixed; left: 40px; top: 39%; z-index: 2; font: 700 14px/1.1 var(--kf-font-display); text-transform: uppercase; }
</style>
</head>
<body>
<p class="demo-hint"><b>webgl-photo-strip</b> — Spin or drag the wheel. The photo strip flows stickily, and hovering a cell changes the title on the left.</p>
<p class="title">Work 1</p>
<section class="stage" data-fx="webgl-photo-strip">
  <a data-fx-part="item" href="#" data-label="Photo 1 · Portrait">Work 1</a>
  <a data-fx-part="item" href="#" data-label="Photo 2 · Portrait">Work 2</a>
  <a data-fx-part="item" href="#" data-label="Photo 3 · Portrait" data-locked>Work 3</a>
  <a data-fx-part="item" href="#" data-label="Photo 4 · Portrait">Work 4</a>
</section>
<section class="stage" data-fx="webgl-photo-strip" data-demo="empty" style="display:none"></section>
<script>
(() => {
  document.addEventListener("fx:active", (e) => (document.querySelector(".title").textContent = e.detail.item.textContent));
  const src = document.querySelector(".stage"), html = src.outerHTML;
  setTimeout(() => { const t = document.createElement("template"); t.innerHTML = html; const late = t.content.firstElementChild; late.style.cssText = "left:60%;width:40%"; src.after(late); }, 1000);
  setTimeout(() => document.querySelector('[data-demo="empty"]').remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s one more band comes in, and after 2.5s one empty panel drops out.");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/CustomEase.min.js"></script>
<script src="three-global.js"></script>
<script src="../../_vendor/three@0.185.0/build/three.cjs"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
