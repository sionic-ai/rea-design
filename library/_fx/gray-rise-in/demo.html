<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gray-rise-in — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-spacer { height: 90vh; display: grid; place-items: center; color: var(--kf-dim); }
  .demo-row { display: flex; gap: 16px; padding: 0 10vw; margin-bottom: 80px; }
  .demo-row > * { flex: 1; aspect-ratio: 3 / 4; background: var(--kf-accent); }
  h2[data-fx] { margin: 0 0 80px; font: 600 32px/1.2 var(--kf-font-display); letter-spacing: 0.12em; color: var(--kf-dim); }
</style>
</head>
<body>
<p class="demo-hint"><b>gray-rise-in</b> — Scroll down and cards rise one after another, turning from grayscale to color. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<div class="demo-spacer">Scroll down</div>
<div class="demo-row" data-fx="gray-rise-in" data-demo-remove><i data-fx-part="item"></i><i data-fx-part="item"></i></div>
<div class="demo-row" data-fx="gray-rise-in"><i data-fx-part="item"></i><i data-fx-part="item"></i><i data-fx-part="item"></i></div>
<template data-demo-late><div class="demo-row" data-fx="gray-rise-in" data-fx-gray-rise-in="each: 0; y: 60"><i data-fx-part="item"></i><i data-fx-part="item"></i></div></template>
<div class="demo-row" data-fx="gray-rise-in"></div>
<div class="demo-spacer"></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
