<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>burst-type — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: sticky; top: 0; z-index: 100; margin: 0; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { padding: 48px 20px; display: grid; gap: 16px; justify-items: start; }
  .bubble { display: inline-block; min-height: 1.5em; padding: 10px 16px; border-radius: 16px; background: var(--kf-surface); box-shadow: var(--kf-shadow-soft); }
  .bubble--ai { background: var(--kf-accent); color: var(--kf-on-accent); }
  .demo-btn { height: 40px; padding: 0 16px; border: 1px solid var(--kf-line); border-radius: var(--kf-radius-sm); background: var(--kf-surface); color: var(--kf-ink); cursor: pointer; }
</style>
</head>
<body>
<p class="demo-hint"><b>burst-type</b> — Speech bubble text is typed a few characters at a time. Press the button to type again.</p>
<section class="demo">
  <span class="bubble" data-fx="burst-type" data-fx-burst-type="on: load; seed: 21">Could you take a look at this? We’ll confirm before Friday.</span>
  <span class="bubble bubble--ai" data-fx="burst-type" data-fx-burst-type="on: load; burst: 8; slips: false; seed: 40; delay: 1.2">Let me organize what needs to be checked.</span>
  <span class="bubble" data-fx="burst-type" data-fx-burst-type="on: load; seed: 9; again: 1.5" data-text="会議の|かいぎの 前に|まえに 見よう|みよう">会議の前に見よう</span>
  <button class="demo-btn" type="button" onclick="document.querySelectorAll('[data-fx~=burst-type]').forEach((b) => b.dispatchEvent(new Event('fx:play')))">Retype</button>
</section>
<script>
// Late arrivals and removals — checks that fx-core attaches to an element added after 1s and detaches from an element removed after 2.5s
(() => {
  const src = document.querySelector('[data-fx~="burst-type"]');
  if (!src) return;
  const html = src.outerHTML;
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => src.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1 second one more identical speech bubble comes in (the late arrival), and after 2.5 seconds one is removed (detached).");
})();
</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
