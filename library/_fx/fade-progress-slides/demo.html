<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fade-progress-slides — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .box { max-width: 720px; margin: 40px auto; }
  .stage { display: grid; place-items: center; aspect-ratio: 16 / 9; background: var(--kf-contrast-bg); overflow: hidden; }
  .stage span { display: block; width: 26%; aspect-ratio: 2 / 3; background: var(--kf-accent-soft); }
  .bar { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 14px 0; }
  .bar [data-fx-part="track"] { display: block; width: 80px; height: 1px; background: var(--kf-line); }
</style>
</head>
<body>
<p class="demo-hint"><b>fade-progress-slides</b> — Crossfades to the next slide every 3.6 seconds. Hovering over the panel pauses it and the cover follows the cursor slightly.</p>
<div class="box" data-fx="fade-progress-slides">
  <div data-fx-part="slide"><div class="stage"><span data-fx-part="media"></span></div><div class="bar"><b>Section One</b><span>1 <span data-fx-part="track"><i data-fx-part="fill"></i></span> 3</span></div></div>
  <div data-fx-part="slide"><div class="stage"><span data-fx-part="media" style="background:var(--kf-accent)"></span></div><div class="bar"><b>Section Two</b><span>2 <span data-fx-part="track"><i data-fx-part="fill"></i></span> 3</span></div></div>
  <div data-fx-part="slide"><div class="stage"><span data-fx-part="media" style="background:var(--kf-line)"></span></div><div class="bar"><b>Section Three</b><span>3 <span data-fx-part="track"><i data-fx-part="fill"></i></span> 3</span></div></div>
</div>
<div class="box" data-demo-remove data-fx="fade-progress-slides" data-fx-fade-progress-slides="each: 1.5; follow: 0"><div data-fx-part="slide"><div class="stage"></div></div><div data-fx-part="slide"><div class="stage" style="background:var(--kf-accent)"></div></div></div>
<template data-demo-late><div class="box" data-fx="fade-progress-slides"><div data-fx-part="slide"><div class="stage"></div></div></div></template>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
