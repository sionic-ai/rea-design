<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bar-reveal-after — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { padding: 48px 20px; }
  .demo-spacer { height: 90vh; display: grid; place-items: center; color: var(--kf-dim); }

  .strip { position: fixed; top: 46px; left: 0; right: 0; z-index: 50; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 12px/1 var(--kf-font-mono); }
  .hero { height: 100vh; display: grid; place-items: center; font: 700 64px/1 var(--kf-font-display); } .long { height: 200vh; }
</style>
</head>
<body>
<p class="demo-hint"><b>bar-reveal-after</b> — Scroll past the first section and a bar drops down at the top. Scroll back up and it hides. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<div data-demo-remove class="strip" data-fx="bar-reveal-after" data-fx-bar-reveal-after="after: .hero">Bar 001 · 0:00 · Segment list ▾</div><div class="strip" data-fx="bar-reveal-after" data-fx-bar-reveal-after="after: .hero">Bar 001 · 0:00 · Segment list ▾</div><template data-demo-late><div class="strip" data-fx="bar-reveal-after" data-fx-bar-reveal-after="after: .hero">Bar 001 · 0:00 · Segment list ▾</div></template><section class="hero">Your first section here</section><div class="long"></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../../../_shared/vendor/gsap/CustomEase.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); window.ScrollTrigger?.refresh(); }, 2500);
</script>
</body>
</html>
