<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ring-redraw-btn — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.6 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 10; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .row { display: flex; flex-wrap: wrap; gap: 48px; padding: 48px; }
  .row a { color: var(--kf-accent); font-weight: 600; letter-spacing: 0.1em; }
  .gap { height: 60vh; display: grid; place-items: center; color: var(--kf-dim); }
</style>
</head>
<body>
<p class="demo-hint"><b>ring-redraw-btn</b> — Hover over the round button. The ring goes out and is drawn again. <span style="color:var(--kf-dim)">(After 1s one more button comes in, and after 2.5s one drops out)</span></p>
<div class="row" id="row">
  <a href="#" data-fx="ring-redraw-btn"><span data-fx-part="icon"></span><span data-fx-part="label">View details</span></a>
  <a href="#" data-fx="ring-redraw-btn" data-fx-ring-redraw-btn="enter: none" style="--fx-size: 52px"><span data-fx-part="icon"></span><span data-fx-part="label">Small button</span></a>
  <a href="#" data-fx="ring-redraw-btn" data-demo-remove><span data-fx-part="icon"></span><span data-fx-part="label">Omitted button</span></a>
  <a href="#" data-fx="ring-redraw-btn"><span data-fx-part="label">Button without ring cell</span></a>
</div>
<div class="gap">Downward</div>
<div class="row"><a href="#" data-fx="ring-redraw-btn"><span data-fx-part="icon"></span><span data-fx-part="label">Button that rises with scroll</span></a></div>
<div class="gap">Footer</div>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => { const a = document.createElement("a"); a.href = "#"; a.dataset.fx = "ring-redraw-btn"; a.innerHTML = '<span data-fx-part="icon"></span><span data-fx-part="label">Late-arriving button</span>'; document.getElementById("row").append(a); }, 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
