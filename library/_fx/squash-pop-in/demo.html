<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>squash-pop-in — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 2; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .gap { height: 90vh; }
  .row { display: flex; gap: 40px; justify-content: center; align-items: flex-end; padding: 40px; }
  .sym { display: block; width: 160px; fill: var(--kf-accent); stroke: var(--kf-ink); stroke-width: 2; }
</style>
</head>
<body>
<p class="demo-hint"><b>squash-pop-in</b> — Scroll down. Once in the center band of the screen, the flower overshoots and settles, and the leaf pops out squashed horizontally and vertically. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<div class="gap"></div>
<div class="row" id="row">
  <span data-fx="squash-pop-in" data-fx-squash-pop-in="look: leaf"><svg class="sym" viewBox="0 0 100 60"><path d="M5 55Q20 5 95 5Q80 55 5 55z"/></svg></span>
  <span data-fx="squash-pop-in" data-fx-squash-pop-in="delay: .5"><svg class="sym" viewBox="0 0 100 100"><circle cx="50" cy="25" r="20"/><circle cx="25" cy="55" r="20"/><circle cx="75" cy="55" r="20"/><circle cx="50" cy="80" r="20"/></svg></span>
  <span data-fx="squash-pop-in" data-demo-remove><svg class="sym" viewBox="0 0 100 100"><circle cx="50" cy="50" r="40"/></svg></span>
</div>
<template data-demo-late><span data-fx="squash-pop-in"><svg class="sym" viewBox="0 0 100 100"><rect x="15" y="15" width="70" height="70" rx="20"/></svg></span></template>
<div class="gap"></div>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => document.getElementById("row").append(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
