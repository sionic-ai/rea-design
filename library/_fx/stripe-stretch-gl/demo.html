<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>stripe-stretch-gl — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .pad { height: 60vh; display: grid; place-content: center; }
  .hero { height: 100vh; }
  .hero h1 { position: absolute; inset: 0; display: grid; place-items: center; font: 400 12vw/1 var(--kf-font-display); color: var(--kf-bg); mix-blend-mode: difference; z-index: 2; margin: 0; }
  .mark { height: 30vh; margin: 0 2rem; }
</style>
</head>
<body>
<p class="demo-hint"><b>stripe-stretch-gl</b> — Scroll down. The top of the image stretches into vertical stripes in the color of the row below, and the wordmark below stretches vertically together with the stripes. <span style="color:var(--kf-dim)">(After 1s one more panel comes in, and one leaves 2.5s later)</span></p>
<section class="hero" data-fx="stripe-stretch-gl"><canvas data-fx-part="source" width="600" height="900"></canvas><h1>Big Title</h1></section>
<div class="pad">Center Whitespace</div>
<div class="mark" data-fx="stripe-stretch-gl" data-fx-stripe-stretch-gl="look: stretch; fit: contain" data-demo-remove><canvas data-fx-part="source" width="1600" height="300"></canvas></div>
<template data-demo-late><div class="mark" data-fx="stripe-stretch-gl" data-fx-stripe-stretch-gl="pin: false; base: .3"><canvas data-fx-part="source" width="600" height="300"></canvas></div></template>
<div class="pad">Bottom margin</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
gsap.registerPlugin(ScrollTrigger);
const paint = (cv) => {
  const c = cv.getContext("2d"), s = getComputedStyle(document.documentElement);
  c.fillStyle = s.getPropertyValue("--kf-bg"); c.fillRect(0, 0, cv.width, cv.height);
  c.fillStyle = s.getPropertyValue("--kf-accent");
  for (let i = 0; i < 7; i++) { c.beginPath(); c.ellipse(cv.width / 2 + (i % 3 - 1) * cv.width * .12, cv.height * (.12 + i * .1), cv.width * .14, cv.height * .07, 0, 0, Math.PI * 2); c.fill(); }
  c.fillStyle = s.getPropertyValue("--kf-ink"); c.fillRect(cv.width / 2 - 6, cv.height * .78, 12, cv.height * .22);
};
document.querySelectorAll("canvas[data-fx-part=source]").forEach(paint);
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => { const n = t.content.cloneNode(true); paint(n.querySelector("canvas")); t.replaceWith(n); }), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); }, 2500);
</script>
</body>
</html>
