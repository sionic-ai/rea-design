<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>walk-crowd-strip — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .stage { margin: 40px 0; border-bottom: 1px solid var(--kf-line); }
</style>
</head>
<body>
<p class="demo-hint"><b>walk-crowd-strip</b> — People walk to the right along the strip (steps are cut into frames while the strip flows smoothly). <span style="color:var(--kf-dim)">(After 1s one more band comes in, and one leaves 2.5s later)</span></p>
<div class="stage" data-fx="walk-crowd-strip"></div>
<div class="stage" data-fx="walk-crowd-strip" data-fx-walk-crowd-strip="dir: left" style="--fx-h: 60px; --fx-h-wide: 100px; --fx-loop: 12" data-demo-remove></div>
<template data-demo-late><div class="stage" data-fx="walk-crowd-strip" data-fx-walk-crowd-strip="steps: 8; cycle: 0.8" style="--fx-h-wide: 120px"></div></template>
<div class="stage" data-fx="walk-crowd-strip" style="width:0;height:0"></div>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
