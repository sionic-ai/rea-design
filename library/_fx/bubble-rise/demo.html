<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bubble-rise — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { margin: 0; padding: 12px 20px; border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .tank { position: relative; height: 70vh; margin: 24px; border-radius: var(--kf-radius-lg); background: var(--kf-accent); overflow: hidden; }
  .long { height: 200vh; display: grid; place-items: center; }
</style>
</head>
<body>
<p class="demo-hint"><b>bubble-rise</b> — Bubbles rise endlessly in the top panel. Scrolling down, bubbles float up across the whole screen.</p>
<div class="tank" id="tank"><canvas data-fx="bubble-rise"></canvas></div>
<div class="tank gone"><canvas data-fx="bubble-rise"></canvas></div>
<canvas data-fx="bubble-rise" data-fx-bubble-rise="mode: scroll; look: fixed"></canvas>
<div class="long">Try scrolling</div>
<script>
setTimeout(() => { const d = document.createElement("div"); d.className = "tank"; d.innerHTML = '<canvas data-fx="bubble-rise" data-fx-bubble-rise="len: 4; size-max: 60"></canvas>'; document.getElementById("tank").after(d); }, 1000);
setTimeout(() => document.querySelector(".gone")?.remove(), 2500);
</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
