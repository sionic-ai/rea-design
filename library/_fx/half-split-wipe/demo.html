<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>half-split-wipe — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-spacer { height: 70vh; display: grid; place-items: center; color: var(--kf-dim); }
  .layer { display: grid; place-items: center; color: var(--kf-on-accent); font: 600 14px/1 var(--kf-font-mono); }
  .l1 { background: var(--kf-ink); } .l2 { background: var(--kf-accent); } .l3 { background: var(--kf-dim); }
  .copy { font: 900 9vh/1 var(--kf-font-sans); }
  .after { height: 100vh; display: grid; place-items: center; background: var(--kf-surface); }
</style>
</head>
<body>
<p class="demo-hint"><b>half-split-wipe</b> — Scrolling down, the left photo peels away upward and the right photo downward, and at the end a half panel splits open. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<div class="demo-spacer">Scroll down</div>
<section data-demo-remove data-fx="half-split-wipe"><div data-fx-part="stage">
  <div data-fx-part="left"><figure class="layer l1" data-fx-part="layer">Left 1</figure><figure class="layer l2" data-fx-part="layer">Left 2</figure><figure class="layer l3" data-fx-part="layer">Left 3</figure></div>
  <div data-fx-part="right"><figure class="layer l2" data-fx-part="layer">Right 1</figure><figure class="layer l3" data-fx-part="layer">Right 2</figure><figure class="layer l1" data-fx-part="layer">Right 3</figure></div>
  <p class="copy" data-fx-part="copy">Put in two lines</p><p class="copy" data-fx-part="copy">Your big title here</p>
</div></section>
<section data-fx="half-split-wipe" data-fx-half-split-wipe="step: 1; copy: 0"><div data-fx-part="stage">
  <div data-fx-part="left"><figure class="layer l2" data-fx-part="layer">One step — left</figure></div>
  <div data-fx-part="right"><figure class="layer l1" data-fx-part="layer">One step — right</figure></div>
</div></section>
<template data-demo-late><section data-fx="half-split-wipe"><div data-fx-part="stage"><div data-fx-part="left"><figure class="layer l1" data-fx-part="layer">Late-arriving panel</figure></div><div data-fx-part="right"><figure class="layer l3" data-fx-part="layer">Late-arriving panel</figure></div></div></section></template>
<div class="after">Section shown behind</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); window.ScrollTrigger?.refresh(); }, 2500);
</script>
</body>
</html>
