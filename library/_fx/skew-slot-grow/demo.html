<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>skew-slot-grow — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { padding: 48px 40px; display: grid; gap: 32px; }
  .row { height: 360px; }
  .row [data-fx-part="slot"] { background: var(--kf-raised); border-right: 1px solid var(--kf-line); }
</style>
</head>
<body>
<p class="demo-hint"><b>skew-slot-grow</b> — Hover over a cell or tap one. The chosen cell widens and the others step back.</p>
<section class="demo">
  <div class="row" data-fx="skew-slot-grow">
    <a data-fx-part="slot" href="#"><span data-fx-part="label">Fork 1</span></a>
    <a data-fx-part="slot" href="#"><span data-fx-part="label">Fork 2</span></a>
    <a data-fx-part="slot" href="#"><span data-fx-part="label">Fork 3</span></a>
    <a data-fx-part="slot" href="#"><span data-fx-part="label">Fork 4</span></a>
  </div>
  <div class="row" data-fx="skew-slot-grow" data-demo-remove></div>
  <div id="late"></div>
</section>
<template data-demo-late><div class="row" data-fx="skew-slot-grow" style="--fx-skew: -6deg; --fx-grow: 2"><a data-fx-part="slot" href="#"><span data-fx-part="label">Late 1</span></a><a data-fx-part="slot" href="#"><span data-fx-part="label">Late 2</span></a><a data-fx-part="slot" href="#"><span data-fx-part="label">Late 3</span></a></div></template>
<script src="../fx-core.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => document.getElementById("late").append(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
