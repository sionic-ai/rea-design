<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tilt-band-drift — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .stage { position: relative; height: 640px; overflow: hidden; background: var(--kf-contrast-bg); }
  .bands { position: absolute; inset: 0; }
  .bands [data-fx-part="band"] { position: absolute; left: -50%; width: 200%; border-block: 1px solid var(--kf-contrast-ink); }
  .bands [data-fx-part="band"]:nth-child(1) { top: 0; }
  .bands [data-fx-part="band"]:nth-child(2) { top: 80px; }
  .bands [data-fx-part="band"]:nth-child(3) { top: 220px; }
  .bands [data-fx-part="band"]:nth-child(4) { top: 330px; }
  .bands [data-fx-part="band"]:nth-child(5) { top: 450px; }
  .bands span { width: 212px; font: 500 22px var(--kf-font-display); color: var(--kf-contrast-ink); }
  .card { position: relative; z-index: 2; width: min(520px, 80%); margin: 180px auto 0; padding: 32px; border-radius: var(--kf-radius-lg); background: var(--kf-surface); }
</style>
</head>
<body>
<p class="demo-hint"><b>tilt-band-drift</b> — Slanted text bands flow in alternating directions line by line (400px per 20 seconds). The center panel is content laid over them.</p>
<section class="stage">
  <div class="bands" data-fx="tilt-band-drift" data-fx-tilt-band-drift="first: 0; tilt: -10 14">
    <i data-fx-part="band"><span>● Work Archive</span></i>
    <i data-fx-part="band"><span>● Work Archive</span></i>
    <i data-fx-part="band"><span>● Work Archive</span></i>
    <i data-fx-part="band" data-demo-remove><span>● Work Archive</span></i>
    <i data-fx-part="band"><span>● Work Archive</span></i>
  </div>
  <div class="card">Your center content here — screenshot or button</div>
</section>
<section class="stage" style="height:320px; margin-top:24px">
  <template data-demo-late><div class="bands" data-fx="tilt-band-drift" data-fx-tilt-band-drift="tilt: 6 -6; dist: 212; dur: 8"><i data-fx-part="band" style="top:60px"><span>● Late-entry band</span></i><i data-fx-part="band" style="top:180px"><span>● Late-entry band</span></i></div></template>
  <div class="bands" data-fx="tilt-band-drift" data-demo-remove><i data-fx-part="band" style="top:120px"><span>● Band that drops out soon</span></i></div>
  <div class="bands" data-fx="tilt-band-drift"></div>
</section>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); }, 2500);
</script>
</body>
</html>
