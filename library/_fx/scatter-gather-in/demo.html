<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>scatter-gather-in — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 16px/1.7 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 10; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .gap { height: 70vh; display: grid; place-items: center; color: var(--kf-dim); }
  .field { position: relative; height: 90vh; overflow: hidden; background: var(--kf-surface); display: grid; place-items: center; }
  .field h2 { font: 400 clamp(40px, 6vw, 84px)/1 var(--kf-font-display); letter-spacing: .1em; }
  .pic { position: absolute; aspect-ratio: 4 / 3; background: color-mix(in oklab, var(--kf-accent) 40%, var(--kf-bg)); }
</style>
</head>
<body>
<p class="demo-hint"><b>scatter-gather-in</b> — Scroll down until the top edge of the gray section touches the top of the screen. The surrounding photos gather from half size into place. <span style="color:var(--kf-dim)">(One more photo comes in after 1s, and one drops out after 2.5s)</span></p>
<div class="gap">Downward</div>
<section class="field" data-fx="scatter-gather-in">
  <h2>Gather</h2>
  <i class="pic" data-fx-part="item" style="left: 0; top: 29%; width: 25%; --fx-x: 100%; --fx-y: 50%"></i>
  <i class="pic" data-fx-part="item" style="left: 14%; top: 74%; width: 18%; --fx-x: 100%; --fx-y: -100%"></i>
  <i class="pic" data-fx-part="item" style="right: 16%; top: 17%; width: 16%; --fx-x: -100%; --fx-y: 100%"></i>
  <i class="pic" data-fx-part="item" data-demo-remove style="right: 4%; top: 47%; width: 20%; --fx-x: -100%; --fx-y: -30%"></i>
</section>
<div class="gap"></div>
<template data-demo-late><i class="pic" data-fx-part="item" style="right: 17%; top: 81%; width: 14%; --fx-x: -100%; --fx-y: -100%"></i></template>
<template data-demo-late-box><section class="field" data-fx="scatter-gather-in" data-fx-scatter-gather-in="dur: .8; at: 200"><h2>Late</h2></section></template>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => {
  const field = document.querySelector(".field");
  document.querySelectorAll("template[data-demo-late]").forEach((t) => field?.append(t.content.cloneNode(true)));
  document.querySelectorAll("template[data-demo-late-box]").forEach((t) => t.replaceWith(t.content.cloneNode(true)));
}, 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
