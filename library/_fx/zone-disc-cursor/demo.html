<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>zone-disc-cursor — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { margin: 0; background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; padding: 40px 20px; }
  .card { aspect-ratio: 1.4; display: grid; place-items: center; background: var(--kf-surface); border: 1px solid var(--kf-line); }
  .card a { padding: 4px 8px; border: 1px solid; }
</style>
</head>
<body data-fx="zone-disc-cursor">
<p class="demo-hint"><b>zone-disc-cursor</b> — Hover over a card. The disc changes shape, and the Rotate card spins half a turn on each press.</p>
<div class="grid">
  <div class="card" data-fx-part="zone" data-cursor="view" data-cursor-bg="var(--kf-accent)" data-cursor-ink="var(--kf-on-accent)">View <a href="#" data-cursor="none">Off on Link Hover</a></div>
  <div class="card" data-fx-part="zone" data-cursor="scroll">Downward</div>
  <div><div class="card" data-fx-part="zone" data-cursor="rotate">Spin — give it a press</div></div>
  <div class="card" data-demo-remove data-fx-part="zone" data-cursor="Erased">Disappears after 1s</div>
</div>
<template data-demo-late><div class="card" data-fx-part="zone" data-cursor="Late">Late-arrived spot</div></template>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/CustomEase.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => document.querySelector(".grid").append(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 1000);
</script>
</body>
</html>
