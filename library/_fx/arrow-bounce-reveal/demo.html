<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>arrow-bounce-reveal — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 2; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .gap { height: 70vh; }
  .cta { position: relative; width: fit-content; margin: 160px auto; }
  .btn { display: inline-flex; padding: 22px 60px; border-radius: var(--kf-radius-pill); background: var(--kf-ink); color: var(--kf-surface); font-weight: 700; }
  .cta [data-fx~="arrow-bounce-reveal"] { position: absolute; right: -70px; bottom: 60%; width: 46px; }
  .cta.left [data-fx~="arrow-bounce-reveal"] { right: auto; left: -70px; }
  .arrow { width: 100%; height: auto; color: var(--kf-ink); }
</style>
</head>
<body>
<p class="demo-hint"><b>arrow-bounce-reveal</b> — Scroll down. After the arrow next to the button is drawn, it bounces toward the button. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<div class="gap"></div>
<div class="cta"><a class="btn" href="#">View details</a>
  <span data-fx="arrow-bounce-reveal"><span data-fx-part="bounce"><svg data-fx-part="arrow" class="arrow" viewBox="0 0 48 106" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"><path d="M38 6C20 30 14 60 16 98M16 98 6 80M16 98 30 84"/></svg></span></span>
</div>
<div class="cta left" id="late"><a class="btn" href="#">Left arrow</a>
  <span data-fx="arrow-bounce-reveal" data-fx-arrow-bounce-reveal="look: ul-lr" data-demo-remove style="--fx-amp:.5"><span data-fx-part="bounce"><svg data-fx-part="arrow" class="arrow" viewBox="0 0 48 106" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" style="transform:scaleX(-1)"><path d="M38 6C20 30 14 60 16 98M16 98 6 80M16 98 30 84"/></svg></span></span>
  <span data-fx="arrow-bounce-reveal"></span>
</div>
<template data-demo-late><span data-fx="arrow-bounce-reveal" style="right:-140px"><span data-fx-part="bounce"><svg data-fx-part="arrow" class="arrow" viewBox="0 0 48 106" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"><path d="M38 6C20 30 14 60 16 98M16 98 6 80M16 98 30 84"/></svg></span></span></template>
<div class="gap"></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => document.getElementById("late").append(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
