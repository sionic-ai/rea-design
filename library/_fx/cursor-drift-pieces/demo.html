<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cursor-drift-pieces — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { height: 70vh; display: flex; align-items: center; justify-content: center; text-align: center; font: var(--kf-weight-display) 5vw/1 var(--kf-font-display); }
  .demo figure { position: absolute; width: 14vw; aspect-ratio: 3 / 2; margin: 0; border-radius: var(--kf-radius-md); }
</style>
</head>
<body>
<p class="demo-hint"><b>cursor-drift-pieces</b> — Move the mouse over the panel. Photos follow the cursor or move the opposite way. <span style="color:var(--kf-dim)">(After 1 second one more panel with a photo enters, and after 2.5 seconds one photo leaves)</span></p>
<section class="demo" id="box" data-fx="cursor-drift-pieces">
  <figure class="wf-img" data-fx-part="piece" data-label="Photo 1" style="top:66%; left:-2.5rem"></figure>
  <figure class="wf-img" data-fx-part="piece" data-dir="-1" data-label="Photo 2" style="top:5rem; left:5rem"></figure>
  <figure class="wf-img" data-fx-part="piece" data-label="Photo 3" style="bottom:0; left:33%" data-demo-remove></figure>
  <figure class="wf-img" data-fx-part="piece" data-dir="-1" data-y="-30" data-label="Photo 4 · Scroll" style="top:0; right:10rem"></figure>
  <p>Your center sentence here</p>
</section>
<section data-fx="cursor-drift-pieces" style="height:20vh"></section>
<div style="height:80vh"></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => { const s = document.createElement("section"); s.className = "demo"; s.dataset.fx = "cursor-drift-pieces"; s.innerHTML = '<figure class="wf-img" data-fx-part="piece" data-label="Late-arrived Photo" style="top:20%; right:20%"></figure><p>Late panel</p>'; document.getElementById("box")?.after(s); }, 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
