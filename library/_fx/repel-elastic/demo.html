<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>repel-elastic — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo-spacer { height: 90vh; display: grid; place-items: center; color: var(--kf-dim); }
  .stage { min-height: 70vh; margin: 40px 20px; border: 1px solid var(--kf-line); color: var(--kf-ink); }
  .stage [data-fx-part="item"] { position: absolute; display: block; }
  .stage svg { width: 100%; height: auto; }
  .stage .n { font: 700 3rem/1 var(--kf-font-display); }
</style>
</head>
<body>
<p class="demo-hint"><b>repel-elastic</b> — Move the mouse between the objects — the nearest ones are pushed away and spin, then wobble back into place as you move off. If the mouse is outside the board, the center of the screen pushes them as you scroll.</p>
<div class="demo-spacer">Scroll down</div>
<section class="stage" data-fx="repel-elastic">
  <div data-fx-part="item" style="width:28%;top:12%;left:30%"><svg viewBox="0 0 200 200"><path fill="currentColor" d="M100 18l18 50 52-14-34 42 40 34-52 2 6 52-34-40-38 36 10-50-50-8 44-28-26-46 50 18Z"/></svg></div>
  <div data-fx-part="item" style="width:12%;top:20%;right:30%;rotate:-18deg"><svg viewBox="0 0 200 200"><path fill="currentColor" opacity=".5" d="M100 172C40 128 18 98 30 64c10-28 46-34 70-6 24-28 60-22 70 6 12 34-10 64-70 108Z"/></svg></div>
  <div data-fx-part="item" style="width:9%;bottom:30%;right:34%"><svg viewBox="0 0 200 200"><circle fill="currentColor" opacity=".35" cx="100" cy="100" r="72"/></svg></div>
  <div data-fx-part="item" style="width:14%;top:52%;left:16%;rotate:24deg"><svg viewBox="0 0 200 200"><path fill="currentColor" opacity=".7" d="M100 30l64 34v72l-64 34-64-34V64Z"/></svg></div>
  <span class="n" data-fx-part="item" style="top:20%;left:20%">N</span><span class="n" data-fx-part="item" style="top:64%;left:52%;rotate:34deg">T</span>
</section>
<div class="demo-spacer">Footer</div>
<script>
// Late arrivals and removals — checks that fx-core attaches to an element added after 1s and detaches from an element removed after 2.5s
(() => {
  const src = document.querySelector('[data-fx~="repel-elastic"]');
  if (!src) return;
  const html = src.outerHTML.replace(/\sid="[^"]*"/g, "");
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => (src.closest(".pin-spacer") || src).after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical one comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
