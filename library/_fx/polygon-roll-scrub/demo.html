<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>polygon-roll-scrub — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: sticky; top: 0; z-index: 200; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .gap { height: 60vh; display: grid; place-items: center; color: var(--kf-dim); }
  .roll { height: 400vh; }
  .roll [data-fx-part="stage"] { color: var(--kf-accent); }
</style>
</head>
<body>
<p class="demo-hint"><b>polygon-roll-scrub</b> — Scroll down. A square rolls along a bumpy road and becomes a circle.</p>
<div class="gap">Scroll</div>
<section class="roll" data-fx="polygon-roll-scrub"><div data-fx-part="stage"></div></section>
<section class="roll" data-fx="polygon-roll-scrub" data-demo-remove><div data-fx-part="stage"></div></section>
<div id="late"></div>
<div class="gap">Footer</div>
<template data-demo-late><section class="roll" data-fx="polygon-roll-scrub" data-fx-polygon-roll-scrub="from: 3; to: 8; radius: .1; offset: 0"><div data-fx-part="stage"></div></section></template>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => document.getElementById("late").append(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
