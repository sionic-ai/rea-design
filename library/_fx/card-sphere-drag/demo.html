<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>card-sphere-drag — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 2000; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .stage { height: 86vh; border-bottom: 1px solid var(--kf-line); }
  .card { display: grid; gap: 8px; color: var(--kf-ink); }
  .card .ph { aspect-ratio: 1 / 1; border: 1px solid var(--kf-line); background: var(--kf-surface); display: grid; place-items: center; font: 500 12px var(--kf-font-mono); color: var(--kf-dim); }
  .card b { font: var(--kf-weight-display) 22px/1 var(--kf-font-display); }
</style>
</head>
<body>
<p class="demo-hint"><b>card-sphere-drag</b> — Drag the panel or roll the wheel to spin the sphere. On release the nearest card comes to the center. Press a card and, once it is in the center, its name floats up at the top.</p>
<div class="stage" data-fx="card-sphere-drag">
  <a class="card" data-fx-part="card" href="#1"><span class="ph">Photo 1</span><b>Work One</b></a>
  <a class="card" data-fx-part="card" href="#2"><span class="ph">Photo 2</span><b>Work Two</b></a>
  <a class="card" data-fx-part="card" href="#3"><span class="ph">Photo 3</span><b>Work Three</b></a>
  <a class="card" data-fx-part="card" href="#4"><span class="ph">Photo 4</span><b>Work Four</b></a>
  <a class="card" data-fx-part="card" href="#5"><span class="ph">Photo 5</span><b>Work Five</b></a>
</div>
<script>
(() => {
  document.addEventListener("fx:pick", (e) => { document.querySelector(".demo-hint b").textContent = `card-sphere-drag · ${e.target.querySelector("b").textContent}`; });
  const src = document.querySelector(".stage");
  const make = () => { const el = document.createElement("div"); el.className = "stage"; el.style.height = "50vh"; el.dataset.fx = "card-sphere-drag"; el.innerHTML = '<a class="card" data-fx-part="card" href="#a"><span class="ph">Photo</span><b>Late-arrived card</b></a>'; return el; };
  const gone = make();
  src.after(gone);
  setTimeout(() => src.after(make()), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s one more sphere comes in (the late arrival), and after 2.5s one drops out (detach).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
