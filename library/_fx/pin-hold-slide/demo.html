<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pin-hold-slide — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo-spacer { height: 80vh; display: grid; place-items: center; color: var(--kf-dim); }
  .row { overflow: hidden; padding: 96px 0 48px; }
  .row h2 { padding: 0 48px 32px; font: 400 28px/1.4 var(--kf-font-display); }
  .row [data-fx-part="track"] { gap: 24px; padding-inline: 48px; }
  .row article { width: calc(50vw - 48px); min-height: 50vh; padding: 48px; border-radius: var(--kf-radius-md); background: var(--kf-surface); border: 1px solid var(--kf-line); }
  @media (max-width: 767px) { .row article { width: calc(100vw - 72px); } }
</style>
</head>
<body>
<p class="demo-hint"><b>pin-hold-slide</b> Scrolling down, the section pins, rests a moment, the cards slide horizontally, then it rests again at the end.</p>
<div class="demo-spacer">Scroll down ↓</div>
<div class="row" data-fx="pin-hold-slide" data-fx-pin-hold-slide="x: -48; x-narrow: 27; keep-narrow: 1; len-narrow: 2.5">
  <h2>Four strengths</h2>
  <div data-fx-part="track">
    <article data-fx-part="slide"><p>01</p><h3>Card One</h3></article>
    <article data-fx-part="slide"><p>02</p><h3>Card Two</h3></article>
    <article data-fx-part="slide"><p>03</p><h3>Card Three</h3></article>
    <article data-fx-part="slide"><p>04</p><h3>Card Four</h3></article>
  </div>
</div>
<div class="demo-spacer"></div>
<script>
(() => {
  const src = document.querySelector('[data-fx~="pin-hold-slide"]');
  const html = src.outerHTML.replace(/\sid="[^"]*"/g, "");
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => (src.closest(".pin-spacer") || src).after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical one comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
