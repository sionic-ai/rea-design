<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>draw-cross-slides — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .stage { height: 70vh; margin: 24px; color: var(--kf-on-accent); }
  .stage .wf-img { position: absolute; inset: 0; height: 100%; }
  .stage svg { position: absolute; left: 8%; top: 40%; width: min(320px, 60%); stroke-width: 1.4; }
</style>
</head>
<body>
<p class="demo-hint"><b>draw-cross-slides</b> — Just watch. In each section a handwritten line is drawn, holds, then crossfades into the next photo.</p>
<div class="stage" data-fx="draw-cross-slides">
  <div data-fx-part="slide"><div class="wf-img" data-label="Photo 1 · full-width landscape"></div><svg viewBox="0 0 420 90" aria-hidden="true"><path data-fx-part="line" d="M8 64c18-40 30-52 34-46s-8 40-20 46 10-44 30-44 18 18 8 28-22 8-14-2c10-10 26-12 38-4M96 58c8-12 16-14 18-8s-12 14-8 8 14-10 24-6"/><path data-fx-part="line" d="M140 56c4-14 12-18 16-10s-2 14 8 6c8-6 14-8 18 0M196 58c10-30 24-48 30-44s-14 44-10 44 12-22 24-22 10 14 2 18"/></svg></div>
  <div data-fx-part="slide"><div class="wf-img" data-label="Photo 2 · full-width landscape"></div><svg viewBox="0 0 420 90" aria-hidden="true"><path data-fx-part="line" d="M10 60c14-22 26-30 30-24s-12 26-4 24 16-30 30-30 8 26 0 30M84 56c10-16 22-20 24-12s-12 16-2 12 20-18 34-14M156 58c4-20 16-28 22-22s-6 26 4 22c10-4 16-20 28-18"/></svg></div>
  <div data-fx-part="slide"><div class="wf-img" data-label="Photo 3 · Borderless section"></div></div>
</div>
<script>
// Late arrivals and removals — checks that fx-core attaches to an element added after 1s and detaches from an element removed after 2.5s
(() => {
  const host = document.querySelector('[data-fx~="draw-cross-slides"]');
  if (!host) return;
  const html = host.outerHTML;
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  host.after(gone);
  setTimeout(() => host.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical one comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
