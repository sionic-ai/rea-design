<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dither-mask-wipe — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: sticky; top: 0; z-index: 100; margin: 0; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-pad { height: 80vh; }
  .demo-fig { display: flex; align-items: flex-end; gap: 10px; padding: 40px 20px; background: var(--kf-accent-soft); }
  .demo-fig b { font: 900 180px/0.8 var(--kf-font-display); }
  .demo-fig i { font: 700 36px/1.1 var(--kf-font-sans); font-style: normal; }
</style>
</head>
<body>
<p class="demo-hint"><b>dither-mask-wipe</b> — Scroll down. A big number sweeps out from the left, led by a dotted slope.</p>
<div class="demo-pad"></div>
<div class="demo-list">
  <div class="demo-fig" data-fx="dither-mask-wipe"><b>300</b><i>Hundred million</i></div>
  <div class="demo-fig" data-fx="dither-mask-wipe" data-fx-dither-mask-wipe="delay: 0; dur: 1.2"><b>8</b><i>Only</i></div>
</div>
<div class="demo-pad"></div>
<script>
(() => {
  // Late arrivals and removals — checks that fx-core attaches to an element added after 1s and detaches from an element removed after 2.5s
  const list = document.querySelector(".demo-list");
  const tpl = list.firstElementChild.cloneNode(true);
  const gone = tpl.cloneNode(true);
  list.append(gone);
  setTimeout(() => { const late = tpl.cloneNode(true); late.querySelector("b").textContent = "250"; list.append(late); }, 1000);
  setTimeout(() => gone.remove(), 2500);
})();
</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
