<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>blur-parallax-slides — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .stage { height: 60vh; margin: 20px; border-radius: 24px; }
  .stage .wf-img { border: 0; }
</style>
</head>
<body>
<p class="demo-hint"><b>blur-parallax-slides</b> — Just watch or press the dots below. When the panel turns, the photo is pushed the opposite way and fades (demo uses a 3-second beat · 1.6-second transition).</p>
<div class="stage" data-fx="blur-parallax-slides" data-fx-blur-parallax-slides="every: 3; dur: 1.6">
  <div data-fx-part="slide"><div class="wf-img" data-fx-part="media" data-label="Photo 1"></div></div>
  <div data-fx-part="slide"><div class="wf-img" data-fx-part="media" data-label="Photo 2"></div></div>
  <div data-fx-part="slide"><div class="wf-img" data-fx-part="media" data-label="Photo 3"></div></div>
  <div data-fx-part="dots"></div>
</div>
<script>
(() => {
  const src = document.querySelector('[data-fx~="blur-parallax-slides"]');
  if (!src) return;
  const html = src.outerHTML;
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => src.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical one comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
