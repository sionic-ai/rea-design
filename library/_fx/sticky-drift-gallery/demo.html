<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sticky-drift-gallery — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .pad { height: 60vh; display: grid; place-items: center; }
  .copy { margin: 0 auto; max-width: 52%; text-align: center; font: 500 clamp(24px, 3.3vw, 48px)/1.12 var(--kf-font-display); }
  .wf-img { border: 0; }
</style>
</head>
<body>
<p class="demo-hint"><b>sticky-drift-gallery</b> — Scroll down. While the section stays pinned to the screen, six photo cells flow sideways behind the copy.</p>
<div class="pad">Top margin</div>
<section id="g1" data-fx="sticky-drift-gallery">
  <div data-fx-part="stage">
    <div data-fx-part="track" style="--fx-cols: 9.92% 20.52% 13.06% 11.29% 18.47% 13.06%">
      <div data-fx-part="item" style="--fx-lift: 47%"><div class="wf-img" style="aspect-ratio: 1/1.25" data-label="Photo 1"></div></div>
      <div data-fx-part="item" style="--fx-lift: -12%"><div class="wf-img wf-r-1x1" data-label="Photo 2"></div></div>
      <div data-fx-part="item" style="--fx-lift: 82%"><div class="wf-img wf-r-3x2" data-label="Photo 3"></div></div>
      <div data-fx-part="item" style="--fx-lift: 22%"><div class="wf-img" style="aspect-ratio: 1/1.25" data-label="Photo 4"></div></div>
      <div data-fx-part="item" style="--fx-lift: 35%"><div class="wf-img wf-r-1x1" data-label="Photo 5"></div></div>
      <div data-fx-part="item" style="--fx-lift: -4%"><div class="wf-img wf-r-3x2" data-label="Photo 6"></div></div>
    </div>
    <p class="copy" data-fx-part="copy">A Quiet Promise Set<br>Across Two Lines.</p>
  </div>
</section>
<div class="pad">Bottom margin</div>
<div id="slot"></div>
<script>
  setTimeout(() => { const s = document.getElementById("slot"); s.innerHTML = document.getElementById("g1").outerHTML.replace('id="g1"', 'id="g2"'); }, 1000);
  setTimeout(() => { const g = document.createElement("section"); g.dataset.fx = "sticky-drift-gallery"; document.body.append(g); setTimeout(() => g.remove(), 1500); }, 1000);
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
