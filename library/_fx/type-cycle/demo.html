<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>type-cycle — Sentences that type, erase and cycle</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { margin: 0; padding: 40px 24px; background: var(--kf-bg); color: var(--kf-ink); font-family: var(--kf-font-sans); }
  .hint { color: var(--kf-dim); font-size: 13px; }
  .lead { font-size: 22px; }
</style>
</head>
<body>
<p class="hint">Watch quietly — each sentence is typed one letter at a time, erased, then moves on to the next.</p>
<p class="lead" data-fx="type-cycle"><span data-fx-part="line">Place your first sentence here.</span><span data-fx-part="line">Your second sentence here.</span><span data-fx-part="line">Your slightly longer third sentence goes here.</span></p>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
  setTimeout(() => {
    const p = document.createElement("p");
    p.dataset.fx = "type-cycle";
    p.innerHTML = '<span data-fx-part="line">Late-arriving sentence.</span><span data-fx-part="line">Disappearing soon.</span>';
    document.body.append(p);
    setTimeout(() => p.remove(), 1000);
  }, 1000);
</script>
</body>
</html>
