<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tab-strip-picker — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { padding: 32px 0; display: grid; gap: 24px; }
  .picker { height: 44vw; max-height: 640px; background: var(--kf-contrast-bg); }
  .picker [data-fx-part="tab"] { padding: 0; border: 0; color: var(--kf-on-accent); background: color-mix(in oklab, var(--kf-accent) calc(var(--k) * 14%), var(--kf-ink)); font: 700 15px/1 var(--kf-font-display); }
  .picker [data-fx-part="tab"] span { position: absolute; top: 18px; left: 3.6vw; rotate: 90deg; transform-origin: top left; white-space: nowrap; }
  .picker [data-fx-part="panel"] .wf-img { height: 100%; border: 0; }
</style>
</head>
<body>
<p class="demo-hint"><b>tab-strip-picker</b> — Click the color strip on the left. Tabs you’ve passed get pushed to the strip on the right. <span style="color:var(--kf-dim)">(After 1s one more panel comes in, and one leaves 2.5s later)</span></p>
<section class="demo">
  <div class="picker" data-fx="tab-strip-picker">
    <button type="button" data-fx-part="tab" style="--k: 1"><span>+ Entrance</span></button><div data-fx-part="panel"><div class="wf-img" data-label="Entrance ticket gate · daytime · landscape"></div></div>
    <button type="button" data-fx-part="tab" style="--k: 2"><span>+ Cell 1</span></button><div data-fx-part="panel"><div class="wf-img" data-label="Room overview · indoor light · landscape"></div></div>
    <button type="button" data-fx-part="tab" style="--k: 3"><span>+ Cell 2</span></button><div data-fx-part="panel"><div class="wf-img" data-label="Cord chair · neon · landscape"></div></div>
    <button type="button" data-fx-part="tab" style="--k: 4"><span>+ Shop</span></button><div data-fx-part="panel"><div class="wf-img" data-label="Souvenir display shelf · Landscape"></div></div>
    <button type="button" data-fx-part="tab" style="--k: 5"><span>+ Terrace</span></button><div data-fx-part="panel"><div class="wf-img" data-label="Outdoor terrace · sky · landscape"></div></div>
  </div>
  <div class="picker" data-demo-remove data-fx="tab-strip-picker">
    <button type="button" data-fx-part="tab" style="--k: 1"><span>Exit panel 1</span></button><div data-fx-part="panel"><div class="wf-img" data-label="Figure 1"></div></div>
    <button type="button" data-fx-part="tab" style="--k: 3"><span>Exit panel 2</span></button><div data-fx-part="panel"><div class="wf-img" data-label="Figure 2"></div></div>
  </div>
  <template data-demo-late>
    <div class="picker" data-fx="tab-strip-picker" data-fx-tab-strip-picker="start: 1; dur: .6">
      <button type="button" data-fx-part="tab" style="--k: 2"><span>Late panel 1</span></button><div data-fx-part="panel"><div class="wf-img" data-label="Figure 1"></div></div>
      <button type="button" data-fx-part="tab" style="--k: 4"><span>Late panel 2</span></button><div data-fx-part="panel"><div class="wf-img" data-label="Figure 2"></div></div>
      <button type="button" data-fx-part="tab" style="--k: 6"><span>Late panel 3</span></button><div data-fx-part="panel"><div class="wf-img" data-label="Figure 3"></div></div>
    </div>
  </template>
</section>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
