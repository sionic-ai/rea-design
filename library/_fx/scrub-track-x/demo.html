<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>scrub-track-x — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .pad { height: 90vh; display: grid; place-items: center; }
  [data-fx-part="track"] span { font: 700 120px/1.2 var(--kf-font-display); white-space: nowrap; padding-right: 1em; }
</style>
</head>
<body>
<p class="demo-hint"><b>scrub-track-x</b> — Scroll down. The big letter band is pushed left as much as you scroll.</p>
<div class="pad">Top margin</div>
<div data-fx="scrub-track-x" data-fx-scrub-track-x="speed: .8" id="src"><div data-fx-part="track"><span>Your big slogan line here</span><span>Your big slogan line here</span><span>Your big slogan line here</span></div></div>
<div data-fx="scrub-track-x" data-fx-scrub-track-x="unit: %; speed: .025; sp: .015; scrub: 0" style="overflow:hidden; transform: rotate(-15deg); margin: 120px -10%;">
  <div data-fx-part="track" style="display:flex; width:200%"><span>Line 1 · To the left</span><span>Line 1 · To the left</span></div>
  <div data-fx-part="track" data-dir="1" data-offset="-50" style="display:flex; width:200%"><span>Line 2 · To the right</span><span>Line 2 · To the right</span></div>
</div>
<div class="pad">Bottom margin</div>
<script>
(() => {
  const src = document.getElementById("src");
  const html = src.outerHTML.replace(/\sid="[^"]*"/g, "");
  const make = () => { const t = document.createElement("template"); t.innerHTML = html; return t.content.firstElementChild; };
  const gone = make();
  document.body.append(gone);
  setTimeout(() => document.body.append(make()), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s, one more strip comes in (the late one), and after 2.5s one drops out (the removal).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
