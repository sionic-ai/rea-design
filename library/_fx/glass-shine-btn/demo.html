<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>glass-shine-btn — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { display: flex; gap: 20px; flex-wrap: wrap; padding: 64px 20px; background: var(--kf-contrast-bg); color: var(--kf-contrast-ink); }
  .demo [data-fx] { color: var(--kf-contrast-ink); }
  .demo svg { width: 1rem; height: 1rem; }
</style>
</head>
<body>
<p class="demo-hint"><b>glass-shine-btn</b> — Hover over the button — the border glow rotates and a streak of light sweeps across the text.</p>
<section class="demo">
  <a data-fx="glass-shine-btn" href="#"><span data-fx-part="label">View Work</span><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 8h10M9 4l4 4-4 4"/></svg></a>
  <button data-fx="glass-shine-btn" type="button"><span data-fx-part="label">Scroll to look around</span></button>
  <button data-fx="glass-shine-btn" type="button" disabled><span data-fx-part="label">Launching soon</span></button>
  <button data-fx="glass-shine-btn" type="button" data-demo-src></button>
</section>
<script>
// Late arrivals and removals — as a CSS part, nothing is attached or detached. The same shape enters one more time after 1 second and one leaves after 2.5 seconds
(() => {
  const src = document.querySelector('[data-fx~="glass-shine-btn"]');
  if (!src) return;
  const html = src.outerHTML;
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => src.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical one comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="../fx-core.js"></script>
</body>
</html>
