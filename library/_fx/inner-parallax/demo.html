<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>inner-parallax — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { display: grid; grid-template-columns: 2fr 1fr; gap: 24px; padding: 60px 20px; }
  .demo figure { margin: 0; aspect-ratio: 4 / 3; }
  .demo figure.tall { aspect-ratio: 3 / 4; }
  .demo-spacer { height: 80vh; display: grid; place-items: center; color: var(--kf-dim); }
</style>
</head>
<body>
<p class="demo-hint"><b>inner-parallax</b> — Scroll down (window width 1025px or more). The cells stay put while the photos inside flow slowly downward. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<div class="demo-spacer">Scroll down</div>
<section class="demo">
  <figure data-fx="inner-parallax"><div class="wf-img" data-label="Building front · evening · landscape 4:3"></div></figure>
  <figure class="tall" data-fx="inner-parallax" data-fx-inner-parallax="force: 2.5"><div class="wf-img" data-label="Strength 2.5 · More flow"></div></figure>
  <figure data-fx="inner-parallax" data-demo-remove><div class="wf-img" data-label="Soon-Removed Photo"></div></figure>
  <template data-demo-late><figure class="tall" data-fx="inner-parallax" data-fx-inner-parallax="min: 0"><div class="wf-img" data-label="Late photo · on phones too"></div></figure></template>
</section>
<div class="demo-spacer"></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); window.ScrollTrigger?.refresh(); }, 2500);
</script>
</body>
</html>
