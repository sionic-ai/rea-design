<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>letter-sieve-loader — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: relative; z-index: 1; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .stage { display: grid; place-items: center; height: 60vh; font: 300 48px/1 var(--kf-font-display); }
  .late { --fx-z: 10001; }
</style>
</head>
<body>
<p class="demo-hint"><b>letter-sieve-loader</b> — On open, a name hidden among random letters is filtered out and remains, then drops away (about 6s). After 1s a late-arriving panel spins once more, and after 2.5s the first panel is erased.</p>
<div data-fx="letter-sieve-loader" data-demo-remove><span data-fx-part="brand">Your name here</span></div>
<main class="stage">Your first section here</main>
<template data-demo-late><div class="late" data-fx="letter-sieve-loader" data-fx-letter-sieve-loader="rows: 3; len: 12; seed: 5"><span data-fx-part="brand">HELLO WORLD</span></div></template>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
document.addEventListener("fx:done", (e) => e.target.remove());
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
