<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>scrub-tilt — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { padding: 48px 20px; }
  .demo-spacer { height: 90vh; display: grid; place-items: center; color: var(--kf-dim); }

  .pair { position: relative; height: 70vh; display: grid; grid-template-columns: 1fr 1fr; gap: 60px; padding: 60px; }
  .bgp { position: absolute; inset: 15% 50% 10% 6%; border-radius: 24px; background: var(--kf-accent); }
  .front { position: relative; border-radius: 24px; background: var(--kf-surface); border: 1px solid var(--kf-line); }
  .card { border-radius: 24px; background: var(--kf-ink); color: var(--kf-bg); padding: 30px; rotate: -10deg; transform-origin: 50% 100%; }
</style>
</head>
<body>
<p class="demo-hint"><b>scrub-tilt</b> — Scrolling down, the back panel rises while tilting, and the card rises even more tilted and stands. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<div class="demo-spacer">Scroll down</div><section class="pair"><div data-demo-remove class="bgp" data-fx="scrub-tilt" data-fx-scrub-tilt="rotate: 4; y: -10"></div><div class="bgp" data-fx="scrub-tilt" data-fx-scrub-tilt="rotate: 4; y: -10"></div><template data-demo-late><div class="bgp" data-fx="scrub-tilt" data-fx-scrub-tilt="rotate: 4; y: -10"></div></template><div class="front"></div>
<a class="card" data-fx="scrub-tilt" href="#" data-fx-scrub-tilt="dir: from; rotate: -12; y: 30%">Next case</a></section><div class="demo-spacer"></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); window.ScrollTrigger?.refresh(); }, 2500);
</script>
</body>
</html>
