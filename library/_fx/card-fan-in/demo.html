<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>card-fan-in — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { padding: 64px 20px; overflow: hidden; }
  .fan { margin: 24px auto; }
  .fan [data-fx-part] { display: grid; place-items: center; border-radius: var(--kf-radius-lg); background: var(--kf-surface); box-shadow: var(--kf-shadow-lift); border: 1px solid var(--kf-line); }
  .fan [data-fx-part="center"] { width: 400px; height: 460px; }
  .fan [data-fx-part="left"], .fan [data-fx-part="right"] { width: 300px; min-width: 300px; height: 360px; background: var(--kf-raised); color: var(--kf-dim); }
  @media (max-width: 640px) { .fan { zoom: 0.65; } }
</style>
</head>
<body>
<p class="demo-hint"><b>card-fan-in</b> — On refresh the side cards unfold from behind the center and the center card settles down. <span style="color:var(--kf-dim)">(After 1s one more set comes in, and one set leaves 2.5s later)</span></p>
<section class="demo">
  <div class="fan" data-fx="card-fan-in"><div data-fx-part="left">Left Card</div><div data-fx-part="center">Center card</div><div data-fx-part="right">Right card</div></div>
  <div class="fan" data-fx="card-fan-in" data-demo-remove style="--fx-turn: 20deg"><div data-fx-part="left">20°</div><div data-fx-part="center">Center</div><div data-fx-part="right">20°</div></div>
  <template data-demo-late><div class="fan" data-fx="card-fan-in"><div data-fx-part="left">Late</div><div data-fx-part="center">Late-arriving panel</div><div data-fx-part="right">Late</div></div></template>
  <div data-fx="card-fan-in"></div>
</section>
<script src="../fx-core.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
