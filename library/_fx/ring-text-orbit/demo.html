<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ring-text-orbit — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { display: flex; flex-wrap: wrap; gap: 40px; padding: 40px 20px; }
  .orbit { width: min(420px, 90vw); height: auto; }
  .orbit .lines circle { fill: none; stroke: var(--kf-line); stroke-width: 0.5; }
  .orbit text { fill: var(--kf-ink); font: 700 11px/1 var(--kf-font-sans); }
  .orbit .mid { font-size: 18px; }
</style>
</head>
<body>
<p class="demo-hint"><b>ring-text-orbit</b> — Five ring-text layers spin alternately in opposite directions, from the inside at 20·16.7·13.3·10·6.7s.</p>
<section class="demo">
<svg data-fx="ring-text-orbit" class="orbit" viewBox="0 0 400 400" aria-label="Event info concentric circles">
  <defs><path id="rr0" d="M 170,200 a 30,30 0 1,1 0,1 z"/><path id="rr1" d="M 137,200 a 63,63 0 1,1 0,1 z"/><path id="rr2" d="M 105,200 a 95,95 0 1,1 0,1 z"/><path id="rr3" d="M 72,200 a 128,128 0 1,1 0,1 z"/><path id="rr4" d="M 40,200 a 160,160 0 1,1 0,1 z"/></defs>
  <g class="lines"><circle cx="200" cy="200" r="30"/><circle cx="200" cy="200" r="63"/><circle cx="200" cy="200" r="95"/><circle cx="200" cy="200" r="128"/><circle cx="200" cy="200" r="160"/></g>
  <g data-fx-part="ring"><text><textPath href="#rr0">Date : 0000.00.00(Sat)</textPath></text></g>
  <g data-fx-part="ring"><text><textPath href="#rr1">Time: 00:00 - 00:00 · Time here</textPath></text></g>
  <g data-fx-part="ring"><text><textPath href="#rr2">Place: Your place name here · Your address here</textPath></text></g>
  <g data-fx-part="ring"><text><textPath href="#rr3">Price: ₩00,000 (advance) · ₩00,000 (door) · Notice goes here</textPath></text></g>
  <g data-fx-part="ring"><text><textPath href="#rr4">Ticket : Your retailer here · Your retailer here · Your sales period here</textPath></text></g>
  <text class="mid" x="200" y="206" text-anchor="middle">Your event here</text>
</svg>
</section>
<script>
// Late arrivals and removals — checks that fx-core attaches to an element added after 1s and detaches from an element removed after 2.5s
(() => {
  const src = document.querySelector('[data-fx~="ring-text-orbit"]');
  if (!src) return;
  const html = src.outerHTML.replace(/\sid="[^"]*"/g, "");
  const host = src.parentElement; // A place to attach a late arrival even if src is detached during the demo (inspector tools watch for detaching)
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => host.append(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical one comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
