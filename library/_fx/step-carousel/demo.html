<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>step-carousel — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; overflow-x: hidden; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .car { width: min(900px, 86vw); margin: 40px auto; }
  .car ul { gap: 16px; }
  .car li { width: min(700px, 70vw); height: 220px; display: grid; place-items: center; background: var(--kf-raised); border-radius: var(--kf-radius-md); }
  .ctl { display: flex; gap: 8px; justify-content: flex-end; margin-bottom: 12px; }
  .ctl button { width: 32px; height: 32px; border-radius: 50%; border: 0; background: var(--kf-ink); color: var(--kf-bg); cursor: pointer; }
</style>
</head>
<body>
<p class="demo-hint"><b>step-carousel</b> — Advances one slot every 3 seconds. Pauses on mouse hover, use the buttons for previous, pause and next. <span style="color:var(--kf-dim)">(After 1s one more line comes in, and one leaves 2.5s later)</span></p>
<div class="car" data-fx="step-carousel">
  <div class="ctl"><button data-fx-part="prev" aria-label="Previous">‹</button><button data-fx-part="toggle" aria-label="Auto-advance pause · play"><span class="fx-sc-pause">❙❙</span><span class="fx-sc-play">▶</span></button><button data-fx-part="next" aria-label="Next">›</button></div>
  <ul data-fx-part="track"><li data-fx-part="slide">Card 1</li><li data-fx-part="slide">Card 2</li><li data-fx-part="slide">Card 3</li><li data-fx-part="slide">Card 4</li></ul>
</div>
<div class="car" data-fx="step-carousel" data-demo-remove><ul data-fx-part="track"><li data-fx-part="slide">Exit line 1</li><li data-fx-part="slide">Exit line 2</li></ul></div>
<div class="car" data-fx="step-carousel"><ul data-fx-part="track"><li data-fx-part="slide">Just one — not hung</li></ul></div>
<div class="car" data-fx="step-carousel"></div>
<template data-demo-late><div class="car" data-fx="step-carousel" data-fx-step-carousel="every: 1500; dur: 400"><ul data-fx-part="track"><li data-fx-part="slide">Late 1</li><li data-fx-part="slide">Late 2</li><li data-fx-part="slide">Late 3</li></ul></div></template>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); }, 2500);
</script>
</body>
</html>
