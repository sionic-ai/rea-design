<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>flash-veil-nav — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: sticky; top: 0; z-index: 100; margin: 0; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { padding: 48px 20px; display: flex; gap: 16px; }
  .demo a { padding: 12px 20px; border: 1px solid var(--kf-line); border-radius: var(--kf-radius-pill); background: var(--kf-surface); }
</style>
</head>
<body>
<p class="demo-hint"><b>flash-veil-nav</b> — Press the link below. The curtain covers at once and .35s later the same demo opens again.</p>
<section class="demo">
  <a href="demo.html?again=1">Reopen this demo</a>
  <a href="#here">In-page links (no overlay)</a>
</section>
<div class="veil" data-fx="flash-veil-nav" aria-hidden="true"></div>
<script>
// Late arrivals·removals — add one more curtain after 1s (late arrival), pull the first curtain after 2.5s to see whether detach runs
(() => {
  const src = document.querySelector(".veil");
  const html = src.outerHTML;
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  setTimeout(() => document.body.append(make("late")), 1000);
  setTimeout(() => src.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s one more cover comes in (a late arrival), and after 2.5s the first cover drops out (detach).");
})();
</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
