<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>batch-stagger-fade — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 40px 16px; padding: 24px; }
  .card { display: block; aspect-ratio: 1; border-radius: var(--kf-radius-sm); background: var(--kf-surface); position: relative; }
  .card .wf-img { position: absolute; left: 13.5%; bottom: 0; width: 73%; height: 86%; }
</style>
</head>
<body>
<p class="demo-hint"><b>batch-stagger-fade</b> — Scroll down. Images in a row entering the screen light up from the left, each 60ms later.</p>
<div class="grid"></div>
<script>
(() => {
  const grid = document.querySelector(".grid");
  for (let i = 0; i < 24; i++) grid.insertAdjacentHTML("beforeend", '<a class="card" href="#" data-fx="batch-stagger-fade"><div class="wf-img" data-fx-part="media" data-label="Work illustration"></div></a>');
  const src = grid.firstElementChild;
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = src.outerHTML; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  grid.prepend(gone);
  setTimeout(() => grid.prepend(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1 second one more card comes in (a late arrival), and after 2.5 seconds one is removed (detach).");
})();
</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
