<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>elastic-shrink-hover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.6 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { display: flex; flex-wrap: wrap; gap: 32px; align-items: center; padding: 48px 20px; }
  .b { display: inline-block; text-decoration: none; }
  .b [data-fx-part="inner"] { display: flex; align-items: center; gap: 24px; padding: 18px 20px; border-radius: 8px; background: var(--kf-accent); color: var(--kf-on-accent); font-weight: 600; }
  .ic { display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; background: var(--kf-on-accent); color: var(--kf-accent); font-style: normal; font-size: 11px; }
  .card [data-fx-part="inner"] { display: grid; gap: 8px; width: 240px; padding: 32px; border-radius: 24px; background: var(--kf-surface); }
</style>
</head>
<body>
<p class="demo-hint"><b>elastic-shrink-hover</b> — Hover over a button or card and move away. The button bounces when pressed too. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<section class="demo">
  <a class="b" href="#" data-fx="elastic-shrink-hover"><span data-fx-part="inner"><span data-fx-part="fill"></span>Your button here<i class="ic" data-fx-part="icon">→</i></span></a>
  <button class="b" type="button" data-fx="elastic-shrink-hover" style="border:0;padding:0;background:none"><span data-fx-part="inner"><span data-fx-part="fill"></span>Push button<i class="ic" data-fx-part="icon">→</i></span></button>
  <a class="card" href="#" data-demo-remove data-fx="elastic-shrink-hover" data-fx-elastic-shrink-hover="shrink: .94"><span data-fx-part="inner"><small>Card Tag</small><b>Your card title here</b><i class="ic" data-fx-part="icon" data-scale="1.5">→</i></span></a>
  <template data-demo-late><a class="b" href="#" data-fx="elastic-shrink-hover"><span data-fx-part="inner"><span data-fx-part="fill"></span>Enters late<i class="ic" data-fx-part="icon">→</i></span></a></template>
</section>

<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
