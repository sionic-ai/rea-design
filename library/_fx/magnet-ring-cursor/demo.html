<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>magnet-ring-cursor — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .stage { display: flex; flex-wrap: wrap; gap: 80px; align-items: center; justify-content: center; min-height: 70vh; padding: 60px 20px; }
  .stage button { width: 48px; height: 48px; border: 1px solid var(--kf-line); border-radius: var(--kf-radius-pill); background: var(--kf-surface); }
</style>
</head>
<body>
<p class="demo-hint"><b>magnet-ring-cursor</b> — Move the mouse near a button. The dot becomes a ring and the two pull toward each other. Press and drag on empty space for the drag ring. <span style="color:var(--kf-dim)">(After 1s one more panel comes in, and one leaves 2.5s later)</span></p>
<section class="stage" data-fx="magnet-ring-cursor" data-fx-magnet-ring-cursor="drag: on">
  <button type="button" data-fx-part="target" data-range="30">→</button>
  <button type="button" data-fx-part="target" data-range="50" data-shape="large">≡</button>
  <button type="button" data-fx-part="target">●</button>
</section>
<section class="stage" data-fx="magnet-ring-cursor" data-demo-remove><button type="button" data-fx-part="target">Being removed soon</button></section>
<template data-demo-late><section class="stage" data-fx="magnet-ring-cursor"><p>Late-arriving panel (no target — only the dot follows)</p></section></template>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/MorphSVGPlugin.min.js"></script>
<script>gsap.registerPlugin(MorphSVGPlugin);</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
