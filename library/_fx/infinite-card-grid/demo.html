<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>infinite-card-grid — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .g { height: 80vh; margin: 16px 0; background: var(--kf-ink); }
  .g [data-fx-part="item"] { width: 220px; height: 260px; padding: 20px; }
  .g [data-fx-part="card"] { width: 100%; height: 100%; border-radius: var(--kf-radius-sm); background: var(--kf-raised); display: grid; place-items: center; color: var(--kf-dim); }
</style>
</head>
<body>
<p class="demo-hint"><b>infinite-card-grid</b> — Drag on the panel or roll the wheel. The grid continues endlessly in all directions, and the cards shrink if you push hard.</p>
<div class="g" data-fx="infinite-card-grid"><div data-fx-part="list">
  <div data-fx-part="item"><figure data-fx-part="card">1</figure></div><div data-fx-part="item"><figure data-fx-part="card">2</figure></div>
  <div data-fx-part="item"><figure data-fx-part="card">3</figure></div><div data-fx-part="item"><figure data-fx-part="card">4</figure></div>
  <div data-fx-part="item"><figure data-fx-part="card">5</figure></div>
</div></div>
<div class="g" data-fx="infinite-card-grid" data-demo-remove><div data-fx-part="list"><div data-fx-part="item"><figure data-fx-part="card">Erase</figure></div></div></div>
<template data-demo-late><div class="g" data-fx="infinite-card-grid" data-fx-infinite-card-grid="min-scale: .8; speeds: 1,0.8"><div data-fx-part="list"><div data-fx-part="item"><figure data-fx-part="card">Late</figure></div><div data-fx-part="item"><figure data-fx-part="card">Whole panel</figure></div></div></div></template>
<div class="g" data-fx="infinite-card-grid"></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
