<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>wave-rail — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.6 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 24px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .rail-l { position: fixed; left: 0; top: 0; bottom: 0; width: 10px; }
  .rail-r { position: fixed; right: 0; top: 0; bottom: 0; width: 10px; }
  .tall { height: 260vh; padding: 80px 40px; max-width: 720px; margin: 0 auto; }
  .band { margin-top: 40px; height: 10px; width: 100%; }
</style>
</head>
<body>
<p class="demo-hint"><b>wave-rail</b> Color bands at both ends ripple and flow. When you scroll, a vertical stripe pattern passes along with the page.</p>
<div class="rail-l" data-fx="wave-rail"></div>
<div class="rail-r" data-fx="wave-rail" data-fx-wave-rail="flip: on" data-demo-remove></div>
<div class="tall">Your body goes here. After 1s a horizontal band attaches below, and after 2.5s the right band detaches.
  <template data-demo-late><div class="band" data-fx="wave-rail" data-fx-wave-rail="orient: horizontal"></div></template>
  <div class="band" data-fx="wave-rail" data-fx-wave-rail="orient: horizontal; colors: --kf-accent"></div>
</div>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
