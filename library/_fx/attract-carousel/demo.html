<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>attract-carousel — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.6 var(--kf-font-sans); margin: 0; }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .strip { margin: 40px 20px 80px; }
  .strip [data-fx-part="track"] { gap: 20px; }
  .strip figure { margin: 0; width: 38vw; }
  .strip figure.is-tall { width: 22vw; }
  .strip .wf-img { height: 30vw; }
  .strip nav { display: flex; justify-content: flex-end; gap: 16px; margin-top: 12px; }
  .strip button { font: inherit; background: none; border: 1px solid var(--kf-line); padding: 4px 10px; cursor: pointer; }
  .strip button:disabled { opacity: .3; }
</style>
</head>
<body>
<p class="demo-hint"><b>attract-carousel</b> — Drag the photo row sideways or press Prev / Next. <span style="color:var(--kf-dim)">(After 1s one more line comes in, and one leaves 2.5s later)</span></p>
<div class="strip" data-fx="attract-carousel">
  <div data-fx-part="viewport"><div data-fx-part="track">
    <figure><div class="wf-img" data-label="Photo 1 · Landscape"></div></figure><figure class="is-tall"><div class="wf-img" data-label="Photo 2 · Portrait"></div></figure><figure><div class="wf-img" data-label="Photo 3 · Landscape"></div></figure><figure class="is-tall"><div class="wf-img" data-label="Photo 4 · Portrait"></div></figure><figure><div class="wf-img" data-label="Photo 5 · Landscape"></div></figure>
  </div></div>
  <nav><button data-fx-part="prev">Previous</button><button data-fx-part="next">Next</button></nav>
</div>
<div class="strip" data-fx="attract-carousel" data-demo-remove><div data-fx-part="viewport"><div data-fx-part="track"><figure><div class="wf-img" data-label="Dropping row"></div></figure></div></div></div>
<div data-late-slot></div>
<div class="strip" data-fx="attract-carousel"><div data-fx-part="viewport"><div data-fx-part="track"></div></div></div>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelector("[data-late-slot]").outerHTML = '<div class="strip" data-fx="attract-carousel" data-fx-attract-carousel="attraction: .1; friction: .5; group: fit"><div data-fx-part="viewport"><div data-fx-part="track"><figure><div class="wf-img" data-label="Late line 1 · fast physics"></div></figure><figure><div class="wf-img" data-label="2"></div></figure><figure><div class="wf-img" data-label="3"></div></figure><figure><div class="wf-img" data-label="4"></div></figure></div></div><nav><button data-fx-part="prev">Previous</button><button data-fx-part="next">Next</button></nav></div>', 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
