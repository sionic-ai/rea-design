<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>drop-float-tilt — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { margin: 0; font-family: var(--kf-font-sans); background: var(--kf-bg); color: var(--kf-ink); }
  .demo-hint { padding: 24px; }
  .stage-wrap { height: 300vh; }
  .stage { position: sticky; top: 0; height: 100vh; overflow: hidden; background: var(--kf-surface); }
  .pack { position: absolute; width: 14em; margin-left: -7em; }
  .pack .ph { aspect-ratio: 551 / 889; border-radius: 10px; }
  .p1 { left: 35%; bottom: 19vh; }
  .p2 { left: 65%; bottom: 12.5vh; }
  .p3 { left: 50%; bottom: 30vh; width: 8em; margin-left: -4em; }
</style>
</head>
<body>
  <p class="demo-hint"><b>drop-float-tilt</b> Scroll down. Two objects drop from above and float, and moving the mouse over the panel tilts them that way.</p>
  <section class="stage-wrap" data-fx="drop-float-tilt">
    <div class="stage">
      <div class="pack p1" data-fx-part="item"><div class="ph wf-img" data-label="White pouch cutout"><span data-fx-part="light"></span></div></div>
      <div class="pack p2" data-fx-part="item"><div class="ph wf-img" data-label="Black pouch cutout"><span data-fx-part="light"></span></div></div>
    </div>
  </section>
  <template data-demo-late><section class="stage-wrap" style="height: 200vh" data-fx="drop-float-tilt" data-fx-drop-float-tilt="start: top bottom; end: bottom top"><div class="stage"><div class="pack p3" data-fx-part="item"><div class="ph wf-img" data-label="Panel entering after 1s"></div></div></div></section></template>
  <section data-fx="drop-float-tilt" data-demo-remove><div data-fx-part="item">Item that drops out after 2.5s</div></section>
  <div style="height: 60vh"></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script>gsap.registerPlugin(ScrollTrigger);</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
