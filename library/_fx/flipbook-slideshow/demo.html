<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>flipbook-slideshow — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-row { display: flex; gap: 40px; justify-content: center; padding: 60px 20px; flex-wrap: wrap; }
  .demo-row [data-fx] { width: 280px; aspect-ratio: 4 / 5; }
  .demo-row .wf-img { height: 100%; }
</style>
</head>
<body>
<p class="demo-hint"><b>flipbook-slideshow</b> — The photo changes instantly every .2s. Click or drag sideways to flip through.</p>
<div class="demo-row">
  <div data-fx="flipbook-slideshow">
    <div data-fx-part="slide"><div class="wf-img" data-label="Work 1 · Product shot"></div></div>
    <div data-fx-part="slide"><div class="wf-img" data-label="Work 2 · Screen"></div></div>
    <div data-fx-part="slide"><div class="wf-img" data-label="Work 3 · Logo"></div></div>
    <div data-fx-part="slide"><div class="wf-img" data-label="Work 4 · Packaging"></div></div>
  </div>
  <div data-fx="flipbook-slideshow" data-fx-flipbook-slideshow="every: 600; delay: 0" data-demo-remove>
    <div data-fx-part="slide"><div class="wf-img" data-label="Slow version 1"></div></div>
    <div data-fx-part="slide"><div class="wf-img" data-label="Slow Panel 2"></div></div>
  </div>
  <div data-fx="flipbook-slideshow" data-fx-flipbook-slideshow="every: 2200; tap: 0">
    <div data-fx-part="slide"><div class="wf-img" data-label="Background panel 1 · won’t advance when clicked"></div></div>
    <div data-fx-part="slide"><div class="wf-img" data-label="Background panel 2"></div></div>
    <div data-fx-part="slide"><div class="wf-img" data-label="Background Panel 3"></div></div>
  </div>
  <template data-demo-late>
    <div data-fx="flipbook-slideshow" data-fx-flipbook-slideshow="every: 0">
      <div data-fx-part="slide"><div class="wf-img" data-label="Late-arriving panel 1"></div></div>
      <div data-fx-part="slide"><div class="wf-img" data-label="Late-arriving panel 2"></div></div>
      <div data-fx-part="slide"><div class="wf-img" data-label="Late-arriving panel 3"></div></div>
    </div>
  </template>
  <div data-fx="flipbook-slideshow"></div>
</div>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
