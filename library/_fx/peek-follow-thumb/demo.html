<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>peek-follow-thumb — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 1; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .list { max-width: 720px; margin: 60px auto; }
  .list a { display: block; padding: 28px 8px; border-bottom: 1px solid var(--kf-line); font-size: 18px; }
</style>
</head>
<body>
<p class="demo-hint"><b>peek-follow-thumb</b> Move the mouse over the list rows. The preview box follows along, and each row’s image slides up at a slant.</p>
<div class="list" data-fx="peek-follow-thumb" id="list">
  <a href="#" data-fx-part="row" data-label="Book cover · white background">Your first News title here</a>
  <a href="#" data-fx-part="row" data-label="Venue photo · indoor">Your News title two here</a>
  <a href="#" data-fx-part="row">News without image (no image)</a>
</div>
<div class="list" data-fx="peek-follow-thumb" id="gone"><a href="#" data-fx-part="row">List to Be Removed</a></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
  setTimeout(() => { const a = document.createElement("a"); a.href = "#"; a.dataset.fxPart = "row"; a.dataset.label = "Late line drawing"; a.textContent = "Late row"; document.getElementById("list")?.append(a); }, 1000);
  setTimeout(() => document.getElementById("gone")?.remove(), 1500);
</script>
</body>
</html>
