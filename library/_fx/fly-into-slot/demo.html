<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fly-into-slot — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-spacer { height: 80vh; display: grid; place-items: center; color: var(--kf-dim); }
  .demo-row { display: flex; justify-content: center; gap: 60px; padding: 60px 20px; }
  .phone { position: relative; width: min(300px, 70vw); aspect-ratio: 390 / 636; border: 2px solid var(--kf-line); border-radius: 40px 40px 0 0; border-bottom: 0; }
  .phone [data-fx-part="flyer"] { position: absolute; left: -5.5%; bottom: 2.2%; width: 83%; aspect-ratio: 1; border: 6px solid var(--kf-surface); box-shadow: var(--kf-shadow-lift); }
</style>
</head>
<body>
<p class="demo-hint"><b>fly-into-slot</b> — Scroll down. The tilted, floating photo flies into the frame and shrinks. <span style="color:var(--kf-dim)">(After 1s one more frame comes in, and one leaves 2.5s later)</span></p>
<div class="demo-spacer">Scroll down</div>
<section class="demo-row" data-fx="fly-into-slot"><div class="phone"><div data-fx-part="flyer" class="wf-img" data-label="Cover photo · square"></div></div></section>
<section class="demo-row" data-demo-remove data-fx="fly-into-slot"><div class="phone"><div data-fx-part="flyer" class="wf-img" data-label="Photo to Remove"></div></div></section>
<template data-demo-late><section class="demo-row" data-fx="fly-into-slot" data-fx-fly-into-slot="x: -20; rotate: -9; scale: .7"><div class="phone"><div data-fx-part="flyer" class="wf-img" data-label="Late-arrived Photo"></div></div></section></template>
<div class="demo-spacer"></div>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
