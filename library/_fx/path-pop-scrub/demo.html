<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>path-pop-scrub — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .gap { height: 70vh; }
  .road { position: relative; height: 1600px; margin: 0 auto; max-width: 900px; }
  .road svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .road path { stroke: var(--kf-accent); stroke-width: 40; }
  .steps { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: space-around; align-items: center; }
  .step { position: relative; display: inline-flex; align-items: center; gap: 10px; font: 700 54px/1 var(--kf-font-sans); color: var(--kf-accent); text-transform: uppercase; }
  .icon { width: 90px; height: 90px; border-radius: 50%; background: var(--kf-ink); }
  .note { position: absolute; right: -60px; bottom: -40px; padding: 8px 14px; border: 1px solid var(--kf-accent); border-radius: 99px; background: var(--kf-surface); font: 500 13px/1.2 var(--kf-font-sans); text-transform: none; }
</style>
</head>
<body>
<p class="demo-hint"><b>path-pop-scrub</b> — Scroll down. A road is drawn, and at each step a center image and note pop out. <span style="color:var(--kf-dim)">(After 1s one more step panel comes in, and after 2.5s one leaves)</span></p>
<div class="gap"></div>
<section class="road" data-fx="path-pop-scrub">
  <svg viewBox="0 0 900 1600" preserveAspectRatio="none"><path data-fx-part="path" d="M450 0C900 200 0 400 450 600S900 1000 450 1200 0 1500 450 1600"/></svg>
  <div class="steps">
    <div class="step" data-fx-part="step">Step <span class="icon" data-fx-part="grow"></span> One<p class="note" data-fx-part="note">Your one-line description here</p></div>
    <div class="step" data-fx-part="step">Step <span class="icon" data-fx-part="grow"></span> Two<p class="note" data-fx-part="note">Your one-line description here</p></div>
    <div class="step" data-fx-part="step">Step <span class="icon" data-fx-part="grow"></span> Three</div>
    <div class="step" data-fx-part="step">Four<p class="note" data-fx-part="note">Step without image</p></div>
  </div>
</section>
<section class="road" style="height:400px" data-fx="path-pop-scrub" data-demo-remove><div class="steps"><div class="step" data-fx-part="step">Dropped Panel</div></div></section>
<section data-fx="path-pop-scrub"></section>
<template data-demo-late><section class="road" style="height:500px" data-fx="path-pop-scrub" data-fx-path-pop-scrub="scrub: 0"><div class="steps"><div class="step" data-fx-part="step">Late <span class="icon" data-fx-part="grow"></span> One</div></div></section></template>
<div class="gap"></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script>gsap.registerPlugin(ScrollTrigger);</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
