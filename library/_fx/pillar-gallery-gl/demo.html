<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pillar-gallery-gl — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .g { height: 80vh; margin: 16px 0; }
  .g ul { position: absolute; left: 20px; top: 50%; translate: 0 -50%; display: grid; gap: 8px; font: 500 11px/1 var(--kf-font-sans); text-transform: uppercase; z-index: 2; }
  .g .t { position: absolute; left: 20px; top: 16px; display: flex; gap: 16px; z-index: 2; font: 500 11px/1 var(--kf-font-sans); }
  .g .t button { border: 0; background: none; padding: 0; cursor: pointer; }
</style>
</head>
<body>
<p class="demo-hint"><b>pillar-gallery-gl</b> — Roll the wheel or drag over the panel. The column spins endlessly and, when it stops, the nearest section snaps to center. Clicking a name on the left also jumps there.</p>
<section class="g" data-fx="pillar-gallery-gl">
  <div class="t"><button type="button" data-fx-part="vertical">Vertical</button><button type="button" data-fx-part="horizontal">Width</button></div>
  <div data-fx-part="loader"><span></span></div>
  <ul data-fx-part="names"><li data-fx-part="name">01 Name</li><li data-fx-part="name">02 Name</li><li data-fx-part="name">03 Name</li><li data-fx-part="name">04 Name</li><li data-fx-part="name">05 Name</li><li data-fx-part="name">06 Name</li></ul>
  <figure data-fx-part="item" data-format="portrait" data-label="Piece photo · white background"></figure>
  <figure data-fx-part="item" data-format="landscape" data-tone="dark" data-label="Product close-up · dark background"></figure>
  <figure data-fx-part="item" data-format="portrait" data-label="Bag in hand · White background"></figure>
  <figure data-fx-part="item" data-format="landscape" data-label="Face close-up · Warm light"></figure>
  <figure data-fx-part="item" data-format="portrait" data-tone="dark" data-label="Perfume bottle · black background"></figure>
  <figure data-fx-part="item" data-format="landscape" data-label="Ring · White background"></figure>
</section>
<section class="g" data-fx="pillar-gallery-gl" data-demo-remove data-fx-pillar-gallery-gl="intro: none"><figure data-fx-part="item" data-format="landscape" data-label="Board to erase"></figure></section>
<template data-demo-late><section class="g" data-fx="pillar-gallery-gl" data-fx-pillar-gallery-gl="intro: none; parallax: 0"><figure data-fx-part="item" data-format="portrait" data-label="Late-arriving panel 1"></figure><figure data-fx-part="item" data-format="landscape" data-label="Late-arriving panel 2"></figure></section></template>
<section class="g" data-fx="pillar-gallery-gl"></section>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="three-global.js"></script>
<script src="../../_vendor/three@0.181.0/build/three.cjs"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
