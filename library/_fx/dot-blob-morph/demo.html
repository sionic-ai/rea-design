<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dot-blob-morph — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { padding: 60px 40px; display: flex; flex-wrap: wrap; gap: 60px; align-items: center; }
  .blob { width: 320px; height: 280px; display: grid; place-items: center; text-align: center; }
  .blob.is-wide { width: 420px; height: 240px; }
  button { padding: 10px 16px; border: 1px solid var(--kf-line); background: var(--kf-surface); cursor: pointer; }
</style>
</head>
<body>
<p class="demo-hint"><b>dot-blob-morph</b> — Move the mouse near the blob. Press the Fill Screen button and the blob covers the screen, then press Reset and it wobbles back. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<section class="demo">
  <div class="blob" id="b1" data-fx="dot-blob-morph"><span>Scene image slot</span></div>
  <div class="blob is-wide" data-fx="dot-blob-morph" data-fx-dot-blob-morph="seed: 4; wobble: .08; points: 11" data-demo-remove><span>Being removed soon</span></div>
  <div class="blob" data-fx="dot-blob-morph" data-fx-dot-blob-morph="seed: 7; cursor: 0"><span>Cursor off</span></div>
  <div class="blob" data-fx="dot-blob-morph"></div>
  <template data-demo-late><div class="blob" data-fx="dot-blob-morph" data-fx-dot-blob-morph="seed: 9"><span>Late-arriving chunk</span></div></template>
  <p><button type="button" onclick="document.getElementById('b1').dispatchEvent(new CustomEvent('fx:full'))">Full Screen</button> <button type="button" onclick="document.getElementById('b1').dispatchEvent(new CustomEvent('fx:restore'))">Undo</button></p>
</section>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/CustomEase.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); }, 2500);
</script>
</body>
</html>
