<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>glass-cylinder-slider — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .cyl { height: 480px; margin: 160px 0; display: flex; align-items: flex-end; justify-content: center; gap: 4px; }
  .cyl button { border: 0; width: 28px; height: 28px; background: var(--kf-surface); color: var(--kf-ink); cursor: pointer; }
</style>
</head>
<body>
<p class="demo-hint"><b>glass-cylinder-slider</b> — Drag sideways. Buttons move one slide at a time, and clicking a slide announces its number.</p>
<div class="cyl" data-fx="glass-cylinder-slider">
  <span data-fx-part="slide" data-title="Slide 01"></span><span data-fx-part="slide" data-title="Slide 02"></span><span data-fx-part="slide" data-title="Slide 03"></span>
  <span data-fx-part="slide" data-title="Slide 04"></span><span data-fx-part="slide" data-title="Slide 05"></span><span data-fx-part="slide" data-title="Slide 06"></span>
  <button type="button" data-fx-part="prev" aria-label="Previous">‹</button><button type="button" data-fx-part="next" aria-label="Next">›</button>
</div>
<script>
(() => {
  const src = document.querySelector('[data-fx~="glass-cylinder-slider"]');
  if (!src) return;
  const html = src.outerHTML;
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => src.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical one comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="three-global.js"></script>
<script src="../../_vendor/three@0.182.0/build/three.cjs"></script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
