<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sky-time-dial — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { min-height: 100vh; background: color-mix(in oklab, var(--kf-contrast-bg) calc(var(--fx-night, 0) * 100%), var(--kf-bg)); color: var(--kf-ink); font: 400 15px/1.6 var(--kf-font-sans); }
  [data-sky="night"] body { color: var(--kf-contrast-ink); }
  [data-sky="yellow"] body { color: var(--kf-accent); }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); color: var(--kf-ink); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .row { display: flex; gap: 40px; align-items: center; padding: 60px 40px; }
  .dial { width: 52px; height: 52px; border: 1px solid currentColor; border-radius: 50%; }
  .dial i::before { content: ""; position: absolute; top: 10px; left: 50%; width: 9px; height: 9px; border: 1px solid currentColor; border-radius: 50%; translate: -50% -50%; }
  .dial [data-fx-part="hand"]::before { background: currentColor; }
  button { border: 1px solid currentColor; background: none; padding: 4px 10px; cursor: pointer; }
</style>
</head>
<body>
<p class="demo-hint"><b>sky-time-dial</b> — Hover over the circle and a dot follows around, drag the dot at the tip of the filled hand and the sky (background · text) changes to match the time. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<div class="row">
  <div class="dial" data-fx="sky-time-dial"><i data-fx-part="hand"></i><i data-fx-part="follower"></i></div>
  <span data-fx-part="time">00.00</span>
  <button type="button" data-fx-part="reset">As of now</button>
  <div class="dial" data-fx="sky-time-dial" data-fx-sky-time-dial="follow: 1" data-demo-remove><i data-fx-part="hand"></i></div>
  <div class="dial" data-fx="sky-time-dial"></div>
  <template data-demo-late><div class="dial" data-fx="sky-time-dial"><i data-fx-part="hand"></i><i data-fx-part="follower"></i></div></template>
</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
