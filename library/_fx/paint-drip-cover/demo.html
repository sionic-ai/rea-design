<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>paint-drip-cover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .bar { display: flex; gap: 12px; padding: 20px; }
  .menu-btn { padding: 10px 18px; border: 1px solid var(--kf-ink); background: var(--kf-surface); color: var(--kf-ink); font: 700 16px/1 var(--kf-font-display); cursor: pointer; }
  .menu-panel { display: grid; place-content: center; gap: 16px; font: 700 32px/1.2 var(--kf-font-display); }
</style>
</head>
<body>
<p class="demo-hint"><b>paint-drip-cover</b> — Press MENU. Paint drips down to cover the screen, and pressing again pulls it back. <span style="color:var(--kf-dim)">(After 1s one more button comes in, and after 2.5s one drops out)</span></p>
<div class="bar">
  <nav data-fx="paint-drip-cover"><button class="menu-btn" data-fx-part="trigger" type="button">MENU</button><div class="menu-panel" data-fx-part="panel"><a href="#">Menu 1</a><a href="#">Menu 2</a><a href="#" data-fx-part="close">Close</a></div></nav>
  <nav data-demo-remove data-fx="paint-drip-cover" data-fx-paint-drip-cover="colors: --kf-warning"><button class="menu-btn" data-fx-part="trigger" type="button">MENU 2</button></nav>
  <template data-demo-late><nav data-fx="paint-drip-cover" data-fx-paint-drip-cover="colors: --kf-accent-soft; back: 60"><button class="menu-btn" data-fx-part="trigger" type="button">MENU 3</button></nav></template>
  <nav data-fx="paint-drip-cover"></nav>
</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../_vendor/simplex-noise@4.0.1/simplex-noise.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
