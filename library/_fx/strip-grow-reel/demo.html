<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>strip-grow-reel — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .row { display: flex; gap: 4px; height: 70vh; }
  .shot { background: var(--kf-raised); }
  .shot:nth-child(2) { background: var(--kf-dim); }
  .shot:nth-child(3) { background: var(--kf-ink-soft); }
  [data-fx-part="copy"] { left: 40px; bottom: 30px; color: var(--kf-bg); font-size: 40px; text-align: left; }
  .empty { margin: 24px 20px; height: 40px; }
</style>
</head>
<body>
<p class="demo-hint"><b>strip-grow-reel</b> — Watch quietly: the pictures inside the strip cross-fade every 2s, and after the third the next strip unfolds. Try pressing a folded strip. <span style="color:var(--kf-dim)">(After 1s a panel with one more band comes in, and after 2.5s an empty panel drops out)</span></p>
<section id="demo" data-fx="strip-grow-reel" data-fx-strip-grow-reel="open: 80vw; shut: 8vw; intro: 0.6">
  <div class="row">
    <button data-fx-part="panel" type="button"><div class="shot" data-fx-part="clip" data-dur="2"></div><div class="shot" data-fx-part="clip" data-dur="2"></div><div class="shot" data-fx-part="clip" data-dur="2"></div><p data-fx-part="copy">First Strip</p></button>
    <button data-fx-part="panel" type="button"><div class="shot" data-fx-part="clip" data-dur="2"></div><div class="shot" data-fx-part="clip" data-dur="2"></div><div class="shot" data-fx-part="clip" data-dur="2"></div><p data-fx-part="copy">Second Strip</p></button>
    <button data-fx-part="panel" type="button"><div class="shot" data-fx-part="clip" data-dur="2"></div><div class="shot" data-fx-part="clip" data-dur="2"></div><div class="shot" data-fx-part="clip" data-dur="2"></div><p data-fx-part="copy">Third Strip</p></button>
  </div>
</section>
<section class="empty" data-fx="strip-grow-reel" data-demo-remove></section>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.body.insertAdjacentHTML("beforeend", '<section data-fx="strip-grow-reel" data-fx-strip-grow-reel="open: 60vw; shut: 10vw; intro: 0"><div class="row" style="height:30vh;margin-top:20px"><button data-fx-part="panel" type="button"><div class="shot" data-fx-part="clip" data-dur="3"></div></button><button data-fx-part="panel" type="button"><div class="shot" data-fx-part="clip" data-dur="3"></div></button></div></section>'), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
