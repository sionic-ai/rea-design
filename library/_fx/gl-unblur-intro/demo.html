<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gl-unblur-intro — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .hero { height: 70vh; min-height: 360px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; padding: 20px; }
  .row > div { height: 280px; }
  .state { padding: 12px 20px; font: 12px var(--kf-font-mono); color: var(--kf-dim); }
</style>
</head>
<body>
<p class="demo-hint"><b>gl-unblur-intro</b> — On reload the first panel comes into focus from a blur over 2.5 seconds. After 1 second the bottom-right panel is added (length 1s), and after 2.5 seconds one empty panel drops out.</p>
<div class="hero" data-fx="gl-unblur-intro" data-label="Hero photo · landscape 16:10"></div>
<p class="state" id="state">waits for fx:done</p>
<div class="row" id="row">
  <div data-fx="gl-unblur-intro" data-fx-gl-unblur-intro="blur: 30" data-label="Blur 30 texels"></div>
  <div data-fx="gl-unblur-intro" data-demo-remove></div>
</div>
<template data-demo-late>
  <div data-fx="gl-unblur-intro" data-fx-gl-unblur-intro="dur: 1; delay: 0" data-label="Late-arriving panel · 1s"></div>
</template>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
document.addEventListener("fx:done", () => { document.getElementById("state").textContent = "fx:done received"; }, { once: true });
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => document.getElementById("row").append(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
