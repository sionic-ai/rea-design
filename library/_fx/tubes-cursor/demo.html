<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tubes-cursor — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { margin: 0; background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { height: 80vh; margin: 20px; border-radius: var(--kf-radius-md); display: grid; place-items: center; }
  .demo h2 { position: relative; z-index: 2; margin: 0; font: 400 56px/1.1 var(--kf-font-display); pointer-events: none; }
</style>
</head>
<body>
<p class="demo-hint"><b>tubes-cursor</b> — Move the mouse over the dark panel and a glowing tube bends to follow. Click to change the color.</p>
<section class="demo" data-fx="tubes-cursor">
  <div data-fx-part="wait"></div>
  <h2>Your closing sentence here</h2>
</section>
<script>
(() => {
  const late = document.createElement("section");
  late.setAttribute("data-fx", "tubes-cursor");
  late.style.height = "40px";
  setTimeout(() => document.body.append(late), 1000);
  setTimeout(() => late.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s a small panel comes in and leaves after 2.5s (detach).");
})();
</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
