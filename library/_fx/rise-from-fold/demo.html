<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rise-from-fold — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo-spacer { height: 90vh; display: grid; place-items: center; color: var(--kf-dim); }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; padding: 120px 20px; }
  .grid article h2 { font: 500 14px/1.2 var(--kf-font-sans); margin: 0 0 6px; }
  .grid [data-fx-part="item"] { aspect-ratio: 3/2; background: var(--kf-raised); }
</style>
</head>
<body>
<p class="demo-hint"><b>rise-from-fold</b> Refresh the page. The cells on the first screen rise one after another from the bottom edge of the screen and settle into place.</p>
<section class="grid" data-fx="rise-from-fold"><article data-fx-part="box"><h2 data-fx-part="text">Name 1</h2><div data-fx-part="item"></div></article><article data-fx-part="box"><h2 data-fx-part="text">Name 2</h2><div data-fx-part="item"></div></article><article data-fx-part="box"><h2 data-fx-part="text">Name 3</h2><div data-fx-part="item"></div></article><article data-fx-part="box"><h2 data-fx-part="text">Name 4</h2><div data-fx-part="item"></div></article><article data-fx-part="box"><h2 data-fx-part="text">Name 5</h2><div data-fx-part="item"></div></article><article data-fx-part="box"><h2 data-fx-part="text">Name 6</h2><div data-fx-part="item"></div></article><article data-fx-part="box"><h2 data-fx-part="text">Name 7</h2><div data-fx-part="item"></div></article><article data-fx-part="box"><h2 data-fx-part="text">Name 8</h2><div data-fx-part="item"></div></article><article data-fx-part="box"><h2 data-fx-part="text">Name 9</h2><div data-fx-part="item"></div></article><article data-fx-part="box"><h2 data-fx-part="text">Name 10</h2><div data-fx-part="item"></div></article><article data-fx-part="box"><h2 data-fx-part="text">Name 11</h2><div data-fx-part="item"></div></article><article data-fx-part="box"><h2 data-fx-part="text">Name 12</h2><div data-fx-part="item"></div></article></section>
<script>
// Late arrivals and removals — checks that fx-core attaches to an element added after 1s and detaches from an element removed after 2.5s
(() => {
  const src = document.querySelector('[data-fx~="rise-from-fold"]');
  if (!src) return;
  const html = src.outerHTML.replace(/\sid="[^"]*"/g, "");
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => (src.closest(".pin-spacer") || src).after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical one comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
