<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pill-shrink-nav — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { margin: 0; background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { padding: 140px 24px 12px; font: 500 13px/1.4 var(--kf-font-mono); }
  .bar { position: fixed; inset: 0 0 auto; z-index: 10; display: flex; justify-content: space-between; align-items: center; --fx-pad: 3rem; --fx-pad-docked: 1.5rem 1.5rem 1.5rem 2rem; padding: 3rem; }
  @media (max-width: 991px) { .bar { --fx-pad: 2rem; } }
  @media (max-width: 767px) { .bar { --fx-pad: 1.5rem; --fx-pad-docked: 1rem 1rem 1rem 1.5rem; } }
  .bar a { color: inherit; text-decoration: none; font: 400 28px/1 var(--kf-font-display); }
  .bar .btn { font: 500 14px/1 var(--kf-font-sans); padding: 14px 20px; border-radius: 99px; background: var(--kf-ink); color: var(--kf-bg); }
  .bar.is-docked .btn { background: var(--kf-accent); color: var(--kf-on-accent); }
  .tall { height: 260vh; margin: 0 24px; border-top: 1px solid var(--kf-line); background: repeating-linear-gradient(var(--kf-bg) 0 80px, var(--kf-surface) 80px 160px); }
</style>
</head>
<body>
<header class="bar" data-fx="pill-shrink-nav"><a href="#">Logo</a><a class="btn" href="#">Menu</a><div data-fx-part="bg"></div></header>
<p class="demo-hint"><b>pill-shrink-nav</b> — Scroll down just a little. The headline shrinks into a center pill and the background drops down from the top. <span style="color:var(--kf-dim)">(After 1s one more headline row attaches below, and leaves 2.5s later)</span></p>
<template data-demo-late><header class="bar" data-fx="pill-shrink-nav" data-fx-pill-shrink-nav="at: 300; width: 20rem" style="top: 120px"><a href="#">Late row</a><a class="btn" href="#">Button</a><div data-fx-part="bg"></div></header></template>
<header class="bar" data-fx="pill-shrink-nav" data-demo-remove style="top: 240px"><a href="#">Dropped Line</a></header>
<div class="tall"></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/CustomEase.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
