<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>glyph-wordmark — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .stage { height: 60vh; margin: 20px; background: var(--kf-contrast-bg); cursor: pointer; }
  .stage [data-fx-part="logo"] { font: 900 15vw/1 var(--kf-font-display); }
  .stage.is-small { height: 30vh; }
  .stage.is-small [data-fx-part="logo"] { font-size: 8vw; }
</style>
</head>
<body>
<p class="demo-hint"><b>glyph-wordmark</b> — Move the mouse over the panel to push the letters away. Each press cycles scatter → fall → return. <span style="color:var(--kf-dim)">(After 1s one more panel comes in, and one leaves 2.5s later)</span></p>
<div class="stage" data-fx="glyph-wordmark"><p data-fx-part="logo">WORDMARK</p><span data-fx-part="bubble">Press!</span></div>
<div class="stage is-small" data-fx="glyph-wordmark" data-fx-glyph-wordmark="chars: 01; cell: 9" data-demo-remove><p data-fx-part="logo">Being removed soon</p></div>
<template data-demo-late><div class="stage is-small" data-fx="glyph-wordmark" style="--fx-glyph: var(--kf-accent-soft)"><p data-fx-part="logo">LATE</p><span data-fx-part="bubble">Arrives late</span></div></template>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
