<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cursor-word-trail — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.6 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .zone { display: grid; place-items: center; min-height: 70vh; margin: 20px; border: 1px dashed var(--kf-line); }
  .zone a { padding: 10px 24px; border: 1px solid currentColor; border-radius: var(--kf-radius-pill); }
</style>
</head>
<body>
<p class="demo-hint"><b>cursor-word-trail</b> — Move the mouse inside the dotted box. Thin trails and words appear and fade, and over the button they clear away. <span style="color:var(--kf-dim)">(After 1s one more cell comes in, and one leaves 2.5s later)</span></p>
<section class="zone" data-fx="cursor-word-trail" data-fx-cursor-word-trail="words: put a term here — a single word, two field terms, a short phrase, or a theory name"><a href="#">Retracts on button hover</a></section>
<section class="zone" data-fx="cursor-word-trail" data-demo-remove><span data-fx-part="word">One child word</span><span data-fx-part="word">Two child words</span>This cell drops out after 2.5s</section>
<template data-demo-late><section class="zone" data-fx="cursor-word-trail" data-fx-cursor-word-trail="look: plain; chance: .5; spread: 60">Late-arriving cell — no blending, words more frequent and farther</section></template>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../_vendor/konva@9.3.22/konva.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
