<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dot-open-card — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { display: flex; flex-direction: column; align-items: center; gap: 60px; padding: 60vh 20px 40vh; font-size: 12px; }
  .card { width: min(465px, 90vw); height: 600px; }
  .card [data-fx-part="clip"] { width: min(465px, 90vw); height: 600px; }
  .card [data-fx-part="media"] { background: var(--kf-ink); }
  .card [data-fx-part="label"] { display: flex; align-items: flex-end; justify-content: center; padding: 24px; color: var(--kf-contrast-ink); }
</style>
</head>
<body>
<p class="demo-hint"><b>dot-open-card</b> — Scroll down. Dots spread into photo cards and a text panel lights up. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<main class="demo">
  <figure class="card" data-fx="dot-open-card" data-demo-remove><div data-fx-part="clip"><div data-fx-part="media"></div></div><div data-fx-part="label">Step 01</div></figure>
  <figure class="card" data-fx="dot-open-card"><div data-fx-part="clip"><div data-fx-part="media"></div></div><div data-fx-part="label">Step 02</div></figure>
  <figure class="card" data-fx="dot-open-card" data-fx-dot-open-card="shift: 0"><div data-fx-part="clip"><div data-fx-part="media"></div></div></figure>
  <template data-demo-late><figure class="card" data-fx="dot-open-card"><div data-fx-part="clip"><div data-fx-part="media"></div></div><div data-fx-part="label">Late-arrived card</div></figure></template>
  <figure class="card" data-fx="dot-open-card"></figure>
</main>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); window.ScrollTrigger?.refresh(); }, 2500);
</script>
</body>
</html>
