<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>print-develop-gl — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  :root { --fx-develop-z: 0; }
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .col { position: relative; z-index: 1; display: grid; justify-items: center; gap: 24vh; padding: 30vh 0 60vh; }
  .col figure { margin: 0; width: min(80vw, 720px); aspect-ratio: 16 / 9; }
  .col figure.is-phone { width: 220px; aspect-ratio: .4872; }
  .hex { position: fixed; right: 16px; bottom: 16px; z-index: 100; padding: 4px 8px; background: var(--kf-surface); border: 1px solid var(--kf-line); font: 500 12px/1 var(--kf-font-mono); }
</style>
</head>
<body>
<p class="demo-hint"><b>print-develop-gl</b> — Scroll and the photo develops from a dither print into color, hover the cursor over the photo and the inside of the magnifier develops first (everything develops when scrolling stops). <span style="color:var(--kf-dim)">(After 1s one more cell comes in, and one leaves 2.5s later)</span></p>
<div class="col">
  <figure class="wf-img" data-fx="print-develop-gl" data-label="Window portrait · afternoon light · landscape 16:9"></figure>
  <figure class="wf-img" data-fx="print-develop-gl" data-fx-print-develop-gl="kind: ui; video: 1" data-label="Web app screen recording · landscape 16:9" data-demo-remove></figure>
  <figure class="wf-img is-phone" data-fx="print-develop-gl" data-fx-print-develop-gl="kind: phone; page: 1" data-label="Phone Screen Long Capture"></figure>
  <template data-demo-late><figure class="wf-img" data-fx="print-develop-gl" data-fx-print-develop-gl="kind: ui" data-label="Late-arriving screen capture"></figure></template>
  <figure class="wf-img" data-fx="print-develop-gl" data-label="Stage photo · dark audience seats · landscape 16:9"></figure>
  <figure data-fx="print-develop-gl"></figure>
</div>
<span class="hex">#------</span>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
document.addEventListener("fx:develop-sample", (e) => (document.querySelector(".hex").textContent = e.detail.hex || "#------"));
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
