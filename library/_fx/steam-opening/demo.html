<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>steam-opening — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 14px/1.6 var(--kf-font-sans); }
  .demo-hint { position: relative; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .page { display: grid; place-items: center; height: 120vh; font-size: 28px; }
  [data-fx-part="skip"] { padding: 6px 16px; border: 1px solid var(--kf-contrast-ink); border-radius: 30px; background: none; color: var(--kf-contrast-ink); cursor: pointer; }
  .again { margin-top: 12px; padding: 8px 16px; border: 1px solid var(--kf-line); border-radius: 30px; background: var(--kf-surface); cursor: pointer; }
</style>
</head>
<body>
<p class="demo-hint"><b>steam-opening</b> — On open the steam disperses, a large puff covers at 6.3s, and the veil lifts at 10s (the demo uses once: 0 so it plays on every open, Skip lifts it right away). <span style="color:var(--kf-dim)">(After 1s one more short act comes in, and after 2.5s it leaves)</span></p>
<div data-fx="steam-opening" data-fx-steam-opening="once: 0"><button data-fx-part="skip" type="button">Skip</button></div>
<div class="page"><div>Your Hero here <button class="again" type="button" onclick="location.reload()">View again</button></div></div>
<template data-demo-late><div data-fx="steam-opening" data-fx-steam-opening="once: 0; dur: 1.2; big-at: .4" data-demo-remove></div></template>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
