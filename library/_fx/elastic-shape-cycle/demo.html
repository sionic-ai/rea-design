<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>elastic-shape-cycle — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .stage { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; padding: 40px; }
  .box { aspect-ratio: 1200 / 700; background: var(--kf-accent); color: var(--kf-on-accent); }
  .box .wf-img { border: 0; }
  .box [data-fx-part="glyph"] { font: 700 1.6cqw/1 var(--kf-font-sans); }
</style>
</head>
<body>
<p class="demo-hint"><b>elastic-shape-cycle</b> — The mask opens with a surge and closes at 5s. Next slide every 7s. <span style="color:var(--kf-dim)">(After 1s one more panel comes in, and one leaves 2.5s later)</span></p>
<div class="stage">
  <div class="box" data-fx="elastic-shape-cycle">
    <div data-fx-part="slide"><div data-fx-part="mask"><div class="wf-img" data-fx-part="pic" data-label="Photo 1"></div></div><span data-fx-part="glyph" data-from="16.7 -14.3 -90" data-to="6 36.4 -19.1">Go</span><span data-fx-part="glyph" data-from="108 14.3 -80" data-to="91.6 40.9 13.3">Me</span></div>
    <div data-fx-part="slide" style="--fx-mask: url(&quot;data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 1200 700%27%3E%3Ccircle cx=%27440%27 cy=%27372%27 r=%27300%27/%3E%3Cpath d=%27M640 96 1124 300 700 652z%27/%3E%3C/svg%3E&quot;)"><div data-fx-part="mask"><div class="wf-img" data-fx-part="pic" data-label="Photo 2"></div></div><span data-fx-part="glyph" data-from="66.7 128 -90" data-to="56.6 83 19.1">Go</span><span data-fx-part="glyph" data-from="108 14.3 -80" data-to="85.5 39.9 49.8">Me</span></div>
  </div>
  <div class="box" data-demo-remove data-fx="elastic-shape-cycle"><div data-fx-part="slide"><div data-fx-part="mask"><div class="wf-img" data-fx-part="pic" data-label="Being removed soon"></div></div></div></div>
  <template data-demo-late><div class="box" data-fx="elastic-shape-cycle" data-fx-elastic-shape-cycle="every: 4; zoom: 1"><div data-fx-part="slide"><div data-fx-part="mask"><div class="wf-img" data-fx-part="pic" data-label="Late 1"></div></div></div><div data-fx-part="slide"><div data-fx-part="mask"><div class="wf-img" data-fx-part="pic" data-label="Late 2"></div></div></div></div></template>
  <div class="box" data-fx="elastic-shape-cycle"></div>
</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
