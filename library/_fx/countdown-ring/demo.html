<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>countdown-ring — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { margin: 0; padding: 12px 20px; border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .row { display: flex; gap: 40px; align-items: center; justify-content: center; margin: 60px auto; }
  .panel { width: 280px; aspect-ratio: 3 / 2; display: grid; place-items: center; border: 1px solid var(--kf-line); border-radius: 20px; font-size: 40px; }
</style>
</head>
<body>
<p class="demo-hint"><b>countdown-ring</b> — The ring fills over 4s while the number counts down. When full, the number on the left panel advances, then it counts again.</p>
<div class="row" id="row">
  <div class="panel" id="panel">1</div>
  <div id="ring" data-fx="countdown-ring"><span data-fx-part="num">4</span></div>
  <div data-fx="countdown-ring" data-fx-countdown-ring="every: 2" style="--fx-size: 36px; --fx-width: 4"><span data-fx-part="num">2</span></div>
</div>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
  let n = 1;
  const ring = document.getElementById("ring");
  ring.addEventListener("fx:done", () => {
    document.getElementById("panel").textContent = (n = n % 4 + 1);
    ring.dispatchEvent(new CustomEvent("fx:reset"));
  });
  // Check that late-arriving rings get hooked and removed rings get released
  setTimeout(() => {
    const d = document.createElement("div");
    d.dataset.fx = "countdown-ring";
    d.innerHTML = '<span data-fx-part="num"></span>';
    document.getElementById("row").append(d);
  }, 1000);
  setTimeout(() => document.querySelectorAll('[data-fx="countdown-ring"]')[1]?.remove(), 2500);
</script>
</body>
</html>
