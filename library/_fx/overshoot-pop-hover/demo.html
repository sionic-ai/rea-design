<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>overshoot-pop-hover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { display: flex; flex-wrap: wrap; align-items: center; gap: 32px; padding: 64px 20px; }
  .pill { display: inline-flex; align-items: center; gap: 14px; padding: 22px 28px 22px 34px; border-radius: var(--kf-radius-pill); background: var(--kf-ink); color: var(--kf-bg); font-size: 18px; }
  .pill svg { width: 30px; height: 12px; }
  .round { display: grid; place-items: center; width: 72px; height: 72px; border-radius: 50%; background: var(--kf-ink); color: var(--kf-bg); border: 0; cursor: pointer; }
  .card { display: block; width: 260px; padding: 18px; border: 1px solid var(--kf-line); border-radius: var(--kf-radius-md); background: var(--kf-surface); }
  .card .wf-img { aspect-ratio: 50 / 38; border-radius: var(--kf-radius-sm); }
  .card p { margin-top: 12px; }
</style>
</head>
<body>
<p class="demo-hint"><b>overshoot-pop-hover</b> — Hover over a button, round button or card. It dents once, then overflows and grows (cards change the photo only).</p>
<section class="demo">
  <a class="pill" href="#" data-fx="overshoot-pop-hover">View details <svg data-fx-part="arrow" viewBox="0 0 30 12" fill="none" stroke="currentColor" stroke-width="2"><path d="M0 6h28M23 1l5 5-5 5"/></svg></a>
  <button class="round" type="button" data-fx="overshoot-pop-hover" aria-label="Next">›</button>
  <a class="card" href="#" data-fx="overshoot-pop-hover" data-fx-overshoot-pop-hover="look: media"><span class="wf-img" data-fx-part="media" data-label="News Photo"></span><p>Your news title here</p></a>
</section>
<script>
  setTimeout(() => {
    const b = document.createElement("a"); b.href = "#"; b.className = "pill"; b.dataset.fx = "overshoot-pop-hover"; b.textContent = "Button added after 1s";
    document.querySelector(".demo").append(b);
  }, 1000);
</script>
</body>
</html>
