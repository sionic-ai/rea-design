<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>scroll-lag-slide — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo-spacer { height: 90vh; display: grid; place-items: center; color: var(--kf-dim); }
  .demo { padding: 80px 0; border-top: 1px solid var(--kf-line); }
  .demo p { font: 400 9vw/1 var(--kf-font-display); }
</style>
</head>
<body>
<p class="demo-hint"><b>scroll-lag-slide</b> — Scroll and pause. The big line of text slides left, then glides to a stop. <span style="color:var(--kf-dim)">(After 1s one more line comes in, and one leaves 2.5s later)</span></p>
<div class="demo-spacer">Scroll down</div>
<div class="demo" data-demo-remove data-fx="scroll-lag-slide"><p data-fx-part="text">FIELD ONE / FIELD TWO / FIELD THREE</p></div>
<div class="demo" data-fx="scroll-lag-slide"><p data-fx-part="text">FIELD ONE / FIELD TWO / FIELD THREE</p></div>
<template data-demo-late><div class="demo" data-fx="scroll-lag-slide" data-fx-scroll-lag-slide="dist: -400; lerp: 1"><p data-fx-part="text">BOUND TO SCROLL / NO LAG</p></div></template>
<div class="demo-spacer">Footer</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
