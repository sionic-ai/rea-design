<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>row-fade-hover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-list { margin: 40px 20px; }
  .demo-list a { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; padding: 24px 0; border-top: 1px solid var(--kf-line); }
  .demo-list a:last-child { border-bottom: 1px solid var(--kf-line); }
  .demo-list [data-fx-part="title"] { font-size: 28px; letter-spacing: -0.04em; }
  .demo-list span { font: 400 14px/1.5 var(--kf-font-mono); text-transform: uppercase; }
</style>
</head>
<body>
<p class="demo-hint"><b>row-fade-hover</b> — Hover over a row. The row fades once more to .7 and the title to .8.</p>
<div class="demo-list">
  <a href="#" data-fx="row-fade-hover"><p data-fx-part="title">Your session title here</p><span>Name Surname (Title, Company)</span></a>
  <a href="#" data-fx="row-fade-hover"><p data-fx-part="title">Your two long session titles here</p><span>Name Surname (Title, Company)</span></a>
  <a href="#" data-fx="row-fade-hover" style="--fx-row: .5"><p data-fx-part="title">--fx-row: .5 — row that fades out further</p><span>Name Surname (Title, Company)</span></a>
</div>
<script>
// Late arrivals and removals — as a css part, lines that arrive late are hooked right away, and removed lines simply vanish
(() => {
  const list = document.querySelector(".demo-list");
  const src = list.firstElementChild;
  const make = () => src.cloneNode(true);
  const gone = make();
  list.append(gone);
  setTimeout(() => list.append(make()), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s one more stripe comes in, and after 2.5s one leaves.");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
</body>
</html>
