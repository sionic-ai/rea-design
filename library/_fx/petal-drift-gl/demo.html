<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>petal-drift-gl — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  section { position: relative; height: 80vh; margin: 20px; background: var(--kf-accent-soft); overflow: hidden; }
  section h2 { position: absolute; inset: 0; display: grid; place-items: center; margin: 0; font-size: 40px; }
  .tall { height: 120vh; }
</style>
</head>
<body>
<p class="demo-hint"><b>petal-drift-gl</b> — Petals float up from below. Scrolling makes them rise faster, and moving the mouse near the large blurry leaves in front pushes them aside.</p>
<section>
  <div data-fx="petal-drift-gl" data-demo-remove></div>
  <div data-fx="petal-drift-gl"></div>
  <h2>Your section title here</h2>
  <div data-fx="petal-drift-gl" data-fx-petal-drift-gl="layer: front"></div>
</section>
<template data-demo-late><section><div data-fx="petal-drift-gl" data-fx-petal-drift-gl="count: 3; speed: 2"></div></section></template>
<div class="tall"></div>
<script src="three-global.js"></script>
<script src="../../_vendor/three@0.160.0/build/three.cjs"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
