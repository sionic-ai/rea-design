<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>inset-grow-hover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid var(--kf-line); margin: 32px 20px; }
  .card { display: flex; flex-direction: column; justify-content: space-between; height: 380px; padding: 20px 24px; border: 0; border-right: 1px solid var(--kf-line); border-bottom: 1px solid var(--kf-line); background: var(--kf-surface); text-align: left; cursor: pointer; }
  .ph { background: var(--kf-raised); }
  .ph.-alt { background: var(--kf-ink-soft); }
</style>
</head>
<body>
<p class="demo-hint"><b>inset-grow-hover</b> — Hover over the card. A small photo window in the center opens out to the card’s edges and the second photo lights up. <span style="color:var(--kf-dim)">(One more card comes in after 1s, and one drops out after 2.5s)</span></p>
<div class="grid" id="demo">
  <button class="card" data-fx="inset-grow-hover" data-demo-remove><span>Region · City</span><span data-fx-part="frame"><span class="ph" data-fx-part="photo"></span><span class="ph -alt" data-fx-part="alt"></span></span><span>Hotel Name 01</span></button>
  <button class="card" data-fx="inset-grow-hover"><span>Region · City</span><span data-fx-part="frame"><span class="ph" data-fx-part="photo"></span></span><span>Hotel Name 02 (no second photo)</span></button>
  <button class="card" data-fx="inset-grow-hover" style="--fx-inset: 10%; --fx-scale: .8"><span>Region · City</span><span data-fx-part="frame"><span class="ph" data-fx-part="photo"></span><span class="ph -alt" data-fx-part="alt"></span></span><span>Hotel Name 03 (inset 10%)</span></button>
  <button class="card" data-fx="inset-grow-hover"><span>Empty card — no children</span></button>
</div>
<script>
setTimeout(() => document.getElementById("demo").insertAdjacentHTML("beforeend", '<button class="card" data-fx="inset-grow-hover"><span>Late-arrived card</span><span data-fx-part="frame"><span class="ph" data-fx-part="photo"></span><span class="ph -alt" data-fx-part="alt"></span></span><span>Hotel Name 04</span></button>'), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
