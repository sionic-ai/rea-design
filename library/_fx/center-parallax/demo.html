<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>center-parallax — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { position: relative; padding: 48px 20px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; align-items: center; }
  .demo-spacer { height: 90vh; display: grid; place-items: center; color: var(--kf-dim); }
  .photo { position: relative; aspect-ratio: 4 / 3; border-radius: var(--kf-radius-lg); overflow: hidden; }
  .photo > [data-fx] { position: absolute; left: 0; top: -5%; width: 100%; height: 110%; }
  .photo .wf-img { width: 100%; height: 100%; border: 0; }
  .dot { width: 64px; height: 56px; border-radius: 50%; background: var(--kf-accent); justify-self: center; }
</style>
</head>
<body>
<p class="demo-hint"><b>center-parallax</b> — Scroll down and watch the inside of the photo frames and the dots shift more the farther they are from screen center. <span style="color:var(--kf-dim)">(After 1s one more dot comes in, and one leaves 2.5s later)</span></p>
<div class="demo-spacer">Scroll down</div>
<section class="demo">
  <figure class="photo"><div data-fx="center-parallax"><div class="wf-img" data-label="Photo · Speed .2"></div></div></figure>
  <span class="dot" data-fx="center-parallax" data-fx-center-parallax="speed: .3"></span>
  <figure class="photo" style="overflow: hidden"><div data-fx="center-parallax" data-fx-center-parallax="speed: -0.05; sp: -0.05; max: 15; scale: 1.1; lerp: 0.08" style="transition: transform .1s linear"><div class="wf-img" data-label="Photo · cap 15px · 1.1x · approach 8%"></div></div></figure>
  <figure class="photo"><div data-fx="center-parallax" data-fx-center-parallax="speed: .15; sp: .08"><div class="wf-img" data-label="Photo · speed .15"></div></div></figure>
  <span data-demo-remove class="dot" data-fx="center-parallax" data-fx-center-parallax="speed: -.2"></span>
  <template data-demo-late><span class="dot" data-fx="center-parallax" data-fx-center-parallax="speed: .1"></span></template>
</section>
<div class="demo-spacer"></div>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
