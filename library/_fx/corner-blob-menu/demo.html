<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>corner-blob-menu — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .box { position: relative; height: 70vh; margin: 24px; border-radius: var(--kf-radius-lg); background: var(--kf-surface); overflow: hidden; }
  .box button { position: absolute; z-index: 3; top: 20px; right: 20px; padding: 10px 16px; border: 1px solid var(--kf-ink); border-radius: var(--kf-radius-pill); background: var(--kf-surface); cursor: pointer; }
  .bg { position: absolute; top: 0; right: 0; width: 80%; height: 90%; border-radius: 0 0 0 50% / 0 0 0 40%; background: var(--kf-accent); }
  .panel { position: absolute; z-index: 2; top: 80px; right: 60px; display: grid; gap: 12px; color: var(--kf-on-accent); font-size: 22px; }
</style>
</head>
<body>
<p class="demo-hint"><b>corner-blob-menu</b> — Press ”Menu” — the panel unfolds from the top-right corner and the text appears (closes with Esc).</p>
<div class="box" data-demo-remove data-fx="corner-blob-menu"><button type="button" data-fx-part="toggle">Menu to Remove</button><div class="bg" data-fx-part="bg"></div><nav class="panel" data-fx-part="panel"><a href="#">One</a></nav></div>
<div class="box" data-fx="corner-blob-menu"><button type="button" data-fx-part="toggle">Menu</button><div class="bg" data-fx-part="bg"></div><nav class="panel" data-fx-part="panel"><a href="#">Menu First</a><a href="#">Menu Two</a><a href="#">Menu Three</a></nav></div>
<template data-demo-late><div class="box" data-fx="corner-blob-menu" data-fx-corner-blob-menu="dur: .3; close: .4; delay: .2"><button type="button" data-fx-part="toggle">Late-arrived Menu</button><div class="bg" data-fx-part="bg"></div><nav class="panel" data-fx-part="panel"><a href="#">Late panel</a></nav></div></template>
<div class="box" data-fx="corner-blob-menu"></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); }, 2500);
</script>
</body>
</html>
