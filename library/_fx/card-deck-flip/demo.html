<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>card-deck-flip — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .stage { display: grid; grid-template-columns: 200px 340px; gap: 40px; margin: 60px 40px; padding: 40px; border-radius: var(--kf-radius-lg); background: var(--kf-accent-soft); width: fit-content; }
  .toc button { display: block; padding: 10px 0; background: none; border: 0; cursor: pointer; }
  .deck { position: relative; height: 380px; }
  .deck [data-fx-part="card"] { position: absolute; inset: 0; border-radius: 30px 10px 30px 30px; background: var(--kf-surface); padding: 30px; transform-origin: 89% 4%; }
  .deck .ui { position: absolute; left: 30px; right: 30px; bottom: 20px; display: flex; justify-content: space-between; }
  .go { grid-column: 2; height: 48px; border-radius: var(--kf-radius-pill); border: 0; background: var(--kf-accent); color: var(--kf-on-accent); cursor: pointer; }
</style>
</head>
<body>
<p class="demo-hint"><b>card-deck-flip</b> — Click ”Next section” or the left index — the card tilts as it turns. <span style="color:var(--kf-dim)">(After 1s one more pile comes in, and after 2.5s one drops out)</span></p>
<div class="stage" data-fx="card-deck-flip">
  <nav class="toc"><button data-fx-part="tab">00 covers</button><button data-fx-part="tab">01 First Step</button><button data-fx-part="tab">02 Second step</button><button data-fx-part="tab">03 Third step</button></nav>
  <div class="deck">
    <article data-fx-part="card" class="is-current"><div data-fx-part="body"><h2>Your cover title here</h2></div></article>
    <article data-fx-part="card"><div data-fx-part="body"><h3>01 Step title here</h3><p>Your two body lines here.</p><div class="ui"><button data-fx-part="prev">Previous</button><button data-fx-part="next">Next</button></div></div></article>
    <article data-fx-part="card"><div data-fx-part="body"><h3>02 Step title here</h3><p>Your two body lines here.</p><div class="ui"><button data-fx-part="prev">Previous</button><button data-fx-part="next">Next</button></div></div></article>
    <article data-fx-part="card"><div data-fx-part="body"><h3>03 Final section</h3><div class="ui"><button data-fx-part="prev">Previous</button></div></div></article>
  </div>
  <button class="go" data-fx-part="next">To the next section</button>
</div>
<div class="stage" data-fx="card-deck-flip" data-demo-remove><div class="deck"><article data-fx-part="card">Exit pile</article></div></div>
<div data-late-slot></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelector("[data-late-slot]").outerHTML = '<div class="stage" data-fx="card-deck-flip" data-fx-card-deck-flip="tilt: 8; dur: .8"><div class="deck"><article data-fx-part="card">Late-arriving pile 1 · tilt 8 · .8s</article><article data-fx-part="card">Late dummy 2</article></div><button class="go" data-fx-part="next">Next</button></div>', 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
