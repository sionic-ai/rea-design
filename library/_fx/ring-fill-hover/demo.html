<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ring-fill-hover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { padding: 48px 20px; display: grid; gap: 32px; justify-items: start; }
  .demo a { display: inline-flex; align-items: center; gap: 20px; font-weight: 700; }
  .demo a.row { display: flex; justify-content: space-between; width: min(520px, 100%); min-height: 180px; padding: 0 40px; border-top: 1px solid var(--kf-line); }
</style>
</head>
<body>
<p class="demo-hint"><b>ring-fill-hover</b> — Hover over the round button. The ring spreads and vanishes, the disc lights up and the arrow passes through.</p>
<section class="demo">
  <a href="#" data-fx="ring-fill-hover"><span data-fx-part="ring"><span data-fx-part="arrow"></span></span>Your details here</a>
  <a href="#" data-fx="ring-fill-hover" style="--fx-size: 110px"><span data-fx-part="ring"><span data-fx-part="arrow"></span></span>Large circle (110px)</a>
  <a href="#" class="row" data-fx="ring-fill-hover" data-fx-ring-fill-hover="look: glow"><span>Whole-cell link — glow spreads behind it (glow)</span><span data-fx-part="ring"><span data-fx-part="arrow"></span></span></a>
</section>
<script>
(() => {
  const host = document.querySelector('[data-fx~="ring-fill-hover"]');
  const html = host.outerHTML;
  const make = () => { const t = document.createElement("template"); t.innerHTML = html; return t.content.firstElementChild; };
  const gone = make();
  host.after(gone);
  setTimeout(() => host.after(make()), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s one more identical button comes in, and after 2.5s one drops out.");
})();
</script>
<script src="../fx-core.js"></script>
</body>
</html>
