<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pan-gradient-shift — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo-spacer { height: 90vh; display: grid; place-items: center; color: var(--kf-dim); }
  .pan { background: linear-gradient(180deg, var(--kf-bg) 0%, color-mix(in oklab, var(--kf-surface) 50%, transparent) 53%, var(--kf-accent) 100%); }
  .pan [data-fx-part="track"] > div { display: grid; place-items: center; font: 400 64px/1 var(--kf-font-display); }
  .pan [data-fx-part="track"] > div::after { content: ""; position: absolute; left: 10%; bottom: 0; width: 30%; aspect-ratio: 2 / 1; border-radius: 50% 50% 0 0; background: var(--kf-surface); }
</style>
</head>
<body>
<p class="demo-hint"><b>pan-gradient-shift</b> — Scrolling pins the panel and the sections flow sideways, and the background gradient changes as you pass sections 3, 4 and 5. <span style="color:var(--kf-dim)">(After 1s one more panel comes in, and one leaves 2.5s later)</span></p>
<div class="demo-spacer">Scroll down</div>
<section class="pan" data-demo-remove data-fx="pan-gradient-shift" data-grad="180 | var(--kf-bg) | color-mix(in oklab, var(--kf-surface) 50%, transparent) 53 | var(--kf-accent)"><div data-fx-part="track"><div>1</div><div>2</div></div></section>
<section class="pan" data-fx="pan-gradient-shift" data-fx-pan-gradient-shift="wide: 3:1.15" data-grad="180 | var(--kf-bg) | color-mix(in oklab, var(--kf-surface) 50%, transparent) 53 | var(--kf-accent)">
  <div data-fx-part="track">
    <div>1</div><div>2</div>
    <div data-grad="180 | var(--kf-accent) | color-mix(in oklab, var(--kf-surface) 50%, transparent) 56.5 | var(--kf-surface)">3</div>
    <div data-grad="0 | color-mix(in oklab, var(--kf-surface) 20%, transparent) | var(--kf-surface) 27.53 | var(--kf-surface)">4</div>
    <div data-grad="180 | var(--kf-bg) | color-mix(in oklab, var(--kf-surface) 70%, transparent) 53 | var(--kf-accent)" data-grad-via="90 | color-mix(in oklab, var(--kf-surface) 20%, transparent) | color-mix(in oklab, var(--kf-surface) 20%, transparent) 50 | color-mix(in oklab, var(--kf-surface) 20%, transparent)">5</div>
    <div>6</div>
  </div>
</section>
<template data-demo-late><section class="pan" data-fx="pan-gradient-shift" data-fx-pan-gradient-shift="scrub: 2" data-grad="180 | var(--kf-bg) | var(--kf-surface) 50 | var(--kf-accent)"><div data-fx-part="track"><div>A</div><div data-grad="0 | var(--kf-accent) | var(--kf-surface) 50 | var(--kf-bg)">B</div><div>C</div></div></section></template>
<section data-fx="pan-gradient-shift"></section>
<section data-fx="pan-gradient-shift"><div data-fx-part="track"></div></section>
<div class="demo-spacer"></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); window.ScrollTrigger?.refresh(); }, 2500);
</script>
</body>
</html>
