<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ellipse-arrow-cursor — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { padding: 12px 20px; border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .rows { margin: 20px; border-bottom: 1px solid var(--kf-line); }
  .rows a { display: flex; align-items: center; min-height: 120px; padding: 0 40px; border-top: 1px solid var(--kf-line); }
</style>
</head>
<body>
<p class="demo-hint"><b>ellipse-arrow-cursor</b> — Hover over the row below. An oval cursor appears and the border and arrow are drawn (screens wider than 835).</p>
<div class="rows">
  <a href="#" data-fx="ellipse-arrow-cursor" data-demo-remove>One line — a line that joins 1 second late appears below, and this line drops out after 2.5 seconds</a>
  <a href="#" data-fx="ellipse-arrow-cursor">Line Two</a>
  <template data-demo-late><a href="#" data-fx="ellipse-arrow-cursor">Late-attached Line</a></template>
</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
