<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>coord-circle-hover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { padding: 48px 20px; display: grid; gap: 24px; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .btn { display: inline-flex; align-items: center; justify-content: center; width: 120px; height: 40px; border-radius: 10px; border: 1px solid var(--kf-accent); color: var(--kf-accent); background: var(--kf-surface); }
  .btn.is-fill { color: var(--kf-on-accent); background: var(--kf-accent); }
  .nav a { display: inline-flex; align-items: center; height: 26px; padding: 0 13px; border-radius: 999px; color: var(--kf-accent); }
  .box { display: flex; align-items: center; min-height: 100px; padding: 0 30px; border: 1px solid var(--kf-dim); border-radius: 4px; max-width: 480px; }
</style>
</head>
<body>
<p class="demo-hint"><b>coord-circle-hover</b> — Move the mouse in and out over buttons, menus and boxes from several directions. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<section class="demo">
  <nav class="row nav"><a href="#" data-fx="coord-circle-hover">Menu 1</a><a href="#" data-fx="coord-circle-hover">Menu 2</a><a href="#" data-fx="coord-circle-hover" data-demo-remove>Being removed soon</a><template data-demo-late><a href="#" data-fx="coord-circle-hover">Enters late</a></template></nav>
  <div class="row">
    <a class="btn" href="#" data-fx="coord-circle-hover">Material Request</a>
    <a class="btn is-fill" href="#" data-fx="coord-circle-hover" style="--fx-fill: var(--kf-surface); --fx-on: var(--kf-accent)">Inquiry</a>
  </div>
  <a class="box" href="#" data-fx="coord-circle-hover" data-fx-coord-circle-hover="look: keep" style="--fx-fill: var(--kf-accent-soft)">Your link box here — text color unchanged</a>
  <a class="box" href="#" data-fx="coord-circle-hover"></a>
</section>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); }, 2500);
</script>
</body>
</html>
