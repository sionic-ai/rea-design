<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bend-edge-accordion — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { display: grid; gap: 40px; padding: 40px 20px; }
  .acc { height: 30em; }
  .acc.is-gap { --fx-gap: 8px; height: 22em; }
  .acc [data-fx-part="item"] { border-radius: var(--kf-radius-md); }
  .acc [data-fx-part="image"] { position: absolute; inset: 0; }
  .acc [data-fx-part="label"] { position: absolute; left: 20px; bottom: 16px; font: var(--kf-weight-display) 2.4em/1.2 var(--kf-font-display); color: var(--kf-surface); }
</style>
</head>
<body>
<p class="demo-hint"><b>bend-edge-accordion</b> — Move the mouse quickly across the cells. The cells spring apart and the borders bend, then settle.</p>
<main class="demo">
  <div class="acc" data-fx="bend-edge-accordion">
    <div data-fx-part="item" data-label="Landscape · Orange Light"><div class="wf-img" data-fx-part="image" data-label="Scenery"></div><span data-fx-part="label">One cell</span></div>
    <div data-fx-part="item" data-label="Canyon · from above"><div class="wf-img" data-fx-part="image" data-label="Canyon"></div><span data-fx-part="label">Cell two</span></div>
    <div data-fx-part="item" data-label="City · Sunset"><div class="wf-img" data-fx-part="image" data-label="City"></div><span data-fx-part="label">Cell three</span></div>
    <div data-fx-part="item" data-label="Person profile view"><div class="wf-img" data-fx-part="image" data-label="Person"></div><span data-fx-part="label">Cell four</span></div>
  </div>
  <div class="acc is-gap" data-fx="bend-edge-accordion" data-fx-bend-edge-accordion="open: 4; bend: 2.4">
    <div data-fx-part="item" data-label="Gapped cell 1"><span data-fx-part="label">Gap 1</span></div>
    <div data-fx-part="item" data-label="Gapped cell 2"><span data-fx-part="label">Gap 2</span></div>
    <div data-fx-part="item" data-label="Gapped cell 3"><span data-fx-part="label">Gap 3</span></div>
  </div>
  <div class="acc is-gap" data-fx="bend-edge-accordion"></div>
</main>
<script>
(() => {
  const src = document.querySelector(".acc.is-gap");
  const gone = src.cloneNode(true);
  src.after(gone);
  setTimeout(() => src.after(src.cloneNode(true)), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · The empty panel at the bottom stays quiet even with no cells. After 1s one more panel comes in, and after 2.5s one drops out (detach).");
})();
</script>
<script src="three-global.js"></script>
<script src="../../_vendor/three@0.184.0/build/three.cjs"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
