<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>squiggle-stroke-title — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { display: grid; gap: 40px; padding: 48px 20px; }
  .demo svg { width: min(640px, 100%); height: auto; overflow: visible; }
  .demo text { font: 400 72px var(--kf-font-display); }
</style>
</head>
<body>
<p class="demo-hint"><b>squiggle-stroke-title</b> — On open, the letter strokes are drawn with a tremble, then filled in. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<section class="demo">
  <h2 data-demo-remove data-fx="squiggle-stroke-title" aria-label="Title Here"><svg viewBox="0 0 640 100"><text data-fx-part="text" x="0" y="80">Title Here</text></svg></h2>
  <h2 data-fx="squiggle-stroke-title" data-fx-squiggle-stroke-title="each: .3" aria-label="Two Lines"><svg viewBox="0 0 640 190"><text data-fx-part="text" x="0" y="80">Environmental</text><text data-fx-part="text" x="0" y="170">Protection</text></svg></h2>
  <h2 data-fx="squiggle-stroke-title" data-fx-squiggle-stroke-title="look: outline; on: view" aria-label="Outline"><svg viewBox="0 0 640 100"><text data-fx-part="text" x="0" y="80">Pick Up Topics</text></svg></h2>
  <template data-demo-late><h2 data-fx="squiggle-stroke-title" aria-label="Late"><svg viewBox="0 0 640 100"><text data-fx-part="text" x="0" y="80">Late One</text></svg></h2></template>
  <h2 data-fx="squiggle-stroke-title"></h2>
</section>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
