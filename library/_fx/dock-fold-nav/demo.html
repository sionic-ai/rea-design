<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dock-fold-nav — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 14px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { margin: 0; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .hero { height: 100vh; display: grid; place-items: center; background: var(--kf-raised); }
  .rest { height: 160vh; display: grid; place-items: center; color: var(--kf-dim); }
  .dock a { color: inherit; text-decoration: none; }
  .lead { display: block; width: 30px; height: 26px; border-radius: 8px; background: var(--kf-accent); }
  .cta { padding: 12px 20px; border-radius: 6px; background: var(--kf-accent); color: var(--kf-on-accent); }
  .menu { position: fixed; z-index: 99; left: 0; right: 0; bottom: 92px; margin-inline: auto; width: fit-content; display: flex; flex-direction: column; gap: 8px; }
  .menu a { display: block; min-width: 132px; padding: 12px 20px; border-radius: 6px; background: var(--kf-surface); color: inherit; text-align: center; text-decoration: none; }
  .dock.late { bottom: 90px; }
</style>
</head>
<body>
<p class="demo-hint"><b>dock-fold-nav</b> — Scroll down and the dock links fold away and a hamburger appears. Press the hamburger. <span style="color:var(--kf-dim)">(After 1s one more dock comes in, and after 2.5s the first dock drops out)</span></p>
<div class="hero">Hero</div>
<div class="rest">Scroll down</div>
<nav class="dock" data-demo-remove data-fx="dock-fold-nav" data-fx-dock-fold-nav="menu: #m1">
  <a class="lead" data-fx-part="lead" href="#" aria-label="First"></a>
  <div data-fx-part="links"><a href="#">Menu 1</a><a href="#">Menu 2</a><a href="#">Menu 3</a></div>
  <button type="button" data-fx-part="toggle" aria-label="Menu" aria-expanded="false"><svg viewBox="0 0 18 18" width="18" height="18"><g data-key="menu" fill="currentColor"><rect y="6.2" width="18" height="1.4" rx=".7"/><rect y="10.4" width="18" height="1.4" rx=".7"/></g><g data-key="close" fill="currentColor"><rect x="2" y="15" width="18" height="1" transform="rotate(-45 2 15)"/><rect x="3" y="2" width="18" height="1" transform="rotate(45 3 2)"/></g></svg></button>
  <a class="cta" data-fx-part="cta" href="#">Your button here</a>
</nav>
<div class="menu" id="m1" data-demo-remove><a href="#">Menu 1</a><a href="#">Menu 2</a><a href="#">Menu 3</a></div>
<template data-demo-late><nav class="dock late" data-fx="dock-fold-nav" data-fx-dock-fold-nav="at: .3"><div data-fx-part="links"><a href="#">Late solo</a></div><button type="button" data-fx-part="toggle" aria-label="Menu">≡</button><div data-fx-part="menu"><a href="#">Menu 1</a></div></nav></template>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
