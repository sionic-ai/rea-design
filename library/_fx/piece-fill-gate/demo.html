<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>piece-fill-gate — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); min-height: 100vh; }
  .demo-hint { position: relative; z-index: 70; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-logo { position: fixed; top: 60px; left: 24px; width: 48px; height: 24px; z-index: 1; }
</style>
</head>
<body>
<p class="demo-hint"><b>piece-fill-gate</b> — Three logo pieces fill up in turn, then QUIET·SOUND rises in. Press one and the pieces gather and fly to the logo spot at the top left. <span style="color:var(--kf-dim)">(After 1s one more door comes in, and drops out after 2.5s)</span></p>
<svg class="demo-logo" viewBox="0 0 280 140" fill="currentColor" aria-hidden="true"><g transform="translate(18 -17)"><path fill-rule="evenodd" d="M120 30a30 30 0 1 0 .01 0ZM120 43a17 17 0 1 1-.01 0Z"/><path d="M150 32h14v70h-14z"/><path d="M80 102a42 42 0 0 0 84 0h-14a28 28 0 0 1-56 0z"/></g></svg>
<div data-fx="piece-fill-gate" data-fx-piece-fill-gate="to: .demo-logo; min: 1.4">
  <svg data-fx-part="mark" viewBox="0 0 280 140" aria-hidden="true"><g transform="translate(18 -17)">
    <g data-piece><path fill-rule="evenodd" d="M120 30a30 30 0 1 0 .01 0ZM120 43a17 17 0 1 1-.01 0Z"/></g>
    <g data-piece><path d="M150 32h14v70h-14z"/></g>
    <g data-piece><path d="M80 102a42 42 0 0 0 84 0h-14a28 28 0 0 1-56 0z"/></g>
  </g></svg>
  <div data-fx-part="choices"><span><button type="button" data-choice="quiet">QUIET</button></span><span><button type="button" data-choice="sound">SOUND</button></span></div>
</div>
<template data-demo-late><div data-fx="piece-fill-gate" data-demo-remove><svg data-fx-part="mark" viewBox="0 0 280 140" aria-hidden="true"><g data-piece><path d="M100 40h80v20h-80z"/></g></svg></div></template>
<div data-fx="piece-fill-gate" style="display:none"><p>Empty door — nothing is hooked onto it</p></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/CustomEase.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
