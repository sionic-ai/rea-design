<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>video-end-loader — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .page { padding: 40px 20px; }
  .skip { width: 80px; height: 80px; border: 1px solid var(--kf-ink); border-radius: 50%; background: var(--kf-surface); color: var(--kf-ink); font: 500 13px/1 var(--kf-font-sans); cursor: pointer; }
  .local { position: relative; height: 240px; margin-top: 20px; }
  .local [data-fx~="video-end-loader"] { position: absolute; }
</style>
</head>
<body>
<div data-demo-remove data-fx="video-end-loader" data-fx-video-end-loader="max: 6"><video data-fx-part="video" muted playsinline></video><button class="skip" data-fx-part="skip" type="button">SKIP</button></div>
<p class="demo-hint"><b>video-end-loader</b> The opening curtain lifts in 1.5s when the video ends or SKIP is pressed (after 6s if there is no video). <span style="color:var(--kf-dim)">(After 1s one more panel comes in, and one leaves 2.5s later)</span></p>
<main class="page"><p>This page shows once the overlay lifts.</p><div class="local"><div data-fx="video-end-loader" data-fx-video-end-loader="max: 3; out: .6"><button class="skip" data-fx-part="skip" type="button">SKIP</button></div></div></main>
<template data-demo-late><div class="local"><div data-fx="video-end-loader" data-fx-video-end-loader="max: 2"></div></div></template>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
