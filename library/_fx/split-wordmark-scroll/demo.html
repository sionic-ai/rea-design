<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>split-wordmark-scroll — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 10; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-spacer { height: 90vh; display: grid; place-items: center; color: var(--kf-dim); }
  .demo { height: 100vh; background: var(--kf-contrast-bg); color: var(--kf-contrast-ink); display: flex; flex-direction: column; justify-content: space-between; }
  .demo-panel { padding: 20vh 0 0; text-align: center; font: 600 40px/1.1 var(--kf-font-display); }
  .demo-mark { display: flex; justify-content: center; gap: 2vw; font: 700 18vw/0.75 var(--kf-font-display); white-space: nowrap; }
  .demo-shape { position: absolute; left: 50%; top: 10vh; width: 30vw; height: 30vw; margin-left: -15vw; border-radius: 50%; border: 1px solid var(--kf-contrast-ink); opacity: 0.2; }
</style>
</head>
<body>
<p class="demo-hint"><b>split-wordmark-scroll</b> — Scroll down and the large text below splits apart to both sides while the center panel rises.</p>
<div class="demo-spacer">Scroll down ↓</div>
<footer class="demo" data-fx="split-wordmark-scroll">
  <span class="demo-shape" data-fx-part="shape"></span>
  <div class="demo-panel" data-fx-part="panel">Menu 1 · Menu 2 · Menu 3</div>
  <div class="demo-mark"><span data-fx-part="left">STUDIO</span><span data-fx-part="right">NAME</span></div>
</footer>
<script>
(() => {
  const src = document.querySelector('[data-fx~="split-wordmark-scroll"]');
  if (!src) return;
  const t = document.createElement("template");
  t.innerHTML = src.outerHTML;
  const late = t.content.firstElementChild;
  late.dataset.demo = "late";
  setTimeout(() => src.after(late), 1000);
  setTimeout(() => late.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s one more of the same comes in, then leaves after 2.5s (detach).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
