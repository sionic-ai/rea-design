<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cue-fade-intro — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 50; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .hero { display: grid; gap: 16px; padding: 60px 20px; }
  .hero h1 { font-size: 40px; }
  .pic { width: 200px; height: 140px; border: 1px solid var(--kf-line); border-radius: var(--kf-radius-md); background: var(--kf-surface); }
</style>
</head>
<body>
<p class="demo-hint"><b>cue-fade-intro</b> On open, the name flashes on and off, then the title, heading and image rise in turn (reload to see it again).</p>
<section class="hero" data-fx="cue-fade-intro">
  <div data-fx-part="cover"><p data-fx-part="note">Your two-line name here</p></div>
  <h1 data-fx-part="cue" data-at="1.2">Your title here</h1>
  <p data-fx-part="cue" data-at="1.5">Your preface here</p>
  <div class="pic" data-fx-part="cue" data-at="1.7" data-dur="3" data-ease="power3.out"></div>
</section>
<section class="hero" data-fx="cue-fade-intro" data-demo-remove><h1 data-fx-part="cue">Panel to Be Removed</h1></section>
<template data-demo-late><section class="hero" data-fx="cue-fade-intro" data-fx-cue-fade-intro="release: .5"><p data-fx-part="cue" data-at=".2">Late-arriving panel</p></section></template>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
