<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>clip-side-drawer — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { display: flex; gap: 40px; padding: 32px 20px 120px; }
  .side { position: relative; z-index: 2; width: 120px; height: 420px; padding: 24px 12px; border-radius: var(--kf-radius-lg); background: var(--kf-contrast-bg); color: var(--kf-contrast-ink); display: flex; flex-direction: column; gap: 12px; }
  .side [data-fx-part="tab"] { display: grid; place-items: center; height: 56px; border-radius: var(--kf-radius-md); background: color-mix(in srgb, var(--kf-contrast-ink) 12%, transparent); font-weight: 700; cursor: pointer; transition: opacity 0.3s ease; }
  .side [data-fx-part="tab"].is-other { opacity: 0.4; }
  .side [data-fx-part="panel"] { position: absolute; top: 0; left: 100%; width: 300px; height: 100%; border-radius: 0 var(--kf-radius-lg) var(--kf-radius-lg) 0; background: var(--kf-contrast-bg); border-left: 1px solid color-mix(in srgb, var(--kf-dim) 35%, transparent); }
  .side [data-fx-part="drawer"] { position: absolute; inset: 0; padding: 72px 28px 0; }
  .side [data-fx-part="drawer"] h3 { font-size: 18px; font-weight: 700; text-align: center; }
  .side [data-fx-part="drawer"] p { margin-top: 20px; font-size: 13px; color: var(--kf-dim); }
  .side [data-fx-part="close"] { position: absolute; top: 16px; right: 16px; z-index: 2; width: 32px; height: 32px; border: 0; border-radius: 99px; background: var(--kf-dim); color: var(--kf-contrast-ink); cursor: pointer; }
  .side { --fx-width: 300px; --fx-veil-z: 1; }
</style>
</head>
<body>
<p class="demo-hint"><b>clip-side-drawer</b> Press the sidebar button. A side panel attaches and the back blurs. It closes with the same button, the close button, the blur overlay, or Esc.</p>
<section class="demo">
<nav class="side" data-fx="clip-side-drawer" aria-label="Menu">
  <a data-fx-part="tab" data-key="find">Find</a>
  <a data-fx-part="tab" data-key="help">Help</a>
  <a data-fx-part="tab" data-key="menu">Menu</a>
  <div data-fx-part="panel">
    <button type="button" data-fx-part="close" aria-label="Close">×</button>
    <section data-fx-part="drawer" data-key="find"><h3>Find</h3><p>Your search field and shortcut field here.</p></section>
    <section data-fx-part="drawer" data-key="help"><h3>Help</h3><p>Your FAQ tag here.</p></section>
    <section data-fx-part="drawer" data-key="menu"><h3>Menu</h3><p>Your full menu list goes here.</p></section>
  </div>
</nav>
</section>
<script>
// Late arrivals and removals — checks that fx-core attaches to an element added after 1s and detaches from an element removed after 2.5s
(() => {
  const src = document.querySelector('[data-fx~="clip-side-drawer"]');
  if (!src) return;
  const html = src.outerHTML.replace(/\sid="[^"]*"/g, "");
  const host = src.parentElement; // A place to attach a late arrival even if src is detached during the demo (inspector tools watch for detaching)
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  host.append(gone);
  setTimeout(() => host.append(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical one comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
