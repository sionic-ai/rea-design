<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>board-slide-hover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .row { display: flex; gap: 24px; padding: 48px 24px; }
  .btn { display: flex; height: 56px; border: 1px solid var(--kf-line); font-weight: 700; }
  .btn > [data-fx-part="board"]:first-child { place-items: center; padding: 0 20px; border-right: 1px solid var(--kf-line); }
  .btn > [data-fx-part="board"] + [data-fx-part="board"] { place-items: center; width: 56px; }
</style>
</head>
<body>
<p class="demo-hint"><b>board-slide-hover</b> — Hover over the button (the text is pushed up and the arrow to the right as they swap). <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<div class="row" id="row">
  <a class="btn" data-fx="board-slide-hover" href="#a"><span data-fx-part="board"><span>Your button here</span></span><span data-fx-part="board" data-dir="right"><span>→</span></span></a>
  <a class="btn" data-demo-remove data-fx="board-slide-hover" data-fx-board-slide-hover="dir: bottom; dur: 0.6" href="#b"><span data-fx-part="board"><span>Down · .6s</span></span></a>
</div>
<template data-demo-late><a class="btn" data-fx="board-slide-hover" href="#c"><span data-fx-part="board"><span>Late-arrived Button</span></span></a></template>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => document.getElementById("row").append(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
