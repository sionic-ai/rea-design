<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sprite-points-morph — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { padding: 24px 20px; display: grid; gap: 24px; }
  .stage { height: 70vh; border: 1px solid var(--kf-line); }
  .row { display: flex; gap: 8px; }
  .row button { padding: 6px 12px; }
</style>
</head>
<body>
<p class="demo-hint"><b>sprite-points-morph</b> — On open, scattered dots gather into “50”. Move the mouse and the dots scatter. Use the buttons to gather into a sphere or scatter. <span style="color:var(--kf-dim)">(After 1s one more panel comes in, and one leaves 2.5s later)</span></p>
<section class="demo">
  <div class="row"><button type="button" data-m="0">Character</button><button type="button" data-m="0.8">Group by District</button><button type="button" data-d="2">Scattering</button></div>
  <div class="stage" id="a" data-fx="sprite-points-morph"></div>
  <div class="stage" data-demo-remove data-fx="sprite-points-morph" data-fx-sprite-points-morph="text: erase"></div>
  <template data-demo-late><div class="stage" data-fx="sprite-points-morph" data-fx-sprite-points-morph="text: AB; morph: 1; dur: 2"></div></template>
</section>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="three-global.js"></script>
<script src="../../_vendor/three@0.162.0/build/three.cjs"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
const a = document.getElementById("a");
document.querySelectorAll("[data-m]").forEach((b) => b.addEventListener("click", () => a.fxPoints && gsap.to(a.fxPoints.params, { morph: +b.dataset.m, divergence: +b.dataset.m ? -1 : 0, duration: 1.6, ease: "power2.out" })));
document.querySelector("[data-d]").addEventListener("click", () => a.fxPoints && gsap.to(a.fxPoints.params, { divergence: 2, duration: 1, ease: "power2.inOut", yoyo: true, repeat: 1 }));
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
