<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>curtain-gate — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { padding: 32px 20px; display: grid; gap: 16px; }
  .stage { height: 60vh; border-radius: var(--kf-radius-md); }
  .stage > .wf-img { position: absolute; inset: 0; height: 100%; }
  .stage [data-fx-part="left"], .stage [data-fx-part="right"] { background: var(--kf-contrast-bg); }
  .stage button { padding: 0.75rem 2.5rem; background: var(--kf-contrast-ink); color: var(--kf-accent); border: 0; font: inherit; cursor: pointer; }
</style>
</head>
<body>
<p class="demo-hint"><b>curtain-gate</b> — Press ”Enter”. While the group disappears, the curtain parts to both sides. <span style="color:var(--kf-dim)">(After 1s one more panel comes in, and one leaves 2.5s later)</span></p>
<section class="demo">
  <div class="stage" data-fx="curtain-gate">
    <div class="wf-img" data-label="Hero behind the curtain · symmetrical black-and-white figures · landscape 16:9"></div>
    <div data-fx-part="left"><div class="wf-img" data-label="Red velvet curtain left"></div></div>
    <div data-fx-part="right"><div class="wf-img" data-label="Red velvet curtain, right"></div></div>
    <div data-fx-part="gate"><span>Introducing</span><button type="button" data-fx-part="enter">Enter</button></div>
  </div>
  <div class="stage" data-demo-remove data-fx="curtain-gate">
    <div data-fx-part="left"></div><div data-fx-part="right"></div>
    <div data-fx-part="gate"><button type="button" data-fx-part="enter">Panel to be removed soon</button></div>
  </div>
  <template data-demo-late><div class="stage" data-fx="curtain-gate" data-fx-curtain-gate="dur: 0.6; fade: 0.2; lift: 0.2">
    <div class="wf-img" data-label="Late-arriving panel · opens fast"></div>
    <div data-fx-part="left"></div><div data-fx-part="right"></div>
    <div data-fx-part="gate"><button type="button" data-fx-part="enter">Intro (short)</button></div>
  </div></template>
</section>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/CustomEase.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
