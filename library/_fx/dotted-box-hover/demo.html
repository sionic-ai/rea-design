<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dotted-box-hover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-row { display: flex; gap: 40px; justify-content: center; padding: 60px 20px 20px; font: 400 14px/1 var(--kf-font-mono); letter-spacing: 2px; text-transform: uppercase; }
  .demo-row a { color: inherit; }
  .demo-h { text-align: center; font: italic 400 28px/1.2 var(--kf-font-display); padding: 30px 20px; }
  .demo-h a { color: inherit; }
</style>
</head>
<body>
<p class="demo-hint"><b>dotted-box-hover</b> — Hover over the link or move to it with Tab.</p>
<nav class="demo-row"><a data-fx="dotted-box-hover" href="#a">Company Values</a><a data-fx="dotted-box-hover" href="#b">Jobs</a><a data-fx="dotted-box-hover" href="#c">Newsletter</a></nav>
<p class="demo-h">A quiet headline with <a data-fx="dotted-box-hover" data-fx-dotted-box-hover="look: underline" href="#d">Name</a> and <a data-fx="dotted-box-hover" data-fx-dotted-box-hover="look: underline" href="#e">Item</a>.</p>
<script>
(() => {
  const src = document.querySelector(".demo-row [data-fx~='dotted-box-hover']");
  if (!src) return;
  const row = src.parentElement;
  const make = (tag) => { const a = src.cloneNode(true); a.dataset.demo = tag; a.textContent = tag === "late" ? "Late Link" : "Gone"; return a; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => row?.append(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint")?.append(" · After 1s one more link comes in (a late arrival), and after 2.5s one drops out.");
})();
</script>
<script src="../fx-core.js"></script>
</body>
</html>
