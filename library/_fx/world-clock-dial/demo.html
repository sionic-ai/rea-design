<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>world-clock-dial — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .row { display: flex; flex-wrap: wrap; gap: 40px; align-items: flex-end; padding: 40px 20px; }
  .city { display: grid; justify-items: center; gap: 8px; font-size: 12px; font-weight: 600; }
  .face { border: 1px solid var(--kf-ink); background: repeating-conic-gradient(from -1deg, var(--kf-ink) 0 2deg, transparent 2deg 30deg) center / 100% 100%; }
  .face::before { content: ""; position: absolute; inset: 6%; border-radius: 50%; background: var(--kf-bg); }
  .cal { font-size: 28px; font-weight: 600; }
</style>
</head>
<body>
<p class="demo-hint"><b>world-clock-dial</b> — The hands turn per city by time zone (base UTC+9). The first panel also fills in the date and weekday slots.</p>
<div class="row">
  <div class="city"><div data-fx="world-clock-dial" class="face" style="width:160px; font-size:14px"><span data-fx-part="ampm"></span><span data-fx-part="hour"></span><span data-fx-part="min"></span><span data-fx-part="sec"></span></div><p class="cal"><span data-fx-part="month"></span>/<span data-fx-part="date"></span></p>Base City</div>
  <div class="city"><div data-fx="world-clock-dial" class="face" data-fx-world-clock-dial="lag: -9" style="width:60px"><span data-fx-part="ampm"></span><span data-fx-part="hour"></span><span data-fx-part="min"></span></div>City 1 (−9)</div>
  <div class="city"><div data-fx="world-clock-dial" class="face" data-fx-world-clock-dial="lag: -16" style="width:60px"><span data-fx-part="ampm"></span><span data-fx-part="hour"></span><span data-fx-part="min"></span></div>City 2 (−16)</div>
  <div class="city"><div data-fx="world-clock-dial" class="face" data-fx-world-clock-dial="lag: 2" style="width:60px"><span data-fx-part="ampm"></span><span data-fx-part="hour"></span><span data-fx-part="min"></span></div>City 3 (+2)</div>
</div>
<script>
// Late arrivals and removals — checks that fx-core attaches to an element added after 1s and detaches from an element removed after 2.5s
(() => {
  const row = document.querySelector(".row");
  const make = (tag, lag) => { const d = document.createElement("div"); d.className = "city"; d.innerHTML = `<div data-fx="world-clock-dial" class="face" data-fx-world-clock-dial="lag: ${lag}" style="width:60px"><span data-fx-part="ampm"></span><span data-fx-part="hour"></span><span data-fx-part="min"></span></div>${tag}`; return d; };
  const gone = make("Clock to be removed soon", 1);
  row.append(gone);
  setTimeout(() => row.append(make("Delayed clock (+5)", 5)), 1000);
  setTimeout(() => gone.remove(), 2500);
})();
</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
