<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sweep-cover-reveal — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .grid { padding: 48px 20px; display: grid; grid-template-columns: repeat(3, 1fr); }
  .cell { aspect-ratio: 16 / 9; box-shadow: 0 0 0 1px var(--kf-line); text-decoration: none; color: inherit; }
  .photo { background: linear-gradient(135deg, var(--kf-dim), var(--kf-ink)); }
  .ink { display: grid; height: 100%; padding: 12px 16px; box-sizing: border-box; }
  .ink p { margin: 0; font-size: 22px; line-height: 1.1; }
  .ink small { justify-self: end; align-self: end; }
</style>
</head>
<body>
<p class="demo-hint"><b>sweep-cover-reveal</b> — Hover over a cell. A diagonal line spins once around, the cover lifts and the photo is revealed.</p>
<section class="grid">
  <a class="cell" href="#" data-fx="sweep-cover-reveal"><span class="photo"></span><div data-fx-part="cover"><div class="ink" data-fx-part="ink"><p>Name<br>Surname</p><small>Creative Director</small></div></div></a>
  <a class="cell" href="#" data-fx="sweep-cover-reveal"><span class="photo"></span><div data-fx-part="cover"><div class="ink" data-fx-part="ink"><p>Name<br>Surname</p><small>Copywriter</small></div></div></a>
  <a class="cell" href="#" data-fx="sweep-cover-reveal" style="--fx-dur: .8s; --fx-line: var(--kf-accent)"><span class="photo"></span><div data-fx-part="cover"><div class="ink" data-fx-part="ink"><p>Fast<br>Accent</p><small>.8s</small></div></div></a>
</section>
<script>
(() => {
  const src = document.querySelector('[data-fx~="sweep-cover-reveal"]');
  const html = src.outerHTML;
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => src.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s one more cell comes in, and after 2.5s one leaves.");
})();
</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
