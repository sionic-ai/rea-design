<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>icon-spin-hover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .row { display: flex; gap: 24px; align-items: center; justify-content: center; padding: 80px 20px; flex-wrap: wrap; }
  .pill { display: inline-flex; align-items: center; gap: 10px; height: 44px; padding: 0 22px; border-radius: 2em; background: var(--kf-ink); color: var(--kf-bg); font-weight: 700; font-size: 12px; text-decoration: none; }
  .pill svg { width: 16px; height: 16px; display: block; fill: currentColor; }
  .round { display: grid; place-items: center; width: 140px; height: 140px; border-radius: 50%; background: var(--kf-accent); color: var(--kf-on-accent); font-weight: 700; text-decoration: none; }
</style>
</head>
<body>
<p class="demo-hint"><b>icon-spin-hover</b> — Hover over the button. The icon (the whole circle on the right) spins once.</p>
<div class="row">
  <a class="pill" href="#" data-fx="icon-spin-hover"><span data-fx-part="icon"><svg viewBox="0 0 16 16"><path d="M2 3h12v10H2z M2 3l6 5 6-5" fill="none" stroke="currentColor" stroke-width="1.6"/></svg></span>Contact Us</a>
  <a class="round" href="#" data-fx="icon-spin-hover">PAGE TOP</a>
</div>
<script>
(() => {
  const src = document.querySelector('[data-fx~="icon-spin-hover"]');
  if (!src || !src.parentNode) return;
  const host = src.parentNode;
  const gone = src.cloneNode(true);
  src.after(gone);
  setTimeout(() => host.append(src.cloneNode(true)), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s one more button comes in, and after 2.5s one drops out.");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
