<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>wave-morph-scrub — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">

<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.6 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { padding: 80vh 0 0; }
  .w { color: var(--kf-accent); } .w svg { display: block; width: 100%; height: 160px; fill: currentColor; }
  .band { height: 80vh; background: var(--kf-accent); }
</style>
</head>
<body>
<p class="demo-hint"><b>wave-morph-scrub</b> — Scroll down and the green-edged wave slowly sways into a different shape. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<section class="demo">
  <div class="w" data-fx="wave-morph-scrub"><svg viewBox="0 0 1440 160" preserveAspectRatio="none"><path data-fx-part="path" d="M0 120C240 40 480 10 720 40S1200 140 1440 70V161H0Z" data-to="M0 60C260 130 500 150 760 110S1220 10 1440 50V161H0Z"/></svg></div><div class="band"></div>
  <div class="w" data-fx="wave-morph-scrub" data-fx-wave-morph-scrub="lerp: 1" data-demo-remove><svg viewBox="0 0 1440 160" preserveAspectRatio="none"><path data-fx-part="path" d="M0 120C240 40 480 10 720 40S1200 140 1440 70V161H0Z" data-to="M0 60C260 130 500 150 760 110S1220 10 1440 50V161H0Z"/></svg></div><div class="band"></div>
  <template data-demo-late><div class="w" data-fx="wave-morph-scrub" data-fx-wave-morph-scrub="from: half"><svg viewBox="0 0 1440 160" preserveAspectRatio="none"><path data-fx-part="path" d="M0 120C240 40 480 10 720 40S1200 140 1440 70V161H0Z" data-to="M0 60C260 130 500 150 760 110S1220 10 1440 50V161H0Z"/></svg></div><div class="band"></div></template>
</section>

<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../../../_shared/vendor/gsap/MorphSVGPlugin.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
