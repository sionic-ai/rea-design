<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>blob-field — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .bf { display: grid; place-items: center; min-height: 70vh; margin: 20px; font: 700 48px/1 var(--kf-font-sans); }
  .bf.is-soft { background: var(--kf-surface); }
</style>
</head>
<body>
<p class="demo-hint"><b>blob-field</b> — Bubbles scatter from the center and drift around. Move the mouse over a cell to push them with the cursor bubble. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<section class="bf" data-fx="blob-field" data-fx-blob-field="center: 1"><span>Highlight Bubble</span></section>
<section class="bf is-soft" data-demo-remove data-fx="blob-field" data-fx-blob-field="look: soft; scale: .8; cursor: 60; opacity: 1"><span>Soft drop</span></section>
<template data-demo-late><section class="bf is-soft" data-fx="blob-field" data-fx-blob-field="look: soft; scale: .7; cursor: 50; opacity: 1"><span>Late-arriving cell</span></section></template>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="three-global.js"></script>
<script src="../../_vendor/three@0.182.0/build/three.cjs"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
