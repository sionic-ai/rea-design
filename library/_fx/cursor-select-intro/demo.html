<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cursor-select-intro — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .stage { position: relative; height: 70vh; display: grid; place-items: center; border-bottom: 1px solid var(--kf-line); }
  .stage h1 { font: var(--kf-weight-display) clamp(48px, 9vw, 140px)/.9 var(--kf-font-display); text-transform: uppercase; padding: .04em .04em 0; }
  .row { display: flex; gap: 12px; padding: 20px; }
  .row a { text-decoration: underline; }
</style>
</head>
<body>
<p class="demo-hint"><b>cursor-select-intro</b> — On open the cursor wraps the title in a selection box. Use the buttons below to hand the cursor to the mail link and take it back. <span style="color:var(--kf-dim)">(After 1s one more panel comes in, and one leaves 2.5s later)</span></p>
<section class="stage" id="one" data-fx="cursor-select-intro" data-fx-cursor-select-intro="label: Name; delay: .3">
  <div data-fx-part="target"><h1>Studio Name</h1></div>
  <div class="row"><a id="mail" href="#">hello@example.com</a><button type="button" id="give">Cursor Paging</button><button type="button" id="back">Getting it back</button></div>
</section>
<section class="stage" data-demo-remove data-fx="cursor-select-intro" data-fx-cursor-select-intro="label: Removed">
  <div data-fx-part="target"><h1>Remove Me</h1></div>
</section>
<template data-demo-late><section class="stage" data-fx="cursor-select-intro" data-fx-cursor-select-intro="label: Late; delay: 0"><div data-fx-part="target"><h1>Late Title</h1></div></section></template>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
document.getElementById("give").addEventListener("click", () => document.getElementById("one").dispatchEvent(new CustomEvent("fx:point", { detail: { el: document.getElementById("mail"), label: "You" } })));
document.getElementById("back").addEventListener("click", () => document.getElementById("one").dispatchEvent(new CustomEvent("fx:release")));
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
