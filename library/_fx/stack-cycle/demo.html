<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>stack-cycle — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 2; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .row { display: flex; gap: 80px; justify-content: center; padding: 80px 20px 120px; }
  .deck { width: 280px; }
  .deck .wf-img { aspect-ratio: 3 / 4; border-radius: 40px; }
</style>
</head>
<body>
<p class="demo-hint"><b>stack-cycle</b> — Just watch. Every 3.5s the front photo steps back and the next one comes forward. <span style="color:var(--kf-dim)">(After 1s one more pile comes in, and after 2.5s one drops out)</span></p>
<div class="row" id="row">
  <div class="deck" data-fx="stack-cycle"><div class="wf-img" data-fx-part="card" data-label="Photo 1"></div><div class="wf-img" data-fx-part="card" data-label="Photo 2"></div><div class="wf-img" data-fx-part="card" data-label="Photo 3"></div></div>
  <div class="deck" data-fx="stack-cycle" data-fx-stack-cycle="hold: 1; tilt: -4" data-demo-remove><div class="wf-img" data-fx-part="card" data-label="A"></div><div class="wf-img" data-fx-part="card" data-label="B"></div></div>
  <div class="deck" data-fx="stack-cycle"><div class="wf-img" data-fx-part="card" data-label="Just one sheet"></div></div>
</div>
<template data-demo-late><div class="deck" data-fx="stack-cycle" data-fx-stack-cycle="dur: .6; hold: 1.5"><div class="wf-img" data-fx-part="card" data-label="Late 1"></div><div class="wf-img" data-fx-part="card" data-label="Late 2"></div><div class="wf-img" data-fx-part="card" data-label="Late 3"></div><div class="wf-img" data-fx-part="card" data-label="Late 4"></div></div></template>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => document.getElementById("row").append(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
