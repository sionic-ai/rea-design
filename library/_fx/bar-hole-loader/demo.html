<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bar-hole-loader — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .page { min-height: 120vh; display: grid; place-items: center; background: var(--kf-surface); font: var(--kf-weight-display) 64px/1 var(--kf-font-display); }
  .logo { width: 96px; height: 40px; border: 2px solid currentColor; border-radius: var(--kf-radius-md); display: grid; place-items: center; font-size: 14px; }
  .again { position: fixed; right: 20px; bottom: 20px; z-index: 2000; padding: 8px 14px; border: 1px solid var(--kf-line); border-radius: var(--kf-radius-pill); background: var(--kf-surface); }
</style>
</head>
<body>
<p class="demo-hint"><b>bar-hole-loader</b> — Reload. The bar fills and the logo drops out, then a round hole opens from the bottom center. The bottom right button replays it. <span style="color:var(--kf-dim)">(After 1s one more layer comes in, and one leaves 2.5s later)</span></p>
<div class="page">Your Hero here</div>
<div data-fx="bar-hole-loader" aria-hidden="true"><div data-fx-part="inner"><span class="logo">LOGO</span><div data-fx-part="track"><i data-fx-part="bar"></i></div></div></div>
<div data-demo-remove data-fx="bar-hole-loader" data-fx-bar-hole-loader="lock: off; at: 50% 0%" aria-hidden="true"><div data-fx-part="inner"><span class="logo">Omission</span></div></div>
<div data-late-slot></div>
<template data-demo-late><div data-fx="bar-hole-loader" data-fx-bar-hole-loader="dur: .6; hole: .8" aria-hidden="true"><div data-fx-part="inner"><span class="logo">Late</span><div data-fx-part="track"><i data-fx-part="bar"></i></div></div></div></template>
<button class="again" type="button">Play again</button>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
document.addEventListener("fx:open", () => document.querySelector(".page").animate([{ transform: "translateY(40px)", opacity: 0 }, { transform: "none", opacity: 1 }], { duration: 1200, easing: "cubic-bezier(.215,.61,.355,1)" }));
setTimeout(() => { document.querySelectorAll("template[data-demo-late]").forEach((t) => document.querySelector("[data-late-slot]").replaceWith(t.content.cloneNode(true))); }, 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); }, 2500);
document.querySelector(".again").addEventListener("click", () => {
  const old = document.querySelector('[data-fx="bar-hole-loader"]');
  const fresh = old.cloneNode(true);
  fresh.hidden = false; fresh.removeAttribute("style");
  fresh.querySelectorAll("[style]").forEach((n) => n.removeAttribute("style"));
  old.replaceWith(fresh);
});
</script>
</body>
</html>
