<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>circle-mask-reveal — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.6 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { display: grid; gap: 40px; justify-items: center; padding: 70vh 20px; }
  .face { width: min(360px, 70vw); aspect-ratio: 1; background: linear-gradient(135deg, var(--kf-accent), var(--kf-accent-soft)); }
  .face.is-small { width: 140px; margin-top: -80px; margin-left: 260px; }
</style>
</head>
<body>
<p class="demo-hint"><b>circle-mask-reveal</b> Scroll down. The photo unfolds circularly from the center, and the small photo follows .1s later. <span style="color:var(--kf-dim)">(After 1s one more panel comes in, and one leaves 2.5s later)</span></p>
<main class="demo">
  <span class="face" data-fx="circle-mask-reveal"></span>
  <span class="face is-small" data-fx="circle-mask-reveal" data-fx-circle-mask-reveal="delay: .1"></span>
  <span class="face" data-fx="circle-mask-reveal" data-fx-circle-mask-reveal="loop: on" data-demo-remove></span>
</main>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => { const d = document.createElement("span"); d.className = "face"; d.dataset.fx = "circle-mask-reveal"; d.dataset.fxCircleMaskReveal = "loop: on"; document.querySelector(".demo")?.append(d); }, 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); }, 2500);
</script>
</body>
</html>
