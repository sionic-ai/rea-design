<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>row-fade-in — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 500 15px/1.6 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 10; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .gap { height: 70vh; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 80px 40px; max-width: 900px; margin: 0 auto 80px; }
  .grid > div { aspect-ratio: 106 / 155; background: var(--kf-raised); display: grid; place-items: center; color: var(--kf-dim); }
</style>
</head>
<body>
<p class="demo-hint"><b>row-fade-in</b> — Scroll down. Markers in the same row fade in lightly from the left at .09s intervals. <span style="color:var(--kf-dim)">(After 1s one more line comes in, and one leaves 2.5s later)</span></p>
<div class="gap"></div>
<div class="grid">
  <div data-fx="row-fade-in">Cover 1</div><div data-fx="row-fade-in">Cover 2</div><div data-fx="row-fade-in">Cover 3</div><div data-fx="row-fade-in">Cover 4</div>
  <div data-fx="row-fade-in">Cover 5</div><div data-fx="row-fade-in">Cover 6</div><div data-fx="row-fade-in" data-demo-remove>Cover to drop</div><div data-fx="row-fade-in">Cover 8</div>
</div>
<template data-demo-late><div class="grid"><div data-fx="row-fade-in" data-fx-row-fade-in="dur: 1">Late arrival 1</div><div data-fx="row-fade-in">Late arrival 2</div><div data-fx="row-fade-in">Late arrival 3</div></div></template>
<div class="gap"></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); }, 2500);
</script>
</body>
</html>
