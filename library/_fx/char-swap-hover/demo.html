<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>char-swap-hover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 500 13px/1.4 var(--kf-font-sans); }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .bar { display: flex; gap: 16px; margin: 40px; padding: 10px 14px; width: max-content; background: var(--kf-surface); border-radius: var(--kf-radius-sm); text-transform: uppercase; letter-spacing: .04em; }
  .bar a { display: inline-flex; gap: 8px; }
  .bar a span + span { color: var(--kf-dim); }
</style>
</head>
<body>
<p class="demo-hint"><b>char-swap-hover</b> — Hover over the button text. The letters shuffle twice and return. <span style="color:var(--kf-dim)">(After 1s one more button comes in, and after 2.5s one drops out)</span></p>
<nav class="bar">
  <a href="#" data-fx="char-swap-hover"><span data-fx-part="text">All</span><span data-fx-part="text">27</span></a>
  <a href="#" data-fx="char-swap-hover"><span data-fx-part="text">Stories</span><span data-fx-part="text">04</span></a>
  <a href="#" data-fx="char-swap-hover">Terms of service</a>
  <a href="#" data-fx="char-swap-hover" data-demo-remove>Omitted button</a>
</nav>
<template data-demo-late><nav class="bar"><a href="#" data-fx="char-swap-hover" data-fx-char-swap-hover="times: 4; every: 70">Late-arriving button</a></nav></template>
<a data-fx="char-swap-hover"></a>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); }, 2500);
</script>
</body>
</html>
