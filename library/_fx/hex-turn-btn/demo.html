<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hex-turn-btn — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 700 20px/1.6 var(--kf-font-sans); }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .row { display: flex; flex-direction: column; align-items: flex-end; gap: 48px; max-width: 480px; margin: 56px auto; }
  .card { width: 100%; padding: 32px; background: var(--kf-raised); text-align: right; }
</style>
</head>
<body>
<p class="demo-hint"><b>hex-turn-btn</b> — Hover over ”More”. The hexagon plate behind the arrow rotates 45°. <span style="color:var(--kf-dim)">(After 1s one more button comes in, and after 2.5s one drops out)</span></p>
<div class="row">
  <a href="#" data-fx="hex-turn-btn">Your see more link here</a>
  <div class="card"><a href="#" data-fx="hex-turn-btn" style="--fx-hex: var(--kf-line)">See more on white card</a></div>
  <a href="#" data-fx="hex-turn-btn" data-demo-remove>Omitted button</a>
  <template data-demo-late><a href="#" data-fx="hex-turn-btn">Late-arrived Button</a></template>
</div>
<script src="../fx-core.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
