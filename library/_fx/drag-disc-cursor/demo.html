<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>drag-disc-cursor — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { padding: 8vh 40px; display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 32px; }
  .demo a, .demo div { display: block; aspect-ratio: 4 / 3; border-radius: var(--kf-radius-lg); }
</style>
</head>
<body>
<p class="demo-hint"><b>drag-disc-cursor</b> — On windows 1280px or wider, hover over a card. An accent-colored circle grows at the cursor. <span style="color:var(--kf-dim)">(One more card comes in after 1s, and one drops out after 2.5s)</span></p>
<main class="demo" id="box" data-fx="drag-disc-cursor">
  <a class="wf-img" href="#" data-cursor="arrow-up-right" data-label="Work card · ↗"></a>
  <div class="wf-img" data-cursor="drag" data-label="Slide bar · drag"></div>
  <div class="wf-img" data-cursor="play" data-label="Video · Play" data-demo-remove></div>
  <div class="wf-img" data-label="No marker · System cursor"></div>
</main>
<section data-fx="drag-disc-cursor" style="padding:40px">Panel without label</section>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => { const a = document.createElement("a"); a.className = "wf-img"; a.href = "#"; a.dataset.cursor = "arrow-up-right"; a.dataset.label = "Late-arrived card"; document.getElementById("box")?.append(a); }, 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
