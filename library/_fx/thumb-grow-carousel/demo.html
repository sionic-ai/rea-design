<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>thumb-grow-carousel — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { height: 70vh; margin: 20px; }
  .s { display: grid; place-items: end start; padding: 16px; color: var(--kf-on-accent); font: 600 20px/1 var(--kf-font-display); }
  .s1 { background: var(--kf-accent); } .s2 { background: var(--kf-ink); } .s3 { background: var(--kf-dim); }
</style>
</head>
<body>
<p class="demo-hint"><b>thumb-grow-carousel</b> Move the mouse over the panel and a small panel with the next photo follows it. Click and that panel grows to fill the screen. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<section class="demo" data-fx="thumb-grow-carousel"><div class="s s1" data-fx-part="slide">Photo 1</div><div class="s s2" data-fx-part="slide">Photo 2</div><div class="s s3" data-fx-part="slide">Photo 3</div></section>
<section class="demo" data-fx="thumb-grow-carousel" data-demo-remove><div class="s s2" data-fx-part="slide">Being removed soon</div><div class="s s1" data-fx-part="slide">Both</div></section>
<template data-demo-late><section class="demo" data-fx="thumb-grow-carousel" data-fx-thumb-grow-carousel="size: 140; dur: .6"><div class="s s3" data-fx-part="slide">Late panel · 140px · .6s</div><div class="s s1" data-fx-part="slide">Both</div></section></template>
<section class="demo" data-fx="thumb-grow-carousel"></section>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/CustomEase.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
