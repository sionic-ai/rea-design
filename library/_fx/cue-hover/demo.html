<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cue-hover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { padding: 48px 20px; }
  .demo-spacer { height: 90vh; display: grid; place-items: center; color: var(--kf-dim); }

  [data-fx-part="track"] { height: 48px; margin: 30px 0 14px; background: repeating-linear-gradient(90deg, var(--kf-dim) 0 2px, transparent 2px 6px); opacity: .9; }
  .marks { display: flex; } .marks a { flex: 1; padding: 8px; border-left: 1px solid var(--kf-line); font: 500 11px/1 var(--kf-font-mono); }
</style>
</head>
<body>
<p class="demo-hint"><b>cue-hover</b> — Hover over a section name below — a cue line follows on the track above. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<section data-demo-remove class="demo" data-fx="cue-hover"><div data-fx-part="track"></div><div class="marks">
<a href="#" data-fx-part="cue" data-cue="0" data-cue-label="Segment 001">Intro</a><a href="#" data-fx-part="cue" data-cue="0.2" data-cue-label="Segment 009">Segment 1</a><a href="#" data-fx-part="cue" data-cue="0.45" data-cue-label="Segment 019">Segment 2</a><a href="#" data-fx-part="cue" data-cue="0.7" data-cue-label="Segment 029">Segment 3</a></div></section><section class="demo" data-fx="cue-hover"><div data-fx-part="track"></div><div class="marks">
<a href="#" data-fx-part="cue" data-cue="0" data-cue-label="Segment 001">Intro</a><a href="#" data-fx-part="cue" data-cue="0.2" data-cue-label="Segment 009">Segment 1</a><a href="#" data-fx-part="cue" data-cue="0.45" data-cue-label="Segment 019">Segment 2</a><a href="#" data-fx-part="cue" data-cue="0.7" data-cue-label="Segment 029">Segment 3</a></div></section><template data-demo-late><section class="demo" data-fx="cue-hover"><div data-fx-part="track"></div><div class="marks">
<a href="#" data-fx-part="cue" data-cue="0" data-cue-label="Segment 001">Intro</a><a href="#" data-fx-part="cue" data-cue="0.2" data-cue-label="Segment 009">Segment 1</a><a href="#" data-fx-part="cue" data-cue="0.45" data-cue-label="Segment 019">Segment 2</a><a href="#" data-fx-part="cue" data-cue="0.7" data-cue-label="Segment 029">Segment 3</a></div></section></template>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/CustomEase.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); window.ScrollTrigger?.refresh(); }, 2500);
</script>
</body>
</html>
