<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>spring-edge-slideshow — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 14px/1.4 var(--kf-font-sans); overflow-x: hidden; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { display: grid; gap: 64px; max-width: 980px; margin: 0 auto; padding: 40px 20px 120px; }
  .demo figure { display: grid; gap: 12px; color: var(--kf-dim); }
  .demo [data-fx] { padding-bottom: 72px; }
  .demo li { display: grid; align-content: space-between; height: 260px; padding: 20px; border-radius: var(--kf-radius-md); background: var(--kf-surface); color: var(--kf-ink); }
  .demo [data-fx-part="prev"], .demo [data-fx-part="next"] { position: absolute; bottom: 0; display: grid; place-items: center; width: 48px; height: 48px; border: 0; border-radius: 50%; background: var(--kf-raised); color: var(--kf-ink); }
  .demo [data-fx-part="prev"] { left: 0; }
  .demo [data-fx-part="next"] { left: 58px; }
</style>
</head>
<body>
<p class="demo-hint"><b>spring-edge-slideshow</b> — Advances one slot every 5 seconds with a spring. Try the lower-left arrow too — cards leaving the panel fold to .9x and turn transparent. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<div class="demo">
  <figure><div data-fx="spring-edge-slideshow"><ul data-fx-part="track"><li><b>Card 1</b><span>Your words of recommendation in about three lines here.</span></li><li><b>Card 2</b><span>Your words of recommendation in about three lines here.</span></li><li><b>Card 3</b><span>Your words of recommendation in about three lines here.</span></li><li><b>Card 4</b><span>Your words of recommendation in about three lines here.</span></li></ul><button data-fx-part="prev" aria-label="Previous"><svg width="18" height="18" viewBox="0 0 18 18"><path d="M11 4 6 9l5 5" fill="none" stroke="currentColor" stroke-width="1.6"/></svg></button><button data-fx-part="next" aria-label="Next"><svg width="18" height="18" viewBox="0 0 18 18"><path d="m7 4 5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.6"/></svg></button></div><figcaption>Default · two sheets · gap 24 · 5s · 200/40/1</figcaption></figure>
  <figure data-demo-remove><div data-fx="spring-edge-slideshow" data-fx-spring-edge-slideshow="items: 3; gap: 12; interval: 2"><ul data-fx-part="track"><li>Three Sections 1</li><li>Three Sections 2</li><li>Three Sections 3</li><li>Three Sections 4</li><li>Three Sections 5</li></ul></div><figcaption>Three sheets · gap 12 · 2s (out after 2.5s)</figcaption></figure>
  <template data-demo-late><figure><div data-fx="spring-edge-slideshow" data-fx-spring-edge-slideshow="items: 1; gap: 16; interval: 3; scale: .8"><ul data-fx-part="track"><li>Late 1</li><li>Late 2</li><li>Late 3</li></ul></div><figcaption>Late · Single · Outgoing card .8x</figcaption></figure></template>
  <figure><div data-fx="spring-edge-slideshow"><ul data-fx-part="track"><li>Just one sheet (quietly)</li></ul></div><figcaption>Just one sheet</figcaption></figure>
</div>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
