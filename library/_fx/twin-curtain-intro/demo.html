<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>twin-curtain-intro — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .stage { min-height: 80vh; display: grid; place-items: center; font: 600 48px/1 var(--kf-font-display); }
  .box { position: relative; height: 240px; margin: 20px; overflow: hidden; border: 1px solid var(--kf-line); }
  .box [data-fx~="twin-curtain-intro"] { position: absolute; z-index: 1; }
</style>
</head>
<body>
<p class="demo-hint"><b>twin-curtain-intro</b> — Reload the page. A dark curtain passes briefly through the gap as the white curtain lifts and opens. <span style="color:var(--kf-dim)">(After 1s one more box curtain comes in, and after 2.5s one leaves)</span></p>
<div data-fx="twin-curtain-intro" aria-hidden="true"><div data-fx-part="first"></div><div data-fx-part="second"></div></div>
<section class="stage">Page Title</section>
<div class="box" data-demo-box>
  <template data-demo-late>
    <div data-fx="twin-curtain-intro" aria-hidden="true"><div data-fx-part="first"></div><div data-fx-part="second"></div></div>
  </template>
  <p style="padding:20px">Text below the late-entering curtain</p>
</div>
<div class="box"><div data-fx="twin-curtain-intro" data-fx-twin-curtain-intro="delay: 3" data-demo-remove><div data-fx-part="first"></div></div><p style="padding:20px">Box that drops out before the curtain lifts</p></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((x) => x.remove()), 2500);
</script>
</body>
</html>
