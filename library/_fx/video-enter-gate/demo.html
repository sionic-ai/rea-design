<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>video-enter-gate — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.6 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 10; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-page { min-height: 160vh; padding: 40px 20px; }
  .mark { font-size: clamp(32px, 6vw, 80px); font-weight: 200; letter-spacing: .02em; }
</style>
</head>
<body>
<p class="demo-hint"><b>video-enter-gate</b> — Click anywhere on the video door. It lifts in .5s and scrolling is released (the demo uses days: 0, so it shows on every open).</p>
<div class="demo-page">
  <p>Page behind the door — after 1s another empty door slides in (quietly does nothing) and after 2.5s it drops out.</p>
</div>
<div data-fx="video-enter-gate" data-fx-video-enter-gate="days: 0; key: fx-demo-gate">
  <video data-fx-part="video" data-srcs="../../video-gate-resort-stay/media/splash.mp4" data-src-narrow="../../video-gate-resort-stay/media/splash-sp.mp4" muted playsinline></video>
  <p class="mark" data-fx-part="mark">BRAND NAME</p>
  <button data-fx-part="enter" type="button">Enter</button>
</div>
<template data-demo-late><div data-fx="video-enter-gate" data-fx-video-enter-gate="days: 0; lock: false; key: fx-demo-late" data-demo-remove style="display:none"></div></template>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
