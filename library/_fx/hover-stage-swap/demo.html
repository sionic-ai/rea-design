<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hover-stage-swap — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<link rel="stylesheet" href="../cell-scatter-fade/fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .home { display: grid; grid-template-rows: 1fr auto; min-height: 70vh; padding: 24px; }
  .stage { position: relative; display: grid; place-items: center; }
  .stage > * { grid-area: 1 / 1; display: flex; flex-direction: column; align-items: center; gap: 24px; }
  .stage svg { width: 44px; height: 44px; }
  .stage .wf-img { width: min(320px, 70vw); aspect-ratio: 1; }
  nav { display: flex; gap: 35px; justify-content: center; }
  nav a { font-size: 12px; letter-spacing: 1px; text-transform: uppercase; }
  nav a:hover, nav a:focus { font-weight: 500; }
</style>
</head>
<body>
<p class="demo-hint"><b>hover-stage-swap</b> — Hover over a name below (moving focus with Tab works too). The center logo turns off and that name’s panel lights up. <span style="color:var(--kf-dim)">(One more stage comes in after 1s, and one drops out after 2.5s)</span></p>
<section class="home" data-fx="hover-stage-swap">
  <div class="stage">
    <div data-fx-part="base">
      <svg data-fx="cell-scatter-fade" viewBox="0 0 44 44" aria-hidden="true"></svg>
      <p>Your one-line statement here</p>
    </div>
    <div data-fx-part="panel" data-key="a"><div class="wf-img" data-label="Product A rotating video · white background · square"></div></div>
    <div data-fx-part="panel" data-key="b"><div class="wf-img" data-label="Product B rotating video · white background · square"></div></div>
  </div>
  <nav><a href="#" data-fx-part="item" data-key="a">Name A</a><a href="#" data-fx-part="item" data-key="b">Name B</a></nav>
</section>
<section class="home" data-fx="hover-stage-swap" data-demo-remove><div class="stage"><div data-fx-part="panel"><p>Dropped Panel</p></div></div><nav><a href="#" data-fx-part="item">Gone</a></nav></section>
<section class="home" data-fx="hover-stage-swap"><div class="stage"></div><nav></nav></section>
<script>
  document.querySelectorAll('[data-fx~="cell-scatter-fade"]').forEach((s) => (s.innerHTML = Array.from({ length: 9 }, (_, i) => `<rect data-fx-part="cell" x="${(i % 3) * 16}" y="${Math.floor(i / 3) * 16}" width="12" height="12" rx="2" fill="currentColor"/>`).join("")));
</script>
<script src="../fx-core.js"></script>
<script src="../cell-scatter-fade/fx.js"></script>
<script src="fx.js"></script>
<script>
  setTimeout(() => { const s = document.createElement("section"); s.className = "home"; s.dataset.fx = "hover-stage-swap"; s.innerHTML = '<div class="stage"><div data-fx-part="base"><p>Late-arrived Stage</p></div><div data-fx-part="panel"><div class="wf-img" data-label="Late panel"></div></div></div><nav><a href="#" data-fx-part="item">Late</a></nav>'; document.body.append(s); }, 1000);
  setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
