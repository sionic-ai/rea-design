<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kanji-count-loader — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .row { display: flex; gap: 20px; padding: 30px 20px; }
  .box { width: 280px; height: 220px; display: grid; place-items: center; border: 1px solid var(--kf-line); border-radius: var(--kf-radius-md); background: var(--kf-surface); }
  .chara { width: 24px; height: 40px; border-radius: 12px; background: var(--kf-accent); }
  button { padding: 10px 18px; border: 1px solid var(--kf-line); border-radius: var(--kf-radius-pill); background: var(--kf-surface); }
</style>
</head>
<body>
<p class="demo-hint"><b>kanji-count-loader</b> — The left one runs to 99 after 1.5 seconds of opening, then lifts. The middle one only ends when you press ”Loaded”. <span style="color:var(--kf-dim)">(One more box comes in after 1s, and one drops out after 2.5s)</span></p>
<div class="row">
  <div class="box" data-fx="kanji-count-loader"><div><p data-fx-part="num">〇</p><div class="chara" data-fx-part="chara"></div></div></div>
  <div class="box" data-fx="kanji-count-loader" data-fx-kanji-count-loader="on: event; first: 6" style="--fx-size: 64px"><p data-fx-part="num">〇</p></div>
  <div class="box" data-fx="kanji-count-loader" data-fx-kanji-count-loader="auto: 4" data-demo-remove><p data-fx-part="num">〇</p></div>
  <template data-demo-late><div class="box" data-fx="kanji-count-loader" data-fx-kanji-count-loader="auto: 2; dur: 1" style="--fx-size: 48px"><p data-fx-part="num">〇</p></div></template>
  <div class="box" data-fx="kanji-count-loader"></div>
</div>
<div class="row"><button type="button" onclick="document.dispatchEvent(new Event('fx:loaded'))">All Loaded</button></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
