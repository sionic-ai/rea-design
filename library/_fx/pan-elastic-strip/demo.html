<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pan-elastic-strip — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .strip { padding: 60px 0; }
  .card { width: 300px; aspect-ratio: 1; border-radius: var(--kf-radius-sm); background: var(--kf-surface); border: 1px solid var(--kf-line); display: grid; place-items: center; font: 600 22px/1 var(--kf-font-mono); color: var(--kf-dim); }
</style>
</head>
<body>
<p class="demo-hint"><b>pan-elastic-strip</b> — Move the mouse left and right over the card strip. The strip is pushed along and the cards follow with a wobble.</p>
<div class="strip" data-fx="pan-elastic-strip"><div data-fx-part="row">
  <div class="card" data-fx-part="card">1</div><div class="card" data-fx-part="card">2</div><div class="card" data-fx-part="card">3</div><div class="card" data-fx-part="card">4</div>
  <div class="card" data-fx-part="card">5</div><div class="card" data-fx-part="card">6</div><div class="card" data-fx-part="card">7</div><div class="card" data-fx-part="card">8</div>
</div></div>
<div class="strip" data-demo-remove data-fx="pan-elastic-strip"><div data-fx-part="row"><div class="card" data-fx-part="card">A</div></div></div>
<template data-demo-late><div class="strip" data-fx="pan-elastic-strip" data-fx-pan-elastic-strip="dur: .8"><div data-fx-part="row"><div class="card" data-fx-part="card">Go</div><div class="card" data-fx-part="card">Me</div><div class="card" data-fx-part="card">All</div><div class="card" data-fx-part="card">Ra</div><div class="card" data-fx-part="card">Ma</div><div class="card" data-fx-part="card">Bar</div></div></div></template>
<div class="strip" data-fx="pan-elastic-strip"></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
