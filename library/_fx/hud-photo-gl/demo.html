<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hud-photo-gl — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); padding: 24px; }
  .demo-hint { margin: 0 0 24px; font: 500 13px/1.4 var(--kf-font-mono); }
  .row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-bottom: 12px; }
  figure { margin: 0; aspect-ratio: 16 / 9; }
  .tall { height: 120vh; }
</style>
</head>
<body>
<p class="demo-hint"><b>hud-photo-gl</b> — Hover and move over the photo (RGB split · band glitch · cursor trail cells). Scroll down and the panel is cleared in steps to reveal the page. <span style="color:var(--kf-dim)">(After 1s one more panel comes in, and one leaves 2.5s later)</span></p>
<div class="row">
  <figure data-fx="hud-photo-gl" data-label="Giant machine in the desert · backlit · landscape 16:9"></figure>
  <figure data-fx="hud-photo-gl" data-fx-hud-photo-gl="grain: .2; shift: .02; trail: 2" data-label="Strong grain · large cracks" data-demo-remove></figure>
</div>
<div class="tall"></div>
<div class="row" data-demo-late-host>
  <figure data-fx="hud-photo-gl" data-fx-hud-photo-gl="reveal: on" data-label="Revealed as it lifts away · 12 steps .75s"></figure>
</div>
<div data-fx="hud-photo-gl"></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="three-global.js"></script>
<script src="../../_vendor/three@0.179.0/build/three.cjs"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => { const f = document.createElement("figure"); f.dataset.fx = "hud-photo-gl"; f.dataset.fxHudPhotoGl = "reveal: on; zoom: 1.2"; f.dataset.label = "Late panel"; document.querySelector("[data-demo-late-host]").appendChild(f); }, 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
