<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cube-roll-field — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .field { display: grid; place-items: center; height: 60vh; border-bottom: 1px solid var(--kf-line); }
  .field--small { height: 240px; }
  .field h2 { padding: 24px 32px; background: var(--kf-surface); font: 700 40px/1 var(--kf-font-display); }
</style>
</head>
<body>
<p class="demo-hint"><b>cube-roll-field</b> — Each color cell rests for its own time, then rolls over one cell at a time. Watch it. <span style="color:var(--kf-dim)">(After 1s one more panel comes in, and one leaves 2.5s later)</span></p>
<section class="field" data-fx="cube-roll-field"><h2 data-fx-part="avoid">Your title here</h2></section>
<section class="field field--small" data-demo-remove data-fx="cube-roll-field" data-fx-cube-roll-field="count: 30; cell: 24"><p>Panel to be removed soon</p></section>
<template data-demo-late><section class="field field--small" data-fx="cube-roll-field" data-fx-cube-roll-field="count: 60; roll: 6; wait-max: 40" style="--fx-c2: var(--kf-ink)"><p>Late-entering panel · fast</p></section></template>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
