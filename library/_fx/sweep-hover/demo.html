<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sweep-hover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 500 16px/1.6 var(--kf-font-sans); }
  .demo-hint { padding: 12px 24px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .wrap { padding: 40px; display: grid; gap: 28px; max-width: 640px; }
  .links { display: flex; gap: 24px; }
  .card { display: block; width: 280px; border-radius: var(--kf-radius-md); overflow: hidden; background: var(--kf-surface); }
  .card .wf-img { aspect-ratio: 16 / 10; }
  .row { display: block; border-top: 1px solid var(--kf-line); padding-block: 20px; }
</style>
</head>
<body>
<p class="demo-hint"><b>sweep-hover</b> — Hover over a link, card or row and then release. The underline enters from the left and exits to the right.</p>
<div class="wrap">
  <div class="links"><a href="#" data-fx="sweep-hover">Menu First</a><a href="#" data-fx="sweep-hover">Menu Two</a><a href="#" data-fx="sweep-hover" data-demo-remove>Menu three (detaches after 2.5s)</a></div>
  <a href="#" class="card" data-fx="sweep-hover" data-fx-sweep-hover="look: zoom"><div class="wf-img" data-fx-part="zoom" data-label="Post photo"></div></a>
  <a href="#" class="row" data-fx="sweep-hover" data-fx-sweep-hover="look: pad">List row — inner padding shrinks then returns</a>
  <template data-demo-late><a href="#" data-fx="sweep-hover">Link that came in after 1s</a></template>
  <span data-fx="sweep-hover"></span>
</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/CustomEase.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
