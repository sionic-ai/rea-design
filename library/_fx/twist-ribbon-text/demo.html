<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>twist-ribbon-text — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 24px; padding: 32px 20px; }
  .demo > * { margin: 0; background: var(--kf-surface); }
</style>
</head>
<body>
<p class="demo-hint"><b>twist-ribbon-text</b> — Just watch. The text band spins around twisted like a ribbon. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<section class="demo">
  <p data-fx="twist-ribbon-text" data-demo-remove>TITLE NAME</p>
  <p data-fx="twist-ribbon-text" data-fx-twist-ribbon-text="twist: 5; speed: 1.6; angle: 0" style="color: var(--kf-accent)">Your name here</p>
  <template data-demo-late><p data-fx="twist-ribbon-text" data-fx-twist-ribbon-text="speed: 0">STILL</p></template>
</section>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../sprite-points-morph/three-global.js"></script>
<script src="../../_vendor/three@0.162.0/build/three.cjs"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
