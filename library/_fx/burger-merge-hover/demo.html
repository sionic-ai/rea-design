<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>burger-merge-hover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo-spacer { height: 90vh; display: grid; place-items: center; color: var(--kf-dim); }
  main { padding: 40px; }
  .bm { display: inline-flex; flex-direction: column; align-items: center; gap: 12px; width: 72px; margin: 40px; padding: 0; border: 0; background: none; color: var(--kf-ink); font: 500 16px/1 var(--kf-font-sans); cursor: pointer; }
  .bm i { display: block; width: 72px; height: 4px; border-top: 1px solid currentColor; box-sizing: border-box; }
  .bm .ls { display: flex; flex-direction: column; gap: 8px; }
</style>
</head>
<body>
<p class="demo-hint"><b>burger-merge-hover</b> — Hover over the menu button and the top and bottom lines gather into one line while the bottom line disappears. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<button class="bm" type="button" data-demo-remove data-fx="burger-merge-hover"><span class="ls"><i data-fx-part="top"></i><i data-fx-part="bottom"></i></span>Menu</button>
<button class="bm" type="button" data-fx="burger-merge-hover"><span class="ls"><i data-fx-part="top"></i><i data-fx-part="bottom"></i></span>Menu</button>
<template data-demo-late><button class="bm" type="button" data-fx="burger-merge-hover"><span class="ls"><i data-fx-part="top"></i><i data-fx-part="bottom"></i></span>Menu</button></template>
<div class="demo-spacer"></div>

<script src="../fx-core.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); window.ScrollTrigger?.refresh(); }, 2500);
</script>
</body>
</html>
