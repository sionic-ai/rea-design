<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>trail-stop-draw — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 50; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-spacer { height: 80vh; display: grid; place-items: center; color: var(--kf-dim); }
  .trail { width: min(900px, 90vw); margin: 0 auto; padding-bottom: 30vh; }
  .card { padding: 18px 22px; border-radius: var(--kf-radius-lg); background: var(--kf-surface); box-shadow: var(--kf-shadow-lift); scale: 0; transition: scale .5s cubic-bezier(.17,.67,.3,1.33); }
  .is-in > .card { scale: 1; }
  .boom { position: absolute; left: 50%; top: 92%; translate: -50%; width: 160px; height: 120px; border-radius: 50% 50% 0 0; background: var(--kf-ink); }
  .is-blown .boom { background: var(--kf-accent); }
</style>
</head>
<body>
<p class="demo-hint"><b>trail-stop-draw</b> — Scroll down. As the path is drawn, cards pop out, and when it reaches the end the closing graphic changes to the accent color. <span style="color:var(--kf-dim)">(One more card comes in after 1s, and one drops out after 2.5s)</span></p>
<div class="demo-spacer">Downward</div>
<div class="trail" data-fx="trail-stop-draw">
  <svg viewBox="0 0 1000 2000" aria-hidden="true"><path data-fx-part="path" pathLength="1" stroke-width="160" d="M520 100 C 300 160 20 320 180 500 C 380 720 880 520 920 820 C 960 1100 720 1120 320 1300 C -120 1500 640 1900 520 1900"/></svg>
  <div data-fx-part="stop" data-at=".18"><div class="card">Stop 1</div></div>
  <div data-fx-part="stop" data-at=".38" data-demo-remove><div class="card">Being removed soon</div></div>
  <div data-fx-part="stop" data-at=".62"><div class="card">Stop 3</div></div>
  <div data-fx-part="end" class="boom"></div>
</div>
<div class="demo-spacer"></div>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => { const t = document.querySelector(".trail"), s = document.createElement("div"); s.dataset.fxPart = "stop"; s.dataset.at = ".85"; s.innerHTML = '<div class="card">Late-arriving station</div>'; t.append(s); t.dataset.fx = ""; requestAnimationFrame(() => (t.dataset.fx = "trail-stop-draw")); }, 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
