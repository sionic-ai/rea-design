<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fog-mask-slides — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .stage { height: 70vh; margin: 20px; }
  .stage .wf-img { height: 100%; }
  .small { width: 320px; height: 200px; margin: 20px; }
  .small .wf-img { height: 100%; }
</style>
</head>
<body>
<p class="demo-hint"><b>fog-mask-slides</b> — Every 3 seconds the front photo clears away like lifting fog and the next photo settles in. <span style="color:var(--kf-dim)">(After 1s one more small panel comes in, and one leaves 2.5s later)</span></p>
<div class="stage" data-fx="fog-mask-slides">
  <div data-fx-part="slide"><div class="wf-img" data-label="Photo 1 · riverside village · wide landscape"></div></div>
  <div data-fx-part="slide"><div class="wf-img" data-label="Photo 2 · Misty lake · Wide landscape"></div></div>
  <div data-fx-part="slide"><div class="wf-img" data-label="Photo 3 · Snow-covered valley · Wide landscape"></div></div>
</div>
<div class="small" data-demo-remove data-fx="fog-mask-slides" data-fx-fog-mask-slides="wait: 1.5; fade: 2">
  <div data-fx-part="slide"><div class="wf-img" data-label="Small panel 1"></div></div>
  <div data-fx-part="slide"><div class="wf-img" data-label="Small panel 2"></div></div>
</div>
<template data-demo-late><div class="small" data-fx="fog-mask-slides" data-fx-fog-mask-slides="wait: 2">
  <div data-fx-part="slide"><div class="wf-img" data-label="Late-arriving panel 1"></div></div>
  <div data-fx-part="slide"><div class="wf-img" data-label="Late-arriving panel 2"></div></div>
</div></template>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
