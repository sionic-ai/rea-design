<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>melt-morph-scroll — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo-spacer { height: 70vh; display: grid; place-items: center; color: var(--kf-dim); }
  .demo-short { --fx-length: 200svh; }
</style>
</head>
<body>
<p class="demo-hint"><b>melt-morph-scroll</b> Scroll down and the panel stays pinned while the photo melts into the next one along the noise grain (colors split mid-change).</p>
<div class="demo-spacer">Top section</div>
<section data-fx="melt-morph-scroll">
  <div class="wf-img" data-fx-part="item" data-label="Photo 01 · exhibition hall wall · landscape 3:2"></div>
  <div class="wf-img" data-fx-part="item" data-label="Photo 02 · visitor seen from behind · landscape 3:2"></div>
  <div class="wf-img" data-fx-part="item" data-label="Photo 03 · Close-up of artwork · Landscape 3:2"></div>
</section>
<div class="demo-spacer">Lower section</div>
<script>
// Late arrivals and removals — checks that fx-core attaches to an element added after 1s and detaches from an element removed after 2.5s
(() => {
  const src = document.querySelector('[data-fx~="melt-morph-scroll"]');
  if (!src) return;
  const make = (tag) => { const el = src.cloneNode(true); el.querySelectorAll('[data-fx-part="stage"]').forEach((s) => s.remove()); el.dataset.demo = tag; el.classList.add("demo-short"); return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => src.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical panel comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="../../_vendor/ogl@1.0.11/ogl.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
