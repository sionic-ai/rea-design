<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ink-trail-cursor — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); min-height: 100vh; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { display: grid; grid-template-columns: 1fr 1fr; min-height: 80vh; }
  .demo > div { display: grid; place-items: center; font: 700 40px/1 var(--kf-font-display); }
  .demo .dark { background: var(--kf-contrast-bg); color: var(--kf-contrast-ink); }
</style>
</head>
<body>
<p class="demo-hint"><b>ink-trail-cursor</b> — Move the mouse fast and slow. Lines look bright on the dark panel.</p>
<main class="demo" data-fx="ink-trail-cursor"><div>Light panel</div><div class="dark">Dark panel</div></main>
<script>
// Detach after 2.5s (does the canvas drop out?), reattach at 4s
(() => { const m = document.querySelector(".demo"); setTimeout(() => m.setAttribute("data-fx", ""), 2500); setTimeout(() => m.setAttribute("data-fx", "ink-trail-cursor"), 4000); })();
</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
