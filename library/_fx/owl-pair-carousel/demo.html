<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>owl-pair-carousel — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="../../_vendor/owl.carousel@2.3.4/owl.carousel.min.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.6 var(--kf-font-sans); overflow-x: hidden; }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { display: grid; gap: 140px; padding: 120px 40px; }
  .card { display: block; width: 420px; height: 240px; padding: 30px; border-radius: 20px; background: var(--kf-surface); box-shadow: var(--kf-shadow-soft); font-weight: 700; }
</style>
</head>
<body>
<p class="demo-hint"><b>owl-pair-carousel</b> — Cards flip two at a time every 5 seconds. Click or drag the numbers at the top right. <span style="color:var(--kf-dim)">(After 1s one more line comes in, and one leaves 2.5s later)</span></p>
<main class="demo">
  <div data-fx="owl-pair-carousel"><a class="card" data-fx-part="item">Card 1</a><a class="card" data-fx-part="item">Card 2</a><a class="card" data-fx-part="item">Card 3</a><a class="card" data-fx-part="item">Card 4</a><a class="card" data-fx-part="item">Card 5</a><a class="card" data-fx-part="item">Card 6</a></div>
  <div data-fx="owl-pair-carousel" data-fx-owl-pair-carousel="every: 3; by: 1; numbers: off" data-demo-remove><a class="card">Exit line 1</a><a class="card">Exit line 2</a><a class="card">Exit line 3</a></div>
  <div data-fx="owl-pair-carousel"></div>
</main>
<script src="../../_vendor/jquery@3.7.1/jquery.min.js"></script>
<script src="../../_vendor/owl.carousel@2.3.4/owl.carousel.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => { const d = document.createElement("div"); d.dataset.fx = "owl-pair-carousel"; d.dataset.fxOwlPairCarousel = "every: 4; numbers: off"; d.innerHTML = '<a class="card">Late 1</a><a class="card">Late 2</a><a class="card">Late 3</a>'; document.querySelector(".demo")?.append(d); }, 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); }, 2500);
</script>
</body>
</html>
