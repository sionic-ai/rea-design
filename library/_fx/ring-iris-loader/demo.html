<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ring-iris-loader — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { display: grid; gap: 20px; max-width: 760px; padding: 48px 20px; }
  .demo h2 { font: var(--kf-weight-display) 56px/1.05 var(--kf-font-display); }
  .box { position: relative; height: 320px; overflow: hidden; border: 1px solid var(--kf-line); }
  .box [data-fx~="ring-iris-loader"] { position: absolute; }
  .demo-btn { justify-self: start; height: 40px; padding: 0 16px; border: 1px solid var(--kf-line); background: var(--kf-surface); color: var(--kf-ink); cursor: pointer; }
</style>
</head>
<body>
<p class="demo-hint"><b>ring-iris-loader</b> — Once the rings fill up, only the status text pulses, and pressing ”Bake done” opens the hole in the center.</p>
<main class="demo">
  <h2>Your title here</h2>
  <p>Your two lines of body text here. When the curtain opens, this board appears.</p>
  <div class="box" id="first"><div data-fx="ring-iris-loader" data-fx-ring-iris-loader="auto: 1.4; hold: wait; status: COMPILING SHADERS"></div></div>
  <button class="demo-btn" type="button" id="finish">Baking done (fx:finish)</button>
  <div class="box" id="second"><div data-fx="ring-iris-loader" data-fx-ring-iris-loader="auto: 2; hold: .6"><p data-fx-part="status">LOADING</p></div></div>
</main>
<script>
(() => {
  document.getElementById("finish").addEventListener("click", () => document.querySelector("#first [data-fx]").dispatchEvent(new CustomEvent("fx:finish")));
  const host = document.getElementById("second");
  const make = () => { const el = document.createElement("div"); el.setAttribute("data-fx", "ring-iris-loader"); el.setAttribute("data-fx-ring-iris-loader", "auto: 1; hold: .4"); return el; };
  const gone = make();
  host.append(gone);
  setTimeout(() => host.append(make()), 1000);
  setTimeout(() => gone.remove(), 600);
  const empty = document.createElement("div");
  empty.setAttribute("data-fx", "ring-iris-loader");
  empty.hidden = true;
  document.body.append(empty);
  document.querySelector(".demo-hint").append(" · After 1s one more curtain enters the lower box (late arrival), and after .6s one drops out (release).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
