<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bounce-thumb-pop — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 2; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .gap { height: 90vh; }
  .row { display: flex; gap: 30px; padding: 40px; }
  .row > li { width: 220px; }
  .thumb { aspect-ratio: 1; border: 1px solid var(--kf-ink); border-radius: 20px; overflow: hidden; }
  .thumb .wf-img { height: 100%; border: 0; }
  .pill { display: inline-flex; margin: 40px; padding: 12px 24px; border: 1px dashed var(--kf-ink); border-radius: 25px; background: var(--kf-accent); color: var(--kf-on-accent); }
</style>
</head>
<body>
<p class="demo-hint"><b>bounce-thumb-pop</b> — Scroll down. Four photos bounce in at .2-second intervals and the pill bounces once. <span style="color:var(--kf-dim)">(After 1s one more line comes in, and one leaves 2.5s later)</span></p>
<div class="gap"></div>
<span class="pill" data-fx="bounce-thumb-pop" data-fx-bounce-thumb-pop="look: label">Label pill</span>
<ul class="row" data-fx="bounce-thumb-pop">
  <li><div class="thumb" data-fx-part="item"><div class="wf-img" data-label="Photo 1"></div></div><p data-fx-part="after">Title 1</p></li>
  <li><div class="thumb" data-fx-part="item"><div class="wf-img" data-label="Photo 2"></div></div><p data-fx-part="after">Title 2</p></li>
  <li><div class="thumb" data-fx-part="item"><div class="wf-img" data-label="Photo 3"></div></div></li>
  <li><div class="thumb" data-fx-part="item"><div class="wf-img" data-label="Photo 4"></div></div></li>
</ul>
<ul class="row" data-fx="bounce-thumb-pop" data-demo-remove><li><div class="thumb" data-fx-part="item"><div class="wf-img" data-label="Omission"></div></div></li></ul>
<div id="late"></div>
<template data-demo-late><ul class="row" data-fx="bounce-thumb-pop" data-fx-bounce-thumb-pop="step: .1"><li><div class="thumb" data-fx-part="item"><div class="wf-img" data-label="Late 1"></div></div></li><li><div class="thumb" data-fx-part="item"><div class="wf-img" data-label="Late 2"></div></div></li></ul></template>
<div class="gap"></div>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
