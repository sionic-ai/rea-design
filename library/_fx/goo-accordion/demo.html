<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>goo-accordion — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .faq { max-width: 640px; margin: 60px auto; padding: 0 20px; }
  .faq button { display: flex; width: 100%; height: 48px; align-items: center; padding: 0 16px; border: 0; background: transparent; color: var(--kf-ink); font: inherit; text-align: left; cursor: pointer; }
  .faq p { padding: 4px 16px 20px; color: var(--kf-dim); }
</style>
</head>
<body>
<p class="demo-hint"><b>goo-accordion</b> — Press a question. The answer panel drops off the bar like sticky syrup.</p>
<div class="faq" data-fx="goo-accordion">
  <div data-fx-part="row"><button type="button" data-fx-part="trigger">Write your first question in one line?</button><div data-fx-part="panel"><p>Add two lines of answer. Keep it short and clear.</p></div></div>
  <div data-fx-part="row"><button type="button" data-fx-part="trigger">Write the second question?</button><div data-fx-part="panel"><p>Add two lines of answer.</p></div></div>
  <div data-fx-part="row"><button type="button" data-fx-part="trigger">Write the third question a bit longer?</button><div data-fx-part="panel"><p>Add a three-line answer. Explain what is and isn’t possible.</p></div></div>
</div>
<script>
(() => {
  const src = document.querySelector('[data-fx~="goo-accordion"]');
  if (!src) return;
  const html = src.outerHTML;
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => src.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical one comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
