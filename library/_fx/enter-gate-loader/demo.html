<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>enter-gate-loader — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { padding: 64px 20px; }
  .demo-title { margin: 0 0 40px; font: 600 72px/1 var(--kf-font-display); letter-spacing: -.03em; }
  .demo-b { min-height: 44px; padding: 0 1.4rem; border-radius: 999px; border: 1px solid var(--kf-line); background: none; color: var(--kf-ink); font: 12px var(--kf-font-mono); letter-spacing: .18em; text-transform: uppercase; cursor: pointer; }
</style>
</head>
<body>
<p class="demo-hint"><b>enter-gate-loader</b> — Numbers and lines rise by the ready amount, then the button floats up. Press the button and the curtain lifts.</p>
<main class="demo"><p>Page body slot behind the curtain.</p><div data-fx="enter-gate-loader"><p data-fx-part="chrome">Preparing the panel</p><div style="align-self: center"><span data-fx-part="counter">000</span><div data-fx-part="line"></div><div data-fx-part="actions"><button class="demo-b" data-fx-part="enter" data-choice="sound">Start with sound</button><button class="demo-b" data-fx-part="enter" data-choice="muted">Start muted</button></div></div><p data-fx-part="chrome">Your one line · 0000 here</p></div></main>
<script>
// Late arrivals and removals — checks that fx-core attaches to an element added after 1s and detaches from an element removed after 2.5s
(() => {
  const src = document.querySelector('[data-fx~="enter-gate-loader"]');
  if (!src) return;
  const html = src.outerHTML.replace(/\sid="[^"]*"/g, "");
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => src.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical one comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/CustomEase.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
