<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tumble-drift-stream — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .stage { height: 70vh; border-bottom: 1px solid var(--kf-line); }
  .stage--small { height: 320px; }
  .stage .wf-img { --wf-fill: color-mix(in oklab, var(--kf-ink) var(--tone, 18%), var(--kf-bg)); }
</style>
</head>
<body>
<p class="demo-hint"><b>tumble-drift-stream</b> — Photos appear one by one and tumble from lower left to upper right. Just watch. <span style="color:var(--kf-dim)">(After 1s one more panel comes in, and one leaves 2.5s later)</span></p>
<section class="stage" data-fx="tumble-drift-stream" data-fx-tumble-drift-stream="drift-min: 6000; drift-max: 12000">
  <div class="wf-img" data-fx-part="photo" data-ratio="0.5625" style="--tone: 22%" data-label="Street scene · Day · Landscape 16:9"></div>
  <div class="wf-img" data-fx-part="photo" data-ratio="1.333" style="--tone: 34%" data-label="Person · Indoors · Portrait 3:4"></div>
  <div class="wf-img" data-fx-part="photo" data-ratio="0.6667" style="--tone: 12%" data-label="Food · from above · landscape 3:2"></div>
  <div class="wf-img" data-fx-part="photo" data-ratio="1" style="--tone: 46%" data-label="Event · Night · Square"></div>
  <a class="wf-img" href="#" data-fx-part="solo" data-ratio="1.29" style="--tone: 8%" data-label="Cover"></a>
</section>
<section class="stage stage--small" data-demo-remove data-fx="tumble-drift-stream">
  <div class="wf-img" data-fx-part="photo" data-ratio="1.5" style="--tone: 28%" data-label="Panel to be removed soon"></div>
</section>
<section class="stage stage--small" data-fx="tumble-drift-stream"><p>Version without photos — nothing is hooked</p></section>
<template data-demo-late><section class="stage stage--small" data-fx="tumble-drift-stream" data-fx-tumble-drift-stream="every-min: 200; every-max: 260; drift-min: 5000; drift-max: 8000; star: 2">
  <div class="wf-img" data-fx-part="photo" data-ratio="0.75" style="--tone: 30%" data-label="Late-arriving version · purple star"></div>
</section></template>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
