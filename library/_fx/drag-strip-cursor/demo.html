<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>drag-strip-cursor — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { display: grid; gap: 48px; padding: 24px 20px; }
  .strip { display: flex; gap: 16px; }
  .card { flex: 0 0 420px; height: 300px; display: grid; place-items: center; background: var(--kf-raised); font: var(--kf-weight-display) 28px/1 var(--kf-font-display); }
  .card a { text-decoration: underline; font-size: 14px; }
</style>
</head>
<body>
<p class="demo-hint"><b>drag-strip-cursor</b> Hover over the card row to show the DRAG pill. Press, drag sideways and release (glide). The pill turns off over links.</p>
<div class="demo">
  <div class="strip" data-fx="drag-strip-cursor">
    <div class="card">01</div><div class="card">02 <a href="#">Link</a></div><div class="card">03</div><div class="card">04</div><div class="card">05</div>
  </div>
  <div class="strip" data-fx="drag-strip-cursor" data-fx-drag-strip-cursor="text: MOVE; decay: .95">
    <div class="card">A</div><div class="card">B</div><div class="card">C</div><div class="card">D</div>
  </div>
</div>
<script>
// Late arrivals and removals — checks that fx-core attaches to an element added after 1s and detaches from an element removed after 2.5s
(() => {
  const demo = document.querySelector(".demo");
  const make = (tag) => { const s = document.createElement("div"); s.className = "strip"; s.dataset.fx = "drag-strip-cursor"; s.dataset.demo = tag; s.innerHTML = '<div class="card">Late 1</div><div class="card">Late 2</div><div class="card">Late 3</div><div class="card">Late 4</div>'; return s; };
  const gone = make("gone");
  demo.append(gone);
  setTimeout(() => demo.append(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s, one more strip comes in (the late one), and after 2.5s one drops out (the removal).");
})();
</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
