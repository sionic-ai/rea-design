<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>split-step-panels — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { margin: 0; background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.6 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-spacer { height: 70vh; display: grid; place-items: center; color: var(--kf-dim); }
  .demo-panel { display: grid; justify-items: center; gap: 16px; text-align: center; }
  .demo-panel h3 { font: 400 40px/1.3 var(--kf-font-display); }
  .demo-thumb { width: 200px; aspect-ratio: 3 / 4; }
  .is-dark { color: var(--kf-contrast-ink); }
</style>
</head>
<body>
<p class="demo-hint"><b>split-step-panels</b> — Scrolling down changes the panel cell by cell, and the big photo folds up to reveal the next panel. <span style="color:var(--kf-dim)">(After 1s one more panel comes in, and one leaves 2.5s later)</span></p>
<div class="demo-spacer">Scroll down</div>
<section data-fx="split-step-panels">
  <div data-fx-part="stage">
    <a data-fx-part="item" class="is-dark" href="#" style="--fx-panel: var(--kf-contrast-bg)"><div data-fx-part="panel"><div class="demo-panel"><p data-fx-part="text">Service</p><div class="demo-thumb" data-fx-part="thumb"><div class="wf-img" data-label="Small photo · Portrait"></div></div><h3>Panel One</h3></div></div><div data-fx-part="media"><div class="wf-img" data-label="One large photo · full portrait"></div></div></a>
    <a data-fx-part="item" href="#" style="--fx-panel: var(--kf-accent-soft)"><div data-fx-part="panel"><div class="demo-panel"><p data-fx-part="text">Service</p><h3>Panel Two</h3></div></div><div data-fx-part="media"><div class="wf-img" data-label="Two large photos · full vertical"></div></div></a>
    <a data-fx-part="item" href="#" style="--fx-panel: var(--kf-raised)" data-demo-remove><div data-fx-part="panel"><div class="demo-panel"><p data-fx-part="text">Service</p><h3>Dropped Panel</h3></div></div><div data-fx-part="media"><div class="wf-img" data-label="Three large photos · full vertical"></div></div></a>
    <a data-fx-part="item" href="#" style="--fx-panel: var(--kf-surface)"><div data-fx-part="panel"><div class="demo-panel"><p data-fx-part="text">Service</p><h3>Panel Four</h3></div></div><div data-fx-part="media"><div class="wf-img" data-label="Four large photos · full vertical"></div></div></a>
  </div>
</section>
<template data-demo-late><section data-fx="split-step-panels"><div data-fx-part="stage"><a data-fx-part="item" href="#" style="--fx-panel: var(--kf-raised)"><div data-fx-part="panel"><h3>Late-arriving panel</h3></div><div data-fx-part="media"><div class="wf-img" data-label="Late-arriving photo"></div></div></a></div></section></template>
<section data-fx="split-step-panels"></section>
<div class="demo-spacer">Footer</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
