<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hover-drop-menu — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .bar { display: flex; justify-content: center; gap: 48px; padding: 24px 20px; border-bottom: 1px solid var(--kf-line); }
  .bar [data-fx-part="trigger"], .bar > a { display: inline-flex; align-items: center; gap: 6px; padding: 8px 0; color: var(--kf-ink); }
  .chev { width: 8px; height: 8px; }
  .demo-spacer { height: 90vh; display: grid; place-items: center; color: var(--kf-dim); }
</style>
</head>
<body>
<p class="demo-hint"><b>hover-drop-menu</b> — Hover over Menu 1 and Menu 3. The panel unfolds and the items line up in turn. After you let go, it folds .12s later.</p>
<nav class="bar">
  <div data-fx="hover-drop-menu"><a data-fx-part="trigger" href="#">Menu 1 <svg class="chev" data-fx-part="chevron" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.4"><path d="m2 3.5 3 3 3-3"/></svg></a><div data-fx-part="pop"><div><div data-fx-part="menu"><a data-fx-part="option" href="#">Item 1</a><a data-fx-part="option" href="#">Item 2</a><a data-fx-part="option" href="#">Item 3</a></div></div></div></div>
  <a href="#">Menu 2</a>
  <div data-fx="hover-drop-menu" data-fx-hover-drop-menu="delay: 0; stagger: 0.08"><a data-fx-part="trigger" href="#">Menu 3 <svg class="chev" data-fx-part="chevron" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.4"><path d="m2 3.5 3 3 3-3"/></svg></a><div data-fx-part="pop"><div><div data-fx-part="menu"><a data-fx-part="option" href="#">Instant fold 1</a><a data-fx-part="option" href="#">Instant fold 2</a></div></div></div></div>
</nav>
<div class="demo-spacer">Blank Paper</div>
<script>
// Late arrivals and removals — checks that fx-core attaches to an element added after 1s and detaches from an element removed after 2.5s
(() => {
  const src = document.querySelector('[data-fx~="hover-drop-menu"]');
  if (!src) return;
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = src.outerHTML; const el = t.content.firstElementChild; el.dataset.demo = tag; el.querySelector('[data-fx-part="trigger"]').firstChild.textContent = tag === "late" ? "Late-arrived Menu " : "Menu to be removed soon "; return el; };
  const bar = document.querySelector(".bar");
  const gone = make("gone");
  bar.append(gone);
  setTimeout(() => bar.append(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1 second one more menu comes in (a late arrival), and after 2.5 seconds one is removed (detach).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
