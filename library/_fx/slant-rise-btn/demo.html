<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>slant-rise-btn — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { margin: 0; padding: 48px; font-family: var(--kf-font-sans); font-size: 18px; background: var(--kf-bg); color: var(--kf-ink); display: grid; gap: 28px; justify-items: start; }
  .row { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
  .dark { padding: 32px; background: var(--kf-contrast-bg); }
</style>
</head>
<body>
  <p class="demo-hint"><b>slant-rise-btn</b> — Hover over the button — a tilted panel rises and the text and arrow change.</p>
  <div class="row">
    <a data-fx="slant-rise-btn" href="#"><span data-fx-part="label">Receive a quote</span><svg data-fx-part="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8h9M8.5 4.5 12 8l-3.5 3.5" fill="none" stroke="currentColor" stroke-width="1.6"/></svg></a>
    <a data-fx="slant-rise-btn" data-fx-slant-rise-btn="look: ghost" href="#"><span data-fx-part="label">Learn more</span></a>
    <button data-fx="slant-rise-btn" type="button"><span data-fx-part="label">Text-only button</span></button>
  </div>
  <template data-demo-late><a data-fx="slant-rise-btn" href="#"><span data-fx-part="label">Button that came in after 1s</span><svg data-fx-part="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8h9M8.5 4.5 12 8l-3.5 3.5" fill="none" stroke="currentColor" stroke-width="1.6"/></svg></a></template>
  <a data-fx="slant-rise-btn" data-demo-remove href="#"><span data-fx-part="label">Button that drops out after 2.5s</span></a>
  <div class="dark"><a data-fx="slant-rise-btn" href="#" style="--fx-bg: var(--kf-contrast-ink); --fx-ink: var(--kf-contrast-bg); --fx-icon-bg: var(--kf-contrast-bg); --fx-icon-ink: var(--kf-contrast-ink)"><span data-fx-part="label">On the dark board</span><svg data-fx-part="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8h9M8.5 4.5 12 8l-3.5 3.5" fill="none" stroke="currentColor" stroke-width="1.6"/></svg></a></div>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
