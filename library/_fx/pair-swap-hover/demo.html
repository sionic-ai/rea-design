<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pair-swap-hover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .stage { position: relative; height: 520px; margin: 32px 20px; background: var(--kf-surface); border-radius: var(--kf-radius-lg); overflow: hidden; }
  .toy { position: absolute; display: block; width: 180px; aspect-ratio: 1; }
  .toy svg { width: 100%; height: 100%; }
  .toy [data-fx-part="main"] rect, .toy [data-fx-part="main"] circle { fill: var(--kf-accent-soft); }
  .toy [data-fx-part="alt"] rect, .toy [data-fx-part="alt"] circle { fill: var(--kf-accent); }
  .names { position: absolute; left: 50%; bottom: 28px; translate: -50% 0; display: flex; gap: 12px; }
  .names a { display: grid; place-items: center; width: 140px; height: 40px; border-radius: var(--kf-radius-pill); background: var(--kf-bg); color: var(--kf-dim); font-weight: 700; }
</style>
</head>
<body>
<p class="demo-hint"><b>pair-swap-hover</b> — Hover a shape or the name pills below. On first open, it lights up in three stages. <span style="color:var(--kf-dim)">(After 1s one more pair comes in, and after 2.5s one panel is removed)</span></p>
<section class="stage" data-fx="pair-swap-hover" data-fx-pair-swap-hover="waves: 100, 700, 1300">
  <a class="toy" href="#" style="left: 6%; top: 8%" data-fx-part="item" data-key="a" data-wave="0">
    <svg data-fx-part="main" viewBox="0 0 100 100"><rect x="20" y="30" width="40" height="40" rx="4"/><rect x="50" y="20" width="30" height="30" rx="4"/></svg>
    <svg data-fx-part="alt" viewBox="0 0 100 100"><rect x="25" y="40" width="40" height="40" rx="4" transform="rotate(-12 45 60)"/><rect x="55" y="15" width="30" height="30" rx="4"/></svg>
  </a>
  <a class="toy" href="#" style="left: 40%; top: 14%" data-fx-part="item" data-key="b" data-wave="1">
    <svg data-fx-part="main" viewBox="0 0 100 100"><circle cx="50" cy="50" r="30"/></svg>
    <svg data-fx-part="alt" viewBox="0 0 100 100"><circle cx="40" cy="55" r="24"/><circle cx="70" cy="40" r="14"/></svg>
  </a>
  <a class="toy" href="#" style="right: 6%; top: 10%" data-fx-part="item" data-key="c" data-wave="2">
    <svg data-fx-part="main" viewBox="0 0 100 100"><rect x="15" y="45" width="70" height="20" rx="10"/></svg>
    <svg data-fx-part="alt" viewBox="0 0 100 100"><rect x="15" y="45" width="70" height="20" rx="10" transform="rotate(20 50 55)"/></svg>
  </a>
  <nav class="names" data-wave="2">
    <a href="#" data-fx-part="label" data-key="a">One product</a>
    <a href="#" data-fx-part="label" data-key="b">Product two</a>
    <a href="#" data-fx-part="label" data-key="c">Product three</a>
  </nav>
</section>
<section class="stage" data-demo-remove data-fx="pair-swap-hover" style="height: 200px">
  <a class="toy" href="#" style="left: 10%; top: 10px" data-fx-part="item" data-key="x"><svg data-fx-part="main" viewBox="0 0 100 100"><circle cx="50" cy="50" r="30"/></svg></a>
  <nav class="names"><a href="#" data-fx-part="label" data-key="x">Second image: none</a></nav>
</section>
<template data-demo-late>
  <section class="stage" data-fx="pair-swap-hover" style="height: 240px">
    <a class="toy" href="#" style="left: 10%; top: 10px" data-fx-part="item" data-key="l">
      <svg data-fx-part="main" viewBox="0 0 100 100"><rect x="20" y="20" width="60" height="60" rx="8"/></svg>
      <svg data-fx-part="alt" viewBox="0 0 100 100"><circle cx="50" cy="50" r="32"/></svg>
    </a>
    <nav class="names"><a href="#" data-fx-part="label" data-key="l">Late-arriving pair</a></nav>
  </section>
</template>
<section class="stage" data-fx="pair-swap-hover" style="height: 80px"></section>

<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
