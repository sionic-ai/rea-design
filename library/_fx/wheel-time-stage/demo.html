<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>wheel-time-stage — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  html, body { height: 100%; overflow: hidden; }
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: fixed; top: 0; left: 0; right: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .scene { display: grid; place-items: center; font: 600 5vw/1 var(--kf-font-display); }
  .scene span { display: block; width: calc(var(--fx-p, 0) * 60vw); height: 4px; margin-top: 20px; background: var(--kf-accent); }
  .now { position: fixed; bottom: 16px; left: 20px; z-index: 100; font: 500 13px/1 var(--kf-font-mono); }
</style>
</head>
<body>
<p class="demo-hint"><b>wheel-time-stage</b> — Left alone, the scene drifts on. Roll the wheel or drag up and down to wind forward and back. <span style="color:var(--kf-dim)">(After 1s one more small stage comes in at the bottom right, after 2.5s one scene drops out)</span></p>
<main data-fx="wheel-time-stage" id="stage">
  <section class="scene" data-fx-part="scene" data-dur="4"><div>First scene<span></span></div></section>
  <section class="scene" data-fx-part="scene" data-dur="3"><div>Second Scene<span></span></div></section>
  <section class="scene" data-fx-part="scene" data-dur="5" data-demo-remove><div>Third Scene<span></span></div></section>
  <i data-fx-part="knob"></i>
</main>
<p class="now" id="now"></p>
<template data-demo-late><main data-fx="wheel-time-stage" style="position:fixed;inset:auto 0 0 auto;width:30vw;height:30vh"><section class="scene" data-fx-part="scene" data-dur="2"><div>Late-added Stage<span></span></div></section><section class="scene" data-fx-part="scene" data-dur="2"><div>Second<span></span></div></section></main></template>
<section data-fx="wheel-time-stage" style="height:0"></section>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
document.getElementById("stage").addEventListener("fx:time", (e) => { document.getElementById("now").textContent = `Scene ${e.detail.index + 1} · ${(e.detail.progress * 100).toFixed(0)}% · Speed ${e.detail.velocity.toFixed(2)}`; });
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
