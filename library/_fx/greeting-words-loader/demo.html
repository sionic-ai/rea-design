<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>greeting-words-loader — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { padding: 48px 20px; display: grid; gap: 16px; }
  .demo h1 { font: var(--kf-weight-display) 48px/1.1 var(--kf-font-display); }
  .word { font: var(--kf-weight-display) 56px/1 var(--kf-font-display); text-transform: uppercase; }
  .demo-again { justify-self: start; }
</style>
</head>
<body>
<div data-fx="greeting-words-loader" data-fx-greeting-words-loader="words: Annyeonghaseyo, Hello, Bonjour, Ciao, Olá, Hallå" id="loader">
  <div data-fx-part="screen">
    <div data-fx-part="bg" class="wf-img" data-label="Wood grain enlarged · dark light · full screen"></div>
    <div data-fx-part="words"><span class="word" data-fx-part="word">Hello</span></div>
  </div>
</div>
<p class="demo-hint"><b>greeting-words-loader</b> — On open, a greeting floats up, changes, then clears. Press ‹Again› to restart. <span style="color:var(--kf-dim)">(After 1s one more empty loader comes in, and after 2.5s one leaves)</span></p>
<section class="demo">
  <h1>Your page title here</h1>
  <p>Your two-line body here. You will see this text once the loader lifts.</p>
  <button class="wf-btn demo-again" type="button">Again</button>
  <div data-demo-remove data-fx="greeting-words-loader" style="display:none"></div>
  <template data-demo-late><div data-fx="greeting-words-loader" data-fx-greeting-words-loader="count: 0; in: 0; out: 0; fade: 0"></div></template>
</section>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
document.querySelector(".demo-again").addEventListener("click", () => {
  const l = document.getElementById("loader"), n = l.cloneNode(true);
  n.removeAttribute("style"); n.querySelector('[data-fx-part="words"]').removeAttribute("style");
  l.replaceWith(n);
});
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
