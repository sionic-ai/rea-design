<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>stamp-photo-trail — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .hero { height: 70vh; overflow: hidden; display: grid; place-items: center; border-bottom: 1px solid var(--kf-line); }
  .hero h1 { position: relative; z-index: 2; font: 700 64px/1 var(--kf-font-display); pointer-events: none; }
  .hero .wf-img { width: 100%; height: 100%; }
</style>
</head>
<body>
<p class="demo-hint"><b>stamp-photo-trail</b> — Move the mouse over the panel — a photo is stamped at the cursor every .2s, and the oldest ones disappear first.</p>
<section class="hero" data-fx="stamp-photo-trail">
  <h1>Your big title here</h1>
  <div data-fx-part="item"><div class="wf-img" data-label="Photo 1 · Portrait"></div></div>
  <div data-fx-part="item"><div class="wf-img" data-label="Photo 2 · Portrait"></div></div>
  <div data-fx-part="item"><div class="wf-img" data-label="Photo 3 · Portrait"></div></div>
  <div data-fx-part="item"><div class="wf-img" data-label="Photo 4 · Portrait"></div></div>
  <div data-fx-part="item"><div class="wf-img" data-label="Photo 5 · Portrait"></div></div>
  <div data-fx-part="item"><div class="wf-img" data-label="Photo 6 · Portrait"></div></div>
  <div data-fx-part="item"><div class="wf-img" data-label="Photo 7 · Portrait"></div></div>
  <div data-fx-part="item"><div class="wf-img" data-label="Photo 8 · Portrait"></div></div>
  <div data-fx-part="item"><div class="wf-img" data-label="Photo 9 · Vertical"></div></div>
</section>
<script>
// Late arrivals and removals — checks that fx-core attaches to an element added after 1s and detaches from an element removed after 2.5s
(() => {
  const src = document.querySelector('[data-fx~="stamp-photo-trail"]');
  if (!src) return;
  const html = src.outerHTML;
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => src.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical one comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
