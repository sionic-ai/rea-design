<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>poly-figure-spin — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  :root { --site-sun: color-mix(in oklab, var(--kf-accent) 50%, var(--kf-bg)); }
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { display: flex; flex-wrap: wrap; justify-content: center; gap: 60px; padding: 60px 20px 120vh; background: var(--kf-contrast-bg); }
  .demo [data-fx] { width: 260px; height: 400px; }
</style>
</head>
<body>
<p class="demo-hint"><b>poly-figure-spin</b> — The figure on the left makes one turn as you scroll, and the one on the right turns its body as you move the mouse left and right. Both sway as if breathing.</p>
<section class="demo">
  <div data-fx="poly-figure-spin" data-fx-poly-figure-spin="spin: scroll"></div>
  <div data-fx="poly-figure-spin"></div>
</section>
<script>
(() => {
  const src = document.querySelector('[data-fx~="poly-figure-spin"]');
  if (!src) return;
  const make = (tag) => { const el = document.createElement("div"); el.setAttribute("data-fx", "poly-figure-spin"); el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => src.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1 second one more person comes in (a late arrival), and after 2.5 seconds one is removed (detach).");
})();
</script>
<script src="../../_vendor/three@0.186.0/three.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
