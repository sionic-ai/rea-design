<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>logo-slot-cycle — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 500 13px/1.4 var(--kf-font-sans); }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .logos { display: flex; gap: 40px; margin: 40px; color: var(--kf-dim); }
  .logos [data-fx-part="slot"] { width: 100px; height: 28px; }
</style>
</head>
<body>
<p class="demo-hint"><b>logo-slot-cycle</b> — Just watch. The logo cells float up in turn and each changes separately every 3s. <span style="color:var(--kf-dim)">(After 1s one more line comes in, and one leaves 2.5s later)</span></p>
<div class="logos" data-fx="logo-slot-cycle">
  <span data-fx-part="slot"></span><span data-fx-part="slot"></span><span data-fx-part="slot"></span><span data-fx-part="slot"></span>
  <div data-fx-part="pool">
    <span data-fx-part="logo" class="wf-logo">LOGO 1</span><span data-fx-part="logo" class="wf-logo">LOGO 2</span><span data-fx-part="logo" class="wf-logo">LOGO 3</span>
    <span data-fx-part="logo" class="wf-logo">LOGO 4</span><span data-fx-part="logo" class="wf-logo">LOGO 5</span><span data-fx-part="logo" class="wf-logo">LOGO 6</span>
    <span data-fx-part="logo" class="wf-logo">LOGO 7</span><span data-fx-part="logo" class="wf-logo">LOGO 8</span>
  </div>
</div>
<div class="logos" data-fx="logo-slot-cycle" data-demo-remove><span data-fx-part="slot"></span><div data-fx-part="pool"><span data-fx-part="logo" class="wf-logo">Dropped Line</span></div></div>
<template data-demo-late><div class="logos" data-fx="logo-slot-cycle" data-fx-logo-slot-cycle="cycle: 2; each: .3"><span data-fx-part="slot"></span><span data-fx-part="slot"></span><div data-fx-part="pool"><span data-fx-part="logo" class="wf-logo">LATE 1</span><span data-fx-part="logo" class="wf-logo">LATE 2</span><span data-fx-part="logo" class="wf-logo">LATE 3</span></div></div></template>
<div data-fx="logo-slot-cycle"></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); }, 2500);
</script>
</body>
</html>
