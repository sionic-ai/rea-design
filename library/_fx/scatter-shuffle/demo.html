<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>scatter-shuffle — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .g { height: 70vh; margin: 16px 0; border-block: 1px solid var(--kf-line); }
  .g [data-fx-part="item"] { width: 140px; aspect-ratio: 1; background: var(--kf-raised); display: grid; place-items: center; color: var(--kf-dim); }
  .g [data-fx-part="label"] { font: 500 10px/1 var(--kf-font-sans); text-transform: uppercase; }
</style>
</head>
<body>
<p class="demo-hint"><b>scatter-shuffle</b> — Click an empty spot. Items scatter again and the letters beside the cursor follow late.</p>
<section class="g" data-fx="scatter-shuffle">
  <article data-fx-part="item">Product 1</article><article data-fx-part="item">Product 2</article><article data-fx-part="item">Product 3</article>
  <article data-fx-part="item">Product 4</article><article data-fx-part="item">Product 5</article>
  <p data-fx-part="label">Press to shuffle</p>
</section>
<section class="g" data-fx="scatter-shuffle" data-demo-remove><article data-fx-part="item">Erase</article></section>
<template data-demo-late><section class="g" data-fx="scatter-shuffle" data-fx-scatter-shuffle="delay: 0; each: 0.1"><article data-fx-part="item">Late 1</article><article data-fx-part="item">Late 2</article></section></template>
<section class="g" data-fx="scatter-shuffle"></section>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
