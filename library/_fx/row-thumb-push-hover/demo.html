<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>row-thumb-push-hover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo-list { margin: 40px 0; border-top: 1px solid var(--kf-line); }
  .demo-row { display: flex; align-items: center; min-height: 96px; padding: 15px 0 15px 80px; color: inherit; text-decoration: none; }
  .demo-row .t { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; font-size: 21px; }
  .demo-row .c { flex: 0 0 240px; padding-left: 40px; }
  .demo-row .wf-img { border: 0; }
  .demo-row .wf-img::after { display: none; }
</style>
</head>
<body>
<p class="demo-hint"><b>row-thumb-push-hover</b> — Hover over a list row (or use keyboard Tab).</p>
<div class="demo-list">
  <a class="demo-row" href="#" data-fx="row-thumb-push-hover"><span data-fx-part="thumb"><span class="wf-img" data-label="Thumbnail"></span></span><span class="t"><span data-fx-part="label">Ad ‹Your work title here›</span></span><span class="c">Your advertiser here</span></a>
  <a class="demo-row" href="#" data-fx="row-thumb-push-hover"><span data-fx-part="thumb"><span class="wf-img" data-label="Thumbnail"></span></span><span class="t"><span data-fx-part="label">Music video ‹Song title here›</span></span><span class="c">Your artist here</span></a>
  <a class="demo-row" href="#" data-fx="row-thumb-push-hover" style="--fx-push: 60px; --fx-dur: .4s"><span data-fx-part="thumb"></span><span class="t"><span data-fx-part="label">No thumbnail image · only 60px shifts</span></span><span class="c">Your advertiser here</span></a>
</div>
<script>
// Late arrivals and removals — applies to a row that enters after 1s, and one drops out after 2.5s
(() => {
  const src = document.querySelector('[data-fx~="row-thumb-push-hover"]');
  if (!src) return;
  const html = src.outerHTML;
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => src.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s one more stripe comes in, and after 2.5s one leaves.");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
</body>
</html>
