<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>vegas-blur-slides — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="../../_vendor/vegas@2.6.0/vegas.min.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .hero { height: 70vh; }
  .count { position: absolute; left: 20px; bottom: 20px; z-index: 3; font: 500 14px/1 var(--kf-font-mono); }
  .dots { position: absolute; right: 20px; bottom: 20px; z-index: 3; display: flex; gap: 8px; }
  .dots button { border: 1px solid var(--kf-line); background: var(--kf-surface); color: var(--kf-ink); padding: 2px 8px; }
</style>
</head>
<body>
<p class="demo-hint"><b>vegas-blur-slides</b> — Every 8 seconds it moves on with a blur transition and slowly zooms in. Press the numbers at bottom right to skip. <span style="color:var(--kf-dim)">(After 1s one more panel comes in, and after 2s one drops out)</span></p>
<section class="hero" data-fx="vegas-blur-slides">
  <div data-fx-part="stage"></div>
  <i data-fx-part="slide" data-label="Photo 1 · Drinking glass and plate"></i>
  <i data-fx-part="slide" data-label="Photo 2 · cup on navy cloth"></i>
  <i data-fx-part="slide" data-label="Photo 3 · Toasting hands"></i>
  <p class="count"><span data-fx-part="current">1</span> / <span data-fx-part="total"></span></p>
  <div class="dots"><button data-fx-part="dot">1</button><button data-fx-part="dot">2</button><button data-fx-part="dot">3</button></div>
</section>
<section data-demo-remove class="hero" data-fx="vegas-blur-slides" data-fx-vegas-blur-slides="delay: 3"><div data-fx-part="stage"></div><i data-fx-part="slide" data-label="Panel to be erased soon"></i><i data-fx-part="slide" data-label="Second"></i></section>
<template data-demo-late><section class="hero" data-fx="vegas-blur-slides" data-fx-vegas-blur-slides="delay: 4; timer: none"><div data-fx-part="stage"></div><i data-fx-part="slide" data-label="Late-arriving panel 1"></i><i data-fx-part="slide" data-label="Late-arriving panel 2"></i></section></template>
<section data-fx="vegas-blur-slides"></section>
<script src="../../_vendor/jquery@1.12.4/jquery.min.js"></script>
<script src="../../_vendor/vegas@2.6.0/vegas.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2000);
</script>
</body>
</html>
