<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sketch-portal-gl — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { padding: 24px 20px; display: grid; gap: 20px; }
  .stage { height: 70vh; border-radius: var(--kf-radius-md); }
  .stage.small { height: 32vh; }
  .win { position: absolute; left: 50%; top: 50%; width: min(520px, 56%); aspect-ratio: 1.55 / 1; translate: -50% -50%; }
  .win span { position: absolute; left: 1rem; bottom: 1rem; color: var(--kf-contrast-ink); font-weight: 700; font-size: 1.5rem; mix-blend-mode: difference; }
  .demo button.toggle { justify-self: start; padding: 8px 14px; border: 1px solid var(--kf-line); border-radius: var(--kf-radius-sm); background: var(--kf-surface); }
</style>
</head>
<body>
<p class="demo-hint"><b>sketch-portal-gl</b> — Move the mouse over the board to push objects around. Hover the window to enlarge it, and use the buttons to open (fx:open) and close (fx:close) it. <span style="color:var(--kf-dim)">(1 second later a small panel comes in, and it leaves after 2.5 seconds)</span></p>
<section class="demo">
  <div class="stage" id="main" data-fx="sketch-portal-gl"><button class="win" type="button" data-fx-part="window"><span>Open</span></button></div>
  <button class="toggle" type="button" id="open">fx:open / fx:close</button>
  <div data-demo-remove class="stage small" data-fx="sketch-portal-gl" data-fx-sketch-portal-gl="count: 8"></div>
  <template data-demo-late><div class="stage small" data-fx="sketch-portal-gl" data-fx-sketch-portal-gl="count: 12; scale: 1.2"><button class="win" type="button" data-fx-part="window"></button></div></template>
</section>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="three-global.js"></script>
<script src="../../_vendor/three@0.182.0/build/three.cjs"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
let on = false;
document.getElementById("open").addEventListener("click", () => { on = !on; document.getElementById("main").dispatchEvent(new CustomEvent(on ? "fx:open" : "fx:close")); });
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
