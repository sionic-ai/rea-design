<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>shine-pass-hover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.6 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { display: flex; flex-wrap: wrap; align-items: center; gap: 40px; padding: 60px 20px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; width: 166px; height: 33px; border-radius: var(--kf-radius-sm); background: linear-gradient(90deg, var(--kf-raised), var(--kf-dim)); color: var(--kf-ink); }
  .banner { display: block; width: 420px; aspect-ratio: 2.2; border-radius: var(--kf-radius-md); background: var(--kf-accent); color: var(--kf-on-accent); padding: 24px; }
  .icon { display: inline-grid; place-items: center; width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--kf-ink); }
</style>
</head>
<body>
<p class="demo-hint"><b>shine-pass-hover</b> — Hover over a button, banner or icon. A band of light sweeps across once. <span style="color:var(--kf-dim)">(After 1s one more button comes in, and after 2.5s one drops out)</span></p>
<section class="demo">
  <a class="btn" href="#" data-fx="shine-pass-hover">Google Map</a>
  <a class="banner" href="#" data-fx="shine-pass-hover" data-fx-shine-pass-hover="look: bright" style="--fx-dur: 2.5s; --fx-shine: .25">Your banner here</a>
  <a class="icon" href="#" data-fx="shine-pass-hover" data-fx-shine-pass-hover="look: glow" aria-label="Icon">◎</a>
  <a class="btn" href="#" data-fx="shine-pass-hover" data-demo-remove>Omitted button</a>
  <template data-demo-late><a class="btn" href="#" data-fx="shine-pass-hover">Late-arrived Button</a></template>
</section>

<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
