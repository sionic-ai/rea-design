<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>chrome-logo-fly — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { margin: 0; font-family: var(--kf-font-sans); background: var(--kf-bg); color: var(--kf-ink); }
  section { min-height: 100vh; display: grid; grid-template-columns: 1fr 1fr; align-items: center; padding: 0 6vw; border-bottom: 1px solid var(--kf-line); font-size: 40px; font-weight: 800; }
  .demo-hint { position: fixed; top: 0; left: 0; padding: 16px; font-size: 14px; font-weight: 400; z-index: 9; }
</style>
</head>
<body>
  <p class="demo-hint"><b>chrome-logo-fly</b> — Scroll down — The browser logo flies to a different spot and size in each section, tilting toward the mouse.</p>
  <section><div data-fx="chrome-logo-fly" data-fx-chrome-logo-fly="ry: .5" style="width: 30vw"></div><span>Large on the left</span></section>
  <section><span>Small on the right</span><div data-fx="chrome-logo-fly" data-fx-chrome-logo-fly="ry: -.4" style="width: 12vw; justify-self: end"></div></section>
  <section id="late"><span>Section where markers appear after 1s</span></section>
  <section><span>No placeholder — the logo shrinks</span></section>
  <div data-fx="chrome-logo-fly" data-demo-remove style="width: 10px"></div>
<script src="../../_vendor/three@0.186.0/three.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => { const d = document.createElement("div"); d.dataset.fx = "chrome-logo-fly"; d.style.width = "20vw"; d.style.justifySelf = "center"; document.getElementById("late").appendChild(d); }, 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
