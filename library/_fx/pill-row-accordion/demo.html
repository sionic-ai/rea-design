<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pill-row-accordion — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-row { padding: 60px clamp(20px, 4.4vw, 64px); }
  .demo-row [data-fx-part="tab"] { font: 600 2rem/1.2 var(--kf-font-sans); text-transform: uppercase; }
  .demo-row [data-fx-part="body"] { display: flex; flex-direction: column; justify-content: space-between; gap: 1rem; padding: 2rem; }
  .demo-row h3 { font: 700 clamp(3rem, 8vw, 7rem)/1 var(--kf-font-display); text-transform: uppercase; }
  .demo-row .wf-img { width: min(22rem, 100%); aspect-ratio: 339 / 232; }
</style>
</head>
<body>
<p class="demo-hint"><b>pill-row-accordion</b> — On wide screens, hover over a pill column. On narrow screens, tap the header row.</p>
<section class="demo-row">
  <div data-fx="pill-row-accordion">
    <div data-fx-part="item" style="--fx-item-bg: var(--kf-accent-soft)">
      <button data-fx-part="trigger" type="button" aria-expanded="false"><span data-fx-part="tab">Craft</span></button>
      <div data-fx-part="panel"><div data-fx-part="body"><h3 data-fx-part="reveal">Craft</h3><div class="wf-img" data-fx-part="reveal" data-label="Work scene video · Landscape"></div><p data-fx-part="reveal">Two lines describing this field go here.</p></div></div>
    </div>
    <div data-fx-part="item">
      <button data-fx-part="trigger" type="button" aria-expanded="false"><span data-fx-part="tab">Code</span></button>
      <div data-fx-part="panel"><div data-fx-part="body"><h3 data-fx-part="reveal">Code</h3><div class="wf-img" data-fx-part="reveal" data-label="Work scene video · Landscape"></div><p data-fx-part="reveal">Two lines describing this field go here.</p></div></div>
    </div>
    <div data-fx-part="item" style="--fx-item-bg: var(--kf-surface)">
      <button data-fx-part="trigger" type="button" aria-expanded="false"><span data-fx-part="tab">Shield</span></button>
      <div data-fx-part="panel"><div data-fx-part="body"><h3 data-fx-part="reveal">Shield</h3><div class="wf-img" data-fx-part="reveal" data-label="Work scene video · Landscape"></div><p data-fx-part="reveal">Two lines describing this field go here.</p></div></div>
    </div>
  </div>
</section>
<script>
(() => {
  const src = document.querySelector(".demo-row");
  const html = src.outerHTML;
  const make = () => { const t = document.createElement("template"); t.innerHTML = html; return t.content.firstElementChild; };
  const gone = make();
  src.after(gone);
  setTimeout(() => src.after(make()), 1000);
  setTimeout(() => gone.remove(), 2500);
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
