<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>scrub-slot-digits — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-spacer { height: 70vh; display: grid; place-items: center; color: var(--kf-dim); }
  .num { display: grid; place-items: center; gap: 12px; padding: 30vh 0; text-align: center; }
  .num [data-fx] { font: 700 clamp(64px, 14vw, 180px) / 1 var(--kf-font-display); letter-spacing: -0.04em; }
  .num small { font: 600 13px/1 var(--kf-font-sans); text-transform: uppercase; color: var(--kf-dim); }
</style>
</head>
<body>
<p class="demo-hint"><b>scrub-slot-digits</b> — Scroll down — the digit places roll for different lengths and stop at the new value. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<div class="demo-spacer">Downward</div>
<div class="num"><small>Unit price</small><div data-fx="scrub-slot-digits" data-fx-scrub-slot-digits="from: 3000; to: 1">3000</div><small>KRW/GB</small></div>
<div class="num" data-demo-remove><div data-fx="scrub-slot-digits" data-fx-scrub-slot-digits="from: 120; to: 45; spins: 1">120</div></div>
<template data-demo-late><div class="num"><div data-fx="scrub-slot-digits" data-fx-scrub-slot-digits="from: 2048; to: 512">2048</div></div></template>
<div class="demo-spacer">Footer</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); window.ScrollTrigger?.refresh(); }, 2500);
</script>
</body>
</html>
