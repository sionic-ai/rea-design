<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gl-lag-frame-carousel — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="../../_vendor/swiper@11.2.10/swiper-bundle.min.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); overflow-x: hidden; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { padding: 60px 80px; }
  .demo [data-fx-part="frame"] { width: 70%; margin-left: 25%; }
  .demo [data-fx-part="stage"] { left: -80px; right: -80px; top: 0; }
  .demo [data-fx-part="bar"] { margin-top: 40px; }
</style>
</head>
<body>
<p class="demo-hint"><b>gl-lag-frame-carousel</b> — Drag or press the photo plate sideways, or press ← →. The plate moves first and the photos follow late. After 1 second one more row is added below, and after 2.5 seconds one empty row is removed.</p>
<section class="demo" data-fx="gl-lag-frame-carousel">
  <div data-fx-part="stage"></div>
  <div data-fx-part="frame"><div class="swiper" data-fx-part="swiper"><div class="swiper-wrapper"><div class="swiper-slide"></div></div></div><div data-fx-part="bar"></div></div>
  <i data-fx-part="slide" data-label="Photo 1 · Office interior"></i><i data-fx-part="slide" data-label="Photo 2 · desk by the window"></i><i data-fx-part="slide" data-label="Photo 3 · Shelf"></i><i data-fx-part="slide" data-label="Photo 4 · Stairs"></i><i data-fx-part="slide" data-label="Photo 5 · Yard"></i>
</section>
<section class="demo" data-fx="gl-lag-frame-carousel" data-demo-remove></section>
<div id="late"></div>
<template data-demo-late>
  <section class="demo" data-fx="gl-lag-frame-carousel" data-fx-gl-lag-frame-carousel="dur: .9; lag: .5" style="--fx-ratio: 16 / 9">
    <div data-fx-part="stage"></div>
    <div data-fx-part="frame"><div class="swiper" data-fx-part="swiper"><div class="swiper-wrapper"><div class="swiper-slide"></div></div></div></div>
    <i data-fx-part="slide" data-label="Late line 1 · flip .9s"></i><i data-fx-part="slide" data-label="Late line 2 · delay .5"></i><i data-fx-part="slide" data-label="Late-arriving line 3"></i>
  </section>
</template>
<script src="three-global.js"></script>
<script src="../../_vendor/three@0.175.0/build/three.cjs"></script>
<script src="../../_vendor/swiper@11.2.10/swiper-bundle.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => document.getElementById("late").append(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
