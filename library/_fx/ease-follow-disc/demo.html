<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ease-follow-disc — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .stage { display: flex; gap: 2vw; align-items: center; height: 60vh; margin: 32px 20px; padding: 0 4vw; background: var(--kf-contrast-bg); overflow: hidden; }
  .stage .card { flex: 0 0 26vw; height: 80%; background: var(--kf-surface); }
  .stage p { font-size: 10px; }
</style>
</head>
<body>
<p class="demo-hint"><b>ease-follow-disc</b> — Hover and move the mouse over the dark panel. A round guide circle lights up and glides after the cursor. <span style="color:var(--kf-dim)">(One more panel comes in after 1s, and an empty panel drops out after 2.5s)</span></p>
<section class="stage" data-fx="ease-follow-disc">
  <div class="card"></div><div class="card"></div><div class="card"></div>
  <div data-fx-part="disc"><svg width="32" height="32" viewBox="0 0 38 38" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M4 19h30M9 14l-5 5 5 5M29 14l5 5-5 5"/></svg><p>Swipe</p></div>
</section>
<section class="stage" data-fx="ease-follow-disc" data-fx-ease-follow-disc="dur: 1; ease: power3.out; look: pop; shift-x: 60; shift-y: -60" style="height:40vh">
  <div class="card"></div><div class="card"></div>
  <div data-fx-part="disc" style="--fx-size:75px;--fx-disc-bg:var(--kf-bg);color:var(--kf-ink)"><div data-fx-part="face"><svg width="75" height="75" viewBox="0 0 75 75" fill="currentColor"><path d="M51 37 46.5 39.6V34.4z"/><path d="M25 37 29.5 34.4V39.6z"/></svg></div></div>
</section>
<section class="stage" data-fx="ease-follow-disc" data-demo-remove style="height:80px"></section>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.body.insertAdjacentHTML("beforeend", '<section class="stage" data-fx="ease-follow-disc" data-fx-ease-follow-disc="dur: 1.2" style="height:30vh"><div class="card"></div><div data-fx-part="disc" style="--fx-size:60px"><p>Late circle</p></div></section>'), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
