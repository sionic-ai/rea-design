<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>zigzag-row-wipe — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { margin: 0; font-family: var(--kf-font-sans); background: var(--kf-bg); color: var(--kf-ink); }
  .demo-hint { padding: 24px; }
  section { min-height: 120vh; display: grid; place-items: center; font-size: 32px; border-top: 1px solid var(--kf-line); }
  .b { background: var(--kf-surface); }
</style>
</head>
<body>
  <p class="demo-hint"><b>zigzag-row-wipe</b> Scroll down — when the head of the second section hits the top of the screen, sawtooth bands alternately cover and then clear.</p>
  <section>Section 1</section>
  <section class="b" data-fx="zigzag-row-wipe">Section 2 — Boundary</section>
  <section>Section 3</section>
  <template data-demo-late><section class="b" data-fx="zigzag-row-wipe" data-fx-zigzag-row-wipe="rows: 8; stag: .3; hold: .3">Section added 1s later (8 lines)</section></template>
  <div data-fx="zigzag-row-wipe" data-demo-remove></div>
  <section>Footer</section>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
