<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>step-nudge-loop — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); padding: 24px; }
  .demo-hint { margin-bottom: 24px; font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-row { display: flex; gap: 40px; align-items: flex-end; }
  .demo-kid { width: 60px; height: 90px; border-radius: 30px 30px 8px 8px; background: var(--kf-accent); }
</style>
</head>
<body>
<p class="demo-hint"><b>step-nudge-loop</b> — On a 1.5s beat, the piece snaps back and forth between its place and an offset pose.</p>
<div class="demo-row">
  <div class="demo-kid" data-fx="step-nudge-loop"></div>
  <div class="demo-kid" data-fx="step-nudge-loop" style="--fx-x: -10px; --fx-delay: .4s"></div>
  <div class="demo-kid" data-fx="step-nudge-loop" style="--fx-x: 10px; --fx-delay: .25s"></div>
  <div class="demo-kid" data-fx="step-nudge-loop" style="--fx-y: 0px; --fx-rot: 5deg; --fx-delay: .15s"></div>
</div>
<script>
// Late arrivals and removals — as a css part it spins as soon as it attaches. Add one after 1 second and remove one after 2.5 seconds
(() => {
  // Runs after the document is fully read — so elements are found even when the demo is opened inside another frame
  const run = () => {
    const row = document.querySelector(".demo-row");
    const first = row && row.querySelector('[data-fx~="step-nudge-loop"]');
    if (!first) return;
    const gone = first.cloneNode(true);
    row.append(gone);
    setTimeout(() => row.append(first.cloneNode(true)), 1000);
    setTimeout(() => gone.remove(), 2500);
  };
  if (document.readyState === "loading") addEventListener("DOMContentLoaded", run); else run();
})();
</script>
<script src="../fx-core.js"></script>
</body>
</html>
