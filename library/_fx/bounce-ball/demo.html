<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bounce-ball — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { padding: 280px 20px 48px; display: flex; align-items: flex-end; gap: 40px; border-bottom: 1px solid var(--kf-line); }
  .demo i { display: block; width: 18px; height: 18px; }
  .demo h2 { font: 700 72px/1 var(--kf-font-display); display: flex; align-items: flex-end; gap: 4px; }
  .demo h2 i { width: 16px; height: 16px; margin-bottom: 10px; --fx-color: var(--kf-danger, var(--kf-accent)); }
</style>
</head>
<body>
<p class="demo-hint"><b>bounce-ball</b> — On open, balls drop and bounce. The left ball keeps bouncing while changing color, the others bounce once and stop. <span style="color:var(--kf-dim)">(After 1s one more ball comes in, and one leaves 2.5s later)</span></p>
<section class="demo">
  <i data-fx="bounce-ball" data-fx-bounce-ball="drop: 240; dur: .7; bounciness: .6; blink: .2; colors: var(--kf-accent), var(--kf-ink), var(--kf-dim)"></i>
  <i data-demo-remove data-fx="bounce-ball" data-fx-bounce-ball="drop: 190; dur: .8; bounciness: .5; squash: .2; delay: .4; opacity: 0; loop: false"></i>
  <i data-fx="bounce-ball" data-fx-bounce-ball="drop: 370; dur: .95; bounciness: .5; squash: .2; delay: .6; opacity: 0; loop: false"></i>
  <template data-demo-late><i data-fx="bounce-ball" data-fx-bounce-ball="drop: 160; dur: .6; bounciness: .5; squash: .2; opacity: 0; loop: false"></i></template>
  <i data-fx="bounce-ball" data-fx-bounce-ball="from: floor; height: 120; dur: .6; bounciness: 1"></i>
  <h2>Title<i data-fx="bounce-ball" data-fx-bounce-ball="drop: 190; dur: .8; bounciness: .4; squash: .2; delay: .3; opacity: 0; loop: false"></i></h2>
</section>
<section class="demo"><i></i><i data-fx="bounce-ball"></i></section>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
