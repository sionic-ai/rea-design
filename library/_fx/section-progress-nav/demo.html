<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>section-progress-nav — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { margin: 0; background: var(--kf-bg); color: var(--kf-ink); font: 400 12px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 5; margin: 0; padding: 12px 20px; background: var(--kf-surface); font: 500 13px/1.4 var(--kf-font-mono); }
  .wrap { display: flex; }
  aside { width: 30%; }
  aside nav { position: sticky; top: 60px; padding: 24px; display: flex; flex-direction: column; }
  aside a { display: flex; gap: 16px; height: 32px; align-items: center; color: var(--kf-dim); border-bottom: 1px solid var(--kf-line); text-transform: uppercase; }
  aside a[aria-current] { color: var(--kf-ink); }
  main { width: 70%; }
  main section { height: 120vh; padding: 24px; border-top: 1px solid var(--kf-line); font: 400 40px/1 var(--kf-font-display); }
</style>
</head>
<body>
<p class="demo-hint"><b>section-progress-nav</b> Scroll. The current section’s row darkens and its underline grows as it passes. Click a row to jump to that section. <span style="color:var(--kf-dim)">(After 1s one more list is added, and after 2.5s one leaves)</span></p>
<div class="wrap">
  <aside>
    <nav data-fx="section-progress-nav">
      <a data-fx-part="row" data-target="#s1" href="#s1"><span>01</span>One zone<i data-fx-part="bar"></i></a>
      <a data-fx-part="row" data-target="#s2" href="#s2"><span>02</span>Zone Two<i data-fx-part="bar"></i></a>
      <a data-fx-part="row" data-target="#s3" href="#s3"><span>03</span>Zone Three<i data-fx-part="bar"></i></a>
    </nav>
    <template data-demo-late><nav data-fx="section-progress-nav" style="top:220px"><a data-fx-part="row" data-target="#s2" href="#s2">Late row<i data-fx-part="bar"></i></a></nav></template>
    <nav data-fx="section-progress-nav" data-demo-remove><a data-fx-part="row" data-target="#s1" href="#s1">Dropped Line<i data-fx-part="bar"></i></a></nav>
    <nav data-fx="section-progress-nav"><a data-fx-part="row" data-target="#None" href="#">Orphan line</a></nav>
  </aside>
  <main><section id="s1">One zone</section><section id="s2">Zone Two</section><section id="s3">Zone Three</section></main>
</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
