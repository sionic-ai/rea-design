<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>depth-spread-collage — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 500 13px/1.4 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 5; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .pad { height: 60vh; display: grid; place-items: center; color: var(--kf-dim); }
  .copy { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 70; text-align: center; font-size: 22px; }
  .wf-img { height: 100%; }
</style>
</head>
<body>
<p class="demo-hint"><b>depth-spread-collage</b> — Scroll down. Panels gathered at the center spread out and fly past toward the camera. <span style="color:var(--kf-dim)">(After 1s one more panel comes in, and one leaves 2.5s later)</span></p>
<div class="pad">Top section</div>
<section data-fx="depth-spread-collage" style="height: 350vh">
  <div data-fx-part="stage">
    <figure data-fx-part="plane"><div class="wf-img" data-label="Capture 1"></div></figure>
    <figure data-fx-part="plane"><div class="wf-img" data-label="Capture 2"></div></figure>
    <figure data-fx-part="plane"><div class="wf-img" data-label="Capture 3"></div></figure>
    <figure data-fx-part="plane"><div class="wf-img" data-label="Capture 4"></div></figure>
    <figure data-fx-part="plane"><div class="wf-img" data-label="Capture 5"></div></figure>
    <figure data-fx-part="plane"><div class="wf-img" data-label="Capture 6"></div></figure>
    <figure data-fx-part="plane"><div class="wf-img" data-label="Capture 7"></div></figure>
    <figure data-fx-part="plane"><div class="wf-img" data-label="Capture 8"></div></figure>
    <p class="copy">Your center copy here</p>
  </div>
</section>
<section data-fx="depth-spread-collage" data-demo-remove style="height: 200vh"><div data-fx-part="stage"><figure data-fx-part="plane"><div class="wf-img" data-label="Dropped Panel"></div></figure></div></section>
<div class="pad" data-demo-slot>Lower section</div>
<template data-demo-late><section data-fx="depth-spread-collage" data-fx-depth-spread-collage="lead: 0; follow: .2" style="height: 250vh"><div data-fx-part="stage"><figure data-fx-part="plane"><div class="wf-img" data-label="Late 1"></div></figure><figure data-fx-part="plane"><div class="wf-img" data-label="Late 2"></div></figure></div></section></template>
<section data-fx="depth-spread-collage"></section>
<div class="pad">Footer</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); }, 2500);
</script>
</body>
</html>
