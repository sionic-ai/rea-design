<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hole-zoom-loader — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 1; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .page { height: 100vh; display: grid; place-items: center; background: var(--kf-accent-soft); font: 400 64px/1 var(--kf-font-display); }
  .t, .tail { font: 400 calc(84 / 1440 * 100svw) / 1.3 var(--kf-font-display); letter-spacing: -.05em; }
  .tail { top: 50%; left: 50%; transform: translate(calc(-50% + 292 / 1440 * 100svw / 2), calc(-50% + 164 / 1440 * 100svw / 2)); }
  .wedge { top: 50%; left: 50%; width: 52svw; transform: translate(calc(-50% - 10svw - 1svw), calc(-50% - 6svw - 1svw)); }
</style>
</head>
<body>
<p class="demo-hint"><b>hole-zoom-loader</b> — Refresh. After two lines of text pass, a hole outline is drawn, and the curtain spins with the hole and grows to open the page.</p>
<div class="page">Your Hero here</div>
<div data-fx="hole-zoom-loader" id="ld">
  <p class="t" data-fx-part="text">Here is the Name</p>
  <p class="t" data-fx-part="text">for</p>
  <svg data-fx-part="outline" viewBox="0 0 1440 810" preserveAspectRatio="xMidYMid slice"><path d="M586 323H834a32.8 32.8 0 0 1 0 54.7a27.3 27.3 0 0 1 0 54.6a32.8 32.8 0 0 1 0 54.7H586a12 12 0 0 1 -12 -12V335a12 12 0 0 1 12 -12Z"/></svg>
  <svg data-fx-part="sheet" viewBox="0 0 1440 810" preserveAspectRatio="xMidYMid slice"><path fill-rule="evenodd" d="M0 0H1440V810H0Z M586 323H834a32.8 32.8 0 0 1 0 54.7a27.3 27.3 0 0 1 0 54.6a32.8 32.8 0 0 1 0 54.7H586a12 12 0 0 1 -12 -12V335a12 12 0 0 1 12 -12Z"/></svg>
  <span class="wedge" data-fx-part="wedge"></span>
  <p class="tail" data-fx-part="tail">ordmark</p>
</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
  // A late empty curtain (no children) also passes quietly, and a removed curtain is detached
  setTimeout(() => { const d = document.createElement("div"); d.dataset.fx = "hole-zoom-loader"; d.hidden = true; document.body.append(d); setTimeout(() => d.remove(), 500); }, 1000);
</script>
</body>
</html>
