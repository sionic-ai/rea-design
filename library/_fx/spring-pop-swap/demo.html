<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>spring-pop-swap — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { margin: 0; background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; margin: 0; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .row { display: flex; gap: 30px; padding: 80px 40px; flex-wrap: wrap; }
  .card { width: 220px; padding: 24px; background: var(--kf-surface); border-radius: var(--kf-radius-md); text-align: center; list-style: none; }
  .card figure { margin: 0 0 16px; aspect-ratio: 1; }
  .card .wf-img { height: 100%; }
</style>
</head>
<body>
<p class="demo-hint"><b>spring-pop-swap</b> — Hover over a card. It bounces, settles with a wobble, and the second photo turns on. <span style="color:var(--kf-dim)">(One more card comes in after 1s, and one drops out after 2.5s)</span></p>
<ul class="row">
  <li class="card" data-demo-remove data-fx="spring-pop-swap"><figure data-fx-part="frame"><div class="wf-img" data-label="Everyday Photo"></div><div class="wf-img" data-fx-part="alt" data-label="Smiling photo"></div></figure>Name one</li>
  <li class="card" data-fx="spring-pop-swap"><figure data-fx-part="frame"><div class="wf-img" data-label="Everyday Photo"></div><div class="wf-img" data-fx-part="alt" data-label="Smiling photo"></div></figure>Name two</li>
  <li class="card" data-fx="spring-pop-swap" data-fx-spring-pop-swap="pop: 1.06; rest: 1.04"><figure data-fx-part="frame"><div class="wf-img" data-label="Subtler Type"></div></figure>Without swapping photos</li>
  <template data-demo-late><li class="card" data-fx="spring-pop-swap"><figure data-fx-part="frame"><div class="wf-img" data-label="Late-arriving card"></div><div class="wf-img" data-fx-part="alt" data-label="Smiling photo"></div></figure>Name four</li></template>
  <li class="card" data-fx="spring-pop-swap"></li>
</ul>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/CustomEase.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
