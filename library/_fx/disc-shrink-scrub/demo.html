<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>disc-shrink-scrub — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { margin: 0; background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); overflow-x: clip; }
  .demo-hint { position: sticky; top: 0; z-index: 5; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .gap { height: 60vh; }
  .story { height: 220vh; background: var(--kf-contrast-bg); }
  .story [data-fx-part="stage"] { height: 100vh; display: grid; place-items: center; }
  .lead { color: var(--kf-contrast-ink); font-size: clamp(20px, 3vw, 36px); text-align: center; }
  .strips { position: absolute; inset: 0; z-index: 1; display: grid; align-content: center; gap: 16px; padding-block: 20px; background: var(--kf-raised); }
  .strips div { display: flex; gap: 16px; }
  .strips .wf-img { flex: 1; height: 26vh; }
</style>
</head>
<body>
<p class="demo-hint"><b>disc-shrink-scrub</b> — Scroll down. Two dark circles shrink with the scroll and open up the photo strip behind. <span style="color:var(--kf-dim)">(After 1s one more section comes in, and one leaves 2.5s later)</span></p>
<div class="gap"></div>
<section class="story" data-fx="disc-shrink-scrub">
  <div class="strips"><div><span class="wf-img" data-label="Photo"></span><span class="wf-img" data-label="Photo"></span><span class="wf-img" data-label="Photo"></span></div><div><span class="wf-img" data-label="Photo"></span><span class="wf-img" data-label="Photo"></span><span class="wf-img" data-label="Photo"></span></div></div>
  <div data-fx-part="stage"><i data-fx-part="disc" data-key="left"></i><i data-fx-part="disc" data-key="right"></i><p class="lead">Your story entrance in one line<br>Second row</p></div>
</section>
<div class="gap"></div>
<section class="story" data-fx="disc-shrink-scrub" data-fx-disc-shrink-scrub="to: .2; scrub: 0" data-demo-remove><div data-fx-part="stage"><i data-fx-part="disc" data-key="left"></i><i data-fx-part="disc" data-key="right"></i><p class="lead">Dropped Section</p></div></section>
<div id="late"></div>
<template data-demo-late><section class="story" data-fx="disc-shrink-scrub" data-fx-disc-shrink-scrub="to: .6"><div class="strips"><div><span class="wf-img" data-label="Late section"></span></div></div><div data-fx-part="stage"><i data-fx-part="disc" data-key="left"></i><i data-fx-part="disc" data-key="right"></i><p class="lead">Late section</p></div></section></template>
<div class="gap"></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => document.getElementById("late").append(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
