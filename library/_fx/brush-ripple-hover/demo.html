<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>brush-ripple-hover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { padding: 32px 20px; display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
  .card { display: block; aspect-ratio: 3 / 2; overflow: hidden; }
</style>
</head>
<body>
<p class="demo-hint"><b>brush-ripple-hover</b> — Move the mouse over the photo. Brush-stroke ripples spread where it passed and the photo warps. <span style="color:var(--kf-dim)">(After 1s one more panel comes in, and one leaves 2.5s later)</span></p>
<section class="demo">
  <a class="card" data-fx="brush-ripple-hover"><div class="wf-img" data-fx-part="image" data-label="Guest room window side · daylight · landscape 3:2" style="height:100%"></div></a>
  <a class="card" data-demo-remove data-fx="brush-ripple-hover" data-fx-brush-ripple-hover="strength: .2"><div class="wf-img" data-fx-part="image" data-label="Panel to be removed soon" style="height:100%"></div></a>
  <template data-demo-late><a class="card" data-fx="brush-ripple-hover" data-fx-brush-ripple-hover="size: 90; fade: .94"><div class="wf-img" data-fx-part="image" data-label="Late-arriving version · big mark" style="height:100%"></div></a></template>
</section>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../_vendor/three@0.109.0/build/three.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
