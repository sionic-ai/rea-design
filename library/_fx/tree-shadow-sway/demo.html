<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tree-shadow-sway — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .panel { min-height: 46vh; margin: 24px; padding: 40px; background: var(--kf-surface); border: 1px solid var(--kf-line); }
</style>
</head>
<body>
<p class="demo-hint"><b>tree-shadow-sway</b> — The leaf shadow at the bottom right sways slowly every 12s. <span style="color:var(--kf-dim)">(After 1s one more panel comes in, and one leaves 2.5s later)</span></p>
<footer class="panel" data-fx="tree-shadow-sway"><svg data-fx-part="shade" viewBox="0 0 800 500" preserveAspectRatio="none" fill="currentColor"><path d="M800 40C640 90 520 160 380 260" stroke="currentColor" stroke-width="10" fill="none"/><ellipse cx="620" cy="120" rx="60" ry="22"/><ellipse cx="520" cy="200" rx="48" ry="18" transform="rotate(30 520 200)"/><ellipse cx="700" cy="260" rx="70" ry="26" transform="rotate(-20 700 260)"/><ellipse cx="420" cy="300" rx="40" ry="16"/><ellipse cx="760" cy="380" rx="56" ry="20" transform="rotate(40 760 380)"/></svg><div><h2>Footer panel</h2><p>Your footer content here.</p></div></footer>
<div class="panel" data-demo-remove data-fx="tree-shadow-sway" data-fx-tree-shadow-sway="look: wide"><svg data-fx-part="shade" viewBox="0 0 400 270" fill="currentColor"><ellipse cx="300" cy="80" rx="60" ry="22"/><ellipse cx="200" cy="160" rx="48" ry="18"/></svg><p>Panel to be removed soon</p></div>
<div id="late"></div>
<div class="panel" data-fx="tree-shadow-sway"><p>Panel with no shadow (nothing attached)</p></div>
<template data-demo-late><div class="panel" data-fx="tree-shadow-sway" data-fx-tree-shadow-sway="look: wide" style="--fx-dur: 4s; --fx-right: auto; --fx-left: -2%; --fx-top: -5%; --fx-bottom: auto; --fx-w: 50%"><svg data-fx-part="shade" viewBox="0 0 400 270" fill="currentColor"><ellipse cx="120" cy="90" rx="70" ry="24"/><ellipse cx="220" cy="170" rx="50" ry="18"/></svg><p>Late-arriving panel (4s, large)</p></div></template>
<script src="../fx-core.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => document.getElementById("late").append(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
