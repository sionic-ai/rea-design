<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>note-deck-fan — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; overflow-x: hidden; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .nd { display: flex; gap: 120px; justify-content: center; align-items: center; min-height: 70vh; }
  .nd button { border: 0; background: none; padding: 0; font: inherit; font-size: 18px; }
  .nd .done { font: 400 13px var(--kf-font-mono); color: var(--kf-dim); }
</style>
</head>
<body>
<p class="demo-hint"><b>note-deck-fan</b> — Hover the bundle and it fans out. Press it and it slides off to the left, then returns after 1s. <span style="color:var(--kf-dim)">(One more bundle comes in after 1s, and one drops out after 2.5s)</span></p>
<div class="nd">
  <button type="button" data-fx="note-deck-fan"><span data-fx-part="note" style="--fx-note: var(--kf-accent-soft)"></span><span data-fx-part="note" style="--fx-note: var(--kf-raised)"></span><span data-fx-part="note" style="--fx-note: var(--kf-surface)"></span><span data-fx-part="label">Here<br>Button<br>Text</span></button>
  <button type="button" data-demo-remove data-fx="note-deck-fan"><span data-fx-part="note" style="--fx-note: var(--kf-raised)"></span><span data-fx-part="note"></span></button>
</div>
<template data-demo-late><div class="nd"><button type="button" data-fx="note-deck-fan" data-fx-note-deck-fan="out: 0"><span data-fx-part="note"></span><span data-fx-part="note" style="--fx-note: var(--kf-raised)"></span><span data-fx-part="note" style="--fx-note: var(--kf-surface)"></span></button></div></template>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
document.addEventListener("fx:open", (e) => setTimeout(() => e.target.dispatchEvent(new CustomEvent("fx:reset")), 1000));
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
