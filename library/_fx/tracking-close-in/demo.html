<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tracking-close-in — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); overflow-x: hidden; }
  .demo-hint { position: sticky; top: 0; z-index: 10; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-spacer { height: 80vh; display: grid; place-items: center; color: var(--kf-dim); }
  .demo-word { text-align: center; color: var(--kf-accent); font: 400 clamp(64px, 16vw, 240px)/1 var(--kf-font-display); white-space: nowrap; }
</style>
</head>
<body>
<p class="demo-hint"><b>tracking-close-in</b> — Scroll down. A large word gathers from wide letter-spacing and settles. <span style="color:var(--kf-dim)">(After 1s one more word comes in, and after 2.5s one drops out)</span></p>
<div class="demo-spacer">↓</div>
<h2 class="demo-word" data-fx="tracking-close-in">DRESS</h2>
<div class="demo-spacer"></div>
<h2 class="demo-word" data-fx="tracking-close-in" data-fx-tracking-close-in="from: 80px; dur: .8" data-demo-remove>KIMONO</h2>
<div class="demo-spacer"></div>
<h2 class="demo-word" data-fx="tracking-close-in" data-fx-tracking-close-in="on: load"></h2>
<template data-demo-late><h2 class="demo-word" data-fx="tracking-close-in">GOWN</h2></template>
<div class="demo-spacer">Footer</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
