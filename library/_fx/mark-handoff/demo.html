<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mark-handoff — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .photo { height: 100vh; background: var(--kf-contrast-bg); }
  .photo .wf-img { height: 100%; opacity: .5; border: 0; }
  .mark { width: calc(100vw - 40px); margin-inline: auto; font: 800 clamp(60px, 17vw, 260px)/1 var(--kf-font-display); letter-spacing: -.04em; text-align: center; }
  .after { padding: 20vh 20px 60vh; }
</style>
</head>
<body>
<p class="demo-hint"><b>mark-handoff</b> — Scroll down. The wordmark color changes along the line where the rising photo is cut. <span style="color:var(--kf-dim)">(After 1s a second panel comes in, after 2.5s the bottom panel leaves)</span></p>
<div data-fx="mark-handoff" data-fx-mark-handoff="offset: 20">
  <section data-fx-part="stage"><div class="photo"><span class="wf-img" style="display:block" data-label="First page photo · Full screen"></span></div><div class="mark" data-fx-part="front">WORDMARK</div></section>
  <div data-fx-part="trail"><div class="mark" data-fx-part="back">WORDMARK</div></div>
</div>
<div class="after">Your next section content here</div>
<div data-late-slot></div>
<div data-demo-remove data-fx="mark-handoff" data-fx-mark-handoff="hold: 120">
  <section data-fx-part="stage"><div class="photo"></div><div class="mark" data-fx-part="front">REMOVED</div></section>
  <div data-fx-part="trail"><div class="mark" data-fx-part="back">REMOVED</div></div>
</div>
<template data-demo-late><div data-fx="mark-handoff" data-fx-mark-handoff="hold: 140"><section data-fx-part="stage"><div class="photo"><span class="wf-img" style="display:block" data-label="Late-arrived Photo"></span></div><div class="mark" data-fx-part="front">LATE</div></section><div data-fx-part="trail"><div class="mark" data-fx-part="back">LATE</div></div></div><div class="after">Footer</div></template>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => document.querySelector("[data-late-slot]").replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
