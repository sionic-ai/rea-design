<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>scroll-lag-tilt — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.6 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 10; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 40px; padding: 30vh 60px; }
  .blob { aspect-ratio: 1; border-radius: 46% 54% 40% 60% / 55% 45% 55% 45%; background: var(--kf-accent-soft); display: grid; place-items: center; color: var(--kf-accent-text); }
</style>
</head>
<body>
<p class="demo-hint"><b>scroll-lag-tilt</b> — Scroll fast with the wheel, down and back up. The characters each lag differently and lean (769px and up). <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<div class="row" id="row">
  <div class="blob" data-fx="scroll-lag-tilt">Character 1</div>
  <div class="blob" data-fx="scroll-lag-tilt">Character 2</div>
  <div class="blob" data-fx="scroll-lag-tilt" data-fx-scroll-lag-tilt="amp: 0.6; dir: -1">Strong 3</div>
  <div class="blob" data-fx="scroll-lag-tilt" data-demo-remove>Dropped 4</div>
</div>
<div class="row"><div class="blob" data-fx="scroll-lag-tilt" data-fx-scroll-lag-tilt="trait: 5">Trait 5</div><div class="blob" data-fx="scroll-lag-tilt" data-fx-scroll-lag-tilt="max: 0">No slant</div></div>
<div style="height: 120vh"></div>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => { const b = document.createElement("div"); b.className = "blob"; b.dataset.fx = "scroll-lag-tilt"; b.textContent = "Late-arriving character"; document.getElementById("row").append(b); }, 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
