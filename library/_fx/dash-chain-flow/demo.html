<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dash-chain-flow — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { margin: 0; background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; margin: 0; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .hero { position: relative; height: 90vh; display: grid; place-items: end center; padding-bottom: 60px; box-sizing: border-box; }
  .hero canvas { position: absolute; inset: 0; }
  .hero h1 { position: relative; margin: 0; font-size: clamp(32px, 5.6vw, 81px); font-weight: var(--kf-weight-display); letter-spacing: -0.02em; }
  .box { position: relative; height: 40vh; margin: 20px; }
</style>
</head>
<body>
<p class="demo-hint"><b>dash-chain-flow</b> — Just leave it and watch — dashed lines flow along a curved path and a few blink in the accent color. <span style="color:var(--kf-dim)">(After 1s one more panel comes in, and one leaves 2.5s later)</span></p>
<section class="hero"><canvas data-fx="dash-chain-flow"></canvas><h1>Your Hero title here</h1></section>
<div class="box" data-demo-remove><div data-fx="dash-chain-flow" data-fx-dash-chain-flow="speed: 2; blue: 12" style="position:absolute;inset:0"></div></div>
<template data-demo-late><div class="box"><canvas data-fx="dash-chain-flow" style="position:absolute;inset:0"></canvas></div></template>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); window.ScrollTrigger?.refresh(); }, 2500);
</script>
</body>
</html>
