<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>scroll-pan-parallax — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .pad { height: 60vh; display: grid; place-items: center; color: var(--kf-dim); }
  .era { position: relative; width: 120vh; height: 100%; border-right: 1px dashed var(--kf-line); background: var(--kf-surface); }
  .era h3 { position: absolute; left: 4vh; top: 4vh; font: 700 8vh/1 var(--kf-font-display); }
  .era i { position: absolute; display: block; border-radius: var(--kf-radius-md); background: var(--kf-accent-soft); border: 1px solid var(--kf-line); }
  .era .back { left: 30vh; top: 22vh; width: 50vh; height: 20vh; }
  .era .front { left: 10vh; top: 55vh; width: 40vh; height: 30vh; background: var(--kf-accent); }
</style>
</head>
<body>
<p class="demo-hint"><b>scroll-pan-parallax</b> — Scroll down and the strip flows horizontally. The dark boxes (front layer) pass faster and the pale boxes (back layer) slower. <span style="color:var(--kf-dim)">(One more cell is added after 1s, and the last cell drops out after 2.5s)</span></p>
<div class="pad">Top margin</div>
<section data-fx="scroll-pan-parallax" data-fx-scroll-pan-parallax="ratio: .6; dur: .6" style="--fx-top: 45px">
  <div data-fx-part="stage"><div data-fx-part="strip">
    <div class="era"><h3>1925</h3><i class="back" data-fx-part="layer" data-par="400"></i><i class="front" data-fx-part="layer" data-par="-1000"></i></div>
    <div class="era"><h3>1950</h3><i class="back" data-fx-part="layer" data-par="200"></i><i class="front" data-fx-part="layer" data-par="-800"></i></div>
    <div class="era" data-demo-remove><h3>1975</h3><i class="back" data-fx-part="layer" data-par="0"></i><i class="front" data-fx-part="layer" data-par="-600"></i></div>
    <template data-demo-late><div class="era"><h3>2000</h3><i class="front"></i></div></template>
  </div></div>
</section>
<section data-fx="scroll-pan-parallax"><div data-fx-part="stage"></div></section>
<div class="pad">Bottom margin</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/CustomEase.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
