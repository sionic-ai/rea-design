<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>center-widen-pin — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-spacer { height: 60vh; display: grid; place-items: center; color: var(--kf-dim); }
  .track { height: 300vh; }
  .side-l { left: 0; width: 40vw; display: grid; place-items: center; font: 700 32px/1.2 var(--kf-font-display); }
  .side-r { right: 0; width: 18.84vw; display: grid; align-content: center; gap: 14px; padding-left: 3vw; font-size: 13px; }
  .pic { background-image: repeating-linear-gradient(0deg, var(--kf-accent) 0 40px, var(--kf-raised) 40px 80px), linear-gradient(var(--kf-accent-soft), var(--kf-accent)); background-size: 100% 300%; }
</style>
</head>
<body>
<p class="demo-hint"><b>center-widen-pin</b> — Scroll down and the center column expands to full screen width as the sides drop away. <span style="color:var(--kf-dim)">(One more track comes in after 1s, and one drops out after 2.5s)</span></p>
<div class="demo-spacer">Scroll down</div>
<section class="track" data-fx="center-widen-pin">
  <div data-fx-part="stage">
    <div class="side-l" data-fx-part="side" data-side="left">Left logo slot</div>
    <div data-fx-part="col"><div class="pic" data-fx-part="media"></div></div>
    <ul class="side-r" data-fx-part="side" data-side="right"><li>Menu 1</li><li>Menu 2</li><li>Menu 3</li><li>Menu 4</li></ul>
  </div>
</section>
<section class="track" data-demo-remove data-fx="center-widen-pin" data-fx-center-widen-pin="pan: 0">
  <div data-fx-part="stage"><div data-fx-part="col"><div class="pic" data-fx-part="media"></div></div></div>
</section>
<template data-demo-late><section class="track" data-fx="center-widen-pin" data-fx-center-widen-pin="from: 30; left: 35; dist: .6" style="--fx-from: 30vw; --fx-left: 35vw"><div data-fx-part="stage"><div data-fx-part="col"><div class="pic" data-fx-part="media"></div></div></div></section></template>
<div class="demo-spacer"></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); window.ScrollTrigger?.refresh(); }, 2500);
</script>
</body>
</html>
