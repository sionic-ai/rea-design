<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>wave-grid-gl — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { margin: 0; background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .hero { position: relative; height: 100vh; display: grid; place-items: center; }
  .hero h1 { font: 800 12vw/1 var(--kf-font-display); }
  .after { height: 80vh; padding: 20px; }
</style>
</head>
<body>
<p class="demo-hint"><b>wave-grid-gl</b> — A wave grid flows slowly. Move the mouse and it tilts very slowly, and scroll down and the terrain approaches and fades.</p>
<section class="hero" data-fx="wave-grid-gl"><h1>Brand</h1></section>
<section class="hero" data-demo-remove data-fx="wave-grid-gl" data-fx-wave-grid-gl="cells: 20"><h1>Panel to Be Removed</h1></section>
<template data-demo-late><section class="hero" data-fx="wave-grid-gl" data-fx-wave-grid-gl="amp: .9; fade: 0; speed: .3"><h1>Late-arriving panel</h1></section></template>
<section class="after" data-fx="wave-grid-gl" data-fx-wave-grid-gl="amp: 0"></section>
<script src="../velocity-bend-gl/three-global.js"></script>
<script src="../../_vendor/three@0.170.0/build/three.cjs"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
