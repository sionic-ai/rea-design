<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sine-gradient-lines — flowing sine wave lines</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { padding: 40px; font-family: var(--kf-font-sans); color: var(--kf-ink); background: var(--kf-bg); }
  .band { height: 320px; margin-bottom: 24px; border: 1px solid var(--kf-line); --fx-opacity: .8; }
</style>
</head>
<body>
<p>Watch closely — two lines ripple and color flows along the lines (after 1s one more panel is added, after 2s the first panel drops out).</p>
<div id="stage">
  <div class="band" id="first" data-fx="sine-gradient-lines"></div>
</div>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
  setTimeout(() => {
    const el = document.createElement("div");
    el.className = "band";
    el.setAttribute("data-fx", "sine-gradient-lines");
    el.setAttribute("data-fx-sine-gradient-lines", "lines: 3; amp: 60,40,20; speed: 0.5,0.3,0.2");
    document.getElementById("stage").append(el);
  }, 1000);
  setTimeout(() => document.getElementById("first").remove(), 2000);
</script>
</body>
</html>
