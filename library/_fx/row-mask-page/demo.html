<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>row-mask-page — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-contrast-bg); color: var(--kf-contrast-ink); font: 400 15px/1.6 var(--kf-font-sans); margin: 0; min-height: 100vh; }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); color: var(--kf-ink); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-body { padding: 40px 20px; display: grid; gap: 16px; }
  .demo-body a { color: inherit; font: 700 40px/1.1 var(--kf-font-display); }
  .demo-body button { justify-self: start; }
</style>
</head>
<body>
<p class="demo-hint"><b>row-mask-page</b> — When opened, the strip curtain lifts up. Click the link below and each strip fills with its background color from the lower strip up to cover the screen, then moves back to this page. (One more curtain is added after 1s and removed after 2.5s)</p>
<div class="demo-body">
  <a href="demo.html?again">Next page</a>
  <button type="button" data-demo-cover>Only cover and lift the curtain (nav: none curtain)</button>
</div>
<div data-fx="row-mask-page"><div data-fx-part="shade"></div></div>
<div data-fx="row-mask-page" data-fx-row-mask-page="nav: none; row: .demo-hint" data-demo-remove></div>
<div data-demo-late-host></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
let late;
setTimeout(() => {
  late = document.createElement("div");
  late.dataset.fx = "row-mask-page";
  late.dataset.fxRowMaskPage = "nav: none; row: 80";
  document.querySelector("[data-demo-late-host]").append(late);
}, 1000);
setTimeout(() => document.querySelector("[data-demo-remove]")?.remove(), 2500);
document.querySelector("[data-demo-cover]").addEventListener("click", async () => {
  if (!late?.fxCover) return;
  await late.fxCover();
  await late.fxReveal();
});
</script>
</body>
</html>
