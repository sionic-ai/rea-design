<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>trio-flash-intro — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: relative; z-index: 1; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .hero { height: 100vh; }
  .hero .wf-img, [data-fx-part="frame"] .wf-img { height: 100%; border: 0; }
  .t1 .wf-img { background-color: var(--kf-raised); }
  .t2 .wf-img { background-color: var(--kf-line); }
  .again { position: fixed; right: 16px; bottom: 60px; z-index: 2; }
</style>
</head>
<body>
<p class="demo-hint"><b>trio-flash-intro</b> — Refresh. Three photos switch on and change on the Tempo, then the middle one expands to fill the screen and the curtain lifts. <span style="color:var(--kf-dim)">(After 1s another identical intro comes in, and it leaves after 2.5s — it spins even if attached late)</span></p>
<div class="hero"><div class="wf-img" data-label="Hero photo · center is the same photo as the last slide"></div></div>
<div data-fx="trio-flash-intro" id="intro">
  <div data-fx-part="inner">
    <div data-fx-part="photo"><div data-fx-part="frame" class="t1"><div class="wf-img" data-label="1-1"></div></div><div data-fx-part="frame" class="t2"><div class="wf-img" data-label="1-2"></div></div><div data-fx-part="frame"><div class="wf-img" data-label="1-3"></div></div></div>
    <div data-fx-part="photo" data-key="main"><div data-fx-part="frame" class="t2"><div class="wf-img" data-label="2-1"></div></div><div data-fx-part="frame" class="t1"><div class="wf-img" data-label="2-2"></div></div><div data-fx-part="frame"><div class="wf-img" data-label="Hero photo"></div></div></div>
    <div data-fx-part="photo"><div data-fx-part="frame"><div class="wf-img" data-label="3-1"></div></div><div data-fx-part="frame" class="t1"><div class="wf-img" data-label="3-2"></div></div><div data-fx-part="frame" class="t2"><div class="wf-img" data-label="3-3"></div></div></div>
  </div>
</div>
<template data-demo-late><div data-fx="trio-flash-intro" data-demo-remove data-fx-trio-flash-intro="grow: .4; fade: .4" style="z-index: 10020"><div data-fx-part="inner"><div data-fx-part="photo"><div data-fx-part="frame"><div class="wf-img" data-label="Late cell"></div></div></div><div data-fx-part="photo"><div data-fx-part="frame"><div class="wf-img" data-label="Center"></div></div></div></div></div></template>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => document.body.append(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
