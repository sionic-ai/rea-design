<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ring-sweep-pill — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { margin: 0; background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 50; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { display: flex; flex-wrap: wrap; gap: 60px; padding: 80px 60px; }
  .pill { position: relative; display: inline-block; }
  .dark { padding: 40px 60px; background: var(--kf-contrast-bg); }
</style>
</head>
<body>
<p class="demo-hint"><b>ring-sweep-pill</b> — Hover over the button. A ring is painted all the way around and the text rolls over to change. <span style="color:var(--kf-dim)">(After 1s one more button comes in, and after 2.5s one drops out)</span></p>
<section class="demo">
  <span class="pill"><a href="#" data-fx="ring-sweep-pill">Your button text here</a></span>
  <span class="pill"><button type="button" data-fx="ring-sweep-pill" style="font: inherit; border: 0; cursor: pointer">Send</button></span>
  <span class="pill"><a href="#" data-demo-remove data-fx="ring-sweep-pill">Omitted button</a></span>
  <template data-demo-late><span class="pill"><a href="#" data-fx="ring-sweep-pill" style="--fx-dur: .8s">Late Button</a></span></template>
</section>
<section class="dark"><span class="pill"><a href="#" data-fx="ring-sweep-pill" style="--fx-bg: var(--kf-contrast-bg); --fx-ink: var(--kf-contrast-ink); --fx-border: var(--kf-contrast-ink)">On the dark board</a></span></section>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
