<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dot-shimmer-field — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .panel { position: relative; max-width: 720px; height: 520px; margin: 40px auto; background: var(--kf-raised); border-radius: var(--kf-radius-md); overflow: hidden; display: grid; place-items: center; }
  .panel > [data-fx] { position: absolute; left: 0; right: 0; height: 200px; }
  .panel > .top { top: 0; } .panel > .bot { bottom: 0; }
  .panel p { position: relative; max-width: 420px; text-align: center; font-size: 22px; line-height: 1.4; }
</style>
</head>
<body>
<p class="demo-hint"><b>dot-shimmer-field</b> — Look closely at the dot pattern above and below the board and each dot twinkles gently. <span style="color:var(--kf-dim)">(After 1s one more panel comes in, and one leaves 2.5s later)</span></p>
<div class="panel">
  <div class="top" data-fx="dot-shimmer-field" data-fx-dot-shimmer-field="fade: down"></div>
  <p>Put the center quote here in two lines</p>
  <div class="bot" data-fx="dot-shimmer-field" data-fx-dot-shimmer-field="fade: up"></div>
</div>
<div class="panel" data-demo-remove><div class="top" data-fx="dot-shimmer-field"></div></div>
<template data-demo-late><div class="panel"><div class="top" data-fx="dot-shimmer-field" data-fx-dot-shimmer-field="cell: 10; dot: 3; every: 600; fade: down"></div><p>A late-entering panel sparkles too</p></div></template>
<div data-fx="dot-shimmer-field"></div>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); }, 2500);
</script>
</body>
</html>
