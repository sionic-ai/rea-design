<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>static-zap-pin — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 14px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: fixed; top: 0; left: 0; right: 0; z-index: 100; margin: 0; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .pic { display: grid; place-items: center; font: 600 12vw/1 var(--kf-font-display); color: var(--kf-ink); }
  .pic.a { background: repeating-linear-gradient(45deg, var(--kf-raised) 0 30px, var(--kf-line) 30px 34px); }
  .pic.b { background: repeating-linear-gradient(-45deg, var(--kf-surface) 0 50px, var(--kf-dim) 50px 54px); }
  .pic.c { background: repeating-linear-gradient(90deg, var(--kf-raised) 0 70px, var(--kf-accent-soft) 70px 76px); }
  .demo-spacer { height: 50vh; display: grid; place-items: center; color: var(--kf-dim); }
  .small { height: 40vh !important; }
</style>
</head>
<body>
<p class="demo-hint"><b>static-zap-pin</b> — Scroll down and the screen stays pinned while the channel changes with each screen. Current section: <b data-out>0</b> <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<section data-fx="static-zap-pin">
  <div data-fx-part="slide"><div class="pic a">01</div></div>
  <div data-fx-part="slide"><div class="pic b">02</div></div>
  <div data-fx-part="slide"><div class="pic c">03</div></div>
  <div data-fx-part="slide"><div class="pic a">04</div></div>
</section>
<div class="demo-spacer">Footer</div>
<section class="small" data-fx="static-zap-pin" data-demo-remove><div data-fx-part="slide"><div class="pic b">Being removed soon</div></div><div data-fx-part="slide"><div class="pic c">Both</div></div></section>
<template data-demo-late><section class="small" data-fx="static-zap-pin" data-fx-static-zap-pin="dur: 0.2; snap: false; drift: 0"><div data-fx-part="slide"><div class="pic c">Arrives late</div></div><div data-fx-part="slide"></div></section></template>
<section class="small" data-fx="static-zap-pin"></section>
<div class="demo-spacer"></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
document.addEventListener("fx:zap", (e) => { document.querySelector("[data-out]").textContent = e.detail.index; });
setTimeout(() => { document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))); }, 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); window.ScrollTrigger?.refresh(); }, 2500);
</script>
</body>
</html>
