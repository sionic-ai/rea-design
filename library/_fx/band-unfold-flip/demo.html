<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>band-unfold-flip — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .stage { position: relative; height: 60vh; min-height: 320px; margin: 20px; overflow: hidden; border-radius: var(--kf-radius-md); }
  .stage svg { position: absolute; top: 50%; left: 50%; width: 60%; transform: translate(-50%, -50%); }
  .stage .roll { position: absolute; top: 50%; left: 80%; width: 17%; aspect-ratio: 1; margin: -8.5% 0 0 -8.5%; border-radius: 50%; background: var(--kf-contrast-bg); border: 2px solid var(--kf-contrast-ink); }
  .row { display: flex; gap: 10px; padding: 0 20px; }
  .row button { padding: 8px 16px; border: 1px solid var(--kf-line); border-radius: var(--kf-radius-pill); background: var(--kf-surface); color: var(--kf-ink); font: 500 13px/1 var(--kf-font-sans); cursor: pointer; }
</style>
</head>
<body>
<p class="demo-hint"><b>band-unfold-flip</b> — On open, bands unfold from the right on a black panel, a circle rolls across, and the colors flip at 3.6s. You can replay it with the button. <span style="color:var(--kf-dim)">(After 1s one more panel comes in, and one leaves 2.5s later)</span></p>
<div class="row"><button type="button" onclick="document.querySelectorAll('.stage').forEach((s) => s.dispatchEvent(new Event('fx:play')))">fx:play replay</button></div>
<section class="stage" data-fx="band-unfold-flip"><svg data-fx-part="band" viewBox="0 0 1000 283.5" aria-hidden="true"><path d="M0,0 H963 V117 H866 V144 H975 V161 H866 V191 H999 V208 H0 Z"/><path d="M0,221 H957 L999,276 L980,283.5 H0 Z"/></svg><div class="roll" data-fx-part="roller"></div></section>
<section class="stage" data-demo-remove data-fx="band-unfold-flip" data-fx-band-unfold-flip="delay: 0.3; dur: 0.8; flip: 1.6"><svg data-fx-part="band" viewBox="0 0 1000 208" aria-hidden="true"><path d="M0,0 H1000 V208 H0 Z"/></svg></section>
<template data-demo-late><section class="stage" data-fx="band-unfold-flip" data-fx-band-unfold-flip="delay: 0.2; dur: 1; flip: 2"><svg data-fx-part="band" viewBox="0 0 1000 208" aria-hidden="true"><path d="M0,0 H1000 V90 H0 Z M0,118 H700 V208 H0 Z"/></svg></section></template>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/CustomEase.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
