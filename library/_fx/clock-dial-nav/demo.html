<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>clock-dial-nav — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); min-height: 100vh; }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .row { display: flex; gap: 12px; padding: 20px; }
  .row button { padding: 6px 12px; }
</style>
</head>
<body>
<p class="demo-hint"><b>clock-dial-nav</b> Pick another item with the buttons below. The wheel turns so the chosen item stands at the upper right, and the clock hand makes a full turn.</p>
<div class="row"><button type="button" data-go="about">About</button><button type="button" data-go="video">Video</button><button type="button" data-go="photo">Photo</button><button type="button" data-go="home">Home</button><button type="button" data-go="book">Reservation</button></div>
<nav class="dial" data-fx="clock-dial-nav" data-fx-clock-dial-nav="current: home; from: about">
  <div data-fx-part="viewport"><ul>
    <li data-fx-part="item" data-link="about" data-angle="185" data-ghost="45"><a href="#">About</a></li>
    <li data-fx-part="item" data-link="video" data-angle="218" data-ghost="67.5"><a href="#">Video</a></li>
    <li data-fx-part="item" data-link="photo" data-angle="270" data-ghost="90"><a href="#">Photo</a></li>
    <li data-fx-part="item" data-link="home" data-angle="322" data-ghost="112.5"><a href="#">Home</a></li>
    <li data-fx-part="item" data-link="book" data-angle="355" data-ghost="135"><a href="#">Reservation</a></li>
  </ul><div data-fx-part="clock"><i data-fx-part="hour"></i><i data-fx-part="minute"></i><i data-fx-part="pin"></i></div></div>
</nav>
<nav data-fx="clock-dial-nav" data-demo-remove><div data-fx-part="viewport"><ul><li data-fx-part="item" data-link="a" data-angle="270" data-ghost="90"><a href="#">Erase</a></li></ul></div></nav>
<template data-demo-late><nav data-fx="clock-dial-nav" data-fx-clock-dial-nav="anchor: 1; dur: 0.6"><div data-fx-part="viewport"><ul><li data-fx-part="item" data-link="a" data-angle="200" data-ghost="60"><a href="#">Late 1</a></li><li data-fx-part="item" data-link="b" data-angle="270" data-ghost="90"><a href="#">Late 2</a></li><li data-fx-part="item" data-link="c" data-angle="340" data-ghost="120"><a href="#">Late 3</a></li></ul></div></nav></template>
<nav data-fx="clock-dial-nav"></nav>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
document.querySelectorAll("[data-go]").forEach((b) => b.addEventListener("click", () => document.querySelector(".dial").dispatchEvent(new CustomEvent("fx:dial", { detail: { to: b.dataset.go } }))));
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
