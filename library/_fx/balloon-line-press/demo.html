<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>balloon-line-press — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { margin: 0; background: var(--kf-contrast-bg); color: var(--kf-contrast-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; margin: 0; padding: 12px 20px; background: var(--kf-surface); color: var(--kf-ink); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .cta { position: relative; height: 90vh; display: grid; place-items: center; overflow: hidden; }
  .cta h2 { position: relative; z-index: 1; margin: 0; font-size: clamp(32px, 5vw, 81px); font-weight: 500; text-align: center; }
</style>
</head>
<body>
<p class="demo-hint"><b>balloon-line-press</b> — Move the mouse over the panel. The nearest line nodes press down and the glow blobs behind are pushed away. <span style="color:var(--kf-dim)">(After 1s one more panel comes in, and one leaves 2.5s later)</span></p>
<section class="cta"><div data-fx="balloon-line-press"></div><h2>Your footer title here<br>In two lines</h2></section>
<section class="cta" data-demo-remove><div data-fx="balloon-line-press" data-fx-balloon-line-press="lines: 20; radius: 200"></div><h2>Panel to Be Removed</h2></section>
<template data-demo-late><section class="cta"><div data-fx="balloon-line-press"></div><h2>Late panel</h2></section></template>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); window.ScrollTrigger?.refresh(); }, 2500);
</script>
</body>
</html>
