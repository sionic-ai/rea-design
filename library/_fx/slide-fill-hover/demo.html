<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>slide-fill-hover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 500 13px/1 var(--kf-font-sans); }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .row { display: flex; flex-wrap: wrap; gap: 16px; padding: 48px 20px; }
  .row a { display: grid; place-items: center; width: 210px; height: 44px; border-radius: 35px; background: var(--kf-ink-soft); color: var(--kf-on-accent); letter-spacing: .1em; }
</style>
</head>
<body>
<p class="demo-hint"><b>slide-fill-hover</b> — Hover over the button and move away (Tab focus works too). An accent-color panel sweeps in from the left and exits the same way. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<div class="row">
  <a href="#" data-fx="slide-fill-hover">Find a store · Menu</a>
  <a href="#" data-fx="slide-fill-hover" style="--fx-dur: .6s">Slow · .6s</a>
  <a href="#" data-fx="slide-fill-hover" data-demo-remove>Soon-Removed Button</a>
  <template data-demo-late><a href="#" data-fx="slide-fill-hover">Late-arriving button</a></template>
</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
