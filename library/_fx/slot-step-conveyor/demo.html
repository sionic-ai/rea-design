<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>slot-step-conveyor — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .arc { height: 620px; margin: 20px; border: 1px dashed var(--kf-line); }
  .arc [data-fx-part="item"] { width: 200px; height: 168px; margin: 0; background: var(--kf-surface); border: 1px solid var(--kf-line); display: grid; place-items: center; }
  .arc [data-fx-part="item"]:nth-child(1) { --fx-slot-x: 520px; --fx-slot-y: -240px; --fx-slot-r: 8deg; }
  .arc [data-fx-part="item"]:nth-child(2) { --fx-slot-x: 495px; --fx-slot-y: -60px; --fx-slot-r: 14deg; }
  .arc [data-fx-part="item"]:nth-child(3) { --fx-slot-x: 450px; --fx-slot-y: 120px; --fx-slot-r: 20deg; }
  .arc [data-fx-part="item"]:nth-child(4) { --fx-slot-x: 383px; --fx-slot-y: 295px; --fx-slot-r: 26deg; }
  .arc [data-fx-part="item"]:nth-child(5) { --fx-slot-x: 297px; --fx-slot-y: 462px; --fx-slot-r: 34deg; }
  .arc [data-fx-part="item"]:nth-child(6) { --fx-slot-x: 192px; --fx-slot-y: 617px; --fx-slot-r: 42deg; }
  .small { height: 300px; }
  .small [data-fx-part="item"] { width: 120px; height: 90px; }
  .small [data-fx-part="item"]:nth-child(1) { --fx-slot-x: 40px; --fx-slot-y: 100px; --fx-slot-r: 0deg; }
  .small [data-fx-part="item"]:nth-child(2) { --fx-slot-x: 200px; --fx-slot-y: 60px; --fx-slot-r: 4deg; }
  .small [data-fx-part="item"]:nth-child(3) { --fx-slot-x: 360px; --fx-slot-y: 40px; --fx-slot-r: 8deg; }
  .small [data-fx-part="item"]:nth-child(4) { --fx-slot-x: 520px; --fx-slot-y: 60px; --fx-slot-r: 12deg; }
</style>
</head>
<body>
<p class="demo-hint"><b>slot-step-conveyor</b> — Wait and see — every 3s the photo cells shift one slot along the arc, and the cell that drops off the end returns to the front unseen. <span style="color:var(--kf-dim)">(After 1s one more band comes in, and one leaves 2.5s later)</span></p>
<div class="arc" data-fx="slot-step-conveyor">
  <figure data-fx-part="item">Photo 1</figure><figure data-fx-part="item">Photo 2</figure><figure data-fx-part="item">Photo 3</figure>
  <figure data-fx-part="item">Photo 4</figure><figure data-fx-part="item">Photo 5</figure><figure data-fx-part="item">Photo 6</figure>
</div>
<div class="arc small" data-fx="slot-step-conveyor" data-demo-remove><figure data-fx-part="item">Omission</figure><figure data-fx-part="item">Omission</figure><figure data-fx-part="item">Omission</figure></div>
<div data-late-slot></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelector("[data-late-slot]").outerHTML = '<div class="arc small" data-fx="slot-step-conveyor" data-fx-slot-step-conveyor="interval: 1.5; dur: .6; fade: none"><figure data-fx-part="item">Late 1</figure><figure data-fx-part="item">Late 2</figure><figure data-fx-part="item">Late 3</figure><figure data-fx-part="item">Late 4</figure></div>', 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
