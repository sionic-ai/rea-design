<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>door-tile-wall — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 500 15px/1.6 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 10; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .stage { height: 70vh; margin: 20px 0; background: var(--kf-raised); }
  .stage.is-small { height: 320px; zoom: .5; }
</style>
</head>
<body>
<p class="demo-hint"><b>door-tile-wall</b> — Every 1.5s the doors of two panels open slightly and close. The lime panel in the middle opens 2s later. <span style="color:var(--kf-dim)">(After 1s one more panel comes in, and one leaves 2.5s later)</span></p>
<div class="stage" id="main-wall" data-fx="door-tile-wall" data-fx-door-tile-wall="rows: 5; cols: 6; main: 2,2"></div>
<div class="stage is-small" data-fx="door-tile-wall" data-fx-door-tile-wall="rows: 3; shapes: v s; every: 1" data-demo-remove></div>
<div class="stage" data-fx="door-tile-wall" data-fx-door-tile-wall="shapes: x"></div>
<template data-demo-late><div class="stage is-small" data-fx="door-tile-wall" data-fx-door-tile-wall="rows: 2; cols: 4; start: event" style="--fx-tile: var(--kf-accent)"></div></template>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
setTimeout(() => document.getElementById("main-wall").dispatchEvent(new Event("fx:open")), 2000);
</script>
</body>
</html>
