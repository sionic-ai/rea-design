<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bubble-bound-hover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 48px; margin: 80px 40px; }
  .logo { display: inline-flex; align-items: center; gap: 8px; font: 600 16px/1 var(--kf-font-display); }
  .face { width: 56px; height: 48px; border-radius: 50%; background: var(--kf-accent-soft); }
  .bubble { position: relative; display: block; padding: 16px 20px; border-radius: 28px; background: var(--kf-surface); box-shadow: var(--kf-shadow-soft); }
  .tag { display: inline-block; padding: 8px 16px; border-radius: var(--kf-radius-pill); background: var(--kf-accent); color: var(--kf-on-accent); font-weight: 600; }
</style>
</head>
<body>
<p class="demo-hint"><b>bubble-bound-hover</b> — Hover over the logo or name tag — the speech bubble bounces twice. <span style="color:var(--kf-dim)">(After 1s one more name tag comes in, and after 2.5s one is removed)</span></p>
<div class="row">
  <a class="logo" href="#" data-fx="bubble-bound-hover"><span class="face"></span><span class="bubble" data-fx-part="bubble">Name<br>portfolio</span></a>
  <a class="tag" href="#" data-fx="bubble-bound-hover">No kids, just me standing out</a>
  <a class="tag" href="#" data-fx="bubble-bound-hover" style="--fx-lift: 80%; --fx-tilt: 10deg; --fx-dur: .8s">lift 80% · tilt 10° · .8s</a>
  <a class="tag" href="#" data-fx="bubble-bound-hover" data-demo-remove>Removed Label</a>
  <span data-late-slot></span>
</div>
<script src="../fx-core.js"></script>
<script>
setTimeout(() => document.querySelector("[data-late-slot]").outerHTML = '<a class="tag" href="#" data-fx="bubble-bound-hover">Late-arriving name tag</a>', 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
