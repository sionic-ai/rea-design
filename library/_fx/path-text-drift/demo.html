<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>path-text-drift — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-spacer { height: 90vh; display: grid; place-items: center; color: var(--kf-dim); }
</style>
</head>
<body>
<p class="demo-hint"><b>path-text-drift</b> — Scroll down and the text on the curve flows sideways. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<div class="demo-spacer">Downward</div>
<svg data-fx="path-text-drift" viewBox="0 0 1440 220"><path id="d1" d="M -572.5 100 C -343.35 100, -360.65 154, -131.5 154 C 70 154, 108 60, 309.5 60 C 538.65 60, 521.35 154, 750.5 154 C 979.65 154, 962.35 54, 1191.5 54 C 1420.65 54, 1403.35 154, 1632.5 154"/><text font-size="46"><textPath href="#d1" startOffset="20%">A small line of words rides the curve as you scroll. A small line of words rides the curve as you scroll.</textPath></text></svg>
<svg data-fx="path-text-drift" data-fx-path-text-drift="look: step; cycle: 4; move: 1.5" viewBox="-40 -20 680 360" style="max-width:680px"><ellipse cx="300" cy="160" rx="280" ry="130" fill="var(--kf-ink)"/><path id="d4" d="M 580 160A 280 130 0 0 1 20 160A 280 130 0 0 1 580 160A 280 130 0 0 1 20 160A 280 130 0 0 1 580 160A 280 130 0 0 1 20 160A 280 130 0 0 1 580 160A 280 130 0 0 1 20 160A 280 130 0 0 1 580 160" fill="none"/><text font-size="26" dy="-8" text-anchor="middle"><textPath href="#d4" startOffset="15.95%">First line around the ellipse</textPath></text><text font-size="26" dy="-8" text-anchor="middle"><textPath href="#d4" startOffset="3.45%">Make the second line around the ellipse slightly longer</textPath></text></svg>
<svg data-fx="path-text-drift" data-fx-path-text-drift="from: 80%; to: -50%; scrub: 5; ease: power1.out; start: top bottom; end: bottom center" viewBox="0 0 1440 220"><path id="d5" d="M 0 140 C 360 40, 720 220, 1080 120 S 1440 60, 1800 140"/><text font-size="40"><textPath href="#d5" startOffset="80%">Text that trails behind with scrub — Text that trails behind with scrub — Text that trails behind with scrub</textPath></text></svg>
<svg data-fx="path-text-drift" data-demo-remove viewBox="0 0 1440 220"><path id="d2" d="M 0 120 C 400 20, 1000 220, 1440 120"/><text font-size="40"><textPath href="#d2">Quick-exit curve text — Quick-exit curve text — Quick-exit curve text</textPath></text></svg>
<template data-demo-late><svg data-fx="path-text-drift" data-fx-path-text-drift="delta: -40; lerp: .2" viewBox="0 0 1440 220"><path id="d3" d="M 0 100 C 500 200, 900 0, 1440 100"/><text font-size="40"><textPath href="#d3" startOffset="5%">Late curve text · Late curve text · Late curve text · Late curve text</textPath></text></svg></template>
<div class="demo-spacer">Bottom end</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); window.ScrollTrigger?.refresh(); }, 2500);
</script>
</body>
</html>
