<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>collage-center-grow — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .gap { height: 60vh; display: grid; place-items: center; color: var(--kf-dim); }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(3, 1fr); gap: 20px; height: 100%; padding: 20px; }
  .grid > * { border-radius: 20px; overflow: hidden; }
  .grid .wf-img { height: 100%; }
  .grid .mid { grid-column: 2 / 4; grid-row: 2; position: relative; overflow: visible; }
</style>
</head>
<body>
<p class="demo-hint"><b>collage-center-grow</b> — Scroll. The center photo grows to fill the screen and its corners flatten, then the collection fades.</p>
<div class="gap">Downward</div>
<section data-fx="collage-center-grow">
  <div class="grid" data-fx-part="stage">
    <span class="wf-img"></span><span class="wf-img"></span><span class="wf-img"></span><span class="wf-img"></span>
    <span class="wf-img"></span><div class="mid"><div data-fx-part="grow"><span class="wf-img" data-label="Growing Photo"></span></div></div><span class="wf-img"></span>
    <span class="wf-img"></span><span class="wf-img"></span><span class="wf-img"></span><span class="wf-img"></span>
  </div>
</section>
<div class="gap">Next section</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
