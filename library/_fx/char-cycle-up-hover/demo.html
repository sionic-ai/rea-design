<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>char-cycle-up-hover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { padding: 12px 20px; border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  nav { display: flex; flex-wrap: wrap; gap: 24px 48px; padding: 40px; font: 300 22px/1 var(--kf-font-display); letter-spacing: .03em; }
</style>
</head>
<body>
<p class="demo-hint"><b>char-cycle-up-hover</b> — Hover over the menu letters. They slide up one by one and return from below (width 835 or more).</p>
<nav>
  <a href="#" data-fx="char-cycle-up-hover" data-demo-remove>STATEMENT</a>
  <a href="#" data-fx="char-cycle-up-hover">NEWS</a>
  <a href="#" data-fx="char-cycle-up-hover" data-fx-char-cycle-up-hover="each: 0.05; dur: 0.6">DISCOGRAPHY</a>
  <template data-demo-late><a href="#" data-fx="char-cycle-up-hover">Late-attached menu</a></template>
</nav>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
