<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mask-push-slides — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { padding: 32px 20px; display: grid; gap: 24px; }
  .kv { height: 60vh; min-height: 320px; }
  .kv [data-fx-part="slide"]:nth-child(odd) .wf-img { background-color: var(--kf-accent-soft); }
  .kv .wf-img { background-color: var(--kf-raised); }
</style>
</head>
<body>
<p class="demo-hint"><b>mask-push-slides</b> — Wait and the photo sweeps in large from the edge and changes (top panel 5.4s, bottom panel 2s). <span style="color:var(--kf-dim)">(After 1s one more panel comes in, and one leaves 2.5s later)</span></p>
<section class="demo">
  <div class="kv" data-fx="mask-push-slides">
    <div data-fx-part="slide"><div class="wf-img" data-label="Costume character in front of a train · sunset glow · landscape 16:10"></div></div>
    <div data-fx-part="slide"><div class="wf-img" data-label="Dining scene in the room · indoor light · landscape 16:10"></div></div>
    <div data-fx-part="slide"><div class="wf-img" data-label="Pink train at the platform · daytime · landscape 16:10"></div></div>
  </div>
  <div class="kv" data-demo-remove data-fx="mask-push-slides" data-fx-mask-push-slides="interval: 1.5">
    <div data-fx-part="slide"><div class="wf-img" data-label="Outgoing Panel · Image 1"></div></div>
    <div data-fx-part="slide"><div class="wf-img" data-label="Outgoing Panel · Image 2"></div></div>
  </div>
  <template data-demo-late>
    <div class="kv" data-fx="mask-push-slides" data-fx-mask-push-slides="interval: 2; intensity: .8; dir: -1,1">
      <div data-fx-part="slide"><div class="wf-img" data-label="Late-arriving version · image 1"></div></div>
      <div data-fx-part="slide"><div class="wf-img" data-label="Late-arriving version · image 2"></div></div>
    </div>
  </template>
</section>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../_vendor/three@0.140.2/build/three.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
