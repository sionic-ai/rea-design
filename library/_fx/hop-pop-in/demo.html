<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hop-pop-in — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .row { display: flex; gap: 48px; justify-content: center; align-items: flex-end; padding: 80px 20px; }
  .doodle { width: 120px; height: 90px; fill: var(--kf-accent-soft); stroke: var(--kf-ink); stroke-width: 2; }
  .gap { height: 120vh; }
</style>
</head>
<body>
<p class="demo-hint"><b>hop-pop-in</b> — On open, three hand drawings pop up at .5·.8·1s. Hover over the rightmost drawing (two bounces). Scrolling down triggers some scroll-driven bounces too. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<div class="row" id="row">
  <svg class="doodle" viewBox="0 0 120 90" data-fx="hop-pop-in" style="--fx-delay: .5s"><circle cx="60" cy="45" r="36"/></svg>
  <svg class="doodle" viewBox="0 0 120 90" data-fx="hop-pop-in" style="--fx-delay: .8s" data-demo-remove><rect x="20" y="15" width="80" height="60" rx="12"/></svg>
  <svg class="doodle" viewBox="0 0 120 90" data-fx="hop-pop-in" style="--fx-delay: 1s"><path d="M60 8l50 74H10z"/></svg>
  <div data-fx="hop-pop-in" data-fx-hop-pop-in="look: hop"><svg class="doodle" viewBox="0 0 120 90"><path d="M10 80q50-90 100 0z"/></svg></div>
</div>
<div class="gap"></div>
<div class="row"><svg class="doodle" viewBox="0 0 120 90" data-fx="hop-pop-in" data-fx-hop-pop-in="on: scroll"><circle cx="60" cy="45" r="36"/></svg></div>
<div class="gap"></div>
<template data-demo-late><svg class="doodle" viewBox="0 0 120 90" data-fx="hop-pop-in" data-fx-hop-pop-in="on: ready" style="--fx-delay: .2s"><circle cx="60" cy="45" r="20"/></svg></template>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => document.getElementById("row").append(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
