<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>char-flash-scrub — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { margin: 0; background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .gap { height: 70vh; }
  h2 { max-width: 16ch; margin: 0 auto; padding: 0 20px; font: 500 64px/1.05 var(--kf-font-display); letter-spacing: -.02em; }
</style>
</head>
<body>
<p class="demo-hint"><b>char-flash-scrub</b> — Scroll down. Title characters flash in the accent color one by one from the front, then deepen, and fade back when scrolled up.</p>
<div class="gap"></div>
<h2 data-fx="char-flash-scrub">Your big title goes here across two lines</h2>
<div class="gap"></div>
<h2 data-fx="char-flash-scrub" data-fx-char-flash-scrub="wave: .8">A big headline set across two lines</h2>
<div class="gap"></div>
<div class="gap"></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../../../_shared/vendor/gsap/SplitText.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
(() => {
  gsap.registerPlugin(ScrollTrigger, SplitText);
  const late = document.createElement("h2");
  late.setAttribute("data-fx", "char-flash-scrub");
  late.textContent = "Late-arriving title";
  setTimeout(() => document.body.append(late), 1000);
  setTimeout(() => late.remove(), 2500);
  document.querySelector(".demo-hint").append(" · A title comes in after 1s and drops out after 2.5s (peel off).");
})();
</script>
</body>
</html>
