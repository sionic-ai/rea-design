<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>spring-press-pill — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .row { display: flex; flex-wrap: wrap; gap: 16px; margin: 60px 40px; }
  .pill { display: inline-flex; align-items: center; justify-content: center; gap: 12px; min-width: 200px; height: 52px; padding: 0 12px 0 28px; border-radius: var(--kf-radius-pill); color: var(--kf-on-accent); }
  .pill [data-fx-part="bg"] { background: var(--kf-accent); }
  .pill.line { color: var(--kf-accent); padding: 0 28px; }
  .pill.line [data-fx-part="bg"] { background: none; border: 1px solid var(--kf-accent); }
  .ico { position: relative; width: 34px; height: 34px; }
  .ico [data-fx-part="icon"] { position: absolute; inset: 0; border-radius: 50%; background: var(--kf-surface); }
  .tilt { display: grid; place-items: center; height: 64px; padding: 0 30px; border-radius: var(--kf-radius-pill); color: var(--kf-on-accent); }
  .tilt [data-fx-part="bg"] { background: var(--kf-accent); }
  .tilt [data-fx-part="back"] { background: var(--kf-accent-soft); }
  .tilt [data-fx-part="label"] { display: grid; text-align: center; line-height: 1.3; }
</style>
</head>
<body>
<p class="demo-hint"><b>spring-press-pill</b> — Hover over the button and release — the fill is pressed down, then springs back with a wobble on release. <span style="color:var(--kf-dim)">(After 1s one more button comes in, and after 2.5s one drops out)</span></p>
<div class="row">
  <a class="pill" data-fx="spring-press-pill" href="#"><span data-fx-part="bg"></span>Your button text here<span class="ico"><span data-fx-part="icon"></span></span></a>
  <a class="pill line" data-fx="spring-press-pill" href="#"><span data-fx-part="bg"></span>Retailer 1</a>
  <a class="pill line" data-fx="spring-press-pill" href="#" data-demo-remove><span data-fx-part="bg"></span>Exit button</a>
  <a class="tilt" data-fx="spring-press-pill" data-fx-spring-press-pill="look: tilt" href="#"><span data-fx-part="back"></span><span data-fx-part="bg"></span><span data-fx-part="label"><small>Shopping</small>Your purchase button here</span></a>
  <span data-late-slot></span>
</div>
<script src="../fx-core.js"></script>
<script>
setTimeout(() => document.querySelector("[data-late-slot]").outerHTML = '<a class="pill line" data-fx="spring-press-pill" href="#"><span data-fx-part="bg"></span>Late-arrived Button</a>', 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
