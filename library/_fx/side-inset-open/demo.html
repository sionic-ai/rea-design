<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>side-inset-open — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo-spacer { height: 60vh; display: grid; place-items: center; color: var(--kf-dim); }
  .track { position: relative; height: 220vh; }
  .stage { position: sticky; top: 0; height: 100vh; }
  .pic { position: absolute; inset: 0; background: linear-gradient(160deg, var(--kf-accent), var(--kf-raised)); }
  .gap { height: 40vh; }
</style>
</head>
<body>
<p class="demo-hint"><b>side-inset-open</b> — Scroll down and the side covers open, the photo spreads out and darkens. <span style="color:var(--kf-dim)">(One more track comes in after 1s, and one drops out after 2.5s)</span></p>
<div class="demo-spacer">Scroll down</div>
<section class="track" data-fx="side-inset-open"><div class="stage"><div class="pic" data-fx-part="image"></div></div></section>
<section class="track" data-demo-remove data-fx="side-inset-open" data-fx-side-inset-open="side: 25vw; dim: 1"><div class="stage"><div class="pic" data-fx-part="image"></div></div></section>
<template data-demo-late><section class="track" data-fx="side-inset-open" data-fx-side-inset-open="side: 18vw; dim: .6"><div class="stage"><div class="pic" data-fx-part="image"></div></div></section></template>
<div class="demo-spacer"></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); window.ScrollTrigger?.refresh(); }, 2500);
</script>
</body>
</html>
