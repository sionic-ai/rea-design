<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lens-media-gl — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 20; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 24px; padding: 40px; }
  .box { aspect-ratio: 16 / 9; background: var(--kf-surface); }
  .box canvas { display: block; width: 100%; height: 100%; }
  .pad { height: 80vh; }
</style>
</head>
<body>
<p class="demo-hint"><b>lens-media-gl</b> — Cells bloom into circles as they enter the screen. Hover over a cell to see the lens. <span style="color:var(--kf-dim)">(After 1s one more cell comes in, and one leaves 2.5s later)</span></p>
<div class="grid">
  <div class="box" data-fx="lens-media-gl"><canvas width="640" height="360"></canvas></div>
  <div class="box" data-demo-remove data-fx="lens-media-gl"><canvas width="640" height="360"></canvas></div>
  <template data-demo-late><div class="box" data-fx="lens-media-gl" data-fx-lens-media-gl="dur: .5"><canvas width="640" height="360"></canvas></div></template>
</div>
<div class="pad"></div>
<div class="grid"><div class="box" data-fx="lens-media-gl" data-fx-lens-media-gl="bulge: .2"><canvas width="640" height="360"></canvas></div></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../_vendor/three@0.186.0/three.min.js"></script>
<script>
// Demo source: flowing stripe canvas (colors are for demo, not skin)
const paintAll = (t) => {
  document.querySelectorAll(".box canvas").forEach((c, i) => {
    const x = c.getContext("2d"), s = t / 1000;
    x.fillStyle = i % 2 ? "#2b4a5c" : "#5c3a2b"; /* Not skin: demo source background */
    x.fillRect(0, 0, 640, 360);
    for (let k = 0; k < 10; k++) { x.fillStyle = k % 2 ? "#f0e2c4" : "#8fb4cc"; /* Not skin: demo source line */ x.fillRect(((k * 70 + s * 30) % 700) - 60, 0, 30, 360); }
  });
  requestAnimationFrame(paintAll);
};
requestAnimationFrame(paintAll);
</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
