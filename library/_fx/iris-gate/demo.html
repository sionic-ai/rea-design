<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iris-gate — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .gate { height: 70vh; margin: 24px 20px; display: grid; place-items: center; background: var(--kf-accent-soft); }
  .gate .scene { position: absolute; inset: 0; display: grid; place-items: center; color: var(--kf-dim); }
  .gate button { padding: 0.6em 1.4em; border: 1px solid currentColor; background: none; color: var(--kf-ink); cursor: pointer; }
</style>
</head>
<body>
<p class="demo-hint"><b>iris-gate</b> — A water-drop hole opens. Hover over ”Enter”, then press it. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<section class="gate" data-fx="iris-gate"><div class="scene">Your scene here</div><button type="button" data-fx-part="enter">Enter</button></section>
<section class="gate" data-demo-remove data-fx="iris-gate"><div class="scene">Scene to Be Removed</div><button type="button" data-fx-part="enter">Enter</button></section>
<template data-demo-late><section class="gate" data-fx="iris-gate" data-fx-iris-gate="idle: 0.25; open-dur: 1.5"><div class="scene">Late scene · no button (opened with fx:open)</div></section></template>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); window.ScrollTrigger?.refresh(); }, 2500);
</script>
</body>
</html>
