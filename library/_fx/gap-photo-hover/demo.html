<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gap-photo-hover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { padding: 48px 32px; display: grid; gap: 24px; }
  .demo h3 { margin: 0; font: 300 clamp(48px, 6vw, 96px)/0.86 var(--kf-font-display); letter-spacing: -0.068em; }
</style>
</head>
<body>
<p class="demo-hint"><b>gap-photo-hover</b> — Hover over the big name. The gaps between words widen and a photo opens.</p>
<section class="demo" id="box">
  <h3 data-fx="gap-photo-hover" id="src"><span data-fx-part="word">Procedure</span><span data-fx-part="gap"><span data-fx-part="frame"><span class="wf-img" data-label="Treatment photo · vertical"></span></span></span><span data-fx-part="word">Name one</span></h3>
</section>
<script>
(() => {
  const src = document.getElementById("src");
  const html = src.outerHTML.replace(/\sid="[^"]*"/g, "");
  const make = () => { const t = document.createElement("template"); t.innerHTML = html; return t.content.firstElementChild; };
  const gone = make();
  src.after(gone);
  setTimeout(() => src.after(make()), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s, one more line comes in (the late one), and after 2.5s one drops out (the removal).");
})();
</script>
<script src="../fx-core.js"></script>
</body>
</html>
