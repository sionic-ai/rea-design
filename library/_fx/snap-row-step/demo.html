<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>snap-row-step — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .row { margin: 40px 0; }
  .row__head { display: flex; justify-content: space-between; padding: 0 24px 16px; font: 500 12px/1.4 var(--kf-font-mono); text-transform: uppercase; }
  .row__head button { background: none; border: 0; padding: 0; cursor: pointer; margin-left: 12px; }
  .card { height: 300px; background: var(--kf-raised); padding: 24px; font: 500 12px/1.4 var(--kf-font-mono); }
  @media (max-width: 1024px) { .row { --fx-flex: calc(100% / 1.3); } }
</style>
</head>
<body>
<p class="demo-hint"><b>snap-row-step</b> — Press Next·Prev. The row shifts one slot at a time, and when pushed by hand it snaps to the slot head.</p>
<section class="row" data-fx="snap-row-step">
  <div class="row__head"><span>Row Title</span><span><button type="button" data-fx-part="prev">Prev</button><button type="button" data-fx-part="next">Next</button></span></div>
  <div data-fx-part="track">
    <article class="card">Cell 01</article><article class="card">Cell 02</article><article class="card">Cell 03</article><article class="card">Cell 04</article>
    <article class="card">Cell 05</article><article class="card">Cell 06</article><article class="card">Cell 07</article><article class="card">Cell 08</article>
  </div>
</section>
<script>
// Late arrivals and removals — checks that fx-core attaches to an element added after 1s and detaches from an element removed after 2.5s
(() => {
  const host = document.querySelector('[data-fx~="snap-row-step"]');
  if (!host) return;
  const html = host.outerHTML;
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  host.after(gone);
  setTimeout(() => host.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical one comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
