<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>direction-tile-hover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .list { max-width: 720px; padding: 40px 20px; }
  .list a { display: block; padding: 16px 0; font-size: 40px; border-bottom: 1px solid var(--kf-line); }
</style>
</head>
<body>
<p class="demo-hint"><b>direction-tile-hover</b> — Move the mouse in and out of a row from above, below or the side. The tile covers from the entry side and exits toward the exit side. <span style="color:var(--kf-dim)">(After 1s one more line comes in, and one leaves 2.5s later)</span></p>
<nav class="list">
  <a href="#" data-fx="direction-tile-hover"><span data-fx-part="tile"></span>Hero</a>
  <a href="#" data-fx="direction-tile-hover" data-fx-direction-tile-hover="axis: y"><span data-fx-part="tile"></span>About (top and bottom only)</a>
  <a href="#" data-fx="direction-tile-hover" data-demo-remove><span data-fx-part="tile"></span>Dropped Line</a>
  <a href="#" data-fx="direction-tile-hover" data-fx-direction-tile-hover="push: 0"><span data-fx-part="tile"></span>A line with no pushing</a>
  <template data-demo-late><a href="#" data-fx="direction-tile-hover"><span data-fx-part="tile"></span>Late-entering Row</a></template>
</nav>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); }, 2500);
</script>
</body>
</html>
