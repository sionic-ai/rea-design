<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>panel-meet-intro — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { margin: 0; color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { margin: 0; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-kv { position: relative; height: 80vh; overflow: hidden; }
  .demo-kv [data-fx-part="lead"] { width: calc(100% - 264px); height: 100%; }
  .demo-kv [data-fx-part="lead"] .wf-img { width: 100%; height: 100%; }
  .demo-kv [data-fx-part="side"] { position: absolute; top: 0; right: 0; width: 370px; height: 100%; padding: 60px 42px 0 0; background: var(--kf-contrast-bg); color: var(--kf-contrast-ink); text-align: right; }
  .demo-kv [data-fx-part="after"] { display: grid; gap: 20px; font: 600 18px/1.2 var(--kf-font-display); }
  .demo-small { position: relative; height: 140px; margin: 24px; overflow: hidden; }
  .demo-small [data-fx-part="lead"] { width: 70%; height: 100%; background: var(--kf-surface); }
  .demo-small [data-fx-part="side"] { position: absolute; top: 0; left: 0; width: 40%; height: 100%; background: var(--kf-accent); }
  @media (max-width: 1080px) { .demo-kv { --fx-shift: 0px; } .demo-kv [data-fx-part="lead"] { width: 100%; } .demo-kv [data-fx-part="side"] { top: auto; bottom: 0; width: 100%; height: 210px; } }
</style>
</head>
<body>
<p class="demo-hint"><b>panel-meet-intro</b> — 0.6s after opening, the photo panel and side panel slide 106px together and interlock, and the menu appears after 1.5s (refresh to see it again) <span style="opacity:.6">(After 1s one more panel comes in, and one leaves 2.5s later)</span></p>
<section class="demo-kv" data-fx="panel-meet-intro">
  <div data-fx-part="lead"><div class="wf-img" data-label="Large tree base and moss · forest shade · tight portrait close-up filling the frame"></div></div>
  <aside data-fx-part="side"><nav data-fx-part="after"><a href="#">Menu 1</a><a href="#">Menu 2</a><a href="#">Menu 3</a></nav></aside>
</section>
<div class="demo-small" data-demo-remove data-fx="panel-meet-intro"><div data-fx-part="lead">Panel to Be Removed</div></div>
<template data-demo-late><div class="demo-small" data-fx="panel-meet-intro" data-fx-panel-meet-intro="look: left; delay: 0"><div data-fx-part="lead"></div><div data-fx-part="side"></div></div></template>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
