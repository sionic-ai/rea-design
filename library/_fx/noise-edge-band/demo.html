<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>noise-edge-band — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .band { padding: 120px 40px; color: var(--kf-on-accent); font: 700 40px/1.2 var(--kf-font-display); margin: 0 0 -40px; }
  .gap { height: 60vh; display: grid; place-items: center; color: var(--kf-dim); }
</style>
</head>
<body>
<p class="demo-hint"><b>noise-edge-band</b> — The edge of the section backdrop panel wobbles and flows. Scroll down to see the stacked panel too. <span style="color:var(--kf-dim)">(After 1s one more panel comes in, and one leaves 2.5s later)</span></p>
<section class="band" data-demo-remove data-fx="noise-edge-band">Both top and bottom</section>
<div class="gap">Downward</div>
<section class="band" data-fx="noise-edge-band" data-fx-noise-edge-band="edge: top; amp: .02" style="--fx-band: var(--kf-ink)">Top edge only · amplitude 2%</section>
<template data-demo-late><section class="band" data-fx="noise-edge-band" data-fx-noise-edge-band="edge: bottom; flow: .6" style="--fx-band: var(--kf-accent-text)">Bottom edge only · flows to the right</section></template>
<div class="gap">Footer</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
