<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tilt-fill-btn — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .row { display: flex; flex-wrap: wrap; gap: 24px; align-items: center; padding: 48px 20px; font-size: 16px; }
  .dark { background: var(--kf-contrast-bg); color: var(--kf-contrast-ink); }
</style>
</head>
<body>
<p class="demo-hint"><b>tilt-fill-btn</b> — Hover over the button. A tilted panel fills up and the text rolls over to change.</p>
<div class="row" id="row">
  <a href="#" data-fx="tilt-fill-btn"><span data-fx-part="bg"><span data-fx-part="fill"></span></span><span data-fx-part="inner"><span data-fx-part="label"><span>Your button text here</span></span><span data-fx-part="icon"><span><span><svg viewBox="0 0 24 24" fill="none"><path d="M5 12h14m-6-6 6 6-6 6" stroke="currentColor" stroke-width="2"/></svg><svg viewBox="0 0 24 24" fill="none"><path d="M5 12h14m-6-6 6 6-6 6" stroke="currentColor" stroke-width="2"/></svg><svg viewBox="0 0 24 24" fill="none"><path d="M5 12h14m-6-6 6 6-6 6" stroke="currentColor" stroke-width="2"/></svg></span></span></span></span></a>
  <a href="#" data-fx="tilt-fill-btn" data-demo-remove><span data-fx-part="bg"><span data-fx-part="fill"></span></span><span data-fx-part="inner"><span data-fx-part="label"><span>Button to Be Removed</span></span></span></a>
  <a href="#" data-fx="tilt-fill-btn" data-fx-tilt-fill-btn="look: bare"><span data-fx-part="bg"><span data-fx-part="fill"></span></span><span data-fx-part="inner"><span data-fx-part="label"><span>Backgroundless Type</span></span><span data-fx-part="icon"><span><span><svg viewBox="0 0 24 24" fill="none"><path d="M5 12h14m-6-6 6 6-6 6" stroke="currentColor" stroke-width="2"/></svg><svg viewBox="0 0 24 24" fill="none"><path d="M5 12h14m-6-6 6 6-6 6" stroke="currentColor" stroke-width="2"/></svg><svg viewBox="0 0 24 24" fill="none"><path d="M5 12h14m-6-6 6 6-6 6" stroke="currentColor" stroke-width="2"/></svg></span></span></span></span></a>
</div>
<div class="row dark">
  <a href="#" data-fx="tilt-fill-btn" data-fx-tilt-fill-btn="look: light" style="--fx-drop: 230%; min-width: 260px"><span data-fx-part="bg"><span data-fx-part="fill"></span></span><span data-fx-part="inner" style="justify-content: space-between"><span data-fx-part="label"><span>Light type on a dark panel</span></span><span data-fx-part="icon"><span><span><svg viewBox="0 0 24 24" fill="none"><path d="M5 12h14m-6-6 6 6-6 6" stroke="currentColor" stroke-width="2"/></svg><svg viewBox="0 0 24 24" fill="none"><path d="M5 12h14m-6-6 6 6-6 6" stroke="currentColor" stroke-width="2"/></svg><svg viewBox="0 0 24 24" fill="none"><path d="M5 12h14m-6-6 6 6-6 6" stroke="currentColor" stroke-width="2"/></svg></span></span></span></span></a>
</div>
<template data-demo-late><a href="#" data-fx="tilt-fill-btn"><span data-fx-part="bg"><span data-fx-part="fill"></span></span><span data-fx-part="inner"><span data-fx-part="label"><span>Late-arriving button</span></span></span></a></template>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => document.getElementById("row").append(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
