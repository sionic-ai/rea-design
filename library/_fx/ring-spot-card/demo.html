<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ring-spot-card — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<link rel="stylesheet" href="../char-blur-rise/fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .scene { position: relative; height: 70vh; margin: 20px; background: var(--kf-raised); border: 1px solid var(--kf-line); }
  .spot { position: absolute; display: flex; align-items: center; gap: 10px; padding: 0 12px 0 0; border: 0; background: none; color: var(--kf-ink); font: 400 13px/1 var(--kf-font-sans); }
  .card { position: absolute; width: min(360px, 80%); padding: 20px; border-radius: var(--kf-radius-md); background: var(--kf-surface); border: 1px solid var(--kf-line); }
  .card h3 { font: 400 22px/1.3 var(--kf-font-display); }
</style>
</head>
<body>
<p class="demo-hint"><b>ring-spot-card</b> — Hover over the ring (dots shrink and the inner circle spreads). Click to open the card, click outside or press Esc to close.</p>
<section class="scene">
  <button class="spot" style="left: 10%; top: 20%" data-fx="ring-spot-card" aria-controls="c1" data-demo-remove><span data-fx-part="ring"></span>Point 01</button>
  <article class="card" id="c1" style="left: 10%; top: calc(20% + 40px)"><h3 data-fx="char-blur-rise" data-fx-char-blur-rise="on: state; split: word">A card headline</h3><p data-fx="char-blur-rise" data-fx-char-blur-rise="on: state; split: word">Your two body lines here.</p></article>
  <button class="spot" style="left: 55%; top: 50%" data-fx="ring-spot-card" aria-controls="c2"><span data-fx-part="ring"></span>Point 02</button>
  <article class="card" id="c2" style="left: 40%; top: calc(50% + 40px)"><h3>Second card</h3><p>Your one body line here.</p></article>
  <button class="spot" style="left: 30%; top: 75%" data-fx="ring-spot-card"><span data-fx-part="ring"></span>No card</button>
  <template data-demo-late><button class="spot" style="left: 75%; top: 20%" data-fx="ring-spot-card" aria-controls="c2"><span data-fx-part="ring"></span>Late</button></template>
</section>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/CustomEase.min.js"></script>
<script src="../fx-core.js"></script>
<script src="../char-blur-rise/fx.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
