<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>random-jiggle — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.6 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { display: flex; flex-wrap: wrap; gap: 40px; padding: 60px 20px; }
  .shelf { width: 320px; }
  .shelf rect.box { fill: var(--kf-accent); stroke: var(--kf-ink); stroke-width: 2; }
  .shelf .board { fill: var(--kf-line); }
</style>
</head>
<body>
<p class="demo-hint"><b>random-jiggle</b> — One of the boxes on the shelf shakes at random every .5~2 seconds. Hover over a box. <span style="color:var(--kf-dim)">(One more shelf comes in after 1s, and one drops out after 2.5s)</span></p>
<section class="demo">
  <svg class="shelf" viewBox="0 0 320 120" data-fx="random-jiggle"><rect class="board" x="0" y="100" width="320" height="8"/><g data-fx-part="item"><rect class="box" x="20" y="50" width="50" height="50"/></g><g data-fx-part="item"><rect class="box" x="90" y="30" width="40" height="70"/></g><g data-fx-part="item"><rect class="box" x="150" y="60" width="60" height="40"/></g><g data-fx-part="item"><rect class="box" x="230" y="40" width="50" height="60"/></g></svg>
  <svg class="shelf" viewBox="0 0 320 120" data-fx="random-jiggle" data-fx-random-jiggle="angle: 7-12; every: .3-.8" data-demo-remove><rect class="board" x="0" y="100" width="320" height="8"/><g data-fx-part="item"><rect class="box" x="40" y="40" width="60" height="60"/></g><g data-fx-part="item"><rect class="box" x="140" y="50" width="40" height="50"/></g><g data-fx-part="item"><rect class="box" x="220" y="30" width="50" height="70"/></g></svg>
  <svg class="shelf" viewBox="0 0 320 120" data-fx="random-jiggle"></svg>
  <template data-demo-late><svg class="shelf" viewBox="0 0 320 120" data-fx="random-jiggle" data-fx-random-jiggle="hover: false"><rect class="board" x="0" y="100" width="320" height="8"/><g data-fx-part="item"><rect class="box" x="60" y="50" width="50" height="50"/></g><g data-fx-part="item"><rect class="box" x="180" y="40" width="60" height="60"/></g></svg></template>
</section>

<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
