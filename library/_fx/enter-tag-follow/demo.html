<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>enter-tag-follow — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; min-height: 100vh; }
  .demo-hint { margin: 0; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-out { padding: 20px; font: 500 13px/1.4 var(--kf-font-mono); color: var(--kf-dim); }
</style>
</head>
<body>
<p class="demo-hint"><b>enter-tag-follow</b> — Move the mouse and the tag follows .66s late. Click anywhere and it drops down, vanishes, and you enter.</p>
<p class="demo-out" id="out">Not yet entered</p>
<div data-fx="enter-tag-follow"><div data-fx-part="tag">[:: Click to enter + sound on ::]</div></div>
<script>
// Late arrivals and removals — one more tag comes in after 1s, and the one before it drops out after 2.5s (detach)
(() => {
  const first = document.querySelector('[data-fx~="enter-tag-follow"]');
  const make = (t) => { const d = document.createElement("div"); d.dataset.fx = "enter-tag-follow"; d.dataset.fxEnterTagFollow = "lag: 1.2"; d.innerHTML = `<div data-fx-part="tag">${t}</div>`; return d; };
  setTimeout(() => document.body.append(make("[:: Late-arriving tag ::]")), 1000);
  setTimeout(() => first.remove(), 2500);
  document.addEventListener("fx:enter", () => { document.getElementById("out").textContent = "fx:enter received — Enter"; });
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
