<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>word-gap-scrub — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-spacer { height: 90vh; display: grid; place-items: center; color: var(--kf-dim); }
  h2 { justify-content: center; margin: 0; padding: 20vh 0; font: 800 clamp(2rem, 8vw, 8rem)/1 var(--kf-font-display); }
  [data-fx-part="photo"].wf-img { border: 0; }
</style>
</head>
<body>
<p class="demo-hint"><b>word-gap-scrub</b> — Scroll down. The photo slot between two words widens as you scroll.</p>
<div class="demo-spacer">Scroll down</div>
<h2 data-fx="word-gap-scrub">Word<span data-fx-part="gap"><span class="wf-img" data-fx-part="photo" data-label="Hands · Workbench"></span></span>Word</h2>
<h2 data-demo-remove data-fx="word-gap-scrub" data-fx-word-gap-scrub="to: 3em">Soon<span data-fx-part="gap"><span class="wf-img" data-fx-part="photo" data-label="Photo"></span></span>Omission</h2>
<template data-demo-late><h2 data-fx="word-gap-scrub" data-fx-word-gap-scrub="from: 0.4em; to: 5em; scrub: .6">Late<span data-fx-part="gap"><span class="wf-img" data-fx-part="photo" data-label="Photo"></span></span>Coming in</h2></template>
<div class="demo-spacer"></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script>gsap.registerPlugin(ScrollTrigger);</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); ScrollTrigger.refresh(); }, 2500);
</script>
</body>
</html>
