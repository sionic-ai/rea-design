<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>stretch-invert-cursor — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; min-height: 140vh; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; padding: 40px 20px; }
  .card { aspect-ratio: 4 / 3; background: var(--kf-raised); display: grid; place-items: center; }
  .dark { background: var(--kf-contrast-bg); color: var(--kf-contrast-ink); }
</style>
</head>
<body>
<p class="demo-hint"><b>stretch-invert-cursor</b> — Swing the mouse fast. The ball stretches and follows, becoming a ring over links and a text circle over label spots. <span style="color:var(--kf-dim)">(A cursor comes in after 1s, and the first one drops out after 2.5s)</span></p>
<section class="demo">
  <a class="card" href="#">Link — loop</a>
  <div class="card dark" data-cursor="channel" data-cursor-label="CHANNEL">Channel switch — Text circle</div>
  <div class="card" data-cursor="play">Playback — ball as is</div>
</section>
<div data-fx="stretch-invert-cursor" aria-hidden="true" data-demo-remove><span data-fx-part="ball"></span><span data-fx-part="label"></span></div>
<template data-demo-late><div data-fx="stretch-invert-cursor" data-fx-stretch-invert-cursor="lerp: .12; max: .5" aria-hidden="true"><span data-fx-part="ball"></span><span data-fx-part="label"></span></div></template>
<div data-fx="stretch-invert-cursor"></div>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
