<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>veil-sweep-photo — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: sticky; top: 0; z-index: 10; margin: 0; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 40px; width: min(1000px, 90vw); margin: 70vh auto 60vh; }
  .row figure { margin: 0; aspect-ratio: 3 / 2; }
  .row .wf-img { height: 100%; }
</style>
</head>
<body>
<p class="demo-hint"><b>veil-sweep-photo</b> Scroll down. When the top edge of the photo cell touches the middle of the screen, two gray sheets fold away to the right and a white panel peels back diagonally, clearing the photo. The second cell uses speed: 1 (the original value, 3 seconds).</p>
<div class="row" id="row">
  <figure data-fx="veil-sweep-photo"><div class="wf-img" data-fx-part="photo" data-label="Office view · daylight · landscape 3:2"></div></figure>
  <figure data-fx="veil-sweep-photo" data-fx-veil-sweep-photo="speed: 1"><div class="wf-img" data-fx-part="photo" data-label="Meeting room · window light · landscape 3:2"></div></figure>
</div>
<script>
// Late arrivals and removals — after 1 second one more cell comes in (late arrival), and after 2.5 seconds the first cell leaves (detach)
(() => {
  const row = document.getElementById("row");
  const first = row.firstElementChild;
  setTimeout(() => { const f = document.createElement("figure"); f.dataset.fx = "veil-sweep-photo"; f.innerHTML = '<div class="wf-img" data-fx-part="photo" data-label="Late-arriving cell · landscape 3:2"></div>'; row.append(f); }, 1000);
  setTimeout(() => first.remove(), 2500);
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
