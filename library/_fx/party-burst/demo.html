<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>party-burst — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { padding: 24px 20px 200px; display: grid; gap: 40px; }
  .box { min-height: 70vh; border: 1px solid var(--kf-line); display: grid; place-items: center; font-size: 24px; }
  button { padding: 8px 14px; border: 1px solid var(--kf-line); background: var(--kf-surface); color: var(--kf-ink); cursor: pointer; }
</style>
</head>
<body>
<p class="demo-hint"><b>party-burst</b> When the panel appears, confetti bursts from both bottom corners and balloons rise. Hover over a balloon to pop it. <button onclick="party.dispatchEvent(new CustomEvent('fx:burst'))">Burst again</button> <span style="color:var(--kf-dim)">(After 1s one more panel comes in, and one leaves 2.5s later)</span></p>
<section class="demo">
  <div class="box" id="party" data-fx="party-burst">News to celebrate</div>
  <div class="box" data-demo-remove data-fx="party-burst" data-fx-party-burst="count: 20; balloons: 2">Dropped Panel</div>
  <template data-demo-late><div class="box" data-fx="party-burst" data-fx-party-burst="trickle: 0">Late-entering Panel</div></template>
</section>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); }, 2500);
</script>
</body>
</html>
