<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>heart-mark-cursor — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { margin: 0; background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .stage { padding: 12vh 8vw; display: flex; gap: 48px; align-items: center; flex-wrap: wrap; min-height: 70vh; }
  .pet { width: 180px; aspect-ratio: 1; border-radius: 50%; background: var(--kf-raised); display: grid; place-items: center; color: var(--kf-dim); }
  a { color: var(--kf-ink); }
</style>
</head>
<body>
<p class="demo-hint"><b>heart-mark-cursor</b> — Move the mouse. The cursor becomes a heart and fills up over links, and small hearts float up when you hover over or press a round panel. <span style="color:var(--kf-dim)">(After 1s one more panel comes in, and one leaves 2.5s later)</span></p>
<div class="stage" data-fx="heart-mark-cursor">
  <a href="#">Hover over the link</a>
  <div class="pet" data-fx-part="pet">Petting</div>
  <div class="pet" data-fx-part="pet" data-demo-remove>Erased</div>
  <template data-demo-late><div class="pet" data-fx-part="pet">Enters late</div></template>
</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
