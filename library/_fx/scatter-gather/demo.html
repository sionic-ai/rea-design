<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>scatter-gather — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { padding: 48px 20px; }
  .demo-btn { display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 16px; border: 1px solid var(--kf-line); border-radius: var(--kf-radius-sm); background: var(--kf-surface); color: var(--kf-ink); cursor: pointer; }
  .demo-card { padding: 20px; border: 1px solid var(--kf-line); border-radius: var(--kf-radius-md); background: var(--kf-surface); }
  .demo-spacer { height: 90vh; display: grid; place-items: center; color: var(--kf-dim); }
  .stars { height: 100svh; } .stars [data-fx-part="cover"] { display: grid; place-items: center; background: var(--kf-bg); }
  .stars [data-fx-part="cover"] p { font: 400 44px/1.15 var(--kf-font-display); text-align: center; } .stars [data-fx-part="cover"] span { color: var(--kf-accent); }
  .stars [data-fx-part="hint"] { position: absolute; left: 50%; top: 50%; translate: -50% -50%; color: var(--kf-dim); font: 12px var(--kf-font-mono); }
</style>
</head>
<body>
<p class="demo-hint"><b>scatter-gather</b> — Scroll and the section pins, the cover sentence clears, then scattered dots gather, turn ink-colored, and lines connect into a constellation.</p>
<div class="demo-spacer">Scroll down ↓</div><section class="stars" data-fx="scatter-gather" data-fx-scatter-gather="edges: 0-1,1-5,5-2,2-3,5-6,4-5,4-8,8-9,9-10,7-8,8-12,12-13,9-13,11-12; length: 2000"><div data-fx-part="cover"><p>I <span>Constellation</span><br>Of everything that has happened so far…</p></div><i data-fx-part="dot" data-from="0.38,0.1" data-to="0.12,0.12" style="--c:var(--kf-accent)"></i><i data-fx-part="dot" data-from="0.79,0.14" data-to="0.3,0.1" style="--c:var(--kf-ink-soft)"></i><i data-fx-part="dot" data-from="0.4,0.26" data-to="0.62,0.1" style="--c:var(--kf-dim)"></i><i data-fx-part="dot" data-from="0.05,0.5" data-to="0.88,0.12" style="--c:var(--kf-accent-text)"></i><i data-fx-part="dot" data-from="0.29,0.55" data-to="0.2,0.36" style="--c:var(--kf-line)"></i><i data-fx-part="dot" data-from="0.62,0.37" data-to="0.46,0.3" style="--c:var(--kf-accent)"></i><i data-fx-part="dot" data-from="0.88,0.3" data-to="0.76,0.3" style="--c:var(--kf-ink-soft)"></i><i data-fx-part="dot" data-from="0.15,0.7" data-to="0.1,0.56" style="--c:var(--kf-dim)"></i><i data-fx-part="dot" data-from="0.55,0.72" data-to="0.34,0.58" style="--c:var(--kf-accent-text)"></i><i data-fx-part="dot" data-from="0.7,0.62" data-to="0.6,0.52" style="--c:var(--kf-line)"></i><i data-fx-part="dot" data-from="0.45,0.44" data-to="0.88,0.5" style="--c:var(--kf-accent)"></i><i data-fx-part="dot" data-from="0.92,0.64" data-to="0.22,0.78" style="--c:var(--kf-ink-soft)"></i><i data-fx-part="dot" data-from="0.24,0.3" data-to="0.5,0.8" style="--c:var(--kf-dim)"></i><i data-fx-part="dot" data-from="0.66,0.86" data-to="0.8,0.76" style="--c:var(--kf-accent-text)"></i><p data-fx-part="hint">Scroll</p></section><div class="demo-spacer"></div>
<script>
// Late arrivals and removals — checks that fx-core attaches to an element added after 1s and detaches from an element removed after 2.5s
(() => {
  const src = document.querySelector('[data-fx~="scatter-gather"]');
  if (!src) return;
  const html = src.outerHTML.replace(/\sid="[^"]*"/g, "");
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => (src.closest(".pin-spacer") || src).after(make("late")), 1000); // Once pinned the panel gets wrapped in a pin-spacer, so place it outside that
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical one comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
