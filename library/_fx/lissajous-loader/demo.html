<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lissajous-loader — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: relative; z-index: 1; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { padding: 48px 20px; }
  .box { position: relative; height: 260px; margin-top: 16px; border: 1px solid var(--kf-line); overflow: hidden; }
  .box [data-fx] { position: absolute; }
</style>
</head>
<body>
<p class="demo-hint"><b>lissajous-loader</b> — On open, a curtain with a spinning curve lifts after a 1.6s wait (fake work). The curtain in the box below comes in after 1s and soon lifts.</p>
<div data-fx="lissajous-loader" id="cover"></div>
<section class="demo">
  <div class="box"><div data-fx="lissajous-loader" data-demo-remove></div></div>
  <div class="box" id="late"></div>
</section>
<template data-demo-late><div data-fx="lissajous-loader" data-fx-lissajous-loader="a: 1; b: 2; speed: 1.2; hold: 0; fade: .3"></div></template>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
requestAnimationFrame(() => document.getElementById("cover").dispatchEvent(new CustomEvent("fx:wait", { detail: new Promise((r) => setTimeout(r, 1600)) })));
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => document.getElementById("late").append(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
