<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dash-solid-hover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 500 15px/1.6 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 10; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .list { max-width: 520px; margin: 64px auto; display: grid; gap: 4px; }
  .list a { display: flex; justify-content: space-between; padding: 18px 8px; }
</style>
</head>
<body>
<p class="demo-hint"><b>dash-solid-hover</b> — Hover over a row. The dashed line folds to the right and the solid line unfolds from the left. <span style="color:var(--kf-dim)">(After 1s one more line comes in, and one leaves 2.5s later)</span></p>
<div class="list">
  <a href="#" data-fx="dash-solid-hover">Application guide · Admissions schedule <span>›</span></a>
  <a href="#" data-fx="dash-solid-hover">Tuition Guide <span>›</span></a>
  <a href="#" data-fx="dash-solid-hover" data-demo-remove>Dropped Line <span>›</span></a>
</div>
<template data-demo-late><div class="list"><a href="#" data-fx="dash-solid-hover" style="--fx-width: 2px; --fx-dur: .6s">Late-added line (2px·.6s) <span>›</span></a></div></template>
<script src="../fx-core.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
