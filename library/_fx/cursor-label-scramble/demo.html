<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cursor-label-scramble — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { padding: 48px 20px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
  .card { display: grid; place-items: center; aspect-ratio: 4 / 3; border: 1px solid var(--kf-line); color: inherit; text-decoration: none; font-weight: 700; }
</style>
</head>
<body>
<p class="demo-hint"><b>cursor-label-scramble</b> — Hover over the card. The label beside the cursor unfolds and the text gathers.</p>
<section class="demo">
  <a class="card" href="#" data-fx="cursor-label-scramble" data-fx-cursor-label-scramble="text: View">Card 1</a>
  <a class="card" href="#" data-fx="cursor-label-scramble" data-fx-cursor-label-scramble="text: Client Name 02">Card 2</a>
  <a class="card" href="#" data-fx="cursor-label-scramble" data-fx-cursor-label-scramble="text: Play; look: dark">Dark label</a>
</section>
<script>
(() => {
  const src = document.querySelector('[data-fx~="cursor-label-scramble"]');
  const html = src.outerHTML;
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => src.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s one more card comes in, and after 2.5s one drops out.");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrambleTextPlugin.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
