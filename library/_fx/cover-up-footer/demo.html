<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cover-up-footer — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.6 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .gap { height: 120vh; display: grid; place-items: center; color: var(--kf-dim); }
  .end { min-height: 70vh; padding: 60px 40px; background: var(--kf-surface); border-top: 1px solid var(--kf-line); font-size: 40px; }
  .site-foot { min-height: 80vh; padding: 60px 40px; background: var(--kf-contrast-bg); color: var(--kf-contrast-ink); font-size: 60px; }
</style>
</head>
<body>
<p class="demo-hint"><b>cover-up-footer</b> — Scroll all the way down. The last section stops and a dark-ink footer rises from below to cover it. <span style="color:var(--kf-dim)">(After 1s one more empty sheet attaches, then after 2.5s it drops out)</span></p>
<div class="gap">Downward</div>
<section class="end" data-fx="cover-up-footer" data-fx-cover-up-footer="sel: .site-foot">Your final section here</section>
<div data-late-slot></div>
<footer class="site-foot fx-cover-foot" data-fx-part="footer">Your footer here</footer>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script>gsap.registerPlugin(ScrollTrigger);</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelector("[data-late-slot]").outerHTML = '<section class="end" data-fx="cover-up-footer" data-demo-remove>Empty Footer section (no footer)</section>', 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
