<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tint-fill-card-hover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { display: grid; grid-template-columns: repeat(3, 1fr); border-block: 1px solid var(--kf-line); margin-top: 8vh; }
  .demo > a { display: block; border-right: 1px solid var(--kf-line); color: inherit; text-decoration: none; }
  .demo > a:last-child { border-right: 0; }
  .demo [data-fx-part="photo"] { aspect-ratio: 3 / 2; background: linear-gradient(135deg, var(--kf-accent-soft), var(--kf-accent) 60%, var(--kf-ink)); }
  .demo h3 { padding: 30px; font-size: 22px; font-weight: 400; }
</style>
</head>
<body>
<p class="demo-hint"><b>tint-fill-card-hover</b> — Hover over a cell. The background fills and the black-and-white photo takes on color. <span style="color:var(--kf-dim)">(After 1s one more cell comes in, and one leaves 2.5s later)</span></p>
<section class="demo" id="box">
  <a href="#" data-fx="tint-fill-card-hover"><h3>Your article title here</h3><div data-fx-part="photo"></div></a>
  <a href="#" data-fx="tint-fill-card-hover" style="--fx-fill: var(--kf-ink); --fx-fill-ink: var(--kf-bg)"><div data-fx-part="photo"></div><h3>Filled with the second color</h3></a>
  <a href="#" data-fx="tint-fill-card-hover" style="--fx-fill: var(--kf-surface); --fx-fill-ink: var(--kf-ink)" data-demo-remove><h3>Exit blank cell</h3><div data-fx-part="photo"></div></a>
</section>
<script src="../fx-core.js"></script>
<script>
setTimeout(() => { const a = document.createElement("a"); a.href = "#"; a.dataset.fx = "tint-fill-card-hover"; a.innerHTML = '<h3>Late cell</h3><div data-fx-part="photo"></div>'; document.getElementById("box").append(a); }, 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
