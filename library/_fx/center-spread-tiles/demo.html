<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>center-spread-tiles — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); overflow-x: hidden; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .board { display: grid; grid-template-columns: repeat(5, 1fr); }
  .board + .board { margin-top: 40px; grid-template-columns: repeat(3, 1fr); }
  .tile { aspect-ratio: 1; border: 1px solid var(--kf-line); background: var(--kf-surface); position: relative; overflow: hidden; }
  .tile > div { position: absolute; inset: 18%; border-radius: 50%; background: color-mix(in oklab, var(--kf-accent) 30%, var(--kf-bg)); display: grid; place-items: center; font: 700 22px/1 var(--kf-font-sans); color: var(--kf-ink); }
</style>
</head>
<body>
<p class="demo-hint"><b>center-spread-tiles</b> — On refresh, the cells spread out from the screen center in a shuffled order and settle into place. <span style="color:var(--kf-dim)">(After 1s one more panel comes in, and one leaves 2.5s later)</span></p>
<div class="board" data-fx="center-spread-tiles" data-demo-remove>
  <div class="tile" data-fx-part="tile"><div data-fx-part="blur">A</div></div><div class="tile" data-fx-part="tile"><div data-fx-part="blur">B</div></div><div class="tile" data-fx-part="tile"><div data-fx-part="blur">C</div></div><div class="tile" data-fx-part="tile"><div data-fx-part="blur">D</div></div><div class="tile" data-fx-part="tile"><div data-fx-part="blur">E</div></div>
</div>
<div class="board" data-fx="center-spread-tiles">
  <div class="tile" data-fx-part="tile"><div data-fx-part="blur">1</div></div><div class="tile" data-fx-part="tile"><div data-fx-part="blur">2</div></div><div class="tile" data-fx-part="tile"><div data-fx-part="blur">3</div></div><div class="tile" data-fx-part="tile"><div data-fx-part="blur">4</div></div><div class="tile" data-fx-part="tile"><div data-fx-part="blur">5</div></div><div class="tile" data-fx-part="tile"></div>
</div>
<template data-demo-late><div class="board" data-fx="center-spread-tiles" data-fx-center-spread-tiles="each: .1; dur: 1.2"><div class="tile" data-fx-part="tile"><div>Go</div></div><div class="tile" data-fx-part="tile"><div>Me</div></div><div class="tile" data-fx-part="tile"><div>All</div></div></div></template>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
