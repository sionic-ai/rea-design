<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>slash-band-reveal — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; padding: 40px 20px 120vh; }
  .card { min-height: 240px; padding: 20px; border-radius: 16px; background: var(--kf-accent-soft); font-weight: 700; font-size: 22px; }
  .card.wide { grid-column: 1 / -1; min-height: 320px; background: var(--kf-surface); }
  .card.later { margin-top: 90vh; }
</style>
</head>
<body>
<p class="demo-hint"><b>slash-band-reveal</b> — On open, cards appear swept in by diagonal hatching. Scroll down and late-arriving cards sweep in when they become visible.</p>
<section class="demo" id="demo">
  <div class="card" data-fx="slash-band-reveal">One card</div>
  <div class="card" data-fx="slash-band-reveal" style="--fx-color: var(--kf-ink)">Two cards (ink band)</div>
  <div class="card" id="gone" data-fx="slash-band-reveal">Card to Be Removed</div>
  <div class="card wide" data-fx="slash-band-reveal" data-fx-slash-band-reveal="look: wide">Wide panel (wide — band 600px · 1.5s)</div>
</section>
<script>
  setTimeout(() => { const c = document.createElement("div"); c.className = "card later"; c.dataset.fx = "slash-band-reveal"; c.textContent = "Late-arriving card"; document.getElementById("demo").append(c); }, 1000);
  setTimeout(() => document.getElementById("gone")?.remove(), 2500);
</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
