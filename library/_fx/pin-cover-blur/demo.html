<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pin-cover-blur — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: fixed; top: 0; left: 0; right: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .media { background: linear-gradient(135deg, var(--kf-accent), var(--kf-accent-soft)); display: grid; place-items: center; font: var(--kf-weight-display) 48px/1 var(--kf-font-display); }
  .cover { display: grid; place-items: center; background: var(--kf-contrast-bg); color: var(--kf-contrast-ink); font: 500 20px/1.8 var(--kf-font-sans); text-align: center; }
  .logo { position: absolute; top: 60px; right: 20px; padding: 10px 16px; background: var(--kf-surface); }
  .after { margin-top: 100svh; padding: 120px 20px; height: 120vh; }
</style>
</head>
<body>
<p class="demo-hint"><b>pin-cover-blur</b> — Scrolling blurs the image while it stays pinned, and an about panel rises from below to cover it.</p>
<section data-fx="pin-cover-blur" data-fx-pin-cover-blur="in: on"><div class="media" data-fx-part="media">Image slot</div><div class="cover" data-fx-part="cover">THEME<br>Your topic intro text here</div><p class="logo" data-fx-part="logo">LOGO</p></section>
<section class="after">Next section (margin-top 100svh as in the original)</section>
<script>
(() => {
  const gone = document.createElement("div");
  gone.setAttribute("data-fx", "pin-cover-blur");
  gone.innerHTML = '<div data-fx-part="media"></div><div data-fx-part="cover"></div>';
  gone.style.height = "0";
  document.body.append(gone);
  setTimeout(() => { const late = document.createElement("div"); late.setAttribute("data-fx", "pin-cover-blur"); late.style.height = "0"; document.body.append(late); }, 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s an empty one comes in, and after 2.5s one leaves.");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
