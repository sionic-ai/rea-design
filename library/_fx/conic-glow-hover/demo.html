<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>conic-glow-hover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 500 13px/1.4 var(--kf-font-sans); }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .row { display: flex; gap: 32px; margin: 60px; }
  .btn { padding: 12px 32px; background: var(--kf-ink); color: var(--kf-bg); font-size: 14px; }
</style>
</head>
<body>
<p class="demo-hint"><b>conic-glow-hover</b> — Hover over the button. A rainbow glow blooms behind it and slowly fades out when you move away. <span style="color:var(--kf-dim)">(After 1s one more button comes in, and after 2.5s one drops out)</span></p>
<div class="row">
  <a href="#" data-fx="conic-glow-hover"><span data-fx-part="face" class="btn">Say hello</span><span data-fx-part="glow" aria-hidden="true"></span></a>
  <a href="#" data-fx="conic-glow-hover" data-demo-remove><span data-fx-part="face" class="btn">Omitted button</span><span data-fx-part="glow" aria-hidden="true"></span></a>
</div>
<template data-demo-late><div class="row"><a href="#" data-fx="conic-glow-hover" style="--fx-blur: 12px; --fx-out: 1s"><span data-fx-part="face" class="btn">Late-arrived Button</span><span data-fx-part="glow" aria-hidden="true"></span></a></div></template>
<a data-fx="conic-glow-hover"></a>
<script src="../fx-core.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); }, 2500);
</script>
</body>
</html>
