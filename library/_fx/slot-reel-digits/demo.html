<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>slot-reel-digits — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); padding: 40px; }
  .demo-hint { margin: 0 0 32px; font: 500 13px/1.4 var(--kf-font-mono); }
  .row { display: flex; flex-wrap: wrap; gap: 24px; margin-bottom: 24px; }
  .stat { padding: 8px 8px 16px; background: var(--kf-surface); border: 1px solid var(--kf-line); font: 300 80px/1 var(--kf-font-mono); --fx-cell-w: 52px; --fx-cell-h: 72px; }
  button { font: inherit; padding: 8px 12px; }
  .spacer { height: 110vh; }
</style>
</head>
<body>
<p class="demo-hint"><b>slot-reel-digits</b> — Numbers cycle through random characters, slowing down gradually until they stop. Press ‹Again› or scroll down. <span style="color:var(--kf-dim)">(One more number comes in after 1s, and one drops out after 2.5s)</span></p>
<div class="row" data-late>
  <span class="stat" data-fx="slot-reel-digits">12+</span>
  <span class="stat" data-fx="slot-reel-digits" data-fx-slot-reel-digits="dur: 3500">40M+</span>
  <span class="stat" data-fx="slot-reel-digits" data-fx-slot-reel-digits="glyphs: 01" data-demo-remove>221K</span>
</div>
<button type="button" onclick="document.querySelectorAll('[data-fx~=slot-reel-digits]').forEach((n) => n.dispatchEvent(new Event('fx:roll')))">Again</button>
<div class="spacer"></div>
<span class="stat" data-fx="slot-reel-digits">500K+</span>
<span data-fx="slot-reel-digits"></span>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => { const s = document.createElement("span"); s.className = "stat"; s.dataset.fx = "slot-reel-digits"; s.textContent = "99%"; document.querySelector("[data-late]").appendChild(s); }, 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
