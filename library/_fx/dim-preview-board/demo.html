<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dim-preview-board — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .board { position: relative; padding: 40px 20px 160px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 60px 20px; }
  .board a { display: flex; flex-direction: column; gap: 6px; color: inherit; text-decoration: none; position: relative; z-index: 1; }
  .board .t, .board .m { position: relative; width: fit-content; }
  .board .m { font-size: 12px; color: var(--kf-dim); }
  .shot { position: fixed; top: 15vh; left: 30vw; width: 40vw; aspect-ratio: 4 / 3; background: var(--kf-accent-soft); border: 1px solid var(--kf-line); }
  .shot[data-key="b"] { left: 45vw; top: 25vh; width: 28vw; aspect-ratio: 2 / 3; background: var(--kf-raised); }
  .cap { position: fixed; left: 20px; bottom: 20px; }
  .cap p { margin: 0; font-weight: 500; }
  .cap [data-fx-part="caption"] { font-size: 56px; letter-spacing: -0.02em; white-space: nowrap; }
</style>
</head>
<body>
<p class="demo-hint"><b>dim-preview-board</b> — Move the mouse near the list rows. Only the nearest row stays and the rest blur, a photo appears and the large name at the lower left is written scrambled.</p>
<section class="board" data-fx="dim-preview-board" data-fx-dim-preview-board="zone: near">
  <a href="#" data-fx-part="item" data-key="a" data-sub="Brand site"><span class="t"><span data-fx-part="mark"></span><span data-fx-part="name">Client Name 01</span></span><span class="m"><span data-fx-part="mark" style="--fx-mark-delay: .1s"></span>Your category line here</span></a>
  <a href="#" data-fx-part="item" data-key="b" data-sub="Special site"><span class="t"><span data-fx-part="mark"></span><span data-fx-part="name">Project Name 02</span></span><span class="m"><span data-fx-part="mark" style="--fx-mark-delay: .1s"></span>Your category line here</span></a>
  <a href="#" data-fx-part="item" data-key="c" data-sub="Corporate site" data-demo-remove><span class="t"><span data-fx-part="name">Studio Name 03</span></span><span class="m">Your category line here</span></a>
  <figure class="shot" data-fx-part="shot" data-key="a"></figure>
  <figure class="shot" data-fx-part="shot" data-key="b"></figure>
  <div class="cap" data-fx-part="caption-box"><p data-fx-part="caption"></p><p data-fx-part="caption-sub"></p></div>
</section>
<template data-demo-late><section class="board" data-fx="dim-preview-board"><a href="#" data-fx-part="item" data-key="z"><span class="t" data-fx-part="name">Late Name 04</span></a></section></template>
<section class="board" data-fx="dim-preview-board"></section>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
