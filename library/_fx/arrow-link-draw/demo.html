<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>arrow-link-draw — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.6 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .col { width: min(420px, 90vw); margin: 0 auto; padding: 40px 0 60vh; text-align: center; }
  .col p { margin: 24px 0; }
  .col a { min-width: 140px; font-size: 13px; letter-spacing: .1em; }
  .gap { height: 60vh; }
</style>
</head>
<body>
<p class="demo-hint"><b>arrow-link-draw</b> — When the link appears an underline is drawn and the arrow flips and stops. Hover and a bold underline is drawn again. <span style="color:var(--kf-dim)">(After 1s one more link comes in, and after 2.5s one drops out)</span></p>
<div class="col">
  <p>Your two body lines here.</p>
  <a href="#" data-fx="arrow-link-draw" data-fx-arrow-link-draw="delay: .6">View details<span data-fx-part="arrow">›</span></a>
  <p><a href="#" data-fx="arrow-link-draw" data-demo-remove>Exit link<span data-fx-part="arrow">›</span></a></p>
  <div class="gap"></div>
  <a href="#" data-fx="arrow-link-draw">Link with arrow<span data-fx-part="arrow">›</span></a>
  <div class="gap"></div>
  <div data-late-slot></div>
</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script>gsap.registerPlugin(ScrollTrigger);</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelector("[data-late-slot]").outerHTML = '<a href="#" data-fx="arrow-link-draw">Late-arrived Link</a>', 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
