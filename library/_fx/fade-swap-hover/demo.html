<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fade-swap-hover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { display: flex; gap: 32px; padding: 48px 20px; font: 700 20px/31px var(--kf-font-display); }
  .demo.is-panel { background: var(--kf-accent); color: var(--kf-on-accent); }
  .demo.is-panel [data-fx-part="next"] { color: var(--kf-bg); }
</style>
</head>
<body>
<p class="demo-hint"><b>fade-swap-hover</b> — Hover over the menu text (the front layer goes out upward, the back layer rises from below). <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<nav class="demo">
  <a href="#" data-demo-remove><span data-fx="fade-swap-hover"><span data-fx-part="label">About</span><span data-fx-part="next" aria-hidden="true">About</span></span></a>
  <a href="#"><span data-fx="fade-swap-hover"><span data-fx-part="label">Articles</span><span data-fx-part="next" aria-hidden="true">Articles</span></span></a>
  <a href="#"><span data-fx="fade-swap-hover"><span data-fx-part="label">Your menu here</span><span data-fx-part="next" aria-hidden="true">Your menu here</span></span></a>
  <template data-demo-late><a href="#"><span data-fx="fade-swap-hover"><span data-fx-part="label">Late</span><span data-fx-part="next" aria-hidden="true">Late</span></span></a></template>
</nav>
<nav class="demo is-panel">
  <a href="#"><span data-fx="fade-swap-hover" style="--fx-shift: 20px"><span data-fx-part="label">While color changes · 20px</span><span data-fx-part="next" aria-hidden="true">While color changes · 20px</span></span></a>
</nav>
<script src="../fx-core.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
