<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>double-thump — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .row { display: flex; gap: 32px; align-items: flex-end; padding: 48px 20px; }
  .piece { width: 220px; aspect-ratio: 4 / 5; border-radius: 50%; background: var(--kf-raised); border: 1px solid var(--kf-line); display: grid; place-items: center; }
  .piece.is-gear { border-radius: 30%; }
</style>
</head>
<body>
<p class="demo-hint"><b>double-thump</b> — Watch for about 6s. Each piece contracts twice, pop-pop, at its own tempo. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<section class="row">
  <div class="piece" data-fx="double-thump" style="--fx-dur: 6.6s; --fx-delay: .5s">Piece 1</div>
  <div class="piece is-gear" data-demo-remove data-fx="double-thump" style="--fx-dur: 6.2s; --fx-delay: 2.8s">Piece 2</div>
  <div class="piece" data-fx="double-thump" style="--fx-dur: 6.5s; --fx-delay: 1.5s; --fx-dip: .9">Larger (.9)</div>
  <template data-demo-late><div class="piece is-gear" data-fx="double-thump" style="--fx-dur: 6s; --fx-delay: .2s">Enters late</div></template>
</section>
<script src="../fx-core.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
