<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>page-drop-menu — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { margin: 0; background: var(--kf-contrast-bg); color: var(--kf-ink); font: 400 15px/1.6 var(--kf-font-sans); }
  .demo-hint { position: fixed; top: 0; left: 0; right: 0; z-index: 5; display: flex; justify-content: space-between; align-items: center; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint button { padding: 8px 16px; border: 0; border-radius: 99px; background: var(--kf-ink); color: var(--kf-bg); font: 600 13px/1 var(--kf-font-sans); cursor: pointer; }
  .demo-nav { display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px; width: 75vw; height: 320px; margin: 0 auto; padding: 80px 0 0; }
  .demo-nav a { color: inherit; font: 600 20px/1.8 var(--kf-font-display); text-decoration: none; }
  .demo-hand { width: 70px; height: 40px; }
  .demo-page { min-height: 200vh; padding: 90px 24px; }
  .demo-page section { height: 60vh; margin-bottom: 24px; border-radius: 12px; background: var(--kf-raised); display: grid; place-items: center; color: var(--kf-dim); }
</style>
</head>
<body data-fx="page-drop-menu">
<p class="demo-hint"><span><b>page-drop-menu</b> — Press MENU and the page shrinks and sinks down (click the shrunken page or press Esc to close). In a narrow window it moves aside instead.</span><button data-fx-part="toggle" type="button" aria-expanded="false">MENU</button></p>
<div data-fx-part="menu"><nav class="demo-nav" data-fx-part="nav"><div><a href="#">Menu 1</a><br><a href="#">Menu 2</a></div><div><a href="#">Menu 3</a><br><a href="#">Menu 4</a></div><div><a href="#">Menu 5</a></div><div><a href="#">Menu 6</a></div></nav></div>
<svg class="demo-hand" data-fx-part="hand" viewBox="0 0 70 40"><rect x="4" y="4" width="62" height="32" rx="14" fill="var(--kf-surface)" stroke="var(--kf-ink)" stroke-width="3"/></svg>
<svg class="demo-hand" data-fx-part="hand" viewBox="0 0 70 40"><rect x="4" y="4" width="62" height="32" rx="14" fill="var(--kf-surface)" stroke="var(--kf-ink)" stroke-width="3"/></svg>
<div class="demo-page" data-fx-part="page"><section>Your page’s first section here</section><section>Your second section here</section><section>Your third section here</section></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
