<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>scrub-split-out — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { height: 100vh; display: flex; align-items: center; }
  .demo .mark { white-space: nowrap; font: var(--kf-weight-display) 22vw/1 var(--kf-font-display); }
  .demo figure { position: absolute; width: 18vw; aspect-ratio: 1; margin: 0; }
  .demo p { position: absolute; bottom: 0; padding: 24px; }
  .after { height: 150vh; display: grid; place-items: center; color: var(--kf-dim); }
</style>
</head>
<body>
<p class="demo-hint"><b>scrub-split-out</b> — Scroll down. The wordmark, text, and photo each exit in a different direction. <span style="color:var(--kf-dim)">(After 1 second one more section with a photo enters, and after 2.5 seconds one photo leaves)</span></p>
<section class="demo" id="box" data-fx="scrub-split-out">
  <figure class="wf-img" data-fx-part="part" data-y="-200" data-label="Work photo · 1:1" style="left:-4vw; top:10vh"></figure>
  <figure class="wf-img" data-fx-part="part" data-y="-200" data-at="0.02" data-label="Work photo · 1:1" style="left:24vw; bottom:6vh" data-demo-remove></figure>
  <figure class="wf-img" data-fx-part="part" data-y="-200" data-at="0.02" data-label="Work photo · 1:1" style="right:-4vw; top:10vh"></figure>
  <div class="mark" data-fx-part="part" data-x="-150">Your logo here</div>
  <p data-fx-part="part" data-x="-250" style="left:0">Your one-line intro here<br>Second line</p>
  <p data-fx-part="part" data-x="200" style="right:0">Region · 00</p>
</section>
<section data-fx="scrub-split-out" style="height:20vh"></section>
<div class="after" id="after">Below</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => { const s = document.createElement("section"); s.className = "demo"; s.dataset.fx = "scrub-split-out"; s.dataset.fxScrubSplitOut = "span: 1"; s.innerHTML = '<div class="mark" data-fx-part="part" data-x="-150" data-x-sp="-100">Late section</div>'; document.getElementById("after").before(s); }, 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
