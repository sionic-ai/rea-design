<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fog-mask-scrub — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .area { position: relative; }
  .scene { position: sticky; top: 0; height: 100vh; display: grid; place-items: center; background: var(--kf-contrast-bg); color: var(--kf-contrast-ink); font-size: 32px; }
  .space { height: 100svh; }
  .under { height: 120vh; display: grid; place-items: center; background: var(--kf-surface); }
  .tile { width: 260px; height: 160px; margin: 40px auto; display: grid; place-items: center; background: var(--kf-accent); color: var(--kf-on-accent); }
</style>
</head>
<body>
<p class="demo-hint"><b>fog-mask-scrub</b> — Scroll down. The pinned panel is wiped away by a soft wavy edge, revealing the panel below. <span style="color:var(--kf-dim)">(After 1s one more cell comes in, and one leaves 2.5s later)</span></p>
<div class="area">
  <div class="scene" data-fx="fog-mask-scrub" data-fx-fog-mask-scrub="on: next; start: 20% bottom">Hero version</div>
  <div class="space"></div>
</div>
<div class="under">
  <div>
    <div class="tile" data-demo-remove data-fx="fog-mask-scrub" data-fx-fog-mask-scrub="look: fog; from: 100 0; to: 50 100; start: top 80%; end: bottom 20%">Cell fading into fog</div>
    <template data-demo-late><div class="tile" data-fx="fog-mask-scrub" data-fx-fog-mask-scrub="look: wave-r; from: -30 0; to: 100 30; start: top 90%; end: top 30%">Cell entering in a wave</div></template>
  </div>
</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
