<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>edge-bar-nudge — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { padding: 24px 20px; }
  .nav { display: grid; gap: 10px; width: 262px; }
  .nav li { border-radius: var(--kf-radius-md); background: var(--kf-surface); }
  .nav a { display: flex; margin: 0.25em; padding: 0.625em 0.625em 0.625em 1em; line-height: 1; }
</style>
</head>
<body>
<p class="demo-hint"><b>edge-bar-nudge</b> — Hover over a menu card. The card is pushed aside and a left-hand strip slides in.</p>
<div class="demo">
  <ul class="nav">
    <li data-fx="edge-bar-nudge" aria-current="page"><a href="#">HOME</a></li>
    <li data-fx="edge-bar-nudge"><a href="#">Your menu name one here</a></li>
    <li data-fx="edge-bar-nudge"><a href="#">Menu Second</a></li>
    <li data-fx="edge-bar-nudge" data-fx-edge-bar-nudge="look: point"><a href="#">Highlighted category menu</a></li>
  </ul>
</div>
<script>
// Late arrivals · removals — a css-only part so nothing is attached or detached, but we check that it stands in the same shape
(() => {
  const list = document.querySelector(".nav");
  const make = (txt, tag) => { const li = document.createElement("li"); li.dataset.fx = "edge-bar-nudge"; li.dataset.demo = tag; li.innerHTML = `<a href="#">${txt}</a>`; return li; };
  const gone = make("Soon-Removed Menu", "gone");
  list.append(gone);
  setTimeout(() => list.append(make("Late-arrived Menu", "late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s one more card comes in (a late arrival), and after 2.5s one drops out.");
})();
</script>
<script src="../fx-core.js"></script>
</body>
</html>
