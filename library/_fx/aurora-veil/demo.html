<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>aurora-veil — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-contrast-bg); color: var(--kf-contrast-ink); font: 400 15px/1.5 var(--kf-font-sans); --fx-scrim: 0%; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); color: var(--kf-ink); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .tall { height: 200vh; padding: 120px 20px; max-width: 720px; margin: 0 auto; }
  .box { margin-top: 40px; height: 260px; border-radius: var(--kf-radius-md); }
</style>
</head>
<body>
<p class="demo-hint"><b>aurora-veil</b> — An aurora curtain slowly ripples at the top of the screen and its colors flow sideways. The box below is look: local (inside the box only).</p>
<div data-fx="aurora-veil" data-demo-remove></div>
<div class="tall">Body text here. After 1s one more aurora attaches to the box below, and after 2.5s the aurora behind the screen is detached.
  <template data-demo-late><div class="box" data-fx="aurora-veil" data-fx-aurora-veil="look: local; mid: 0.1; flow: 0.08"></div></template>
</div>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
