<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>frame-tint-hover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 500 15px/1.6 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 10; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .grid { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 40px 0; max-width: 1100px; margin: 48px auto; padding: 0 20px; }
  .card { display: block; width: 58%; padding-top: 38%; border-radius: 8px; overflow: hidden; background: var(--kf-raised); }
  .card.tall { width: 25%; padding-top: 31%; }
  .card .ph { position: absolute; inset: 0; display: grid; place-items: center; color: var(--kf-dim); }
  .name { color: var(--kf-surface); text-transform: uppercase; font-size: 18px; }
  .dot { width: 8px; height: 8px; border-radius: 99px; background: var(--kf-surface); }
</style>
</head>
<body>
<p class="demo-hint"><b>frame-tint-hover</b> — Hover over a photo card. A colored frame covers it and a name tag slides up. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<div class="grid">
  <a class="card tall" href="#" data-fx="frame-tint-hover" data-fx-frame-tint-hover="look: portrait"><span class="ph">Vertical Photo</span><span data-fx-part="label"><span class="dot"></span><span class="name">Work name 1</span></span></a>
  <a class="card" href="#" data-fx="frame-tint-hover" style="--fx-frame: var(--kf-ink)"><span class="ph">Landscape photo</span><span data-fx-part="label"><span class="dot"></span><span class="name">Work name 2</span></span></a>
  <a class="card" href="#" data-fx="frame-tint-hover" data-demo-remove><span class="ph">Exit card</span><span data-fx-part="frame"></span></a>
</div>
<template data-demo-late><div class="grid"><a class="card" href="#" data-fx="frame-tint-hover" data-fx-frame-tint-hover="width: 0.1; in: 0.5" style="--fx-frame: var(--kf-accent-soft)"><span class="ph">Late-arriving card · thick frame</span><span data-fx-part="label"><span class="name">Work name 3</span></span></a></div></template>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); window.ScrollTrigger?.refresh(); }, 2500);
</script>
</body>
</html>
