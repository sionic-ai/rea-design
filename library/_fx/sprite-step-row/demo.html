<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sprite-step-row — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 2; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .row { position: relative; height: 120px; margin: 40px 0; overflow: hidden; border-block: 1px solid var(--kf-line); }
  .row [data-fx-part="unit"] { position: absolute; top: 10px; width: 94px; height: 100px; }
  .row [data-fx-part="frame"] { display: grid !important; place-items: end center; font: 700 28px var(--kf-font-display); }
  .row [data-odd] { color: var(--kf-accent); }
</style>
</head>
<body>
<p class="demo-hint"><b>sprite-step-row</b> — The cells turn pages together every 227ms. Only the one red cell is off-beat. <span style="color:var(--kf-dim)">(After 1s one more line comes in, and one leaves 2.5s later)</span></p>
<div class="row" data-fx="sprite-step-row" data-fx-sprite-step-row="odd: 0 1 3 2 0 1 3 2"></div>
<div class="row" data-fx="sprite-step-row" data-demo-remove></div>
<div class="row" data-fx="sprite-step-row"></div>
<template data-demo-late><div class="row" data-fx="sprite-step-row" data-fx-sprite-step-row="step: 400"></div></template>
<script>
const unit = (i, odd) => `<span data-fx-part="unit"${odd ? " data-odd" : ""} style="left:${i * 80 - 20}px"><span data-fx-part="strip">${["ᐅ", "ᐃ", "ᐊ", "ᐁ"].map((c) => `<i data-fx-part="frame">${c}</i>`).join("")}</span></span>`;
const fill = (row) => { row.innerHTML = Array.from({ length: 12 }, (_, i) => unit(i, i === 6)).join(""); };
document.querySelectorAll(".row").forEach((r, k) => k < 2 && fill(r));
</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => { const n = t.content.cloneNode(true); fill(n.firstElementChild); t.replaceWith(n); }), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
