<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>swell-title-loader — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .site { min-height: 100vh; }
  .box { position: relative; height: 320px; margin: 16px 20px; overflow: hidden; border: 1px solid var(--kf-line); }
  .box [data-fx~="swell-title-loader"] { position: absolute; }
  .box [data-fx-part="grid"] { grid-template-rows: repeat(3, 100px); }
  [data-fx-part="title"], [data-fx-part="split"] { font: var(--kf-weight-display) 35px/1 var(--kf-font-display); text-transform: uppercase; text-align: center; }
  [data-fx-part="fade"] { font: 400 12px/1.2 var(--kf-font-mono); color: var(--kf-contrast-ink); margin-bottom: 16px; }
  .row-3 { grid-auto-flow: column; gap: 16px; align-items: center; }
</style>
</head>
<body>
<div data-fx="swell-title-loader" data-fx-swell-title-loader="page: .site">
  <div data-fx-part="grid">
    <div data-fx-part="row" class="row-3"><span data-fx-part="fade">0000</span><span data-fx-part="split">00 Projects</span><span data-fx-part="fade">0000</span></div>
    <div data-fx-part="row"><h1 data-fx-part="title">Wordmark</h1></div>
    <div data-fx-part="row"><span data-fx-part="fade">( Small Label )</span><span data-fx-part="split">A big headline set<br>across two lines</span></div>
  </div>
</div>
<main class="site">
  <p class="demo-hint"><b>swell-title-loader</b> — Refresh. Row lines are drawn, the center title swells, then the panel rises halfway and clears away cut off, and this page rises from below.</p>
  <div class="box"><div data-fx="swell-title-loader" data-demo-remove><div data-fx-part="grid"><div data-fx-part="row"><h1 data-fx-part="title">Removed</h1></div></div></div></div>
  <div class="box" id="late"></div>
  <div class="box"><div data-fx="swell-title-loader"></div></div>
</main>
<template data-demo-late><div data-fx="swell-title-loader" data-fx-swell-title-loader="hold: .3; size: 12"><div data-fx-part="grid"><div data-fx-part="row"><span data-fx-part="fade">( Late )</span></div><div data-fx-part="row"><h1 data-fx-part="title">Late</h1></div><div data-fx-part="row"></div></div></div></template>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/CustomEase.min.js"></script>
<script src="../../../_shared/vendor/gsap/SplitText.min.js"></script>
<script>gsap.registerPlugin(CustomEase, SplitText);</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => document.getElementById("late").append(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
