<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>warp-cloud-trail — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; padding: 20px; }
  .cloud { aspect-ratio: 3 / 1.4; }
</style>
</head>
<body>
<p class="demo-hint"><b>warp-cloud-trail</b> — Sweep the mouse over the clouds. The area it passed is pushed away and broken, then settles. <span style="color:var(--kf-dim)">(After 1s one more panel comes in, and one leaves 2.5s later)</span></p>
<section class="grid">
  <div class="cloud" data-fx="warp-cloud-trail"></div>
  <div class="cloud" data-demo-remove data-fx="warp-cloud-trail" data-fx-warp-cloud-trail="zoom: 2.2; time: 40"></div>
  <template data-demo-late><div class="cloud" data-fx="warp-cloud-trail" data-fx-warp-cloud-trail="a: --kf-contrast-bg; b: --kf-contrast-ink; time: 12"></div></template>
  <div class="cloud" data-fx="warp-cloud-trail" data-fx-warp-cloud-trail="b: --kf-accent; trail: off; time: 80"></div>
</section>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../_vendor/ogl@1.0.11/ogl.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
