<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>recede-footer — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-surface); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-main { background: var(--kf-bg); }
  .demo-spacer { height: 70vh; display: grid; place-items: center; color: var(--kf-dim); border-bottom: 1px solid var(--kf-line); }
  .demo-foot { position: sticky; bottom: 0; padding: 120px 20px 40px; }
  .demo-small { height: 120px; margin: 20px; background: var(--kf-raised); }
</style>
</head>
<body>
<p class="demo-hint"><b>recede-footer</b> — Scroll all the way down. The body panel pulls back and reveals the footer behind it.</p>
<main class="demo-main" data-fx="recede-footer">
  <div class="demo-spacer">Scroll down</div>
  <div class="demo-spacer">Body layout</div>
  <div class="demo-spacer">As the end nears, the board recedes to .935 scale</div>
</main>
<footer class="demo-foot"><b>Footer</b> — sits behind the panel, then is revealed</footer>
<div class="demo-small" data-fx="recede-footer"></div>
<script>
// Late arrivals and removals — checks that fx-core attaches to an element added after 1s and detaches from an element removed after 2.5s
(() => {
  const src = document.querySelector(".demo-small");
  const make = (tag) => { const el = src.cloneNode(true); el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => src.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another small panel comes in, and after 2.5s one drops out (detach).");
})();
</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
