<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bar-count-loader — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 1001; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .track { width: 300px; height: 2px; border-radius: 99px; overflow: hidden; background: var(--kf-line); }
  .logo { width: 64px; height: 64px; border: 1px solid currentColor; border-radius: 50%; }
  main { padding: 48px 20px; }
</style>
</head>
<body>
<p class="demo-hint"><b>bar-count-loader</b> — On open the line fills and the number counts up to 100% before the curtain disappears (refresh to see it again).</p>
<div data-fx="bar-count-loader"><i class="logo"></i><div class="track"><div data-fx-part="fill"></div></div><p data-fx-part="num">0%</p></div>
<div data-fx="bar-count-loader" data-demo-remove><div class="track"><div data-fx-part="fill"></div></div></div>
<template data-demo-late><div data-fx="bar-count-loader" data-fx-bar-count-loader="dur: .8; out: .3"><p data-fx-part="num">0%</p></div></template>
<main>Hero Behind the Curtain</main>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
document.addEventListener("fx:done", (e) => { const m = document.querySelector("main"); if (m) m.textContent = "fx:done received — Hero opens"; });
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
