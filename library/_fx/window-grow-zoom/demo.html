<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>window-grow-zoom — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: sticky; top: 0; z-index: 10; margin: 0; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .pad { height: 60vh; display: grid; place-items: center; }
  [data-fx-part="media"].wf-img { border: 0; }
</style>
</head>
<body>
<p class="demo-hint"><b>window-grow-zoom</b> — Scroll down. A small window in the center expands to fill the screen, and the photo inside shrinks from 1.5x to its normal size.</p>
<div class="pad">Scroll down from the top</div>
<section id="first" data-fx="window-grow-zoom">
  <div data-fx-part="stage"><div data-fx-part="frame"><div class="wf-img" data-fx-part="media" data-label="Model close-up · white backdrop · landscape"></div></div></div>
</section>
<div class="pad">Panel with dark overlay</div>
<section data-fx="window-grow-zoom" style="--fx-w: 83%; --fx-h: 81%">
  <div data-fx-part="stage"><div data-fx-part="frame"><div class="wf-img" data-fx-part="media" data-label="Inside the store · row of salon chairs · landscape"></div><div data-fx-part="shade"></div></div></div>
</section>
<div class="pad" id="tail">Footer</div>
<script>
// Late arrivals and removals — after 1 second one more panel comes in (late arrival), and after 2.5 seconds the first panel leaves (detach)
(() => {
  const src = document.getElementById("first");
  setTimeout(() => { const late = src.cloneNode(true); late.removeAttribute("id"); document.getElementById("tail").before(late); }, 1000);
  setTimeout(() => src.remove(), 2500);
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script>gsap.registerPlugin(ScrollTrigger);</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
