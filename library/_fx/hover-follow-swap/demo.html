<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hover-follow-swap — a different cut that follows along over the card</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { padding: 40px; font-family: var(--kf-font-sans); color: var(--kf-ink); background: var(--kf-bg); }
  .row { display: flex; gap: 32px; flex-wrap: wrap; }
  .card { display: block; width: 320px; height: 320px; }
  .card .wf-img[data-fx-part="image"] { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<p>Move the mouse over a card — another cut box follows the cursor late and the background grows (after 1 second one more card is added, after 2 seconds the first card drops out).</p>
<div class="row" id="row">
  <a class="card" id="first" href="#" data-fx="hover-follow-swap"><span data-fx-part="image" class="wf-img" data-label="Product shot"></span><span data-fx-part="chip" class="wf-img" data-label="Different cut"></span></a>
</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
  setTimeout(() => {
    const el = document.createElement("a");
    el.className = "card"; el.href = "#";
    el.setAttribute("data-fx", "hover-follow-swap");
    el.setAttribute("data-fx-hover-follow-swap", "size: 160; zoom: 1.1");
    el.innerHTML = '<span data-fx-part="image" class="wf-img" data-label="Product Shot 2"></span><span data-fx-part="chip" class="wf-img" data-label="Other cut 2"></span>';
    document.getElementById("row").append(el);
  }, 1000);
  setTimeout(() => document.getElementById("first").remove(), 2000);
</script>
</body>
</html>
