<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>orb-split-reveal — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-spacer { height: 80vh; display: grid; place-items: center; color: var(--kf-dim); }
  .demo { display: grid; place-items: center; min-height: 70vh; font-size: 14px; }
  .orbs { width: 24em; height: 24em; display: grid; place-items: center; }
  .orbs span { border-radius: 50%; background: radial-gradient(circle at 35% 30%, var(--kf-surface), var(--kf-raised) 60%, var(--kf-dim)); opacity: .3; }
  .orbs .mid { position: relative; z-index: 1; width: 100%; height: 100%; border-radius: 50%; background: radial-gradient(circle at 35% 30%, var(--kf-surface), var(--kf-raised)); display: grid; place-items: center; font: var(--kf-weight-display) 22px/1.2 var(--kf-font-display); }
</style>
</head>
<body>
<p class="demo-hint"><b>orb-split-reveal</b> — Scroll down. Two circles behind the center circle spread out to either side. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<div class="demo-spacer">Scroll down</div>
<section class="demo"><div class="orbs" data-fx="orb-split-reveal"><span data-fx-part="left"></span><span data-fx-part="right"></span><div class="mid">Request a Demo</div></div></section>
<section class="demo" data-demo-remove><div class="orbs" data-fx="orb-split-reveal"><span data-fx-part="left"></span><span data-fx-part="right"></span><div class="mid">Thing to Drop</div></div></section>
<section class="demo"><template data-demo-late><div class="orbs" data-fx="orb-split-reveal" data-fx-orb-split-reveal="dist: 12; delay: 0; dur: .6"><span data-fx-part="left"></span><span data-fx-part="right"></span><div class="mid">Enters late</div></div></template></section>
<section class="demo"><div class="orbs" data-fx="orb-split-reveal"><div class="mid">No circle — nothing happens</div></div></section>
<div class="demo-spacer"></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); window.ScrollTrigger?.refresh(); }, 2500);
</script>
</body>
</html>
