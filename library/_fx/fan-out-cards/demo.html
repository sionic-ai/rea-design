<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fan-out-cards — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { padding: 48px 20px; }
  .demo-spacer { height: 90vh; display: grid; place-items: center; color: var(--kf-dim); }
  .fan { gap: 24px; padding: 40px 0 120px; }
  .fan [data-fx-part="card"] { width: 220px; height: 280px; padding: 20px; border-radius: 24px; background: var(--kf-surface); border: 2px solid var(--kf-accent); }
</style>
</head>
<body>
<p class="demo-hint"><b>fan-out-cards</b> When the card row reaches the center of the screen, the cards on both sides tilt and unfold. Scroll up and they fold again. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<div class="demo-spacer">Scroll down</div><section class="demo"><ul class="fan" data-demo-remove data-fx="fan-out-cards"><article data-fx-part="card">Card 1</article><article data-fx-part="card">Card 2</article><article data-fx-part="card">Card 3</article></ul><ul class="fan" data-fx="fan-out-cards" style="--fx-angle: 8deg"><article data-fx-part="card">Card 1</article><article data-fx-part="card">Card 2</article><article data-fx-part="card">Card 3</article></ul><template data-demo-late><ul class="fan" data-fx="fan-out-cards"><article data-fx-part="card">Card 1</article><article data-fx-part="card">Card 2</article><article data-fx-part="card">Card 3</article></ul></template><ul data-fx="fan-out-cards"></ul></section><div class="demo-spacer"></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); window.ScrollTrigger?.refresh(); }, 2500);
</script>
</body>
</html>
