<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hscroll-wipe-pin — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-spacer { height: 60vh; display: grid; place-items: center; color: var(--kf-dim); }
  .bg1 { background: linear-gradient(135deg, var(--kf-accent-soft), var(--kf-raised)); }
  .bg2 { background: linear-gradient(135deg, var(--kf-raised), var(--kf-accent)); }
  .bg3 { background: linear-gradient(135deg, var(--kf-accent), var(--kf-ink)); }
  .panel { width: 120vw; }
  .panel > div { width: 320px; height: 100%; display: grid; place-content: center; gap: 10px; padding: 0 40px; background: var(--kf-accent); color: var(--kf-on-accent); transition: opacity .4s; opacity: .5; }
  .panel.is-active > div { opacity: 1; }
  @media (max-width: 767px) { .panel { width: 100%; padding-top: 100vh; } .panel > div { width: 100%; height: auto; padding: 60px 30px; } }
</style>
</head>
<body>
<p class="demo-hint"><b>hscroll-wipe-pin</b> — Scrolling down, blue panels flow sideways and the image behind is revealed in turn. <span style="color:var(--kf-dim)">(After 1s one more section comes in, and one leaves 2.5s later)</span></p>
<div class="demo-spacer">Scroll down</div>
<section data-fx="hscroll-wipe-pin">
  <div data-fx-part="back"><i class="bg3" data-fx-part="bg"></i><i class="bg2" data-fx-part="bg"></i><i class="bg1" data-fx-part="bg"></i></div>
  <div data-fx-part="track">
    <article class="panel" data-fx-part="panel"><div><b>Panel 1</b><p>First round</p></div></article>
    <article class="panel" data-fx-part="panel"><div><b>Panel 2</b><p>Second edition</p></div></article>
    <article class="panel" data-fx-part="panel"><div><b>Panel 3</b><p>Third edition</p></div></article>
  </div>
</section>
<section data-demo-remove data-fx="hscroll-wipe-pin"><div data-fx-part="track"><article class="panel" data-fx-part="panel"><div><b>Panel to Be Removed</b></div></article></div></section>
<template data-demo-late><section data-fx="hscroll-wipe-pin"><div data-fx-part="back"><i class="bg2" data-fx-part="bg"></i><i class="bg1" data-fx-part="bg"></i></div><div data-fx-part="track"><article class="panel" data-fx-part="panel"><div><b>Late-arriving panel 1</b></div></article><article class="panel" data-fx-part="panel"><div><b>Late-arriving panel 2</b></div></article></div></section></template>
<div class="demo-spacer"></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); window.ScrollTrigger?.refresh(); }, 2500);
</script>
</body>
</html>
