<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pin-cross-frames — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-spacer { height: 80vh; display: grid; place-items: center; color: var(--kf-dim); }
  .demo-stage-wrap { position: relative; height: 300vh; overflow: hidden; }
  .demo-stage { position: absolute; left: 0; top: 0; width: 100%; height: 100vh; }
  .demo-bg { position: absolute; inset: 0; overflow: hidden; }
  .demo-small { position: absolute; left: calc(50% - 120px); top: calc(50% - 120px); width: 240px; height: 240px; overflow: hidden; border-radius: 6px; }
  .demo-stage .wf-img { height: 100%; border: 0; }
</style>
</head>
<body>
<p class="demo-hint"><b>pin-cross-frames</b> Scroll down and the stage stays pinned while the large scene moves up and the small center photo moves down, crossing past each other. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<div class="demo-spacer">Downward</div>
<section class="demo-stage-wrap" data-fx="pin-cross-frames">
  <div class="demo-stage" data-fx-part="stage">
    <div class="demo-bg">
      <div data-fx-part="back"><div class="wf-img" data-label="Large scene 1 · pile of white gravel · landscape"></div></div>
      <div data-fx-part="back"><div class="wf-img" data-label="Large scene 2 · white tile board · landscape"></div></div>
      <div data-fx-part="back"><div class="wf-img" data-label="Large scene 3 · triangle tiles · landscape"></div></div>
    </div>
    <div class="demo-small">
      <div data-fx-part="front"><div class="wf-img" data-label="Small photo 1"></div></div>
      <div data-fx-part="front"><div class="wf-img" data-label="Small photo 2"></div></div>
      <div data-fx-part="front"><div class="wf-img" data-label="Small photo 3"></div></div>
    </div>
  </div>
</section>
<section class="demo-stage-wrap" style="height:150vh" data-fx="pin-cross-frames" data-demo-remove><div class="demo-stage" data-fx-part="stage"><div class="demo-bg"><div data-fx-part="back"><div class="wf-img" data-label="Panel to be removed soon"></div></div></div></div></section>
<template data-demo-late><section class="demo-stage-wrap" style="height:200vh" data-fx="pin-cross-frames" data-fx-pin-cross-frames="drift: 20"><div class="demo-stage" data-fx-part="stage"><div class="demo-bg"><div data-fx-part="back"><div class="wf-img" data-label="Late-arriving panel 1"></div></div><div data-fx-part="back"><div class="wf-img" data-label="Late-arriving panel 2"></div></div></div></div></section></template>
<div class="demo-spacer">Bottom end</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); window.ScrollTrigger?.refresh(); }, 2500);
</script>
</body>
</html>
