<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>particle-shape-morph — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); transition: background-color .8s ease; }
  body.is-dark { background: var(--kf-contrast-bg); color: var(--kf-contrast-ink); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); color: var(--kf-ink); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { padding: 24px 20px; display: grid; gap: 24px; }
  .stage { height: 70vh; border: 1px solid var(--kf-line); }
  .row { display: flex; flex-wrap: wrap; gap: 8px; }
  .row button { padding: 6px 12px; }
</style>
</head>
<body>
<p class="demo-hint"><b>particle-shape-morph</b> — When opened, scattered dots gather into a sphere. Change shapes with the buttons (torus, tube, cube and heart use the dark section color). <span style="color:var(--kf-dim)">(After 1s one more panel comes in, and one leaves 2.5s later)</span></p>
<section class="demo">
  <div class="row">
    <button type="button" data-s="sphere">Nine</button><button type="button" data-s="grid">Wave Panel</button><button type="button" data-s="torus">Donut</button>
    <button type="button" data-s="tube">Twisted tube</button><button type="button" data-s="rings">Concentric circles</button><button type="button" data-s="cube">Cube</button><button type="button" data-s="heart">Heart</button>
  </div>
  <div class="stage" id="a" data-fx="particle-shape-morph"></div>
  <div class="stage" data-demo-remove data-fx="particle-shape-morph" data-fx-particle-shape-morph="shape: torus"></div>
  <template data-demo-late><div class="stage" data-fx="particle-shape-morph" data-fx-particle-shape-morph="shape: rings; intro: 1"></div></template>
</section>
<script src="../../_vendor/three@0.128.0/build/three.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
const a = document.getElementById("a");
const dark = new Set(["torus", "tube", "cube", "heart"]);
document.querySelectorAll("[data-s]").forEach((b) => b.addEventListener("click", () => {
  a.dispatchEvent(new CustomEvent("fx:shape", { detail: { shape: b.dataset.s } }));
  document.body.classList.toggle("is-dark", dark.has(b.dataset.s));
}));
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
