<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>velocity-edge-blur — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: sticky; top: 0; z-index: 200; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { padding: 48px 20px; display: grid; gap: 24px; max-width: 760px; }
  .demo p { margin: 0; font-size: 22px; line-height: 1.3; }
</style>
</head>
<body>
<p class="demo-hint"><b>velocity-edge-blur</b> — Scroll fast. Text at the bottom of the screen blurs by the speed, and clears when you stop.</p>
<div class="demo" id="txt"></div>
<div data-fx="velocity-edge-blur"></div>
<script>
document.getElementById("txt").innerHTML = Array.from({ length: 40 }, (_, i) => `<p>Your body line $ here{i + 1} — Scrolling down quickly blurs the lower part.</p>`).join("");
(() => {
  const src = document.querySelector('[data-fx~="velocity-edge-blur"]');
  if (!src) return;
  const html = src.outerHTML.replace(/\sid="[^"]*"/g, "");
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  document.body.append(gone);
  setTimeout(() => document.body.append(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical one comes in, and after 2.5s one drops out (detach).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
