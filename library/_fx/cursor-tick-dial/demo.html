<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>cursor-tick-dial — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { margin: 0; padding: 48px; font-family: var(--kf-font-sans); background: var(--kf-bg); color: var(--kf-ink); display: grid; gap: 32px; justify-items: start; }
  .stage { padding: 24px; background: var(--kf-contrast-bg); }
</style>
</head>
<body>
  <p class="demo-hint"><b>cursor-tick-dial</b> — Move the mouse over the dial. Only the ticks near the cursor thicken, and they settle when you leave.</p>
  <div class="stage"><div data-fx="cursor-tick-dial" style="width: min(480px, 80vw)"></div></div>
  <div data-fx="cursor-tick-dial" data-fx-cursor-tick-dial="count: 18; influence: 60; sway: 0" style="width: 240px; --fx-tick: var(--kf-accent)"></div>
  <template data-demo-late><div data-fx="cursor-tick-dial" style="width: 160px"></div></template>
  <div data-fx="cursor-tick-dial" data-demo-remove style="width: 120px"></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
