<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>snap-drag-windows — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 14px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .desk { position: relative; height: 560px; margin: 20px; background-image: linear-gradient(var(--kf-line) 1px, transparent 1px), linear-gradient(90deg, var(--kf-line) 1px, transparent 1px); background-size: 20px 20px; background-color: var(--kf-surface); }
  .win { width: 260px; height: 180px; border-radius: var(--kf-radius-sm); background: var(--kf-bg); border: 1px solid var(--kf-line); overflow: hidden; }
  .win header { display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 4px; background: var(--kf-contrast-bg); color: var(--kf-contrast-ink); }
  .win button { width: 32px; height: 32px; border: 0; background: none; color: inherit; }
  .win p { padding: 8px; }
</style>
</head>
<body>
<p class="demo-hint"><b>snap-drag-windows</b> — Grab the handle (⠿) at the left of the window header and drag. A dashed cell shows where it will land. <span style="color:var(--kf-dim)">(After 1s one more window comes in, and one leaves 2.5s later)</span></p>
<div class="desk" data-fx="snap-drag-windows" data-fx-snap-drag-windows="cell: 20">
  <section class="win" data-fx-part="win" style="left:20px;top:20px"><header><button type="button" data-fx-part="handle" aria-label="Move">⠿</button>Your window 1 here</header><p>Your content here</p></section>
  <section class="win" data-fx-part="win" style="left:320px;top:80px"><header><button type="button" data-fx-part="handle" aria-label="Move">⠿</button>Your window 2 here</header><p>Your content here</p></section>
  <section class="win" data-fx-part="win" data-demo-remove style="left:620px;top:200px"><header><button type="button" data-fx-part="handle" aria-label="Move">⠿</button>Window to be removed soon</header></section>
  <template data-demo-late><section class="win" data-fx-part="win" style="left:120px;top:300px"><header><button type="button" data-fx-part="handle" aria-label="Move">⠿</button>Late window</header></section></template>
</div>
<div class="desk" data-demo-remove data-fx="snap-drag-windows"></div>
<div class="desk" data-fx="snap-drag-windows" data-fx-snap-drag-windows="cols: 4; gap: 20"></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
