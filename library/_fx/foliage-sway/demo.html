<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>foliage-sway — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.6 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .stage { position: relative; height: 90vh; overflow: hidden; }
  .stage .wf-img { position: absolute; left: 50%; top: 10%; width: min(420px, 60vw); aspect-ratio: 3 / 4; translate: -50% 0; }
</style>
</head>
<body>
<p class="demo-hint"><b>foliage-sway</b> Leaf clusters on both sides of the photo sway in the wind. The left one stays as is, and the right one is rotated 180° so it hangs from above. <span style="color:var(--kf-dim)">(After 1 second one more bundle enters at bottom center, and after 2.5 seconds one leaves)</span></p>
<div class="stage">
  <div class="wf-img" data-label="Portrait photo · arch frame · portrait 3:4"></div>
  <div data-fx="foliage-sway" style="width: 200px; left: -40px; top: 40px"></div>
  <div data-fx="foliage-sway" style="width: 200px; right: 40px; top: -500px; transform: rotate(180deg)"></div>
  <div data-fx="foliage-sway" data-demo-remove style="width: 120px; left: 30%; top: 30%"></div>
  <div data-late-slot></div>
</div>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelector("[data-late-slot]").outerHTML = '<div data-fx="foliage-sway" style="width: 140px; left: 60%; bottom: -200px; transform: scaleX(-1)"></div>', 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
