<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>flip-reveal-count — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  main { display: flex; flex-wrap: wrap; gap: 40px; justify-content: center; padding: 60px 20px; }
  .card { width: 300px; height: 230px; }
  .card > * { border-radius: var(--kf-radius-lg); box-shadow: var(--kf-shadow-lift); }
  .face-front { background: var(--kf-surface); color: var(--kf-dim); font: 600 28px/1 var(--kf-font-display); }
  .face-back { height: 100%; padding: 24px; text-align: center; background: var(--kf-accent); color: var(--kf-on-accent); }
  .face-back svg { display: block; width: 200px; margin: 0 auto -60px; }
  .face-back b { display: block; font: 600 64px/1 var(--kf-font-display); }
</style>
</head>
<body>
<p class="demo-hint"><b>flip-reveal-count</b> On open, the front card flips on the Y axis to show the back, and the numbers and ticks fill in (reload to see it again).</p>
<main>
  <div class="card" data-fx="flip-reveal-count">
    <div class="face-front" data-fx-part="front">Logo</div>
    <div class="face-back" data-fx-part="back">
      <svg viewBox="0 0 200 110" aria-hidden="true"><path d="M20 100a80 80 0 0 1 160 0" fill="none" stroke="currentColor" stroke-opacity=".35" stroke-width="3"/><path data-fx-part="arc" d="M20 100a80 80 0 0 1 152 -36" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><circle data-fx-part="knob" cx="172" cy="64" r="5" fill="currentColor"/></svg>
      <b><span data-fx-part="num" data-to="95">95</span>%</b>
    </div>
  </div>
  <div class="card" data-fx="flip-reveal-count" data-demo-remove><div class="face-front" data-fx-part="front">Erased</div><div class="face-back" data-fx-part="back"><b>—</b></div></div>
  <div class="card" data-fx="flip-reveal-count"></div>
  <template data-demo-late><div class="card" data-fx="flip-reveal-count" data-fx-flip-reveal-count="delay: 0; dur: .8; count: 1"><div class="face-front" data-fx-part="front">Late</div><div class="face-back" data-fx-part="back"><b><span data-fx-part="num" data-to="42">42</span></b></div></div></template>
</main>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
