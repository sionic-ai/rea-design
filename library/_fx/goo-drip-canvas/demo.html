<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>goo-drip-canvas — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { margin: 0; background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { margin: 0; padding: 12px 20px; border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { display: grid; gap: 24px; padding: 48px 20px 120px; }
  .wrap { padding-bottom: 160px; }
  .card { position: relative; }
  .card { width: min(100%, 420px); padding: 32px; border-radius: var(--kf-radius-md); background: var(--kf-contrast-bg); color: var(--kf-contrast-ink); }
  .card [data-fx-part="point"] { position: absolute; bottom: 4px; width: 1px; height: 1px; color: var(--kf-contrast-bg); }
</style>
</head>
<body>
<p class="demo-hint"><b>goo-drip-canvas</b> — A line stretches from the card’s bottom edge into the empty space below, then a drop falls, and it repeats (watch closely).</p>
<section class="demo" id="demo">
  <div class="wrap" data-fx="goo-drip-canvas"><div class="card">
    <p>Your two lines of card text here. Chocolate flows down from four spots on the bottom edge.</p>
    <span data-fx-part="point" style="left: 18%"></span><span data-fx-part="point" style="left: 42%"></span><span data-fx-part="point" style="left: 66%"></span><span data-fx-part="point" style="left: 88%"></span>
  </div></div>
  <div class="wrap" id="gone" data-fx="goo-drip-canvas" data-fx-goo-drip-canvas="scale: .7"><div class="card">
    <p>Card about to drop out (thin line)</p>
    <span data-fx-part="point" style="left: 30%"></span><span data-fx-part="point" style="left: 70%"></span>
  </div></div>
</section>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
  // Check that it attaches to late cards too (after 1s) and that detaching runs when a card is removed (after 2.5s)
  setTimeout(() => {
    const src = document.querySelector(".wrap");
    if (!src) return;
    const late = src.cloneNode(true);
    late.querySelectorAll(".fx-goo-canvas").forEach((c) => c.remove());
    document.getElementById("demo").append(late);
  }, 1000);
  setTimeout(() => document.getElementById("gone")?.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s one more card comes in, and after 2.5s one drops out.");
</script>
</body>
</html>
