<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>oval-redraw-hover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { padding: 48px 20px; display: flex; flex-wrap: wrap; gap: 32px; align-items: center; }
  .oval { width: 185px; font-size: 15px; }
  .dark { padding: 32px; border-radius: var(--kf-radius-md); background: var(--kf-accent); color: var(--kf-on-accent); display: flex; gap: 24px; }
</style>
</head>
<body>
<p class="demo-hint"><b>oval-redraw-hover</b> — Hover over the oval button. The hand-drawn oval is redrawn from the start.</p>
<section class="demo">
  <a href="#" class="oval" data-fx="oval-redraw-hover"><svg data-fx-part="oval" viewBox="0 0 233 90"><path d="M30 18C70 4 170 2 208 22 236 38 226 70 180 80 120 92 50 88 20 70-6 54 6 30 40 16"/><path d="M60 10C110 2 196 8 220 34 234 52 210 76 150 84"/></svg><span data-fx-part="label">Your button text here</span></a>
  <a href="#" class="oval" data-fx="oval-redraw-hover" style="--fx-dur: .8s; --fx-weight: 1.2"><svg data-fx-part="oval" viewBox="0 0 233 90"><path d="M30 18C70 4 170 2 208 22 236 38 226 70 180 80 120 92 50 88 20 70-6 54 6 30 40 16"/></svg><span data-fx-part="label">Phone plate (.8s · thin line)</span></a>
  <div class="dark"><a href="#" class="oval" data-fx="oval-redraw-hover" style="--fx-weight: 1"><svg data-fx-part="oval" viewBox="0 0 233 90"><path d="M30 18C70 4 170 2 208 22 236 38 226 70 180 80 120 92 50 88 20 70-6 54 6 30 40 16"/><path d="M60 10C110 2 196 8 220 34 234 52 210 76 150 84"/></svg><span data-fx-part="label">On a dark background</span></a></div>
</section>
<script>
(() => {
  const src = document.querySelector('[data-fx~="oval-redraw-hover"]');
  if (!src) return;
  const html = src.outerHTML;
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => src.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical one comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="../fx-core.js"></script>
</body>
</html>
