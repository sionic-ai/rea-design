<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>wheel-stage-scroll — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .wall { height: 560vh; background: var(--kf-contrast-bg); color: var(--kf-contrast-ink); }
  .wall--short { height: 300vh; }
  .stage { display: grid; place-items: center; }
  .bar { position: absolute; left: 10%; right: 10%; bottom: 12vh; height: 2px; background: color-mix(in oklab, var(--kf-contrast-ink) 20%, transparent); }
  .bar i { position: absolute; inset: 0 auto 0 0; width: calc(var(--fx-progress, 0) * 100%); background: var(--kf-accent); }
  .ring { width: 30vmin; aspect-ratio: 1; border-radius: 50%; border: 2px solid var(--kf-contrast-ink); transform: rotate(calc(var(--fx-progress, 0) * 720deg)) scale(calc(0.4 + var(--fx-progress, 0))); }
  .ring::after { content: ""; display: block; width: 12%; aspect-ratio: 1; border-radius: 50%; background: var(--kf-accent); margin: -6% auto 0; }
  .after { height: 80vh; display: grid; place-items: center; color: var(--kf-dim); }
</style>
</head>
<body>
<p class="demo-hint"><b>wheel-stage-scroll</b> — Scroll down with the mouse wheel. The wheel is hijacked and the stage advances heavily step by step, and scrolling further at the end releases the page. <span style="color:var(--kf-dim)">(After 1s one more section comes in, and one leaves 2.5s later)</span></p>
<section class="wall" data-fx="wheel-stage-scroll">
  <div class="stage" data-fx-part="stage"><div class="ring"></div><div class="bar"><i></i></div></div>
</section>
<section class="wall wall--short" data-demo-remove data-fx="wheel-stage-scroll" data-fx-wheel-stage-scroll="wait: true">
  <div class="stage" data-fx-part="stage"><p>Section to be removed soon</p></div>
</section>
<template data-demo-late><section class="wall wall--short" data-fx="wheel-stage-scroll" data-fx-wheel-stage-scroll="wait: true; length: 800; stops: 0.5; pauses: 0.5; commit: 0.2">
  <div class="stage" data-fx-part="stage"><div class="bar"><i></i></div></div>
</section></template>
<div class="after">Normal scroll starts here</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
