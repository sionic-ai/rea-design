<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>velocity-reel — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 2; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .row { display: flex; gap: 24px; padding: 40px 20px; }
  .reel { width: 280px; height: 320px; background: var(--kf-contrast-bg); color: var(--kf-contrast-ink); font: 400 42px/.9 var(--kf-font-display); }
  .spacer { height: 150vh; }
</style>
</head>
<body>
<p class="demo-hint"><b>velocity-reel</b> — The word band slowly flows upward. Scroll the page quickly and it speeds up accordingly. After 1 second another band is added, and after 2 seconds the first band drops out.</p>
<div class="row" id="row">
  <div class="reel" data-fx="velocity-reel"><div data-fx-part="track"><span>Screen</span><span>Business card</span><span>Editing</span><span>Video</span><span>Advertisement</span></div></div>
  <div class="reel" data-fx="velocity-reel" data-fx-velocity-reel="base: 40; boost: 0"><div data-fx-part="track"><span>Always the same</span><span>Speed</span><span>Band</span></div></div>
</div>
<div class="spacer"></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
  setTimeout(() => { const d = document.createElement("div"); d.className = "reel"; d.dataset.fx = "velocity-reel"; d.innerHTML = '<div data-fx-part="track"><span>Late</span><span>Whole</span><span>Band</span></div>'; document.getElementById("row").append(d); }, 1000);
  setTimeout(() => document.querySelector("#row > :first-child").remove(), 2000);
</script>
</body>
</html>
