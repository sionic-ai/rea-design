<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>graffiti-swap-hover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { display: grid; gap: 48px; padding: 64px 20px; text-align: center; }
  .t { margin: 0; font: italic 300 64px/0.92 var(--kf-font-display); text-transform: uppercase; }
</style>
</head>
<body>
<p class="demo-hint"><b>graffiti-swap-hover</b> — Hover over the title. The same text switches to a graffiti typeface.</p>
<section class="demo">
  <h2 class="t" data-fx="graffiti-swap-hover" data-graffiti="Your big title here">Your big title here</h2>
  <h2 class="t" data-fx="graffiti-swap-hover" data-graffiti="Two lines
Title">Two lines<br>Title</h2>
</section>
<script>
(() => {
  const src = document.querySelector('[data-fx~="graffiti-swap-hover"]');
  const make = (tag) => { const el = src.cloneNode(true); el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => src.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical one comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="../fx-core.js"></script>
</body>
</html>
