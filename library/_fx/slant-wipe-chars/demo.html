<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>slant-wipe-chars — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 500 15px/1.6 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 10; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .gap { height: 70vh; display: grid; place-items: center; color: var(--kf-dim); }
  h2 { margin: 0 auto 40vh; max-width: 900px; padding: 0 20px; font: 500 64px/1.1 var(--kf-font-display); text-transform: uppercase; color: var(--kf-accent); }
  .panel { max-width: 900px; height: 320px; margin: 0 auto 40vh; background: var(--kf-accent); border-radius: var(--kf-radius-md); }
</style>
</head>
<body>
<p class="demo-hint"><b>slant-wipe-chars</b> The first title plays on open, the rest on scroll. Letters are wiped in one by one along a 105° diagonal. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<h2 data-fx="slant-wipe-chars" data-fx-slant-wipe-chars="on: load; dur: 1">Big copy</h2>
<div class="gap">Downward</div>
<h2 data-fx="slant-wipe-chars">What we do</h2>
<h2 data-fx="slant-wipe-chars">Your two-word title here</h2>
<div class="panel" data-fx="slant-wipe-chars" data-fx-slant-wipe-chars="look: block; dur: 2; delay: 0.8"></div>
<h2 data-fx="slant-wipe-chars" data-demo-remove>Exit title</h2>
<template data-demo-late><h2 data-fx="slant-wipe-chars" data-fx-slant-wipe-chars="each: 0.08">Late-arrived title</h2></template>
<div class="gap">Footer</div>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
