<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>section-theme-switch — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  html, body { background: var(--fx-theme-bg); }
  body { margin: 0; font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 2; padding: 12px 20px; background: var(--kf-surface); color: var(--kf-ink); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  section { min-height: 90vh; display: grid; place-items: center; font: 500 40px/1 var(--kf-font-display); border-bottom: 1px dotted currentColor; }
  button { font: inherit; font-size: 14px; padding: 8px 16px; border: 1px solid currentColor; border-radius: 20px; background: none; color: inherit; cursor: pointer; }
</style>
</head>
<body>
<p class="demo-hint"><b>section-theme-switch</b> — Scroll down. When a section crosses the center line of the screen, the whole page background changes to that section’s skin over .8s. The button in the third section changes that section’s skin.</p>
<main data-fx="section-theme-switch">
  <section data-bg="base">Default Skin</section>
  <section data-bg="contrast">Contrast Skin</section>
  <section data-bg="accent" data-demo-toggle><div>Highlight Skin <button type="button">Switch to contrast</button></div></section>
  <section data-bg="base">Back to default</section>
</main>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
gsap.registerPlugin(ScrollTrigger);
const sec = document.querySelector("[data-demo-toggle]");
sec.querySelector("button").addEventListener("click", () => sec.dataset.bg = sec.dataset.bg === "accent" ? "contrast" : "accent");
// Attaches to a late-arriving panel, then detaches after 2.5s
setTimeout(() => {
  const m = document.createElement("div");
  m.dataset.fx = "section-theme-switch";
  m.innerHTML = '<div data-bg="contrast" style="height:10px"></div>';
  document.body.append(m);
  setTimeout(() => m.remove(), 1500);
}, 1000);
</script>
</body>
</html>
