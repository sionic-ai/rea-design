<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>duotone-card-hover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { padding: 48px 20px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 0; list-style: none; margin: 0; padding: 0; }
  .card { aspect-ratio: 2 / 3; display: grid; place-items: center; }
  .card .wf-img { position: absolute; inset: 0; height: 100%; }
  .card span { color: var(--kf-on-accent); font: 500 12px/1 var(--kf-font-sans); letter-spacing: .03em; }
</style>
</head>
<body>
<p class="demo-hint"><b>duotone-card-hover</b> — Hover over a card. Only that card regains its color while the others recede.</p>
<section class="demo">
  <ul class="cards" data-fx="duotone-card-hover">
    <li class="card" data-fx-part="card"><div class="wf-img" data-fx-part="photo" data-label="Photo 1"></div><div class="wf-img" data-fx-part="alt" data-label="Second Photo"></div><span data-fx-part="label">One card</span></li>
    <li class="card" data-fx-part="card"><div class="wf-img" data-fx-part="photo" data-label="Photo 2"></div><span data-fx-part="label">Card two</span></li>
    <li class="card" data-fx-part="card"><div class="wf-img" data-fx-part="photo" data-label="Photo 3"></div><div class="wf-img" data-fx-part="alt" data-label="Second Photo"></div><span data-fx-part="label">Card three</span></li>
  </ul>
</section>
<script>
// Late arrivals and removals — checks that fx-core attaches to an element added after 1s and detaches from an element removed after 2.5s
(() => {
  const src = document.querySelector('[data-fx~="duotone-card-hover"]');
  if (!src) return;
  const html = src.outerHTML.replace(/\sid="[^"]*"/g, "");
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => src.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical one comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
</body>
</html>
