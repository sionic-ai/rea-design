<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>progress-swap-slides — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { padding: 48px 20px; display: grid; gap: 40px; }
  .frame { position: relative; overflow: hidden; width: min(520px, 100%); aspect-ratio: 3 / 2; border-radius: var(--kf-radius-md); background: var(--kf-surface); }
  .frame [data-fx-part="slide"] { display: grid; place-items: center; font-size: 20px; }
  [data-fx-part="bars"] { margin: 16px 0 0 24px; }
  .dark { padding: 24px; background: var(--kf-contrast-bg); color: var(--kf-contrast-ink); border-radius: var(--kf-radius-md); width: fit-content; }
</style>
</head>
<body>
<p class="demo-hint"><b>progress-swap-slides</b> — When the bar fills over 2 seconds, the panel slides out left and the next one enters from the right. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<section class="demo">
  <div data-fx="progress-swap-slides"><div class="frame"><div data-fx-part="slide">Panel 1</div><div data-fx-part="slide">Panel 2</div><div data-fx-part="slide">Panel 3</div></div><div data-fx-part="bars"></div></div>
  <div class="dark"><div data-fx="progress-swap-slides" data-fx-progress-swap-slides="hold: 1.5; dur: 0.6; look: light"><div class="frame"><div data-fx-part="slide">Photo 1</div><div data-fx-part="slide">Photo 2</div></div><div data-fx-part="bars"></div></div></div>
  <div data-demo-remove data-fx="progress-swap-slides"><div class="frame"><div data-fx-part="slide">Removable panel 1</div><div data-fx-part="slide">Removable panel 2</div></div><div data-fx-part="bars"></div></div>
  <template data-demo-late><div data-fx="progress-swap-slides"><div class="frame"><div data-fx-part="slide">Late-arriving panel 1</div><div data-fx-part="slide">Late-arriving panel 2</div></div><div data-fx-part="bars"></div></div></template>
</section>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); window.ScrollTrigger?.refresh(); }, 2500);
</script>
</body>
</html>
