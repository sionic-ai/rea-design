<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>column-stripe-scrub — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo-spacer { height: 70vh; display: grid; place-items: center; color: var(--kf-dim); }
  .big { height: 300vh; }
  .big .wf-img { position: absolute; inset: 0; height: 100%; border-radius: 0; }
  .big p { position: absolute; left: 10vw; top: 40%; z-index: 2; margin: 0; max-width: 60vw; font: 400 44px/1.25 var(--kf-font-display); color: var(--kf-contrast-ink); }
</style>
</head>
<body>
<p class="demo-hint"><b>column-stripe-scrub</b> — Scroll down: vertical strips peel away one after another to open the photo, the quote text lights up, then the strips cover it again.</p>
<div class="demo-spacer">Scroll down</div>
<section class="big" data-fx="column-stripe-scrub">
  <div data-fx-part="stage">
    <div class="wf-img" data-label="B&W person crossing a crosswalk · angled from above · full-width landscape"></div>
    <p data-fx-part="text">Place one quoted sentence across two lines</p>
  </div>
</section>
<div class="demo-spacer"></div>
<script>
(() => {
  const src = document.querySelector('[data-fx~="column-stripe-scrub"]');
  if (!src) return;
  const html = src.outerHTML.replace(/\sid="[^"]*"/g, "");
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => src.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical one comes in, and after 2.5s one drops out (detach).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../../../_shared/vendor/gsap/SplitText.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
