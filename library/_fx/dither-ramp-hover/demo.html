<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dither-ramp-hover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { margin: 0; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-row { display: flex; flex-wrap: wrap; gap: 20px; padding: 40px 20px; }
  .demo-btn { display: inline-flex; align-items: center; justify-content: space-between; gap: 40px; min-width: 260px; padding: 18px 20px; background: var(--kf-ink); color: var(--kf-bg); text-decoration: none; font: 600 15px/1 var(--kf-font-sans); }
  .demo-btn svg { width: 16px; height: 16px; fill: currentColor; }
  .demo-plus { display: grid; place-content: center; width: 48px; height: 36px; background: var(--kf-ink); color: var(--kf-bg); font: 400 22px/1 var(--kf-font-sans); }
</style>
</head>
<body>
<p class="demo-hint"><b>dither-ramp-hover</b> — Hover over the button. A background led by a dotted slope fills in from the left and the arrow is pushed out and swapped.</p>
<div class="demo-row">
  <a class="demo-btn" href="#" data-fx="dither-ramp-hover">View details<span data-fx-part="swap"><svg viewBox="0 0 16 16"><path d="M9 3l5 5-5 5-1-1 3.3-3.3H2V7.3h9.3L8 4z"/></svg><svg viewBox="0 0 16 16"><path d="M9 3l5 5-5 5-1-1 3.3-3.3H2V7.3h9.3L8 4z"/></svg></span></a>
  <a class="demo-btn" href="#" data-fx="dither-ramp-hover" style="--fx-fill: var(--kf-accent-soft)">Fill with a light color<span data-fx-part="swap"><svg viewBox="0 0 16 16"><path d="M9 3l5 5-5 5-1-1 3.3-3.3H2V7.3h9.3L8 4z"/></svg><svg viewBox="0 0 16 16"><path d="M9 3l5 5-5 5-1-1 3.3-3.3H2V7.3h9.3L8 4z"/></svg></span></a>
  <span class="demo-plus" data-fx="dither-ramp-hover" data-fx-dither-ramp-hover="look: dense">+</span>
</div>
<script>
(() => {
  // Late entrants and ones being removed. These are CSS parts, so only the attaching needs checking
  const row = document.querySelector(".demo-row");
  const tpl = row.firstElementChild.cloneNode(true);
  const gone = tpl.cloneNode(true);
  row.append(gone);
  setTimeout(() => { const late = tpl.cloneNode(true); late.firstChild.textContent = "Late-arriving button"; row.append(late); }, 1000);
  setTimeout(() => gone.remove(), 2500);
})();
</script>
<script src="../fx-core.js"></script>
</body>
</html>
