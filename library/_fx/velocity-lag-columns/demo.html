<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>velocity-lag-columns — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; padding: 96px 40px 60vh; align-items: start; }
  .demo-col { display: flex; flex-direction: column; gap: 20px; }
  .demo-col:nth-child(even) { margin-top: 80px; }
  .demo-col .wf-img { aspect-ratio: 3 / 4; }
</style>
</head>
<body>
<p class="demo-hint"><b>velocity-lag-columns</b> — Roll the wheel fast. Each column follows late by a different amount, so the wall goes out of step, then lines up when it stops. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<main class="demo" data-fx="velocity-lag-columns">
  <div class="demo-col" data-fx-part="item"><div class="wf-img" data-label="Card"></div><div class="wf-img" data-label="Card"></div><div class="wf-img" data-label="Card"></div><div class="wf-img" data-label="Card"></div></div>
  <div class="demo-col" data-fx-part="item"><div class="wf-img" data-label="Card"></div><div class="wf-img" data-label="Card"></div><div class="wf-img" data-label="Card"></div><div class="wf-img" data-label="Card"></div></div>
  <div class="demo-col" data-fx-part="item" data-demo-remove><div class="wf-img" data-label="Card"></div><div class="wf-img" data-label="Card"></div><div class="wf-img" data-label="Card"></div><div class="wf-img" data-label="Card"></div></div>
  <template data-demo-late><div class="demo-col" data-fx-part="item"><div class="wf-img" data-label="Late-arriving row"></div><div class="wf-img" data-label="Card"></div><div class="wf-img" data-label="Card"></div></div></template>
</main>
<div data-fx="velocity-lag-columns" style="display:grid;grid-template-columns:1fr 1fr"></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
