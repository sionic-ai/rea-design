<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>arc-sink-opening — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .page { display: grid; place-items: center; height: 70vh; font-size: 28px; }
  .box { position: relative; height: 220px; margin: 20px; border: 1px solid var(--kf-line); overflow: hidden; }
  .box [data-fx~="arc-sink-opening"] { position: absolute; z-index: 1; }
  .logo { font: 700 28px/1 var(--kf-font-display); letter-spacing: .1em; }
</style>
</head>
<body>
<p class="demo-hint"><b>arc-sink-opening</b> — Try refreshing. After the logo forms, at 1.5s the curtain draws a round arc and lifts downward. <span style="color:var(--kf-dim)">(After 1s one more small panel comes in, and after 2.5s one leaves)</span></p>
<div data-fx="arc-sink-opening"><span class="logo" data-fx-part="logo">BRAND NAME</span></div>
<main class="page">Page behind the curtain</main>
<div class="box" data-demo-remove><div data-fx="arc-sink-opening" data-fx-arc-sink-opening="hold: 2; from: 60%"><span class="logo" data-fx-part="logo">SMALL</span></div></div>
<template data-demo-late><div class="box"><div data-fx="arc-sink-opening" data-fx-arc-sink-opening="hold: 1; dur: 1.2"><span class="logo" data-fx-part="logo">LATE</span></div></div></template>
<div class="box"><div data-fx="arc-sink-opening" data-fx-arc-sink-opening="hold: 3"></div></div>

<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
