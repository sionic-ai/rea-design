<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>chat-launcher-pop — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 9; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .band { height: 60vh; display: grid; place-items: center; border-top: 1px solid var(--kf-line); }
  .demo-head { padding: 40px 30px 34px; background: var(--kf-ink); color: var(--kf-bg); text-align: center; }
  .demo-head button { float: right; }
  .demo-foot { position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 20px; border-top: 1px solid var(--kf-line); color: var(--kf-dim); }
</style>
</head>
<body>
<p class="demo-hint"><b>chat-launcher-pop</b> Hover over the round button at bottom right and press it. Press again or hit Esc to close. <span style="color:var(--kf-dim)">(After 1s a button comes in on the left, and after 1.5s one leaves)</span></p>
<div data-fx="chat-launcher-pop">
  <div data-fx-part="panel" role="dialog" aria-label="Chat window">
    <div data-fx-part="loader"></div>
    <div class="demo-head"><button data-fx-part="dismiss" type="button">Close</button>Your consultation desk name here</div>
    <div class="demo-foot">Type a message…</div>
  </div>
  <button data-fx-part="toggle" type="button" aria-label="Open Chat">
    <span data-fx-part="icon"><svg viewBox="0 0 32 37" aria-hidden="true"><path fill="currentColor" d="M7 2h18a7 7 0 0 1 7 7v13a7 7 0 0 1-7 7H11l-7 6v-6.6A7 7 0 0 1 0 22V9a7 7 0 0 1 7-7z"/></svg></span>
    <span data-fx-part="close"></span>
  </button>
</div>
<div id="gone" data-fx="chat-launcher-pop" data-fx-chat-launcher-pop="wait: 0; dur: .2" style="--fx-gap: 100px">
  <div data-fx-part="panel"></div>
  <button data-fx-part="toggle" type="button" aria-label="Soon-Removed Button"><span data-fx-part="close"></span></button>
</div>
<section class="band">Your section 1 here</section>
<section class="band">Your section 2 here</section>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
  setTimeout(() => {
    const d = document.createElement("div");
    d.dataset.fx = "chat-launcher-pop";
    d.setAttribute("data-fx-chat-launcher-pop", "wait: 0; rise: 40; load: 0");
    d.style.cssText = "right: auto; left: 100px; --fx-size: 48px; --fx-panel-w: 280px; --fx-panel-h: 360px";
    d.innerHTML = '<div data-fx-part="panel" style="left: 0; right: auto"><div data-fx-part="loader"></div><div class="demo-head">Late window</div></div><button data-fx-part="toggle" type="button" aria-label="Late-arrived Button" style="left: 0; right: auto"><span data-fx-part="close"></span></button>';
    document.body.append(d);
  }, 1000);
  setTimeout(() => document.getElementById("gone").remove(), 1500);
</script>
</body>
</html>
