<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>plate-pop-hover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { margin: 0; background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; margin: 0; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .pp-btn { display: inline-flex; align-items: center; justify-content: center; width: 240px; height: 60px; border-radius: 30px; background: var(--kf-accent); color: var(--kf-on-accent); font-weight: 700; }
  .pp-dot { display: inline-grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; background: var(--kf-accent); color: var(--kf-on-accent); }
</style>
</head>
<body>
<p class="demo-hint"><b>plate-pop-hover</b> — Hover over the button. The back plate folds and the button bounces back at 1.1x.</p>
<main style="padding:60px 20px;display:grid;gap:40px;justify-items:start">
  <a href="#" class="pp-btn" data-fx="plate-pop-hover">Your button text here</a>
  <a href="#" class="pp-dot" data-fx="plate-pop-hover" style="--fx-shift: 3px" aria-label="Round icon button">→</a>
  <a href="#" class="pp-btn" data-fx="plate-pop-hover" data-fx-plate-pop-hover="look: still">Non-enlarging Type</a>
</main>
<script>
// Late arrivals and removals — checks that fx-core attaches to an element added after 1s and detaches from an element removed after 2.5s
(() => {
  const src = document.querySelector('[data-fx~="plate-pop-hover"]');
  if (!src) return;
  const html = src.outerHTML.replace(/\sid="[^"]*"/g, "");
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const host = src.closest("[data-demo-host]") || src;
  const gone = make("gone");
  host.after(gone);
  setTimeout(() => host.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical one comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="../fx-core.js"></script>
</body>
</html>
