<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>poster-swarm — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .swarm { height: 800vh; }
  .swarm h2 { position: absolute; left: 24px; top: 80px; font: var(--kf-weight-display) 48px/1 var(--kf-font-display); }
  .pad { height: 50vh; }
</style>
</head>
<body>
<p class="demo-hint"><b>poster-swarm</b> — Scroll down. A flock of posters changes: scatter → wall → ring → checkerboard → cylinder → field → pile → trail.</p>
<section class="swarm" data-fx="poster-swarm" data-fx-poster-swarm="side: 3">
  <div data-fx-part="stage"><h2>Poster Peel-off</h2></div>
  <div data-fx-part="item" data-title="Signal"></div><div data-fx-part="item" data-title="Upward"></div><div data-fx-part="item" data-title="Paper"></div><div data-fx-part="item" data-title="Flight"></div>
</section>
<div class="pad"></div>
<script>
(() => {
  const src = document.querySelector('[data-fx~="poster-swarm"]');
  if (!src) return;
  const html = src.outerHTML;
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; el.style.height = "200vh"; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => src.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical one comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="three-global.js"></script>
<script src="../../_vendor/three@0.182.0/build/three.cjs"></script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script>gsap.registerPlugin(ScrollTrigger);</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
