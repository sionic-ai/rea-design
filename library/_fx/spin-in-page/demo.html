<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>spin-in-page — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  html, body { background: var(--kf-contrast-bg); }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  main { min-height: 100vh; color: var(--kf-ink); padding: 40px; }
  main h1 { font: 800 14vw/1 var(--kf-font-display); background: var(--kf-ink); color: var(--kf-bg); padding: 2vw; }
  main p { margin-top: 20px; font: 400 18px/1.5 var(--kf-font-sans); }
  .late { margin-top: 20px; padding: 20px; border: 1px solid var(--kf-line); }
</style>
</head>
<body>
<main data-fx="spin-in-page">
  <p class="demo-hint"><b>spin-in-page</b> — On refresh, a newspaper spins in and unfolds (992px and up).</p>
  <h1>HEADLINE</h1>
  <p>Your two body lines go here. Once the panel is fully open, scrolling is released.</p>
  <div class="late" data-demo-remove>A late panel appears below after 1 second, and this line is removed after 2.5 seconds.</div>
</main>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => {
  const late = document.createElement("section");
  late.className = "late";
  late.setAttribute("data-fx", "spin-in-page");
  late.setAttribute("data-fx-spin-in-page", "dur: .6; pause: 0; spin: .8; settle: .6; lock: 0; min: 0");
  late.textContent = "Late-attached Board";
  document.body.append(late);
}, 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
