<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>step-clip-stack — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-spacer { height: 60vh; display: grid; place-items: center; color: var(--kf-dim); }
  .pb { position: relative; display: grid; grid-template-columns: 1fr 1fr; }
  .pb__stage { position: sticky; top: 0; grid-column: 1; grid-row: 1 / span 4; height: 100vh; }
  .pb__photo { width: 100%; height: 100%; }
  .pb__dots { position: absolute; right: 12px; top: 12px; z-index: 20; display: flex; gap: 6px; }
  .pb__dots button { width: 28px; height: 28px; border: 1px solid var(--kf-ink); border-radius: 50%; background: var(--kf-surface); font: 700 12px var(--kf-font-sans); }
  .pb__step { grid-column: 2; height: 100vh; display: flex; align-items: center; padding: 0 40px; font: 700 40px/1 var(--kf-font-display); }
</style>
</head>
<body>
<p class="demo-hint"><b>step-clip-stack</b> — Scroll down. Each time a step text passes the center of the screen, the left photo opens from the left. You can also click the numbers at the top right.</p>
<div class="demo-spacer">Scroll down</div>
<section class="pb" data-fx="step-clip-stack">
  <div class="pb__stage">
    <div data-fx-part="layer"><div data-fx-part="photo"><div class="wf-img pb__photo" data-label="Step 1 photo"></div></div></div>
    <div data-fx-part="layer"><div data-fx-part="photo"><div class="wf-img pb__photo" data-label="Step 2 photo"></div></div></div>
    <div data-fx-part="layer"><div data-fx-part="photo"><div class="wf-img pb__photo" data-label="Step 3 photo"></div></div></div>
    <div data-fx-part="layer"><div data-fx-part="photo"><div class="wf-img pb__photo" data-label="Step 4 photo"></div></div></div>
    <div class="pb__dots"><button type="button" data-fx-part="dot">1</button><button type="button" data-fx-part="dot">2</button><button type="button" data-fx-part="dot">3</button><button type="button" data-fx-part="dot">4</button></div>
  </div>
  <div class="pb__step" data-fx-part="step" style="grid-row:1">Step 01</div>
  <div class="pb__step" data-fx-part="step" style="grid-row:2">Step 02</div>
  <div class="pb__step" data-fx-part="step" style="grid-row:3">Step 03</div>
  <div class="pb__step" data-fx-part="step" style="grid-row:4">Step 04</div>
</section>
<div class="demo-spacer">Footer</div>
<div class="demo-empty" data-fx="step-clip-stack"></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script>
// Late arrivals and removals — checks that fx-core attaches to an element added after 1s and detaches from an element removed after 2.5s
(() => {
  const src = document.querySelector('[data-fx~="step-clip-stack"]');
  const t = document.createElement("template");
  t.innerHTML = src.outerHTML;
  const make = (tag) => { const el = t.content.firstElementChild.cloneNode(true); el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => src.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical panel comes in, and after 2.5s one drops out (detach).");
})();
</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
