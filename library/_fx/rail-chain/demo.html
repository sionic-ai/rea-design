<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rail-chain — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .stage { height: 80vh; margin: 24px; border: 1px solid var(--kf-line); border-radius: var(--kf-radius-md); }
  .stage [data-fx-part="rail"] { position: absolute; top: 50%; left: 50%; width: 140%; transform: translate(-50%, -50%); }
  .seg { width: 70px; height: 34px; border-radius: 10px; background: var(--kf-accent); border: 2px solid var(--kf-ink); }
  .seg--head { width: 110px; height: 54px; border-radius: 40% 20% 20% 40%; background: var(--kf-ink); }
  .seg--tail { width: 90px; height: 24px; border-radius: 0 50% 50% 0; background: var(--kf-dim); }
</style>
</head>
<body>
<p class="demo-hint"><b>rail-chain</b> — Just watch. The segments enter one by one and circle along a hidden rail (after 1 second the lower stage attaches late, and after 3 seconds the upper stage detaches so the segments settle in place).</p>
<div class="stage" data-fx="rail-chain" data-fx-rail-chain="speed: 260; spacing: 80">
  <svg data-fx-part="rail" viewBox="0 0 1000 1000"><path d="M1150 300C900 150 600 250 450 420S120 800 300 860 700 600 820 420 1000 100 600 80 -150 300 -100 500"/></svg>
  <span class="seg seg--head" data-fx-part="link" data-key="0.7 0.5"></span>
  <span class="seg" data-fx-part="link"></span><span class="seg" data-fx-part="link"></span><span class="seg" data-fx-part="link"></span>
  <span class="seg" data-fx-part="link"></span><span class="seg" data-fx-part="link"></span><span class="seg" data-fx-part="link"></span>
  <span class="seg seg--tail" data-fx-part="link" data-key="0.15 0.5"></span>
</div>
<div class="stage" id="late"></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
  setTimeout(() => {
    const late = document.getElementById("late"), src = document.querySelector('.stage[data-fx]');
    if (!late || !src) return;
    late.innerHTML = src.innerHTML;
    late.setAttribute("data-fx-rail-chain", "speed: 200; spacing: 70");
    late.setAttribute("data-fx", "rail-chain");
  }, 1000);
  setTimeout(() => document.querySelector(".stage")?.removeAttribute("data-fx"), 3000);
</script>
</body>
</html>
