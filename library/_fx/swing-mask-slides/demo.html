<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>swing-mask-slides — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .stage { position: relative; width: min(900px, 90vw); aspect-ratio: 892 / 835; margin: 40px auto; }
  .stage [data-fx-part="slide"] { position: absolute; inset: 0; }
  .set { position: relative; width: 100%; height: 100%; }
  .ph { position: absolute; background: var(--kf-raised); }
  .ph.-a { top: 0; left: 0; width: 55%; aspect-ratio: 217 / 290; }
  .ph.-b { right: 0; top: 11%; width: 36%; aspect-ratio: 125 / 167; background: var(--kf-dim); }
  .ph.-c { bottom: 0; left: 51%; width: 38%; aspect-ratio: 171 / 128; background: var(--kf-ink-soft); }
  .cap { text-align: center; }
  .empty { height: 40px; margin: 20px; }
</style>
</head>
<body>
<p class="demo-hint"><b>swing-mask-slides</b> — Left alone, the photo bundle folds away every 3 seconds and the next bundle flies in at an angle. Move the mouse over the panel and press a circle to jump to it. <span style="color:var(--kf-dim)">(One more panel comes in after 1s, and an empty panel drops out after 2.5s)</span></p>
<div class="stage" data-fx="swing-mask-slides" data-fx-swing-mask-slides="interval: 3" id="demo">
  <button data-fx-part="cursor" type="button"><span data-fx-part="cursor-text">Next</span></button>
  <div data-fx-part="slide"><div class="set"><div class="ph -a" data-fx-part="img"></div><div class="ph -b" data-fx-part="img"></div><div class="ph -c" data-fx-part="img"></div></div></div>
  <div data-fx-part="slide"><div class="set"><div class="ph -a" data-fx-part="img"></div><div class="ph -b" data-fx-part="img"></div><div class="ph -c" data-fx-part="img"></div></div></div>
  <div data-fx-part="slide"><div class="set"><div class="ph -a" data-fx-part="img"></div><div class="ph -b" data-fx-part="img"></div><div class="ph -c" data-fx-part="img"></div></div></div>
</div>
<p class="cap" id="cap">Section 1</p>
<div class="empty" data-fx="swing-mask-slides" data-demo-remove></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
document.getElementById("demo").addEventListener("fx:slide", (e) => { document.getElementById("cap").textContent = `Section ${e.detail.index + 1}`; });
setTimeout(() => document.body.insertAdjacentHTML("beforeend", '<div class="stage" style="width:300px" data-fx="swing-mask-slides" data-fx-swing-mask-slides="interval: 2; finish: .8"><div data-fx-part="slide"><div class="set"><div class="ph -a" data-fx-part="img"></div></div></div><div data-fx-part="slide"><div class="set"><div class="ph -c" data-fx-part="img"></div></div></div></div>'), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
