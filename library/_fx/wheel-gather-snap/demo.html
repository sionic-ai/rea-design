<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>wheel-gather-snap — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: fixed; top: 0; left: 0; right: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .slide { display: grid; place-items: center; }
  .slide i { display: block; width: min(60vh, 70vw); aspect-ratio: 1; background: var(--kf-raised); }
  .slide:nth-child(even) i { background: var(--kf-accent-soft); }
  .count { position: fixed; right: 40px; bottom: 30px; z-index: 5; font-weight: 700; }
</style>
</head>
<body>
<p class="demo-hint"><b>wheel-gather-snap</b> — Roll the wheel a little. The panel follows slightly and returns in place when you rest, roll more and it moves to the next slot. <span style="color:var(--kf-dim)">(After 1s one more cell comes in, and one leaves 2.5s later)</span></p>
<section data-fx="wheel-gather-snap">
  <div data-fx-part="track">
    <div class="slide" data-fx-part="slide"><i></i></div>
    <div class="slide" data-fx-part="slide"><i></i></div>
    <div class="slide" data-fx-part="slide" data-demo-remove><i></i></div>
    <div class="slide" data-fx-part="slide"><i></i></div>
    <template data-demo-late><div class="slide" data-fx-part="slide"><i></i></div></template>
  </div>
</section>
<p class="count">Slot <span id="n">1</span></p>
<section data-fx="wheel-gather-snap" style="--fx-h: 0px"></section>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
document.querySelector('[data-fx="wheel-gather-snap"]').addEventListener("fx:slide", (e) => (document.getElementById("n").textContent = e.detail.index + 1));
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
