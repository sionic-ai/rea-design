<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>layer-wipe-button — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { margin: 0; background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { padding: 48px 20px; display: grid; gap: 16px; max-width: 460px; }
  .btn { display: flex; align-items: flex-end; height: 70px; padding: 12px; border-radius: var(--kf-radius-sm); background: var(--kf-contrast-bg); color: var(--kf-contrast-ink); text-decoration: none; box-sizing: border-box; --lw-b: var(--kf-ink); }
  .btn [data-fx-part="icon"] { background: var(--kf-contrast-ink); color: var(--kf-contrast-bg); }
  .btn.is-light { background: var(--kf-surface); color: var(--kf-ink); --lw-b: var(--kf-raised); }
  .btn.is-light [data-fx-part="icon"] { background: var(--kf-ink); color: var(--kf-surface); }
</style>
</head>
<body>
<p class="demo-hint"><b>layer-wipe-button</b> — Hover over the button. A double-layer curtain fills up and the text and arrow change.</p>
<div class="demo">
  <a class="btn" href="#" data-fx="layer-wipe-button"><span data-fx-part="label">Your button text here</span><span data-fx-part="icon"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M5 10h9M10.5 6l4 4-4 4"/></svg></span></a>
  <a class="btn is-light" href="#" data-fx="layer-wipe-button" data-fx-layer-wipe-button="dir: up-right"><span data-fx-part="label">Light button · top right</span><span data-fx-part="icon"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M6 14l8-8M8 6h6v6"/></svg></span></a>
  <a class="btn" href="#" data-fx="layer-wipe-button"></a>
</div>
<script>
(() => {
  const src = document.querySelector('[data-fx~="layer-wipe-button"]');
  const html = src.outerHTML;
  const make = () => { const t = document.createElement("template"); t.innerHTML = html; return t.content.firstElementChild; };
  const gone = make();
  src.after(gone);
  setTimeout(() => src.after(make()), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s one more button comes in, and after 2.5s one drops out.");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
