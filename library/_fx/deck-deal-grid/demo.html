<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>deck-deal-grid — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  html, body { height: 100%; overflow: hidden; }
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: relative; z-index: 9; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .rack { height: calc(100vh - 45px); overflow-y: auto; }
  .plan { min-height: 100%; padding: 40px 4vw; }
  .plan h2 { margin: 0 0 24px; font: 700 32px/1 var(--kf-font-display); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .grid article { min-height: 170px; padding: 20px; border: 1px solid var(--kf-line); border-radius: var(--kf-radius-md); background: var(--kf-surface); }
  .grid article:last-child { grid-column: 1 / -1; min-height: 240px; }
  [data-fx-part="card"] { border: 1px solid var(--kf-accent); border-radius: 16px; background: var(--kf-raised); box-shadow: var(--kf-shadow-lift); padding: 24px 32px; }
  .hint { position: fixed; bottom: 24px; left: 50%; translate: -50% 0; font: 600 11px/1 var(--kf-font-mono); }
</style>
</head>
<body>
<p class="demo-hint"><b>deck-deal-grid</b> — Scroll the wheel down. A pile of lying cards spins and scatters into a grid. At the very top, wheel up and they regather.</p>
<div class="rack">
  <section class="plan" data-fx="deck-deal-grid" data-fx-deck-deal-grid="scroller: .rack">
    <h2 data-fx-part="title">Plan</h2>
    <div data-fx-part="deck"><div data-fx-part="card"></div><div data-fx-part="card"></div><div data-fx-part="card"></div><div data-fx-part="card"></div><div data-fx-part="card"><b data-fx-part="cover">Plan · 01</b></div></div>
    <div class="grid"><article data-fx-part="target">Card 1</article><article data-fx-part="target">Card 2</article><article data-fx-part="target">Card 3</article><article data-fx-part="target">Card 4</article><article data-fx-part="target">Card 5</article></div>
    <span class="hint" data-fx-part="hint">SCROLL TO DISCOVER</span>
  </section>
  <section data-fx="deck-deal-grid" data-demo-remove><div data-fx-part="deck"><div data-fx-part="card"></div></div></section>
  <div id="late"></div>
  <section data-fx="deck-deal-grid"></section>
</div>
<template data-demo-late><section data-fx="deck-deal-grid" data-fx-deck-deal-grid="spin: 360; each: .1"><div data-fx-part="deck"><div data-fx-part="card"></div><div data-fx-part="card"></div></div></section></template>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => document.getElementById("late").append(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
