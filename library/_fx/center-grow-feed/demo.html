<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>center-grow-feed — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .feed { position: relative; max-width: 900px; margin: 40vh auto 80vh; padding: 0 20px; }
  .feed .ind { position: sticky; top: 50%; z-index: 2; display: flex; justify-content: space-between; pointer-events: none; height: 1.4em; overflow: clip; }
  .feed [data-fx-part="item"] { aspect-ratio: 16 / 9; border-radius: 12px; overflow: hidden; }
  .feed .wf-img { height: 100%; }
</style>
</head>
<body>
<p class="demo-hint"><b>center-grow-feed</b> — Scroll down. Only the one video past the 60% line of the screen swells, and the title on the right rolls over to change. <span style="color:var(--kf-dim)">(One more line comes in after 1s, and one panel drops out after 2.5s)</span></p>
<section class="feed" data-fx="center-grow-feed">
  <div class="ind"><span>Work</span><span><span data-fx-part="titles" style="display:block"><span>Work One</span><span>Work Two</span><span>Work Three</span></span></span></div>
  <a href="#" data-fx-part="item"><span class="wf-img" data-label="Video 1"></span></a>
  <a href="#" data-fx-part="item"><span class="wf-img" data-label="Video 2"></span></a>
  <a href="#" data-fx-part="item"><span class="wf-img" data-label="Video 3"></span></a>
</section>
<section class="feed" data-fx="center-grow-feed" data-demo-remove><a href="#" data-fx-part="item"><span class="wf-img" data-label="Dropped Panel"></span></a></section>
<template data-demo-late><section class="feed" data-fx="center-grow-feed" data-fx-center-grow-feed="line: 50%"><a href="#" data-fx-part="item"><span class="wf-img" data-label="Late-arriving panel 1"></span></a><a href="#" data-fx-part="item"><span class="wf-img" data-label="Late-arriving panel 2"></span></a></section></template>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); }, 2500);
</script>
</body>
</html>
