<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>clip-title-stack — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .pad { height: 60vh; display: grid; place-items: center; }
  .shot { background: linear-gradient(160deg, var(--kf-raised), var(--kf-line)); }
  .t { display: flex; justify-content: space-between; margin-left: 50%; padding-right: 20px; font: 700 24px/1 var(--kf-font-sans); }
  .t small { font: 400 12px/1 var(--kf-font-sans); }
</style>
</head>
<body>
<p class="demo-hint"><b>clip-title-stack</b> Scroll down. The title stays pinned at center and switches to the next title when a panel boundary passes. <span style="color:var(--kf-dim)">(After 1s a panel comes in, and after 2.5s a panel group leaves)</span></p>
<div class="pad">Top section</div>
<section data-fx="clip-title-stack" id="stack">
  <article data-fx-part="item"><figure data-fx-part="media"><div class="shot"></div></figure><div data-fx-part="title"><div class="t">Panel One <small>Visual effects · color grading</small></div></div></article>
  <article data-fx-part="item"><figure data-fx-part="media"><div class="shot"></div></figure><div data-fx-part="title"><div class="t">Panel Two <small>Design</small></div></div></article>
</section>
<section data-fx="clip-title-stack" data-fx-clip-title-stack="zoom: 0; shift: 10" data-demo-remove><article data-fx-part="item"><figure data-fx-part="media"><div class="shot"></div></figure><div data-fx-part="title"><div class="t">Panel to be removed soon</div></div></article></section>
<section data-fx="clip-title-stack"></section>
<div class="pad">Lower section</div>
<template data-demo-late><article data-fx-part="item"><figure data-fx-part="media"><div class="shot"></div></figure><div data-fx-part="title"><div class="t">Late panel</div></div></article></template>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../../../_shared/vendor/gsap/CustomEase.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => {
  const stack = document.getElementById("stack");
  document.querySelectorAll("template[data-demo-late]").forEach((t) => { stack.append(t.content.cloneNode(true)); t.remove(); });
  stack.setAttribute("data-fx", "");
  requestAnimationFrame(() => stack.setAttribute("data-fx", "clip-title-stack"));
}, 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
