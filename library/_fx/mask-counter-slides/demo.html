<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mask-counter-slides — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="../../_vendor/swiper@8.4.4/swiper-bundle.min.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .stage { display: grid; grid-template-columns: repeat(3, 1fr); gap: 40px; padding: 60px; }
  .box { aspect-ratio: 3 / 4; --fx-mask: radial-gradient(circle, transparent 30%, var(--kf-ink) 31% 44%, transparent 45%); }
  .box .wf-img { height: 100%; border: 0; }
  .box [data-fx-part="pager"] { top: 20px; right: 20px; }
  .box .swiper-pagination-bullet { width: 6px; height: 6px; margin: 0 !important; background: var(--kf-surface); opacity: .5; }
  .box .swiper-pagination-bullet-active { opacity: 1; }
</style>
</head>
<body>
<p class="demo-hint"><b>mask-counter-slides</b> — Every 5 seconds the panel photo slides down while the photo inside the ring window slides up over 2 seconds, crossing past each other. <span style="color:var(--kf-dim)">(After 1s one more panel comes in, and one leaves 2.5s later)</span></p>
<div class="stage">
  <div class="box" data-fx="mask-counter-slides">
    <div class="swiper" data-fx-part="main"><div class="swiper-wrapper"><div class="swiper-slide"><div class="wf-img" data-label="Photo 1"></div></div><div class="swiper-slide"><div class="wf-img" data-label="Photo 2"></div></div></div></div>
    <div class="swiper" data-fx-part="window"><div class="swiper-wrapper"><div class="swiper-slide"><div class="wf-img" data-label="Window 1"></div></div><div class="swiper-slide"><div class="wf-img" data-label="Window 2"></div></div></div></div>
    <div data-fx-part="pager"></div>
  </div>
  <div class="box" data-demo-remove data-fx="mask-counter-slides">
    <div class="swiper" data-fx-part="main"><div class="swiper-wrapper"><div class="swiper-slide"><div class="wf-img" data-label="Removed soon 1"></div></div><div class="swiper-slide"><div class="wf-img" data-label="Removed soon 2"></div></div></div></div>
  </div>
  <template data-demo-late><div class="box" data-fx="mask-counter-slides" data-fx-mask-counter-slides="every: 2500; speed: 1200; dir: horizontal">
    <div class="swiper" data-fx-part="main"><div class="swiper-wrapper"><div class="swiper-slide"><div class="wf-img" data-label="Late 1"></div></div><div class="swiper-slide"><div class="wf-img" data-label="Late 2"></div></div></div></div>
    <div class="swiper" data-fx-part="window"><div class="swiper-wrapper"><div class="swiper-slide"><div class="wf-img" data-label="Late window 1"></div></div><div class="swiper-slide"><div class="wf-img" data-label="Late window 2"></div></div></div></div>
  </div></template>
  <div class="box" data-fx="mask-counter-slides"></div>
</div>
<script src="../../_vendor/swiper@8.4.4/swiper-bundle.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
