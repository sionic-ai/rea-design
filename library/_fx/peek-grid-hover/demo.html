<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>peek-grid-hover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-stage { position: relative; margin: 20px; }
  .demo-back { position: absolute; inset: 0; background: var(--kf-dim); }
  .demo-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-auto-rows: 180px; }
  .demo-grid [data-fx-part="photo"] { position: absolute; inset: 0; background: var(--kf-accent); }
  .demo-grid [data-fx-part="note"] { display: flex; align-items: flex-end; padding: 12px; color: var(--kf-contrast-bg); }
</style>
</head>
<body>
<p class="demo-hint"><b>peek-grid-hover</b> — Hover over a cell. Only the photo cell and text cell of the same project remain, other photos switch off and the background behind shows through.</p>
<div class="demo-stage">
  <div class="demo-back"></div>
  <div class="demo-grid" data-fx="peek-grid-hover">
    <a data-fx-part="cell" data-key="a" href="#"><span data-fx-part="photo"></span></a>
    <a data-fx-part="note" data-key="a" href="#">Work One</a>
    <div data-fx-part="cell"></div>
    <a data-fx-part="cell" data-key="b" href="#"><span data-fx-part="photo"></span></a>
    <a data-fx-part="note" data-key="b" href="#">Work Two</a>
    <a data-fx-part="cell" data-key="c" href="#"><span data-fx-part="photo"></span></a>
    <a data-fx-part="note" data-key="c" href="#">Work Three</a>
    <div data-fx-part="cell"></div>
  </div>
</div>
<script>
// Late arrivals and removals — checks that fx-core attaches to an element added after 1s and detaches from an element removed after 2.5s
(() => {
  const src = document.querySelector(".demo-stage");
  const make = (tag) => { const el = src.cloneNode(true); el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => src.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  const empty = document.createElement("div");
  empty.setAttribute("data-fx", "peek-grid-hover");
  document.body.append(empty);
  document.querySelector(".demo-hint").append(" · After 1 second one more grid comes in (a late arrival), and after 2.5 seconds one is removed (detach).");
})();
</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
