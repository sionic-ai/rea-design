<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tide-glyphs — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.6 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint button { margin-left: 8px; padding: 4px 10px; border: 1px solid var(--kf-ink); background: transparent; cursor: pointer; }
  .tide { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4vw 0; width: min(900px, 90vw); margin: 40px auto; padding: 40px; color: var(--kf-ink); }
  .tide [data-fx-part="glyph"] { display: grid; place-items: center; height: 1.1em; font: 100 clamp(28px, 5vw, 60px)/1 var(--kf-font-display); }
  .tide [data-key="bold"] { font-weight: 800; }
</style>
</head>
<body>
<p class="demo-hint"><b>tide-glyphs</b> — Thin letters float up on water after 1.5 seconds and are clipped at the wave crest. Raise the water stain and shade with the buttons.
  <button type="button" data-thin>Lift Limescale</button><button type="button" data-wave>Laying shade</button></p>
<div class="tide" data-fx="tide-glyphs" aria-label="Studio Name Sample">
  <span data-fx-part="glyph" data-key="bold">S</span><span data-fx-part="glyph">T</span><span data-fx-part="glyph">U</span><span data-fx-part="glyph">D</span><span data-fx-part="glyph">I</span><span data-fx-part="glyph">O</span><span data-fx-part="glyph">N</span>
  <span data-fx-part="glyph">A</span><span data-fx-part="glyph">M</span><span data-fx-part="glyph">E</span><span data-fx-part="glyph" data-key="bold">S</span><span data-fx-part="glyph">A</span><span data-fx-part="glyph">M</span><span data-fx-part="glyph">P</span>
</div>
<div class="tide" data-fx="tide-glyphs" data-fx-tide-glyphs="delay: 0; dur: .6" data-demo-remove>
  <span data-fx-part="glyph" data-key="bold">G</span><span data-fx-part="glyph">O</span><span data-fx-part="glyph">N</span><span data-fx-part="glyph">E</span>
</div>
<div class="tide" data-fx="tide-glyphs" data-fx-tide-glyphs="delay: 0; dur: .6">
  <span data-fx-part="glyph">Empty</span>
</div>
<div class="tide" data-fx="tide-glyphs"></div>
<template data-demo-late><div class="tide" data-fx="tide-glyphs" data-fx-tide-glyphs="delay: .2"><span data-fx-part="glyph" data-key="bold">L</span><span data-fx-part="glyph">A</span><span data-fx-part="glyph">T</span><span data-fx-part="glyph">E</span></div></template>

<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="three-global.js"></script>
<script src="../../_vendor/three@0.184.0/build/three.cjs"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
let thin = 0, wave = 0;
document.querySelector("[data-thin]").addEventListener("click", () => {
  thin = thin ? 0 : 1;
  gsap.to(".tide", { "--fx-tide-thin": thin, duration: 1 });
});
document.querySelector("[data-wave]").addEventListener("click", () => {
  wave = wave ? 0 : 0.8;
  gsap.to(".tide", { "--fx-tide-wave": wave, duration: 0.5 });
});
</script>
</body>
</html>
