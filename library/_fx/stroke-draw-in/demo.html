<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>stroke-draw-in — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 5; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .gap { height: 90vh; display: grid; place-items: center; color: var(--kf-dim); }
  svg { display: block; width: min(720px, 90vw); margin: 0 auto; fill: none; stroke: var(--kf-ink); }
  svg rect { fill: var(--kf-ink); stroke: none; }
</style>
</head>
<body>
<p class="demo-hint"><b>stroke-draw-in</b> — Scroll down — line drawings are drawn together group by group and the black areas deepen.</p>
<div class="gap">↓</div>
<svg viewBox="0 0 800 300" data-fx="stroke-draw-in" id="a"><g data-fx-part="group"><path d="M80 220H600V280H80Z"/><path d="M90 230H590"/></g><g data-fx-part="group"><path d="M120 150H560V210H120Z"/><path d="M130 160H550"/></g><g data-fx-part="group"><path d="M100 80H580V140H100Z"/></g><rect data-fx-part="fill" x="610" y="80" width="10" height="200"/></svg>
<div class="gap" id="late">Footer</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script>gsap.registerPlugin(ScrollTrigger);</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
  setTimeout(() => { const d = document.createElementNS("http://www.w3.org/2000/svg", "svg"); d.setAttribute("viewBox", "0 0 100 50"); d.dataset.fx = "stroke-draw-in"; d.innerHTML = '<path d="M10 10H90"/>'; document.getElementById("late")?.before(d); }, 1000);
  setTimeout(() => document.getElementById("a")?.remove(), 1500);
</script>
</body>
</html>
