<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>blur-dot-cursor — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 101; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { min-height: 80vh; padding: 48px 20px; display: grid; gap: 40px; align-content: start; background: var(--kf-contrast-bg); color: var(--kf-contrast-ink); }
  .row { display: flex; flex-wrap: wrap; gap: 32px; align-items: center; }
</style>
</head>
<body>
<p class="demo-hint"><b>blur-dot-cursor</b> — Move the mouse over the dark panel. A faint dot follows late, and shrinks away over a link. <span style="color:var(--kf-dim)">(After 1s one more link comes in, and after 2.5s one drops out)</span></p>
<main class="demo" data-fx="blur-dot-cursor" data-fx-blur-dot-cursor="ease: 6; size: 10; wide: 0">
  <div class="row">
    <a href="#">Your link 1 here</a>
    <a href="#" data-demo-remove>Your link 2 here</a>
    <span>Non-link text</span>
    <template data-demo-late><a href="#">Late-arriving link</a></template>
  </div>
</main>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
