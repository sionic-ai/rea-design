<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>heartbeat-in — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .head { display: flex; flex-direction: column; gap: 8px; padding: 60px 20px; }
  .head p:first-child { font: 500 56px/1 var(--kf-font-display); }
  .demo-spacer { height: 90vh; display: grid; place-items: center; color: var(--kf-dim); }
</style>
</head>
<body>
<p class="demo-hint"><b>heartbeat-in</b> On open, the title goes from blurred to sharp once like a heartbeat. Items below jump in as they enter the screen. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<div class="head" data-fx="heartbeat-in" data-fx-heartbeat-in="on: load; delay: .3"><p data-fx-part="beat">Sample Title</p><p data-fx-part="beat">Your one-line title here</p></div>
<p class="head" data-demo-remove data-fx="heartbeat-in" data-fx-heartbeat-in="on: load">Dropped Line</p>
<div class="demo-spacer">Scroll down</div>
<div class="head" data-fx="heartbeat-in"><p data-fx-part="beat">Contact</p><p data-fx-part="beat">Your inquiry here</p></div>
<template data-demo-late><p class="head" data-fx="heartbeat-in" data-fx-heartbeat-in="on: load">Late-arriving line</p></template>
<div class="demo-spacer"></div>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
