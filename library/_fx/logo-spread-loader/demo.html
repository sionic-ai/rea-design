<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>logo-spread-loader — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: relative; z-index: 2000; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .page { padding: 80px 40px; font-size: 32px; }
  .late { position: relative; height: 300px; margin: 40px; overflow: hidden; }
  .late [data-fx] { position: absolute; }
</style>
</head>
<body>
<p class="demo-hint"><b>logo-spread-loader</b> — Logo pieces light up one by one, then the frame opens out to the screen edges. Click the curtain to skip. <span style="color:var(--kf-dim)">(After 1s one more small curtain comes in, and after 2.5s one leaves)</span></p>
<div data-fx="logo-spread-loader">
  <div data-fx-part="shade"></div>
  <div data-fx-part="frame">
    <span data-fx-part="piece" data-key="tl"><svg viewBox="0 0 85 85"><polygon points="0,0 85,0 0,85"/></svg></span>
    <span data-fx-part="piece"><svg viewBox="0 0 30 346" preserveAspectRatio="none"><rect width="30" height="346"/></svg></span>
    <span data-fx-part="piece"><svg viewBox="0 0 30 346" preserveAspectRatio="none"><rect width="30" height="346"/></svg></span>
    <span data-fx-part="piece"><svg viewBox="0 0 30 346" preserveAspectRatio="none"><rect width="30" height="346"/></svg></span>
    <span data-fx-part="piece" data-key="br"><svg viewBox="0 0 80 80"><circle cx="40" cy="40" r="40"/></svg></span>
  </div>
</div>
<div data-fx="logo-spread-loader" data-demo-remove data-fx-logo-spread-loader="first: 9"><div data-fx-part="frame"><span data-fx-part="piece"><svg viewBox="0 0 30 346"><rect width="30" height="346"/></svg></span></div></div>
<main class="page"><p>Page title after the loader here</p></main>
<template data-demo-late><div class="late"><div data-fx="logo-spread-loader" data-fx-logo-spread-loader="first: .3; each: .3; hold: .5"><div data-fx-part="frame"><span data-fx-part="piece" data-key="tl"><svg viewBox="0 0 85 85"><polygon points="0,0 85,0 0,85"/></svg></span><span data-fx-part="piece" data-key="br"><svg viewBox="0 0 80 80"><circle cx="40" cy="40" r="40"/></svg></span></div></div></div></template>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
