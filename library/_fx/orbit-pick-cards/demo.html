<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>orbit-pick-cards — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .orbit { display: grid; grid-template-columns: 1fr 1fr; height: 100vh; }
  .orbit__side { display: flex; flex-direction: column; justify-content: center; gap: 2rem; padding: 2rem 4rem 2rem 2rem; }
  .orbit__side p { min-height: 3.1em; font-size: 14px; }
  .orbit .wf-img { height: 100%; border: 0; }
  @media (max-width: 720px) { .orbit { grid-template-columns: 1fr; height: auto; } .orbit [data-fx-part="stage"] { height: 70vh; } }
</style>
</head>
<body>
<p class="demo-hint"><b>orbit-pick-cards</b> — Click the list on the right. That card turns to the front and widens, and moving the mouse over the card tilts it.</p>
<section class="orbit" data-fx="orbit-pick-cards">
  <div data-fx-part="stage">
    <div data-fx-part="ring" id="ring">
      <div data-fx-part="item" data-href="#1" data-desc="A spot to describe the first work in two lines. Write what was made."><a data-fx-part="card" href="#1"><span data-fx-part="tilt"><span data-fx-part="media"><span class="wf-img" data-label="Work 1 main photo · portrait 2:3"></span></span><span data-fx-part="title"><span>Work 1</span></span><span data-fx-part="cta">Press to view</span></span></a></div>
      <div data-fx-part="item" data-href="#2" data-desc="Second work description goes here."><a data-fx-part="card" href="#2"><span data-fx-part="tilt"><span data-fx-part="media"><span class="wf-img" data-label="Work 2 · 2:3"></span></span><span data-fx-part="title"><span>Work 2</span></span><span data-fx-part="cta">Press to view</span></span></a></div>
      <div data-fx-part="item" data-href="#3" data-desc="Third task description goes here." data-demo-remove><a data-fx-part="card" href="#3"><span data-fx-part="tilt"><span data-fx-part="media"><span class="wf-img" data-label="Work 3 · 2:3"></span></span><span data-fx-part="title"><span>Work Item to Be Removed</span></span></span></a></div>
      <div data-fx-part="item" data-href="#4" data-desc="Fourth work description goes here."><a data-fx-part="card" href="#4"><span data-fx-part="tilt"><span data-fx-part="media"><span class="wf-img" data-label="Work 4 · 2:3"></span></span><span data-fx-part="title"><span>Work 4</span></span></span></a></div>
      <div data-fx-part="item" data-href="#5" data-desc="Fifth work description goes here."><a data-fx-part="card" href="#5"><span data-fx-part="tilt"><span data-fx-part="media"><span class="wf-img" data-label="Work 5 · 2:3"></span></span><span data-fx-part="title"><span>Work 5</span></span></span></a></div>
    </div>
  </div>
  <div class="orbit__side">
    <div>
      <a data-fx-part="pick" href="#1"><i data-fx-part="tile"></i><span data-fx-part="name">Work 1</span></a>
      <a data-fx-part="pick" href="#2"><i data-fx-part="tile"></i><span data-fx-part="name">Work 2</span></a>
      <a data-fx-part="pick" href="#3"><i data-fx-part="tile"></i><span data-fx-part="name">Work 3</span></a>
      <a data-fx-part="pick" href="#4"><i data-fx-part="tile"></i><span data-fx-part="name">Work 4</span></a>
      <a data-fx-part="pick" href="#5"><i data-fx-part="tile"></i><span data-fx-part="name">Work 5</span></a>
    </div>
    <p data-fx-part="desc"></p>
  </div>
</section>
<section class="orbit" data-demo-late-host></section>
<template data-demo-late><div data-fx="orbit-pick-cards" style="grid-column: 1 / -1"><div data-fx-part="stage" style="height: 100%"><div data-fx-part="ring"><div data-fx-part="item"><a data-fx-part="card" href="#a"><span data-fx-part="tilt"><span data-fx-part="media"><span class="wf-img" data-label="Late-added card A"></span></span></span></a></div><div data-fx-part="item"><a data-fx-part="card" href="#b"><span data-fx-part="tilt"><span data-fx-part="media"><span class="wf-img" data-label="Late-added card B"></span></span></span></a></div><div data-fx-part="item"><a data-fx-part="card" href="#c"><span data-fx-part="tilt"><span data-fx-part="media"><span class="wf-img" data-label="Late-added card C"></span></span></span></a></div></div></div></div></template>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../../../_shared/vendor/gsap/SplitText.min.js"></script>
<script src="../../../_shared/vendor/gsap/CustomEase.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
document.addEventListener("fx:open", (e) => { e.preventDefault(); document.querySelector(".demo-hint").lastChild.textContent = ` Open → ${e.detail.href}`; });
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => document.querySelector("[data-demo-late-host]").append(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
