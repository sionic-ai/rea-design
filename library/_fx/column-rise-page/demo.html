<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>column-rise-page — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .links { display: flex; gap: 12px; padding: 40px 20px; }
  .links a { padding: 10px 16px; border: 1px solid var(--kf-line); }
  [data-fx~="column-rise-page"] { --fx-cover: var(--kf-ink); }
  [data-fx~="column-rise-page"] [data-fx-part="mark"] { color: var(--kf-bg); font: 700 40px var(--kf-font-display); }
</style>
</head>
<body>
<p class="demo-hint"><b>column-rise-page</b> — Press the link below (same demo page) at the left, center and right positions. Strips rise from the pressed spot to cover, and when it reopens they clear upward from the left.</p>
<nav class="links" style="justify-content: space-between"><a href="demo.html?a">Left Link</a><a href="demo.html?b">Center link</a><a href="demo.html?c">Right link</a></nav>
<div data-fx="column-rise-page" aria-hidden="true"><i data-fx-part="col"></i><i data-fx-part="col"></i><i data-fx-part="col"></i><i data-fx-part="col"></i><i data-fx-part="col"></i><b data-fx-part="mark">LOGO</b></div>
<script>
(() => {
  const src = document.querySelector('[data-fx~="column-rise-page"]');
  const gone = src.cloneNode(true); src.after(gone);
  setTimeout(() => src.after(src.cloneNode(true)), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s, one more curtain layer comes in (the late one), and after 2.5s one drops out (the removal).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
