<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>edge-light-follow — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { display: grid; gap: 140px; padding: 140px 160px; max-width: 1100px; }
  .card { min-height: 260px; padding: 32px; border-radius: var(--kf-radius-lg); background: var(--kf-surface); box-shadow: var(--kf-shadow-lift); }
  .card h2 { font: 500 28px/1.2 var(--kf-font-display); margin-bottom: 8px; }
</style>
</head>
<body>
<p class="demo-hint"><b>edge-light-follow</b> — Hover a card and move along its border. Move to the opposite side and the light turns off and back on. <span style="color:var(--kf-dim)">(One more card comes in after 1s, and one drops out after 2.5s)</span></p>
<div class="demo">
  <div data-fx="edge-light-follow" data-fx-edge-light-follow="side: bottom; at: 0.72">
    <div data-fx-part="frame" class="card"><h2>One window</h2><p>Rest position at the bottom edge, 72%.</p></div>
  </div>
  <div data-fx="edge-light-follow" data-fx-edge-light-follow="side: left; at: 0.3; dust: off" data-demo-remove>
    <div class="card"><h2>Dropped Window</h2><p>Dust-free, rests at 30% from the left.</p></div>
  </div>
  <template data-demo-late><div data-fx="edge-light-follow" data-fx-edge-light-follow="side: top"><div class="card"><h2>Late window</h2><p>Rests at the center of the top side.</p></div></div></template>
  <div data-fx="edge-light-follow"></div>
</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
