<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>drop-squash — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .ground { display: flex; align-items: flex-end; gap: 8px; height: 60vh; padding: 0 40px; border-bottom: 2px solid var(--kf-line); }
  .blob { display: block; width: 64px; aspect-ratio: 1; border-radius: 46% 54% 50% 50% / 55% 50% 50% 45%; background: var(--kf-accent); }
  .blob.is-b { width: 54px; opacity: 0.7; }
</style>
</head>
<body>
<p class="demo-hint"><b>drop-squash</b> — On open, droplets fall tilted and squash on the ground before springing back. Refresh to see it again. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<section class="ground">
  <span data-fx="drop-squash"><i class="blob"></i></span>
  <span data-fx="drop-squash" data-fx-drop-squash="drop: -520; rot: 18; delay: .12"><i class="blob is-b"></i></span>
  <span data-fx="drop-squash" data-fx-drop-squash="drop: -590; rot: -16; delay: .62" data-demo-remove><i class="blob"></i></span>
  <span data-fx="drop-squash" data-fx-drop-squash="drop: -430; rot: 28; delay: .25"><i class="blob is-b"></i></span>
  <template data-demo-late><span data-fx="drop-squash" data-fx-drop-squash="drop: -300; rot: 0; min: 0; squash: 1.2"><i class="blob"></i></span></template>
</section>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
