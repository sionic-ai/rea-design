<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sticker-wiggle — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: sticky; top: 0; z-index: 60; margin: 0; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .row { display: flex; flex-wrap: wrap; gap: 48px; justify-content: center; padding: 120px 24px; }
  .row figure { margin: 0; width: 150px; text-align: center; }
  .row .wf-img { aspect-ratio: 3 / 4; border: 6px solid var(--kf-surface); border-radius: 40% 46% 30% 34%; box-shadow: var(--kf-shadow-soft); }
  .row figcaption { font: 500 12px/1.4 var(--kf-font-mono); margin-top: 8px; }
</style>
</head>
<body>
<p class="demo-hint"><b>sticker-wiggle</b> — Just watch. The stickers keep moving in many ways: wobble, bounce, nod, squish, float, hop, walk, nod, jolt.</p>
<div class="row" id="row">
  <figure data-fx="sticker-wiggle"><div class="wf-img" data-label="Cutout couple sticker · full body"></div><figcaption>swing</figcaption></figure>
  <figure data-fx="sticker-wiggle" data-fx-sticker-wiggle="look: bounce"><div class="wf-img" data-label="Cutout bride sticker · seated pose"></div><figcaption>bounce</figcaption></figure>
  <figure data-fx="sticker-wiggle" data-fx-sticker-wiggle="look: wave"><div class="wf-img" data-label="Cutout couple sticker · piggyback pose"></div><figcaption>wave</figcaption></figure>
  <figure data-fx="sticker-wiggle" data-fx-sticker-wiggle="look: poyo"><div class="wf-img" data-label="Cutout groom sticker · full body"></div><figcaption>poyo</figcaption></figure>
  <figure data-fx="sticker-wiggle" data-fx-sticker-wiggle="look: pyon"><div class="wf-img" data-label="Illustration of a person with both arms raised"></div><figcaption>pyon</figcaption></figure>
  <figure data-fx="sticker-wiggle" data-fx-sticker-wiggle="look: step"><div class="wf-img" data-label="Walking person illustration"></div><figcaption>step</figcaption></figure>
  <figure data-fx="sticker-wiggle" data-fx-sticker-wiggle="look: yura"><div class="wf-img" data-label="Illustration of a person waving"></div><figcaption>yura</figcaption></figure>
  <figure data-fx="sticker-wiggle" data-fx-sticker-wiggle="look: tick"><div class="wf-img" data-label="Cut-out dinosaur toy sticker"></div><figcaption>tick</figcaption></figure>
  <figure data-fx="sticker-wiggle" data-fx-sticker-wiggle="look: tick-3"><div class="wf-img" data-label="Cut-out piggy bank sticker"></div><figcaption>tick-3</figcaption></figure>
  <figure data-fx="sticker-wiggle" data-fx-sticker-wiggle="look: tick-jump" style="--fx-delay: 1s"><div class="wf-img" data-label="Staff member jumping with arms up cutout"></div><figcaption>tick-jump</figcaption></figure>
  <figure data-fx="sticker-wiggle" data-fx-sticker-wiggle="look: tick-updown"><div class="wf-img" data-label="Hand-drawn hatch decoration"></div><figcaption>tick-updown</figcaption></figure>
</div>
<script>
// Late arrivals·removals — after 1s one more sticker comes in (late arrival), after 2.5s the first sticker is removed (detach)
(() => {
  const row = document.getElementById("row");
  const first = row.firstElementChild;
  setTimeout(() => { const f = document.createElement("figure"); f.dataset.fx = "sticker-wiggle"; f.setAttribute("data-fx-sticker-wiggle", "look: fuwa"); f.innerHTML = '<div class="wf-img" data-label="Late-arriving sticker"></div><figcaption>fuwa</figcaption>'; row.append(f); }, 1000);
  setTimeout(() => first.remove(), 2500);
})();
</script>
<script src="../fx-core.js"></script>
</body>
</html>
