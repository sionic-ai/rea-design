<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gem-chorus-gl — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); color: var(--kf-ink); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .stage { height: 70vh; margin: 20px; border: 1px solid var(--kf-line); }
  .mini { height: 240px; width: 420px; margin: 20px; border: 1px solid var(--kf-line); }
  .log { margin: 0 20px; font: 500 13px/1.4 var(--kf-font-mono); }
</style>
</head>
<body>
<p class="demo-hint"><b>gem-chorus-gl</b> — Hover over the gem, and click to zoom in (click again to return). <span>(After 1s one more panel comes in, and one leaves 2.5s later)</span></p>
<p class="log" id="log">—</p>
<div class="stage" id="a" data-fx="gem-chorus-gl">
  <span data-fx-part="gem" data-name="Stone One" data-shape="cushion" data-at="-.55 .35 1"></span>
  <span data-fx-part="gem" data-name="Stone Two" data-shape="oval" data-at=".5 .4 .9"></span>
  <span data-fx-part="gem" data-name="Stone Three" data-shape="baguette" data-at="-.2 -.35 .8"></span>
  <span data-fx-part="gem" data-name="Stone Four" data-shape="square" data-at=".6 -.3 .85"></span>
  <span data-fx-part="gem" data-name="Stone Five" data-shape="pear" data-at=".05 .1 .7"></span>
</div>
<div class="mini" data-demo-remove data-fx="gem-chorus-gl"><span data-fx-part="gem" data-at="0 0 1"></span></div>
<div class="mini" data-fx="gem-chorus-gl"></div>
<template data-demo-late><div class="mini" data-fx="gem-chorus-gl" data-fx-gem-chorus-gl="caustics: .9"><span data-fx-part="gem" data-shape="oval" data-at="-.3 0 1"></span><span data-fx-part="gem" data-shape="baguette" data-at=".4 .1 .9"></span></div></template>
<script src="three-global.js"></script>
<script src="../../_vendor/three@0.185.0/build/three.cjs"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
const a = document.getElementById("a"), log = document.getElementById("log");
let focus = -1;
a.addEventListener("fx:hover", (e) => { log.textContent = `hover ${e.detail.name}`; });
a.addEventListener("fx:pick", (e) => { focus = e.detail.index; a.dispatchEvent(new CustomEvent("fx:state", { detail: { focus } })); log.textContent = `pick ${e.detail.name}`; });
a.addEventListener("click", () => { if (focus >= 0) setTimeout(() => { focus = -1; a.dispatchEvent(new CustomEvent("fx:state", { detail: { focus } })); }, 0); }, true);
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
