<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>wordmark-icon-header — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: relative; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .head { position: fixed; left: 0; right: 0; top: 44px; z-index: 50; height: 52px; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; font: 500 12px/1.4 var(--kf-font-mono); text-transform: uppercase; }
  .head nav { display: flex; gap: 24px; }
  .logo { position: absolute; left: 50%; top: 50%; translate: -50% -50%; width: 112px; height: 24px; display: grid; place-items: center; }
  .logo [data-fx-part="wordmark"] { font: 800 20px/1 var(--kf-font-display); letter-spacing: 0.02em; }
  .logo [data-fx-part="icon"] { width: 24px; height: 24px; }
  #hero { height: 90vh; background: var(--kf-accent); }
  .body { height: 140vh; padding: 60px 24px; }
</style>
</head>
<body>
<p class="demo-hint"><b>wordmark-icon-header</b> — Scroll down. 200px before the end of the green panel the header row turns into a white panel, the wordmark folds and the icon pops out.</p>
<header class="head" data-fx="wordmark-icon-header" data-fx-wordmark-icon-header="target: #hero; offset: 200">
  <nav><a href="#">Menu 1</a><a href="#">Menu 2</a></nav>
  <a class="logo" href="#" aria-label="Back to start">
    <svg data-fx-part="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="currentColor"/></svg>
    <span data-fx-part="wordmark">BRAND</span>
  </a>
  <nav><a href="#">Cart 0</a></nav>
</header>
<div id="hero"></div>
<div class="body"><p>Your two body lines here.</p></div>
<script>
// Late arrivals and removals — checks that fx-core attaches to an element added after 1s and detaches from an element removed after 2.5s
(() => {
  const host = document.querySelector('[data-fx~="wordmark-icon-header"]');
  if (!host) return;
  const html = host.outerHTML;
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; el.style.top = "120px"; return el; };
  const gone = make("gone");
  host.after(gone);
  setTimeout(() => { const late = make("late"); late.style.top = "200px"; host.after(late); }, 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical one comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
