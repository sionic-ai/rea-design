<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>note-band-stack — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.6 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 300; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .chapter { position: relative; padding: 60px 8vw 200px; }
  .chapter h2 { font-size: 28px; margin-bottom: 16px; }
  .chapter .box { height: 420px; background: var(--kf-surface); border: 1px solid var(--kf-line); border-radius: 8px; }
  .pad { height: 60vh; }
</style>
</head>
<body>
<p class="demo-hint"><b>note-band-stack</b> — Scroll down. The section header strip sticks to the top, the next strip rises to cover it, and the number tags increase one by one.</p>
<div class="pad"></div>
<section data-fx="note-band-stack" class="stack">
  <div data-fx-part="band"></div>
  <div class="chapter"><h2>Section 1 — Your title here</h2><div class="box"></div></div>
  <div data-fx-part="band"></div>
  <div class="chapter"><h2>Section 2 — Your title here</h2><div class="box"></div></div>
  <div data-fx-part="band"></div>
  <div class="chapter"><h2>Section 3 — Your title here</h2><div class="box"></div></div>
</section>
<div class="pad"></div>
<script>
(() => {
  const src = document.querySelector(".stack");
  const make = () => { const s = src.cloneNode(true); s.querySelectorAll('[data-fx-part="note"]').forEach((n) => n.remove()); return s; };
  const gone = make();
  src.after(gone);
  setTimeout(() => gone.after(make()), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical group comes in (a late arrival), and after 2.5s one is removed (detach).");
})();
</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
