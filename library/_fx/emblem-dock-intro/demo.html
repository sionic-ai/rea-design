<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>emblem-dock-intro — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-stage { min-height: 80vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 40px; }
  .demo-slot { width: 100px; height: 100px; }
  .demo-mark { width: 200px; height: 200px; }
  .demo-slot svg, .demo-mark svg { width: 100%; height: 100%; }
  .demo-line { font: italic 400 28px/1.2 var(--kf-font-display); text-align: center; max-width: 28ch; }
</style>
</head>
<body>
<p class="demo-hint"><b>emblem-dock-intro</b> — On refresh, the center mark is drawn for 2.1 seconds, then flies at half size to the spot above and settles, and the sentence appears.</p>
<div class="demo-stage" data-fx="emblem-dock-intro">
  <div class="demo-slot" data-fx-part="slot"><svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="3"><circle cx="50" cy="50" r="44"/><circle cx="50" cy="50" r="30"/><rect x="38" y="34" width="24" height="32" rx="6"/></svg></div>
  <div class="demo-mark" data-fx-part="mark" aria-hidden="true"><svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="3"><circle cx="50" cy="50" r="44"/><circle cx="50" cy="50" r="30"/><rect x="38" y="34" width="24" height="32" rx="6"/></svg></div>
  <p class="demo-line" data-fx-part="reveal">A quiet italic sentence appears once the mark has landed.</p>
  <p data-fx-part="reveal">Second cell is .05s later</p>
</div>
<script>
(() => {
  const src = document.querySelector('[data-fx~="emblem-dock-intro"]');
  if (!src) return;
  const html = src.outerHTML;
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; el.dataset.fxEmblemDockIntro = "wait: 0.3; pause: 0.1"; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => src.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s one more quick-settling one comes in (late arrival), and after 2.5s one drops out (release).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/CustomEase.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
