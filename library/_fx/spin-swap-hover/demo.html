<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>spin-swap-hover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { min-height: 70vh; padding: 80px 40px; display: flex; flex-wrap: wrap; gap: 60px; align-items: center; }
  .round { display: grid; place-items: center; width: 120px; aspect-ratio: 1; border: 3px solid var(--kf-surface); border-radius: 50%; background: var(--kf-accent); color: var(--kf-on-accent); text-align: center; text-decoration: none; rotate: -15deg; }
  .social { display: grid; place-items: center; width: 44px; aspect-ratio: 1; border: 1px solid var(--kf-ink); border-radius: 50%; color: var(--kf-ink); text-decoration: none; --fx-on-bg: var(--kf-ink); --fx-on-ink: var(--kf-bg); --fx-on-line: var(--kf-ink); }
</style>
</head>
<body>
<p class="demo-hint"><b>spin-swap-hover</b> — Hover over the round button and then release. It winds back slightly, then spins more than a full turn as the color changes, and rewinds on release. <span style="color:var(--kf-dim)">(After 1s one more button comes in, and after 2.5s one drops out)</span></p>
<main class="demo">
  <a class="round" href="#" data-fx="spin-swap-hover">Here<br>Button</a>
  <a class="round" href="#" data-fx="spin-swap-hover" data-demo-remove>Soon<br>Omission</a>
  <a class="social" href="#" data-fx="spin-swap-hover" data-fx-spin-swap-hover="turn: 360; ease: back.inOut(1.7)" aria-label="Social">○</a>
  <template data-demo-late><a class="round" href="#" data-fx="spin-swap-hover">Late<br>Coming in</a></template>
</main>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
