<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>drift-fade-cycle — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: sticky; top: 0; z-index: 9; margin: 0; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .stage { position: relative; width: 560px; height: 672px; margin: 60px auto; }
  .stage ul { position: absolute; margin: 0; padding: 0; list-style: none; }
  .stage ul:nth-of-type(1) { top: 0; left: 0; width: 432px; }
  .stage ul:nth-of-type(1) li { aspect-ratio: 432 / 560; border-radius: 8px; }
  .stage ul:nth-of-type(2) { right: 0; bottom: 0; width: 192px; }
  .stage ul:nth-of-type(2) li { aspect-ratio: 1; border-radius: 8px; }
  .stage .wf-img { height: 100%; }
  .row { display: flex; gap: 24px; justify-content: center; padding-bottom: 60px; }
  .row > div { width: 200px; }
  .row li { aspect-ratio: 4 / 3; list-style: none; }
</style>
</head>
<body>
<p class="demo-hint"><b>drift-fade-cycle</b> — Photos float up from below every 5 seconds, pass by and change (two groups offset by .2s). <span style="color:var(--kf-dim)">(After 1s one more cell comes in, and one leaves 1.5s later)</span></p>
<div class="stage" data-fx="drift-fade-cycle">
  <ul data-fx-part="stack">
    <li data-fx-part="item"><div class="wf-img" data-label="Vertical photo 1"></div></li>
    <li data-fx-part="item"><div class="wf-img" data-label="Vertical photo 2"></div></li>
    <li data-fx-part="item"><div class="wf-img" data-label="Vertical photo 3"></div></li>
  </ul>
  <ul data-fx-part="stack">
    <li data-fx-part="item"><div class="wf-img" data-label="Small 1"></div></li>
    <li data-fx-part="item"><div class="wf-img" data-label="Small 2"></div></li>
    <li data-fx-part="item"><div class="wf-img" data-label="Small 3"></div></li>
  </ul>
</div>
<div class="row" id="row">
  <div id="gone" data-fx="drift-fade-cycle" data-fx-drift-fade-cycle="every: 2; dur: 1.9; shift: 0"><ul style="display:grid;margin:0;padding:0"><li data-fx-part="item"><div class="wf-img" data-label="Deleted soon 1"></div></li><li data-fx-part="item"><div class="wf-img" data-label="Deleted soon 2"></div></li></ul></div>
</div>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
  setTimeout(() => {
    const d = document.createElement("div");
    d.dataset.fx = "drift-fade-cycle";
    d.setAttribute("data-fx-drift-fade-cycle", "every: 3; dur: 2.9");
    d.innerHTML = '<ul data-fx-part="stack" style="margin:0;padding:0"><li data-fx-part="item"><div class="wf-img" data-label="Late arrival 1"></div></li><li data-fx-part="item"><div class="wf-img" data-label="Late arrival 2"></div></li></ul>';
    document.getElementById("row").append(d);
  }, 1000);
  setTimeout(() => document.getElementById("gone").remove(), 1500);
</script>
</body>
</html>
