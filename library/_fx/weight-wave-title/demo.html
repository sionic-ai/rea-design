<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>weight-wave-title — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { padding: 8vh 6vw; display: grid; gap: 40px; }
  .demo h2 { font: 400 72px/1 var(--kf-font-display); letter-spacing: -0.05em; }
</style>
</head>
<body>
<p class="demo-hint"><b>weight-wave-title</b> — Just watch. Each letter’s weight waves thin and thick (when the font is a variable font with a weight axis — default font Pretendard Variable). <span style="color:var(--kf-dim)">(One more title comes in after 1s, and one drops out after 2.5s)</span></p>
<section class="demo" id="box">
  <h2 data-fx="weight-wave-title">Pick Up<br>Articles</h2>
  <h2 data-fx="weight-wave-title" data-fx-weight-wave-title="start: 0; step: .1" style="--fx-dur: 3s">Trend Tags</h2>
  <h2 data-fx="weight-wave-title" data-demo-remove>Removed Title</h2>
  <h2 data-fx="weight-wave-title"></h2>
</section>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => { const h = document.createElement("h2"); h.dataset.fx = "weight-wave-title"; h.textContent = "Late Heading"; document.getElementById("box").append(h); }, 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
