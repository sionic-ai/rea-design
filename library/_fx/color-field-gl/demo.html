<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>color-field-gl — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .stage { height: 70vh; margin: 20px; }
  .night { --fx-c0: var(--kf-ink); --fx-c1: color-mix(in oklab, var(--kf-ink) 88%, var(--kf-accent)); --fx-c2: color-mix(in oklab, var(--kf-ink) 80%, var(--kf-accent)); --fx-c3: color-mix(in oklab, var(--kf-ink) 72%, var(--kf-accent)); --fx-c4: color-mix(in oklab, var(--kf-ink) 85%, var(--kf-accent)); --fx-line: color-mix(in oklab, var(--kf-ink) 85%, var(--kf-bg)); }
  .tall { height: 160vh; }
</style>
</head>
<body>
<p class="demo-hint"><b>color-field-gl</b> — Color fields open from a single color and flow. Move the mouse over the panel — only near the cursor ripples. Scroll down and the first panel gathers into one color.</p>
<div class="stage" data-fx="color-field-gl" data-demo-remove></div>
<div class="stage" data-fx="color-field-gl"></div>
<template data-demo-late><div class="stage night" data-fx="color-field-gl" data-fx-color-field-gl="angle: 90; streak: 6; scale: 3.2; octaves: 4; contrast: 1.1; soft: .1125; cover: .5; top: 0; settle: 0"></div></template>
<div class="tall"></div>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
