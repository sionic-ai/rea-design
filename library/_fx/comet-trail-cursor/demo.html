<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>comet-trail-cursor — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; min-height: 100vh; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); color: var(--kf-ink); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { padding: 40px 20px; display: flex; gap: 24px; flex-wrap: wrap; }
</style>
</head>
<body>
<p class="demo-hint"><b>comet-trail-cursor</b> — Swing the mouse to see the tail, and hover a button to see the ring. <span>(After 1s one more cursor attaches, and after 2.5s the first one leaves — only one is ever visible)</span></p>
<section class="demo">
  <button type="button">Button</button><a href="#">Link</a><span>Just text</span>
</section>
<div data-demo-remove data-fx="comet-trail-cursor" aria-hidden="true"></div>
<template data-demo-late><div data-fx="comet-trail-cursor" data-fx-comet-trail-cursor="life: 200" aria-hidden="true"></div></template>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
