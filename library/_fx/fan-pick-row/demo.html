<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fan-pick-row — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-wrap { padding: 60px clamp(20px, 4.4vw, 64px); }
  .demo-card { display: flex; flex-direction: column; justify-content: space-between; gap: 1rem; aspect-ratio: 290 / 412; padding: 1.25rem; border-radius: 1.25rem; background: var(--kf-surface); border: 1px solid var(--kf-line); font-weight: 600; }
  .demo-card:nth-child(odd) { background: var(--kf-accent-soft); }
</style>
</head>
<body>
<p class="demo-hint"><b>fan-pick-row</b> — On a wide screen, move the mouse horizontally over the card row. The card under the cursor stands upright and the rest crowd to either side.</p>
<section class="demo-wrap">
  <ul data-fx="fan-pick-row">
    <li data-fx-part="card"><figure class="demo-card" data-fx-part="face">”Your testimonial’s first line goes here.”<figcaption>Name 01</figcaption></figure></li>
    <li data-fx-part="card"><figure class="demo-card" data-fx-part="face">”Your two-line testimonial goes here.”<figcaption>Name 02</figcaption></figure></li>
    <li data-fx-part="card"><figure class="demo-card" data-fx-part="face">”Your three-line testimonial goes here.”<figcaption>Name 03</figcaption></figure></li>
    <li data-fx-part="card"><figure class="demo-card" data-fx-part="face">”Your testimonial goes here.”<figcaption>Name 04</figcaption></figure></li>
    <li data-fx-part="card"><figure class="demo-card" data-fx-part="face">”Your testimonial goes here.”<figcaption>Name 05</figcaption></figure></li>
    <li data-fx-part="card"><figure class="demo-card" data-fx-part="face">”Your testimonial goes here.”<figcaption>Name 06</figcaption></figure></li>
    <li data-fx-part="card"><figure class="demo-card" data-fx-part="face">”Your testimonial goes here.”<figcaption>Name 07</figcaption></figure></li>
  </ul>
</section>
<script>
(() => {
  const src = document.querySelector(".demo-wrap");
  const html = src.outerHTML;
  const make = () => { const t = document.createElement("template"); t.innerHTML = html; return t.content.firstElementChild; };
  const gone = make();
  src.after(gone);
  setTimeout(() => src.after(make()), 1000);
  setTimeout(() => gone.remove(), 2500);
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
