<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>clip-rise-reveal — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { display: flex; flex-wrap: wrap; gap: 40px; padding: 48px 20px; align-items: flex-start; }
  .demo figure { width: min(320px, 80vw); }
  .demo-spacer { height: 90vh; display: grid; place-items: center; color: var(--kf-dim); }
</style>
</head>
<body>
<p class="demo-hint"><b>clip-rise-reveal</b> — Scroll down and the photo opens from its bottom edge while a dark veil slips upward late. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<div class="demo-spacer">Scroll down</div>
<section class="demo">
  <figure data-demo-remove data-fx="clip-rise-reveal"><div data-fx-part="veil"></div><div class="wf-img wf-r-4x3" data-label="Photo"></div></figure>
  <figure data-fx="clip-rise-reveal"><div data-fx-part="veil"></div><div class="wf-img wf-r-3x4" data-label="Photo"></div></figure>
  <figure data-fx="clip-rise-reveal" data-fx-clip-rise-reveal="dur: 1.4; delay: 0.5"><div class="wf-img wf-r-1x1" data-label="No curtain · 1.4s"></div></figure>
  <template data-demo-late><figure data-fx="clip-rise-reveal"><div data-fx-part="veil"></div><div class="wf-img wf-r-4x3" data-label="Late-arrived Photo"></div></figure></template>
</section>
<div class="demo-spacer"></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); window.ScrollTrigger?.refresh(); }, 2500);
</script>
</body>
</html>
