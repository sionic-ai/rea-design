<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>reel-morph-preview — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { display: grid; gap: 40px; padding: 40px 20px; max-width: 1000px; margin: 0 auto; }
  .stage { aspect-ratio: 16 / 9; border-radius: var(--kf-radius-lg, 20px); display: grid; place-items: center; }
  .stage button { padding: 12px 28px; border-radius: 999px; border: 1px solid var(--kf-line); background: var(--kf-ink); color: var(--kf-bg); font: 500 13px/1 var(--kf-font-mono); text-transform: uppercase; cursor: pointer; }
</style>
</head>
<body>
<p class="demo-hint"><b>reel-morph-preview</b> — Hover the button in the middle of the panel and another video melts in along a noise edge, and pressing it sets off a color-refraction burst. The panel below has no button — the whole panel reacts to the pointer. <span style="color:var(--kf-dim)">(After 1s one more panel comes in, and one leaves 2.5s later)</span></p>
<section class="demo">
  <div class="stage" data-fx="reel-morph-preview"><canvas data-fx-part="a" width="640" height="360" data-demo="a"></canvas><canvas data-fx-part="b" width="640" height="360" data-demo="b"></canvas><button type="button" data-fx-part="trigger">Play reel</button></div>
  <div class="stage" data-fx="reel-morph-preview" data-fx-reel-morph-preview="noise: 2.2; disp: .32; aber: .033; hue: .5; morph: 1.4; amp: 1.05; scan: .002; rise: .07; fall: .9; scale: 1.05" data-demo-remove><canvas data-fx-part="a" width="640" height="360" data-demo="a"></canvas><canvas data-fx-part="b" width="640" height="360" data-demo="b"></canvas></div>
  <template data-demo-late><div class="stage" data-fx="reel-morph-preview"><canvas data-fx-part="a" width="640" height="360" data-demo="a"></canvas><canvas data-fx-part="b" width="640" height="360" data-demo="b"></canvas></div></template>
</section>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Demo materials — A is a canvas with a band of accent colors flowing, B is a dark canvas with text-colored light blobs drifting (both stand in for video)
const css = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const paint = (c) => {
  const g = c.getContext("2d"), kind = c.dataset.demo;
  const cols = kind === "a" ? [css("--kf-accent"), css("--kf-accent-soft"), css("--kf-ink")] : [css("--kf-ink"), css("--kf-dim")];
  const loop = (t) => {
    if (!c.isConnected) return;
    g.fillStyle = css("--kf-bg"); g.fillRect(0, 0, 640, 360);
    for (let i = 0; i < 6; i++) {
      const x = 320 + Math.sin(t / (kind === "a" ? 900 : 1700) + i * 1.9) * 260, y = 180 + Math.cos(t / 1300 + i * 2.3) * 130, r = 70 + i * 16;
      const grd = g.createRadialGradient(x, y, 0, x, y, r);
      grd.addColorStop(0, cols[i % cols.length]); grd.addColorStop(1, "transparent");
      g.globalAlpha = kind === "a" ? 0.8 : 0.35; g.fillStyle = grd; g.fillRect(x - r, y - r, r * 2, r * 2);
    }
    g.globalAlpha = 1;
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
};
document.querySelectorAll("[data-demo]").forEach(paint);
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => { const n = t.content.cloneNode(true); n.querySelectorAll("[data-demo]").forEach(paint); t.replaceWith(n); }), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
