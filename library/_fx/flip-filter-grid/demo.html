<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>flip-filter-grid — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { padding: 12px 20px; border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .box { padding: 20px; }
  .btns { display: flex; gap: 8px; margin-bottom: 20px; }
  .btns button { padding: 10px 16px; border: 1px solid var(--kf-line); background: var(--kf-surface); }
  .grid { display: flex; flex-wrap: wrap; gap: 16px; }
  .grid li { width: calc(33.333% - 11px); }
  .grid .wf-img { aspect-ratio: 4 / 3; }
</style>
</head>
<body>
<p class="demo-hint"><b>flip-filter-grid</b> — Click the buttons above. Cards that leave blur and shrink, and the remaining cards fill the gap.</p>
<div class="box" data-fx="flip-filter-grid" data-demo-remove>
  <div class="btns"><button data-fx-part="filter" data-f="" class="is-on">Entire</button><button data-fx-part="filter" data-f="a">Field A</button><button data-fx-part="filter" data-f="b">Field B</button></div>
  <ul class="grid">
    <li data-fx-part="item" data-cat="a"><span class="wf-img" data-label="Card 1 · A"></span></li>
    <li data-fx-part="item" data-cat="b"><span class="wf-img" data-label="Card 2 · B"></span></li>
    <li data-fx-part="item" data-cat="a b"><span class="wf-img" data-label="Card 3 · A B"></span></li>
    <li data-fx-part="item" data-cat="b"><span class="wf-img" data-label="Card 4 · B"></span></li>
    <li data-fx-part="item" data-cat="a"><span class="wf-img" data-label="Card 5 · A"></span></li>
  </ul>
</div>
<template data-demo-late><div class="box" data-fx="flip-filter-grid" data-fx-flip-filter-grid="dur: 0.4"><div class="btns"><button data-fx-part="filter" data-f="" class="is-on">Entire</button><button data-fx-part="filter" data-f="a">A</button></div><ul class="grid"><li data-fx-part="item" data-cat="a"><span class="wf-img" data-label="Late-attached card A"></span></li><li data-fx-part="item" data-cat="b"><span class="wf-img" data-label="Late-attached card B"></span></li></ul></div></template>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/CustomEase.min.js"></script>
<script>gsap.registerPlugin(CustomEase);</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
