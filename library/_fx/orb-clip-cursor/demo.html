<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>orb-clip-cursor — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-row { display: flex; flex-wrap: wrap; gap: 24px; align-items: center; padding: 60px 30px; }
  .demo-row a, .demo-row button { padding: 14px 22px; border: 1px solid var(--kf-line); border-radius: 999px; background: var(--kf-surface); color: inherit; font: inherit; }
  .demo-pic { width: 280px; height: 200px; }
  .demo-drag { width: 320px; height: 140px; display: grid; place-items: center; border: 1px dashed var(--kf-line); }
</style>
</head>
<body>
<p class="demo-hint"><b>orb-clip-cursor</b> — Move the mouse. An accent-colored dot follows late, and expands to a different size over buttons, links, question rows, drag panels and photos.</p>
<div class="demo-row">
  <button type="button" data-cursor="2">Button (2)</button>
  <a href="#" data-cursor="7">Link (7)</a>
  <button type="button" data-cursor="12" data-cursor-text=" ">Question row (12)</button>
  <div class="demo-drag" data-cursor="32" data-cursor-text="Drag">Drag-to-flip board (32)</div>
  <div class="wf-img demo-pic" data-cursor="" data-label="Photo(50)"></div>
</div>
<div class="demo-cursor" data-fx="orb-clip-cursor"><div data-fx-part="orb"><span data-fx-part="text"></span></div></div>
<div class="demo-empty" data-fx="orb-clip-cursor"></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script>
// Late arrivals and removals — checks that fx-core attaches to an element added after 1s and detaches from an element removed after 2.5s
(() => {
  const src = document.querySelector(".demo-cursor");
  const t = document.createElement("template");
  t.innerHTML = src.outerHTML;
  const make = (tag) => { const el = t.content.firstElementChild.cloneNode(true); el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => gone.remove(), 2500);
  setTimeout(() => src.after(make("late")), 1000);
  document.querySelector(".demo-hint").append(" · After 1 sec one more of the same cursor comes in, and after 2.5 sec one drops out (release).");
})();
</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
