<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>corner-gather-hide — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-surface); color: var(--kf-ink); font: 400 15px/1.6 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .stage { position: fixed; inset: 0; z-index: 0; display: grid; place-items: center; background: var(--kf-raised); overflow: hidden; }
  .stage h1 { font: var(--kf-weight-display) clamp(36px, 6vw, 80px)/1 var(--kf-font-display); text-align: center; text-transform: uppercase; }
  .ph { position: absolute; width: 14vw; aspect-ratio: 3 / 4; background: linear-gradient(135deg, var(--kf-accent), var(--kf-raised) 60%, var(--kf-ink)); }
  .after { position: relative; z-index: 1; margin-top: 100vh; height: 120vh; background: var(--kf-surface); border-top: 1px solid var(--kf-line); display: grid; place-items: center; }
</style>
</head>
<body>
<p class="demo-hint"><b>corner-gather-hide</b> — Scroll down a little. Photos in the corners fly toward the center and vanish, and they return when you scroll back to the top. <span style="color:var(--kf-dim)">(One more photo comes in after 1s, and one drops out after 2.5s)</span></p>
<div class="stage">
  <h1>A headline<br>left alone</h1>
  <span class="ph" style="left:6%;top:9%" data-fx="corner-gather-hide" data-fx-corner-gather-hide="look: tl"></span>
  <span class="ph" style="left:0;bottom:18%;width:7vw" data-fx="corner-gather-hide" data-fx-corner-gather-hide="look: ml"></span>
  <span class="ph" style="left:18%;bottom:6%" data-fx="corner-gather-hide" data-fx-corner-gather-hide="look: bl" data-demo-remove></span>
  <span class="ph" style="right:4%;top:10%" data-fx="corner-gather-hide" data-fx-corner-gather-hide="look: tr"></span>
  <span class="ph" style="right:0;bottom:16%;width:7vw" data-fx="corner-gather-hide" data-fx-corner-gather-hide="look: mr"></span>
  <template data-demo-late><span class="ph" style="right:15%;bottom:-2%" data-fx="corner-gather-hide" data-fx-corner-gather-hide="look: br; past: 60"></span></template>
</div>
<div class="after">Lower section</div>
<div data-fx="corner-gather-hide"></div>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
