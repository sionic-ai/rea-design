<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fluid-reveal-mask — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo-spacer { height: 90vh; display: grid; place-items: center; color: var(--kf-dim); }
  .stage { position: relative; height: 80vh; margin: 20px; overflow: hidden; }
  .behind { position: absolute; inset: 0; background: repeating-linear-gradient(45deg, var(--kf-ink) 0 20px, var(--kf-dim) 20px 40px); animation: slide 4s linear infinite; }
  @keyframes slide { to { background-position: 113px 0; } }
  .board { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: var(--kf-bg); }
  .board span { font: 900 18vw/1 var(--kf-font-display); letter-spacing: -.04em; }
  @media (prefers-reduced-motion: reduce) { .behind { animation: none; } }
</style>
</head>
<body>
<p class="demo-hint"><b>fluid-reveal-mask</b> — Sweep the mouse over the white panel — the path melts open like fluid, revealing the moving image behind, then fills back in.</p>
<div class="stage"><div class="behind"></div><div class="board" data-fx="fluid-reveal-mask"><span data-fx-part="ink">STUDIO’</span></div></div>
<div class="demo-spacer">Footer</div>
<script>
// Late arrivals and removals — checks that fx-core attaches to an element added after 1s and detaches from an element removed after 2.5s
(() => {
  const src = document.querySelector('[data-fx~="fluid-reveal-mask"]');
  if (!src) return;
  const html = src.outerHTML.replace(/\sid="[^"]*"/g, "");
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => (src.closest(".pin-spacer") || src).after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical one comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="three-global.js"></script>
<script src="../../_vendor/three@0.184.0/build/three.cjs"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
