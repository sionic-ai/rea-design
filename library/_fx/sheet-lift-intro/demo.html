<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sheet-lift-intro — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { margin: 0; background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; margin: 0; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-spacer { height: 90vh; display: grid; place-items: center; color: var(--kf-dim); }
  .sl-first { background: var(--kf-ink); }
  .sl-second { background: linear-gradient(10deg, var(--kf-ink), var(--kf-accent)); }
</style>
</head>
<body>
<p class="demo-hint"><b>sheet-lift-intro</b> — On open, the ink-colored curtain lifts upward over 1 second after .5s, and the gradient curtain underneath fades over 1 second starting at .9s. The button replays it.</p>
<main style="padding:120px 20px"><h1 style="font:500 64px/1 var(--kf-font-display)">Page hero</h1><p><button type="button" id="again" style="height:40px;padding:0 16px;border:1px solid var(--kf-line);background:var(--kf-surface)">Spin again</button> <button type="button" id="fade" style="height:40px;padding:0 16px;border:1px solid var(--kf-line);background:var(--kf-surface)">In fade type</button></p></main>
<div class="sl-intro" data-fx="sheet-lift-intro" data-demo-host>
  <div class="sl-first" data-fx-part="first"></div>
  <div class="sl-second" data-fx-part="second"></div>
</div>
<script>
document.getElementById("again").onclick = () => { const el = document.querySelector('[data-fx~="sheet-lift-intro"]'); el.dataset.fx = ""; requestAnimationFrame(() => (el.dataset.fx = "sheet-lift-intro")); };
document.getElementById("fade").onclick = () => { const el = document.querySelector('[data-fx~="sheet-lift-intro"]'); el.dataset.fxSheetLiftIntro = "look: fade"; el.dataset.fx = ""; requestAnimationFrame(() => (el.dataset.fx = "sheet-lift-intro")); };
</script>
<script>
// Late arrivals and removals — checks that fx-core attaches to an element added after 1s and detaches from an element removed after 2.5s
(() => {
  const src = document.querySelector('[data-fx~="sheet-lift-intro"]');
  if (!src) return;
  const html = src.outerHTML.replace(/\sid="[^"]*"/g, "");
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const host = src.closest("[data-demo-host]") || src;
  const gone = make("gone");
  
  setTimeout(() => 0, 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical one comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
