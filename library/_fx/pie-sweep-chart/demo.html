<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pie-sweep-chart — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { padding: 48px 20px; display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 40px; align-items: center; }
  .cell { display: grid; place-items: center; height: 340px; }
  .cell > [data-fx] { width: 280px; }
  .logo { display: flex; align-items: center; gap: 12px; font: 200 72px/1 var(--kf-font-display); }
  .logo [data-fx] { width: 72px; }
  .demo-spacer { height: 90vh; display: grid; place-items: center; color: var(--kf-dim); }
  button { font: inherit; padding: 8px 14px; border: 1px solid var(--kf-line); background: var(--kf-surface); border-radius: var(--kf-radius-sm); cursor: pointer; }
</style>
</head>
<body>
<p class="demo-hint"><b>pie-sweep-chart</b> — The pie chart is drawn in a spin. Press the button to redraw it. Scroll down and it draws as it enters the screen. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<section class="demo">
  <div class="cell"><div id="redraw" data-fx="pie-sweep-chart" data-fx-pie-sweep-chart="data: 39 38 17 4 2; start: load"></div></div>
  <div class="cell"><div class="logo">5<div data-fx="pie-sweep-chart" data-fx-pie-sweep-chart="shuffle: on"></div>Lab</div></div>
  <div class="cell" data-demo-remove><div data-fx="pie-sweep-chart" data-fx-pie-sweep-chart="data: 25 40 28 4 3; start: load"></div></div>
  <div class="cell"><button type="button" onclick="document.getElementById('redraw').dispatchEvent(new Event('fx:draw'))">Redraw (fx:draw)</button></div>
  <template data-demo-late><div class="cell"><div data-fx="pie-sweep-chart" data-fx-pie-sweep-chart="data: 5 33 35 21 6; start: load; colors: 1 2 7 3 4"></div></div></template>
  <div class="cell"><div data-fx="pie-sweep-chart"></div></div>
</section>
<div class="demo-spacer">Scroll down</div>
<section class="demo">
  <div class="cell"><div data-fx="pie-sweep-chart" data-fx-pie-sweep-chart="data: 60 25 10 5"></div></div>
</section>
<div class="demo-spacer"></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../../_vendor/chart.js@4.4.2/chart.umd.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); window.ScrollTrigger?.refresh(); }, 2500);
</script>
</body>
</html>
