<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>heart-pop-beat — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { display: flex; align-items: center; gap: 48px; padding: 64px 20px; }
  .demo svg { display: block; width: 64px; height: 58px; }
  .demo svg path { fill: var(--kf-accent); stroke: var(--kf-ink); stroke-width: 3; stroke-linejoin: round; }
</style>
</head>
<body>
<p class="demo-hint"><b>heart-pop-beat</b> — On open, a heart pops out, then from 1.6s later it bounces twice every 3.4s.</p>
<div class="demo">
  <span data-fx="heart-pop-beat"><svg viewBox="0 0 64 58" aria-hidden="true"><path d="M32 54C14 40 4 30 4 18 4 9 11 3 19 3c6 0 10 3 13 8 3-5 7-8 13-8 8 0 15 6 15 15 0 12-10 22-28 36z"/></svg></span>
  <span data-fx="heart-pop-beat" data-fx-heart-pop-beat="delay: 0.5; beat: 1" style="--fx-peak: 1.3"><svg viewBox="0 0 64 58" aria-hidden="true"><path d="M32 54C14 40 4 30 4 18 4 9 11 3 19 3c6 0 10 3 13 8 3-5 7-8 13-8 8 0 15 6 15 15 0 12-10 22-28 36z"/></svg></span>
</div>
<script>
// Late arrivals and removals — checks that fx-core attaches to an element added after 1s and detaches from an element removed after 2.5s
(() => {
  const src = document.querySelector('[data-fx~="heart-pop-beat"]');
  if (!src) return;
  const html = src.outerHTML;
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => src.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical one comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
