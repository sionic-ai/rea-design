<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>arc-bend-header — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-surface); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: relative; z-index: 1; margin: 120px 20px 0; padding: 12px 20px; background: var(--kf-bg); border: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-head { position: fixed; inset: 0 0 auto; z-index: 50; }
  .demo-bar { position: relative; display: flex; justify-content: space-between; align-items: center; height: 96px; padding: 0 48px; }
  .demo-bar a { font: 500 13px/1 var(--kf-font-sans); letter-spacing: .18em; }
  .demo-bar .logo { font: 400 28px/1 var(--kf-font-display); letter-spacing: 0; }
  .demo-body { height: 300vh; }
</style>
</head>
<body>
<header class="demo-head" data-fx="arc-bend-header" id="src">
  <div class="demo-bar" data-fx-part="bar"><a data-fx-part="item">Clock</a><a data-fx-part="item">Menu 1</a><a data-fx-part="item">Menu 2</a><a data-fx-part="item" class="logo">Logo</a><a data-fx-part="item">Menu 3</a><a data-fx-part="item">Menu 4</a><a data-fx-part="item">KO</a></div>
</header>
<p class="demo-hint"><b>arc-bend-header</b> — Scroll down. Past 80px an arch is laid down and the menu sits on the curve. Scroll further and it hides, scroll up and it returns.</p>
<div class="demo-body"></div>
<script>
(() => {
  const src = document.getElementById("src");
  const html = src.outerHTML.replace(/\sid="[^"]*"/g, "").replace('class="demo-head"', 'class="demo-head" style="top: 140px"');
  const make = () => { const t = document.createElement("template"); t.innerHTML = html; return t.content.firstElementChild; };
  const gone = make();
  src.after(gone);
  setTimeout(() => src.after(make()), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s one more headline comes in (a late arrival), and after 2.5s one drops out (detach).");
})();
</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
