<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>snap-path-morph — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  main { display: flex; flex-wrap: wrap; gap: 40px; padding: 40px; align-items: center; }
  .blob { width: 260px; height: 260px; }
  .blob path[data-fx-part="path"] { fill: var(--kf-accent); }
  .win { width: 420px; aspect-ratio: 4 / 3; clip-path: url(#sp-win); }
  .win .wf-img { height: 100%; }
</style>
</head>
<body>
<p class="demo-hint"><b>snap-path-morph</b> — Just watch. The blob slowly changes to the next shape every 3s, and the cropped shape of the photo window on the right ripples in the same way. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<main>
  <svg class="blob" viewBox="0 0 200 200" data-fx="snap-path-morph" data-fx-snap-path-morph="dur: 3">
    <path data-fx-part="path" d="M100 12C150 12 188 52 186 102S146 190 96 188 12 150 14 98 50 12 100 12Z"/>
    <path data-fx-part="form" d="M110 20C164 30 192 70 178 120S120 196 76 180 6 132 22 82 56 10 110 20Z"/>
    <path data-fx-part="form" d="M92 14C140 4 196 46 190 106S150 186 104 190 20 164 12 112 44 24 92 14Z"/>
  </svg>
  <svg width="0" height="0" aria-hidden="true" data-fx="snap-path-morph" data-fx-snap-path-morph="dur: 3">
    <defs>
      <clipPath id="sp-win" clipPathUnits="objectBoundingBox"><path data-fx-part="path" d="M.5.04C.78.04.97.25.96.52S.75.97.48.96.03.76.04.48.22.04.5.04Z"/></clipPath>
      <path data-fx-part="form" d="M.56.08C.84.14.99.38.92.62S.6.99.36.9.0.66.1.4.28.02.56.08Z"/>
      <path data-fx-part="form" d="M.46.06C.72 0 .99.24.97.54S.78.94.52.96.08.84.04.56.2.12.46.06Z"/>
    </defs>
  </svg>
  <div class="win"><div class="wf-img" data-label="Photo slot cut out by a water-drop window"></div></div>
  <svg class="blob" viewBox="0 0 200 200" data-fx="snap-path-morph" data-fx-snap-path-morph="dur: 2; ease: linear" data-demo-remove>
    <path data-fx-part="path" d="M100 20C144 20 180 56 180 100S144 180 100 180 20 144 20 100 56 20 100 20Z"/>
    <path data-fx-part="form" d="M100 30C160 10 190 80 170 120S110 190 70 170 10 110 30 70 60 40 100 30Z"/>
  </svg>
  <svg class="blob" viewBox="0 0 200 200" data-fx="snap-path-morph" aria-label="Shapeless empty element"><path data-fx-part="path" d="M100 20C144 20 180 56 180 100S144 180 100 180 20 144 20 100 56 20 100 20Z"/></svg>
  <template data-demo-late>
    <svg class="blob" viewBox="0 0 200 200" data-fx="snap-path-morph" data-fx-snap-path-morph="dur: 2">
      <path data-fx-part="path" d="M100 12C150 12 188 52 186 102S146 190 96 188 12 150 14 98 50 12 100 12Z"/>
      <path data-fx-part="form" d="M92 14C140 4 196 46 190 106S150 186 104 190 20 164 12 112 44 24 92 14Z"/>
    </svg>
  </template>
</main>
<script src="../../_vendor/snapsvg@0.5.1/snap.svg-min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
