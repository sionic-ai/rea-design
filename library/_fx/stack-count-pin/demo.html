<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>stack-count-pin — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .pad { height: 60vh; display: grid; place-items: center; color: var(--kf-dim); }
  .row { display: flex; height: 100%; }
  .row [data-fx-part="frame"] { width: 60%; height: 100%; }
  .row [data-fx-part="item"] .wf-img { border: 0; }
  .side { padding: 6rem 3rem; }
  .num { display: flex; height: 1em; overflow: clip; font: 300 96px/1 var(--kf-font-display); }
</style>
</head>
<body>
<p class="demo-hint"><b>stack-count-pin</b> — Scroll down. The photo frame stays pinned while the next photo pushes up from below and the numbers roll over. <span style="color:var(--kf-dim)">(After 1s one more panel comes in, and one leaves 2.5s later)</span></p>
<div class="pad">Downward</div>
<section data-fx="stack-count-pin"><div class="row">
  <div data-fx-part="frame">
    <div data-fx-part="item"><div class="wf-img" data-label="Photo 1 · whole living room"></div></div>
    <div data-fx-part="item"><div class="wf-img" data-label="Photo 2 · cushion close-up"></div></div>
    <div data-fx-part="item"><div class="wf-img" data-label="Photo 3 · fabric texture"></div></div>
  </div>
  <div class="side"><div class="num"><div data-fx-part="count"><span>0</span><span>0</span><span>0</span></div><div data-fx-part="count"><span>1</span><span>2</span><span>3</span></div></div><p>/ 03</p></div>
</div></section>
<section data-demo-remove data-fx="stack-count-pin"><div class="row"><div data-fx-part="frame"><div data-fx-part="item"><div class="wf-img" data-label="Panel to be removed soon"></div></div></div></div></section>
<template data-demo-late><section data-fx="stack-count-pin" data-fx-stack-count-pin="per: 80; rise: 100"><div class="row"><div data-fx-part="frame"><div data-fx-part="item"><div class="wf-img" data-label="Late 1"></div></div><div data-fx-part="item"><div class="wf-img" data-label="Late 2"></div></div></div></div></section></template>
<section data-fx="stack-count-pin"></section>
<div class="pad">Footer</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
