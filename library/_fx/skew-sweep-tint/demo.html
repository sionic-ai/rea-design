<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>skew-sweep-tint — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 48px 20px; }
  .grid a { display: block; }
</style>
</head>
<body>
<p class="demo-hint"><b>skew-sweep-tint</b> — Hover over a photo cell. An accent-color veil unfolds from the corner and tints the photo.</p>
<div class="grid">
  <a href="#" data-fx="skew-sweep-tint"><span class="wf-img wf-r-16x9" data-label="Person illustration · Backlit · 16:9"></span></a>
  <a href="#" data-fx="skew-sweep-tint"><span class="wf-img wf-r-16x9" data-label="Person illustration · Backlit · 16:9"></span></a>
  <a href="#" data-fx="skew-sweep-tint" style="--fx-dur: .8s; --fx-skew: -60deg"><span class="wf-img wf-r-16x9" data-label="--fx-dur .8s · --fx-skew -60deg"></span></a>
</div>
<script>
(() => {
  const grid = document.querySelector(".grid");
  const src = grid.querySelector('[data-fx~="skew-sweep-tint"]');
  setTimeout(() => grid.append(src.cloneNode(true)), 1000);
  setTimeout(() => grid.children[1].remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s one more cell comes in, and after 2.5s one leaves.");
})();
</script>
<script src="../fx-core.js"></script>
</body>
</html>
