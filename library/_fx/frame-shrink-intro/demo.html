<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>frame-shrink-intro — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { margin: 0; background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: relative; z-index: 3; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .stage { position: relative; height: 80vh; overflow: hidden; }
  .bg { position: absolute; inset: 0; }
  .bg > [data-fx-part="image"] { position: absolute; inset: 0; background: linear-gradient(135deg, var(--kf-accent), var(--kf-ink)); }
  .title { position: absolute; inset: 0; z-index: 2; display: flex; align-items: center; justify-content: center; gap: 24px; font: 400 15vh/1 var(--kf-font-display); }
  .gap { width: 30vw; height: 14vh; }
  button { margin: 16px 20px; }
</style>
</head>
<body>
<p class="demo-hint"><b>frame-shrink-intro</b> — After 1s the full-bleed panel shrinks into a rounded frame in the gap between words. Press ”Replay” to start over.</p>
<div class="stage"><div class="bg" data-fx="frame-shrink-intro" data-fx-frame-shrink-intro="target: .stage .gap; delay: 1" data-demo-remove><div data-fx-part="image"></div></div><div class="title"><span>Here</span><span class="gap"></span><span>Village</span></div></div>
<button type="button" onclick="location.reload()">Again</button>
<template data-demo-late><div class="stage"><div class="bg" data-fx="frame-shrink-intro" data-fx-frame-shrink-intro="target: .late-gap; delay: 0.5; radius: 40"><div data-fx-part="image"></div></div><div class="title"><span class="gap late-gap"></span><span>Late</span></div></div></template>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
