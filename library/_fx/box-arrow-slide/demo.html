<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>box-arrow-slide — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<link rel="stylesheet" href="../char-roll/fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { padding: 48px 20px; display: flex; flex-wrap: wrap; gap: 28px; align-items: center; }
  .box { display: block; width: 22px; height: 22px; border-radius: var(--kf-radius-sm); background: var(--kf-ink); color: var(--kf-bg); flex: none; }
  .box svg { width: 12px; height: 12px; }
  .box.is-down svg { transform: rotate(90deg); }
  .btn { display: inline-flex; align-items: center; gap: 40px; height: 55px; padding: 5px 5px 5px 24px; border-radius: var(--kf-radius-sm); background: var(--kf-ink); color: var(--kf-bg); font: 500 16px/1 var(--kf-font-sans); }
  .btn .box { width: 45px; height: 45px; background: var(--kf-bg); color: var(--kf-ink); }
  .link { display: inline-flex; align-items: center; gap: 10px; font: 500 16px/1 var(--kf-font-sans); }
</style>
</head>
<body>
<p class="demo-hint"><b>box-arrow-slide</b> — Hover over buttons and links. The arrow in the box slides one step and swaps. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<section class="demo">
  <a class="btn" href="#" data-fx="char-roll box-arrow-slide" data-fx-char-roll="mode: once; dur: 1; ease: 0.19,1,0.22,1"><span data-fx-part="text">Item list</span><span class="box" data-fx-part="arrow-box"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor"><path d="M1 6h10M7 2l4 4-4 4"/></svg></span></a>
  <a class="link" href="#" data-fx="box-arrow-slide" data-demo-remove>Being removed soon <span class="box" data-fx-part="arrow-box"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor"><path d="M1 6h10M7 2l4 4-4 4"/></svg></span></a>
  <a class="link" href="#" data-fx="box-arrow-slide" data-fx-box-arrow-slide="dir: down">Open Menu <span class="box is-down" data-fx-part="arrow-box"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor"><path d="M1 6h10M7 2l4 4-4 4"/></svg></span></a>
  <a class="link" href="#" data-fx="box-arrow-slide">No box — nothing is hooked</a>
  <template data-demo-late><a class="link" href="#" data-fx="box-arrow-slide">Late-arrived Link <span class="box" data-fx-part="arrow-box"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor"><path d="M1 6h10M7 2l4 4-4 4"/></svg></span></a></template>
</section>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="../char-roll/fx.js"></script>
<script src="fx.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); }, 2500);
</script>
</body>
</html>
