<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>curve-sheet-page — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .row { display: flex; gap: 24px; padding: 60px 20px; }
  .row a { color: var(--kf-accent-text); }
  .box { margin: 20px; padding: 30px; border: 1px solid var(--kf-line); }
</style>
</head>
<body data-fx="curve-sheet-page">
<p class="demo-hint"><b>curve-sheet-page</b> — Click a link below. Three curved sheets fill up and cover the page before it changes, then the top sheet lifts on the opened page. <span style="color:var(--kf-dim)">(After 1s a box comes in, and after 2.5s one leaves)</span></p>
<div class="row"><a href="demo.html?again">Reopen this demo</a><a href="#" data-fx-part="top">Back to top</a></div>
<div class="box" data-demo-remove>Omitted box</div>
<template data-demo-late><div class="box">Late-arrived Box</div></template>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
