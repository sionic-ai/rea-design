<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fade-cover-menu — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); min-height: 150vh; }
  .demo-hint { position: sticky; top: 0; z-index: 0; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .bar { position: fixed; top: 60px; right: 25px; z-index: 50; display: flex; gap: 20px; }
  [data-fx-part="panel"] ul { font-size: 24px; line-height: 1.75; }
</style>
</head>
<body>
<p class="demo-hint"><b>fade-cover-menu</b> — Press the two lines at top right (Esc closes). <span style="color:var(--kf-dim)">(After 1s one more menu item comes in, and after 2.5s one drops out)</span></p>
<div class="bar">
  <nav data-fx="fade-cover-menu"><button type="button" data-fx-part="toggle" aria-label="Menu"></button>
    <div data-fx-part="panel"><ul><li><a href="#a">Menu First</a></li><li><a href="#b">Menu Two</a></li><li><a href="#c">Menu Three</a></li><li><a href="#d">Menu Four</a></li></ul></div></nav>
  <nav data-demo-remove data-fx="fade-cover-menu" data-fx-fade-cover-menu="dur: 1.2; line: .5" style="--fx-line-w: 32px"><button type="button" data-fx-part="toggle" aria-label="Menu Two"></button>
    <div data-fx-part="panel"><ul><li>Slow panel</li></ul></div></nav>
  <template data-demo-late><nav data-fx="fade-cover-menu" data-fx-fade-cover-menu="dur: 0"><button type="button" data-fx-part="toggle" aria-label="Late-arrived Menu"></button><div data-fx-part="panel"><ul><li>Instant cover panel</li></ul></div></nav></template>
  <nav data-fx="fade-cover-menu"></nav>
</div>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
