<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>grid-tint-fling — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { background: var(--kf-contrast-bg); height: 435px; margin: 40px 0; }
</style>
</head>
<body>
<p class="demo-hint"><b>grid-tint-fling</b> — Move the mouse slowly over the dark panel to tint the squares, swing it fast and they scatter, then ripple back.</p>
<div class="demo" data-fx="grid-tint-fling"></div>
<script>
(() => {
  const src = document.querySelector('[data-fx~="grid-tint-fling"]');
  if (!src) return;
  const make = (tag) => { const el = document.createElement("div"); el.className = "demo"; el.dataset.fx = "grid-tint-fling"; el.dataset.demo = tag; el.style.height = "200px"; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => src.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s one more panel comes in, and after 2.5s one drops out (detach).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/InertiaPlugin.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script>gsap.registerPlugin(InertiaPlugin, ScrollTrigger);</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
