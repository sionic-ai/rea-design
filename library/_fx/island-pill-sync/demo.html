<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>island-pill-sync — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 10; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .pad { height: 160vh; padding: 40px 20px; }
  .panel { position: fixed; inset: 0; z-index: 99; overflow-y: auto; background: var(--kf-bg); visibility: hidden; }
  .panel.is-fx-open { visibility: visible; }
  .panel section { max-width: 520px; margin: 80px auto; aspect-ratio: 16 / 10; display: grid; place-items: center; background: var(--kf-raised); border-radius: var(--kf-radius-md); }
</style>
</head>
<body>
<p class="demo-hint"><b>island-pill-sync</b> — Scroll down a little and a pill rises from the bottom. Click to open the panel and scroll — title and width change per item (closes with Esc).</p>
<div class="pad">Your body text continues at length here.</div>
<template id="ic-a"><svg viewBox="0 0 24 24" width="24" height="24"><circle cx="12" cy="12" r="6" fill="currentColor"/></svg></template>
<template id="ic-b"><svg viewBox="0 0 24 24" width="24" height="24"><rect x="5" y="5" width="14" height="14" rx="3" fill="currentColor"/></svg></template>
<div class="panel" id="panel">
  <section data-fx-part="item" data-title="Showreel 0000" data-width="220" data-icon="ic-a">Item 1</section>
  <section data-fx-part="item" data-title="Client site" data-width="190" data-icon="ic-b">Item 2</section>
  <section data-fx-part="item" data-title="Intro motion" data-width="200" data-icon="ic-a">Item 3</section>
  <section data-fx-part="item" data-title="404 page" data-width="180" data-icon="ic-b">Item 4</section>
</div>
<div data-fx="island-pill-sync" data-fx-island-pill-sync="panel: #panel">
  <div data-fx-part="pill"><span data-fx-part="icon"></span><span data-fx-part="title">See work</span><span data-fx-part="knob">×</span><button type="button" data-fx-part="toggle" aria-expanded="false" aria-label="View work"></button></div>
</div>
<template data-demo-late><div data-fx="island-pill-sync" data-fx-island-pill-sync="at: .5; up: 96" style="z-index: 98"><div data-fx-part="pill"><span data-fx-part="title">Late pill</span></div></div></template>
<div data-demo-remove data-fx="island-pill-sync"><div data-fx-part="pill"><span data-fx-part="title">Removed</span></div></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/CustomEase.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
