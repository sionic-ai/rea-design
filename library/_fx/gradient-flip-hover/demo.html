<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gradient-flip-hover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { display: flex; flex-wrap: wrap; gap: 16px; padding: 48px 20px; }
  .demo a { display: inline-grid; place-items: center; width: 210px; height: 46px; border-radius: 15px; color: var(--kf-on-accent); font-weight: 700; letter-spacing: .1em; }
  .demo a.tile { width: 96px; height: 68px; border-radius: 10px; font-size: 13px; }
</style>
</head>
<body>
<p class="demo-hint"><b>gradient-flip-hover</b> — Hover over the button — the gradient of the same two colors flips and the light direction rotates.</p>
<section class="demo">
  <a href="#" data-fx="gradient-flip-hover" data-demo-remove>Log in</a>
  <a href="#" data-fx="gradient-flip-hover" style="--fx-from-at: 0%; --fx-to-at: 100%">Find a Store</a>
  <a href="#" class="tile" data-fx="gradient-flip-hover" data-fx-gradient-flip-hover="look: flat">Quick menu</a>
  <template data-demo-late><a href="#" data-fx="gradient-flip-hover">Late-arriving button</a></template>
</section>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
