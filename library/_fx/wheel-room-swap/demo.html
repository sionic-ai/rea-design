<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>wheel-room-swap — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .room { position: relative; height: 70vh; margin: 20px; display: grid; place-items: center; }
  .room [data-fx-part="stage"] { width: 240px; aspect-ratio: 3 / 4; }
  .room figure { background: var(--kf-surface); border: 1px solid var(--kf-line); display: grid; place-items: center; font: 500 40px/1 var(--kf-font-sans); }
  .win { position: absolute; left: 0; top: 0; bottom: 0; width: 40px; overflow: hidden; }
  .win [data-fx-part="strip"] { display: flex; flex-direction: column; }
  .win [data-fx-part="thumb"] { height: 52px; border-bottom: 1px solid var(--kf-line); background: var(--kf-accent-soft); }
  .num { position: absolute; right: 20px; bottom: 20px; font: 500 13px/1 var(--kf-font-mono); }
</style>
</head>
<body>
<p class="demo-hint"><b>wheel-room-swap</b> — Scroll the wheel over the panel or press the ←→ keys. A new panel opens from the center and the background color changes. Click the panel to turn on zoom.</p>
<section class="room" data-fx="wheel-room-swap" data-demo-remove>
  <div class="win"><div data-fx-part="strip"><i data-fx-part="thumb"></i><i data-fx-part="thumb"></i><i data-fx-part="thumb"></i></div></div>
  <div data-fx-part="stage">
    <figure data-fx-part="slide" style="--fx-tone: var(--kf-raised)">1</figure>
    <figure data-fx-part="slide" style="--fx-tone: var(--kf-accent-soft)">2</figure>
    <figure data-fx-part="slide" style="--fx-tone: color-mix(in oklab, var(--kf-accent) 30%, var(--kf-bg))">3</figure>
  </div>
  <span data-fx-part="label">Zoom</span>
  <p class="num">01 / 03</p>
</section>
<template data-demo-late><section class="room" data-fx="wheel-room-swap"><div data-fx-part="stage"><figure data-fx-part="slide" style="--fx-tone: var(--kf-raised)">A</figure><figure data-fx-part="slide" style="--fx-tone: var(--kf-accent-soft)">B</figure></div></section></template>
<section class="room" data-fx="wheel-room-swap"></section>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
document.addEventListener("fx:change", (e) => { const n = e.target.querySelector(".num"); if (n) n.textContent = `${String(e.detail.index + 1).padStart(2, "0")} / ${String(e.detail.count).padStart(2, "0")}`; });
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
