<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>diagonal-peek-follow — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { display: flex; flex-direction: column; align-items: flex-start; gap: 10px; padding: 48px 20px; font-size: 24px; transition: background-color .5s; }
  .demo[data-tint="1"] { background-color: var(--kf-accent-soft); }
  .demo[data-tint="2"] { background-color: var(--kf-raised); }
</style>
</head>
<body>
<p class="demo-hint"><b>diagonal-peek-follow</b> — Hover over the name and move the mouse around. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<section class="demo" data-demo-box>
  <a href="#" data-fx="diagonal-peek-follow" data-fx-diagonal-peek-follow="tint: [data-demo-box]; click: keep" data-tint="1">Artist Name 01<span class="wf-img" data-fx-part="pic" data-label="Person upper body · window light · portrait 3:4"></span></a>
  <a href="#" data-fx="diagonal-peek-follow" data-fx-diagonal-peek-follow="tint: [data-demo-box]" data-tint="2" data-demo-remove>Artist Name 02<span class="wf-img" data-fx-part="pic" data-label="Still life · white background · vertical"></span></a>
  <a href="#" data-fx="diagonal-peek-follow" data-fx-diagonal-peek-follow="side: below-left">Mail opening to the lower left<span class="wf-img" data-fx-part="pic" data-label="Contact person photo"></span></a>
  <a href="#" data-fx="diagonal-peek-follow" data-fx-diagonal-peek-follow="side: above-right; w: 320; h: 220">Next-post button that opens upward<span class="wf-img" data-fx-part="pic" data-label="Next post cover photo · landscape"></span></a>
  <a href="#" data-fx="diagonal-peek-follow">Name without photo</a>
  <template data-demo-late><a href="#" data-fx="diagonal-peek-follow">Late-arrived name<span class="wf-img" data-fx-part="pic" data-label="Late-arrived Photo"></span></a></template>
</section>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
