<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>aisle-walk-gl — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { margin: 0; background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { height: 78vh; margin: 20px; }
  .demo-out { margin: 0 20px; font: 500 13px/1.4 var(--kf-font-mono); }
</style>
</head>
<body>
<p class="demo-hint"><b>aisle-walk-gl</b> — Roll the wheel over the board or walk with W/S. Heads turn toward the mouse, and clothes come forward when placed on the shelf.</p>
<section class="demo" data-fx="aisle-walk-gl" data-fx-aisle-walk-gl="layout: PV PP IP | PP VP PP">
  <span data-fx-part="item" data-label="T-shirt Cutout"></span>
  <span data-fx-part="item" data-label="Sweatshirt cutout"></span>
  <span data-fx-part="panel" data-label="Video edition 01"></span>
  <button data-fx-part="prev" type="button" aria-label="Front">←</button>
  <button data-fx-part="next" type="button" aria-label="Back">→</button>
</section>
<p class="demo-out" id="out">Place your hand on the shelf.</p>
<script>
(() => {
  const demo = document.querySelector(".demo"), out = document.getElementById("out");
  demo.addEventListener("fx:hover", (e) => { out.textContent = e.detail.index == null ? "Off the shelf" : `Product ${e.detail.index + 1} Above`; });
  demo.addEventListener("fx:pick", (e) => { out.textContent = `Product ${e.detail.index + 1} was pressed`; });
  const late = document.createElement("section");
  late.setAttribute("data-fx", "aisle-walk-gl");
  late.style.height = "60px";
  setTimeout(() => document.body.append(late), 1000);
  setTimeout(() => late.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s a product-less panel comes in and leaves after 2.5s (detach).");
})();
</script>
<script src="../../_vendor/three@0.141.0/build/three.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
