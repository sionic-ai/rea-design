<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>text-wheel-scrub — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .pad { height: 60vh; display: grid; place-items: center; color: var(--kf-dim); }
  .stage { height: 100vh; display: grid; place-items: center; }
  .wheel { width: 100%; height: 200px; }
  .wheel h2 { font: 400 clamp(32px, 5.5vw, 80px)/1.05 var(--kf-font-display); letter-spacing: -0.06em; }
</style>
</head>
<body>
<p class="demo-hint"><b>text-wheel-scrub</b> — Scroll down and five lines rotate like a wheel in the pinned section. <span style="color:var(--kf-dim)">(After 1s one more row comes in, and after 2.5s the empty wheel is removed)</span></p>
<div class="pad">Scroll down</div>
<section class="stage">
  <div class="wheel" data-fx="text-wheel-scrub" data-fx-text-wheel-scrub="pin: parent">
    <h2 data-fx-part="item">Your one-liner here</h2><h2 data-fx-part="item">Your second line here</h2><h2 data-fx-part="item">Your third line here</h2><h2 data-fx-part="item">Your fourth line here</h2><h2 data-fx-part="item">Your fifth line here</h2>
  </div>
</section>
<div class="pad">
  <div class="wheel" data-fx="text-wheel-scrub" data-fx-text-wheel-scrub="pin: false; end: +=100%" data-demo-remove></div>
  <template data-demo-late><div class="wheel" data-fx="text-wheel-scrub" data-fx-text-wheel-scrub="pin: false"><h2 data-fx-part="item">Late-arriving wheel</h2><h2 data-fx-part="item">Second row</h2></div></template>
</div>
<div class="pad">Footer</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); }, 2500);
</script>
</body>
</html>
