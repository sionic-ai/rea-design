<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>letter-jolt-hover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .row { display: flex; flex-wrap: wrap; gap: 24px; padding: 48px 20px; align-items: center; }
  .pill { padding: 14px 24px; border: 0; border-radius: var(--kf-radius-pill); background: var(--kf-ink); color: var(--kf-bg); font: 500 18px/1 var(--kf-font-sans); cursor: pointer; }
</style>
</head>
<body>
<p class="demo-hint"><b>letter-jolt-hover</b> — Hover over a pill. One pill joins late after 1s, and after 3s a part drops from the first pill.</p>
<div class="row" id="row">
  <button class="pill" data-fx="letter-jolt-hover">menu</button>
  <button class="pill" data-fx="letter-jolt-hover" data-fx-letter-jolt-hover="amount: .25"><span data-fx-part="text">Enter with sound on</span></button>
</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
  setTimeout(() => {
    const b = document.createElement("button");
    b.className = "pill"; b.textContent = "Late-attached button"; b.setAttribute("data-fx", "letter-jolt-hover");
    document.getElementById("row").append(b);
  }, 1000);
  setTimeout(() => document.querySelector(".pill")?.removeAttribute("data-fx"), 3000);
</script>
</body>
</html>
