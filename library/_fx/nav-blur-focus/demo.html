<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>nav-blur-focus — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { margin: 0; background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: relative; z-index: 3; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .bg { position: fixed; inset: 0; z-index: 0; }
  .bg .wf-img { height: 100%; border: 0; }
  .veil { position: fixed; inset: 0; z-index: 1; pointer-events: none; }
  nav { position: relative; z-index: 2; display: flex; justify-content: space-between; padding: 30vh 80px 0; text-transform: uppercase; font-size: 12px; }
  nav a { padding: 15px; color: var(--kf-ink); text-decoration: none; }
  .logo { position: fixed; z-index: 2; left: 50%; bottom: 20px; translate: -50% 0; padding: 12px 20px; border: 1px solid var(--kf-line); background: var(--kf-surface); }
</style>
</head>
<body>
<p class="demo-hint"><b>nav-blur-focus</b> — Hover over one menu item and the other items and the photo behind it blur. Hover the logo below and the area behind the screen curtain blurs.</p>
<div class="bg"><div class="wf-img" data-label="Background photo · full width"></div></div>
<div class="veil"></div>
<nav data-fx="nav-blur-focus" data-fx-nav-blur-focus="target: .bg"><a href="#" data-fx-part="item">Menu First</a><a href="#" data-fx-part="item">Menu Two</a><a href="#" data-fx-part="item">Menu Three</a><a href="#" data-fx-part="item">Menu Four</a></nav>
<a class="logo" href="#" data-fx="nav-blur-focus" data-fx-nav-blur-focus="target: .veil; prop: backdrop; target-blur: 15; target-in: 1.5; target-out: .9; target-ease: power3.out">Logo</a>
<script>
(() => {
  const src = document.querySelector("nav[data-fx]");
  const gone = src.cloneNode(true);
  src.after(gone);
  setTimeout(() => src.after(src.cloneNode(true)), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s one more menu row comes in, and after 2.5s one drops out.");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/CustomEase.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
