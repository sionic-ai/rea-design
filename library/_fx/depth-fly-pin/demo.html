<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>depth-fly-pin — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-gap { height: 60vh; display: grid; place-items: center; color: var(--kf-dim); }
  .demo-tunnel { height: 380vh; margin: 0 40px; }
  .demo-tunnel [data-fx-part="item"] { border-radius: var(--kf-radius-sm); }
  .demo-tunnel [data-fx-part="item"] .wf-img { height: 100%; }
  .demo-tunnel h2 { width: min(900px, 90%); font: 300 clamp(36px, 6vw, 80px)/0.9 var(--kf-font-display); letter-spacing: -0.06em; }
</style>
</head>
<body>
<p class="demo-hint"><b>depth-fly-pin</b> — Scroll down. The panel stays stuck while photo pieces fly in from depth and the sentence changes.</p>
<div class="demo-gap">Downward</div>
<section class="demo-tunnel" data-fx="depth-fly-pin" id="src">
  <div data-fx-part="stage">
    <figure data-fx-part="item" data-layer="3" data-speed="1.24" data-depth="1.2" style="left: 10%; top: 12%; width: 200px; aspect-ratio: 1"><div class="wf-img" data-label="Photo 1"></div></figure>
    <figure data-fx-part="item" data-layer="1" data-speed="0.9" data-depth="1.95" style="left: 30%; top: 30%; width: 240px; aspect-ratio: 6 / 5"><div class="wf-img" data-label="Photo 2"></div></figure>
    <figure data-fx-part="item" data-layer="1" data-speed="0.84" data-depth="2.85" style="left: 55%; top: 10%; width: 170px; aspect-ratio: 1"><div class="wf-img" data-label="Photo 3"></div></figure>
    <figure data-fx-part="item" data-layer="2" data-speed="1.02" data-depth="0.65" style="left: 75%; top: 25%; width: 170px; aspect-ratio: 4 / 3"><div class="wf-img" data-label="Photo 4"></div></figure>
    <figure data-fx-part="item" data-layer="3" data-speed="0.8" style="left: 80%; top: 78%; width: 220px; aspect-ratio: 4 / 5"><div class="wf-img" data-label="Photo 5"></div></figure>
    <figure data-fx-part="item" data-layer="2" data-speed="1.04" style="left: 15%; top: 75%; width: 150px; aspect-ratio: 1"><div class="wf-img" data-label="Photo 6"></div></figure>
    <div data-fx-part="slide"><h2>Your first sentence goes here.</h2></div>
    <div data-fx-part="slide"><h2>Your second sentence here.</h2></div>
    <div data-fx-part="slide"><h2>Your last sentence here.</h2></div>
  </div>
</section>
<div class="demo-gap">Footer</div>
<script>
(() => {
  const src = document.getElementById("src");
  const html = src.outerHTML.replace(/\sid="[^"]*"/g, "");
  const make = () => { const t = document.createElement("template"); t.innerHTML = html; return t.content.firstElementChild; };
  const gone = make();
  src.after(gone);
  setTimeout(() => src.after(make()), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s, one more sheet comes in (the late one), and after 2.5s one drops out (the removal).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
