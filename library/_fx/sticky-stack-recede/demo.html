<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sticky-stack-recede — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: sticky; top: 0; z-index: 100; margin: 0; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .stack { display: flex; flex-direction: column; gap: 8px; padding: 60px 20px 60vh; max-width: 900px; margin: 0 auto; }
  .card { height: 320px; background: var(--kf-surface); border: 1px solid var(--kf-line); display: grid; place-items: center; font: var(--kf-weight-display) 28px/1 var(--kf-font-display); }
</style>
</head>
<body>
<p class="demo-hint"><b>sticky-stack-recede</b> Scroll down. A card sticks at the top, and while the next card covers it, the previous card shrinks and fades.</p>
<div class="stack" data-fx="sticky-stack-recede">
  <article class="card" data-fx-part="card">Card 01</article>
  <article class="card" data-fx-part="card">Card 02</article>
  <article class="card" data-fx-part="card">Card 03</article>
  <article class="card" data-fx-part="card">Card 04</article>
</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script>
// Late arrivals and removals — fx-core also attaches to a panel added after 1 second, and checks that a panel removed after 2.5 seconds gets detached
(() => {
  gsap.registerPlugin(ScrollTrigger);
  const src = document.querySelector(".stack");
  const html = src.outerHTML;
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => { src.after(make("late")); ScrollTrigger.refresh(); }, 1000);
  setTimeout(() => { gone.remove(); ScrollTrigger.refresh(); }, 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical stack comes in (a late arrival), and after 2.5s one is removed (detach).");
})();
</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
