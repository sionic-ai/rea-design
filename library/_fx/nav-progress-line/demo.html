<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>nav-progress-line — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-head { position: sticky; top: 0; z-index: 10; height: 60px; padding: 0 20px; display: flex; align-items: center; justify-content: space-between; background: var(--kf-surface); }
  .demo-head nav { display: flex; gap: 24px; }
  .demo-head a { color: var(--kf-accent); }
  .demo-hint { padding: 24px 20px; font: 500 13px/1.5 var(--kf-font-mono); }
  .demo-spacer { height: 120vh; display: grid; place-items: center; color: var(--kf-dim); }
</style>
</head>
<body>
<header class="demo-head">
  <b>Logo</b>
  <nav><a href="demo.html?next">Next page</a><a href="demo.html?fast">Skip quickly (wait .3)</a><a href="#bottom">Downward (hash unchanged)</a></nav>
  <div class="demo-line" data-fx="nav-progress-line"></div>
</header>
<p class="demo-hint"><b>nav-progress-line</b> — On open, a 1px line under the header fills all the way across and then disappears. Pressing ”Next page” grows the line to 40% and then navigates (returns to the same demo).</p>
<div class="demo-spacer" id="bottom">Body slot</div>
<script>
if (location.search.includes("fast")) document.querySelector(".demo-line").setAttribute("data-fx-nav-progress-line", "wait: 0.3");
// Late arrivals and removals — checks that fx-core attaches to an element added after 1s and detaches from an element removed after 2.5s
(() => {
  const head = document.querySelector(".demo-head");
  const make = (tag) => { const el = document.createElement("div"); el.setAttribute("data-fx", "nav-progress-line"); el.dataset.demo = tag; el.style.top = tag === "late" ? "110%" : "120%"; return el; };
  const gone = make("gone");
  head.append(gone);
  setTimeout(() => head.append(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s, one more line comes in (the late one), and after 2.5s one drops out (the removal).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
