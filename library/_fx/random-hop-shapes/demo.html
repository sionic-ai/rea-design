<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>random-hop-shapes — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-raised); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-body { position: relative; z-index: 2; height: 160vh; display: grid; place-items: center; font-size: 48px; font-weight: 700; }
  .shape { width: 260px; height: auto; fill: var(--kf-accent); opacity: .9; }
  .shape.b { fill: var(--kf-accent-soft); width: 180px; }
  .shape.c { fill: var(--kf-ink); width: 140px; }
</style>
</head>
<body>
<p class="demo-hint"><b>random-hop-shapes</b> — On every refresh the shapes scatter to different spots, and every 2 seconds (every: 2 for the demo) one turns off and turns on in another spot. <span style="color:var(--kf-dim)">(After 1s one more shape panel comes in, and after 2.5s one leaves)</span></p>
<div data-fx="random-hop-shapes" data-fx-random-hop-shapes="every: 2" aria-hidden="true">
  <svg class="shape" data-fx-part="shape" viewBox="0 0 200 160"><path d="M30 20C80-10 190 10 195 70S120 165 60 150 0 50 30 20Z"/></svg>
  <svg class="shape b" data-fx-part="shape" viewBox="0 0 100 100"><circle cx="50" cy="50" r="50"/></svg>
  <svg class="shape c" data-fx-part="shape" viewBox="0 0 100 95"><path d="M50 0 100 36 81 95H19L0 36Z"/></svg>
</div>
<div data-fx="random-hop-shapes" data-demo-remove aria-hidden="true"><svg class="shape b" data-fx-part="shape" viewBox="0 0 100 100"><circle cx="50" cy="50" r="50"/></svg></div>
<div data-fx="random-hop-shapes" aria-hidden="true"></div>
<template data-demo-late><div data-fx="random-hop-shapes" data-fx-random-hop-shapes="every: 3; min: .5; max: .8" aria-hidden="true"><svg class="shape" data-fx-part="shape" viewBox="0 0 100 100"><circle cx="50" cy="50" r="50"/></svg></div></template>
<div class="demo-body">Your big phrase here</div>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); }, 2500);
</script>
</body>
</html>
