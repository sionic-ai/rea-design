<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>clip-drop-scrub — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { display: grid; grid-template-columns: repeat(2, minmax(0, 360px)); justify-content: center; gap: 40vh 10vw; padding: 80vh 20px; }
  .demo figure { margin: 0; aspect-ratio: 4 / 3; }
  .demo figure .wf-img { height: 100%; }
</style>
</head>
<body>
<p class="demo-hint"><b>clip-drop-scrub</b> — Scroll slowly. Photo cells open from the top and the photo inside drops from above into place. Scroll up and it rewinds. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<section class="demo">
  <figure data-fx="clip-drop-scrub"><div class="wf-img" data-fx-part="photo" data-label="Work 1 · brick church · landscape 4:3"></div></figure>
  <figure data-fx="clip-drop-scrub" style="margin-top: 30vh"><div class="wf-img" data-fx-part="photo" data-label="Piece 2 · Landscape 4:3"></div></figure>
  <figure data-fx="clip-drop-scrub" data-fx-clip-drop-scrub="drop: -60; ease: none"><div class="wf-img" data-fx-part="photo" data-label="Farther · no curve"></div></figure>
  <figure data-fx="clip-drop-scrub" data-demo-remove><div class="wf-img" data-label="Cell to be removed soon"></div></figure>
  <template data-demo-late><figure data-fx="clip-drop-scrub"><div class="wf-img" data-label="Late-arriving cell (no mark — first child)"></div></figure></template>
</section>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); window.ScrollTrigger?.refresh(); }, 2500);
</script>
</body>
</html>
