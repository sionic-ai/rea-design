<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gravity-toggle — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { padding: 24px 20px 48px; }
  .demo-btn { display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 16px; border: 1px solid var(--kf-line); border-radius: var(--kf-radius-sm); background: var(--kf-surface); color: var(--kf-ink); cursor: pointer; }
  .demo-btn[aria-pressed="true"] { background: var(--kf-accent); color: var(--kf-on-accent); border-color: transparent; }
  .desk { position: relative; height: 70vh; margin-top: 16px; border: 1px solid var(--kf-line); border-radius: var(--kf-radius-md); overflow: hidden; }
  .desk .demo-btn { position: absolute; top: 12px; right: 12px; z-index: 2; }
  .ico { position: absolute; width: 96px; display: grid; gap: 6px; justify-items: center; font: 500 12px/1.2 var(--kf-font-mono); }
  .ico .wf-img { aspect-ratio: 1; border-radius: var(--kf-radius-sm); }
  .card { position: absolute; width: 240px; padding: 14px; border-radius: var(--kf-radius-md); background: var(--kf-surface); box-shadow: var(--kf-shadow-soft); }
</style>
</head>
<body>
<p class="demo-hint"><b>gravity-toggle</b> — Press “Gravity” — the pieces spill to the floor and can be grabbed and thrown with the mouse. Press again and they fly back into place.</p>
<div class="demo">
  <button class="demo-btn" type="button" data-outside>Switch outside the panel (fx:toggle)</button>
  <main class="desk" data-fx="gravity-toggle">
    <button class="demo-btn" type="button" data-fx-part="toggle">Gravity</button>
    <div class="ico" data-fx-part="body" style="left:6%;top:12%"><div class="wf-img" data-label="Square"></div>file_01.gif</div>
    <div class="ico" data-fx-part="body" style="left:22%;top:30%;rotate:-4deg"><div class="wf-img" data-label="Square"></div>file_02.gif</div>
    <div class="ico" data-fx-part="body" style="left:40%;top:8%"><div class="wf-img" data-label="Square"></div>file_03.gif</div>
    <div class="card" data-fx-part="body" style="left:56%;top:24%">Your window title here<br>Your two body lines here.</div>
    <div class="ico" data-fx-part="body" style="left:82%;top:54%"><div class="wf-img" data-label="Square"></div>Folder_1</div>
  </main>
</div>
<script>
document.querySelector("[data-outside]").addEventListener("click", () => document.querySelector(".desk").dispatchEvent(new Event("fx:toggle")));
// Late arrivals and removals — checks that fx-core attaches to an element added after 1s and detaches from an element removed after 2.5s
(() => {
  const src = document.querySelector('[data-fx~="gravity-toggle"]');
  if (!src) return;
  const html = src.outerHTML.replace(/\sid="[^"]*"/g, "");
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => src.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical panel comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../_vendor/matter-js@0.19.0/matter.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
