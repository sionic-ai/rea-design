<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sticky-photo-swap — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo-spacer { height: 60vh; display: grid; place-items: center; color: var(--kf-dim); }
  [data-fx-part="photo"] > div { border: 0; }
  [data-fx-part="section"] { display: grid; place-items: center; min-height: 100vh; font: 600 48px/1 var(--kf-font-display); color: var(--kf-on-accent); }
</style>
</head>
<body>
<p class="demo-hint"><b>sticky-photo-swap</b> — Scroll down. The photo panel is pinned, and each time the center cell changes the photo is swapped with an overlap. <span style="color:var(--kf-dim)">(After 1s one more section comes in, and one leaves 2.5s later)</span></p>
<div class="demo-spacer">↓</div>
<template id="tpl"><section data-fx="sticky-photo-swap">
  <div data-fx-part="layer">
    <div data-fx-part="photo"><div class="wf-img" style="background:var(--kf-ink-soft)" data-label="Photo 1"></div></div>
    <div data-fx-part="photo"><div class="wf-img" style="background:var(--kf-accent)" data-label="Photo 2"></div></div>
    <div data-fx-part="photo"><div class="wf-img" style="background:var(--kf-ink)" data-label="Photo 3"></div></div>
  </div>
  <div data-fx-part="section">Cell 1</div><div data-fx-part="section">Cell 2</div><div data-fx-part="section">Cell 3</div>
</section></template>
<div id="a" data-demo-remove></div><div id="b"></div><div id="late"></div>
<section data-fx="sticky-photo-swap"></section>
<div class="demo-spacer">Footer</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
const tpl = document.getElementById("tpl");
document.getElementById("a").append(tpl.content.cloneNode(true));
document.getElementById("b").append(tpl.content.cloneNode(true));
setTimeout(() => document.getElementById("late").append(tpl.content.cloneNode(true)), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
