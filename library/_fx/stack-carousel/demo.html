<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>stack-carousel — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="../../_vendor/swiper@8.4.7/swiper-bundle.min.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .box { position: relative; max-width: 900px; margin: 40px auto; }
  .card { aspect-ratio: 2 / 3; border-radius: var(--kf-radius-lg); border: 0; }
  .nav { display: flex; justify-content: center; gap: 12px; margin-top: 16px; }
  .nav [data-fx-part] { padding: 8px 16px; border: 1px solid var(--kf-line); border-radius: var(--kf-radius-pill); cursor: pointer; }
</style>
</head>
<body>
<p class="demo-hint"><b>stack-carousel</b> — Drag the cards or press the arrows. Top: two side cards (each .16x smaller), bottom: four side cards almost in a row. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<div class="box" data-fx="stack-carousel" data-fx-stack-carousel="scale: .16; side: 1; side-md: 2" style="--fx-slide: 260px" data-demo-remove>
  <div class="swiper" data-fx-part="track"><div class="swiper-wrapper">
    <div class="swiper-slide"><div class="wf-img card" data-label="Photo 1"></div></div>
    <div class="swiper-slide"><div class="wf-img card" data-label="Photo 2"></div></div>
    <div class="swiper-slide"><div class="wf-img card" data-label="Photo 3"></div></div>
    <div class="swiper-slide"><div class="wf-img card" data-label="Photo 4"></div></div>
  </div></div>
  <div class="nav"><div data-fx-part="prev">←</div><div data-fx-part="next">→</div></div>
</div>
<div class="box" data-fx="stack-carousel" data-fx-stack-carousel="scale: .054; side: 3; scale-md: 0; side-md: 4; gap-md: 10" style="--fx-slide: 220px">
  <div class="swiper" data-fx-part="track"><div class="swiper-wrapper">
    <div class="swiper-slide"><div class="wf-img card" data-label="Card 1"></div></div>
    <div class="swiper-slide"><div class="wf-img card" data-label="Card 2"></div></div>
    <div class="swiper-slide"><div class="wf-img card" data-label="Card 3"></div></div>
    <div class="swiper-slide"><div class="wf-img card" data-label="Card 4"></div></div>
  </div></div>
  <div class="nav"><div data-fx-part="prev">←</div><div data-fx-part="dots"></div><div data-fx-part="next">→</div></div>
</div>
<template data-demo-late><div class="box" data-fx="stack-carousel" style="--fx-slide: 200px"><div class="swiper" data-fx-part="track"><div class="swiper-wrapper"><div class="swiper-slide"><div class="wf-img card" data-label="Late 1"></div></div><div class="swiper-slide"><div class="wf-img card" data-label="Late 2"></div></div><div class="swiper-slide"><div class="wf-img card" data-label="Late 3"></div></div></div></div></div></template>
<script src="../../_vendor/swiper@8.4.7/swiper-bundle.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
