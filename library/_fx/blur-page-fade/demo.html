<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>blur-page-fade — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); padding: 24px; }
  .demo-hint { margin-bottom: 16px; font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-card { padding: 40px; margin-top: 16px; background: var(--kf-surface); border: 1px solid var(--kf-line); border-radius: var(--kf-radius-md); }
  .demo-card a { color: var(--kf-accent); text-decoration: underline; }
</style>
</head>
<body>
<div class="demo-page" data-fx="blur-page-fade" data-fx-blur-page-fade="go: .6">
<p class="demo-hint"><b>blur-page-fade</b> — Refresh. The panel (body when used in real pages) comes into focus from 30px blur over 1s. Pressing the link below blurs it again as it navigates (demo after .6s).</p>
<div class="demo-card"><p>Same site link: <a href="demo.html">Reopen this page</a></p></div>
</div>
<script>
// Late arrivals and removals — the same plate is added after 1 second and one is removed after 2.5 seconds, to check that it attaches and detaches
(() => {
  // Runs after the document is fully read — so elements are found even when the demo is opened inside another frame
  const run = () => {
    const hint = document.querySelector(".demo-hint");
    if (!hint) return;
    const host = document.createElement("div");
    host.className = "demo-card";
    host.innerHTML = '<p>Attached inside the panel (latecomers): <a href="demo.html">Reopen</a></p>';
    const gone = host.cloneNode(true);
    gone.setAttribute("data-fx", "blur-page-fade");
    document.body.append(gone);
    setTimeout(() => { host.setAttribute("data-fx", "blur-page-fade"); document.body.append(host); }, 1000);
    setTimeout(() => gone.remove(), 2500);
    hint.append(" · After 1s one panel comes in (the late arrival), and after 2.5s one drops out (detach).");
  };
  if (document.readyState === "loading") addEventListener("DOMContentLoaded", run); else run();
})();
</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
