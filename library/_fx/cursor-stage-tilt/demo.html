<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cursor-stage-tilt — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { display: grid; gap: 32px; padding: 48px 20px; }
  .demo-stage { height: 60vh; border-radius: 16px; overflow: hidden; background: var(--kf-surface); }
  .demo-stage .wf-img { height: 100%; }
  .demo-small { height: 30vh; }
</style>
</head>
<body>
<p class="demo-hint"><b>cursor-stage-tilt</b> Move the mouse from end to end across the screen. The whole panel tilts ±.9°, following with a lag. <span style="color:var(--kf-dim)">(After 1s one more panel comes in, and one leaves 2.5s later)</span></p>
<main class="demo">
  <div class="demo-stage" data-fx="cursor-stage-tilt"><div class="wf-img" data-label="3D product stage · full screen · landscape"></div></div>
  <div class="demo-stage demo-small" data-fx="cursor-stage-tilt" data-fx-cursor-stage-tilt="max: 3; follow: .85" data-demo-remove><div class="wf-img" data-label="Panel tilting sharply at 3°"></div></div>
  <div class="demo-stage demo-small" data-fx="cursor-stage-tilt"></div>
  <template data-demo-late><div class="demo-stage demo-small" data-fx="cursor-stage-tilt"><div class="wf-img" data-label="Late-arriving panel"></div></div></template>
</main>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
