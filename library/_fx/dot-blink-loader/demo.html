<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dot-blink-loader — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; padding: 24px 20px; }
  .panel { position: relative; height: 200px; padding: 20px; border: 1px solid var(--kf-line); border-radius: var(--kf-radius-md); background: var(--kf-surface); overflow: hidden; }
</style>
</head>
<body>
<p class="demo-hint"><b>dot-blink-loader</b> — On opening, four dots per panel blink in turn and when ready the curtain clears in .5s. To watch it longer, look at the right panel (min: 3) (refresh to see it again).</p>
<div class="grid">
  <div class="panel">Your panel content in one line here
    <div data-fx="dot-blink-loader" data-fx-dot-blink-loader="look: box" aria-hidden="true"><i data-fx-part="dot"></i><i data-fx-part="dot"></i><i data-fx-part="dot"></i><i data-fx-part="dot"></i></div>
  </div>
  <div class="panel">Your panel content in one line here
    <div data-fx="dot-blink-loader" data-fx-dot-blink-loader="look: box; min: 3" aria-hidden="true"><i data-fx-part="dot"></i><i data-fx-part="dot"></i><i data-fx-part="dot"></i><i data-fx-part="dot"></i></div>
  </div>
  <div class="panel" id="host">Your panel content in one line here</div>
</div>
<script>
// Late arrivals and removals — after 1 second add one more overlay (late arrival), and after 2.5 seconds remove one (detach)
(() => {
  const src = document.querySelector('[data-fx~="dot-blink-loader"]');
  const make = () => { const t = document.createElement("template"); t.innerHTML = src.outerHTML.replace("look: box", "look: box; min: 2"); return t.content.firstElementChild; };
  const gone = make();
  document.getElementById("host").append(gone);
  setTimeout(() => document.getElementById("host").append(make()), 1000);
  setTimeout(() => gone.remove(), 2500);
  addEventListener("fx:done", () => document.querySelector(".demo-hint").append(" · fx:done"));
})();
</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
