<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>flip-letters-cross — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo-spacer { height: 90vh; display: grid; place-items: center; color: var(--kf-dim); }
  .sec { position: relative; height: 320vh; margin: 0 20px; border-left: 1px solid var(--kf-line); }
  .row { position: sticky; top: 3rem; display: flex; justify-content: space-between; align-items: center; height: 3rem; font: 700 1.875rem/1 var(--kf-font-display); text-transform: uppercase; }
  .row > div { display: flex; }
</style>
</head>
<body>
<p class="demo-hint"><b>flip-letters-cross</b> — Scroll slowly — the pinned letters cross from the left group to the right cells starting from the last letter, shrinking then growing, and return in the back half of the section (wide screens only).</p>
<div class="demo-spacer">Scroll down</div>
<section class="sec"><div class="row" data-fx="flip-letters-cross"><div><b data-fx-part="letter">W</b><b data-fx-part="letter">O</b><b data-fx-part="letter">R</b><b data-fx-part="letter">K</b><b data-fx-part="letter">S</b></div><div><i data-fx-part="slot"></i><i data-fx-part="slot"></i><i data-fx-part="slot"></i><i data-fx-part="slot"></i><i data-fx-part="slot"></i></div></div></section>
<div class="demo-spacer">Footer</div>
<script>
// Late arrivals and removals — checks that fx-core attaches to an element added after 1s and detaches from an element removed after 2.5s
(() => {
  const src = document.querySelector('[data-fx~="flip-letters-cross"]');
  if (!src) return;
  const html = src.outerHTML.replace(/\sid="[^"]*"/g, "");
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => (src.closest(".pin-spacer") || src).after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical one comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../../../_shared/vendor/gsap/Flip.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
