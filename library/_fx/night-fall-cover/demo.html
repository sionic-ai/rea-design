<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>night-fall-cover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { margin: 0; background: var(--kf-accent-soft); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); transition: color 1s; }
  body.is-fx-night { color: var(--kf-contrast-ink); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); color: var(--kf-ink); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo-spacer { height: 120vh; display: grid; place-items: center; }
  .demo-foot { height: 60vh; display: grid; place-items: center; font-size: 40px; }
</style>
</head>
<body>
<p class="demo-hint"><b>night-fall-cover</b> — Scroll down to the footer and the page turns to night over 2 seconds, scroll back up and it returns to day in 1 second.</p>
<div class="demo-spacer">Scroll down ↓</div>
<footer class="demo-foot" data-fx="night-fall-cover">Your footer here</footer>
<script>
// Late arrivals and removals — after 1 second one more identical footer comes in, and after 2.5 seconds one drops out
(() => {
  const src = document.querySelector('[data-fx~="night-fall-cover"]');
  if (!src) return;
  const html = src.outerHTML;
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => src.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s one more footer comes in, and after 2.5s one drops out.");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
