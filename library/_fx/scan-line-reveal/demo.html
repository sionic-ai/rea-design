<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>scan-line-reveal — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo-spacer { height: 90vh; display: grid; place-items: center; color: var(--kf-dim); }
  .scan { height: 100svh; }
  .scan [data-fx-part="track"] { position: absolute; top: 50%; translate: 0 -50%; gap: 24px; padding: 0 50vw; }
  .scan figure { margin: 0; width: 36vw; height: 50svh; }
  .scan .heat { position: absolute; inset: 0; background: linear-gradient(160deg, var(--kf-accent), var(--kf-accent-soft)); }
  .scan .wf-img { border-radius: 0; }
</style>
</head>
<body>
<p class="demo-hint"><b>scan-line-reveal</b> — Scroll and the section pins and a photo strip flows, and the gray photos peel away as far as they pass the center line, revealing the accent-color layer beneath.</p>
<div class="demo-spacer">Scroll down ↓</div>
<section class="scan" data-fx="scan-line-reveal"><span data-fx-part="line"></span><div data-fx-part="track">
  <figure data-fx-part="frame"><div class="heat"></div><div data-fx-part="cover"><div class="wf-img" data-label="Audience 1 · in front of the stage · landscape 3:2"></div></div></figure>
  <figure data-fx-part="frame"><div class="heat"></div><div data-fx-part="cover"><div class="wf-img" data-label="Audience 2"></div></div></figure>
  <figure data-fx-part="frame"><div class="heat"></div><div data-fx-part="cover"><div class="wf-img" data-label="Audience 3"></div></div></figure>
</div></section>
<div class="demo-spacer"></div>
<script>
// Late arrivals and removals — checks that fx-core attaches to an element added after 1s and detaches from an element removed after 2.5s
(() => {
  const src = document.querySelector('[data-fx~="scan-line-reveal"]');
  if (!src) return;
  const html = src.outerHTML;
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => (src.closest(".pin-spacer") || src).after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical one comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
