<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>frame-flip-loop — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.6 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { display: flex; gap: 40px; padding: 48px 20px; color: var(--kf-accent); }
  .f { width: 140px; aspect-ratio: 1; }
</style>
</head>
<body>
<p class="demo-hint"><b>frame-flip-loop</b> — The drawing changes in jerks every 800ms (flipbook style). The second is 1500ms, and the third bounces elastically when it changes. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<section class="demo">
  <span class="f" data-fx="frame-flip-loop"><svg data-fx-part="frame" viewBox="0 0 100 100"><circle cx="50" cy="46" r="22" fill="none" stroke="currentColor" stroke-width="5"/><path d="M28 92h44" stroke="currentColor" stroke-width="5" stroke-linecap="round"/></svg><svg data-fx-part="frame" viewBox="0 0 100 100"><circle cx="50" cy="56" r="22" fill="none" stroke="currentColor" stroke-width="5"/><path d="M28 92h44" stroke="currentColor" stroke-width="5" stroke-linecap="round"/></svg></span>
  <span class="f" data-fx="frame-flip-loop" data-fx-frame-flip-loop="every: 1500" data-demo-remove><svg data-fx-part="frame" viewBox="0 0 100 100"><circle cx="50" cy="40" r="22" fill="none" stroke="currentColor" stroke-width="5"/><path d="M28 92h44" stroke="currentColor" stroke-width="5" stroke-linecap="round"/></svg><svg data-fx-part="frame" viewBox="0 0 100 100"><circle cx="50" cy="52" r="22" fill="none" stroke="currentColor" stroke-width="5"/><path d="M28 92h44" stroke="currentColor" stroke-width="5" stroke-linecap="round"/></svg><svg data-fx-part="frame" viewBox="0 0 100 100"><circle cx="50" cy="64" r="22" fill="none" stroke="currentColor" stroke-width="5"/><path d="M28 92h44" stroke="currentColor" stroke-width="5" stroke-linecap="round"/></svg></span>
  <span class="f" data-fx="frame-flip-loop" data-fx-frame-flip-loop="every: 2500; pop: on"><svg data-fx-part="frame" viewBox="0 0 100 100"><circle cx="50" cy="50" r="22" fill="none" stroke="currentColor" stroke-width="5"/><path d="M28 92h44" stroke="currentColor" stroke-width="5" stroke-linecap="round"/></svg><svg data-fx-part="frame" viewBox="0 0 100 100"><circle cx="50" cy="58" r="22" fill="none" stroke="currentColor" stroke-width="5"/><path d="M28 92h44" stroke="currentColor" stroke-width="5" stroke-linecap="round"/></svg></span>
  <template data-demo-late><span class="f" data-fx="frame-flip-loop"><svg data-fx-part="frame" viewBox="0 0 100 100"><circle cx="50" cy="44" r="22" fill="none" stroke="currentColor" stroke-width="5"/><path d="M28 92h44" stroke="currentColor" stroke-width="5" stroke-linecap="round"/></svg><svg data-fx-part="frame" viewBox="0 0 100 100"><circle cx="50" cy="60" r="22" fill="none" stroke="currentColor" stroke-width="5"/><path d="M28 92h44" stroke="currentColor" stroke-width="5" stroke-linecap="round"/></svg></span></template>
</section>

<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
