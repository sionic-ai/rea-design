<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>strip-progress-bar — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { display: grid; gap: 56px; max-width: 900px; padding: 48px 20px; }
  .strip > div { gap: 8px; padding-right: 8px; }
  .strip figure { width: 280px; height: 420px; margin: 0; display: grid; place-items: center; background: var(--kf-raised); border: 1px solid var(--kf-line); color: var(--kf-dim); }
  .foot { display: flex; align-items: center; gap: 24px; margin-top: 12px; }
  .foot [data-fx-part="track"] { flex: 1; }
  .foot button { width: 20px; height: 20px; padding: 0; border: 0; background: none; color: var(--kf-ink); cursor: pointer; }
  .demo-spacer { height: 90vh; }
</style>
</head>
<body>
<p class="demo-hint"><b>strip-progress-bar</b> — Drag the photo strip sideways or press the arrows. The bar starts at 150px and grows as far as you push. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<section class="demo">
  <div data-fx="strip-progress-bar">
    <div class="strip" data-fx-part="strip"><div><figure>Photo 1</figure><figure>Photo 2</figure><figure>Photo 3</figure><figure>Photo 4</figure><figure>Photo 5</figure></div></div>
    <div class="foot"><div data-fx-part="track"><i data-fx-part="bar"></i></div><button data-fx-part="prev" aria-label="Previous">&#8592;</button><button data-fx-part="next" aria-label="Next">&#8594;</button></div>
  </div>
  <div data-demo-remove data-fx="strip-progress-bar" data-fx-strip-progress-bar="start: 60; step: 200">
    <div class="strip" data-fx-part="strip"><div><figure>Removable band 1</figure><figure>2</figure><figure>3</figure><figure>4</figure></div></div>
    <div class="foot"><div data-fx-part="track"><i data-fx-part="bar"></i></div></div>
  </div>
  <template data-demo-late><div data-fx="strip-progress-bar"><div class="strip" data-fx-part="strip"><div><figure>Late-arriving band 1</figure><figure>2</figure><figure>3</figure><figure>4</figure></div></div><div class="foot"><div data-fx-part="track"><i data-fx-part="bar"></i></div></div></div></template>
</section>
<div class="demo-spacer"></div>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
