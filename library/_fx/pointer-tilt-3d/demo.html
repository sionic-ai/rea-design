<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pointer-tilt-3d — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { padding: 80px 20px; display: flex; gap: 60px; justify-content: center; perspective: 1000px; }
  .card { width: 220px; aspect-ratio: 1; border-radius: var(--kf-radius-md); background: var(--kf-raised); border: 1px solid var(--kf-line); }
</style>
</head>
<body>
<p class="demo-hint"><b>pointer-tilt-3d</b> — Move the mouse anywhere on screen. The panel tilts toward the cursor.</p>
<section class="demo">
  <div class="card" data-fx="pointer-tilt-3d"></div>
  <div class="card" data-fx="pointer-tilt-3d" data-demo-remove></div>
  <template data-demo-late><div class="card" data-fx="pointer-tilt-3d" data-fx-pointer-tilt-3d="max: 8; dur: 1"></div></template>
</section>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
