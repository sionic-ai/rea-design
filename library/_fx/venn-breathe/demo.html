<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>venn-breathe — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { padding: 40px 20px; max-width: 900px; margin: 0 auto; display: grid; gap: 40px; }
</style>
</head>
<body>
<p class="demo-hint"><b>venn-breathe</b> — Three ellipses swell and orbit in turn. <span style="color:var(--kf-dim)">(After 1s one more picture comes in, and after 2.5s one drops out)</span></p>
<section class="demo">
  <figure data-fx="venn-breathe" data-demo-remove><span data-fx-part="label">Space / Production</span><span data-fx-part="label">Prototype &amp; / Art Lab</span><span data-fx-part="label">Brand / Consulting</span></figure>
  <figure data-fx="venn-breathe" data-fx-venn-breathe="step: .8; grow: 1.3"><span data-fx-part="label">Plan</span><span data-fx-part="label">Make</span><span data-fx-part="label">Test</span></figure>
  <figure data-fx="venn-breathe"></figure>
  <template data-demo-late><figure data-fx="venn-breathe"><span data-fx-part="label">One / Area</span><span data-fx-part="label">Two / Area</span><span data-fx-part="label">Three / Area</span></figure></template>
</section>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
