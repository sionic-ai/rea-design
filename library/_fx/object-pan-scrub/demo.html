<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>object-pan-scrub — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: sticky; top: 0; z-index: 10; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .gap { height: 80vh; }
  .frame { width: min(80vw, 720px); height: 50vh; margin: 0 auto 40px; }
  .ph { width: 100%; height: 100%; background-image: linear-gradient(var(--kf-accent-soft), var(--kf-raised) 40%, var(--kf-accent)); }
</style>
</head>
<body>
<p class="demo-hint"><b>object-pan-scrub</b> — Try scrolling. The frame stays put while the image inside flows slowly from top edge to bottom edge. <span style="color:var(--kf-dim)">(After 1s one more cell comes in, and one leaves 2.5s later)</span></p>
<div class="gap"></div>
<div class="frame"><div class="ph" data-fx="object-pan-scrub"></div></div>
<div class="frame" data-demo-remove><div class="ph" data-fx="object-pan-scrub"></div></div>
<template data-demo-late><div class="frame"><div class="ph" data-fx="object-pan-scrub" data-fx-object-pan-scrub="scrub: 1; to: 50% 60%"></div></div></template>
<div class="gap"></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
