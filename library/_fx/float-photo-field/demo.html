<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>float-photo-field — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 50; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .field { position: relative; display: flex; flex-direction: column; padding: 40px 0 200px; overflow: hidden; }
  .field [data-fx-part="item"] { width: 22%; }
  .field [data-fx-part="item"]:nth-child(2n) { margin-left: auto; margin-top: -60px; }
  .field [data-fx-part="item"]:nth-child(3n) { margin-left: 30%; }
  .field [data-fx-part="media"] { aspect-ratio: 4 / 3; border-radius: var(--kf-radius-md); background: var(--kf-raised); }
  .title { position: sticky; top: 40vh; z-index: 1; text-align: center; font: 700 48px/1 var(--kf-font-display); }
  .demo-spacer { height: 60vh; }
</style>
</head>
<body>
<p class="demo-hint"><b>float-photo-field</b> — Move the mouse and scroll. Each photo shifts at a different depth and floats. <span style="color:var(--kf-dim)">(One more photo comes in after 1s, and one drops out after 2.5s)</span></p>
<div class="field" data-fx="float-photo-field">
  <p class="title">Photo Constellation</p>
  <div data-fx-part="item"><div data-fx-part="intro"><div data-fx-part="float"><div data-fx-part="media"></div></div></div></div>
  <div data-fx-part="item" data-demo-remove><div data-fx-part="intro"><div data-fx-part="float"><div data-fx-part="media"></div></div></div></div>
  <div data-fx-part="item"><div data-fx-part="intro"><div data-fx-part="float"><div data-fx-part="media"></div></div></div></div>
  <div data-fx-part="item"><div data-fx-part="intro"><div data-fx-part="float"><div data-fx-part="media"></div></div></div></div>
  <div data-fx-part="item"><div data-fx-part="intro"><div data-fx-part="float"><div data-fx-part="media"></div></div></div></div>
  <div data-fx-part="item"><div data-fx-part="intro"><div data-fx-part="float"><div data-fx-part="media"></div></div></div></div>
</div>
<template data-demo-late><div class="field" data-fx="float-photo-field" data-fx-float-photo-field="seed: 11; intro: off"><p class="title">Late panel</p><div data-fx-part="item"><div data-fx-part="intro"><div data-fx-part="float"><div data-fx-part="media"></div></div></div></div><div data-fx-part="item"><div data-fx-part="intro"><div data-fx-part="float"><div data-fx-part="media"></div></div></div></div></div></template>
<div class="demo-spacer"></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
