<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>roller-press-lines — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .gap { height: 50vh; }
  .press { height: 250vh; }
  .stage { position: sticky; top: 0; height: 100vh; display: grid; align-items: center; padding: 0 6vw; }
  .statement { display: flex; flex-direction: column; gap: .1em; margin: 0; }
  .statement span[data-fx-part="line"] { display: block; font: 800 clamp(48px, 9vw, 120px)/0.96 var(--kf-font-sans); text-transform: uppercase; color: var(--kf-dim); text-shadow: 1px 1px 0 var(--kf-surface), -1px -1px 0 color-mix(in srgb, var(--kf-ink) 45%, transparent), 3px 4px 3px color-mix(in srgb, var(--kf-ink) 25%, transparent); }
  .statement [data-fx-part="roller"] { left: -2vw; right: -2vw; }
</style>
</head>
<body>
<p class="demo-hint"><b>roller-press-lines</b> — Scroll down. A roller descends and only the lines it has passed are printed crisply on the panel. <span style="color:var(--kf-dim)">(One more sentence comes in after 1s, and one drops out after 2.5s)</span></p>
<div class="gap"></div>
<section class="press"><div class="stage"><h2 class="statement" data-fx="roller-press-lines">
  <span data-fx-part="line">Line one.</span><span data-fx-part="line">Line two.</span><span data-fx-part="line">Third</span><span data-fx-part="line">line.</span><span data-fx-part="roller"></span>
</h2></div></section>
<section class="press" style="height:150vh" data-demo-remove><div class="stage"><h2 class="statement" data-fx="roller-press-lines"><span data-fx-part="line">Gone soon</span></h2></div></section>
<section><h2 data-fx="roller-press-lines"></h2></section>
<template data-demo-late><section class="press" style="height:180vh"><div class="stage"><h2 class="statement" data-fx="roller-press-lines"><span data-fx-part="line">Late one</span><span data-fx-part="line">Late two</span><span data-fx-part="roller"></span></h2></div></section></template>
<div class="gap"></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script>gsap.registerPlugin(ScrollTrigger);</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
