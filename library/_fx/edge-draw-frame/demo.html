<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>edge-draw-frame — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .frame { position: relative; width: min(420px, 80vw); aspect-ratio: 3 / 4; margin: 40px auto; display: grid; place-items: center; }
  .frame [data-key] { position: absolute; background: repeating-linear-gradient(90deg, var(--kf-ink) 0 10px, transparent 10px 16px); }
  .frame [data-key="top"], .frame [data-key="bottom"] { left: 0; right: 0; height: 12px; }
  .frame [data-key="top"] { top: 0; } .frame [data-key="bottom"] { bottom: 0; }
  .frame [data-key="left"], .frame [data-key="right"] { top: 20px; bottom: 20px; width: 12px; background: repeating-linear-gradient(0deg, var(--kf-ink) 0 10px, transparent 10px 16px); }
  .frame [data-key="left"] { left: 0; } .frame [data-key="right"] { right: 0; }
  .spacer { height: 80vh; }
</style>
</head>
<body>
<p class="demo-hint"><b>edge-draw-frame</b> — When opened, the four sides of the frame are drawn clockwise. The lower frame is drawn when it enters the screen. <span style="color:var(--kf-dim)">(One more frame comes in after 1s, and one drops out after 2.5s)</span></p>
<div class="frame" data-fx="edge-draw-frame"><span data-fx-part="edge" data-key="top"></span><span data-fx-part="edge" data-key="right"></span><span data-fx-part="edge" data-key="bottom"></span><span data-fx-part="edge" data-key="left"></span>Your frame content here</div>
<div class="frame" data-demo-remove data-fx="edge-draw-frame" data-fx-edge-draw-frame="at: 0"><span data-fx-part="edge" data-key="top"></span>Exit frame</div>
<div class="spacer"></div>
<div class="frame" data-fx="edge-draw-frame" data-fx-edge-draw-frame="on: scroll; at: 0; gap: .2"><span data-fx-part="edge" data-key="top"></span><span data-fx-part="edge" data-key="right"></span><span data-fx-part="edge" data-key="bottom"></span><span data-fx-part="edge" data-key="left"></span>Frame drawn by scroll</div>
<div data-late-slot></div>
<div class="spacer"></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script>gsap.registerPlugin(ScrollTrigger);</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelector("[data-late-slot]").outerHTML = '<div class="frame" data-fx="edge-draw-frame" data-fx-edge-draw-frame="at: .2; dur: 1"><span data-fx-part="edge" data-key="top"></span><span data-fx-part="edge" data-key="bottom"></span>Late-arrived Picture frame</div>', 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
