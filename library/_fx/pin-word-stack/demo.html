<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pin-word-stack — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { margin: 0; background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo-spacer { height: 70vh; display: grid; place-items: center; color: var(--kf-dim); }
  .stack { border-radius: 0 0 var(--kf-radius-lg) var(--kf-radius-lg); }
  .stack [data-fx-part="photo"] { height: 100vh; }
  .stack .wf-img { border: 0; }
  .stack [data-fx-part="lead"] { font-size: clamp(36px, 6vw, 88px); line-height: 1; letter-spacing: -0.025em; }
</style>
</head>
<body>
<p class="demo-hint"><b>pin-word-stack</b> — Scroll down and each time the photo changes, one word attaches to the center sentence.</p>
<div class="demo-spacer">Scroll down ↓</div>
<section class="stack" data-fx="pin-word-stack">
  <p data-fx-part="lead"><span>Here</span> <span>Word</span> <span>We build up</span></p>
  <div data-fx-part="photo"><span class="wf-img" data-label="Photo 1 · Horizontal wide"></span></div>
  <div data-fx-part="photo"><span class="wf-img" data-label="Photo 2 · Horizontal wide"></span></div>
  <div data-fx-part="photo"><span class="wf-img" data-label="Photo 3 · Horizontal wide"></span></div>
</section>
<div class="demo-spacer">Next section</div>
<script>
// Late arrivals and removals — after 1 second one more identical group comes in, and after 2.5 seconds one drops out
(() => {
  const src = document.querySelector('[data-fx~="pin-word-stack"]');
  if (!src) return;
  const html = src.outerHTML;
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => src.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s one more identical bundle comes in, and after 2.5s one drops out.");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
