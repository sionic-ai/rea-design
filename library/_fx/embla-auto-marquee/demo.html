<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>embla-auto-marquee — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 500 15px/1.6 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 10; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .band { margin: 48px 0; padding: 14px 0; background: var(--kf-accent-soft); border-block: 1px solid var(--kf-line); }
  .band li { margin-right: 60px; font: 700 64px/1 var(--kf-font-display); color: var(--kf-surface); -webkit-text-stroke: 1.5px var(--kf-ink); }
  .band.is-small li { margin-right: 40px; font: 500 16px/1 var(--kf-font-sans); color: var(--kf-ink); -webkit-text-stroke: 0; letter-spacing: .6em; }
</style>
</head>
<body>
<p class="demo-hint"><b>embla-auto-marquee</b> — The band flows by itself. Drag it (after dragging it stops, like the original). <span style="color:var(--kf-dim)">(After 1s one more band comes in, and one leaves 2.5s later)</span></p>
<div class="band" data-fx="embla-auto-marquee"><ul data-fx-part="track"><li>OURSCHOOL</li><li>OURSCHOOL</li></ul></div>
<div class="band is-small" data-fx="embla-auto-marquee" data-fx-embla-auto-marquee="align: center; stop: hover"><ul><li>Your school name here</li><li>Your school name here</li></ul></div>
<div class="band" data-fx="embla-auto-marquee" data-demo-remove><ul><li>Dropped Band</li></ul></div>
<div class="band" data-fx="embla-auto-marquee"><ul data-fx-part="track"></ul></div>
<template data-demo-late><div class="band" data-fx="embla-auto-marquee" data-fx-embla-auto-marquee="speed: 1; dir: backward; stop: none"><ul><li>LATE ONE</li></ul></div></template>
<script src="../../_vendor/embla-carousel@8.6.0/embla-carousel.umd.js"></script>
<script src="../../_vendor/embla-carousel-auto-scroll@8.6.0/embla-carousel-auto-scroll.umd.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
