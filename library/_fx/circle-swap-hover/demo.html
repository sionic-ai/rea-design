<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>circle-swap-hover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { display: flex; flex-wrap: wrap; gap: 16px; padding: 48px 20px; }
  .demo-btn { display: inline-flex; align-items: center; justify-content: space-between; width: 200px; height: 56px; padding: 0 24px; border: 0; border-radius: var(--kf-radius-md); color: var(--kf-bg); font: 700 16px/1 var(--kf-font-sans); cursor: pointer; text-decoration: none; }
  .demo-btn.is-small { width: 132px; height: 48px; justify-content: center; }
</style>
</head>
<body>
<p class="demo-hint"><b>circle-swap-hover</b> — Hover over the button and then leave. On hover an accent-color circle spreads from the center, and on leave a background-color circle does.</p>
<div class="demo">
  <a class="demo-btn" href="#" data-fx="circle-swap-hover"><span>View details</span><span>→</span></a>
  <button class="demo-btn is-small" type="button" data-fx="circle-swap-hover" data-fx-circle-swap-hover="dur: 0.5"><span>Menu</span></button>
</div>
<script>
// Late arrivals and removals — checks that fx-core attaches to an element added after 1s and detaches from an element removed after 2.5s
(() => {
  const src = document.querySelector('[data-fx~="circle-swap-hover"]');
  if (!src) return;
  const html = src.outerHTML;
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => src.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical one comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
