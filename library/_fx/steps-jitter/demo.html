<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>steps-jitter — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); padding: 24px; }
  .demo-hint { margin-bottom: 24px; font: 500 13px/1.4 var(--kf-font-mono); }
  .row { display: flex; gap: 32px; align-items: center; flex-wrap: wrap; }
  .row svg { width: 96px; height: 96px; }
  h2 { font: 700 72px/1 var(--kf-font-display); }
</style>
</head>
<body>
<p class="demo-hint"><b>steps-jitter</b> — Just watch. The props snap over every .3 seconds. (One more comes in after 1 second, and one leaves after 2.5 seconds)</p>
<div class="row">
  <span data-fx="steps-jitter"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" style="fill:var(--kf-accent)"/><rect x="45" y="5" width="10" height="40" style="fill:var(--kf-ink)"/></svg></span>
  <span data-fx="steps-jitter" data-fx-steps-jitter="deg: 8"><svg viewBox="0 0 100 100"><path d="M50 8 92 90H8z" style="fill:var(--kf-accent-soft)"/></svg></span>
  <span data-demo-remove data-fx="steps-jitter"><svg viewBox="0 0 100 100"><rect x="15" y="15" width="70" height="70" style="fill:var(--kf-ink)"/></svg></span>
  <template data-demo-late><span data-fx="steps-jitter"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="30" style="fill:var(--kf-ink)"/></svg></span></template>
  <span data-fx="steps-jitter"></span>
</div>
<h2 data-fx="steps-jitter"><span data-fx-part="piece">J</span><span data-fx-part="piece">I</span><span data-fx-part="piece">T</span><span data-fx-part="piece">T</span><span data-fx-part="piece">E</span><span data-fx-part="piece">R</span></h2>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
