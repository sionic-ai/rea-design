<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rgb-slice-glitch — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 10; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { display: grid; gap: 40px; padding: 40px; }
  .demo h2 { margin: 0; font: 900 clamp(48px, 8vw, 110px)/1 var(--kf-font-display); }
  .demo button { justify-self: start; padding: 8px 14px; border: 1px solid var(--kf-line); background: var(--kf-surface); font: inherit; cursor: pointer; }
</style>
</head>
<body>
<p class="demo-hint"><b>rgb-slice-glitch</b> — On open the first title, and on button press the second title, breaks apart and snaps together. <span style="color:var(--kf-dim)">(One more title comes in after 1s, and one drops out after 2.5s)</span></p>
<section class="demo">
  <h2 data-fx="rgb-slice-glitch"><span data-fx-part="art">Big Title Here</span></h2>
  <button type="button" onclick="document.dispatchEvent(new Event('demo:go'))">Second title break</button>
  <h2 data-fx="rgb-slice-glitch" data-fx-rgb-slice-glitch="on: demo:go; amp: 1.5"><span data-fx-part="art">Your big title here</span></h2>
  <h2 data-demo-remove data-fx="rgb-slice-glitch"><span>Omitted title</span></h2>
  <template data-demo-late><h2 data-fx="rgb-slice-glitch" data-fx-rgb-slice-glitch="dur: .8"><span>Late-arrived title</span></h2></template>
</section>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
