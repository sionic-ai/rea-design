<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>grow-hover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { padding: 48px 20px; }
  .demo-btn { display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 16px; border: 1px solid var(--kf-line); border-radius: var(--kf-radius-sm); background: var(--kf-surface); color: var(--kf-ink); cursor: pointer; }
  .demo-card { padding: 20px; border: 1px solid var(--kf-line); border-radius: var(--kf-radius-md); background: var(--kf-surface); }
  .demo-spacer { height: 90vh; display: grid; place-items: center; color: var(--kf-dim); }
  .pile { display: flex; gap: 40px; padding: 40px; }
  .pile a { display: block; width: 260px; aspect-ratio: 1; border-radius: var(--kf-radius-md); overflow: clip; }
  .pile .wf-img { height: 100%; }
</style>
</head>
<body>
<p class="demo-hint"><b>grow-hover</b> — Hover over the tilted card. It grows to 1.03x while keeping its tilt.</p>
<section class="demo pile"><a data-fx="grow-hover" href="#" style="rotate:-4deg"><div class="wf-img" data-label="Main work photo · Square"></div></a><a data-fx="grow-hover" href="#" style="rotate:3deg"><div class="wf-img" data-label="Main work photo · Square"></div></a><a data-fx="grow-hover" href="#" style="rotate:-2deg"><div class="wf-img" data-label="Main work photo · Square"></div></a></section>

</body>
</html>
