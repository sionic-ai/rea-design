<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>door-blur-chars — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { padding: 48px 20px; display: grid; gap: 40px; }
  .demo h2 { margin: 0; font: 400 clamp(48px, 9vw, 120px)/1 var(--kf-font-display); letter-spacing: -0.04em; }
  .demo button { font: 600 14px/1 var(--kf-font-sans); padding: 10px 16px; border: 1px solid var(--kf-line); background: var(--kf-surface); color: var(--kf-ink); cursor: pointer; }
  .spacer { height: 110vh; display: grid; place-items: center; color: var(--kf-dim); }
</style>
</head>
<body>
<p class="demo-hint"><b>door-blur-chars</b> — Press the button to fold and unfold the title. Some titles further down open on their own when they come into view. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<section class="demo">
  <button type="button" id="toggle">Fold · Unfold (mode: state · hold 1)</button>
  <h2 id="stated" data-fx="door-blur-chars" data-fx-door-blur-chars="mode: state; hold: 1" class="is-in">MAIN INFO</h2>
  <h2 data-fx="door-blur-chars" data-demo-remove>Your title here</h2>
  <template data-demo-late><h2 data-fx="door-blur-chars">LATE TITLE</h2></template>
</section>
<div class="spacer">Downward</div>
<section class="demo">
  <h2 data-fx="door-blur-chars" data-fx-door-blur-chars="each: .2; dur: 2">ABOUT</h2>
</section>
<div class="spacer"></div>
<script src="../fx-core.js"></script>
<script>
document.getElementById("toggle").addEventListener("click", () => {
  const h = document.getElementById("stated");
  if (h.classList.contains("is-in")) h.classList.remove("is-in"); else h.classList.add("is-in");
});
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
