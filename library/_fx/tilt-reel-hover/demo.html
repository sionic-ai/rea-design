<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tilt-reel-hover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { padding: 48px 20px; }
  .demo-spacer { height: 90vh; display: grid; place-items: center; color: var(--kf-dim); }
  .list a { display: flex; justify-content: space-between; padding: 56px 0; font: 500 48px/1 var(--kf-font-display); border-top: 1px solid var(--kf-line); }
</style>
</head>
<body>
<p class="demo-hint"><b>tilt-reel-hover</b> — Hover over a list row — the row on the back panel shifts and that panel stands up. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<section class="demo"><div class="list" data-fx="tilt-reel-hover">
  <a href="#" data-fx-part="item">Service 1<small>(0.0.1)</small></a>
  <a href="#" data-fx-part="item">Service 2<small>(0.0.2)</small></a>
  <a href="#" data-fx-part="item">Service 3<small>(0.0.3)</small></a>
  <a href="#" data-fx-part="item">Service 4<small>(0.0.4)</small></a>
  <div data-fx-part="stage"><div data-fx-part="reel"><div data-fx-part="tile"><div class="wf-img" data-label="Video 1"></div></div><div data-fx-part="tile"><div class="wf-img" data-label="Video 2"></div></div><div data-fx-part="tile"><div class="wf-img" data-label="Video 3"></div></div><div data-fx-part="tile"><div class="wf-img" data-label="Video 4"></div></div></div></div>
</div>
<div data-demo-remove data-fx="tilt-reel-hover"><a data-fx-part="item" href="#">List without panel</a></div>
<template data-demo-late><div data-fx="tilt-reel-hover"></div></template></section>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); window.ScrollTrigger?.refresh(); }, 2500);
</script>
</body>
</html>
