<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tab-bar-swap — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.6 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .box { width: min(760px, 92vw); margin: 60px auto; display: grid; gap: 24px; }
  .tabs { position: relative; justify-self: center; display: inline-flex; padding: 2px; border-radius: 10px; background: var(--kf-raised); }
  .tabs span { border-radius: 8px; background: var(--kf-bg); box-shadow: var(--kf-shadow-soft); }
  .tabs button { height: 32px; padding: 0 12px; border: 0; background: none; cursor: pointer; }
  .row { display: flex; align-items: center; gap: 16px; height: 48px; border-top: 1px solid var(--kf-line); }
  .row span:first-child { width: 120px; } .track { flex: 1; height: 14px; } .track i { border-radius: 3px; background: var(--kf-accent); }
</style>
</head>
<body>
<p class="demo-hint"><b>tab-bar-swap</b> — Press a tab. The pill slides and the bar changes to a new length. <span style="color:var(--kf-dim)">(After 1s one more graph comes in, and after 2.5s one is removed)</span></p>
<div class="box" data-fx="tab-bar-swap">
  <div class="tabs"><span data-fx-part="pill"></span><button data-fx-part="tab" aria-selected="true" data-values=".99,.977,.928,.84,.7">One</button><button data-fx-part="tab" data-values=".96,.88,.8,.74,.62">Second tab</button><button data-fx-part="tab" data-values=".92,.7,.66,.6,.41">Three (native Korean)</button></div>
  <div><div class="row"><span>Item 1</span><span class="track"><i data-fx-part="bar"></i></span><b data-fx-part="value"></b></div><div class="row"><span>Item 2</span><span class="track"><i data-fx-part="bar"></i></span><b data-fx-part="value"></b></div><div class="row"><span>Item 3</span><span class="track"><i data-fx-part="bar"></i></span><b data-fx-part="value"></b></div><div class="row"><span>Item 4</span><span class="track"><i data-fx-part="bar"></i></span><b data-fx-part="value"></b></div><div class="row"><span>Item 5</span><span class="track"><i data-fx-part="bar"></i></span><b data-fx-part="value"></b></div></div>
</div>
<div class="box" data-fx="tab-bar-swap" data-demo-remove><div class="tabs"><button data-fx-part="tab" data-values=".5">Exit graph</button></div><div class="row"><span class="track"><i data-fx-part="bar"></i></span></div></div>
<div class="box" data-fx="tab-bar-swap"></div>
<div data-late-slot></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../../../_shared/vendor/gsap/CustomEase.min.js"></script>
<script>gsap.registerPlugin(ScrollTrigger, CustomEase);</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelector("[data-late-slot]").outerHTML = '<div class="box" data-fx="tab-bar-swap" data-fx-tab-bar-swap="dur: 1"><div class="tabs"><span data-fx-part="pill"></span><button data-fx-part="tab" aria-selected="true" data-values=".3,.6">Late A</button><button data-fx-part="tab" data-values=".9,.2">Late B</button></div><div class="row"><span class="track"><i data-fx-part="bar"></i></span><b data-fx-part="value"></b></div><div class="row"><span class="track"><i data-fx-part="bar"></i></span><b data-fx-part="value"></b></div></div>', 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
