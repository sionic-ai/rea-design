<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>accent-hover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { padding: 48px 20px; }
  .demo-btn { display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 16px; border: 1px solid var(--kf-line); border-radius: var(--kf-radius-sm); background: var(--kf-surface); color: var(--kf-ink); cursor: pointer; }
  .demo-card { padding: 20px; border: 1px solid var(--kf-line); border-radius: var(--kf-radius-md); background: var(--kf-surface); }
  .demo-spacer { height: 90vh; display: grid; place-items: center; color: var(--kf-dim); }
  .big { display: flex; flex-direction: column; gap: 6px; font: 400 64px/.9 var(--kf-font-display); text-transform: uppercase; }
  .foot { display: flex; gap: 18px; margin-top: 40px; font: 12px var(--kf-font-mono); }
</style>
</head>
<body>
<p class="demo-hint"><b>accent-hover</b> — Hover over a link — it turns the accent color. ”About” is the current page (aria-current), so it is always accent-colored.</p>
<section class="demo"><nav class="big"><a data-fx="accent-hover" href="#">Home</a><a data-fx="accent-hover" href="#">Work</a><a data-fx="accent-hover" href="#" aria-current="page">About</a><a data-fx="accent-hover" href="#">Playground</a></nav>
<div class="foot"><a data-fx="accent-hover" href="#">Social 1</a><a data-fx="accent-hover" href="#">Social 2</a><a data-fx="accent-hover" href="#">Mail</a></div></section>

</body>
</html>
