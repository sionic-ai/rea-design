<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>icon-deck-shuffle — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 500 15px/1.5 var(--kf-font-sans); }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .row { display: flex; gap: 120px; padding: 120px 80px; }
  .c1 { background: var(--kf-accent); } .c2 { background: var(--kf-ink); } .c3 { background: var(--kf-accent-soft); } .c4 { background: var(--kf-dim); }
</style>
</head>
<body>
<p class="demo-hint"><b>icon-deck-shuffle</b> — Hover over the stack and the second card lifts, click and the top card goes to the back. A name tag appears over the top card.</p>
<div class="row">
  <span data-fx="icon-deck-shuffle">
    <span data-fx-part="card" class="c1" data-name="Client One"></span>
    <span data-fx-part="card" class="c2" data-name="Client Two"></span>
    <span data-fx-part="card" class="c3" data-name="Client Three"></span>
    <span data-fx-part="card" class="c4" data-name="Client Four"></span>
    <span data-fx-part="label"></span>
  </span>
  <template data-demo-late><span data-fx="icon-deck-shuffle" data-fx-icon-deck-shuffle="tilt: 0,0,0; lift: 12"><span data-fx-part="card" class="c3" data-name="Late A"></span><span data-fx-part="card" class="c1" data-name="Late B"></span></span></template>
  <span data-demo-remove data-fx="icon-deck-shuffle"><span data-fx-part="card" class="c2"></span><span data-fx-part="card" class="c4"></span></span>
</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/CustomEase.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
