<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hold-confetti-spray — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .pad { display: grid; place-items: center; height: 50vh; margin: 20px; border: 1px dashed var(--kf-line); border-radius: var(--kf-radius-lg); font: var(--kf-weight-display) 32px/1 var(--kf-font-display); user-select: none; }
</style>
</head>
<body>
<p class="demo-hint"><b>hold-confetti-spray</b> — Hold the mouse down over the panel. Pieces burst out from the cursor and fall spinning. Drag while holding and they follow.</p>
<section class="pad" data-fx="hold-confetti-spray">
  <svg data-fx-part="piece" hidden viewBox="0 0 40 40"><rect width="40" height="40" fill="var(--kf-accent)"/><path d="M8 32a24 24 0 0 1 24-24" stroke="var(--kf-on-accent)" stroke-width="6" fill="none"/></svg>
  Try pressing and holding
</section>
<script>
(() => {
  const src = document.querySelector('[data-fx~="hold-confetti-spray"]');
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = src.outerHTML; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => src.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical panel comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
