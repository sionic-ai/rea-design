<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pill-dot-grow — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.6 var(--kf-font-sans); }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .row { display: flex; flex-wrap: wrap; gap: 24px; max-width: 900px; margin: 60px auto; padding: 0 20px; align-items: center; }
  .btn { display: inline-flex; align-items: center; gap: 20px; height: 40px; padding: 0 8px 0 40px; border-radius: 20px; font-size: 13px; letter-spacing: 0.12em; }
  .card { position: relative; display: grid; place-items: center; width: 260px; height: 180px; border-radius: 24px; background: var(--kf-surface); }
  .card [data-fx-part="dot"] { position: absolute; right: 24px; bottom: 24px; }
</style>
</head>
<body>
<p class="demo-hint"><b>pill-dot-grow</b> — Hover over buttons and cards. The dot becomes a circle and an arrow appears. <span style="color:var(--kf-dim)">(After 1s one more button comes in, and after 2.5s one drops out)</span></p>
<div class="row">
  <a class="btn" href="#" data-fx="pill-dot-grow">See more<span data-fx-part="dot"><svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M1 5h8M5.5 1.5 9 5 5.5 8.5"/></svg></span></a>
  <a class="btn" href="#" data-fx="pill-dot-grow" data-demo-remove>Omitted button<span data-fx-part="dot"><svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M1 5h8M5.5 1.5 9 5 5.5 8.5"/></svg></span></a>
  <a class="card" href="#" data-fx="pill-dot-grow" data-fx-pill-dot-grow="look: ring">Card corner ring<span data-fx-part="dot"><svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M1 5h8M5.5 1.5 9 5 5.5 8.5"/></svg></span></a>
  <template data-demo-late><a class="btn" href="#" data-fx="pill-dot-grow">Late-arrived Button<span data-fx-part="dot"><svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M1 5h8M5.5 1.5 9 5 5.5 8.5"/></svg></span></a></template>
  <a class="btn" href="#" data-fx="pill-dot-grow">Button Without Dots</a>
</div>
<script src="../fx-core.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
