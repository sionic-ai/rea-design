<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>arrow-pass-hover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { padding: 48px 20px; display: grid; gap: 24px; justify-items: start; }
  .more { display: inline-flex; align-items: center; gap: 12px; color: var(--kf-accent); border-bottom: 1px solid currentColor; padding-bottom: 2px; }
  .more svg, .pills svg { fill: none; stroke: currentColor; stroke-width: 1.4; }
  .pills { display: flex; gap: 8px; }
  .pills a { display: grid; place-items: center; width: 66px; height: 24px; border-radius: var(--kf-radius-pill); background: var(--kf-accent); color: var(--kf-on-accent); }
</style>
</head>
<body>
<p class="demo-hint"><b>arrow-pass-hover</b> — Hover over a link or pill. The arrow slips out to the right and a new arrow enters from the left.</p>
<section class="demo">
  <a href="#" class="more"><span data-fx="arrow-pass-hover"><svg viewBox="0 0 12 9"><path d="M0 4.5h11M7.5 1l3.5 3.5L7.5 8"/></svg><svg viewBox="0 0 12 9"><path d="M0 4.5h11M7.5 1l3.5 3.5L7.5 8"/></svg></span>See it all here</a>
  <a href="#" class="more"><span data-fx="arrow-pass-hover" data-fx-arrow-pass-hover="look: slide" style="--fx-shift: 62px; --fx-w: 62px; --fx-h: 14px; --fx-dur: .5s; --fx-ease: cubic-bezier(.645,.045,.355,1)"><svg viewBox="0 0 62 14"><path d="M0 7h60M53 1.5l7 5.5"/></svg><svg viewBox="0 0 62 14"><path d="M0 7h60M53 1.5l7 5.5"/></svg></span>Your See more (slide) here</a>
  <a href="#" class="more"><span data-fx="arrow-pass-hover" data-fx-arrow-pass-hover="look: slide; leave: snap" style="--fx-w: 30px; --fx-h: 30px; --fx-shift: 100%; --fx-dur: .5s; --fx-ease: cubic-bezier(.165,.84,.44,1); --fx-delay: .2s; border: 1px solid var(--kf-line); border-radius: 50%"><svg viewBox="0 0 30 30"><path d="M10 15h10M16.5 11.5 20 15l-3.5 3.5"/></svg><svg viewBox="0 0 30 30"><path d="M10 15h10M16.5 11.5 20 15l-3.5 3.5"/></svg></span>Circle arrow — passes .2s late and snaps straight back on release</a>
  <a href="#" class="more"><span data-fx="arrow-pass-hover" data-fx-arrow-pass-hover="pace: relay" style="--fx-shift: 100%; --fx-dur: .36s; --fx-ease: ease-out; --fx-w: 16px; --fx-h: 12px"><svg viewBox="0 0 16 12"><path d="M0 6h14.6M9.6 1l5 5-5 5"/></svg><svg viewBox="0 0 16 12"><path d="M0 6h14.6M9.6 1l5 5-5 5"/></svg></span>Relay — enters after dropping out, and the cluster runs once more</a>
  <div class="pills">
    <a href="#" aria-label="Previous"><span data-fx="arrow-pass-hover" data-fx-arrow-pass-hover="look: back"><svg viewBox="0 0 12 9"><path d="M0 4.5h11M7.5 1l3.5 3.5L7.5 8"/></svg><svg viewBox="0 0 12 9"><path d="M0 4.5h11M7.5 1l3.5 3.5L7.5 8"/></svg></span></a>
    <a href="#" aria-label="Next"><span data-fx="arrow-pass-hover"><svg viewBox="0 0 12 9"><path d="M0 4.5h11M7.5 1l3.5 3.5L7.5 8"/></svg><svg viewBox="0 0 12 9"><path d="M0 4.5h11M7.5 1l3.5 3.5L7.5 8"/></svg></span></a>
  </div>
</section>
<script>
// Late arrivals and removals — checks that fx-core attaches to an element added after 1s and detaches from an element removed after 2.5s
(() => {
  const src = document.querySelector('[data-fx~="arrow-pass-hover"]');
  if (!src) return;
  const host = src.closest("a"), html = host.outerHTML;
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  host.after(gone);
  setTimeout(() => host.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical one comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
</body>
</html>
