<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>scroll-glow-reveal — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-spacer { height: 80vh; display: grid; place-items: center; color: var(--kf-dim); }
  .cta { overflow: hidden; padding: 120px 40px; background: var(--kf-contrast-bg); color: var(--kf-contrast-ink); }
  .cta h2 { font: 400 72px/1 var(--kf-font-display); }
  .cta a { display: inline-block; margin-top: 40px; padding: 12px 40px; border: 1px solid color-mix(in srgb, var(--kf-contrast-ink) calc(var(--fx-reveal, 0) * 100%), var(--kf-dim)); border-radius: 999px; }
</style>
</head>
<body>
<p class="demo-hint"><b>scroll-glow-reveal</b> — Scroll down. As the black section rises it spreads into an orange gradient, and at the end a glow rises from below.</p>
<div class="demo-spacer">Downward</div>
<section class="cta" data-fx="scroll-glow-reveal"><div data-fx-part="glow"></div><div data-fx-part="halo"></div><h2>A big call to action</h2><a href="#">Contact Us</a></section>
<div class="demo-spacer">Bottom margin</div>
<script>
// Late arrivals and removals — fx-core also attaches to a section added after 1 second, and checks that a section removed after 2.5 seconds gets detached
(() => {
  const src = document.querySelector('[data-fx~="scroll-glow-reveal"]');
  const make = () => { const t = document.createElement("template"); t.innerHTML = src.outerHTML; return t.content.firstElementChild; };
  const gone = make();
  src.after(gone);
  setTimeout(() => gone.after(make()), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s one more section comes in, and after 2.5s one leaves.");
})();
</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
