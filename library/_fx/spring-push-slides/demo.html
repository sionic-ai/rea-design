<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>spring-push-slides — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { padding: 20px; display: grid; gap: 32px; }
  .stage { height: 40vw; min-height: 240px; }
  .stage .wf-img { height: 100%; }
  .bar { display: flex; gap: 12px; align-items: center; margin-top: 12px; font: 500 13px/1 var(--kf-font-mono); }
  .bar button { border: 1px solid var(--kf-line); background: var(--kf-surface); border-radius: 50%; width: 40px; height: 40px; cursor: pointer; }
</style>
</head>
<body>
<p class="demo-hint"><b>spring-push-slides</b> — Drag the photo sideways or press the arrow keys — the next sheet pushes in on a spring (the first panel advances by itself every 4 seconds). <span style="color:var(--kf-dim)">(After 1s one more panel comes in, and one leaves 2.5s later)</span></p>
<main class="demo">
  <div class="scope">
    <div class="stage" data-fx="spring-push-slides" data-fx-spring-push-slides="mass: 2; every: 4000; scope: .scope">
      <div data-fx-part="slide" data-caption="Section name 1"><div class="wf-img" data-label="Inside a restaurant · daylight · landscape 16:9"></div></div>
      <div data-fx-part="slide" data-caption="Section name 2"><div class="wf-img" data-label="Hotel lobby · evening light · landscape 16:9"></div></div>
      <div data-fx-part="slide" data-caption="Section name 3"><div class="wf-img" data-label="Bar counter · warm lighting · landscape 16:9"></div></div>
    </div>
    <div class="bar"><button data-fx-part="prev" aria-label="Previous section">←</button><button data-fx-part="next" aria-label="Next section">→</button><span data-fx-part="caption"></span><span><span data-fx-part="current"></span> / <span data-fx-part="total"></span></span></div>
  </div>
  <div class="stage" data-fx="spring-push-slides" data-demo-remove>
    <div data-fx-part="slide"><div class="wf-img" data-label="Photo A"></div></div>
    <div data-fx-part="slide"><div class="wf-img" data-label="Photo B"></div></div>
  </div>
  <template data-demo-late><div class="stage" data-fx="spring-push-slides" data-fx-spring-push-slides="tension: 170; friction: 12; every: 2500"><div data-fx-part="slide"><div class="wf-img" data-label="Late 1"></div></div><div data-fx-part="slide"><div class="wf-img" data-label="Late 2"></div></div></div></template>
</main>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => { const t = document.querySelector("template[data-demo-late]"); document.querySelector(".demo").append(t.content.cloneNode(true)); }, 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
