<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>glitch-type — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { display: grid; gap: 20px; max-width: 760px; padding: 48px 20px; }
  .msg { padding: 22px 26px; border: 1px solid var(--kf-line); font: 400 17px/1.7 var(--kf-font-mono); cursor: pointer; }
  .demo-btn { justify-self: start; height: 40px; padding: 0 16px; border: 1px solid var(--kf-line); background: var(--kf-surface); color: var(--kf-ink); cursor: pointer; }
</style>
</head>
<body>
<p class="demo-hint"><b>glitch-type</b> — Text is stamped in, shedding symbols as it goes. Click the text and the remaining text stamps in at once.</p>
<main class="demo">
  <p class="msg" data-fx="glitch-type" data-fx-glitch-type="delay: .6">Your first greeting line here.<br>Your second line here, pause briefly after the comma.<br>The last line ends with a blinking cursor.</p>
  <div id="box" class="msg">
    <p data-fx="glitch-type" data-fx-glitch-type="on: state; delay: .3">Gets stamped when is-in is added to the box.</p>
  </div>
  <button class="demo-btn" type="button" id="open">Open the box (is-in)</button>
  <p data-fx="glitch-type"></p>
</main>
<script>
(() => {
  const box = document.getElementById("box");
  document.getElementById("open").addEventListener("click", () => box.classList.add("is-in"));
  const make = (t) => { const p = document.createElement("p"); p.className = "msg"; p.setAttribute("data-fx", "glitch-type"); p.textContent = t; return p; };
  const gone = make("This line is about to be removed.");
  box.after(gone);
  setTimeout(() => box.after(make("A line that came in 1 second late.")), 1000);
  setTimeout(() => gone.remove(), 600);
  document.querySelector(".demo-hint").append(" · After 1 second one more row comes in (a late arrival), and after .6 seconds one drops out (detach).");
})();
</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
