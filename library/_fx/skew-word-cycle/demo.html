<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>skew-word-cycle — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-box { display: flex; flex-direction: column; justify-content: space-between; height: 320px; margin: 40px 20px; padding: 32px; border: 1px solid var(--kf-line); }
  .demo-row { display: flex; justify-content: space-between; font-size: 32px; text-transform: uppercase; }
  .demo-line { font-size: 32px; line-height: 1.25; text-transform: uppercase; }
</style>
</head>
<body>
<p class="demo-hint"><b>skew-word-cycle</b> — Just watch. Every 2.25 seconds a word tilts up into place and the current word exits upward.</p>
<div class="demo-box">
  <div class="demo-row"><span>Previous word</span><span>Back word</span></div>
  <p class="demo-line" data-fx="skew-word-cycle"><span data-fx-part="word">One changing word</span><span data-fx-part="word">Two changing words</span><span data-fx-part="word">Three changing words</span><span data-fx-part="word">Four changing words</span></p>
  <div class="demo-row" style="font-size:15px;text-transform:none"><span>Your what-we-do line here</span><span>City &amp; City</span></div>
</div>
<p class="demo-line demo-fast" data-fx="skew-word-cycle" data-fx-skew-word-cycle="each: 1.2; dur: .9; skew-in: 12" style="margin:40px 20px;--fx-align:start"><span data-fx-part="word">Fast Beat One</span><span data-fx-part="word">Fast Beat Two</span></p>
<script>
// Late arrivals and removals — checks that fx-core attaches to an element added after 1s and detaches from an element removed after 2.5s
(() => {
  const src = document.querySelector(".demo-fast");
  const html = src.outerHTML;
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => src.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s one more stripe comes in, and after 2.5s one leaves.");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
