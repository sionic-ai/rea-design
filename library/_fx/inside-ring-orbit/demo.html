<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>inside-ring-orbit — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-contrast-bg); color: var(--kf-contrast-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); color: var(--kf-ink); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .o { position: relative; margin: 16px 0; }
  .o [data-fx-part="stage"] { height: 520px; }
  .o [data-fx-part="card"] { --fx-card: var(--kf-raised); --fx-rim: var(--kf-accent); color: var(--kf-contrast-ink); }
  .o p { text-align: center; min-height: 1.5em; }
  .o button { padding: 8px 14px; border: 0; border-radius: var(--kf-radius-pill); background: var(--kf-surface); }
  .small [data-fx-part="stage"] { height: 200px; }
</style>
</head>
<body>
<p class="demo-hint"><b>inside-ring-orbit</b> — Drag the panel left and right or hold the arrow keys. Hover a card and it comes closer and shows its name.</p>
<section class="o" data-fx="inside-ring-orbit">
  <div data-fx-part="stage"></div>
  <span data-fx-part="card">Concept 01</span><span data-fx-part="card">Concept 02</span><span data-fx-part="card">Concept 03</span><span data-fx-part="card">Concept 04</span>
  <span data-fx-part="card">Concept 05</span><span data-fx-part="card">Concept 06</span><span data-fx-part="card">Concept 07</span><span data-fx-part="card">Concept 08</span>
  <span data-fx-part="card">Concept 09</span><span data-fx-part="card">Concept 10</span><span data-fx-part="card">Concept 11</span><span data-fx-part="card">Concept 12</span>
  <span data-fx-part="card">Concept 13</span><span data-fx-part="card">Concept 14</span><span data-fx-part="card">Concept 15</span><span data-fx-part="card">Concept 16</span>
  <p data-fx-part="caption"></p>
  <button data-fx-part="prev" type="button">‹</button> <button data-fx-part="next" type="button">›</button>
</section>
<section class="o small" data-fx="inside-ring-orbit" data-demo-remove><div data-fx-part="stage"></div><span data-fx-part="card">Erase</span></section>
<div id="late"></div>
<section class="o small" data-fx="inside-ring-orbit"></section>
<template data-demo-late><section class="o small" data-fx="inside-ring-orbit" data-fx-inside-ring-orbit="radius: 1800; auto: .002"><div data-fx-part="stage"></div><span data-fx-part="card">Late 1</span><span data-fx-part="card">Late 2</span><span data-fx-part="card">Late 3</span><span data-fx-part="card">Late 4</span><span data-fx-part="card">Late 5</span><span data-fx-part="card">Late 6</span></section></template>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../_vendor/three@0.128.0/build/three.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => document.getElementById("late").append(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
