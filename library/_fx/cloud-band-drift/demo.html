<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cloud-band-drift — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .sky { position: relative; height: 420px; overflow: hidden; background: linear-gradient(var(--kf-bg), var(--kf-accent-soft), var(--kf-bg)); }
  .sky [data-fx] { position: absolute; left: 0; width: 100%; }
</style>
</head>
<body>
<p class="demo-hint"><b>cloud-band-drift</b> — Three cloud bands drift to the right over 60·80·100s. <span style="color:var(--kf-dim)">(After 1s one more band comes in, and one leaves 2.5s later)</span></p>
<div class="sky">
  <span data-fx="cloud-band-drift" style="top: 40px"></span>
  <span data-fx="cloud-band-drift" style="top: 150px; --fx-dur: 80s; --fx-delay: -20s; --fx-height: 120px"></span>
  <span data-demo-remove data-fx="cloud-band-drift" style="top: 230px; --fx-dur: 100s; --fx-dir: reverse"></span>
  <template data-demo-late><span data-fx="cloud-band-drift" style="top: 280px; --fx-dur: 40s; --fx-height: 100px"></span></template>
  <span data-fx="cloud-band-drift" style="top: 330px; --fx-height: 0"></span>
</div>
<script src="../fx-core.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
