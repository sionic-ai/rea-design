<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>magnet-glitch-btn — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .row { display: flex; gap: 40px; padding: 80px 40px; align-items: center; flex-wrap: wrap; }
  .btn { padding: 15px 18px 13px 24px; border: 0; background: var(--kf-ink); color: var(--kf-accent); font: 600 16px/1 var(--kf-font-sans); text-transform: uppercase; cursor: pointer; }
  .btn [data-fx-part="glitch"] { transform: rotate(-3.3deg); }
</style>
</head>
<body>
<p class="demo-hint"><b>magnet-glitch-btn</b> — Hover a button and move inside it. The button is pulled along and the text line changes. After 1 second one button is added and one is removed.</p>
<div class="row" id="row">
  <button class="btn" type="button" data-fx="magnet-glitch-btn"><span data-fx-part="glitch" data-text="Menu"><span data-fx-part="top">Menu</span><span data-fx-part="bot">Menu</span></span></button>
  <button class="btn" type="button" data-fx="magnet-glitch-btn" id="gone"><span data-fx-part="glitch" data-text="Contact Us"><span data-fx-part="top">Contact Us</span><span data-fx-part="bot">Contact Us</span></span></button>
  <button class="btn" type="button" data-fx="magnet-glitch-btn">Textless button</button>
</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
  setTimeout(() => {
    const b = document.createElement("button");
    b.className = "btn"; b.type = "button";
    b.setAttribute("data-fx", "magnet-glitch-btn");
    b.innerHTML = '<span data-fx-part="glitch" data-text="Late-arrived Button"><span data-fx-part="top">Late-arrived Button</span><span data-fx-part="bot">Late-arrived Button</span></span>';
    document.getElementById("row")?.appendChild(b);
    document.getElementById("gone")?.remove();
  }, 1000);
</script>
</body>
</html>
