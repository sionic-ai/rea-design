<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>shape-iris-menu — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .bar { display: flex; justify-content: flex-end; gap: 16px; padding: 24px 40px; }
  .bar button { padding: 12px 22px; border: 0; border-radius: var(--kf-radius-pill); background: var(--kf-accent); color: var(--kf-on-accent); font: 700 16px var(--kf-font-sans); cursor: pointer; }
  nav[data-fx-part="panel"] { display: grid; place-items: center; font-size: 40px; font-weight: 700; }
  nav ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 12px; }
</style>
</head>
<body>
<p class="demo-hint"><b>shape-iris-menu</b> — Click the top-right button. A flower-shaped hole grows from the button and the panel opens, and it closes with the panel background or Esc. <span style="color:var(--kf-dim)">(After 1s one more button comes in, and after 2.5s one drops out)</span></p>
<div class="bar">
  <div data-fx="shape-iris-menu"><button data-fx-part="trigger">Menu</button><nav data-fx-part="panel"><ul><li>Menu 1</li><li>Menu 2</li><li>Menu 3</li></ul></nav></div>
  <div data-fx="shape-iris-menu" data-fx-shape-iris-menu="open: .9; ease-close: 0.87,0,0.13,1"><button data-fx-part="trigger">Circle shape</button><nav data-fx-part="panel"><ul><li>Won 1</li><li>Won 2</li></ul></nav><svg width="0" height="0"><path data-fx-part="shape" d="M0 50a50 50 0 1 0 100 0a50 50 0 1 0 -100 0z"/></svg></div>
  <div data-fx="shape-iris-menu" data-demo-remove><button data-fx-part="trigger">Omitted button</button><nav data-fx-part="panel">Omission</nav></div>
  <template data-demo-late><div data-fx="shape-iris-menu"><button data-fx-part="trigger">Late-arrived Button</button><nav data-fx-part="panel"><ul><li>Late 1</li></ul></nav></div></template>
</div>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
