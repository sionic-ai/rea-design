<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>plus-face-card — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .row { display: flex; gap: 20px; padding: 20px; }
  .card { flex: 1; height: 320px; background: var(--kf-contrast-bg); color: var(--kf-contrast-ink); }
  .card [data-fx-part="front"], .card [data-fx-part="back"] { position: absolute; inset: 24px 24px 60px; }
  .card b { font: 400 64px/1 var(--kf-font-display); display: block; margin-top: 120px; }
  .card button { position: absolute; right: 0; bottom: 0; width: 42px; height: 42px; border: 0; background: var(--kf-contrast-ink); color: var(--kf-contrast-bg); display: grid; place-content: center; }
  .card svg { width: 15px; height: 15px; }
</style>
</head>
<body>
<p class="demo-hint"><b>plus-face-card</b> — Click the + at the card’s bottom right. The front slides up and out and the back rises in.</p>
<div class="row">
  <article class="card" data-fx="plus-face-card"><div data-fx-part="front">Front-side text<b>00%</b></div><div data-fx-part="back">Back — three lines of testimonial here</div><button data-fx-part="toggle" type="button" aria-label="View back side"><svg viewBox="0 0 15 15" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M7.5 1v13M1 7.5h13"/></svg></button></article>
  <article class="card" data-fx="plus-face-card" data-demo-remove><div data-fx-part="front">Card to Be Removed</div><button data-fx-part="toggle" type="button" aria-label="Back side"><svg viewBox="0 0 15 15" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M7.5 1v13M1 7.5h13"/></svg></button></article>
  <template data-demo-late><article class="card" data-fx="plus-face-card" data-fx-plus-face-card="dur: .6; shift: 60"><div data-fx-part="front">Delayed card (slow)<b>00%</b></div><div data-fx-part="back">Back side</div><button data-fx-part="toggle" type="button" aria-label="View back side"><svg viewBox="0 0 15 15" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M7.5 1v13M1 7.5h13"/></svg></button></article></template>
  <article class="card" data-fx="plus-face-card"></article>
</div>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
