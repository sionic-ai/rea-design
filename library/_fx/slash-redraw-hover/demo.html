<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>slash-redraw-hover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .stage { display: grid; gap: 64px; padding: 80px 40px; justify-items: start; }
  .ln { display: grid; width: 288px; }
  .ln [data-fx-part="label"] { grid-area: 1 / 1; padding-left: 4px; font: 400 20px/1 var(--kf-font-display); text-transform: uppercase; }
  .ln .rail { position: relative; grid-area: 1 / 1; height: 22px; margin-top: -4px; }
  .ln [data-fx-part="line"] { position: absolute; left: 0; bottom: 0; width: 100%; height: 3px; background: var(--kf-ink); }
  .ln [data-fx-part="slash"] { position: absolute; right: 0; top: 4px; width: 17px; height: 24px; }
  .ar { position: relative; display: flex; justify-content: space-between; width: 320px; padding-bottom: 25px; }
  .ar [data-fx-part="line"] { position: absolute; left: 0; bottom: 0; width: 100%; height: 1px; background: var(--kf-line); }
</style>
</head>
<body>
<p class="demo-hint"><b>slash-redraw-hover</b> — Hover over the link. The underline and hatching clear away and are then drawn again. <span style="color:var(--kf-dim)">(After 1s one more link comes in, and after 2.5s one drops out)</span></p>
<div class="stage">
  <a class="ln" href="#" data-demo-remove data-fx="slash-redraw-hover"><span data-fx-part="label">Contact form</span><span class="rail"><span data-fx-part="line"></span><svg data-fx-part="slash" viewBox="0 0 17 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 23 16 1"/></svg></span></a>
  <a class="ln" href="#" data-fx="slash-redraw-hover"><span data-fx-part="label">View more</span><span class="rail"><span data-fx-part="line"></span><svg data-fx-part="slash" viewBox="0 0 17 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 23 16 1"/></svg></span></a>
  <a class="ar" href="#" data-fx="slash-redraw-hover" data-fx-slash-redraw-hover="look: arrow"><span data-fx-part="label">Your menu name here</span><span>→</span><span data-fx-part="line"></span></a>
  <template data-demo-late><a class="ar" href="#" data-fx="slash-redraw-hover" data-fx-slash-redraw-hover="look: arrow"><span data-fx-part="label">Late-arriving link</span><span>→</span><span data-fx-part="line"></span></a></template>
</div>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
