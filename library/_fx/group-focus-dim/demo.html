<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>group-focus-dim — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo-spacer { height: 90vh; display: grid; place-items: center; color: var(--kf-dim); }
  .site-head { padding: 16px 20px; }
  .wall { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; padding: 20px; }
</style>
</head>
<body>
<p class="demo-hint"><b>group-focus-dim</b> — Hover a cell — only the group with the same letter (A·B·C) remains and the other groups’ cells fade to .2, and the header row above disappears too.</p>
<div class="site-head">Header line — disappears when you hover over a cell</div><div class="wall" data-fx="group-focus-dim" data-fx-group-focus-dim="hide: .site-head"><article data-fx-part="item" data-group="a" style="padding:8px;border:1px solid var(--kf-line)"><b>A 1</b><div style="aspect-ratio:3/2;background:var(--kf-raised)"></div></article><article data-fx-part="item" data-group="a" style="padding:8px;border:1px solid var(--kf-line)"><b>A 2</b><div style="aspect-ratio:3/2;background:var(--kf-raised)"></div></article><article data-fx-part="item" data-group="b" style="padding:8px;border:1px solid var(--kf-line)"><b>B 1</b><div style="aspect-ratio:3/2;background:var(--kf-raised)"></div></article><article data-fx-part="item" data-group="b" style="padding:8px;border:1px solid var(--kf-line)"><b>B 2</b><div style="aspect-ratio:3/2;background:var(--kf-raised)"></div></article><article data-fx-part="item" data-group="b" style="padding:8px;border:1px solid var(--kf-line)"><b>B 3</b><div style="aspect-ratio:3/2;background:var(--kf-raised)"></div></article><article data-fx-part="item" data-group="c" style="padding:8px;border:1px solid var(--kf-line)"><b>C 1</b><div style="aspect-ratio:3/2;background:var(--kf-raised)"></div></article><article data-fx-part="item" data-group="c" style="padding:8px;border:1px solid var(--kf-line)"><b>C 2</b><div style="aspect-ratio:3/2;background:var(--kf-raised)"></div></article><article data-fx-part="item" data-group="c" style="padding:8px;border:1px solid var(--kf-line)"><b>C 3</b><div style="aspect-ratio:3/2;background:var(--kf-raised)"></div></article></div>
<script>
// Late arrivals and removals — checks that fx-core attaches to an element added after 1s and detaches from an element removed after 2.5s
(() => {
  const src = document.querySelector('[data-fx~="group-focus-dim"]');
  if (!src) return;
  const html = src.outerHTML.replace(/\sid="[^"]*"/g, "");
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => (src.closest(".pin-spacer") || src).after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical one comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
