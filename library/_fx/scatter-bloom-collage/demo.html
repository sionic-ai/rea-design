<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>scatter-bloom-collage — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 9; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .gap { height: 60vh; display: grid; place-items: center; color: var(--kf-dim); }
  .board { height: 100vh; overflow: hidden; }
  .board .wf-img { aspect-ratio: 3 / 2; }
  .board [data-fx-part="content"] { position: absolute; left: 50%; bottom: 20%; width: 320px; margin-left: -160px; text-align: center; }
</style>
</head>
<body>
<p class="demo-hint"><b>scatter-bloom-collage</b> — Scroll down. Photos bloom in a shuffled order, and moving the mouse makes each one sway separately.</p>
<div class="gap">Downward</div>
<section class="board" data-fx="scatter-bloom-collage" id="board">
  <div data-fx-part="item" data-reveal-from="center" data-opacity="1" data-mouse=".85" style="top:6%;left:50%;width:40%;transform:translateX(-50%);z-index:3"><div class="wf-img" data-label="Large photo"></div></div>
  <div data-fx-part="item" data-reveal-from="left" data-scale="false" data-mouse=".55" style="top:40%;left:-4%;width:22%"><div class="wf-img" data-label="Left"></div></div>
  <div data-fx-part="item" data-reveal-from="left" data-opacity=".3" data-mouse="1.2" style="top:12%;left:8%;width:15%"><div class="wf-img" data-label="Pale photo"></div></div>
  <div data-fx-part="item" id="gone" data-reveal-from="right" data-opacity=".35" style="top:14%;left:80%;width:20%"><div class="wf-img" data-label="Deleting soon"></div></div>
  <div data-fx-part="content"><h2>Your title here</h2><p>Your two-line text here.</p></div>
</section>
<div class="gap">Body slot</div>
<section class="board" id="later"></section>
<div class="gap"></div>
<script>
  setTimeout(() => { const l = document.getElementById("later"); l.innerHTML = '<div data-fx-part="item" data-opacity="1" style="top:20%;left:30%;width:30%"><div class="wf-img" data-label="Panel after 1s"></div></div>'; l.dataset.fx = "scatter-bloom-collage"; }, 1000);
  setTimeout(() => { document.getElementById("board").dataset.fx = ""; document.getElementById("board").dataset.fx = "scatter-bloom-collage"; }, 1500);
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script>gsap.registerPlugin(ScrollTrigger);</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
