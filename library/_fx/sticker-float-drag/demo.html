<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sticker-float-drag — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-board { display: block; width: min(720px, 92vw); margin: 32px auto; overflow: visible; }
  .demo-row { display: flex; gap: 16px; justify-content: center; margin: 24px; }
  .demo-row [data-fx-part] { width: 64px; height: 64px; border-radius: 50%; background: var(--kf-accent); }
</style>
</head>
<body>
<p class="demo-hint"><b>sticker-float-drag</b> — Grab a sticker, drag it and let go. It pops out when opened and keeps floating slightly.</p>
<svg class="demo-board" viewBox="0 0 720 260" data-fx="sticker-float-drag">
  <g data-fx-part="sticker"><circle cx="90" cy="120" r="54" fill="var(--kf-accent)"/></g>
  <g data-fx-part="sticker"><rect x="200" y="70" width="110" height="110" rx="26" fill="var(--kf-ink)"/><circle cx="240" cy="120" r="7" fill="var(--kf-bg)"/><circle cx="272" cy="120" r="7" fill="var(--kf-bg)"/></g>
  <g data-fx-part="sticker"><path d="M420 90c18-30 70-20 60 22-6 28-60 58-60 58s-54-30-60-58c-10-42 42-52 60-22z" fill="var(--kf-accent-text)"/></g>
  <g data-fx-part="sticker"><path d="M590 60l14 30 33 4-24 23 6 33-29-16-29 16 6-33-24-23 33-4z" fill="var(--kf-dim)"/></g>
</svg>
<div class="demo-row" data-fx="sticker-float-drag" data-fx-sticker-float-drag="spring: 4,800,60; rot: 6; bob: 5,5; beat: 1; jitter: 2; order: forward">
  <span data-fx-part="sticker"></span><span data-fx-part="sticker"></span><span data-fx-part="sticker"></span>
</div>
<script>
// Late arrivals and removals — checks that fx-core attaches to an element added after 1s and detaches from an element removed after 2.5s
(() => {
  const src = document.querySelector(".demo-row");
  const html = src.outerHTML;
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => src.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s one more stripe comes in, and after 2.5s one leaves.");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
