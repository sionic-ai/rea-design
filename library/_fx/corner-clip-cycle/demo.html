<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>corner-clip-cycle — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { display: flex; flex-wrap: wrap; gap: 32px; padding: 48px 20px; }
  .stack { width: 320px; aspect-ratio: 1; }
  .stack [data-fx-part="img"] { height: 100%; border: 0; }
</style>
</head>
<body>
<p class="demo-hint"><b>corner-clip-cycle</b> — Photos cover the frame in turn from the bottom-left corner, repeating one at a time every 3 seconds.</p>
<main class="demo">
  <div class="stack" data-fx="corner-clip-cycle">
    <figure data-fx-part="item"><div class="wf-img" data-fx-part="img" data-label="Photo 1 · Bottom"></div></figure>
    <figure data-fx-part="item"><div class="wf-img" data-fx-part="img" data-label="Photo 2"></div></figure>
    <figure data-fx-part="item"><div class="wf-img" data-fx-part="img" data-label="Photo 3"></div></figure>
    <figure data-fx-part="item"><div class="wf-img" data-fx-part="img" data-label="Photo 4"></div></figure>
  </div>
  <div class="stack" data-fx="corner-clip-cycle" data-fx-corner-clip-cycle="hold: 1.2; dur: .5">
    <figure data-fx-part="item"><div class="wf-img" data-fx-part="img" data-label="Fast Repeat 1"></div></figure>
    <figure data-fx-part="item"><div class="wf-img" data-fx-part="img" data-label="Fast Repeat 2"></div></figure>
    <figure data-fx-part="item"><div class="wf-img" data-fx-part="img" data-label="Fast Repeat 3"></div></figure>
  </div>
  <div class="stack" data-fx="corner-clip-cycle"></div>
</main>
<script>
(() => {
  const src = document.querySelector(".stack");
  const gone = src.cloneNode(true);
  src.after(gone);
  setTimeout(() => src.after(src.cloneNode(true)), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · The empty panel at the very end stays quiet. After 1 second one more panel comes in, and after 2.5 seconds one drops out (release).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
