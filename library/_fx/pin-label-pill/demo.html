<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pin-label-pill — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { margin: 0; background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .map { position: relative; height: 60vh; margin: 20px; background: var(--kf-raised); }
  .map > * { position: absolute; }
  svg circle { fill: none; stroke: currentColor; }
  svg circle:first-child { fill: currentColor; stroke: none; }
</style>
</head>
<body>
<p class="demo-hint"><b>pin-label-pill</b> — Hover over a dot. The pill stretches to the width of its name.</p>
<div class="map">
  <button style="left: 20%; top: 30%" data-fx="pin-label-pill" data-demo-remove><span data-fx-part="body"><svg data-fx-part="dot" viewBox="0 0 36 36"><circle cx="18" cy="18" r="4"/><circle data-fx-part="ring" cx="18" cy="18" r="13"/></svg><span data-fx-part="label">Your name here</span></span></button>
  <button style="left: 55%; top: 60%; --fx-pill: var(--kf-ink)" data-fx="pin-label-pill"><span data-fx-part="body"><svg data-fx-part="dot" viewBox="0 0 36 36"><circle cx="18" cy="18" r="4"/><circle data-fx-part="ring" cx="18" cy="18" r="13"/></svg><span data-fx-part="label">A slightly longer single name</span></span></button>
</div>
<template data-demo-late><div class="map"><button style="left: 40%; top: 40%" data-fx="pin-label-pill"><span data-fx-part="body"><svg data-fx-part="dot" viewBox="0 0 36 36"><circle cx="18" cy="18" r="4"/></svg><span data-fx-part="label">Late-arriving pin</span></span></button></div></template>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
