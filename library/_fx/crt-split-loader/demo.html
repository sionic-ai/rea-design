<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>crt-split-loader — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: sticky; top: 0; z-index: 10; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  main { padding: 40px; font: 400 64px var(--kf-font-display); }
</style>
</head>
<body>
<p class="demo-hint"><b>crt-split-loader</b> — Refresh the page. After the logo fills up, the panel splits top and bottom and light spreads. <span style="color:var(--kf-dim)">(After 1s one more fast loader comes in, and after 2.5s one drops out)</span></p>
<main>Hero</main>
<div data-fx="crt-split-loader" aria-hidden="true">
  <div data-fx-part="top"></div><div data-fx-part="bottom"></div>
  <div data-fx-part="logo"><svg viewBox="0 0 400 92" fill="currentColor"><circle cx="46" cy="46" r="40" fill="none" stroke="currentColor" stroke-width="10"/><rect x="2" y="41" width="88" height="10" transform="rotate(-45 46 46)"/><rect x="110" y="20" width="280" height="14"/><rect x="110" y="58" width="200" height="14"/></svg></div>
  <div data-fx-part="flash"></div><div data-fx-part="static"></div>
</div>
<div data-fx="crt-split-loader" data-demo-remove style="opacity: 0"></div>
<template data-demo-late><div data-fx="crt-split-loader" style="opacity: .5; --fx-csl-k: .5"><div data-fx-part="top"></div><div data-fx-part="bottom"></div></div></template>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
