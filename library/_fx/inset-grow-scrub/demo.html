<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>inset-grow-scrub — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.6 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .stack { position: relative; }
  .stack__item { position: sticky; top: 0; height: 250vh; overflow: hidden; }
  .stack__item:nth-child(2) { height: 100vh; }
  .stack__item .wf-img { height: 100%; max-height: 100vh; border: 0; }
  .after { height: 60vh; display: grid; place-items: center; color: var(--kf-dim); }
</style>
</head>
<body>
<p class="demo-hint"><b>inset-grow-scrub</b> Scroll down. A small cropped window opens to fill the screen, then sinks while the next photo covers it. <span style="color:var(--kf-dim)">(After 1s one more panel comes in, and one leaves 2.5s later)</span></p>
<div class="stack">
  <div class="stack__item" data-fx="inset-grow-scrub"><div class="wf-img" data-fx-part="media" data-label="First photo · office · 16:9"></div></div>
  <div class="stack__item"><div class="wf-img" data-label="Second photo · On site · 16:9"></div></div>
</div>
<div class="after">Footer</div>
<div class="stack__item" data-fx="inset-grow-scrub" data-demo-remove style="height: 10vh"><div class="wf-img" data-fx-part="media" data-label="Dropped Panel"></div></div>
<div data-fx="inset-grow-scrub"></div>
<template data-demo-late><div class="stack__item" data-fx="inset-grow-scrub" data-fx-inset-grow-scrub="from: 20% 20% 20% 20%; zoom: .8; to: 1" style="height: 150vh"><div class="wf-img" data-fx-part="media" data-label="Late panel"></div></div></template>

<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
