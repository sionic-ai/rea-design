<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>wordmark-dock — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: relative; z-index: 3; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .hero { height: 100vh; background: var(--kf-surface); }
  .dock { position: absolute; z-index: 2; top: calc(100vh - 200px); left: 0; right: 0; width: 92vw; margin: 0 auto; pointer-events: none; }
  .dock h1 { font: 700 28px/1 var(--kf-font-display); }
  .dock p { padding-top: 16px; }
  .dock svg { display: block; width: 100%; height: auto; }
  .dock text { font: 800 150px var(--kf-font-display); fill: currentColor; }
  .body { height: 260vh; padding: 40vh 8vw; }
  .late { top: calc(100vh - 120px); width: 60vw; z-index: 1; }
</style>
</head>
<body>
<p class="demo-hint"><b>wordmark-dock</b> Scroll down. When the large text touches the top of the screen it shrinks to the header logo size and sticks, then grows again on scroll up. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<section class="hero"></section>
<hgroup class="dock" data-fx="wordmark-dock"><h1>Logo</h1><p data-fx-part="mark"><svg viewBox="0 0 1360 150"><text x="0" y="128" textLength="1360" lengthAdjust="spacingAndGlyphs">WORDMARK:</text></svg></p></hgroup>
<hgroup class="dock late" data-fx="wordmark-dock" style="--fx-scale: .4; --fx-y: 0px" data-demo-remove><p data-fx-part="mark"><svg viewBox="0 0 1360 150"><text x="0" y="128" textLength="1360" lengthAdjust="spacingAndGlyphs">REMOVED</text></svg></p></hgroup>
<div data-fx="wordmark-dock"></div>
<template data-demo-late><hgroup class="dock late" data-fx="wordmark-dock" style="--fx-dur: 1s; top: calc(100vh - 60px)"><p data-fx-part="mark"><svg viewBox="0 0 1360 150"><text x="0" y="128" textLength="1360" lengthAdjust="spacingAndGlyphs">LATE</text></svg></p></hgroup></template>
<section class="body"><p>Your body text continues here.</p></section>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
