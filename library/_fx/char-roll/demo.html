<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>char-roll — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { padding: 48px 20px; }
  .demo-spacer { height: 90vh; display: grid; place-items: center; color: var(--kf-dim); }

  .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 28px; }
  .b { display: inline-flex; align-items: center; gap: 8px; padding: 14px 16px; border-radius: var(--kf-radius-md); background: var(--kf-accent); color: var(--kf-on-accent); font: 600 12px/1 var(--kf-font-display); text-transform: uppercase; }
  .b.is-line { background: none; border: 1px solid currentColor; color: var(--kf-ink); }
  .b i { width: 7px; height: 9px; background: currentColor; }
  nav { display: flex; gap: 28px; font: 500 15px/1 var(--kf-font-sans); }
</style>
</head>
<body>
<p class="demo-hint"><b>char-roll</b> — Hover over a button, link or menu (keyboard focus works the same). The line below rolls word by word. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<section class="demo">
  <div class="row">
    <a class="b" data-fx="char-roll" data-demo-remove href="#">Being removed soon</a>
    <a class="b" data-fx="char-roll" href="#">Contact Us</a>
    <button class="b is-line" data-fx="char-roll" type="button"><span data-fx-part="text">View all</span><i></i></button>
    <a class="b" data-fx="char-roll" data-fx-char-roll="stagger: 0; mode: once; dur: 1; ease: 0.19,1,0.22,1; cut: .6" href="#">Roll once, then stop</a>
    <a class="b" data-fx="char-roll" data-fx-char-roll="drip: down" href="#">Drooping down</a>
    <a class="b" data-fx="char-roll" data-fx-char-roll="drip: up" href="#">Stretch and rise</a>
    <template data-demo-late><a class="b" data-fx="char-roll" data-fx-char-roll="stagger: .06" href="#">Late-arrived Button</a></template>
  </div>
  <nav><a data-fx="char-roll" data-fx-char-roll="stagger: 0; dur: .55; ease: 0.16,1,0.3,1; tone: dim" href="#">Function</a><a data-fx="char-roll" data-fx-char-roll="stagger: 0; dur: .55; ease: 0.16,1,0.3,1; tone: dim" href="#">Fee</a><a data-fx="char-roll" data-fx-char-roll="stagger: 0; dur: .55; ease: 0.16,1,0.3,1; tone: dim" aria-current="page" href="#">Current Page</a></nav>
</section>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); window.ScrollTrigger?.refresh(); }, 2500);
</script>
</body>
</html>
