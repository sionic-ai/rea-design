<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>noise-gradient-plane — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .band { position: relative; height: 56vh; margin: 20px; border-radius: var(--kf-radius-lg); overflow: hidden; }
  .band__bg { position: absolute; inset: 0; background: var(--kf-accent); }
  .band__in { position: relative; display: grid; place-items: center; height: 100%; gap: 12px; align-content: center; font: var(--kf-weight-display) 36px/1 var(--kf-font-display); color: var(--kf-on-accent); }
  .band__in div { display: flex; gap: 10px; }
  .band__in button { font: 600 14px/1 var(--kf-font-sans); padding: 10px 14px; border-radius: var(--kf-radius-pill); border: 1px solid var(--kf-on-accent); background: transparent; color: var(--kf-on-accent); cursor: pointer; }
</style>
</head>
<body>
<p class="demo-hint"><b>noise-gradient-plane</b> — The wave plane behind the strip turns on at 5s and ripples endlessly. Press the button to change the three colors — they blend in at .025 per frame.</p>
<section class="band">
  <div class="band__bg" data-fx="noise-gradient-plane"></div>
  <div class="band__in">Your title here<div><button type="button" data-set="">Three base colors</button><button type="button" data-set="c1: var(--kf-ink); c2: var(--kf-accent); c3: var(--kf-dim)">Three other colors</button></div></div>
</section>
<script>
(() => {
  document.addEventListener("click", (e) => {
    const b = e.target.closest("[data-set]");
    if (!b) return;
    b.closest(".band").querySelector('[data-fx~="noise-gradient-plane"]').setAttribute("data-fx-noise-gradient-plane", b.dataset.set);
  });
  const src = document.querySelector(".band");
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = src.outerHTML; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => src.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical strip comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="three-global.js"></script>
<script src="../../_vendor/three@0.184.0/build/three.cjs"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
