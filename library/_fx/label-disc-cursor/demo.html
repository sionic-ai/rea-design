<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>label-disc-cursor — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; padding: 40px 20px; }
  .card { aspect-ratio: 4 / 3; background: var(--kf-raised); display: grid; place-items: end start; padding: 12px; }
  .demo .fx-label-disc { --fx-disc: var(--kf-ink); --fx-on: var(--kf-bg); }
</style>
</head>
<body>
<p class="demo-hint"><b>label-disc-cursor</b> — Hover over the card. A circle follows late and raises a name tag. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<section class="demo" data-fx="label-disc-cursor" style="--fx-disc: var(--kf-ink); --fx-on: var(--kf-bg)">
  <div class="card" data-cursor="Browse">Card 1</div>
  <div class="card" data-cursor="Unfold">Card 2</div>
  <div class="card" data-cursor="Fullscreen"><button data-cursor-hide>Play button — circle off</button></div>
</section>
<section class="demo" data-fx="label-disc-cursor" data-demo-remove><div class="card" data-cursor="Being removed soon">Panel to be removed soon</div></section>
<template data-demo-late><section class="demo" data-fx="label-disc-cursor" data-fx-label-disc-cursor="size: 110; dur: .4"><div class="card" data-cursor="Late panel">110px · .4s</div></section></template>
<section class="demo" data-fx="label-disc-cursor"></section>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/CustomEase.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
