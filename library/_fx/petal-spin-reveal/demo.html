<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>petal-spin-reveal — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 1; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .gap { height: 90vh; }
  .row { display: flex; gap: 40px; justify-content: center; padding: 40px 0 30vh; }
  .petal { width: 320px; aspect-ratio: 640 / 664; position: relative; }
  .petal .wf-img { position: absolute; inset: 0; height: 100%; }
</style>
</head>
<body>
<p class="demo-hint"><b>petal-spin-reveal</b> — Scroll down. Petal-shaped photos spin and bloom. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s the first cell leaves)</span></p>
<div class="gap"></div>
<div class="row" id="row">
  <figure class="petal" data-fx="petal-spin-reveal" data-demo-remove><div class="wf-img" data-fx-part="media" data-label="Two people · In front of a flower bed · Portrait"></div></figure>
</div>
<template data-demo-late><figure class="petal" data-fx="petal-spin-reveal"><div class="wf-img" data-fx-part="media" data-label="Garden photo · daytime · vertical"></div></figure></template>
<figure data-fx="petal-spin-reveal"></figure>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => document.getElementById("row").append(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
