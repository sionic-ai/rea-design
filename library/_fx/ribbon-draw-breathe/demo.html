<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ribbon-draw-breathe — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .stage { position: relative; height: 70vh; margin: 40px 20px; overflow: hidden; border-radius: var(--kf-radius-md); background: var(--kf-surface); }
  .stage > div { position: absolute; inset: 0; }
</style>
</head>
<body>
<p class="demo-hint"><b>ribbon-draw-breathe</b> — A thick ribbon is drawn, then erased from the tail while its thickness breathes. It stops if you pause scrolling for 4s. <span style="color:var(--kf-dim)">(After 1s one more ribbon comes in, and after 2.5s one drops out)</span></p>
<div class="stage"><div data-fx="ribbon-draw-breathe"><svg viewBox="0 0 1200 600" preserveAspectRatio="none"><path stroke-width="60" d="M-40 420C200 120 520 60 760 160s300 300 120 380-420-60-300-260S1100 40 1260 120"/></svg></div></div>
<div class="stage" data-demo-remove><div data-fx="ribbon-draw-breathe" data-fx-ribbon-draw-breathe="dir: reverse; dur: 1.5"><svg viewBox="0 0 1200 600" preserveAspectRatio="none"><path stroke-width="40" d="M1240 80C900 200 700 520 420 480S60 200 -40 300"/></svg></div></div>
<div class="stage"><template data-demo-late><div data-fx="ribbon-draw-breathe" data-fx-ribbon-draw-breathe="dur: 1"><svg viewBox="0 0 1200 600" preserveAspectRatio="none"><path stroke-width="50" d="M-40 100C300 300 900 300 1240 500"/></svg></div></template></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../../../_shared/vendor/gsap/DrawSVGPlugin.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
