<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ribbon-spin-title — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { display: flex; flex-direction: column; align-items: center; gap: 60px; padding: 60px 20px; }
  .demo-gap { height: 90vh; }
  .badge { width: 70px; height: 84px; display: grid; place-items: center; }
  .badge i { width: 64px; height: 64px; border-radius: 22px; background: var(--kf-surface); border: 4px solid var(--kf-accent); }
  .chara { width: 120px; height: 120px; border-radius: 50%; background: var(--kf-line); }
</style>
</head>
<body>
<p class="demo-hint"><b>ribbon-spin-title</b> — The badge spins into place and the ribbon slides in. Scroll down. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<section class="demo">
  <h2 data-fx="ribbon-spin-title" data-fx-ribbon-spin-title="on: load"><span class="badge" data-fx-part="badge"><i data-fx-part="spin"></i></span><span data-fx-part="band"><span data-fx-part="band-inner">Your section title here</span></span></h2>
  <h2 data-demo-remove data-fx="ribbon-spin-title" data-fx-ribbon-spin-title="on: load; delay: .3"><span class="badge" data-fx-part="badge"><i data-fx-part="spin"></i></span><span data-fx-part="band"><span data-fx-part="band-inner">Title to Be Removed</span></span></h2>
  <template data-demo-late><h2 data-fx="ribbon-spin-title" data-fx-ribbon-spin-title="on: load"><span data-fx-part="band"><span data-fx-part="band-inner">Late-arriving heading (no badge)</span></span></h2></template>
</section>
<div class="demo-gap"></div>
<section class="demo">
  <h2 data-fx="ribbon-spin-title" data-fx-ribbon-spin-title="shift: 308"><span class="badge" data-fx-part="badge"><i data-fx-part="spin"></i></span><span data-fx-part="band"><span data-fx-part="band-inner">Your longer ribbon title here</span></span><span class="chara" data-fx-part="extra"></span></h2>
</section>
<div class="demo-gap"></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../../../_shared/vendor/gsap/CustomEase.min.js"></script>
<script>gsap.registerPlugin(ScrollTrigger, CustomEase);</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
