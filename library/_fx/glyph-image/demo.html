<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>glyph-image — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo-row { display: flex; flex-wrap: wrap; gap: 40px; justify-content: center; padding: 60px 20px; }
  .demo-row figure { width: min(320px, 80vw); aspect-ratio: 3 / 4; margin: 0; background: var(--kf-bg); }
  .demo-row figure.is-paper { background: var(--kf-contrast-bg); --fx-glyph-ink: var(--kf-contrast-ink); --kf-bg: var(--kf-contrast-bg); }
  .demo-pad { height: 120vh; }
</style>
</head>
<body>
<p class="demo-hint"><b>glyph-image</b> — The photo is printed in letters and lights up in random order. Scroll down and back up and it lights up again. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<div class="demo-row">
  <figure data-fx="glyph-image"><img data-fx-part="src" alt=""></figure>
  <figure class="is-paper" data-demo-remove data-fx="glyph-image" data-fx-glyph-image="look: dark; cell: 8"><img data-fx-part="src" alt=""></figure>
  <template data-demo-late><figure data-fx="glyph-image"><img data-fx-part="src" alt=""></figure></template>
  <figure data-fx="glyph-image"></figure>
</div>
<div class="demo-pad"></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Demo photo: draw one round face lit from the left and insert it as a data URL
const shade = (v) => `rgb(${v} ${v} ${v})`; // Not skin: brightness of the photo to be dotted
const photo = (() => {
  const c = document.createElement("canvas"), x = c.getContext("2d");
  c.width = 300; c.height = 400;
  x.fillStyle = shade(0); x.fillRect(0, 0, 300, 400);
  const g = x.createRadialGradient(110, 170, 10, 150, 200, 150);
  g.addColorStop(0, shade(230)); g.addColorStop(0.6, shade(120)); g.addColorStop(1, shade(20));
  x.fillStyle = g; x.beginPath(); x.ellipse(150, 190, 100, 130, 0, 0, Math.PI * 2); x.fill();
  x.fillStyle = shade(60); x.fillRect(40, 330, 220, 70);
  return c.toDataURL();
})();
const fill = (root) => root.querySelectorAll('[data-fx-part="src"]').forEach((img) => (img.src = photo));
fill(document);
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => { const n = t.content.cloneNode(true); fill(n); t.replaceWith(n); }), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
