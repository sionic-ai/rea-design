<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>path-flow-photos — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.6 var(--kf-font-sans); }
  .demo-hint { position: fixed; top: 0; left: 0; right: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .hero { height: 200vh; }
  .pin { position: relative; height: 100vh; display: grid; place-items: center; }
  .pin h1 { font: 400 11vw/0.9 var(--kf-font-display); text-transform: uppercase; text-align: center; }
  .chip { aspect-ratio: 4 / 3; background: var(--kf-raised); border: 1px solid var(--kf-line); mix-blend-mode: multiply; }
  .chip.dark { background: var(--kf-dim); }
  .demo-spacer { height: 90vh; display: grid; place-items: center; color: var(--kf-dim); }
</style>
</head>
<body>
<p class="demo-hint"><b>path-flow-photos</b> — Scrolling makes the photo piece slide along a hidden curve and shrink, then a small piece pops out from the back of the curve. <span style="color:var(--kf-dim)">(One more piece comes in after 1s, and one drops out after 2.5s)</span></p>
<section class="hero" data-fx="path-flow-photos" data-fx-path-flow-photos="pin: true">
  <div class="pin" data-fx-part="pin">
    <h1>Big headline<br><i>set in</i> caps</h1>
    <div class="chip" data-fx-part="item" style="left:37%;top:28%;width:28%"></div>
    <div class="chip dark" data-fx-part="item" style="left:12%;top:50%;width:13%"></div>
    <div class="chip" data-fx-part="item" style="left:24%;top:60%;width:18%" data-demo-remove></div>
    <div class="chip dark" data-fx-part="item" style="left:66%;top:55%;width:12%"></div>
    <div class="chip" data-fx-part="item" style="left:7%;top:78%;width:8%"></div>
    <div class="chip" data-fx-part="pop" style="width:4%"></div>
    <div class="chip dark" data-fx-part="pop" style="width:3%"></div>
    <div class="chip" data-fx-part="pop" style="width:5%"></div>
    <div class="chip dark" data-fx-part="pop" style="width:3.5%"></div>
    <svg data-fx-part="path" viewBox="0 0 1512 625" preserveAspectRatio="none"><path d="M-4 2C300 430 870 618 1530 620"/></svg>
  </div>
</section>
<div class="demo-spacer">Scroll all the way down</div>
<section style="height:120vh" data-demo-late-host></section>
<div data-fx="path-flow-photos"></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => { const h = document.querySelector("[data-demo-late-host]"); h.outerHTML = '<section style="height:200vh;position:relative" data-fx="path-flow-photos"><div style="position:relative;height:100vh"><p style="padding:40vh 0 0;text-align:center">Late-arriving section</p><div class="chip" data-fx-part="item" style="left:40%;top:40%;width:20%"></div><div class="chip" data-fx-part="pop" style="width:5%"></div><svg data-fx-part="path" viewBox="0 0 1512 625" preserveAspectRatio="none"><path d="M-4 2C300 430 870 618 1530 620"/></svg></div></section>'; }, 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
