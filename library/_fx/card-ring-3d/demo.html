<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>card-ring-3d — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .ring { height: 720px; background: var(--kf-accent-soft); }
  .card { display: block; padding: 0; border: 0; background: none; color: var(--kf-ink); font: inherit; font-size: calc(var(--fx-card-h, 500px) / 40); cursor: pointer; }
  .card__front { display: flex; flex-direction: column; padding: 1.2em; border: 2px solid var(--kf-line); border-radius: var(--kf-radius-md); background: var(--kf-surface); }
  .card__front .wf-img { flex: 1; }
  .card__front b { margin-top: 0.8em; font: var(--kf-weight-display) 2em/1.1 var(--kf-font-display); }
  .card__back { border: 1px solid var(--kf-line); border-radius: var(--kf-radius-md); background: linear-gradient(0deg, var(--kf-accent), var(--kf-accent-soft)); }
  .picked { padding: 12px 20px; font: 500 13px/1.4 var(--kf-font-mono); }
</style>
</head>
<body>
<p class="demo-hint"><b>card-ring-3d</b> — Drag cards sideways or turn them with the horizontal wheel. Hover and sparkles gather, press and the card comes to center, flips and grows.</p>
<section class="ring" data-fx="card-ring-3d">
  <button class="card" type="button" data-fx-part="card"><span class="card__front" data-fx-part="front"><span class="wf-img" data-label="Product photo 1"></span><b>One card</b></span><span class="card__back" data-fx-part="back"></span></button>
  <button class="card" type="button" data-fx-part="card"><span class="card__front" data-fx-part="front"><span class="wf-img" data-label="Product photo 2"></span><b>Card two</b></span><span class="card__back" data-fx-part="back"></span></button>
  <button class="card" type="button" data-fx-part="card"><span class="card__front" data-fx-part="front"><span class="wf-img" data-label="Product photo 3"></span><b>Card three</b></span><span class="card__back" data-fx-part="back"></span></button>
  <button class="card" type="button" data-fx-part="card"><span class="card__front" data-fx-part="front"><span class="wf-img" data-label="Product photo 4"></span><b>Card four</b></span><span class="card__back" data-fx-part="back"></span></button>
  <button class="card" type="button" data-fx-part="card"><span class="card__front" data-fx-part="front"><span class="wf-img" data-label="Product photo 5"></span><b>Card Five</b></span><span class="card__back" data-fx-part="back"></span></button>
</section>
<p class="picked">Pressed card: <output>None</output></p>
<script>
(() => {
  const src = document.querySelector('[data-fx~="card-ring-3d"]');
  if (!src) return;
  const out = document.querySelector(".picked output");
  addEventListener("click", (e) => { const c = e.target.closest?.('[data-fx-part="card"]'); if (c) out.textContent = c.textContent.trim(); });
  const html = src.outerHTML.replace(/\sid="[^"]*"/g, "");
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => src.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical one comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="three-global.js"></script>
<script src="../../_vendor/three@0.161.0/build/three.cjs"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
