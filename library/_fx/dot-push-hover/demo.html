<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dot-push-hover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { display: flex; justify-content: space-between; padding: 30vh 4vw; border-top: 1px solid var(--kf-line); margin-top: 20vh; font-size: 1.1rem; }
  .demo.is-big { font-size: 2rem; margin-top: 0; }
</style>
</head>
<body>
<p class="demo-hint"><b>dot-push-hover</b> — Hover over the menu. The leading dot grows and pushes the text to the right. Home is the current page, so it is always on. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<nav class="demo">
  <a href="#" data-fx="dot-push-hover" aria-current="page"><span data-fx-part="label">First</span></a>
  <a href="#" data-fx="dot-push-hover"><span data-fx-part="label">Menu 1</span></a>
  <a href="#" data-fx="dot-push-hover"><span data-fx-part="label">Menu 2</span></a>
  <a href="#" data-fx="dot-push-hover" data-fx-dot-push-hover="look: still"><span data-fx-part="label">Dot Only On</span></a>
  <a href="#" data-fx="dot-push-hover" data-demo-remove><span data-fx-part="label">Being removed soon</span></a>
  <template data-demo-late><a href="#" data-fx="dot-push-hover"><span data-fx-part="label">Late-arrived Menu</span></a></template>
</nav>
<nav class="demo is-big"><a href="#" data-fx="dot-push-hover" style="--fx-size: .4em; --fx-dur: .5s">Large text · dot .4em · .5s</a></nav>
<script src="../fx-core.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
