<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>play-chase-cursor — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { margin: 0; background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 2; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .video { position: relative; height: 70vh; margin: 40px 0; }
  .video .wf-img { position: absolute; inset: 0; height: 100%; }
  .log { padding: 0 20px; color: var(--kf-dim); }
</style>
</head>
<body>
<p class="demo-hint"><b>play-chase-cursor</b> — Move the mouse over the gray video area. The Play circle follows with a delay, and clicking logs fx:play below. <span style="color:var(--kf-dim)">(After 1s one more section comes in, and one leaves 2.5s later)</span></p>
<section class="video" data-fx="play-chase-cursor"><div class="wf-img" data-label="Full-bleed video slot · landscape 16:9"></div><div data-fx-part="disc"><span>Play</span></div></section>
<section class="video" data-fx="play-chase-cursor" data-fx-play-chase-cursor="lerp: .2; dx: 0; dy: 0" data-demo-remove><div class="wf-img" data-label="Dropped Section"></div><div data-fx-part="disc"><span>Omission</span></div></section>
<p class="log" id="log">Not pressed yet</p>
<div id="late"></div>
<template data-demo-late><section class="video" data-fx="play-chase-cursor" data-fx-play-chase-cursor="lerp: .04" style="--fx-size: 96px"><div class="wf-img" data-label="Late section · follows even later"></div><div data-fx-part="disc"><span>Play</span></div></section></template>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
document.addEventListener("fx:play", (e) => (document.getElementById("log").textContent = `fx:play — ${new Date().toLocaleTimeString()}`));
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => document.getElementById("late").append(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
