<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>corner-circle-reveal — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-spacer { height: 90vh; display: grid; place-items: center; color: var(--kf-dim); }
  .demo { display: grid; grid-template-columns: repeat(2, 1fr); gap: 24px; padding: 48px 20px; }
  .demo-card { aspect-ratio: 4 / 3; border-start-end-radius: var(--kf-radius-lg); }
  .demo-card > div { background: var(--kf-accent-soft); }
</style>
</head>
<body>
<p class="demo-hint"><b>corner-circle-reveal</b> — Scroll down and the photo cell opens as a circle from the top-right corner. The faster you scroll, the earlier and quicker it opens.</p>
<div class="demo-spacer">Scroll down ↓</div>
<section class="demo">
  <div class="demo-card" data-fx="corner-circle-reveal"><div class="wf-img" data-fx-part="img" data-label="Photo 1"></div></div>
  <div class="demo-card" data-fx="corner-circle-reveal" data-fx-corner-circle-reveal="at: 0% 100%; zoom: 1"><div class="wf-img" data-fx-part="img" data-label="From bottom left · photo as is"></div></div>
</section>
<div class="demo-spacer"></div>
<script>
(() => {
  const src = document.querySelector('[data-fx~="corner-circle-reveal"]');
  if (!src) return;
  const html = src.outerHTML;
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => src.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical one comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
