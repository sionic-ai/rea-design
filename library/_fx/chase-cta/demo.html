<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>chase-cta — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .player { height: 60vh; display: grid; place-items: center; background: var(--kf-contrast-bg); margin: 20px; border-radius: var(--kf-radius-md); }
  .player button { padding: 30px; border: 0; border-radius: 50%; background: var(--kf-accent); color: var(--kf-on-accent); font: 700 22px/1 var(--kf-font-display); }
</style>
</head>
<body>
<p class="demo-hint"><b>chase-cta</b> — Move the mouse over the black panel. The button follows late, and returns to the center when you leave the panel.</p>
<div class="player"><button data-fx="chase-cta" type="button">Play</button></div>
<div class="player" data-demo-remove><button data-fx="chase-cta" type="button">Erase</button></div>
<template data-demo-late><div class="player"><button data-fx="chase-cta" data-fx-chase-cta="dur: .4; ease: power3.out" type="button">Quickly</button></div></template>
<button data-fx="chase-cta" type="button" hidden></button>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
