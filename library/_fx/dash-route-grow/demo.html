<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dash-route-grow — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .gap { height: 60vh; display: grid; place-items: center; color: var(--kf-dim); }
  .route { position: relative; overflow: hidden; min-height: 260vh; }
  .route svg { position: absolute; left: -15%; top: 10vw; width: 130%; height: 240vh; color: var(--kf-ink); opacity: 0.2; }
  .route h2 { position: relative; padding: 30vh 20px; font: 700 40px/1.3 var(--kf-font-display); }
  .end { height: 40vh; background: var(--kf-surface); }
</style>
</head>
<body>
<p class="demo-hint"><b>dash-route-grow</b> — Scroll. The dotted line in the background is drawn downward as far as you scroll.</p>
<div class="gap">Downward</div>
<section class="route" data-fx="dash-route-grow" data-fx-dash-route-grow="end: .end">
  <div data-fx-part="clip"><svg viewBox="0 0 1000 2400" preserveAspectRatio="none" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 10"><path d="M620 0C640 260 900 300 860 560S300 760 240 1020 520 1360 700 1520 980 1900 620 2120 300 2300 360 2400"/></svg></div>
  <h2>Your section title here</h2><h2>Your next section title here</h2>
</section>
<div class="end"></div>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
