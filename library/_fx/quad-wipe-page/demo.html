<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>quad-wipe-page — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-row { display: flex; flex-wrap: wrap; gap: 16px; padding: 40px 20px; }
  .demo-row a, .demo-row button { padding: 10px 16px; border: 1px solid var(--kf-line); border-radius: var(--kf-radius-sm); background: var(--kf-surface); color: var(--kf-ink); font: inherit; cursor: pointer; text-decoration: none; }
</style>
</head>
<body>
<p class="demo-hint"><b>quad-wipe-page</b> On first open the curtain lifts up. Clicking a link makes the curtain rise diagonally to cover the page, then moves back to this page. The button only tries the left-right cover.</p>
<div class="demo-row" id="row">
  <a href="demo.html">Cover from below and move on</a>
  <a href="demo.html" data-wipe-dir="bottom">Cover from above, then move on</a>
  <button type="button" id="side">Left cover → Peel back</button>
</div>
<div id="wipe" data-fx="quad-wipe-page"></div>
<div data-fx="quad-wipe-page" data-fx-quad-wipe-page="start: off; links: off" data-demo-remove></div>
<template data-demo-late><div data-fx="quad-wipe-page" data-fx-quad-wipe-page="start: off; links: off; in: .4" style="--fx-wipe-bg: var(--kf-accent)"></div></template>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/CustomEase.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
document.getElementById("side").addEventListener("click", () => { const w = document.getElementById("wipe"); w.fxCover && w.fxCover("left", () => w.fxReveal("left")); });
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
