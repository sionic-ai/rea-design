<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>smoke-cycle-title — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { padding: 120px 20px; display: grid; gap: 80px; text-align: center; }
  h1, h2 { font: 400 clamp(40px, 7vw, 90px)/1 var(--kf-font-display); letter-spacing: -0.06em; }
</style>
</head>
<body>
<p class="demo-hint"><b>smoke-cycle-title</b> — Watch the heading form, then after 2.5s disperse in a puff of smoke as the next line forms. <span style="color:var(--kf-dim)">(After 1s one more comes in, and one drops out after 6s)</span></p>
<section class="demo">
  <h1 data-fx="smoke-cycle-title"><span data-fx-part="line">Your one title here</span><span data-fx-part="line">Your second title here</span><span data-fx-part="line">Made for next.</span></h1>
  <h2 data-fx="smoke-cycle-title" data-fx-smoke-cycle-title="hold: 1.5; gap: 0.6" data-demo-remove><span data-fx-part="line">Line to be removed soon</span><span data-fx-part="line">Another line</span></h2>
  <template data-demo-late><h2 data-fx="smoke-cycle-title"><span data-fx-part="line">Late-arriving line</span><span data-fx-part="line">Next line</span></h2></template>
  <h2 data-fx="smoke-cycle-title"></h2>
</section>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); }, 6000);
</script>
</body>
</html>
