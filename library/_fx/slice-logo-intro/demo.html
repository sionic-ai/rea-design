<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>slice-logo-intro — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 10001; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { padding: 80px 20px; min-height: 120vh; }
  .demo-intro [data-fx-part="message"] { font: 500 18px/1.4 var(--kf-font-sans); text-transform: uppercase; }
  .demo-late { position: fixed; inset: auto 0 0 0; height: 30vh; z-index: 9999; }
</style>
</head>
<body>
<p class="demo-hint"><b>slice-logo-intro</b> — On open, after 1s four logo pieces enter and leave in turn, then the curtain sweeps off to the right (refresh to replay). <span style="color:var(--kf-dim)">(After 1s one more layer comes in, and one leaves 2.5s later)</span></p>
<div class="demo-intro" data-fx="slice-logo-intro">
  <span data-fx-part="slice"><svg viewBox="0 0 50 100"><path d="M50 8a42 42 0 0 0 0 84v-20a22 22 0 0 1 0-44z" fill="currentColor"/></svg></span>
  <span data-fx-part="slice"><svg viewBox="0 0 50 100"><rect x="14" y="8" width="22" height="84" rx="11" fill="currentColor"/></svg></span>
  <span data-fx-part="slice"><svg viewBox="0 0 50 100"><path d="M50 8a42 42 0 0 0 0 84z" fill="currentColor"/></svg></span>
  <span data-fx-part="slice"><svg viewBox="0 0 50 100"><path d="M0 8a42 42 0 0 1 0 84z" fill="currentColor"/></svg></span>
  <p data-fx-part="message">Your one-line Brand phrase here</p>
</div>
<div class="demo-intro demo-late" data-fx="slice-logo-intro" data-fx-slice-logo-intro="delay: 0; dur: .5; hold: .2; wipe: .8" data-demo-remove><span data-fx-part="slice"><svg viewBox="0 0 50 100"><rect x="14" y="8" width="22" height="84" rx="11" fill="currentColor"/></svg></span></div>
<div class="demo-intro demo-late" data-fx="slice-logo-intro" data-fx-slice-logo-intro="delay: 3; wipe: .6"></div>
<main class="demo"><div class="wf-img" style="aspect-ratio:16/9" data-label="First screen behind the curtain"></div></main>
<template data-demo-late><div class="demo-intro demo-late" data-fx="slice-logo-intro" data-fx-slice-logo-intro="delay: 0; dur: .4; hold: 0; wipe: .5"><span data-fx-part="slice"><svg viewBox="0 0 50 100"><path d="M50 8a42 42 0 0 0 0 84z" fill="currentColor"/></svg></span><p data-fx-part="message">Late-arriving curtain</p></div></template>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/SplitText.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
