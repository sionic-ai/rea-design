<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fling-drop-trail — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { margin: 0; background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .foot { margin-top: 20vh; background: var(--kf-contrast-bg); color: var(--kf-contrast-ink); }
  .pad { padding-top: 120px; font: 800 26vw/0.8 var(--kf-font-sans); letter-spacing: -0.05em; }
  .st svg { width: 100%; height: 100%; }
  .st circle { fill: var(--kf-accent); }
  .st rect { fill: var(--kf-accent-soft); }
  .st text { fill: var(--kf-on-accent); font: 700 28px var(--kf-font-sans); }
</style>
</head>
<body>
<p class="demo-hint"><b>fling-drop-trail</b> — Swish the mouse quickly over the large text below. Stickers are thrown, then fall.</p>
<footer class="foot" data-fx="fling-drop-trail">
  <div class="pad" data-fx-part="pad">Studio</div>
  <span class="st" data-fx-part="sticker"><svg viewBox="0 0 200 150"><circle cx="100" cy="75" r="70"/><text x="100" y="85" text-anchor="middle">One</text></svg></span>
  <span class="st" data-fx-part="sticker"><svg viewBox="0 0 200 150"><rect x="10" y="20" width="180" height="110" rx="16"/><text x="100" y="85" text-anchor="middle">Both</text></svg></span>
  <span class="st" data-fx-part="sticker"><svg viewBox="0 0 200 150"><circle cx="100" cy="75" r="60"/><text x="100" y="85" text-anchor="middle">Three (native Korean)</text></svg></span>
</footer>
<div class="foot" data-demo-remove data-fx="fling-drop-trail"><div class="pad" data-fx-part="pad">Erase</div><span class="st" data-fx-part="sticker"><svg viewBox="0 0 200 150"><circle cx="100" cy="75" r="60"/></svg></span></div>
<template data-demo-late><div class="foot" data-fx="fling-drop-trail" data-fx-fling-drop-trail="step: 80; throw: 200"><div class="pad" data-fx-part="pad">Late</div><span class="st" data-fx-part="sticker"><svg viewBox="0 0 200 150"><circle cx="100" cy="75" r="60"/></svg></span></div></template>
<div class="foot" data-fx="fling-drop-trail"></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/CustomEase.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
