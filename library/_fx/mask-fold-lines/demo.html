<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mask-fold-lines — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .gap { height: 60vh; }
  .sec { min-height: 120vh; padding: 40px; border-top: 1px solid var(--kf-line); }
  .lines { display: flex; flex-direction: row-reverse; gap: 16px; width: max-content; margin-left: auto; }
  .lines span[data-fx-part="line"] { writing-mode: vertical-rl; font-size: 40px; letter-spacing: -0.1em; }
</style>
</head>
<body>
<p class="demo-hint"><b>mask-fold-lines</b> — Scroll down. When the section heading reaches 20% from the top of the screen, two vertical lines are revealed in turn from the top.</p>
<div class="gap"></div>
<section class="sec" data-fx="mask-fold-lines">
  <h2 class="lines"><span data-fx-part="line">Your title here</span><span data-fx-part="line">Insert in two vertical lines</span></h2>
</section>
<script>
(() => {
  const src = document.querySelector('[data-fx~="mask-fold-lines"]');
  if (!src) return;
  const html = src.outerHTML;
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => src.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical one comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
