<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>scatter-pop-pieces — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 500 15px/1.6 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 10; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .stage { position: relative; height: 360px; max-width: 900px; margin: 48px auto; border-bottom: 2px solid var(--kf-line); }
  .stage > i { position: absolute; bottom: 0; display: block; border-radius: var(--kf-radius-sm); background: var(--kf-raised); border: 1px solid var(--kf-line); }
  .stage > i.is-accent { background: var(--kf-accent-soft); }
  .gap { height: 70vh; display: grid; place-items: center; color: var(--kf-dim); }
</style>
</head>
<body>
<p class="demo-hint"><b>scatter-pop-pieces</b> — On open, the upper group pops out right away, and scrolling down pops out the second group. <span style="color:var(--kf-dim)">(One more group comes in after 1s, and one drops out after 2.5s)</span></p>
<div class="stage" data-fx="scatter-pop-pieces" data-fx-scatter-pop-pieces="on: load; delay: .1">
  <i data-fx-part="piece" style="left:8%;width:120px;height:220px"></i>
  <i data-fx-part="piece" class="is-accent" style="left:26%;width:60px;height:120px"></i>
  <i data-fx-part="piece" style="left:40%;width:180px;height:300px"></i>
  <i data-fx-part="piece" class="is-accent" style="left:66%;width:40px;height:80px"></i>
  <i data-fx-part="piece" style="left:76%;width:140px;height:180px"></i>
</div>
<div class="gap">↓ Scroll</div>
<div class="stage" data-fx="scatter-pop-pieces">
  <i style="left:12%;width:90px;height:160px"></i>
  <i class="is-accent" style="left:34%;width:70px;height:240px"></i>
  <i style="left:58%;width:160px;height:120px"></i>
</div>
<div class="stage" data-fx="scatter-pop-pieces" data-demo-remove><i style="left:40%;width:40px;height:40px"></i></div>
<template data-demo-late><div class="stage" data-fx="scatter-pop-pieces" data-fx-scatter-pop-pieces="dur: 1.2; stagger: .08"><i style="left:20%;width:80px;height:140px"></i><i class="is-accent" style="left:50%;width:80px;height:200px"></i></div></template>
<div class="gap">Footer</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
