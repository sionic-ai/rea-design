<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>drop-fade-modal — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  main { max-width: 800px; margin: 0 auto; padding: 40px 20px; display: grid; gap: 40px; }
  .demo-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; }
  .demo-pair figure { margin: 0; }
  .demo-spacer { height: 80vh; display: grid; place-items: center; color: var(--kf-dim); }
</style>
</head>
<body>
<p class="demo-hint"><b>drop-fade-modal</b> — Click the photo. The cover rises first, then the window drops in 50px from the top (closes with ×·outside click·Esc). <span style="color:var(--kf-dim)">(After 1s one more photo pair comes in, and after 2.5s the first pair drops out)</span></p>
<main>
  <div class="demo-pair" data-fx="drop-fade-modal" data-demo-remove>
    <figure data-fx-part="item" data-caption="First Photo of Outgoing Pair"><div class="wf-img wf-r-3x2" data-label="Outgoing Pair · 3:2"></div></figure>
    <figure data-fx-part="item"><div class="wf-img wf-r-3x2" data-label="Outgoing Pair · 3:2"></div></figure>
  </div>
  <div class="demo-pair" data-fx="drop-fade-modal">
    <figure data-fx-part="item" data-caption="One-line photo caption here"><div class="wf-img wf-r-3x2" data-label="Site photo · Overcast day · 3:2"></div></figure>
    <figure data-fx-part="item"><div class="wf-img wf-r-3x2" data-label="Seating area photo · indoors · 3:2"></div></figure>
  </div>
  <template data-demo-late><div class="demo-pair" data-fx="drop-fade-modal" data-fx-drop-fade-modal="drop: 80; dur: .5"><figure data-fx-part="item" data-caption="Late-arriving pair (80px · .5s)"><div class="wf-img wf-r-16x9" data-label="Late-arriving photo · 16:9"></div></figure><figure data-fx-part="item"><div class="wf-img wf-r-16x9" data-label="Late-arriving photo · 16:9"></div></figure></div></template>
</main>
<div class="demo-spacer">Page does not scroll while open</div>

<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
