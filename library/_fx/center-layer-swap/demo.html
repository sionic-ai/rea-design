<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>center-layer-swap — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: transparent; color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { color: var(--kf-accent); }
  .zone { min-height: 110vh; padding: 80px 24px; font: 700 40px/1.2 var(--kf-font-display); }
  .glow { background: radial-gradient(40vw 30vw at 30% 40%, var(--kf-surface), transparent), var(--kf-accent-soft); }
  .plain { background: var(--kf-bg); }
  .dark { background: var(--kf-contrast-bg); }
  [data-tone="dark"] .demo-hint { background: var(--kf-contrast-bg); color: var(--kf-contrast-ink); }
</style>
</head>
<body>
<div id="page" data-fx="center-layer-swap">
  <p class="demo-hint"><b>center-layer-swap</b> Scroll down. The backdrop changes in .4s to the name of the section crossing the screen center, and when the section at the very top is dark, this strip turns dark too.</p>
  <div data-fx-part="stage">
    <div class="glow" data-fx-part="layer" data-key="glow" style="position:absolute;inset:0"></div>
    <div class="plain" data-fx-part="layer" data-key="plain end" style="position:absolute;inset:0"></div>
    <div class="dark" data-fx-part="layer" data-key="dark" style="position:absolute;inset:0"></div>
  </div>
  <section class="zone" data-fx-part="zone" data-key="glow" data-tone="light">Light Section</section>
  <section class="zone" data-fx-part="zone" data-key="plain" data-tone="light">Plain Section</section>
  <section class="zone" data-fx-part="zone" data-key="dark" data-tone="dark" style="color: var(--kf-contrast-ink)">Dark Section</section>
  <section class="zone" data-fx-part="zone" data-key="end" data-tone="light">Final section (shares the plain background)</section>
</div>
<div id="late"></div>
<script>
  setTimeout(() => {
    const w = document.getElementById("late");
    w.innerHTML = '<div data-fx-part="stage"><div class="dark" data-fx-part="layer" data-key="x" style="position:absolute;inset:0"></div></div><section class="zone" data-fx-part="zone" data-key="x">Late-attached Board</section>';
    w.dataset.fx = "center-layer-swap";
  }, 1000);
  setTimeout(() => { const g = document.createElement("div"); g.dataset.fx = "center-layer-swap"; g.innerHTML = '<section data-fx-part="zone" data-key="g"></section>'; document.body.append(g); setTimeout(() => g.remove(), 1500); }, 1000);
</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
