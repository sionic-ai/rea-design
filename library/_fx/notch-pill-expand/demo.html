<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>notch-pill-expand — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-screen { position: relative; height: 240px; max-width: 720px; margin: 40px auto; border-radius: 24px 24px 0 0; background: color-mix(in oklab, var(--kf-accent) 25%, var(--kf-bg)); display: flex; justify-content: center; }
  .demo-row { padding: 0 10px; height: 40px; }
  .demo-dot { width: 18px; height: 18px; border-radius: 50%; background: var(--kf-danger, var(--kf-accent)); }
  .demo-wide { height: 56px; padding: 0 14px; }
</style>
</head>
<body>
<p class="demo-hint"><b>notch-pill-expand</b> — Press the black notch at the top of the screen. It cycles recording fold → unfold → rest.</p>
<div class="demo-screen" data-fx="notch-pill-expand">
  <button type="button" data-fx-part="pill" aria-label="Recording">
    <span data-fx-part="state" data-state="none"></span>
    <span data-fx-part="state" class="demo-row"><i class="demo-dot"></i><span style="width:120px"></span><b data-fx-part="timer">0:00</b><span data-fx-part="wave"><i></i><i></i><i></i><i></i></span></span>
    <span data-fx-part="state" class="demo-row demo-wide"><i class="demo-dot"></i><b data-fx-part="timer">0:00</b><span data-fx-part="wave"><i></i><i></i><i></i><i></i></span><span>Pause · Note</span></span>
  </button>
</div>
<div class="demo-small demo-screen" data-fx="notch-pill-expand" data-fx-notch-pill-expand="dur: .2; size: .3" style="--fx-w: 90px">
  <button type="button" data-fx-part="pill"><span data-fx-part="state" data-state="none"></span><span data-fx-part="state" class="demo-row">On</span></button>
</div>
<script>
// Late arrivals and removals — checks that fx-core attaches to an element added after 1s and detaches from an element removed after 2.5s
(() => {
  const src = document.querySelector(".demo-small");
  if (!src) return;
  const html = src.outerHTML;
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => gone.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another small notch comes in (a late arrival), and after 2.5s one is removed (detach).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/CustomEase.min.js"></script>
<script>gsap.registerPlugin(CustomEase);</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
