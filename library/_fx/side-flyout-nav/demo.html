<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>side-flyout-nav — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .side { position: fixed; top: 0; left: 0; width: 230px; height: 100%; border-right: 1px solid var(--kf-line); padding-top: 60px; text-align: center; }
  .side li { line-height: 2.3; }
  .side a { font-size: 13px; font-weight: 700; }
  .demo-hint { margin-left: 250px; padding: 12px 20px; font: 500 13px/1.4 var(--kf-font-mono); }
</style>
</head>
<body>
<nav class="side"><ul data-fx="side-flyout-nav">
  <li><a href="#">Menu 1</a><div data-fx-part="panel" data-top="60"><span><a href="#">Sub 1</a></span><span><a href="#">Sub 2</a></span><span><a href="#">Sub 3</a></span></div></li>
  <li><a href="#">Menu 2</a></li>
  <li><a href="#">Menu 3</a><div data-fx-part="panel"><span><a href="#">Sub A</a></span><span><a href="#">Sub B</a></span></div></li>
  <li data-demo-remove><a href="#">Line that drops out after 2.5s</a></li>
</ul></nav>
<p class="demo-hint"><b>side-flyout-nav</b> — Hover a row in the left menu. The bar on the right lights up, and if there is a submenu, the side panel opens.</p>
<template data-demo-late><nav class="side" style="left: auto; right: 0"><ul data-fx="side-flyout-nav"><li><a href="#">Late-attached menu</a><div data-fx-part="panel" style="--fx-left: auto"><span><a href="#">Lower tier</a></span></div></li></ul></nav></template>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
