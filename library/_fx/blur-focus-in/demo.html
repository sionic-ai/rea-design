<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>blur-focus-in — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.6 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .col { width: min(560px, 90vw); margin: 0 auto; padding: 40px 0 60vh; }
  .col h1 { font-size: 40px; margin: 40px 0; }
  .col .wf-img { aspect-ratio: 4 / 3; margin: 60vh 0 24px; }
</style>
</head>
<body>
<p class="demo-hint"><b>blur-focus-in</b> — The heading sharpens over 2s right on open, and the photos and text below sharpen as they enter the screen. <span style="color:var(--kf-dim)">(After 1s one more text comes in, and one leaves 2.5s later)</span></p>
<div class="col">
  <h1 data-fx="blur-focus-in" data-fx-blur-focus-in="on: load; dur: 2; delay: .4">Your big title here</h1>
  <p data-fx="blur-focus-in" data-demo-remove>Dropping text</p>
  <div class="wf-img" data-fx="blur-focus-in" data-label="Photo slot"></div>
  <p data-fx="blur-focus-in">Your two lines of body text go here. At 85% of the screen, blur turns crisp.</p>
  <div data-late-slot></div>
</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script>gsap.registerPlugin(ScrollTrigger);</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelector("[data-late-slot]").outerHTML = '<p data-fx="blur-focus-in" data-fx-blur-focus-in="blur: 20">Late text · blur 20px</p>', 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
