<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>spell-rise-heading — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 300; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { padding: 48px 20px; }
  .demo-spacer { height: 90vh; display: grid; place-items: center; color: var(--kf-dim); }
  .h { text-align: center; padding: 40px 0; }
  .t { font: 400 120px/1 var(--kf-font-display); letter-spacing: -.03em; }
  .bar { display: block; width: 100px; height: 2px; margin: 24px auto 0; background: var(--kf-ink); }
  .s { margin-top: 20px; font-size: 24px; font-weight: 700; }
  .d { margin-top: 12px; color: var(--kf-dim); }
</style>
</head>
<body>
<p class="demo-hint"><b>spell-rise-heading</b> — Scroll down — the big title letters rise one by one, overshoot slightly and settle, then the underline, subtitle and description float in.</p>
<section class="demo">
  <div class="h" data-fx="spell-rise-heading" data-fx-spell-rise-heading="on: load"><p class="t" data-fx-part="title">Opening</p><span class="bar" data-fx-part="bar"></span><h2 class="s" data-fx-part="sub">Your subtitle here</h2></div>
  <div class="demo-spacer">↓</div>
  <div class="h" data-fx="spell-rise-heading" id="gone"><p class="t" data-fx-part="title">Partners</p><span class="bar" data-fx-part="bar"></span><h2 class="s" data-fx-part="sub">Your subtitle here</h2><p class="d" data-fx-part="desc">Your one-line description goes here.</p></div>
  <div class="demo-spacer" id="late">↓</div>
</section>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../../../_shared/vendor/gsap/CustomEase.min.js"></script>
<script>gsap.registerPlugin(ScrollTrigger, CustomEase);</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
  setTimeout(() => { const d = document.createElement("div"); d.className = "h"; d.dataset.fx = "spell-rise-heading"; d.innerHTML = '<p class="t" data-fx-part="title">Late One</p><h2 class="s" data-fx-part="sub">Late-arrived title</h2>'; document.getElementById("late").before(d); }, 1000);
  setTimeout(() => document.getElementById("gone").remove(), 1500);
</script>
</body>
</html>
