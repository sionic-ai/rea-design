<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>window-dive — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: fixed; left: 0; right: 0; bottom: 0; z-index: 100; margin: 0; padding: 10px 20px; background: var(--kf-surface); border-top: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .stage { height: 100vh; }
  .stage > * { position: absolute; inset: 0; }
  .stage [data-fx-part="sky"] { display: flex; justify-content: center; align-items: flex-end; }
  .stage [data-fx-part="frame"] { background: linear-gradient(var(--kf-accent-soft), var(--kf-surface)); background-size: 100% 300%; }
  .stage [data-fx-part="video"] { background: var(--kf-accent); }
  .stage [data-fx-part="video"] > div { position: absolute; inset: 0; background: linear-gradient(160deg, var(--kf-accent), var(--kf-accent-text)); }
  .stage [data-fx-part="scene"] svg { width: 100%; height: 100%; }
  .stage .hole { fill: var(--kf-raised); }
  .stage .lid { fill: var(--kf-accent); }
  .stage [data-fx-part="title"] { display: grid; place-content: center; padding-top: 30vh; font: 700 64px/1 var(--kf-font-display); color: var(--kf-accent-text); text-align: center; }
  .stage .next { display: grid; align-content: center; padding: 0 10vw; color: var(--kf-on-accent); }
  .stage .next h2 { overflow: hidden; font-size: 40px; }
  .after { height: 120vh; padding: 40px; }
</style>
</head>
<body>
<section class="stage" data-fx="window-dive" data-fx-window-dive="scale: 5.2; origin: 50% 32%">
  <div data-fx-part="video"><div></div></div>
  <div data-fx-part="sky"><div data-fx-part="frame"></div></div>
  <div data-fx-part="scene">
    <svg viewBox="0 0 1440 900" preserveAspectRatio="xMidYMin slice"><path class="hole" fill-rule="evenodd" d="M0 0h1440v900H0z M520 200h400a24 24 0 0 1 24 24v200H496V224a24 24 0 0 1 24-24z"/><path class="lid" fill-rule="evenodd" d="M480 186h480a36 36 0 0 1 36 36v222H444V222a36 36 0 0 1 36-36z M520 200h400a24 24 0 0 1 24 24v200H496V224a24 24 0 0 1 24-24z"/><rect class="lid" x="440" y="444" width="560" height="150" rx="16"/></svg>
  </div>
  <div data-fx-part="title">Step into the window</div>
  <div class="next"><h2><span data-fx-part="head">Next title appears</span></h2><p data-fx-part="next">Your two body lines here.</p></div>
</section>
<div class="after">Scroll the wheel once at the top to enter, scroll down and then back to the top to rewind.</div>
<p class="demo-hint"><b>window-dive</b> — At the top, roll the mouse wheel once (swipe on a phone). The image grows into a window and the video panel fills up.</p>
<script>
// Late arrivals and removals — add one more small panel after 1s and remove it after 2.5s to check attaching and detaching
(() => {
  const src = document.querySelector('[data-fx~="window-dive"]');
  const make = () => { const el = src.cloneNode(true); el.classList.remove("is-in"); el.style.height = "40vh"; return el; };
  const late = make(), gone = make();
  document.querySelector(".after").append(gone);
  setTimeout(() => document.querySelector(".after").append(late), 1000);
  setTimeout(() => gone.remove(), 2500);
})();
</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
