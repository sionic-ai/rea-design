<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ridge-layers — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.6 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-spacer { height: 70vh; display: grid; place-items: center; color: var(--kf-dim); }
  .band { height: 260px; margin: 0 0 40px; }
</style>
</head>
<body>
<p class="demo-hint"><b>ridge-layers</b> — Scroll down. The mountain ridge layers shift at different speeds. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<div class="demo-spacer">Downward</div>
<div class="band" data-fx="ridge-layers"></div>
<div class="band" data-fx="ridge-layers" data-fx-ridge-layers="seed: 17; layers: 3; speeds: .04,.08,.12" data-demo-remove></div>
<template data-demo-late><div class="band" data-fx="ridge-layers" data-fx-ridge-layers="seed: 31; layers: 2"></div></template>
<div class="band" data-fx="ridge-layers" data-fx-ridge-layers="seed: 43; layers: 5; rough: .7" style="--fx-ridge-ink: var(--kf-ink)"></div>
<div class="demo-spacer">Footer</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script>gsap.registerPlugin(ScrollTrigger);</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
