<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>veil-erase-cursor — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { margin: 0; background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { height: 70vh; margin: 20px; border-radius: var(--kf-radius-md); }
  .demo-media { position: absolute; inset: 0; z-index: 1; background: repeating-linear-gradient(45deg, var(--kf-accent) 0 40px, var(--kf-ink) 40px 80px); }
  .demo h2 { position: absolute; left: 32px; bottom: 32px; z-index: 3; margin: 0; font: 400 48px/1.1 var(--kf-font-display); }
</style>
</head>
<body>
<p class="demo-hint"><b>veil-erase-cursor</b> — Move the mouse over the panel. The veil is punched through like smoke and refills. Left alone, it sweeps once by itself every 10s.</p>
<section class="demo" data-fx="veil-erase-cursor">
  <div class="demo-media" aria-hidden="true"></div>
  <h2>Your title here</h2>
</section>
<script>
(() => {
  const src = document.querySelector('[data-fx~="veil-erase-cursor"]');
  if (!src) return;
  const html = src.outerHTML;
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => src.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical panel comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
