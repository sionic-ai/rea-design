<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tick-hand-logo — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .row { display: flex; gap: 40px; align-items: center; padding: 40px; }
  .mark { width: 200px; height: 200px; }
  .chip { display: inline-flex; align-items: center; gap: 10px; padding: 8px 14px; background: var(--kf-accent); border-radius: 6px; font-weight: 700; }
  .chip svg { width: 22px; height: 22px; }
  .chip [data-fx-part="disc"] { fill: var(--kf-surface); }
</style>
</head>
<body>
<p class="demo-hint"><b>tick-hand-logo</b> — Just watch. The needle ticks one notch every .75s, and the circle color changes every full turn (9s). <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<div class="row">
  <svg class="mark" data-fx="tick-hand-logo" viewBox="0 0 100 100" aria-hidden="true"><circle data-fx-part="disc" cx="50" cy="50" r="40"/><rect data-fx-part="hand" x="45" y="2" width="10" height="36" rx="3"/></svg>
  <svg class="mark" data-fx="tick-hand-logo" data-fx-tick-hand-logo="every: 300; step: 45" viewBox="0 0 100 100" aria-hidden="true" data-demo-remove><circle data-fx-part="disc" cx="50" cy="50" r="40"/><rect data-fx-part="hand" x="45" y="2" width="10" height="36" rx="3"/></svg>
  <span class="chip"><svg data-fx="tick-hand-logo" data-fx-tick-hand-logo="colors: var(--kf-surface)" viewBox="0 0 100 100" aria-hidden="true"><circle data-fx-part="disc" cx="50" cy="50" r="42"/><rect data-fx-part="hand" x="43" y="6" width="14" height="40" rx="4"/></svg>QUIZ</span>
  <template data-demo-late><svg class="mark" data-fx="tick-hand-logo" data-fx-tick-hand-logo="start: 90" viewBox="0 0 100 100" aria-hidden="true"><circle data-fx-part="disc" cx="50" cy="50" r="40"/><rect data-fx-part="hand" x="45" y="2" width="10" height="36" rx="3"/></svg></template>
  <svg class="mark" data-fx="tick-hand-logo" viewBox="0 0 100 100" aria-hidden="true"></svg>
</div>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
