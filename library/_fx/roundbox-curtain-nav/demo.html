<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>roundbox-curtain-nav — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-page { min-height: 70vh; display: grid; place-content: center; gap: 16px; text-align: center; }
  .demo-page a { color: var(--kf-ink); font-size: 28px; border-bottom: 2px solid currentColor; text-decoration: none; justify-self: center; }
</style>
</head>
<body>
<p class="demo-hint"><b>roundbox-curtain-nav</b> — On first open a round hole opens. Click a link below and a color curtain closes, then this page reopens in the same color.</p>
<main class="demo-page" data-fx="roundbox-curtain-nav" data-fx-roundbox-curtain-nav="colors: --kf-accent,--kf-accent-soft,--kf-ink">
  <a href="demo.html?again=1">Reopen this page</a>
  <a href="#here">Hash links with no overlay</a>
</main>
<script>
(() => {
  const src = document.querySelector('[data-fx~="roundbox-curtain-nav"]');
  if (!src) return;
  const make = (tag) => { const d = document.createElement("div"); d.dataset.fx = "roundbox-curtain-nav"; d.dataset.fxRoundboxCurtainNav = "open: 0"; d.dataset.demo = tag; return d; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => src.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1 second one more panel with the curtain already open comes in (the late arrival), and after 2.5 seconds one drops out (release).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
