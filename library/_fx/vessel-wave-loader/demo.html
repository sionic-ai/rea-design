<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>vessel-wave-loader — loader that fills up a vessel</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { margin: 0; min-height: 100vh; background: var(--kf-surface); color: var(--kf-ink); font-family: var(--kf-font-sans); }
  .page { padding: 24px; }
  .loader svg { width: 42px; height: 83px; overflow: visible; }
  .loader .outline { fill: none; stroke: currentColor; }
  .loader p { margin: 0; }
  .gate h2 { margin: 0 0 10px; font-weight: 400; font-size: 32px; letter-spacing: -0.02em; }
  .gate button { margin-top: 16px; width: 240px; height: 40px; border: 0; border-radius: 999px; background: var(--kf-surface); color: var(--kf-ink); font: inherit; cursor: pointer; }
</style>
</head>
<body>
<p class="page">This text shows once the loader lifts. When the wave in the glass fills to 10%, a confirmation gate appears — press ”Yes”.</p>
<div class="loader" data-fx="vessel-wave-loader" style="--fx-rise: 48px">
  <div data-fx-part="center">
    <svg viewBox="0 0 42 83" aria-hidden="true">
      <defs><clipPath id="demo-cup"><path d="M36 3H6C4.5 8.7 2.4 20 3.2 25.6c.3 2.2 1 4.2 2.1 6.1 1 1.7 2.3 3.2 3.8 4.4 3.5 2.9 9.9 5.3 11.4 9.9l2.7-2c3.9-3.1 7-5.6 10.3-8.5 3.1-2.8 5-6.6 5.4-10.7.1-1.6.1-3.9-.1-5.5C38.5 15.1 37.8 11 37 7c-.3-1.3-.7-2.7-1-4Z"/></clipPath></defs>
      <g clip-path="url(#demo-cup)"><g data-fx-part="fill"><path data-fx-part="wave" d="M-42 7c10.5 0 10.5-6 21-6S-10.5 7 0 7s10.5-6 21-6 10.5 6 21 6 10.5-6 21-6 10.5 6 21 6v79H-42Z"/></g></g>
      <path class="outline" d="M36 3H6C4.5 8.7 2.4 20 3.2 25.6c.3 2.2 1 4.2 2.1 6.1 1 1.7 2.3 3.2 3.8 4.4 3.5 2.9 9.9 5.3 11.4 9.9l2.7-2c3.9-3.1 7-5.6 10.3-8.5 3.1-2.8 5-6.6 5.4-10.7.1-1.6.1-3.9-.1-5.5C38.5 15.1 37.8 11 37 7c-.3-1.3-.7-2.7-1-4ZM21 46v32M11 80c4-.6 8-2 10-4.5 2 2.5 6 3.9 10 4.5"/>
    </svg>
    <span data-fx-part="percent">0%</span>
  </div>
  <p>Loading…</p>
  <section class="gate" data-fx-part="gate" role="dialog" aria-label="Confirm">
    <h2>Your confirm question here?</h2>
    <p>Your one line on why confirmation is needed.</p>
    <button type="button" data-fx-part="yes">Yes, that’s right</button>
  </section>
</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
  setTimeout(() => {
    const s = document.createElement("div");
    s.dataset.fx = "vessel-wave-loader";
    s.style.cssText = "inset:auto 0 0 auto;width:160px;height:120px";
    s.innerHTML = '<div data-fx-part="center"><span data-fx-part="percent">0%</span></div>';
    document.body.append(s);
    setTimeout(() => s.remove(), 1000);
  }, 1000);
</script>
</body>
</html>
