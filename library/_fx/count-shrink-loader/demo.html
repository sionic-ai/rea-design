<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>count-shrink-loader — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { margin: 0; background: var(--kf-bg); color: var(--kf-ink); font: 400 14px/1.5 var(--kf-font-sans); }
  .demo-hint { position: fixed; top: 50%; left: 50%; translate: -50% -50%; z-index: 1000; margin: 0; padding: 12px 20px; background: var(--kf-bg); border: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .count { position: absolute; left: 28px; bottom: 28px; z-index: 2; display: flex; gap: 8px; align-items: center; }
  .mark { display: block; }
  .mark b { display: block; font: 700 80px/1 var(--kf-font-sans); letter-spacing: -0.02em; }
  [data-fx-part="logo"] .mark b { font-size: clamp(16px, 5.7vw, 80px); }
</style>
</head>
<body>
<p class="demo-hint"><b>count-shrink-loader</b> — When opened, the bar fills over 3.8 seconds while the numbers count up, at the end the big logo cell folds into a small logo at the top left and the curtain lifts. Reload to see it again. <span style="color:var(--kf-dim)">(After 1s one more short loader is attached, and after 2.5s one is removed)</span></p>
<div data-fx="count-shrink-loader">
  <div data-fx-part="veil"></div>
  <a data-fx-part="logo" href="#"><span class="mark" data-fx-part="mark"><b>LOGO</b></span></a>
  <div class="count"><span data-fx-part="count">□</span><span data-fx-part="count"><b data-fx-part="num">00</b></span></div>
  <i data-fx-part="fill"></i>
</div>
<template data-demo-late><div data-fx="count-shrink-loader" data-fx-count-shrink-loader="dur: 1; to: 4rem 1rem" style="z-index:998"><a data-fx-part="logo" href="#" style="top:120px"><span class="mark" data-fx-part="mark"><b>LATE</b></span></a><i data-fx-part="fill"></i></div></template>
<div data-fx="count-shrink-loader" data-demo-remove><i data-fx-part="fill"></i></div>
<div data-fx="count-shrink-loader" data-fx-count-shrink-loader="dur: 0"></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
