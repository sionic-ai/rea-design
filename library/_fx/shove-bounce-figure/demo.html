<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>shove-bounce-figure — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  :root { --demo-0: var(--kf-raised); --demo-1: var(--kf-accent-soft); --demo-2: var(--kf-surface); }
  body { background: var(--fx-page, var(--kf-bg)); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); min-height: 100vh; }
  .demo-hint { position: relative; z-index: 5; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .stage { position: relative; z-index: 5; display: grid; place-items: center; height: 70vh; }
  .stage [data-fx-part="figure"] { width: 220px; height: 260px; border-radius: 50% 50% 18px 18px; background: var(--fx-costume, var(--kf-accent)); border: 3px solid var(--kf-ink); display: grid; place-items: center; font: 700 14px/1 var(--kf-font-mono); }
  .stage [data-fx-part="figure"]::after { content: attr(data-frame); }
  .stage [data-fx-part="bubble"] { padding: 10px 18px; border-radius: var(--kf-radius-md); background: var(--kf-ink); color: var(--kf-bg); font: 700 40px/1 var(--kf-font-display); }
</style>
</head>
<body>
<p class="demo-hint"><b>shove-bounce-figure</b> — Gently move the mouse over the center image, then swipe hard. It flies to the wall and bounces back, and the background color turns into circles.</p>
<div class="stage" data-fx="shove-bounce-figure" data-fx-shove-bounce-figure="colors: --demo-0 --demo-1 --demo-2; costumes: --demo-1 --demo-2 --demo-0; bubble-top: -1">
  <div data-fx-part="figure" data-frame="center"></div>
  <div data-fx-part="bubble">What is it…</div>
</div>
<div class="stage" data-fx="shove-bounce-figure" data-demo-remove><div data-fx-part="figure"></div></div>
<div id="late"></div>
<template data-demo-late><div class="stage" data-fx="shove-bounce-figure" data-fx-shove-bounce-figure="frames: 0; wall: 200"><div data-fx-part="figure" data-frame="center"></div></div></template>
<div class="stage" data-fx="shove-bounce-figure"></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => document.getElementById("late").append(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
