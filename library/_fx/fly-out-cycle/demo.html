<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fly-out-cycle — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .stage { position: relative; height: 420px; margin: 40px; background: var(--kf-accent-soft); overflow: hidden; }
  .lane { position: absolute; inset: 0 auto 0 0; width: 60%; overflow: hidden; }
  .item { width: 100%; height: 100%; }
  .item .wf-img { position: absolute; left: 50%; top: 50%; width: 100px; aspect-ratio: 3 / 4; transform: translate(-50%, -50%); }
  .win { position: absolute; left: 50%; top: 50%; width: 120px; height: 180px; transform: translate(-50%, -50%); border: 8px solid var(--kf-ink); border-radius: 60px 60px 0 0; }
  .win.is-open { background: var(--kf-bg); }
  .dots { position: absolute; right: 20px; top: 50%; display: grid; gap: 12px; transform: translateY(-50%); }
  .dots button { width: 10px; height: 10px; padding: 0; border: 0; border-radius: 50%; background: var(--kf-ink); cursor: pointer; }
  .dots button.is-active { background: var(--kf-bg); }
  .bird { position: absolute; left: 50%; top: 50%; width: 40px; height: 24px; margin-left: 70px; transform: translate(-50%, -50%); border-radius: 50%; background: var(--kf-ink); }
</style>
</head>
<body>
<p class="demo-hint"><b>fly-out-cycle</b> — After 3s the first cover opens like a window and flies off to the left, and the next cover follows every 4s (demo: every 4 · fly 3). Click the dots to skip ahead right away. <span style="color:var(--kf-dim)">(One more stage comes in after 1s, and one drops out after 2.5s)</span></p>
<div class="stage" data-fx="fly-out-cycle" data-fx-fly-out-cycle="every: 4; fly: 3">
  <div class="win" data-fx-part="open"></div>
  <div class="lane">
    <div class="item" data-fx-part="item"><div class="wf-img" data-label="Cover 1"></div></div>
    <div class="item" data-fx-part="item"><div class="wf-img" data-label="Cover 2"></div></div>
    <div class="item" data-fx-part="item"><div class="wf-img" data-label="Cover 3"></div></div>
  </div>
  <div class="dots"><button type="button" data-fx-part="dot" aria-label="1"></button><button type="button" data-fx-part="dot" aria-label="2"></button><button type="button" data-fx-part="dot" aria-label="3"></button></div>
  <template data-fx-part="rider"><span class="bird"></span></template>
</div>
<div class="stage" data-demo-remove data-fx="fly-out-cycle" data-fx-fly-out-cycle="first: 0; every: 2; fly: 1.5">
  <div class="lane"><div class="item" data-fx-part="item"><div class="wf-img" data-label="Being removed soon"></div></div></div>
</div>
<template data-demo-late><div class="stage" data-fx="fly-out-cycle" data-fx-fly-out-cycle="first: 1; every: 3; fly: 2"><div class="lane"><div class="item" data-fx-part="item"><div class="wf-img" data-label="Late 1"></div></div><div class="item" data-fx-part="item"><div class="wf-img" data-label="Late 2"></div></div></div></div></template>
<div class="stage" data-fx="fly-out-cycle"></div>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
