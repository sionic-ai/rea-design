<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>book-flip-gl — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); margin: 0; }
  .b { height: 80vh; margin: 16px 0; }
  .b button { position: absolute; z-index: 3; border: 1px solid var(--kf-line); background: var(--kf-surface); color: var(--kf-ink); padding: 8px 14px; border-radius: var(--kf-radius-pill); font: inherit; cursor: pointer; }
  .b [data-fx-part="enter"] { left: 50%; bottom: 12%; translate: -50% 0; }
  .b [data-fx-part="prev"] { left: 16px; top: 50%; }
  .b [data-fx-part="next"] { right: 16px; top: 50%; }
  .b [data-fx-part="end"] { position: absolute; right: 6%; top: 30%; width: 34%; }
  .b [data-fx-part="end"] ul { list-style: none; padding: 0; display: grid; gap: 12px; }
</style>
</head>
<body>
<p class="demo-hint"><b>book-flip-gl</b> — Once the book settles, hover the cover, press the panel to open it, then drag sideways or use the arrows or keyboard ←→ to turn pages. Hover the small cells under the book and the preview grows.</p>
<section class="b" data-fx="book-flip-gl">
  <figure data-fx-part="cover" data-label="Book cover · handwritten title on a dark panel" data-title="Cover"></figure>
  <figure data-fx-part="spread" data-label="Spread illustration 1 · hill and sun" data-title="First Section"></figure>
  <figure data-fx-part="spread" data-label="Spread illustration 2 · forest and animals" data-title="Second Section"></figure>
  <figure data-fx-part="spread" data-label="Open two-page spread 3 · seaside" data-title="Third Section"></figure>
  <figure data-fx-part="back" data-label="Back cover" data-title="Back cover"></figure>
  <button type="button" data-fx-part="enter">Open Book</button>
  <button type="button" data-fx-part="prev">Previous</button>
  <button type="button" data-fx-part="next">Next</button>
  <div data-fx-part="end"><p>More to see</p><ul><li>Read this — slot 1</li><li>Watch this — slot 2</li></ul></div>
</section>
<section class="b" data-fx="book-flip-gl" data-demo-remove data-fx-book-flip-gl="menu: 0"><figure data-fx-part="spread" data-label="Book to erase"></figure></section>
<template data-demo-late><section class="b" data-fx="book-flip-gl" data-fx-book-flip-gl="delay: 0"><figure data-fx-part="spread" data-label="Delayed book · one page"></figure><figure data-fx-part="spread" data-label="Delayed book · two pages"></figure></section></template>
<section class="b" data-fx="book-flip-gl"></section>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/Draggable.min.js"></script>
<script src="../../../_shared/vendor/gsap/InertiaPlugin.min.js"></script>
<script src="../../../_shared/vendor/gsap/EasePack.min.js"></script>
<script src="../pillar-gallery-gl/three-global.js"></script>
<script src="../../_vendor/three@0.174.0/build/three.cjs"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
  setTimeout(() => {
    const t = document.querySelector("[data-demo-late]");
    t.after(t.content.cloneNode(true));
    document.querySelector("[data-demo-remove]")?.remove();
  }, 1000);
</script>
</body>
</html>
