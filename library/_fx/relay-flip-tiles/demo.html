<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>relay-flip-tiles — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { display: grid; gap: 32px; padding: 32px 20px; }
  .demo ul { display: grid; grid-template-columns: repeat(3, 1fr); max-width: 720px; }
  .demo li { aspect-ratio: 195 / 140; }
  .demo .wf-img { height: 100%; }
  .demo .wf-img[data-fx-part="back"] { background-color: var(--kf-accent-soft); }
</style>
</head>
<body>
<p class="demo-hint"><b>relay-flip-tiles</b> — After 3 seconds the cells flip to their backs one by one, and after 1 second the front cell flips back (the demo uses a 2-second interval). <span style="color:var(--kf-dim)">(After 1s one more panel comes in, and one leaves 2.5s later)</span></p>
<section class="demo">
  <ul data-fx="relay-flip-tiles" data-fx-relay-flip-tiles="every: 2000; start: 1000"><li data-fx-part="tile"><div class="wf-img" data-fx-part="front" data-label="Day photo 1"></div><div class="wf-img" data-fx-part="back" data-label="Night photo 1"></div></li><li data-fx-part="tile" data-axis="x"><div class="wf-img" data-fx-part="front" data-label="Day photo 2"></div><div class="wf-img" data-fx-part="back" data-label="Night photo 2"></div></li><li data-fx-part="tile"><div class="wf-img" data-fx-part="front" data-label="Day photo 3"></div><div class="wf-img" data-fx-part="back" data-label="Night photo 3"></div></li><li data-fx-part="tile" data-axis="x"><div class="wf-img" data-fx-part="front" data-label="Day photo 4"></div><div class="wf-img" data-fx-part="back" data-label="Night photo 4"></div></li><li data-fx-part="tile"><div class="wf-img" data-fx-part="front" data-label="Day photo 5"></div><div class="wf-img" data-fx-part="back" data-label="Night photo 5"></div></li><li data-fx-part="tile" data-axis="x"><div class="wf-img" data-fx-part="front" data-label="Day photo 6"></div><div class="wf-img" data-fx-part="back" data-label="Night photo 6"></div></li></ul>
  <ul data-demo-remove data-fx="relay-flip-tiles" data-fx-relay-flip-tiles="every: 1500; start: 0"><li data-fx-part="tile"><div class="wf-img" data-fx-part="front" data-label="Day photo 1"></div><div class="wf-img" data-fx-part="back" data-label="Night photo 1"></div></li><li data-fx-part="tile" data-axis="x"><div class="wf-img" data-fx-part="front" data-label="Day photo 2"></div><div class="wf-img" data-fx-part="back" data-label="Night photo 2"></div></li><li data-fx-part="tile"><div class="wf-img" data-fx-part="front" data-label="Day photo 3"></div><div class="wf-img" data-fx-part="back" data-label="Night photo 3"></div></li><li data-fx-part="tile" data-axis="x"><div class="wf-img" data-fx-part="front" data-label="Day photo 4"></div><div class="wf-img" data-fx-part="back" data-label="Night photo 4"></div></li><li data-fx-part="tile"><div class="wf-img" data-fx-part="front" data-label="Day photo 5"></div><div class="wf-img" data-fx-part="back" data-label="Night photo 5"></div></li><li data-fx-part="tile" data-axis="x"><div class="wf-img" data-fx-part="front" data-label="Day photo 6"></div><div class="wf-img" data-fx-part="back" data-label="Night photo 6"></div></li></ul>
  <template data-demo-late><ul data-fx="relay-flip-tiles" data-fx-relay-flip-tiles="every: 2500; back: 0; start: 500" style="--fx-dur: .5s"><li data-fx-part="tile"><div class="wf-img" data-fx-part="front" data-label="Day photo 1"></div><div class="wf-img" data-fx-part="back" data-label="Night photo 1"></div></li><li data-fx-part="tile" data-axis="x"><div class="wf-img" data-fx-part="front" data-label="Day photo 2"></div><div class="wf-img" data-fx-part="back" data-label="Night photo 2"></div></li><li data-fx-part="tile"><div class="wf-img" data-fx-part="front" data-label="Day photo 3"></div><div class="wf-img" data-fx-part="back" data-label="Night photo 3"></div></li><li data-fx-part="tile" data-axis="x"><div class="wf-img" data-fx-part="front" data-label="Day photo 4"></div><div class="wf-img" data-fx-part="back" data-label="Night photo 4"></div></li><li data-fx-part="tile"><div class="wf-img" data-fx-part="front" data-label="Day photo 5"></div><div class="wf-img" data-fx-part="back" data-label="Night photo 5"></div></li><li data-fx-part="tile" data-axis="x"><div class="wf-img" data-fx-part="front" data-label="Day photo 6"></div><div class="wf-img" data-fx-part="back" data-label="Night photo 6"></div></li></ul></template>
  <ul data-fx="relay-flip-tiles"></ul>
</section>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
