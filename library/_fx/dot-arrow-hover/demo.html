<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dot-arrow-hover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 600 15px/1.6 var(--kf-font-sans); padding: 40px; }
  .demo-hint { margin-bottom: 30px; font: 500 13px/1.4 var(--kf-font-mono); }
  .row { display: flex; gap: 20px; flex-wrap: wrap; }
  .btn { display: inline-flex; align-items: center; justify-content: space-between; width: 220px; height: 52px; padding: 0 24px; border-radius: 999px; background: var(--kf-contrast-bg); color: var(--kf-contrast-ink); }
</style>
</head>
<body>
<p class="demo-hint"><b>dot-arrow-hover</b> — Hover a button. The dot at the end stretches into an arrow. (One more button comes in after 1 second and one drops out after 2.5 seconds)</p>
<div class="row" id="row">
  <a class="btn" href="#" data-fx="dot-arrow-hover">view more<i data-fx-part="dot"></i></a>
  <a class="btn" href="#" data-fx="dot-arrow-hover" style="--fx-bar: 28px" data-demo-remove>longer bar<i data-fx-part="dot"></i></a>
  <a class="btn" href="#" data-fx="dot-arrow-hover">no dot</a>
</div>
<template data-demo-late><a class="btn" href="#" data-fx="dot-arrow-hover">late<i data-fx-part="dot"></i></a></template>
<script src="../fx-core.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => document.getElementById("row")?.append(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
