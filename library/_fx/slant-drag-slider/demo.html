<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>slant-drag-slider — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 9; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .box { width: min(720px, 90vw); aspect-ratio: 3 / 2; margin: 40px auto; }
  .box .wf-img { height: 100%; }
</style>
</head>
<body>
<p class="demo-hint"><b>slant-drag-slider</b> — Drag or press the photo left and right. <span style="color:var(--kf-dim)">(After 1s one more panel comes in, and one leaves 2.5s later)</span></p>
<div class="box" data-fx="slant-drag-slider">
  <div data-fx-part="slide"><span class="wf-img" data-fx-part="img" data-label="Photo 1"></span></div>
  <div data-fx-part="slide"><span class="wf-img" data-fx-part="img" data-label="Photo 2"></span></div>
  <div data-fx-part="slide"><span class="wf-img" data-fx-part="img" data-label="Photo 3"></span></div>
  <span data-fx-part="tip" data-key="prev">PREV <span data-fx-part="count" data-key="prev"></span></span>
  <span data-fx-part="tip" data-key="next">NEXT <span data-fx-part="count" data-key="next"></span></span>
</div>
<div class="box" data-fx="slant-drag-slider" data-demo-remove><div data-fx-part="slide"><span class="wf-img" data-fx-part="img" data-label="Removable panel 1"></span></div><div data-fx-part="slide"><span class="wf-img" data-fx-part="img" data-label="Removable panel 2"></span></div></div>
<div class="box" data-fx="slant-drag-slider" style="aspect-ratio:auto;height:60px">Boardless Line</div>
<template data-demo-late><div class="box" data-fx="slant-drag-slider" data-fx-slant-drag-slider="dur: .4; shift: 30"><div data-fx-part="slide"><span class="wf-img" data-fx-part="img" data-label="Late-arriving panel 1"></span></div><div data-fx-part="slide"><span class="wf-img" data-fx-part="img" data-label="Late-arriving panel 2"></span></div></div></template>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
