<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>stretch-fly-chars — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; overflow-x: hidden; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-spacer { height: 70vh; display: grid; place-items: center; color: var(--kf-dim); }
  .demo { padding: 0 20px 80vh; display: grid; gap: 120px; }
  .demo h2 { margin: 0; font: 400 clamp(40px, 6.6667vw, 96px)/0.9 var(--kf-font-mono); text-transform: uppercase; letter-spacing: -0.025em; }
  .demo h3 { margin: 0; max-width: 14em; font: 600 40px/1.2 var(--kf-font-display); }
</style>
</head>
<body>
<p class="demo-hint"><b>stretch-fly-chars</b> Scroll down. Text flies in from off the left, slanted and stretched, and folds into place (800px and up).</p>
<div class="demo-spacer">Scroll</div>
<section class="demo" id="demo">
  <h2 data-fx="stretch-fly-chars">A New<br>Destination<br>for Events</h2>
  <h3 data-fx="stretch-fly-chars">Your section title here that wraps onto two lines</h3>
  <h2 data-fx="stretch-fly-chars" data-fx-stretch-fly-chars="x: -120; rotate: 0; stretch: 3; dur: .5; each: .03">Calmer Variant</h2>
</section>
<script>
// Late-arriving and removed titles — the title that comes in 1s later is hooked too, and the title removed after 2.5s runs teardown (restoring the split letters)
(() => {
  const demo = document.getElementById("demo");
  const make = (t) => { const el = document.createElement("h2"); el.dataset.fx = "stretch-fly-chars"; el.textContent = t; return el; };
  const gone = make("Leaves Soon");
  demo.append(gone);
  setTimeout(() => demo.append(make("Late Headline")), 1000);
  setTimeout(() => gone.remove(), 2500);
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../../../_shared/vendor/gsap/SplitText.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
