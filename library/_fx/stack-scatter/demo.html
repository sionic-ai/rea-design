<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>stack-scatter — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-spacer { height: 80vh; display: grid; place-items: center; color: var(--kf-dim); }
  .copy { height: 200vh; }
  .copy > div { position: sticky; top: 0; height: 100vh; display: grid; place-items: center; }
  .pile { width: 200px; }
  .pile .wf-img { aspect-ratio: 2 / 3; }
</style>
</head>
<body>
<p class="demo-hint"><b>stack-scatter</b> — Scroll until the section top touches the top of the screen and the stacked photos scatter, scroll further or back up and they stack again. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<div class="demo-spacer">Scroll down</div>
<section class="copy"><div>
  <div class="pile" data-demo-remove data-fx="stack-scatter" data-fx-stack-scatter="scope: .copy"><div class="wf-img" data-fx-part="photo" data-label="Photo 1" style="--fx-x: 83px; --fx-y: 38px"></div><div class="wf-img" data-fx-part="photo" data-label="Photo 2" style="--fx-x: -67px; --fx-y: -22px"></div><div class="wf-img" data-fx-part="photo" data-label="Photo 3" style="--fx-x: 42px; --fx-y: 104px"></div><div class="wf-img" data-fx-part="photo" data-label="Photo 4" style="--fx-x: -29px; --fx-y: 75px"></div><div class="wf-img" data-fx-part="base" data-label="Bottom Photo" style="--fx-lift: 116px"></div></div>
</div></section>
<section class="copy"><div>
  <div class="pile" data-fx="stack-scatter" data-fx-stack-scatter="scope: .copy; stay: true"><div class="wf-img" data-fx-part="photo" data-label="Photo 1" style="--fx-x: 90px; --fx-y: 20px"></div><div class="wf-img" data-fx-part="base" data-label="Floor photo — left scattered"></div></div>
  <template data-demo-late><div class="pile" data-fx="stack-scatter"><div class="wf-img" data-fx-part="photo" data-label="Late-arriving photo" style="--fx-x: -60px; --fx-y: 30px"></div><div class="wf-img" data-fx-part="base" data-label="Floor"></div></div></template>
</div></section>
<div class="demo-spacer">Footer</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); window.ScrollTrigger?.refresh(); }, 2500);
</script>
</body>
</html>
