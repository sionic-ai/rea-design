<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fan-nudge-hover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 24px; padding: 48px 20px; }
  .tray { position: relative; display: block; height: 260px; border-radius: 18px; background: var(--kf-raised); overflow: hidden; }
  .slot { position: absolute; top: 50%; left: 50%; width: 52%; aspect-ratio: 16 / 10; margin: -13% 0 0 -26%; }
  .slot [data-fx-part="item"] { height: 100%; border-radius: 12px; background: var(--kf-surface); box-shadow: var(--kf-shadow-soft); display: grid; place-items: center; font: 600 12px var(--kf-font-mono); color: var(--kf-dim); }
  .slot.l2 { z-index: 1; transform: translate(-50%, 26px) scale(0.78); } .slot.l1 { z-index: 2; transform: translate(-25%, 13px) scale(0.89); } .slot.c { z-index: 3; }
  .slot.r1 { z-index: 2; transform: translate(25%, 13px) scale(0.89); } .slot.r2 { z-index: 1; transform: translate(50%, 26px) scale(0.78); }
</style>
</head>
<body>
<p class="demo-hint"><b>fan-nudge-hover</b> — Hover over the photo cell — the outer sheets move aside by 22 and 44px and the center sheet lifts 6px. <span style="color:var(--kf-dim)">(After 1s one more cell comes in, and one leaves 2.5s later)</span></p>
<section class="demo">
  <a class="tray" href="#" data-demo-remove data-fx="fan-nudge-hover"><div class="slot l2"><div data-fx-part="item">1</div></div><div class="slot l1"><div data-fx-part="item">2</div></div><div class="slot c"><div data-fx-part="item">3</div></div><div class="slot r1"><div data-fx-part="item">4</div></div><div class="slot r2"><div data-fx-part="item">5</div></div></a>
  <a class="tray" href="#" data-fx="fan-nudge-hover" data-fx-fan-nudge-hover="step: 30; lift: 10"><div class="slot l1"><div data-fx-part="item">1</div></div><div class="slot c"><div data-fx-part="item">2</div></div><div class="slot r1"><div data-fx-part="item">3</div></div></a>
  <template data-demo-late><a class="tray" href="#" data-fx="fan-nudge-hover"><div class="slot l2"><div data-fx-part="item">1</div></div><div class="slot l1"><div data-fx-part="item">2</div></div><div class="slot c"><div data-fx-part="item">3</div></div><div class="slot r1"><div data-fx-part="item">4</div></div><div class="slot r2"><div data-fx-part="item">5</div></div></a></template>
  <div data-fx="fan-nudge-hover"></div>
</section>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); window.ScrollTrigger?.refresh(); }, 2500);
</script>
</body>
</html>
