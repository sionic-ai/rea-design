<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>hover-sticker-burst — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { margin: 0; padding: 80px; font-family: var(--kf-font-sans); background: var(--kf-bg); color: var(--kf-ink); display: grid; gap: 80px; justify-items: start; }
  .box { display: block; width: 320px; aspect-ratio: 16 / 9; }
  .badge { width: 72px; height: 72px; border-radius: 50%; background: var(--kf-accent); border: 3px solid var(--kf-surface); display: grid; place-items: center; color: var(--kf-on-accent); font-weight: 700; font-size: 12px; }
  .chip { padding: 8px 12px; background: var(--kf-surface); color: var(--kf-ink); font-weight: 600; font-size: 13px; }
</style>
</head>
<body>
  <p class="demo-hint"><b>hover-sticker-burst</b> — Hover over the box — badges pop out and wiggle, then shrink back when you move away.</p>
  <span data-fx="hover-sticker-burst">
    <span data-fx-part="host" class="box wf-img" data-label="Video box"></span>
    <span data-fx-part="pop" class="badge" data-r="-14" data-d="26" style="top: -36px; left: -30px">AWARD</span>
    <span data-fx-part="pop" class="badge" data-r="10" data-d="40" style="top: -20px; right: -40px">BEST</span>
    <span data-fx-part="pop" class="chip" data-r="-5" data-d="18" style="bottom: -14px; right: 30px">0,0 ★★★★★</span>
  </span>
  <template data-demo-late><span data-fx="hover-sticker-burst" data-fx-hover-sticker-burst="spin: 20; wobble: 2"><span data-fx-part="host" class="box wf-img" data-label="Box that came in after 1s"></span><span data-fx-part="pop" class="badge" data-r="8" style="top: -30px; left: 40%">NEW</span></span></template>
  <span data-fx="hover-sticker-burst" data-demo-remove><span data-fx-part="pop" class="chip">Omitted badge</span></span>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
