<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>wave-gate-loader — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: fixed; bottom: 0; left: 0; right: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-top: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-page { min-height: 100vh; display: grid; place-items: center; font: 700 48px/1 var(--kf-font-display); }
  .gate [data-fx-part="content"] { width: min(70vw, 420px); }
  .gate [data-fx-part="logo"] { width: 100%; height: auto; font: 800 64px/1 var(--kf-font-display); text-align: center; }
  .gate [data-fx-part="loading"] { margin-top: 8px; font: 500 12px/1 var(--kf-font-mono); letter-spacing: .15em; }
  .gate [data-fx-part="start"] { margin-top: 12px; padding: 10px 28px; border: 1px solid var(--kf-line); background: var(--kf-surface); color: var(--kf-ink); font: 500 13px/1 var(--kf-font-mono); letter-spacing: .15em; cursor: pointer; }
  .gate [data-fx-part="start"]:hover { border-color: var(--kf-ink); }
</style>
</head>
<body>
<p class="demo-hint"><b>wave-gate-loader</b> — When the waves are full, press ”Press to start”. The top and bottom panels split and open. <span style="color:var(--kf-dim)">(After 1s one more small loader comes in, and leaves 2.5s later)</span></p>
<div class="demo-page">Hero after loader</div>
<div class="gate" data-fx="wave-gate-loader">
  <div data-fx-part="content">
    <div data-fx-part="logo">Logo slot</div>
    <svg data-fx-part="wave" preserveAspectRatio="none" aria-hidden="true"></svg>
    <span data-fx-part="loading">Loading</span>
    <button data-fx-part="start" type="button" hidden>Press to start</button>
  </div>
</div>
<template data-demo-late><div class="gate" data-demo-remove data-fx="wave-gate-loader" data-fx-wave-gate-loader="dur: 1; cycles: 3" style="inset: auto 20px 60px auto; width: 260px; height: 160px;"><div data-fx-part="content"><svg data-fx-part="wave" preserveAspectRatio="none"></svg><button data-fx-part="start" type="button" hidden>Start</button></div></div></template>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
