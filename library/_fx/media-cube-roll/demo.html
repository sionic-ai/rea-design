<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>media-cube-roll — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .mc { height: 78vh; background: var(--kf-accent-soft); }
  .mc + .mc { height: 40vh; }
  .ctl { display: flex; gap: 8px; justify-content: center; padding: 16px; font: 400 13px var(--kf-font-mono); }
  .ctl button { font: inherit; padding: 6px 14px; border: 1px solid var(--kf-line); border-radius: var(--kf-radius-pill); background: var(--kf-surface); color: var(--kf-ink); cursor: pointer; }
</style>
</head>
<body>
<p class="demo-hint"><b>media-cube-roll</b> — Scroll the wheel over the box or press a number. Pressing the box zooms in (press again to release), and dragging while holding Space throws it. <span style="color:var(--kf-dim)">(One more box comes in after 1s, and one drops out after 2.5s)</span></p>
<div class="mc" id="cube" data-fx="media-cube-roll" data-fx-media-cube-roll="wheel: self; entry: true">
  <figure data-fx-part="face" data-label="Work 1 · website screen recording · landscape 16:9"><video src="../../rolling-video-box-portfolio/media/work-reel-16x9.mp4" muted loop playsinline preload="auto"></video></figure>
  <figure data-fx-part="face" data-label="Work 2 · Hero capture"></figure>
  <figure data-fx-part="face" data-label="Work 3 · product screen capture"></figure>
  <figure data-fx-part="face" data-label="Work 4 · List screen capture"></figure>
  <figure data-fx-part="face" data-label="Work 5 · mobile screen capture"></figure>
  <figure data-fx-part="face" data-label="Work 6 · Final screen"></figure>
</div>
<div class="ctl"><span>Slot:</span><button type="button" data-go="0">0</button><button type="button" data-go="1">1</button><button type="button" data-go="3">3</button><button type="button" data-go="5">5</button><button type="button" id="next">Next while zoomed</button><span id="out">—</span></div>
<div class="mc" data-fx="media-cube-roll" data-demo-remove data-fx-media-cube-roll="zoom: false; physics: false"><figure data-fx-part="face" data-label="Box to Remove"></figure></div>
<template data-demo-late><div class="mc" data-fx="media-cube-roll" data-fx-media-cube-roll="dur: .6; wheel: self"><figure data-fx-part="face" data-label="Late-added box 1"></figure><figure data-fx-part="face" data-label="Late-added box 2"></figure></div></template>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="three-global.js"></script>
<script src="../../_vendor/three@0.184.0/build/three.cjs"></script>
<script src="../../_vendor/cannon-es@0.20.0/cannon-es.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script src="demo.js"></script>
</body>
</html>
