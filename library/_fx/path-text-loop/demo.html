<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>path-text-loop — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); overflow-x: hidden; margin: 0; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-spacer { height: 70vh; display: grid; place-items: center; color: var(--kf-dim); }
  .band { display: block; width: 100%; height: auto; overflow: visible; }
</style>
</head>
<body>
<p class="demo-hint"><b>path-text-loop</b> — Text on a wavy line flows along the line. Scroll it off screen and back (it pauses while outside).</p>
<div class="demo-spacer">Scroll down</div>
<svg class="band" data-fx="path-text-loop" viewBox="0 0 1440 300"><path id="demo-wave-a" data-fx-part="line" d="M-40 250C300 150 700 260 1000 160s320-130 480-140" stroke-width="56"/><text font-size="26" dominant-baseline="middle"><textPath href="#demo-wave-a" startOffset="0%">Your ribbon text here</textPath></text></svg>
<div class="demo-spacer"></div>
<svg class="band" id="src" data-fx="path-text-loop" data-fx-path-text-loop="speed: 12; dir: reverse" viewBox="0 0 1440 300"><path id="demo-wave-b" data-fx-part="line" d="M-40 60C300 200 600 40 900 120s400 60 580-40" stroke-width="56"/><text font-size="26" dominant-baseline="middle"><textPath href="#demo-wave-b" startOffset="0%">Fast reverse</textPath></text></svg>
<div class="demo-spacer"></div>
<script>
(() => {
  let n = 0;
  const src = document.getElementById("src");
  const make = () => { const t = document.createElement("template"); t.innerHTML = src.outerHTML.replace(/\sid="src"/, "").replaceAll("demo-wave-b", `demo-wave-c${++n}`); return t.content.firstElementChild; };
  const gone = make(); src.after(gone);
  setTimeout(() => src.after(make()), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s one more of the same comes in, and after 2.5s one drops out.");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
