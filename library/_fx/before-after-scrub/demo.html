<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>before-after-scrub — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { display: grid; gap: 30vh; padding: 60vh 4vw 70vh; }
  .pair { display: grid; grid-template-columns: 180px 1fr; gap: 24px; align-items: center; }
  .labels { position: relative; overflow: hidden; height: 1.6em; font: 500 1.2rem/1.6 var(--kf-font-sans); }
  .labels > span { position: absolute; inset: 0; }
  .frame { aspect-ratio: 3 / 2; }
  .frame .wf-img { height: 100%; }
</style>
</head>
<body>
<p class="demo-hint"><b>before-after-scrub</b> — Scroll down slowly. The After photo sweeps in from the left to cover, and the label changes from Before → After. Scroll back up to reverse it. <span style="color:var(--kf-dim)">(After 1s one more panel comes in, and one leaves 2.5s later)</span></p>
<section class="demo">
  <div class="pair">
    <div class="labels"><span data-fx-part="label-before">Before · Empty room</span><span data-fx-part="label-after">After · Furnished room</span></div>
    <div class="frame" data-fx="before-after-scrub">
      <div data-fx-part="before"><div class="wf-img" data-label="Empty living room · daylight · landscape 3:2"></div></div>
      <div data-fx-part="after"><div class="wf-img" data-label="Furniture in the same living room · Landscape 3:2"></div></div>
    </div>
  </div>
  <div class="frame" data-fx="before-after-scrub" data-fx-before-after-scrub="from: bottom; start: top 80%; end: bottom 40%">
    <div data-fx-part="before"><div class="wf-img" data-label="No name tag · From below"></div></div>
    <div data-fx-part="after"><div class="wf-img" data-label="After"></div></div>
  </div>
  <div class="frame" data-fx="before-after-scrub" data-demo-remove>
    <div data-fx-part="before"><div class="wf-img" data-label="Panel to be removed soon"></div></div>
    <div data-fx-part="after"><div class="wf-img" data-label="After"></div></div>
  </div>
  <template data-demo-late><div class="frame" data-fx="before-after-scrub"><div data-fx-part="before"><div class="wf-img" data-label="Late panel"></div></div><div data-fx-part="after"><div class="wf-img" data-label="Late-arriving panel · After"></div></div></div></template>
</section>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); window.ScrollTrigger?.refresh(); }, 2500);
</script>
</body>
</html>
