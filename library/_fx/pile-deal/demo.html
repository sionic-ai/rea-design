<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pile-deal — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo-spacer { height: 90vh; display: grid; place-items: center; color: var(--kf-dim); }
  .stage { height: 100svh; padding: 64px 20px 20px; box-sizing: border-box; }
  .wall { height: 100%; }
  .wall a { position: absolute; width: 20%; aspect-ratio: 4 / 5; box-shadow: var(--kf-shadow-lift); }
  .wall .wf-img { height: 100%; }
</style>
</head>
<body>
<p class="demo-hint"><b>pile-deal</b> — Scroll and the section pins, then cards are dealt one at a time from the center pile into place.</p>
<div class="demo-spacer">Scroll down ↓</div>
<section class="stage" data-fx="pile-deal"><div class="wall" data-fx-part="board">
  <a data-fx-part="card" href="#" style="left:2%;top:4%"><div class="wf-img" data-label="Performer 1 · person on stage · portrait 4:5"></div></a>
  <a data-fx-part="card" href="#" style="left:26%;top:30%"><div class="wf-img" data-label="Performer 2"></div></a>
  <a data-fx-part="card" href="#" style="left:52%;top:2%"><div class="wf-img" data-label="Performer 3"></div></a>
  <a data-fx-part="card" href="#" style="left:77%;top:26%"><div class="wf-img" data-label="Performer 4"></div></a>
</div></section>
<div class="demo-spacer"></div>
<script>
// Late arrivals and removals — checks that fx-core attaches to an element added after 1s and detaches from an element removed after 2.5s
(() => {
  const src = document.querySelector('[data-fx~="pile-deal"]');
  if (!src) return;
  const html = src.outerHTML;
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => (src.closest(".pin-spacer") || src).after(make("late")), 1000); // Once pinned the panel gets wrapped in a pin-spacer, so place it outside that
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical one comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
