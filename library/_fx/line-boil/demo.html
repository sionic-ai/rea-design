<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>line-boil — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { display: flex; flex-wrap: wrap; gap: 40px; padding: 40px; }
  figure { width: 280px; }
  svg { width: 100%; height: auto; overflow: visible; }
  svg path { fill: none; stroke: var(--kf-accent); stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
</style>
</head>
<body>
<p class="demo-hint"><b>line-boil</b> — Watch closely. Line drawings swap to a different sheet every 1 second and jitter like hand drawing (the center one at .15 second). The last one cycles 3 filter seeds on a single drawing at .5 second each. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<section class="demo">
  <figure data-fx="line-boil"><svg viewBox="0 0 200 160"><g data-fx-part="frame"><path d="M20 140 C 30 60 90 30 100 20 C 110 30 170 60 180 140 Z M80 140 V100 H120 V140"/></g><g data-fx-part="frame"><path d="M22 141 C 28 62 92 28 101 22 C 112 31 168 58 178 139 Z M79 139 V102 H121 V141"/></g></svg></figure>
  <figure data-fx="line-boil" data-fx-line-boil="hold: .15"><svg viewBox="0 0 200 160"><g data-fx-part="frame"><path d="M30 120 C 60 40 140 40 170 120 M60 120 V150 M140 120 V150"/></g><g data-fx-part="frame"><path d="M32 118 C 62 42 138 38 168 121 M61 121 V149 M139 119 V151"/></g><g data-fx-part="frame"><path d="M29 121 C 59 39 141 42 171 119 M59 119 V151 M141 121 V149"/></g></svg></figure>
  <figure data-fx="line-boil" data-demo-remove><svg viewBox="0 0 200 160"><g data-fx-part="frame"><path d="M100 20 L120 80 L180 80 L130 110 L150 150 L100 125 L50 150 L70 110 L20 80 L80 80 Z"/></g><g data-fx-part="frame"><path d="M101 22 L119 81 L178 79 L131 111 L149 148 L101 124 L51 149 L69 111 L22 81 L81 79 Z"/></g></svg></figure>
  <figure data-fx="line-boil" data-fx-line-boil="hold: .5; seeds: 3"><svg viewBox="0 0 200 160"><path d="M20 140 C 30 60 90 30 100 20 C 110 30 170 60 180 140 Z M80 140 V100 H120 V140"/></svg></figure>
  <template data-demo-late><figure data-fx="line-boil"><svg viewBox="0 0 200 160"><g data-fx-part="frame"><path d="M40 80 A60 60 0 1 0 160 80 A60 60 0 1 0 40 80"/></g><g data-fx-part="frame"><path d="M42 81 A58 61 0 1 0 158 79 A61 58 0 1 0 42 81"/></g></svg></figure></template>
</section>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
