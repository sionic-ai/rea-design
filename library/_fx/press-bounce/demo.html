<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>press-bounce — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { padding: 48px 20px; }
  .demo-spacer { height: 90vh; display: grid; place-items: center; color: var(--kf-dim); }

  .pads { display: grid; grid-template-columns: repeat(4, 120px); gap: 8px; }
  .pads button { height: 90px; border: 1px solid var(--kf-line); background: var(--kf-surface); color: var(--kf-ink); font: 500 12px/1 var(--kf-font-mono); }
  .pads button[data-on] { border-color: var(--kf-accent); color: var(--kf-accent-text); }
</style>
</head>
<body>
<p class="demo-hint"><b>press-bounce</b> — Press the pads — they press down and bounce back, and only the pressed ones light up. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<section class="demo"><div class="pads"><button data-demo-remove type="button" data-fx="press-bounce" data-on data-fx-press-bounce="group: true">Pad 01</button><button type="button" data-fx="press-bounce" data-on data-fx-press-bounce="group: true">Pad 01</button><template data-demo-late><button type="button" data-fx="press-bounce" data-on data-fx-press-bounce="group: true">Pad 01</button></template><button type="button" data-fx="press-bounce" data-fx-press-bounce="group: true">Pad 02</button><button type="button" data-fx="press-bounce" data-fx-press-bounce="group: true">Pad 03</button><button type="button" data-fx="press-bounce" data-fx-press-bounce="group: true">Pad 04</button><button type="button" data-fx="press-bounce" data-fx-press-bounce="group: true">Pad 05</button><button type="button" data-fx="press-bounce" data-fx-press-bounce="group: true">Pad 06</button><button type="button" data-fx="press-bounce" data-fx-press-bounce="group: true">Pad 07</button><button type="button" data-fx="press-bounce" data-fx-press-bounce="group: true">Pad 08</button></div></section>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/CustomEase.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); window.ScrollTrigger?.refresh(); }, 2500);
</script>
</body>
</html>
