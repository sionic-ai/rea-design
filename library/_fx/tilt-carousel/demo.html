<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tilt-carousel — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .stage { height: 70vh; margin: 20px 0; background: var(--kf-raised); }
  .card { display: grid; place-items: center; aspect-ratio: 986 / 706; border: 2px solid var(--kf-ink); border-radius: var(--kf-radius-md); background: var(--kf-surface); font: var(--kf-weight-display) 40px/1 var(--kf-font-display); }
  .nav { position: absolute; bottom: 20px; left: 0; right: 0; z-index: 10; display: flex; justify-content: center; gap: 12px; }
  .nav button { padding: 6px 18px; border: 1px solid var(--kf-ink); border-radius: var(--kf-radius-pill); background: var(--kf-accent); color: var(--kf-on-accent); cursor: pointer; }
  .dots { display: flex; gap: 10px; align-items: center; }
  .dots i { width: 10px; height: 10px; border-radius: 50%; background: var(--kf-ink); transform: scale(0.5); }
  .dots i.is-current { transform: scale(1); }
</style>
</head>
<body>
<p class="demo-hint"><b>tilt-carousel</b> — Press NEXT or BACK. The cards shift one spot at a time, tilting and then settling.</p>
<div class="stage" data-fx="tilt-carousel">
  <ul data-fx-part="track"><li data-fx-part="item"><a class="card" href="#">Card 1</a></li><li data-fx-part="item"><a class="card" href="#">Card 2</a></li><li data-fx-part="item"><a class="card" href="#">Card 3</a></li><li data-fx-part="item"><a class="card" href="#">Card 4</a></li><li data-fx-part="item"><a class="card" href="#">Card 5</a></li></ul>
  <div class="nav"><button type="button" data-fx-part="prev">BACK</button><span class="dots"><i data-fx-part="dot"></i><i data-fx-part="dot"></i><i data-fx-part="dot"></i><i data-fx-part="dot"></i><i data-fx-part="dot"></i></span><button type="button" data-fx-part="next">NEXT</button></div>
</div>
<script>
(() => {
  const src = document.querySelector('[data-fx~="tilt-carousel"]');
  const html = src.outerHTML;
  const make = () => { const t = document.createElement("template"); t.innerHTML = html; return t.content.firstElementChild; };
  const gone = make(); src.after(gone);
  setTimeout(() => src.after(make()), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s one more of the same comes in, and after 2.5s one drops out.");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
