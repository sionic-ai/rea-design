<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>spin-unzoom-scrub — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { margin: 0; background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); overflow-x: clip; }
  .demo-hint { position: sticky; top: 0; z-index: 5; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .gap { height: 60vh; }
  .map-sec { height: 200vh; background: var(--kf-raised); }
  .map-sec [data-fx-part="zoom"] { position: absolute; inset: 0; margin: auto; width: min(90vw, 160vh); aspect-ratio: 1198 / 750; }
  .map-sec [data-fx-part="turn"] { width: 100%; height: 100%; }
  .map-sec svg { display: block; width: 100%; height: 100%; overflow: visible; }
  .land { fill: var(--kf-accent); }
  .zone { fill: var(--kf-accent-soft); stroke: var(--kf-bg); stroke-width: 3; }
  .label { position: absolute; left: 24px; bottom: 24px; z-index: 2; font: 600 13px/1.4 var(--kf-font-mono); }
</style>
</head>
<body>
<p class="demo-hint"><b>spin-unzoom-scrub</b> — Scroll down. The turned, zoomed-in map straightens and pulls back as much as you scroll. <span style="color:var(--kf-dim)">(After 1s one more section comes in, and one leaves 2.5s later)</span></p>
<div class="gap"></div>
<section class="map-sec" data-fx="spin-unzoom-scrub">
  <div data-fx-part="stage">
    <div data-fx-part="zoom"><div data-fx-part="turn">
      <svg viewBox="0 0 1198 750" aria-hidden="true"><path class="land" d="M180 200C240 80 520 50 760 90 900 120 980 220 960 320 940 420 880 460 940 540 980 600 900 680 820 700 700 720 560 710 470 650 420 600 330 560 250 480 190 400 150 300 180 200Z"/><path class="zone" d="M300 220C400 160 560 150 640 220 600 320 480 340 360 320 300 290 290 250 300 220Z"/><path class="zone" d="M520 400C600 360 720 380 760 450 720 520 620 540 540 500Z"/></svg>
    </div></div>
    <p class="label">Your area name here</p>
  </div>
</section>
<div class="gap"></div>
<section class="map-sec" data-fx="spin-unzoom-scrub" data-fx-spin-unzoom-scrub="turn: 90; scale: 2; x: 0; y: 0; scrub: 0" data-demo-remove><div data-fx-part="stage"><div data-fx-part="zoom"><svg viewBox="0 0 1198 750"><rect class="land" x="200" y="150" width="800" height="450" rx="60"/></svg></div></div></section>
<div id="late"></div>
<template data-demo-late><section class="map-sec" data-fx="spin-unzoom-scrub" data-fx-spin-unzoom-scrub="turn: -45; scale: 3; x: 20"><div data-fx-part="stage"><div data-fx-part="zoom"><svg viewBox="0 0 1198 750"><rect class="land" x="200" y="150" width="800" height="450" rx="60"/></svg></div><p class="label">Late section</p></div></section></template>
<section class="map-sec" data-fx="spin-unzoom-scrub" style="height: 40vh"></section>
<div class="gap"></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => document.getElementById("late").append(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
