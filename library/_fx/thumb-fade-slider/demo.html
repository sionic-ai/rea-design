<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>thumb-fade-slider — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="../../_vendor/slick-carousel@1.8.1/slick.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); padding: 24px; }
  .demo-hint { margin-bottom: 16px; font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-stage { height: 60vh; margin-bottom: 24px; }
  .demo-slide { height: 60vh; display: grid !important; place-items: center; font: 700 40px/1 var(--kf-font-sans); color: var(--kf-bg); }
  .demo-slide.a { background: color-mix(in oklab, var(--kf-ink) 70%, var(--kf-accent)); }
  .demo-slide.b { background: color-mix(in oklab, var(--kf-ink) 40%, var(--kf-accent)); }
  .demo-slide.c { background: color-mix(in oklab, var(--kf-ink) 10%, var(--kf-accent)); }
  .demo-dot { background: var(--kf-surface); }
</style>
</head>
<body>
<p class="demo-hint"><b>thumb-fade-slider</b> — Left alone, it cross-fades every 2.5s. Try pressing the circles below.</p>
<section class="demo-stage" data-fx="thumb-fade-slider">
  <div data-fx-part="slides"><div class="demo-slide a">Photo 1</div><div class="demo-slide b">Photo 2</div><div class="demo-slide c">Photo 3</div></div>
  <div data-fx-part="nav"><button type="button" data-fx-part="thumb" aria-label="1"><span class="demo-dot"></span></button><button type="button" data-fx-part="thumb" aria-label="2"><span class="demo-dot"></span></button><button type="button" data-fx-part="thumb" aria-label="3"><span class="demo-dot"></span></button></div>
</section>
<script>
// Late arrivals and removals — checks that fx-core attaches to an element added after 1s and detaches from an element removed after 2.5s
(() => {
  const src = document.querySelector('[data-fx~="thumb-fade-slider"]');
  if (!src) return;
  const html = src.outerHTML.replace(/\sid="[^"]*"/g, "");
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => src.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical one comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="../../_vendor/jquery@2.2.4/jquery.min.js"></script>
<script src="../../_vendor/slick-carousel@1.8.1/slick.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
