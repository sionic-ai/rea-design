<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>scroll-dial-clock — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-spacer { height: 60vh; display: grid; place-items: center; color: var(--kf-dim); }
  .demo-body { text-align: center; padding: 120px 24px 0; background: linear-gradient(to bottom, transparent, var(--kf-bg) 35%); }
  .demo-body h2 { margin: 0 0 12px; font: 600 40px/1 var(--kf-font-display); }
  .small { --fx-stage: 300vh; --fx-ring: 900px; }
</style>
</head>
<body>
<p class="demo-hint"><b>scroll-dial-clock</b> — Scroll down slowly. The clock rises and draws its border and ticks, fills in the digits, then counts down every second. <span style="color:var(--kf-dim)">(After 1s a small clock comes in, and after 2.5s the empty one leaves)</span></p>
<div class="demo-spacer">Downward</div>
<section data-fx="scroll-dial-clock" data-fx-scroll-dial-clock="value: 26"><div data-fx-part="body" class="demo-body"><h2>Your two-line title here.</h2><p>Your two body lines here.</p></div></section>
<template data-demo-late><section class="small" data-fx="scroll-dial-clock" data-fx-scroll-dial-clock="value: 9; ticks: 60"></section></template>
<section data-demo-remove data-fx="scroll-dial-clock"></section>
<div class="demo-spacer">Footer</div>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
