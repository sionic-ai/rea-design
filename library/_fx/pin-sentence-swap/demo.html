<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pin-sentence-swap — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 10; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-pad { height: 60vh; display: grid; place-items: center; }
  .demo-dark { background: var(--kf-contrast-bg); color: var(--kf-contrast-ink); }
  .demo-dark p { max-width: 360px; text-align: center; font-size: 17px; margin: 0 0 25px; }
  .demo-dark a { display: inline-block; padding: 6px 10px; border-radius: var(--kf-radius-sm); background: var(--kf-contrast-ink); color: var(--kf-contrast-bg); }
</style>
</head>
<body>
<p class="demo-hint"><b>pin-sentence-swap</b> — Scroll down and the black stage stays pinned while the sentences change one after another.</p>
<div class="demo-pad">Top section</div>
<section class="demo-dark" data-fx="pin-sentence-swap">
  <div data-fx-part="stage"><div>
    <p data-fx-part="line">Your first sentence here in two lines.</p>
    <p data-fx-part="line">Your second sentence here, two lines.</p>
    <div data-fx-part="line"><p>Your last sentence here.</p><a href="#">Button</a></div>
  </div></div>
</section>
<section class="demo-dark" style="--fx-height: 200vh" data-fx="pin-sentence-swap" data-fx-pin-sentence-swap="dur: 0; cuts: .3" data-demo-remove>
  <div data-fx-part="stage"><div><p data-fx-part="line">Removable section 1</p><p data-fx-part="line">Removable section 2</p></div></div>
</section>
<template data-demo-late>
  <section class="demo-dark" style="--fx-height: 300vh" data-fx="pin-sentence-swap" data-fx-pin-sentence-swap="dur: .8">
    <div data-fx-part="stage"><div><p data-fx-part="line">Late-arriving section 1</p><p data-fx-part="line">Late-arriving section 2</p></div></div>
  </section>
</template>
<section class="demo-dark" style="--fx-height: 100vh" data-fx="pin-sentence-swap"><div data-fx-part="stage"></div></section>
<div class="demo-pad">Lower section</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
