<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pulse-icon-hover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .row { display: flex; gap: 40px; padding: 60px; align-items: center; }
  .more { display: inline-flex; align-items: center; gap: 10px; font-size: 18px; font-weight: 500; }
  .ico { display: grid; place-items: center; width: 40px; height: 40px; border: 1px solid var(--kf-ink); border-radius: 50%; }
  .btn { width: 40px; height: 40px; border: 1px solid var(--kf-ink); border-radius: 50%; background: var(--kf-bg); }
</style>
</head>
<body>
<p class="demo-hint"><b>pulse-icon-hover</b> — Hover over links and round buttons. The arrow puffs up once. <span style="color:var(--kf-dim)">(After 1s one more button comes in, and after 2.5s one drops out)</span></p>
<div class="row" id="row">
  <a class="more" href="#" data-fx="pulse-icon-hover">All Posts<span class="ico" data-fx-part="icon">→</span></a>
  <button class="btn" type="button" data-fx="pulse-icon-hover" aria-label="Next">→</button>
  <button class="btn" type="button" data-fx="pulse-icon-hover" style="--fx-scale: 1.3" data-demo-remove aria-label="Omission">×</button>
</div>
<template data-demo-late><button class="btn" type="button" data-fx="pulse-icon-hover" aria-label="Late">←</button></template>
<script src="../fx-core.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => document.getElementById("row").append(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
