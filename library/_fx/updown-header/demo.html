<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>updown-header — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.6 var(--kf-font-sans); }
  .head { position: fixed; top: 0; left: 0; right: 0; z-index: 10; display: flex; align-items: center; gap: 24px; height: 88px; padding: 0 40px; }
  .head.fx-ud-back { height: 72px; border-bottom: 1px solid var(--kf-line); }
  .burger { position: fixed; top: 20px; right: 20px; z-index: 11; width: 56px; height: 56px; border-radius: 50%; background: var(--kf-accent); }
  .demo-hint { padding: 120px 40px 20px; font: 500 13px/1.4 var(--kf-font-mono); }
  .block { height: 80vh; margin: 20px 40px; background: var(--kf-surface); border: 1px solid var(--kf-line); }
</style>
</head>
<body>
<header class="head" data-fx="updown-header"><b>Logo</b><span>Menu 1</span><span>Menu 2</span></header>
<span class="burger" data-fx="updown-header" data-fx-updown-header="look: side"></span>
<p class="demo-hint"><b>updown-header</b> — Scrolling down hides the header upward, and scrolling up a little brings it back with a background. <span style="color:var(--kf-dim)">(After 1s the second button comes in, and leaves after 2.5s)</span></p>
<div class="block"></div><div class="block"></div><div class="block"></div>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
let late;
setTimeout(() => { late = document.createElement("span"); late.className = "burger"; late.style.right = "90px"; late.dataset.fx = "updown-header"; late.dataset.fxUpdownHeader = "look: side"; document.body.append(late); }, 1000);
setTimeout(() => late?.remove(), 2500);
</script>
</body>
</html>
