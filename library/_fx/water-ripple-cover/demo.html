<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>water-ripple-cover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .stage { position: relative; height: 70svh; display: grid; place-items: center; color: var(--kf-contrast-ink); }
  .stage > [data-fx] { position: absolute; inset: 0; z-index: 0; background: var(--kf-contrast-bg); }
  .stage h2 { position: relative; z-index: 1; font: 400 clamp(32px, 5vw, 64px)/1.1 var(--kf-font-display); pointer-events: none; }
  .small { height: 40svh; margin-top: 12px; }
  .demo-spacer { height: 30vh; display: grid; place-items: center; color: var(--kf-dim); }
</style>
</head>
<body>
<p class="demo-hint"><b>water-ripple-cover</b> — Move the mouse over the dark panel. Ripples rise and spread where it passed.</p>
<section class="stage"><div data-fx="water-ripple-cover"></div><h2>Your title here</h2></section>
<div id="later"></div>
<section class="stage small" id="gone"><div data-fx="water-ripple-cover" data-fx-water-ripple-cover="radius: .1; damping: .98"></div><h2>Deleting soon</h2></section>
<div class="demo-spacer">Body slot</div>
<script>
  setTimeout(() => { document.getElementById("later").innerHTML = '<section class="stage small"><div data-fx="water-ripple-cover" data-fx-water-ripple-cover="strength: .6"></div><h2>1 sec later</h2></section>'; }, 1000);
  setTimeout(() => document.getElementById("gone").remove(), 1500);
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../_vendor/three@0.186.0/three.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
