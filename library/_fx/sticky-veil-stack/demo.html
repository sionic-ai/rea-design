<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sticky-veil-stack — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .frame { display: grid; place-items: center; background: var(--kf-bg); }
  .media { position: absolute; inset: 0; background: var(--kf-raised); }
  .frame h2 { position: relative; z-index: 1; font: 600 40px/1.1 var(--kf-font-display); }
  .tail { height: 60vh; display: grid; place-items: center; color: var(--kf-dim); }
</style>
</head>
<body>
<p class="demo-hint"><b>sticky-veil-stack</b> — Scroll down and a panel sticks, the next panel covers it, and the previous panel darkens. <span style="color:var(--kf-dim)">(After 1s one more panel comes in, and one leaves 2.5s later)</span></p>
<section data-fx="sticky-veil-stack">
  <article class="frame" data-fx-part="frame"><h2>Panel One</h2></article>
  <article class="frame" data-fx-part="frame"><div class="media" data-fx-part="media"></div><h2>Panel Two</h2></article>
  <article class="frame" data-fx-part="frame" data-demo-remove><div class="media" data-fx-part="media"></div><h2>Dropped Panel</h2></article>
  <article class="frame" data-fx-part="frame"><div class="media" data-fx-part="media"></div><h2>Panel Four</h2></article>
</section>
<template data-demo-late><section data-fx="sticky-veil-stack" data-fx-sticky-veil-stack="zoom: 1.1"><article class="frame" data-fx-part="frame"><h2>Late One</h2></article><article class="frame" data-fx-part="frame"><h2>Late two</h2></article></section></template>
<section data-fx="sticky-veil-stack"></section>
<div class="tail">Footer</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); window.ScrollTrigger?.refresh(); }, 2500);
</script>
</body>
</html>
