<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>scroll-ruler-meter — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 500 15px/1.6 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: sticky; top: 0; z-index: 10; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .gap { height: 120vh; display: grid; place-items: center; color: var(--kf-dim); }
  .stage { position: sticky; top: 60px; display: flex; gap: 120px; padding: 24px 40px; background: var(--kf-contrast-bg); color: var(--kf-contrast-ink); }
  .stage [data-fx] { height: 420px; }
  [data-fx-part="tag"] b { font-weight: 500; font-size: 20px; }
  [data-fx-part="note"] { font-size: 13px; margin: 6px 0 0; }
</style>
</head>
<body>
<p class="demo-hint"><b>scroll-ruler-meter</b> — Scroll down. Bright tick marks fill from the top and a tag shows the distance scrolled. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<div class="stage" id="stage">
  <div data-fx="scroll-ruler-meter"><div data-fx-part="tag"><div><b>So far <span data-fx-part="value"></span> It came down</b><p data-fx-part="note" data-at="0.2 0.5 1" data-say="As much as a pencil|As much as an arm’s length|As much as half a door’s height"></p></div></div></div>
  <div data-fx="scroll-ruler-meter" data-fx-scroll-ruler-meter="step: 4; major: 11; minor: 5.5" data-demo-remove></div>
</div>
<div class="gap">Scroll down</div>
<div class="gap">A little more</div>
<div class="gap">Footer</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => { const n = document.createElement("div"); n.dataset.fx = "scroll-ruler-meter"; n.dataset.fxScrollRulerMeter = "step: 6"; document.getElementById("stage").append(n); }, 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
