<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pixel-swap-hover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { display: flex; flex-wrap: wrap; gap: 24px; padding: 48px 20px; }
  .card { width: 260px; aspect-ratio: 4 / 5; border-radius: var(--kf-radius-md); }
  .card > .wf-img { position: absolute; inset: 0; height: 100%; border: 0; }
  .card > [data-fx-part="swap"].wf-img { background-color: var(--kf-accent); }
</style>
</head>
<body>
<p class="demo-hint"><b>pixel-swap-hover</b> Hover over the photo. 8×8 pixels shuffle in to cover it, then clear away, swapping to another photo.</p>
<section class="demo">
  <div class="card" data-fx="pixel-swap-hover"><span class="wf-img" data-label="Portrait photo · 4:5"></span><span class="wf-img" data-fx-part="swap" data-label="Same person pixel art"></span></div>
  <div class="card" data-fx="pixel-swap-hover" data-fx-pixel-swap-hover="grid: 12; dur: .6"><span class="wf-img" data-label="12 cells · .6s"></span><span class="wf-img" data-fx-part="swap" data-label="Changed cut"></span></div>
</section>
<script>
(() => {
  const src = document.querySelector('[data-fx~="pixel-swap-hover"]');
  if (!src) return;
  const html = src.outerHTML.replace(/\sid="[^"]*"/g, "");
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => src.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s one more of the same comes in, and after 2.5s one drops out.");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
