<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>scroll-tint-swap — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { padding: 24px; font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-pad { height: 60vh; }
  .demo-panel { color: var(--kf-on-accent); }
  .demo-panel section { min-height: 90vh; padding: 80px 24px; font: 700 28px/1.3 var(--kf-font-sans); }
</style>
</head>
<body>
<p class="demo-hint"><b>scroll-tint-swap</b> — Scroll down. When the top edge of the second section comes within 250px above the screen top, the panel background turns gray in .5s, and returns when scrolled back up.</p>
<div class="demo-pad"></div>
<div class="demo-panel" data-fx="scroll-tint-swap">
  <section>Section 1 — Mint edition</section>
  <section data-fx-part="marker">Second section — when this rises to the top, the panel turns gray</section>
</div>
<div class="demo-pad"></div>
<script>
// Late arrivals and removals — checks that fx-core attaches to an element added after 1s and detaches from an element removed after 2.5s
(() => {
  const src = document.querySelector('[data-fx~="scroll-tint-swap"]');
  if (!src) return;
  const html = src.outerHTML;
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => src.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical panel comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
