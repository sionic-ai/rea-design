<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>inset-frame-hover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { display: grid; grid-template-columns: repeat(2, minmax(0, 360px)); gap: 24px; padding: 48px 20px; }
  .demo a { color: var(--kf-contrast-ink); text-decoration: none; }
  .demo .photo { aspect-ratio: 4 / 3; background: linear-gradient(135deg, var(--kf-accent), var(--kf-ink)); }
  .demo .label { position: absolute; left: 1em; bottom: 1em; z-index: 2; padding: .4em .8em; background: color-mix(in oklab, var(--kf-contrast-ink) 10%, transparent); backdrop-filter: blur(6px); }
</style>
</head>
<body>
<p class="demo-hint"><b>inset-frame-hover</b> — Hover over a photo card. The curtain lifts, the inner white border fills in, and the photo approaches with a slight rotation.</p>
<section class="demo">
  <a data-fx="inset-frame-hover" href="#" style="--fx-veil: 30%"><span data-fx-part="frame"><span class="photo" data-fx-part="photo"></span></span><span class="label">Curtain 30% · story card</span></a>
  <a data-fx="inset-frame-hover" href="#"><span data-fx-part="frame"><span class="photo" data-fx-part="photo"></span></span><span class="label">No curtain</span></a>
</section>
<script>
// Late-entering and removed items — a CSS-only part, so it applies right on entry and leaves nothing behind when removed
(() => {
  const src = document.querySelector('[data-fx~="inset-frame-hover"]');
  if (!src) return;
  const html = src.outerHTML.replace(/\sid="[^"]*"/g, "");
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => src.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical one comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="../fx-core.js"></script>
</body>
</html>
