<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dot-grid-spot — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .board { min-height: 70svh; display: flex; flex-direction: column; justify-content: flex-end; padding: 40px 3vw; background: var(--kf-contrast-bg); color: var(--kf-contrast-ink); }
  .board p { position: relative; z-index: 2; font: 400 18vw/0.8 var(--kf-font-display); letter-spacing: -0.04em; }
  .small { min-height: 40svh; margin-top: 12px; }
  .demo-spacer { height: 30vh; display: grid; place-items: center; color: var(--kf-dim); }
</style>
</head>
<body>
<p class="demo-hint"><b>dot-grid-spot</b> — Move the mouse over the black panel. Cells you pass light up then fade, and clicking sends out a ripple.</p>
<footer class="board" data-fx="dot-grid-spot"><p>Name</p></footer>
<div id="later"></div>
<section class="board small" data-fx="dot-grid-spot" data-fx-dot-grid-spot="cell: 32; radius: 90" id="gone"><p>Deleting soon</p></section>
<div class="demo-spacer">Body slot</div>
<script>
  setTimeout(() => { document.getElementById("later").innerHTML = '<section class="board small" data-fx="dot-grid-spot" data-fx-dot-grid-spot="cell: 40; edge: 0"><p>1 sec later</p></section>'; }, 1000);
  setTimeout(() => document.getElementById("gone").remove(), 1500);
</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
