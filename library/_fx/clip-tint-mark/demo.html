<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>clip-tint-mark — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 9; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .sec { position: relative; height: 110vh; display: grid; place-items: center; font-size: 28px; }
  .sec.is-dark { background: var(--kf-contrast-bg); color: var(--kf-contrast-ink); }
  .sec > p { position: relative; }
</style>
</head>
<body>
<p class="demo-hint"><b>clip-tint-mark</b> — Scroll down. The corner pieces stay put while the color changes at section borders. 1s later a section is attached, and 1.5s later one is removed.</p>
<section class="sec" id="a"><div data-fx="clip-tint-mark" data-fx-clip-tint-mark="look: light"><div data-fx-part="corner" data-key="start"><svg viewBox="0 0 281 423"><path d="M0 423V150C0 67 67 0 150 0c72 0 131 59 131 131v40L181 271V150c0-17-14-31-31-31h-19c-17 0-31 14-31 31v173Z" fill="currentColor"/></svg></div><div data-fx-part="corner" data-key="end"><svg viewBox="0 0 281 423"><g transform="rotate(180 140.5 211.5)"><path d="M0 423V150C0 67 67 0 150 0c72 0 131 59 131 131v40L181 271V150c0-17-14-31-31-31h-19c-17 0-31 14-31 31v173Z" fill="currentColor"/></g></svg></div></div><p>Light section · look: light</p></section>
<section class="sec is-dark" id="b"><div data-fx="clip-tint-mark" data-fx-clip-tint-mark="look: dark"><div data-fx-part="corner" data-key="start"><svg viewBox="0 0 281 423"><path d="M0 423V150C0 67 67 0 150 0c72 0 131 59 131 131v40L181 271V150c0-17-14-31-31-31h-19c-17 0-31 14-31 31v173Z" fill="currentColor"/></svg></div><div data-fx-part="corner" data-key="end"><svg viewBox="0 0 281 423"><g transform="rotate(180 140.5 211.5)"><path d="M0 423V150C0 67 67 0 150 0c72 0 131 59 131 131v40L181 271V150c0-17-14-31-31-31h-19c-17 0-31 14-31 31v173Z" fill="currentColor"/></g></svg></div></div><p>Dark section · look: dark</p></section>
<section class="sec is-dark" id="gone"><div data-fx="clip-tint-mark" data-fx-clip-tint-mark="look: ink"><div data-fx-part="corner" data-key="start"><svg viewBox="0 0 281 423"><path d="M0 423V150C0 67 67 0 150 0c72 0 131 59 131 131v40L181 271V150c0-17-14-31-31-31h-19c-17 0-31 14-31 31v173Z" fill="currentColor"/></svg></div></div><p>Section to be deleted soon · look: ink</p></section>
<section class="sec"><div data-fx="clip-tint-mark"></div><p>Board with no pieces (quiet)</p></section>
<script>
  setTimeout(() => {
    const s = document.createElement("section");
    s.className = "sec is-dark";
    s.innerHTML = '<div data-fx="clip-tint-mark" data-fx-clip-tint-mark="look: ink"><div data-fx-part="corner" data-key="end"><svg viewBox="0 0 281 423"><g transform="rotate(180 140.5 211.5)"><path d="M0 423V150C0 67 67 0 150 0c72 0 131 59 131 131v40L181 271V150c0-17-14-31-31-31h-19c-17 0-31 14-31 31v173Z" fill="currentColor"/></g></svg></div></div><p>Section attached after 1s</p>';
    document.body.append(s);
  }, 1000);
  setTimeout(() => document.getElementById("gone").remove(), 1500);
</script>
<script src="../fx-core.js"></script>
</body>
</html>
