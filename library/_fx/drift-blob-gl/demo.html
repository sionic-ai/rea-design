<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>drift-blob-gl — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { margin: 0; background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; margin: 0; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .orb { display: grid; place-items: center; width: min(90vw, 560px); aspect-ratio: 1; margin: 40px auto; border-radius: 50%; text-align: center; }
  .band { display: grid; place-items: center; height: 320px; margin: 40px 0; }
</style>
</head>
<body>
<p class="demo-hint"><b>drift-blob-gl</b> — Watch closely. Pale light discs float around while the gradient slowly shifts. <span style="color:var(--kf-dim)">(After 1s one more panel comes in, and one leaves 2.5s later)</span></p>
<section class="orb" data-fx="drift-blob-gl" data-demo-remove><div><h2>Your two-line title here</h2><p>Your short description here</p></div></section>
<section class="band" data-fx="drift-blob-gl" data-fx-drift-blob-gl="speed: 0.6; count: 12"><p>Slow-flowing type</p></section>
<template data-demo-late><section class="orb" data-fx="drift-blob-gl"><p>Late-arriving panel</p></section></template>
<div data-fx="drift-blob-gl"></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../photo-cylinder-spin/three-global.js"></script>
<script src="../../_vendor/three@0.152.0/build/three.cjs"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
