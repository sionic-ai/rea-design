<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>turn-shake-loop — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); padding: 24px; }
  .demo-hint { margin-bottom: 24px; font: 500 13px/1.4 var(--kf-font-mono); }
  .board { display: flex; gap: 40px; align-items: flex-end; flex-wrap: wrap; padding: 40px; background: var(--kf-raised); border-radius: var(--kf-radius-md); }
  .board svg { width: 90px; height: 90px; display: block; }
</style>
</head>
<body>
<p class="demo-hint"><b>turn-shake-loop</b> — Just watch — one prop at a time shakes in turn every 1.8s. (1s later one more panel comes in, and 2.5s later one prop drops out)</p>
<div class="board" data-fx="turn-shake-loop">
  <span data-fx-part="item"><svg viewBox="0 0 100 100"><ellipse cx="50" cy="60" rx="40" ry="34" style="fill:var(--kf-accent)"/><circle cx="36" cy="30" r="18" style="fill:var(--kf-accent)"/></svg></span>
  <span data-fx-part="item"><svg viewBox="0 0 100 100"><rect x="20" y="20" width="60" height="70" rx="12" style="fill:var(--kf-ink)"/></svg></span>
  <span data-fx-part="item" data-demo-remove><svg viewBox="0 0 100 100"><path d="M50 8 92 90H8z" style="fill:var(--kf-accent-soft)"/></svg></span>
  <span data-fx-part="item"><svg viewBox="0 0 100 100"><circle cx="50" cy="55" r="38" style="fill:var(--kf-dim)"/></svg></span>
</div>
<template data-demo-late><div class="board" data-fx="turn-shake-loop" data-fx-turn-shake-loop="every: 0.9; range: 8" style="margin-top:24px"><span data-fx-part="item"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" style="fill:var(--kf-accent)"/></svg></span><span data-fx-part="item"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="30" style="fill:var(--kf-ink)"/></svg></span></div></template>
<div data-fx="turn-shake-loop"></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
