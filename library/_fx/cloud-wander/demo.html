<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cloud-wander — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 1; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .sky { position: relative; height: 70vh; margin: 20px; border: 1px solid var(--kf-line); border-radius: var(--kf-radius-md); overflow: hidden; }
  .c { position: absolute; width: 160px; fill: var(--kf-surface); stroke: var(--kf-ink); stroke-width: 1.6; }
</style>
</head>
<body>
<p class="demo-hint"><b>cloud-wander</b> — The cloud drifts very slowly around its spot (the demo runs faster at 6s).</p>
<div class="sky">
  <svg class="c" style="left:10%;top:15%;--fx-dur:6s" data-fx="cloud-wander" viewBox="0 0 240 80"><path d="M20 60c-10-14 6-30 26-24 4-18 30-26 46-12 10-20 46-22 58 0 20-10 46 2 44 22 16 0 30 8 26 14Z"/></svg>
  <svg class="c" style="left:55%;top:30%;--fx-dur:5s" data-fx="cloud-wander" data-fx-cloud-wander="look: square" viewBox="0 0 240 80" data-demo-remove><path d="M40 62c-12-12 4-28 24-22 6-20 40-24 54-6 14-14 44-8 46 12 18-2 32 8 30 16Z"/></svg>
  <template data-demo-late><svg class="c" style="left:30%;top:60%;--fx-dur:4s" data-fx="cloud-wander" data-fx-cloud-wander="look: small" viewBox="0 0 240 80"><path d="M20 60c-10-14 6-30 26-24 4-18 30-26 46-12 10-20 46-22 58 0 20-10 46 2 44 22 16 0 30 8 26 14Z"/></svg></template>
</div>
<script src="../fx-core.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
