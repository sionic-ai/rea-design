<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>glass-press-membrane — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { margin: 0; background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .stage { display: grid; gap: 24px; padding: 24px; }
  .panel { height: 70vh; display: grid; place-items: center; color: var(--kf-ink); }
  .panel.small { height: 40vh; }
  .panel h2 { margin: 0; font-size: clamp(2rem, 6vw, 5rem); font-weight: 300; }
</style>
</head>
<body>
<p class="demo-hint"><b>glass-press-membrane</b> — Move the mouse over the panel and press. The glass sheet is pressed back behind the cursor and ripples, getting deeper and clearer while you hold. <span style="color:var(--kf-dim)">(After 1s one more panel comes in, and one leaves 2.5s later)</span></p>
<div class="stage">
  <section class="panel" data-fx="glass-press-membrane"><h2>Press the glass</h2></section>
  <section class="panel small" data-fx="glass-press-membrane" data-fx-glass-press-membrane="depth: .8; press: 1.6; chroma: .08" data-demo-remove></section>
  <template data-demo-late><section class="panel small" data-fx="glass-press-membrane" data-fx-glass-press-membrane="rough: .02; blur: 0"></section></template>
</div>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
