<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>neon-flicker — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .stage { display: grid; gap: 40px; padding: 60px 40px; background: var(--kf-contrast-bg); }
  .sign { font: 900 clamp(48px, 9vw, 100px)/1.2 var(--kf-font-display); --fx-neon: var(--kf-accent); }
  .sign.-small { font-size: 48px; --fx-stroke: 2px; }
  .stage button { justify-self: start; padding: 8px 14px; border: 1px solid var(--kf-contrast-ink); background: none; color: var(--kf-contrast-ink); cursor: pointer; }
</style>
</head>
<body>
<p class="demo-hint"><b>neon-flicker</b> — Just watch — the glow of the outlined text flickers off and on three times every 12 seconds (the second line on a 4-second cycle). Press the button and the waiting third line lights up.</p>
<div class="stage" id="stage">
  <p class="sign" data-fx="neon-flicker">NEON SIGN</p>
  <p class="sign -small" data-fx="neon-flicker" style="--fx-dur: 4s">FAST FLICKER</p>
  <p class="sign -small" id="wait" data-fx="neon-flicker" data-fx-neon-flicker="look: wait">WAITING</p>
  <button type="button" onclick="document.getElementById('wait').classList.add('is-on')">Turn on third line</button>
  <p class="sign -small" data-demo-remove data-fx="neon-flicker">REMOVED</p>
</div>
<template data-demo-late><p class="sign -small" data-fx="neon-flicker">LATE SIGN</p></template>
<script src="../fx-core.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => { document.getElementById("stage").append(t.content.cloneNode(true)); t.remove(); }), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
