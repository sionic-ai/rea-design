<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>drift-card-magnet — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: relative; z-index: 2; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .stage { position: relative; height: 80vh; overflow: hidden; }
  .stage [data-fx-part="card"] { position: absolute; aspect-ratio: 7 / 9; border-radius: var(--kf-radius-md); overflow: hidden; box-shadow: var(--kf-shadow-lift); }
  .stage [data-fx-part="cover"], .stage .wf-img { width: 100%; height: 100%; }
  .c1 { left: 6%; bottom: 8%; width: 18%; } .c2 { left: -4%; top: 14%; width: 14%; } .c3 { left: 42%; top: 12%; width: 26%; } .c4 { right: 2%; bottom: 14%; width: 16%; } .c5 { right: 4%; top: -2%; width: 20%; }
</style>
</head>
<body>
<p class="demo-hint"><b>drift-card-magnet</b> — Move the mouse over the screen. Cards float opposite the cursor at different widths, and hovering a card enlarges the inner panel and pulls it toward the cursor.</p>
<section class="stage" data-fx="drift-card-magnet">
  <div class="c1" data-fx-part="card"><div data-fx-part="cover"><span class="wf-img" data-label="Vertical video 1"></span></div></div>
  <div class="c2" data-fx-part="card"><div data-fx-part="cover"><span class="wf-img" data-label="Vertical video 2"></span></div></div>
  <div class="c3" data-fx-part="card"><div data-fx-part="cover"><span class="wf-img" data-label="Vertical video 3"></span></div></div>
  <div class="c4" data-fx-part="card"><div data-fx-part="cover"><span class="wf-img" data-label="Vertical Video 4"></span></div></div>
  <div class="c5" data-fx-part="card"><div data-fx-part="cover"><span class="wf-img" data-label="Vertical video 5"></span></div></div>
</section>
<script>
// Late arrivals and removals — checks that fx-core attaches to an element added after 1s and detaches from an element removed after 2.5s
(() => {
  const src = document.querySelector('[data-fx~="drift-card-magnet"]');
  if (!src) return;
  const html = src.outerHTML;
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => src.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical one comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
