<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>step-curtain-wipe — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .back { position: fixed; inset: 0; z-index: -1; display: grid; place-items: center; background: var(--kf-accent-soft); font: 700 6vw/1 var(--kf-font-display); }
  .story { position: relative; z-index: 1; height: 260vh; background: var(--kf-surface); display: grid; place-items: center; font: 700 4vw/1 var(--kf-font-display); }
  .pin { position: relative; z-index: 2; height: 100vh; margin-top: -100vh; }
  .stripes { position: absolute; inset: 0; background: repeating-linear-gradient(90deg, var(--kf-accent) 0 6vw, var(--kf-ink) 6vw 12vw, var(--kf-dim) 12vw 18vw); }
  .puller { fill: var(--kf-ink); }
</style>
</head>
<body>
<p class="demo-hint"><b>step-curtain-wipe</b> — Scroll all the way down. A striped curtain passes in 21 segments, and the moment it covers the screen the previous section hides and the “Hero” behind it is revealed. <span style="color:var(--kf-dim)">(After 1s one more empty act comes in, and after 2.5s one is removed)</span></p>
<div class="back">Start Screen</div>
<main>
  <section class="story" id="story">Story Section</section>
  <div class="pin">
    <div data-fx="step-curtain-wipe" data-fx-step-curtain-wipe="hide: #story">
      <div class="stripes"></div>
      <svg data-fx-part="puller" viewBox="0 0 100 160"><circle class="puller" cx="50" cy="30" r="26"/><rect class="puller" x="24" y="58" width="52" height="100" rx="16"/></svg>
    </div>
  </div>
  <div data-demo-remove style="position:relative;height:1px"><div data-fx="step-curtain-wipe" data-fx-step-curtain-wipe="screens: 0.5"></div></div>
  <template data-demo-late><div style="position:relative;height:1px"><div data-fx="step-curtain-wipe" data-fx-step-curtain-wipe="steps: 8; screens: 0.5"></div></div></template>
</main>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
