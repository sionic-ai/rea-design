<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>random-pop-stagger — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { margin: 0; padding: 12px 20px; border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .spacer { height: 70vh; }
  ul { display: flex; flex-wrap: wrap; justify-content: center; gap: 16px; max-width: 900px; margin: 0 auto 80px; }
  li { display: grid; place-items: center; width: 160px; height: 120px; border-radius: 48% 52% 50% 50% / 56% 44% 56% 44%; background: var(--kf-accent-soft); font: 700 20px/1.2 var(--kf-font-display); text-align: center; }
  li.big { width: 240px; height: 240px; }
</style>
</head>
<body>
<p class="demo-hint"><b>random-pop-stagger</b> — Scroll down. Spotted horses pop out on the offbeat.</p>
<div class="spacer"></div>
<ul id="a" data-fx="random-pop-stagger"><li data-fx-part="item">Short words</li><li class="big" data-fx-part="item">Big words</li><li data-fx-part="item">Word Three</li><li data-fx-part="item">Word Four</li><li data-fx-part="item">Five words</li></ul>
<ul id="b" data-fx="random-pop-stagger" data-fx-random-pop-stagger="dur: 1; ease: elastic.out(2); start: center bottom"><li data-fx-part="item">Speech bubble</li><li data-fx-part="item">Speech bubble</li></ul>
<div class="spacer"></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
  gsap.registerPlugin(ScrollTrigger);
  // Check that late-arriving bundles get hooked and removed bundles get released
  setTimeout(() => {
    const u = document.createElement("ul");
    u.dataset.fx = "random-pop-stagger";
    u.innerHTML = '<li data-fx-part="item">Late word</li><li data-fx-part="item">Late word</li>';
    document.body.insertBefore(u, document.querySelectorAll(".spacer")[1]);
  }, 1000);
  setTimeout(() => document.getElementById("b")?.remove(), 2500);
</script>
</body>
</html>
