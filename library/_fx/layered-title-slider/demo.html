<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>layered-title-slider — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: relative; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .s { height: 70vh; margin: 24px 0; background: var(--kf-ink); color: var(--kf-surface); }
  .s [data-fx-part="bg"]:nth-child(odd) { background: var(--kf-raised); } .s [data-fx-part="bg"]:nth-child(even) { background: var(--kf-line); }
  .s [data-fx-part="title"] { z-index: 200; font: 700 24px/1 var(--kf-font-display); color: var(--kf-ink); }
  .s [data-fx-part="mask"] { position: absolute; left: 50%; top: 50%; z-index: 150; width: 20vw; height: 30vh; translate: -50% -60%; }
  .s [data-fx-part="mask-item"]:nth-child(odd) { background: var(--kf-accent); } .s [data-fx-part="mask-item"]:nth-child(even) { background: var(--kf-dim); }
  .bar { position: absolute; top: 16px; left: 50%; z-index: 200; translate: -50% 0; display: flex; gap: 8px; align-items: center; color: var(--kf-ink); }
  .bar i { display: block; width: 80px; height: 2px; background: currentColor; }
  .bar button { color: var(--kf-ink); }
</style>
</head>
<body>
<p class="demo-hint"><b>layered-title-slider</b> — Advances every 5s. Click a title beside it or swipe sideways.</p>
<section class="s" data-fx="layered-title-slider">
  <div data-fx-part="bg"></div><div data-fx-part="bg"></div><div data-fx-part="bg"></div><div data-fx-part="bg"></div>
  <a data-fx-part="title" href="#">Work One</a><a data-fx-part="title" href="#">Work two, long name</a><a data-fx-part="title" href="#">Work Three</a><a data-fx-part="title" href="#">Work Four</a>
  <div data-fx-part="mask"><div data-fx-part="mask-item"></div><div data-fx-part="mask-item"></div><div data-fx-part="mask-item"></div><div data-fx-part="mask-item"></div></div>
  <div class="bar"><button data-fx-part="prev" type="button">Previous</button><span data-fx-part="current">01</span><i data-fx-part="fill"></i><span data-fx-part="total">04</span><button data-fx-part="next" type="button">Next</button></div>
</section>
<section class="s" data-fx="layered-title-slider" data-demo-remove><a data-fx-part="title" href="#">Board to erase</a></section>
<template data-demo-late><section class="s" data-fx="layered-title-slider" data-fx-layered-title-slider="auto: 2; dur: .6"><div data-fx-part="bg"></div><div data-fx-part="bg"></div><a data-fx-part="title" href="#">Late-arrived one</a><a data-fx-part="title" href="#">Late two</a></section></template>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/CustomEase.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
