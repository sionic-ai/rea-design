<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>step-tile-mark — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-spacer { height: 70vh; display: grid; place-items: center; color: var(--kf-dim); }
  .demo { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; padding: 48px 20px; }
  .demo-tiles { position: sticky; top: 120px; display: grid; grid-template-columns: 1fr 1fr; gap: 4%; width: 260px; aspect-ratio: 1; }
  .demo-tiles i { background: var(--kf-accent); }
  .demo-tiles i:nth-child(1) { border-top-left-radius: 100%; } .demo-tiles i:nth-child(2) { border-top-right-radius: 100%; background: var(--kf-ink); }
  .demo-tiles i:nth-child(3) { border-bottom-left-radius: 100%; background: var(--kf-accent-soft); } .demo-tiles i:nth-child(4) { border-bottom-right-radius: 100%; }
  .demo li { padding: 11vh 0; font: 700 40px/1 var(--kf-font-display); }
</style>
</head>
<body>
<p class="demo-hint"><b>step-tile-mark</b> — Scroll down and the step names light up in turn, while the four-page marker on the left aligns one page at a time, clockwise.</p>
<div class="demo-spacer">Scroll down ↓</div>
<section class="demo" data-fx="step-tile-mark" data-fx-step-tile-mark="apart: (max-width: 1px)">
  <div><div class="demo-tiles"><i data-fx-part="tile" data-key="0"></i><i data-fx-part="tile" data-key="1"></i><i data-fx-part="tile" data-key="3"></i><i data-fx-part="tile" data-key="2"></i></div></div>
  <ol><li data-fx-part="step"><span data-fx-part="name">Step one</span></li><li data-fx-part="step"><span data-fx-part="name">Step two</span></li><li data-fx-part="step"><span data-fx-part="name">Step three</span></li><li data-fx-part="step"><span data-fx-part="name">Step four</span></li></ol>
</section>
<div class="demo-spacer"></div>
<script>
(() => {
  const src = document.querySelector('[data-fx~="step-tile-mark"]');
  if (!src) return;
  const html = src.outerHTML;
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => src.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical one comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
