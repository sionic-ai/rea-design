<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cursor-glow-blob — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .field { position: relative; height: 70vh; margin: 20px; border-radius: 8px; background: var(--kf-accent); color: var(--kf-on-accent); }
  .field p { position: relative; padding: 40px; font-size: 28px; }
</style>
</head>
<body>
<p class="demo-hint"><b>cursor-glow-blob</b> — Move the mouse over the screen. A glow blob follows slowly. <span style="color:var(--kf-dim)">(After 1s one more panel comes in, and one leaves 2.5s later)</span></p>
<div class="field" data-fx="cursor-glow-blob"><div data-fx-part="blob"></div><p>Your board text here</p></div>
<div class="field" data-demo-remove data-fx="cursor-glow-blob" data-fx-cursor-glow-blob="lerp: .3; size: 40vw; blur: 8vw"><div data-fx-part="blob"></div><p>Panel to Be Removed</p></div>
<template data-demo-late><div class="field" data-fx="cursor-glow-blob" data-fx-cursor-glow-blob="lerp: .05"><div data-fx-part="blob"></div><p>Late-arriving panel — follows more slowly</p></div></template>
<div class="field" data-fx="cursor-glow-blob"><p>Board with no chunks — should pass quietly</p></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
