<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>center-peek-slider — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="../../_vendor/slick-carousel@1.8.1/slick.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { margin: 0; background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); overflow-x: hidden; }
  .demo-hint { position: sticky; top: 0; z-index: 100; margin: 0; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .cp-stage { max-width: 910px; margin: 40px auto; padding: 0 20px; }
  .cp-photo { border: 2px solid var(--kf-ink); border-radius: var(--kf-radius-md); padding-top: 66.2%; }
  .cp-photo > figure { position: absolute; inset: 0; margin: 0; display: grid; place-items: center; background: var(--kf-accent-soft); color: var(--kf-accent-text); font-weight: 700; }
  .cp-slide h3 { margin: 10px 4px 0; font-size: 18px; }
  @media (max-width: 768px) { .cp-stage { padding: 0 4vw; } }
</style>
</head>
<body>
<p class="demo-hint"><b>center-peek-slider</b> — Advances one slot every 5 seconds. Click or drag the arrows and dots, and hover a slot to see the photo zoom and the arrow flip.</p>
<div class="cp-stage" data-demo-host>
  <div data-fx="center-peek-slider" data-fx-center-peek-slider="delay: 5000; speed: 500">
    <a class="cp-slide" href="#" data-fx-part="slide"><div class="cp-photo" data-fx-part="photo"><figure>Photo 1</figure></div><h3>Cell Title 1</h3></a>
    <a class="cp-slide" href="#" data-fx-part="slide"><div class="cp-photo" data-fx-part="photo"><figure>Photo 2</figure></div><h3>Cell Title 2</h3></a>
    <a class="cp-slide" href="#" data-fx-part="slide"><div class="cp-photo" data-fx-part="photo"><figure>Photo 3</figure></div><h3>Cell Title 3</h3></a>
    <a class="cp-slide" href="#" data-fx-part="slide"><div class="cp-photo" data-fx-part="photo"><figure>Photo 4</figure></div><h3>Cell Title 4</h3></a>
    <a class="cp-slide" href="#" data-fx-part="slide"><div class="cp-photo" data-fx-part="photo"><figure>Photo 5</figure></div><h3>Cell Title 5</h3></a>
  </div>
</div>
<script>
// Late arrivals and removals — checks that fx-core attaches to an element added after 1s and detaches from an element removed after 2.5s
(() => {
  const src = document.querySelector('[data-fx~="center-peek-slider"]');
  if (!src) return;
  const html = src.outerHTML.replace(/\sid="[^"]*"/g, "");
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const host = src.closest("[data-demo-host]") || src;
  const gone = make("gone");
  host.append(gone);
  setTimeout(() => host.append(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical one comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="../../_vendor/jquery@3.7.1/jquery.min.js"></script>
<script src="../../_vendor/slick-carousel@1.8.1/slick.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
