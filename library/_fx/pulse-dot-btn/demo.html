<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pulse-dot-btn — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { display: flex; flex-wrap: wrap; gap: 24px; padding: 48px 20px; align-items: center; }
  .btn { display: inline-flex; align-items: center; padding: 16px 50px 16px 48px; border-radius: var(--kf-radius-sm); background: var(--kf-accent); color: var(--kf-on-accent); font: 500 14px/1.45 var(--kf-font-sans); }
  .btn.is-ink { background: var(--kf-ink); color: var(--kf-bg); }
  .btn.is-trail { padding: 16px 50px 16px 20px; background: var(--kf-surface); color: var(--kf-ink); border: 1px solid var(--kf-line); }
  .btn.is-trail [data-fx-part="dot"] { color: var(--kf-accent); }
  .btn svg { width: 16px; height: 16px; }
</style>
</head>
<body>
<p class="demo-hint"><b>pulse-dot-btn</b> — Hover the button. The dot turns off, the right arrow turns on, and the text slides over. <span style="color:var(--kf-dim)">(After 1s one more button comes in, and after 2.5s one drops out)</span></p>
<section class="demo">
  <a class="btn" href="#" data-fx="pulse-dot-btn"><span data-fx-part="dot"></span><span data-fx-part="label">Get a free quote</span><span data-fx-part="arrow"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M3 8h10M9 4l4 4-4 4"/></svg></span></a>
  <a class="btn is-ink" href="#" data-fx="pulse-dot-btn" data-demo-remove><span data-fx-part="dot"></span><span data-fx-part="label">Soon-Removed Button</span><span data-fx-part="arrow"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M3 8h10M9 4l4 4-4 4"/></svg></span></a>
  <a class="btn is-trail" href="#" data-fx="pulse-dot-btn" data-fx-pulse-dot-btn="look: trailing"><span data-fx-part="dot"></span><span data-fx-part="label">View list</span></a>
  <template data-demo-late><a class="btn is-ink" href="#" data-fx="pulse-dot-btn"><span data-fx-part="dot"></span><span data-fx-part="label">Late-arrived Button</span><span data-fx-part="arrow"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M3 8h10M9 4l4 4-4 4"/></svg></span></a></template>
</section>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
