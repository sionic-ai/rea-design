<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pop-swap-hover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .row { display: grid; grid-template-columns: repeat(3, 240px); gap: 1px; padding: 48px 24px; }
  .cell { display: grid; justify-items: center; padding: 32px 0; border: 1px solid var(--kf-line); font-weight: 700; }
  .cell .wf-img { width: 160px; aspect-ratio: 1; }
  .cell [data-fx-part="after"] { background: var(--kf-accent-soft); }
</style>
</head>
<body>
<p class="demo-hint"><b>pop-swap-hover</b> — Hover over the cell. The before image switches off and the after image pops into place. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<div class="row" id="row">
  <a class="cell" data-fx="pop-swap-hover" href="#a"><div data-fx-part="stage"><div class="wf-img" data-fx-part="after" data-label="After"></div><div class="wf-img" data-fx-part="before" data-label="Before"></div></div><p>Your assignment name here</p></a>
  <a class="cell" data-demo-remove data-fx="pop-swap-hover" href="#b"><div data-fx-part="stage"><div class="wf-img" data-fx-part="after" data-label="After"></div><div class="wf-img" data-fx-part="before" data-label="Before"></div></div><p>Cell to Be Removed</p></a>
</div>
<template data-demo-late><a class="cell" data-fx="pop-swap-hover" href="#c"><div data-fx-part="stage"><div class="wf-img" data-fx-part="after" data-label="After"></div><div class="wf-img" data-fx-part="before" data-label="Before"></div></div><p>Late cell</p></a></template>
<script src="../fx-core.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => document.getElementById("row").append(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
