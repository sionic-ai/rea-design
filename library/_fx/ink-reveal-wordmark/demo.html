<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ink-reveal-wordmark — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-mark { height: 22vw; margin: 40px 20px; font: 300 20vw/1 var(--kf-font-display); }
  .demo-small { height: 10vw; margin: 20px; font: 400 9vw/1 var(--kf-font-display); }
</style>
</head>
<body>
<p class="demo-hint"><b>ink-reveal-wordmark</b> — Letters drop from above and settle. Sweep the mouse over them and ink spreads, revealing solid filled letters.</p>
<div class="demo-mark" data-fx="ink-reveal-wordmark"><span data-fx-part="word">STUDIØ</span></div>
<div class="demo-small" data-fx="ink-reveal-wordmark" data-fx-ink-reveal-wordmark="pixels: 0; dither: 0" data-demo-remove><span data-fx-part="word">To be erased</span></div>
<template data-demo-late><div class="demo-small" data-fx="ink-reveal-wordmark" data-fx-ink-reveal-wordmark="dur: .8; each: .05"><span data-fx-part="word">LATE</span></div></template>
<div class="demo-small" data-fx="ink-reveal-wordmark"></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="three-global.js"></script>
<script src="../../_vendor/three@0.182.0/build/three.cjs"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
