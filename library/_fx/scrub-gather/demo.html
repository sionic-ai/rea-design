<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>scrub-gather — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .gap { height: 60vh; }
  .board { position: relative; display: grid; grid-template-columns: repeat(3, 1fr); gap: 0; width: min(90vw, 900px); margin: 0 auto 120vh; }
  .board .block { height: 22vw; max-height: 220px; background: var(--kf-surface); border: 1px solid var(--kf-line); }
  .board .title { position: absolute; inset: 0; display: grid; place-items: center; font: 700 40px/1 var(--kf-font-display); opacity: 0; transition: opacity 0.4s; }
  .board.is-fx-gathered .title { opacity: 1; }
</style>
</head>
<body>
<p class="demo-hint"><b>scrub-gather</b> — Scroll down. Scattered white panels gather into place as you scroll, and the text appears once all of them have gathered. <span style="color:var(--kf-dim)">(After 1s one more panel comes in, and one leaves 2.5s later)</span></p>
<div class="gap"></div>
<section class="board" data-fx="scrub-gather" data-fx-scrub-gather="start: -300; length: 700">
  <div class="block" data-fx-part="piece" data-key="-424 -256 | -49 -40"></div>
  <div class="block" data-fx-part="piece" data-key="250 -184 | 92 68"></div>
  <div class="block" data-fx-part="piece" data-key="-110 117 | -80 69"></div>
  <div class="block" data-fx-part="piece" data-key="0 188 | 80 67"></div>
  <div class="block" data-fx-part="piece" data-key="-60 -183 | -80 19"></div>
  <div class="block" data-fx-part="piece" data-key="60 -60 | 80 100"></div>
  <p class="title">JOIN us!</p>
</section>
<section class="board" data-fx="scrub-gather" data-fx-scrub-gather="steps: 21; each: 70; start: -400; length: 700">
  <div class="block" data-fx-part="piece" data-key="-430 260"></div>
  <div class="block" data-fx-part="piece" data-key="-150 270"></div>
  <div class="block" data-fx-part="piece" data-key="120 255"></div>
  <div class="block" data-fx-part="piece" data-key="380 265"></div>
  <p class="title">By the stairs</p>
</section>
<section class="board" data-demo-remove data-fx="scrub-gather" data-fx-scrub-gather="start: -500; length: 400; scrub: 0.5">
  <div class="block" data-fx-part="piece" data-key="-200 0"></div><div class="block" data-fx-part="piece" data-key="200 0"></div><div class="block" data-fx-part="piece" data-key="0 200"></div>
</section>
<template data-demo-late><section class="board" data-fx="scrub-gather" data-fx-scrub-gather="start: -400; length: 500"><div class="block" data-fx-part="piece" data-key="-300 -100"></div><div class="block" data-fx-part="piece"></div><div class="block" data-fx-part="piece" data-key="300 100"></div><p class="title">Late</p></section></template>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
