<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>row-shine-sweep — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 2; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .list { width: min(900px, 90vw); margin: 60px auto; border-top: 1px solid var(--kf-line); }
  .list a { display: flex; gap: 8px; padding: 20px 0; border-bottom: 1px solid var(--kf-line); }
  .list time { width: 112px; color: var(--kf-dim); position: relative; }
  .list h3 { font: inherit; position: relative; }
</style>
</head>
<body>
<p class="demo-hint"><b>row-shine-sweep</b> — Hover over the news row with your mouse. <span style="color:var(--kf-dim)">(After 1s one more line comes in, and one leaves 2.5s later)</span></p>
<div class="list">
  <a data-fx="row-shine-sweep" href="#"><span data-fx-part="shine"></span><span data-fx-part="line"></span><time>2026.10.29</time><h3>Your news title in one line goes here</h3></a>
  <a data-fx="row-shine-sweep" href="#" data-demo-remove><span data-fx-part="shine"></span><span data-fx-part="line"></span><time>2026.07.16</time><h3>Line to Be Removed</h3></a>
  <a data-fx="row-shine-sweep" href="#"><time>2025.04.15</time><h3>Line attached without a band (quiet)</h3></a>
  <template data-demo-late><a data-fx="row-shine-sweep" href="#"><span data-fx-part="shine"></span><span data-fx-part="line"></span><time>2025.01.06</time><h3>Late-arriving line</h3></a></template>
</div>
<script src="../fx-core.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
