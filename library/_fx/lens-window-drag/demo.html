<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lens-window-drag — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 500 13px/1.4 var(--kf-font-sans); }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .stage { position: relative; height: 640px; margin: 20px; border: 1px solid var(--kf-line); overflow: hidden; }
  .art { width: 1200px; height: 640px; background: repeating-linear-gradient(45deg, var(--kf-accent-soft) 0 40px, var(--kf-surface) 40px 80px); }
  .art b { position: absolute; left: 520px; top: 220px; font: 700 120px/1 var(--kf-font-display); color: var(--kf-ink); }
  .w { position: absolute; width: 260px; height: 240px; }
</style>
</head>
<body>
<p class="demo-hint"><b>lens-window-drag</b> — Drag the window title bar. Only the window moves, the picture inside stays pinned in place. <span style="color:var(--kf-dim)">(After 1s one more window comes in, and one leaves 2.5s later)</span></p>
<div class="stage" data-demo-stage>
  <div class="w" style="left:80px;top:80px" data-fx="lens-window-drag"><div data-fx-part="bar">image_01.webp</div><div data-fx-part="body"><div data-fx-part="lens"><div class="art"><b>LENS</b></div></div></div></div>
  <div class="w" style="left:420px;top:200px" data-fx="lens-window-drag" data-fx-lens-window-drag="delay: .15"><div data-fx-part="bar">image_02.webp</div><div data-fx-part="body"><div data-fx-part="lens"><div class="art"><b>LENS</b></div></div></div></div>
  <div class="w" style="left:760px;top:120px" data-fx="lens-window-drag" data-fx-lens-window-drag="delay: .3" data-demo-remove><div data-fx-part="bar">Dropped Window</div><div data-fx-part="body"><div data-fx-part="lens"><div class="art"><b>LENS</b></div></div></div></div>
</div>
<template data-demo-late><div class="w" style="left:200px;top:340px" data-fx="lens-window-drag" data-fx-lens-window-drag="shift: 0"><div data-fx-part="bar">Late window</div><div data-fx-part="body"><div data-fx-part="lens"><div class="art"><b>LENS</b></div></div></div></div></template>
<div data-fx="lens-window-drag"></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => document.querySelector("[data-demo-stage]").append(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
