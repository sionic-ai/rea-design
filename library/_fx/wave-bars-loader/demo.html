<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>wave-bars-loader — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 3000; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  main { padding: 120px 40px; }
  .mini { position: relative; height: 240px; margin-top: 40px; overflow: hidden; }
  .mini[data-fx] { position: absolute; }
</style>
</head>
<body>
<p class="demo-hint"><b>wave-bars-loader</b> — Reload — bars fall and stand up as the logo, the color changes, then the curtain lifts (4.7s). <span style="color:var(--kf-dim)">(After 1s one more small curtain comes in, and after 2.5s one leaves)</span></p>
<div data-fx="wave-bars-loader" id="main-loader"><div data-fx-part="logo"></div></div>
<main><p>This text appears once the curtain lifts.</p><div data-fx="wave-bars-loader" data-demo-remove style="position:relative;height:200px" data-fx-wave-bars-loader="hold: 2"><div data-fx-part="logo"><span data-fx-part="bar" style="left:0%" data-h="60" data-b="10"></span><span data-fx-part="bar" style="left:50%" data-h="90" data-b="0"></span></div></div><span data-late-slot></span><div data-fx="wave-bars-loader" style="position:relative;height:80px">Overlays with no bar get nothing applied</div></main>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script>
  const B = [[0, 46, 56], [4.93, 35, 90], [9.86, 89, 26], [14.79, 77, 67], [19.72, 107, 27], [24.65, 86, 37], [29.58, 99, 4], [34.51, 119, 13], [39.44, 102, 8], [44.37, 131, 29], [49.3, 130, 26], [54.23, 114, 53], [59.16, 125, 0], [64.09, 128, 29], [69.02, 140, 5], [73.95, 91, 12], [78.88, 85, 57], [83.81, 105, 18], [88.74, 45, 45], [93.67, 71, 40], [98.6, 46, 56]];
  document.querySelector("#main-loader [data-fx-part=logo]").innerHTML = B.map(([x, h, b]) => `<span data-fx-part="bar" style="left:${x}%" data-h="${h}" data-b="${b}"></span>`).join("");
</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelector("[data-late-slot]").outerHTML = '<div data-fx="wave-bars-loader" style="position:relative;height:200px" data-fx-wave-bars-loader="hold: 2"><div data-fx-part="logo"><span data-fx-part="bar" style="left:20%" data-h="80" data-b="20"></span></div></div>', 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
