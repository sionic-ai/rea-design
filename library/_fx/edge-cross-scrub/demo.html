<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>edge-cross-scrub — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-spacer { height: 80vh; display: grid; place-items: center; color: var(--kf-dim); }
  .stage { position: relative; height: 520px; padding: 60px 20px; background: var(--kf-surface); border-block: 1px solid var(--kf-line); }
  .stage h2 { text-align: center; font-size: 28px; }
  .crawler { width: 240px; }
  .crawler svg { display: block; width: 100%; }
  .crawler .body { fill: var(--kf-accent); }
  .crawler .eye { fill: var(--kf-ink); }
</style>
</head>
<body>
<p class="demo-hint"><b>edge-cross-scrub</b> — Scroll down. The cat at the bottom of the section crawls from the left edge to the right edge as the section passes through the screen.</p>
<div class="demo-spacer">Downward</div>
<section class="stage">
  <h2>Section title slot</h2>
  <div class="crawler" data-fx="edge-cross-scrub"><svg viewBox="0 0 250 100"><path class="body" d="M6 92c4-8 18-14 38-18 14-6 20-24 24-36 4-10 10-14 16-26l10 14c6-2 12-2 18-2l10-16 6 20c6 6 10 10 22 12 20 4 40 10 64 24 20 6 30 12 30 18-10 4-40 2-60 4-50 2-120 4-184 6z"/><circle class="eye" cx="96" cy="46" r="3.4"/><circle class="eye" cx="118" cy="46" r="3.4"/></svg></div>
</section>
<div class="demo-spacer">Bottom margin</div>
<script>
// Late arrivals and removals — checks that fx-core attaches to an element added after 1s and detaches from an element removed after 2.5s
(() => {
  const src = document.querySelector('[data-fx~="edge-cross-scrub"]');
  if (!src) return;
  const html = src.outerHTML.replace(/\sid="[^"]*"/g, "");
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => src.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical one comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
