<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pin-center-open — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .pad { height: 60vh; display: grid; place-items: center; color: var(--kf-dim); }
  .head [data-fx-part="film"] { position: absolute; inset: 0; margin: 0 auto; max-width: 720px; }
  .head [data-fx-part="film"] .wf-img { height: 100%; border: 0; }
  .head h2 { position: absolute; inset: 0; display: grid; place-items: center; font: 400 clamp(48px, 8vw, 104px)/1 var(--kf-font-display); text-align: center; }
</style>
</head>
<body>
<p class="demo-hint"><b>pin-center-open</b> — Scroll down. With the head pinned, the center band opens to both sides and the name letters rise. <span style="color:var(--kf-dim)">(After 1s one more panel comes in, and one leaves 2.5s later)</span></p>
<div class="pad">Downward</div>
<section class="head" data-fx="pin-center-open"><div data-fx-part="film"><div class="wf-img" data-label="Vertical strip video · hand stroking fabric"></div></div><h2 data-fx-part="title">Your product name here</h2></section>
<section class="head" data-demo-remove data-fx="pin-center-open"><div data-fx-part="film"><div class="wf-img" data-label="Panel to be removed soon"></div></div></section>
<template data-demo-late><section class="head" data-fx="pin-center-open" data-fx-pin-center-open="length: 150; at: .5"><div data-fx-part="film"><div class="wf-img" data-label="Late-arriving band"></div></div><h2 data-fx-part="title">Late-arriving name</h2></section></template>
<section data-fx="pin-center-open"></section>
<div class="pad">Footer</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
