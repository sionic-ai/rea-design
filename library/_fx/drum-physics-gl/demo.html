<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>drum-physics-gl — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { margin: 0; background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { height: 78vh; margin: 20px; }
  .demo svg { width: 40%; }
  .demo .line { fill: none; stroke: var(--kf-raised); stroke-width: 5; }
  .demo .fill { fill: var(--kf-surface); }
</style>
</head>
<body>
<p class="demo-hint"><b>drum-physics-gl</b> — Roll the wheel or drag vertically on the panel and the cylinder spins. Press and hold and objects gather toward the cursor, release and they scatter.</p>
<section class="demo" data-fx="drum-physics-gl" data-fx-drum-physics-gl="count: 26">
  <svg data-fx-part="loader" viewBox="-180 -95 360 190" aria-hidden="true">
    <defs><g id="puff"><ellipse cx="-90" cy="-10" rx="60" ry="55"/><ellipse cx="0" cy="0" rx="70" ry="65"/><ellipse cx="90" cy="5" rx="60" ry="55"/><circle cx="-155" cy="0" r="18"/><circle cx="158" cy="4" r="18"/></g></defs>
    <use href="#puff" class="line"/><use href="#puff" class="fill"/>
  </svg>
  <span data-fx-part="card" data-ratio=".75" data-scale=".8" data-label="Poster · black line drawing on white · portrait"></span>
  <span data-fx-part="card" data-ratio="1" data-scale=".6" data-label="Album cover · square"></span>
</section>
<script>
(() => {
  const late = document.createElement("section");
  late.setAttribute("data-fx", "drum-physics-gl");
  late.setAttribute("data-fx-drum-physics-gl", "count: 0; hub: none");
  late.style.height = "60px";
  setTimeout(() => document.body.append(late), 1000);
  setTimeout(() => late.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s an item-less panel comes in and leaves after 2.5s (detach).");
})();
</script>
<script src="../../_vendor/three@0.141.0/build/three.min.js"></script>
<script src="../../_vendor/cannon-es@0.20.0/cannon-es.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
