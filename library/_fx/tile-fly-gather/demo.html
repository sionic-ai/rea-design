<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tile-fly-gather — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: sticky; top: 0; z-index: 60; margin: 0; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .stage { position: relative; width: min(1100px, 94vw); height: 620px; margin: 80vh auto 40vh; }
  .stage h2 { position: absolute; inset: 50% auto auto 50%; transform: translate(-50%, -50%); margin: 0; font: 700 64px/1 var(--kf-font-display); z-index: 3; }
  .stage figure { position: absolute; margin: 0; left: calc(var(--x) * 1%); top: calc(var(--y) * 1%); width: calc(var(--w) * 1%); }
  .stage .wf-img { aspect-ratio: var(--r, 4 / 3); }
</style>
</head>
<body>
<p class="demo-hint"><b>tile-fly-gather</b> — Scroll down. When 30% of the panel is visible, the photos slide into their cells one after another from different directions.</p>
<div class="stage" id="stage" data-fx="tile-fly-gather">
  <h2>Title</h2>
  <figure data-fx-part="tile" data-from="bottom" style="--x: 0; --y: 20; --w: 20; --r: 4 / 5"><div class="wf-img" data-label="Bride sitting on stairs · portrait"></div></figure>
  <figure data-fx-part="tile" data-from="tl" style="--x: 24; --y: 10; --w: 10; --r: 3 / 4"><div class="wf-img" data-label="Couple holding balloons · portrait"></div></figure>
  <figure data-fx-part="tile" data-from="tr" style="--x: 36; --y: 8; --w: 12"><div class="wf-img" data-label="Bride eating bread · landscape"></div></figure>
  <figure data-fx-part="tile" data-from="left" style="--x: 50; --y: 0; --w: 14; --r: 3 / 4"><div class="wf-img" data-label="Bride holding a bouquet · portrait"></div></figure>
  <figure data-fx-part="tile" data-from="right" style="--x: 80; --y: 25; --w: 16; --r: 3 / 4"><div class="wf-img" data-label="Couple walking down an alley · vertical"></div></figure>
  <figure data-fx-part="tile" data-from="bl" style="--x: 12; --y: 70; --w: 14"><div class="wf-img" data-label="Shoe toe · Landscape"></div></figure>
  <figure data-fx-part="tile" data-from="br" style="--x: 62; --y: 72; --w: 16"><div class="wf-img" data-label="Couple at shutter · Landscape"></div></figure>
</div>
<script>
// Late arrivals and removals — after 1 second one more cell comes in (late arrival), and after 2.5 seconds one panel leaves (detach)
(() => {
  const stage = document.getElementById("stage");
  setTimeout(() => { const f = document.createElement("figure"); f.dataset.fxPart = "tile"; f.dataset.from = "top"; f.dataset.i = "8"; f.style.cssText = "--x: 40; --y: 74; --w: 12"; f.innerHTML = '<div class="wf-img" data-label="Late-arriving cell · horizontal"></div>'; stage.append(f); }, 1000);
  const extra = document.createElement("div");
  extra.dataset.fx = "tile-fly-gather";
  document.body.append(extra);
  setTimeout(() => extra.remove(), 2500);
})();
</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
