<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dither-band-reveal — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: sticky; top: 0; z-index: 100; margin: 0; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-rows { display: grid; margin: 40px 0; }
  .demo-row { display: flex; min-height: 90px; }
  .demo-row b { display: grid; place-content: center; padding: 0 16px; background: var(--kf-bg); border: 1px solid var(--kf-ink); border-left: 0; font: 700 44px/1 var(--kf-font-display); }
  .demo-row .band { flex: 1; }
  .demo-tall { height: 70vh; margin: 60vh 20px 40px; display: grid; place-content: center; font: 700 28px/1.4 var(--kf-font-display); }
  .demo-hover { margin: 0 20px 80px; padding: 30px; border: 1px solid var(--kf-ink); font: 700 32px/1.3 var(--kf-font-display); cursor: pointer; }
</style>
</head>
<body>
<p class="demo-hint"><b>dither-band-reveal</b> — On open, text-line strips fill up by spreading into dots in turn. Scrolling down, a large plate rises from below, and hovering the bottom box slides the strips in and out.</p>
<div class="demo-rows">
  <div class="demo-row"><b>Headline row</b><div class="band" data-fx="dither-band-reveal" data-fx-dither-band-reveal="on: load; delay: 0"></div></div>
  <div class="demo-row"><b>Second line</b><div class="band" data-fx="dither-band-reveal" data-fx-dither-band-reveal="on: load; delay: .06"></div></div>
  <div class="demo-row"><b>Third</b><div class="band" data-fx="dither-band-reveal" data-fx-dither-band-reveal="on: load; delay: .12"></div></div>
</div>
<div class="demo-tall" data-fx="dither-band-reveal" data-fx-dither-band-reveal="on: enter; dir: up; angle: 90; dur: 1; delay: .65; at: 0 .2 .55 1; dither: 1 2; look: overlay; enter: 0">Panel rising from below</div>
<div class="demo-hover" data-fx="dither-band-reveal" data-fx-dither-band-reveal="on: event; dur: .4">Raise your hand</div>
<script>
(() => {
  const hov = document.querySelector(".demo-hover");
  hov.addEventListener("pointerenter", () => hov.dispatchEvent(new CustomEvent("fx:in")));
  hov.addEventListener("pointerleave", () => hov.dispatchEvent(new CustomEvent("fx:out")));
  // Late arrivals and removals — checks that fx-core attaches to an element added after 1s and detaches from an element removed after 2.5s
  const rows = document.querySelector(".demo-rows");
  const tpl = rows.firstElementChild.cloneNode(true);
  const make = (txt) => { const r = tpl.cloneNode(true); r.querySelector("b").textContent = txt; return r; };
  const gone = make("Gone");
  rows.append(gone);
  setTimeout(() => rows.append(make("Late row")), 1000);
  setTimeout(() => gone.remove(), 2500);
})();
</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
