<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sticky-dim-stack — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo-spacer { height: 70vh; display: grid; place-items: center; color: var(--kf-dim); }
  [data-fx-part="media"].wf-img { border: 0; }
</style>
</head>
<body>
<p class="demo-hint"><b>sticky-dim-stack</b> Scroll down. The photo panel stays pinned while the next panel covers it. The covered photo recedes to .97 scale and .75 brightness, and the bar on the right fills. <span style="color:var(--kf-dim)">(One more bundle comes in after 1s, and one drops out after 2.5s)</span></p>
<div class="demo-spacer">Scroll down</div>
<section data-demo-remove data-fx="sticky-dim-stack">
  <figure data-fx-part="frame"><span class="wf-img wf-dark" data-fx-part="media" data-label="Excluded group · Photo 1"></span></figure>
  <figure data-fx-part="frame"><span class="wf-img" data-fx-part="media" data-label="Excluded group · Photo 2"></span></figure>
</section>
<section data-fx="sticky-dim-stack">
  <figure data-fx-part="frame"><span class="wf-img wf-dark" data-fx-part="media" data-label="Front Photo 1"></span></figure>
  <figure data-fx-part="frame"><span class="wf-img" data-fx-part="media" data-label="Front Photo 2"></span></figure>
  <figure data-fx-part="frame"><span class="wf-img wf-dark" data-fx-part="media" data-label="Front Photo 3"></span></figure>
  <div data-fx-part="track"><span data-fx-part="line"><span data-fx-part="bar"></span></span></div>
</section>
<template data-demo-late><section data-fx="sticky-dim-stack" data-fx-sticky-dim-stack="scale: .9; bright: .5; scrub: 0; bar-end: 120% 110%">
  <figure data-fx-part="frame"><span class="wf-img wf-dark" data-fx-part="media" data-label="Late-arriving group · .9x · brightness .5 · immediate"></span></figure>
  <figure data-fx-part="frame"><span class="wf-img" data-fx-part="media" data-label="Photo 2"></span></figure>
  <div data-fx-part="track"><span data-fx-part="line"><span data-fx-part="bar"></span></span></div>
</section></template>
<div class="demo-spacer">Footer</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); window.ScrollTrigger?.refresh(); }, 2500);
</script>
</body>
</html>
