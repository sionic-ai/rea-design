<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>slit-open-intro — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .hero { height: 80vh; overflow: hidden; }
  .hero [data-fx-part="frame"] { position: absolute; inset: 0; overflow: hidden; }
  .hero [data-fx-part="scene"] { height: 100%; }
  .hero [data-fx-part="title"] { position: absolute; left: 2vw; bottom: 2vw; margin: 0; font-size: 12vw; line-height: .9; color: var(--kf-contrast-ink); }
  .small { height: 40vh; margin: 20px 4vw; }
  .small .wf-img { height: 100%; }
  button { margin: 12px 20px; }
</style>
</head>
<body>
<p class="demo-hint"><b>slit-open-intro</b> — Watch right on open. A picture shows through a thin gap in the center, then spreads to fill the screen, and the name letters slide in one by one. <span style="color:var(--kf-dim)">(After 1s one more panel comes in, and one leaves 2.5s later)</span></p>
<section class="hero" data-fx="slit-open-intro">
  <div data-fx-part="frame"><div class="wf-img" data-fx-part="scene" data-label="Brick vaulted ceiling · seen from below · landscape 3:2"></div></div>
  <h1 data-fx-part="title">Your name here</h1>
</section>
<p id="done" style="padding: 0 20px">Waiting for fx:done…</p>
<div class="small" data-fx="slit-open-intro" data-fx-slit-open-intro="slit: 40 30; open: 1; peek: .5"><div class="wf-img" data-label="Whole element without panel · fast"></div></div>
<div class="small" data-fx="slit-open-intro" data-demo-remove><div class="wf-img" data-label="Panel to be removed soon"></div></div>
<template data-demo-late><div class="small" data-fx="slit-open-intro"><div class="wf-img" data-label="Late panel"></div></div></template>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
document.querySelector(".hero").addEventListener("fx:done", () => (document.getElementById("done").textContent = "fx:done received — where to re-enable scrolling"));
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
