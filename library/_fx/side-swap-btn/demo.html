<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>side-swap-btn — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 500 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 24px; padding: 48px 20px; }
  .demo a { display: inline-flex; }
  .demo svg { width: 1em; height: 1em; display: block; }
  .demo-card { position: relative; display: flex; flex-direction: column; justify-content: space-between; width: 326px; aspect-ratio: 32 / 13; padding: 16px 12px 12px; border: 0; border-radius: 8px; background: var(--kf-surface); color: var(--kf-ink); font: inherit; text-align: left; cursor: pointer;
    --fx-bg: var(--kf-bg); --fx-ink: var(--kf-ink); }
  .demo-card [data-fx-part="inner"] { position: absolute; top: 8px; right: 12px; font-size: 14px; }
</style>
</head>
<body>
<p class="demo-hint"><b>side-swap-btn</b> — Hover over the button. The panel fills with color and the icon enters from the opposite side. On a card, a corner button unfolds wherever you hover.</p>
<section class="demo">
  <a href="#" data-fx="side-swap-btn"><span data-fx-part="inner"><span data-fx-part="lead"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M3.5 8.5 8.5 3.5M4.5 3.5h4v4"/></svg></span><span data-fx-part="label">Visit the site</span><span data-fx-part="tail"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M3.5 8.5 8.5 3.5M4.5 3.5h4v4"/></svg></span></span></a>
  <a href="#" data-fx="side-swap-btn" data-fx-side-swap-btn="look: start"><span data-fx-part="inner"><span data-fx-part="lead"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M9.5 6h-7M5.5 3 2.5 6l3 3"/></svg></span><span data-fx-part="label">Go back</span><span data-fx-part="tail"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M9.5 6h-7M5.5 3 2.5 6l3 3"/></svg></span></span></a>
  <button class="demo-card" type="button" data-fx="side-swap-btn" data-fx-side-swap-btn="look: expand"><span>Company</span><span>Company name</span><span data-fx-part="inner"><span data-fx-part="lead"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M7.5 2h2.5v2.5M10 2 7 5M4.5 10H2V7.5M2 10l3-3"/></svg></span><span data-fx-part="label">Expand</span><span data-fx-part="tail"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M7.5 2h2.5v2.5M10 2 7 5M4.5 10H2V7.5M2 10l3-3"/></svg></span></span></button>
</section>
<script>
(() => {
  const src = document.querySelector('[data-fx~="side-swap-btn"]');
  if (!src) return;
  const html = src.outerHTML;
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => src.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical one comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="../fx-core.js"></script>
</body>
</html>
