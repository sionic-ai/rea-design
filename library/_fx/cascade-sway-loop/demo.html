<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cascade-sway-loop — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.6 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { display: flex; gap: 40px; padding: 60px 20px; }
  .t { width: 120px; fill: var(--kf-accent); stroke: var(--kf-ink); stroke-width: 2; }
</style>
</head>
<body>
<p class="demo-hint"><b>cascade-sway-loop</b> — Tree layers sway every 2.6s, each delayed .07s from the top. Each tree has a different delay. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<section class="demo">
  <svg class="t" viewBox="0 0 100 100" data-fx="cascade-sway-loop"><g data-fx-part="tier" style="transform-origin:50px 20px"><path d="M50 10 80 45H20Z"/></g><g data-fx-part="tier" style="transform-origin:50px 40px"><path d="M50 30 88 70H12Z"/></g><g data-fx-part="tier" style="transform-origin:50px 60px"><path d="M50 50 95 95H5Z"/></g></svg>
  <svg class="t" viewBox="0 0 100 100" data-fx="cascade-sway-loop" data-fx-cascade-sway-loop="delay: .14" data-demo-remove><g data-fx-part="tier" style="transform-origin:50px 20px"><path d="M50 10 80 45H20Z"/></g><g data-fx-part="tier" style="transform-origin:50px 40px"><path d="M50 30 88 70H12Z"/></g><g data-fx-part="tier" style="transform-origin:50px 60px"><path d="M50 50 95 95H5Z"/></g></svg>
  <svg class="t" viewBox="0 0 100 100" data-fx="cascade-sway-loop" data-fx-cascade-sway-loop="delay: .21; every: 1800"><g data-fx-part="tier" style="transform-origin:50px 20px"><path d="M50 10 80 45H20Z"/></g><g data-fx-part="tier" style="transform-origin:50px 40px"><path d="M50 30 88 70H12Z"/></g><g data-fx-part="tier" style="transform-origin:50px 60px"><path d="M50 50 95 95H5Z"/></g></svg>
  <template data-demo-late><svg class="t" viewBox="0 0 100 100" data-fx="cascade-sway-loop" data-fx-cascade-sway-loop="delay: .07"><g data-fx-part="tier" style="transform-origin:50px 20px"><path d="M50 10 80 45H20Z"/></g><g data-fx-part="tier" style="transform-origin:50px 40px"><path d="M50 30 88 70H12Z"/></g><g data-fx-part="tier" style="transform-origin:50px 60px"><path d="M50 50 95 95H5Z"/></g></svg></template>
</section>

<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
