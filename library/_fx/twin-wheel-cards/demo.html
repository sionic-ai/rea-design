<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>twin-wheel-cards — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-stage { height: 80vh; margin: 20px; border: 1px solid var(--kf-line); border-radius: var(--kf-radius-md); }
  .demo-now { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); pointer-events: none; font: 500 22px/1.2 var(--kf-font-display); }
</style>
</head>
<body>
<p class="demo-hint"><b>twin-wheel-cards</b> — Roll the wheel or drag sideways on the panel. Two wheels spin meshed together and stop at the front cell. Arrow keys also advance it.</p>
<section class="demo-stage" data-fx="twin-wheel-cards" tabindex="0">
  <p class="demo-now">Work 01</p>
  <div data-fx-part="item" data-label="Work photo 01" data-glyph="A"></div>
  <div data-fx-part="item" data-label="Work photo 02" data-glyph="B"></div>
  <div data-fx-part="item" data-label="Work photo 03" data-glyph="C"></div>
  <div data-fx-part="item" data-label="Work photo 04" data-glyph="D"></div>
  <div data-fx-part="item" data-label="Work photo 05" data-glyph="E"></div>
  <div data-fx-part="item" data-label="Work photo 06" data-glyph="F"></div>
  <div data-fx-part="item" data-label="Work photo 07" data-glyph="G"></div>
  <div data-fx-part="item" data-label="Work photo 08" data-glyph="H"></div>
  <div data-fx-part="item" data-label="Work photo 09" data-glyph="I"></div>
</section>
<script>
(() => {
  document.addEventListener("fx:select", (e) => { const n = e.target.querySelector(".demo-now"); if (n) n.textContent = `Work 0${e.detail.index + 1}`; }, true);
  const src = document.querySelector('[data-fx~="twin-wheel-cards"]');
  const html = src.outerHTML;
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => document.body.append(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1 second one more of the same panel comes in at the bottom (late arrival), and after 2.5 seconds one drops out (removal).");
})();
</script>
<script src="../coin-drop-physics/three-global.js"></script>
<script src="../../_vendor/three@0.174.0/build/three.cjs"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
