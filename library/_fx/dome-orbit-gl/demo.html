<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dome-orbit-gl — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .g { height: 80vh; margin: 16px 0; }
</style>
</head>
<body>
<p class="demo-hint"><b>dome-orbit-gl</b> — Roll the wheel. The dome turns like turning your head at the center of a ring of panels, and panels leaving the screen change to the next picture.</p>
<section class="g" data-fx="dome-orbit-gl">
  <figure data-fx-part="item" data-ratio="0.75" data-tone="mid" data-label="Magazine cover · outdoor light"></figure>
  <figure data-fx-part="item" data-ratio="0.7" data-tone="dark" data-video data-label="Vertical portrait video · Dark interior"></figure>
  <figure data-fx-part="item" data-ratio="0.8" data-label="Fashion photo · gray background"></figure>
  <figure data-fx-part="item" data-ratio="0.75" data-tone="mid" data-label="Person, half-length · Window light"></figure>
  <figure data-fx-part="item" data-ratio="1.2" data-label="Landscape scene · evening light"></figure>
  <figure data-fx-part="item" data-ratio="0.75" data-tone="dark" data-label="Black-and-white person · strong side light"></figure>
  <figure data-fx-part="item" data-ratio="0.8" data-label="Product photo · white backdrop"></figure>
</section>
<section class="g" data-fx="dome-orbit-gl" data-demo-remove><figure data-fx-part="item" data-ratio="0.75" data-label="Board to erase"></figure></section>
<template data-demo-late><section class="g" data-fx="dome-orbit-gl" data-fx-dome-orbit-gl="count: 8; sens: 0.4"><figure data-fx-part="item" data-ratio="0.75" data-label="Late panel"></figure></section></template>
<section class="g" data-fx="dome-orbit-gl"></section>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="three-global.js"></script>
<script src="../../_vendor/three@0.184.0/build/three.cjs"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
