<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>slide-settle-in — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 2; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .gap { height: 90vh; }
  .stage { display: flex; justify-content: space-around; padding: 60px; border-top: 1px solid var(--kf-ink); }
  .doodle { width: 200px; fill: var(--kf-accent); stroke: var(--kf-ink); stroke-width: 2; }
</style>
</head>
<body>
<p class="demo-hint"><b>slide-settle-in</b> — Scroll down. The picture hidden at an angle slides down into place. <span style="color:var(--kf-dim)">(After 1s one more picture comes in, and after 2.5s one drops out)</span></p>
<div class="gap"></div>
<section class="stage" id="stage">
  <figure data-fx="slide-settle-in" data-fx-slide-settle-in="zone: section"><svg class="doodle" viewBox="0 0 200 160"><circle cx="100" cy="40" r="30"/><rect x="60" y="74" width="80" height="80" rx="16"/></svg></figure>
  <figure data-fx="slide-settle-in" data-fx-slide-settle-in="x: -80; y: -20; rotate: 8; delay: .24"><svg class="doodle" viewBox="0 0 200 160"><path d="M20 140L100 20l80 120z"/></svg></figure>
  <figure data-fx="slide-settle-in" data-fx-slide-settle-in="x: -8; y: -2; rotate: 1; origin: 20% 50%" data-demo-remove><svg class="doodle" viewBox="0 0 200 160"><rect x="20" y="60" width="160" height="70" rx="20"/></svg></figure>
</section>
<template data-demo-late><figure data-fx="slide-settle-in" data-fx-slide-settle-in="rotate: -12"><svg class="doodle" viewBox="0 0 200 160"><circle cx="100" cy="80" r="60"/></svg></figure></template>
<div class="gap"></div>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => document.getElementById("stage").append(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
