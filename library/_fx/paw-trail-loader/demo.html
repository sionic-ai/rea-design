<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>paw-trail-loader — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { display: flex; flex-wrap: wrap; gap: 24px; padding: 32px 20px; }
  .box { width: min(720px, 100%); height: 360px; border: 1px solid var(--kf-line); border-radius: var(--kf-radius-md); background: var(--kf-surface); }
  .box.is-tall { width: 220px; height: 420px; }
</style>
</head>
<body>
<p class="demo-hint"><b>paw-trail-loader</b> — As soon as it opens, footprints walk diagonally across the panel (the vertical panel on the right keeps walking). <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<section class="demo">
  <div class="box" data-fx="paw-trail-loader"></div>
  <div class="box is-tall" data-fx="paw-trail-loader" data-fx-paw-trail-loader="loop: on; count: 10"></div>
  <div class="box" data-fx="paw-trail-loader" data-fx-paw-trail-loader="path: curve; side: 11"></div>
  <div class="box" data-fx="paw-trail-loader" data-fx-paw-trail-loader="count: 8; cycle: 1.2; each: .2" data-demo-remove></div>
  <template data-demo-late><div class="box" data-fx="paw-trail-loader" data-fx-paw-trail-loader="from: .05 .5; to: .95 .5; side: 18" style="--fx-paw: 28px"></div></template>
</section>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); }, 2500);
</script>
</body>
</html>
