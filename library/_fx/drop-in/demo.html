<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>drop-in — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { padding: 48px 20px; }
  .demo-btn { display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 16px; border: 1px solid var(--kf-line); border-radius: var(--kf-radius-sm); background: var(--kf-surface); color: var(--kf-ink); cursor: pointer; }
  .demo-card { padding: 20px; border: 1px solid var(--kf-line); border-radius: var(--kf-radius-md); background: var(--kf-surface); }
  .demo-spacer { height: 90vh; display: grid; place-items: center; color: var(--kf-dim); }
  .board { position: relative; height: 80vh; border: 18px solid var(--kf-raised); border-radius: var(--kf-radius-sm); background: var(--kf-accent-soft); }
  .board figure { position: absolute; width: 200px; padding: 10px 10px 32px; background: var(--kf-surface); box-shadow: var(--kf-shadow-soft); }
  .board .wf-img { aspect-ratio: 1; height: auto; } .board figcaption { position: absolute; left: 12px; bottom: 6px; font-size: 15px; }
</style>
</head>
<body>
<p class="demo-hint"><b>drop-in</b> — Scroll until the board appears and photo notes drop in and stick, twisted.</p>
<div class="demo-spacer">Scroll down ↓</div><section class="demo"><div class="board" data-fx="drop-in">
<figure style="left:8%;top:10%;rotate:-6deg"><div class="wf-img" data-label="Travel spot instant photo · square"></div><figcaption>Your memo here</figcaption></figure>
<figure style="left:36%;top:6%;rotate:4deg"><div class="wf-img" data-label="Concert ticket stub · landscape"></div><figcaption>Your date here</figcaption></figure>
<figure style="left:64%;top:16%;rotate:-3deg"><div class="wf-img" data-label="Black-and-white photo with friends"></div><figcaption>Your one-liner here</figcaption></figure></div></section><div class="demo-spacer"></div>
<script>
// Late arrivals and removals — checks that fx-core attaches to an element added after 1s and detaches from an element removed after 2.5s
(() => {
  const src = document.querySelector('[data-fx~="drop-in"]');
  if (!src) return;
  const html = src.outerHTML.replace(/\sid="[^"]*"/g, "");
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => (src.closest(".pin-spacer") || src).after(make("late")), 1000); // Once pinned the panel gets wrapped in a pin-spacer, so place it outside that
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical one comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../../../_shared/vendor/gsap/CustomEase.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
