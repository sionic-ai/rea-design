<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pickup-story — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .story { max-width: 900px; margin: 40px auto; padding: 72px 0 120px; overflow: hidden; background: var(--kf-raised); }
  .story h3 { text-align: center; font-size: 18px; }
  .stage { position: relative; height: 240px; margin-top: 24px; }
  .stage [data-fx-part="scene"] { position: absolute; inset: 0; display: grid; place-items: center; }
  .stage [data-fx-part="scene"] .wf-img { width: 50%; aspect-ratio: 2 / 1; border-radius: var(--kf-radius-md); }
  .road { position: relative; height: 90px; margin-top: -60px; }
  .road .wf-img { width: 180px; aspect-ratio: 928 / 434; }
  .crowd { position: absolute; left: 48%; bottom: 0; width: 80px; aspect-ratio: 212 / 248; }
  [data-fx-part="trigger"] { display: flex; align-items: center; gap: 12px; margin: 16px 0 0 40px; padding: 12px 16px; border: 0; border-radius: var(--kf-radius-md); background: var(--kf-surface); }
  [data-fx-part="replay"] { position: absolute; right: 26%; top: 12px; padding: 8px 12px; border: 0; border-radius: var(--kf-radius-sm); background: var(--kf-surface); }
</style>
</head>
<body>
<p class="demo-hint"><b>pickup-story</b> — Click the speech bubble button below. A car arrives, picks up a person and the scene changes. When it ends, Watch again.</p>
<section class="story" data-fx="pickup-story">
  <h3 data-fx-part="title">Your ”We’ll pick you up” title here</h3>
  <div class="stage">
    <div data-fx-part="scene"><span class="wf-img" data-label="Scene 1 · in front of the station"></span></div>
    <div data-fx-part="scene"><span class="wf-img" data-label="Scene 2 · Shop"></span></div>
    <div data-fx-part="scene"><span class="wf-img" data-label="Scene 3 · Procedures complete"></span><button data-fx-part="replay" type="button">View again</button></div>
    <span class="crowd wf-img" data-fx-part="crowd" data-label="People"></span>
  </div>
  <div class="road">
    <span class="wf-img" data-fx-part="car" data-label="Pickup car"></span>
    <span class="wf-img" data-fx-part="car-end" data-label="Rented Car"></span>
  </div>
  <button data-fx-part="trigger" type="button">Speech bubble — I have a lot to carry →</button>
</section>
<script>
(() => {
  const src = document.querySelector('[data-fx~="pickup-story"]');
  if (!src) return;
  const html = src.outerHTML;
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => src.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical one comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
