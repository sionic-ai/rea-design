<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>noise-warp-grid — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 500 13px/1.4 var(--kf-font-sans); }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .stage { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; padding: 20px; }
  .box { position: relative; height: 420px; border: 1px solid var(--kf-line); }
  .box [data-fx] { position: absolute; inset: 0; }
</style>
</head>
<body>
<p class="demo-hint"><b>noise-warp-grid</b> — Just watch. The grid slowly heaves more toward the center (the left one keeps its border straight). <span style="color:var(--kf-dim)">(After 1s one more panel comes in, and one leaves 2.5s later)</span></p>
<div class="stage" data-demo-stage>
  <div class="box"><div data-fx="noise-warp-grid" data-fx-noise-warp-grid="outline: true"></div></div>
  <div class="box"><div data-fx="noise-warp-grid"></div></div>
  <div class="box" data-demo-remove><div data-fx="noise-warp-grid" data-fx-noise-warp-grid="amp: .15; speed: 3"></div></div>
</div>
<template data-demo-late><div class="box"><div data-fx="noise-warp-grid" data-fx-noise-warp-grid="cell: 24"></div></div></template>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => document.querySelector("[data-demo-stage]").append(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
