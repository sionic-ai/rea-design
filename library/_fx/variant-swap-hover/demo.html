<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>variant-swap-hover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { padding: 48px 20px; display: flex; gap: 40px; flex-wrap: wrap; }
  .logo { display: block; width: 240px; height: 80px; font: 800 48px/80px var(--kf-font-display); letter-spacing: -0.02em; }
  .logo span { display: inline-block; }
  .v-bump span { animation: v-bump 0.9s cubic-bezier(0.71, 0, 0.33, 1) both; }
  .v-bump span:nth-child(2n) { animation-delay: 0.06s; }
  .v-squish span { animation: v-squish 0.85s cubic-bezier(0.49, 0, 0.54, 1) both; transform-origin: 50% 50%; }
  .v-slant { font-style: italic; animation: v-slant 0.6s ease-out both; }
  @keyframes v-bump { 30% { transform: translateY(-30%); } 60% { transform: translateY(8%); } }
  @keyframes v-squish { 30% { transform: scale(1.24, 0.21); } 65% { transform: scale(0.9, 1.12); } }
  @keyframes v-slant { from { transform: skewX(-18deg); } }
</style>
</head>
<body>
<p class="demo-hint"><b>variant-swap-hover</b> — Hover over the logo several times — each time a different variation shows through and plays from the start. <span style="color:var(--kf-dim)">(After 1s one more logo comes in, and after 2.5s one drops out)</span></p>
<section class="demo">
  <a class="logo" href="#" data-fx="variant-swap-hover"><span data-fx-part="main">BRAND</span><span class="logo v-bump" data-fx-part="variant"><span>B</span><span>R</span><span>A</span><span>N</span><span>D</span></span><span class="logo v-squish" data-fx-part="variant"><span>B</span><span>R</span><span>A</span><span>N</span><span>D</span></span><span class="logo v-slant" data-fx-part="variant">BRAND</span></a>
  <a class="logo" href="#" data-demo-remove data-fx="variant-swap-hover"><span data-fx-part="main">To be erased</span><span class="logo v-slant" data-fx-part="variant">To be erased</span></a>
  <template data-demo-late><a class="logo" href="#" data-fx="variant-swap-hover" data-fx-variant-swap-hover="fade: 0.15"><span data-fx-part="main">Arrived late</span><span class="logo v-bump" data-fx-part="variant"><span>Late</span><span>Crab</span></span><span class="logo v-slant" data-fx-part="variant">Arrived late</span></a></template>
  <a class="logo" href="#" data-fx="variant-swap-hover"><span data-fx-part="main">No variation</span></a>
</section>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); window.ScrollTrigger?.refresh(); }, 2500);
</script>
</body>
</html>
