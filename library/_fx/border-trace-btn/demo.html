<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>border-trace-btn — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { display: flex; flex-wrap: wrap; gap: 30px; justify-content: center; padding: 80px 20px; }
  .demo a { width: 253px; padding: 0; line-height: 46px; text-align: center; font-weight: 700; letter-spacing: .08em; }
</style>
</head>
<body>
<p class="demo-hint"><b>border-trace-btn</b> — Hover over the button. The four sides are drawn in turn and filled. <span style="color:var(--kf-dim)">(After 1s one more button comes in, and after 2.5s one drops out)</span></p>
<section class="demo">
  <a href="#" data-fx="border-trace-btn"><span data-fx-part="label">View store list</span></a>
  <a href="#" data-fx="border-trace-btn" style="--fx-side: .12s; --fx-gap: .12s"><span data-fx-part="label">Slow drawing</span></a>
  <a href="#" data-demo-remove data-fx="border-trace-btn"><span data-fx-part="label">Disappearing button</span></a>
  <template data-demo-late><a href="#" data-fx="border-trace-btn"><span data-fx-part="label">Late-arriving button</span></a></template>
  <a href="#" data-fx="border-trace-btn"></a>
</section>
<script src="../fx-core.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
