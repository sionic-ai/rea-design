<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>scroll-boost-rows — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { padding: 40vh 0 120vh; display: grid; gap: 64px; }
  .cell { flex-shrink: 0; width: 220px; height: 240px; }
  .cell .wf-img { height: 100%; }
</style>
</head>
<body>
<p class="demo-hint"><b>scroll-boost-rows</b> — Two rows flow in opposite directions. Scroll the page — they speed up, then settle (the late third group has settle: 0 — it speeds up right away in the scroll direction, or reverses). <span style="color:var(--kf-dim)">(After 1s one more line group comes in, and after 2.5s one leaves)</span></p>
<section class="demo">
  <div data-fx="scroll-boost-rows" id="a"></div>
  <div data-fx="scroll-boost-rows" data-demo-remove data-fx-scroll-boost-rows="speed: 1"></div>
  <div data-fx="scroll-boost-rows"></div>
  <template data-demo-late><div data-fx="scroll-boost-rows" data-fx-scroll-boost-rows="cycle: 20; gain: .3; max: 3.33; settle: 0" class="late"></div></template>
</section>
<script>
  const fill = (box) => { box.innerHTML = [0, 1].map((r) => `<div data-fx-part="row"><div data-fx-part="track">${Array.from({ length: 10 }, (_, i) => `<div class="cell"><div class="wf-img" data-label="Photo ${(i % 5) + 1}"></div></div>`).join("")}</div></div>`).join(""); };
  document.querySelectorAll('[data-fx="scroll-boost-rows"]').forEach((b, i) => i < 2 && fill(b));
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => { const n = t.content.firstElementChild.cloneNode(true); fill(n); t.replaceWith(n); }), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
