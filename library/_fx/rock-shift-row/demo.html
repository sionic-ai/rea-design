<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rock-shift-row — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); overflow-x: hidden; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .row { margin: 60px 0; padding-left: 40px; }
  .card { width: 220px; height: 240px; margin-right: 40px; display: grid; place-items: center; border-radius: 10px; background: var(--kf-surface); border: 1px solid var(--kf-line); }
</style>
</head>
<body>
<p class="demo-hint"><b>rock-shift-row</b> — The top row shifts one slot every 3 seconds and the tilt flips, and in the bottom row (peel) the front card tilts away every 4 seconds. <span style="color:var(--kf-dim)">(After 1s one more line comes in, and one leaves 2.5s later)</span></p>
<main id="box">
  <div class="row" data-fx="rock-shift-row"><div data-fx-part="track"><div class="card">1</div><div class="card">2</div><div class="card">3</div><div class="card">4</div><div class="card">5</div><div class="card">6</div></div></div>
  <div class="row" data-fx="rock-shift-row" data-fx-rock-shift-row="look: peel"><div data-fx-part="track"><div class="card">A</div><div class="card">B</div><div class="card">C</div><div class="card">D</div><div class="card">E</div></div></div>
  <div class="row" data-fx="rock-shift-row" data-demo-remove><div data-fx-part="track"><div class="card">Line to be removed soon</div><div class="card">2</div></div></div>
</main>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => { const s = document.createElement("div"); s.className = "row"; s.dataset.fx = "rock-shift-row"; s.setAttribute("data-fx-rock-shift-row", "every: 2"); s.innerHTML = '<div data-fx-part="track"><div class="card">Late 1</div><div class="card">Late 2</div><div class="card">Late 3</div></div>'; document.getElementById("box").append(s); }, 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
