<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>chevron-cursor — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { padding: 64px 20px; display: flex; flex-wrap: wrap; gap: 10px; min-height: 60vh; align-content: start; }
  .demo a, .demo button { padding: 6px 12px; background: var(--kf-surface); border: 0; font: 500 14px/1.2 var(--kf-font-mono); text-transform: uppercase; }
  .demo input { padding: 8px; border: 1px solid var(--kf-line); background: transparent; }
</style>
</head>
<body>
<p class="demo-hint"><b>chevron-cursor</b> — Move the mouse over the panel below and hover the button. The chevrons wander, then gather at the button’s four corners.</p>
<section class="demo" data-fx="chevron-cursor" id="area">
  <a href="#area">Menu 1</a><a href="#area">Menu 2</a><a href="#area">Menu 3</a>
  <button type="button">Let's talk</button>
  <input placeholder="Type here and the text grows larger as you write">
</section>
<script>
(() => {
  const area = document.getElementById("area");
  const twin = area.cloneNode(true);
  twin.id = "twin";
  setTimeout(() => area.after(twin), 1000);
  setTimeout(() => twin.removeAttribute("data-fx"), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another panel comes in, and after 2.5s a part falls off that panel.");
})();
</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
