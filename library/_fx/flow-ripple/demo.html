<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>flow-ripple — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { padding: 40px 20px; display: grid; gap: 40px; }
  .mark { width: min(85vw, 900px); aspect-ratio: 3000 / 1939; margin: 0 auto; }
  .mark canvas[data-fx-part] { width: 100%; height: 100%; }
  .word { margin: 0 auto; font: var(--kf-weight-display) clamp(48px, 10vw, 140px)/1.2 var(--kf-font-display); text-align: center; }
</style>
</head>
<body>
<p class="demo-hint"><b>flow-ripple</b> — Swipe the mouse quickly over the logo·large text. The path left behind trails like waves and the colors split. <span style="color:var(--kf-dim)">(After 1s one more character comes in, and after 2.5s one drops out)</span></p>
<section class="demo">
  <div class="mark" data-fx="flow-ripple"><canvas data-fx-part="image" width="1500" height="970"></canvas></div>
  <h2 class="word" data-fx="flow-ripple">Your name here</h2>
  <h2 class="word" data-demo-remove data-fx="flow-ripple" data-fx-flow-ripple="warp: 0.3; tint: 0.3">Exit text</h2>
  <template data-demo-late><h2 class="word" data-fx="flow-ripple" data-fx-flow-ripple="split: 0.1">Late-arrived Letter</h2></template>
</section>
<script src="../../_vendor/ogl@1.0.11/ogl.min.js"></script>
<script>
// Demo logo: ink-colored square mark + text at the center of a transparent plate (logo image slot)
(() => {
  const c = document.querySelector(".mark canvas"), g = c.getContext("2d", { willReadFrequently: true });
  const css = getComputedStyle(document.documentElement), v = (n) => css.getPropertyValue(n).trim();
  const s = c.height * 0.2, x = c.width * 0.17, y = (c.height - s) / 2;
  g.strokeStyle = g.fillStyle = v("--kf-ink");
  g.lineWidth = s * 0.13;
  g.strokeRect(x + s * 0.065, y + s * 0.065, s * 0.87, s * 0.87);
  g.font = `700 ${s}px ${v("--kf-font-display")}`;
  g.textBaseline = "middle";
  g.fillText("Your logo here", x + s * 1.25, c.height / 2, c.width * 0.83 - x - s * 1.25);
})();
</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
