<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>scatter-collage-reveal — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  html { font-size: 10px; }
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: fixed; top: 0; left: 0; right: 0; z-index: 9; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .pad { height: 70vh; padding: 60px 20px; }
  [data-fx-part] .wf-img { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<p class="demo-hint"><b>scatter-collage-reveal</b> — Scroll down until the board header touches the top of the screen. <span style="color:var(--kf-dim)">(After 1s one more panel comes in, and one leaves 2.5s later)</span></p>
<div class="pad">Section above.</div>
<div data-fx="scatter-collage-reveal">
  <div data-fx-part="cover"><span class="wf-img" data-label="Cover photo · full screen"></span></div>
  <div data-fx-part="stage">
    <div data-fx-part="tile"><span class="wf-img" data-label="Panel 1"></span></div>
    <div data-fx-part="tile"><span class="wf-img" data-label="Panel 2"></span></div>
    <div data-fx-part="tile"><span class="wf-img" data-label="Panel 3"></span></div>
    <div data-fx-part="tile"><span class="wf-img" data-label="Panel 4"></span></div>
    <div data-fx-part="center"><span class="wf-img" data-label="Center Panel"></span></div>
  </div>
</div>
<div class="pad">Section below.</div>
<div data-fx="scatter-collage-reveal" data-demo-remove><div data-fx-part="stage"><div data-fx-part="tile"><span class="wf-img" data-label="Panel to Be Removed"></span></div></div></div>
<div data-fx="scatter-collage-reveal" style="min-height:20vh">Collage without panels</div>
<template data-demo-late><div data-fx="scatter-collage-reveal" data-fx-scatter-collage-reveal="at: enter" style="--fx-size: 30rem"><div data-fx-part="cover"><span class="wf-img" data-label="Late-added cover · 30rem"></span></div><div data-fx-part="stage"><div data-fx-part="tile"><span class="wf-img" data-label="Late panel 1"></span></div><div data-fx-part="tile"><span class="wf-img" data-label="Late panel 2"></span></div></div></div><div class="pad"></div></template>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
