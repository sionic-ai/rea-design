<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ring-reveal-gl — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 500 13px/1.4 var(--kf-font-sans); }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .stage { height: 80vh; }
  .stage [data-fx-part="meta"] { position: absolute; left: 24px; bottom: 24px; z-index: 3; pointer-events: none; }
  .stage [data-fx-part="title"] { font-weight: 900; font-size: 24px; }
  .late { height: 40vh; }
</style>
</head>
<body>
<p class="demo-hint"><b>ring-reveal-gl</b> — The photo panel ring turns slowly. Hover a panel and its color returns, drag sideways and it spins faster while the colors split. <span style="color:var(--kf-dim)">(After 1s one more small ring comes in, and after 2.5s one drops out)</span></p>
<div class="stage" data-fx="ring-reveal-gl" data-fx-ring-reveal-gl="x: 0">
  <a data-fx-part="card" href="#a" data-label="Group photo · Bright interior" data-client="Client A" data-title="Work name one"></a>
  <a data-fx-part="card" href="#b" data-label="Night sign · Neon" data-client="Client B" data-title="Work name two"></a>
  <a data-fx-part="card" href="#c" data-label="Product photo · white background" data-client="Client C" data-title="Work name three"></a>
  <a data-fx-part="card" href="#d" data-label="Athlete · Daytime outdoors" data-client="Client D" data-title="Work name four"></a>
  <a data-fx-part="card" href="#e" data-label="Web screen capture · Landscape" data-client="Client E" data-title="Work name five"></a>
  <a data-fx-part="card" href="#f" data-label="Venue · evening lighting" data-client="Client F" data-title="Work name six"></a>
  <a data-fx-part="card" href="#g" data-label="Magazine cover · front" data-client="Client G" data-title="Work name seven"></a>
  <a data-fx-part="card" href="#h" data-label="Character illustration · Pink" data-client="Client H" data-title="Work name eight"></a>
  <div data-fx-part="meta"><i data-fx-part="client">CLIENT</i><i data-fx-part="title">Title</i></div>
</div>
<div class="late" data-fx="ring-reveal-gl" data-demo-remove><a data-fx-part="card" href="#x" data-label="Photo"></a><a data-fx-part="card" href="#y" data-label="Photo"></a></div>
<template data-demo-late><div class="late" data-fx="ring-reveal-gl" data-fx-ring-reveal-gl="x: 0; radius: 5"><a data-fx-part="card" href="#1" data-label="Photo 1"></a><a data-fx-part="card" href="#2" data-label="Photo 2"></a><a data-fx-part="card" href="#3" data-label="Photo 3"></a><a data-fx-part="card" href="#4" data-label="Photo 4"></a></div></template>
<div data-fx="ring-reveal-gl"></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="three-global.js"></script>
<script src="../../_vendor/three@0.161.0/build/three.cjs"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); }, 2500);
</script>
</body>
</html>
