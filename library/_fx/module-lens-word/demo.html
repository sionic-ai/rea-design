<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>module-lens-word — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 2; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .board { height: 70vh; margin: 20px; background: var(--kf-raised); }
  .board.small { height: 30vh; }
  .board.strip { width: 90px; height: 60vh; }
</style>
</head>
<body>
<p class="demo-hint"><b>module-lens-word</b> — Move the mouse over the panel. Letters farther from the focus widen and bend vertically. The panel below spins its corners on its own.</p>
<div class="board" data-fx="module-lens-word" data-fx-module-lens-word="box: 1296 273"><i data-fx-part="module" data-letter="0" data-rect="0 0 273 92"></i><i data-fx-part="module" data-letter="0" data-rect="92 92 89 181"></i><i data-fx-part="module" data-letter="1" data-rect="301 0 92 273"></i><i data-fx-part="module" data-letter="2" data-rect="421 0 273 92"></i><i data-fx-part="module" data-letter="2" data-rect="513 92 89 181"></i><i data-fx-part="module" data-letter="3" data-rect="722 0 92 273"></i><i data-fx-part="module" data-letter="3" data-rect="814 181 181 92"></i><i data-fx-part="module" data-letter="4" data-rect="1023 0 92 273"></i><i data-fx-part="module" data-letter="4" data-rect="1115 0 181 43"></i><i data-fx-part="module" data-letter="4" data-rect="1115 112 137 49"></i><i data-fx-part="module" data-letter="4" data-rect="1115 181 181 92"></i></div>
<div class="board small" data-fx="module-lens-word" data-fx-module-lens-word="follow: loop; box: 1296 273"><i data-fx-part="module" data-letter="0" data-rect="0 0 273 92"></i><i data-fx-part="module" data-letter="0" data-rect="92 92 89 181"></i><i data-fx-part="module" data-letter="1" data-rect="301 0 92 273"></i><i data-fx-part="module" data-letter="2" data-rect="421 0 273 92"></i><i data-fx-part="module" data-letter="2" data-rect="513 92 89 181"></i><i data-fx-part="module" data-letter="3" data-rect="722 0 92 273"></i><i data-fx-part="module" data-letter="3" data-rect="814 181 181 92"></i><i data-fx-part="module" data-letter="4" data-rect="1023 0 92 273"></i><i data-fx-part="module" data-letter="4" data-rect="1115 0 181 43"></i><i data-fx-part="module" data-letter="4" data-rect="1115 112 137 49"></i><i data-fx-part="module" data-letter="4" data-rect="1115 181 181 92"></i></div>
<div id="later"></div>
<div class="board strip" id="gone" data-fx="module-lens-word" data-fx-module-lens-word="follow: none; box: 1296 273"><i data-fx-part="module" data-letter="0" data-rect="0 0 273 92"></i><i data-fx-part="module" data-letter="0" data-rect="92 92 89 181"></i><i data-fx-part="module" data-letter="1" data-rect="301 0 92 273"></i><i data-fx-part="module" data-letter="2" data-rect="421 0 273 92"></i><i data-fx-part="module" data-letter="2" data-rect="513 92 89 181"></i><i data-fx-part="module" data-letter="3" data-rect="722 0 92 273"></i><i data-fx-part="module" data-letter="3" data-rect="814 181 181 92"></i><i data-fx-part="module" data-letter="4" data-rect="1023 0 92 273"></i><i data-fx-part="module" data-letter="4" data-rect="1115 0 181 43"></i><i data-fx-part="module" data-letter="4" data-rect="1115 112 137 49"></i><i data-fx-part="module" data-letter="4" data-rect="1115 181 181 92"></i></div>
<script>
  // Grab the fragment markup now. After 1s the plate may already be detached (detach test)
  const modules = document.querySelector(".board").innerHTML;
  setTimeout(() => { document.getElementById("later").innerHTML = '<div class="board small" data-fx="module-lens-word" data-fx-module-lens-word="follow: loop; each: .4; box: 1296 273">' + modules + '</div>'; }, 1000);
  setTimeout(() => document.getElementById("gone").remove(), 1500);
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
