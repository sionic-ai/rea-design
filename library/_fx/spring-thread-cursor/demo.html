<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>spring-thread-cursor — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); min-height: 100vh; }
  .demo-hint { position: sticky; top: 0; z-index: 101; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { padding: 48px 20px; min-height: 80vh; }
</style>
</head>
<body>
<p class="demo-hint"><b>spring-thread-cursor</b> — Move the mouse from one edge of the screen to the other. A bundle of threads follows (windows 1121px and wider).</p>
<section class="demo">
  <canvas data-fx="spring-thread-cursor" data-demo-remove></canvas>
  <template data-demo-late><canvas data-fx="spring-thread-cursor" data-fx-spring-thread-cursor="trails: 6; alpha: .35; min: 0"></canvas></template>
</section>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
