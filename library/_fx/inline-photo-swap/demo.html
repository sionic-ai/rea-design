<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>inline-photo-swap — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { padding: 48px 20px; display: grid; gap: 40px; }
  .demo-title { display: flex; align-items: center; justify-content: center; font: 700 64px/1.1 var(--kf-font-display); }
  .demo-title .wf-img { height: auto; }
  .demo-turn { position: relative; display: inline-flex; margin-left: 12px; padding: 0; border: 0; background: none; }
  .demo-turn > span { display: flex; align-items: center; justify-content: center; width: 24px; height: 24px; border: 1px dashed currentColor; border-radius: 50%; }
  .demo-turn svg { width: 12px; height: 12px; }
  .demo-stack { position: relative; display: flex; align-items: flex-end; font: 700 40px/1 var(--kf-font-display); gap: 12px; }
  .demo-stack .pair { position: relative; }
  .demo-stack [data-fx-part] { --fx-w: 160px; }
</style>
</head>
<body>
<p class="demo-hint"><b>inline-photo-swap</b> — Photos between the titles unfold alternately every 8.5s. Click the dotted circle to switch immediately.</p>
<section class="demo" id="box">
  <p class="demo-title" data-fx="inline-photo-swap" id="src">
    <span>Learning</span>
    <span data-fx-part="a" style="--fx-rest-gap: .1875em"><span class="wf-img" data-label="Child’s hand · Blocks · 3:2"></span></span>
    <span>Play</span>
    <span data-fx-part="b"><span class="wf-img" data-label="Drawing · 3:2"></span></span>
    <button class="demo-turn" type="button" data-fx-part="button" aria-label="Change Photo"><span><svg viewBox="0 0 12 12" fill="none" stroke="currentColor"><path d="M2 6a4 4 0 0 1 7-2.6M10 6a4 4 0 0 1-7 2.6"/></svg></span></button>
  </p>
  <div class="demo-stack" data-fx="inline-photo-swap" data-fx-inline-photo-swap="look: stack; every: 3">
    <span>Wordmark</span>
    <span class="pair"><span data-fx-part="a"><span class="wf-img" data-label="Classroom · 3:2"></span></span><span data-fx-part="b"><span class="wf-img" data-label="Playground · 3:2"></span></span></span>
  </div>
</section>
<script>
(() => {
  const src = document.getElementById("src");
  const html = src.outerHTML.replace(/\sid="[^"]*"/g, "");
  const make = () => { const t = document.createElement("template"); t.innerHTML = html; return t.content.firstElementChild; };
  const gone = make();
  src.after(gone);
  setTimeout(() => src.after(make()), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1 second one more heading comes in (a late arrival), and after 2.5 seconds one is removed (detach).");
})();
</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
