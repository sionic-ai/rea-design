<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>backdrop-hover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.6 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .rows { width: min(90%, 1000px); margin: 80px auto; display: grid; gap: 10px; }
  .row { display: flex; align-items: flex-end; justify-content: space-between; width: 100%; aspect-ratio: 5 / 1; padding: 20px 28px; border: 1px solid var(--kf-line); background: transparent; font: 400 48px/1 var(--kf-font-display); color: var(--kf-ink); text-align: left; cursor: pointer; }
  .row small { font-size: 13px; }
</style>
</head>
<body>
<p class="demo-hint"><b>backdrop-hover</b> — Hover over a row. The whole screen is lightly tinted with that row’s photo. <span style="color:var(--kf-dim)">(After 1s one more line comes in, and one leaves 2.5s later)</span></p>
<div class="rows">
  <button class="row" type="button" data-fx="backdrop-hover" style="--fx-bg: radial-gradient(circle at 30% 40%, var(--kf-accent), transparent 60%)">01 <small>View</small></button>
  <button class="row" type="button" data-fx="backdrop-hover" style="--fx-bg: linear-gradient(120deg, var(--kf-ink), var(--kf-accent))">02 <small>View</small></button>
  <button class="row" type="button" data-fx="backdrop-hover" data-demo-remove>03 <small>View</small></button>
  <template data-demo-late><button class="row" type="button" data-fx="backdrop-hover" style="--fx-amount: .35; --fx-dur: .4s">04 <small>View · Bold · .4s</small></button></template>
  <div data-fx="backdrop-hover"></div>
</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
