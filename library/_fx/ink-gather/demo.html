<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ink-gather — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .stage { height: 80vh; margin: 24px 20px; display: grid; place-items: center; overflow: hidden; border: 1px solid var(--kf-line); cursor: pointer; }
  .stage svg { height: 70%; width: auto; overflow: visible; }
  .stage path { fill: none; stroke: currentColor; stroke-width: 140; stroke-linecap: round; stroke-linejoin: round; }
  .stage--small { height: 50vh; }
</style>
</head>
<body>
<p class="demo-hint"><b>ink-gather</b> — Ink gathers into a symbol. Move the mouse over the symbol, and click to redraw it in a different color scheme. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<section class="stage" data-fx="ink-gather" tabindex="0"><svg data-fx-part="mark" viewBox="0 0 730 900" aria-hidden="true"><path d="M620 800L300 420C200 300 220 130 360 130C480 130 510 270 420 350L230 500C120 590 140 790 320 790C450 790 540 700 610 560"/></svg></section>
<section class="stage stage--small" data-demo-remove data-fx="ink-gather"><svg data-fx-part="mark" viewBox="0 0 400 300" aria-hidden="true"><path d="M40 220C120 60 200 60 200 150S280 240 360 80" style="stroke-width:60"/></svg></section>
<section class="stage stage--small" data-fx="ink-gather"><p>Panel with no symbol — nothing attached</p></section>
<template data-demo-late><section class="stage stage--small" data-fx="ink-gather" data-fx-ink-gather="dur: 1.2; pools: 48"><svg data-fx-part="mark" viewBox="0 0 600 300" aria-hidden="true"><path d="M60 150H540" style="stroke-width:90"/></svg></section></template>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
