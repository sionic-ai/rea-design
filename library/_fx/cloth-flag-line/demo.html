<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cloth-flag-line — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .wrap { padding: 48px 24px 64px; }
  .pic { display: block; aspect-ratio: 3 / 4; border-radius: 8px; background: var(--kf-surface); }
  .nm { display: block; margin-top: 8px; font-size: 13px; }
</style>
</head>
<body>
<p class="demo-hint"><b>cloth-flag-line</b> — Sweep the mouse quickly over the photo — photos pinned on a line get pushed like cloth and sway in the wind.</p>
<div class="wrap">
  <div data-fx="cloth-flag-line" data-flags='[{"name":"Client 01","label":"Product photo"},{"name":"Client 02","label":"Character"},{"name":"Client 03","label":"Signboard"},{"name":"Client 04","label":"Screen"}]'>
    <canvas data-fx-part="canvas" aria-hidden="true"></canvas>
    <svg data-fx-part="rope" aria-hidden="true"><path/><g data-fx-part="pegs"></g></svg>
    <ul data-fx-part="list">
      <li><a href="#"><span class="pic" data-fx-part="pic"></span><span class="nm" data-fx-part="name">Client 01</span></a></li>
      <li><a href="#"><span class="pic" data-fx-part="pic"></span><span class="nm" data-fx-part="name">Client 02</span></a></li>
      <li><a href="#"><span class="pic" data-fx-part="pic"></span><span class="nm" data-fx-part="name">Client 03</span></a></li>
      <li><a href="#"><span class="pic" data-fx-part="pic"></span><span class="nm" data-fx-part="name">Client 04</span></a></li>
    </ul>
  </div>
</div>
<script>
// Late arrivals and removals — checks that fx-core attaches to an element added after 1s and detaches from an element removed after 2.5s
(() => {
  const src = document.querySelector('[data-fx~="cloth-flag-line"]');
  if (!src) return;
  const html = src.outerHTML.replace(/\sid="[^"]*"/g, "");
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => src.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical one comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
