<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pop-magnet-fall-cards — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { padding: 16px 20px; font: 500 13px/1.4 var(--kf-font-mono); }
  .stage { height: 80vh; background: var(--kf-contrast-bg); }
  .stage [data-fx-part="card"] { width: 24vw; aspect-ratio: 1.75; }
  .stage [data-fx-part="inner"] { display: grid; width: 100%; height: 100%; place-items: center; border-radius: var(--kf-radius-lg); background: var(--kf-surface); color: var(--kf-ink); font: 600 28px/1 var(--kf-font-display); }
  .stage [data-fx-part="card"]:nth-child(2n) [data-fx-part="inner"] { background: var(--kf-accent); color: var(--kf-on-accent); }
  .spacer { height: 40vh; display: grid; place-items: center; color: var(--kf-dim); }
</style>
</head>
<body>
<p class="demo-hint"><b>pop-magnet-fall-cards</b> — Hover over a card and drag it, press to drop it (when all have dropped they bounce back up). (after 1s one more panel comes in, after 2.5s one drops out)</p>
<section class="stage" data-fx="pop-magnet-fall-cards"><div data-fx-part="card"><div data-fx-part="inner">Award</div></div><div data-fx-part="card"><div data-fx-part="inner">Prize</div></div><div data-fx-part="card"><div data-fx-part="inner">Medal</div></div><div data-fx-part="card"><div data-fx-part="inner">Badge</div></div><div data-fx-part="card"><div data-fx-part="inner">Star</div></div></section>
<div class="spacer">Below</div>
<section data-demo-remove class="stage" data-fx="pop-magnet-fall-cards" data-fx-pop-magnet-fall-cards="pull: 0; dur: .5"><div data-fx-part="card"><div data-fx-part="inner">No Drag</div></div></section>
<template data-demo-late><section class="stage" data-fx="pop-magnet-fall-cards" data-fx-pop-magnet-fall-cards="start: top 60%"><div data-fx-part="card"><div data-fx-part="inner">Late</div></div><div data-fx-part="card"><div data-fx-part="inner">Late</div></div></section></template>
<section class="stage" data-fx="pop-magnet-fall-cards"></section>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script>gsap.registerPlugin(ScrollTrigger);</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); window.ScrollTrigger?.refresh(); }, 2500);
</script>
</body>
</html>
