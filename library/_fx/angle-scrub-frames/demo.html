<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>angle-scrub-frames — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-spacer { height: 80vh; display: grid; place-items: center; color: var(--kf-dim); }
  .demo-stack { display: grid; gap: 60px; justify-items: center; padding: 20vh 20px; }
  .demo-stack [data-fx-part="layer"] { width: min(640px, 90vw); }
  .demo-stack svg { width: 100%; height: auto; overflow: visible; }
  .face-top { fill: var(--kf-surface); stroke: var(--kf-line); }
  .face-front { fill: color-mix(in oklab, var(--kf-ink) 70%, var(--kf-bg)); }
  .face-bottom { fill: color-mix(in oklab, var(--kf-ink) 40%, var(--kf-bg)); }
</style>
</head>
<body>
<p class="demo-hint"><b>angle-scrub-frames</b> — Scroll down. The panel flips stepwise from an angle seen from above to one seen from below. <span style="color:var(--kf-dim)">(After 1s one more panel comes in, and one leaves 2.5s later)</span></p>
<div class="demo-spacer">Scroll down</div>
<div class="demo-stack" data-fx="angle-scrub-frames">
  <div data-fx-part="layer" data-frames="0,20,27">
    <svg viewBox="0 0 640 200"><rect class="face-top" data-fx-part="top" x="20" y="20" width="600" height="80"/><rect class="face-front" x="20" y="100" width="600" height="50"/><rect class="face-bottom" data-fx-part="bottom" x="20" y="150" width="600" height="40"/></svg>
  </div>
  <div data-fx-part="layer" data-frames="0,3,6">
    <div data-fx-part="frame" class="wf-img wf-r-21x9" data-label="Cut 0"></div><div data-fx-part="frame" class="wf-img wf-r-21x9" data-label="Cut 1"></div><div data-fx-part="frame" class="wf-img wf-r-21x9" data-label="Cut 2"></div><div data-fx-part="frame" class="wf-img wf-r-21x9" data-label="Cut 3"></div><div data-fx-part="frame" class="wf-img wf-r-21x9" data-label="Cut 4"></div><div data-fx-part="frame" class="wf-img wf-r-21x9" data-label="Cut 5"></div><div data-fx-part="frame" class="wf-img wf-r-21x9" data-label="Cut 6"></div>
  </div>
</div>
<div class="demo-stack" data-demo-remove data-fx="angle-scrub-frames"><div data-fx-part="layer"><svg viewBox="0 0 640 160"><rect class="face-top" data-fx-part="top" x="20" y="10" width="600" height="60"/><rect class="face-front" x="20" y="70" width="600" height="40"/></svg></div></div>
<template data-demo-late><div class="demo-stack" data-fx="angle-scrub-frames"><div data-fx-part="layer" data-frames="0,12,26"><svg viewBox="0 0 640 160"><rect class="face-top" data-fx-part="top" x="120" y="10" width="400" height="60" rx="30"/><rect class="face-front" x="120" y="70" width="400" height="30" rx="12"/><rect class="face-bottom" data-fx-part="bottom" x="120" y="100" width="400" height="40" rx="20"/></svg></div></div></template>
<div class="demo-spacer"></div>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
