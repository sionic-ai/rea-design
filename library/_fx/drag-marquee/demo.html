<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>drag-marquee — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { padding: 48px 20px; }
  .demo-spacer { height: 90vh; display: grid; place-items: center; color: var(--kf-dim); }

  .strip { height: 220px; }
  .stk { flex: 0 0 auto; width: 170px; height: 86px; margin-right: 80px; border-radius: 12px; background: var(--kf-surface); border: 2px solid var(--kf-ink); box-shadow: 0 6px 0 color-mix(in srgb, var(--kf-ink) 15%, transparent); display: grid; place-items: center; font: 600 11px/1 var(--kf-font-display); }
  .stk.r { width: 104px; height: 104px; border-radius: 50%; }
</style>
</head>
<body>
<p class="demo-hint"><b>drag-marquee</b> — The sticker strip flows on its own. Drag and fling it. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<section class="demo"><div data-demo-remove class="strip" data-fx="drag-marquee" data-fx-drag-marquee="scatter: true"><div data-fx-part="track">
  <span class="stk">Logo 1</span><span class="stk r">Logo 2</span><span class="stk">Logo 3</span><span class="stk">Logo 4</span><span class="stk r">Logo 5</span><span class="stk">Logo 6</span>
</div></div><div class="strip" data-fx="drag-marquee" data-fx-drag-marquee="scatter: true"><div data-fx-part="track">
  <span class="stk">Logo 1</span><span class="stk r">Logo 2</span><span class="stk">Logo 3</span><span class="stk">Logo 4</span><span class="stk r">Logo 5</span><span class="stk">Logo 6</span>
</div></div><template data-demo-late><div class="strip" data-fx="drag-marquee" data-fx-drag-marquee="scatter: true"><div data-fx-part="track">
  <span class="stk">Logo 1</span><span class="stk r">Logo 2</span><span class="stk">Logo 3</span><span class="stk">Logo 4</span><span class="stk r">Logo 5</span><span class="stk">Logo 6</span>
</div></div></template></section>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/Draggable.min.js"></script>
<script src="../../../_shared/vendor/gsap/InertiaPlugin.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); window.ScrollTrigger?.refresh(); }, 2500);
</script>
</body>
</html>
