<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>alpha-clip-canvas — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { display: flex; flex-wrap: wrap; gap: 24px; align-items: center; padding: 32px; }
  .demo canvas { height: 360px; border-radius: var(--kf-radius-lg); background: var(--kf-raised); }
  .demo canvas.small { height: 180px; }
  .state { font: 500 13px/1.4 var(--kf-font-mono); color: var(--kf-dim); }
</style>
</head>
<body>
<p class="demo-hint"><b>alpha-clip-canvas</b> — Hover over the character (on the artwork only) and the cursor becomes a finger. Press and a look-back clip plays, with fx:open firing halfway. <span style="color:var(--kf-dim)">(After 1s one more canvas comes in, and after 2.5s one is removed)</span></p>
<section class="demo">
  <canvas data-fx="alpha-clip-canvas" data-fx-alpha-clip-canvas="loop: media/typing.webm; idles: media/rhythm.webm; click: media/click-pose.webm; idle-after: 4000" role="button" aria-label="Talk to the character"></canvas>
  <canvas class="small" data-demo-remove data-fx="alpha-clip-canvas" data-fx-alpha-clip-canvas="loop: media/typing.webm"></canvas>
  <template data-demo-late><canvas class="small" data-fx="alpha-clip-canvas" data-fx-alpha-clip-canvas="loop: media/rhythm.webm; click: media/click-pose.webm"></canvas></template>
  <p class="state" aria-live="polite">Event: none yet</p>
</section>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
const state = document.querySelector(".state");
["fx:hover", "fx:leave", "fx:pick", "fx:open"].forEach((t) => document.addEventListener(t, () => (state.textContent = `Events: ${t}`)));
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
