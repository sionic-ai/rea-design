<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tilt-rise-in — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.6 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo-spacer { height: 80vh; display: grid; place-items: center; color: var(--kf-dim); }
  .row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 40px; width: min(90%, 1000px); margin: 0 auto 120px; }
  .card { display: block; }
  .card i { display: block; aspect-ratio: 16 / 9; background: linear-gradient(135deg, var(--kf-accent), var(--kf-raised) 60%, var(--kf-ink)); }
  .card p { margin-top: 16px; }
</style>
</head>
<body>
<p class="demo-hint"><b>tilt-rise-in</b> Scroll down and cards rise tilted forward, then flatten out and stand. Scroll back up and they tilt again. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<div class="demo-spacer">Scroll down</div>
<div class="row">
  <a class="card" data-fx="tilt-rise-in" href="#"><i></i><p>Model 1</p></a>
  <a class="card" data-fx="tilt-rise-in" href="#"><i></i><p>Model 2</p></a>
  <a class="card" data-fx="tilt-rise-in" data-fx-tilt-rise-in="back: false" href="#" data-demo-remove><i></i><p>A card that stops just once</p></a>
  <template data-demo-late><a class="card" data-fx="tilt-rise-in" href="#"><i></i><p>Late-arriving card</p></a></template>
</div>
<div data-fx="tilt-rise-in"></div>
<div class="demo-spacer">Footer</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
