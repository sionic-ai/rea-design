<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>frame-bleed-snap — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: fixed; top: 0; left: 0; right: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .copy { position: fixed; top: 60px; left: 0; width: 100%; text-align: center; font: 700 48px/1.3 var(--kf-font-display); }
  .frame { position: fixed; left: 0; width: 100%; height: 100vh; --fx-top: 28vh; }
  .frame [data-fx-part="media"] { height: 100%; }
  .frame .wf-img { height: 100%; }
  .page { position: relative; z-index: 2; margin-top: 230vh; min-height: 120vh; padding: 60px 20px; background: var(--kf-surface); }
  @media (max-width: 768px) { .frame { --fx-inset: 0px; --fx-radius: 0px; } }
</style>
</head>
<body>
<p class="demo-hint"><b>frame-bleed-snap</b> — Scroll just a little. The round photo panel attaches upward over 1.6 seconds and expands to a full screen. Back at the top it becomes round again.</p>
<p class="copy">Your big phrase here</p>
<div class="frame" data-fx="frame-bleed-snap"><div data-fx-part="media"><div class="wf-img" data-label="Large photo · full-width band"></div></div></div>
<main class="page"><p>Your body text continues here.</p></main>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
  setTimeout(() => {
    const extra = document.createElement("div");
    extra.dataset.fx = "frame-bleed-snap";
    extra.style.cssText = "position:relative;height:200px;margin:40px 0;--fx-inset:40px;--fx-radius:30px";
    extra.innerHTML = '<div data-fx-part="media" style="height:100%"><div class="wf-img" style="height:100%" data-label="Panel added after 1s"></div></div>';
    document.querySelector(".page").append(extra);
  }, 1000);
</script>
</body>
</html>
