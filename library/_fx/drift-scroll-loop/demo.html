<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>drift-scroll-loop — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { margin: 0; padding: 12px 20px; border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 24px; padding: 24px 20px; }
  .list { height: 360px; border: 1px solid var(--kf-line); font: 500 40px/1 var(--kf-font-display); letter-spacing: -0.02em; white-space: nowrap; }
  .row { display: flex; gap: 0.4em; padding: 0 12px; }
  .row span:first-child { width: 3.4em; color: var(--kf-dim); }
</style>
</head>
<body>
<p class="demo-hint"><b>drift-scroll-loop</b> — The list rises from below and flows on its own. Push it up and down with the wheel — it continues from that spot and never ends.</p>
<section class="demo" id="demo">
  <div class="list" data-fx="drift-scroll-loop">
    <div data-fx-part="set">
      <div class="row"><span>Less</span><span>Lorem</span></div>
      <div class="row"><span>More</span><span>Ipsum</span></div>
      <div class="row"><span>Less</span><span>Dolor sit</span></div>
      <div class="row"><span>More</span><span>Amet</span></div>
      <div class="row"><span>Less</span><span>Consectetur</span></div>
      <div class="row"><span>More</span><span>Adipiscing</span></div>
    </div>
  </div>
  <div class="list" id="gone" data-fx="drift-scroll-loop" data-fx-drift-scroll-loop="speed: 2; start: top">
    <div data-fx-part="set">
      <div class="row"><span>01</span><span>Panel to be removed soon</span></div>
      <div class="row"><span>02</span><span>Twice as fast</span></div>
      <div class="row"><span>03</span><span>Filled from the start</span></div>
    </div>
  </div>
</section>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Checks whether it attaches to a late-arriving panel (after 1s) and whether detach runs when the panel is removed (after 2.5s)
(() => {
  setTimeout(() => {
    const late = document.createElement("div");
    late.className = "list";
    late.setAttribute("data-fx", "drift-scroll-loop");
    late.innerHTML = '<div data-fx-part="set"><div class="row"><span>Late</span><span>Late panel</span></div><div class="row"><span>Late</span><span>One more line</span></div></div>';
    document.getElementById("demo").append(late);
  }, 1000);
  setTimeout(() => document.getElementById("gone")?.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s one more panel comes in, and after 2.5s one leaves.");
})();
</script>
</body>
</html>
