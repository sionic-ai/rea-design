<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>letter-hop-title — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo-spacer { height: 90vh; display: grid; place-items: center; color: var(--kf-dim); }
  .t { padding: 60px 24px; }
  .t p { font: 400 64px/1 var(--kf-font-display); color: var(--kf-accent); }
  .t h2 { margin-top: 8px; font-size: 18px; }
  .t ul { display: flex; gap: 12px; margin-top: 24px; }
  .t li { flex: 1; height: 120px; border-radius: var(--kf-radius-md); background: var(--kf-surface); }
</style>
</head>
<body>
<p class="demo-hint"><b>letter-hop-title</b> — Scroll down — English letters pop up one by one, followed by the subtitle and list.</p>
<div class="demo-spacer">↓ Scroll</div>
<header class="t" data-demo-remove data-fx="letter-hop-title"><p data-fx-part="letters">Removed</p><h2 data-fx-part="sub">Title to Remove</h2></header>
<header class="t" data-fx="letter-hop-title"><p data-fx-part="letters">How to enjoy</p><h2 data-fx-part="sub">How to enjoy</h2><ul><li data-fx-part="follow"></li><li data-fx-part="follow"></li><li data-fx-part="follow"></li></ul></header>
<template data-demo-late><header class="t" data-fx="letter-hop-title" data-fx-letter-hop-title="each: .12; hop: 20px"><p data-fx-part="letters">Late title</p></header></template>
<header class="t" data-fx="letter-hop-title"></header>
<div class="demo-spacer">Footer</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script>gsap.registerPlugin(ScrollTrigger);</script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); window.ScrollTrigger?.refresh(); }, 2500);
</script>
</body>
</html>
