<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>char-stagger-tint — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { padding: 48px 20px; }
  .demo-spacer { height: 90vh; display: grid; place-items: center; color: var(--kf-dim); }
  .links a { display: block; margin: 8px 0; font: 500 32px/1.2 var(--kf-font-display); }
</style>
</head>
<body>
<p class="demo-hint"><b>char-stagger-tint</b> — Hover over the link and then release. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<section class="demo links">
  <a href="#" data-fx="char-stagger-tint">Your menu link here</a>
  <a href="#" data-fx="char-stagger-tint" data-demo-remove>Product design</a>
  <a href="#" data-fx="char-stagger-tint" style="--fx-tint: var(--kf-accent-text)" data-fx-char-stagger-tint="each: .08">Slowly tinting link</a>
  <a href="#" data-fx="char-stagger-tint"></a>
  <template data-demo-late><a href="#" data-fx="char-stagger-tint">Late-arrived Link</a></template>
</section>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); window.ScrollTrigger?.refresh(); }, 2500);
</script>
</body>
</html>
