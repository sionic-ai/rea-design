<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>side-veil-hover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { margin: 0; padding: 12px 20px; border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .row { display: flex; flex-wrap: wrap; gap: 24px; justify-content: center; padding: 48px 20px; }
  .pill { display: flex; align-items: center; justify-content: space-between; gap: 24px; min-width: 258px; padding: 14px 16px 14px 40px; border-radius: 999px; color: var(--kf-surface); background: var(--kf-ink); font-weight: 700; }
  .pill [data-fx-part="icon"] { width: 32px; aspect-ratio: 1; border-radius: 50%; background: var(--kf-surface); }
</style>
</head>
<body>
<p class="demo-hint"><b>side-veil-hover</b> — Hover over the button, then move away. The curtain enters from the right and exits to the right.</p>
<div class="row" id="row">
  <a class="pill" href="#" data-fx="side-veil-hover">Explore the work<span data-fx-part="icon"></span></a>
  <a class="pill" href="#" data-fx="side-veil-hover">Button to be removed soon<span data-fx-part="icon"></span></a>
</div>
<script>
// CSS-only part — check that it also catches late-arriving buttons and that deleted buttons don’t linger
(() => {
  // The button to be added late is floated first — so the clone doesn’t read null even if an inspector tool removes all buttons 1 second earlier
  const row = document.getElementById("row"), gone = row.children[1], late = row.firstElementChild.cloneNode(true);
  late.firstChild.textContent = "Late-arrived Button";
  setTimeout(() => row.append(late), 1000);
  setTimeout(() => gone.remove(), 2500);
})();
</script>
<script src="../fx-core.js"></script>
</body>
</html>
