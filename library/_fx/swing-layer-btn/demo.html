<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>swing-layer-btn — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-row { display: flex; flex-wrap: wrap; gap: 16px; padding: 60px 20px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; height: 48px; min-width: 150px; padding: 0 24px; border-radius: 18px; background: var(--kf-ink); color: var(--kf-on-accent); font-weight: 700; text-decoration: none; }
  .btn [data-fx-part="layer"] { border-radius: inherit; background: var(--kf-accent-soft); }
  .btn [data-fx-part="layer"] + [data-fx-part="layer"] { background: var(--kf-accent); }
</style>
</head>
<body>
<p class="demo-hint"><b>swing-layer-btn</b> — Hover over the button. The layers tilt away and the background color is revealed.</p>
<div class="demo-row" id="row">
  <a class="btn" data-fx="swing-layer-btn" href="#"><i data-fx-part="layer"></i><i data-fx-part="layer"></i><span data-fx-part="label">One button</span></a>
  <a class="btn" data-fx="swing-layer-btn" href="#" style="--fx-rot: 0deg; --fx-dur: .6s"><i data-fx-part="layer"></i><i data-fx-part="layer"></i><span data-fx-part="label">Slope 0</span></a>
  <a class="btn" data-fx="swing-layer-btn" href="#" data-demo-remove><i data-fx-part="layer"></i><span data-fx-part="label">Button to Be Removed</span></a>
  <a class="btn" data-fx="swing-layer-btn" href="#"></a>
</div>
<template data-demo-late><a class="btn" data-fx="swing-layer-btn" href="#"><i data-fx-part="layer"></i><i data-fx-part="layer"></i><span data-fx-part="label">Late-arrived Button</span></a></template>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => document.getElementById("row").append(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
