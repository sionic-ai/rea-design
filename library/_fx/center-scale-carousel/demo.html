<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>center-scale-carousel — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="../../_vendor/swiper@5.4.1/swiper.min.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); overflow-x: hidden; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { padding: 40px 0; display: grid; grid-template-columns: minmax(0, 1fr); gap: 56px; }
  .demo .wf-img { aspect-ratio: 3 / 2; border-radius: 25px; }
</style>
</head>
<body>
<p class="demo-hint"><b>center-scale-carousel</b> — The center card changes every 4s. Try clicking a smaller card beside it. <span style="color:var(--kf-dim)">(After 1s one more band comes in, and one leaves 2.5s later)</span></p>
<section class="demo">
  <div class="swiper-container" data-fx="center-scale-carousel"><div class="swiper-wrapper">
    <div class="swiper-slide"><div class="wf-img" data-label="Activity photo 01 · handing over an envelope on the street · daytime · landscape 3:2"></div></div>
    <div class="swiper-slide"><div class="wf-img" data-label="Activity photo 02 · three students walking an old street · 3:2 landscape"></div></div>
    <div class="swiper-slide"><div class="wf-img" data-label="Activity photo 03 · sandy beach · backlit · landscape 3:2"></div></div>
    <div class="swiper-slide"><div class="wf-img" data-label="Activity photo 04 · group photo in a park · landscape 3:2"></div></div>
    <div class="swiper-slide"><div class="wf-img" data-label="Activity photo 05 · hand close-up · landscape 3:2"></div></div>
  </div></div>
  <div data-demo-remove data-fx="center-scale-carousel" data-fx-center-scale-carousel="delay: 2500; scale: .85; per: 3.5"><div class="swiper-container" data-fx-part="track"><div class="swiper-wrapper">
    <div class="swiper-slide"><div class="wf-img" data-label="Small Photo 01"></div></div>
    <div class="swiper-slide"><div class="wf-img" data-label="Small Photo 02"></div></div>
    <div class="swiper-slide"><div class="wf-img" data-label="Small Photo 03"></div></div>
    <div class="swiper-slide"><div class="wf-img" data-label="Small Photo 04"></div></div>
  </div></div></div>
  <template data-demo-late><div data-fx="center-scale-carousel" data-fx-center-scale-carousel="gap: 20; loop: 0"><div class="swiper-container" data-fx-part="track"><div class="swiper-wrapper">
    <div class="swiper-slide"><div class="wf-img" data-label="Late-arriving photo 01"></div></div>
    <div class="swiper-slide"><div class="wf-img" data-label="Late-arriving photo 02"></div></div>
    <div class="swiper-slide"><div class="wf-img" data-label="Late-arriving photo 03"></div></div>
  </div></div></div></template>
  <div data-fx="center-scale-carousel"></div>
</section>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../_vendor/swiper@5.4.1/swiper.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
