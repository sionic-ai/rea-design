<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pop-swap-loader — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: relative; z-index: 200; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint button { margin-left: 12px; }
  .lead { margin: 0 0 8px; font: 700 26px/1.36 var(--kf-font-display); letter-spacing: .1em; text-transform: uppercase; text-align: center; }
  .page { padding: 80px 40px; }
  svg { overflow: visible; }
  .face-a { fill: var(--kf-on-accent); }
  .face-b { fill: var(--kf-accent-soft); }
  .face-c { fill: var(--kf-ink-soft); }
</style>
</head>
<body>
<p class="demo-hint"><b>pop-swap-loader</b> — A logo and a character pop out alternately every second at the center of the cover, and it lifts once two beats are filled after loading. <button type="button" id="again">View again</button></p>
<div class="page"><h1>Your Hero here</h1><p>This text appears once the curtain lifts.</p></div>
<div data-fx="pop-swap-loader" id="loader">
  <p class="lead">Welcome To<br>Studio Name</p>
  <div data-fx-part="stage">
    <svg data-fx-part="frame" viewBox="0 0 100 100"><path class="face-a" d="M50 6 62 30 86 26 72 50 92 62 60 66 54 94 46 94 40 66 8 62 28 50 14 26 38 30Z"/></svg>
    <svg data-fx-part="frame" viewBox="0 0 100 100"><rect class="face-b" x="30" y="20" width="40" height="34"/><rect class="face-a" x="26" y="54" width="48" height="30"/><rect class="face-c" x="38" y="34" width="6" height="8"/><rect class="face-c" x="56" y="34" width="6" height="8"/></svg>
    <svg data-fx-part="frame" viewBox="0 0 100 100"><rect class="face-a" x="28" y="16" width="44" height="40"/><rect class="face-b" x="22" y="56" width="56" height="28"/><rect class="face-c" x="38" y="32" width="6" height="8"/><rect class="face-c" x="56" y="32" width="6" height="8"/></svg>
  </div>
</div>
<template data-demo-late><div data-fx="pop-swap-loader" data-fx-pop-swap-loader="every: .5; loops: 1; fade: .4" style="--fx-size: 60px; inset: auto 20px 20px auto; width: 120px; height: 120px; border-radius: 12px"><div data-fx-part="stage"><svg data-fx-part="frame" viewBox="0 0 100 100"><circle class="face-a" cx="50" cy="50" r="40"/></svg><svg data-fx-part="frame" viewBox="0 0 100 100"><rect class="face-b" x="20" y="20" width="60" height="60"/></svg></div></div></template>
<div data-fx="pop-swap-loader" data-demo-remove style="display:none"></div>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
document.getElementById("again").addEventListener("click", () => {
  const old = document.getElementById("loader");
  const copy = old.cloneNode(true);
  copy.classList.remove("is-done");
  old.replaceWith(copy);
});
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2000);
</script>
</body>
</html>
