<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>depth-follow — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .stage { position: relative; height: 80vh; }
  .stage figure { position: absolute; border-radius: 40% 60% 55% 45%; background: var(--kf-raised); border: 1px solid var(--kf-line); }
</style>
</head>
<body>
<p class="demo-hint"><b>depth-follow</b> — Move the mouse. Front layers follow a lot, back layers only a little.</p>
<div class="stage" data-fx="depth-follow">
  <figure data-fx-part="layer" data-depth=".035" style="left:10%;top:15%;width:30%;height:40%"></figure>
  <figure data-fx-part="layer" data-depth=".06" style="left:45%;top:35%;width:22%;height:35%"></figure>
  <figure data-fx-part="layer" data-depth=".09" style="left:70%;top:10%;width:18%;height:30%"></figure>
</div>
<div class="stage" data-fx="depth-follow" data-demo-remove><figure data-fx-part="layer" style="left:40%;top:30%;width:20%;height:30%"></figure></div>
<template data-demo-late><div class="stage" data-fx="depth-follow" data-fx-depth-follow="dur: .6; depth: .12"><figure data-fx-part="layer" style="left:30%;top:20%;width:25%;height:40%"></figure></div></template>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
