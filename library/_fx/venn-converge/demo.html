<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>venn-converge — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 10; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-pad { height: 70vh; display: grid; place-items: center; }
  .demo-col { width: min(549px, 90vw); margin: 0 auto 30vh; }
</style>
</head>
<body>
<p class="demo-hint"><b>venn-converge</b> — Scroll down, and once the image passes the screen center, the two circles approach and overlap.</p>
<div class="demo-pad">Downward</div>
<div class="demo-col" data-fx="venn-converge"><span data-fx-part="label">Design</span><span data-fx-part="label">Technology</span></div>
<div class="demo-col" data-fx="venn-converge" data-fx-venn-converge="overlap: 60; dur: 0; replay: true" data-demo-remove><span data-fx-part="label">Panel to Be Removed</span><span data-fx-part="label">Both</span></div>
<template data-demo-late><div class="demo-col" style="--fx-height: 240px" data-fx="venn-converge" data-fx-venn-converge="dur: 1; grain: 30"><span data-fx-part="label">Late</span><span data-fx-part="label">Whole panel</span></div></template>
<div class="demo-col" data-fx="venn-converge"></div>
<div class="demo-pad">Footer</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
