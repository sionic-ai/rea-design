<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>scribble-ring — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { padding: 64px 40px; display: flex; flex-wrap: wrap; gap: 64px; align-items: center; }
  .disc { width: 220px; aspect-ratio: 1; border-radius: 50%; }
  .disc .wf-img { height: 100%; border-radius: 50%; }
  .pill { padding: 14px 28px; border-radius: 999px; border: 1px solid var(--kf-line); }
</style>
</head>
<body>
<p class="demo-hint"><b>scribble-ring</b> — Hover over the disc. Two hand-drawn rings are drawn, trembling at 10fps.</p>
<section class="demo">
  <figure class="disc" data-fx="scribble-ring"><div class="wf-img" data-label="Plate graphic"></div></figure>
  <figure class="disc" data-fx="scribble-ring" data-fx-scribble-ring="always: 1; loops: 3" style="--fx-ink: var(--kf-accent)"><div class="wf-img" data-label="Always art · three rings"></div></figure>
  <a href="#" class="pill" data-fx="scribble-ring" data-fx-scribble-ring="pad: .12; width: .02">Pill button</a>
</section>
<script>
(() => {
  const src = document.querySelector('[data-fx~="scribble-ring"]');
  const html = src.outerHTML;
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => src.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical one comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
