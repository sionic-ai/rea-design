<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>char-random-rise — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 10; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-sec { min-height: 100vh; display: grid; align-content: center; gap: 24px; padding: 40px 6vw; border-top: 1px solid var(--kf-line); }
  .demo-title { font: 300 clamp(48px, 10vw, 140px)/1 var(--kf-font-display); letter-spacing: .04em; }
  .demo-spacer { height: 60vh; display: grid; place-items: center; color: var(--kf-dim); }
</style>
</head>
<body>
<p class="demo-hint"><b>char-random-rise</b> — Scroll down. Once the Section’s top edge passes the screen center, letters pop up one by one at random, and hide again when you scroll back up. <span style="color:var(--kf-dim)">(After 1s one more section comes in, and one leaves 2.5s later)</span></p>
<div class="demo-spacer">↓</div>
<section class="demo-sec"><h2 class="demo-title" data-fx="char-random-rise" data-fx-char-random-rise="by: section">Picnic<br>Motel</h2></section>
<section class="demo-sec" data-demo-remove><h2 class="demo-title" data-fx="char-random-rise" data-fx-char-random-rise="by: section; spread: .4; toggle: once">Selected Work</h2></section>
<section class="demo-sec"><h2 class="demo-title" data-fx="char-random-rise" data-fx-char-random-rise="by: section">Your name here</h2><h2 class="demo-title" data-fx="char-random-rise" data-fx-char-random-rise="on: load"></h2></section>
<template data-demo-late><section class="demo-sec"><h2 class="demo-title" data-fx="char-random-rise" data-fx-char-random-rise="by: section">Late Arrival</h2></section></template>
<div class="demo-spacer">Footer</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
