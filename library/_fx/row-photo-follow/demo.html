<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>row-photo-follow — Motion part</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 500 18px/1.2 var(--kf-font-sans); margin: 0; }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); margin: 0; }
  .list { margin: 40px 20px; border-top: 1px solid var(--kf-line); }
  .list a { display: flex; padding: 14px 0; border-bottom: 1px solid var(--kf-line); color: inherit; text-decoration: none; }
  .list a span:first-of-type { width: 50%; }
  .list i { display: block; background: var(--kf-raised); }
</style>
</head>
<body>
<p class="demo-hint"><b>row-photo-follow</b> Hover over a row and move up and down. That row’s photo enters the left frame and follows the cursor height.</p>
<div class="list" data-fx="row-photo-follow">
  <a data-fx-part="row" href="#1"><i data-fx-part="photo"></i><span>Work name 1</span><span>Client 1</span></a>
  <a data-fx-part="row" href="#2"><i data-fx-part="photo"></i><span>Work name 2</span><span>Client 2</span></a>
  <a data-fx-part="row" href="#3"><i data-fx-part="photo"></i><span>Work name 3</span><span>Client 3</span></a>
  <a data-fx-part="row" href="#4"><span>Row without photo</span><span>Client 4</span></a>
</div>
<div data-fx="row-photo-follow" data-demo-remove></div>
<template data-demo-late><div class="list" data-fx="row-photo-follow"><a data-fx-part="row" href="#5"><i data-fx-part="photo"></i><span>Late row</span><span>Client 5</span></a></div></template>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
  setTimeout(() => {
    const t = document.querySelector("[data-demo-late]");
    t.after(t.content.cloneNode(true));
    document.querySelector("[data-demo-remove]")?.remove();
  }, 1000);
</script>
</body>
</html>
