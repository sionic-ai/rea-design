<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>blur-bloom-btn — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 10; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { display: flex; flex-wrap: wrap; gap: 24px; padding: 40px; align-items: center; }
  .demo a { display: flex; align-items: center; justify-content: space-between; gap: 20px; width: 220px; height: 60px; padding: 0 20px; color: inherit; text-decoration: none; font-weight: 500; }
  .demo a svg { width: 20px; height: 20px; fill: var(--kf-accent); }
  .demo a.is-small { width: 160px; height: 40px; font-size: 13px; }
  .demo a.is-square { width: 60px; justify-content: center; --fx-size: 108%; }
</style>
</head>
<body>
<p class="demo-hint"><b>blur-bloom-btn</b> — Hover over the button. <span style="color:var(--kf-dim)">(After 1s one more button comes in, and after 2.5s one drops out)</span></p>
<section class="demo">
  <a href="#" data-fx="blur-bloom-btn"><span>Outline Button</span><svg data-fx-part="icon" viewBox="0 0 20 20"><path d="M11.6 4.4 10.5 5.5l3.7 3.7H2.5v1.6h11.7l-3.7 3.7 1.1 1.1 5.6-5.6z"/></svg></a>
  <a href="#" class="is-small" data-fx="blur-bloom-btn" data-fx-blur-bloom-btn="look: filled"><span>Filled Button</span><svg viewBox="0 0 20 20"><path d="M11.6 4.4 10.5 5.5l3.7 3.7H2.5v1.6h11.7l-3.7 3.7 1.1 1.1 5.6-5.6z"/></svg></a>
  <a href="#" class="is-small" data-fx="blur-bloom-btn" data-fx-blur-bloom-btn="look: glass"><span>Glass button</span><svg viewBox="0 0 20 20"><path d="M11.6 4.4 10.5 5.5l3.7 3.7H2.5v1.6h11.7l-3.7 3.7 1.1 1.1 5.6-5.6z"/></svg></a>
  <a href="#" class="is-square" data-fx="blur-bloom-btn" aria-label="Next"><svg viewBox="0 0 20 20"><path d="M11.6 4.4 10.5 5.5l3.7 3.7H2.5v1.6h11.7l-3.7 3.7 1.1 1.1 5.6-5.6z"/></svg></a>
  <a href="#" data-demo-remove data-fx="blur-bloom-btn"><span>Omitted button</span></a>
  <template data-demo-late><a href="#" data-fx="blur-bloom-btn" data-fx-blur-bloom-btn="look: filled"><span>Late-arrived Button</span><svg viewBox="0 0 20 20"><path d="M11.6 4.4 10.5 5.5l3.7 3.7H2.5v1.6h11.7l-3.7 3.7 1.1 1.1 5.6-5.6z"/></svg></a></template>
</section>
<script src="../fx-core.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
