<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>char-tint-hover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { display: grid; gap: 18px; padding: 64px 40px; font: 400 40px/1.2 var(--kf-font-display); }
  .demo a { color: var(--kf-ink); text-decoration: none; justify-self: start; }
  .demo .on-dark { padding: 24px 32px; background: var(--kf-contrast-bg); }
  .demo .on-dark a { color: var(--kf-contrast-ink); --fx-tint: var(--kf-accent); }
</style>
</head>
<body>
<p class="demo-hint"><b>char-tint-hover</b> — Hover over the link. The letters are tinted with the accent color from the front, then return to their own color.</p>
<nav class="demo" id="demo">
  <a href="#" data-fx="char-tint-hover">TOPICS</a>
  <a href="#" data-fx="char-tint-hover">DISCOGRAPHY</a>
  <a href="#" data-fx="char-tint-hover">Your menu name here</a>
  <div class="on-dark"><a href="#" data-fx="char-tint-hover">CONTACT</a></div>
</nav>
<script>
// Late arrivals and removals — links added after 1s are also covered, and links removed after 2.5s run the detach (restoring split letters)
(() => {
  const demo = document.getElementById("demo");
  const make = (tag) => { const el = document.createElement("a"); el.href = "#"; el.dataset.fx = "char-tint-hover"; el.dataset.demo = tag; el.textContent = tag === "late" ? "LATE LINK" : "GONE LINK"; return el; };
  const gone = make("gone");
  demo.append(gone);
  setTimeout(() => demo.append(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s one more link comes in, and after 2.5s one drops out.");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/SplitText.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
