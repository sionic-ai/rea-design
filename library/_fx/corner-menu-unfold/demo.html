<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>corner-menu-unfold — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); font-size: 11px; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { display: flex; flex-wrap: wrap; gap: 60px; padding: 48px 40px; min-height: 70vh; }
  .demo-nav { position: relative; width: 320px; height: 420px; }
  .demo-nav [data-fx-part="panel"] { position: absolute; left: 0; top: 48px; padding: 36px 40px; border-radius: 30px; background: var(--kf-surface); border: 1px solid var(--kf-line); box-shadow: var(--kf-shadow-lift); display: flex; flex-direction: column; gap: 18px; }
  .demo-nav a { font: 800 26px/1 var(--kf-font-display); text-transform: uppercase; overflow: hidden; }
</style>
</head>
<body>
<p class="demo-hint"><b>corner-menu-unfold</b> — Press the three-line button. The panel unfolds from the corner and the rows slide in one by one. <span style="color:var(--kf-dim)">(After 1s one more menu item comes in, and after 2.5s one drops out)</span></p>
<main class="demo">
  <nav class="demo-nav" data-fx="corner-menu-unfold"><button data-fx-part="toggle" aria-label="Menu" aria-expanded="false"><i></i><i></i><i></i></button>
    <div data-fx-part="panel"><a data-fx-part="item" href="#">Menu 1</a><a data-fx-part="item" href="#">Menu 2</a><a data-fx-part="item" href="#">Menu 3</a><a data-fx-part="item" href="#">Menu 4</a></div></nav>
  <nav class="demo-nav" data-fx="corner-menu-unfold" data-fx-corner-menu-unfold="dur: .3; each: .04; item: .6" data-demo-remove><button data-fx-part="toggle" aria-label="Quick menu" aria-expanded="false"><i></i><i></i><i></i></button>
    <div data-fx-part="panel"><a data-fx-part="item" href="#">Fast 1</a><a data-fx-part="item" href="#">Fast 2</a></div></nav>
  <nav class="demo-nav" data-fx="corner-menu-unfold"><p>Menu without a button (attaches nothing)</p></nav>
  <template data-demo-late><nav class="demo-nav" data-fx="corner-menu-unfold"><button data-fx-part="toggle" aria-label="Late Menu" aria-expanded="false"><i></i><i></i><i></i></button><div data-fx-part="panel"><a data-fx-part="item" href="#">Late 1</a><a data-fx-part="item" href="#">Late 2</a></div></nav></template>
</main>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
