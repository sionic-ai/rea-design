<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>drop-badge-trail — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .area { margin-top: 30vh; height: 40vh; display: grid; place-items: center; font: 600 12vw/1 var(--kf-font-display); border-top: 1px solid var(--kf-line); }
  .badge svg { width: 100%; height: 100%; }
  .badge circle { fill: var(--kf-accent); }
  .badge text { fill: var(--kf-on-accent); font: 600 22px var(--kf-font-sans); }
</style>
</head>
<body>
<p class="demo-hint"><b>drop-badge-trail</b> — Move the mouse over the panel below. A badge pops out and falls.</p>
<div class="area" data-fx="drop-badge-trail">
  <span class="badge" data-fx-part="badge"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="48"/><text x="50" y="58" text-anchor="middle">Go</text></svg></span>
  <span class="badge" data-fx-part="badge"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="48"/><text x="50" y="58" text-anchor="middle">Me</text></svg></span>
  Your wordmark here
</div>
<div class="area" data-demo-remove data-fx="drop-badge-trail"><span class="badge" data-fx-part="badge"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="48"/></svg></span></div>
<template data-demo-late><div class="area" data-fx="drop-badge-trail" data-fx-drop-badge-trail="per: 4; max: 3"><span class="badge" data-fx-part="badge"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="48"/></svg></span>Late panel</div></template>
<div class="area" data-fx="drop-badge-trail"></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
