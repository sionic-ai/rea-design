<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>squash-word-cycle — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-ink); color: var(--kf-bg); --fx-word-ink: var(--kf-bg); }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); color: var(--kf-ink); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .big { height: 80vh; }
  .small { height: 30vh; margin-top: 20px; }
</style>
</head>
<body>
<p class="demo-hint"><b>squash-word-cycle</b> — Every 3 seconds the word flattens and swaps.</p>
<div class="big" data-fx="squash-word-cycle"><span data-fx-part="word">Brand</span><span data-fx-part="word">Studios</span></div>
<div class="small" data-fx="squash-word-cycle" data-fx-squash-word-cycle="every: 1.5; dur: .4" data-demo-remove><span data-fx-part="word">One</span><span data-fx-part="word">Two</span><span data-fx-part="word">Three</span></div>
<div class="small" data-fx="squash-word-cycle"></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => {
  const late = document.createElement("div");
  late.className = "small";
  late.setAttribute("data-fx", "squash-word-cycle");
  late.innerHTML = '<span data-fx-part="word">Late</span><span data-fx-part="word">Word</span>';
  document.body.append(late);
}, 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
