<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>glow-lines-bend — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { padding: 20px; display: grid; gap: 20px; }
  .stage { min-height: 60vh; display: grid; align-content: center; padding: 40px; color: var(--kf-contrast-ink); border-radius: var(--kf-radius-md); overflow: hidden; }
  .stage h2 { font: 700 clamp(32px, 5vw, 64px)/1.1 var(--kf-font-display); max-width: 14ch; }
</style>
</head>
<body>
<p class="demo-hint"><b>glow-lines-bend</b> — Slowly move the mouse over the stage — lines near the pointer bend toward it and the screen shifts slightly the opposite way. <span style="color:var(--kf-dim)">(After 1s one more panel comes in, and one leaves 2.5s later)</span></p>
<main class="demo">
  <section class="stage" data-fx="glow-lines-bend" data-fx-glow-lines-bend="speed: 1.9"><h2>Your big two-line title here</h2></section>
  <section class="stage" data-fx="glow-lines-bend" data-fx-glow-lines-bend="count: 3; bend: 0; parallax: 0; wait: none" data-demo-remove><h2>Rigid plate</h2></section>
  <template data-demo-late><section class="stage" data-fx="glow-lines-bend" data-fx-glow-lines-bend="count: 4; speed: 3; wait: none" style="--fx-line-1: var(--kf-accent); --fx-line-2: var(--kf-accent-soft)"><h2>Late-arriving panel</h2></section></template>
</main>
<script src="../../_vendor/three@0.186.0/three.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => { const t = document.querySelector("template[data-demo-late]"); document.querySelector(".demo").append(t.content.cloneNode(true)); }, 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
