<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>inset-shrink-card — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .stage { width: 100%; aspect-ratio: 1600 / 980; max-height: 90vh; margin-top: 40px; }
  .pic { width: 100%; height: 100%; background: linear-gradient(160deg, var(--kf-accent), var(--kf-accent-soft)); }
  .spacer { height: 120vh; padding: 40px 20px; }
</style>
</head>
<body>
<p class="demo-hint"><b>inset-shrink-card</b> — Scroll down. The full-bleed rounded photo panel shrinks inward while the image inside it flows upward.</p>
<div class="stage" data-fx="inset-shrink-card"><div data-fx-part="mask"><div data-fx-part="image"><div class="pic"></div></div></div></div>
<div class="spacer">Scroll down from here</div>
<div class="stage" data-fx="inset-shrink-card" data-fx-inset-shrink-card="to: 40; radius: 40; radiusTo: 8; shift: -80" style="--fx-extra: 80px"><div data-fx-part="mask"><div data-fx-part="image"><div class="pic"></div></div></div></div>
<div class="stage" data-fx="inset-shrink-card"></div>
<div class="spacer"></div>
<script>
// Late arrivals·removals — one board comes in after 1 second, and one drops out after 2.5 seconds
(() => {
  const src = document.querySelector(".stage");
  const late = src.cloneNode(true);
  const gone = src.cloneNode(true);
  document.querySelector(".spacer").after(gone);
  setTimeout(() => document.body.insertBefore(late, document.querySelector(".spacer:last-of-type")), 1000);
  setTimeout(() => gone.remove(), 2500);
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
