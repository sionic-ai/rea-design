<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pill-grow-btn — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-raised); color: var(--kf-ink); font: 400 16px/2 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { display: flex; flex-wrap: wrap; gap: 24px; justify-content: center; padding: 80px 20px; }
</style>
</head>
<body>
<p class="demo-hint"><b>pill-grow-btn</b> — Hover over the button. The left block stretches all the way and covers it. <span style="color:var(--kf-dim)">(After 1s one more button comes in, and after 2.5s one drops out)</span></p>
<section class="demo">
  <a href="#" data-fx="pill-grow-btn"><i data-fx-part="arrow"></i>View details</a>
  <a href="#" data-fx="pill-grow-btn" style="--fx-bg: var(--kf-accent); --fx-fill: var(--kf-surface); --fx-chip: var(--kf-ink); --fx-ink: var(--kf-on-accent); --fx-ink-on: var(--kf-ink)"><i data-fx-part="arrow"></i>Blue button type</a>
  <a href="#" data-fx="pill-grow-btn" style="--fx-dur: 0s"><i data-fx-part="arrow"></i>Chunks start right away (0s)</a>
  <a href="#" data-demo-remove data-fx="pill-grow-btn"><i data-fx-part="arrow"></i>Disappearing button</a>
  <template data-demo-late><a href="#" data-fx="pill-grow-btn">Late-added button (no arrow)</a></template>
  <a href="#" data-fx="pill-grow-btn"></a>
</section>
<script src="../fx-core.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
