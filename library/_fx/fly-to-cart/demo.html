<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fly-to-cart — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { min-height: 100vh; background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .cart { position: fixed; top: 70px; right: 30px; display: grid; place-items: center; width: 64px; height: 64px; border: 0; border-radius: 50%; background: var(--kf-accent); color: var(--kf-on-accent); font: 700 13px/1 var(--kf-font-sans); }
  .row { display: flex; flex-wrap: wrap; gap: 24px; padding: 260px 40px 80px; }
  .add { padding: 14px 30px; border: 0; border-radius: var(--kf-radius-pill); background: var(--kf-ink); color: var(--kf-bg); font: 600 14px/1 var(--kf-font-sans); cursor: pointer; }
</style>
</head>
<body>
<p class="demo-hint"><b>fly-to-cart</b> — Press ‹Add› below. A dot flies along a curve to the cart at the upper right and the number goes up. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<button class="cart" type="button" data-fx-part="cart" aria-label="Cart"><span data-demo-count>0</span></button>
<div class="row">
  <button class="add" type="button" data-fx="fly-to-cart">Add to cart</button>
  <button class="add" type="button" data-fx="fly-to-cart" data-fx-fly-to-cart="sway: 0; dur: 0.6">Straight arc · 0.6s</button>
  <button class="add" type="button" data-demo-remove data-fx="fly-to-cart">Omitted button</button>
  <template data-demo-late><button class="add" type="button" data-fx="fly-to-cart">Late-arrived Button</button></template>
</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/MotionPathPlugin.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
document.addEventListener("fx:arrive", () => { const n = document.querySelector("[data-demo-count]"); if (n) n.textContent = +n.textContent + 1; });
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
