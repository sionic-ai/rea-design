<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>section-scale-approach — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 9; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .sec { position: relative; min-height: 90vh; margin-top: -30px; padding: 120px 8%; border-radius: 0 0 30px 30px; background: var(--kf-surface); font-size: 28px; font-weight: 700; }
  .sec:nth-child(even) { background: var(--kf-raised); }
</style>
</head>
<body>
<p class="demo-hint"><b>section-scale-approach</b> — Scroll down. The next section approaches, growing from .8 to full size. <span style="color:var(--kf-dim)">(After 1s one more section comes in, and one leaves 2.5s later)</span></p>
<main id="list">
  <section class="sec" style="z-index: 5">First page</section>
  <section class="sec" style="z-index: 4" data-fx="section-scale-approach">Second Section</section>
  <section class="sec" style="z-index: 3" data-fx="section-scale-approach" data-fx-section-scale-approach="min: .9" data-demo-remove>Dropping section</section>
  <section class="sec" style="z-index: 2" data-fx="section-scale-approach">Fourth section</section>
</main>
<template data-demo-late><section class="sec" style="z-index: 1" data-fx="section-scale-approach">Late-arriving section</section></template>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => document.getElementById("list").append(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
