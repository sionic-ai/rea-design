<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>radial-drag-slider — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); overflow-x: hidden; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { padding: 15vh 0 30vh; overflow: hidden; }
  .rv { width: clamp(18rem, 28vw, 28rem); aspect-ratio: 4 / 3; padding: 1.75em; border: 1px solid var(--kf-line); border-radius: var(--kf-radius-lg); background: var(--kf-surface); margin: 0; }
  .rv.is-active { border-color: var(--kf-accent); }
  .ctl { display: flex; gap: 12px; justify-content: center; align-items: center; margin-top: 3em; }
  .ctl button { padding: .5em 1em; border: 1px solid var(--kf-line); border-radius: 999px; background: var(--kf-surface); cursor: pointer; }
  .ctl [data-fx-part="dot"] { width: 8px; height: 8px; padding: 0; }
  .ctl [data-fx-part="dot"].is-active { background: var(--kf-accent); }
</style>
</head>
<body>
<p class="demo-hint"><b>radial-drag-slider</b> — Drag and fling a card sideways. It spins like a big wheel and then snaps into a slot. Buttons, dots or clicking a side card also advance it. <span style="color:var(--kf-dim)">(One more panel comes in after 1s, and an empty panel drops out after 2.5s)</span></p>
<section class="demo">
  <div data-fx="radial-drag-slider">
    <div data-fx-part="list">
      <figure class="rv" data-fx-part="item"><p>Your first review in three or four lines here.</p></figure>
      <figure class="rv" data-fx-part="item"><p>Your second review goes here, in three or four lines.</p></figure>
      <figure class="rv" data-fx-part="item"><p>Put the third review here in three or four lines.</p></figure>
    </div>
    <div class="ctl"><button type="button" data-fx-part="prev">Previous</button><button type="button" data-fx-part="dot" aria-label="1"></button><button type="button" data-fx-part="dot" aria-label="2"></button><button type="button" data-fx-part="dot" aria-label="3"></button><span data-fx-part="count">01</span><button type="button" data-fx-part="next">Next</button></div>
  </div>
  <div data-demo-remove data-fx="radial-drag-slider"></div>
  <template data-demo-late><div data-fx="radial-drag-slider" style="margin-top:20vh"><div data-fx-part="list"><figure class="rv" data-fx-part="item"><p>Late-added first panel</p></figure><figure class="rv" data-fx-part="item"><p>Late-arriving panel two</p></figure></div></div></template>
</section>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/Draggable.min.js"></script>
<script src="../../../_shared/vendor/gsap/InertiaPlugin.min.js"></script>
<script src="../../../_shared/vendor/gsap/CustomEase.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
