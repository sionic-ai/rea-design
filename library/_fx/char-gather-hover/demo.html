<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>char-gather-hover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .wrap { display: grid; gap: 40px; padding: 60px 40px; }
  .band { height: 420px; max-width: 980px; color: var(--kf-on-accent); text-decoration: none; }
  .band [data-fx-part="note"] { position: absolute; left: 0; right: 0; top: 42%; text-align: center; margin: 0; font: 700 26px/1.4 var(--kf-font-display); }
  .band [data-fx-part="logo"] { position: absolute; left: 50%; top: 66%; translate: -50% 0; width: 120px; height: 60px; border-radius: 16px; background: var(--kf-on-accent); }
  .band [data-fx-part="arrow"] { position: absolute; left: 50%; top: 80%; width: 140px; height: 30px; margin-left: -70px; }
  .band [data-fx-part="arrow"] path { fill: none; stroke: var(--kf-on-accent); stroke-width: 4; stroke-linecap: round; }
  .band [data-fx-part="piece"] { position: absolute; width: 150px; aspect-ratio: 1; margin: 0; border-radius: 50%; background: var(--kf-accent-soft); }
</style>
</head>
<body>
<p class="demo-hint"><b>char-gather-hover</b> — Hover over the band. The panel unfolds and surrounding pieces gather. <span style="color:var(--kf-dim)">(After 1s one more band comes in, and one leaves 2.5s later)</span></p>
<div class="wrap">
  <a class="band" href="#" data-fx="char-gather-hover">
    <div data-fx-part="panel"><i data-fx-part="bg"></i><i data-fx-part="fill"></i></div>
    <figure data-fx-part="piece" style="left:2%;top:-6%" data-from="x: -50; y: -50; r: -16"></figure>
    <figure data-fx-part="piece" style="right:4%;top:-8%" data-from="x: 60; y: -50; s: .8"></figure>
    <figure data-fx-part="piece" style="left:-2%;bottom:6%" data-from="x: -30; y: -20; r: -60"></figure>
    <figure data-fx-part="piece" style="right:-2%;bottom:4%" data-from="x: 50; y: 30; s: .8; r: 24"></figure>
    <p data-fx-part="note">Your notice line here</p>
    <i data-fx-part="logo"></i>
    <svg data-fx-part="arrow" viewBox="0 0 140 30"><path d="M4 22 Q70 12 132 16"/><path d="M118 4 L134 16 L116 26"/></svg>
  </a>
  <a class="band" href="#" data-fx="char-gather-hover" data-fx-char-gather-hover="inset: 14; bg: .7" data-demo-remove>
    <div data-fx-part="panel"><i data-fx-part="bg"></i></div>
    <p data-fx-part="note">Board Only, No Pieces</p>
  </a>
  <template data-demo-late><a class="band" href="#" data-fx="char-gather-hover"><p data-fx-part="note">Band that slides in late with no child marker</p></a></template>
</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
