<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sag-edge-flatten — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 10; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .stage { position: sticky; top: 0; height: 100vh; display: grid; place-items: center; background: var(--kf-accent); color: var(--kf-on-accent); font: 700 40px var(--kf-font-display); }
  .cover { position: relative; min-height: 220vh; padding: 30vh 8vw; font: 700 40px var(--kf-font-display); }
  .cover.is-b { background: var(--kf-surface); }
</style>
</head>
<body>
<p class="demo-hint"><b>sag-edge-flatten</b> — Scroll down and the sagging top edge of the next section flattens when it reaches the top of the screen.</p>
<div class="stage">Fixed Hero</div>
<section><div class="cover" data-fx="sag-edge-flatten" data-fx-sag-edge-flatten="depth: 12">Section scaled up with 12% sag</div></section>
<section><div class="cover is-b" data-fx="sag-edge-flatten" data-demo-remove>Default 3% — drops out after 2.5 sec</div></section>
<section><template data-demo-late><div class="cover" data-fx="sag-edge-flatten" data-fx-sag-edge-flatten="depth: 6; scrub: 0.5">Section entering after 1s</div></template></section>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); window.ScrollTrigger?.refresh(); }, 2500);
</script>
</body>
</html>
