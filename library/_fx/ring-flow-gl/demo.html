<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ring-flow-gl — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { padding: 24px 20px; display: grid; gap: 24px; }
  .stage { height: 70vh; border: 1px solid var(--kf-ink); display: flex; align-items: flex-end; justify-content: flex-end; padding: 24px; }
  .stage.small { height: 40vh; }
  .stage h2 { font: 700 48px/1 var(--kf-font-display); }
</style>
</head>
<body>
<p class="demo-hint"><b>ring-flow-gl</b> — A ring line flows and the scene changes every 4 seconds. Move the mouse quickly. <span style="color:var(--kf-dim)">(After 1s one more panel comes in, and one leaves 2.5s later)</span></p>
<section class="demo">
  <div class="stage" data-fx="ring-flow-gl"><h2>logo</h2></div>
  <div class="stage small" data-fx="ring-flow-gl" data-fx-ring-flow-gl="scene: 4; rings: 16" data-demo-remove></div>
  <template data-demo-late><div class="stage small" data-fx="ring-flow-gl" data-fx-ring-flow-gl="scene: 2; grain: 0"></div></template>
</section>
<script src="three-global.js"></script>
<script src="../../_vendor/three@0.184.0/build/three.cjs"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
