<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>stripe-sweep — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { display: grid; gap: 24px; justify-items: start; padding: 48px 20px; }
  .demo-title { font: 800 64px/1 var(--kf-font-display); letter-spacing: -0.02em; }
  .demo button { padding: 12px 20px; border: 1px solid var(--kf-line); border-radius: var(--kf-radius-pill); background: var(--kf-surface); color: var(--kf-ink); font: 600 14px var(--kf-font-sans); cursor: pointer; }
</style>
</head>
<body>
<p class="demo-hint"><b>stripe-sweep</b> — Press ‹Switch scene›. The moment slanted bands cover the screen the heading changes, and they clear away the same way.</p>
<main class="demo" data-fx="stripe-sweep">
  <h1 class="demo-title">Scene 1</h1>
  <button type="button" data-fx-part="trigger">Advance scene</button>
</main>
<script>
// Swaps the screen at fx:midway, which fires the moment it is fully covered
(() => {
  let k = 1;
  document.addEventListener("fx:midway", (e) => { const h = e.target.querySelector(".demo-title"); if (h) h.textContent = `Scene ${++k}`; });
})();
</script>
<script>
// Late arrivals and removals — checks that fx-core attaches to an element added after 1s and detaches from an element removed after 2.5s
(() => {
  const src = document.querySelector('[data-fx~="stripe-sweep"]');
  if (!src) return;
  const html = src.outerHTML.replace(/\sid="[^"]*"/g, "");
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => src.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical one comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
