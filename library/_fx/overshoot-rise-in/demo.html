<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>overshoot-rise-in — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { padding: 48px 20px; }
  .demo-spacer { height: 90vh; display: grid; place-items: center; color: var(--kf-dim); }
  .big { margin: 0 0 40px; font: 900 64px/1.3 var(--kf-font-display); color: var(--kf-accent); }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin: 0 0 80px; }
  .grid li { height: 200px; border-radius: 16px; background: var(--kf-surface); border: 1px solid var(--kf-line); }
  .wave { height: 420px; margin: 0 0 40px; }
</style>
</head>
<body>
<p class="demo-hint"><b>overshoot-rise-in</b> — Scroll down and the cells rise from below, overshoot slightly and settle. Scroll back up and they hide, then rise again. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<section class="demo"><div class="demo-spacer">Scroll down</div><ul class="grid" data-demo-remove data-fx="overshoot-rise-in"><li></li><li></li><li></li><li></li></ul><ul class="grid" data-fx="overshoot-rise-in" data-fx-overshoot-rise-in="y: 120"><li></li><li></li><li></li></ul><template data-demo-late><ul class="grid" data-fx="overshoot-rise-in"><li></li><li></li></ul></template><ul class="grid" data-fx="overshoot-rise-in"></ul><div class="demo-spacer"></div></section>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../../../_shared/vendor/gsap/CustomEase.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); window.ScrollTrigger?.refresh(); }, 2500);
</script>
</body>
</html>
