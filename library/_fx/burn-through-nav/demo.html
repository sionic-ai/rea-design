<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>burn-through-nav — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); min-height: 100vh; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-box { margin: 40px 20px; padding: 40px; border: 1px solid var(--kf-line); display: flex; gap: 16px; flex-wrap: wrap; }
  .demo-box a { padding: 10px 18px; border: 1px solid var(--kf-line); border-radius: var(--kf-radius-pill); color: var(--kf-ink); text-decoration: none; }
  .demo-big { margin: 20px; font: 400 clamp(48px, 12vw, 180px)/1 var(--kf-font-display); }
</style>
</head>
<body>
<p class="demo-hint"><b>burn-through-nav</b> — Click a link and the new page is revealed from the click point as if burning in (open via http for View Transition, file:// uses a cover-and-wipe fallback).</p>
<p class="demo-big">Your big title here</p>
<div class="demo-box" data-fx="burn-through-nav"><a href="demo.html?a">Reopen this page</a><a href="demo.html?b">Once more</a></div>
<div class="demo-box" data-fx="burn-through-nav" data-fx-burn-through-nav="dur: 0.6; cell: 16; spray: 0"><a href="demo.html?quick">Fast and round (.6s · 16px cells)</a></div>
<script>
// Late arrivals and removals — checks that fx-core attaches to an element added after 1s and detaches from an element removed after 2.5s
(() => {
  const src = document.querySelector('[data-fx~="burn-through-nav"]');
  const make = (tag) => { const el = src.cloneNode(true); el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => src.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another link group comes in (a late arrival), and after 2.5s one is removed (detach).");
})();
</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
