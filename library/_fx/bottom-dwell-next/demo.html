<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bottom-dwell-next — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.6 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; margin: 0; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo-spacer { height: 120vh; display: grid; place-items: center; color: var(--kf-dim); }
  .demo-small { position: relative; height: 120px; margin: 20px; border: 1px solid var(--kf-line); }
  .demo-next { position: relative; height: 100vh; }
  .demo-next [data-fx-part="bar"] { position: absolute; z-index: 2; left: 0; bottom: 0; width: 100%; height: 2px; background: var(--kf-ink); }
  .demo-next [data-fx-part="panel"] { position: absolute; right: 0; bottom: 0; width: 100%; aspect-ratio: 5 / 3; max-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--kf-raised); }
  .demo-next h3 { position: absolute; top: -48px; width: 100%; margin: 0; text-align: center; font: 300 22px/1 var(--kf-font-sans); }
  .demo-next [data-fx-part="card"] { position: absolute; width: min(28vw, 336px); aspect-ratio: 0.78; display: grid; place-items: center; background: var(--kf-contrast-bg); color: var(--kf-contrast-ink); }
  .demo-log { position: fixed; right: 12px; bottom: 12px; z-index: 100; margin: 0; padding: 6px 10px; background: var(--kf-surface); color: var(--kf-ink-soft); font: 12px/1.4 var(--kf-font-mono); }
</style>
</head>
<body>
<p class="demo-hint"><b>bottom-dwell-next</b> Scroll all the way down and stay 2 seconds. When the bar fills, the next card grows to fill the panel (scrolling up midway cancels it). <span style="color:var(--kf-dim)">(After 1s one more band comes in, and one leaves 2.5s later)</span></p>
<div class="demo-spacer">Scroll all the way down</div>
<div class="demo-small" data-fx="bottom-dwell-next" data-demo-remove><i data-fx-part="bar"></i></div>
<div class="demo-small" data-fx="bottom-dwell-next"></div>
<template data-demo-late><div class="demo-small" data-fx="bottom-dwell-next" data-fx-bottom-dwell-next="dwell: 3"><i data-fx-part="bar" style="position:absolute;left:0;bottom:0;width:100%;height:2px;background:var(--kf-ink)"></i></div></template>
<section class="demo-next" data-fx="bottom-dwell-next" data-fx-bottom-dwell-next="ratio-narrow: 1">
  <i data-fx-part="bar"></i>
  <div data-fx-part="panel">
    <h3 data-fx-part="fade">Next</h3>
    <a data-fx-part="card" href="#next"><span data-fx-part="fade">Next name</span></a>
  </div>
</section>
<p class="demo-log">Event: <span id="log">Not yet</span></p>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
document.addEventListener("fx:grow", () => (document.getElementById("log").textContent = "fx:grow — growing"));
document.addEventListener("fx:next", (e) => { e.preventDefault(); document.getElementById("log").textContent = "fx:next → " + e.detail.to; });
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
