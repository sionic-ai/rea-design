<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sheet-curl-in — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { padding: 30vh 40px 40vh; display: grid; grid-template-columns: repeat(2, 420px); gap: 80px; justify-content: center; }
  .card { aspect-ratio: 8 / 5; border-radius: 5px; overflow: hidden; }
  .card .wf-img { height: 100%; border: 0; }
  .card.is-tall { aspect-ratio: 3 / 4; }
</style>
</head>
<body>
<p class="demo-hint"><b>sheet-curl-in</b> — Scroll down. The photo panel floats up rolled, unrolls over 1.5s and lies in place (1024px or more). <span style="color:var(--kf-dim)">(After 1s one more panel comes in, and one leaves 2.5s later)</span></p>
<section class="demo" id="box">
  <div class="card" data-fx="sheet-curl-in"><div class="wf-img" data-fx-part="photo" data-label="Bright living room · natural window light · landscape 8:5"></div></div>
  <div class="card is-tall" data-fx="sheet-curl-in" data-fx-sheet-curl-in="motion: .75"><div class="wf-img" data-fx-part="photo" data-label="Vertical photo · Intensity .75"></div></div>
  <div class="card" data-fx="sheet-curl-in" data-fx-sheet-curl-in="fade: .8; zoom: .12; shift: -.05"><div class="wf-img" data-fx-part="photo" data-label="Soft fade-in · pull .12"></div></div>
  <div class="card" data-fx="sheet-curl-in" data-demo-remove><div class="wf-img" data-fx-part="photo" data-label="Panel to be removed soon"></div></div>
  <div data-fx="sheet-curl-in"></div>
</section>
<script src="three-global.js"></script>
<script src="../../_vendor/three@0.185.0/build/three.cjs"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => { const d = document.createElement("div"); d.className = "card"; d.dataset.fx = "sheet-curl-in"; d.innerHTML = '<div class="wf-img" data-fx-part="photo" data-label="Late panel"></div>'; document.getElementById("box").append(d); }, 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
