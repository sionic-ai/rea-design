<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ripple-reveal — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { padding: 24px 20px; display: grid; gap: 16px; }
  .demo-btn { justify-self: start; height: 40px; padding: 0 16px; border: 1px solid var(--kf-line); border-radius: var(--kf-radius-sm); background: var(--kf-surface); color: var(--kf-ink); cursor: pointer; }
  .stage { height: 60vh; border: 1px solid var(--kf-line); }
</style>
</head>
<body>
<p class="demo-hint"><b>ripple-reveal</b> — Press ”Wave” and the picture ripples and distorts for 2.8 seconds, then settles.</p>
<div class="demo">
  <button class="demo-btn" type="button" onclick="document.dispatchEvent(new Event('demo:go'))">Wave</button>
  <div class="stage" data-fx="ripple-reveal" data-fx-ripple-reveal="wait: demo:go"><canvas data-fx-part="media" width="960" height="540"></canvas></div>
</div>
<script>
// A canvas painted with stripes and grids in skin colors instead of images — so distortion is visible
(() => {
  const css = getComputedStyle(document.documentElement);
  const c = document.querySelector('[data-fx-part="media"]'), x = c.getContext("2d");
  x.fillStyle = css.getPropertyValue("--kf-raised"); x.fillRect(0, 0, 960, 540);
  x.strokeStyle = css.getPropertyValue("--kf-ink"); x.lineWidth = 2;
  for (let i = 0; i <= 960; i += 48) { x.beginPath(); x.moveTo(i, 0); x.lineTo(i, 540); x.stroke(); }
  for (let j = 0; j <= 540; j += 48) { x.beginPath(); x.moveTo(0, j); x.lineTo(960, j); x.stroke(); }
  x.fillStyle = css.getPropertyValue("--kf-accent"); x.fillRect(560, 0, 80, 540);
})();
</script>
<script>
// Late arrivals and removals — checks that fx-core attaches to an element added after 1s and detaches from an element removed after 2.5s
(() => {
  const src = document.querySelector('[data-fx~="ripple-reveal"]');
  if (!src) return;
  const make = (tag) => { const el = src.cloneNode(true); el.dataset.demo = tag; const c = el.querySelector("canvas"); c.getContext("2d").drawImage(src.querySelector("canvas"), 0, 0); return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => src.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical one comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="../../_vendor/pixi.js@8.19.0/pixi.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
