<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>grain-lens-image — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .stage { height: 70vh; margin: 20px; }
  .stage > canvas[data-fx-part="image"] { width: 100%; height: 100%; display: block; object-fit: contain; }
  .small { height: 40vh; }
</style>
</head>
<body>
<p class="demo-hint"><b>grain-lens-image</b> — A flower gathers into grains and takes shape. Hover over the flower — only the touched spot shows clearly. The button below scatters it back into grains.</p>
<div class="stage" data-fx="grain-lens-image" data-fx-grain-lens-image="scale: 0.9" data-demo-remove><canvas data-fx-part="image" width="600" height="800"></canvas></div>
<p style="padding: 0 20px"><button type="button" id="gone">Scatter / Revert</button></p>
<template data-demo-late><div class="stage small" data-fx="grain-lens-image" data-fx-grain-lens-image="intro: 2; grain: 0.6"><canvas data-fx-part="image" width="600" height="800"></canvas></div></template>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script>
// Demo flower — draws five petals in the skin’s accent color
function paint(cv) {
  const c = cv.getContext("2d"), css = getComputedStyle(document.documentElement);
  const petal = css.getPropertyValue("--kf-accent").trim(), core = css.getPropertyValue("--kf-ink").trim(), stem = css.getPropertyValue("--kf-dim").trim();
  c.strokeStyle = stem; c.lineWidth = 14; c.beginPath(); c.moveTo(300, 420); c.quadraticCurveTo(320, 620, 300, 790); c.stroke();
  for (let i = 0; i < 5; i++) {
    c.save(); c.translate(300, 300); c.rotate((i / 5) * Math.PI * 2);
    const g = c.createRadialGradient(0, -60, 10, 0, -110, 160); g.addColorStop(0, petal); g.addColorStop(1, "transparent"); /* Not skin: transparent petal tips */
    c.fillStyle = g; c.beginPath(); c.moveTo(0, 0); c.bezierCurveTo(-120, -80, -90, -250, 0, -260); c.bezierCurveTo(90, -250, 120, -80, 0, 0); c.fill(); c.restore();
  }
  c.fillStyle = core; c.beginPath(); c.arc(300, 300, 26, 0, Math.PI * 2); c.fill();
}
document.querySelectorAll('canvas[data-fx-part="image"]').forEach(paint);
</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
let g = 0;
document.getElementById("gone").addEventListener("click", () => {
  const el = document.querySelector('[data-fx~="grain-lens-image"]');
  if (!el) return;
  const s = { v: g }; g = g ? 0 : 1;
  gsap.to(s, { v: g, duration: 1.6, ease: "sine.inOut", onUpdate: () => el.dispatchEvent(new CustomEvent("fx:dissolve", { detail: s.v })) });
});
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => { const n = t.content.cloneNode(true); n.querySelectorAll("canvas").forEach(paint); t.replaceWith(n); }), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
