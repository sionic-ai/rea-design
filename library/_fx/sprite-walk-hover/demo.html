<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sprite-walk-hover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); overflow-x: hidden; }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .row { display: flex; justify-content: flex-end; gap: 60px; padding: 120px 40px; }
  .shop { position: relative; display: flex; align-items: center; height: 55px; padding: 0 91px 0 10px; font-weight: 600; }
  .ant { position: absolute; right: -5px; top: -14px; width: 80px; height: 80px; }
</style>
</head>
<body>
<p class="demo-hint"><b>sprite-walk-hover</b> — Hover the link on the right. An ant walks left, moving its legs (the second one walks in place). <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<div class="row" id="row">
  <a class="shop" data-fx="sprite-walk-hover" href="#">ONLINE SHOP<span class="ant" data-fx-part="walker"><img src="sprite.svg" alt=""></span></a>
  <a class="shop" data-fx="sprite-walk-hover" data-fx-sprite-walk-hover="look: flip" href="#">In place<span class="ant" data-fx-part="walker" style="--fx-flip: .8s"><img src="sprite.svg" alt=""></span></a>
  <a class="shop" data-fx="sprite-walk-hover" href="#" data-demo-remove>Omission<span class="ant" data-fx-part="walker"><img src="sprite.svg" alt=""></span></a>
  <a class="shop" data-fx="sprite-walk-hover" href="#">No image</a>
</div>
<script>
setTimeout(() => { const a = document.createElement("a"); a.className = "shop"; a.href = "#"; a.dataset.fx = "sprite-walk-hover"; a.innerHTML = 'Late<span class="ant" data-fx-part="walker" style="--fx-walk: 27s"><img src="sprite.svg" alt=""></span>'; document.getElementById("row").append(a); }, 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
