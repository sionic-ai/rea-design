<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>photo-pile-open — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { margin: 0; background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; margin: 0; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .pp { height: 80vh; margin-bottom: 30px; background: var(--kf-raised); --fx-w: 300px; }
  .pp .wf-img { height: 100%; }
  .pp [data-fx-part="photo"]:nth-child(2) > div { rotate: 8deg; }
  .pp [data-fx-part="photo"]:nth-child(3) > div { rotate: -6deg; }
  .pp [data-fx-part="photo"]:nth-child(4) > div { rotate: 4deg; }
  @media (max-width: 767px) { .pp { --fx-w: 200px; --fx-frame: 10px; } }
</style>
</head>
<body>
<p class="demo-hint"><b>photo-pile-open</b> — On open, photos stack one by one and the last one rises to fill the panel. <span style="color:var(--kf-dim)">(After 1s one more panel comes in, and one leaves 2.5s later)</span></p>
<section class="pp" data-demo-remove data-fx="photo-pile-open">
  <div data-fx-part="pile">
    <figure data-fx-part="photo"><div class="wf-img" data-label="Photo 1"></div></figure>
    <figure data-fx-part="photo"><div class="wf-img" data-label="Photo 2"></div></figure>
    <figure data-fx-part="photo"><div class="wf-img" data-label="Photo 3"></div></figure>
    <figure data-fx-part="photo"><div class="wf-img" data-label="Photo 4"></div></figure>
  </div>
  <figure data-fx-part="last"><div class="wf-img" data-label="Last section — fills the board"></div></figure>
</section>
<section class="pp" data-fx="photo-pile-open" data-fx-photo-pile-open="each: .1; dur: .5; grow: .6">
  <div data-fx-part="pile">
    <figure data-fx-part="photo"><div class="wf-img" data-label="Fast Type 1"></div></figure>
    <figure data-fx-part="photo"><div class="wf-img" data-label="Fast Type 2"></div></figure>
    <figure data-fx-part="photo"><div class="wf-img" data-label="Fast Type 3"></div></figure>
  </div>
  <figure data-fx-part="last"><div class="wf-img" data-label="Last section"></div></figure>
</section>
<template data-demo-late><section class="pp" data-fx="photo-pile-open"><div data-fx-part="pile"><figure data-fx-part="photo"><div class="wf-img" data-label="Late-arriving panel"></div></figure><figure data-fx-part="photo"><div class="wf-img" data-label="Second"></div></figure></div><figure data-fx-part="last"><div class="wf-img" data-label="Last section"></div></figure></section></template>
<div data-fx="photo-pile-open"></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/CustomEase.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
