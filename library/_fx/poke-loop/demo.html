<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>poke-loop — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.6 var(--kf-font-sans); }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .row { display: flex; gap: 32px; padding: 60px 20px; }
  .next { display: inline-flex; align-items: center; gap: 12px; padding: 18px 28px; border-radius: var(--kf-radius-md); background: var(--kf-surface); border: 1px solid var(--kf-line); }
  .next svg { width: 24px; height: 8px; }
</style>
</head>
<body>
<p class="demo-hint"><b>poke-loop</b> — Just watch. The arrow nudges twice every 2.5s, then rests. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<div class="row" data-demo-row>
  <a class="next" href="#">Next page <span data-fx="poke-loop" aria-hidden="true"><svg viewBox="0 0 24 8"><path d="M0 4h22M18 .5 22 4l-4 3.5" fill="none" stroke="currentColor"/></svg></span></a>
  <a class="next" href="#">Downward <span data-fx="poke-loop" style="--fx-x:0px; --fx-y:10px" aria-hidden="true">↓</span></a>
  <a class="next" href="#" data-demo-remove>Item to Be Removed <span data-fx="poke-loop" aria-hidden="true">→</span></a>
</div>
<template data-demo-late><a class="next" href="#">Late one <span data-fx="poke-loop" style="--fx-dur:4s" aria-hidden="true">→</span></a></template>
<script src="../fx-core.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => document.querySelector("[data-demo-row]").append(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
