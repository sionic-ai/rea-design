<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>beat-dots — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { padding: 48px 20px; }
  .demo-spacer { height: 90vh; display: grid; place-items: center; color: var(--kf-dim); }

  .box { position: sticky; top: 40vh; max-width: 420px; margin: 0 auto; padding: 20px; border: 1px solid var(--kf-line); background: var(--kf-surface); font: 500 12px/1 var(--kf-font-mono); }
  .dots { display: flex; gap: 10px; margin: 14px 0; } [data-fx-part="dot"] { width: 18px; height: 18px; border: 1px solid var(--kf-line); }
  .track { height: 4px; background: var(--kf-raised); } [data-fx-part="progress"] { height: 100%; background: var(--kf-ink); }
  .chord { display: block; margin-top: 14px; font: 700 28px/1 var(--kf-font-display); }
  .zone { height: 300vh; }
</style>
</head>
<body>
<p class="demo-hint"><b>beat-dots</b> — Scroll slowly — a dot lights up for each beat and the measure turns over. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<div data-demo-remove class="zone" data-fx="beat-dots" data-fx-beat-dots="start: top top; end: bottom bottom"><div class="box"><b data-fx-part="count"></b><div class="dots"><i data-fx-part="dot"></i><i data-fx-part="dot"></i><i data-fx-part="dot"></i><i data-fx-part="dot"></i></div><div class="track"><i data-fx-part="progress"></i></div><span class="chord" data-fx-part="word" data-bar-text="A|B|C|D"></span></div></div><div class="zone" data-fx="beat-dots" data-fx-beat-dots="start: top top; end: bottom bottom"><div class="box"><b data-fx-part="count"></b><div class="dots"><i data-fx-part="dot"></i><i data-fx-part="dot"></i><i data-fx-part="dot"></i><i data-fx-part="dot"></i></div><div class="track"><i data-fx-part="progress"></i></div><span class="chord" data-fx-part="word" data-bar-text="A|B|C|D"></span></div></div><template data-demo-late><div class="zone" data-fx="beat-dots" data-fx-beat-dots="start: top top; end: bottom bottom"><div class="box"><b data-fx-part="count"></b><div class="dots"><i data-fx-part="dot"></i><i data-fx-part="dot"></i><i data-fx-part="dot"></i><i data-fx-part="dot"></i></div><div class="track"><i data-fx-part="progress"></i></div><span class="chord" data-fx-part="word" data-bar-text="A|B|C|D"></span></div></div></template>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../../../_shared/vendor/gsap/CustomEase.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); window.ScrollTrigger?.refresh(); }, 2500);
</script>
</body>
</html>
