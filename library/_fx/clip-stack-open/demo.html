<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>clip-stack-open — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { margin: 0; background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 2; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .row { display: flex; flex-wrap: wrap; gap: 40px; padding: 40px; }
  .window { width: 173px; aspect-ratio: 173 / 213; }
  .window .wf-img { height: 100%; }
  .gap { height: 90vh; }
</style>
</head>
<body>
<p class="demo-hint"><b>clip-stack-open</b> — As soon as it opens, photos inside the vertical window open from bottom to top one at a time, leaving only the last. The lower window opens once it scrolls into view. <span style="color:var(--kf-dim)">(After 1s one more window comes in, and one leaves 2.5s later)</span></p>
<div class="row" id="row">
  <div class="window" data-fx="clip-stack-open"><div class="wf-img" data-fx-part="shot" data-label="Photo 1"></div><div class="wf-img" data-fx-part="shot" data-label="Photo 2"></div><div class="wf-img" data-fx-part="shot" data-label="Photo 3"></div><div class="wf-img" data-fx-part="shot" data-label="Spare video slot"></div></div>
  <div class="window" data-fx="clip-stack-open" data-fx-clip-stack-open="gap: 0; each: .4" data-demo-remove><div class="wf-img" data-fx-part="shot" data-label="Drop 1"></div><div class="wf-img" data-fx-part="shot" data-label="Drop 2"></div></div>
</div>
<div class="gap"></div>
<div class="row"><div class="window" data-fx="clip-stack-open" data-fx-clip-stack-open="start: top 80%; delay: 0"><div class="wf-img" data-fx-part="shot" data-label="If Visible 1"></div><div class="wf-img" data-fx-part="shot" data-label="If Visible 2"></div><div class="wf-img" data-fx-part="shot" data-label="Stays if visible"></div></div></div>
<template data-demo-late><div class="window" data-fx="clip-stack-open" data-fx-clip-stack-open="gap: .3"><div class="wf-img" data-fx-part="shot" data-label="Late 1"></div><div class="wf-img" data-fx-part="shot" data-label="Remains Late"></div></div></template>
<div class="gap"></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => document.getElementById("row").append(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
