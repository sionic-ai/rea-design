<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>logo-wall — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo-spacer { height: 60vh; display: grid; place-items: center; color: var(--kf-dim); }
  [data-fx~="logo-wall"] { height: 60vh; background: var(--kf-contrast-bg); color: var(--kf-accent); margin: 0 20px 20px; }
  .demo-btn { margin: 0 20px; height: 40px; padding: 0 16px; border: 1px solid var(--kf-line); border-radius: var(--kf-radius-sm); background: var(--kf-surface); color: var(--kf-ink); cursor: pointer; }
</style>
</head>
<body>
<p class="demo-hint"><b>logo-wall</b> — Scroll down to see whether the wall builds up and the rows flow staggered. Press ‹Collapse› to bring it down and ‹Again› to rebuild it.</p>
<div class="demo-spacer">Downward</div>
<button class="demo-btn" type="button" onclick="document.querySelector('[data-fx~=logo-wall]').dispatchEvent(new Event('fx:collapse'))">Breaking down</button>
<button class="demo-btn" type="button" onclick="document.querySelector('[data-fx~=logo-wall]').dispatchEvent(new Event('fx:restart'))">Again</button>
<div data-fx="logo-wall"><svg data-fx-part="mark" viewBox="0 0 92 36"><path d="M2 2h20a10 10 0 0 1 0 20h-6l12 12H16L6 22v12H2Z"/><path d="M34 2h18a10 10 0 0 1 0 20h-14v12h-4Z"/><path d="M76 2h4l12 32h-6l-3-8H67l-3 8h-6Zm2 8-5 12h10Z"/></svg></div>
<div data-fx="logo-wall" data-fx-logo-wall="from: top; start: load" style="height:30vh"></div>
<div data-fx="logo-wall" style="height:0"></div>
<div class="demo-spacer">Footer</div>
<script>
(() => {
  const src = document.querySelector('[data-fx~="logo-wall"]');
  if (!src) return;
  const html = src.outerHTML.replace(/\sid="[^"]*"/g, "");
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => src.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical one comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
