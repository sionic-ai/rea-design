<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>wobble-ring-cursor — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { padding: 48px 20px; display: flex; flex-wrap: wrap; gap: 40px; align-items: center; justify-content: center; }
  .demo [data-fx] { display: grid; place-items: center; text-align: center; }
</style>
</head>
<body>
<p class="demo-hint"><b>wobble-ring-cursor</b> — Bring the mouse close to the ring. The ring keeps rippling, then swells toward the cursor.</p>
<section class="demo">
  <div data-fx="wobble-ring-cursor" data-demo-remove style="width: 200px">Being removed soon</div>
  <div data-fx="wobble-ring-cursor" style="width: 300px">Your text here</div>
  <div data-fx="wobble-ring-cursor" data-fx-wobble-ring-cursor="bulge: 40; reach: 600" style="width: 240px; --fx-ring-color: var(--kf-ink)">Swells larger</div>
  <template data-demo-late><div data-fx="wobble-ring-cursor" style="width: 160px">Late-arrived Ring</div></template>
</section>
<script>
(() => {
  const late = document.querySelector("[data-demo-late]");
  setTimeout(() => late.after(late.content.firstElementChild.cloneNode(true)), 1000);
  setTimeout(() => document.querySelector("[data-demo-remove]")?.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s one more ring comes in, and after 2.5s one drops out.");
})();
</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
