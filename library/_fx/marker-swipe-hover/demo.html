<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>marker-swipe-hover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { margin: 0; padding: 60px; font-family: var(--kf-font-sans); background: var(--kf-bg); color: var(--kf-ink); display: grid; gap: 36px; justify-items: start; }
  .row { display: flex; gap: 28px; align-items: center; flex-wrap: wrap; }
  .pill { display: inline-flex; align-items: center; gap: .6em; min-height: 48px; padding: 0 24px; border-radius: 999px; background: var(--kf-surface); border: 1px solid var(--kf-line); font-weight: 600; }
  .link { display: inline-flex; font-weight: 600; border-bottom: 1px solid var(--kf-line); padding-bottom: 4px; }
</style>
</head>
<body>
  <p class="demo-hint"><b>marker-swipe-hover</b> — Hover over a button or link — two highlighter strokes are drawn and the letters flip.</p>
  <div class="row">
    <a class="pill" data-fx="marker-swipe-hover" data-fx-marker-swipe-hover="look: accent" href="#">Book a consultation →</a>
    <a class="pill" data-fx="marker-swipe-hover" href="#">View work</a>
    <a class="link" data-fx="marker-swipe-hover" href="#">Get to know us →</a>
  </div>
  <template data-demo-late><a class="pill" data-fx="marker-swipe-hover" data-fx-marker-swipe-hover="dur: .3" href="#">Button enters 1s later (slow)</a></template>
  <a class="pill" data-fx="marker-swipe-hover" data-demo-remove href="#">Button that drops out after 2.5s</a>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
