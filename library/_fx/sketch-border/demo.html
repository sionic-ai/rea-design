<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sketch-border — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { display: flex; flex-wrap: wrap; gap: 64px; padding: 64px; }
  .photo { position: relative; width: 180px; aspect-ratio: 178 / 217; }
  .photo .wf-img { position: absolute; inset: 0; height: 100%; }
  .ring { position: absolute; inset: -12px; border: 5px solid var(--kf-accent); }
  .ring.is-ink { border-color: var(--kf-ink); }
</style>
</head>
<body>
<p class="demo-hint"><b>sketch-border</b> — Just watch. The border around the photo jitters 8 times per second like a hand-drawn line. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<section class="demo">
  <div class="photo"><div class="ring" data-fx="sketch-border"></div><div class="wf-img" data-label="Photo"></div></div>
  <div class="photo"><div class="ring is-ink" data-fx="sketch-border" data-fx-sketch-border="wobble: 2; fps: 12"></div><div class="wf-img" data-label="Photo"></div></div>
  <div class="photo" data-demo-remove><div class="ring" data-fx="sketch-border"></div><div class="wf-img" data-label="Omission"></div></div>
  <template data-demo-late><div class="photo"><div class="ring" data-fx="sketch-border"></div><div class="wf-img" data-label="Late"></div></div></template>
</section>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
