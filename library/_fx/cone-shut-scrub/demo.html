<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cone-shut-scrub — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: fixed; top: 0; left: 0; right: 0; z-index: 10; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-pre { height: 120vh; display: grid; place-items: center; }
  .demo-room { position: relative; height: 100vh; display: flex; overflow: clip; background: var(--kf-surface); }
  .demo-room .wf-img { position: absolute; inset: 20vh 30vw; width: auto; }
  .demo-wall { position: relative; width: 50%; height: 100%; background: var(--kf-contrast-bg); }
  .demo-wall:first-of-type { clip-path: polygon(0 0, 100% 0, 96% 100%, 0 100%); }
  .demo-wall:last-of-type { clip-path: polygon(0 0, 100% 0, 100% 100%, 4% 100%); }
  .demo-veil { position: absolute; inset: 0; z-index: 1; background: var(--kf-contrast-bg); }
  .demo-line { position: absolute; z-index: 2; left: 0; right: 0; top: 50%; text-align: center; color: var(--kf-contrast-ink); font: 500 20px/1.4 var(--kf-font-display); transform: skew(-20deg); }
  .demo-post { height: 60vh; }
</style>
</head>
<body>
<p class="demo-hint"><b>cone-shut-scrub</b> — Scroll down. The opened wall closes and darkens, then a single line settles in.</p>
<div class="demo-pre">Downward</div>
<section class="demo-room" data-fx="cone-shut-scrub">
  <div class="wf-img" data-label="Scene under the light"></div>
  <div class="demo-veil" data-fx-part="veil"></div>
  <div class="demo-wall" data-fx-part="wall"></div>
  <div class="demo-wall" data-fx-part="wall"></div>
  <p class="demo-line" data-fx-part="line">Your last line here...</p>
</section>
<div class="demo-post"><span data-fx="cone-shut-scrub" data-demo-remove></span><template data-demo-late><div data-fx="cone-shut-scrub" data-fx-cone-shut-scrub="angle: 0; blur: 0"></div></template></div>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
