<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>wave-swap-bg — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { margin: 0; color: var(--kf-contrast-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); color: var(--kf-ink); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  section { position: relative; z-index: 1; min-height: 100vh; display: grid; place-items: center; font: 600 40px/1.2 var(--kf-font-display); }
</style>
</head>
<body>
<p class="demo-hint"><b>wave-swap-bg</b> — Scroll down. In each section the background image changes, melting like a ripple. <span style="opacity:.6">(One more scene comes in after 1s, and one drops out after 2.5s)</span></p>
<div data-fx="wave-swap-bg">
  <div data-fx-part="scene"><svg viewBox="0 0 1600 1000"><rect width="1600" height="1000" fill="var(--kf-accent)"/><circle cx="1200" cy="300" r="180" fill="var(--kf-surface)"/></svg></div>
  <div data-fx-part="scene"><svg viewBox="0 0 1600 1000"><rect width="1600" height="1000" fill="var(--kf-contrast-bg)"/><rect x="200" y="500" width="1200" height="300" fill="var(--kf-accent-soft)"/></svg></div>
  <div data-fx-part="scene"><svg viewBox="0 0 1600 1000"><rect width="1600" height="1000" fill="var(--kf-accent-soft)"/><circle cx="400" cy="500" r="260" fill="var(--kf-ink)"/></svg></div>
</div>
<section data-bg-section>Scene One</section>
<section data-bg-section>Scene Two</section>
<section data-bg-section>Scene Three</section>
<div data-demo-remove></div>
<template data-demo-late><div data-fx="wave-swap-bg" style="position:absolute;inset:auto 20px 20px auto;width:240px;height:150px;z-index:2" data-fx-wave-swap-bg="sections: .none"><div data-fx-part="scene"><svg viewBox="0 0 160 100"><rect width="160" height="100" fill="var(--kf-accent)"/></svg></div></div></template>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="three-global.js"></script>
<script src="../../_vendor/three@0.185.0/build/three.cjs"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
gsap.registerPlugin(ScrollTrigger);
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
