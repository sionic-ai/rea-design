<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>scroll-drag-strip — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .strip { margin: 40px 0; }
  .strip [data-fx-part="track"] { gap: 20px; padding: 0 20px; }
  .tile { flex: none; width: min(25vw, 360px); aspect-ratio: 1; display: grid; place-items: center; background: var(--kf-surface); border: 1px solid var(--kf-line); border-radius: var(--kf-radius-sm); color: var(--kf-dim); }
  .tall { height: 220vh; padding: 40px 20px; color: var(--kf-dim); }
</style>
</head>
<body>
<p class="demo-hint"><b>scroll-drag-strip</b> — Scroll the page and the strip slides sideways, and you can grab and drag it. <span style="color:var(--kf-dim)">(After 1s one more band comes in, and one leaves 2.5s later)</span></p>
<div class="strip" data-fx="scroll-drag-strip"><div data-fx-part="track"><a class="tile" href="#">Cell 1</a><a class="tile" href="#">Cell 2</a><a class="tile" href="#">Cell 3</a><a class="tile" href="#">Cell 4</a><a class="tile" href="#">Cell 5</a><a class="tile" href="#">Cell 6</a><a class="tile" href="#">Cell 7</a></div></div>
<div class="strip" data-demo-remove data-fx="scroll-drag-strip" data-fx-scroll-drag-strip="clamp: 1; dur: 0"><div data-fx-part="track"><span class="tile">Direct 1</span><span class="tile">Direct 2</span><span class="tile">Direct 3</span><span class="tile">Direct 4</span><span class="tile">Direct 5</span></div></div>
<template data-demo-late><div class="strip" data-fx="scroll-drag-strip"><div data-fx-part="track"><span class="tile">Late 1</span><span class="tile">Late 2</span><span class="tile">Late 3</span><span class="tile">Late 4</span><span class="tile">Late 5</span></div></div></template>
<div class="strip" data-fx="scroll-drag-strip"></div>
<div class="tall">Scrolling down pushes the band to the right edge.</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/Draggable.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
