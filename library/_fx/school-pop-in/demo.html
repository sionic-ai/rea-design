<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>school-pop-in — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { padding: 48px 20px; }
  .demo-gap { height: 70vh; }
  .demo-big { margin: 0; font: 700 120px/1 var(--kf-font-display); letter-spacing: -0.05em; }
  .demo-wave { height: 70px; color: var(--kf-accent); }
</style>
</head>
<body>
<p class="demo-hint"><b>school-pop-in</b> — Scroll down until the school of fish enters the screen. Each piece switches on in a quick pop with a different length. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<section class="demo"><div class="demo-gap"></div><svg viewBox="0 0 240 120" width="360" data-fx="school-pop-in" style="color: var(--kf-accent)"><g transform="translate(10 20)"><g data-fx-part="item"><path d="M0 10c8-8 20-8 28 0-8 8-20 8-28 0Zm28 0 8-6v12Z" fill="currentColor"/></g></g><g transform="translate(70 50)"><g data-fx-part="item"><path d="M0 10c8-8 20-8 28 0-8 8-20 8-28 0Zm28 0 8-6v12Z" fill="currentColor"/></g></g><g transform="translate(130 15)"><g data-fx-part="item"><path d="M0 10c8-8 20-8 28 0-8 8-20 8-28 0Zm28 0 8-6v12Z" fill="currentColor"/></g></g><g transform="translate(180 70)"><g data-fx-part="item"><path d="M0 10c8-8 20-8 28 0-8 8-20 8-28 0Zm28 0 8-6v12Z" fill="currentColor"/></g></g><g transform="translate(40 85)"><g data-fx-part="item"><path d="M0 10c8-8 20-8 28 0-8 8-20 8-28 0Zm28 0 8-6v12Z" fill="currentColor"/></g></g></svg><div data-demo-remove data-fx="school-pop-in"></div><template data-demo-late><svg viewBox="0 0 240 120" width="360" data-fx="school-pop-in" style="color: var(--kf-accent)"><g transform="translate(10 20)"><g data-fx-part="item"><path d="M0 10c8-8 20-8 28 0-8 8-20 8-28 0Zm28 0 8-6v12Z" fill="currentColor"/></g></g><g transform="translate(70 50)"><g data-fx-part="item"><path d="M0 10c8-8 20-8 28 0-8 8-20 8-28 0Zm28 0 8-6v12Z" fill="currentColor"/></g></g><g transform="translate(130 15)"><g data-fx-part="item"><path d="M0 10c8-8 20-8 28 0-8 8-20 8-28 0Zm28 0 8-6v12Z" fill="currentColor"/></g></g><g transform="translate(180 70)"><g data-fx-part="item"><path d="M0 10c8-8 20-8 28 0-8 8-20 8-28 0Zm28 0 8-6v12Z" fill="currentColor"/></g></g><g transform="translate(40 85)"><g data-fx-part="item"><path d="M0 10c8-8 20-8 28 0-8 8-20 8-28 0Zm28 0 8-6v12Z" fill="currentColor"/></g></g></svg></template><div class="demo-gap"></div></section>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
