<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>glass-refract-box — refracting glass box</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { margin: 0; min-height: 100vh; background: var(--kf-contrast-bg); color: var(--kf-contrast-ink); font-family: var(--kf-font-sans); }
  .hint { margin: 0; padding: 24px; }
  .case { height: 70vh; }
  .case span { position: absolute; inset: 0; display: grid; place-items: center; font-size: 48px; font-weight: 700; }
</style>
</head>
<body>
<p class="hint">Drag the glass box in the center to rotate it — on release it spins with inertia then stops, and a rainbow edge forms at the corners.</p>
<figure class="case" data-fx="glass-refract-box"><span data-fx-part="label">MARK</span></figure>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="three-global.js"></script>
<script src="../../_vendor/three@0.155.0/build/three.cjs"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
  setTimeout(() => {
    const f = document.createElement("figure");
    f.dataset.fx = "glass-refract-box";
    f.innerHTML = '<span data-fx-part="label">LATE</span>';
    document.body.append(f);
    setTimeout(() => f.remove(), 1000);
  }, 1000);
</script>
</body>
</html>
