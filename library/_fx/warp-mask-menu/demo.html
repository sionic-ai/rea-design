<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>warp-mask-menu — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); min-height: 150vh; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { padding: 32px 20px; display: flex; gap: 24px; }
  .menu { position: relative; }
  .menu [data-fx-part="toggle"] { position: relative; z-index: 2; background: none; border: 0; cursor: pointer; color: var(--kf-ink); }
  .menu .label { position: relative; display: block; font: 500 11px/1.2 var(--kf-font-mono); letter-spacing: .2em; text-align: center; margin-bottom: 4px; }
  .menu [data-fx-part="open-label"] { position: absolute; inset: 0; }
  .menu .icon { position: relative; display: block; width: 45px; }
  .menu .icon svg { display: block; width: 100%; height: auto; }
  .menu .icon svg + svg { position: absolute; top: 0; left: 0; }
  .menu line { stroke: currentColor; }
  .menu [data-fx-part="panel"] { position: fixed; inset: 0; z-index: 1; display: flex; align-items: center; justify-content: center; background: var(--kf-surface); }
  .menu [data-fx-part="warp"] { display: flex; gap: 12vw; font: 300 40px/1 var(--kf-font-display); }
  .menu nav { display: grid; gap: 40px; }
</style>
</head>
<body>
<p class="demo-hint"><b>warp-mask-menu</b> — Press the MENU button. The panel spreads over with a brush-edge bleed, and the text wavers like a heat haze before settling. <span style="color:var(--kf-dim)">(After 1s one more button comes in, and after 2.5s one drops out)</span></p>
<section class="demo">
  <div class="menu" data-fx="warp-mask-menu">
    <button type="button" data-fx-part="toggle" aria-label="Menu">
      <span class="label"><span data-fx-part="open-label">MENU</span><span data-fx-part="close-label">CLOSE</span></span>
      <span class="icon">
        <svg viewBox="0 0 45 13" width="45" height="13"><line data-fx-part="line" x1="0" y1="0.5" x2="45" y2="0.5"/><line data-fx-part="line" x1="0" y1="6.5" x2="37" y2="6.5"/><line data-fx-part="line" x1="0" y1="12.5" x2="30" y2="12.5"/></svg>
        <svg viewBox="0 0 45 15" width="45" height="15"><line data-fx-part="cross" x1="8" y1="0" x2="37" y2="15"/><line data-fx-part="cross" x1="37" y1="0" x2="8" y2="15"/></svg>
      </span>
    </button>
    <div data-fx-part="panel">
      <div data-fx-part="warp"><nav><a href="#">Menu 1</a><a href="#">Menu 2</a><a href="#">Menu 3</a></nav><nav><a href="#">Menu 4</a><a href="#">Menu 5</a><a href="#">Menu 6</a></nav></div>
    </div>
  </div>
  <div class="menu" data-demo-remove data-fx="warp-mask-menu"><button type="button" data-fx-part="toggle">Soon-Removed Button</button><div data-fx-part="panel"></div></div>
  <template data-demo-late><div class="menu" data-fx="warp-mask-menu" data-fx-warp-mask-menu="dur: .6; scale: 80"><button type="button" data-fx-part="toggle"><span class="label"><span data-fx-part="open-label">OPEN</span><span data-fx-part="close-label">CLOSE</span></span></button><div data-fx-part="panel"><div data-fx-part="warp"><nav><a href="#">Late-arriving menu</a></nav></div></div></div></template>
</section>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
