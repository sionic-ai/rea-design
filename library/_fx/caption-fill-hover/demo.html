<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>caption-fill-hover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .row { display: flex; flex-wrap: wrap; gap: 24px; padding: 40px 20px; }
  .tile { width: 320px; height: 240px; background: var(--kf-accent-soft); }
  .tile .wf-img { height: 100%; }
  [data-fx-part="caption"] { max-width: 240px; padding: 10px 20px; }
  [data-fx-part="text"] { font-weight: 700; }
</style>
</head>
<body>
<p class="demo-hint"><b>caption-fill-hover</b> — Hover over a photo tile (the caption at bottom left fills up). <span style="color:var(--kf-dim)">(After 1s one more cell comes in, and one leaves 2.5s later)</span></p>
<div class="row">
  <figure class="tile" data-fx="caption-fill-hover"><div class="wf-img" data-label="Card payment scene · landscape"></div><div data-fx-part="caption"><i data-fx-part="fill"></i><span data-fx-part="text">Your one-line scene description here,<br>Second-line description</span></div></figure>
  <figure class="tile is-fx-on" data-fx="caption-fill-hover" data-demo-remove><div class="wf-img" data-label="Enabled cell · is-fx-on"></div><div data-fx-part="caption"><i data-fx-part="fill"></i><span data-fx-part="text">Cell left on</span></div></figure>
  <template data-demo-late><figure class="tile" data-fx="caption-fill-hover" style="--fx-fill: var(--kf-accent); --fx-dur: .8s"><div class="wf-img" data-label="Late-arriving cell"></div><div data-fx-part="caption"><i data-fx-part="fill"></i><span data-fx-part="text">Late-arriving cell</span></div></figure></template>
  <figure class="tile" data-fx="caption-fill-hover"><div class="wf-img" data-label="Cell with no description"></div></figure>
</div>
<script src="../fx-core.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
