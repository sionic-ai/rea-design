<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>heart-float-up — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .stage { position: relative; display: flex; gap: 80px; padding: 160px 80px; }
  .heart { display: block; width: 40px; height: 40px; background: var(--kf-accent); clip-path: path("M20 38C6 28 0 20 0 12A10 10 0 0 1 20 8 10 10 0 0 1 40 12c0 8-6 16-20 26Z"); }
</style>
</head>
<body>
<p class="demo-hint"><b>heart-float-up</b> — Hearts rise, grow and vanish, repeating (the second one 1 second late). <span style="color:var(--kf-dim)">(One more heart comes in after 1s, and one drops out after 2.5s)</span></p>
<div class="stage">
  <span data-fx="heart-float-up"><i class="heart"></i></span>
  <span data-fx="heart-float-up" style="--fx-delay: 1s"><i class="heart"></i></span>
  <span data-fx="heart-float-up" style="--fx-dur: 2s; --fx-scale: 1.6" data-demo-remove><i class="heart"></i></span>
  <template data-demo-late><span data-fx="heart-float-up" style="--fx-y: -200%"><i class="heart"></i></span></template>
</div>
<script src="../fx-core.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
