<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pupil-hop — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { display: flex; flex-wrap: wrap; gap: 40px; padding: 60px 20px; }
  .face { position: relative; width: 260px; aspect-ratio: 4 / 3; border-radius: 50% 50% 8px 8px; background: var(--kf-ink); }
  .eye { position: absolute; top: 28%; width: 18%; aspect-ratio: 1; border-radius: 50%; background: var(--kf-bg); }
  .eye:first-child { left: 26%; }
  .eye:last-child { left: 56%; }
  .eye i { position: absolute; inset: 0; width: 36%; height: 36%; margin: auto; border-radius: 50%; background: var(--kf-ink); }
</style>
</head>
<body>
<p class="demo-hint"><b>pupil-hop</b> — Watch the pupils move to a new spot every 1 second. <span style="color:var(--kf-dim)">(One more face comes in after 1s, and one drops out after 2.5s)</span></p>
<section class="demo">
  <div class="face" data-fx="pupil-hop"><span class="eye"><i data-fx-part="pupil"></i></span><span class="eye"><i data-fx-part="pupil"></i></span></div>
  <div class="face" data-demo-remove data-fx="pupil-hop" data-fx-pupil-hop="step: .5; reach: 60"><span class="eye"><i data-fx-part="pupil"></i></span><span class="eye"><i data-fx-part="pupil"></i></span></div>
  <template data-demo-late><div class="face" data-fx="pupil-hop" data-fx-pupil-hop="step: 2"><span class="eye"><i data-fx-part="pupil"></i></span><span class="eye"><i data-fx-part="pupil"></i></span></div></template>
</section>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
