<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>spin-boost-hover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { display: flex; flex-wrap: wrap; gap: 40px; padding: 48px 20px; align-items: center; }
  .badge { position: relative; display: grid; place-items: center; width: 112px; height: 112px; color: var(--kf-ink); }
  .badge svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .badge i { width: 40px; height: 40px; border: 2px solid currentColor; border-radius: 12px; }
</style>
</head>
<body>
<p class="demo-hint"><b>spin-boost-hover</b> — Hover over the badge. The text ring smoothly speeds up, then slows when released. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<section class="demo">
  <a class="badge" href="#" data-fx="spin-boost-hover"><svg data-fx-part="ring" viewBox="0 0 100 100" aria-hidden="true"><defs><path id="demo-ring" d="M50 50m-37 0a37 37 0 1 1 74 0a37 37 0 1 1-74 0"/></defs><text font-size="12" font-weight="700" fill="currentColor"><textPath href="#demo-ring" textLength="232.5" lengthAdjust="spacing">FOLLOW ON SOCIAL • Name here • </textPath></text></svg><i></i></a>
  <a class="badge" href="#" data-fx="spin-boost-hover" data-fx-spin-boost-hover="speed: -12; hover: -90; ease: 2" data-demo-remove><svg data-fx-part="ring" viewBox="0 0 100 100" aria-hidden="true"><text font-size="12" font-weight="700" fill="currentColor"><textPath href="#demo-ring" textLength="232.5" lengthAdjust="spacing">Reverse-spinning ring • Your text here • </textPath></text></svg><i></i></a>
  <template data-demo-late><a class="badge" href="#" data-fx="spin-boost-hover" data-fx-spin-boost-hover="speed: 40; hover: 0"><svg data-fx-part="ring" viewBox="0 0 100 100" aria-hidden="true"><text font-size="12" font-weight="700" fill="currentColor"><textPath href="#demo-ring" textLength="232.5" lengthAdjust="spacing">Ring that pauses on hover • your text here • </textPath></text></svg><i></i></a></template>
  <span class="badge" data-fx="spin-boost-hover"></span>
</section>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); }, 2500);
</script>
</body>
</html>
