<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>door-wipe-page — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { margin: 0; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  main { padding: 40px 20px; display: grid; gap: 16px; }
  main a { color: var(--kf-accent-text); }
</style>
</head>
<body>
<div data-fx="door-wipe-page" id="page">
<p class="demo-hint"><b>door-wipe-page</b> — Click the link below. An accent-color panel covers from the left over 1 second and moves on, then folds away to the right on the new page.</p>
<main id="main">
  <a href="demo.html?next=1">To another page on the same site</a>
  <a href="#top">Same-page anchor (not covered)</a>
</main>
</div>
<script>
// Late arrivals and removals — after 1 second one more panel attaches (late arrival), after 2.5 seconds that panel is removed (detach)
(() => {
  const late = document.createElement("section");
  setTimeout(() => { late.dataset.fx = "door-wipe-page"; late.innerHTML = '<a href="demo.html?late=1">Late-arriving panel link</a>'; document.getElementById("main")?.append(late); }, 1000);
  setTimeout(() => late.remove(), 2500);
})();
</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
