<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>scroll-turn — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { margin: 0; background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; margin: 0; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-spacer { height: 90vh; display: grid; place-items: center; color: var(--kf-dim); }
  .st-box { position: absolute; top: 10vh; left: 50%; width: 600px; height: 600px; margin-left: -300px; }
  .st-ring { position: absolute; inset: 0; border-radius: 50%; border: 12px solid var(--kf-accent); border-left-color: var(--kf-accent-soft); }
  .st-ring.is-b { inset: 30% -20% -20% 30%; border-color: var(--kf-ink); border-top-color: var(--kf-accent); }
</style>
</head>
<body>
<p class="demo-hint"><b>scroll-turn</b> Scroll and two big rings rotate .08° per 1px (only while visible, and in reverse when scrolling up).</p>
<div class="demo-spacer">Scroll down ↓</div>
<section style="position:relative;height:160vh;overflow:hidden" data-demo-host>
  <div class="st-box" data-fx="scroll-turn"><span class="st-ring"></span><span class="st-ring is-b"></span></div>
</section>
<div class="demo-spacer"></div>
<script>
// Late arrivals and removals — checks that fx-core attaches to an element added after 1s and detaches from an element removed after 2.5s
(() => {
  const src = document.querySelector('[data-fx~="scroll-turn"]');
  if (!src) return;
  const html = src.outerHTML.replace(/\sid="[^"]*"/g, "");
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const host = src.closest("[data-demo-host]") || src;
  const gone = make("gone");
  host.after(gone);
  setTimeout(() => (src.closest(".pin-spacer") || host).after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical one comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>

<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
