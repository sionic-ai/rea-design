<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>frame-window-zoom — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { margin: 0; background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: fixed; top: 0; left: 0; right: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .stage { position: fixed; inset: 0; }
  .stage [data-fx-part="bg"] { background: var(--kf-raised); }
  .stage [data-fx-part="window"] .wf-img { position: absolute; inset: 0; height: 100%; }
  .stage [data-fx-part="frame"] svg { position: absolute; left: 50.69%; top: 40%; width: 23.6vw; translate: -50% -50%; overflow: visible; }
  .spacer { height: 400vh; }
  .late { position: relative; height: 60vh; margin-top: 10vh; }
</style>
</head>
<body>
<p class="demo-hint"><b>frame-window-zoom</b> — Scroll down. The oval window inside the frame grows and fades, then disappears after 2 screens. <span style="color:var(--kf-dim)">(After 1s one more panel comes in, and one leaves 2.5s later)</span></p>
<section class="stage" data-fx="frame-window-zoom">
  <div data-fx-part="bg"></div>
  <div data-fx-part="window"><div class="wf-img" data-label="Portrait photo to go inside the frame"></div></div>
  <div data-fx-part="frame"><svg viewBox="0 0 400 480"><ellipse cx="200" cy="240" rx="196" ry="236" fill="none" stroke="currentColor" stroke-width="10"/><ellipse cx="200" cy="240" rx="176" ry="214" fill="none" stroke="currentColor" stroke-width="4"/></svg></div>
</section>
<section class="late" data-demo-remove data-fx="frame-window-zoom" data-fx-frame-window-zoom="base: 200; rate: .1"><div data-fx-part="window"><div class="wf-img" data-label="Panel to Be Removed"></div></div></section>
<template data-demo-late><section class="late" data-fx="frame-window-zoom" data-fx-frame-window-zoom="x: 50; y: 50; until: 3"><div data-fx-part="window"><div class="wf-img" data-label="Late-arriving panel"></div></div></section></template>
<section data-fx="frame-window-zoom"></section>
<div class="spacer"></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
