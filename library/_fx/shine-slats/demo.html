<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>shine-slats — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { display: grid; gap: 40px; padding: 40px 20px; max-width: 900px; margin: 0 auto; }
  .demo [data-fx] { aspect-ratio: 16 / 9; }
  .demo .wf-img { height: 100%; background: var(--kf-accent-soft); }
  .demo-spacer { height: 80vh; display: grid; place-items: center; color: var(--kf-dim); }
</style>
</head>
<body>
<p class="demo-hint"><b>shine-slats</b> — On load, four white vertical bands over the first photo lift in turn from the left. The photos below lift when they come into view. <span style="color:var(--kf-dim)">(One more photo comes in after 1s, and one drops out after 2.5s)</span></p>
<section class="demo">
  <div data-fx="shine-slats" style="--fx-shine: color-mix(in oklab, var(--kf-bg) 60%, transparent)"><div class="wf-img" data-label="Inside the store · daytime natural light · 16:9"></div></div>
  <div data-demo-remove data-fx="shine-slats"><div class="wf-img" data-label="Disappearing photo"></div></div>
</section>
<div class="demo-spacer">Scroll down</div>
<section class="demo">
  <div data-fx="shine-slats" data-fx-shine-slats="on: scroll; count: 6; each: .08" style="--fx-shine: color-mix(in oklab, var(--kf-bg) 60%, transparent)"><div class="wf-img" data-label="Six bands · when visible"></div></div>
  <template data-demo-late><div data-fx="shine-slats" data-fx-shine-slats="on: scroll" style="--fx-shine: color-mix(in oklab, var(--kf-bg) 60%, transparent)"><div class="wf-img" data-label="Late-arriving photo"></div></div></template>
  <div data-fx="shine-slats"></div>
</section>
<div class="demo-spacer"></div>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
