<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fluid-sheen — Swirling fluid glow</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { margin: 0; background: var(--kf-bg); color: var(--kf-ink); font-family: var(--kf-font-sans); }
  .stage { min-height: 100vh; background: color-mix(in oklab, var(--kf-ink) 30%, var(--kf-bg)); color: var(--kf-surface); }
  .hint { position: relative; z-index: 1; margin: 0; padding: 24px; }
</style>
</head>
<body>
<section class="stage" data-fx="fluid-sheen">
  <p class="hint">Sweep the mouse over the panel — bright light spreads like water and settles in a little over 1s. Clicking leaves a small mark too.</p>
</section>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
  setTimeout(() => { const s = document.createElement("div"); s.dataset.fx = "fluid-sheen"; s.style.cssText = "height:40vh"; document.body.append(s); setTimeout(() => s.remove(), 1000); }, 1000);
</script>
</body>
</html>
