<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dot-ring-trail-cursor — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { padding: 48px 20px; display: grid; gap: 24px; }
  .dark { padding: 48px; background: var(--kf-ink); color: var(--kf-bg); }
  .demo a { text-decoration: underline; }
</style>
</head>
<body>
<p class="demo-hint"><b>dot-ring-trail-cursor</b> — Move the mouse and hover over a link. On dark panels the dot changes color.</p>
<div data-fx="dot-ring-trail-cursor"></div>
<section class="demo" data-cursor-theme="light"><a href="#">Link one</a><button type="button">Button</button>
  <div class="dark" data-cursor-theme="dark">Dark board — <a href="#">Link Two</a></div></section>
<div data-fx="dot-ring-trail-cursor" data-demo-remove></div>
<template data-demo-late><div data-fx="dot-ring-trail-cursor" data-fx-dot-ring-trail-cursor="lead: .5; trail: .2"></div></template>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
