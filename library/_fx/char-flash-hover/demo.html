<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>char-flash-hover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { padding: 48px 20px; display: grid; gap: 28px; }
  .nav { display: flex; flex-wrap: wrap; gap: 24px; font: 500 18px/1.2 var(--kf-font-mono); text-transform: uppercase; }
  .link { font: 500 16px/1.2 var(--kf-font-mono); text-transform: uppercase; color: var(--kf-accent); }
</style>
</head>
<body>
<p class="demo-hint"><b>char-flash-hover</b> — Hover over the menu text. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<section class="demo">
  <nav class="nav"><a href="#"><span data-fx="char-flash-hover">Menu 1</span></a><a href="#"><span data-fx="char-flash-hover">Work</span></a><a href="#" data-demo-remove><span data-fx="char-flash-hover">Being removed soon</span></a><template data-demo-late><a href="#"><span data-fx="char-flash-hover">Enters late</span></a></template></nav>
  <a class="link" href="#"><span data-fx="char-flash-hover" data-fx-char-flash-hover="step: 0.03" style="--fx-flash-bg: var(--kf-accent)">Your one link here</span></a>
  <span data-fx="char-flash-hover"></span>
</section>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); }, 2500);
</script>
</body>
</html>
