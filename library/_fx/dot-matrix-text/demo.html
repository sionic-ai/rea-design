<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dot-matrix-text — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-spacer { height: 70vh; display: grid; place-items: center; color: var(--kf-dim); }
  .quote { height: 320vh; }
  .quote__pin { position: sticky; top: 0; height: 100vh; display: grid; place-items: center; text-align: center; overflow: hidden; }
  .quote h2 { margin: 0; font: var(--kf-weight-display) clamp(40px, 7vw, 96px)/0.95 var(--kf-font-display); text-transform: uppercase; }
  .quote p { margin: 24px auto 0; max-width: 30em; color: var(--kf-dim); }
</style>
</head>
<body>
<p class="demo-hint"><b>dot-matrix-text</b> — Scroll down. Big dots covering the screen shrink into letters, and at the end the real letters come out wiped by a slanted blade.</p>
<div class="demo-spacer">Top margin</div>
<section class="quote" data-fx="dot-matrix-text">
  <div class="quote__pin"><div><h2 data-fx-part="text"><span data-fx-part="line">Your heritage here</span><br><span data-fx-part="line">Memorable quote</span><br><span data-fx-part="line">Third line</span></h2><p data-fx-part="desc">Your two lines here unpacking the quote.</p></div></div>
</section>
<div class="demo-spacer">Bottom margin</div>
<script>
// Late arrivals and removals: after 1 second one more of the same section is attached, and after 2.5 seconds it is removed
(() => {
  const src = document.querySelector('[data-fx~="dot-matrix-text"]');
  const make = () => { const t = document.createElement("template"); t.innerHTML = src.outerHTML; const el = t.content.firstElementChild; el.dataset.demo = "late"; el.style.height = "200vh"; return el; };
  let late = null;
  setTimeout(() => { late = make(); document.body.append(late); ScrollTrigger.refresh(); }, 1000);
  setTimeout(() => late?.remove(), 2500);
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
