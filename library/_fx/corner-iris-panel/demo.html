<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>corner-iris-panel — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; min-height: 100vh; }
  .demo-hint { margin: 0; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-bg { position: fixed; inset: 0; z-index: -1; background: repeating-linear-gradient(45deg, var(--kf-raised) 0 14px, var(--kf-bg) 14px 28px); }
  .demo-open { margin: 20px; padding: 8px 14px; border: 1px solid var(--kf-line); background: var(--kf-surface); cursor: pointer; }
  .panel { position: relative; margin: 0 20px; max-width: 460px; }
  .panel [data-fx-part="veil"] { position: fixed; top: 0; left: 0; width: 760px; height: 760px; }
  .panel [data-fx-part="body"] { position: relative; padding: 20px; font-size: 13px; }
  .panel [data-fx-part="body"] p { margin: 0 0 12px; }
  .panel button[data-fx-part="close"] { font-weight: 700; background: none; border: 0; padding: 0; cursor: pointer; }
</style>
</head>
<body>
<div class="demo-bg" aria-hidden="true"></div>
<p class="demo-hint"><b>corner-iris-panel</b> — Press “Open” and a circle spreads from the top left, the background dims and blurs, and the text panel opens. “Close” or Esc folds it.</p>
<button class="demo-open" type="button">Open</button>
<aside class="panel" data-fx="corner-iris-panel">
  <div data-fx-part="veil"></div>
  <div data-fx-part="body">
    <p><b>Your about title here</b></p>
    <p>Your body text here, about four lines. Briefly state what you made and where you started.</p>
    <p><a href="#">Your link here</a></p>
    <button type="button" data-fx-part="close">Close</button>
  </div>
</aside>
<script>
// Late arrivals and removals — after 1 second one more plate comes in (late arrival), and after 2.5 seconds it is removed (detach)
(() => {
  const src = document.querySelector('[data-fx~="corner-iris-panel"]');
  document.querySelector(".demo-open").addEventListener("click", () => document.querySelectorAll('[data-fx~="corner-iris-panel"]').forEach((p) => p.dispatchEvent(new CustomEvent("fx:toggle"))));
  let late;
  setTimeout(() => { late = src.cloneNode(true); late.querySelector('[data-fx-part="veil"]')?.remove(); document.body.append(late); }, 1000);
  setTimeout(() => late?.remove(), 2500);
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
