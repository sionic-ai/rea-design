<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>char-random-pop — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 2; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .hero { display: grid; place-items: center; height: 60vh; border-radius: 0 0 30px 30px; background: var(--kf-raised); }
  .hero h1 { font: 700 110px/0.9 var(--kf-font-display); text-transform: uppercase; }
  .gap { height: 80vh; }
</style>
</head>
<body>
<p class="demo-hint"><b>char-random-pop</b> — On open, after .6s the heading letters randomly pop and grow. Headings below do so when visible. <span style="color:var(--kf-dim)">(One more title comes in after 1s, and one drops out after 2.5s)</span></p>
<section class="hero"><h1 data-fx="char-random-pop">About Us</h1></section>
<section class="hero" data-demo-remove><h1 data-fx="char-random-pop" data-fx-char-random-pop="delay: 0; dur: 1">Remove</h1></section>
<div class="gap"></div>
<section class="hero" id="late"><h1 data-fx="char-random-pop" data-fx-char-random-pop="start: top 70%; from: start">Recruit</h1></section>
<template data-demo-late><section class="hero"><h1 data-fx="char-random-pop">Late</h1></section></template>
<div class="gap"></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../../../_shared/vendor/gsap/CustomEase.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
