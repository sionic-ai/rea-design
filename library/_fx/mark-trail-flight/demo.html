<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mark-trail-flight — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; padding: 20px; }
  .box { aspect-ratio: 16 / 10; border: 1px solid var(--kf-line); background: var(--kf-surface); }
</style>
</head>
<body>
<p class="demo-hint"><b>mark-trail-flight</b> — Symbols fly around trailing tails. Move the mouse into the panel and they chase it. <span style="color:var(--kf-dim)">(After 1s one more panel comes in, and one leaves 2.5s later)</span></p>
<section class="grid">
  <div class="box" data-fx="mark-trail-flight"><svg data-fx-part="mark" viewBox="0 0 24 24"><path d="M4 2h9a9 9 0 0 1 0 18H4v-4h3v-3H4V9h3V6H4z"/></svg></div>
  <div class="box" data-demo-remove data-fx="mark-trail-flight" data-fx-mark-trail-flight="ghosts: 6; gap: .9"></div>
  <template data-demo-late><div class="box" data-fx="mark-trail-flight" data-fx-mark-trail-flight="max: 60"></div></template>
  <div data-fx="mark-trail-flight" style="height:0"></div>
</section>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
