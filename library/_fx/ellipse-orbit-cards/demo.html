<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ellipse-orbit-cards — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .orbit { height: 86svh; padding: 64px 3vw 76px; display: grid; place-items: center; border-bottom: 1px solid var(--kf-line); }
  .orbit .wf-img { height: 100%; border: 0; }
  .copy { max-width: 420px; text-align: center; font: 400 clamp(22px, 2.4vw, 36px)/1.15 var(--kf-font-display); letter-spacing: -0.03em; }
  .small { height: 60svh; }
  .demo-spacer { height: 40vh; display: grid; place-items: center; color: var(--kf-dim); }
</style>
</head>
<body>
<p class="demo-hint"><b>ellipse-orbit-cards</b> — Cards orbit along an ellipse. Put your hand over a card to stop it, and drag to rotate. Move the mouse and the ring follows slightly.</p>
<section class="orbit" data-fx="ellipse-orbit-cards" id="a">
  <div data-fx-part="track"></div>
  <p class="copy" data-fx-part="clear">Your two-line center intro text here.</p>
</section>
<div id="later"></div>
<section class="orbit small" data-fx="ellipse-orbit-cards" data-fx-ellipse-orbit-cards="period: 30; hold: none" id="gone">
  <div data-fx-part="track"></div>
  <p class="copy" data-fx-part="clear">Loop to be erased soon</p>
</section>
<div class="demo-spacer">Body slot</div>
<script>
  const fill = (sec, n) => {
    const t = sec.querySelector('[data-fx-part="track"]');
    t.innerHTML = Array.from({ length: n }, (_, i) => `<a data-fx-part="card" href="#" draggable="false"><span data-fx-part="face"><span class="wf-img" data-label="Photo ${i + 1}"></span></span></a>`).join("");
  };
  fill(document.getElementById("a"), 18);
  fill(document.getElementById("gone"), 10);
  setTimeout(() => {
    document.getElementById("later").innerHTML = `<section class="orbit small" data-fx="ellipse-orbit-cards" data-fx-ellipse-orbit-cards="intro: burst"><div data-fx-part="track"></div><p class="copy" data-fx-part="clear">Ring that enters 1 second later — piles up, then scatters</p></section>`;
    const s = document.querySelector("#later section");
    fill(s, 12);
    setTimeout(() => { s.dispatchEvent(new Event("fx:card")); setTimeout(() => s.dispatchEvent(new Event("fx:burst")), 1150); }, 300);
  }, 1000);
  setTimeout(() => document.getElementById("gone").remove(), 1500);
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/CustomEase.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
