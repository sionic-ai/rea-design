<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>corner-swap-btn — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 24px; padding: 48px 20px; }
  .demo-btn { display: inline-flex; gap: 12px; padding: 15px 22px 14px 20px; background: var(--kf-accent); color: var(--kf-on-accent); font: 700 15px/1 var(--kf-font-sans); }
  .demo-card { width: 420px; padding: 40px; background: var(--kf-accent-soft); font: 700 32px/1 var(--kf-font-display); --fx-r: 4rem; --fx-dur: .6s; }
</style>
</head>
<body>
<p class="demo-hint"><b>corner-swap-btn</b> — Hover over the button or card. The rounded corner shifts and the arrow spins.</p>
<section class="demo">
  <a class="demo-btn" href="#" data-fx="corner-swap-btn">Get started <span data-fx-part="arrow">↗</span></a>
  <div class="demo-card" data-fx="corner-swap-btn" data-fx-corner-swap-btn="look: start">One card in the stack</div>
</section>
<script>
(() => {
  const src = document.querySelector('[data-fx~="corner-swap-btn"]');
  if (!src) return;
  const html = src.outerHTML;
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => src.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical one comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="../fx-core.js"></script>
</body>
</html>
