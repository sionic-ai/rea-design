<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>velocity-skew — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; padding: 40px 24px 60vh; }
  .card { aspect-ratio: 674 / 460; background: var(--kf-raised); display: grid; place-items: center; }
  .card:nth-child(even) { margin-top: 120px; }
</style>
</head>
<body>
<p class="demo-hint"><b>velocity-skew</b> — Scroll fast. The card bends at a slant by the speed, then straightens out. <span style="color:var(--kf-dim)">(One more card comes in after 1s, and one drops out after 2.5s)</span></p>
<section class="grid">
  <div class="card" data-fx="velocity-skew">Card 1</div><div class="card" data-fx="velocity-skew">Card 2</div>
  <div class="card" data-fx="velocity-skew" data-demo-remove>Card to Be Removed</div><div class="card" data-fx="velocity-skew" data-fx-velocity-skew="max: 6">Card 4</div>
  <template data-demo-late><div class="card" data-fx="velocity-skew">Late Card</div></template>
  <div class="card" data-fx="velocity-skew">Card 6</div>
</section>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); window.ScrollTrigger?.refresh(); }, 2500);
</script>
</body>
</html>
