<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>twin-ring-btn — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.6 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .row { display: flex; flex-wrap: wrap; gap: 32px; justify-content: center; padding: 60px 20px; }
  .btn { width: 262px; height: 54px; font-size: 15px; letter-spacing: -.05em; }
  .dark { background: var(--kf-contrast-bg); color: var(--kf-contrast-ink); }
</style>
</head>
<body>
<p class="demo-hint"><b>twin-ring-btn</b> — Hover over the button. The inner border spreads outward and fades while the letters ripple from the front. <span style="color:var(--kf-dim)">(After 1s one more button comes in, and after 2.5s one drops out)</span></p>
<div class="row" data-late-row>
  <a class="btn" href="#" data-fx="twin-ring-btn"><span data-fx-part="label">Your button to About here</span></a>
  <a class="btn" href="#" data-fx="twin-ring-btn" data-demo-remove><span data-fx-part="label">Exit button</span></a>
  <a class="btn" href="#" data-fx="twin-ring-btn" style="width:149px;height:44px">Textless theme only</a>
</div>
<div class="row dark">
  <a class="btn" href="#" data-fx="twin-ring-btn" style="--fx-ring: var(--kf-contrast-ink); --fx-wave-1: var(--kf-accent-soft); --fx-wave-2: var(--kf-dim); width: 216px"><span data-fx-part="label">Button over a dark photo</span></a>
</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelector("[data-late-row]").insertAdjacentHTML("beforeend", '<a class="btn" href="#" data-fx="twin-ring-btn"><span data-fx-part="label">Late-arrived Button</span></a>'), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
