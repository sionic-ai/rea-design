<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>step-blink-boundary — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .top { height: 90vh; background: var(--kf-contrast-bg); color: var(--kf-contrast-ink); display: grid; place-items: center; }
  .bottom { height: 90vh; background: linear-gradient(120deg, var(--kf-accent-soft), var(--kf-accent)); display: grid; place-items: center; }
</style>
</head>
<body>
<p class="demo-hint"><b>step-blink-boundary</b> Scroll down. The cells between the dark panel and the panel below flicker and vanish step by step like stairs. <span style="color:var(--kf-dim)">(After 1s one more boundary comes in, and after 2.5s one drops out)</span></p>
<div class="top">Top panel</div>
<div data-fx="step-blink-boundary">
  <div data-fx-part="row"><i data-fx-part="box" style="width: 1.7%"></i><i data-fx-part="keep" style="width: 33%"></i><i data-fx-part="box" style="width: 12.5%"></i><i data-fx-part="keep" style="width: 50.8%"></i><i data-fx-part="box" style="width: 2%"></i></div>
  <div data-fx-part="row"><i data-fx-part="box" style="width: 1.7%"></i><i data-fx-part="keep" style="width: 33%"></i><i data-fx-part="box" style="width: 44.7%"></i><i data-fx-part="keep" style="width: 14.9%"></i><i data-fx-part="box" style="width: 5.7%"></i></div>
  <div data-fx-part="row"><i data-fx-part="box" style="width: 35%"></i><i data-fx-part="keep" style="width: 8.3%"></i><i data-fx-part="box" style="width: 56.7%"></i></div>
</div>
<div class="bottom">Lower panel</div>
<div data-demo-remove data-fx="step-blink-boundary" data-fx-step-blink-boundary="look: short" style="--fx-box: var(--kf-accent)">
  <div data-fx-part="row" style="--fx-row: 48px"><i data-fx-part="box" style="width: 11%"></i><i data-fx-part="keep" style="width: 33%"></i><i data-fx-part="box" style="width: 56%"></i></div>
</div>
<template data-demo-late><div data-fx="step-blink-boundary"><div data-fx-part="row"><i data-fx-part="box" style="width: 60%"></i><i data-fx-part="keep" style="width: 40%"></i></div></div></template>
<div data-fx="step-blink-boundary"></div>
<div class="top">Footer</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); window.ScrollTrigger?.refresh(); }, 2500);
</script>
</body>
</html>
