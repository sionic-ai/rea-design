<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>blob-morph — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 40px; padding: 48px 20px; }
  .shot { width: 100%; aspect-ratio: 540 / 367; background: var(--kf-ink); }
  .shot.is-tall { aspect-ratio: 420 / 300; }
</style>
</head>
<body>
<p class="demo-hint"><b>blob-morph</b> — Hold still. The photo border slowly ripples over 20 seconds. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<section class="demo">
  <figure class="shot" data-fx="blob-morph" data-demo-remove></figure>
  <figure class="shot is-tall" data-fx="blob-morph" data-fx-blob-morph="look: pebble"></figure>
  <figure class="shot" data-fx="blob-morph" data-fx-blob-morph="look: round" style="--fx-dur: 10s; --fx-delay: -5s"></figure>
  <template data-demo-late><figure class="shot" data-fx="blob-morph" style="--fx-delay: -10s"></figure></template>
</section>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
