<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>digit-box-loader — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); min-height: 100vh; }
  .demo-hint { position: sticky; top: 0; z-index: 1000; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-window { position: fixed; left: 50%; top: 50%; width: min(520px, 56vw); aspect-ratio: 1.55 / 1; translate: -50% -50%; border-radius: 30px; background: var(--kf-contrast-bg); }
  .demo button { position: fixed; left: 20px; bottom: 20px; padding: 8px 14px; border: 1px solid var(--kf-line); border-radius: var(--kf-radius-sm); background: var(--kf-surface); }
</style>
</head>
<body>
<p class="demo-hint"><b>digit-box-loader</b> — The number climbs, and at 100 the cover folds down to the size of the center window. Reload to see it again. <span style="color:var(--kf-dim)">(After 1s the second layer comes in, and 2.5s later the third layer leaves)</span></p>
<div class="demo-window"></div>
<div class="demo"><button type="button" id="go">Finish right away with fx:go</button></div>
<div id="main" data-fx="digit-box-loader" data-fx-digit-box-loader="to: .demo-window; ready: 3" role="status" aria-label="000">
  <div data-fx-part="counter"><span data-fx-part="box"><span data-fx-part="digit">0</span></span><span data-fx-part="box"><span data-fx-part="digit">0</span></span><span data-fx-part="box"><span data-fx-part="digit">0</span></span></div>
</div>
<div data-demo-remove data-fx="digit-box-loader" data-fx-digit-box-loader="wait: true" role="status"><div data-fx-part="counter"><span data-fx-part="box"><span data-fx-part="digit">0</span></span></div></div>
<template data-demo-late><div data-fx="digit-box-loader" data-fx-digit-box-loader="ready: 1.5; collapse: .6" role="status"><div data-fx-part="counter"><span data-fx-part="box"><span data-fx-part="digit">0</span></span><span data-fx-part="box"><span data-fx-part="digit">0</span></span></div></div></template>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
document.getElementById("go").addEventListener("click", () => document.querySelectorAll('[data-fx~="digit-box-loader"]').forEach((n) => n.dispatchEvent(new CustomEvent("fx:go"))));
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
