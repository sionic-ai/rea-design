<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>glitch-half-title — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { padding: 48px 20px; }
  .demo-spacer { height: 80vh; display: grid; place-items: center; color: var(--kf-dim); }
  .t { margin: 0 0 80px; font: 400 64px/1.1 var(--kf-font-display); }
  .t.big { font-size: 120px; text-align: center; }
</style>
</head>
<body>
<p class="demo-hint"><b>glitch-half-title</b> — Scroll down. Title letters wobble as top and bottom halves, then interlock. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<section class="demo">
  <h2 class="t" data-fx="glitch-half-title">What We Do</h2>
  <div class="demo-spacer">Downward</div>
  <h2 class="t big" data-demo-remove data-fx="glitch-half-title" data-fx-glitch-half-title="scale: 1; each: .05">Achievement</h2>
  <h2 class="t" data-fx="glitch-half-title">Your two-word Korean title here</h2>
  <template data-demo-late><h2 class="t" data-fx="glitch-half-title">Late Title</h2></template>
  <h2 data-fx="glitch-half-title"></h2>
  <div class="demo-spacer">Footer</div>
</section>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); window.ScrollTrigger?.refresh(); }, 2500);
</script>
</body>
</html>
