<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>overlap-push-hover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); overflow-x: clip; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo-spacer { height: 70vh; display: grid; place-items: center; color: var(--kf-dim); }
  .stack { display: flex; justify-content: center; align-items: center; padding: 68px 0; }
  .stack [data-fx-part="card"] { width: 26vw; max-width: 380px; min-height: 300px; padding: 28px; border-radius: var(--kf-radius-lg); background: var(--kf-surface); box-shadow: var(--kf-shadow-lift); }
  .stack [data-fx-part="card"]:nth-child(2) { margin: -8vw 0 0 -10vw; background: var(--kf-accent-soft); }
  .stack [data-fx-part="card"]:nth-child(n + 3) { margin-left: -10vw; }
</style>
</head>
<body>
<p class="demo-hint"><b>overlap-push-hover</b> — Scrolling down, cards fly in and stack overlapping. Hover over a card. <span style="color:var(--kf-dim)">(One more bundle comes in after 1s, and one drops out after 2.5s)</span></p>
<div class="demo-spacer">Scroll down</div>
<section class="stack" data-demo-remove data-fx="overlap-push-hover"><article data-fx-part="card">Card 1</article><article data-fx-part="card">Card 2</article><article data-fx-part="card">Card 3</article><article data-fx-part="card">Card 4</article></section>
<section class="stack" data-fx="overlap-push-hover" data-fx-overlap-push-hover="push: 0,7,5,5 / 2,0,2,2 / -15,-8,0,10 / -10,-8,-10,0"><article data-fx-part="card">Photo 1</article><article data-fx-part="card">Photo 2</article><article data-fx-part="card">Photo 3</article><article data-fx-part="card">Photo 4</article></section>
<template data-demo-late><section class="stack" data-fx="overlap-push-hover" data-fx-overlap-push-hover="enter: none"><article data-fx-part="card">Late 1</article><article data-fx-part="card">Late 2</article></section></template>
<div data-fx="overlap-push-hover"></div>
<div class="demo-spacer">Footer</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../../../_shared/vendor/gsap/CustomEase.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); window.ScrollTrigger?.refresh(); }, 2500);
</script>
</body>
</html>
