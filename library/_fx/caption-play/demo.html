<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>caption-play — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { padding: 48px 20px; }
  .demo-btn { display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 16px; border: 1px solid var(--kf-line); border-radius: var(--kf-radius-sm); background: var(--kf-surface); color: var(--kf-ink); cursor: pointer; }
  .demo-card { padding: 20px; border: 1px solid var(--kf-line); border-radius: var(--kf-radius-md); background: var(--kf-surface); }
  .demo-spacer { height: 90vh; display: grid; place-items: center; color: var(--kf-dim); }
  .film { position: relative; height: 90vh; background: var(--kf-contrast-bg); color: var(--kf-contrast-ink); overflow: hidden; }
  .film span { position: absolute; font: 12px var(--kf-font-mono); text-transform: uppercase; }
  .film .shot { position: absolute; left: 41%; top: 32%; width: 18%; aspect-ratio: 16/9.5; height: auto; }
  .bar { position: absolute; left: 13%; right: 13%; bottom: 18%; display: flex; align-items: center; gap: 14px; font: 11px var(--kf-font-mono); }
  .bar i { position: relative; flex: 1; height: 1px; background: var(--kf-dim); } .bar b { top: -3px; width: 7px; height: 7px; border-radius: 50%; background: var(--kf-bg); }
</style>
</head>
<body>
<p class="demo-hint"><b>caption-play</b> — When the film panel reaches mid-screen, caption words light up one by one, and the play dot below travels to the end over 32s.</p>
<div class="demo-spacer">Scroll down ↓</div><section class="film" data-fx="caption-play"><div class="shot wf-img" data-label="B&W video still · 16:9"></div>
<span data-fx-part="word" style="left:12%;top:18%">Here</span><span data-fx-part="word" style="left:70%;top:22%">Subtitles</span><span data-fx-part="word" style="left:20%;top:70%">Word</span><span data-fx-part="word" style="left:64%;top:66%">One by one</span><span data-fx-part="word" style="left:44%;top:82%">Turns on</span>
<div class="bar"><span style="position:static">▶</span><i><b data-fx-part="knob"></b></i><span style="position:static">0:00 / 0:32</span></div></section><div class="demo-spacer"></div>
<script>
// Late arrivals and removals — checks that fx-core attaches to an element added after 1s and detaches from an element removed after 2.5s
(() => {
  const src = document.querySelector('[data-fx~="caption-play"]');
  if (!src) return;
  const html = src.outerHTML.replace(/\sid="[^"]*"/g, "");
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => (src.closest(".pin-spacer") || src).after(make("late")), 1000); // Once pinned the panel gets wrapped in a pin-spacer, so place it outside that
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical one comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
