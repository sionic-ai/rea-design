<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>dot-burst-reveal — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { margin: 0; padding: 48px; font-family: var(--kf-font-sans); background: var(--kf-bg); color: var(--kf-ink); display: grid; gap: 32px; }
  .stage { height: 420px; display: grid; place-items: center; background: var(--kf-surface); }
  .stage h2 { font-size: 72px; letter-spacing: -.02em; }
  .small { height: 200px; display: grid; place-items: center; }
</style>
</head>
<body>
  <p class="demo-hint"><b>dot-burst-reveal</b> — Hover over the letter ball on the dot panel — the ball bursts, erasing the dots and revealing the text below (it does so by itself after 8 seconds idle).</p>
  <section class="stage" data-fx="dot-burst-reveal"><h2>Hidden text</h2></section>
  <template data-demo-late><section class="small" data-fx="dot-burst-reveal" data-fx-dot-burst-reveal="word: LATE; idle: 3000"><p>Panel entering after 1s</p></section></template>
  <section class="small" data-fx="dot-burst-reveal" data-demo-remove><p>Panel that drops out after 2.5s</p></section>
  <section class="small" data-fx="dot-burst-reveal" data-fx-dot-burst-reveal="word: ; idle: 0"></section>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
