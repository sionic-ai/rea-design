<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>diag-bend-preview — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { display: grid; grid-template-columns: 1fr 1fr; min-height: 80vh; }
  .demo-thumbs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; padding: 40px; align-content: center; }
  .demo-thumbs .wf-img { aspect-ratio: 1; }
  .demo-panel { display: flex; align-items: center; justify-content: center; background: var(--kf-surface); }
  .demo-frame { width: 100%; height: 260px; }
</style>
</head>
<body>
<p class="demo-hint"><b>diag-bend-preview</b> — Hover the left cell. The photo on the right folds diagonally and unfolds to change.</p>
<section class="demo" data-fx="diag-bend-preview" data-demo-root>
  <div class="demo-thumbs">
    <div class="wf-img" data-fx-part="thumb" data-label="Photo 1"></div>
    <div class="wf-img" data-fx-part="thumb" data-label="Photo 2"></div>
    <div class="wf-img" data-fx-part="thumb" data-label="Photo 3"></div>
  </div>
  <div class="demo-panel">
    <div class="demo-frame" data-fx-part="frame">
      <div data-fx-part="photo" style="aspect-ratio: 3 / 2" data-label="Landscape photo · 3:2"></div>
      <div data-fx-part="photo" style="aspect-ratio: 2 / 3" data-label="Vertical photo · 2:3"></div>
      <div data-fx-part="photo" style="aspect-ratio: 16 / 9" data-label="Wide photo · 16:9"></div>
    </div>
  </div>
</section>
<div data-demo-late-host></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Attaches to one late-arriving panel and detaches after 1.5 seconds (checking whether detaching clears the canvas)
setTimeout(() => {
  const root = document.querySelector("[data-demo-root]");
  if (!root) return;
  const late = root.cloneNode(true);
  late.removeAttribute("data-demo-root");
  document.querySelector("[data-demo-late-host]")?.append(late);
  setTimeout(() => late.remove(), 1500);
}, 1000);
</script>
</body>
</html>
