<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>portrait-window-grow — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: fixed; top: 0; left: 0; right: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-media { background: linear-gradient(160deg, var(--kf-accent-soft), var(--kf-accent)); }
  .demo-after { text-align: center; font: 400 28px var(--kf-font-display); white-space: nowrap; }
  .demo-meta { position: absolute; z-index: 6; left: 20px; bottom: 20px; font: 12px var(--kf-font-mono); }
  .demo-meta.is-over { color: var(--kf-on-accent); }
  .demo-badge { color: var(--kf-on-accent); font: 22px var(--kf-font-mono); margin: 0; }
  .after { height: 80vh; padding: 40px; }
</style>
</head>
<body>
<p class="demo-hint"><b>portrait-window-grow</b> — Scroll down. A vertical window in the center grows to fill the screen, and clicking it switches channels with static. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<section data-fx="portrait-window-grow">
  <div data-fx-part="stage">
    <div data-fx-part="window" tabindex="0" role="button" aria-label="Switch channel"><div class="demo-media" data-fx-part="media"></div><div data-fx-part="static"></div></div>
    <p class="demo-badge" data-fx-part="channel">CH <span data-fx-part="channel-num">01</span></p>
    <div class="demo-after" data-fx-part="after">Studio Name</div>
    <div class="demo-meta" data-fx-part="meta">00:00:00</div>
  </div>
</section>
<section class="after">Next section</section>
<section data-fx="portrait-window-grow" data-demo-remove style="block-size: 120vh"><div data-fx-part="stage"><div data-fx-part="window"><div class="demo-media" data-fx-part="media"></div></div></div></section>
<template data-demo-late><section data-fx="portrait-window-grow" data-fx-portrait-window-grow="span: .5; channels: 2"><div data-fx-part="stage"><div data-fx-part="window" tabindex="0"><div class="demo-media" data-fx-part="media"></div><div data-fx-part="static"></div></div><p class="demo-badge" data-fx-part="channel">CH <span data-fx-part="channel-num">01</span></p></div></section></template>
<section data-fx="portrait-window-grow" style="block-size: 10vh"></section>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
