<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>twist-reveal-follow — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { display: flex; flex-wrap: wrap; gap: 12px; padding: 48px 20px; }
  .pill { position: relative; padding: 16px 24px; border: 1px solid var(--kf-line); border-radius: var(--kf-radius-pill); }
</style>
</head>
<body>
<p class="demo-hint"><b>twist-reveal-follow</b> — Hover over the pill and move the mouse around. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<section class="demo">
  <a class="pill" href="#" data-fx="twist-reveal-follow">Field 1<span class="wf-img" data-fx-part="pic" data-label="Field 1 main photo"></span></a>
  <a class="pill" href="#" data-fx="twist-reveal-follow" data-demo-remove>Field 2<span class="wf-img" data-fx-part="pic" data-label="Field 2 main photo"></span></a>
  <a class="pill" href="#" data-fx="twist-reveal-follow" style="--fx-w: 320px; --fx-h: 200px">Large panel<span class="wf-img" data-fx-part="pic" data-label="Wide photo"></span></a>
  <a class="pill" href="#" data-fx="twist-reveal-follow">Pill without photo</a>
  <template data-demo-late><a class="pill" href="#" data-fx="twist-reveal-follow">Late-arrived Pill<span class="wf-img" data-fx-part="pic" data-label="Late-arrived Photo"></span></a></template>
</section>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
