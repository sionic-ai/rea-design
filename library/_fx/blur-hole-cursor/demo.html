<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>blur-hole-cursor — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { padding: 32px 20px; display: grid; gap: 16px; }
  .stage { height: 50vh; overflow: hidden; border-radius: var(--kf-radius-md); }
  .stage .wf-img { height: 100%; }
</style>
</head>
<body>
<p class="demo-hint"><b>blur-hole-cursor</b> — Move the mouse over the blurred panel. Only the circle in front of the cursor clears up. <span style="color:var(--kf-dim)">(After 1s one more panel comes in, and one leaves 2.5s later)</span></p>
<section class="demo">
  <div class="stage" data-fx="blur-hole-cursor"><div class="wf-img" data-label="Light and curtains beyond the window · afternoon · landscape 16:9"></div><span data-fx-part="veil"></span></div>
  <div class="stage" data-demo-remove data-fx="blur-hole-cursor"><div class="wf-img" data-label="Panel to be removed soon"></div><span data-fx-part="veil"></span></div>
  <template data-demo-late><div class="stage" data-fx="blur-hole-cursor" data-fx-blur-hole-cursor="r: 90; shift: 0"><div class="wf-img" data-label="Late-arriving panel · small hole"></div><span data-fx-part="veil"></span></div></template>
</section>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
