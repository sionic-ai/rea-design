<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>inset-shrink-thumb — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 9; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin: 40px 20px; }
  .grid a { display: grid; gap: 10px; }
  .grid [data-fx-part="frame"] { display: block; aspect-ratio: 3 / 2; }
  .grid .wf-img { height: 100%; }
</style>
</head>
<body>
<p class="demo-hint"><b>inset-shrink-thumb</b> — Hover over the card. <span style="color:var(--kf-dim)">(One more card comes in after 1s, and one drops out after 2.5s)</span></p>
<div class="grid">
  <a href="#" data-fx="inset-shrink-thumb"><span data-fx-part="frame"><span class="wf-img" data-fx-part="img" data-label="News photo · 3:2"></span></span>Your news title here</a>
  <a href="#" data-fx="inset-shrink-thumb" data-demo-remove><span data-fx-part="frame"><span class="wf-img" data-fx-part="img" data-label="Card to Be Removed"></span></span>Card to Be Removed</a>
  <a href="#" data-fx="inset-shrink-thumb" style="--fx-inset: 1em; --fx-zoom: 1.06"><span data-fx-part="frame"><span class="wf-img" data-fx-part="img" data-label="1em · 1.06x"></span></span>Go deeper</a>
  <a href="#" data-fx="inset-shrink-thumb">Card without photo slot</a>
  <template data-demo-late><a href="#" data-fx="inset-shrink-thumb"><span data-fx-part="frame"><span class="wf-img" data-fx-part="img" data-label="Late-arriving card"></span></span>Late-arriving card</a></template>
</div>
<script src="../fx-core.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
