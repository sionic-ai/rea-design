<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>draw-on-scroll — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 10; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .sp { height: 70vh; display: grid; place-items: center; color: var(--kf-dim); }
  .sig { width: min(600px, 90vw); margin: 0 auto 60vh; color: var(--kf-accent); }
</style>
</head>
<body>
<p class="demo-hint"><b>draw-on-scroll</b> — Scroll down and the signature line is drawn as far as you scroll.</p>
<div class="sp">Scroll down</div>
<div class="sig" data-fx="draw-on-scroll"><svg viewBox="0 0 600 200"><path data-fx-part="path" stroke-width="3" d="M20 150C60 40 90 30 100 80s-30 90-10 70 60-120 90-100-20 110 10 90 50-60 80-40 10 40 40 20 60-30 90-20 40 20 70 0 60-30 80-20"/></svg></div>
<div class="sig" data-fx="draw-on-scroll" data-demo-remove><svg viewBox="0 0 600 100"><path data-fx-part="path" stroke-width="3" d="M10 50H590"/></svg></div>
<template data-demo-late><div class="sig" data-fx="draw-on-scroll" data-fx-draw-on-scroll="start: top 80%; end: top 30%"><svg viewBox="0 0 600 100"><path data-fx-part="path" stroke-width="3" d="M10 80C200 0 400 100 590 20"/></svg></div></template>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); window.ScrollTrigger?.refresh(); }, 2500);
</script>
</body>
</html>
