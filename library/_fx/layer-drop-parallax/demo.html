<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>layer-drop-parallax — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo-spacer { height: 90vh; display: grid; place-items: center; color: var(--kf-dim); }
  .hero { aspect-ratio: 13 / 7; background: var(--kf-raised); }
  .hill { position: absolute; left: -5%; right: -5%; bottom: 0; height: 60%; border-radius: 50% 50% 0 0; background: var(--kf-accent); opacity: .5; }
  .sun { position: absolute; top: 14%; right: 22%; width: 9%; aspect-ratio: 1; border-radius: 50%; background: var(--kf-accent); }
  .bird { position: absolute; top: 30%; left: 30%; width: 6%; aspect-ratio: 2; border-radius: 50%; background: var(--kf-ink); }
  .house { position: absolute; bottom: 16%; left: 12%; width: 30%; height: 34%; }
  .people { position: absolute; bottom: 0; left: 36%; width: 34%; height: 46%; }
  .word { position: absolute; font: 700 9vw/0.9 var(--kf-font-display); color: var(--kf-surface); }
</style>
</head>
<body>
<p class="demo-hint"><b>layer-drop-parallax</b> On open, the back layers drop in the furthest first and the text floats up. Scrolling down pushes each layer at a different speed.</p>
<section class="hero" data-demo-remove data-fx="layer-drop-parallax">
  <div data-fx-part="layer"><div class="hill"></div><div class="sun"></div><b class="word" style="top:6%;right:8%" data-fx-part="word">GREEN</b></div>
  <div data-fx-part="layer"><div class="bird"></div></div>
  <div data-fx-part="layer"><div class="wf-img house" data-label="Building Cutout"></div><b class="word" style="top:40%;left:58%" data-fx-part="word">PARK</b></div>
  <div data-fx-part="layer"><div class="wf-img people" data-label="Cut-out people shot"></div></div>
</section>
<section class="hero" data-fx="layer-drop-parallax" data-fx-layer-drop-parallax="from: 2; delay: 0; durs: .8; gaps: 0,.1">
  <div data-fx-part="layer"><div class="hill"></div><div class="sun"></div></div>
  <div data-fx-part="layer"><div class="wf-img house" data-label="Building Cutout"></div><b class="word" style="top:30%;left:58%" data-fx-part="word">PARK</b></div>
  <div data-fx-part="layer"><div class="wf-img people" data-label="Cut-out people shot"></div></div>
</section>
<template data-demo-late><section class="hero" data-fx="layer-drop-parallax">
  <div data-fx-part="layer"><div class="hill"></div></div>
  <div data-fx-part="layer"><div class="wf-img people" data-label="Late-arriving panel"></div></div>
</section></template>
<section class="hero" data-fx="layer-drop-parallax"></section>
<div class="demo-spacer">Footer</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script>gsap.registerPlugin(ScrollTrigger);</script>
<script src="fx.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); window.ScrollTrigger?.refresh(); }, 2500);
</script>
</body>
</html>
