<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sticky-grow-band — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-spacer { height: 60vh; display: grid; place-items: center; color: var(--kf-dim); }
  .track { height: 220vh; }
  .pic { background: repeating-linear-gradient(90deg, var(--kf-accent) 0 60px, var(--kf-raised) 60px 120px); }
</style>
</head>
<body>
<p class="demo-hint"><b>sticky-grow-band</b> — Scroll down and the square window in the center widens into a full-width band. <span style="color:var(--kf-dim)">(After 1s one more panel comes in, and one leaves 2.5s later)</span></p>
<div class="demo-spacer">Scroll down</div>
<section class="track" data-fx="sticky-grow-band">
  <div data-fx-part="stage"><div data-fx-part="media"><div class="pic"></div></div></div>
</section>
<section class="track" data-demo-remove data-fx="sticky-grow-band" data-fx-sticky-grow-band="from: 0.2; to: 0.5">
  <div data-fx-part="stage"><div data-fx-part="media"><div class="pic"></div></div></div>
</section>
<template data-demo-late><section class="track" data-fx="sticky-grow-band" data-fx-sticky-grow-band="from: 0.3; to: 0.6" style="--fx-size: 240px; --fx-radius: 24px"><div data-fx-part="stage"><div data-fx-part="media"><div class="pic"></div></div></div></section></template>
<div class="demo-spacer"></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); window.ScrollTrigger?.refresh(); }, 2500);
</script>
</body>
</html>
