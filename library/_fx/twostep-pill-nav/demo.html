<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>twostep-pill-nav — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-raised); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); padding: 20px; min-height: 100vh; }
  .demo-hint { padding: 0 0 20px; font: 500 13px/1.4 var(--kf-font-mono); }
  .stage { max-width: 48em; margin: 0 auto 40px; }
  .top { display: flex; justify-content: space-between; align-items: center; height: 4em; padding: 0 1.25rem; position: relative; z-index: 1; }
  .top button { width: 2.5em; height: 2.5em; display: flex; flex-direction: column; align-items: center; justify-content: center; border: 0; background: none; color: inherit; cursor: pointer; }
  .inner { display: flex; gap: 1.25rem; padding: 1.25rem; }
  .inner > * { flex: 1; }
  .inner ul { display: flex; flex-direction: column; gap: 12px; font-size: 28px; }
  .pics { position: relative; aspect-ratio: 4 / 5; overflow: hidden; }
  .pic { display: grid; place-items: center; background: var(--kf-raised); font: 500 12px var(--kf-font-mono); color: var(--kf-dim); }
</style>
</head>
<body>
<p class="demo-hint"><b>twostep-pill-nav</b> — Click the row buttons on the pill. Width expands first, the panel after. Hover a link and the right photo changes.</p>
<nav class="stage" data-fx="twostep-pill-nav">
  <button type="button" data-fx-part="veil" aria-label="Close" tabindex="-1"></button>
  <div data-fx-part="bar">
    <div class="top"><b>● Company name</b><button type="button" data-fx-part="toggle" aria-label="Menu"><i></i><i></i></button></div>
    <div data-fx-part="panel"><div><div class="inner">
      <div data-fx-part="col"><ul><li><a href="#" data-fx-part="link" data-key="a">Menu First</a></li><li><a href="#" data-fx-part="link" data-key="b">Menu Two</a></li><li><a href="#" data-fx-part="link" data-key="c">Menu Three</a></li></ul></div>
      <div data-fx-part="col"><div class="pics"><div class="pic" data-fx-part="visual" data-key="a">Photo 1</div><div class="pic" data-fx-part="visual" data-key="b">Photo 2</div><div class="pic" data-fx-part="visual" data-key="c">Photo 3</div></div></div>
    </div></div></div>
  </div>
</nav>
<nav class="stage" data-fx="twostep-pill-nav" data-demo-remove><div data-fx-part="bar"><div class="top">Pill to Be Removed<button type="button" data-fx-part="toggle"><i></i><i></i></button></div></div></nav>
<template data-demo-late><nav class="stage" data-fx="twostep-pill-nav" style="--fx-pill: 18em"><div data-fx-part="bar"><div class="top">Late-arrived Pill<button type="button" data-fx-part="toggle" aria-label="Menu"><i></i><i></i></button></div><div data-fx-part="panel"><div><div class="inner"><div data-fx-part="col">Your edition content here</div></div></div></div></div></nav></template>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
