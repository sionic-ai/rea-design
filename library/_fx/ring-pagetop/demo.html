<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ring-pagetop — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { margin: 0; padding: 12px 20px; border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .page { height: 220vh; padding: 40px; }
  footer { height: 40vh; display: grid; place-items: center; border-top: 1px solid var(--kf-ink); }
</style>
</head>
<body>
<p class="demo-hint"><b>ring-pagetop</b> — Scroll down a little and a round button appears at bottom right. Hover it, scroll to the footer, then press it.</p>
<div class="page" id="page">Long body slot</div>
<footer id="foot">Footer</footer>
<a href="#top" data-fx="ring-pagetop" data-fx-ring-pagetop="after: #foot" aria-label="Back to top"><span data-fx-part="arrow"><svg viewBox="0 0 12 25"><path d="M6 24V2M1 7l5-5.5L11 7" fill="none" stroke="currentColor" stroke-width="1.6"/></svg></span></a>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
  // Checks that late-arriving buttons get hooked (bottom left) and that removed buttons get detached
  setTimeout(() => {
    const a = document.createElement("a");
    a.href = "#top";
    a.dataset.fx = "ring-pagetop";
    a.dataset.fxRingPagetop = "text: TOP; repeat: 5";
    a.style.cssText = "right: auto; left: 2rem; --fx-size: 5rem";
    a.innerHTML = '<span data-fx-part="arrow"><svg viewBox="0 0 12 25"><path d="M6 24V2M1 7l5-5.5L11 7" fill="none" stroke="currentColor" stroke-width="1.6"/></svg></span>';
    document.body.append(a);
    setTimeout(() => a.remove(), 1500);
  }, 1000);
</script>
</body>
</html>
