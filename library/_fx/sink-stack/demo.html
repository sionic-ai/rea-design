<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sink-stack — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 5; margin: 0; padding: 12px 20px; border-bottom: 1px solid var(--kf-line); background: var(--kf-bg); font: 500 13px/1.4 var(--kf-font-mono); }
  .card { display: grid; place-items: center; min-height: 110vh; font: 700 64px/1 var(--kf-font-display); }
  .a { background: var(--kf-surface); } .b { background: var(--kf-raised); } .c { background: var(--kf-accent-soft); }
</style>
</head>
<body>
<p class="demo-hint"><b>sink-stack</b> — Scroll down. The previous section sinks at half speed and the next one covers it.</p>
<div id="stack">
  <div class="a" data-fx="sink-stack"><div class="card" data-fx-part="item">Section 1</div></div>
  <div class="b gone" data-fx="sink-stack"><div class="card" data-fx-part="item">Section to be removed soon</div></div>
  <div class="c"><div class="card">Last section</div></div>
</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script>
gsap.registerPlugin(ScrollTrigger);
setTimeout(() => { const d = document.createElement("div"); d.className = "b"; d.dataset.fx = "sink-stack"; d.innerHTML = '<div class="card" data-fx-part="item">Late section</div>'; document.querySelector("#stack .c").before(d); ScrollTrigger.refresh(); }, 1000);
setTimeout(() => { document.querySelector(".gone")?.remove(); ScrollTrigger.refresh(); }, 2500);
</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
