<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>elastic-menu-grow — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { display: flex; justify-content: flex-end; gap: 280px; padding: 40px 40px 480px; }
  .demo nav { position: absolute; top: 40px; left: 40px; display: flex; flex-direction: column; gap: 16px; white-space: nowrap; }
  .demo nav a { font: 400 16px/1.2 var(--kf-font-display); }
</style>
</head>
<body>
<p class="demo-hint"><b>elastic-menu-grow</b> — Press the three-dot button at top right. The panel sloshes and stretches, and the dots become an X. <span style="color:var(--kf-dim)">(After 1s one more button comes in, and after 2.5s one drops out)</span></p>
<section class="demo">
  <template data-demo-late><div data-fx="elastic-menu-grow" data-fx-elastic-menu-grow="w: 180; h: 220"><button data-fx-part="toggle" type="button" aria-label="Open Menu"><span data-fx-part="dot"></span><span data-fx-part="dot"></span><span data-fx-part="dot"></span></button><div data-fx-part="panel"><nav><a data-fx-part="item" href="#">Late 1</a><a data-fx-part="item" href="#">Late 2</a></nav></div></div></template>
  <div data-demo-remove data-fx="elastic-menu-grow"><button data-fx-part="toggle" type="button" aria-label="Open Menu"><span data-fx-part="dot"></span><span data-fx-part="dot"></span><span data-fx-part="dot"></span></button><div data-fx-part="panel"><nav><a data-fx-part="item" href="#">Omitted menu</a></nav></div></div>
  <div data-fx="elastic-menu-grow"><button data-fx-part="toggle" type="button" aria-label="Open Menu"><span data-fx-part="dot"></span><span data-fx-part="dot"></span><span data-fx-part="dot"></span></button>
    <div data-fx-part="panel"><nav><a data-fx-part="item" href="#">Menu 1</a><a data-fx-part="item" href="#">Menu 2</a><a data-fx-part="item" href="#">Menu 3</a><a data-fx-part="item" href="#">Menu 4</a><a data-fx-part="item" href="#">Menu 5</a><a data-fx-part="item" href="#">Menu 6</a></nav></div></div>
</section>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
