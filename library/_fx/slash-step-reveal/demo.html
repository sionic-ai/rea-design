<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>slash-step-reveal — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { padding: 48px 20px; display: grid; gap: 14px; }
  .demo-btn { justify-self: start; height: 40px; padding: 0 16px; border: 1px solid var(--kf-line); border-radius: var(--kf-radius-sm); background: var(--kf-surface); color: var(--kf-ink); cursor: pointer; }
  .demo-spacer { height: 90vh; display: grid; place-items: center; color: var(--kf-dim); }
  .t { margin: 0; font: 400 48px/1 var(--kf-font-display); letter-spacing: -0.04em; }
  .s { margin: 0; font-size: 15px; font-weight: 500; }
</style>
</head>
<body>
<p class="demo-hint"><b>slash-step-reveal</b> — Backslash rows are laid down first and the letters are revealed in steps. Use the button to rewrite it like a menu.</p>
<section class="demo">
  <p class="s" data-fx="slash-step-reveal" data-fx-slash-step-reveal="on: load; delay: .3">\ Partners</p>
  <p class="t" data-fx="slash-step-reveal" data-fx-slash-step-reveal="on: load; delay: .5; index: 1">A Selection of Work</p>
  <p class="t" data-fx="slash-step-reveal" data-fx-slash-step-reveal="on: manual; delay: .1; look: accent" id="m" style="--fx-per-char:.04s;--fx-steps-factor:.8;--fx-offset:1">Menu item two</p>
  <button class="demo-btn" type="button" onclick="const m=document.getElementById('m');m.dispatchEvent(new Event(m.classList.contains('is-fx-on')?'fx:rest':'fx:play'))">Open · close menu</button>
</section>
<div class="demo-spacer">Scroll down ↓</div>
<section class="demo"><p class="t" data-fx="slash-step-reveal">Scroll into the view</p></section>
<div class="demo-spacer"></div>
<script>
(() => {
  const src = document.querySelector('[data-fx~="slash-step-reveal"]');
  const html = src.outerHTML.replace(/\sid="[^"]*"/g, "");
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => src.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · One more comes in after 1s, and one drops out after 2.5s.");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
