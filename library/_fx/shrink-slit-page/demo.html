<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>shrink-slit-page — a page turn that shrinks and fades, then opens from a slit</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  main { min-height: 140vh; padding: 48px 24px; background: var(--kf-surface); color: var(--kf-ink); font-family: var(--kf-font-sans); }
  a { color: var(--kf-accent-text); }
</style>
</head>
<body>
<main data-fx="shrink-slit-page">
  <p>Press the link below — the screen shrinks and blurs, and the same page reopens from the gap at bottom center.</p>
  <p><a href="demo.html?n=2">Go to the same page</a></p>
</main>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
  setTimeout(() => { const m = document.createElement("section"); m.dataset.fx = "shrink-slit-page"; document.body.append(m); setTimeout(() => m.remove(), 1000); }, 1000);
</script>
</body>
</html>
