<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>scroll-synchro-band — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .gap { height: 60vh; }
  .set { position: relative; display: flex; align-items: center; gap: 50px; padding-right: 50px; height: 260px; }
  .set .wf-img { flex: none; border-radius: 6px; }
</style>
</head>
<body>
<p class="demo-hint"><b>scroll-synchro-band</b> — The band drifts slowly to the right. Scroll down and it turns left, speeding up then settling, scroll up and it returns to the right.</p>
<div class="gap"></div>
<div data-fx="scroll-synchro-band">
  <div data-fx-part="track">
    <div class="set" data-fx-part="set">
      <div class="wf-img" style="width:220px;height:146px" data-label="Photo 1"></div>
      <div class="wf-img" style="width:260px;height:260px" data-label="Photo 2"></div>
      <div class="wf-img" style="width:200px;height:240px" data-label="Photo 3"></div>
      <div class="wf-img" style="width:280px;height:186px" data-label="Photo 4"></div>
    </div>
  </div>
</div>
<div data-demo-remove data-fx="scroll-synchro-band" data-fx-scroll-synchro-band="dir: left; speed: 8">
  <div data-fx-part="track"><div class="set" data-fx-part="set"><div class="wf-img" style="width:300px;height:120px" data-label="Dropping band"></div></div></div>
</div>
<template data-demo-late><div data-fx="scroll-synchro-band" data-fx-scroll-synchro-band="dir: left">
  <div data-fx-part="track"><div class="set" data-fx-part="set"><div class="wf-img" style="width:240px;height:120px" data-label="Late-arriving band 1"></div><div class="wf-img" style="width:180px;height:120px" data-label="Late-arriving band 2"></div></div></div>
</div></template>
<div data-fx="scroll-synchro-band"></div>
<div class="gap"></div>
<div class="gap"></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
