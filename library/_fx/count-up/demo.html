<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>count-up — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-spacer { height: 90vh; display: grid; place-items: center; color: var(--kf-dim); }
  .demo { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; padding: 48px 20px; }
  .demo-card { padding: 28px; border: 1px solid var(--kf-line); border-radius: var(--kf-radius-lg); background: var(--kf-surface); }
  .demo-card b { color: var(--kf-accent); font: 500 64px/1 var(--kf-font-display); }
</style>
</head>
<body>
<p class="demo-hint"><b>count-up</b> — Scroll down and when the number card reaches the center of the screen, the number counts up over 2s.</p>
<div class="demo-spacer">Scroll down ↓</div>
<section class="demo">
  <div class="demo-card" data-fx="count-up">Your item one here<br><b data-fx-part="num">86</b>%</div>
  <div class="demo-card" data-fx="count-up">Your item two here<br><b data-fx-part="num" data-from="10">120</b>people · <b data-fx-part="num">7</b>Place</div>
  <div class="demo-card" data-fx="count-up" data-fx-count-up="round: 1">Your one-decimal figure here<br><b data-fx-part="num">12.5</b>Year</div>
</section>
<div class="demo-spacer"></div>
<script>
// Late arrivals and removals — checks that fx-core attaches to an element added after 1s and detaches from an element removed after 2.5s
(() => {
  const src = document.querySelector('[data-fx~="count-up"]');
  if (!src) return;
  const html = src.outerHTML;
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => src.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical one comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
