<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rocket-pagetop — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 2; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  main { padding: 40px 20px; }
  .block { height: 60vh; margin: 20px auto; max-width: 800px; border-radius: 24px; background: var(--kf-raised); }
  footer { margin: 80px 20px 20px; height: 70vh; border-radius: 40px; background: var(--kf-contrast-bg); color: var(--kf-contrast-ink); padding: 60px; }
  .pt { position: fixed; z-index: 20; bottom: 60px; right: 60px; width: 69px; color: var(--kf-contrast-ink); }
  .pt svg { display: block; width: 100%; height: auto; }
  .pt [data-fx-part="stars"] { left: -30px; bottom: 70px; width: 120px; }
</style>
</head>
<body>
<p class="demo-hint"><b>rocket-pagetop</b> — Scroll to the very bottom, hover over the rocket, and click it. <span style="color:var(--kf-dim)">(After 1s one more ”Late” cell comes in, and after 2.5s one empty rocket drops out)</span></p>
<main id="late"><div class="block"></div><div class="block"></div></main>
<footer>
  <p>Footer — rocket at bottom right</p>
  <button class="pt" type="button" aria-label="Back to top" data-fx="rocket-pagetop">
    <span data-fx-part="stars"><svg viewBox="0 0 120 45" fill="currentColor"><path d="M10 30l2 6 6 2-6 2-2 6-2-6-6-2 6-2zM104 6l2 5 5 2-5 2-2 5-2-5-5-2 5-2z"/></svg></span>
    <span data-fx-part="ship">
      <svg data-fx-part="rocket" viewBox="0 0 69 110"><path d="M34 2C16 22 14 58 18 86h32c4-28 2-64-16-84z" fill="var(--kf-surface)" stroke="var(--kf-ink)" stroke-width="3"/><circle cx="34" cy="44" r="8" fill="var(--kf-ink)"/><path d="M18 70L4 96l16-6zM50 70l14 26-16-6z" fill="var(--kf-accent)"/></svg>
      <span data-fx-part="fire">
        <svg viewBox="0 0 69 60"><path d="M22 0q12 60 25 0z" fill="var(--kf-accent)"/></svg>
        <svg viewBox="0 0 69 60"><path d="M24 0q10 46 21 0z" fill="var(--kf-accent)"/></svg>
        <svg viewBox="0 0 69 60"><path d="M20 0q14 52 29 0z" fill="var(--kf-accent)"/></svg>
      </span>
    </span>
  </button>
  <button class="pt" type="button" data-fx="rocket-pagetop" data-demo-remove style="display:none"></button>
</footer>
<template data-demo-late><div class="block"><p style="padding:20px">Late</p></div></template>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => document.getElementById("late").append(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
