<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>spin-gradient-frame — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 500 13px/1.4 var(--kf-font-sans); }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .row { display: grid; grid-template-columns: repeat(3, minmax(0, 260px)); gap: 40px; margin: 60px; }
  figure { padding: 8px; }
  .ph { aspect-ratio: 3 / 2; background: var(--kf-raised); }
  .line { height: 8px; margin: 0 60px 20px; }
</style>
</head>
<body>
<p class="demo-hint"><b>spin-gradient-frame</b> — The photo border color flows slowly. Hover over the photo and the card grows while the border hides. <span style="color:var(--kf-dim)">(One more card comes in after 1s, and one drops out after 2.5s)</span></p>
<div class="row">
  <a href="#" data-fx="spin-gradient-frame"><span data-fx-part="ring"></span><figure><div class="ph"></div></figure></a>
  <a href="#" data-fx="spin-gradient-frame" data-demo-remove><span data-fx-part="ring"></span><figure><div class="ph"></div></figure></a>
</div>
<span class="line" data-fx="spin-gradient-frame" data-fx-spin-gradient-frame="look: line"><span data-fx-part="ring"></span></span>
<span class="line" data-fx="spin-gradient-frame" data-fx-spin-gradient-frame="look: line" style="--fx-turn: -1turn"><span data-fx-part="ring"></span></span>
<template data-demo-late><div class="row"><a href="#" data-fx="spin-gradient-frame" style="--fx-grow: 1.04"><span data-fx-part="ring"></span><figure><div class="ph"></div></figure></a></div></template>
<a data-fx="spin-gradient-frame"></a>
<script src="../fx-core.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); }, 2500);
</script>
</body>
</html>
