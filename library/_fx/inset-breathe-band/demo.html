<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>inset-breathe-band — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 9; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .gap { height: 70vh; display: grid; place-items: center; color: var(--kf-dim); }
  .band { background: var(--kf-contrast-bg); color: var(--kf-contrast-ink); padding-top: 120px; text-align: center; }
  .band h2 { font: 500 72px/0.9 var(--kf-font-display); margin: 0 0 40px; }
  .band [data-fx-part="media"] { aspect-ratio: 16 / 9; }
  .band .wf-img { position: absolute; inset: 0; height: 100%; }
  .band button { position: absolute; left: 50%; top: 50%; translate: -50% -50%; z-index: 2; }
</style>
</head>
<body>
<p class="demo-hint"><b>inset-breathe-band</b> — Scroll down. The black band opens from a 10% mask on all sides and tightens again as it leaves. Press the button and the inner plate gathers in the parallax.</p>
<div class="gap">Downward</div>
<section class="band" data-fx="inset-breathe-band" id="band"><h2>Your one sentence here</h2><div data-fx-part="media"><div><div class="wf-img" data-label="Video slot · 16:9"></div></div><button type="button" onclick="this.dataset.on = this.dataset.on ? '' : '1'; this.closest('[data-fx]').dispatchEvent(new Event(this.dataset.on ? 'fx:play' : 'fx:rest'))">Playback Mimic</button></div></section>
<div class="gap">Body slot</div>
<div id="later"></div>
<section class="band" id="gone" data-fx="inset-breathe-band" data-fx-inset-breathe-band="inset: 6"><h2>Deleting soon</h2></section>
<div class="gap"></div>
<script>
  setTimeout(() => { document.getElementById("later").innerHTML = '<section class="band" data-fx="inset-breathe-band"><h2>Band after 1s</h2></section>'; }, 1000);
  setTimeout(() => document.getElementById("gone").remove(), 1500);
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script>gsap.registerPlugin(ScrollTrigger);</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
