<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pin-scale-media — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .pad { height: 60vh; display: grid; place-content: center; }
  .wf-img { height: 100%; }
  [data-fx-part="content"] { padding: 30px; font: 700 40px/1.1 var(--kf-font-display); }
</style>
</head>
<body>
<p class="demo-hint"><b>pin-scale-media</b> Scroll down. With the panel pinned, a full-bleed photo recedes to its own size while fading, and the title turns on from midway. <span style="color:var(--kf-dim)">(After 1s one more section comes in, and one leaves 2.5s later)</span></p>
<section data-fx="pin-scale-media"><div data-fx-part="media"><div class="wf-img" data-label="Black-and-white meeting photo · horizontal"></div></div><div data-fx-part="content">Your title here</div></section>
<section data-fx="pin-scale-media" data-demo-remove><div data-fx-part="media"><div class="wf-img" data-label="Dropped Section"></div></div></section>
<template data-demo-late><section data-fx="pin-scale-media" data-fx-pin-scale-media="look: grow"><div data-fx-part="media"><div class="wf-img" data-label="Late-entering section · growing side"></div></div></section></template>
<section data-fx="pin-scale-media"></section>
<div class="pad">Bottom margin</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
gsap.registerPlugin(ScrollTrigger);
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); }, 2500);
</script>
</body>
</html>
