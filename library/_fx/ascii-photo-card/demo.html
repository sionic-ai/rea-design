<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ascii-photo-card — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 500 13px/1.4 var(--kf-font-sans); }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .row { display: flex; gap: 20px; padding: 20px; }
  .row > * { width: 260px; aspect-ratio: 496 / 734; display: block; }
  .row .wf-img { height: 100%; }
</style>
</head>
<body>
<p class="demo-hint"><b>ascii-photo-card</b> — Cards ripple with a text image. Hovering unfolds the photo from top to bottom. The third card alternately unveils every 2 seconds with fx:focus. <span style="color:var(--kf-dim)">(One more card comes in after 1s, and one drops out after 2.5s)</span></p>
<div class="row" data-demo-row>
  <a data-fx="ascii-photo-card" href="#1"><div data-fx-part="photo"><div class="wf-img" data-label="Person photo · vertical"></div></div></a>
  <a data-fx="ascii-photo-card" href="#2" data-demo-remove><div data-fx-part="photo"><div class="wf-img" data-label="Product · White background"></div></div></a>
  <a data-fx="ascii-photo-card" href="#3" data-demo-focus><div data-fx-part="photo"><div class="wf-img" data-label="Night view · Neon"></div></div></a>
  <a data-fx="ascii-photo-card" href="#4"></a>
</div>
<template data-demo-late><a data-fx="ascii-photo-card" data-fx-ascii-photo-card="cols: 60" href="#5"><div data-fx-part="photo"><div class="wf-img" data-label="Late-added Card"></div></div></a></template>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
let on = false;
setInterval(() => { on = !on; document.querySelector("[data-demo-focus]").dispatchEvent(new CustomEvent("fx:focus", { detail: { on } })); }, 2000);
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => document.querySelector("[data-demo-row]").append(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); }, 2500);
</script>
</body>
</html>
