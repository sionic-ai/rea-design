<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>diamond-window-scrub — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .pad { height: 60vh; display: grid; place-content: center; }
  h2 { font: 400 40px/1.1 var(--kf-font-display); }
  .wf-img { position: absolute; inset: 0; }
</style>
</head>
<body>
<p class="demo-hint"><b>diamond-window-scrub</b> Scroll down. A diamond window at the bottom grows larger than the screen, and the video inside is tied to the scroll. <span style="color:var(--kf-dim)">(After 1s one more panel comes in, and one leaves 2.5s later)</span></p>
<div class="pad">Top margin</div>
<section data-fx="diamond-window-scrub" style="--fx-length: 500vh"><div data-fx-part="stage"><div data-fx-part="media"><video src="placeholder-16x9.mp4" muted playsinline preload="auto"></video></div><div data-fx-part="head"><h2>Your header title here</h2></div></div></section>
<section data-fx="diamond-window-scrub" data-demo-remove style="--fx-length: 300vh"><div data-fx-part="stage"><div data-fx-part="media"><div class="wf-img" data-label="Dropped Panel"></div></div></div></section>
<template data-demo-late><section data-fx="diamond-window-scrub" data-fx-diamond-window-scrub="grow: 1.6; peek: .2" style="--fx-length: 300vh"><div data-fx-part="stage"><div data-fx-part="media"><div class="wf-img" data-label="Late Panel · Not fully grown"></div></div></div></section></template>
<div class="pad">Bottom margin</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
gsap.registerPlugin(ScrollTrigger);
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); }, 2500);
</script>
</body>
</html>
