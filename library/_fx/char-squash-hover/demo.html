<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>char-squash-hover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { display: flex; flex-direction: column; gap: 60px; align-items: center; padding: 96px 20px; text-align: center; }
  .demo h2 { font: 800 72px/1 var(--kf-font-display); text-transform: uppercase; }
</style>
</head>
<body>
<p class="demo-hint"><b>char-squash-hover</b> — Move the mouse slowly over the big title. Letters under the cursor squash, then wobble back out. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<main class="demo">
  <h2 data-fx="char-squash-hover">TITLE SAMPLE<br>Your title here</h2>
  <h2 data-fx="char-squash-hover" data-fx-char-squash-hover="duck: .4; near: .3" data-demo-remove>Pressed deeper</h2>
  <h2 data-fx="char-squash-hover"></h2>
  <template data-demo-late><h2 data-fx="char-squash-hover">Late-arriving title</h2></template>
</main>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
