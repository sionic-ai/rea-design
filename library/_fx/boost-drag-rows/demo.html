<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>boost-drag-rows — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { padding: 30vh 0 120vh; display: grid; gap: 96px; }
  .logo { width: 150px; height: 150px; display: grid; place-items: center; border: 1px solid var(--kf-line); color: var(--kf-dim); font: 500 12px var(--kf-font-mono); }
  .photo { width: 320px; height: 220px; }
  .photo .wf-img { height: 100%; }
</style>
</head>
<body>
<p class="demo-hint"><b>boost-drag-rows</b> — Scroll quickly (the band speeds up). The photo band below is draggable, and hovering over a row reverses its flow direction. <span style="color:var(--kf-dim)">(After 1s one more band comes in, and one leaves 2.5s later)</span></p>
<section class="demo">
  <div data-fx="boost-drag-rows" data-fx-boost-drag-rows="drag: false" data-demo="logo"></div>
  <div data-fx="boost-drag-rows" data-fx-boost-drag-rows="appear: scroll" data-demo="photo"></div>
  <div data-fx="boost-drag-rows" data-demo="logo" data-demo-remove></div>
  <div data-fx="boost-drag-rows"></div>
  <template data-demo-late><div data-fx="boost-drag-rows" data-fx-boost-drag-rows="speed: 2" data-demo="photo"></div></template>
</section>
<script>
  const fill = (box) => {
    const kind = box.dataset.demo;
    if (!kind) return;
    const cell = (i) => (kind === "logo" ? `<div class="logo">Logo ${i + 1}</div>` : `<div class="photo"><div class="wf-img" data-label="Site photo ${i + 1} · Horizontal"></div></div>`);
    box.innerHTML = [1, -1].map((d, r) => `<div data-fx-part="track" data-dir="${d}">${Array.from({ length: 6 }, (_, i) => cell(r * 6 + i)).join("")}</div>`).join("");
  };
  document.querySelectorAll("[data-demo]").forEach(fill);
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => { const n = t.content.firstElementChild.cloneNode(true); fill(n); t.replaceWith(n); }), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
