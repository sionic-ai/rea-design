<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>center-split-hover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { margin: 0; padding: 12px 20px; border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-nav { display: flex; gap: 32px; justify-content: center; padding: 60px 20px; font-weight: 500; font-size: 16px; }
  .demo-dark { background: var(--kf-contrast-bg); color: var(--kf-contrast-ink); }
  .demo-dark [data-fx-part="text"] { color: var(--kf-dim); }
</style>
</head>
<body>
<p class="demo-hint"><b>center-split-hover</b> — Hover the menu text. The text splits at the center, vanishes, then unfolds again. <span style="color:var(--kf-dim)">(One more item comes in after 1s, and one drops out after 2.5s)</span></p>
<nav class="demo-nav">
  <a href="#"><span data-fx="center-split-hover"><span data-fx-part="text">Menu 1</span><span data-fx-part="shadow" aria-hidden="true">Menu 1</span></span></a>
  <a href="#"><span data-fx="center-split-hover"><span data-fx-part="text">Slightly long menu 2</span><span data-fx-part="shadow" aria-hidden="true">Slightly long menu 2</span></span></a>
  <a href="#" data-demo-remove><span data-fx="center-split-hover"><span data-fx-part="text">Omitted menu</span><span data-fx-part="shadow" aria-hidden="true">Omitted menu</span></span></a>
</nav>
<nav class="demo-nav demo-dark">
  <a href="#"><span data-fx="center-split-hover" style="--fx-dur: .8s"><span data-fx-part="text">Black panel menu</span><span data-fx-part="shadow" aria-hidden="true">Black panel menu</span></span></a>
</nav>
<script src="../fx-core.js"></script>
<script>
// Check that it applies to late-added elements and that removed ones get detached — a CSS-only part
setTimeout(() => document.querySelector(".demo-nav").insertAdjacentHTML("beforeend", '<a href="#"><span data-fx="center-split-hover"><span data-fx-part="text">Late-arrived Menu</span><span data-fx-part="shadow" aria-hidden="true">Late-arrived Menu</span></span></a>'), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
