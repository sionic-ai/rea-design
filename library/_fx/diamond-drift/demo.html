<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>diamond-drift — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 2; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .stage { position: relative; height: 80vh; overflow: hidden; isolation: isolate; }
  .blob { position: absolute; width: 40vw; aspect-ratio: 1; border-radius: 50%; z-index: -1;
    background: radial-gradient(closest-side, color-mix(in oklab, var(--kf-accent) 60%, transparent), transparent); filter: blur(20px); }
  .card { position: absolute; left: 50%; top: 50%; translate: -50% -50%; width: min(520px, 70vw); aspect-ratio: 16 / 10; border-radius: var(--kf-radius-lg); }
  .dot { position: absolute; width: 14px; height: 14px; border-radius: 50%; background: var(--kf-accent); }
</style>
</head>
<body>
<p class="demo-hint"><b>diamond-drift</b> — Just watch. Two blobs of light in the back drift around a diamond orbit, one lap every 9s. <span style="color:var(--kf-dim)">(After 1s one more small dot comes in, and after 2.5s one leaves)</span></p>
<section class="stage" id="s1">
  <div class="blob" style="right:-7vw;top:-10vw" data-fx="diamond-drift"></div>
  <div class="blob" style="left:-2vw;top:8vw;--fx-r:11vmin" data-fx="diamond-drift" data-demo-remove></div>
  <div class="card wf-img" data-label="Center card · the cluster spins behind it"></div>
</section>
<template data-demo-late><span class="dot" style="left:20%;top:30%;--fx-r:40px;--fx-dur:3s" data-fx="diamond-drift" data-fx-diamond-drift="dir: back"></span></template>
<script src="../fx-core.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => document.getElementById("s1").append(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
