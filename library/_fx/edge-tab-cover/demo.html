<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>edge-tab-cover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo-spacer { height: 90vh; display: grid; place-items: center; color: var(--kf-dim); }
  .cover { --fx-tab: 60px; }
  .panel { border-radius: 40px 0 0 0; background: var(--kf-accent); color: var(--kf-on-accent); }
  .panel:nth-child(2) { background: var(--kf-ink-soft); }
  .panel:nth-child(3) { background: var(--kf-raised); color: var(--kf-ink); }
  .panel__tab { position: absolute; top: 0; left: 0; width: 60px; height: 100%; display: grid; place-items: start center; padding-top: 40px; font: 700 13px/1 var(--kf-font-display); writing-mode: vertical-rl; }
  .panel__tab i { position: absolute; inset: 0; z-index: -1; background: var(--kf-surface); opacity: .4; }
  .panel h2 { position: absolute; inset: 0; display: grid; place-items: center; font: 700 64px/1 var(--kf-font-display); opacity: 0; transition: opacity .6s; }
  .panel.is-on h2 { opacity: 1; }
  @media (max-width: 767px) { .cover { --fx-tab: 15px; } .panel__tab { width: 15px; color: transparent; } }
</style>
</head>
<body>
<p class="demo-hint"><b>edge-tab-cover</b> — Scroll down — Panels slide in one at a time beside the right-edge tab, covering the previous panel.</p>
<div class="demo-spacer">↓ Scroll</div>
<section class="cover" data-demo-remove data-fx="edge-tab-cover" data-fx-edge-tab-cover="per: 1; gap: .3; tail: .5">
  <div data-fx-part="stage">
    <article class="panel" data-fx-part="panel"><div class="panel__tab"><i data-fx-part="bar"></i>ONE</div><h2>Erased board</h2></article>
    <article class="panel" data-fx-part="panel"><div class="panel__tab">TWO</div><h2>Both</h2></article>
  </div>
</section>
<section class="cover" data-fx="edge-tab-cover">
  <div data-fx-part="stage">
    <article class="panel" data-fx-part="panel"><div class="panel__tab"><i data-fx-part="bar"></i>STAY</div><h2>To stay</h2></article>
    <article class="panel" data-fx-part="panel"><div class="panel__tab"><i data-fx-part="bar"></i>EAT</div><h2>To eat</h2></article>
    <article class="panel" data-fx-part="panel"><div class="panel__tab"><i data-fx-part="bar"></i>PLAY</div><h2>Play</h2></article>
  </div>
</section>
<template data-demo-late><section class="cover" data-fx="edge-tab-cover" data-fx-edge-tab-cover="per: 1; gap: 0; tail: .3">
  <div data-fx-part="stage">
    <article class="panel" data-fx-part="panel"><div class="panel__tab">LATE</div><h2>Late panel</h2></article>
    <article class="panel" data-fx-part="panel"><div class="panel__tab">B</div><h2>B</h2></article>
  </div>
</section></template>
<section class="cover" data-fx="edge-tab-cover"><div data-fx-part="stage"></div></section>
<div class="demo-spacer">Footer</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script>gsap.registerPlugin(ScrollTrigger);</script>
<script src="fx.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); window.ScrollTrigger?.refresh(); }, 2500);
</script>
</body>
</html>
