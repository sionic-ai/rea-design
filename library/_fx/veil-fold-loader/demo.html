<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>veil-fold-loader — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.6 var(--kf-font-sans); }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .hero { margin: 20px; aspect-ratio: 16 / 7; border-radius: var(--kf-radius-md); }
  .alt { --fx-veil: var(--kf-accent); }
  .again { margin: 0 20px; }
</style>
</head>
<body>
<div data-fx="veil-fold-loader" aria-hidden="true"></div>
<div data-demo-remove class="alt" data-fx="veil-fold-loader" data-fx-veil-fold-loader="dur: 4" aria-hidden="true"></div>
<p class="demo-hint"><b>veil-fold-loader</b> — Try reloading. The background-color curtain folds upward over 2s. <span style="color:var(--kf-dim)">(One color curtain leaves at 2.5s, and the curtain that arrived 1s late folds back again)</span></p>
<div class="wf-img hero" data-label="Hero photo · landscape 16:7"></div>
<template data-demo-late><div data-fx="veil-fold-loader" data-fx-veil-fold-loader="dur: 1.2" aria-hidden="true"></div></template>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => document.body.append(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
