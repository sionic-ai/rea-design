<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tornado-cards-3d — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { margin: 0; background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; margin: 0; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-spacer { height: 60vh; display: grid; place-items: center; color: var(--kf-dim); }
  .tc-box { height: 100vh; }
  .tc-card { display: grid; place-items: center; height: 100%; background: var(--kf-raised); font: 600 2em/1 var(--kf-font-display); }
</style>
</head>
<body>
<p class="demo-hint"><b>tornado-cards-3d</b> Cards rise while spinning along a spiral. Rolling the wheel or dragging the panel speeds it up, then it returns to the base speed.</p>
<div class="demo-spacer">Scroll down ↓</div>
<div class="tc-box" data-fx="tornado-cards-3d" data-demo-host>
  <div data-fx-part="list">
    <div data-fx-part="card"><span class="tc-card">01</span></div>
    <div data-fx-part="card"><span class="tc-card">02</span></div>
    <div data-fx-part="card"><span class="tc-card">03</span></div>
    <div data-fx-part="card"><span class="tc-card">04</span></div>
  </div>
</div>
<div class="demo-spacer"></div>
<script>
// Late arrivals and removals — checks that fx-core attaches to an element added after 1s and detaches from an element removed after 2.5s
(() => {
  const src = document.querySelector('[data-fx~="tornado-cards-3d"]');
  if (!src) return;
  const html = src.outerHTML.replace(/\sid="[^"]*"/g, "");
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => src.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical one comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
