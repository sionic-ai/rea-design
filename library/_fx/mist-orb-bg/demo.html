<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mist-orb-bg — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); min-height: 200vh; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { position: relative; z-index: 1; padding: 48px 20px; display: grid; gap: 24px; max-width: 720px; }
  .box { height: 260px; border: 1px solid var(--kf-line); }
  button { padding: 8px 14px; border: 1px solid var(--kf-line); background: var(--kf-surface); color: var(--kf-ink); cursor: pointer; }
</style>
</head>
<body>
<p class="demo-hint"><b>mist-orb-bg</b> — Nebula mist flows behind and beads gather at the center. Move the mouse to leave a tail, and use the buttons to trigger the end sections (inhale · vortex). <span style="color:var(--kf-dim)">(After 1s fog inside a cell comes in, and after 2.5s one leaves)</span></p>
<div data-fx="mist-orb-bg" id="bg"></div>
<section class="demo">
  <p><button onclick="bg.dispatchEvent(new CustomEvent('fx:mood', { detail: { inhale: .5, swirl: .3, lift: .4, end: 1 } }))">To the Final Section</button> <button onclick="bg.dispatchEvent(new CustomEvent('fx:mood', { detail: { end: 0 } }))">Back to start</button></p>
  <div class="box" data-demo-remove data-fx="mist-orb-bg" data-fx-mist-orb-bg="fixed: 0; form: 0; shafts: 1"></div>
  <template data-demo-late><div class="box" data-fx="mist-orb-bg" data-fx-mist-orb-bg="fixed: 0; form: 0"></div></template>
</section>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="three-global.js"></script>
<script src="../../_vendor/three@0.185.0/build/three.cjs"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); }, 2500);
</script>
</body>
</html>
