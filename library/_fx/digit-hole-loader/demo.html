<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>digit-hole-loader — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { margin: 0; font-family: var(--kf-font-sans); background: var(--kf-bg); color: var(--kf-ink); }
  .hero { height: 100vh; display: grid; place-items: center; background: linear-gradient(135deg, var(--kf-accent), var(--kf-accent-soft) 45%, var(--kf-surface)); }
  .ui { position: absolute; left: 3em; bottom: 3em; display: flex; gap: 1.5em; align-items: center; font-family: var(--kf-font-mono); font-size: 12px; letter-spacing: 0.18em; }
  .demo-hint { padding: 24px; }
</style>
</head>
<body>
  <div class="hero"><p class="demo-hint"><b>digit-hole-loader</b> — Refresh. Bricks fall away and the screen behind shows through a giant number hole, then gets sucked from 100 into 0.</p></div>
  <div data-fx="digit-hole-loader" data-fx-digit-hole-loader="dur: 3.2">
    <div class="ui"><span data-fx-part="pct">0%</span><span data-fx-part="bar"></span></div>
    <button type="button" data-fx-part="skip">[ SKIP ]</button>
  </div>
  <template data-demo-late><div data-fx="digit-hole-loader" data-fx-digit-hole-loader="drive: event" id="late" style="visibility: hidden"></div></template>
  <div data-fx="digit-hole-loader" data-demo-remove style="visibility: hidden"></div>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => {
  document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true)));
  setTimeout(() => document.getElementById("late")?.dispatchEvent(new CustomEvent("fx:progress", { detail: 100 })), 300);
}, 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
