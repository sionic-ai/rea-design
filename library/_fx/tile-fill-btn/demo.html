<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tile-fill-btn — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); padding: 40px; }
  .demo-hint { margin: 0 0 32px; font: 500 13px/1.4 var(--kf-font-mono); }
  .row { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; margin-bottom: 24px; }
  .btn { display: inline-grid; place-items: center; height: 53px; min-width: 260px; padding: 0 28px; border: 1px solid var(--kf-ink); background: var(--kf-bg); color: var(--kf-ink); text-decoration: none; font-size: 14px; }
  .btn span { mix-blend-mode: difference; color: var(--kf-surface); }
  .btn.is-dark { background: var(--kf-ink); --fx-tile: var(--kf-bg); }
</style>
</head>
<body>
<p class="demo-hint"><b>tile-fill-btn</b> — Hover over the button (focus via Tab also fills it). Cells light up in random order and fill with the opposite color. <span style="color:var(--kf-dim)">(After 1s one more button comes in, and after 2.5s one drops out)</span></p>
<div class="row">
  <a class="btn" href="#" data-fx="tile-fill-btn" style="--fx-tile: var(--kf-ink)"><span>Your button text here</span></a>
  <a class="btn is-dark" href="#" data-fx="tile-fill-btn"><span>Your dark button here</span></a>
  <button class="btn" type="button" data-fx="tile-fill-btn" data-fx-tile-fill-btn="rows: 6; dur: .6" style="--fx-tile: var(--kf-accent)"><span>6 lines · .6s</span></button>
  <a class="btn" href="#" data-fx="tile-fill-btn" data-demo-remove><span>Button to Be Removed</span></a>
</div>
<div class="row" data-demo-late-host></div>
<span data-fx="tile-fill-btn"></span>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => { document.querySelector("[data-demo-late-host]").innerHTML = '<a class="btn" href="#" data-fx="tile-fill-btn" data-fx-tile-fill-btn="dur: 0"><span>Late button · Instant</span></a>'; }, 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
