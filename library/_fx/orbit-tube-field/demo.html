<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>orbit-tube-field — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.6 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 10; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .stage { position: relative; height: 80vh; margin: 20px; border-radius: var(--kf-radius-lg); background: var(--kf-raised); overflow: hidden; }
  .stage > div { position: absolute; inset: 0; }
  .small { position: relative; width: 320px; height: 200px; margin: 20px; background: var(--kf-raised); }
  .small > div { position: absolute; inset: 0; }
</style>
</head>
<body>
<p class="demo-hint"><b>orbit-tube-field</b> — Look at the board. Four white tube orbits turn slowly and a blue dot circles along each orbit. <span style="color:var(--kf-dim)">(After 1s one more panel comes in, and one leaves 2.5s later)</span></p>
<div class="stage"><div data-fx="orbit-tube-field"></div></div>
<div class="small" id="late"><div data-fx="orbit-tube-field" data-fx-orbit-tube-field="solid: 1; dashed: 3" data-demo-remove></div></div>
<div data-fx="orbit-tube-field" data-fx-orbit-tube-field="solid: 0; dashed: 0"></div>
<script src="three-global.js"></script>
<script src="../../_vendor/three@0.184.0/build/three.cjs"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => { const d = document.createElement("div"); d.dataset.fx = "orbit-tube-field"; d.dataset.fxOrbitTubeField = "spin: .3; speed: .6"; document.getElementById("late")?.append(d); }, 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
