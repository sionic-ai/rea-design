<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>drilldown-drawer — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); padding: 24px; }
  .demo-hint { margin-bottom: 16px; font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-toggle { position: relative; z-index: 103; padding: 8px 16px; border: 1px solid var(--kf-line); background: var(--kf-surface); cursor: pointer; }
  .demo-pane { padding: 80px 28px 28px; line-height: 2.4; }
  .demo-pane a, .demo-pane button { display: block; width: 100%; border: 0; background: none; padding: 0; text-align: left; font: inherit; color: inherit; cursor: pointer; }
</style>
</head>
<body>
<p class="demo-hint"><b>drilldown-drawer</b> — Press ”Menu” to open the drawer, then press ”Products ›” to go to the sub level.</p>
<div data-fx="drilldown-drawer">
  <button type="button" class="demo-toggle" data-fx-part="toggle" aria-expanded="false">Menu</button>
  <div data-fx-part="bg"></div>
  <nav data-fx-part="panel" aria-label="Demo Menu"><div data-fx-part="track">
    <div class="demo-pane"><a href="#">First</a><a href="#">Reads</a><button type="button" data-fx-part="more">Product ›</button><a href="#">About</a></div>
    <div class="demo-pane"><button type="button" data-fx-part="back">‹ Back</button><a href="#">Series 1</a><a href="#">Series 2</a><a href="#">Series 3</a></div>
  </div></nav>
</div>
<script>
// Late arrivals and removals — checks that fx-core attaches to an element added after 1s and detaches from an element removed after 2.5s
(() => {
  const src = document.querySelector('[data-fx~="drilldown-drawer"]');
  if (!src) return;
  const html = src.outerHTML.replace(/\sid="[^"]*"/g, "");
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => src.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical one comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
