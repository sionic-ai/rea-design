<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>spring-page-drag — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 14px/1.4 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; padding: 32px 20px; }
  .demo figure { display: grid; gap: 8px; color: var(--kf-dim); }
  .demo [data-fx] { aspect-ratio: 1; }
  .demo .wf-img { height: 100%; border: 0; }
</style>
</head>
<body>
<p class="demo-hint"><b>spring-page-drag</b> — Drag the photo frame sideways and release. Drag past 18% or flick hard to go to the next slide, and on hover arrows appear on both sides (below width 810 it becomes a dot pill). <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<div class="demo">
  <figure><div data-fx="spring-page-drag"><div data-fx-part="track"><div class="wf-img" data-label="Section 1"></div><div class="wf-img" data-label="Section 2"></div><div class="wf-img" data-label="Section 3"></div><div class="wf-img" data-label="Section 4"></div></div><button data-fx-part="prev" aria-label="Previous"><svg viewBox="0 0 18 18"><path d="M11 5 7 9l4 4" fill="none" stroke="currentColor" stroke-width="1.6"/></svg></button><button data-fx-part="next" aria-label="Next"><svg viewBox="0 0 18 18"><path d="m7 5 4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.6"/></svg></button><span data-fx-part="dots"></span></div><figcaption>Default · 480/46/.9</figcaption></figure>
  <figure data-demo-remove><div data-fx="spring-page-drag" data-fx-spring-page-drag="k: 200; c: 12; gap: 8"><div data-fx-part="track"><div class="wf-img" data-label="Section 1"></div><div class="wf-img" data-label="Section 2"></div><div class="wf-img" data-label="Section 3"></div></div><span data-fx-part="dots"></span></div><figcaption>Bouncing spring 200/12 · gap 8 (drops out after 2.5s)</figcaption></figure>
  <template data-demo-late><figure><div data-fx="spring-page-drag"><div data-fx-part="track"><div class="wf-img" data-label="Late 1"></div><div class="wf-img" data-label="Late 2"></div></div></div><figcaption>Late · no arrow</figcaption></figure></template>
  <figure><div data-fx="spring-page-drag"><div data-fx-part="track"><div class="wf-img" data-label="One Section (quiet)"></div></div></div><figcaption>Just one sheet</figcaption></figure>
</div>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
