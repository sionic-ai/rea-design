<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>idle-blink-eyes — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { padding: 48px 20px; display: flex; gap: 48px; flex-wrap: wrap; }
  .mark { width: 260px; aspect-ratio: 2 / 1; display: flex; align-items: center; justify-content: center; gap: 10%; }
  .ring { position: relative; width: 34%; aspect-ratio: 1; border: 14px solid var(--kf-ink); border-radius: 50%; background: var(--kf-surface); }
  .ring [data-fx-part="eye"] { left: 0; top: 0; width: 100%; height: 100%; }
</style>
</head>
<body>
<p class="demo-hint"><b>idle-blink-eyes</b> — Move the mouse and the eyes follow, leave it still for 2 seconds and they look around and blink on their own. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<section class="demo">
  <div data-demo-remove class="mark" data-fx="idle-blink-eyes"><span class="ring"><span data-fx-part="eye"><i data-fx-part="pupil"></i><i data-fx-part="lid"></i></span></span><span class="ring"><span data-fx-part="eye"><i data-fx-part="pupil"></i><i data-fx-part="lid"></i></span></span></div>
  <div class="mark" data-fx="idle-blink-eyes"><span class="ring"><span data-fx-part="eye"><i data-fx-part="pupil"></i><i data-fx-part="lid"></i></span></span><span class="ring"><span data-fx-part="eye"><i data-fx-part="pupil"></i><i data-fx-part="lid"></i></span></span></div>
  <template data-demo-late><div class="mark" data-fx="idle-blink-eyes" data-fx-idle-blink-eyes="blink: 400"><span class="ring"><span data-fx-part="eye"><i data-fx-part="pupil"></i><i data-fx-part="lid"></i></span></span><span class="ring"><span data-fx-part="eye"><i data-fx-part="pupil"></i></span></span></div></template>
  <div class="mark" data-fx="idle-blink-eyes"><span class="ring"></span><span class="ring"></span></div>
</section>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
