<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>spring-media-shift — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .frame { height: 70vh; margin: 20px; border: 1px solid var(--kf-line); }
  .frame [data-fx-part="media"] { background: repeating-linear-gradient(45deg, var(--kf-raised) 0 20px, var(--kf-accent-soft) 20px 40px); }
</style>
</head>
<body>
<p class="demo-hint"><b>spring-media-shift</b> Move the mouse across the screen from edge to edge. The pattern inside the cells follows the cursor slightly, like a spring.</p>
<section class="frame" data-fx="spring-media-shift" data-demo-remove><div data-fx-part="media"></div></section>
<section class="frame" data-fx="spring-media-shift" data-fx-spring-media-shift="strength: .06"><div data-fx-part="media"></div></section>
<template data-demo-late><section class="frame" data-fx="spring-media-shift"><div data-fx-part="media"></div></section></template>
<section class="frame" data-fx="spring-media-shift"></section>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
