<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>line-drum-mark — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { padding: 64px 20px; display: grid; gap: 48px; justify-items: center; }
  button { padding: 16px 0; border: 0; background: none; cursor: pointer; }
</style>
</head>
<body>
<p class="demo-hint"><b>line-drum-mark</b> — The row rotates one slot every 0.8 seconds. Hover over it. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<section class="demo">
  <button data-demo-remove data-fx="line-drum-mark" aria-label="Browse"></button>
  <button data-fx="line-drum-mark" aria-label="Browse"></button>
  <template data-demo-late><button data-fx="line-drum-mark" data-fx-line-drum-mark="lines: 7; step: 500; lit: 3" aria-label="Browse"></button></template>
  <button data-fx="line-drum-mark" style="--fx-w: 8px; --fx-h: 20px; --fx-span: 204px" aria-label="Large marker"></button>
</section>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); window.ScrollTrigger?.refresh(); }, 2500);
</script>
</body>
</html>
