<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tuck-banner — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .hero { height: 80vh; display: grid; place-items: center; background: var(--kf-accent-soft); }
  .body { height: 260vh; padding: 40px 20px; }
  .tb [data-fx-part="handle"] { width: 52px; height: 64px; border: 0; border-radius: var(--kf-radius-pill) 0 0 var(--kf-radius-pill); background: var(--kf-accent); color: var(--kf-on-accent); font: inherit; }
  .tb [data-fx-part="panel"] { display: grid; place-items: center; width: 240px; height: 80px; border-radius: var(--kf-radius-sm) 0 0 var(--kf-radius-sm); background: var(--kf-surface); box-shadow: var(--kf-shadow-lift); }
</style>
</head>
<body>
<p class="demo-hint"><b>tuck-banner</b> — After passing halfway through the first panel or scrolling past 1000px, the bottom-right banner folds. Press the blue handle to unfold it again.</p>
<div class="hero">Hero</div>
<div class="tb" data-fx="tuck-banner" data-fx-tuck-banner="after: .hero; away: 1000; away-phone: 500">
  <button type="button" data-fx-part="handle">Expansion</button>
  <a href="#" data-fx-part="panel">Your promo card here</a>
</div>
<div class="body"><p>Your two body lines here.</p></div>
<script>
// Late arrivals and removals — checks that fx-core attaches to an element added after 1s and detaches from an element removed after 2.5s
(() => {
  const host = document.querySelector('[data-fx~="tuck-banner"]');
  if (!host) return;
  const html = host.outerHTML;
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; el.style.bottom = tag === "late" ? "120px" : "220px"; return el; };
  const gone = make("gone");
  host.after(gone);
  setTimeout(() => host.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical one comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
