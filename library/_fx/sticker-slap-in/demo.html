<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sticker-slap-in — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { margin: 0; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .stage { display: flex; flex-wrap: wrap; align-items: center; gap: 40px; padding: 40px; }
  .logo { width: min(520px, 90vw); }
  .logo rect { fill: var(--kf-surface); stroke: var(--kf-ink); stroke-width: 4; }
  .logo .t { fill: var(--kf-accent); stroke: var(--kf-ink); stroke-width: 4; }
  .pill { display: inline-block; padding: 14px 40px; border: 2px solid var(--kf-ink); border-radius: var(--kf-radius-pill); background: var(--kf-accent); color: var(--kf-accent-ink); font-weight: 700; }
</style>
</head>
<body>
<p class="demo-hint"><b>sticker-slap-in</b> — Refresh the page. The pieces stick on one after another with a thud (1.4x → 1.1x → 1x), and at 1.25s the whole panel nods in 3D. The button on the right attaches as a whole, without pieces.</p>
<div class="stage" id="stage">
  <svg class="logo" data-fx="sticker-slap-in" data-fx-sticker-slap-in="wobble: 1.25" viewBox="0 0 520 300" role="img" aria-label="Your logo here">
    <g data-fx-part="piece" data-delay=".2"><rect x="20" y="20" width="480" height="110" rx="30"/><rect class="t" x="60" y="50" width="400" height="50" rx="12"/></g>
    <g data-fx-part="piece" data-delay=".6"><rect x="60" y="150" width="400" height="90" rx="30"/></g>
    <g data-fx-part="piece" data-delay="1" data-over="1.06"><rect class="t" x="380" y="220" width="90" height="70" rx="12"/></g>
  </svg>
  <span class="pill" data-fx="sticker-slap-in" data-fx-sticker-slap-in="delay: 1.8">Get started</span>
</div>
<script>
// Late arrivals · removals — after 1s one more button comes in, after 2.5s the first button is removed (detach)
(() => {
  const stage = document.getElementById("stage");
  const first = stage.querySelector(".pill");
  setTimeout(() => { const s = document.createElement("span"); s.className = "pill"; s.dataset.fx = "sticker-slap-in"; s.textContent = "Late-arrived Button"; stage.append(s); }, 1000);
  setTimeout(() => first.remove(), 2500);
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
