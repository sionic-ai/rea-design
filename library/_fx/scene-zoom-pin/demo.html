<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>scene-zoom-pin — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-gap { height: 60vh; display: grid; place-items: center; color: var(--kf-dim); }
  .demo-head { position: absolute; top: 24px; left: 0; right: 0; z-index: 2; text-align: center; font: 500 12px/1 var(--kf-font-mono); letter-spacing: .2em; }
  .demo-scene { display: grid; grid-template-columns: 1fr 240px 1fr; align-items: center; gap: 32px; font: 400 clamp(40px, 7vw, 96px)/1 var(--kf-font-display); }
  .demo-scene > span:first-child { justify-self: end; }
  .demo-scene .wf-img { height: 360px; }
</style>
</head>
<body>
<p class="demo-hint"><b>scene-zoom-pin</b> — Roll down. The scene approaches and moves on to the next one, and when you stop it snaps to the scene position.</p>
<div class="demo-gap">Downward</div>
<section data-fx="scene-zoom-pin" id="src">
  <p data-fx-part="head" class="demo-head">Your small title here</p>
  <article data-fx-part="scene" class="demo-scene"><span>Hidden</span><span class="wf-img" data-label="Photo 1"></span><span>Coast</span></article>
  <article data-fx-part="scene" class="demo-scene"><span>Wine</span><span class="wf-img" data-label="Photo 2"></span><span>Dining table</span></article>
  <article data-fx-part="scene" class="demo-scene"><span>Village</span><span class="wf-img" data-label="Photo 3"></span><span>Daily life</span></article>
</section>
<div class="demo-gap">Footer</div>
<script>
(() => {
  const src = document.getElementById("src");
  const html = src.outerHTML.replace(/\sid="[^"]*"/g, "");
  const make = () => { const t = document.createElement("template"); t.innerHTML = html; return t.content.firstElementChild; };
  const gone = make();
  src.after(gone);
  setTimeout(() => src.after(make()), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s, one more panel comes in (the late one), and after 2.5s one drops out (the removal).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
