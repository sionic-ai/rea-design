<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>liquid-arc-carousel — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { height: 80vh; margin: 24px 0; }
  .demo-small { height: 60vh; }
</style>
</head>
<body>
<p class="demo-hint"><b>liquid-arc-carousel</b> — Roll the wheel or drag sideways over the panel. The faster you go, the more the panel pinches at the waist and bends, and the camera and light follow the mouse. After 1 second another panel attaches below, and after 2.5 seconds an empty panel drops out.</p>
<section class="demo" data-fx="liquid-arc-carousel">
  <i data-fx-part="slide" data-label="Work 1 video · 16:9"></i><i data-fx-part="slide" data-label="Work 2 video"></i><i data-fx-part="slide" data-label="Work 3 video"></i>
  <i data-fx-part="slide" data-label="Work 4 video"></i><i data-fx-part="slide" data-label="Work 5 video"></i><i data-fx-part="slide" data-label="Work 6 video"></i>
</section>
<section class="demo demo-small" data-fx="liquid-arc-carousel" data-demo-remove></section>
<div id="late"></div>
<template data-demo-late>
  <section class="demo demo-small" data-fx="liquid-arc-carousel" data-fx-liquid-arc-carousel="wheel-axis: x; tilt: 0; arc: 120">
    <i data-fx-part="slide" data-label="Late panel 1 · arc 120°"></i><i data-fx-part="slide" data-label="Late-arriving panel 2"></i><i data-fx-part="slide" data-label="Late-arriving panel 3"></i><i data-fx-part="slide" data-label="Late-arriving panel 4"></i>
  </section>
</template>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="three-global.js"></script>
<script src="../../_vendor/three@0.185.0/build/three.cjs"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => document.getElementById("late").append(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
