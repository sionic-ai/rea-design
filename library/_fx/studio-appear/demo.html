<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>studio-appear — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .gap { height: 90vh; }
  .row { display: flex; gap: 24px; align-items: center; margin: 0 20px 60px; }
  .row .wf-img { width: 260px; aspect-ratio: 4 / 3; }
  .bubble { display: grid; place-items: center; width: 120px; aspect-ratio: 1; border-radius: 50%; background: var(--kf-accent-soft); }
</style>
</head>
<body>
<p class="demo-hint"><b>studio-appear</b> — Scroll down. The photo slowly brightens and the circle pops out. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<div class="gap"></div>
<div class="row" data-demo-row>
  <div class="wf-img" data-fx="studio-appear" data-label="Photo · 4:3"></div>
  <div class="wf-img" data-fx="studio-appear" style="--fx-delay:.2s" data-label="Second · .2s later"></div>
  <span class="bubble" data-fx="studio-appear" data-fx-studio-appear="look: pop">Speech bubble</span>
  <span class="bubble" data-fx="studio-appear" data-fx-studio-appear="look: left">From the left</span>
  <span class="bubble" data-fx="studio-appear" data-fx-studio-appear="look: right" style="--fx-delay:.4s">From the right</span>
  <span class="bubble" data-fx="studio-appear" data-fx-studio-appear="look: up" style="--fx-delay:.3s">Rising up</span>
  <span class="bubble" data-fx="studio-appear" data-fx-studio-appear="look: grow" style="border-radius:50% 50% 0 0">Growing</span>
  <span class="bubble" data-fx="studio-appear" data-fx-studio-appear="look: tilt" style="--fx-delay:.4s">Sitting apart</span>
  <div class="wf-img" data-fx="studio-appear" data-fx-studio-appear="look: gray" style="--fx-delay:.4s" data-label="From B&W to color"></div>
  <span class="bubble" data-fx="studio-appear" data-fx-studio-appear="look: skew">Forms at an angle</span>
  <span class="bubble" data-demo-remove data-fx="studio-appear" data-fx-studio-appear="look: pop">Item to Be Removed</span>
</div>
<div class="gap"></div>
<template data-demo-late><div class="row"><div class="wf-img" data-fx="studio-appear" data-fx-studio-appear="at: 70" data-label="Late-arriving photo · 70% line"></div></div></template>
<div class="gap"></div>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
