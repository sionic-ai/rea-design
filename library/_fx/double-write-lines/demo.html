<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>double-write-lines — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo-spacer { height: 70vh; display: grid; place-items: center; color: var(--kf-dim); }
  .demo { padding: 40px 20px; }
  .ja { font-size: 22px; line-height: 2; }
  .en { margin-top: 40px; font-size: 11px; line-height: 3; color: var(--kf-dim); }
</style>
</head>
<body>
<p class="demo-hint"><b>double-write-lines</b> — Scroll down and the text lines are written once faintly, then once darkly .8s later. After 1s one more panel attaches below, and after 2.5s an empty panel drops out.</p>
<div class="demo-spacer">Scroll down</div>
<section class="demo" data-fx="double-write-lines">
  <div class="ja" data-fx-part="group">
    <p data-fx-part="line">Reaching the heart</p>
    <p data-fx-part="line">Memorable</p>
    <p data-fx-part="line">Creating beauty</p>
  </div>
  <div class="en" data-fx-part="group">
    <p data-fx-part="line">We write the first line</p>
    <p data-fx-part="line">then the second one</p>
  </div>
</section>
<section class="demo" data-fx="double-write-lines" data-demo-remove></section>
<div id="late"></div>
<template data-demo-late>
  <section class="demo" data-fx="double-write-lines" data-fx-double-write-lines="lag: .4; ghost: .35">
    <p class="ja" data-fx-part="line">Late-arriving version — delay .4s</p>
  </section>
</template>
<div class="demo-spacer"></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/CustomEase.min.js"></script>
<script>gsap.registerPlugin(CustomEase);</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => document.getElementById("late").append(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
