<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>paint-orb — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .orb { display: grid; justify-items: center; gap: 20px; padding: 40px 20px; }
  .orb nav { display: flex; gap: 4px; }
  .orb button { border: 0; padding: 8px 12px; background: var(--kf-surface); color: var(--kf-dim); cursor: pointer; font: inherit; }
  .orb [data-fx-part="ball"] { width: min(380px, 80vw); }
</style>
</head>
<body>
<p class="demo-hint"><b>paint-orb</b> — Press the ball to make ripples, press the button to roll the ball.</p>
<div class="orb" data-fx="paint-orb">
  <nav><button type="button" data-fx-part="tab">One</button><button type="button" data-fx-part="tab">Both</button><button type="button" data-fx-part="tab">Three (native Korean)</button></nav>
  <div data-fx-part="ball"></div>
</div>
<script>
(() => {
  const src = document.querySelector('[data-fx~="paint-orb"]');
  if (!src) return;
  const html = src.outerHTML;
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => src.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical one comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="three-global.js"></script>
<script src="../../_vendor/three@0.182.0/build/three.cjs"></script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
