<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>spin-scene-tile — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { margin: 0; padding: 12px 20px; border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .grid { display: grid; grid-template-columns: repeat(4, 150px); gap: 20px; justify-content: center; padding: 40px 0; }
  .tile { width: 150px; aspect-ratio: 1; border-radius: 18px; background: var(--kf-accent-soft); }
  .tile.is-fx-back { background: var(--kf-raised); }
  .dot { position: absolute; width: 28%; aspect-ratio: 1; border-radius: 50%; background: var(--kf-accent); }
  .tag { position: absolute; left: 12%; top: 10%; font-weight: 700; font-size: 13px; }
</style>
</head>
<body>
<p class="demo-hint"><b>spin-scene-tile</b> — Cells appear while spinning, and from 8s·16s the scene changes each time the 32s loop spins again (shorten at·period to see it quickly).</p>
<div class="grid" id="grid">
  <div class="tile" data-fx="spin-scene-tile" data-fx-spin-scene-tile="at: 0 2 4 6; period: 8; offset: 1"><div data-fx-part="inner">
    <div data-fx-part="scene"><i class="dot" style="left:20%;top:30%"></i><i class="dot" style="left:56%;top:50%"></i></div>
    <div data-fx-part="scene"><b class="tag">Day 1</b><i class="dot" style="left:36%;top:40%"></i></div>
    <div data-fx-part="scene" data-key="back"><i class="dot" style="left:50%;top:20%"></i></div>
  </div></div>
  <div class="tile" data-fx="spin-scene-tile" data-fx-spin-scene-tile="enter: .1; offset: 16"><div data-fx-part="inner">
    <div data-fx-part="scene"><i class="dot" style="left:30%;top:30%"></i></div>
    <div data-fx-part="scene"><b class="tag">Day 2</b></div>
  </div></div>
  <div class="tile gone" data-fx="spin-scene-tile" data-fx-spin-scene-tile="enter: .2"><div data-fx-part="inner"><div data-fx-part="scene"><i class="dot" style="left:40%;top:40%"></i></div></div></div>
</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
  // Checks whether it attaches to late-arriving cells and whether missing cells get detached
  setTimeout(() => {
    const t = document.createElement("div");
    t.className = "tile";
    t.dataset.fx = "spin-scene-tile";
    t.innerHTML = '<div data-fx-part="inner"><div data-fx-part="scene"><i class="dot" style="left:36%;top:36%"></i></div><div data-fx-part="scene"><b class="tag">Late</b></div></div>';
    document.getElementById("grid").append(t);
  }, 1000);
  setTimeout(() => document.querySelector(".gone")?.remove(), 2500);
</script>
</body>
</html>
