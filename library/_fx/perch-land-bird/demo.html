<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>perch-land-bird — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 2; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .stage { position: relative; height: 320px; margin: 40px; border-radius: 20px; background: var(--kf-raised); }
  .perch { position: absolute; left: 220px; bottom: 120px; }
  .branch { position: absolute; left: -24px; bottom: -6px; width: 110px; height: 8px; border-radius: 4px; background: var(--kf-dim); }
  .bird { position: absolute; left: 0; bottom: 0; width: 78px; height: 56px; }
  .body { position: absolute; left: 0; top: 0; width: 34px; height: 50px; border-radius: 50% 50% 40% 40%; background: var(--kf-accent); }
  .tail { position: absolute; left: 30px; top: 18px; width: 44px; height: 16px; border-radius: 0 50% 50% 0; background: var(--kf-accent); }
  .note { position: absolute; right: 80px; bottom: 40px; display: block; width: 180px; padding: 14px; border-radius: 6px; background: var(--kf-surface); color: var(--kf-accent); transform: rotate(7deg); transform-origin: right bottom; }
</style>
</head>
<body>
<p class="demo-hint"><b>perch-land-bird</b> — On open, a bird flies in from the bottom right and lands on a branch, and a note lights up. Every 5s it shivers and wags its tail. <span style="color:var(--kf-dim)">(After 1s one more bird flies in, and after 2.5s one is removed)</span></p>
<div class="stage">
  <div class="perch" data-fx="perch-land-bird">
    <div class="branch" data-fx-part="branch"></div>
    <div class="bird" data-fx-part="bird"><span class="body"></span><span class="tail" data-fx-part="tail"></span><a class="note" data-fx-part="note" href="#">Notice · Your notice title here, one line</a></div>
  </div>
  <div class="perch" style="left: 620px" data-fx="perch-land-bird" data-fx-perch-land-bird="tilt: -14; every: 3" data-demo-remove>
    <div class="bird" data-fx-part="bird"><span class="body"></span></div>
  </div>
  <template data-demo-late><div class="perch" style="left: 900px" data-fx="perch-land-bird" data-fx-perch-land-bird="x: 300; y: 200"><div class="bird" data-fx-part="bird"><span class="body"></span><span class="tail" data-fx-part="tail"></span></div></div></template>
  <div class="perch" data-fx="perch-land-bird"></div>
</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/CustomEase.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
