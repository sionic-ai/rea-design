<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pin-media-expand — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .ph { height: 100svh; display: grid; place-items: center; }
  .ph h1 { font: 800 clamp(4rem, 18vw, 20rem)/0.8 var(--kf-font-display); white-space: nowrap; letter-spacing: -0.06em; }
  .ph h1 span { display: inline-block; }
  .ph [data-fx-part="media"] { width: 26vw; height: 26vw; background: var(--kf-raised); }
  .ph p { position: absolute; bottom: 12%; left: 0; right: 0; text-align: center; }
  .after { height: 150vh; padding: 40px; }
</style>
</head>
<body>
<p class="demo-hint"><b>pin-media-expand</b> — Scroll down a little. The center image spreads to fill the screen, and folds back when you scroll up. <span style="color:var(--kf-dim)">(After 1s one more panel comes in, and one leaves 2.5s later)</span></p>
<section class="ph" data-fx="pin-media-expand">
  <h1><span data-fx-part="left">STU</span><span data-fx-part="right">DIO</span></h1>
  <div data-fx-part="media" class="wf-img" data-label="Square portrait photo"></div>
  <p data-fx-part="fade">Your one-line introduction goes here</p>
</section>
<div class="after">Your next section here</div>
<section class="ph" data-demo-remove data-fx="pin-media-expand" data-fx-pin-media-expand="intro: off"><div data-fx-part="media" class="wf-img" data-label="Dropping panel"></div></section>
<template data-demo-late><section class="ph" data-fx="pin-media-expand" data-fx-pin-media-expand="open: .6"><h1><span data-fx-part="left">LA</span><span data-fx-part="right">TE</span></h1><div data-fx-part="media" class="wf-img" data-label="Late panel"></div></section></template>
<section data-fx="pin-media-expand"></section>
<div class="after">Your footer here</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script>gsap.registerPlugin(ScrollTrigger);</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
