<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>displace-hover-swap — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { padding: 48px 20px; display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 24px; }
  figure { aspect-ratio: 4 / 3; margin: 0; }
</style>
</head>
<body>
<p class="demo-hint"><b>displace-hover-swap</b> — Hover over a photo cell and move away. It switches to another photo following the distortion.</p>
<section class="demo">
  <figure data-fx="displace-hover-swap"><span data-fx-part="image" data-label="First photo slot"></span><span data-fx-part="image" data-label="Second photo slot"></span></figure>
  <figure data-fx="displace-hover-swap" data-demo-remove><span data-fx-part="image" data-label="Cell to erase"></span></figure>
  <template data-demo-late><figure data-fx="displace-hover-swap" data-fx-displace-hover-swap="intensity: .6; in: .8"><span data-fx-part="image" data-label="Late-arrived one"></span><span data-fx-part="image" data-label="Late two"></span></figure></template>
  <figure data-fx="displace-hover-swap"></figure>
</section>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
