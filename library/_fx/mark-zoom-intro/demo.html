<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mark-zoom-intro — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 1; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .scene { height: 100vh; display: grid; place-items: center; background: var(--kf-accent); color: var(--kf-on-accent); font-size: 48px; font-weight: 700; }
  .type { font-size: 4.4vw; font-weight: 800; line-height: 1; }
  .box { height: 40vh; }
</style>
</head>
<body>
<p class="demo-hint"><b>mark-zoom-intro</b> — Refresh the page. A logo line larger than the screen is drawn and shrinks into place, the name opens, then two clusters of petals step aside (this demo holds 3.6s). <span style="color:var(--kf-dim)">(After 1s one more empty act comes in, and after 2.5s it is removed)</span></p>
<div data-fx="mark-zoom-intro" data-fx-mark-zoom-intro="hold: 3.6; draw: 2.4">
  <div data-fx-part="bg"></div>
  <div data-fx-part="veil"><div data-fx-part="petal"></div><div data-fx-part="petal"></div></div>
  <div data-fx-part="logo"><div data-fx-part="set">
    <svg data-fx-part="mark" viewBox="0 0 100 100"><path stroke-width="6.5" d="M28 60c4-12 12-16 17-8 4 7 9 7 12-1 3-7 9-8 12 0M48 9c9-1 14 6 21 8 10 3 19 9 19 20 0 7-5 11-4 18 1 8 6 14 1 22-5 9-15 9-22 12-7 3-11 7-19 6s-13-6-19-9c-9-4-18-8-19-19-1-8 4-12 4-19 0-8-5-14-1-22 4-9 14-9 21-12 6-3 11-5 18-5z"/></svg>
    <div data-fx-part="type" class="type">Brand Name</div>
  </div></div>
</div>
<section class="scene">Hero scene</section>
<div class="box" id="late"></div>
<template data-demo-late><div data-fx="mark-zoom-intro" data-fx-mark-zoom-intro="hold: .5" data-demo-remove><div data-fx-part="bg"></div></div></template>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/CustomEase.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => document.getElementById("late").append(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
