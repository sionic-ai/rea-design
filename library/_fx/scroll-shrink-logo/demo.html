<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>scroll-shrink-logo — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px 12px 280px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo-logo { position: fixed; top: 0; left: 0; z-index: 101; display: grid; place-content: center; width: 240px; height: 220px; margin: 0; background: var(--kf-raised); border-bottom-right-radius: var(--kf-radius-lg); font: 700 28px/1.3 var(--kf-font-display); text-align: center; }
  .demo-spacer { height: 260vh; padding: 320px 20px 0; color: var(--kf-dim); }
</style>
</head>
<body>
<p class="demo-hint"><b>scroll-shrink-logo</b> Scroll down more than 150px. The top-left logo shrinks to .8x and grows back when you scroll up.</p>
<h1 class="demo-logo" data-fx="scroll-shrink-logo" id="logo">Name<br>Logo tag</h1>
<div class="demo-spacer">Scroll Margin</div>
<script>
// Late arrivals and removals — it catches a logo attached 1s later, and a logo removed after 2.5s has its listener detached
(() => {
  const src = document.getElementById("logo");
  const make = (tag) => { const el = src.cloneNode(true); el.removeAttribute("id"); el.dataset.demo = tag; el.style.left = tag === "late" ? "260px" : "520px"; el.style.width = "160px"; el.style.height = "120px"; el.style.fontSize = "16px"; return el; };
  const gone = make("gone");
  document.body.append(gone);
  setTimeout(() => document.body.append(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s one more small logo comes in, and after 2.5s one drops out.");
})();
</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
