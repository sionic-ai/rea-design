<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>line-redraw-hover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { display: flex; flex-wrap: wrap; gap: 32px; padding: 48px 20px; }
  .demo a { color: inherit; text-decoration: none; font-size: 20px; }
</style>
</head>
<body>
<p class="demo-hint"><b>line-redraw-hover</b> — Hover over the links. On the first two a line is drawn, and on the last two the line that is always there retracts and is drawn again. <span style="color:var(--kf-dim)">(After 1s one more link comes in, and after 2.5s one drops out)</span></p>
<section class="demo" id="demo">
  <a href="#" data-fx="line-redraw-hover" data-demo-remove>Brochure Request</a>
  <a href="#" data-fx="line-redraw-hover">School Website</a>
  <a href="#" data-fx="line-redraw-hover" data-fx-line-redraw-hover="look: always">Home</a>
  <a href="#" data-fx="line-redraw-hover" data-fx-line-redraw-hover="look: always" style="--fx-weight: 2px">News</a>
  <a href="#" data-fx="line-redraw-hover" data-fx-line-redraw-hover="look: always-gap" style="--fx-weight: 2px; --fx-redraw: .5s">VIEW ALL</a>
  <a href="#" data-fx="line-redraw-hover" data-fx-line-redraw-hover="look: clip-half" style="--fx-weight: 2px; --fx-redraw: 1.3s; --fx-redraw-ease: cubic-bezier(.65,0,.35,1)">BOOKING</a>
</section>
<script>
setTimeout(() => document.getElementById("demo").insertAdjacentHTML("beforeend", '<a href="#" data-fx="line-redraw-hover">Late-arrived Link</a>'), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
