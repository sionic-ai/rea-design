<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>poster-wall-zoom — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  html { font-size: calc(100vw / 144); }
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .track { height: 300svh; }
  .view { position: sticky; top: 0; height: 100svh; }
  .main, .poster { background: linear-gradient(160deg, var(--kf-raised), var(--kf-accent)); }
  .poster { border: 0.8rem solid var(--kf-ink); }
  .after { padding: 40px 20px 60vh; }
</style>
</head>
<body>
<p class="demo-hint"><b>poster-wall-zoom</b> — Scroll down — a full-screen photo shrinks into a single center poster while the surrounding poster wall is revealed in a staggered way. Move the mouse and a shadow frame follows. <span style="color:var(--kf-dim)">(After 1s one more pillar comes in, and after 2.5s one drops out)</span></p>
<div class="track" data-fx-part="track">
  <div class="view" data-fx="poster-wall-zoom">
    <div class="main" data-fx-part="main"></div>
    <div data-fx-part="wall">
      <div data-fx-part="column"><span class="poster"></span><span class="poster"></span><span class="poster"></span><span class="poster"></span></div>
      <div data-fx-part="column" data-demo-remove><span class="poster"></span><span class="poster"></span><span class="poster"></span><span class="poster"></span></div>
      <div data-fx-part="column"><span class="poster"></span><span class="poster"></span><span></span><span class="poster"></span></div>
      <div data-fx-part="column"><span class="poster"></span><span class="poster"></span><span class="poster"></span><span class="poster"></span></div>
    </div>
    <div data-fx-part="shade"></div>
  </div>
</div>
<p class="after">Footer</p>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => { const c = document.createElement("div"); c.dataset.fxPart = "column"; c.innerHTML = '<span class="poster"></span><span class="poster"></span><span class="poster"></span><span class="poster"></span>'; document.querySelector("[data-fx-part=wall]")?.append(c); }, 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); }, 2500);
</script>
</body>
</html>
