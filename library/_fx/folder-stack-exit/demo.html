<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>folder-stack-exit — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .pad { height: 40vh; }
  .stack { width: min(1000px, 92vw); margin: 0 auto; padding-bottom: 40vh; }
  .folder { padding-top: 40px; }
  .folder .head { display: flex; align-items: center; height: 140px; padding: 0 40px; border-radius: 0 var(--kf-radius-lg) 0 0; background: var(--kf-accent); font-weight: 700; font-size: 28px; }
  .folder .body { height: 420px; border-radius: 0 0 var(--kf-radius-lg) var(--kf-radius-lg); background: var(--kf-accent); padding: 0 14px 14px; }
  .folder .body i { display: block; height: 100%; border-radius: var(--kf-radius-md); background: var(--kf-surface); }
  .folder:nth-child(2) .head, .folder:nth-child(2) .body { background: var(--kf-accent-soft); }
  .folder:nth-child(3) .head, .folder:nth-child(3) .body { background: var(--kf-raised); }
</style>
</head>
<body>
<p class="demo-hint"><b>folder-stack-exit</b> — Scroll down. Panels stick to the top and stack up, and when the next panel arrives the previous one slides up and out. <span style="color:var(--kf-dim)">(After 1s one more panel comes in, and one leaves 2.5s later)</span></p>
<div class="pad"></div>
<div class="stack" data-fx="folder-stack-exit">
  <section class="folder" data-fx-part="folder"><a class="head" data-fx-part="head">Panel One</a><div class="body"><i></i></div></section>
  <section class="folder" data-fx-part="folder"><a class="head" data-fx-part="head">Panel Two</a><div class="body"><i></i></div></section>
  <section class="folder" data-fx-part="folder" data-demo-remove><a class="head" data-fx-part="head">Three panels (omitted)</a><div class="body"><i></i></div></section>
  <section class="folder" data-fx-part="folder"><a class="head" data-fx-part="head">Panel Four</a><div class="body"><i></i></div></section>
</div>
<template data-demo-late><div class="stack" data-fx="folder-stack-exit" style="--fx-top: 20px; --fx-overlap: 60px"><section class="folder" data-fx-part="folder"><a class="head" data-fx-part="head">Late-arriving group</a><div class="body"><i></i></div></section><section class="folder" data-fx-part="folder"><a class="head" data-fx-part="head">Two late groups</a><div class="body"><i></i></div></section></div></template>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
