<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>flow-pixel-distort — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; padding: 20px; }
  .ph { aspect-ratio: 4 / 3; }
  .mark { padding: 30px; background: var(--kf-contrast-bg); color: var(--kf-contrast-ink); }
  .mark svg { width: 100%; height: auto; }
</style>
</head>
<body>
<p class="demo-hint"><b>flow-pixel-distort</b> — Sweep the mouse quickly over the panel. The spot you passed splits open and then settles. <span style="color:var(--kf-dim)">(After 1s one more panel comes in, and one leaves 2.5s later)</span></p>
<section class="grid">
  <figure class="wf-img ph" data-label="Building night view · light reflected on water · landscape 4:3" data-fx="flow-pixel-distort"></figure>
  <figure class="wf-img ph" data-demo-remove data-label="Dropping panel" data-fx="flow-pixel-distort" data-fx-flow-pixel-distort="rgb: .4; block: 10"></figure>
  <figure class="wf-img ph" data-label="Portrait photo · cell-by-cell offset (look: cells)" data-fx="flow-pixel-distort" data-fx-flow-pixel-distort="grid: 34; look: cells; rgb: 0; pixel: 0; displace: .06"></figure>
  <template data-demo-late><figure class="wf-img ph" data-label="Late panel" data-fx="flow-pixel-distort"></figure></template>
  <div class="mark" data-fx="flow-pixel-distort"><svg data-fx-part="image" viewBox="0 0 600 120" fill="currentColor"><rect x="0" y="10" width="100" height="100" rx="50"/><text x="120" y="96" font-size="96" font-family="sans-serif" font-weight="700">Studio</text></svg></div>
  <div data-fx="flow-pixel-distort" style="height: 120px"></div>
</section>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../_vendor/ogl@1.0.11/ogl.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
