<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>nav-underline-follow — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.6 var(--kf-font-sans); }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { display: grid; gap: 40px; padding: 40px 20px; }
  .bar { display: flex; height: 100px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); }
  .bar ul { display: flex; }
  .bar a { display: flex; align-items: center; height: 100px; padding: 0 25px; font-weight: 700; }
</style>
</head>
<body>
<p class="demo-hint"><b>nav-underline-follow</b> — Hover over the menu. The underline follows, and when you leave the menu it returns to the current page (menu 2). <span style="color:var(--kf-dim)">(After 1s one more menu item comes in, and after 2.5s one drops out)</span></p>
<main class="demo">
  <nav class="bar" data-fx="nav-underline-follow"><ul><li><a href="#">Menu 1</a></li><li class="is-current"><a href="#">Menu 2 Long</a></li><li><a href="#">Menu 3</a></li><li><a href="#">Topics</a></li></ul></nav>
  <nav class="bar" data-fx="nav-underline-follow" data-fx-nav-underline-follow="dur: .5; inset: 10"><ul><li><a href="#">None currently 1</a></li><li><a href="#">None currently 2</a></li></ul></nav>
  <nav class="bar" data-fx="nav-underline-follow" data-demo-remove></nav>
</main>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => { const d = document.createElement("nav"); d.className = "bar"; d.dataset.fx = "nav-underline-follow"; d.innerHTML = '<ul><li class="is-current"><a href="#">Late-arrived Menu</a></li><li><a href="#">Second</a></li></ul>'; document.querySelector(".demo")?.append(d); }, 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); }, 2500);
</script>
</body>
</html>
