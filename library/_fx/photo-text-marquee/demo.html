<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>photo-text-marquee — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { padding: 48px 20px; }
  .demo-gap { height: 70vh; }
  .demo-big { margin: 0; font: 700 120px/1 var(--kf-font-display); letter-spacing: -0.05em; }
  .demo-wave { height: 70px; color: var(--kf-accent); }
</style>
</head>
<body>
<p class="demo-hint"><b>photo-text-marquee</b> — A sea gradient shows through only the shape of the big text line, and the line flows to the left. The photo (background) stays in place. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<section class="demo"><div data-fx="photo-text-marquee"><p class="demo-big" data-fx-part="text">Big line of words. Rental car</p></div><div data-fx="photo-text-marquee" data-demo-remove><p class="demo-big" data-fx-part="text"></p></div><template data-demo-late><div data-fx="photo-text-marquee" data-fx-photo-text-marquee="dur: 12"><p class="demo-big" data-fx-part="text">Late-added text line · </p></div></template></section>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
