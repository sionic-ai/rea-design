<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>stretch-ring-cursor — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { padding: 48px 20px; display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 24px; min-height: 80vh; }
  .demo a { display: block; }
  .demo .wf-img { aspect-ratio: 4 / 3; }
</style>
</head>
<body>
<div data-fx="stretch-ring-cursor">
<p class="demo-hint"><b>stretch-ring-cursor</b> — Move the mouse quickly over the photo. A ring grows and follows, stretching toward the direction of movement.</p>
<section class="demo">
  <a href="#" data-cursor-label="View More"><div class="wf-img" data-label="Leather close-up · side light · 4:3"></div></a>
  <a href="#" data-cursor-label="Go to Shop"><div class="wf-img" data-label="Hands working leather cut · 4:3"></div></a>
  <a href="#" data-cursor-label="Next page"><div class="wf-img" data-label="Hunter in the forest · 4:3"></div></a>
</section>
</div>
<script>
(() => {
  const t = document.createElement("template");
  t.innerHTML = '<div data-fx="stretch-ring-cursor" style="height:0"></div>';
  const empty = t.content.firstElementChild;
  setTimeout(() => document.body.append(empty), 1000);
  setTimeout(() => empty.remove(), 2500);
  document.querySelector(".demo-hint").append(" · One blank plate comes in after 1 second, then leaves after 2.5 seconds.");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
