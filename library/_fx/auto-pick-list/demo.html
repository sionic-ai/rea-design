<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>auto-pick-list — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { padding: 48px 20px; }
  .demo-spacer { height: 90vh; display: grid; place-items: center; color: var(--kf-dim); }

  .wrap { display: grid; grid-template-columns: 300px 1fr; gap: 24px; }
  [data-fx-part="row"] { display: block; width: 100%; padding: 14px; border: 0; border-bottom: 1px solid var(--kf-line); background: none; text-align: left; font: 500 13px/1.2 var(--kf-font-sans); }
  [data-fx-part="view"] { padding: 28px; min-height: 200px; border: 1px solid var(--kf-line); background: var(--kf-surface); font: 700 28px/1.2 var(--kf-font-display); }
</style>
</head>
<body>
<p class="demo-hint"><b>auto-pick-list</b> — The list advances by itself every eight beats (about 3.4s). You can also click a row. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<section class="demo"><div data-demo-remove class="wrap" data-fx="auto-pick-list"><div><button class="is-on" data-fx-part="row" type="button" data-name="Your category 1 here">Your category 1 here</button><button data-fx-part="row" type="button" data-name="Your category 2 here">Your category 2 here</button><button data-fx-part="row" type="button" data-name="Your category 3 here">Your category 3 here</button><button data-fx-part="row" type="button" data-name="Your category 4 here">Your category 4 here</button></div><div data-fx-part="view"><b data-fx-part="slot" data-key="name"></b><i data-fx-part="head"></i></div></div><div class="wrap" data-fx="auto-pick-list"><div><button class="is-on" data-fx-part="row" type="button" data-name="Your category 1 here">Your category 1 here</button><button data-fx-part="row" type="button" data-name="Your category 2 here">Your category 2 here</button><button data-fx-part="row" type="button" data-name="Your category 3 here">Your category 3 here</button><button data-fx-part="row" type="button" data-name="Your category 4 here">Your category 4 here</button></div><div data-fx-part="view"><b data-fx-part="slot" data-key="name"></b><i data-fx-part="head"></i></div></div><template data-demo-late><div class="wrap" data-fx="auto-pick-list"><div><button class="is-on" data-fx-part="row" type="button" data-name="Your category 1 here">Your category 1 here</button><button data-fx-part="row" type="button" data-name="Your category 2 here">Your category 2 here</button><button data-fx-part="row" type="button" data-name="Your category 3 here">Your category 3 here</button><button data-fx-part="row" type="button" data-name="Your category 4 here">Your category 4 here</button></div><div data-fx-part="view"><b data-fx-part="slot" data-key="name"></b><i data-fx-part="head"></i></div></div></template></section>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../../../_shared/vendor/gsap/CustomEase.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); window.ScrollTrigger?.refresh(); }, 2500);
</script>
</body>
</html>
