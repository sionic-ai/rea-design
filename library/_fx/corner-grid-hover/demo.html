<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>corner-grid-hover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .row { display: grid; grid-template-columns: repeat(3, 280px); gap: 24px; padding: 48px 24px; }
  .card { display: block; border: 1px solid var(--kf-line); }
  .card figure { aspect-ratio: 3 / 2; background: var(--kf-ink); }
  .card .wf-img { height: 100%; }
  .card h3 { padding: 16px; font-size: 16px; }
</style>
</head>
<body>
<p class="demo-hint"><b>corner-grid-hover</b> — Enter the card with the mouse from different corners. The grid flows in from the side you entered. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<div class="row" id="row">
  <a class="card" data-fx="corner-grid-hover" href="#a"><figure data-fx-part="figure"><div class="wf-img" data-label="Photo 3:2"></div></figure><h3>Your case name here</h3></a>
  <a class="card" data-demo-remove data-fx="corner-grid-hover" href="#b" style="--fx-cell: 20px"><figure data-fx-part="figure"><div class="wf-img" data-label="Large grid"></div></figure><h3>Cell 20px</h3></a>
</div>
<template data-demo-late><a class="card" data-fx="corner-grid-hover" href="#c"><figure data-fx-part="figure"><div class="wf-img" data-label="Late-arrived card"></div></figure><h3>Late-arrived card</h3></a></template>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => document.getElementById("row").append(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
