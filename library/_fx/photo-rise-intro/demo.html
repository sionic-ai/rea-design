<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>photo-rise-intro — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .kv { height: 70vh; margin: 20px; }
  .kv [data-fx-part="photo"] { height: 100%; background: var(--kf-contrast-bg); }
  .kv [data-fx-part="mark"] { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 16px; }
  .kv [data-fx-part="line"] { font-size: 13px; letter-spacing: 0.2em; }
  .kv [data-fx-part="logo"] { font: 400 56px/1 var(--kf-font-display); letter-spacing: 0.06em; }
</style>
</head>
<body>
<p class="demo-hint"><b>photo-rise-intro</b> — On open the logo rises and the text opens, then at 4.5s the photo fills up from below. The panel below is scale: .3 <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<section class="kv" data-demo-remove data-fx="photo-rise-intro"><div data-fx-part="photo"></div><div data-fx-part="mark"><p data-fx-part="line">Your one-line intro here</p><div data-fx-part="logo">LOGO</div></div></section>
<section class="kv" data-fx="photo-rise-intro"><div data-fx-part="photo"></div><div data-fx-part="mark"><p data-fx-part="line">Your one-line intro here</p><div data-fx-part="logo">LOGO</div></div></section>
<section class="kv" data-fx="photo-rise-intro" data-fx-photo-rise-intro="scale: 0.3"><div data-fx-part="photo"></div><div data-fx-part="mark"><div data-fx-part="logo">LOGO — Fast</div></div></section>
<template data-demo-late><section class="kv" data-fx="photo-rise-intro"><div data-fx-part="photo"></div><div data-fx-part="mark"><div data-fx-part="logo">Late-arriving panel</div></div></section></template>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
