<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>float-bounce — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .stage { height: 70vh; margin: 24px 20px; border: 1px solid var(--kf-line); }
  .stage [data-fx-part="ball"] { width: 200px; }
  .stage--small { height: 40vh; }
</style>
</head>
<body>
<p class="demo-hint"><b>float-bounce</b> Face panels float around bouncing without gravity. Watch them squash and splash droplets when they collide. <span style="color:var(--kf-dim)">(After 1s one more panel comes in, and one leaves 2.5s later)</span></p>
<div class="stage" data-fx="float-bounce">
  <span data-fx-part="ball"><span class="wf-img" data-label="Face 1 · Circle"></span></span>
  <span data-fx-part="ball" style="--fx-burst: var(--kf-ink)"><span class="wf-img" data-label="Face 2 · Circle"></span></span>
  <span data-fx-part="ball"><span class="wf-img" data-label="Face 3 · Circle"></span></span>
</div>
<div class="stage stage--small" data-demo-remove data-fx="float-bounce" data-fx-float-bounce="speed: 2; burst: false"><span data-fx-part="ball"><span class="wf-img" data-label="Panel to Be Removed"></span></span></div>
<div class="stage stage--small" data-fx="float-bounce"></div>
<template data-demo-late><div class="stage stage--small" data-fx="float-bounce" data-fx-float-bounce="speed: 2.4"><span data-fx-part="ball"><span class="wf-img" data-label="Late Panel · 2.4x"></span></span><span data-fx-part="ball"><span class="wf-img" data-label="Second"></span></span></div></template>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
