<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>char-converge-rise — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.6 var(--kf-font-sans); }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { display: grid; gap: 80vh; padding: 40px 20px 60vh; }
  .demo h2 { font: 700 72px/1 var(--kf-font-display); letter-spacing: .02em; }
</style>
</head>
<body>
<p class="demo-hint"><b>char-converge-rise</b> — On open the first heading, and on scrolling down the next heading, rise letter by letter and settle together in 1.2s. <span style="color:var(--kf-dim)">(One more title comes in after 1s, and one drops out after 2.5s)</span></p>
<main class="demo">
  <h2 data-fx="char-converge-rise">LIVE INFORMATION</h2>
  <h2 data-fx="char-converge-rise" data-fx-char-converge-rise="y: 100; mask: 0">ARTISTS</h2>
  <h2 data-fx="char-converge-rise" data-demo-remove>Soon-Removed Title</h2>
  <h2 data-fx="char-converge-rise"></h2>
</main>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => { const d = document.createElement("h2"); d.dataset.fx = "char-converge-rise"; d.textContent = "Venues"; document.querySelector(".demo")?.append(d); }, 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); }, 2500);
</script>
</body>
</html>
