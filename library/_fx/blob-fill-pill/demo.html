<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>blob-fill-pill — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: sticky; top: 0; z-index: 100; margin: 0; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { padding: 48px 20px; display: flex; flex-wrap: wrap; gap: 24px; align-items: center; }
  .btn { display: inline-flex; align-items: center; gap: 16px; height: 56px; padding-left: 24px; border-radius: var(--kf-radius-pill); background: var(--kf-surface); border: 1px solid var(--kf-line); color: var(--kf-ink); transition: color .3s; }
  .btn.is-blob-hover { color: var(--kf-on-accent); }
  .btn .dot { width: 56px; height: 56px; display: grid; place-items: center; color: var(--kf-on-accent); }
  .round { width: 56px; height: 56px; display: grid; place-items: center; color: var(--kf-on-accent); }
</style>
</head>
<body>
<p class="demo-hint"><b>blob-fill-pill</b> — Hover over the button. The droplet on the right rounds out and then fills the button. A rounded button turns fully round.</p>
<section class="demo">
  <a class="btn" href="#" data-fx="blob-fill-pill"><span>Request a free consultation</span><span class="dot" data-fx-part="dot">→</span></a>
  <button class="round" type="button" data-fx="blob-fill-pill" data-fx-blob-fill-pill="look: circle"><span>←</span></button>
  <button class="round" type="button" data-fx="blob-fill-pill" data-fx-blob-fill-pill="look: circle" style="--fx-blob-shape: 35% 65% 68% 32% / 58% 33% 67% 42%"><span>→</span></button>
</section>
<script>
// Late arrivals and removals — checks that fx-core attaches to a button added after 1s and detaches from a button removed after 2.5s
(() => {
  const src = document.querySelector(".btn");
  const html = src.outerHTML;
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => src.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1 second one more button comes in (a late arrival), and after 2.5 seconds one is removed (detach).");
})();
</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
