<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>logo-clip-loader — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-surface); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: relative; z-index: 1001; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .logo { position: relative; font: 700 48px/1 var(--kf-font-display); }
  .words { position: relative; height: 1.4em; width: 10em; display: flex; justify-content: center; overflow: hidden; }
  main { padding: 48px 20px; }
</style>
</head>
<body>
<p class="demo-hint"><b>logo-clip-loader</b> On open the logo opens, two words appear alternately, then the curtain lifts upward (refresh to watch again).</p>
<div data-fx="logo-clip-loader"><div data-fx-part="bg"><div data-fx-part="box"><span class="logo" data-fx-part="logo">Logo</span><div class="words"><span data-fx-part="word">Just a moment</span><span data-fx-part="word">Hello</span></div></div><i data-fx-part="bar"></i></div></div>
<div data-fx="logo-clip-loader" data-demo-remove><div data-fx-part="bg"></div></div>
<template data-demo-late><div data-fx="logo-clip-loader" data-fx-logo-clip-loader="dur: 1"><div data-fx-part="bg"><i data-fx-part="bar"></i></div></div></template>
<main>Hero Behind the Curtain</main>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/SplitText.min.js"></script>
<script src="../../../_shared/vendor/gsap/CustomEase.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
