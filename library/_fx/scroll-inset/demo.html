<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>scroll-inset — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: fixed; top: 0; left: 0; right: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .hero { height: 100dvh; }
  .hero .wf-img { height: 100%; }
  .rest { display: grid; gap: 24px; padding: 80px 20px 120vh; }
</style>
</head>
<body>
<p class="demo-hint"><b>scroll-inset</b> Scroll down. During the first 400px the photo closes in 40px from all sides (20px on phones).</p>
<section class="hero" data-fx="scroll-inset" data-fx-scroll-inset="to: 40px; to-narrow: 20px; end: 400">
  <div class="wf-img" data-label="Hero photo · two people laughing by a window · backlit · wide landscape"></div>
</section>
<div class="rest"><p>Your next section text line here.</p></div>
<script>
// Late arrivals and removals — checks that fx-core attaches to an element added after 1s and detaches from an element removed after 2.5s
(() => {
  const host = document.querySelector(".hero"), html = host.outerHTML;
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; el.style.height = "50vh"; return el; };
  const rest = document.querySelector(".rest");
  const gone = make("gone");
  rest.prepend(gone);
  setTimeout(() => rest.prepend(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical panel comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
