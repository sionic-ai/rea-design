<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cutout-card-hover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); padding: 24px; }
  .demo-hint { margin-bottom: 16px; font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-row { display: flex; gap: 50px; max-width: 1000px; }
  .demo-row > a { flex: 1; }
  [data-fx-part="frame"] { padding-top: 110%; margin-bottom: 15px; }
  [data-fx-part="photo"] { position: absolute; inset: 0; background: color-mix(in oklab, var(--kf-ink) 55%, var(--kf-accent)); }
  [data-fx-part="cutout"] { width: 150px; height: 150px; }
  [data-fx-part="head"] { font: 700 26px/1.6 var(--kf-font-display); }
</style>
</head>
<body>
<p class="demo-hint"><b>cutout-card-hover</b> — Hover over a card. The photo draws closer and a white silhouette steps aside, partly covering the line behind the title.</p>
<div class="demo-row">
  <a href="#" data-fx="cutout-card-hover">
    <figure data-fx-part="frame"><span data-fx-part="photo"></span>
      <svg data-fx-part="cutout" viewBox="0 0 150 150" aria-hidden="true"><path d="M22 150c2-40 10-70 26-88-8-7-10-18-4-26 4-6 12-7 17-3 8-6 22-8 32-4 6-6 16-4 18 4 5 6 4 15-2 21 6 6 10 12 12 18l12 4-2 6-10 2c4 18 6 40 6 66z"/></svg>
    </figure>
    <h3 data-fx-part="head"><span data-fx-part="title">First branch title</span><span data-fx-part="line"></span></h3>
  </a>
  <a href="#" data-fx="cutout-card-hover">
    <figure data-fx-part="frame"><span data-fx-part="photo"></span>
      <svg data-fx-part="cutout" viewBox="0 0 150 150" aria-hidden="true"><path d="M30 150c4-38 14-60 26-72-6-18-4-38 4-54l10 16c6-4 14-4 20 0l10-18c6 16 6 32 0 44 12 6 20 14 18 22-12 4-22 4-28 2 10 20 18 38 22 60z"/></svg>
    </figure>
    <h3 data-fx-part="head"><span data-fx-part="title">Second branch title</span><span data-fx-part="line"></span></h3>
  </a>
</div>
<script>
// Late arrivals and removals — checks that fx-core attaches to an element added after 1s and detaches from an element removed after 2.5s
(() => {
  const src = document.querySelector('[data-fx~="cutout-card-hover"]');
  if (!src) return;
  const html = src.outerHTML.replace(/\sid="[^"]*"/g, "");
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => src.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical one comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="../fx-core.js"></script>
</body>
</html>
