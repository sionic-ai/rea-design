<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lens-grid-wall — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .wall { height: 80vh; }
  .wall [data-fx-part="copy"] { padding: 80px 20px 0; text-align: center; }
  .wall h2 { font: var(--kf-weight-display) 48px/1.05 var(--kf-font-display); }
  .picked { padding: 12px 20px; font: 500 13px/1.4 var(--kf-font-mono); }
</style>
</head>
<body>
<p class="demo-hint"><b>lens-grid-wall</b> — Drag the wall. Hovering a cell brightens it, and pressing it stamps its number below.</p>
<section class="wall" data-fx="lens-grid-wall">
  <div data-fx-part="copy"><h2>Lens grid wall</h2><p>Your one-line intro here</p></div>
  <div data-fx-part="item" data-title="Card 01"></div><div data-fx-part="item" data-title="Card 02"></div><div data-fx-part="item" data-title="Card 03"></div><div data-fx-part="item" data-title="Card 04"></div>
  <div data-fx-part="item" data-title="Card 05"></div><div data-fx-part="item" data-title="Card 06"></div><div data-fx-part="item" data-title="Card 07"></div><div data-fx-part="item" data-title="Card 08"></div>
</section>
<p class="picked">Pressed cell: <output>None</output></p>
<script>
(() => {
  const src = document.querySelector('[data-fx~="lens-grid-wall"]');
  if (!src) return;
  const out = document.querySelector(".picked output");
  addEventListener("fx:pick", (e) => { out.textContent = e.detail.index; });
  const html = src.outerHTML;
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => src.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical one comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="three-global.js"></script>
<script src="../../_vendor/three@0.182.0/build/three.cjs"></script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
