<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>wave-drift — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { position: relative; height: 60vh; margin: 24px 20px; border: 1px solid var(--kf-line); }
  .demo > [data-fx] { position: absolute; }
  .band { padding: 40px 20px; background: var(--kf-contrast-bg); color: var(--kf-contrast-ink); }
  .btn { position: relative; display: inline-block; padding: 4px 0 14px; color: var(--kf-accent); font-weight: 600; }
  .btn [data-fx] { position: absolute; left: 0; right: 0; bottom: 0; }
</style>
</head>
<body>
<p class="demo-hint"><b>wave-drift</b> — Hold still. A small wavy line drifts slowly sideways inside the cell. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<section class="demo">
  <span data-fx="wave-drift" style="top: 10%; left: 8%; width: 7rem" data-demo-remove></span>
  <span data-fx="wave-drift" style="top: 30%; left: 60%; width: 14rem; --fx-delay: -20s"></span>
  <span data-fx="wave-drift" style="top: 70%; left: 30%; width: 3.5rem; --fx-dur: 20s"></span>
  <template data-demo-late><span data-fx="wave-drift" style="top: 50%; left: 15%; width: 7rem"></span></template>
</section>
<section class="band"><a class="btn" href="#">See more<span data-fx="wave-drift" style="color: var(--kf-contrast-ink)"></span></a></section>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
