<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>card-rise-toggle — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo-spacer { height: 90vh; display: grid; place-items: center; color: var(--kf-dim); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; padding: 0 8vw; margin: 0 0 30vh; list-style: none; }
  .grid li { padding: 16px; border: 1px solid var(--kf-line); border-radius: var(--kf-radius-md); background: var(--kf-surface); }
  .grid .wf-img { aspect-ratio: 300 / 147; margin-bottom: 10px; }
</style>
</head>
<body>
<p class="demo-hint"><b>card-rise-toggle</b> — Scroll so the card group comes in and the cards rise one after another. When it leaves they sink back, and they rise again on re-entry.</p>
<div class="demo-spacer">Scroll down ↓</div>
<ul class="grid" data-fx="card-rise-toggle">
  <li data-fx-part="item"><div class="wf-img" data-label="Event Photo · Landscape"></div>Event name 1 here</li>
  <li data-fx-part="item"><div class="wf-img" data-label="Event Photo · Landscape"></div>Event name 2 here</li>
  <li data-fx-part="item"><div class="wf-img" data-label="Event Photo · Landscape"></div>Event name 3 here</li>
  <li data-fx-part="item"><div class="wf-img" data-label="Event Photo · Landscape"></div>Event name 4 here</li>
</ul>
<div class="demo-spacer"></div>
<script>
// Late arrivals and removals — checks that fx-core attaches to an element added after 1s and detaches from an element removed after 2.5s
(() => {
  const src = document.querySelector('[data-fx~="card-rise-toggle"]');
  const html = src.outerHTML;
  const make = () => { const t = document.createElement("template"); t.innerHTML = html; return t.content.firstElementChild; };
  const gone = make();
  src.after(gone);
  setTimeout(() => document.body.lastElementChild.before(make()), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical group comes in (a late arrival), and after 2.5s one is removed (detach).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
