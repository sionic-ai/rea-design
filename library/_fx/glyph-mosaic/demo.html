<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>glyph-mosaic — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .stage { height: 70vh; margin: 20px; background: var(--kf-contrast-bg); color: var(--kf-contrast-ink); }
  .stage.is-small { height: 36vh; }
</style>
</head>
<body>
<p class="demo-hint"><b>glyph-mosaic</b> — On open, small letters gather into one large letter over 3s. Move the mouse over the panel and only nearby letters swell. <span style="color:var(--kf-dim)">(After 1s one more panel comes in, and one leaves 2.5s later)</span></p>
<section class="stage" data-fx="glyph-mosaic" data-fx-glyph-mosaic="mirror: 1"><p data-fx-part="shape">Words</p></section>
<section class="stage is-small" data-fx="glyph-mosaic" data-fx-glyph-mosaic="cell: new; step: 14; size: 16; top: 20" data-demo-remove><p data-fx-part="shape">Sun</p></section>
<section class="stage is-small" data-fx="glyph-mosaic"><p data-fx-part="shape"></p></section>
<template data-demo-late><section class="stage is-small" data-fx="glyph-mosaic" data-fx-glyph-mosaic="cell: ·; step: 12; size: 18" style="--fx-glyph: var(--kf-accent)"><p data-fx-part="shape">Fortune</p></section></template>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
