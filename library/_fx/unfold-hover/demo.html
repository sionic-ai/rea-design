<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>unfold-hover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-raised); color: var(--kf-ink); font: 600 13px/1 var(--kf-font-sans); }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .rail { display: flex; flex-direction: column; justify-content: flex-end; gap: 2px; width: 80px; height: 70vh; margin: 24px; padding: 16px; border-radius: 8px; background: var(--kf-bg); }
  .rail svg { width: 12px; height: 12px; flex: none; }
</style>
</head>
<body>
<p class="demo-hint"><b>unfold-hover</b> — Hover over the icon buttons in the left column. They expand to the full text width and fold back when released. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<div class="rail">
  <div data-fx="unfold-hover" data-demo-remove><a href="#"><svg viewBox="0 0 12 12"><circle cx="6" cy="6" r="5" fill="currentColor"/></svg><span data-fx-part="label">0000-00-0000</span></a></div>
  <div data-fx="unfold-hover"><a href="#"><svg viewBox="0 0 12 12"><rect x="1" y="1" width="10" height="10" fill="currentColor"/></svg><span data-fx-part="label">Directions</span></a></div>
  <template data-demo-late><div data-fx="unfold-hover" data-fx-unfold-hover="open: 0.4"><a href="#"><svg viewBox="0 0 12 12"><path d="M1 11 11 1" stroke="currentColor" stroke-width="2"/></svg><span data-fx-part="label">Booking · Contact</span></a></div></template>
  <div data-fx="unfold-hover"><a href="#"><svg viewBox="0 0 12 12"><path d="M6 1 11 11H1Z" fill="currentColor"/></svg></a></div>
</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
