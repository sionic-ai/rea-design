<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cube-spin-tip — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-spacer { height: 70vh; display: grid; place-items: center; color: var(--kf-dim); }
  .f { display: grid; place-items: center; background: var(--kf-surface); border: 1px solid var(--kf-line); font: 600 24px var(--kf-font-display); }
</style>
</head>
<body>
<p class="demo-hint"><b>cube-spin-tip</b> — Scroll down. The box grows and spins once, then tips forward so its bottom face covers the screen. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<div class="demo-spacer">Downward</div>
<section data-fx="cube-spin-tip"><div class="f" data-fx-part="face" data-caption="First side description">Side 1</div><div class="f" data-fx-part="face" data-caption="Second side description">Side 2</div><div class="f" data-fx-part="face" data-caption="Third panel description">Side 3</div><div class="f" data-fx-part="face" data-caption="Fourth panel description">Side 4</div><div data-fx-part="floor"></div><p data-fx-part="caption"></p></section>
<div class="demo-spacer">Between</div>
<template data-demo-late><section data-fx="cube-spin-tip" data-fx-cube-spin-tip="span: 1500; fill: 3"><div class="f" data-fx-part="face">Late 1</div><div class="f" data-fx-part="face">Late 2</div></section></template>
<section data-demo-remove data-fx="cube-spin-tip"></section>
<div class="demo-spacer">Footer</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../../../_shared/vendor/gsap/TextPlugin.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); window.ScrollTrigger?.refresh(); }, 2500);
</script>
</body>
</html>
