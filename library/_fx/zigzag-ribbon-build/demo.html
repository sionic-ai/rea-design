<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>zigzag-ribbon-build — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); overflow-x: hidden; }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .zig { position: relative; width: min(900px, 90vw); aspect-ratio: 128 / 75; margin: 80px auto; rotate: -20deg; }
  .zig > div { position: absolute; }
  [data-fx-part="bar"] { width: 15%; height: 78%; background: var(--kf-accent); }
  [data-fx-part="diag"] { width: 13.333%; height: 70.667%; clip-path: polygon(0 0, 100% 41%, 100% 100%, 0 59%); background: color-mix(in oklab, var(--kf-accent) 60%, var(--kf-bg)); }
</style>
</head>
<body>
<p class="demo-hint"><b>zigzag-ribbon-build</b> — Refresh the page. From .8s, bands form starting from the leftmost cell. <span style="color:var(--kf-dim)">(1 second later one more band attaches, and it drops off after 2.5 seconds)</span></p>
<div class="zig" data-fx="zigzag-ribbon-build">
  <div data-fx-part="bar" style="left: 0; top: 22%"></div>
  <div data-fx-part="diag" style="left: 15%; top: 22%"></div>
  <div data-fx-part="bar" style="left: 28.333%; top: 14.667%"></div>
  <div data-fx-part="diag" style="left: 43.333%; top: 14.667%"></div>
  <div data-fx-part="bar" style="left: 56.667%; top: 7.333%"></div>
  <div data-fx-part="diag" style="left: 71.667%; top: 7.333%"></div>
  <div data-fx-part="bar" style="left: 85%; top: 0"></div>
</div>
<div id="late"></div>
<template data-demo-late><div class="zig" data-fx="zigzag-ribbon-build" data-fx-zigzag-ribbon-build="start: 0; each: .2; dur: .3" data-demo-remove><div data-fx-part="bar" style="left: 0; top: 22%"></div><div data-fx-part="diag" style="left: 15%; top: 22%"></div></div></template>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/CustomEase.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
gsap.registerPlugin(CustomEase);
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => document.getElementById("late").append(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
