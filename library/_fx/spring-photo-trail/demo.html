<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>spring-photo-trail — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 14px/1.4 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 24px; padding: 32px 20px; }
  .demo .wf-img { height: 100%; border: 0; border-radius: 12px; }
  .demo { grid-template-columns: 1fr; }
</style>
</head>
<body>
<p class="demo-hint"><b>spring-photo-trail</b> — Move the mouse over the dark panel and a photo springs on every 163px, then disappears after 1 second. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<div class="demo">
<section  data-fx="spring-photo-trail"  style="height:360px;border-radius:24px;background:var(--kf-contrast-bg);color:var(--kf-contrast-ink);display:grid;place-items:center"><div data-fx-part="photo" class="wf-img" data-label="Work screen 1"></div><div data-fx-part="photo" class="wf-img" data-label="Work screen 2"></div><div data-fx-part="photo" class="wf-img" data-label="Work screen 3"></div><div data-fx-part="photo" class="wf-img" data-label="Work screen 4"></div><div data-fx-part="photo" class="wf-img" data-label="Work screen 5"></div><p>Move your mouse over this panel</p></section>
<section data-demo-remove data-fx="spring-photo-trail" data-fx-spring-photo-trail="gap: 80; stay: .5" style="height:360px;border-radius:24px;background:var(--kf-contrast-bg);color:var(--kf-contrast-ink);display:grid;place-items:center"><div data-fx-part="photo" class="wf-img" data-label="Work screen 1"></div><div data-fx-part="photo" class="wf-img" data-label="Work screen 2"></div><div data-fx-part="photo" class="wf-img" data-label="Work screen 3"></div><div data-fx-part="photo" class="wf-img" data-label="Work screen 4"></div><div data-fx-part="photo" class="wf-img" data-label="Work screen 5"></div><p>gap 80 · stay .5</p></section>
<template data-demo-late><section  data-fx="spring-photo-trail" style="--fx-w: 120px; --fx-h: 120px" style="height:360px;border-radius:24px;background:var(--kf-contrast-bg);color:var(--kf-contrast-ink);display:grid;place-items:center"><div data-fx-part="photo" class="wf-img" data-label="Work screen 1"></div><div data-fx-part="photo" class="wf-img" data-label="Work screen 2"></div><div data-fx-part="photo" class="wf-img" data-label="Work screen 3"></div><div data-fx-part="photo" class="wf-img" data-label="Work screen 4"></div><div data-fx-part="photo" class="wf-img" data-label="Work screen 5"></div><p>Late · Square 120</p></section></template>
<section data-fx="spring-photo-trail" style="height:200px;border:1px dashed var(--kf-line);display:grid;place-items:center"><p>No photo (quiet)</p></section>
</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
