<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>stalker-dot-hover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { margin: 0; padding: 12px 20px; border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-nav { display: flex; gap: 32px; justify-content: flex-end; padding: 24px 40px; font-weight: 500; }
  .demo-stage { height: 60vh; display: grid; place-items: center; background: var(--kf-raised); }
  .demo-moon { width: 320px; height: 320px; border-radius: 50%; background: var(--kf-dim); }
  .demo-foot { display: flex; gap: 32px; padding: 40px; background: var(--kf-contrast-bg); color: var(--kf-contrast-ink); --fx-dot: var(--kf-contrast-bg); }
</style>
</head>
<body>
<p class="demo-hint"><b>stalker-dot-hover</b> — Hover over the top or bottom menu text. The dot inside the center circle glides to that text. <span style="color:var(--kf-dim)">(After 1s one more circle comes in, and one leaves 2.5s later)</span></p>
<nav class="demo-nav"><a href="#" class="t">Menu 1</a><a href="#" class="t">Menu 2</a><a href="#" class="t">Menu 3</a></nav>
<div class="demo-stage">
  <div class="demo-moon" data-fx="stalker-dot-hover" data-fx-stalker-dot-hover="targets: .t"><span data-fx-part="dot"></span></div>
</div>
<div class="demo-stage" data-demo-remove><div class="demo-moon" data-fx="stalker-dot-hover"><span data-fx-part="dot"></span></div></div>
<footer class="demo-foot"><a href="#" class="t">Footer menu 1</a><a href="#" class="t">Footer menu 2</a></footer>
<template data-demo-late><div class="demo-stage"><div class="demo-moon" data-fx="stalker-dot-hover" data-fx-stalker-dot-hover="targets: .t; dur: .2" style="--fx-size: 20px"><span data-fx-part="dot"></span></div></div></template>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
