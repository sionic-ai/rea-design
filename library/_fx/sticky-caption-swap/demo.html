<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sticky-caption-swap — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-item { display: block; width: 60%; margin: 120px auto 220px; }
  .demo-item .wf-img { aspect-ratio: 4 / 3; border: 0; background-color: color-mix(in oklab, var(--kf-ink) 70%, var(--kf-bg)); }
  .demo-item:nth-child(odd) { transform: rotate(-4deg); }
  .demo-item:nth-child(even) { transform: rotate(3deg); width: 45%; }
</style>
</head>
<body>
<p class="demo-hint"><b>sticky-caption-swap</b> — Scroll down. The caption line in the center of the screen changes to the name of the photo currently in view.</p>
<section data-fx="sticky-caption-swap">
  <div data-fx-part="caption"><h4 data-key="title"></h4><p data-key="tags"></p><time data-key="year"></time><a data-fx-part="link" href="#">View</a></div>
  <article class="demo-item" data-fx-part="item" data-title="<b>Work 1</b> First photo" data-tags="Services one, two" data-year="2024" data-href="#1"><div class="wf-img" data-label="Photo 1"></div></article>
  <article class="demo-item" data-fx-part="item" data-title="<b>Work 2</b> Second photo" data-tags="Service Three" data-year="2023" data-href="#2"><div class="wf-img" data-label="Photo 2"></div></article>
  <article class="demo-item" data-fx-part="item" data-title="<b>Work 3</b> Third photo" data-tags="Services four, five" data-year="2022" data-href="#3"><div class="wf-img" data-label="Photo 3"></div></article>
</section>
<section class="demo-small" data-fx="sticky-caption-swap" data-fx-sticky-caption-swap="ratio: .2; look: plain">
  <div data-fx-part="caption"><h4 data-key="title"></h4></div>
  <article class="demo-item" data-fx-part="item" data-title="Fill-in-the-blank test 1"><div class="wf-img" data-label="Photo a"></div></article>
  <article class="demo-item" data-fx-part="item" data-title="Fill-in-the-blank test 2"><div class="wf-img" data-label="Photo b"></div></article>
</section>
<script>
// Late arrivals and removals — checks that fx-core attaches to an element added after 1s and detaches from an element removed after 2.5s
(() => {
  const src = document.querySelector(".demo-small");
  if (!src) return;
  const html = src.outerHTML;
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => gone.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s, one more sheet comes in (the late one), and after 2.5s one drops out (the removal).");
})();
</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
