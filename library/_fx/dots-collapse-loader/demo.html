<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dots-collapse-loader — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { padding: 80px 20px; }
  .demo h1 { font: 700 56px/1.2 var(--kf-font-display); }
  .demo button { margin-top: 24px; padding: 10px 16px; border: 1px solid var(--kf-line); background: var(--kf-surface); cursor: pointer; }
</style>
</head>
<body>
<div class="loader" data-fx="dots-collapse-loader"><div data-fx-part="veil"></div><p data-fx-part="text">Loading<span data-fx-part="dots"></span></p></div>
<p class="demo-hint"><b>dots-collapse-loader</b> — Try reloading. Dots increase, then the text disappears and the curtain folds up from the bottom. Replay it with the button.</p>
<section class="demo"><h1>Your first phrase here</h1><button type="button" id="again">Spin again</button></section>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
  document.addEventListener("fx:done", () => document.querySelector(".demo h1").animate([{ opacity: 0, translate: "0 20px" }, { opacity: 1, translate: "0 0" }], { duration: 1200, easing: "cubic-bezier(.7,-0.01,.31,.85)" }));
  document.getElementById("again").addEventListener("click", () => {
    const old = document.querySelector(".loader"), copy = old.cloneNode(true);
    old.remove();
    copy.className = "loader";
    copy.querySelector('[data-fx-part="dots"]').textContent = "";
    setTimeout(() => document.body.prepend(copy), 50);
  });
</script>
</body>
</html>
