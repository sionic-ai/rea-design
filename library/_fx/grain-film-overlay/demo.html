<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>grain-film-overlay — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: fixed; top: 0; left: 0; right: 0; z-index: 10; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-band { min-height: 70vh; display: grid; place-items: center; font: 600 32px/1.2 var(--kf-font-display); }
  .demo-band.is-dark { background: var(--kf-contrast-bg); color: var(--kf-contrast-ink); }
  .demo-box { position: relative; height: 40vh; margin: 20px; background: var(--kf-surface); }
</style>
</head>
<body>
<p class="demo-hint"><b>grain-film-overlay</b> — Grain sizzles across the whole screen. Move between light and dark sections.</p>
<div data-fx="grain-film-overlay" aria-hidden="true"></div>
<section class="demo-band">Light section</section>
<section class="demo-band is-dark">Dark Section</section>
<div class="demo-box"><div data-fx="grain-film-overlay" data-fx-grain-film-overlay="look: local; fps: 10" data-demo-remove></div><template data-demo-late><div data-fx="grain-film-overlay" data-fx-grain-film-overlay="look: local; density: 0; frames: 1"></div></template></div>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
