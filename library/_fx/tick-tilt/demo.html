<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tick-tilt — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .tt { display: flex; flex-wrap: wrap; gap: 48px; align-items: center; justify-content: center; padding: 60px 20px; }
  .tt .card { width: 200px; padding: 20px; border-radius: var(--kf-radius-md); background: var(--kf-surface); border: 1px solid var(--kf-line); }
  .tt .card .wf-img { aspect-ratio: 16 / 9; border-radius: var(--kf-radius-sm); }
  .tt svg { width: 90px; height: auto; color: var(--kf-ink); }
  .tt .btn { display: inline-block; padding: 14px 28px; border-radius: 26px 22px 24px 20px / 22px 26px 20px 24px; background: var(--kf-accent); color: var(--kf-on-accent); font-weight: 600; }
</style>
</head>
<body>
<p class="demo-hint"><b>tick-tilt</b> — The images and cards snap-shake between two poses. Hover over the button. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<div class="tt">
  <svg data-fx="tick-tilt" viewBox="0 0 60 80" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="30" cy="14" r="9"/><path d="M30 23v26M30 32l-14 8M30 32l14-10M30 49l-10 22M30 49l10 22"/></svg>
  <div class="card" data-fx="tick-tilt" style="--fx-delay: .5s"><div class="wf-img" data-label="Event flyer · landscape 16:9"></div><p>Your event name here</p></div>
  <svg data-demo-remove data-fx="tick-tilt" viewBox="0 0 60 80" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="30" cy="14" r="9"/><path d="M30 23v26M30 32l-14-10M30 32l14-10M30 49l-12 22M30 49l12 22"/></svg>
  <p data-fx="tick-tilt" data-fx-tick-tilt="look: nudge" style="color: var(--kf-accent); font-size: 20px">Your handwritten note here</p>
  <a class="btn" href="#" data-fx="tick-tilt" data-fx-tick-tilt="look: hover" style="--fx-angle: 1deg">Your button here</a>
  <a class="btn" href="#" data-fx="tick-tilt" data-fx-tick-tilt="look: lift" style="--fx-angle: 17deg; --fx-dur: 3s">Sticker — sits straight when placed</a>
</div>
<template data-demo-late><div class="tt"><div class="card" data-fx="tick-tilt" style="--fx-angle: 3deg"><div class="wf-img" data-label="Late-arriving card"></div></div></div></template>
<script src="../fx-core.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
