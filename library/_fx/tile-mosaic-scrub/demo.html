<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tile-mosaic-scrub — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .stage { position: relative; height: 300lvh; }
  .stage .back { position: sticky; top: 0; height: 100lvh; }
  .stage .back .wf-img { height: 100%; border: 0; }
  .stage [data-fx-part="canvas"] { position: absolute; inset: 0; height: 100lvh; }
  .stage .stick { position: sticky; top: 0; height: 100lvh; margin-top: -100lvh; }
  .pad { height: 60vh; display: grid; place-items: center; color: var(--kf-dim); }
</style>
</head>
<body>
<p class="demo-hint"><b>tile-mosaic-scrub</b> — Scroll down. From about halfway, cell borders are drawn and the cells fill with the background color. <span style="color:var(--kf-dim)">(After 1s one more panel comes in, and one leaves 2.5s later)</span></p>
<section class="stage" data-fx="tile-mosaic-scrub"><div class="back"><div class="wf-img" data-label="Hero video slot"></div></div><div class="stick"><div data-fx-part="canvas"></div></div></section>
<section class="stage" data-demo-remove data-fx="tile-mosaic-scrub" data-fx-tile-mosaic-scrub="cols: 4"></section>
<template data-demo-late><section class="stage" data-fx="tile-mosaic-scrub" data-fx-tile-mosaic-scrub="cols: 6; from: 0; seed: 3"><div class="back"><div class="wf-img" data-label="Late-arriving panel"></div></div><div class="stick"><div data-fx-part="canvas"></div></div></section></template>
<div class="pad">Footer</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
