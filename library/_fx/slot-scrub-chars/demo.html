<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>slot-scrub-chars — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.6 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-spacer { height: 90vh; display: grid; place-items: center; color: var(--kf-dim); }
  h2 { margin: 0 auto 60px; max-width: 900px; padding: 0 20px; font: 600 64px/1 var(--kf-font-display); text-transform: uppercase; word-break: keep-all; }
</style>
</head>
<body>
<p class="demo-hint"><b>slot-scrub-chars</b> — Scroll down and the letters roll in two slots, like a slot machine. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<div class="demo-spacer">Scroll down</div>
<h2 data-fx="slot-scrub-chars">Heading Words</h2>
<h2 data-fx="slot-scrub-chars" data-demo-remove>Omitted title</h2>
<h2 data-fx="slot-scrub-chars" data-fx-slot-scrub-chars="on: view">Heading that rolls in once</h2>
<div class="demo-card" style="max-width:900px;margin:0 auto 60px;padding:24px;border:1px solid var(--kf-line);font:600 20px/1 var(--kf-font-display)">Every time the mouse hovers over this panel → <span data-fx="slot-scrub-chars" data-fx-slot-scrub-chars="on: hover; within: .demo-card">MORE DETAILS</span></div>
<template data-demo-late><h2 data-fx="slot-scrub-chars">Late-arriving title</h2></template>
<h2 data-fx="slot-scrub-chars"></h2>
<div class="demo-spacer">Footer</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
gsap.registerPlugin(ScrollTrigger);
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
