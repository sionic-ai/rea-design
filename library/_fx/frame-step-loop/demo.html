<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>frame-step-loop — Stop-motion frame loop</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { padding: 40px; font-family: var(--kf-font-sans); color: var(--kf-ink); background: var(--kf-bg); }
  .stage { display: flex; gap: 32px; flex-wrap: wrap; }
  .loop { width: 240px; aspect-ratio: 1; border-radius: 50%; background: var(--kf-raised); }
  .loop svg { width: 100%; height: 100%; }
  .loop circle { fill: var(--kf-accent); }
</style>
</head>
<body>
<p>Watch closely — the dot moves one cell every 0.5s with no in-between values (1s later a second panel is added, and 2s later the first panel drops out).</p>
<div class="stage" id="stage">
  <div class="loop" id="first" data-fx="frame-step-loop" data-fx-frame-step-loop="fps: 2"></div>
</div>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
  const fill = (el, n) => {
    for (let k = 0; k < n; k++) {
      const a = (k / n) * Math.PI * 2;
      el.insertAdjacentHTML("beforeend", `<svg data-fx-part="frame" viewBox="0 0 100 100"><circle cx="${50 + Math.cos(a) * 34}" cy="${50 + Math.sin(a) * 34}" r="10"/></svg>`);
    }
  };
  fill(document.getElementById("first"), 9);
  setTimeout(() => {
    const el = document.createElement("div");
    el.className = "loop";
    el.setAttribute("data-fx", "frame-step-loop");
    el.setAttribute("data-fx-frame-step-loop", "fps: 4");
    fill(el, 6);
    document.getElementById("stage").append(el);
  }, 1000);
  setTimeout(() => document.getElementById("first").remove(), 2000);
</script>
</body>
</html>
