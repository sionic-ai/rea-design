<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>logo-fold-header — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.6 var(--kf-font-sans); }
  .head { position: fixed; top: 0; left: 0; right: 0; z-index: 5; display: flex; align-items: center; gap: 20px; height: 90px; padding: 0 32px; background: var(--kf-bg); border-bottom: 1px solid var(--kf-line); }
  .logo { display: flex; align-items: flex-end; gap: 10px; width: 301px; height: 46px; }
  .mark { position: relative; flex: none; width: 66px; height: 46px; }
  .mark i { position: absolute; display: block; width: 30px; height: 15px; background: var(--kf-accent); }
  .mark i[data-fx-part="top"] { left: 18px; top: 0; border-radius: 0 0 15px 15px; }
  .mark i[data-fx-part="bottom"] { bottom: 0; border-radius: 15px 15px 0 0; background: var(--kf-ink); }
  .mark i[data-fx-part="bottom"] + i { left: 34px; }
  .txt { display: flex; flex-direction: column; }
  .txt [data-fx-part="tag"] { font-size: 10px; }
  .txt [data-fx-part="word"] { font: 500 25px/1 var(--kf-font-display); }
  .demo-hint { padding: 130px 32px 20px; font: 500 13px/1.4 var(--kf-font-mono); }
  .block { height: 70vh; margin: 20px 32px; background: var(--kf-surface); border: 1px solid var(--kf-line); }
</style>
</head>
<body>
<header class="head">
  <a href="#" class="logo" data-fx="logo-fold-header">
    <span class="mark" data-fx-part="mark"><i data-fx-part="top"></i><i data-fx-part="bottom"></i><i data-fx-part="bottom"></i></span>
    <span class="txt"><span data-fx-part="tag">Your one-line slogan here</span><span data-fx-part="word">Studio Name</span></span>
  </a>
  <span id="late"></span>
</header>
<p class="demo-hint"><b>logo-fold-header</b> — Scroll down past 400px. The logo pieces fold, the text slides out to the left and the logo shrinks. <span style="color:var(--kf-dim)">(After 1s a logo that stands folded comes in, and after 2.5s it leaves)</span></p>
<div class="block"></div><div class="block"></div><div class="block"></div>
<a href="#" class="logo" data-fx="logo-fold-header"></a>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
let late;
setTimeout(() => {
  late = document.createElement("a");
  late.href = "#"; late.className = "logo"; late.dataset.fx = "logo-fold-header"; late.dataset.fxLogoFoldHeader = "folded: true";
  late.innerHTML = '<span class="mark" data-fx-part="mark"><i data-fx-part="top"></i><i data-fx-part="bottom"></i><i data-fx-part="bottom"></i></span><span class="txt"><span data-fx-part="tag">Late-arriving logo</span><span data-fx-part="word">Late Name</span></span>';
  document.getElementById("late")?.append(late);
}, 1000);
setTimeout(() => late?.remove(), 2500);
</script>
</body>
</html>
