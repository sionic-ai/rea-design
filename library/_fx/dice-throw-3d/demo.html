<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dice-throw-3d — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .dt { display: flex; gap: 40px; justify-content: center; align-items: center; padding: 80px 20px; }
  .dt [data-fx] { width: 220px; aspect-ratio: 1; background: var(--kf-surface); }
  .out { text-align: center; font: 400 13px var(--kf-font-mono); color: var(--kf-dim); }
</style>
</head>
<body>
<p class="demo-hint"><b>dice-throw-3d</b> — Click or drag the die to throw it. When it stops, it announces the face number and returns to its cell. <span style="color:var(--kf-dim)">(After 1s one more cell comes in, and one leaves 2.5s later)</span></p>
<div class="dt">
  <div data-fx="dice-throw-3d" aria-label="Throw the dice"></div>
  <div data-fx="dice-throw-3d" data-demo-remove style="--fx-dice-a: var(--kf-accent-soft)"></div>
</div>
<p class="out">Side number: <span id="face">—</span></p>
<template data-demo-late><div class="dt"><div data-fx="dice-throw-3d" data-fx-dice-throw-3d="size: 120" style="--fx-dice-a: var(--kf-raised); --fx-dice-b: var(--kf-surface)"></div></div></template>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="three-global.js"></script>
<script src="../../_vendor/three@0.170.0/build/three.cjs"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
document.addEventListener("fx:land", (e) => (document.getElementById("face").textContent = e.detail.face));
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
