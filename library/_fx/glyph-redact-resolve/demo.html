<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>glyph-redact-resolve — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { margin: 0; background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint button { margin-left: 10px; padding: 4px 10px; border: 1px solid var(--kf-line); border-radius: var(--kf-radius-pill); background: none; cursor: pointer; }
  .row { display: flex; gap: 40px; align-items: baseline; padding: 60px 40px; }
  .name { font: 700 28px/1 var(--kf-font-display); letter-spacing: .14em; }
  .partner { font: 400 22px/1 var(--kf-font-display); color: var(--kf-accent); }
</style>
</head>
<body>
<p class="demo-hint"><b>glyph-redact-resolve</b> — Hover over the hidden name and a few letters blink. <button type="button" data-demo-resolve>Unfold & Cover</button> <button type="button" data-demo-swap>Rename pair</button> (After 1s one more comes in, and after 2.5s one drops out)</p>
<div class="row">
  <span class="name" data-fx="glyph-redact-resolve" data-fx-glyph-redact-resolve="word: LOGOTYPEHERE" data-demo-main>XXXXXXXXXXXX</span>
  <span class="partner" data-fx="glyph-redact-resolve" data-demo-partner>Pair name</span>
  <span class="name" data-fx="glyph-redact-resolve" data-fx-glyph-redact-resolve="word: GONE; on: load" data-demo-remove>XXXX</span>
</div>
<div class="row" data-demo-late-host></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
const main = document.querySelector("[data-demo-main]"), partner = document.querySelector("[data-demo-partner]");
document.querySelector("[data-demo-resolve]").addEventListener("click", () => main.classList.toggle("is-resolved"));
let k = 0;
document.querySelector("[data-demo-swap]").addEventListener("click", () => partner.dispatchEvent(new CustomEvent("fx:swap", { detail: { text: `Pair ${++k} Name` } })));
setTimeout(() => {
  const s = document.createElement("span");
  s.className = "name"; s.dataset.fx = "glyph-redact-resolve";
  s.setAttribute("data-fx-glyph-redact-resolve", "word: LATE NAME; on: load");
  s.textContent = "XXXXXXXXX";
  document.querySelector("[data-demo-late-host]").append(s);
}, 1000);
setTimeout(() => document.querySelector("[data-demo-remove]")?.remove(), 2500);
</script>
</body>
</html>
