<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>wordmark-scroll-shrink — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; min-height: 300vh; }
  .demo-hint { position: fixed; bottom: 0; left: 0; right: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-top: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .head { position: fixed; top: 0; left: 0; right: 0; padding: 13px 20px 11px; background: var(--kf-bg); border-bottom: 1px solid var(--kf-line); }
  .head svg { width: 100%; height: auto; }
  .head text { fill: var(--kf-ink); font-family: var(--kf-font-display); font-size: 240px; }
  .later { position: fixed; top: 60%; left: 20px; right: 20px; padding: 8px; border: 1px dashed var(--kf-line); }
  .later svg { width: 60%; height: auto; }
  .later text { fill: var(--kf-dim); font-family: var(--kf-font-display); font-size: 240px; }
</style>
</head>
<body>
<header class="head" data-fx="wordmark-scroll-shrink"><svg data-fx-part="mark" viewBox="0 0 1600 181" preserveAspectRatio="xMinYMid" aria-label="Brand Studio"><text x="0" y="177">Brand Studio</text></svg></header>
<p class="demo-hint"><b>wordmark-scroll-shrink</b> — Scroll down. The header name shrinks to 36px while it descends by the header height (above 768px width).</p>
<script>
(() => {
  const src = document.querySelector('[data-fx~="wordmark-scroll-shrink"]');
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = src.outerHTML; const el = t.content.firstElementChild; el.className = "later"; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  document.body.append(gone);
  setTimeout(() => document.body.append(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical one comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
