<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>border-melt-scrub — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: relative; z-index: 10; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-spacer { height: 70vh; display: grid; place-items: center; color: var(--kf-dim); }
  .demo-sec { position: relative; }
  .demo-photo { background: linear-gradient(135deg, var(--kf-accent), var(--kf-accent-soft) 60%, var(--kf-ink)); }
  .demo-copy { position: relative; z-index: 2; margin-top: -40vh; padding: 0 8vw 60vh; color: var(--kf-contrast-ink); font: 400 32px/1.4 var(--kf-font-display); }
</style>
</head>
<body>
<p class="demo-hint"><b>border-melt-scrub</b> — Scroll down. The border of the frame-like photo panel melts and spreads to fill the screen as the photo blurs. <span style="color:var(--kf-dim)">(After 1s one more panel comes in, and one leaves 2.5s later)</span></p>
<div class="demo-spacer">↓</div>
<section class="demo-sec"><div data-fx="border-melt-scrub"><div class="demo-photo" data-fx-part="photo"></div></div><p class="demo-copy">Your plan text slides up over the panel here.</p></section>
<section class="demo-sec" data-demo-remove><div data-fx="border-melt-scrub" data-fx-border-melt-scrub="border: 60; radius: 24px"><div class="demo-photo" data-fx-part="photo"></div></div><p class="demo-copy">Panel that unfolds from a rounded corner</p></section>
<section class="demo-sec"><div data-fx="border-melt-scrub"></div></section>
<template data-demo-late><section class="demo-sec"><div data-fx="border-melt-scrub"><div class="demo-photo" data-fx-part="photo"></div></div><p class="demo-copy">Late-arriving panel</p></section></template>
<div class="demo-spacer">Footer</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
