<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>under-slide-hover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; min-height: 100vh; }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-row { display: flex; gap: 8px; padding: 40px 20px; flex-wrap: wrap; font-weight: 600; }
  .demo-dark { --fx-usl-bg: var(--kf-ink); --fx-usl-ink: var(--kf-bg); --fx-usl-bg2: var(--kf-accent); --fx-usl-ink2: var(--kf-on-accent); }
</style>
</head>
<body>
<p class="demo-hint"><b>under-slide-hover</b> — Hover over the button. A white panel rises from below while its corners round into a pill.</p>
<nav class="demo-row" data-demo-row>
  <a href="#" data-fx="under-slide-hover">Menu 1</a>
  <a href="#" data-fx="under-slide-hover">Second menu</a>
  <a href="#" class="demo-dark" data-fx="under-slide-hover">The button that changed color</a>
</nav>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
const row = document.querySelector("[data-demo-row]");
// After 1s add one button, then add an empty button and remove the first to see the detach
setTimeout(() => {
  const a = document.createElement("a");
  a.href = "#";
  a.dataset.fx = "under-slide-hover";
  a.textContent = "Late-arrived Button";
  const empty = document.createElement("a");
  empty.dataset.fx = "under-slide-hover";
  row.append(a, empty);
  setTimeout(() => { row.firstElementChild.remove(); empty.remove(); }, 1500);
}, 1000);
</script>
</body>
</html>
