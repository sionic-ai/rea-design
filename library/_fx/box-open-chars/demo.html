<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>box-open-chars — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { margin: 0; padding: 12px 20px; border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .stage { position: relative; height: 520px; max-width: 900px; margin: 30px auto; }
  .stage p { position: absolute; margin: 0; padding: 12px 18px; font-size: 44px; line-height: 1.25; font-weight: 600; }
  .v { writing-mode: vertical-rl; }
  .or { color: var(--kf-accent); }
</style>
</head>
<body>
<p class="demo-hint"><b>box-open-chars</b> — On load, white cells open in turn and the letters are written one by one. Cells that opened out of the way return to place when it finishes.</p>
<div class="stage" id="stage">
  <p class="v" style="left:4%;top:10px" data-fx="box-open-chars" data-fx-box-open-chars="group: mv; x: 36"><span class="or">Company</span>Topic marker</p>
  <p style="left:18%;top:220px" data-fx="box-open-chars" data-fx-box-open-chars="group: mv"><span class="or">#Play</span></p>
  <p class="v" style="left:52%;top:200px" data-fx="box-open-chars" data-fx-box-open-chars="group: mv; x: -36">Object marker <span class="or">With care</span></p>
  <p style="left:62%;top:400px" data-fx="box-open-chars" data-fx-box-open-chars="group: mv; x: -72">Doing <span class="or">Company</span></p>
  <p class="gone" style="left:70%;top:20px" data-fx="box-open-chars">Being removed soon</p>
</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../../../_shared/vendor/gsap/SplitText.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
  // Check that late-arriving boxes get hooked and missing boxes get released
  setTimeout(() => {
    const p = document.createElement("p");
    p.style.cssText = "left:30%;top:20px";
    p.dataset.fx = "box-open-chars";
    p.textContent = "Late cell";
    document.getElementById("stage").append(p);
  }, 1000);
  setTimeout(() => document.querySelector(".gone")?.remove(), 2500);
</script>
</body>
</html>
