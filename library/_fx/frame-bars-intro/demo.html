<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>frame-bars-intro — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: fixed; left: 0; right: 0; bottom: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-top: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .stage { height: 100vh; background: var(--kf-contrast-bg); }
  .stage [data-fx-part="frame"] { position: absolute; inset: 20px 100px; }
  .stage [data-fx-part="veil"] { background: var(--kf-accent); display: grid; place-items: center; color: var(--kf-on-accent); font-size: 20px; }
  .small { height: 50vh; margin-top: 40px; }
  .small [data-fx-part="frame"] { inset: 10px 40px; }
  .after { padding: 60px 20px; color: var(--kf-dim); }
  html:not(.fx-intro-done) .after { opacity: 0; }
  .after { transition: opacity .8s; }
</style>
</head>
<body>
<p class="demo-hint"><b>frame-bars-intro</b> — On refresh the curtain lifts after 2.3s and white bands on four sides tighten the panel into a Frame. The panel below uses hold: 1 to go faster.</p>
<section class="stage" data-fx="frame-bars-intro"><div data-fx-part="frame"></div><div data-fx-part="veil">Your first scene image here</div></section>
<section class="stage small" data-demo-remove data-fx="frame-bars-intro" data-fx-frame-bars-intro="hold: 1; dur: .5"><div data-fx-part="frame"></div><div data-fx-part="veil">Short act</div></section>
<p class="after">Content shown once the intro finishes (html.fx-intro-done)</p>
<template data-demo-late><section class="stage small" data-fx="frame-bars-intro"><div data-fx-part="frame"></div></section></template>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
