<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>drag-front-free — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .board { height: 80vh; margin: 20px; border: 1px dashed var(--kf-line); }
  .chip { padding: 10px 12px 8px; background: var(--kf-surface); border: 1px solid var(--kf-ink); font: 700 18px/1 var(--kf-font-sans); text-transform: uppercase; color: var(--kf-ink); }
</style>
</head>
<body>
<p class="demo-hint"><b>drag-front-free</b> — Drag the tags anywhere. The one you grab comes to the front.</p>
<div class="board" data-fx="drag-front-free">
  <a class="chip" data-fx-part="item" href="#">Link One</a>
  <a class="chip" data-fx-part="item" href="#">Link Two</a>
  <button type="button" class="chip" data-fx-part="item">Share This</button>
  <span class="chip" data-fx-part="item" data-demo-remove>Remove Me</span>
</div>
<div class="board" data-fx="drag-front-free"></div>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => {
  const late = document.createElement("div");
  late.className = "board";
  late.setAttribute("data-fx", "drag-front-free");
  late.innerHTML = '<span class="chip" data-fx-part="item">Late One</span><span class="chip" data-fx-part="item">Late Two</span>';
  document.body.append(late);
}, 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
