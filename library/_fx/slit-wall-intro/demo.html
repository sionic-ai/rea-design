<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>slit-wall-intro — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .hero { position: relative; height: 80vh; overflow: hidden; background: var(--kf-contrast-bg); }
  .hero .wf-img { position: absolute; inset: 0; height: 100%; border-radius: 0; }
  .hero h2 { position: absolute; left: 24px; bottom: 24px; margin: 0; font: 400 64px/.9 var(--kf-font-display); color: var(--kf-contrast-ink); }
  .demo-spacer { height: 60vh; display: grid; place-items: center; color: var(--kf-dim); }
</style>
</head>
<body>
<p class="demo-hint"><b>slit-wall-intro</b> — When opened, the white wall splits open in the middle and moves outward (refresh to see it again).</p>
<section class="hero">
  <div class="wf-img" data-label="Small jet flying over the sea · daytime · landscape video from above"></div>
  <h2>Your Hero title here</h2>
  <div data-fx="slit-wall-intro" data-fx-slit-wall-intro="lock: off"><p data-fx-part="lead">Your guide line here</p></div>
</section>
<div class="demo-spacer">There’s more below</div>
<script>addEventListener("fx:done", () => document.querySelector(".demo-hint").append(" — fx:done"));</script>
<script>
(() => {
  const src = document.querySelector('[data-fx~="slit-wall-intro"]');
  if (!src) return;
  const html = src.outerHTML.replace(/\sid="[^"]*"/g, "");
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const box = document.createElement("section");
  box.className = "hero";
  document.querySelector(".demo-spacer").after(box);
  const gone = make("gone");
  box.append(gone);
  setTimeout(() => box.append(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1 second one more of the same enters the lower panel, and after 2.5 seconds one is removed (detach).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/CustomEase.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
