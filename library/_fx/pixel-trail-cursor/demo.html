<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pixel-trail-cursor — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); min-height: 100vh; padding: 24px; }
  .demo-hint { font: 500 13px/1.4 var(--kf-font-mono); }
  .dark { margin-top: 30vh; height: 40vh; background: var(--kf-contrast-bg); color: var(--kf-contrast-ink); display: grid; place-items: center; }
</style>
</head>
<body>
<p class="demo-hint"><b>pixel-trail-cursor</b> — Move and press the mouse — square dots remain in the cells you pass, shrink and fade out, and pressing scatters the dots. (After 1 second one more panel comes in, and after 2.5 seconds the first panel leaves)</p>
<div data-demo-remove data-fx="pixel-trail-cursor" data-fx-pixel-trail-cursor="cell: 12; burst: 0"></div>
<template data-demo-late><div data-fx="pixel-trail-cursor"></div></template>
<div class="dark">Even on a dark panel</div>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
