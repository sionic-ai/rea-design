<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>offset-frame-hover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.6 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .grid { display: flex; flex-wrap: wrap; gap: 90px 100px; max-width: 1100px; margin: 60px auto 140px; padding: 0 20px; }
  .card { display: flex; flex-direction: column; align-items: flex-start; width: 384px; max-width: calc(100% - 40px); color: inherit; text-decoration: none; }
  .card [data-fx-part="pic"] { width: 100%; aspect-ratio: 16 / 9; }
  .card [data-fx-part="pic"] .wf-img { height: 100%; border: 0.5px solid var(--kf-line); }
  .card p { position: relative; z-index: 1; margin: 0; padding: 7px; border: 0.5px solid var(--kf-line); background: var(--kf-surface); }
  @media (max-width: 600px) { .card { --fx-shift: 20px; } }
</style>
</head>
<body>
<p class="demo-hint"><b>offset-frame-hover</b> — Hover over the card. The offset frame behind the photo is filled black. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<div class="grid" id="grid">
  <a class="card" href="#" data-fx="offset-frame-hover"><div data-fx-part="pic"><div class="wf-img" data-label="Event poster · Landscape 16:9"></div></div><p>Your one-line event title here</p></a>
  <a class="card" href="#" data-fx="offset-frame-hover" style="--fx-shift: 24px; --fx-dur: .2s"><div data-fx-part="pic"><div class="wf-img" data-label="Offset 24px · .2s"></div></div><p>Your one-line event title here</p></a>
  <a class="card" href="#" data-fx="offset-frame-hover" data-demo-remove><div data-fx-part="pic"><div class="wf-img" data-label="Card to drop"></div></div><p>Card to drop</p></a>
  <a class="card" href="#" data-fx="offset-frame-hover"><p>Card with no photo slot — nothing catches</p></a>
</div>
<template data-demo-late><a class="card" href="#" data-fx="offset-frame-hover"><div data-fx-part="pic"><div class="wf-img" data-label="Late-arriving card"></div></div><p>Late-arriving card</p></a></template>
<script src="../fx-core.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => document.getElementById("grid").append(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
