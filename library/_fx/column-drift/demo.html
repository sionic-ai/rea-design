<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>column-drift — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .pad { height: 80vh; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px 22px; padding: 120px 22px; }
  @media (max-width: 1279px) { .grid { grid-template-columns: repeat(3, 1fr); } }
  @media (max-width: 767px) { .grid { grid-template-columns: 1fr; } }
  .grid .wf-img { aspect-ratio: 348 / 259; }
</style>
</head>
<body>
<p class="demo-hint"><b>column-drift</b> — Scroll down — each column flows up and down at its own speed and cells switch on and off. <span style="color:var(--kf-dim)">(After 1s one more cell comes in, and one leaves 2.5s later)</span></p>
<div class="pad"></div>
<div class="grid" data-fx="column-drift">
  <a data-fx-part="card"><div class="wf-img" data-label="Running shoe close-up · gray road · landscape"></div><b>One case</b></a>
  <a data-fx-part="card"><div class="wf-img" data-label="Snowy mountain ridge · midday · landscape"></div><b>Work Two</b></a>
  <a data-fx-part="card" data-demo-remove><div class="wf-img" data-label="Golden field · Sunset · Horizontal"></div><b>Cell to Be Removed</b></a>
  <a data-fx-part="card"><div class="wf-img" data-label="Cyclist group · dawn · landscape"></div><b>Work Four</b></a>
  <a data-fx-part="card"><div class="wf-img" data-label="Track finish line · night lighting · landscape"></div><b>Case five</b></a>
  <a data-fx-part="card"><div class="wf-img" data-label="Beach run · Morning · Landscape"></div><b>Case six</b></a>
  <a data-fx-part="card"><div class="wf-img" data-label="Gym interior · fluorescent light · landscape"></div><b>Case seven</b></a>
  <a data-fx-part="card"><div class="wf-img" data-label="Forest trail mountain running · fog · landscape"></div><b>Case eight</b></a>
</div>
<div class="grid" data-fx="column-drift" data-fx-column-drift="drift4: -100,100,-100,100; fade: off"><template data-demo-late><a data-fx-part="card"><div class="wf-img" data-label="Late cell · interior · landscape"></div></a></template></div>
<div class="pad"></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => { const g = t.parentElement; if (!g) return; g.append(t.content.cloneNode(true)); g.setAttribute("data-fx", ""); g.setAttribute("data-fx", "column-drift"); }), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); ScrollTrigger.refresh(); }, 2500);
</script>
</body>
</html>
