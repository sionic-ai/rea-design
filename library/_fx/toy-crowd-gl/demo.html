<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>toy-crowd-gl — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { padding: 24px 20px; display: grid; gap: 20px; }
  .stage { height: 62vh; border: 1px solid var(--kf-line); border-radius: var(--kf-radius-md); }
  .stage.small { height: 30vh; }
  .demo button { justify-self: start; padding: 8px 14px; border: 1px solid var(--kf-line); border-radius: var(--kf-radius-sm); background: var(--kf-surface); }
</style>
</head>
<body>
<p class="demo-hint"><b>toy-crowd-gl</b> — A crowd walks while the camera moves in and out on a 16s cycle. Use the buttons to switch between the play view (fx:play) and the hero view (fx:title). <span style="color:var(--kf-dim)">(1 second later a small panel comes in, and it leaves after 2.5 seconds)</span></p>
<section class="demo">
  <div class="stage" id="main" data-fx="toy-crowd-gl"></div>
  <button type="button" id="play">fx:play / fx:title</button>
  <div data-demo-remove class="stage small" data-fx="toy-crowd-gl" data-fx-toy-crowd-gl="count: 12; giant: off"></div>
  <template data-demo-late><div class="stage small" data-fx="toy-crowd-gl" data-fx-toy-crowd-gl="count: 20; coins: off; cycle: 8"></div></template>
</section>
<script src="three-global.js"></script>
<script src="../../_vendor/three@0.170.0/build/three.cjs"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
let on = false;
document.getElementById("play").addEventListener("click", () => { on = !on; document.getElementById("main").dispatchEvent(new CustomEvent(on ? "fx:play" : "fx:title")); });
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
