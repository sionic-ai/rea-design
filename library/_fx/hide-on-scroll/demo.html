<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hide-on-scroll — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { padding: 48px 20px; }
  .demo-spacer { height: 90vh; display: grid; place-items: center; color: var(--kf-dim); }
  .hb { position: fixed; top: 60px; z-index: 50; padding: 14px 24px; border: 0; border-radius: 0 0 0 24px; background: var(--kf-accent); color: var(--kf-surface); font: 700 14px/1 var(--kf-font-display); }
  .tall { height: 300vh; padding: 120px 20px; color: var(--kf-dim); }
</style>
</head>
<body>
<p class="demo-hint"><b>hide-on-scroll</b> — Scroll down and the top-right button hides, scroll up and it returns. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<button class="hb" style="right:0" data-demo-remove data-fx="hide-on-scroll">MENU</button><button class="hb" style="right:120px" data-fx="hide-on-scroll" data-fx-hide-on-scroll="delay: 0">MENU 2</button><template data-demo-late><button class="hb" style="right:250px" data-fx="hide-on-scroll">Late</button></template><div class="tall">Scroll down and the button disappears, scroll up a little and it returns after .3s.</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); window.ScrollTrigger?.refresh(); }, 2500);
</script>
</body>
</html>
