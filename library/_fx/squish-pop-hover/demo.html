<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>squish-pop-hover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 32px; padding: 60px 20px; }
  .tab { display: grid; place-items: center; width: 180px; height: 90px; border-radius: var(--kf-radius-md); background: var(--kf-accent); color: var(--kf-on-accent); text-decoration: none; font: 700 18px/1 var(--kf-font-display); }
  .flowers { display: flex; gap: 16px; padding: 20px; border: 1px dashed var(--kf-line); }
  .flowers i { display: block; width: 48px; height: 48px; border-radius: 50%; background: var(--kf-accent-soft); border: 6px solid var(--kf-accent); }
</style>
</head>
<body>
<p class="demo-hint"><b>squish-pop-hover</b> — Hover over the menu cells and the flower bundle. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<section class="demo">
  <a class="tab" href="#" data-fx="squish-pop-hover">Menu 1</a>
  <a class="tab" href="#" data-demo-remove data-fx="squish-pop-hover">Cell to Be Removed</a>
  <a class="tab" href="#" data-fx="squish-pop-hover" data-fx-squish-pop-hover="sy: .9">Signboard Type (.9)</a>
  <a class="flowers" href="#" data-fx="squish-pop-hover" data-fx-squish-pop-hover="target: flower; sx: .7; sy: .7; to: 1.1; rotate: 10; alt: 1" style="--fx-origin: 50% 50%"><i data-fx-part="flower"></i><i data-fx-part="flower"></i><i data-fx-part="flower"></i></a>
  <template data-demo-late><a class="tab" href="#" data-fx="squish-pop-hover">Enters late</a></template>
</section>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/CustomEase.min.js"></script>
<script>gsap.registerPlugin(CustomEase);</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
