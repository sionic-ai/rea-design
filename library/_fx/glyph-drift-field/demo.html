<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>glyph-drift-field — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { padding: 24px 20px 120vh; display: grid; gap: 16px; }
  .stage { height: 60vh; border: 1px solid var(--kf-line); background: var(--kf-raised); }
</style>
</head>
<body>
<p class="demo-hint"><b>glyph-drift-field</b> — Clusters of text flow and flicker over a tilted plate. Scrolling speeds them up and slows them down, and the first plate disappears after 5.5 seconds.</p>
<div class="demo">
  <div class="stage" data-fx="glyph-drift-field"></div>
  <div class="stage" data-fx="glyph-drift-field" data-fx-glyph-drift-field="glyphs: 01; hold: off; angle: 0"></div>
</div>
<script>
// Late arrivals and removals — checks that fx-core attaches to an element added after 1s and detaches from an element removed after 2.5s
(() => {
  const src = document.querySelector('[data-fx~="glyph-drift-field"]');
  if (!src) return;
  const make = (tag) => { const el = document.createElement("div"); el.className = "stage"; el.dataset.fx = "glyph-drift-field"; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => src.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical panel comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../_vendor/pixi.js@6.5.9/pixi.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
