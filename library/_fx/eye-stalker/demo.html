<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>eye-stalker — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 1; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .stage { min-height: 70vh; display: grid; place-items: center; gap: 20px; }
  .stage a { padding: 14px 28px; border: 2px solid var(--kf-ink); border-radius: 999px; }
  footer { padding: 60px; background: var(--kf-contrast-bg); color: var(--kf-contrast-ink); }
</style>
</head>
<body>
<p class="demo-hint"><b>eye-stalker</b> — Move the mouse. The eyeballs follow late and over a button one eye becomes an arrow. They hide over the footer below. <span style="color:var(--kf-dim)">(After 1s one more button comes in, and after 2.5s the first button leaves)</span></p>
<div class="stage" id="stage"><a href="#" data-demo-remove>Button hover</a></div>
<footer>Footer</footer>
<div data-fx="eye-stalker" data-fx-eye-stalker="hide: footer" aria-hidden="true"><div data-fx-part="eyes"><span data-fx-part="eye"></span><span data-fx-part="eye"></span></div></div>
<template data-demo-late><a href="#">Late-arrived Button</a></template>
<div data-fx="eye-stalker" style="display:none"></div>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => document.getElementById("stage").append(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
