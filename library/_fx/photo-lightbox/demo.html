<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>photo-lightbox — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; margin: 20px; }
  .grid .wf-img { aspect-ratio: 3 / 2; }
  .grid .wf-img.is-tall { aspect-ratio: 3 / 4; }
</style>
</head>
<body>
<p class="demo-hint"><b>photo-lightbox</b> — Click the photo. Flip with its left or right half or with ←·→, and close with the backdrop or Esc.</p>
<div class="grid" data-fx="photo-lightbox">
  <div class="wf-img" data-fx-part="item" data-label="Exterior · clear daytime · landscape 3:2"></div>
  <div class="wf-img is-tall" data-fx-part="item" data-label="Ceiling timber structure · daytime · portrait 3:4"></div>
  <div class="wf-img" data-fx-part="item" data-label="Bookshelf interior · indoor lighting · landscape 3:2"></div>
  <div class="wf-img" data-fx-part="item" data-label="Yard · afternoon · landscape 3:2"></div>
</div>
<script>
(() => {
  const src = document.querySelector('[data-fx~="photo-lightbox"]');
  if (!src) return;
  const html = src.outerHTML;
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => src.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical one comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
