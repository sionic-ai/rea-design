<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>spring-appear — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .gap { height: 90vh; }
  .log { width: min(100% - 40px, 520px); margin: 0 auto 80px; display: grid; gap: 14px; }
  .msg { justify-self: start; max-width: 340px; padding: 14px 18px; border-radius: 20px; background: var(--kf-surface); box-shadow: var(--kf-shadow-soft); }
  .msg.is-me { justify-self: end; background: var(--kf-accent-soft); }
  .cards { display: flex; gap: 8px; }
  .cards .wf-img { width: 140px; aspect-ratio: 3 / 4; border-radius: 14px; }
</style>
</head>
<body>
<p class="demo-hint"><b>spring-appear</b> — Scroll down. Speech bubbles rise one by one on a spring. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<div class="gap"></div>
<div class="log" data-demo-log>
  <p class="msg" data-fx="spring-appear" data-fx-spring-appear="delay: .2">Your helper greeting in two lines here</p>
  <p class="msg is-me" data-fx="spring-appear" data-fx-spring-appear="delay: .4">Your user reply here</p>
  <p class="msg" data-fx="spring-appear" data-fx-spring-appear="delay: .5">Your three lines of follow-up advice here</p>
  <p class="msg is-me" data-demo-remove data-fx="spring-appear" data-fx-spring-appear="delay: .7">Removable speech bubble</p>
  <div class="cards">
    <div class="wf-img" data-fx="spring-appear" data-fx-spring-appear="delay: .8" data-label="Recommended 1"></div>
    <div class="wf-img" data-fx="spring-appear" data-fx-spring-appear="delay: .85" data-label="Recommended 2"></div>
    <div class="wf-img" data-fx="spring-appear" data-fx-spring-appear="delay: .9; k: 167; c: 40; m: 1.7" data-label="Heavy spring"></div>
  </div>
</div>
<div class="gap"></div>
<template data-demo-late><p class="msg" data-fx="spring-appear" data-fx-spring-appear="y: 20; amount: 0">Late speech bubble · 20px · threshold 0</p></template>
<div class="gap"></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => { const log = document.querySelector("[data-demo-log]"); log.append(t.content.cloneNode(true)); t.remove(); }), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
