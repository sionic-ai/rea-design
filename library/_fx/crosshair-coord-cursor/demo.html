<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>crosshair-coord-cursor — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); min-height: 100vh; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { display: flex; flex-wrap: wrap; gap: 16px; padding: 15vh 5vw; align-items: center; }
  .btn, .tool { padding: 14px 22px; border-radius: 999px; background: var(--kf-ink); color: var(--kf-bg); border: 0; }
  .tool { width: 40px; height: 40px; padding: 0; background: transparent; color: var(--kf-ink); box-shadow: inset 0 0 0 1px var(--kf-line); }
  .art { width: 320px; height: 200px; background: var(--kf-raised); display: grid; place-items: center; }
</style>
</head>
<body data-fx="crosshair-coord-cursor">
<p class="demo-hint"><b>crosshair-coord-cursor</b> — Move the mouse. Over links·buttons the dot turns into a circle, and buttons are pulled toward the cursor.</p>
<section class="demo">
  <a href="#">Same-site link</a>
  <a href="https://example.com" target="_blank" rel="noopener">External Link</a>
  <a href="mailto:hello@example.com">Mail</a>
  <button class="btn" type="button">Magnetic button</button>
  <button class="tool" type="button" aria-label="Tool">◐</button>
  <div class="art" data-cursor="drag ↔">data-cursor image</div>
</section>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
