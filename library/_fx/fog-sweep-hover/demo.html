<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fog-sweep-hover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 16px/1.7 var(--kf-font-sans); padding: 80px 5vw; }
  .demo-hint { position: fixed; top: 0; left: 0; right: 0; z-index: 20; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 32px; }
  .card { display: block; }
  .photo { aspect-ratio: 520 / 345; background: linear-gradient(135deg, color-mix(in oklab, var(--kf-accent) 70%, var(--kf-ink)), color-mix(in oklab, var(--kf-accent) 25%, var(--kf-bg))); overflow: hidden; }
  .card h3 { margin-top: 12px; font-size: 18px; }
</style>
</head>
<body>
<p class="demo-hint"><b>fog-sweep-hover</b> — Hover over the photo. A mist in the background color sweeps past diagonally. <span style="color:var(--kf-dim)">(One more card comes in after 1s, and one drops out after 2.5s)</span></p>
<div class="grid">
  <a class="card" data-fx="fog-sweep-hover"><div class="photo" data-fx-part="media"></div><h3>One card</h3></a>
  <a class="card" data-fx="fog-sweep-hover" data-fx-fog-sweep-hover="dur: 1"><div class="photo" data-fx-part="media"></div><h3>Short (1s)</h3></a>
  <a class="card" data-fx="fog-sweep-hover"><div class="photo" data-fx-part="media"></div><h3>Card three</h3></a>
</div>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
  setTimeout(() => {
    const a = document.createElement("a");
    a.className = "card"; a.setAttribute("data-fx", "fog-sweep-hover");
    a.innerHTML = '<div class="photo" data-fx-part="media"></div><h3>Late-arriving card</h3>';
    document.querySelector(".grid").append(a);
  }, 1000);
  setTimeout(() => document.querySelectorAll(".card")[2]?.remove(), 2500);
</script>
</body>
</html>
