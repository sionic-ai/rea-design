<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>slant-wipe-hover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .band { display: grid; place-items: center; height: 320px; margin: 40px 0; background: var(--kf-contrast-bg); color: var(--kf-contrast-ink); text-decoration: none; }
  .band [data-fx-part="on"] { background: var(--kf-accent); }
  .band h2 { position: relative; font: 300 34px/1 var(--kf-font-display); letter-spacing: 0.2em; }
</style>
</head>
<body>
<p class="demo-hint"><b>slant-wipe-hover</b> — Hover over the strip, then leave — the lit panel fills in diagonally and then lifts away upward. <span style="color:var(--kf-dim)">(After 1s one more band comes in, and one leaves 2.5s later)</span></p>
<a class="band" href="#stay" data-fx="slant-wipe-hover"><span data-fx-part="on"></span><h2>“stay”</h2></a>
<a class="band" href="#spa" data-fx="slant-wipe-hover" data-fx-slant-wipe-hover="slant: 80; dur: .3" data-demo-remove><span data-fx-part="on"></span><h2>Dropping band</h2></a>
<span data-late-slot></span>
<a class="band" href="#none" data-fx="slant-wipe-hover"><h2>Strips with no lit panel stay as they are</h2></a>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelector("[data-late-slot]").outerHTML = '<a class="band" href="#late" data-fx="slant-wipe-hover"><span data-fx-part="on"></span><h2>Late band</h2></a>', 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
