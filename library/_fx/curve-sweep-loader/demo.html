<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>curve-sweep-loader — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .logo { color: var(--kf-accent); font-size: 28px; font-weight: 700; letter-spacing: 0.1em; }
  .copy { writing-mode: vertical-rl; color: var(--kf-accent); font-size: 36px; letter-spacing: 0.2em; }
  .rider { width: 70px; height: 40px; border-radius: 50% 60% 40% 50%; background: var(--kf-accent); }
  main { padding: 40px 20px; }
  .late[data-fx] { inset: auto 20px 20px auto; width: 320px; height: 200px; position: fixed; }
</style>
</head>
<body>
<p class="demo-hint"><b>curve-sweep-loader</b> — Call it again. The S-curve edge of the white curtain carries a bird off to the lower right, revealing the logo on the pale panel. <span style="color:var(--kf-dim)">(After 1s a small layer comes in late, and leaves 2.5s later)</span></p>
<main><p>The page body below appears here once the curtain lifts.</p></main>
<div data-fx="curve-sweep-loader" data-fx-curve-sweep-loader="event: demo:ready">
  <div class="logo" data-fx-part="logo">Clinic Name</div>
  <div data-fx-part="mask"><svg data-fx-part="edge" viewBox="0 0 500 596" preserveAspectRatio="none" aria-hidden="true"><path d="M500 0C430 70 360 150 345 250C335 320 300 360 220 410C140 460 60 530 0 596H500Z"/></svg><div class="rider" data-fx-part="rider"></div></div>
  <div class="copy" data-fx-part="copy">A better future</div>
</div>
<template data-demo-late><div class="late" data-fx="curve-sweep-loader" data-fx-curve-sweep-loader="speed: .5; lock: false" data-demo-remove><div data-fx-part="mask"></div></div></template>
<div data-fx="curve-sweep-loader" data-fx-curve-sweep-loader="lock: false"></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/CustomEase.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
document.addEventListener("demo:ready", () => document.querySelector("main").insertAdjacentHTML("beforeend", "<p>Received the demo:ready event.</p>"));
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
