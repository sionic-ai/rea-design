<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rune-title-loader — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 10; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-page { min-height: 80vh; display: grid; place-items: center; gap: 16px; }
  .demo-page button { padding: 10px 18px; border: 1px solid var(--kf-line); border-radius: var(--kf-radius-pill); background: var(--kf-surface); cursor: pointer; }
  .demo-card { display: flex; flex-direction: column; align-items: center; gap: 1.4rem; }
  .demo-card [data-fx-part="caption"] { font-size: .72rem; letter-spacing: .6em; text-transform: uppercase; opacity: .55; }
  .demo-card [data-fx-part="title"] { margin: 0; font: 300 clamp(1.6rem, 5.2vw, 4.4rem)/1.1 var(--kf-font-display); letter-spacing: .22em; text-transform: uppercase; }
  .demo-card [data-fx-part="sub"] { font-size: .68rem; letter-spacing: .45em; text-transform: uppercase; opacity: .45; }
</style>
</head>
<body>
<p class="demo-hint"><b>rune-title-loader</b> On open, the title card locks in from scrambled letters and lifts away after 3s. Use the button below to show it again.</p>
<main class="demo-page">
  <button type="button" data-again>Bring the title card back up</button>
</main>
<div class="demo-loader" data-fx="rune-title-loader">
  <div class="demo-card">
    <p data-fx-part="caption">— Part I —</p>
    <h1 data-fx-part="title">Make yourself at home</h1>
    <div data-fx-part="track"><div data-fx-part="bar"></div></div>
    <p data-fx-part="sub">Feel the studio</p>
  </div>
</div>
<script>
(() => {
  const src = document.querySelector(".demo-loader");
  const html = src.outerHTML;
  const make = (tag, hold) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; el.setAttribute("data-fx-rune-title-loader", `hold: ${hold}`); el.querySelector("h1").textContent = tag === "late" ? "Services" : "Studio"; return el; };
  const gone = make("gone", 4000);
  document.body.append(gone);
  setTimeout(() => document.body.append(make("late", 1200)), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector("[data-again]").addEventListener("click", () => { const el = make("again", 3000); el.addEventListener("fx:done", () => el.remove()); document.body.append(el); });
  document.querySelector(".demo-hint").append(" · After 1 second one more card comes in (a late arrival), and after 2.5 seconds one is removed (detach).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
