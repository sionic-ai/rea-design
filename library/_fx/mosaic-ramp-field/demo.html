<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mosaic-ramp-field — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { margin: 0; padding: 72px 24px 24px; background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.6 var(--kf-font-sans); }
  .demo-hint { position: fixed; top: 0; left: 0; right: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .grid > div { height: 320px; }
</style>
</head>
<body>
<p class="demo-hint"><b>mosaic-ramp-field</b> Move the mouse over the panel. Tiles shrink as the cursor pushes them away, while the color ramp keeps flowing down. <span style="color:var(--kf-dim)">(After 1s one more panel comes in, and one leaves 2.5s later)</span></p>
<div class="grid">
  <div data-fx="mosaic-ramp-field"></div>
  <div data-fx="mosaic-ramp-field" data-fx-mosaic-ramp-field="shift: .3; flip: y" data-demo-remove></div>
</div>
<template data-demo-late><div data-fx="mosaic-ramp-field" data-fx-mosaic-ramp-field="tile: 32; columns: 6; shift: .6" style="height:200px;margin-top:16px"></div></template>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
