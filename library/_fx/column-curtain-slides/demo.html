<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>column-curtain-slides — three-column photo curtain</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { padding: 40px; font-family: var(--kf-font-sans); color: var(--kf-ink); background: var(--kf-bg); }
  .stage { height: 420px; margin-bottom: 24px; }
  .ph { width: 100%; height: 100%; display: grid; place-items: center; font: 600 28px/1 var(--kf-font-sans); color: var(--kf-on-accent); }
  .ph.s1 { background: var(--kf-accent); }
  .ph.s2 { background: var(--kf-ink); }
  .ph.s3 { background: var(--kf-dim); }
</style>
</head>
<body>
<p>Just watch — every 1.5s the top sheet peels upward, and cells further right are slightly later (1s later one more panel is added, and 2s later the first panel drops out).</p>
<div id="wrap"></div>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
  const make = (opts) => {
    const el = document.createElement("div");
    el.className = "stage";
    el.setAttribute("data-fx", "column-curtain-slides");
    el.setAttribute("data-fx-column-curtain-slides", opts);
    el.innerHTML = [0, 1, 2].map(() => '<ul data-fx-part="column">' + [1, 2, 3].map((n) => `<li data-fx-part="slide"><div data-fx-part="inner"><div class="ph s${n}" data-fx-part="image">${n}</div></div></li>`).join("") + "</ul>").join("");
    document.getElementById("wrap").append(el);
    return el;
  };
  const first = make("each: 1.5; lag: 0.15");
  setTimeout(() => make("each: 2; lag: 0.3; dir: left"), 1000);
  setTimeout(() => first.remove(), 2000);
</script>
</body>
</html>
