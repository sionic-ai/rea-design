<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>blur-veil-hover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { padding: 32px 20px; display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; }
  .card { display: block; aspect-ratio: 5 / 6; }
  .card > .wf-img { position: absolute; inset: 0; height: 100%; }
</style>
</head>
<body>
<p class="demo-hint"><b>blur-veil-hover</b> — Hover over the product photo. The photo blurs and a label appears. <span style="color:var(--kf-dim)">(After 1s one more cell comes in, and one leaves 2.5s later)</span></p>
<section class="demo">
  <a class="card" href="#" data-fx="blur-veil-hover"><div class="wf-img" data-label="Product worn shot · long skirt on a checkered floor · vertical 5:6"></div><span data-fx-part="veil"><span data-fx-part="label">Your hover text here</span></span></a>
  <a class="card" href="#" data-fx="blur-veil-hover" data-demo-remove><div class="wf-img" data-label="Cell to be removed soon"></div><span data-fx-part="veil"><span data-fx-part="label">Your hover text here</span></span></a>
  <a class="card" href="#" data-fx="blur-veil-hover" style="--fx-blur: 4px; --fx-label-dur: .6s"><div class="wf-img" data-label="Light blur · slow label"></div><span data-fx-part="veil"><span data-fx-part="label">Your hover text here</span></span></a>
  <template data-demo-late><a class="card" href="#" data-fx="blur-veil-hover"><div class="wf-img" data-label="Late-arriving cell"></div><span data-fx-part="veil"><span data-fx-part="label">Your hover text here</span></span></a></template>
</section>
<script src="../fx-core.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
