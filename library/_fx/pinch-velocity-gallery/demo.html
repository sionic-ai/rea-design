<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pinch-velocity-gallery — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; height: 48px; box-sizing: border-box; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); overflow: hidden; white-space: nowrap; }
  .demo-spacer { height: 60vh; display: grid; place-items: center; color: var(--kf-dim); }
</style>
</head>
<body>
<p class="demo-hint"><b>pinch-velocity-gallery</b> Scroll down fast. The photo strip flows sideways, squeezing in the middle and then releasing (you can also drag the strip).</p>
<div class="demo-spacer">Downward</div>
<section data-fx="pinch-velocity-gallery" data-fx-pinch-velocity-gallery="top: 48" style="--fx-top: 48px">
  <div data-fx-part="pin">
    <div data-fx-part="viewport">
      <canvas data-fx-part="canvas"></canvas>
      <div data-fx-part="list">
        <div class="wf-img" data-fx-part="photo" data-label="Photo 1 · Vertical 3:4"></div>
        <div class="wf-img" data-fx-part="photo" data-label="Photo 2 · Vertical 3:4"></div>
        <div class="wf-img" data-fx-part="photo" data-label="Photo 3 · Portrait 3:4"></div>
        <div class="wf-img" data-fx-part="photo" data-label="Photo 4 · Portrait 3:4"></div>
        <div class="wf-img" data-fx-part="photo" data-label="Photo 5 · Portrait 3:4"></div>
        <div class="wf-img" data-fx-part="photo" data-label="Photo 6 · Portrait 3:4"></div>
      </div>
    </div>
  </div>
</section>
<div class="demo-spacer">Bottom margin</div>
<script>
// Late arrivals and removals — fx-core also attaches to a strip added after 1 second, and checks that a strip removed after 2.5 seconds gets detached
(() => {
  const src = document.querySelector('[data-fx~="pinch-velocity-gallery"]');
  const make = () => { const t = document.createElement("template"); t.innerHTML = src.outerHTML; return t.content.firstElementChild; };
  const gone = make();
  src.after(gone);
  setTimeout(() => gone.after(make()), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s one more strip comes in, and after 2.5s one leaves.");
})();
</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
