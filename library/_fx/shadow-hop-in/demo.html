<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>shadow-hop-in — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 2; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .gap { height: 90vh; }
  .lead { position: relative; display: flex; justify-content: center; gap: 70px; padding: 80px 20px 120px; }
  .pic { position: relative; width: 120px; }
  .pic svg { position: relative; display: block; width: 120px; height: 120px; z-index: 1; }
  .shadow { position: absolute; left: calc(50% - 90px); bottom: -24px; width: 180px; height: 56px; background: var(--kf-accent-soft); }
  .body { fill: var(--kf-accent); }
</style>
</head>
<body>
<p class="demo-hint"><b>shadow-hop-in</b> — Scroll down. The shadow under the image spreads and ripples first, then the images pop up one by one and settle. <span style="color:var(--kf-dim)">(After 1s one more line comes in, and one leaves 2.5s later)</span></p>
<div class="gap"></div>
<section class="lead" data-fx="shadow-hop-in">
  <div class="pic" data-fx-part="item"><svg data-fx-part="pic" viewBox="0 0 120 120"><circle class="body" cx="60" cy="40" r="22"/><rect class="body" x="38" y="66" width="44" height="54" rx="14"/></svg><div class="shadow" data-fx-part="shadow"></div></div>
  <div class="pic" data-fx-part="item"><svg data-fx-part="pic" viewBox="0 0 120 120"><rect class="body" x="20" y="30" width="80" height="90" rx="20"/></svg><div class="shadow" data-fx-part="shadow"></div></div>
  <div class="pic" data-fx-part="item"><svg data-fx-part="pic" viewBox="0 0 120 120"><path class="body" d="M60 10 110 120H10Z"/></svg><div class="shadow" data-fx-part="shadow"></div></div>
</section>
<section class="lead" data-fx="shadow-hop-in" data-fx-shadow-hop-in="lift: 16; each: .3" data-demo-remove>
  <div class="pic" data-fx-part="item"><svg data-fx-part="pic" viewBox="0 0 120 120"><circle class="body" cx="60" cy="70" r="46"/></svg><div class="shadow" data-fx-part="shadow"></div></div>
</section>
<template data-demo-late><section class="lead" data-fx="shadow-hop-in" data-fx-shadow-hop-in="start: top 90%"><div class="pic" data-fx-part="item"><svg data-fx-part="pic" viewBox="0 0 120 120"><rect class="body" x="30" y="20" width="60" height="100" rx="30"/></svg><div class="shadow" data-fx-part="shadow"></div></div></section></template>
<section class="lead" data-fx="shadow-hop-in"></section>
<div class="gap"></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../../../_shared/vendor/gsap/CustomEase.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
