<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dash-redraw-hover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 500 15px/1.6 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 10; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .row { display: flex; gap: 48px; max-width: 760px; margin: 64px auto; }
  .row a { width: 240px; }
</style>
</head>
<body>
<p class="demo-hint"><b>dash-redraw-hover</b> — Hover over the dotted link. The dotted line is cut off and drawn again, and the arrow is pushed along. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<div class="row">
  <a href="#" data-fx="dash-redraw-hover">View details<span data-fx-part="arrow">›</span></a>
  <a href="#" data-fx="dash-redraw-hover">Link without arrow</a>
  <a href="#" data-fx="dash-redraw-hover" data-demo-remove>Omitted link<span data-fx-part="arrow">›</span></a>
</div>
<template data-demo-late><div class="row"><a href="#" data-fx="dash-redraw-hover" style="--fx-dur: .5s; --fx-dash: .5rem">Late-entering link (.5s)<span data-fx-part="arrow">›</span></a></div></template>
<script src="../fx-core.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
