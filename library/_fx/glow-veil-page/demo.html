<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>glow-veil-page — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { padding: 80px 20px; display: flex; gap: 24px; font: 500 18px/1 var(--kf-font-mono); text-transform: uppercase; }
  .demo a { padding: 12px 18px; border: 1px solid var(--kf-line); }
</style>
</head>
<body data-fx="glow-veil-page">
<p class="demo-hint"><b>glow-veil-page</b> — Click a link below and light fills up to cover the screen, then returns to this page and clears. <span style="color:var(--kf-dim)">(After 1s one more link comes in, and after 2.5s one drops out)</span></p>
<nav class="demo"><a href="demo.html?p=2">Other pages</a><a href="demo.html?p=3" data-veil-label="Link with a separate name">Name link</a><a href="#" data-demo-remove>Being removed soon</a><template data-demo-late><a href="demo.html?p=4">Enters late</a></template></nav>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); }, 2500);
</script>
</body>
</html>
