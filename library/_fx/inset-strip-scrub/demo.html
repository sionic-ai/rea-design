<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>inset-strip-scrub — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.6 var(--kf-font-sans); }
  .demo-hint { position: fixed; top: 0; left: 0; right: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .mv { position: relative; height: 100vh; margin-bottom: -40vh; }
  .mv__vi { position: absolute; inset: 0; display: grid; align-items: end; }
  .mv__clip { position: sticky; bottom: 0; height: 100%; background: var(--kf-bg); }
  .mv__media { position: absolute; inset: 0; background: repeating-linear-gradient(45deg, var(--kf-accent) 0 40px, var(--kf-accent-soft) 40px 80px); }
  .next { position: relative; min-height: 160vh; padding: 60vh 20px 0; }
  .next p { max-width: 520px; margin-left: auto; font-size: 20px; font-weight: 700; color: var(--kf-accent-text); }
  .more { height: 80vh; margin: 40px 20px; }
</style>
</head>
<body>
<p class="demo-hint"><b>inset-strip-scrub</b> — Scroll down. The full panel is cropped into a round window leaving only a bottom strip, while the inner pattern zooms in 1.5x. <span style="color:var(--kf-dim)">(After 1s one more panel comes in, and one leaves 2.5s later)</span></p>
<div class="mv" data-fx-part="track"><div class="mv__vi"><div class="mv__clip" data-fx="inset-strip-scrub"><div class="mv__media" data-fx-part="media"></div></div></div></div>
<section class="next"><p>While the next section slides up, the panel above is cropped. Intro copy goes here.</p></section>
<div class="more" id="more"></div>
<div class="more" data-fx="inset-strip-scrub" data-demo-remove></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => { const d = document.createElement("div"); d.className = "more"; d.dataset.fx = "inset-strip-scrub"; d.dataset.fxInsetStripScrub = "zoom: 1; round: 20px"; document.querySelector("#more")?.append(d); }, 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); }, 2500);
</script>
</body>
</html>
