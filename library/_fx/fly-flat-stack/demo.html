<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fly-flat-stack — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { margin: 0; background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-spacer { height: 80vh; display: grid; place-items: center; color: var(--kf-dim); }
  .demo h2 { margin: 0; font: 400 64px/1.2 var(--kf-font-display); }
  .demo [data-fx-part="card"] { box-sizing: border-box; padding: 16px; border-radius: var(--kf-radius-lg); background: var(--kf-contrast-bg); color: var(--kf-contrast-ink); box-shadow: var(--kf-shadow-soft); }
  .demo [data-fx-part="card"] i { display: block; aspect-ratio: 16 / 10; border-radius: calc(var(--kf-radius-lg) - 6px); background: var(--kf-accent); }
  .demo [data-fx-part="card"] p { margin: 0; padding: 40px 20px; text-align: center; font-size: 28px; }
</style>
</head>
<body>
<p class="demo-hint"><b>fly-flat-stack</b> — Scroll down and the section stops, cards fly in from deep and stack up, then leave together.</p>
<div class="demo-spacer">Scroll down ↓</div>
<section class="demo" data-fx="fly-flat-stack">
  <h2 data-fx-part="title">Your title here</h2>
  <div data-fx-part="deck">
    <article data-fx-part="card"><i></i><p>Your card here</p></article>
    <article data-fx-part="card"><i></i><p>Your card two here</p></article>
    <article data-fx-part="card"><i></i><p>Your card three here</p></article>
  </div>
</section>
<div class="demo-spacer"></div>
<script>
(() => {
  const late = document.createElement("section");
  late.setAttribute("data-fx", "fly-flat-stack");
  late.style.height = "0px";
  setTimeout(() => document.body.append(late), 1000);
  setTimeout(() => late.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s an empty stage comes in and leaves after 2.5s (detach).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
