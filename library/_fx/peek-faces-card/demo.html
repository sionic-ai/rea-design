<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>peek-faces-card — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { margin: 0; padding: 12px 20px; border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 120px 32px; max-width: 900px; margin: 140px auto 80px; padding: 0 20px; }
  .frame { aspect-ratio: 16 / 9; }
  .peek path { fill: var(--kf-accent); }
  .peek circle { fill: var(--kf-bg); }
  h3 { margin-top: 12px; font-size: 18px; }
</style>
</head>
<body>
<p class="demo-hint"><b>peek-faces-card</b> — Hover over the card. Two faces rise from behind the top edge and the title shuffles.</p>
<ul class="grid" id="grid">
  <li><a href="#" data-fx="peek-faces-card" data-fx-peek-faces-card="text: Brand name"><div class="frame" data-fx-part="frame"><div class="wf-img" data-fx-part="photo" data-label="Work photo 16:9"></div><svg class="peek" data-fx-part="peek" data-key="right" viewBox="0 0 100 128"><path d="M4 122C20 114 34 92 34 70 22 60 18 46 18 36 18 18 32 6 50 6S82 18 82 36C82 46 78 60 66 70 66 92 80 114 96 122Z"/><circle cx="41" cy="36" r="5"/><circle cx="59" cy="36" r="5"/></svg><svg class="peek" data-fx-part="peek" data-key="left" viewBox="0 0 100 128"><path d="M4 122C20 114 34 92 34 70 22 60 18 46 18 36 18 18 32 6 50 6S82 18 82 36C82 46 78 60 66 70 66 92 80 114 96 122Z"/><circle cx="41" cy="36" r="5"/><circle cx="59" cy="36" r="5"/></svg></div><h3 data-fx-part="title">Your work title here</h3></a></li>
  <li class="gone"><a href="#" data-fx="peek-faces-card"><div class="frame" data-fx-part="frame"><div class="wf-img" data-fx-part="photo" data-label="Card to be removed soon"></div></div><h3 data-fx-part="title">Card to be removed soon</h3></a></li>
</ul>
<script src="../../_vendor/shuffle-letters@1.1.0/shuffle-letters.umd.min.js"></script>
<script>
// Check it attaches to late-arriving cards, and that detach runs for removed cards
setTimeout(() => { const li = document.createElement("li"); li.innerHTML = '<a href="#" data-fx="peek-faces-card" data-fx-peek-faces-card="text: LATE"><div class="frame" data-fx-part="frame"><div class="wf-img" data-fx-part="photo" data-label="Late-arrived card"></div></div><h3 data-fx-part="title">Late-arrived card</h3></a>'; document.getElementById("grid").append(li); }, 1000);
setTimeout(() => document.querySelector(".gone")?.remove(), 2500);
</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
