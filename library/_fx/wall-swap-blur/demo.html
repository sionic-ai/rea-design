<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>wall-swap-blur — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-wall { margin: 24px 20px; }
  .demo-wall [data-fx-part="pause"] { display: block; margin: 0 0 12px auto; border: 0; background: none; cursor: pointer; color: var(--kf-dim); }
  .demo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; }
  .demo-grid figure { height: 180px; padding: 16px; border: 1px solid var(--kf-line); border-radius: var(--kf-radius-sm); background: var(--kf-surface); }
  .demo-grid b { display: block; margin-bottom: 12px; }
</style>
</head>
<body>
<p class="demo-hint"><b>wall-swap-blur</b> — Wait and each cell fades and swaps its review every 4–8 seconds. Hover over a cell and only that cell stops while the rest recede.</p>
<div class="demo-wall" data-fx="wall-swap-blur">
  <button type="button" data-fx-part="pause" data-on="Stopping" data-off="Replay">Stopping</button>
  <div class="demo-grid">
    <figure data-fx-part="slot"><div><b>Name 01</b>One-line review goes here.</div></figure>
    <figure data-fx-part="slot"><div><b>Name 02</b>Your slightly longer review in two lines here.</div></figure>
    <figure data-fx-part="slot"><div><b>Name 03</b>Your one-line review here.</div></figure>
  </div>
  <template data-fx-part="pool">
    <div><b>Name 04</b>Your fourth review here.</div>
    <div><b>Name 05</b>Your fifth review here.</div>
    <div><b>Name 06</b>Your sixth review here.</div>
  </template>
</div>
<script>
(() => {
  const src = document.querySelector('[data-fx~="wall-swap-blur"]');
  const make = (tag) => { const el = src.cloneNode(true); el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => src.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
