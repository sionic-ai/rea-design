<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>card-trail-loop — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { padding: 48px 20px; }
  .demo-spacer { height: 90vh; display: grid; place-items: center; color: var(--kf-dim); }

  .trail { height: 80vh; border-radius: var(--kf-radius-lg); background: var(--kf-raised); }
  [data-fx-part="card"] { width: 190px; aspect-ratio: 4 / 5; border-radius: 24px 0 24px 24px; background: var(--kf-ink); }
</style>
</head>
<body>
<p class="demo-hint"><b>card-trail-loop</b> — Photo cards fly in one after another, stay, then leave (next section after 3 seconds). <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<section class="demo"><div data-demo-remove class="trail" data-fx="card-trail-loop"><div data-fx-part="card"></div><div data-fx-part="card"></div></div><div class="trail" data-fx="card-trail-loop"><div data-fx-part="card"></div><div data-fx-part="card"></div></div><template data-demo-late><div class="trail" data-fx="card-trail-loop"><div data-fx-part="card"></div><div data-fx-part="card"></div></div></template></section>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); window.ScrollTrigger?.refresh(); }, 2500);
</script>
</body>
</html>
