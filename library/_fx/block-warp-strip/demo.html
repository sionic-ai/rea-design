<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>block-warp-strip — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo-stage { height: 80vh; margin: 0 20px 20px; background: var(--kf-surface); border: 1px solid var(--kf-line); }
  .demo-stage p { position: absolute; left: 20px; bottom: 16px; margin: 0; font: 600 14px var(--kf-font-mono); }
  .demo-wide { height: 30vh; }
  .demo-spacer { height: 60vh; display: grid; place-items: center; color: var(--kf-dim); }
</style>
</head>
<body>
<p class="demo-hint"><b>block-warp-strip</b> — Roll the wheel and the band speeds up, then cools down. Move the mouse and the band in each cell shifts like blocks, then returns.</p>
<section class="demo-stage" data-fx="block-warp-strip" data-fx-block-warp-strip="text: ABC"><p>Vertical strip · wheel · column shift</p></section>
<section class="demo-stage demo-wide" data-fx="block-warp-strip" data-fx-block-warp-strip="text: ABOUT; dir: horizontal; wheel: 0; color: --kf-accent"><p>Horizontal band · cell shift only</p></section>
<div class="demo-spacer">Lower section</div>
<script>
// Late arrivals and removals — checks that fx-core attaches to an element added after 1s and detaches from an element removed after 2.5s
(() => {
  const src = document.querySelector('[data-fx~="block-warp-strip"]');
  if (!src) return;
  const make = (tag) => { const el = src.cloneNode(true); el.querySelectorAll("canvas").forEach((c) => c.remove()); el.dataset.demo = tag; el.style.height = "30vh"; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => src.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s one more strip panel comes in (a late arrival), and after 2.5s one drops out (detach).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="three-global.js"></script>
<script src="../../_vendor/three@0.180.0/build/three.cjs"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
