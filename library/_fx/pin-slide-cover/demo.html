<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pin-slide-cover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .pad { height: 70vh; display: grid; place-items: center; }
  .panel { display: flex; height: 100vh; }
  .panel > p { flex: 1; padding: 40px; background: var(--kf-accent); color: var(--kf-on-accent); }
  .panel [data-fx-part="slides"] { flex: 2; }
  .panel .wf-img { height: 100%; }
</style>
</head>
<body>
<p class="demo-hint"><b>pin-slide-cover</b> — Scroll down. The panel stays still while photos rise from below one by one to cover it.</p>
<div class="pad">Top margin</div>
<div class="panel" data-fx="pin-slide-cover" id="src"><p>Your product name and description here</p><div data-fx-part="slides">
  <div data-fx-part="slide"><span class="wf-img" data-label="Product photo 1"></span></div>
  <div data-fx-part="slide"><span class="wf-img" data-label="Product photo 2"></span></div>
  <div data-fx-part="slide"><span class="wf-img" data-label="Product photo 3"></span></div>
</div></div>
<div class="pad">Bottom margin</div>
<script>
(() => {
  const src = document.getElementById("src");
  const html = src.outerHTML.replace(/\sid="[^"]*"/g, "");
  const make = () => { const t = document.createElement("template"); t.innerHTML = html; return t.content.firstElementChild; };
  const gone = make();
  document.body.append(gone);
  setTimeout(() => document.body.append(make()), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s, one more panel comes in (the late one), and after 2.5s one drops out (the removal).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
