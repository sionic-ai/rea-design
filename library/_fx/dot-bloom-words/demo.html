<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dot-bloom-words — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { padding: 48px 20px; }
  .demo-spacer { height: 90vh; display: grid; place-items: center; color: var(--kf-dim); }
  .t { margin: 0 0 80px; text-align: center; font: 600 120px/.95 var(--kf-font-display); letter-spacing: -.04em; word-break: keep-all; }
  .t.is-accent { --fx-ink: var(--kf-accent); }
</style>
</head>
<body>
<p class="demo-hint"><b>dot-bloom-words</b> — Scroll down. A small dot beside a word swells and vanishes, and in its place the word grows stepwise. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<section class="demo">
  <h2 class="t" data-fx="dot-bloom-words">Your big two-line title here</h2>
  <div class="demo-spacer">Downward</div>
  <h2 class="t is-accent" data-demo-remove data-fx="dot-bloom-words" data-fx-dot-bloom-words="each: .2">Accent word, slowly</h2>
  <template data-demo-late><h2 class="t" data-fx="dot-bloom-words">Late-arriving title</h2></template>
  <h2 data-fx="dot-bloom-words"></h2>
  <div class="demo-spacer">Footer</div>
</section>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
