<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sticker-focus-row — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { margin: 0; background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-stage { position: relative; height: 70vh; min-height: 420px; overflow: hidden; display: flex; align-items: center; justify-content: center; border-bottom: 1px solid var(--kf-line); }
  .demo-stage ul { list-style: none; margin: 0; padding: 0; }
  .demo-blob { display: block; width: 300px; height: 300px; border-radius: 42%; border: 14px solid var(--kf-ink); background: var(--kf-accent-soft); }
  .demo-blob.is-round { border-radius: 50%; background: var(--kf-accent); }
  .demo-blob.is-wide { width: 380px; height: 240px; border-radius: 120px; }
  .demo-out { padding: 12px 20px; font: 500 13px/1.4 var(--kf-font-mono); }
</style>
</head>
<body>
<p class="demo-hint"><b>sticker-focus-row</b> — Grab and drag a sticker then release it, or press to line them up. Use the left/right arrow keys to page through and Esc to close.</p>
<div class="demo-stage" data-demo-stage>
  <ul data-fx="sticker-focus-row" data-fx-sticker-focus-row="gap: 420">
    <li data-fx-part="item" data-x="-246" data-y="-15" data-rot="0" data-z="5" data-mx="-90" data-my="-40" data-mrot="-4"><span class="demo-blob"></span><div data-fx-part="label"><span>Item One</span></div></li>
    <li data-fx-part="item" data-x="-82" data-y="-36" data-rot="2" data-z="4" data-mx="90" data-my="-40" data-mrot="3"><span class="demo-blob is-round"></span><div data-fx-part="label"><span>Item Two</span></div></li>
    <li data-fx-part="item" data-x="95" data-y="7" data-rot="6" data-z="3" data-mx="-90" data-my="120" data-mrot="6"><span class="demo-blob is-wide"></span><div data-fx-part="label"><span>Item Three</span></div></li>
    <li data-fx-part="item" data-x="276" data-y="0" data-rot="17" data-z="2" data-mx="90" data-my="120" data-mrot="0"><span class="demo-blob is-round"></span><div data-fx-part="label"><span>Item Four</span></div></li>
  </ul>
</div>
<p class="demo-out" data-demo-out>Selected: None</p>
<script>
// Late and removed plates — checks that fx-core also attaches to a plate that arrives after 1 second and detaches the one removed after 2.5 seconds
(() => {
  const stage = document.querySelector("[data-demo-stage]");
  const out = document.querySelector("[data-demo-out]");
  stage.addEventListener("fx:focus", (e) => { out.textContent = "Chosen: " + (e.detail.index < 0 ? "None" : e.detail.index + 1); });
  const html = stage.outerHTML;
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; el.style.height = "300px"; el.style.minHeight = "0"; return el; };
  const gone = make("gone");
  out.after(gone);
  setTimeout(() => out.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s one more panel comes in, and after 2.5s one leaves.");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/CustomEase.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
