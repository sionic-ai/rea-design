<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>nudge-spring — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 500 13px/1.4 var(--kf-font-sans); }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .stage { display: flex; flex-wrap: wrap; gap: 60px; padding: 80px 60px; }
  .tag { width: 150px; aspect-ratio: 1; display: grid; place-items: center; border: 1px solid var(--kf-line); border-radius: var(--kf-radius-md); background: var(--kf-accent-soft); }
</style>
</head>
<body>
<p class="demo-hint"><b>nudge-spring</b> — Swing the mouse quickly over the sticker. It gets pushed away, then returns to place. <span style="color:var(--kf-dim)">(After 1s one more sticker comes in, and after 2.5s one is removed)</span></p>
<div class="stage" data-demo-stage>
  <div class="tag" data-fx="nudge-spring" style="rotate:-20deg">Sticker</div>
  <div class="tag" data-fx="nudge-spring" style="rotate:30deg">Sticker</div>
  <div class="tag" data-fx="nudge-spring" data-fx-nudge-spring="damp: .6" data-demo-remove>Exit sticker</div>
</div>
<template data-demo-late><div class="tag" data-fx="nudge-spring" data-fx-nudge-spring="reach: 1.5" style="rotate:-35deg">Late-arriving sticker</div></template>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => document.querySelector("[data-demo-stage]").append(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
