<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sticker-pop-reveal — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { margin: 0; padding: 12px 20px; border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .spacer { height: 70vh; }
  .theme { position: relative; display: flex; gap: 20px; justify-content: center; padding: 120px 0 60px; }
  .theme ul { display: flex; gap: 20px; }
  .theme li { width: 180px; padding: 12px; background: var(--kf-surface); box-shadow: var(--kf-shadow-soft); rotate: 2deg; }
  .theme li:last-child { rotate: -3deg; margin-top: 60px; }
  .theme li span { display: block; aspect-ratio: 3 / 4; background: var(--kf-line); }
  .theme a { position: absolute; top: 20px; left: calc(50% + 140px); display: grid; place-items: center; width: 160px; height: 160px; border-radius: 50%; background: var(--kf-accent); color: var(--kf-on-accent); font: 700 28px/1.1 var(--kf-font-display); text-align: center; }
</style>
</head>
<body>
<p class="demo-hint"><b>sticker-pop-reveal</b> — Scroll down. A sticker pops out, then a stack of cards rises.</p>
<div class="spacer"></div>
<div id="list">
  <div class="theme" data-fx="sticker-pop-reveal"><ul data-fx-part="group"><li><span></span>One card</li><li><span></span>Card two</li></ul><a data-fx-part="sticker" href="#">Topic<br>Sticker</a></div>
  <div class="theme" data-fx="sticker-pop-reveal" data-fx-sticker-pop-reveal="by: group"><ul data-fx-part="group"><li><span></span>Card three</li><li><span></span>Card four</li></ul><a data-fx-part="sticker" href="#">Second<br>Topic</a></div>
</div>
<div class="spacer"></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
  gsap.registerPlugin(ScrollTrigger);
  // Check that late-arriving bundles get hooked and removed bundles get released
  setTimeout(() => {
    const d = document.createElement("div");
    d.className = "theme";
    d.dataset.fx = "sticker-pop-reveal";
    d.innerHTML = '<ul data-fx-part="group"><li><span></span>Late-arrived card</li></ul><a data-fx-part="sticker" href="#">Late<br>Topic</a>';
    document.getElementById("list").append(d);
  }, 1000);
  setTimeout(() => document.querySelectorAll("#list .theme")[1]?.remove(), 2500);
</script>
</body>
</html>
