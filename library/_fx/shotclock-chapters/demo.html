<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>shotclock-chapters — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { margin: 0; font-family: var(--kf-font-sans); background: var(--kf-bg); color: var(--kf-ink); }
  .demo-hint { position: sticky; top: 0; padding: 16px 24px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); z-index: 2; }
  section { height: 90vh; display: grid; place-items: center; border-bottom: 1px solid var(--kf-line); font-size: 32px; }
</style>
</head>
<body>
  <p class="demo-hint"><b>shotclock-chapters</b> — Scroll down — from the second section a clock at bottom right counts down from 24 seconds, and clicking it opens the section list.</p>
  <section id="c1">Section 1</section>
  <section id="c2">Section 2</section>
  <section id="c3">Section 3</section>
  <section id="c4">Section 4</section>
  <section id="c5">Section 5</section>
  <footer id="end" style="height: 60vh"></footer>
  <nav data-fx="shotclock-chapters" data-fx-shotclock-chapters="to: #end" aria-label="Section list">
    <a data-fx-part="chapter" href="#c1">Tip-off</a>
    <a data-fx-part="chapter" href="#c2">On the court</a>
    <a data-fx-part="chapter" href="#c3">The tech</a>
    <a data-fx-part="chapter" href="#c4">Branding</a>
    <a data-fx-part="chapter" href="#c5">Final</a>
  </nav>
  <template data-demo-late><nav data-fx="shotclock-chapters" data-fx-shotclock-chapters="look: inline; from: #c1" style="margin: 24px"><a data-fx-part="chapter" href="#c1">Late one</a><a data-fx-part="chapter" href="#c3">Late two</a></nav></template>
  <nav data-fx="shotclock-chapters" data-demo-remove><a data-fx-part="chapter" href="#c1">Gone</a></nav>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
