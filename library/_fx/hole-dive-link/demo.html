<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hole-dive-link — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-contrast-bg); color: var(--kf-contrast-ink); font: 400 15px/1.5 var(--kf-font-sans); overflow: hidden; }
  .demo-hint { position: relative; z-index: 100; padding: 12px 20px; background: var(--kf-surface); color: var(--kf-ink); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .stage { position: relative; height: calc(100vh - 46px); overflow: hidden; }
  .stage [data-fx-part="image"] { position: absolute; top: 50%; left: 50%; width: min(80vh, 90vw); aspect-ratio: 1; translate: -50% -50%; }
  .stage [data-fx-part="figure"] { position: relative; z-index: 1; display: block; width: 100%; height: 100%; transform-origin: 50% 50%; }
  .stage [data-fx-part="hole"] { position: absolute; top: 50%; left: 50%; width: 21%; aspect-ratio: 1; translate: -50% -50%; overflow: hidden; }
  .stage [data-fx-part="hole-inner"] { width: 100%; height: 100%; overflow: hidden; }
  .stage [data-fx-part="hole-inner"] a { display: block; width: 100%; height: 100%; }
  .stage [data-fx-part="photo"] { display: block; width: 100%; height: 100%; background: linear-gradient(180deg, var(--kf-accent-soft) 0 44%, var(--kf-accent) 44%); }
  .stage [data-fx-part="fade"] { position: absolute; left: 32px; bottom: 32px; z-index: 2; font: 600 20px/1 var(--kf-font-display); color: inherit; }
</style>
</head>
<body>
<p class="demo-hint"><b>hole-dive-link</b> — Click the center square (photo in the gap) and the figure swells and leaps into the gap (1.8s later to this page’s #dived). <span style="color:var(--kf-dim)">(After 1s one more hidden panel comes in, and after 2.5s another hidden panel leaves)</span></p>
<div class="stage" data-fx="hole-dive-link">
  <div data-fx-part="image">
    <div data-fx-part="hole"><div data-fx-part="hole-inner"><a href="#dived" aria-label="Jump in"><span data-fx-part="photo"></span></a></div></div>
    <svg data-fx-part="figure" viewBox="0 0 1000 1000" aria-hidden="true">
      <defs><mask id="dive-hole"><rect width="1000" height="1000" fill="#fff"/><rect x="395" y="395" width="210" height="210" fill="#000"/></mask></defs><!-- Not Skin: the mask uses only brightness and is not painted -->
      <g mask="url(#dive-hole)" fill="currentColor" opacity=".85"><circle cx="500" cy="250" r="70"/><path d="M290 410Q500 340 710 410L780 1000H220Z"/></g>
    </svg>
  </div>
  <a data-fx-part="fade" href="#dived">CLICK TO DIVE</a>
</div>
<div data-fx="hole-dive-link" data-demo-remove hidden></div>
<template data-demo-late><div data-fx="hole-dive-link" data-fx-hole-dive-link="go: 600" hidden></div></template>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
