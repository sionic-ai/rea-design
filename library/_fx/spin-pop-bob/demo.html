<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>spin-pop-bob — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { margin: 0; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .stage { position: relative; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 56px; padding: 64px 40px; }
  .card { width: 220px; height: 300px; border-radius: var(--kf-radius-lg); background: var(--kf-raised); border: 1px solid var(--kf-line); display: grid; place-items: center; color: var(--kf-dim); }
  .bubble { width: 140px; }
  .bubble svg { display: block; width: 100%; height: auto; overflow: visible; }
  .bubble .fill { fill: var(--kf-accent); }
  .bubble .soft { fill: var(--kf-accent-soft); }
  .bubble .mark { fill: color-mix(in srgb, var(--kf-ink) 30%, transparent); }
  .dot { width: 22px; height: 22px; border-radius: 50%; background: color-mix(in srgb, var(--kf-ink) 25%, transparent); }
</style>
</head>
<body>
<p class="demo-hint"><b>spin-pop-bob</b> — Try refreshing. The speech bubble spins on its bottom axis and pops out, then keeps bobbing gently, while the flower and heart inside spin separately. The card flies in tilted from below and floats (floating on the element itself, no children).</p>
<div class="stage" id="stage">
  <div class="bubble" data-fx="spin-pop-bob" data-fx-spin-pop-bob="delay: .8; tilt: -5,2; bob-delay: .2">
    <svg data-fx-part="bob" viewBox="0 0 200 163" aria-hidden="true">
      <path class="fill" d="M100 8c50 0 92 30 92 70s-42 70-92 70c-10 0-20-1-29-4L30 160l10-36C20 111 8 95 8 78 8 38 50 8 100 8z"/>
      <g class="mark" data-fx-part="glyph" data-keys="-50,2" data-period="3">
        <circle cx="100" cy="56" r="17"/><circle cx="124" cy="78" r="17"/><circle cx="100" cy="100" r="17"/><circle cx="76" cy="78" r="17"/><circle cx="100" cy="78" r="13"/>
      </g>
    </svg>
  </div>
  <div class="card" data-fx="spin-pop-bob" data-fx-spin-pop-bob="delay: .25; dur: 1.6; scale: .8; y: 900; rotate: 35">Photo slot</div>
  <div class="bubble" data-fx="spin-pop-bob" data-fx-spin-pop-bob="delay: 1; dur: .8; rotate: 50; origin: 40% 80%; tilt: 0,-9; bob-delay: .3">
    <svg data-fx-part="bob" viewBox="0 0 188 148" aria-hidden="true">
      <path class="soft" d="M94 6c46 0 86 28 86 64s-40 64-86 64c-8 0-16-1-24-3l-44 15 12-32C18 102 8 87 8 70 8 34 48 6 94 6z"/>
      <path class="mark" data-fx-part="glyph" data-prop="scale" data-keys="1,1.05" data-period="2" d="M94 104C70 88 60 76 60 62c0-11 8-19 18-19 7 0 12 3 16 9 4-6 9-9 16-9 10 0 18 8 18 19 0 14-10 26-34 42z"/>
    </svg>
  </div>
</div>
<script>
// Late arrivals · removals — after 1s one more dot comes in, after 2.5s the first speech bubble is removed (detach)
(() => {
  const stage = document.getElementById("stage");
  const first = stage.querySelector(".bubble");
  setTimeout(() => { const d = document.createElement("span"); d.className = "dot"; d.dataset.fx = "spin-pop-bob"; d.dataset.fxSpinPopBob = "fade: true; scale: 0; y: 10; rotate: 0; dur: .75; ease: 0.19,1,0.22,1.1; bob: 25; period: 2.2"; stage.append(d); }, 1000);
  setTimeout(() => first.remove(), 2500);
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/CustomEase.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
