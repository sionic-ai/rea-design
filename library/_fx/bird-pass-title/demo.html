<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bird-pass-title — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); overflow-x: hidden; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { padding: 120px 20px 120px 280px; }
  .demo-spacer { height: 90vh; display: grid; place-items: center; color: var(--kf-dim); }
  .t { margin: 0 0 200px; font: 700 72px/1 var(--kf-font-display); letter-spacing: -0.027em; }
</style>
</head>
<body>
<p class="demo-hint"><b>bird-pass-title</b> — Scroll down and the heading letters drop in while a bird passes along a curve. <span style="color:var(--kf-dim)">(One more title comes in after 1s, and one drops out after 2.5s)</span></p>
<div class="demo-spacer">Scroll down</div>
<section class="demo">
  <h2 class="t" data-demo-remove data-fx="bird-pass-title"><span data-fx-part="label">NEWS</span></h2>
  <h2 class="t" data-fx="bird-pass-title"><span data-fx-part="label">ABOUT US</span></h2>
  <template data-demo-late><h2 class="t" data-fx="bird-pass-title" data-fx-bird-pass-title="dur: 1.4"><span data-fx-part="label">CONTACT</span></h2></template>
  <h2 class="t" data-fx="bird-pass-title"></h2>
</section>
<div class="demo-spacer"></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); window.ScrollTrigger?.refresh(); }, 2500);
</script>
</body>
</html>
