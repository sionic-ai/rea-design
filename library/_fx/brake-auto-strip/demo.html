<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>brake-auto-strip — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="../../_vendor/splide@4.1.4/splide-core.min.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .strip { margin-top: 40px; }
  .strip a { display: block; }
  .strip .splide__slide { height: 320px; }
  .strip .splide__slide > div { height: 100%; display: grid; place-items: center; background: var(--kf-raised); border-right: 1px solid var(--kf-bg); color: var(--kf-dim); font: 500 13px/1 var(--kf-font-mono); }
  .strip .w1 { width: 240px; } .strip .w2 { width: 420px; } .strip .w3 { width: 320px; }
  .strip__bottom { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; border-bottom: 1px solid var(--kf-line); font-size: 13px; }
  .strip__nav { display: flex; align-items: center; gap: 16px; }
  .strip__count { display: flex; align-items: center; gap: 8px; }
  .strip__rail { position: relative; width: 13px; height: 1px; overflow: hidden; background: var(--kf-line); }
  .strip__rail [data-fx-part="bar"] { position: absolute; inset: 0; background: var(--kf-accent); }
  .strip .splide__arrows { display: flex; gap: 12px; }
  .strip .splide__arrow { width: 28px; height: 22px; border: 1px solid var(--kf-line); border-radius: 6px; background: none; cursor: pointer; }
</style>
</head>
<body>
<p class="demo-hint"><b>brake-auto-strip</b> — Hover over the strip. It slows gradually to a stop, and flows again right away when released. <span style="color:var(--kf-dim)">(After 1s one more band comes in, and one leaves 2.5s later)</span></p>
<div class="splide strip" data-demo-remove data-fx="brake-auto-strip" aria-label="Photo strip"><a href="#"><div class="splide__track"><div class="splide__list"><div class="splide__slide"><div class="w1">Photo 1</div></div><div class="splide__slide"><div class="w2">Photo 2</div></div><div class="splide__slide"><div class="w3">Photo 3</div></div><div class="splide__slide"><div class="w2">Photo 4</div></div><div class="splide__slide"><div class="w1">Photo 5</div></div></div></div>
  <div class="strip__bottom"><span>Your house name here</span><div class="strip__nav"><span class="strip__count"><span data-fx-part="count">1</span><span class="strip__rail"><span data-fx-part="bar"></span></span><span data-fx-part="total">5</span></span><div class="splide__arrows"><button class="splide__arrow splide__arrow--prev" type="button" aria-label="Previous">←</button><button class="splide__arrow splide__arrow--next" type="button" aria-label="Next">→</button></div></div></div></a></div>
<div class="splide strip" data-fx="brake-auto-strip" data-fx-brake-auto-strip="speed: 0.8; brake: 0.03" aria-label="Photo strip"><div class="splide__track"><div class="splide__list"><div class="splide__slide"><div class="w3">Photo 1</div></div><div class="splide__slide"><div class="w1">Photo 2</div></div><div class="splide__slide"><div class="w2">Photo 3</div></div><div class="splide__slide"><div class="w1">Photo 4</div></div></div></div></div>
<template data-demo-late><div class="splide strip" data-fx="brake-auto-strip" aria-label="Photo strip"><div class="splide__track"><div class="splide__list"><div class="splide__slide"><div class="w2">Photo 1</div></div><div class="splide__slide"><div class="w3">Photo 2</div></div><div class="splide__slide"><div class="w1">Photo 3</div></div></div></div></div></template>
<div style="height: 40vh"></div>
<script src="../../_vendor/splide@4.1.4/splide.min.js"></script>
<script src="../../_vendor/splide-extension-auto-scroll@0.5.3/splide-extension-auto-scroll.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
