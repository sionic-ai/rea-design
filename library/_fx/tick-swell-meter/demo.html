<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tick-swell-meter — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 500 13px/1.4 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 2; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .meter { position: fixed; right: 40px; top: 50%; transform: translateY(-50%); width: 48px; }
  .long { height: 400vh; padding: 40px; }
  .box { margin: 40px; width: 200px; height: 200px; overflow: auto; border: 1px solid var(--kf-line); position: relative; }
  .box .meter { position: absolute; right: 8px; top: 8px; transform: none; }
  .box .in { height: 1200px; }
</style>
</head>
<body>
<p class="demo-hint"><b>tick-swell-meter</b> — Scroll down the page. The right-hand ticks lengthen at the spot you have read, and spread wider if you scroll fast. <span style="color:var(--kf-dim)">(After 1s one more inner panel tick comes in, after 2.5s one leaves)</span></p>
<div class="meter" data-fx="tick-swell-meter"></div>
<div class="meter" data-fx="tick-swell-meter" data-demo-remove style="right: 120px"></div>
<div class="long"><p>Your long text continues here.</p></div>
<template data-demo-late><div class="box" data-fx-scroller><div class="meter" data-fx="tick-swell-meter" data-fx-tick-swell-meter="count: 21; gap: 6"></div><div class="in"></div></div></template>
<div data-fx="tick-swell-meter" data-fx-tick-swell-meter="count: 0"></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); }, 2500);
</script>
</body>
</html>
