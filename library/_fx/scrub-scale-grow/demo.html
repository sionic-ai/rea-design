<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>scrub-scale-grow — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo-spacer { height: 90vh; display: grid; place-items: center; color: var(--kf-dim); }
  .grow { overflow: hidden; padding: 128px 20px; background: var(--kf-surface); }
  .grow [data-fx-part="art"] { position: absolute; inset: 32px 0; display: grid; place-items: center; pointer-events: none; }
  .grow svg { width: 100%; height: 100%; }
  .grow .petal-a { fill: var(--kf-accent); }
  .grow .petal-b { fill: var(--kf-accent-soft); }
  .grow p { position: relative; max-width: 30em; margin: 0 auto; font: 400 18px/2.5 var(--kf-font-display); }
</style>
</head>
<body>
<p class="demo-hint"><b>scrub-scale-grow</b> Scrolling down, the image behind the section is tied to scroll and swells up to 1.5x (2x at widths of 767 or less).</p>
<div class="demo-spacer">Scroll down ↓</div>
<section class="grow" data-fx="scrub-scale-grow" data-fx-scrub-scale-grow="to: 1.5; to-narrow: 2">
  <div data-fx-part="art" aria-hidden="true">
    <svg viewBox="0 0 800 515" preserveAspectRatio="xMidYMid meet"><path class="petal-a" d="M392 500C330 470 180 450 100 410C40 380 10 320 15 250C20 190 50 165 95 158C150 145 230 140 290 175C345 210 365 280 378 350C386 410 395 470 392 500Z"/><path class="petal-b" d="M392 500C380 430 370 330 400 240C430 150 480 80 560 40C630 10 700 5 740 30C780 60 790 130 785 190C780 250 740 310 690 350C620 400 500 450 392 500Z"/></svg>
  </div>
  <p>Your multi-line body copy here.<br>Image behind the section follows the scroll<br>Slowly swelling up.<br>Your very last line here.</p>
</section>
<div class="demo-spacer"></div>
<script>
(() => {
  const src = document.querySelector('[data-fx~="scrub-scale-grow"]');
  if (!src) return;
  const html = src.outerHTML.replace(/\sid="[^"]*"/g, "");
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => src.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical one comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
