<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>turn-wipe-slideshow — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-show { height: 70vh; margin: 20px; }
  .demo-show [data-fx-part="zoom"] { height: 100%; border: 0; }
  .demo-nav { position: absolute; left: 20px; right: 20px; bottom: 20px; z-index: 2; display: flex; align-items: center; gap: 16px; }
  .demo-nav [data-fx-part="bar"] { display: block; flex: 1; height: 1px; background: var(--kf-ink); }
</style>
</head>
<body>
<p class="demo-hint"><b>turn-wipe-slideshow</b> — The panel changes every 4.5 seconds. The wipe direction cycles left, up, left, down.</p>
<div class="demo-show" data-fx="turn-wipe-slideshow" data-fx-turn-wipe-slideshow="every: 3">
  <div data-fx-part="slide"><div data-fx-part="img"><div data-fx-part="zoom" class="wf-img" data-label="Office lounge · day · wide landscape"></div></div></div>
  <div data-fx-part="slide"><div data-fx-part="img"><div data-fx-part="zoom" class="wf-img" data-label="Building front · Evening blue light · Wide landscape"></div></div></div>
  <div data-fx-part="slide"><div data-fx-part="img"><div data-fx-part="zoom" class="wf-img" data-label="Round-light reception desk · interior · wide landscape"></div></div></div>
  <div class="demo-nav"><span data-fx-part="count"><span>1</span><span>2</span></span><span>/ 3</span><span data-fx-part="bar"></span></div>
</div>
<script>
(() => {
  const src = document.querySelector('[data-fx~="turn-wipe-slideshow"]');
  const html = src.outerHTML;
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => document.body.append(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  const empty = document.createElement("div");
  empty.dataset.fx = "turn-wipe-slideshow";
  document.body.append(empty);
  document.querySelector(".demo-hint").append(" · One more comes in after 1s, and one drops out after 2.5s.");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/CustomEase.min.js"></script>
<script>gsap.registerPlugin(CustomEase);</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
