<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>overlap-stack-slider — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); overflow-x: clip; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { padding: 60px 40px; }
  .card { width: 220px; height: 300px; margin-right: 16px; border-radius: 24px; background: var(--kf-surface); border: 1px solid var(--kf-line); display: grid; place-items: center; font: var(--kf-weight-display) 28px/1 var(--kf-font-display); }
</style>
</head>
<body>
<p class="demo-hint"><b>overlap-stack-slider</b> — Drag the card row to the left. Passed cards stack overlapping on the left, shrinking and tilting. <span>(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<div class="demo">
  <div data-fx="overlap-stack-slider"><div data-fx-part="list"><div class="card" data-fx-part="item">01</div><div class="card" data-fx-part="item">02</div><div class="card" data-fx-part="item">03</div><div class="card" data-fx-part="item">04</div><div class="card" data-fx-part="item">05</div></div></div>
</div>
<div class="demo" data-demo-remove><div data-fx="overlap-stack-slider" data-fx-overlap-stack-slider="rotate: 0"><div data-fx-part="list"><div class="card" data-fx-part="item">A</div><div class="card" data-fx-part="item">B</div></div></div></div>
<template data-demo-late><div class="demo"><div data-fx="overlap-stack-slider" data-fx-overlap-stack-slider="scale: .6"><div data-fx-part="list"><div class="card" data-fx-part="item">Go</div><div class="card" data-fx-part="item">Me</div><div class="card" data-fx-part="item">All</div></div></div></div></template>
<div class="demo"><div data-fx="overlap-stack-slider"></div></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/Draggable.min.js"></script>
<script src="../../../_shared/vendor/gsap/InertiaPlugin.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
