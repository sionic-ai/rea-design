<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cloud-reveal-strip — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { display: grid; gap: 48px; padding: 48px 0 400px; }
  .strip { width: min(100%, 400px); margin: 0 auto; padding: 40px 0; }
  .strip svg { overflow: visible; }
  .sketch { width: 100%; aspect-ratio: 1; }
  .photo.wf-img { width: 100%; aspect-ratio: 1; border-radius: 50%; }
  .puff { fill: var(--kf-surface); stroke: var(--kf-ink); stroke-width: 2; }
  .deco { fill: var(--kf-accent); stroke: var(--kf-ink); stroke-width: 2; }
</style>
</head>
<body>
<p class="demo-hint"><b>cloud-reveal-strip</b> — Just watch. The hand-drawn picture in the center cell grows, gets covered by clouds, turns into a photo, and the decorations pop out. <span style="color:var(--kf-dim)">(After 1s one more band comes in, and one leaves 2.5s later)</span></p>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="s-cloud" viewBox="0 0 70 40"><path class="puff" d="M14 38C6 38 2 32 4 26s10-8 12-6c0-10 10-16 18-14 6-6 20-4 22 6 8-1 13 6 11 13s-8 13-15 13z"/></symbol>
  <symbol id="s-dot" viewBox="0 0 40 40"><circle class="puff" cx="20" cy="20" r="17"/></symbol>
  <symbol id="s-star" viewBox="0 0 40 40"><path class="deco" d="M20 3l5 11 12 1-9 8 3 12-11-6-11 6 3-12-9-8 12-1z"/></symbol>
  <symbol id="s-sketch" viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" fill="none" stroke="currentColor" stroke-width="3" stroke-dasharray="6 5"/><path d="M34 46h8M58 46h8M38 64c8 6 16 6 24 0" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></symbol>
</svg>
<section class="demo">
  <div class="strip" data-fx="cloud-reveal-strip" style="--fx-item: 200px">
    <div data-fx-part="track">
      <figure data-fx-part="item"><svg class="sketch" data-fx-part="before" viewBox="0 0 100 100"><use href="#s-sketch"/></svg><div class="photo wf-img" data-fx-part="after" data-label="Photo 1"></div></figure>
      <figure data-fx-part="item"><svg class="sketch" data-fx-part="before" viewBox="0 0 100 100"><use href="#s-sketch"/></svg><div class="photo wf-img" data-fx-part="after" data-label="Photo 2"></div></figure>
      <figure data-fx-part="item"><svg class="sketch" data-fx-part="before" viewBox="0 0 100 100"><use href="#s-sketch"/></svg><div class="photo wf-img" data-fx-part="after" data-label="Photo 3"></div></figure>
    </div>
    <div data-fx-part="cloud">
      <svg viewBox="0 0 70 40" style="right:0;top:12px;width:200px"><use href="#s-cloud"/></svg>
      <svg viewBox="0 0 70 40" style="left:67px;top:106px;width:123px"><use href="#s-cloud"/></svg>
      <svg viewBox="0 0 70 40" style="left:4px;top:115px;width:86px"><use href="#s-cloud"/></svg>
      <svg viewBox="0 0 40 40" style="left:88px;top:141px;width:37px"><use href="#s-dot"/></svg>
    </div>
    <div data-fx-part="burst">
      <svg viewBox="0 0 40 40" data-key="270 0.35" style="left:9px;top:51px;width:36px"><use href="#s-star"/></svg>
      <svg viewBox="0 0 40 40" data-key="-270 0.35" style="left:198px;top:18px;width:36px"><use href="#s-star"/></svg>
      <svg viewBox="0 0 40 40" data-key="180 0.35" style="left:86px;top:221px;width:36px"><use href="#s-star"/></svg>
      <svg viewBox="0 0 40 40" data-key="0 0.2" style="left:239px;top:151px;width:17px"><use href="#s-star"/></svg>
    </div>
  </div>
  <div class="strip" data-demo-remove data-fx="cloud-reveal-strip" data-fx-cloud-reveal-strip="stop: 1.5; move: .5" style="--fx-item: 120px">
    <div data-fx-part="track">
      <figure data-fx-part="item"><svg class="sketch" data-fx-part="before" viewBox="0 0 100 100"><use href="#s-sketch"/></svg><div class="photo wf-img" data-fx-part="after" data-label="Exit band 1"></div></figure>
      <figure data-fx-part="item"><svg class="sketch" data-fx-part="before" viewBox="0 0 100 100"><use href="#s-sketch"/></svg><div class="photo wf-img" data-fx-part="after" data-label="Exit band 2"></div></figure>
    </div>
  </div>
  <template data-demo-late><div class="strip" data-fx="cloud-reveal-strip" data-fx-cloud-reveal-strip="swap: 1; grow: 1.1" style="--fx-item: 140px">
    <div data-fx-part="track">
      <figure data-fx-part="item"><svg class="sketch" data-fx-part="before" viewBox="0 0 100 100"><use href="#s-sketch"/></svg><div class="photo wf-img" data-fx-part="after" data-label="Late 1"></div></figure>
      <figure data-fx-part="item"><svg class="sketch" data-fx-part="before" viewBox="0 0 100 100"><use href="#s-sketch"/></svg><div class="photo wf-img" data-fx-part="after" data-label="Late 2"></div></figure>
      <figure data-fx-part="item"><svg class="sketch" data-fx-part="before" viewBox="0 0 100 100"><use href="#s-sketch"/></svg><div class="photo wf-img" data-fx-part="after" data-label="Late 3"></div></figure>
    </div>
    <div data-fx-part="cloud"><svg viewBox="0 0 70 40" style="left:0;top:20px;width:140px"><use href="#s-cloud"/></svg></div>
  </div></template>
</section>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
