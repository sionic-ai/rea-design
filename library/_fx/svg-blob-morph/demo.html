<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>svg-blob-morph — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 32px; padding: 48px 20px; }
  .demo svg { width: 100%; height: auto; overflow: visible; }
  .demo .soft { fill: var(--kf-accent-soft); }
  .demo .ink { fill: var(--kf-ink); }
  .clip { aspect-ratio: 980 / 600; clip-path: url(#demo-clip); }
  .clip .wf-img { height: 100%; }
</style>
</head>
<body>
<p class="demo-hint"><b>svg-blob-morph</b> — The blobs slowly undulate through three shapes over 15 seconds (each starting 1 second later). The last cell is a photo that uses the same shape as a clip-path window.</p>
<div class="demo">
  <svg viewBox="0 0 906 547"><path data-fx="svg-blob-morph" data-fx-svg-blob-morph="seed: 11; begin: 0"/></svg>
  <svg viewBox="0 0 878 642"><path class="soft" data-fx="svg-blob-morph" data-fx-svg-blob-morph="seed: 23; begin: 1"/></svg>
  <svg viewBox="0 0 420 420"><path class="ink" data-fx="svg-blob-morph" data-fx-svg-blob-morph="seed: 7; begin: 2; wobble: .18"/></svg>
  <div class="clip"><div class="wf-img" data-label="Video/photo · landscape 16:9"></div></div>
</div>
<svg width="0" height="0" aria-hidden="true"><clipPath id="demo-clip" clipPathUnits="objectBoundingBox"><path transform="scale(0.00102040816, 0.00166666666)" data-fx="svg-blob-morph" data-fx-svg-blob-morph="seed: 83; box: 980 600; wobble: .18"/></clipPath></svg>
<script>
// Late arrivals and removals — checks that fx-core attaches to an element added after 1s and detaches from an element removed after 2.5s
(() => {
  const grid = document.querySelector(".demo");
  const make = (seed) => { const t = document.createElement("template"); t.innerHTML = `<svg viewBox="0 0 626 456"><path data-fx="svg-blob-morph" data-fx-svg-blob-morph="seed: ${seed}"/></svg>`; return t.content.firstElementChild; };
  const gone = make(37);
  grid.append(gone);
  setTimeout(() => grid.append(make(41)), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s one more block comes in (a late arrival), and after 2.5s one drops out (detach).");
})();
</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
