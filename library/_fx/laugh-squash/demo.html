<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>laugh-squash — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .row { display: flex; gap: 60px; padding: 80px 40px; }
  .logo { display: grid; place-items: center; width: 220px; height: 220px; border-radius: 50%; background: var(--kf-accent); color: var(--kf-on-accent); font: 700 32px/1 var(--kf-font-display); }
</style>
</head>
<body>
<p class="demo-hint"><b>laugh-squash</b> — Just watch. The character squishes now and then as if laughing (first laugh at 1–3s) (1s later one attaches late, and 3s later the first one drops off).</p>
<div class="row" id="row">
  <div class="logo" data-fx="laugh-squash" data-fx-laugh-squash="first: 1-3">Character</div>
  <div class="logo" data-fx="laugh-squash" data-fx-laugh-squash="first: 1-2; every: 2-4">Smiles often</div>
</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
  setTimeout(() => {
    const row = document.getElementById("row");
    if (!row) return;
    const d = document.createElement("div");
    d.className = "logo"; d.textContent = "Late"; d.setAttribute("data-fx", "laugh-squash");
    row.append(d);
  }, 1000);
  setTimeout(() => document.querySelector(".logo")?.removeAttribute("data-fx"), 3000);
</script>
</body>
</html>
