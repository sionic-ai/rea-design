<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pin-step-fade — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.6 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 10; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .gap { height: 60vh; display: grid; place-items: center; color: var(--kf-dim); }
  .sec { display: grid; grid-template-columns: 1fr 1fr; align-items: center; gap: 40px; min-height: 100vh; padding: 0 60px; }
  .frame { aspect-ratio: 3 / 4; width: min(100%, 60vh); border-radius: var(--kf-radius-lg); overflow: hidden; }
  .ph { display: grid; place-items: center; background: var(--kf-raised); color: var(--kf-dim); font-size: 24px; }
  .ph:nth-child(2) { background: var(--kf-accent-soft); } .ph:nth-child(3) { background: var(--kf-line); }
  .bars { display: flex; flex-direction: column; gap: 6px; margin-top: 24px; } .bars i { position: relative; display: block; width: 3px; height: 84px; overflow: hidden; border-radius: 3px; background: var(--kf-line); } .bars span { position: absolute; top: 0; left: 0; width: 3px; height: 0; border-radius: 3px; background: var(--kf-accent); }
</style>
</head>
<body>
<p class="demo-hint"><b>pin-step-fade</b> — Scroll down. The section pins and photos overlap and swap one by one as you scroll. <span style="color:var(--kf-dim)">(After 1s one more photo comes in, and after 2.5s one slide leaves)</span></p>
<div class="gap">Downward</div>
<section class="sec" data-fx="pin-step-fade" data-fx-pin-step-fade="start: top 40px">
  <figure class="frame" data-fx-part="frame" id="frame"><div class="ph" data-fx-part="item">Photo 1</div><div class="ph" data-fx-part="item">Photo 2</div><div class="ph" data-fx-part="item">Photo 3</div></figure>
  <div><h2>Your title here</h2><p>Your two body lines here.</p><div class="bars"><i><span data-fx-part="bar"></span></i><i><span data-fx-part="bar"></span></i><i><span data-fx-part="bar"></span></i></div></div>
</section>
<section class="sec" data-fx="pin-step-fade" data-demo-remove><figure class="frame" data-fx-part="frame"><div class="ph" data-fx-part="item">Dropped Section</div></figure></section>
<section class="sec" data-fx="pin-step-fade"></section>
<div class="gap">Footer</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
gsap.registerPlugin(ScrollTrigger);
setTimeout(() => { const d = document.createElement("div"); d.className = "ph"; d.dataset.fxPart = "item"; d.textContent = "Late-arrived Photo"; document.getElementById("frame")?.append(d); }, 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
