<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pin-shrink-row — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo-spacer { height: 70vh; display: grid; place-items: center; color: var(--kf-dim); }
  .row { height: 300vh; padding: 0 20px; }
  .row [data-fx-part="item"] { height: 60vh; display: grid; place-items: center; border-radius: var(--kf-radius-lg); background: var(--kf-accent); color: var(--kf-on-accent); font: 700 32px/1 var(--kf-font-display); }
</style>
</head>
<body>
<p class="demo-hint"><b>pin-shrink-row</b> — Scroll down — the line sticks to the screen, cards shrink to 1/3 width one by one, and the next card comes in behind. <span style="color:var(--kf-dim)">(After 1s one more line comes in, and one leaves 2.5s later)</span></p>
<div class="demo-spacer">Scroll down</div>
<section class="row" data-demo-remove data-fx="pin-shrink-row"><div data-fx-part="sticky"><div data-fx-part="item">Card 1</div><div data-fx-part="item">Card 2</div><div data-fx-part="item">Card 3</div></div></section>
<section class="row" data-fx="pin-shrink-row" data-fx-pin-shrink-row="width: 48%" style="--fx-top: 5%; --fx-gap: 24px"><div data-fx-part="sticky"><div data-fx-part="item">Two 1</div><div data-fx-part="item">Two 2</div></div></section>
<template data-demo-late><section class="row" data-fx="pin-shrink-row"><div data-fx-part="sticky"><div data-fx-part="item">Late 1</div><div data-fx-part="item">Late 2</div><div data-fx-part="item">Late 3</div></div></section></template>
<div data-fx="pin-shrink-row"></div>
<div class="demo-spacer">Footer</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); window.ScrollTrigger?.refresh(); }, 2500);
</script>
</body>
</html>
