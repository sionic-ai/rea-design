<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ascii-mesh-cursor — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; padding: 20px; }
  .grid > div { min-height: 22rem; border: 1px solid var(--kf-line); }
  @media (max-width: 720px) { .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<p class="demo-hint"><b>ascii-mesh-cursor</b> — Move the mouse over the screen. A 3D comma made of letters turns its head toward the cursor (drag to rotate on the right).</p>
<div class="grid" id="grid">
  <div data-fx="ascii-mesh-cursor" data-fx-ascii-mesh-cursor="cols: 146; rows: 68"><pre data-fx-part="out" aria-hidden="true"></pre></div>
  <div data-fx="ascii-mesh-cursor" data-fx-ascii-mesh-cursor="follow: drag; shape: comma"><pre data-fx-part="out" aria-hidden="true"></pre></div>
  <div data-fx="ascii-mesh-cursor" data-fx-ascii-mesh-cursor="shape: box; cols: 60; rows: 30" data-demo-remove><pre data-fx-part="out" aria-hidden="true"></pre></div>
</div>
<template data-demo-late><div data-fx="ascii-mesh-cursor" data-fx-ascii-mesh-cursor="cols: 80; rows: 40"><pre data-fx-part="out" aria-hidden="true"></pre></div></template>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="three-global.js"></script>
<script src="../../_vendor/three@0.184.0/build/three.cjs"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => document.getElementById("grid").append(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
