<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>wipe-stack-pin — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .gap { height: 60vh; display: grid; place-items: center; color: var(--kf-dim); }
  article { display: grid; grid-template-columns: 1fr 1.3fr; align-items: center; gap: 4vw; padding: 0 6vw; }
  article:nth-child(1) [data-fx-part="bg"] { background: var(--kf-surface); }
  article:nth-child(2) [data-fx-part="bg"] { background: var(--kf-accent-soft); }
  article:nth-child(3) [data-fx-part="bg"] { background: var(--kf-raised); }
  [data-fx-part="text"], [data-fx-part="media"] { position: relative; }
  [data-fx-part="media"] { aspect-ratio: 16 / 10; border: 1px solid var(--kf-line); background: var(--kf-bg); }
  h3 { font: 600 40px/1.1 var(--kf-font-display); }
  ol { position: absolute; right: 2vw; top: 50%; translate: 0 -50%; z-index: 2; font: 500 11px/2 var(--kf-font-mono); }
</style>
</head>
<body>
<p class="demo-hint"><b>wipe-stack-pin</b> — Scroll down. The next panel rises from below and covers the previous one.</p>
<div class="gap">↓</div>
<section data-fx="wipe-stack-pin">
  <article data-fx-part="slide"><i data-fx-part="bg"></i><div data-fx-part="text"><h3>Panel One</h3><p>Your description here</p></div><div data-fx-part="media"></div></article>
  <article data-fx-part="slide"><i data-fx-part="bg"></i><div data-fx-part="text"><h3>Panel Two</h3><p>Your description here</p></div><div data-fx-part="media"></div></article>
  <article data-fx-part="slide"><i data-fx-part="bg"></i><div data-fx-part="text"><h3>Panel Three</h3><p>Your description here</p></div><div data-fx-part="media"></div></article>
  <ol><li data-fx-part="dot">01</li><li data-fx-part="dot">02</li><li data-fx-part="dot">03</li></ol>
</section>
<div class="gap">Footer</div>
<section data-demo-remove data-fx="wipe-stack-pin"><article data-fx-part="slide">Go</article><article data-fx-part="slide">Me</article></section>
<template data-demo-late><section data-fx="wipe-stack-pin" data-fx-wipe-stack-pin="per: .5"><article data-fx-part="slide"><i data-fx-part="bg"></i>Late-arriving panel 1</article><article data-fx-part="slide"><i data-fx-part="bg"></i>Late-arriving panel 2</article></section></template>
<section data-fx="wipe-stack-pin"></section>
<div class="gap"></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
