<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pill-widen-pin — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .gap { height: 80vh; display: grid; place-items: center; color: var(--kf-dim); }
  [data-fx-part="image"] { border: 0; }
</style>
</head>
<body>
<p class="demo-hint"><b>pill-widen-pin</b> — Scroll down. The pill-shaped photo stays fixed, widens to fill the screen, and its corners flatten out. <span style="color:var(--kf-dim)">(After 1s one more panel comes in, and one leaves 2.5s later)</span></p>
<div class="gap">Top margin</div>
<div data-fx="pill-widen-pin"><figure data-fx-part="frame"><div class="wf-img" data-fx-part="image" data-label="Ship cutting through waves · from above · 16:9"></div></figure></div>
<div class="gap">Between</div>
<div data-demo-remove data-fx="pill-widen-pin"><figure data-fx-part="frame"><div class="wf-img" data-fx-part="image" data-label="Being removed soon"></div></figure></div>
<div class="gap">Between</div>
<template data-demo-late><div data-fx="pill-widen-pin" data-fx-pill-widen-pin="to: 100%; height: 100vh; zoom: 1.15; scrub: .5"><figure data-fx-part="frame"><div class="wf-img" data-fx-part="image" data-label="Late-arriving panel"></div></figure></div></template>
<div data-fx="pill-widen-pin"></div>
<div class="gap">Bottom margin</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
gsap.registerPlugin(ScrollTrigger);
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
