<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>card-grow-stage — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-spacer { height: 80vh; display: grid; place-items: center; color: var(--kf-dim); }
  .demo-track { height: 300vh; }
  .demo-stage { position: sticky; top: 0; height: 100vh; background: var(--kf-contrast-bg); }
  .demo-stage [data-fx] { position: absolute; inset: 0; margin: auto; }
  .demo-media { background: linear-gradient(160deg, var(--kf-accent), var(--kf-ink)); color: var(--kf-contrast-ink); display: grid !important; place-items: center; font: 600 22px var(--kf-font-display); }
</style>
</head>
<body>
<p class="demo-hint"><b>card-grow-stage</b> — Scroll down. While the black stage comes in, the center card grows until it fills the screen.</p>
<div class="demo-spacer">↓ Scroll</div>
<section class="demo-track">
  <div class="demo-stage"><div data-fx="card-grow-stage"><div class="demo-media">Your video here</div></div></div>
</section>
<div class="demo-spacer">Footer</div>
<script>
(() => {
  const src = document.querySelector('[data-fx~="card-grow-stage"]');
  if (!src) return;
  const html = src.outerHTML;
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; el.style.opacity = ".6"; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => src.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1 second one more card comes in (a late arrival), and after 2.5 seconds one is removed (detach).");
})();
</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
