<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>minute-count-up — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .gap { height: 70vh; }
  .scene { height: 60vh; padding: 40px; border-top: 1px solid var(--kf-line); }
  .scene p { font: 300 40px/1 var(--kf-font-display); letter-spacing: 0.1em; }
</style>
</head>
<body>
<p class="demo-hint"><b>minute-count-up</b> — Scroll down. The clock fills in minute by minute from 30 minutes ahead, then stops. <span style="color:var(--kf-dim)">(One more scene comes in after 1s, and one drops out after 2.5s)</span></p>
<div class="gap"></div>
<section class="scene"><p data-fx="minute-count-up">18:00</p></section>
<section class="scene" data-demo-remove><p data-fx="minute-count-up" data-fx-minute-count-up="back: 10">21:00</p></section>
<span data-late-slot></span>
<section class="scene"><p data-fx="minute-count-up" data-time="0:00">Midnight</p></section>
<section class="scene"><p data-fx="minute-count-up">Non-visual text is left as is</p></section>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelector("[data-late-slot]").outerHTML = '<section class="scene"><p data-fx="minute-count-up">9:00</p></section>', 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
