<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>brush-edge-photo — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { display: grid; gap: 48px; padding: 48px 20px; max-width: 900px; margin: 0 auto; }
  .wide { aspect-ratio: 16 / 9; }
  .sq { aspect-ratio: 1; width: min(420px, 100%); margin: 0 auto; }
  .row { position: relative; padding: 28px 0; border-bottom: 1px solid var(--kf-line); font: 400 22px/1 var(--kf-font-display); }
  .row .ph { position: absolute; left: 20%; right: 20%; top: -60px; bottom: -60px; z-index: -1; }
</style>
</head>
<body>
<p class="demo-hint"><b>brush-edge-photo</b> — On open, the photo blooms out to brush-stroke edges. Hover over the lower row <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<section class="demo">
  <figure class="wide" data-fx="brush-edge-photo" data-label="Work cover scene · sunset sea · landscape 16:9"></figure>
  <div class="row">Your work name here<div class="ph" data-fx="brush-edge-photo" data-fx-brush-edge-photo="on: hover; dur: 1.2" data-label="Work scene · Dark forest · Landscape"></div></div>
  <div class="row">Second work name<div class="ph" data-fx="brush-edge-photo" data-fx-brush-edge-photo="on: hover; dur: 1.2" data-label="Work scene · Blue cave · Landscape"></div></div>
  <figure class="wide" data-fx="brush-edge-photo" data-demo-remove data-label="Soon-Removed Photo"></figure>
  <template data-demo-late><figure class="sq" data-fx="brush-edge-photo" data-fx-brush-edge-photo="look: blob" data-label="Next work · square blob"></figure></template>
  <figure class="wide" data-fx="brush-edge-photo"></figure>
</section>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
