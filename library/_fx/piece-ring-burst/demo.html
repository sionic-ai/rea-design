<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>piece-ring-burst — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { padding: 24px 20px 100vh; display: grid; gap: 16px; }
  .stage { height: 70vh; border: 1px solid var(--kf-line); display: grid; place-items: center; }
  .stage h2 { position: relative; z-index: 1; font: var(--kf-weight-display) 48px/1 var(--kf-font-display); transform: translateY(calc(var(--fx-burst, 0) * -40vh)); opacity: calc(1 - var(--fx-burst, 0)); }
</style>
</head>
<body>
<p class="demo-hint"><b>piece-ring-burst</b> — Pieces burst and settle into an elliptical ring. Move the mouse fast or press the panel, and scroll down.</p>
<div class="demo">
  <div class="stage" data-fx="piece-ring-burst"><h2>Your big one-liner here</h2></div>
</div>
<script>
// Late arrivals and removals — checks that fx-core attaches to an element added after 1s and detaches from an element removed after 2.5s
(() => {
  const src = document.querySelector('[data-fx~="piece-ring-burst"]');
  if (!src) return;
  const make = (tag) => { const el = document.createElement("div"); el.className = "stage"; el.dataset.fx = "piece-ring-burst"; el.dataset.fxPieceRingBurst = "step: 140"; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => src.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical panel comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../_vendor/three@0.148.0/build/three.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
