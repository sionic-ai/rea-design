<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sweep-fill-hover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 600 14px/1 var(--kf-font-sans); }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .row { display: flex; flex-wrap: wrap; gap: 16px; padding: 48px 20px; }
  .row a { display: inline-flex; padding: 18px 28px; border-radius: 4px; background: var(--kf-accent); color: var(--kf-on-accent); }
  .row a.is-pill { border-radius: 999px; }
</style>
</head>
<body>
<p class="demo-hint"><b>sweep-fill-hover</b> — Hover over the button and leave. A translucent veil fills from the left and rewinds toward the same side. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<div class="row">
  <a href="#" data-fx="sweep-fill-hover" data-fx-sweep-fill-hover="from: 0; in: 0.2"><span>Square button · 0 to .2s</span></a>
  <a href="#" class="is-pill" data-fx="sweep-fill-hover"><span data-fx-part="rect"></span><span>Pill · .75 to .32s</span></a>
  <a href="#" data-fx="sweep-fill-hover" data-demo-remove><span>Soon-Removed Button</span></a>
  <template data-demo-late><a href="#" class="is-pill" data-fx="sweep-fill-hover"><span>Late-arriving button</span></a></template>
</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
