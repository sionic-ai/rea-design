<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>initials-collapse — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .mark { display: block; padding: 24px 20px; font: var(--kf-weight-display) 96px/1 var(--kf-font-display); letter-spacing: -0.04em; color: var(--kf-ink); }
  .mark svg { width: 100%; max-width: 900px; height: auto; }
  .mark text { fill: var(--kf-ink); font-family: var(--kf-font-display); font-size: 160px; }
</style>
</head>
<body>
<p class="demo-hint"><b>initials-collapse</b> — After 2s only the initials remain and the rest disappear in turn. Hover over the name to unfold it again.</p>
<a class="mark" href="#" data-fx="initials-collapse">B<span data-fx-part="letter" style="--i:2">r</span><span data-fx-part="letter" style="--i:3">a</span><span data-fx-part="letter" style="--i:4">n</span><span data-fx-part="letter" style="--i:5">d</span> S<span data-fx-part="letter" style="--i:7">t</span><span data-fx-part="letter" style="--i:8">u</span><span data-fx-part="letter" style="--i:9">d</span><span data-fx-part="letter" style="--i:10">i</span><span data-fx-part="letter" style="--i:11">o</span></a>
<a class="mark" href="#" data-fx="initials-collapse" data-fx-initials-collapse="delay: 3"><svg viewBox="0 0 900 140" aria-label="Brand Studio"><text x="0" y="120">B<tspan data-fx-part="letter" style="--i:2">rand</tspan> S<tspan data-fx-part="letter" style="--i:3">tudio</tspan></text></svg></a>
<script>
(() => {
  const src = document.querySelector('[data-fx~="initials-collapse"]');
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = src.outerHTML; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => src.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical name comes in (a late arrival), and after 2.5s one is removed (detach).");
})();
</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
