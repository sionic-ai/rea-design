<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>shape-pick-drop — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; min-height: 100vh; }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-drop { position: relative; height: 70vh; overflow: hidden; }
  .demo-drop [data-fx-part="stage"] { position: absolute; inset: 0; }
  .demo-drop h2 { position: relative; z-index: 2; display: flex; gap: 6px; align-items: center; padding: 40px 20px; font-size: 40px; color: var(--kf-accent); }
  .demo-drop [data-fx-part="pick"] { border: 0; padding: 0 .3em; font: inherit; line-height: 1.3; }
  .demo-drop [data-fx-part="cursor"] { position: absolute; left: 30px; top: 100%; width: 14px; height: 14px; border-radius: 50%; background: var(--kf-ink); --fx-cursor-step: 1.5em; }
  .demo-drop [data-fx-part="clear"] { position: absolute; right: 16px; bottom: 16px; z-index: 2; height: 36px; padding: 0 16px; border: 0; border-radius: 4px; background: var(--kf-ink); color: var(--kf-bg); cursor: pointer; }
</style>
</head>
<body>
<p class="demo-hint"><b>shape-pick-drop</b> — Shapes fall and pile up on the right half. Press two letters of the title to drop that color and shape, and you can pick up and throw shapes with the mouse.</p>
<section class="demo-drop" data-fx="shape-pick-drop">
  <div data-fx-part="stage"></div>
  <h2>Here <span style="position:relative;display:flex;gap:6px"><button type="button" data-fx-part="pick">Line</button><button type="button" data-fx-part="pick">Choice</button><i data-fx-part="cursor"></i></span> Title</h2>
  <button type="button" data-fx-part="clear">CLEAR</button>
</section>
<div data-demo-late-host></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../_vendor/matter-js@0.20.0/matter.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Attach a late-added stage (no button) and then remove it to test
setTimeout(() => {
  const d = document.createElement("section");
  d.className = "demo-drop";
  d.style.height = "30vh";
  d.dataset.fx = "shape-pick-drop";
  d.dataset.fxShapePickDrop = "zone: full; first: 2; max: 1";
  document.querySelector("[data-demo-late-host]").append(d);
  setTimeout(() => d.remove(), 1500);
}, 1000);
</script>
</body>
</html>
