<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>water-level-curtain — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 50; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .stage { padding: 60px 20px; display: grid; gap: 24px; }
  .mark { display: flex; flex-wrap: wrap; width: 6.2em; gap: 0 .05em; font: 800 110px/1 var(--kf-font-display); color: var(--kf-accent); }
  .mark span { display: block; }
  html.wordmark-held .mark span { visibility: hidden; }
  .row { display: flex; gap: 16px; }
  .row a { padding: 10px 14px; border: 1px solid currentColor; }
</style>
</head>
<body>
<p class="demo-hint"><b>water-level-curtain</b> On open, the water drains and the text is revealed. Clicking the link below fills the water up, then it returns to this page and drains. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<main class="stage">
  <h1 class="mark"><span>W</span><span>A</span><span>T</span><span>E</span><span>R</span><span>F</span><span>A</span><span>L</span><span>L</span></h1>
  <div class="row"><a href="demo.html?again">Reopen this page (turn)</a></div>
</main>
<div data-fx="water-level-curtain" data-fx-water-level-curtain="letters: .mark span"><div data-fx-part="foam"></div><div data-fx-part="water"><div data-fx-part="bubbles"></div></div><div data-fx-part="word"><span data-fx-part="spout"><i></i><i></i><i></i></span></div></div>
<div data-fx="water-level-curtain" data-fx-water-level-curtain="mode: page; stage: .stage"><div data-fx-part="foam"></div><div data-fx-part="water"></div></div>
<div data-fx="water-level-curtain" data-fx-water-level-curtain="mode: page" data-demo-remove><div data-fx-part="water"></div></div>
<template data-demo-late><div data-fx="water-level-curtain" data-fx-water-level-curtain="mode: page"><div data-fx-part="water"></div></div></template>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); }, 2500);
</script>
</body>
</html>
