<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tilt-swap-cards — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  #box { display: flex; flex-wrap: wrap; gap: 80px; padding: 60px; }
  .deck { width: 260px; }
  .card { display: grid; place-items: center; height: 300px; padding: 16px; border-radius: 10px; background-color: var(--kf-surface); border: 1px solid var(--kf-line); }
  .ctl { display: flex; gap: 8px; margin-top: 16px; }
  .ctl button { padding: 4px 12px; border: 1px solid var(--kf-line); background: var(--kf-surface); }
</style>
</head>
<body>
<p class="demo-hint"><b>tilt-swap-cards</b> — The card tilts and changes every 3 seconds. The one on the right is stack type — press previous·next to try it. <span style="color:var(--kf-dim)">(After 1s one more panel comes in, and one leaves 2.5s later)</span></p>
<main id="box">
  <div class="deck" data-fx="tilt-swap-cards"><div data-fx-part="track"><div class="card">Card 1</div><div class="card">Card 2</div><div class="card">Card 3</div></div></div>
  <div class="deck" data-fx="tilt-swap-cards" data-fx-tilt-swap-cards="look: stack"><div data-fx-part="track"><div class="card">Work 1</div><div class="card">Work 2</div><div class="card">Work 3</div></div>
    <div class="ctl"><button type="button" data-fx-part="prev">Previous</button><button type="button" data-fx-part="next">Next</button></div></div>
  <div class="deck" data-fx="tilt-swap-cards" data-demo-remove><div data-fx-part="track"><div class="card">Panel to be removed soon</div><div class="card">2</div></div></div>
</main>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => { const s = document.createElement("div"); s.className = "deck"; s.dataset.fx = "tilt-swap-cards"; s.setAttribute("data-fx-tilt-swap-cards", "every: 2"); s.innerHTML = '<div data-fx-part="track"><div class="card">Late-arriving panel 1</div><div class="card">Late-arriving panel 2</div></div>'; document.getElementById("box").append(s); }, 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
