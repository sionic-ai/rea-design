<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>edge-window-widen — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: fixed; top: 0; left: 0; right: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-wrap { height: 400vh; }
  .demo-stage { position: sticky; top: 0; overflow: hidden; }
  .demo-stage [data-fx~="edge-window-widen"] { --fx-left: 70vw; }
  [data-fx-part="img"].wf-img { height: 100%; border: 0; }
</style>
</head>
<body>
<p class="demo-hint"><b>edge-window-widen</b> — Scroll down two or three screens. The narrow vertical window on the right opens to fill the screen.</p>
<div class="demo-wrap">
  <div class="demo-stage">
    <section data-fx="edge-window-widen" data-fx-edge-window-widen="start: 100% top; end: 300% bottom"><div data-fx-part="mask"><div class="wf-img" data-fx-part="img" data-label="Dark café interior · pendant lights · wide horizontal"></div></div></section>
  </div>
</div>
<script>
(() => {
  const src = document.querySelector('[data-fx~="edge-window-widen"]');
  const html = src.outerHTML;
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  document.body.append(gone);
  setTimeout(() => document.body.append(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  const empty = document.createElement("section");
  empty.dataset.fx = "edge-window-widen";
  document.body.append(empty);
  document.querySelector(".demo-hint").append(" · One more comes in after 1s, and one drops out after 2.5s.");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script>gsap.registerPlugin(ScrollTrigger);</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
