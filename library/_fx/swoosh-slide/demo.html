<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>swoosh-slide — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .stage { position: relative; height: 60vh; min-height: 320px; margin: 24px 20px; }
  .slide { position: absolute; inset: 0; border-radius: var(--kf-radius-md); overflow: hidden; }
  .slide [data-fx~="swoosh-slide"] { position: absolute; inset: 0; }
  .slide [data-fx-part="photo"] { height: 100%; }
  .sw-line { fill: none; stroke: var(--kf-accent); stroke-width: 26; stroke-linecap: round; }
  .sw-glow { fill: none; stroke: var(--kf-surface); stroke-width: 26; stroke-linecap: round; opacity: .8; }
</style>
</head>
<body>
<p class="demo-hint"><b>swoosh-slide</b> — The section changes every 3.7s. When it becomes current, the photo sinks, a wave line is drawn from the left, then light blooms once.</p>
<div class="stage">
  <div class="slide" data-active>
    <div data-fx="swoosh-slide">
      <div class="wf-img" data-fx-part="photo" data-label="Waiting room with framed flowers · warm light · landscape"></div>
      <div data-fx-part="line"><svg viewBox="0 0 1440 600" preserveAspectRatio="none"><path class="sw-line" d="M-20 420C240 300 420 520 720 400s520-260 760-120"/></svg></div>
      <div data-fx-part="glow"><svg viewBox="0 0 1440 600" preserveAspectRatio="none"><path class="sw-glow" d="M-20 420C240 300 420 520 720 400s520-260 760-120"/></svg></div>
    </div>
  </div>
  <div class="slide">
    <div data-fx="swoosh-slide">
      <div class="wf-img" data-fx-part="photo" data-label="Bright hallway · Curved wall · Landscape"></div>
      <div data-fx-part="line"><svg viewBox="0 0 1440 600" preserveAspectRatio="none"><path class="sw-line" d="M-20 420C240 300 420 520 720 400s520-260 760-120"/></svg></div>
    </div>
  </div>
</div>
<script>
// Moves the current-section indicator every 3.7 seconds (on the real site Swiper fade moves .swiper-slide-active)
(() => {
  const slides = [...document.querySelectorAll(".slide")];
  let i = 0;
  setInterval(() => { slides[i].removeAttribute("data-active"); i = (i + 1) % slides.length; slides[i].setAttribute("data-active", ""); slides.forEach((s, k) => s.style.zIndex = k === i ? 2 : 1); }, 3700);
})();
// Late arrivals and removals — checks that fx-core attaches to an element added after 1s and detaches from an element removed after 2.5s
(() => {
  const host = document.querySelector(".stage");
  const html = host.outerHTML;
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  host.after(gone);
  setTimeout(() => host.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical one comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
</body>
</html>
