<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hero-shrink-to-slot — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: fixed; top: 0; left: 0; right: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  [data-fx-part="box"] .wf-img { position: absolute; inset: 0; height: 100%; border: 0; }
  .demo-label { position: absolute; left: 30px; top: 50%; z-index: 2; color: var(--kf-on-accent); }
  .demo-dim { position: absolute; inset: 0; background: color-mix(in oklab, var(--kf-ink) 15%, transparent); }
  .demo-list { position: relative; z-index: 2; width: 80%; margin: 1000px auto 40vh; display: grid; gap: 80px; }
  .demo-list li .wf-img { aspect-ratio: 337 / 190; }
  .demo-mark { position: sticky; bottom: 36px; margin-left: 30px; margin-top: -12%; width: 38%; font: 700 9vw/1 var(--kf-font-display); color: color-mix(in oklab, var(--kf-ink) calc(var(--fx-p, 0) * 100%), var(--kf-on-accent)); z-index: 1; }
</style>
</head>
<body>
<p class="demo-hint"><b>hero-shrink-to-slot</b> — Scroll down. The full-bleed panel shrinks and settles into the first slot of the list.</p>
<section data-fx="hero-shrink-to-slot">
  <div data-fx-part="frame"><div data-fx-part="box"><div class="wf-img" data-label="Work photo · office lounge · full-width landscape"></div><div class="demo-dim" data-fx-part="dim"></div><p class="demo-label" data-fx-part="keep">1 / 3 · Client Name</p></div></div>
  <div style="height:60svh"></div>
  <div class="demo-mark" data-fx-part="mark">studio</div>
  <ul class="demo-list">
    <li data-fx-part="slot"><div class="wf-img"></div></li>
    <li><div class="wf-img" data-label="Work photo 2"></div></li>
    <li><div class="wf-img" data-label="Work photo 3"></div></li>
  </ul>
</section>
<script>
(() => {
  const src = document.querySelector('[data-fx~="hero-shrink-to-slot"]');
  const html = src.outerHTML;
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  document.body.append(gone);
  setTimeout(() => document.body.append(make("late")), 1000);
  setTimeout(() => { gone.remove(); ScrollTrigger.refresh(); }, 2500);
  const empty = document.createElement("section");
  empty.dataset.fx = "hero-shrink-to-slot";
  document.body.append(empty);
  document.querySelector(".demo-hint").append(" · After 1s one more section comes in, and after 2.5s one leaves.");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../../../_shared/vendor/gsap/CustomEase.min.js"></script>
<script>gsap.registerPlugin(ScrollTrigger, CustomEase);</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
