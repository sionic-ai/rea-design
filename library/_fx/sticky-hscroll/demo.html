<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sticky-hscroll — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .pad { height: 60vh; display: grid; place-items: center; }
  [data-fx-part="track"] > div { display: flex; align-items: center; justify-content: center; padding: 0 20px; }
  [data-fx-part="track"] .wf-img { width: 40vw; aspect-ratio: 4 / 3; }
</style>
</head>
<body>
<p class="demo-hint"><b>sticky-hscroll</b> — Scroll down. From the moment the section touches the screen, the photo strip slides sideways.</p>
<div class="pad">Top margin</div>
<section data-fx="sticky-hscroll" id="src"><div data-fx-part="sticky"><div data-fx-part="track">
  <div style="width:30vw">Your first post, three lines here</div>
  <div><span class="wf-img" data-label="Family photo · 4:3"></span></div>
  <div><span class="wf-img" data-label="Kid photo · 4:3"></span></div>
  <div><span class="wf-img" data-label="Park photo · 4:3"></span></div>
</div></div></section>
<div class="pad">Bottom margin</div>
<script>
(() => {
  const src = document.getElementById("src");
  const html = src.outerHTML.replace(/\sid="[^"]*"/g, "");
  const make = () => { const t = document.createElement("template"); t.innerHTML = html; return t.content.firstElementChild; };
  const gone = make();
  document.body.append(gone);
  setTimeout(() => document.body.append(make()), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s, one more strip comes in (the late one), and after 2.5s one drops out (the removal).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
