<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>arrow-disc-stalker — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { margin: 0; background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; margin: 0; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-spacer { height: 90vh; display: grid; place-items: center; color: var(--kf-dim); }

</style>
</head>
<body>
<p class="demo-hint"><b>arrow-disc-stalker</b> — When the mouse hovers over a link or button, the invisible dot grows into a 40px accent-color circle and the arrow follows late. data-cursor="image" On a row it becomes a 240px photo circle (1024px and up).</p>
<main style="padding:80px 20px;display:grid;gap:24px;max-width:760px">
  <p><a href="#" style="border-bottom:1px solid var(--kf-line)">Your link here</a> · <button type="button" style="height:40px;padding:0 16px;border:1px solid var(--kf-line);background:var(--kf-surface)">Button</button></p>
  <a href="#" data-cursor="image" data-cursor-label="Photo for this row · person walking, seen from behind" style="display:flex;justify-content:space-between;padding:32px 0;border-top:1px solid var(--kf-line);border-bottom:1px solid var(--kf-line)"><span>Menu row 1</span><span>Message</span></a>
</main>
<div class="ad-stalker" data-fx="arrow-disc-stalker"><span data-fx-part="cursor"></span><span data-fx-part="follower"></span></div>
<script>
// Late arrivals and removals — checks that fx-core attaches to an element added after 1s and detaches from an element removed after 2.5s
(() => {
  const src = document.querySelector('[data-fx~="arrow-disc-stalker"]');
  if (!src) return;
  const html = src.outerHTML.replace(/\sid="[^"]*"/g, "");
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const host = src.closest("[data-demo-host]") || src;
  const gone = make("gone");
  
  setTimeout(() => document.body.append(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical one comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
