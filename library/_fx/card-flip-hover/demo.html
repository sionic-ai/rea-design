<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>card-flip-hover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { display: flex; flex-wrap: wrap; gap: 32px; padding: 48px 20px; }
  .card { width: 220px; aspect-ratio: 324 / 504; }
  .card > [data-fx-part] { border-radius: var(--kf-radius-md); overflow: hidden; box-shadow: var(--kf-shadow-lift); background: var(--kf-surface); }
  .card .wf-img { height: 100%; border: 0; }
  .back { height: 100%; display: flex; flex-direction: column; justify-content: center; gap: 8px; padding: 20px; }
  .back b { color: var(--kf-accent); font-size: 18px; }
</style>
</head>
<body>
<p class="demo-hint"><b>card-flip-hover</b> — Hover over the cards (tap on phones). The third card is aria-disabled, so it doesn’t flip. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<section class="demo">
  <div class="card" data-demo-remove data-fx="card-flip-hover"><div data-fx-part="front"><div class="wf-img" data-label="Front side · portrait 2:3"></div></div><div data-fx-part="back"><div class="back"><b>Your name here</b><span>Your two-line back-side intro here</span></div></div></div>
  <div class="card" data-fx="card-flip-hover" data-fx-card-flip-hover="open: .4; close: .4"><div data-fx-part="front"><div class="wf-img" data-label="Front face · fast .4s"></div></div><div data-fx-part="back"><div class="back"><b>Your name here</b><span>Your two-line back-side intro here</span></div></div></div>
  <div class="card" data-fx="card-flip-hover" aria-disabled="true"><div data-fx-part="front"><div class="wf-img" data-label="Locked · aria-disabled"></div></div><div data-fx-part="back"><div class="back"><b>Your name here</b></div></div></div>
  <template data-demo-late><div class="card" data-fx="card-flip-hover"><div data-fx-part="front"><div class="wf-img" data-label="Late-arriving card"></div></div><div data-fx-part="back"><div class="back"><b>Your name here</b><span>Flips even when it arrives late</span></div></div></div></template>
</section>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
