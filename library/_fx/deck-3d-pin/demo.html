<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>deck-3d-pin — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo-spacer { height: 70vh; display: grid; place-items: center; color: var(--kf-dim); }
  .demo-deck-sec { position: relative; height: 100vh; display: grid; place-items: center; background: var(--kf-contrast-bg); color: var(--kf-contrast-ink); overflow: hidden; }
  .demo-deck { width: min(520px, 80vw); }
  .demo-card { display: flex; flex-direction: column; gap: 12px; padding: 14px; border: 10px solid var(--kf-accent); background: var(--kf-surface); color: var(--kf-ink); }
  .demo-card .wf-img { aspect-ratio: 16 / 10; }
  .demo-badge { position: absolute; right: 12%; top: 18%; display: grid; place-items: center; width: 110px; height: 110px; border-radius: 50%; background: var(--kf-accent); color: var(--kf-on-accent); font: 700 14px/1.2 var(--kf-font-display); text-align: center; }
  @media (max-width: 991px) { .demo-deck-sec { height: auto; padding: 48px 0; } .demo-deck { display: grid; gap: 16px; } }
</style>
</head>
<body>
<p class="demo-hint"><b>deck-3d-pin</b> — Scroll down. The section stays pinned as cards drop one at a time and the card behind comes forward. Move the mouse and the stack tilts (992px and up).</p>
<div class="demo-spacer">Top section</div>
<section class="demo-deck-sec" data-fx="deck-3d-pin">
  <div class="demo-deck" data-fx-part="deck">
    <article class="demo-card" data-fx-part="card"><div class="wf-img" data-label="Work hero shot 1 · landscape 16:10"></div><b>Your work name 1</b></article>
    <article class="demo-card" data-fx-part="card"><div class="wf-img" data-label="Work hero shot 2 · landscape 16:10"></div><b>Your work name 2</b></article>
    <article class="demo-card" data-fx-part="card"><div class="wf-img" data-label="Work hero shot 3 · landscape 16:10"></div><b>Your work name 3</b></article>
  </div>
  <span class="demo-badge" data-fx-part="badge">Returning<br>Badge</span>
</section>
<div class="demo-spacer">Lower section</div>
<script>
// Late arrivals and removals — checks that fx-core attaches to an element added after 1s and detaches from an element removed after 2.5s
(() => {
  const src = document.querySelector('[data-fx~="deck-3d-pin"]');
  if (!src) return;
  const html = src.outerHTML.replace(/\sid="[^"]*"/g, "");
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => (src.closest(".pin-spacer") || src).after(make("late")), 1000); // Once pinned the panel gets wrapped in a pin-spacer, so place it outside that
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical one comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
