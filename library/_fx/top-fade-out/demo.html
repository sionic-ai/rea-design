<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>top-fade-out — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 17px/2 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 1; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .poem { display: grid; gap: 60px; max-width: 560px; margin: 0 auto; padding: 40vh 20px 80vh; }
</style>
</head>
<body>
<p class="demo-hint"><b>top-fade-out</b> — Scroll down and paragraphs that reach the top of the screen fade out. Scroll back and they return.</p>
<div class="poem" data-fx="top-fade-out">
  <p data-fx-part="item">Your first paragraph here<br>Second line</p>
  <p data-fx-part="item">Your second paragraph here<br>Second line<br>Third line</p>
  <p data-fx-part="item" data-demo-remove>Paragraph to Be Removed</p>
  <p data-fx-part="item">Your fourth paragraph here</p>
  <p data-fx-part="item">Your fifth paragraph here<br>Second line</p>
</div>
<template data-demo-late><p data-fx="top-fade-out" style="max-width:560px;margin:0 auto 80vh;padding:0 20px">Late-arriving paragraph</p></template>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
