<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>skew-drop-in — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 16px/1.7 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 10; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .gap { height: 80vh; display: grid; place-items: center; color: var(--kf-dim); }
  .box { overflow: hidden; padding: 0 8vw; }
  .box h2 { display: inline-block; font: 400 clamp(48px, 7vw, 96px)/1 var(--kf-font-display); letter-spacing: .1em; }
</style>
</head>
<body>
<p class="demo-hint"><b>skew-drop-in</b> — Scroll down. The big headline slants down from above and settles. <span style="color:var(--kf-dim)">(One more title comes in after 1s, and one drops out after 2.5s)</span></p>
<div class="gap">Downward</div>
<div class="box"><h2 data-fx="skew-drop-in">Section</h2></div>
<div class="gap"></div>
<div class="box" data-demo-remove><h2 data-fx="skew-drop-in">Removed</h2></div>
<div class="box" id="late"></div>
<div class="gap"></div>
<template data-demo-late><h2 data-fx="skew-drop-in" data-fx-skew-drop-in="dur: .6; skew: -10">Late Title</h2></template>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => document.getElementById("late")?.append(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
