<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>holo-scan — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 30; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .stage { height: 260vh; padding: 40px 20px; }
  .sticky { position: sticky; top: 80px; display: grid; justify-items: center; gap: 12px; }
  .figure { width: min(360px, 80vw); aspect-ratio: 3 / 4; }
  .num { font: 500 20px/1 var(--kf-font-mono); }
  .row { display: flex; gap: 20px; padding: 40px 20px 120vh; }
  .row [data-fx] { width: 200px; aspect-ratio: 1; }
</style>
</head>
<body>
<p class="demo-hint"><b>holo-scan</b> — Scroll down and the figure turns into a hologram from toe to head while the number counts 000 → 100.</p>
<section class="stage" data-fx="holo-scan" data-fx-holo-scan="start: top top; end: bottom bottom">
  <div class="sticky" data-fx-part="target"><div class="figure wf-img" data-label="Standing person full body · front · vertical 3:4"></div></div>
  <p class="num" data-fx-part="count">000</p>
</section>
<div class="row">
  <div data-fx="holo-scan" data-fx-holo-scan="start: top 80%; end: top 20%"><div class="wf-img" style="height:100%" data-label="Product photo · 1:1"></div></div>
  <div data-fx="holo-scan" data-demo-remove><div class="wf-img" style="height:100%" data-label="Cell to Be Removed"></div></div>
  <template data-demo-late><div data-fx="holo-scan" data-fx-holo-scan="start: top 90%; end: top 40%"><div class="wf-img" style="height:100%" data-label="Late-arriving cell"></div></div></template>
</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
