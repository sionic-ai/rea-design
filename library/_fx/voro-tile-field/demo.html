<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>voro-tile-field — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { margin: 0; background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.6 var(--kf-font-sans); }
  .demo-hint { position: fixed; top: 0; left: 0; right: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .field { position: fixed; inset: 0; }
  .late { position: fixed; right: 20px; bottom: 20px; z-index: 5; width: 280px; height: 180px; border: 1px solid var(--kf-line); }
</style>
</head>
<body>
<p class="demo-hint"><b>voro-tile-field</b> — Move the cursor to an edge. The panel flows that way and the center cell grows and takes on color. Click to change the view, wheel to zoom. <span style="color:var(--kf-dim)">(After 1s one more small panel comes in, and after 2.5s one leaves)</span></p>
<div class="field" data-fx="voro-tile-field" data-fx-voro-tile-field="cell: 58; start: now"><canvas data-fx-part="canvas"></canvas></div>
<div class="late" data-fx="voro-tile-field" data-fx-voro-tile-field="cell: 30; start: now; cols: 24; rows: 16" data-demo-remove></div>
<template data-demo-late><div class="late" style="bottom:220px" data-fx="voro-tile-field" data-fx-voro-tile-field="cell: 36; start: now; cols: 24; rows: 16; bulge: 0"></div></template>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
