<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ripple-gradient-bg — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { padding: 24px 20px; display: grid; gap: 20px; }
  .stage { height: 70vh; border-radius: var(--kf-radius-md); }
  .small { height: 30vh; border-radius: var(--kf-radius-md); }
  .modes { display: flex; flex-wrap: wrap; gap: 8px; }
  .modes button { padding: 8px 14px; border: 1px solid var(--kf-line); border-radius: var(--kf-radius-pill); background: var(--kf-surface); color: var(--kf-ink); font: inherit; cursor: pointer; }
</style>
</head>
<body>
<p class="demo-hint"><b>ripple-gradient-bg</b> — Change the type with the buttons below. The color center and the water rings flow to their new positions over 3s. <span style="color:var(--kf-dim)">(After 1s one more small panel comes in, and after 2.5s one leaves)</span></p>
<section class="demo">
  <div class="modes"><button data-m="intro">intro</button><button data-m="top">top</button><button data-m="normal">normal</button><button data-m="navi">navi</button><button data-m="footer">footer</button></div>
  <div class="stage" data-fx="ripple-gradient-bg" data-mode="intro"></div>
  <div class="small" data-demo-remove data-fx="ripple-gradient-bg" data-mode="normal" data-fx-ripple-gradient-bg="speed: 2"></div>
  <template data-demo-late><div class="small" data-fx="ripple-gradient-bg" data-mode="footer" data-y="0.4"></div></template>
</section>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="three-global.js"></script>
<script src="../../_vendor/three@0.164.1/build/three.cjs"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
document.querySelectorAll("[data-m]").forEach((b) => b.addEventListener("click", () => { document.querySelector(".stage").dataset.mode = b.dataset.m; }));
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
