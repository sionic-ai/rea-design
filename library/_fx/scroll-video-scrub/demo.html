<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>scroll-video-scrub — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo-spacer { height: 70vh; display: grid; place-items: center; color: var(--kf-dim); }
  .demo-short { --fx-length: 160vh; }
</style>
</head>
<body>
<p class="demo-hint"><b>scroll-video-scrub</b> — Scroll down and the video plays forward, scroll up and it rewinds (the center number is the current section). <span style="color:var(--kf-dim)">(After 1s one more panel comes in, and one leaves 2.5s later)</span></p>
<div class="demo-spacer">Scroll down</div>
<div data-demo-remove data-fx="scroll-video-scrub" data-fx-scroll-video-scrub="src: demo.mp4" class="demo-short"><div data-fx-part="screen"></div></div>
<div data-fx="scroll-video-scrub" data-fx-scroll-video-scrub="src: demo.mp4"><div data-fx-part="screen"></div></div>
<template data-demo-late><div data-fx="scroll-video-scrub" data-fx-scroll-video-scrub="src: demo.mp4; speed: 4" class="demo-short"><div data-fx-part="screen"></div></div></template>
<div class="demo-spacer">Footer</div>
<script src="../../_vendor/scrolly-video@0.0.24/scrolly-video.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
