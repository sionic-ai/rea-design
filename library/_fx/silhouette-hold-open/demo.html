<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>silhouette-hold-open — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { margin: 0; background: var(--kf-contrast-bg); color: var(--kf-contrast-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: fixed; top: 0; left: 0; right: 0; z-index: 100; margin: 0; padding: 12px 20px; background: var(--kf-surface); color: var(--kf-ink); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-mono, var(--kf-font-mono)); }
  .demo-spacer { height: 100vh; display: grid; place-items: center; }
  .sh-stage { display: grid; place-items: center; background: var(--kf-bg); color: var(--kf-ink); font: 700 48px/1.2 var(--kf-font-display); }
  .sh-ghost { border: 2px dashed var(--kf-accent); border-radius: 50%; }
</style>
</head>
<body>
<p class="demo-hint"><b>silhouette-hold-open</b> — Scroll down and the hole grows, holds, then opens to the full screen.</p>
<div class="demo-spacer">Scroll down ↓</div>
<section data-fx="silhouette-hold-open" style="--fx-track: 350vh"><div data-fx-part="stage" class="sh-stage"><div data-fx-part="ghost" class="sh-ghost"></div><p>Your chapter beyond the hole here</p></div></section>
<div class="demo-spacer"></div>
<script>
// Late arrivals and removals — checks that fx-core attaches to an element added after 1s and detaches from an element removed after 2.5s
(() => {
  const src = document.querySelector('[data-fx~="silhouette-hold-open"]');
  if (!src) return;
  const html = src.outerHTML;
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => src.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical one comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>

<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
