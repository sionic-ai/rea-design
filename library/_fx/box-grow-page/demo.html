<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>box-grow-page — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-grid { display: flex; flex-wrap: wrap; }
  .demo-grid > * { display: flex; flex-direction: column; justify-content: space-between; width: 33.333%; height: 40vh; padding: 32px; }
  .demo-a { background: var(--kf-accent); color: var(--kf-on-accent); }
  .demo-b { background: var(--kf-accent-soft); }
  .demo-c { background: var(--kf-surface); }
  .demo-grid h2 { font-size: 22px; font-weight: 400; }
</style>
</head>
<body>
<p class="demo-hint"><b>box-grow-page</b> — Click a color box. It grows to panel size and then jumps to that anchor (#).</p>
<div class="demo-grid">
  <a class="demo-a" href="#about" data-fx="box-grow-page" data-fx-box-grow-page="w: 70vw; h: 94vh"><p>Who We Are</p><h2>Your one-line slogan here.</h2></a>
  <a class="demo-b" href="#team" data-fx="box-grow-page"><p>Team</p><h2>Your team line here.</h2></a>
  <div class="demo-c" data-fx="box-grow-page" data-fx-box-grow-page="w: 30vw; h: 47vh; dur: .4"><p>Work</p><h2><a href="#work">Your work link here</a></h2></div>
</div>
<script>
// Late arrivals and removals — checks that fx-core attaches to an element added after 1s and detaches from an element removed after 2.5s
(() => {
  const grid = document.querySelector(".demo-grid");
  const src = grid.querySelector(".demo-b");
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = src.outerHTML; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  grid.append(gone);
  setTimeout(() => grid.append(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s one more box comes in, and after 2.5s one drops out.");
  // It’s a demo, so reset right after moving on
  addEventListener("hashchange", () => setTimeout(() => { document.querySelectorAll("body > [aria-hidden=true]").forEach((g) => g.remove()); history.replaceState(null, "", location.pathname); location.reload(); }, 400));
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
