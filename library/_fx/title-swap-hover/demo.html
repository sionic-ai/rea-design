<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>title-swap-hover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { margin: 0; padding: 12px 20px; border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { padding: 24px 20px; }
  .head { margin: 0 0 20px; font-size: 32px; line-height: 1.1; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .cell { display: grid; place-items: center; aspect-ratio: 4 / 5; border: 1px solid var(--kf-line); background: var(--kf-surface); color: var(--kf-dim); }
</style>
</head>
<body>
<p class="demo-hint"><b>title-swap-hover</b> — Hover over the cells below. The name line above changes to that cell’s name, and returns .1s after you leave.</p>
<section class="demo" id="demo" data-fx="title-swap-hover">
  <p class="head" data-fx-part="title"><span data-fx-part="name">Studio Name</span> Your about text continues here.</p>
  <div class="grid" id="grid">
    <a class="cell" data-fx-part="item" data-title="Client One, Project Name">Cell 1</a>
    <a class="cell" data-fx-part="item" data-title="Client Two, Another Project">Cell 2</a>
    <a class="cell" id="gone" data-fx-part="item" data-title="Client Three, Third Work">Slot to be removed soon</a>
  </div>
</section>
<section class="demo" id="late-wrap"></section>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Checks whether it attaches to a late-arriving panel (after 1s) and whether removing the cell causes no error (after 2.5s)
(() => {
  setTimeout(() => {
    const late = document.createElement("div");
    late.setAttribute("data-fx", "title-swap-hover");
    late.innerHTML = '<p class="head" data-fx-part="title"><span data-fx-part="name">Late Studio</span> Late panel</p><div class="grid"><a class="cell" data-fx-part="item" data-title="Late Client, Late Work">Late cell</a></div>';
    document.getElementById("late-wrap").append(late);
  }, 1000);
  setTimeout(() => document.getElementById("gone")?.remove(), 2500);
  document.querySelector(".demo-hint").append(" · 1 second later one more panel comes in, and 2.5 seconds later one cell drops out.");
})();
</script>
</body>
</html>
