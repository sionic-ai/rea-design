<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>skew-chip-cycle — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { padding: 60px 24px; display: grid; gap: 32px; justify-items: start; }
  .title { display: flex; flex-direction: column; }
  .box { position: relative; display: inline-flex; align-items: center; height: 96px; padding: 0 14px; overflow: hidden; border: 1px solid var(--kf-ink); margin-top: -1px; font: 700 76px/1 var(--kf-font-display); }
  .box b { position: relative; z-index: 1; }
  button { padding: 8px 14px; border: 1px solid var(--kf-line); background: var(--kf-surface); }
</style>
</head>
<body>
<p class="demo-hint"><b>skew-chip-cycle</b> — Every 1.8s the box background is tinted in turn with tilted confetti. The buttons step the manual version to the next or previous color.</p>
<section class="demo">
  <div class="title" data-fx="skew-chip-cycle" data-fx-skew-chip-cycle="colors: --kf-accent --kf-accent-soft --kf-ink-soft --kf-surface">
    <span class="box"><span data-fx-part="chip" style="--fx-delay: .15s"></span><b>Something</b></span>
    <span class="box" style="align-self: flex-start"><span data-fx-part="chip" style="--fx-delay: .3s"></span><b>is</b></span>
    <span class="box" style="align-self: flex-start"><span data-fx-part="chip" style="--fx-delay: .45s"></span><b>Here</b></span>
  </div>
  <div id="manual" class="title" data-fx="skew-chip-cycle" data-fx-skew-chip-cycle="when: manual; colors: --kf-accent --kf-ink-soft --kf-accent-soft">
    <span class="box"><span data-fx-part="chip"></span><b>Manual</b></span>
  </div>
  <p><button type="button" id="prev">Front color</button> <button type="button" id="next">Next color</button></p>
</section>
<script>
  let n = 0;
  const send = (d) => { n = Math.max(0, n + d); document.getElementById("manual").dispatchEvent(new CustomEvent("fx:chip", { detail: { index: n } })); };
  document.getElementById("next").onclick = () => send(1);
  document.getElementById("prev").onclick = () => send(-1);
  setTimeout(() => { const t = document.querySelector(".title")?.cloneNode(true); if (t) document.querySelector(".demo")?.append(t); }, 1000);
  setTimeout(() => { const g = document.createElement("div"); g.dataset.fx = "skew-chip-cycle"; document.body.append(g); setTimeout(() => g.remove(), 1500); }, 1000);
</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
