<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>panel-drop-menu — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { margin: 0; padding: 12px 20px; border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  header { position: sticky; top: 0; z-index: 10; }
  .bar { position: relative; z-index: 4; display: flex; gap: 32px; padding: 20px 40px; }
  .bar button { border: 0; background: none; font-weight: 700; cursor: pointer; }
  [data-fx-part="panel"] { top: 0; }
  [data-fx-part="inner"] { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; padding: 90px 10vw 50px; }
  .card { aspect-ratio: 16 / 9; border-radius: var(--kf-radius-md); }
  .demo-spacer { height: 120vh; padding: 40px; color: var(--kf-dim); }
</style>
</head>
<body>
<p class="demo-hint"><b>panel-drop-menu</b> — Click “Menu 1” and “Menu 2”. A panel drops from the top and the background darkens. Click the dark area to close.</p>
<header>
  <ul class="bar">
    <li data-fx="panel-drop-menu"><button data-fx-part="trigger">Menu 1</button><div data-fx-part="panel"><div data-fx-part="inner"><a href="#" class="card wf-img" data-label="Card 1"></a><a href="#" class="card wf-img" data-label="Card 2"></a><a href="#" class="card wf-img" data-label="Card 3"></a></div><div data-fx-part="veil"></div></div></li>
    <li data-fx="panel-drop-menu"><button data-fx-part="trigger">Menu 2</button><div data-fx-part="panel"><div data-fx-part="inner"><a href="#" class="card wf-img" data-label="Card 4"></a><a href="#" class="card wf-img" data-label="Card 5"></a></div><div data-fx-part="veil"></div></div></li>
  </ul>
</header>
<div class="demo-spacer">Blank Paper</div>
<script>
// Late arrivals and removals: after 1 second one more menu item comes in, and after 2.5 seconds one drops out
(() => {
  const bar = document.querySelector(".bar"), src = bar.firstElementChild;
  const make = (t) => { const el = src.cloneNode(true); el.querySelector("button").textContent = t; return el; };
  const gone = make("Menu to be removed soon");
  bar.append(gone);
  setTimeout(() => bar.append(make("Late-arrived Menu")), 1000);
  setTimeout(() => gone.remove(), 2500);
})();
</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
