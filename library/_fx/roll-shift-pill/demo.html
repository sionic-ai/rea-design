<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>roll-shift-pill — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 500 15px/1.6 var(--kf-font-sans); margin: 0; }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-row { display: flex; gap: 20px; align-items: center; padding: 40px 20px; flex-wrap: wrap; }
  svg { display: block; }
</style>
</head>
<body>
<p class="demo-hint"><b>roll-shift-pill</b> — Hover over a button. The panel swells, the text rolls and pushes out, and the arrow turns diagonal. (After 1s one more button comes in and after 2.5s one drops out)</p>
<div class="demo-row" data-demo-late-host>
  <a data-fx="roll-shift-pill" href="#"><span data-fx-part="bg"></span><span data-fx-part="in"><span data-fx-part="text"><span data-fx-part="label">EXPLORE MORE</span><span data-fx-part="label-copy" aria-hidden="true">EXPLORE MORE</span></span><span data-fx-part="icon"><svg viewBox="0 0 20 20"><path d="M3 10h13M11 5l5 5-5 5" fill="none" stroke="currentColor" stroke-width="2"/></svg></span><span data-fx-part="icon-copy" aria-hidden="true"><svg viewBox="0 0 20 20"><path d="M3 10h13M11 5l5 5-5 5" fill="none" stroke="currentColor" stroke-width="2"/></svg></span></span></a>
  <a data-fx="roll-shift-pill" data-fx-roll-shift-pill="look: link" href="#"><span data-fx-part="in"><span data-fx-part="text"><span data-fx-part="label">Text link</span><span data-fx-part="label-copy" aria-hidden="true">Text link</span></span><span data-fx-part="icon"><svg viewBox="0 0 20 20"><path d="M5 15L15 5M7 5h8v8" fill="none" stroke="currentColor" stroke-width="2"/></svg></span><span data-fx-part="icon-copy" aria-hidden="true"><svg viewBox="0 0 20 20"><path d="M5 15L15 5M7 5h8v8" fill="none" stroke="currentColor" stroke-width="2"/></svg></span></span></a>
  <a data-fx="roll-shift-pill" href="#" data-demo-remove><span data-fx-part="bg"></span><span data-fx-part="in"><span data-fx-part="text"><span data-fx-part="label">Omitted button</span></span></span></a>
  <a data-fx="roll-shift-pill" href="#"></a>
</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script>
setTimeout(() => {
  const a = document.createElement("a");
  a.href = "#";
  a.dataset.fx = "roll-shift-pill";
  a.innerHTML = '<span data-fx-part="bg"></span><span data-fx-part="in"><span data-fx-part="text"><span data-fx-part="label">LATE</span><span data-fx-part="label-copy" aria-hidden="true">LATE</span></span></span>';
  document.querySelector("[data-demo-late-host]").append(a);
}, 1000);
setTimeout(() => document.querySelector("[data-demo-remove]")?.remove(), 2500);
</script>
</body>
</html>
