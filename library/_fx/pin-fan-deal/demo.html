<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pin-fan-deal — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 50; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-spacer { height: 90vh; display: grid; place-items: center; color: var(--kf-dim); }
  .deal { position: relative; padding: 40px 20px; text-align: center; }
  .deal h2 { font: 700 40px/1 var(--kf-font-display); }
  .deal ul { display: grid; grid-template-columns: repeat(4, 180px); justify-content: center; gap: 24px; margin-top: 30px; }
  .deal li { aspect-ratio: 315 / 341; padding: 16px; border-radius: var(--kf-radius-lg); background: var(--kf-accent); color: var(--kf-on-accent); text-align: left; font-weight: 700; }
</style>
</head>
<body>
<p class="demo-hint"><b>pin-fan-deal</b> — Scroll down. While the section is held, the card unfolds into place from a point below. <span style="color:var(--kf-dim)">(One more card comes in after 1s, and one drops out after 2.5s)</span></p>
<div class="demo-spacer">Downward</div>
<section class="deal" data-fx="pin-fan-deal">
  <h2>Section where cards fan out</h2>
  <ul>
    <li data-fx-part="card" style="--fx-tilt:-2.8">Card 1</li><li data-fx-part="card" style="--fx-tilt:-.4">Card 2</li><li data-fx-part="card" style="--fx-tilt:1.4">Card 3</li><li data-fx-part="card" style="--fx-tilt:2.7" data-demo-remove>Being removed soon</li>
    <li data-fx-part="card" style="--fx-tilt:-2.8">Card 5</li><li data-fx-part="card" style="--fx-tilt:-.4">Card 6</li><li data-fx-part="card" style="--fx-tilt:1.4">Card 7</li>
  </ul>
</section>
<div class="demo-spacer"></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script>gsap.registerPlugin(ScrollTrigger);</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => { const s = document.querySelector(".deal"), li = document.createElement("li"); li.dataset.fxPart = "card"; li.style.cssText = "--fx-tilt:2.7"; li.textContent = "Late-arrived card"; s.querySelector("ul").append(li); s.dataset.fx = ""; requestAnimationFrame(() => { s.dataset.fx = "pin-fan-deal"; }); }, 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); window.ScrollTrigger?.refresh(); }, 2500);
</script>
</body>
</html>
