<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sdf-glyph-morph — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .row { display: flex; gap: 80px; align-items: center; padding: 60px 40px; }
  .logo { width: 170px; height: 130px; display: flex; flex-direction: column; text-decoration: none; }
  .logo [data-fx-part="glyph"] { font-family: var(--kf-font-display); font-weight: 800; }
  .logo [data-fx-part="line"]:first-of-type { font: 500 32px/1 var(--kf-font-display); }
  .logo [data-fx-part="anchor"] { font: 400 42px/0.9 var(--kf-font-serif); margin: 6px 0 0 auto; }
  .logo [data-fx-part="line"]:last-of-type { font: italic 400 42px/0.9 var(--kf-font-serif); }
</style>
</head>
<body>
<p class="demo-hint"><b>sdf-glyph-morph</b> — Left starts with a name melting into a symbol (loader), right stands as a symbol and melts into the name and back every two diagonal wipes (about 20s). <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<div class="row">
  <a class="logo" href="#" data-fx="sdf-glyph-morph" data-fx-sdf-glyph-morph="intro: name"><span data-fx-part="glyph"></span><span data-fx-part="line">Firstname</span><span data-fx-part="anchor">Middle</span><span data-fx-part="line">Surname</span></a>
  <a class="logo" href="#" data-fx="sdf-glyph-morph" data-fx-sdf-glyph-morph="laps: 1; hold: 1.5"><span data-fx-part="glyph"></span><span data-fx-part="line">Studio</span><span data-fx-part="anchor">Name</span><span data-fx-part="line">Works</span></a>
  <a class="logo" href="#" data-demo-remove data-fx="sdf-glyph-morph" data-fx-sdf-glyph-morph="cycle: 0"><span data-fx-part="glyph"></span><span data-fx-part="line">Remove</span><span data-fx-part="anchor">Me</span><span data-fx-part="line">Soon</span></a>
  <template data-demo-late><a class="logo" href="#" data-fx="sdf-glyph-morph"><span data-fx-part="glyph"></span><span data-fx-part="line">Late</span><span data-fx-part="anchor">Arrival</span><span data-fx-part="line">Logo</span></a></template>
</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="three-global.js"></script>
<script src="../../_vendor/three@0.182.0/build/three.cjs"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
