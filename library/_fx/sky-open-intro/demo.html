<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sky-open-intro — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); min-height: 100vh; }
  .demo-hint { position: fixed; bottom: 0; left: 0; right: 0; z-index: 20; padding: 12px 20px; background: var(--kf-surface); border-top: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .sky { background: linear-gradient(var(--kf-accent), var(--kf-accent-soft)); }
  .body { position: relative; color: var(--kf-contrast-ink); width: 260px; }
  .head { font: 800 64px/0.95 var(--kf-font-display); position: relative; }
  .light { position: absolute; top: 6px; left: 4px; width: 12px; color: var(--kf-contrast-ink); }
  .skip { position: absolute; right: 24px; bottom: 60px; width: 56px; height: 56px; border-radius: 50%; border: 1px solid; color: var(--kf-contrast-ink); background: none; }
  .after { padding: 40px; }
</style>
</head>
<body>
<p class="after">This text becomes visible once the veil lifts. A marker is added below when fx:open is received.</p>
<section class="intro" data-fx="sky-open-intro" data-fx-sky-open-intro="hold: 6">
  <div class="sky" data-fx-part="sky"></div>
  <div class="body">
    <h1 class="head"><span><span data-fx-part="head">OVER</span></span><span><span data-fx-part="head">THE</span></span><span><span data-fx-part="head">SKY</span></span><svg class="light" data-fx-part="light" viewBox="0 0 18 26"><path d="M9 1 10.6 11.2 17 13 10.6 14.8 9 25 7.4 14.8 1 13 7.4 11.2Z"/></svg></h1>
    <p><span data-fx-part="copy">Tagline line one,</span><br><span data-fx-part="copy">Tagline line two</span></p>
    <p><span data-fx-part="body">Body, one line</span><br><span data-fx-part="body">Body, two lines</span></p>
  </div>
  <button class="skip" type="button" data-fx-part="skip">SKIP</button>
</section>
<p class="demo-hint"><b>sky-open-intro</b> — On open the opening plays and lifts after 6 seconds (SKIP lifts it right away).</p>
<script>
(() => {
  const src = document.querySelector('[data-fx~="sky-open-intro"]');
  if (!src || !src.parentNode) return;
  const host = src.parentNode;
  document.addEventListener("fx:open", () => { const p = document.createElement("p"); p.className = "after"; p.textContent = "fx:open received"; host.append(p); });
  const gone = src.cloneNode(true);
  host.append(gone);
  setTimeout(() => host.append(src.cloneNode(true)), 1000);
  setTimeout(() => gone.remove(), 2500);
})();
</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
