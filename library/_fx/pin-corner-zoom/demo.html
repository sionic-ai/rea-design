<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pin-corner-zoom — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); overflow-x: hidden; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo-spacer { height: 90vh; display: grid; place-items: center; color: var(--kf-dim); }
  .zoom-sec { margin-bottom: 40vh; padding: 0 8vw; }
  .zoom-sec [data-fx-part="pin"] { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; }
  .zoom-sec figure { position: relative; margin: 0 auto; width: min(80vw, 120vh); }
  .zoom-sec .wf-img { aspect-ratio: 1500 / 1052; }
  .zoom-sec .talk { position: absolute; inset: 0; display: grid; place-items: center; font: 700 22px/1 var(--kf-font-display); color: var(--kf-accent); }
  .zoom-sec h3 { min-height: 100vh; padding-top: 26vh; writing-mode: vertical-rl; font: 700 34px/2 var(--kf-font-sans); letter-spacing: .2em; }
</style>
</head>
<body>
<p class="demo-hint"><b>pin-corner-zoom</b> — On scroll the image is pinned and the speech bubble layer turns on, then is dragged to the bottom right at 1.5x to make room for the text.</p>
<div class="demo-spacer">Scroll down ↓</div>
<div class="zoom-sec" data-fx="pin-corner-zoom">
  <div data-fx-part="pin"><figure data-fx-part="zoom"><div class="wf-img" data-label="Isometric lounge illustration · landscape"></div><div class="talk" data-fx-part="overlay">Speech bubble overlap</div></figure></div>
  <h3>Let’s stop by for a moment<br>A Place to Gather Anytime</h3>
</div>
<div class="demo-spacer"></div>
<script>
// Late arrivals and removals — checks that fx-core attaches to an element added after 1s and detaches from an element removed after 2.5s
(() => {
  const src = document.querySelector('[data-fx~="pin-corner-zoom"]');
  const html = src.outerHTML.replace('data-fx="pin-corner-zoom"', 'data-fx="pin-corner-zoom" data-fx-pin-corner-zoom="x: -.390625"');
  const make = () => { const t = document.createElement("template"); t.innerHTML = html; return t.content.firstElementChild; };
  const gone = make();
  src.after(gone);
  setTimeout(() => document.body.lastElementChild.before(make()), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1 second, one more being pulled to the left comes in (the late one), and after 2.5 seconds one drops out (detach).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
