<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>depth-rise-stack — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .spacer { height: 60vh; display: grid; place-items: center; color: var(--kf-dim); }
  .demo { padding: 0 40px; background: var(--kf-raised); }
  .card { position: relative; height: 35.75rem; padding: 40px; border-radius: 20px; background: var(--kf-surface); overflow: hidden; display: flex; flex-direction: column; justify-content: space-between; }
  .card [data-fx-part="bg"] { position: absolute; inset: -8px 0 auto; text-align: center; font-size: 8rem; color: var(--kf-line); white-space: nowrap; }
  .card [data-fx-part="media"] { align-self: flex-end; width: 40%; height: 14rem; border-radius: 20px; background: var(--kf-raised); transform-origin: 100% 100%; }
</style>
</head>
<body>
<p class="demo-hint"><b>depth-rise-stack</b> — Scroll down. Cards rise from below and cover, and the previous card recedes into perspective. After 1s one more pile is added below, and after 2.5s an empty pile is removed.</p>
<div class="spacer">↓</div>
<section class="demo" data-fx="depth-rise-stack">
  <div data-fx-part="stage">
    <article class="card" data-fx-part="card"><div data-fx-part="bg">First Card</div><h3>Card 1</h3><div data-fx-part="media"></div></article>
    <article class="card" data-fx-part="card"><div data-fx-part="bg">Second Card</div><h3>Card 2</h3><div data-fx-part="media"></div></article>
    <article class="card" data-fx-part="card"><div data-fx-part="bg">Third Card</div><h3>Card 3</h3><div data-fx-part="media"></div></article>
  </div>
</section>
<section class="demo" data-fx="depth-rise-stack" data-demo-remove></section>
<div id="late"></div>
<template data-demo-late>
  <section class="demo" data-fx="depth-rise-stack" data-fx-depth-rise-stack="z-in: 15; z-back: -20; at: .5" style="--fx-height: 200vh">
    <div data-fx-part="stage">
      <article class="card" data-fx-part="card"><h3>Late card 1 · phone values</h3></article>
      <article class="card" data-fx-part="card"><h3>Late Card 2</h3></article>
    </div>
  </section>
</template>
<div class="spacer">Footer</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => document.getElementById("late").append(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
