<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>peek-up-hover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.7 var(--kf-font-sans); margin: 0; }
  .demo-hint { margin: 0; padding: 12px 20px; border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 40px; }
  .card { aspect-ratio: 4 / 5; display: flex; flex-direction: column; justify-content: flex-end; background: var(--kf-raised); border-radius: var(--kf-radius-sm); color: var(--kf-ink); text-decoration: none; }
  .card h3 { margin: 0 0 auto; padding: 12px; font: 400 26px/1 var(--kf-font-display); }
  .btn { display: inline-block; margin: 10px; padding: 6px 10px; background: var(--kf-surface); font: 500 11px/1 var(--kf-font-sans); text-transform: uppercase; }
</style>
</head>
<body>
<p class="demo-hint"><b>peek-up-hover</b> — Hover over a card. A button rises from below.</p>
<div class="grid" id="grid">
  <a class="card" href="#" data-fx="peek-up-hover"><h3>Project One</h3><div data-fx-part="window"><div data-fx-part="peek"><span class="btn">View more</span></div></div></a>
  <a class="card" href="#" data-fx="peek-up-hover" style="--fx-dur: .6s"><h3>Slow one</h3><div data-fx-part="window"><div data-fx-part="peek"><span class="btn">View more</span></div></div></a>
  <a class="card" id="gone" href="#" data-fx="peek-up-hover"><h3>Leaving</h3><div data-fx-part="window"><div data-fx-part="peek"><span class="btn">View more</span></div></div></a>
  <a class="card" href="#" data-fx="peek-up-hover"><h3>No window</h3></a>
</div>
<script src="../fx-core.js"></script>
<script>
(() => {
  setTimeout(() => document.getElementById("grid").insertAdjacentHTML("beforeend", '<a class="card" href="#" data-fx="peek-up-hover"><h3>Late card</h3><div data-fx-part="window"><div data-fx-part="peek"><span class="btn">View more</span></div></div></a>'), 1000);
  setTimeout(() => document.getElementById("gone")?.remove(), 2500);
})();
</script>
</body>
</html>
