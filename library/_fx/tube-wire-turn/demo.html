<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tube-wire-turn — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .story { height: 400vh; }
  .story [data-fx-part="stage"] { position: sticky; top: 0; height: 100vh; }
  .room { height: 200vh; }
  .room [data-fx-part="stage"] { position: sticky; top: 0; height: 100vh; }
  .card { width: 320px; height: 260px; margin: 40px 20px; border: 1px solid var(--kf-line); }
</style>
</head>
<body>
<p class="demo-hint"><b>tube-wire-turn</b> — Scroll down slowly. Four black dots stand up as a spinning vase, and below, three vases on a table are drawn.</p>
<section class="story" data-fx="tube-wire-turn"><div data-fx-part="stage"></div></section>
<section class="room" data-fx="tube-wire-turn" data-fx-tube-wire-turn="scene: room"><div data-fx-part="stage"></div></section>
<div class="card" id="card" data-fx="tube-wire-turn" data-fx-tube-wire-turn="path: front; scroll: off; tubes: 3"></div>
<script>
(() => {
  const late = document.createElement("div");
  late.className = "card";
  setTimeout(() => { late.setAttribute("data-fx", "tube-wire-turn"); late.setAttribute("data-fx-tube-wire-turn", "path: front; scroll: off; tubes: 2"); document.body.append(late); }, 1000);
  setTimeout(() => document.getElementById("card").remove(), 2500);
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
