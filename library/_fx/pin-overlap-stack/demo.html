<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pin-overlap-stack — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo-spacer { height: 90vh; display: grid; place-items: center; color: var(--kf-dim); }
  .stack { max-width: 1180px; margin: 0 auto; padding: 0 20px; }
  .stack > div { min-height: 70vh; padding: 64px 40px 160px; border-radius: var(--kf-radius-lg) var(--kf-radius-lg) 0 0; border: 1px solid var(--kf-line); }
  .stack > div + div { margin-top: -32px; }
  .stack > div:nth-child(1) { background: linear-gradient(to bottom, var(--kf-accent-soft), var(--kf-surface) 50%); }
  .stack > div:nth-child(2) { background: linear-gradient(to right, var(--kf-raised), var(--kf-surface)); width: 95%; }
  .stack > div:nth-child(3) { background: var(--kf-surface); width: 90%; }
  .stack h2 { font: 400 56px/1 var(--kf-font-display); }
</style>
</head>
<body>
<p class="demo-hint"><b>pin-overlap-stack</b> — Scroll down and a panel sticks to the top while the next panel rises to cover it (width 768px and up).</p>
<div class="demo-spacer">Scroll down ↓</div>
<section class="stack" data-fx="pin-overlap-stack">
  <div data-fx-part="block"><h2>Panel One</h2><p>Your two body lines here.</p></div>
  <div data-fx-part="block"><h2>Panel Two</h2><p>Your two body lines here.</p></div>
  <div><h2>Panel Three</h2><p>The last panel doesn’t stick and covers the others as it slides up.</p></div>
</section>
<div class="demo-spacer"></div>
<script>
(() => {
  const src = document.querySelector('[data-fx~="pin-overlap-stack"]');
  if (!src) return;
  const html = src.outerHTML.replace(/\sid="[^"]*"/g, "");
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => src.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical one comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
