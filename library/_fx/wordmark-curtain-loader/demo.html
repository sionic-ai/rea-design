<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>wordmark-curtain-loader — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: relative; z-index: 2; margin: 0; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .mark { display: flex; justify-content: space-between; height: 18vw; overflow: visible; }
  .mark span { display: block; font: 800 22vw/0.82 var(--kf-font-display); letter-spacing: -0.04em; }
  .page-mark { margin: 0 4vw; transform: translateY(calc(100dvh - 40vh)); }
  .hero { height: 70vh; margin-top: 4vh; overflow: hidden; }
  .hero > div { height: 100%; }
  .loader { --fx-top: calc(20vw - 18vw + 46px); --fx-left: 4vw; --fx-right: 4vw; --fx-drop: calc(100dvh - 40vh); --fx-veil-top: calc(18vw + 46px + 4vh); }
  .loader [data-fx-part="mark"] { justify-content: space-between; height: 18vw; }
  .late { padding: 20px; }
</style>
</head>
<body>
<p class="demo-hint"><b>wordmark-curtain-loader</b> — When opened, after 1.2 seconds the wordmark rises over the curtain and the curtain lifts. On a same-tab reload, the session option skips the curtain and jumps to the end state (off in the demo).</p>
<div class="mark page-mark" data-page-mark><span>W</span><span>O</span><span>R</span><span>D</span><span>M</span><span>A</span><span>R</span><span>K</span></div>
<div class="hero"><div class="wf-img" data-hero-zoom data-label="Hero landscape photo · full-width landscape"></div></div>
<div class="loader" data-fx="wordmark-curtain-loader" data-fx-wordmark-curtain-loader="page: [data-page-mark]; zoom: [data-hero-zoom]">
  <div data-fx-part="curtain"><div data-fx-part="mark" class="mark"><span>W</span><span>O</span><span>R</span><span>D</span><span>M</span><span>A</span><span>R</span><span>K</span></div></div>
  <div data-fx-part="veil"></div>
</div>
<div data-demo-remove data-fx="wordmark-curtain-loader"></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
document.addEventListener("fx:done", (e) => { if (e.target.classList.contains("loader")) document.body.insertAdjacentHTML("beforeend", '<p class="late">fx:done received</p>'); });
setTimeout(() => document.body.insertAdjacentHTML("beforeend", '<div class="late" data-fx="wordmark-curtain-loader" data-fx-wordmark-curtain-loader="wait: 0"><div data-fx-part="curtain" style="display:none"></div></div>'), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
