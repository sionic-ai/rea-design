<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pick-ring-spring — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .stage { display: grid; gap: 28px; padding: 48px 20px; }
  .row { display: inline-flex; gap: 19px; width: fit-content; }
  .sw { width: 39px; height: 39px; padding: 0; border: 0; border-radius: 50%; background: var(--kf-accent); cursor: pointer; font: 700 15px/1 var(--kf-font-sans); color: var(--kf-on-accent); }
  .sw:nth-child(2) { background: var(--kf-ink); } .sw:nth-child(3) { background: var(--kf-dim); } .sw:nth-child(4) { background: var(--kf-line); }
  .out { font: 500 13px/1 var(--kf-font-mono); color: var(--kf-dim); }
</style>
</head>
<body>
<p class="demo-hint"><b>pick-ring-spring</b> — Click a swatch. The ring glides over with a spring. Hover and the swatch swells 1.2x (arrow keys work too).</p>
<div class="stage">
  <div class="row" role="radiogroup" aria-label="Sample" data-fx="pick-ring-spring">
    <button class="sw" type="button" role="radio" aria-checked="true" data-value="one" aria-label="One"></button>
    <button class="sw" type="button" role="radio" aria-checked="false" data-value="two" aria-label="Both"></button>
    <button class="sw" type="button" role="radio" aria-checked="false" data-value="three" aria-label="Three (native Korean)"></button>
    <button class="sw" type="button" role="radio" aria-checked="false" data-value="four" aria-label="Four"></button>
  </div>
  <p class="out">Selected: one</p>
</div>
<script>
(() => {
  document.addEventListener("fx:pick", (e) => { document.querySelector(".out").textContent = "Chosen: " + e.detail.value; });
  const src = document.querySelector('[data-fx~="pick-ring-spring"]');
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = src.outerHTML; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => src.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical row comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
