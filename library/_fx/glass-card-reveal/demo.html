<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>glass-card-reveal — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-surface); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { padding: 12px 20px; border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .row { display: grid; grid-template-columns: repeat(3, minmax(0, 260px)); gap: 20px; padding: 32px 20px; }
  .thumb { aspect-ratio: 3 / 4; }
  .tag { display: inline-block; padding: 2px 5px; border-radius: var(--kf-radius-sm); background: var(--kf-raised); font-size: 12px; }
  .desc { position: relative; font-size: 13px; color: var(--kf-dim); }
</style>
</head>
<body>
<p class="demo-hint"><b>glass-card-reveal</b> — Hover over a card (glass film, small photo, tag, title band).</p>
<div class="row" id="row">
  <a href="#" data-fx="glass-card-reveal">
    <div data-fx-part="media"><div data-fx-part="thumb"><div class="wf-img thumb" data-label="Work photo · Vertical 3:4"></div></div><div data-fx-part="veil"><div data-fx-part="pop"><div class="wf-img" style="aspect-ratio:4/5" data-label="Small screen"></div></div></div><div data-fx-part="feats"><span class="tag">Multilingual</span><span class="tag">Find</span><span class="tag">Steamed</span></div></div>
    <h6 data-fx-part="title">Work name</h6>
    <div class="desc"><p data-fx-part="text">Your one-line description here</p><div data-fx-part="swap"><span class="tag">Business type</span></div></div>
  </a>
  <a href="#" data-fx="glass-card-reveal" data-demo-remove>
    <div data-fx-part="media"><div data-fx-part="thumb"><div class="wf-img thumb" data-label="Card to Be Removed"></div></div></div>
    <h6 data-fx-part="title">Erased Soon</h6>
  </a>
</div>
<template data-demo-late><a href="#" data-fx="glass-card-reveal" style="--fx-zoom: 1.1"><div data-fx-part="media"><div data-fx-part="thumb"><div class="wf-img thumb" data-label="Late-arriving card"></div></div><div data-fx-part="veil"></div></div><h6 data-fx-part="title">Enters late</h6></a></template>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => document.getElementById("row").append(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
