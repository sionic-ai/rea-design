<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>band-sweep-btn — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { display: flex; flex-wrap: wrap; gap: 24px; padding: 48px 20px; align-items: center; }
  .demo-btn { display: inline-flex; align-items: center; padding: 14px 26px; border-radius: var(--kf-radius-pill); text-decoration: none; font: 540 16px/1 var(--kf-font-sans); }
  .demo-btn.is-bar { border-radius: var(--kf-radius-sm); min-width: 320px; justify-content: space-between; }
</style>
</head>
<body>
<p class="demo-hint"><b>band-sweep-btn</b> — Hover over the button — four color bands sweep across diagonally and the letters pop up one by one. After 1 second one more button comes in and one drops out.</p>
<section class="demo" id="demo">
  <a class="demo-btn" href="#" data-fx="band-sweep-btn"><span data-fx-part="label">Get started free</span></a>
  <a class="demo-btn is-bar" href="#" data-fx="band-sweep-btn" data-fx-band-sweep-btn="speed: 1; tilt: 4"><span data-fx-part="label">Try it free for 14 days</span><span aria-hidden="true">↗</span></a>
  <a class="demo-btn" href="#" data-fx="band-sweep-btn" id="gone"><span data-fx-part="label">Button to Be Removed</span></a>
  <a class="demo-btn" href="#" data-fx="band-sweep-btn"></a>
</section>
<script>
  setTimeout(() => {
    const a = document.createElement("a");
    a.className = "demo-btn"; a.href = "#"; a.dataset.fx = "band-sweep-btn";
    a.innerHTML = '<span data-fx-part="label">Late-arriving button</span>';
    document.getElementById("demo").append(a);
    document.getElementById("gone")?.remove();
  }, 1000);
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
