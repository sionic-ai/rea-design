<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ring-sway-cursor — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { height: 70vh; margin: 24px 0; background: var(--kf-contrast-bg); color: var(--kf-contrast-ink); display: grid; place-items: center; }
  .demo [data-fx-part="ring"] { position: absolute; top: 50%; left: 50%; }
  .r1 { width: 110vh; height: 110vh; margin: -62vh 0 0 -60vh; }
  .r2 { width: 88vh; height: 88vh; margin: -46vh 0 0 -43vh; }
  .demo h2 { position: relative; font-size: 48px; }
</style>
</head>
<body>
<p class="demo-hint"><b>ring-sway-cursor</b> — Move the mouse over the dark panel. Two circles are pushed in staggered fashion, spin and stretch. 1 second later one more panel attaches below, and 2.5 seconds later an empty panel drops out.</p>
<section class="demo" data-fx="ring-sway-cursor"><i class="r1" data-fx-part="ring"></i><i class="r2" data-fx-part="ring"></i><h2>Your title here</h2></section>
<section class="demo" data-fx="ring-sway-cursor" data-demo-remove></section>
<div id="late"></div>
<template data-demo-late>
  <section class="demo" data-fx="ring-sway-cursor" data-fx-ring-sway-cursor="amp: 2; dur: .6"><i class="r1" data-fx-part="ring"></i><i class="r2" data-fx-part="ring" data-rot="-10"></i><h2>Delayed panel · double</h2></section>
</template>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => document.getElementById("late").append(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
