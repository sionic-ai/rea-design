<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>momentum-flick — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { padding: 48px 20px; }
  .demo-spacer { height: 90vh; display: grid; place-items: center; color: var(--kf-dim); }

  .cloud { display: flex; flex-wrap: wrap; gap: 28px; max-width: 760px; margin: 80px auto; justify-content: center; }
  .tag { padding: 0 14px; height: 30px; line-height: 30px; border-radius: 99px; background: var(--kf-surface); border: 1px solid var(--kf-line); font: 600 12px/30px var(--kf-font-display); text-transform: uppercase; }
</style>
</head>
<body>
<p class="demo-hint"><b>momentum-flick</b> — Sweep quickly over a tag — it bounces in the direction you passed and returns. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<section class="demo"><div class="cloud">
  <a data-demo-remove class="tag" data-fx="momentum-flick" href="#">Keyword 1</a><a class="tag" data-fx="momentum-flick" href="#">Keyword 1</a><template data-demo-late><a class="tag" data-fx="momentum-flick" href="#">Keyword 1</a></template><a class="tag" data-fx="momentum-flick" href="#">Keyword 2</a><a class="tag" data-fx="momentum-flick" href="#">Your keyword here</a>
  <a class="tag" data-fx="momentum-flick" href="#">Keyword 4</a><a class="tag" data-fx="momentum-flick" href="#" data-fx-momentum-flick="power: 60">Hard Bounce</a><a class="tag" data-fx="momentum-flick" href="#">Keyword 6</a>
</div></section>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/InertiaPlugin.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); window.ScrollTrigger?.refresh(); }, 2500);
</script>
</body>
</html>
