<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>radar-sweep — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { padding: 48px 20px; display: grid; gap: 32px; max-width: 640px; margin: 0 auto; }
  .radar { aspect-ratio: 16 / 9; border: 1px solid var(--kf-line); border-radius: var(--kf-radius-md); }
  .radar [data-fx-part="pill"] { display: flex; align-items: center; gap: 8px; height: 28px; padding: 0 10px 0 12px; border: 1px solid var(--kf-line); border-radius: var(--kf-radius-pill); background: var(--kf-surface); font-size: 12.5px; color: var(--kf-dim); box-shadow: var(--kf-shadow-soft); }
  .radar [data-fx-part="pill"] b { font-weight: 500; color: var(--fx-radar-sweep-tone); }
</style>
</head>
<body>
<p class="demo-hint"><b>radar-sweep</b> — A needle makes one turn every 10 seconds and lights up the points it passes. <span style="color:var(--kf-dim)">(After 1s one more panel comes in, and one leaves 2.5s later)</span></p>
<section class="demo">
  <div class="radar" data-fx="radar-sweep">
    <div data-fx-part="blip" data-tone="bad" style="left:44%;top:10%"><span data-fx-part="pill">Record name 01 <b>Block</b></span></div>
    <div data-fx-part="blip" data-tone="ok" data-side="left" style="left:72%;top:22%"><span data-fx-part="pill">Record name 02 <b>Allowed</b></span></div>
    <div data-fx-part="blip" data-tone="bad" style="left:20%;top:30%"><span data-fx-part="pill">Record name 03 <b>Block</b></span></div>
    <div data-fx-part="blip" data-tone="warn" data-side="left" style="left:79%;top:39%"><span data-fx-part="pill">Record name 04 <b>Confirm</b></span></div>
  </div>
  <div class="radar" data-fx="radar-sweep" data-fx-radar-sweep="sweep: 4" data-demo-remove>
    <div data-fx-part="blip" data-tone="ok" style="left:30%;top:20%"><span data-fx-part="pill">4s per turn</span></div>
  </div>
  <template data-demo-late><div class="radar" data-fx="radar-sweep"><div data-fx-part="blip" style="left:60%;top:30%"></div></div></template>
  <div data-fx="radar-sweep"></div>
</section>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
