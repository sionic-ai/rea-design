<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gate-widen-panels — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .gate { height: 70vh; margin: 20px; }
  .ph { background: linear-gradient(135deg, var(--kf-raised), var(--kf-dim)); }
  .txt { position: absolute; z-index: 2; left: 40px; top: 50%; transform: translateY(-50%); color: var(--kf-contrast-ink); font-size: 28px; }
  .txt small { display: block; margin-top: .8em; font-size: 14px; }
  @media (max-width: 767px) { .gate { flex-direction: column; row-gap: 10px; } .gate [data-fx-part="panel"] { width: 100%; height: 50%; } }
</style>
</head>
<body>
<p class="demo-hint"><b>gate-widen-panels</b> — Hover the narrow panel on the right. It widens, the blurred image sharpens and the name rolls over.</p>
<nav class="gate" data-fx="gate-widen-panels">
  <a href="#a" data-fx-part="panel" style="--fx-w: 80%">
    <span class="ph" data-fx-part="media"></span>
    <span class="txt"><span data-fx-part="roll"><span>First Branch</span><span>First Site</span></span><small data-fx-part="roll"><span>Your one-line description here</span><span>Site One</span></small></span>
    <span data-fx-part="dot"></span>
  </a>
  <a href="#b" data-fx-part="panel" style="--fx-w: 20%; --fx-open: 66.4%">
    <span class="ph" data-fx-part="media"></span>
    <span class="txt"><span data-fx-part="roll"><span>Second Branch</span><span>Second Site</span></span><small data-fx-part="roll"><span>Your one-line description here</span><span>Site Two</span></small></span>
    <span data-fx-part="dot"></span>
  </a>
</nav>
<script>
(() => {
  const src = document.querySelector('[data-fx~="gate-widen-panels"]');
  if (!src || !src.parentNode) return;
  const gone = src.cloneNode(true);
  src.after(gone);
  setTimeout(() => src.parentNode && src.parentNode.append(src.cloneNode(true)), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s one more panel group comes in, and after 2.5s one drops out.");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
