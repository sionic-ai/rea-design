<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ascii-noise-field — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-stage { height: 70vh; margin: 20px; background: var(--kf-contrast-bg); display: flex; align-items: flex-end; padding: 32px; box-sizing: border-box; }
  .demo-stage p { position: relative; z-index: 1; margin: 0; font: 400 20px/1.4 var(--kf-font-display); }
  .demo-small { height: 30vh; }
</style>
</head>
<body>
<p class="demo-hint"><b>ascii-noise-field</b> — Move the mouse over the black panel. Nearby letters brighten and leave a trail.</p>
<section class="demo-stage" data-fx="ascii-noise-field"><p>Your footer line here</p></section>
<section class="demo-stage demo-small" data-fx="ascii-noise-field" data-fx-ascii-noise-field="density: .5; opacity: .5; speed: .3" data-demo-remove><p>Panel to Be Removed</p></section>
<template data-demo-late><section class="demo-stage demo-small" data-fx="ascii-noise-field" data-fx-ascii-noise-field="chars: 01; size: 12; angle: 30"><p>Late panel</p></section></template>
<section class="demo-stage demo-small" data-fx="ascii-noise-field" data-fx-ascii-noise-field="chars: "></section>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
