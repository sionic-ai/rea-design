<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>peel-scrub — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-spacer { height: 80vh; display: grid; place-items: center; color: var(--kf-dim); }
  .sec { margin: 0 20px 40px; padding: 60px 40px; min-height: 60vh; background: var(--kf-contrast-bg); color: var(--kf-contrast-ink); }
  .sec h2 { font: 500 48px/1 var(--kf-font-display); }
</style>
</head>
<body>
<p class="demo-hint"><b>peel-scrub</b> — Scroll down. The section grows from faint and small up to 60% of screen height as it unfolds. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<div class="demo-spacer">Downward</div>
<section class="sec" data-fx="peel-scrub"><h2>News</h2><p>Your section content goes here, two lines.</p></section>
<section class="sec" data-demo-remove data-fx="peel-scrub"><h2>Dropped Section</h2></section>
<section class="sec" data-fx="peel-scrub" data-fx-peel-scrub="end: 40; blur: 12"><h2>Service</h2><p>A form that unfolds later and looks fainter.</p></section>
<template data-demo-late><section class="sec" data-fx="peel-scrub"><h2>Late section</h2></section></template>
<div class="demo-spacer"></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); window.ScrollTrigger?.refresh(); }, 2500);
</script>
</body>
</html>
