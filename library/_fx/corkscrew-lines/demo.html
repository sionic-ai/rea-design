<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>corkscrew-lines — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { margin: 0; background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.3 var(--kf-font-sans); }
  .demo-hint { position: fixed; top: 0; left: 0; right: 0; z-index: 100; margin: 0; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { color: var(--kf-accent); }
</style>
</head>
<body>
<p class="demo-hint"><b>corkscrew-lines</b> — Text lines spiral up from bottom to top. They pause when you put your hand on them.</p>
<ul class="demo" id="demo" data-fx="corkscrew-lines" data-fx-corkscrew-lines="pause: hover; step: .6"></ul>
<script>
(() => {
  const demo = document.getElementById("demo");
  const rows = ["Your first line of About copy goes here", "Make the second line a bit shorter", "Third line", "", "†", "", "Studio Name", "Month 0000 – Month 0000", "", "@", "", "hello@name.brand", "", "¶", ""];
  for (let k = 0; k < 3; k++) for (const r of rows) { const li = document.createElement("li"); li.textContent = r; demo.append(li); }
  const late = document.createElement("ul");
  late.setAttribute("data-fx", "corkscrew-lines");
  setTimeout(() => document.body.append(late), 1000);
  setTimeout(() => late.remove(), 2500);
  setTimeout(() => { const li = document.createElement("li"); li.textContent = "Row entering after 1s"; demo.append(li); }, 1000);
  document.querySelector(".demo-hint").append(" · A blank plate comes in after 1 second and leaves after 2.5 seconds (peel off).");
})();
</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
