<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ring-close-hover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-contrast-bg); color: var(--kf-contrast-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); color: var(--kf-ink); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-row { display: flex; gap: 48px; justify-content: center; padding: 15vh 0; }
  .demo-play { position: relative; display: grid; place-items: center; width: 130px; aspect-ratio: 1; text-align: center; line-height: 1.5; }
  .demo-play svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
</style>
</head>
<body>
<p class="demo-hint"><b>ring-close-hover</b> — Hover over the circle. The empty outline connects and closes a full loop.</p>
<div class="demo-row">
  <a class="demo-play" href="#" data-fx="ring-close-hover"><svg viewBox="0 0 130 130" aria-hidden="true"><circle data-fx-part="dash" cx="65" cy="65" r="64"/><circle data-fx-part="ring" pathLength="100" cx="65" cy="65" r="64"/></svg><span>PLAY<br>MOVIE</span></a>
</div>
<script>
// Late arrivals and removals — checks that fx-core attaches to an element added after 1s and detaches from an element removed after 2.5s
(() => {
  const src = document.querySelector('[data-fx~="ring-close-hover"]');
  if (!src) return;
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = src.outerHTML; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => src.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · One more comes in after 1s, and one drops out after 2.5s.");
})();
</script>
<script src="../fx-core.js"></script>
</body>
</html>
