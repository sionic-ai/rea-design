<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>word-photo-pile — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { padding: 160px 20px; max-width: 46rem; margin: 0 auto; font: 500 34px/1.3 var(--kf-font-display); }
</style>
</head>
<body>
<p class="demo-hint"><b>word-photo-pile</b> — Keep hovering over the underlined word. A photo floats up and fades away every .24s.</p>
<p class="demo">Put an intro here in two lines. I am <span data-fx="word-photo-pile">Distance<span data-fx-part="photos"><span data-fx-part="photo" class="wf-img" data-ratio="4/5" data-label="City street · overcast day"></span><span data-fx-part="photo" class="wf-img" data-ratio="3/2" data-label="Riverside bridge · at dusk"></span><span data-fx-part="photo" class="wf-img" data-ratio="1/1" data-label="Building facade · daytime"></span></span></span>Wow <span data-fx="word-photo-pile" data-fx-word-photo-pile="every: 400; tilt: 20">Person<span data-fx-part="photos"><span data-fx-part="photo" class="wf-img" data-ratio="2/3" data-label="Portrait back view · Backlit"></span><span data-fx-part="photo" class="wf-img" data-ratio="4/3" data-label="Market Alley · Day"></span></span></span>Take a photo.</p>
<script>
(() => {
  const src = document.querySelector('[data-fx~="word-photo-pile"]');
  if (!src) return;
  const make = (tag) => { const el = src.cloneNode(true); el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(" ", gone);
  setTimeout(() => src.after(" ", make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical one comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
