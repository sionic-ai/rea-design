<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gradient-spin-hover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .row { display: flex; gap: 24px; align-items: center; padding: 48px 24px; }
  .sq { display: grid; place-items: center; width: 64px; height: 64px; border: 1px solid var(--kf-line); font-size: 20px; }
  .cta { display: grid; place-items: center; width: 240px; height: 80px; border: 1px solid var(--kf-line); color: var(--kf-on-accent); font-weight: 700; }
</style>
</head>
<body>
<p class="demo-hint"><b>gradient-spin-hover</b> — Hover over the squares and buttons. Wide buttons keep the panel always on and spin only when a hand is present. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<div class="row" id="row">
  <a class="sq" data-fx="gradient-spin-hover" href="#a">→</a>
  <a class="sq" data-demo-remove data-fx="gradient-spin-hover" data-fx-gradient-spin-hover="turn: 2" href="#b">→</a>
  <a class="cta" data-fx="gradient-spin-hover" data-fx-gradient-spin-hover="look: always" href="#c">Your inquiry here</a>
</div>
<template data-demo-late><a class="sq" data-fx="gradient-spin-hover" href="#d">+</a></template>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => document.getElementById("row").append(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
