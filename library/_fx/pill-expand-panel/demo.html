<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pill-expand-panel — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); min-height: 200vh; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  [data-fx-part="title"] { font: 600 15px/1 var(--kf-font-display); letter-spacing: .1em; }
  [data-fx-part="panel"] a { display: flex; justify-content: space-between; font: 600 20px/1 var(--kf-font-display); letter-spacing: .14em; }
  [data-fx-part="close"] { fill: currentColor; }
</style>
</head>
<body>
<p class="demo-hint"><b>pill-expand-panel</b> — Click the pill at the bottom right. It unfolds into a panel, and clicking outside folds it. It hides while scrolling. <span style="color:var(--kf-dim)">(One more pill comes in after 1s, and one drops out after 2.5s)</span></p>
<details data-fx="pill-expand-panel"><summary data-fx-part="toggle"><span data-fx-part="title">BOOK NOW</span><svg data-fx-part="close" viewBox="0 0 14 14"><path d="M6.85 5.44 12 .29l1.41 1.42-5.14 5.14L13.41 12 12 13.41 6.85 8.27l-5.44 5.44L0 12.29l5.44-5.44L0 1.41 1.41 0z"/></svg></summary><div data-fx-part="panel"><a href="#">STAY <span>↗</span></a></div></details>
<div data-demo-remove data-fx="pill-expand-panel" style="--fx-bottom: 6rem"><button type="button" data-fx-part="toggle">Being removed soon</button></div>
<template data-demo-late><div data-fx="pill-expand-panel" data-fx-pill-expand-panel="dur: .2; hide: none" style="--fx-bottom: 11rem; --fx-fill: var(--kf-ink)"><button type="button" data-fx-part="toggle"><span data-fx-part="title">Enters late</span></button><div data-fx-part="panel"><a href="#">ITEM <span>↗</span></a></div></div></template>
<div data-fx="pill-expand-panel" style="--fx-bottom: 16rem"></div>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
