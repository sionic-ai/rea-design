<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hover-tint-stage — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .stage { position: relative; min-height: 80vh; background: var(--kf-contrast-bg); color: var(--kf-contrast-ink); }
  .row { position: absolute; z-index: 2; left: 0; right: 0; top: 50%; display: flex; translate: 0 -50%; }
  .row a { flex: 1; padding: 80px 0; text-align: center; opacity: .3; transition: opacity .5s; }
  .row a:hover { opacity: 1; }
  .panel { position: absolute; z-index: 1; left: 50%; top: 50%; width: 50%; translate: -50% -50%; aspect-ratio: 16 / 9; }
  .panel .wf-img { height: 100%; }
</style>
</head>
<body>
<p class="demo-hint"><b>hover-tint-stage</b> — Hover over a menu name. The section background is tinted with that menu’s color and a photo panel shows through behind it. <span style="color:var(--kf-dim)">(After 1s one more row comes in, and after 2.5s one section is removed)</span></p>
<section class="stage" data-fx="hover-tint-stage" id="s1">
  <div class="row">
    <a href="#" data-fx-part="item" style="--fx-tint: color-mix(in oklab, var(--kf-contrast-bg) 80%, var(--kf-accent))">Menu 1</a>
    <a href="#" data-fx-part="item" style="--fx-tint: oklch(from var(--kf-contrast-bg) calc(l + .08) c h)">Menu 2</a>
    <a href="#" data-fx-part="item" style="--fx-tint: color-mix(in oklab, var(--kf-contrast-bg) 85%, var(--kf-bg))">Menu 3</a>
  </div>
  <div class="panel" data-fx-part="panel"><div class="wf-img" data-label="Menu 1 Photo"></div></div>
  <div class="panel" data-fx-part="panel"><div class="wf-img" data-label="Menu 2 Photo"></div></div>
  <div class="panel" data-fx-part="panel"><div class="wf-img" data-label="Menu 3 Photo"></div></div>
</section>
<section class="stage" data-fx="hover-tint-stage" data-demo-remove><div class="row"><a href="#" data-fx-part="item" style="--fx-tint: var(--kf-accent)">Dropped Section</a></div></section>
<section class="stage" data-fx="hover-tint-stage"><div class="row"></div></section>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => { const s = document.createElement("section"); s.className = "stage"; s.dataset.fx = "hover-tint-stage"; s.innerHTML = '<div class="row"><a href="#" data-fx-part="item" style="--fx-tint: var(--kf-accent)">Late section</a></div>'; document.body.append(s); }, 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
