<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cursor-tag-follow — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; padding: 40px 20px; }
  .card { aspect-ratio: 16 / 9; background: var(--kf-raised); display: grid; place-items: end start; padding: 12px; }
</style>
</head>
<body>
<p class="demo-hint"><b>cursor-tag-follow</b> — Hover over a card. A tag follows late at the lower right of the cursor. <span style="color:var(--kf-dim)">(After 1s one more panel comes in, and one leaves 2.5s later)</span></p>
<section class="demo" data-fx="cursor-tag-follow">
  <div class="card" data-cursor="View work">Card 1</div>
  <div class="card" data-cursor="Reading">Card 2</div>
</section>
<section class="demo" data-fx="cursor-tag-follow" data-demo-remove><div class="card" data-cursor="Being removed soon">Panel to be removed soon</div></section>
<section class="demo" data-fx="cursor-tag-follow"></section>
<template data-demo-late><section class="demo" data-fx="cursor-tag-follow" data-fx-cursor-tag-follow="lag: .2"><div class="card" data-cursor="Late panel">.2s</div></section></template>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/CustomEase.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
