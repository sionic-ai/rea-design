<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>stripe-band-reveal — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { margin: 0; background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-spacer { height: 90vh; display: grid; place-items: center; color: var(--kf-dim); }
  .band { height: 196px; margin: 40px 0; }
  .dark { background: var(--kf-contrast-bg); color: var(--kf-contrast-ink); padding: 40px 0; }
</style>
</head>
<body>
<p class="demo-hint"><b>stripe-band-reveal</b> — Scrolling down unfolds the horizontal line strips row by row, and the gaps between rows widen as they exit upward.</p>
<div class="demo-spacer">Scroll down ↓</div>
<div class="band" data-fx="stripe-band-reveal" data-fx-stripe-band-reveal="look: reveal"></div>
<div class="band" data-fx="stripe-band-reveal"></div>
<div class="dark"><div class="band" style="transform: scaleY(-1)" data-fx="stripe-band-reveal" data-fx-stripe-band-reveal="look: grow; scrub: true; drift: off"></div></div>
<div class="band" data-fx="stripe-band-reveal" data-fx-stripe-band-reveal="count: 0"></div>
<div class="demo-spacer"></div>
<script>
(() => {
  const src = document.querySelector('[data-fx~="stripe-band-reveal"]');
  const make = () => { const el = src.cloneNode(false); return el; };
  const gone = make();
  src.after(gone);
  setTimeout(() => src.after(make()), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s one more strip comes in, and after 2.5s one leaves.");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../../../_shared/vendor/gsap/CustomEase.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
