<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>twin-scale-swap — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .row { display: flex; gap: 20px; padding: 60px 40px; flex-wrap: wrap; align-items: center; }
  .pill { display: inline-flex; align-items: center; height: 54px; padding: 0 32px; border-radius: 28px; background: var(--kf-ink); color: var(--kf-bg); font-weight: 600; }
  .menu { font-weight: 600; }
</style>
</head>
<body>
<p class="demo-hint"><b>twin-scale-swap</b> — Hover over the buttons and menu text. The text swells and vanishes while the same text rises up small. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<div class="row" id="row">
  <a class="pill" href="#" data-fx="twin-scale-swap"><span data-fx-part="label" data-twin="View details"><span>View details</span></span></a>
  <a class="menu" href="#" data-fx="twin-scale-swap"><span data-fx-part="label" data-twin="About the School"><span>About the School</span></span></a>
  <a class="pill" href="#" data-fx="twin-scale-swap" style="--fx-to: 1.3; --fx-dur: .5s" data-demo-remove><span data-fx-part="label" data-twin="Omission"><span>Omission</span></span></a>
</div>
<template data-demo-late><a class="pill" href="#" data-fx="twin-scale-swap"><span data-fx-part="label" data-twin="Late"><span>Late</span></span></a></template>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => document.getElementById("row").append(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
