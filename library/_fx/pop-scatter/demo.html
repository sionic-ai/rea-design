<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pop-scatter — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 1; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .gap { height: 80vh; }
  .field { position: relative; height: 70vh; margin: 0 5vw 40vh; background: var(--kf-accent-soft); }
  .field i { position: absolute; display: block; width: 14px; height: 60px; border-radius: 7px; background: var(--kf-accent); }
</style>
</head>
<body>
<p class="demo-hint"><b>pop-scatter</b> — Scroll down. When the panel reaches screen center, bars pop out at random. <span style="color:var(--kf-dim)">(After 1s one more panel holding a bar comes in, and after 2.5s the first panel drops out)</span></p>
<div class="gap"></div>
<div id="wrap">
  <div class="field" data-fx="pop-scatter" data-demo-remove>
    <i data-fx-part="pop" style="left:10%;top:20%;rotate:12deg"></i><i data-fx-part="pop" style="left:30%;top:60%;rotate:-8deg"></i><i data-fx-part="pop" style="left:55%;top:30%;rotate:20deg"></i><i data-fx-part="pop" style="left:75%;top:65%;rotate:5deg"></i><i data-fx-part="pop" style="left:88%;top:15%;rotate:-15deg"></i>
  </div>
</div>
<template data-demo-late><div class="field" data-fx="pop-scatter"><i data-fx-part="pop" style="left:20%;top:30%"></i><i data-fx-part="pop" style="left:60%;top:50%"></i></div></template>
<div data-fx="pop-scatter"></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => document.getElementById("wrap").append(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
