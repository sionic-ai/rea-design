<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>aperture-loader-gl — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .page { padding: 40px 20px; font: 600 48px/1.1 var(--kf-font-sans); }
  .box { position: relative; height: 40vh; margin: 20px; border: 1px solid var(--kf-line); }
  .box [data-fx~="aperture-loader-gl"] { position: absolute; z-index: 1; }
</style>
</head>
<body>
<p class="demo-hint"><b>aperture-loader-gl</b> — On open, aperture blades open and close while flipping through pictures, then swing fully open to reveal the page behind (about 6s). Refresh to watch again.</p>
<div data-fx="aperture-loader-gl" data-fx-aperture-loader-gl="run: 2" data-demo-remove></div>
<p class="page">Back page — title here</p>
<div class="box"><div data-fx="aperture-loader-gl" data-fx-aperture-loader-gl="run: 1.5; blades: 6"></div></div>
<template data-demo-late><div class="box"><div data-fx="aperture-loader-gl" data-fx-aperture-loader-gl="run: 1"></div></div></template>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
