<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tilt-pair-tabs — two images that tilt and swap when you hover a name</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { padding: 40px; }
  .demo { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; align-items: start; margin-top: 30px; }
  .demo-photos { position: relative; height: 380px; }
  .demo-photo { position: absolute; padding: 12px 12px 48px; border: 1px solid var(--kf-line); background: var(--kf-surface); }
  .demo-photo .wf-img { width: 220px; aspect-ratio: 1; }
  .demo-photo + .demo-photo { left: 180px; top: 120px; }
  .demo-photo + .demo-photo .wf-img { width: 140px; }
  .demo nav { display: grid; justify-items: end; gap: 30px; font-size: 32px; font-weight: 600; }
</style>
</head>
<body>
<p>Hover over the name line on the right — the two photos on the left tilt and swap.</p>
<div class="demo" data-fx="tilt-pair-tabs">
  <div class="demo-photos">
    <div data-fx-part="panel"><figure class="demo-photo" data-fx-part="photo"><div class="wf-img" data-label="Series 1 cover photo"></div></figure><figure class="demo-photo" data-fx-part="photo"><div class="wf-img" data-label="Series 1 second"></div></figure></div>
    <div data-fx-part="panel"><figure class="demo-photo" data-fx-part="photo"><div class="wf-img" data-label="Series 2 cover photo"></div></figure><figure class="demo-photo" data-fx-part="photo"><div class="wf-img" data-label="Series 2 second"></div></figure></div>
    <div data-fx-part="panel"><figure class="demo-photo" data-fx-part="photo"><div class="wf-img" data-label="Series 3 cover photo"></div></figure><figure class="demo-photo" data-fx-part="photo"><div class="wf-img" data-label="Series 3 second"></div></figure></div>
  </div>
  <nav><a href="#" data-fx-part="tab">Series name 1</a><a href="#" data-fx-part="tab">Series name 2</a><a href="#" data-fx-part="tab">Series name 3</a></nav>
</div>
<div data-fx="tilt-pair-tabs" data-demo-remove><a data-fx-part="tab">Tab to Be Removed</a><div data-fx-part="panel"></div></div>
<template data-demo-late><div class="demo" data-fx="tilt-pair-tabs" data-fx-tilt-pair-tabs="on: click"><div class="demo-photos" style="height:200px"><div data-fx-part="panel">Late-arriving panel 1</div><div data-fx-part="panel">Late-arriving panel 2</div></div><nav><a href="#" data-fx-part="tab">Press 1</a><a href="#" data-fx-part="tab">Press 2</a></nav></div></template>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
