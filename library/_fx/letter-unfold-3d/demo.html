<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>letter-unfold-3d — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { padding: 60px 24px 120vh; display: grid; gap: 80px; }
  .logo { font: 400 clamp(56px, 12vw, 180px)/.9 var(--kf-font-display); letter-spacing: -.01em; }
  .late { margin-top: 90vh; }
  button { justify-self: start; padding: 8px 14px; border: 1px solid var(--kf-line); background: var(--kf-surface); }
</style>
</head>
<body>
<p class="demo-hint"><b>letter-unfold-3d</b> — Open it and the first logo unfolds one character at a time. Scroll down and late-arriving logos unfold as they come into view, and the button unfolds the manual logo.</p>
<section class="demo">
  <p class="logo" data-fx="letter-unfold-3d">Brand</p>
  <button type="button" id="go">manual: unfold logo</button>
  <p class="logo" id="manual" data-fx="letter-unfold-3d" data-fx-letter-unfold-3d="when: manual; start: 0">Studio</p>
  <p class="logo" id="gone" data-fx="letter-unfold-3d">Gone</p>
</section>
<script>
  document.getElementById("go").onclick = () => document.getElementById("manual").classList.toggle("is-in");
  setTimeout(() => { const p = document.createElement("p"); p.className = "logo late"; p.dataset.fx = "letter-unfold-3d"; p.textContent = "Late Mark"; document.querySelector(".demo").append(p); }, 1000);
  setTimeout(() => document.getElementById("gone")?.remove(), 2500);
</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
