<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>text-hand-clock — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 14px/1.3 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { display: flex; flex-wrap: wrap; gap: 48px; padding: 48px 20px; }
  .demo figure { display: grid; gap: 12px; justify-items: center; }
  .demo [data-fx] { width: 182px; font-size: 12px; }
</style>
</head>
<body>
<p class="demo-hint"><b>text-hand-clock</b> — The seconds digit turns one notch every second. Left is City (UTC +9), center is another city, and the right one glides every frame. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<div class="demo">
  <figure><div data-fx="text-hand-clock" data-fx-text-hand-clock="offset: 9"><span data-fx-part="ticks"></span><span data-fx-part="sec"></span><span data-fx-part="min"></span><span data-fx-part="hour"></span><span data-fx-part="zone">UTC +9</span></div><figcaption>City</figcaption></figure>
  <figure data-demo-remove><div data-fx="text-hand-clock" data-fx-text-hand-clock="offset: 0"><span data-fx-part="ticks"></span><span data-fx-part="sec"></span><span data-fx-part="min"></span><span data-fx-part="hour"></span><span data-fx-part="zone">UTC +0</span></div><figcaption>City (drops out after 2.5s)</figcaption></figure>
  <figure><div data-fx="text-hand-clock" data-fx-text-hand-clock="smooth: on; gap: .08"><span data-fx-part="ticks"></span><span data-fx-part="sec"></span><span data-fx-part="min"></span><span data-fx-part="hour"></span><span data-fx-part="zone">Your Time Here</span></div><figcaption>smooth · gap .08</figcaption></figure>
  <template data-demo-late><figure><div data-fx="text-hand-clock" data-fx-text-hand-clock="offset: -8"><span data-fx-part="sec"></span><span data-fx-part="min"></span><span data-fx-part="zone">UTC -8</span></div><figcaption>Late · No hour hand</figcaption></figure></template>
</div>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
