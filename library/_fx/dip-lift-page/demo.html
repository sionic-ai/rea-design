<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dip-lift-page — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  main { padding: 80px 40px; display: flex; flex-direction: column; gap: 24px; font-size: 40px; }
  main a { text-decoration: underline; }
</style>
</head>
<body>
<p class="demo-hint"><b>dip-lift-page</b> On open, the body rises from below. Clicking a link drops the page down, then slides it up and out as it moves to the same page. <span style="color:var(--kf-dim)">(After 1s one more panel comes in, and one leaves 2.5s later)</span></p>
<div class="demo-cover"></div>
<main data-fx="dip-lift-page" data-fx-dip-lift-page="cover: .demo-cover"><p>Your title here</p><a href="demo.html?again">Reopen this page</a></main>
<section data-demo-remove data-fx="dip-lift-page"><p>Panel that drops out after 2.5s</p></section>
<template data-demo-late><section data-fx="dip-lift-page" data-fx-dip-lift-page="hold: 0; rise: 40"><p>Late-arriving panel</p></section></template>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/CustomEase.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
