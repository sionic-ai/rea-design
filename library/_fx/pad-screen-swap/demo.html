<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pad-screen-swap — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { padding: 48px 20px; }
  .demo-spacer { height: 90vh; display: grid; place-items: center; color: var(--kf-dim); }

  .board { display: grid; grid-template-columns: 260px 1fr; gap: 24px; }
  .pads { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; align-content: start; }
  [data-fx-part="pad"] { height: 80px; border: 1px solid var(--kf-line); background: var(--kf-surface); color: var(--kf-ink); font: 500 12px/1 var(--kf-font-mono); }
  [data-fx-part="pad"][data-on] { border-color: var(--kf-accent); color: var(--kf-accent-text); }
  [data-fx-part="screen"] { padding: 32px; border: 1px solid var(--kf-line); background: var(--kf-surface); min-height: 260px; }
  [data-fx-part="screen"] small { font: 500 11px/1 var(--kf-font-mono); color: var(--kf-dim); }
  [data-fx-part="screen"] b { font: 700 40px/1.1 var(--kf-font-display); }
  [data-fx-part="screen"] p { margin-top: 16px; max-width: 46ch; }
</style>
</head>
<body>
<p class="demo-hint"><b>pad-screen-swap</b> — Press the left pads — the text on the right screen changes. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<section class="demo"><div data-demo-remove class="board" data-fx="pad-screen-swap"><div class="pads"><button data-fx-part="pad" type="button" data-num="Pad 01" data-title="Your feature name 1 here" data-body="Add about two lines for feature 1 here. What it does for you.">Pad 01</button><button data-fx-part="pad" type="button" data-num="Pad 02" data-title="Your feature name 2 here" data-body="Add about two lines for feature 2 here. What it does for you.">Pad 02</button><button data-fx-part="pad" type="button" data-num="Pad 03" data-title="Your feature name 3 here" data-body="Your description of feature 3 goes here, about two lines. What it does for you.">Pad 03</button><button data-fx-part="pad" type="button" data-num="Pad 04" data-title="Your feature name 4 here" data-body="Your description of feature 4 goes here, about two lines. What it does for you.">Pad 04</button><button data-fx-part="pad" type="button" data-num="Pad 05" data-title="Your feature name 5 here" data-body="Your description of feature 5 goes here, about two lines. What it does for you.">Pad 05</button><button data-fx-part="pad" type="button" data-num="Pad 06" data-title="Your feature name 6 here" data-body="Your description of feature 6 goes here, about two lines. What it does for you.">Pad 06</button></div>
<div data-fx-part="screen"><small data-fx-part="line" data-key="num"></small><b data-fx-part="line" data-key="title"></b><p data-fx-part="fade" data-key="body"></p></div></div><div class="board" data-fx="pad-screen-swap"><div class="pads"><button data-fx-part="pad" type="button" data-num="Pad 01" data-title="Your feature name 1 here" data-body="Add about two lines for feature 1 here. What it does for you.">Pad 01</button><button data-fx-part="pad" type="button" data-num="Pad 02" data-title="Your feature name 2 here" data-body="Add about two lines for feature 2 here. What it does for you.">Pad 02</button><button data-fx-part="pad" type="button" data-num="Pad 03" data-title="Your feature name 3 here" data-body="Your description of feature 3 goes here, about two lines. What it does for you.">Pad 03</button><button data-fx-part="pad" type="button" data-num="Pad 04" data-title="Your feature name 4 here" data-body="Your description of feature 4 goes here, about two lines. What it does for you.">Pad 04</button><button data-fx-part="pad" type="button" data-num="Pad 05" data-title="Your feature name 5 here" data-body="Your description of feature 5 goes here, about two lines. What it does for you.">Pad 05</button><button data-fx-part="pad" type="button" data-num="Pad 06" data-title="Your feature name 6 here" data-body="Your description of feature 6 goes here, about two lines. What it does for you.">Pad 06</button></div>
<div data-fx-part="screen"><small data-fx-part="line" data-key="num"></small><b data-fx-part="line" data-key="title"></b><p data-fx-part="fade" data-key="body"></p></div></div><template data-demo-late><div class="board" data-fx="pad-screen-swap"><div class="pads"><button data-fx-part="pad" type="button" data-num="Pad 01" data-title="Your feature name 1 here" data-body="Add about two lines for feature 1 here. What it does for you.">Pad 01</button><button data-fx-part="pad" type="button" data-num="Pad 02" data-title="Your feature name 2 here" data-body="Add about two lines for feature 2 here. What it does for you.">Pad 02</button><button data-fx-part="pad" type="button" data-num="Pad 03" data-title="Your feature name 3 here" data-body="Your description of feature 3 goes here, about two lines. What it does for you.">Pad 03</button><button data-fx-part="pad" type="button" data-num="Pad 04" data-title="Your feature name 4 here" data-body="Your description of feature 4 goes here, about two lines. What it does for you.">Pad 04</button><button data-fx-part="pad" type="button" data-num="Pad 05" data-title="Your feature name 5 here" data-body="Your description of feature 5 goes here, about two lines. What it does for you.">Pad 05</button><button data-fx-part="pad" type="button" data-num="Pad 06" data-title="Your feature name 6 here" data-body="Your description of feature 6 goes here, about two lines. What it does for you.">Pad 06</button></div>
<div data-fx-part="screen"><small data-fx-part="line" data-key="num"></small><b data-fx-part="line" data-key="title"></b><p data-fx-part="fade" data-key="body"></p></div></div></template></section>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/CustomEase.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); window.ScrollTrigger?.refresh(); }, 2500);
</script>
</body>
</html>
