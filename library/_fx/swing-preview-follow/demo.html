<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>swing-preview-follow — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .list { padding: 64px 20px; display: flex; flex-direction: column; gap: 28px; }
  .list [data-fx-part="item"] { font: 700 72px/1 var(--kf-font-display); cursor: pointer; transition: color 0.3s; }
  .list [data-fx-part="item"]:hover { color: var(--kf-accent); }
  .list .wf-img { width: 100%; height: 100%; }
</style>
</head>
<body>
<p class="demo-hint"><b>swing-preview-follow</b> — Hover over a name and move sideways quickly — the card follows late and tilts, then stands upright as soon as you stop.</p>
<div class="list" data-fx="swing-preview-follow">
  <p data-fx-part="item">Your name here</p>
  <p data-fx-part="item">Second name</p>
  <p data-fx-part="item">Third name</p>
  <div data-fx-part="card">
    <div data-fx-part="visual"><div class="wf-img" data-label="Preview 1 · landscape 16:10"></div></div>
    <div data-fx-part="visual"><div class="wf-img" data-label="Preview 2 · landscape 16:10"></div></div>
    <div data-fx-part="visual"><div class="wf-img" data-label="Preview 3 · Landscape 16:10"></div></div>
  </div>
</div>
<script>
// Late arrivals and removals — checks that fx-core attaches to an element added after 1s and detaches from an element removed after 2.5s
(() => {
  const src = document.querySelector('[data-fx~="swing-preview-follow"]');
  if (!src) return;
  const html = src.outerHTML;
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => src.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical one comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
