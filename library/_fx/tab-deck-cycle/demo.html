<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tab-deck-cycle — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-box { margin: 40px 20px; padding: 40px; border-radius: var(--kf-radius-lg); background: var(--kf-accent); display: grid; gap: 30px; justify-items: center; }
  .demo-tabs { display: flex; gap: 4px; padding: 4px; border-radius: 16px; background: var(--kf-accent-text); }
  .demo-tabs button { height: 38px; padding: 0 20px; border: 0; border-radius: 12px; background: transparent; color: var(--kf-on-accent); font: inherit; cursor: pointer; }
  .demo-tabs button.is-fx-on { background: var(--kf-accent-soft); color: var(--kf-accent-text); }
  .demo-tabs [data-fx-part="fill"] { background: var(--kf-bg); }
  .demo-box [data-fx-part="deck"] { width: min(600px, 100%); }
  .demo-box article { height: 220px; border-radius: var(--kf-radius-lg); background: var(--kf-bg); display: grid; place-items: center; font-size: 22px; font-weight: 700; }
</style>
</head>
<body>
<p class="demo-hint"><b>tab-deck-cycle</b> — Wait and the tab fills up and advances, press a tab to jump to that card.</p>
<div class="demo-box" id="box" data-fx="tab-deck-cycle" data-fx-tab-deck-cycle="every: 3">
  <div class="demo-tabs" role="tablist">
    <button data-fx-part="tab" aria-selected="true"><i data-fx-part="fill"></i>Tab 1</button>
    <button data-fx-part="tab"><i data-fx-part="fill"></i>Tab 2</button>
    <button data-fx-part="tab"><i data-fx-part="fill"></i>Tab 3</button>
  </div>
  <div data-fx-part="deck"><article data-fx-part="card">Card 1</article><article data-fx-part="card">Card 2</article><article data-fx-part="card">Card 3</article></div>
</div>
<div class="demo-box" data-fx="tab-deck-cycle" data-fx-tab-deck-cycle="every: 2; dur: 0" data-demo-remove><div class="demo-tabs"><button data-fx-part="tab">To Be Removed 1</button><button data-fx-part="tab">To Be Removed 2</button></div><div data-fx-part="deck"><article data-fx-part="card">Go</article><article data-fx-part="card">Me</article></div></div>
<div class="demo-box" data-fx="tab-deck-cycle"></div>
<template data-demo-late><div class="demo-box" data-fx="tab-deck-cycle" data-fx-tab-deck-cycle="every: 4; press: .9"><div class="demo-tabs"><button data-fx-part="tab"><i data-fx-part="fill"></i>Late 1</button><button data-fx-part="tab"><i data-fx-part="fill"></i>Late 2</button></div><div data-fx-part="deck"><article data-fx-part="card">Late Card 1</article><article data-fx-part="card">Late Card 2</article></div></div></template>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
