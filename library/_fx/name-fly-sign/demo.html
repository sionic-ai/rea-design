<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>name-fly-sign — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); min-height: 100vh; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { position: fixed; z-index: 2; }
  .demo[data-fx-state="intro"] { inset: 0; display: grid; place-content: center; justify-items: center; gap: 2vw; text-align: center; }
  .demo[data-fx-state="sign"] { left: 32px; bottom: 30px; display: grid; gap: 8px; }
  .demo h1 { font: 700 19px/0.9 var(--kf-font-display); text-transform: uppercase; letter-spacing: -0.035em; white-space: nowrap; }
  .demo[data-fx-state="intro"] h1 { font-size: min(6vw, 110px); }
  .demo[data-fx-state="sign"] [data-fx-part="line"] { display: none; }
  .demo[data-fx-state="intro"] [data-fx-part="meta"] { display: none; }
  .demo [data-fx-part="meta"] { font: 11px var(--kf-font-mono); letter-spacing: 0.2em; text-transform: uppercase; color: var(--kf-accent); }
</style>
</head>
<body>
<p class="demo-hint"><b>name-fly-sign</b> — A big name rises, then flies to a signature at bottom left after 3.6s. Click to send it right away.</p>
<header class="demo" data-fx="name-fly-sign"><h1 data-fx-part="name">First Middle Last</h1><p data-fx-part="line">Your services in one line here</p><p data-fx-part="meta">Role · City</p></header>
<script>
(() => {
  const src = document.querySelector('[data-fx~="name-fly-sign"]');
  if (!src) return;
  const make = (tag) => { const el = document.createElement("div"); el.dataset.fx = "name-fly-sign"; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  document.body.append(gone);
  setTimeout(() => document.body.append(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another blank panel comes in, and after 2.5s one leaves (detach).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
