<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>edge-scrollbar — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  html { scrollbar-width: none; }
  html::-webkit-scrollbar { display: none; }
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .long { height: 400vh; padding: 40px 20px; background: repeating-linear-gradient(var(--kf-bg) 0 300px, var(--kf-raised) 300px 600px); }
</style>
</head>
<body>
<p class="demo-hint"><b>edge-scrollbar</b> — Scroll and a thin bar lights up at the right edge, then disappears when you stop. Hover the right edge and the bar thickens, press or drag to jump to that spot. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<div class="long">Long page</div>
<div data-fx="edge-scrollbar" aria-hidden="true"><span data-fx-part="thumb"></span></div>
<div data-demo-remove data-fx="edge-scrollbar" style="right:30px" aria-hidden="true"><span data-fx-part="thumb"></span></div>
<template data-demo-late><div data-fx="edge-scrollbar" style="right:60px" aria-hidden="true"><span data-fx-part="thumb"></span></div></template>
<div data-fx="edge-scrollbar" style="right:90px" aria-hidden="true"></div>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
