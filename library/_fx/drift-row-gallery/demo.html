<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>drift-row-gallery — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: fixed; top: 0; left: 0; right: 0; z-index: 9; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .pad { height: 70vh; padding: 60px 20px; }
  .w43 { width: 22vw; aspect-ratio: 4 / 3; } .w34 { width: 16vw; aspect-ratio: 3 / 4; }
  .w43 .wf-img, .w34 .wf-img { height: 100%; }
</style>
</head>
<body>
<p class="demo-hint"><b>drift-row-gallery</b> — Scroll down (a horizontal photo strip where each cell follows late). <span style="color:var(--kf-dim)">(After 1s one more band comes in, and one leaves 2.5s later)</span></p>
<div class="pad">Section above.</div>
<div data-fx="drift-row-gallery">
  <div data-fx-part="track">
    <div data-fx-part="mark">STUDIO NAME</div>
    <ul data-fx-part="list">
      <li data-fx-part="card" class="w43"><span class="wf-img" data-label="Photo 1 · 4:3"></span></li>
      <li data-fx-part="card" class="w34"><span class="wf-img" data-label="Photo 2 · 3:4"></span></li>
      <li data-fx-part="card" class="w34"><span class="wf-img" data-label="Photo 3 · 3:4"></span></li>
      <li data-fx-part="card" class="w43"><span class="wf-img" data-label="Photo 4 · 4:3"></span></li>
      <li data-fx-part="card" class="w34"><span class="wf-img" data-label="Photo 5 · 3:4"></span></li>
      <li data-fx-part="card" class="w43"><span class="wf-img" data-label="Photo 6 · 4:3"></span></li>
    </ul>
  </div>
</div>
<div class="pad">Section below.</div>
<div data-fx="drift-row-gallery" data-demo-remove><div data-fx-part="track"><ul data-fx-part="list"><li data-fx-part="card" class="w43"><span class="wf-img" data-label="Band to Be Removed"></span></li></ul></div></div>
<div data-fx="drift-row-gallery">Boardless Band</div>
<template data-demo-late><div data-fx="drift-row-gallery" data-fx-drift-row-gallery="from: 300; xs: -60,-90"><div data-fx-part="track"><ul data-fx-part="list"><li data-fx-part="card" class="w43"><span class="wf-img" data-label="Late-arriving band 1"></span></li><li data-fx-part="card" class="w34"><span class="wf-img" data-label="Late-arriving band 2"></span></li></ul></div></div><div class="pad"></div></template>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
