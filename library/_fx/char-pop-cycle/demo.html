<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>char-pop-cycle — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hero { min-height: 70vh; display: grid; place-items: center; padding: 60px 20px 160px; text-align: center; }
  .demo-hero [data-fx-part="line"] { font: 800 clamp(40px, 8vw, 120px)/1 var(--kf-font-display); text-transform: uppercase; }
  .demo-hero svg { width: 100%; height: 100%; }
</style>
</head>
<body>
<p class="demo-hint"><b>char-pop-cycle</b> — Just watch. Letters pop up one by one and the sticker beside them presses down on the nearest letter and releases it.</p>
<section class="demo-hero">
  <div class="demo-wrap" data-fx="char-pop-cycle">
    <span data-fx-part="line">A big headline set across two lines</span>
    <span data-fx-part="phrase" data-key="star" data-spot="-373,-10" data-width="90">A big headline set across two lines</span>
    <span data-fx-part="phrase" data-key="ring" data-spot="-125,-115" data-width="72">Second short promise line</span>
    <span data-fx-part="phrase" data-key="box" data-spot="150,-30" data-width="72">A third rotating statement</span>
    <div data-fx-part="icons" aria-hidden="true">
      <span data-fx-part="icon" data-key="star"><svg viewBox="0 0 100 100"><path d="M50 6l12 30 32 2-25 20 9 32-28-18-28 18 9-32L6 38l32-2z" fill="var(--kf-accent)"/></svg></span>
      <span data-fx-part="icon" data-key="ring"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="34" fill="none" stroke="var(--kf-accent)" stroke-width="14"/></svg></span>
      <span data-fx-part="icon" data-key="box"><svg viewBox="0 0 100 100"><rect x="18" y="22" width="64" height="56" rx="10" fill="var(--kf-accent)"/></svg></span>
    </div>
  </div>
</section>
<script>
// Late arrivals · removals — after 1s one more of the same board comes in, after 2.5s the first board is removed
(() => {
  const src = document.querySelector(".demo-hero");
  const html = src.outerHTML;
  const make = () => { const t = document.createElement("template"); t.innerHTML = html; return t.content.firstElementChild; };
  const gone = make();
  src.after(gone);
  setTimeout(() => src.after(make()), 1000);
  setTimeout(() => gone.remove(), 2500);
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
