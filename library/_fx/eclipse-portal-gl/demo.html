<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>eclipse-portal-gl — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .stage { height: 80vh; display: grid; place-items: center; }
  .stage h1 { font: 800 40px/1 var(--kf-font-display); color: var(--kf-ink); }
  .demo-row { padding: 20px; }
  .demo-row [data-fx] { height: 30vh; }
</style>
</head>
<body>
<p class="demo-hint"><b>eclipse-portal-gl</b> — Light leaks from the edge of the black disc (a gray stage in the plain default skin). Scroll the panel below down and the disc opens.</p>
<section class="stage" data-fx="eclipse-portal-gl" data-fx-eclipse-portal-gl="radius: .4"><h1>Your logo here</h1></section>
<section class="demo-row"><div data-fx="eclipse-portal-gl" data-fx-eclipse-portal-gl="radius: .3; glow: 1.4" data-demo-src></div></section>
<label class="demo-row" style="display:block">Opening <input type="range" min="0" max="1" step="0.01" value="0" oninput="document.querySelector('.stage').dataset.fxOpen=this.value"></label>
<script>
// Late arrivals and removals — checks that fx-core attaches to an element added after 1s and detaches from an element removed after 2.5s
(() => {
  const src = document.querySelector("[data-demo-src]");
  if (!src) return;
  const html = src.outerHTML.replace(/\sdata-demo-src(="")?/, "");
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => src.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical one comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="three-global.js"></script>
<script src="../../_vendor/three@0.182.0/build/three.cjs"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
