<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>under-tone-button — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  section { height: 80vh; display: grid; place-items: center; }
  section[data-tone="dark"] { background: var(--kf-contrast-bg); color: var(--kf-contrast-ink); }
  .btn { position: fixed; top: 70px; right: 30px; width: 64px; aspect-ratio: 1; border: 1.5px solid currentColor; border-radius: 50%; background: none; z-index: 50; }
  .btn.is-2 { top: 150px; }
</style>
</head>
<body>
<p class="demo-hint"><b>under-tone-button</b> — Scroll down. The top-right button switches between white and ink black depending on the section color below. <span style="color:var(--kf-dim)">(After 1s one more button comes in, and after 2.5s one drops out)</span></p>
<button class="btn" type="button" data-fx="under-tone-button" aria-label="Menu">≡</button>
<button class="btn is-2" type="button" data-demo-remove data-fx="under-tone-button" aria-label="Being removed soon">×</button>
<section data-tone="dark">Dark Section</section>
<section data-tone="light">Light section</section>
<section data-tone="dark">Dark Section</section>
<section data-tone="light">Light section</section>
<template data-demo-late><button class="btn is-2" type="button" data-fx="under-tone-button" aria-label="Late">+</button></template>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
