<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>side-drawer — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { padding: 48px 20px; display: flex; gap: 16px; }
  .demo-btn { display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 16px; border: 1px solid var(--kf-line); border-radius: var(--kf-radius-pill); background: var(--kf-accent); color: var(--kf-on-accent); cursor: pointer; }
  .panel { width: min(80%, 26rem); padding: 48px 32px; background: var(--kf-accent); color: var(--kf-on-accent); display: grid; align-content: center; gap: 16px; font: 700 22px/1.4 var(--kf-font-display); }
  .pop { margin: auto auto auto 10%; width: 16rem; padding: 32px; border-radius: var(--kf-radius-md); background: var(--kf-surface); text-align: center; }
</style>
</head>
<body>
<p class="demo-hint"><b>side-drawer</b> — Press Menu. The panel slides in from the right and the card on the left scrim pops up larger. Click the scrim or press Esc to close.</p>
<section class="demo">
  <div data-fx="side-drawer">
    <button type="button" class="demo-btn" data-fx-part="toggle" aria-expanded="false">Menu</button>
    <div data-fx-part="layer">
      <nav class="panel" data-fx-part="panel"><a href="#">Menu 1</a><a href="#">Menu 2</a><a href="#">Menu 3</a></nav>
      <div data-fx-part="lay"><div class="pop" data-fx-part="pop">Your QR · info card here</div></div>
    </div>
  </div>
</section>
<script>
// Late arrivals and removals — checks that fx-core attaches to an element added after 1s and detaches from an element removed after 2.5s
(() => {
  const src = document.querySelector('[data-fx~="side-drawer"]');
  if (!src) return;
  const html = src.outerHTML.replace(/\sid="[^"]*"/g, "");
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => src.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical one comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
