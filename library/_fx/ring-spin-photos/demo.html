<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ring-spin-photos — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); overflow: hidden; }
  .demo-hint { position: relative; z-index: 2; padding: 16px 32px; font: 500 13px/1.4 var(--kf-font-mono); }
  .stage { position: fixed; inset: 0; display: grid; place-items: center; }
  .stage h1 { position: relative; z-index: 2; font: 400 40px/1.15 var(--kf-font-display); text-align: center; }
  .rings { position: absolute; width: min(70vw, 70vh); aspect-ratio: 1; }
  .ring { position: absolute; --fx-item: 9vmin; }
  .ring.is-small { inset: -17.5%; }
  .ring.is-big { inset: -42.5%; }
  .chip { width: 100%; height: 100%; border-radius: 30% 30% 12% 12%; background: color-mix(in oklab, var(--kf-ink) 14%, var(--kf-bg)); }
  .chip::before { content: ""; display: block; width: 40%; height: 46%; margin: 8% auto 0; border-radius: 40%; background: color-mix(in oklab, var(--kf-accent) 40%, var(--kf-bg)); }
  .demo-btn { position: relative; z-index: 2; margin-top: 16px; }
</style>
</head>
<body>
<p class="demo-hint"><b>ring-spin-photos</b> Two layers of photo circles grow into view and rotate slowly. Press ”Leave” and the circles grow and vanish.</p>
<div class="stage">
  <div>
    <h1>Your two-line title here</h1>
    <button class="wf-btn demo-btn" type="button">Departure</button>
  </div>
  <div class="rings">
    <div class="ring is-small" data-fx="ring-spin-photos" data-fx-ring-spin-photos="step: 24; from: 1.2; delay: .1; spin: 250"></div>
    <div class="ring is-big" data-fx="ring-spin-photos" data-fx-ring-spin-photos="step: 12; from: .9; spin: 150"></div>
  </div>
</div>
<div data-fx="ring-spin-photos" data-demo-remove></div>
<template data-demo-late><div class="ring" style="inset: 30%" data-fx="ring-spin-photos" data-fx-ring-spin-photos="from: .8; spin: 40"><div data-fx-part="item"><div class="chip"></div></div><div data-fx-part="item"><div class="chip"></div></div><div data-fx-part="item"><div class="chip"></div></div></div></template>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/CustomEase.min.js"></script>
<script>
  for (const [sel, count] of [[".ring.is-small", 15], [".ring.is-big", 30]]) {
    const ring = document.querySelector(sel);
    for (let i = 0; i < count; i++) ring.insertAdjacentHTML("beforeend", '<div data-fx-part="item"><div class="chip"></div></div>');
  }
</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
  document.querySelector(".demo-btn").addEventListener("click", () => document.querySelectorAll(".rings [data-fx]").forEach((r) => r.dispatchEvent(new CustomEvent("fx:leave"))));
  setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => document.querySelector(".rings").append(t.content.cloneNode(true))), 1000);
  setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
