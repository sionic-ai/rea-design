<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pin-widen — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .gap { height: 60vh; display: grid; place-items: center; color: var(--kf-dim); }
  .photo { background: linear-gradient(170deg, var(--kf-accent), var(--kf-ink)); color: var(--kf-on-accent); display: grid; place-items: end start; padding: 16px; }
  .say { position: absolute; right: 6vw; bottom: 8vh; z-index: 2; color: var(--kf-on-accent); }
  .say span { display: none; } .fx-pw-step-1 .say .s1, .fx-pw-step-2 .say .s2 { display: block; } .fx-pw-step-2 .say .s1 { display: none; }
</style>
</head>
<body>
<p class="demo-hint"><b>pin-widen</b> — Scroll down. The section stays pinned as a narrow vertical photo widens to fill the screen (the demo shortens the fixed length). <span style="color:var(--kf-dim)">(After 1s one more section comes in, and one leaves 2.5s later)</span></p>
<div class="gap">Your previous post here</div>
<section data-fx="pin-widen" data-fx-pin-widen="length: 200vh; grow: 180vh; steps: 0,0.5"><figure class="photo" data-fx-part="photo">Photo slot · window with autumn mountain view · portrait</figure><p class="say"><span class="s1">Your first post here</span><span class="s2">Your second post here</span></p></section>
<section data-demo-remove data-fx="pin-widen" data-fx-pin-widen="length: 100vh; grow: 100vh"><figure class="photo" data-fx-part="photo">Dropping section</figure></section>
<div data-late-slot></div>
<template data-demo-late><section data-fx="pin-widen" data-fx-pin-widen="from: 25vw; from-h: 25vw; to: 94.44vw; to-h: 50.69vw; length: 150vh; grow: 150vh; scrub: .7"><figure class="photo" data-fx-part="photo">Late section · in square</figure></section></template>
<div class="gap">Your next text here</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script>gsap.registerPlugin(ScrollTrigger);</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => { document.querySelectorAll("template[data-demo-late]").forEach((t) => document.querySelector("[data-late-slot]").replaceWith(t.content.cloneNode(true))); }, 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); ScrollTrigger.refresh(); }, 2500);
</script>
</body>
</html>
