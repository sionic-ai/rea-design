<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ring-fade-slides — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-raised); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { display: flex; flex-wrap: wrap; gap: 40px; justify-content: center; padding: 50px 20px; }
  .stage { width: 360px; aspect-ratio: 1; }
  .stage [data-fx-part="slide"] { display: grid; place-items: center; border-radius: 50%; background: var(--kf-accent-soft); font-size: 22px; }
  .counter { position: absolute; right: 0; bottom: 0; z-index: 3; width: 90px; height: 90px; display: grid; place-items: center; border-radius: 50%; background: var(--kf-surface); }
  .counter svg { position: absolute; inset: -4px; width: calc(100% + 8px); height: calc(100% + 8px); transform: rotate(-90deg); }
</style>
</head>
<body>
<p class="demo-hint"><b>ring-fade-slides</b> — Wait a moment. The panel fades every 4.5 seconds and the ring around the number circle draws one full turn in that time. <span style="color:var(--kf-dim)">(After 1s one more panel comes in, and one leaves 2.5s later)</span></p>
<section class="demo">
  <div class="stage" data-fx="ring-fade-slides">
    <div data-fx-part="slide">Panel One</div><div data-fx-part="slide">Panel Two</div><div data-fx-part="slide">Panel Three</div>
    <div class="counter"><svg viewBox="0 0 126 126"><circle data-fx-part="ring" cx="63" cy="63" r="62"/></svg><span><span data-fx-part="now">1</span> / <span data-fx-part="total"></span></span></div>
  </div>
  <div class="stage" data-demo-remove data-fx="ring-fade-slides" data-fx-ring-fade-slides="every: 2; fade: .5"><div data-fx-part="slide">Fading panel 1</div><div data-fx-part="slide">Fading panel 2</div></div>
  <template data-demo-late><div class="stage" data-fx="ring-fade-slides" data-fx-ring-fade-slides="every: 3"><div data-fx-part="slide">Late-arriving panel 1</div><div data-fx-part="slide">Late-arriving panel 2</div></div></template>
  <div class="stage" data-fx="ring-fade-slides"></div>
</section>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
