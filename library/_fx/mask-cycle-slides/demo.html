<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mask-cycle-slides — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .stage { position: relative; display: grid; grid-template-columns: 1fr 1fr; gap: 40px; padding: 60px; min-height: 70vh; align-items: center; }
  #demo-back { position: absolute; inset: 0; overflow: hidden; }
  #demo-back > div { position: absolute; inset: 0; height: 100%; border: 0; opacity: 0; }
  #demo-back > div:first-child { opacity: 1; }
  .box { position: relative; aspect-ratio: 456 / 320; z-index: 1; }
  .box .wf-img { height: 100%; border-radius: var(--kf-radius-md); }
</style>
</head>
<body>
<p class="demo-hint"><b>mask-cycle-slides</b> — Every 4 seconds the photo peels downward to reveal the next section (the background behind follows the same order). <span style="color:var(--kf-dim)">(After 1s one more panel comes in, and one leaves 2.5s later)</span></p>
<div class="stage">
  <div id="demo-back"><div class="wf-img" data-label="Background 1"></div><div class="wf-img" data-label="Background 2"></div><div class="wf-img" data-label="Background 3"></div></div>
  <div class="box" data-fx="mask-cycle-slides" data-fx-mask-cycle-slides="back: #demo-back"><div class="wf-img" data-fx-part="slide" data-label="Photo 1"></div><div class="wf-img" data-fx-part="slide" data-label="Photo 2"></div><div class="wf-img" data-fx-part="slide" data-label="Photo 3"></div></div>
  <div class="box" data-demo-remove data-fx="mask-cycle-slides"><div class="wf-img" data-fx-part="slide" data-label="Removed soon 1"></div><div class="wf-img" data-fx-part="slide" data-label="Removed soon 2"></div></div>
  <template data-demo-late><div class="box" data-fx="mask-cycle-slides" data-fx-mask-cycle-slides="every: 2; from: left"><div class="wf-img" data-fx-part="slide" data-label="Late 1"></div><div class="wf-img" data-fx-part="slide" data-label="Late 2"></div></div></template>
  <div class="box" data-fx="mask-cycle-slides"></div>
</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
