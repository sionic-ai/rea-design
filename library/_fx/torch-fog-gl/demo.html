<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>torch-fog-gl — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .stage { height: 80vh; display: grid; place-items: center; }
  .stage h2 { margin: 0; font: var(--kf-weight-display) clamp(40px, 6vw, 88px)/0.9 var(--kf-font-display); }
</style>
</head>
<body>
<p class="demo-hint"><b>torch-fog-gl</b> — Move the mouse over the panel. A torch light follows the cursor. <span>(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<section class="stage" data-fx="torch-fog-gl"><h2>Your section title here</h2></section>
<section class="stage" data-demo-remove data-fx="torch-fog-gl" data-fx-torch-fog-gl="follow: 6"><h2>Dropped Panel</h2></section>
<template data-demo-late><section class="stage" data-fx="torch-fog-gl" data-fx-torch-fog-gl="speed: 2"><h2>Late panel</h2></section></template>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); }, 2500);
</script>
</body>
</html>
