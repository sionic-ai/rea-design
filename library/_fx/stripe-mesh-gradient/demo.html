<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>stripe-mesh-gradient — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { display: flex; flex-wrap: wrap; gap: 32px; padding: 48px 20px; align-items: center; }
  .tri { width: 320px; height: 280px; clip-path: polygon(50% 0, 100% 100%, 0 100%); }
  .disc { width: 280px; height: 280px; border-radius: 50%; }
  .band { width: 100%; height: 240px; border-radius: var(--kf-radius-md); }
</style>
</head>
<body>
<p class="demo-hint"><b>stripe-mesh-gradient</b> — The accent-color gradient inside the shape flows slowly like paint. <span style="color:var(--kf-dim)">(After 1s a band comes in, and 2.5s later a circle leaves)</span></p>
<section class="demo">
  <div class="tri" data-fx="stripe-mesh-gradient" data-fx-stripe-mesh-gradient="amp: 450; seed: 5"></div>
  <div class="disc" data-fx="stripe-mesh-gradient" data-fx-stripe-mesh-gradient="amp: 400; seed: 17; speed: 8e-6; vspeed: 14; vflow: 4.5"></div>
  <div class="disc" data-demo-remove data-fx="stripe-mesh-gradient" data-fx-stripe-mesh-gradient="amp: 500; seed: 31; speed: 4e-6; vspeed: 8; vflow: 2.5"></div>
  <template data-demo-late><div class="band" data-fx="stripe-mesh-gradient" data-fx-stripe-mesh-gradient="fade: 0"></div></template>
</section>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/CustomEase.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
