<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>float-pieces-3d — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo-stage { height: 80vh; overflow: hidden; display: grid; place-items: center; border-bottom: 1px solid var(--kf-line); }
  .demo-photo { position: relative; z-index: 1; width: 40%; aspect-ratio: 4 / 5; }
  .demo-gap { height: 40vh; }
</style>
</head>
<body>
<p class="demo-hint"><b>float-pieces-3d</b> — Move the mouse and click a piece. Pieces fly in and float, and clicking makes them roll upright. <span style="color:var(--kf-dim)">(After 1s one more panel comes in, and one leaves 2.5s later)</span></p>
<section class="demo-stage" data-fx="float-pieces-3d"><div data-fx-part="back"></div><div class="demo-photo wf-img" data-label="Person illustration · Vertical"></div><div data-fx-part="front"></div></section>
<section class="demo-stage" data-fx="float-pieces-3d" data-fx-float-pieces-3d="look: board" data-demo-remove><div data-fx-part="back"></div><div data-fx-part="front"></div></section>
<section class="demo-stage" data-fx="float-pieces-3d"><p>Board with no image slot — nothing is hung on it</p></section>
<template data-demo-late><section class="demo-stage" data-fx="float-pieces-3d" data-fx-float-pieces-3d="look: board; delay: .2"><div data-fx-part="back"></div><div data-fx-part="front"></div></section></template>
<div class="demo-gap"></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="three-global.js"></script>
<script src="../../_vendor/three@0.180.0/build/three.cjs"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
