<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>underline-regrow-hover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { padding: 48px 20px; display: flex; gap: 48px; flex-wrap: wrap; }
  .more { padding: .5em 0; font-size: 14px; letter-spacing: .02rem; text-transform: uppercase; }
  .more span { padding-bottom: .2em; }
</style>
</head>
<body>
<p class="demo-hint"><b>underline-regrow-hover</b> — Hover over the link and then release. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<section class="demo">
  <a data-demo-remove class="more" data-fx="underline-regrow-hover" href="#"><span>Learn more</span><i data-fx-part="line"></i></a>
  <a class="more" data-fx="underline-regrow-hover" href="#"><span>View all</span><i data-fx-part="line"></i></a>
  <a class="more" data-fx="underline-regrow-hover" data-fx-underline-regrow-hover="dur: .8" href="#"><span>Slow stroke</span><i data-fx-part="line"></i></a>
  <a class="more" data-fx="underline-regrow-hover" href="#">Link without underline</a>
  <template data-demo-late><a class="more" data-fx="underline-regrow-hover" href="#"><span>Late-arrived Link</span><i data-fx-part="line"></i></a></template>
</section>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
