<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dot-repel — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { padding: 10vh 40px 60vh; display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 40px; }
  .demo [data-fx] { height: 360px; border: 1px solid var(--kf-line); font: var(--kf-weight-display) 120px/1 var(--kf-font-display); }
</style>
</head>
<body>
<p class="demo-hint"><b>dot-repel</b> — Move the mouse over the image or text made of dots. The dots are pushed away, then return with a ripple. <span style="color:var(--kf-dim)">(After 1s one more panel comes in, and one leaves 2.5s later)</span></p>
<section class="demo" id="box">
  <div data-fx="dot-repel" data-fx-dot-repel="size: 2.5; gap: 7; push: 5; fit: contain"><img data-fx-part="source" alt="" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 240'%3E%3Cellipse cx='100' cy='80' rx='55' ry='65' fill='%23999'/%3E%3Cpath d='M20 240c0-60 35-90 80-90s80 30 80 90z' fill='%23666'/%3E%3C/svg%3E"></div>
  <div data-fx="dot-repel" data-fx-dot-repel="color: accent">Dot letters</div>
  <div data-fx="dot-repel" data-demo-remove>Omission</div>
  <div data-fx="dot-repel"></div>
</section>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => { const d = document.createElement("div"); d.dataset.fx = "dot-repel"; d.textContent = "Late"; document.getElementById("box").append(d); }, 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
