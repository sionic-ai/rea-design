<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tile-cycle-grid — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { padding: 40px 20px; display: grid; gap: 40px; justify-items: center; }
  .board { width: min(560px, 92vw); aspect-ratio: 1; border: 1px solid var(--kf-line); }
  .board svg { width: 70%; height: 70%; }
  .board p { font: 700 13px/1.1 var(--kf-font-display); white-space: pre; }
</style>
</head>
<body>
<p class="demo-hint"><b>tile-cycle-grid</b> — Just watch. In each empty cell a piece rises from below, stays 4 seconds, then exits upward (the center cell is left empty).</p>
<section class="demo">
  <div class="board" data-fx="tile-cycle-grid">
    <svg data-fx-part="tile" viewBox="0 0 100 100"><path d="M32 100A68 68 0 0 1 100 32" fill="none" stroke="currentColor" stroke-width="40" transform="translate(-10 -10) scale(.8)"/></svg>
    <svg data-fx-part="tile" viewBox="0 0 100 100"><circle cx="50" cy="50" r="30" fill="none" stroke="currentColor" stroke-width="16"/></svg>
    <svg data-fx-part="tile" viewBox="0 0 100 100"><path d="M20 80 80 20M20 20h60v60" fill="none" stroke="currentColor" stroke-width="10"/></svg>
    <p data-fx-part="tile" data-side="off">Here
Word
Three (native Korean)</p>
  </div>
  <div class="board" data-fx="tile-cycle-grid" data-fx-tile-cycle-grid="n: 3; workers: 4">
    <svg data-fx-part="tile" viewBox="0 0 100 100"><rect x="25" y="25" width="50" height="50" fill="currentColor"/></svg>
    <svg data-fx-part="tile" viewBox="0 0 100 100"><circle cx="50" cy="50" r="26" fill="currentColor"/></svg>
  </div>
</section>
<script>
// Late arrivals and removals — checks that fx-core attaches to an element added after 1s and detaches from an element removed after 2.5s
(() => {
  const src = document.querySelector('[data-fx~="tile-cycle-grid"]');
  if (!src) return;
  const html = src.outerHTML;
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => src.parentNode.append(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s, one more panel comes in (the late one), and after 2.5s one drops out (the removal).");
})();
</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
