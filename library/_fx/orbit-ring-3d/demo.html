<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>orbit-ring-3d — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .stage { height: 640px; background: radial-gradient(60% 60% at 50% 50%, var(--kf-accent-soft), transparent 70%); font-family: var(--kf-font-display); }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 12px; }
  .row > div { height: 360px; border: 1px solid var(--kf-line); }
</style>
</head>
<body>
<p class="demo-hint"><b>orbit-ring-3d</b> — A tilted ring of sentences orbits a 3D object in the center. The ring text is hidden when it passes behind the object. In the lower cells, one is added after 1 second and one is erased.</p>
<div class="stage" data-fx="orbit-ring-3d" aria-label="Your linking sentence goes here"></div>
<div class="row" id="row">
  <div data-fx="orbit-ring-3d" data-fx-orbit-ring-3d="shape: petals; ring: 0; size: 1.3" style="--fx-body: var(--kf-accent)"></div>
  <div id="gone" data-fx="orbit-ring-3d" data-fx-orbit-ring-3d="text: Panel to be erased; tilt: 18; roll: 8"></div>
</div>
<script src="three-global.js"></script>
<script src="../../_vendor/three@0.174.0/build/three.cjs"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
  setTimeout(() => {
    const d = document.createElement("div");
    d.setAttribute("data-fx", "orbit-ring-3d");
    d.setAttribute("data-fx-orbit-ring-3d", "text: Latecomer panel; turn: 12");
    document.getElementById("row")?.appendChild(d);
    document.getElementById("gone")?.remove();
  }, 1000);
</script>
</body>
</html>
