<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>flip-to-target — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { margin: 0; font-family: var(--kf-font-sans); background: var(--kf-bg); color: var(--kf-ink); }
  .hero { min-height: 100vh; display: grid; place-content: center; font-size: 12vw; font-weight: 800; line-height: 0.92; }
  .line { display: flex; align-items: center; gap: 0.16em; }
  .slot { position: relative; display: block; width: 2.1em; }
  .slot::before { content: ""; display: block; padding-top: 56.25%; }
  .reel { width: 86vw; margin: 0 auto 60vh; position: relative; }
  .reel::before { content: ""; display: block; padding-top: 56.25%; }
  .reel > div { position: absolute; inset: 0; }
  .demo-hint { position: fixed; top: 0; left: 0; padding: 16px; font-size: 14px; z-index: 9; }
</style>
</head>
<body>
  <p class="demo-hint"><b>flip-to-target</b> — Scroll down — the small box in the title grows and settles into the large spot below. Move the mouse and the box tilts.</p>
  <section class="hero"><span class="line">WE</span><span class="line">SHOW <span class="slot"><span data-fx="flip-to-target" data-fx-flip-to-target="target: #slot" style="position:absolute; inset:0"><span data-fx-part="tilt" class="wf-img" data-label="Video"></span></span></span></span><span class="line">WORK.</span></section>
  <section class="reel"><div id="slot"></div></section>
  <template data-demo-late><span data-fx="flip-to-target" data-fx-flip-to-target="target: #slot; tilt: 0" style="display:block; width:120px; height:68px; margin: 0 auto"></span></template>
  <span data-fx="flip-to-target" data-fx-flip-to-target="target: #nothing" data-demo-remove></span>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../../../_shared/vendor/gsap/Flip.min.js"></script>
<script>gsap.registerPlugin(ScrollTrigger, Flip);</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
