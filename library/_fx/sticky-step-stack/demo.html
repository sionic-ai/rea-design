<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sticky-step-stack — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { padding: 48px 20px 60vh; max-width: 900px; margin: 0 auto; }
  .demo li { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; padding-top: 16px; }
  .demo h3 { font-size: 22px; height: 44px; }
  .demo .wf-img { border-top: 1px solid var(--kf-accent); }
  .demo-spacer { height: 60vh; display: grid; place-items: center; color: var(--kf-dim); }
</style>
</head>
<body>
<p class="demo-hint"><b>sticky-step-stack</b> — Scroll down and the row titles remain like stairs, with the next row stacking beneath them. <span style="color:var(--kf-dim)">(After 1s one more line comes in, and one leaves 2.5s later)</span></p>
<div class="demo-spacer">Scroll down</div>
<ul class="demo" data-fx="sticky-step-stack" data-fx-sticky-step-stack="top: 60; step: 60; height: 560; shrink: 60">
  <li data-fx-part="item"><h3>Your strength 1 here</h3><div class="wf-img wf-r-4x3" data-label="Line drawing"></div></li>
  <li data-fx-part="item" data-demo-remove><h3>Your strength 2 here</h3><div class="wf-img wf-r-4x3" data-label="Line drawing"></div></li>
  <li data-fx-part="item"><h3>Your strength 3 here</h3><div class="wf-img wf-r-4x3" data-label="Line drawing"></div></li>
  <template data-demo-late><li data-fx-part="item"><h3>Late-arrived Strength</h3><div class="wf-img wf-r-4x3" data-label="Line drawing"></div></li></template>
</ul>
<div class="demo-spacer"></div>
<ul data-fx="sticky-step-stack"></ul>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
