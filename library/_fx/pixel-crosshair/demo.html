<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pixel-crosshair — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); min-height: 100vh; }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .row { display: flex; gap: 24px; padding: 40px 20px; flex-wrap: wrap; }
  .card { width: 180px; height: 220px; background: var(--kf-raised); display: grid; place-items: center; color: var(--kf-dim); }
</style>
</head>
<body>
<p class="demo-hint"><b>pixel-crosshair</b> — Hover over a card. A crosshair at the screen center spins and grows, and the text rises.</p>
<div class="row">
  <div class="card" data-crosshair="OPEN PROJECT">Photo 1</div>
  <div class="card" data-crosshair="VIEW PRODUCT">Product 2</div>
  <div class="card" data-demo-remove data-crosshair="Erase">Cell to erase</div>
</div>
<div data-fx="pixel-crosshair" aria-hidden="true"><i data-fx-part="box"></i><i data-fx-part="fill"></i><p data-fx-part="label"><span>OPEN PROJECT</span></p></div>
<div data-fx="pixel-crosshair" data-demo-remove aria-hidden="true"><i data-fx-part="box"></i></div>
<template data-demo-late><div data-fx="pixel-crosshair" data-fx-pixel-crosshair="size-in: 16; turn: 45" aria-hidden="true"><i data-fx-part="box"></i><i data-fx-part="fill"></i></div></template>
<div data-fx="pixel-crosshair"></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
setTimeout(() => document.dispatchEvent(new CustomEvent("fx:crosshair", { detail: { on: true, label: "Turned on by event" } })), 1500);
setTimeout(() => document.dispatchEvent(new CustomEvent("fx:crosshair", { detail: { on: false } })), 3000);
</script>
</body>
</html>
