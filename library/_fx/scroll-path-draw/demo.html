<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>scroll-path-draw — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.7 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; margin: 0; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .river { position: fixed; inset: 0; z-index: 0; width: min(60vw, 260px); height: 80vh; margin: auto; overflow: visible; pointer-events: none; }
  .river .track { fill: none; stroke: var(--kf-line); }
  .sec { position: relative; z-index: 1; display: grid; place-items: center; height: 90vh; color: var(--kf-dim); }
  .side { width: 120px; height: 200px; margin: 0 auto 40vh; overflow: visible; }
  .side .track { fill: none; stroke: var(--kf-line); }
</style>
</head>
<body>
<p class="demo-hint"><b>scroll-path-draw</b> — Wait 1 second at the top and a streak of light runs along the line. Scroll down and the center line is drawn as far as you scroll.</p>
<svg class="river" data-fx="scroll-path-draw" viewBox="0 0 236 549" aria-hidden="true">
  <path class="track" d="M118 8C96 60 150 92 128 150S70 210 98 268s70 70 40 130-60 70-20 143"/>
  <path data-fx-part="glint" d="M118 8C96 60 150 92 128 150S70 210 98 268s70 70 40 130-60 70-20 143"/>
  <path data-fx-part="line" d="M118 8C96 60 150 92 128 150S70 210 98 268s70 70 40 130-60 70-20 143"/>
</svg>
<section class="sec">Your first section here</section>
<section class="sec">Your second section here</section>
<svg class="side" id="gone" data-fx="scroll-path-draw" data-fx-scroll-path-draw="range: self; scrub: 0" viewBox="0 0 120 200" aria-hidden="true"><path class="track" d="M60 0C10 50 110 100 60 200"/><path data-fx-part="line" d="M60 0C10 50 110 100 60 200"/></svg>
<section class="sec">Your third section here</section>
<div id="late-slot"></div>
<section class="sec">Your fourth section here</section>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Check whether it attaches to a late panel (after 1s one line ”While this panel passes”), and whether detach runs when a panel is removed (one removed after 2.5s)
(() => {
  setTimeout(() => {
    document.getElementById("late-slot").innerHTML = '<svg class="side" data-fx="scroll-path-draw" data-fx-scroll-path-draw="range: self" viewBox="0 0 120 200" aria-hidden="true"><path class="track" d="M60 0C110 60 10 120 60 200"/><path data-fx-part="line" d="M60 0C110 60 10 120 60 200"/></svg>';
  }, 1000);
  setTimeout(() => document.getElementById("gone")?.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s one more line comes in, and after 2.5s one leaves.");
})();
</script>
</body>
</html>
