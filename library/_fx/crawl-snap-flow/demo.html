<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>crawl-snap-flow — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="../../_vendor/swiper@11.2.10/swiper-bundle.min.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); overflow-x: hidden; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  /* Grid cells default to min-width: auto, so they stretch to the full width of the Swiper strip (sum of all cells) and every cell counts as visible — bind the cell width to the screen */
  .demo { padding: 40px 0; display: grid; grid-template-columns: minmax(0, 1fr); gap: 56px; }
  .demo .swiper-slide { width: 61vw; height: 34vw; }
  .demo .swiper-slide .wf-img { height: 100%; }
  .demo .is-small .swiper-slide { width: 29vw; height: 44vw; }
  .demo [data-fx-part="indicator"] { width: 218px; margin: 33px 46px 0 auto; }
</style>
</head>
<body>
<p class="demo-hint"><b>crawl-snap-flow</b> — Watch the strip for about 7 seconds. It crawls slowly, then flips one cell at the center. You can also drag to flip. <span style="color:var(--kf-dim)">(After 1s one more band comes in, and one leaves 2.5s later)</span></p>
<section class="demo">
  <div data-fx="crawl-snap-flow"><div class="swiper" data-fx-part="track"><div class="swiper-wrapper"><div class="swiper-slide"><div class="wf-img" data-label="Classroom lesson scene 01 · window daylight · landscape 11:10"></div></div><div class="swiper-slide"><div class="wf-img" data-label="Classroom lesson scene 02 · window daylight · landscape 11:10"></div></div><div class="swiper-slide"><div class="wf-img" data-label="Classroom lesson scene 03 · window daylight · landscape 11:10"></div></div><div class="swiper-slide"><div class="wf-img" data-label="Classroom lesson scene 04 · window daylight · landscape 11:10"></div></div><div class="swiper-slide"><div class="wf-img" data-label="Classroom lesson scene 05 · window daylight · landscape 11:10"></div></div><div class="swiper-slide"><div class="wf-img" data-label="Classroom lesson scene 06 · window daylight · landscape 11:10"></div></div><div class="swiper-slide"><div class="wf-img" data-label="Classroom lesson scene 07 · window daylight · landscape 11:10"></div></div><div class="swiper-slide"><div class="wf-img" data-label="Classroom lesson scene 08 · window daylight · landscape 11:10"></div></div></div></div><div data-fx-part="indicator"><svg data-fx-part="tick" width="17" height="17" viewBox="0 0 17 17" fill="none"><path d="M16.5 1L1 16.5" stroke="currentColor"/></svg></div></div>
  <div class="is-small" data-demo-remove data-fx="crawl-snap-flow" data-fx-crawl-snap-flow="speed: 4000"><div class="swiper" data-fx-part="track"><div class="swiper-wrapper"><div class="swiper-slide"><div class="wf-img" data-label="Classroom lesson scene 01 · window daylight · landscape 11:10"></div></div><div class="swiper-slide"><div class="wf-img" data-label="Classroom lesson scene 02 · window daylight · landscape 11:10"></div></div><div class="swiper-slide"><div class="wf-img" data-label="Classroom lesson scene 03 · window daylight · landscape 11:10"></div></div><div class="swiper-slide"><div class="wf-img" data-label="Classroom lesson scene 04 · window daylight · landscape 11:10"></div></div><div class="swiper-slide"><div class="wf-img" data-label="Classroom lesson scene 05 · window daylight · landscape 11:10"></div></div><div class="swiper-slide"><div class="wf-img" data-label="Classroom lesson scene 06 · window daylight · landscape 11:10"></div></div><div class="swiper-slide"><div class="wf-img" data-label="Classroom lesson scene 07 · window daylight · landscape 11:10"></div></div><div class="swiper-slide"><div class="wf-img" data-label="Classroom lesson scene 08 · window daylight · landscape 11:10"></div></div></div></div></div>
  <template data-demo-late><div class="is-small" data-fx="crawl-snap-flow" data-fx-crawl-snap-flow="gap: 0" style="--fx-flow-ease: linear"><div class="swiper" data-fx-part="track"><div class="swiper-wrapper"><div class="swiper-slide"><div class="wf-img" data-label="Classroom lesson scene 01 · window daylight · landscape 11:10"></div></div><div class="swiper-slide"><div class="wf-img" data-label="Classroom lesson scene 02 · window daylight · landscape 11:10"></div></div><div class="swiper-slide"><div class="wf-img" data-label="Classroom lesson scene 03 · window daylight · landscape 11:10"></div></div><div class="swiper-slide"><div class="wf-img" data-label="Classroom lesson scene 04 · window daylight · landscape 11:10"></div></div><div class="swiper-slide"><div class="wf-img" data-label="Classroom lesson scene 05 · window daylight · landscape 11:10"></div></div><div class="swiper-slide"><div class="wf-img" data-label="Classroom lesson scene 06 · window daylight · landscape 11:10"></div></div><div class="swiper-slide"><div class="wf-img" data-label="Classroom lesson scene 07 · window daylight · landscape 11:10"></div></div><div class="swiper-slide"><div class="wf-img" data-label="Classroom lesson scene 08 · window daylight · landscape 11:10"></div></div></div></div></div></template>
  <div data-fx="crawl-snap-flow"></div>
</section>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../_vendor/swiper@11.2.10/swiper-bundle.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
