<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>drag-loop-lerp — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.6 var(--kf-font-sans); margin: 0; }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-row { height: 45vh; margin: 40px 0; }
  .demo-row figure { margin: 0; }
  .demo-row figure::after { content: ""; display: block; height: 100%; background: var(--kf-raised); border: 1px solid var(--kf-line); }
  .demo-row figure:nth-of-type(3n) { width: 28vw; }
  .demo-row figure:nth-of-type(3n+1) { width: 18vw; }
  .demo-row figure:nth-of-type(3n+2) { width: 24vw; }
</style>
</head>
<body>
<p class="demo-hint"><b>drag-loop-lerp</b> — Hover over the photo row and drag left and right. The row glides and loops endlessly, and a circle follows the cursor. (After 1 second one more row comes in and after 2.5 seconds one leaves)</p>
<div class="demo-row" data-fx="drag-loop-lerp">
  <figure data-fx-part="item"></figure><figure data-fx-part="item"></figure><figure data-fx-part="item"></figure>
  <figure data-fx-part="item"></figure><figure data-fx-part="item"></figure><figure data-fx-part="item"></figure>
  <figure data-fx-part="item"></figure><figure data-fx-part="item"></figure>
  <div data-fx-part="disc"><span>DRAG</span></div>
</div>
<div class="demo-row" data-fx="drag-loop-lerp" data-demo-remove><figure data-fx-part="item"></figure><figure data-fx-part="item"></figure></div>
<div data-demo-late-host></div>
<div class="demo-row" data-fx="drag-loop-lerp"></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => {
  const d = document.createElement("div");
  d.className = "demo-row";
  d.dataset.fx = "drag-loop-lerp";
  d.dataset.fxDragLoopLerp = "power: 1.5";
  d.innerHTML = '<figure data-fx-part="item"></figure>'.repeat(7);
  document.querySelector("[data-demo-late-host]").append(d);
}, 1000);
setTimeout(() => document.querySelector("[data-demo-remove]")?.remove(), 2500);
</script>
</body>
</html>
