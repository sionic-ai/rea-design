<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>clone-ticker-loop — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .band { margin: 40px 0; }
  .band ul { gap: 30px; padding-left: 30px; }
  .band li { width: 280px; aspect-ratio: 280 / 186; border-radius: 20px; overflow: hidden; }
  .band .wf-img { height: 100%; border: 0; }
  .words { width: 320px; margin: 40px; border: 1px dashed var(--kf-ink); border-radius: 25px; }
  .words span { padding: 10px 14px; font-weight: 700; white-space: nowrap; }
</style>
</head>
<body>
<p class="demo-hint"><b>clone-ticker-loop</b> — The photo row and text band flow endlessly to the left (photos 40s, text 6s). <span style="color:var(--kf-dim)">(After 1s one more band comes in, and one leaves 2.5s later)</span></p>
<div class="band" data-fx="clone-ticker-loop"><ul data-fx-part="track"><li><div class="wf-img" data-label="Photo 1"></div></li><li><div class="wf-img" data-label="Photo 2"></div></li><li><div class="wf-img" data-label="Photo 3"></div></li></ul></div>
<div class="words" data-fx="clone-ticker-loop" style="--fx-dur: 6s"><p data-fx-part="track"><span>HOT!</span><span>HOT!</span><span>HOT!</span></p></div>
<div class="words" data-fx="clone-ticker-loop" style="--fx-dur: 4s" data-demo-remove><p data-fx-part="track"><span>Omission</span><span>Omission</span></p></div>
<div id="late"></div>
<template data-demo-late><div class="words" data-fx="clone-ticker-loop" style="--fx-dur: 8s"><p data-fx-part="track"><span>Late</span><span>Coming in</span></p></div></template>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
