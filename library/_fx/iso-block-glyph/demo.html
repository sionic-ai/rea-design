<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iso-block-glyph — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.6 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 10; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .row { display: flex; flex-wrap: wrap; gap: 30px; padding: 40px; align-items: center; }
  .box { width: min(480px, 90vw); aspect-ratio: 1; background: var(--kf-surface); border-radius: var(--kf-radius-lg); }
  .tall { width: 160px; aspect-ratio: 196 / 364; background: var(--kf-accent); border-radius: var(--kf-radius-md); }
</style>
</head>
<body>
<p class="demo-hint"><b>iso-block-glyph</b> — Look at the left panel. Block letters wobble, spin and change into other letters, with decoration circling around. The right is a single still. <span style="color:var(--kf-dim)">(After 1s one more panel comes in, and one leaves 2.5s later)</span></p>
<div class="row" id="row">
  <div class="box" data-fx="iso-block-glyph" data-fx-iso-block-glyph="first: A; second: B"><canvas></canvas></div>
  <div class="tall" data-fx="iso-block-glyph" data-fx-iso-block-glyph="still: true; letter: B"></div>
  <div class="tall" data-fx="iso-block-glyph" data-demo-remove></div>
  <div data-fx="iso-block-glyph" data-fx-iso-block-glyph="wait: fx:play"></div>
</div>
<script src="../../_vendor/createjs@1.0.1/createjs.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => { const d = document.createElement("div"); d.className = "tall"; d.dataset.fx = "iso-block-glyph"; d.dataset.fxIsoBlockGlyph = "still: true"; document.getElementById("row")?.append(d); }, 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
