<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>drift-arc-scrub — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .gap { height: 60vh; display: grid; place-items: center; color: var(--kf-dim); }
  .c { border-radius: var(--kf-radius-sm); background: var(--kf-raised); border: 1px solid var(--kf-line); }
  .c.round { border-radius: 50%; background: var(--kf-accent-soft); }
  p[data-fx-part="title"] { font: 500 20px/1.4 var(--kf-font-sans); }
</style>
</head>
<body>
<p class="demo-hint"><b>drift-arc-scrub</b> — Scroll down. The sentence stays put while cards pass by in a wave.</p>
<div class="gap">↓</div>
<section data-fx="drift-arc-scrub">
  <div data-fx-part="stage">
    <p data-fx-part="title">Your one centered sentence here, in about two lines.</p>
    <div data-fx-part="track">
      <div class="c" data-fx-part="card"></div><div class="c" data-fx-part="card"></div><div class="c round" data-fx-part="card"></div>
      <div class="c" data-fx-part="card"></div><div class="c" data-fx-part="card"></div><div class="c round" data-fx-part="card"></div>
      <div class="c" data-fx-part="card"></div><div class="c" data-fx-part="card"></div><div class="c" data-fx-part="card"></div>
    </div>
  </div>
</section>
<div class="gap">Footer</div>
<section data-demo-remove data-fx="drift-arc-scrub"><div data-fx-part="stage"><div data-fx-part="track"><div class="c" data-fx-part="card"></div></div></div></section>
<template data-demo-late><section data-fx="drift-arc-scrub" data-fx-drift-arc-scrub="rise: .2; grow: 1"><div data-fx-part="stage"><div data-fx-part="track"><div class="c" data-fx-part="card"></div><div class="c" data-fx-part="card"></div></div></div></section></template>
<div class="gap"></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
