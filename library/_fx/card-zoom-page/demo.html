<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>card-zoom-page — Motion part</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-raised); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); margin: 0; }
  .stage { height: 80vh; display: flex; }
  .card { margin: auto; width: 83%; aspect-ratio: 2 / 1; }
  @media (max-width: 1023px) { .card { width: 280px; aspect-ratio: 1 / 2.8; } }
  .card [data-fx-part="mini"] { padding: 20px; }
  .card h2 { font: 700 16vw/0.8 var(--kf-font-display); margin: 0; }
  .card .ph { margin-top: 24px; height: 60vh; background: var(--kf-raised); }
  @media (min-width: 1024px) { .card [data-fx-part="column"]:nth-child(1) { width: 43%; } .card [data-fx-part="column"]:nth-child(2) { width: 33%; } .card [data-fx-part="column"]:nth-child(3) { width: 24%; } }
</style>
</head>
<body>
<p class="demo-hint"><b>card-zoom-page</b> — Press one cell of the card. The card unfolds three times larger, that cell covers the screen and goes to its address (#). On refresh it shrinks from that cell back to the card.</p>
<div class="stage">
  <div class="card" data-fx="card-zoom-page"><div data-fx-part="scale"><div data-fx-part="stretcher">
    <div data-fx-part="column"><a href="#about" aria-label="About"></a><div data-fx-part="mini"><h2>About</h2><div class="ph"></div></div></div>
    <div data-fx-part="column"><a href="#works" aria-label="Work"></a><div data-fx-part="mini"><h2>Work</h2><div class="ph"></div></div></div>
    <div data-fx-part="column"><a href="#more" aria-label="See more"></a><div data-fx-part="mini"><h2>More</h2><div class="ph"></div></div></div>
  </div></div></div>
</div>
<div data-fx="card-zoom-page" data-demo-remove></div>
<template data-demo-late><div class="stage"><div class="card" data-fx="card-zoom-page" data-fx-card-zoom-page="dur: 0.6; back: 0"><div data-fx-part="scale"><div data-fx-part="stretcher"><div data-fx-part="column"><a href="#late" aria-label="Late cell"></a><div data-fx-part="mini"><h2>Late</h2></div></div></div></div></div></div></template>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/CustomEase.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
  setTimeout(() => {
    const t = document.querySelector("[data-demo-late]");
    t.after(t.content.cloneNode(true));
    document.querySelector("[data-demo-remove]")?.remove();
  }, 1000);
</script>
</body>
</html>
