<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>char-clip-slide — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { padding: 48px 20px; display: grid; gap: 32px; }
  .big { margin: 0; font: 400 88px/.9 var(--kf-font-display); max-width: 10ch; }
  .menu-row { margin: 0; font: 600 40px/.9 var(--kf-font-display); text-transform: uppercase; }
  .demo-btn { display: inline-flex; align-items: center; height: 40px; padding: 0 16px; border: 1px solid var(--kf-line); border-radius: var(--kf-radius-sm); background: var(--kf-surface); color: var(--kf-ink); cursor: pointer; width: fit-content; }
  .demo-spacer { height: 70vh; display: grid; place-items: center; color: var(--kf-dim); }
</style>
</head>
<body>
<p class="demo-hint"><b>char-clip-slide</b> — The big title slides in from the left on open, the lower title when it becomes visible, and the menu row when a button is pressed.</p>
<div class="demo">
  <h2 class="big" data-fx="char-clip-slide" data-fx-char-clip-slide="play: load; delay: .3; each: .04">A Big Serif Title</h2>
  <button class="demo-btn" type="button" id="again">Menu line again</button>
  <p class="menu-row" data-fx="char-clip-slide" data-fx-char-clip-slide="play: event">Menu Item</p>
</div>
<div class="demo-spacer">Scroll down</div>
<div class="demo"><h2 class="big" data-fx="char-clip-slide">Seen On Scroll</h2></div>
<div class="demo-spacer"></div>
<script>
document.getElementById("again").addEventListener("click", () => {
  const row = document.querySelector(".menu-row");
  row.dispatchEvent(new CustomEvent("fx:reset"));
  requestAnimationFrame(() => row.dispatchEvent(new CustomEvent("fx:play")));
});
setTimeout(() => document.querySelector(".menu-row").dispatchEvent(new CustomEvent("fx:play")), 600);
(() => {
  const src = document.querySelector('[data-fx~="char-clip-slide"]');
  if (!src) return;
  const html = src.outerHTML.replace(/\sid="[^"]*"/g, "");
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => src.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical one comes in, and after 2.5s one drops out (detach).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/CustomEase.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
