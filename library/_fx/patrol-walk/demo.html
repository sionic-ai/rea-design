<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>patrol-walk — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .street { position: relative; height: 200px; margin: 40px 20px; border-bottom: 2px solid var(--kf-line); }
  .walker { position: absolute; bottom: 0; width: 34px; height: 90px; }
  .fig { width: 100%; height: 100%; }
  .fig svg { width: 100%; height: 100%; }
  .fig .h { fill: var(--kf-accent-soft); stroke: var(--kf-ink); }
  .fig .b { fill: var(--kf-accent); }
  .fig .n { fill: var(--kf-ink); }
</style>
</head>
<body>
<p class="demo-hint"><b>patrol-walk</b> — People walk a set distance and turn back (they face the direction their nose points). <span style="color:var(--kf-dim)">(After 1s one more person comes in, and one leaves 2.5s later)</span></p>
<div class="street">
  <div class="walker" style="left:20px" data-fx="patrol-walk" data-fx-patrol-walk="dist: 600; speed: 120"><div class="fig" data-fx-part="body"><svg viewBox="0 0 34 90"><circle class="h" cx="17" cy="12" r="10"/><rect class="n" x="25" y="10" width="6" height="3"/><rect class="b" x="7" y="24" width="20" height="40" rx="4"/><rect class="n" x="9" y="64" width="6" height="26"/><rect class="n" x="19" y="64" width="6" height="26"/></svg></div></div>
  <div class="walker" style="left:640px" data-fx="patrol-walk" data-fx-patrol-walk="dist: 400; speed: 60; dir: left" data-demo-remove><div class="fig" data-fx-part="body"><svg viewBox="0 0 34 90"><circle class="h" cx="17" cy="12" r="10"/><rect class="n" x="25" y="10" width="6" height="3"/><rect class="b" x="7" y="24" width="20" height="40" rx="4"/><rect class="n" x="9" y="64" width="6" height="26"/><rect class="n" x="19" y="64" width="6" height="26"/></svg></div></div>
  <template data-demo-late><div class="walker fig" style="left:300px" data-fx="patrol-walk" data-fx-patrol-walk="dist: 200; speed: 40; flip: false"><svg viewBox="0 0 34 90"><circle class="h" cx="17" cy="12" r="10"/><rect class="b" x="7" y="24" width="20" height="40" rx="4"/></svg></div></template>
  <div class="walker" style="left:500px" data-fx="patrol-walk"></div>
</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
