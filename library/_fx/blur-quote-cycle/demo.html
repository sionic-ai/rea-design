<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>blur-quote-cycle — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { padding: 48px 20px; display: grid; gap: 64px; max-width: 900px; margin: 0 auto; }
  .tabs { position: relative; display: inline-flex; gap: 0; padding: 4px; border: 1px solid var(--kf-line); border-radius: var(--kf-radius-md); background: var(--kf-raised); }
  .tabs [data-fx-part="pill"] { top: 4px; bottom: 4px; border-radius: var(--kf-radius-sm); background: var(--kf-surface); box-shadow: var(--kf-shadow-soft); }
  .tabs button { width: 110px; height: 32px; border: 0; background: none; font: 600 14px/1 var(--kf-font-display); color: var(--kf-ink); }
  blockquote { margin-top: 40px; font: var(--kf-weight-display) 32px/1.25 var(--kf-font-display); letter-spacing: -0.02em; }
  figcaption { margin-top: 20px; color: var(--kf-dim); }
</style>
</head>
<body>
<p class="demo-hint"><b>blur-quote-cycle</b> — The quote advances every 8 seconds. Tap a tab to jump right to it. <span style="color:var(--kf-dim)">(After 1s one more set comes in, and one set leaves 2.5s later)</span></p>
<section class="demo">
  <div data-fx="blur-quote-cycle">
    <div class="tabs" role="tablist"><span data-fx-part="pill"></span><button data-fx-part="tab" aria-selected="true">Logo 01</button><button data-fx-part="tab">Logo 02</button><button data-fx-part="tab">Logo 03</button></div>
    <div data-fx-part="stage">
      <figure data-fx-part="quote"><blockquote>“Your customer quote here, about four lines. A tone of three short sentences in a row.”</blockquote><figcaption data-fx-part="by">Name · Title</figcaption></figure>
      <figure data-fx-part="quote"><blockquote>”Second quote. The length is slightly different.”</blockquote><figcaption data-fx-part="by">Name · Title</figcaption></figure>
      <figure data-fx-part="quote"><blockquote>”Third quote. The panel is fixed to the height of the longest quote so the area below doesn’t jump. One more line here.”</blockquote><figcaption data-fx-part="by">Name · Title</figcaption></figure>
    </div>
  </div>
  <div data-fx="blur-quote-cycle" data-fx-blur-quote-cycle="every: 3" data-demo-remove>
    <div class="tabs" role="tablist"><span data-fx-part="pill"></span><button data-fx-part="tab" aria-selected="true">3 sec</button><button data-fx-part="tab">B</button></div>
    <div data-fx-part="stage"><figure data-fx-part="quote"><blockquote>”Every 3s”</blockquote></figure><figure data-fx-part="quote"><blockquote>”Moves on”</blockquote></figure></div>
  </div>
  <template data-demo-late><div data-fx="blur-quote-cycle" data-fx-blur-quote-cycle="every: 2"><div class="tabs" role="tablist"><button data-fx-part="tab" aria-selected="true">Late</button><button data-fx-part="tab">Coming in</button></div><div data-fx-part="stage"><figure data-fx-part="quote"><blockquote>“Without pills”</blockquote></figure><figure data-fx-part="quote"><blockquote>”Spins”</blockquote></figure></div></div></template>
  <div data-fx="blur-quote-cycle"></div>
</section>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
