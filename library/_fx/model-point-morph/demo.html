<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>model-point-morph — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .stage { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 20px; }
  .box { height: 60vh; border: 1px solid var(--kf-line); }
  .bar { display: flex; gap: 8px; padding: 0 20px 80px; }
  .bar button { padding: 8px 14px; border: 1px solid var(--kf-line); background: var(--kf-surface); cursor: pointer; }
</style>
</head>
<body>
<p class="demo-hint"><b>model-point-morph</b> — Switch models with the buttons below. The point cloud flies off and becomes the next model. The right panel flips on its own every 3s. <span style="color:var(--kf-dim)">(After 1s one more panel comes in, and one leaves 2.5s later)</span></p>
<section class="stage">
  <div class="box" id="main" data-fx="model-point-morph">
    <i data-fx-part="model" data-shape="rocket" data-tilt="8,0,-28"></i>
    <i data-fx-part="model" data-shape="headset" data-tilt="14,-35,0"></i>
    <i data-fx-part="model" data-shape="helix" data-tilt="0,0,14"></i>
    <i data-fx-part="model" data-shape="rack" data-tilt="16,-22,0"></i>
  </div>
  <div class="box" data-demo-remove data-fx="model-point-morph" data-fx-model-point-morph="auto: 3">
    <i data-fx-part="model" data-shape="helix"></i>
    <i data-fx-part="model" data-shape="ball"></i>
  </div>
  <template data-demo-late><div class="box" data-fx="model-point-morph" data-fx-model-point-morph="auto: 2.5; index: 1"><i data-fx-part="model" data-shape="box" data-tilt="20,30,0"></i><i data-fx-part="model" data-shape="rack"></i></div></template>
  <div class="box" data-fx="model-point-morph"></div>
</section>
<div class="bar"><button type="button" data-go="0">01 Rocket</button><button type="button" data-go="1">02 Headset</button><button type="button" data-go="2">03 Spiral</button><button type="button" data-go="3">04 Holder</button></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../_vendor/ogl@1.0.11/ogl.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
document.querySelectorAll("[data-go]").forEach((b) => b.addEventListener("click", () => document.getElementById("main").dispatchEvent(new CustomEvent("fx:show", { detail: { index: +b.dataset.go } }))));
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
