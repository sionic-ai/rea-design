<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>edge-tab-drawer — Vertical tab drawer on the right edge</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { padding: 40px; min-height: 140vh; font-family: var(--kf-font-sans); color: var(--kf-ink); background: var(--kf-bg); }
  .box { padding: 48px; }
  .box a { display: block; padding: 14px 0; border-bottom: 1px solid var(--kf-line); }
</style>
</head>
<body>
<p>Tap the vertical tab at bottom right — a panel slides out from the right (after 1 s one more tab is added, after 2 s the first one drops out).</p>
<div id="stage">
  <div id="first" data-fx="edge-tab-drawer"><button type="button" data-fx-part="tab">Info you seek</button><div data-fx-part="panel"><div class="box"><p>Guide bundle</p><a href="#">Guide link 01</a><a href="#">Guide link 02</a><button type="button" data-fx-part="close">Close</button></div></div></div>
</div>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
  setTimeout(() => {
    const el = document.createElement("div");
    el.setAttribute("data-fx", "edge-tab-drawer");
    el.style.setProperty("--fx-width", "420px");
    el.innerHTML = '<button type="button" data-fx-part="tab">Second</button><div data-fx-part="panel"><div class="box"><a href="#">Link</a></div></div>';
    document.getElementById("stage").append(el);
  }, 1000);
  setTimeout(() => document.getElementById("first").remove(), 2000);
</script>
</body>
</html>
