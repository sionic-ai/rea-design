<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ring-trio-orbit — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { margin: 0; background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; margin: 0; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-spacer { height: 90vh; display: grid; place-items: center; color: var(--kf-dim); }
  .ro-sec { position: relative; height: 120vh; overflow: hidden; background: var(--kf-surface); }
  .ro-sec.is-b { background: var(--kf-bg); }
  .ro-orn { width: 100vw; height: 100%; }
  .ro-ring { width: 420px; height: 420px; border: 1px solid var(--kf-accent); filter: opacity(40%); }
  .ro-ring.is-core { filter: none; overflow: hidden; }
  .ro-ring.is-fill { border: 0; background: linear-gradient(10deg, var(--kf-ink), var(--kf-accent)); }
</style>
</head>
<body>
<p class="demo-hint"><b>ring-trio-orbit</b> Scroll down and two thin rings gather, then spread up and down (1.12x). The center circle shrinks to .8x and the whole group rotates one and a half turns.</p>
<div class="demo-spacer">Scroll down ↓</div>
<section class="ro-sec" data-demo-host>
  <div class="ro-orn" data-fx="ring-trio-orbit" data-fx-ring-trio-orbit="look: gather">
    <span class="ro-ring" data-fx-part="ring"></span><span class="ro-ring" data-fx-part="ring"></span><span class="ro-ring is-core" data-fx-part="ring"></span>
  </div>
</section>
<section class="ro-sec is-b">
  <div class="ro-orn" data-fx="ring-trio-orbit" data-fx-ring-trio-orbit="look: spread">
    <span class="ro-ring" data-fx-part="ring"></span><span class="ro-ring" data-fx-part="ring"></span><span class="ro-ring is-core is-fill" data-fx-part="ring"></span>
  </div>
</section>
<div class="demo-spacer"></div>
<script>
// Late arrivals and removals — checks that fx-core attaches to an element added after 1s and detaches from an element removed after 2.5s
(() => {
  const src = document.querySelector('[data-fx~="ring-trio-orbit"]');
  if (!src) return;
  const html = src.outerHTML.replace(/\sid="[^"]*"/g, "");
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const host = src.closest("[data-demo-host]") || src;
  const gone = make("gone");
  host.after(gone);
  setTimeout(() => (src.closest(".pin-spacer") || host).after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical one comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
