<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>goo-arrow-btn — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { padding: 10vh 40px; display: flex; flex-wrap: wrap; gap: 32px; align-items: center; font-size: 18px; }
  .is-accent { --fx-goo-bg: var(--kf-accent); --fx-goo-ink: var(--kf-on-accent); }
</style>
</head>
<body>
<p class="demo-hint"><b>goo-arrow-btn</b> — Hover over the button (1280px and up · the second button anywhere). The circle stretches stickily and the arrow turns 45°. <span style="color:var(--kf-dim)">(After 1s one more button comes in, and after 2.5s one drops out)</span></p>
<section class="demo" id="box">
  <a href="#" data-fx="goo-arrow-btn"><span data-fx-part="goo"><span data-fx-part="label">View work</span><span data-fx-part="disc"></span></span><span data-fx-part="arrow"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M3 1h8v8H9.5V3.6L2 11.1.9 10l7.5-7.5H3z"/></svg></span></a>
  <a href="#" class="is-accent" data-fx="goo-arrow-btn" data-fx-goo-arrow-btn="look: always"><span data-fx-part="goo"><span data-fx-part="label">Start Project</span><span data-fx-part="disc"></span></span><span data-fx-part="arrow"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M3 1h8v8H9.5V3.6L2 11.1.9 10l7.5-7.5H3z"/></svg></span></a>
  <a href="#" data-fx="goo-arrow-btn" data-demo-remove><span data-fx-part="goo"><span data-fx-part="label">Omitted button</span><span data-fx-part="disc"></span></span><span data-fx-part="arrow"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M3 1h8v8H9.5V3.6L2 11.1.9 10l7.5-7.5H3z"/></svg></span></a>
  <a href="#" data-fx="goo-arrow-btn">No circle</a>
</section>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => { const a = document.createElement("a"); a.href = "#"; a.dataset.fx = "goo-arrow-btn"; a.innerHTML = '<span data-fx-part="goo"><span data-fx-part="label">Late-arrived Button</span><span data-fx-part="disc"></span></span><span data-fx-part="arrow"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M3 1h8v8H9.5V3.6L2 11.1.9 10l7.5-7.5H3z"/></svg></span>'; document.getElementById("box").append(a); }, 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
