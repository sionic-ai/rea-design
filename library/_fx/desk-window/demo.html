<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>desk-window — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { padding: 48px 20px; display: flex; gap: 12px; flex-wrap: wrap; }
  .demo-btn { display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 16px; border: 1px solid var(--kf-line); border-radius: var(--kf-radius-sm); background: var(--kf-surface); color: var(--kf-ink); cursor: pointer; }
  .win { width: min(26rem, 90vw); padding: 8px; border-radius: var(--kf-radius-lg); background: color-mix(in oklab, var(--kf-ink) 10%, transparent); }
  .win__body { border-radius: var(--kf-radius-md); background: var(--kf-surface); overflow: hidden; }
  .win__bar { display: flex; align-items: center; gap: 6px; padding: 12px 14px; border-bottom: 1px solid var(--kf-line); }
  .win__bar span { margin-left: auto; margin-right: auto; font: 500 12px/1 var(--kf-font-mono); text-transform: uppercase; }
  .win__light { width: 14px; height: 14px; border: 0; border-radius: 50%; background: var(--kf-accent); cursor: pointer; }
  .win__light + .win__light { background: var(--kf-dim); }
  .win .wf-img { aspect-ratio: 4 / 3; border: 0; }
</style>
</head>
<body>
<p class="demo-hint"><b>desk-window</b> — Open windows with the button — each opens offset in 28px steps, drag the title bar to move, close or minimize with the traffic lights, and Esc closes the front window.</p>
<div class="demo">
  <button class="demo-btn" type="button" data-open="w1">Open window 1</button>
  <button class="demo-btn" type="button" data-open="w2">Open window 2</button>
  <button class="demo-btn" type="button" data-open="w3">Open window 3</button>
</div>
<section class="win" id="w1" data-fx="desk-window"><div class="win__body">
  <header class="win__bar" data-fx-part="bar"><button class="win__light" type="button" data-fx-part="close" aria-label="Close"></button><button class="win__light" type="button" data-fx-part="min" aria-label="Minimize"></button><span>Your_window_title_here_1</span></header>
  <div class="wf-img" data-label="Photo inside window · horizontal 4:3"></div>
</div></section>
<section class="win" id="w2" data-fx="desk-window"><div class="win__body">
  <header class="win__bar" data-fx-part="bar"><button class="win__light" type="button" data-fx-part="close" aria-label="Close"></button><button class="win__light" type="button" data-fx-part="min" aria-label="Minimize"></button><span>Your_window_title_here_2</span></header>
  <div class="wf-img" data-label="Photo inside window · horizontal 4:3"></div>
</div></section>
<section class="win" id="w3" data-fx="desk-window" data-fx-desk-window="cascade: 0; ease: 0.34,1.56,0.64,1"><div class="win__body">
  <header class="win__bar" data-fx-part="bar"><button class="win__light" type="button" data-fx-part="close" aria-label="Close"></button><button class="win__light" type="button" data-fx-part="min" aria-label="Minimize"></button><span>no_stairs_in_the_middle</span></header>
  <div class="wf-img" data-label="Photo inside window · horizontal 4:3"></div>
</div></section>
<script>
document.addEventListener("click", (e) => {
  const b = e.target.closest("[data-open]");
  if (b) document.getElementById(b.dataset.open)?.dispatchEvent(new Event("fx:open"));
});
// Late arrivals and removals — checks that fx-core attaches to an element added after 1s and detaches from an element removed after 2.5s
(() => {
  const src = document.querySelector('[data-fx~="desk-window"]');
  if (!src) return;
  const html = src.outerHTML.replace(/\sid="[^"]*"/g, "");
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => {
    const late = make("late");
    late.id = "w4";
    src.after(late);
    const btn = document.createElement("button");
    btn.className = "demo-btn"; btn.type = "button"; btn.dataset.open = "w4"; btn.textContent = "Open Late Window";
    document.querySelector(".demo").append(btn);
  }, 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s, one more window comes in (the late one), and after 2.5s one drops out (the removal).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
