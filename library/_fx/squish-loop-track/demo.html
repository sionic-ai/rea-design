<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>squish-loop-track — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.6 var(--kf-font-sans); }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .track { display: flex; gap: 8px; padding: 40px 8px; }
  .track a { display: block; width: 28vw; }
  .track a > div { aspect-ratio: 4 / 5; background: var(--kf-raised); border: 1px solid var(--kf-line); display: grid; place-items: center; }
</style>
</head>
<body>
<p class="demo-hint"><b>squish-loop-track</b> — Roll the wheel or drag over the strip. Push fast and the cells shrink and stretch, winding endlessly. <span style="color:var(--kf-dim)">(After 1s one more band comes in, and one leaves 2.5s later)</span></p>
<div class="track" data-fx="squish-loop-track">
  <a data-fx-part="item" href="#"><div data-fx-part="squish">Cell 1</div></a>
  <a data-fx-part="item" href="#"><div data-fx-part="squish">Cell 2</div></a>
  <a data-fx-part="item" href="#"><div data-fx-part="squish">Cell 3</div></a>
  <a data-fx-part="item" href="#"><div data-fx-part="squish">Cell 4</div></a>
  <a data-fx-part="item" href="#"><div data-fx-part="squish">Cell 5</div></a>
</div>
<div class="track" data-fx="squish-loop-track" data-fx-squish-loop-track="squish: .004; wheel: 1" data-demo-remove>
  <a data-fx-part="item" href="#"><div>Cell A</div></a><a data-fx-part="item" href="#"><div>Cell B</div></a><a data-fx-part="item" href="#"><div>Cell C</div></a><a data-fx-part="item" href="#"><div>Cell D</div></a>
</div>
<div class="track" data-fx="squish-loop-track"></div>
<template data-demo-late><div class="track" data-fx="squish-loop-track"><a data-fx-part="item" href="#"><div>Late 1</div></a><a data-fx-part="item" href="#"><div>Late 2</div></a><a data-fx-part="item" href="#"><div>Late 3</div></a><a data-fx-part="item" href="#"><div>Late 4</div></a></div></template>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
