<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pulse-blink-hover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { margin: 0; background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { display: grid; gap: 12px; max-width: 320px; margin: 40px auto; }
  .demo a, .demo button { display: flex; height: 32px; align-items: center; padding: 0 10px; border: 0; background: var(--kf-surface); color: inherit; font: inherit; text-decoration: none; cursor: pointer; }
  .demo .bar { background: var(--kf-accent); color: var(--kf-on-accent); }
</style>
</head>
<body>
<p class="demo-hint"><b>pulse-blink-hover</b> — Hover over the row. It blinks every .2s while hovered.</p>
<div class="demo" id="demo">
  <a href="#" data-fx="pulse-blink-hover">Your menu line here</a>
  <button class="bar" type="button" data-fx="pulse-blink-hover"><span data-fx-part="blink">More projects</span></button>
  <a href="#" data-fx="pulse-blink-hover" data-fx-pulse-blink-hover="look: slow">Slow blink (1s)</a>
</div>
<script>
(() => {
  const demo = document.getElementById("demo");
  const late = document.createElement("a");
  late.href = "#"; late.textContent = "Row entering after 1s"; late.setAttribute("data-fx", "pulse-blink-hover");
  setTimeout(() => demo.append(late), 1000);
  setTimeout(() => demo.firstElementChild.remove(), 2500);
})();
</script>
<script src="../fx-core.js"></script>
</body>
</html>
