<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>scroll-unroll — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.6 var(--kf-font-sans); }
  .demo-hint { margin: 0; padding: 12px 20px; border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .stage { display: grid; place-items: center; height: 100vh; }
  .scroll { height: 340px; }
  .scroll [data-fx-part="paper"] { height: 100%; border: 10px solid var(--kf-ink); border-left-width: 0; background: var(--kf-surface); }
  .scroll [data-fx-part="paper"] p { width: 498px; padding: 40px; color: var(--kf-dim); }
  .scroll [data-fx-part="roller"] { width: 60px; height: 120%; top: -10%; transform: translateX(-50%); }
  .strip { display: flex; width: 800%; height: 100%; }
  .strip i { flex: 1; border-radius: 10px; background: linear-gradient(90deg, var(--kf-ink) var(--a), var(--kf-dim) var(--a), var(--kf-dim) calc(var(--a) + 8%), var(--kf-ink) calc(var(--a) + 8%)); }
  .scroll [data-fx-part="puff"] { width: 70px; }
  .scroll [data-fx-part="puff"]:first-of-type { right: 100%; }
  .scroll [data-fx-part="puff"]:last-of-type { left: 100%; }
  .after { height: 100vh; display: grid; place-items: center; color: var(--kf-dim); }
</style>
</head>
<body>
<p class="demo-hint"><b>scroll-unroll</b> — When opened, a scroll drops, bounces and settles, and scrolling down rolls the rod cell by cell as the paper unfolds.</p>
<section class="stage">
  <div class="scroll" data-fx="scroll-unroll">
    <div data-fx-part="paper"><p>Your artwork or text to unfold goes here. The paper opens from the axis to the right up to 518px.</p></div>
    <div data-fx-part="roller">
      <div><div class="strip" data-fx-part="strip"><i style="--a:10%"></i><i style="--a:20%"></i><i style="--a:30%"></i><i style="--a:40%"></i><i style="--a:50%"></i><i style="--a:60%"></i><i style="--a:70%"></i><i style="--a:80%"></i></div></div>
      <span data-fx-part="puff"><svg viewBox="0 0 100 70" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 58c-10 0-12-14-2-17-2-11 10-17 18-11 3-11 19-13 25-3 8-7 21-2 21 9 10 0 13 13 5 18-5 6-15 6-20 0-7 5-17 4-20-2Z"/></svg></span>
      <span data-fx-part="puff"><svg viewBox="0 0 100 70" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 58c-10 0-12-14-2-17-2-11 10-17 18-11 3-11 19-13 25-3 8-7 21-2 21 9 10 0 13 13 5 18-5 6-15 6-20 0-7 5-17 4-20-2Z"/></svg></span>
    </div>
  </div>
</section>
<section class="after" id="late-slot">Your next section here</section>
<section class="after"><div class="scroll" id="gone" data-fx="scroll-unroll" data-fx-scroll-unroll="drop: off; pin: off; width: 300px"><div data-fx-part="paper"><p>Hanging scroll to be removed soon</p></div><div data-fx-part="roller"></div></div></section>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Checks whether it attaches to a late panel (a small unpinned banner after 1 second) and whether the detach runs when the panel is removed (after 2.5 seconds)
(() => {
  setTimeout(() => {
    const slot = document.getElementById("late-slot");
    if (!slot) return;
    slot.innerHTML = '<div class="scroll" data-fx="scroll-unroll" data-fx-scroll-unroll="pin: off; width: 360px"><div data-fx-part="paper"><p>Late-arrived scroll</p></div><div data-fx-part="roller"></div></div>';
  }, 1000);
  setTimeout(() => document.getElementById("gone")?.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s one more scroll comes in, and after 2.5s one drops out.");
})();
</script>
</body>
</html>
