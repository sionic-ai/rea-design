<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>drive-by-loop — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .road { position: relative; overflow: hidden; height: 140px; margin: 40px 0; border-bottom: 1px solid var(--kf-line); }
  .road .wf-img { position: absolute; left: 0; bottom: 0; width: 240px; aspect-ratio: 928 / 434; }
  .road.is-fast .wf-img { width: 140px; aspect-ratio: 560 / 226; left: 40%; }
</style>
</head>
<body>
<p class="demo-hint"><b>drive-by-loop</b> — Watch. The upper car crosses from left to right in 8s, and the lower taxi from right to left in 2.5s.</p>
<section class="road"><span class="wf-img" data-fx="drive-by-loop" data-label="Car cutout · side view"></span></section>
<section class="road is-fast"><span class="wf-img" data-fx="drive-by-loop" data-label="Taxi Cutout" style="--fx-from: 200%; --fx-to: -200%; --fx-dur: 2.5s"></span></section>
<script>
(() => {
  const src = document.querySelector('[data-fx~="drive-by-loop"]');
  if (!src) return;
  const host = src.closest(".road"), html = host.outerHTML;
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  host.after(gone);
  setTimeout(() => host.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical one comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
</body>
</html>
