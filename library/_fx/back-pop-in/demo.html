<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>back-pop-in — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 2; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .gap { height: 80vh; }
  .sec { border-top: 1px solid var(--kf-accent); padding: 80px 0; display: flex; justify-content: center; gap: 40px; }
  .tab { display: grid; place-items: center; width: 163px; height: 87px; margin-top: -130px; border-radius: 60px 60px 0 0; background: var(--kf-accent); color: var(--kf-on-accent); font-weight: 700; }
</style>
</head>
<body>
<p class="demo-hint"><b>back-pop-in</b> — Scroll down. A label straddling the section’s top edge pops up the moment it enters the screen. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<div class="gap"></div>
<section class="sec"><hgroup class="tab" data-fx="back-pop-in"><p>About</p></hgroup><hgroup class="tab" data-fx="back-pop-in" data-fx-back-pop-in="dur: 1; scale: .7" data-demo-remove><p>Omission</p></hgroup></section>
<section class="sec" id="late"><hgroup class="tab" data-fx="back-pop-in" data-fx-back-pop-in="dur: .6; y: 30"><p>Forestry</p></hgroup></section>
<template data-demo-late><section class="sec"><hgroup class="tab" data-fx="back-pop-in"><p>Late</p></hgroup></section></template>
<div class="gap"></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
