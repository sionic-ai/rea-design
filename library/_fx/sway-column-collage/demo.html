<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sway-column-collage — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .stage { margin-top: 40px; height: 120vh; }
  .track { display: flex; gap: 10px; width: 130vw; padding: 0 10px; transform: translate3d(-15vw, 0, 0); }
  .col { flex: 1; display: flex; flex-direction: column; gap: 10px; padding-bottom: 40px; }
  .col:nth-child(2), .col:nth-child(4) { margin-top: 18vw; }
  .col:nth-child(3) { margin-top: 8vw; }
  .media { position: relative; aspect-ratio: 3 / 4; overflow: hidden; background: var(--kf-raised); }
  .media[data-tint="2"] { background: var(--kf-accent-soft); }
  .media > .wf-img { position: absolute; inset: 0; height: 100%; }
  .after { height: 60vh; display: grid; place-items: center; color: var(--kf-dim); }
</style>
</head>
<body>
<p class="demo-hint"><b>sway-column-collage</b> — Move the mouse left and right and roll the wheel. After 3 seconds still at the top, the columns sink one by one and rise again with changed photos. <span style="color:var(--kf-dim)">(One more panel comes in after 1s, and an empty panel drops out after 2.5s)</span></p>
<div class="stage" data-fx="sway-column-collage">
  <div class="track" data-fx-part="track">
    <div class="col" data-fx-part="col"><div class="media" data-fx-part="media"><div class="wf-img" data-fx-part="pic" data-label="Person 1-1"></div></div><div class="media" data-fx-part="media"><div class="wf-img" data-fx-part="pic" data-label="Person 1-2"></div></div><div class="media" data-fx-part="media"><div class="wf-img" data-label="Person 1-3"></div></div><div class="wf-img" data-fx-part="next" data-tint="2" data-label="Next photo 1"></div></div>
    <div class="col" data-fx-part="col"><div class="media" data-fx-part="media"><div class="wf-img" data-fx-part="pic" data-label="Person 2-1"></div></div><div class="media" data-fx-part="media"><div class="wf-img" data-fx-part="pic" data-label="Person 2-2"></div></div><div class="media" data-fx-part="media"><div class="wf-img" data-label="Person 2-3"></div></div><div class="wf-img" data-fx-part="next" data-tint="2" data-label="Next photo 2"></div></div>
    <div class="col" data-fx-part="col"><div class="media" data-fx-part="media"><div class="wf-img" data-fx-part="pic" data-label="Person 3-1"></div></div><div class="media" data-fx-part="media"><div class="wf-img" data-fx-part="pic" data-label="Person 3-2"></div></div><div class="media" data-fx-part="media"><div class="wf-img" data-label="Person 3-3"></div></div><div class="wf-img" data-fx-part="next" data-label="Next photo 3"></div></div>
    <div class="col" data-fx-part="col"><div class="media" data-fx-part="media"><div class="wf-img" data-fx-part="pic" data-label="Person 4-1"></div></div><div class="media" data-fx-part="media"><div class="wf-img" data-fx-part="pic" data-label="Person 4-2"></div></div><div class="media" data-fx-part="media"><div class="wf-img" data-label="Person 4-3"></div></div><div class="wf-img" data-fx-part="next" data-tint="2" data-label="Next photo 4"></div></div>
    <div class="col" data-fx-part="col"><div class="media" data-fx-part="media"><div class="wf-img" data-fx-part="pic" data-label="Person 5-1"></div></div><div class="media" data-fx-part="media"><div class="wf-img" data-fx-part="pic" data-label="Person 5-2"></div></div><div class="media" data-fx-part="media"><div class="wf-img" data-label="Person 5-3"></div></div><div class="wf-img" data-fx-part="next" data-label="Next photo 5"></div></div>
  </div>
</div>
<div data-fx="sway-column-collage" data-demo-remove></div>
<template data-demo-late><div class="stage" style="height:40vh" data-fx="sway-column-collage" data-fx-sway-column-collage="lags: .3,.6; sink: 40"><div class="track" data-fx-part="track"><div class="col" data-fx-part="col"><div class="media" data-fx-part="media"><div class="wf-img" data-fx-part="pic" data-label="Late-arriving panel 1"></div></div></div><div class="col" data-fx-part="col"><div class="media" data-fx-part="media"><div class="wf-img" data-fx-part="pic" data-label="Late-arriving panel 2"></div></div></div></div></div></template>
<div class="after">Footer</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
