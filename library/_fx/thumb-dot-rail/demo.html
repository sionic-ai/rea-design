<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>thumb-dot-rail — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 10; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-wrap { position: relative; }
  .demo-sec { min-height: 100vh; display: grid; place-items: center; font: 300 64px/1 var(--kf-font-display); border-top: 1px solid var(--kf-line); }
  .demo-rail { position: absolute; top: 0; bottom: 0; right: 0; width: 100px; }
  .demo-rail__in { position: sticky; top: 0; height: 100vh; display: grid; place-items: center; }
  .demo-rail__ctl { position: absolute; right: 16px; bottom: 24px; display: flex; gap: 10px; align-items: center; font: 12px var(--kf-font-mono); }
  .demo-rail__ctl button { width: 24px; height: 24px; border: 1px solid var(--kf-line); border-radius: 50%; background: none; cursor: pointer; }
</style>
</head>
<body>
<p class="demo-hint"><b>thumb-dot-rail</b> — Scroll down and the current section’s dot swells into a photo circle. Click a dot or press ↑↓. <span style="color:var(--kf-dim)">(One more contents list comes in after 1s, and one drops out after 2.5s)</span></p>
<div class="demo-sec" id="top">Hero</div>
<div class="demo-wrap">
  <section class="demo-sec" id="d1">Work 01</section>
  <section class="demo-sec" id="d2">Work 02</section>
  <section class="demo-sec" id="d3">Work 03</section>
  <section class="demo-sec" id="d4">Work 04</section>
  <nav class="demo-rail" data-fx="thumb-dot-rail" aria-label="Section index">
    <div class="demo-rail__in">
      <ul data-fx-part="list">
        <li><a data-fx-part="dot" href="#d1" style="--fx-dot: var(--kf-accent)"><span data-fx-part="thumb" class="wf-img" data-label="01"></span></a></li>
        <li><a data-fx-part="dot" href="#d2" style="--fx-dot: var(--kf-dim)"><span data-fx-part="thumb" class="wf-img" data-label="02"></span></a></li>
        <li><a data-fx-part="dot" href="#d3" style="--fx-dot: var(--kf-accent-soft)"><span data-fx-part="thumb" class="wf-img" data-label="03"></span></a></li>
        <li><a data-fx-part="dot" href="#d4" style="--fx-dot: var(--kf-ink)"><span data-fx-part="thumb" class="wf-img" data-label="04"></span></a></li>
      </ul>
      <div class="demo-rail__ctl"><button data-fx-part="prev" aria-label="Previous section">↑</button><button data-fx-part="next" aria-label="Next section">↓</button><span data-fx-part="now"></span><span data-fx-part="max"></span></div>
    </div>
  </nav>
</div>
<nav data-fx="thumb-dot-rail" data-demo-remove><a data-fx-part="dot" href="#d2"></a></nav>
<nav data-fx="thumb-dot-rail"></nav>
<template data-demo-late><nav data-fx="thumb-dot-rail" data-fx-thumb-dot-rail="line: .3; speed: 60"><a data-fx-part="dot" href="#d3"></a><a data-fx-part="dot" href="#nowhere"></a></nav></template>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
