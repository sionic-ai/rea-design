<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>path-letters-slide — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .stage { position: relative; height: 70vh; margin: 40px 0; background: var(--kf-surface); border-block: 1px solid var(--kf-line); color: var(--kf-accent); }
  .stage svg { position: absolute; left: 0; bottom: 60px; width: 100%; }
  .stage.is-small { height: 40vh; }
</style>
</head>
<body>
<p class="demo-hint"><b>path-letters-slide</b> — When the panel appears, text slides in from outside the right along a U-shaped path and stops in front of the left edge (5s). Scroll down to see the other panels. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<section class="stage">
  <svg data-fx="path-letters-slide" viewBox="0 0 1500 182" preserveAspectRatio="none" aria-label="BRAND FOR RE:SLOGAN"><path data-fx-part="path" d="M0 0H240C330 0 400 32 455 88 512 146 622 182 750 182S988 146 1045 88C1100 32 1170 0 1260 0H1500"/></svg>
</section>
<section class="stage is-small" data-demo-remove>
  <svg data-fx="path-letters-slide" viewBox="0 0 1500 182" preserveAspectRatio="none" aria-label="Dropped Panel" data-fx-path-letters-slide="dur: 3; stop: 400"><path data-fx-part="path" d="M0 0H240C330 0 400 32 455 88 512 146 622 182 750 182S988 146 1045 88C1100 32 1170 0 1260 0H1500"/></svg>
</section>
<section class="stage is-small">
  <template data-demo-late><svg data-fx="path-letters-slide" viewBox="0 0 1500 300" preserveAspectRatio="none" data-fx-path-letters-slide="text: LATE WORDS ON A WAVE; stop: 120; dur: 3" style="--fx-size: 120px"><path data-fx-part="path" d="M0 150C250 40 500 260 750 150S1250 40 1500 150"/></svg></template>
</section>
<div style="height: 60vh"></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
