<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>swirl-gas-field — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .stage { height: 70vh; display: grid; place-items: center; }
  .stage h2 { position: relative; z-index: 1; font: 500 36px/1.1 var(--kf-font-display); text-align: center; }
</style>
</head>
<body>
<p class="demo-hint"><b>swirl-gas-field</b> — Watch quietly. With an eye at the center, the craft winds around it. Colors are read from Skin variables. <span style="color:var(--kf-dim)">(After 1s one more panel comes in, and one leaves 2.5s later)</span></p>
<section class="stage" data-fx="swirl-gas-field"><h2>Your title here<br>Two lines</h2></section>
<section class="stage" data-fx="swirl-gas-field" data-fx-swirl-gas-field="spin: 2; eye: 1.2" data-demo-remove style="--fx-c3: var(--kf-dim)"></section>
<template data-demo-late><section class="stage" data-fx="swirl-gas-field" data-fx-swirl-gas-field="enter: 0"><h2>Late panel</h2></section></template>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/CustomEase.min.js"></script>
<script src="three-global.js"></script>
<script src="../../_vendor/three@0.185.0/build/three.cjs"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
