<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>clip-up-viewer — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 10; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .cards { display: flex; flex-wrap: wrap; gap: 24px; padding: 40px; }
  .card { display: block; width: 260px; padding: 16px; border: 1px solid var(--kf-line); border-radius: var(--kf-radius-md); background: var(--kf-surface); }
  .card .wf-img { aspect-ratio: 4 / 3; margin-bottom: 10px; }
</style>
</head>
<body>
<p class="demo-hint"><b>clip-up-viewer</b> Click a card and that page slides up from below to cover the screen. Close it with Back, Esc or the browser back button. <span style="color:var(--kf-dim)">(One more card comes in after 1s, and one drops out after 2.5s)</span></p>
<div class="cards">
  <a class="card" href="../eye-follow/demo.html" data-fx="clip-up-viewer" data-fx-clip-up-viewer="title: Project Name 01; back: Back to work; hash: work/one"><div class="wf-img" data-label="Work cover · 4:3"></div>Project Name 01</a>
  <a class="card" href="../cursor-select-intro/demo.html" data-fx="clip-up-viewer" data-fx-clip-up-viewer="title: Project Name 02; dur: .45"><div class="wf-img" data-label="Work cover · 4:3"></div>Project Name 02 (short, .45s)</a>
  <a class="card" data-demo-remove href="../eq-sound-toggle/demo.html" data-fx="clip-up-viewer"><div class="wf-img" data-label="Work cover · 4:3"></div>Project Name 03</a>
  <template data-demo-late><a class="card" href="../eq-sound-toggle/demo.html" data-fx="clip-up-viewer" data-fx-clip-up-viewer="title: Late Card"><div class="wf-img" data-label="Late-arriving card · 4:3"></div>Late Card</a></template>
</div>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
