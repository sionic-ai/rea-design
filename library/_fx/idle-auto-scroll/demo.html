<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>idle-auto-scroll — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0; }
  .grid .wf-img { aspect-ratio: 3 / 2; }
</style>
</head>
<body>
<p class="demo-hint"><b>idle-auto-scroll</b> — Don’t touch anything for 5 seconds. The page scrolls down slowly. Rolling the wheel stops it. <span style="color:var(--kf-dim)">(After 1s one more cell comes in, and one leaves 2.5s later)</span></p>
<section class="grid" data-fx="idle-auto-scroll">
  <span class="wf-img" data-label="Photo 1"></span><span></span><span class="wf-img" data-label="Photo 2"></span>
  <span></span><span class="wf-img" data-label="Photo 3"></span><span></span>
  <span class="wf-img" data-label="Photo 4"></span><span></span><span class="wf-img" data-label="Photo 5"></span>
  <span></span><span class="wf-img" data-label="Photo 6"></span><span></span>
  <span class="wf-img" data-label="Photo 7"></span><span></span><span class="wf-img" data-label="Photo 8"></span>
</section>
<section data-demo-remove data-fx="idle-auto-scroll" data-fx-idle-auto-scroll="idle: 1"></section>
<template data-demo-late><section data-fx="idle-auto-scroll" data-fx-idle-auto-scroll="speed: 60; min: 0" class="grid"><span class="wf-img" data-label="Late-arriving photo"></span></section></template>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
