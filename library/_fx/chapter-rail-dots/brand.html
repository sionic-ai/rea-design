<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>chapter-rail-dots — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .brand-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .ch { display: flex; align-items: center; min-height: 120vh; padding: 0 10vw; }
  .ch.--dark { background: var(--kf-contrast-bg); color: var(--kf-contrast-ink); }
  .ch > div { max-width: 420px; padding: 32px; border-radius: var(--kf-radius-lg); background: var(--kf-surface); color: var(--kf-ink); }
  .rail { position: fixed; right: 16px; top: 50%; transform: translateY(-50%); }
  .rail.--on-dark { color: var(--kf-contrast-ink); }
  .rail.--on-light { color: var(--kf-ink); }
</style>
</head>
<body>
<p class="brand-hint"><b>chapter-rail-dots</b> — Scroll, then click the dots on the right. <span style="color:var(--kf-dim)">(After 1s one more rail comes in, and after 2.5s one drops out)</span></p>
<section class="ch --cream" aria-label="First page"><div><h2>First page</h2><p>Light background — rail goes dark.</p></div></section>
<section class="ch --dark" aria-label="Second Section"><div><h2>Second Section</h2><p>Dark background — the rail glows bright.</p></div></section>
<section class="ch --cream" aria-label="Third Section"><div><h2>Third Section</h2></div></section>
<section class="ch --dark" aria-label="Fourth section"><div><h2>Fourth section</h2></div></section>
<ol class="rail" data-fx="chapter-rail-dots" data-fx-chapter-rail-dots="from: .ch; start: light"></ol>
<ol class="rail" style="right: 60px" data-fx="chapter-rail-dots" data-fx-chapter-rail-dots="from: .ch" data-brand-remove></ol>
<template data-brand-late><ol class="rail" style="right: 104px" data-fx="chapter-rail-dots" data-fx-chapter-rail-dots="from: .ch"></ol></template>
<ol data-fx="chapter-rail-dots" data-fx-chapter-rail-dots="from: .missing-section"></ol>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-brand-late] after 1 second and removes [data-brand-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-brand-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-brand-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
