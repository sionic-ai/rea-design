<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>type-next-link — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 500 13px/1.4 var(--kf-font-sans); }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .stage { display: grid; min-height: 60vh; place-items: center; }
  .stage [data-fx-part="label"] { font: 400 24px/1 var(--kf-font-display); letter-spacing: .03em; }
  .mark { display: block; width: 120px; height: 120px; border-radius: 50% 50% 50% 0; background: var(--kf-ink); }
  .log { padding: 0 20px 20px; color: var(--kf-dim); font: 500 12px/1.4 var(--kf-font-mono); }
</style>
</head>
<body>
<p class="demo-hint"><b>type-next-link</b> — Hover over and away from the black shape, then press it. Next is stamped and erased, and pressing changes it to the next name and then fades. <span style="color:var(--kf-dim)">(One more notice comes in after 1s, and one drops out after 2.5s)</span></p>
<div class="stage">
  <aside data-fx="type-next-link">
    <div data-fx-part="label"><span data-fx-part="text">Next</span><span data-fx-part="name">About</span></div>
    <a data-fx-part="link" href="#about" aria-label="Next page"><span class="mark"></span></a>
  </aside>
</div>
<p class="log" data-demo-log>Waiting for fx:go</p>
<aside data-fx="type-next-link" data-demo-remove><div data-fx-part="label"><span data-fx-part="text">Next</span><span data-fx-part="name">Gone</span></div><a data-fx-part="link" href="#gone"><span class="mark"></span></a></aside>
<template data-demo-late><div class="stage"><aside data-fx="type-next-link" data-fx-type-next-link="step: 80; end: 600"><div data-fx-part="label"><span data-fx-part="text">Next</span><span data-fx-part="name">Members</span></div><a data-fx-part="link" href="#members"><span class="mark"></span></a></aside></div></template>
<aside data-fx="type-next-link"></aside>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
document.addEventListener("fx:go", (e) => { document.querySelector("[data-demo-log]").textContent = "fx:go → " + e.detail.href; });
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); }, 2500);
</script>
</body>
</html>
