<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>panel-inset-drop — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .behind { position: fixed; top: 60px; left: 0; width: 100%; padding: 40px; font: var(--kf-weight-display) clamp(48px, 9vw, 140px)/1 var(--kf-font-display); }
  .stage { position: relative; z-index: 2; padding: 0 0 calc(9.5vw + 166px); }
  .stage::after { position: absolute; right: 0; bottom: 0; left: 0; height: calc(9.5vw + 166px); background: var(--kf-bg); content: ""; }
  .hero { padding: 58px; }
  .board { display: flex; align-items: center; justify-content: center; gap: 24px; height: 70vh; }
  .board span { display: grid; place-items: center; width: 90px; height: 90px; border: 6px solid var(--kf-accent); font: 700 48px/1 var(--kf-font-display); }
  .board p { font-weight: 700; font-size: 22px; }
  .more { position: relative; z-index: 3; height: 120vh; padding: 40px; background: var(--kf-bg); }
</style>
</head>
<body>
<p class="demo-hint"><b>panel-inset-drop</b> — Try reloading. The covering surface shrinks into a frame, the corners are rounded, and the letters switch on in turn, then at 3.2 seconds the panel settles down to reveal the large text behind.</p>
<div class="behind">BRAND NAME</div>
<div class="stage">
  <section class="hero" data-fx="panel-inset-drop">
    <div class="board" data-fx-part="panel">
      <span data-fx-part="piece" data-order="0">A</span>
      <span data-fx-part="piece" data-order="3">B</span>
      <span data-fx-part="piece" data-order="1">C</span>
      <span data-fx-part="piece" data-order="2">D</span>
      <p data-fx-part="late">Your one line here.</p>
    </div>
  </section>
</div>
<div class="more">Lower section</div>
<script>
// Late arrivals and removals — checks that fx-core attaches to an element added after 1s and detaches from an element removed after 2.5s
(() => {
  const more = document.querySelector(".more");
  const make = (tag) => { const s = document.createElement("section"); s.className = "hero"; s.dataset.fx = "panel-inset-drop"; s.dataset.fxPanelInsetDrop = "drop: 0; at: 0; start: 0"; s.dataset.demo = tag; s.innerHTML = '<div class="board" data-fx-part="panel" style="height: 30vh"><span data-fx-part="piece">E</span></div>'; return s; };
  const gone = make("gone");
  more.append(gone);
  setTimeout(() => more.append(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s, one more panel comes in (the late one), and after 2.5s one drops out (the removal).");
})();
</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
