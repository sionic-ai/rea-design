<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ring-tunnel-zoom — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .stage { height: 90vh; margin: 20px; border: 1px solid var(--kf-line); }
  .stage .in { position: absolute; left: 50%; top: 50%; translate: -50% -50%; display: grid; gap: 14px; justify-items: center; z-index: 2; }
  .stage .in a { padding: 10px 18px; border-radius: var(--kf-radius-pill); background: var(--kf-accent); color: var(--kf-on-accent); }
  .demo-spacer { height: 60vh; display: grid; place-items: center; color: var(--kf-dim); }
</style>
</head>
<body>
<p class="demo-hint"><b>ring-tunnel-zoom</b> — Bag rings keep approaching endlessly. They speed up when you scroll or put a hand on the button. <span style="color:var(--kf-dim)">(After 1s one more panel comes in, and one leaves 2.5s later)</span></p>
<section class="stage" data-fx="ring-tunnel-zoom">
  <div data-fx-part="ring"></div><div data-fx-part="ring"></div><div data-fx-part="ring"></div>
  <div class="in"><h2>Your quiz title here</h2><a href="#" data-fx-part="boost">Start</a></div>
</section>
<section class="stage" data-demo-remove data-fx="ring-tunnel-zoom" data-fx-ring-tunnel-zoom="count: 8; zoom: 6"><div data-fx-part="ring"></div><div data-fx-part="ring"></div></section>
<template data-demo-late><section class="stage" data-fx="ring-tunnel-zoom" data-fx-ring-tunnel-zoom="sway: 0"><div data-fx-part="ring"></div><div data-fx-part="ring"></div><div data-fx-part="ring"></div></section></template>
<section class="stage" data-fx="ring-tunnel-zoom"></section>
<div class="demo-spacer">Scroll</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); window.ScrollTrigger?.refresh(); }, 2500);
</script>
</body>
</html>
