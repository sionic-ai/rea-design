<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pen-path-trail — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); min-height: 100vh; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .band { height: 40vh; display: grid; place-items: center; font: 700 64px/1 var(--kf-font-display); }
  .band.is-dark { background: var(--kf-contrast-bg); color: var(--kf-contrast-ink); }
</style>
</head>
<body>
<p class="demo-hint"><b>pen-path-trail</b> — Swing and press the mouse. A pen-tool path with anchors and handles is left behind, and a ring spreads where you press (opposite color on both light and dark panels). <span style="color:var(--kf-dim)">(After 1s a new canvas comes in, and after 2.5s the first one is removed)</span></p>
<div class="band">Light panel</div>
<div class="band is-dark">Dark panel</div>
<canvas data-fx="pen-path-trail" data-demo-remove></canvas>
<template data-demo-late><canvas data-fx="pen-path-trail" data-fx-pen-path-trail="gap: 48; reach: 120"></canvas></template>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
