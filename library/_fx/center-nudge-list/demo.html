<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>center-nudge-list — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .list { display: flex; flex-direction: column; gap: 16px; padding: 50vh 16px; width: 120px; }
  .list button { width: 80px; padding: 0; border: 0; background: none; }
  .list .wf-img { aspect-ratio: 3 / 4; }
  .list .is-active .wf-img { outline: 2px solid var(--kf-accent); }
  .big { position: fixed; top: 50%; left: 50%; translate: -50% -50%; font: 700 64px/1 var(--kf-font-display); }
</style>
</head>
<body>
<p class="demo-hint"><b>center-nudge-list</b> — Scroll. The thumbnails near the center of the screen slide out sideways and the number on the right changes. <span style="color:var(--kf-dim)">(After 1s one more cell comes in, and one leaves 2.5s later)</span></p>
<div class="big" data-big>1</div>
<div class="list" data-fx="center-nudge-list">
  <button data-fx-part="item"><span class="wf-img" data-label="1"></span></button>
  <button data-fx-part="item"><span class="wf-img" data-label="2"></span></button>
  <button data-fx-part="item"><span class="wf-img" data-label="3"></span></button>
  <button data-fx-part="item" data-demo-remove><span class="wf-img" data-label="Cell to Be Removed"></span></button>
  <button data-fx-part="item"><span class="wf-img" data-label="5"></span></button>
  <button data-fx-part="item"><span class="wf-img" data-label="6"></span></button>
  <button data-fx-part="item"><span class="wf-img" data-label="7"></span></button>
  <button data-fx-part="item"><span class="wf-img" data-label="8"></span></button>
</div>
<template data-demo-late><div class="list" data-fx="center-nudge-list" data-fx-center-nudge-list="max: 32; lerp: .2"><button data-fx-part="item"><span class="wf-img" data-label="Late row"></span></button></div></template>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
document.addEventListener("fx:active", (e) => { document.querySelector("[data-big]").textContent = e.detail + 1; });
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
