<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>icon-swap-grid — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .board { display: flex; flex-wrap: wrap; justify-content: space-between; align-content: space-between; gap: 56px; width: min(880px, 92vw); height: 420px; margin: 48px auto; }
  .board [data-fx-part="slot"] { width: 64px; height: 64px; }
  .board--small [data-fx-part="slot"] { width: 32px; height: 32px; }
</style>
</head>
<body>
<p class="demo-hint"><b>icon-swap-grid</b> — Move the mouse over the plate — the nearest face grows, and every 5 seconds (3 for the lower plate) all close, then open with other faces. <span style="color:var(--kf-dim)">(After 1s one more panel comes in, and one leaves 2.5s later)</span></p>
<section class="board" data-demo-remove data-fx="icon-swap-grid">
  <div data-fx-part="pool">
    <svg viewBox="0 0 40 40"><circle cx="20" cy="18" r="10" fill="var(--kf-accent-soft)"/><circle cx="16" cy="17" r="2" fill="var(--kf-ink)"/><circle cx="24" cy="17" r="2" fill="var(--kf-ink)"/><rect x="10" y="30" width="20" height="10" rx="5" fill="var(--kf-ink-soft)"/></svg>
    <svg viewBox="0 0 40 40"><rect x="10" y="8" width="20" height="20" rx="8" fill="var(--kf-raised)"/><circle cx="16" cy="18" r="2" fill="var(--kf-ink)"/><circle cx="24" cy="18" r="2" fill="var(--kf-ink)"/><rect x="8" y="30" width="24" height="10" rx="5" fill="var(--kf-accent-soft)"/></svg>
    <svg viewBox="0 0 40 40"><circle cx="20" cy="19" r="11" fill="var(--kf-surface)" stroke="var(--kf-ink)" stroke-width="2"/><path d="M15 21 Q20 25 25 21" fill="none" stroke="var(--kf-ink)" stroke-width="2"/><rect x="9" y="31" width="22" height="9" rx="4" fill="var(--kf-dim)"/></svg>
  </div>
  <span data-fx-part="slot"></span><span data-fx-part="slot"></span><span data-fx-part="slot"></span><span data-fx-part="slot"></span><span data-fx-part="slot"></span><span data-fx-part="slot"></span>
  <span data-fx-part="slot"></span><span data-fx-part="slot"></span><span data-fx-part="slot"></span><span data-fx-part="slot"></span><span data-fx-part="slot"></span><span data-fx-part="slot"></span>
  <span data-fx-part="slot"></span><span data-fx-part="slot"></span><span data-fx-part="slot"></span><span data-fx-part="slot"></span><span data-fx-part="slot"></span><span data-fx-part="slot"></span>
</section>
<section class="board board--small" data-fx="icon-swap-grid" data-fx-icon-swap-grid="every: 3; grow: 0">
  <span data-fx-part="slot"></span><span data-fx-part="slot"></span><span data-fx-part="slot"></span><span data-fx-part="slot"></span><span data-fx-part="slot"></span>
  <span data-fx-part="slot"></span><span data-fx-part="slot"></span><span data-fx-part="slot"></span><span data-fx-part="slot"></span><span data-fx-part="slot"></span>
</section>
<template data-demo-late><section class="board board--small" data-fx="icon-swap-grid" data-fx-icon-swap-grid="tones: 2"><span data-fx-part="slot"></span><span data-fx-part="slot"></span><span data-fx-part="slot"></span><span data-fx-part="slot"></span></section></template>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); window.ScrollTrigger?.refresh(); }, 2500);
</script>
</body>
</html>
