<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pill-shrink-header — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: relative; z-index: 1; padding: 90px 20px 12px; font: 500 13px/1.4 var(--kf-font-mono); }
  .wrap { position: fixed; top: 0; left: 0; right: 0; z-index: 50; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 12px 0; }
  .wrap header { display: flex; justify-content: space-between; align-items: center; padding: 12px 20px; }
  .tall { height: 250vh; background: linear-gradient(var(--kf-bg), var(--kf-raised)); }
</style>
</head>
<body>
<div class="wrap" id="box">
  <header data-fx="pill-shrink-header"><b>Logo</b><span>Menu 1 · Menu 2 · Menu 3</span><span>Button</span></header>
  <header data-fx="pill-shrink-header" data-fx-pill-shrink-header="narrow: 40rem; dur: 1" data-demo-remove><b>Dropped Line</b><span>Menu</span></header>
</div>
<p class="demo-hint"><b>pill-shrink-header</b> — Scroll down just a little. The header line shrinks into a center pill. <span style="color:var(--kf-dim)">(After 1s one more line comes in, and one leaves 2.5s later)</span></p>
<div class="tall"></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => { const h = document.createElement("header"); h.dataset.fx = "pill-shrink-header"; h.dataset.fxPillShrinkHeader = "narrow: 30rem"; h.innerHTML = "<b>Late row</b><span>Menu</span>"; document.getElementById("box").append(h); }, 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
