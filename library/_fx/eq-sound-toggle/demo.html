<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>eq-sound-toggle — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .bar { display: flex; justify-content: flex-end; gap: 28px; padding: 24px 40px 140px; text-transform: uppercase; font-weight: 600; letter-spacing: .03em; }
  .bar button { display: inline-flex; align-items: center; gap: 9px; background: none; border: 0; cursor: pointer; text-transform: inherit; }
</style>
</head>
<body>
<p class="demo-hint"><b>eq-sound-toggle</b> — Wait 2.6 seconds and a speech bubble appears. Click anywhere on the screen to turn it on, click the button to turn it off and back on. <span style="color:var(--kf-dim)">(After 1s one more button comes in, and after 2.5s one drops out)</span></p>
<nav class="bar">
  <button data-fx="eq-sound-toggle"><span data-fx-part="bars"><i></i><i></i><i></i><i></i></span><span data-fx-part="label">Sound off</span><span data-fx-part="hint">Turn on the sound</span></button>
  <button data-demo-remove data-fx="eq-sound-toggle" data-fx-eq-sound-toggle="first: 0; nudge: 0"><span data-fx-part="bars"><i></i><i></i><i></i><i></i></span><span data-fx-part="label">Sound off</span></button>
  <template data-demo-late><button data-fx="eq-sound-toggle" data-fx-eq-sound-toggle="first: 0; on: On; off: Off"><span data-fx-part="bars"><i></i><i></i><i></i><i></i></span><span data-fx-part="label">Off</span></button></template>
</nav>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
