<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>scroll-part — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { padding: 48px 20px; }
  .demo-spacer { height: 90vh; display: grid; place-items: center; color: var(--kf-dim); }
 h2 { font: 700 12vw/.9 var(--kf-font-display); white-space: nowrap; text-align: center; overflow: hidden; }
</style>
</head>
<body>
<p class="demo-hint"><b>scroll-part</b> — Scroll down to watch two words spread apart (top), come together (middle), and approach each other then cross past (bottom). <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<div class="demo-spacer">Scroll down</div>
<section class="demo"><h2 data-demo-remove data-fx="scroll-part" data-fx-scroll-part="dist: 20vw"><span data-fx-part="left">Together</span> <span data-fx-part="right">Start</span></h2><h2 data-fx="scroll-part" data-fx-scroll-part="dist: 20vw"><span data-fx-part="left">Together</span> <span data-fx-part="right">Start</span></h2><template data-demo-late><h2 data-fx="scroll-part" data-fx-scroll-part="dist: 20vw"><span data-fx-part="left">Together</span> <span data-fx-part="right">Start</span></h2></template></section>
<section class="demo"><h2 data-fx="scroll-part" data-fx-scroll-part="mode: gather; dist: 30"><span data-fx-part="left">Our</span> <span data-fx-part="right">Work</span></h2></section>
<section class="demo"><h2 data-fx="scroll-part" data-fx-scroll-part="mode: cross; dist: 40vw"><span data-fx-part="left">Crossed</span><br><span data-fx-part="right">Passing by</span></h2></section>
<div class="demo-spacer"></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); window.ScrollTrigger?.refresh(); }, 2500);
</script>
</body>
</html>
