<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>crt-screen — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { display: grid; gap: 24px; padding: 48px 20px; }
  .demo h2 { font-size: 64px; line-height: 1; }
  .demo .band { padding: 40px 20px; background: var(--kf-accent); color: var(--kf-on-accent); font-size: 28px; }
</style>
</head>
<body>
<p class="demo-hint"><b>crt-screen</b> — Scanlines, noise, edge darkness and red/blue misalignment cover the whole screen. Look at the edges of the text.</p>
<section class="demo">
  <h2>Screen glass</h2>
  <p class="band">Text on a color panel here — scan lines and color shift are visible</p>
  <div class="wf-img wf-r-16x9" data-label="Photo slot"></div>
</section>
<div data-fx="crt-screen"></div>
<script>
(() => {
  const src = document.querySelector('[data-fx~="crt-screen"]');
  if (!src) return;
  const make = (tag) => { const el = document.createElement("div"); el.dataset.fx = "crt-screen"; el.dataset.fxCrtScreen = "grain: 0; chroma: 0"; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => src.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s one more identical cover comes in, and after 2.5s one drops out.");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
