<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fit-grow-loader — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { margin: 0; background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 5; margin: 0; padding: 12px 20px; background: var(--kf-surface); font: 500 13px/1.4 var(--kf-font-mono); }
  .stage { position: relative; height: 80vh; overflow: hidden; background: repeating-linear-gradient(135deg, var(--kf-surface) 0 24px, var(--kf-raised) 24px 48px); }
  .stage h1 { font: 400 10vw/1.1 var(--kf-font-display); color: var(--kf-contrast-ink); }
  .stage + .stage { height: 50vh; margin-top: 24px; }
</style>
</head>
<body>
<p class="demo-hint"><b>fit-grow-loader</b> — On open, after 1.5s the curtain folds up and the center text grows to full screen width. Refresh to watch again. <span style="color:var(--kf-dim)">(After 1s one more panel comes in, and one leaves 2.5s later)</span></p>
<section class="stage"><div data-fx="fit-grow-loader"><div data-fx-part="wrap"><h1 data-fx-part="title">Name tag</h1></div><div data-fx-part="veil"></div></div></section>
<template data-demo-late><section class="stage"><div data-fx="fit-grow-loader" data-fx-fit-grow-loader="delay: .5; dur: .8"><div data-fx-part="wrap"><h1 data-fx-part="title">Late panel</h1></div><div data-fx-part="veil"></div></div></section></template>
<section class="stage" data-demo-remove><div data-fx="fit-grow-loader"><div data-fx-part="wrap"><h1 data-fx-part="title">Dropped Panel</h1></div></div></section>
<section class="stage"><div data-fx="fit-grow-loader"><div data-fx-part="wrap"></div></div></section>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/CustomEase.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
