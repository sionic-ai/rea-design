<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>repel-line-field — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { padding: 8vh 40px 40vh; display: grid; gap: 40px; }
  .demo [data-fx] { height: 420px; border: 1px solid var(--kf-line); }
  .demo .is-accent { color: var(--kf-accent); }
</style>
</head>
<body>
<p class="demo-hint"><b>repel-line-field</b> Move the mouse over the striped panel. The lines around the upper left of the cursor get pushed away and return in waves. <span style="color:var(--kf-dim)">(After 1s one more panel comes in, and one leaves 2.5s later)</span></p>
<section class="demo" id="box">
  <div data-fx="repel-line-field"></div>
  <div class="is-accent" data-fx="repel-line-field" data-fx-repel-line-field="lines: 20; points: 14; radius: 140; offset: 0; width: 1"></div>
  <div data-fx="repel-line-field" data-demo-remove></div>
</section>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => { const d = document.createElement("div"); d.dataset.fx = "repel-line-field"; d.dataset.fxRepelLineField = "lines: 12; pad: 30"; document.getElementById("box").append(d); }, 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
