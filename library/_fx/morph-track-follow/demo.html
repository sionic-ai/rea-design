<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>morph-track-follow — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { padding: 60px 20px; display: grid; gap: 60px; }
</style>
</head>
<body>
<p class="demo-hint"><b>morph-track-follow</b> — Move the mouse left and right over the dotted line (on phones drag the shape). The shape follows and changes type, leaving traces of past types.</p>
<section class="demo">
  <div data-fx="morph-track-follow"><a data-fx-part="shape" href="#"><span data-fx-part="label">[ Let’s Talk ]</span></a></div>
  <div data-fx="morph-track-follow" data-demo-remove></div>
  <div id="late"></div>
</section>
<template data-demo-late><div data-fx="morph-track-follow" data-fx-morph-track-follow="sides: 3,4,0; turn: 120; follow: .3"></div></template>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/MorphSVGPlugin.min.js"></script>
<script src="../../../_shared/vendor/gsap/Draggable.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => document.getElementById("late").append(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
