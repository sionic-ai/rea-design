<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>scroll-ladder — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-spacer { height: 60vh; display: grid; place-items: center; color: var(--kf-dim); }
  .demo-long { height: 400vh; }
  .demo-stage { position: sticky; top: 0; height: 100vh; padding: 20px; box-sizing: border-box; }
  .demo-art { position: relative; height: 100%; border-radius: 20px; background: linear-gradient(180deg, var(--kf-dim), var(--kf-ink)); }
  .demo-art [data-fx] { position: absolute; top: 50%; left: 40px; transform: translateY(-50%); }
  .demo-art [data-fx] + [data-fx] { left: 90px; }
</style>
</head>
<body>
<p class="demo-hint"><b>scroll-ladder</b> — Scroll down. While the pinned section passes, the needle on the left ruler moves down and the ticks ripple.</p>
<div class="demo-spacer">↓ Scroll</div>
<section class="demo-long">
  <div class="demo-stage"><div class="demo-art"><div data-fx="scroll-ladder"></div></div></div>
</section>
<div class="demo-spacer">Footer</div>
<script>
(() => {
  const src = document.querySelector('[data-fx~="scroll-ladder"]');
  if (!src) return;
  const make = (tag) => { const el = document.createElement("div"); el.setAttribute("data-fx", "scroll-ladder"); el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => src.parentElement.append(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s one more ruler comes in (a late arrival), and after 2.5s one drops out (detach).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
