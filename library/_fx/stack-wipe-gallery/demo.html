<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>stack-wipe-gallery — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .pad { height: 60vh; display: grid; place-items: center; }
  [data-fx-part="item"] { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 20px; background: var(--kf-bg); }
  [data-fx-part="shot"] { height: calc(100vh - 40px); }
  [data-fx-part="overlay"] { inset: 20px; background: color-mix(in oklab, var(--kf-ink) 30%, transparent); }
  @media (max-width: 768px) {
    [data-fx-part="item"] { display: contents; }
    [data-fx-part="shot"] { position: absolute; left: 15px; right: 15px; bottom: 45px; height: calc(100vh - 140px); background: var(--kf-bg); }
  }
</style>
</head>
<body>
<p class="demo-hint"><b>stack-wipe-gallery</b> — Scroll down. The pinned photo panel rolls up from its bottom edge, revealing the next panel.</p>
<div class="pad">Top margin</div>
<section data-fx="stack-wipe-gallery">
  <div data-fx-part="pin">
    <div data-fx-part="overlay"></div>
    <div data-fx-part="item"><span class="wf-img" data-fx-part="shot" data-label="Panel 1 · Left"></span><span class="wf-img" data-fx-part="shot" data-label="Panel 1 · Right"></span></div>
    <div data-fx-part="item"><span class="wf-img" data-fx-part="shot" data-label="Panel 2 · Left"></span><span class="wf-img" data-fx-part="shot" data-label="Panel 2 · Right"></span></div>
    <div data-fx-part="item"><span class="wf-img" data-fx-part="shot" data-label="Panel 3 · Left"></span><span class="wf-img" data-fx-part="shot" data-label="Panel 3 · Right"></span></div>
  </div>
</section>
<div class="pad">Bottom margin</div>
<script>
(() => {
  const src = document.querySelector('[data-fx~="stack-wipe-gallery"]');
  if (!src) return;
  const html = src.outerHTML;
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => src.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical one comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script>gsap.registerPlugin(ScrollTrigger);</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
