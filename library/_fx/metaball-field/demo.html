<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>metaball-field — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .field { height: 80vh; margin: 20px; border: 1px solid var(--kf-line); }
</style>
</head>
<body>
<p class="demo-hint"><b>metaball-field</b> — Three balls approach and melt together every 3s, and small balls scatter when they shrink <span style="color:var(--kf-dim)">(After 1s a panel holding one more ball comes in, after 2.5s one panel leaves)</span></p>
<div class="field" data-fx="metaball-field">
  <span data-fx-part="ball" class="b1" style="left:20%;top:25%;width:30%;height:45%;color:var(--kf-accent)"></span>
  <span data-fx-part="ball" class="b2" style="left:48%;top:30%;width:24%;height:36%;color:var(--kf-warning, var(--kf-accent))"></span>
  <span data-fx-part="ball" class="b3" style="left:60%;top:5%;width:18%;height:28%;color:var(--kf-danger, var(--kf-ink))"></span>
</div>
<div class="field" data-demo-remove data-fx="metaball-field"><span data-fx-part="ball" style="left:30%;top:30%;width:30%;height:40%;color:var(--kf-ink)"></span></div>
<template data-demo-late><div class="field" data-fx="metaball-field" data-fx-metaball-field="scatter: 0"><span data-fx-part="ball" style="left:10%;top:20%;width:30%;height:50%;color:var(--kf-accent)"></span><span data-fx-part="ball" style="left:35%;top:30%;width:25%;height:40%;color:var(--kf-ink)"></span></div></template>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="three-global.js"></script>
<script src="../../_vendor/three@0.177.0/build/three.cjs"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
gsap.timeline({ repeat: -1, repeatDelay: 1 })
  .to(".b1", { xPercent: 45, scale: 0.45, duration: 3, ease: "power2.inOut" })
  .to(".b2", { xPercent: -30, yPercent: 20, duration: 3, ease: "power2.inOut" }, 0)
  .to(".b1", { xPercent: 0, scale: 1, duration: 3, ease: "power2.inOut" })
  .to(".b2", { xPercent: 0, yPercent: 0, duration: 3, ease: "power2.inOut" }, "<");
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
