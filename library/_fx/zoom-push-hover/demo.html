<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>zoom-push-hover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .row { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 30px; padding: 60px 40px; }
  .tile { display: block; aspect-ratio: 4 / 3; border-radius: var(--kf-radius-md); }
  .tile .wf-img { height: 100%; border: 0; }
  .row p { margin-block-start: 10px; font-size: 13px; color: var(--kf-dim); }
</style>
</head>
<body>
<p class="demo-hint"><b>zoom-push-hover</b> — Hover over the photo and move around. The photo grows and shifts away to the side opposite the cursor. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<div class="row">
  <div><a class="tile" href="#" data-fx="zoom-push-hover"><div class="wf-img" data-fx-part="media" data-label="Product photo · default (1.1x · .02)"></div></a><p>Basic</p></div>
  <div><a class="tile" href="#" data-fx="zoom-push-hover" data-fx-zoom-push-hover="scale: 1.04; move-x: .008; move-y: .005"><div class="wf-img" data-fx-part="media" data-label="Hero photo · 1.04x · .008/.005"></div></a><p>scale: 1.04; move-x: .008; move-y: .005</p></div>
  <div data-demo-remove><a class="tile" href="#" data-fx="zoom-push-hover"><div class="wf-img" data-fx-part="media" data-label="Omitted photo"></div></a><p>Removed after 2.5s</p></div>
  <template data-demo-late><div><a class="tile" href="#" data-fx="zoom-push-hover"><div class="wf-img" data-fx-part="media" data-label="Late-arrived Photo"></div></a><p>Enters late</p></div></template>
</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
