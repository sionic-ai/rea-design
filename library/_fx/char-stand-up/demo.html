<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>char-stand-up — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo-spacer { height: 70vh; display: grid; place-items: center; color: var(--kf-dim); }
  .demo h2 { padding: 40px 20px; font: var(--kf-weight-display) 48px/1.3 var(--kf-font-display); text-align: center; }
</style>
</head>
<body>
<p class="demo-hint"><b>char-stand-up</b> — Watch the title letters stand up one by one. <span style="color:var(--kf-dim)">(One more title comes in after 1s, and one drops out after 2.5s)</span></p>
<section class="demo">
  <h2 data-fx="char-stand-up" data-fx-char-stand-up="on: load; delay: .3">Your one line, with more heat.</h2>
  <h2 data-demo-remove data-fx="char-stand-up" data-fx-char-stand-up="on: load; delay: .8; shift: 40px">Omitted title</h2>
</section>
<div class="demo-spacer">Scroll down</div>
<section class="demo">
  <h2 data-fx="char-stand-up">ABOUT US</h2>
  <h2 data-fx="char-stand-up" data-fx-char-stand-up="tilt: 0; shift: 20%; each: .08; dur: 1.8; ease: elastic.out(1, 0.3); fade: .4; fade-ease: power2.out; delay: 0; start: top 90%">Springing into place like a rubber band</h2>
  <template data-demo-late><h2 data-fx="char-stand-up" data-fx-char-stand-up="each: .06; ease: power3.out">Late-arriving title</h2></template>
</section>
<div class="demo-spacer"></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); window.ScrollTrigger?.refresh(); }, 2500);
</script>
</body>
</html>
