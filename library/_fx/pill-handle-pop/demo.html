<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pill-handle-pop — Motion part</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); min-height: 100vh; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { display: grid; gap: 220px; padding: 260px 20px 80px; justify-items: center; }
  .pill { width: 308px; height: 48px; justify-content: center; border-radius: var(--kf-radius-pill); background: var(--kf-raised); box-shadow: var(--kf-shadow-soft); }
  .pill [data-fx-part="item"] { width: 100px; height: 44px; display: flex; align-items: center; justify-content: center; border: 0; background: none; font: 500 14px/1 var(--kf-font-sans); color: var(--kf-ink); cursor: pointer; }
  .card { width: 187px; margin-top: 4px; padding: 22px 10px 22px 22px; border-radius: var(--kf-radius-lg); background: var(--kf-raised); }
  .card h4 { font: 400 14px/1.2 var(--kf-font-sans); }
  .card p { font: 400 24px/1.17 var(--kf-font-display); }
</style>
</head>
<body>
<p class="demo-hint"><b>pill-handle-pop</b> — Try pressing ”Contact”. Press outside to collapse. <span style="color:var(--kf-dim)">(One more pill comes in after 1s, and one drops out after 2.5s)</span></p>
<div class="demo">
  <nav class="pill" data-fx="pill-handle-pop">
    <div data-fx-part="pop"><div class="card" data-fx-part="card"><h4>Say hello</h4><p>Email · Phone</p></div><div class="card" data-fx-part="card"><h4>Follow</h4><p>Channel 1 · Channel 2</p></div></div>
    <span data-fx-part="handle"></span>
    <a href="#" data-fx-part="item" aria-current="page">Work</a><a href="#" data-fx-part="item">About</a><button type="button" data-fx-part="item" data-pop>Contact</button>
  </nav>
  <nav class="pill" data-fx="pill-handle-pop" data-demo-remove><span data-fx-part="handle"></span><a href="#" data-fx-part="item">Dropping out</a><a href="#" data-fx-part="item">Pill</a></nav>
  <template data-demo-late><nav class="pill" data-fx="pill-handle-pop" data-fx-pill-handle-pop="dur: 0"><span data-fx-part="handle"></span><a href="#" data-fx-part="item">Board</a><a href="#" data-fx-part="item" aria-current="page">Without</a><a href="#" data-fx-part="item">Pill</a></nav></template>
  <nav data-fx="pill-handle-pop"></nav>
</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
