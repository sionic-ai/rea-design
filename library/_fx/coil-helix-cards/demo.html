<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>coil-helix-cards — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .coil { height: 320vh; }
  .demo-spacer { height: 60vh; display: grid; place-items: center; color: var(--kf-dim); }
</style>
</head>
<body>
<p class="demo-hint"><b>coil-helix-cards</b> — Scroll down and the image panels spiral upward. Click the panel in front to show its number on top.</p>
<div class="demo-spacer">Scroll down ↓</div>
<section class="coil" data-fx="coil-helix-cards"><div data-fx-part="stage"></div></section>
<div class="demo-spacer">Footer</div>
<script>
// Demo art — five panels with numbers drawn in skin colors
(() => {
  const s = getComputedStyle(document.documentElement), C = ["--kf-accent", "--kf-ink", "--kf-dim", "--kf-accent-text", "--kf-line"].map((n) => s.getPropertyValue(n).trim());
  const stage = document.querySelector('[data-fx-part="stage"]');
  for (let i = 0; i < 5; i++) {
    const c = document.createElement("canvas"); c.width = 640; c.height = 400; const g = c.getContext("2d");
    g.fillStyle = C[i]; g.fillRect(0, 0, 640, 400); g.fillStyle = s.getPropertyValue("--kf-bg").trim(); g.font = "bold 160px sans-serif"; g.fillText(String(i + 1), 260, 260);
    const img = new Image(); img.dataset.fxPart = "card"; img.alt = ""; img.dataset.n = String(i + 1); img.src = c.toDataURL(); stage.append(img);
  }
  document.addEventListener("fx:pick", (e) => (document.querySelector(".demo-hint b").textContent = `coil-helix-cards · panel ${e.target.dataset.n}`));
  const make = () => { const el = document.createElement("section"); el.style.height = "160vh"; el.dataset.fx = "coil-helix-cards"; const st = stage.cloneNode(true); st.querySelectorAll("canvas").forEach((x) => x.remove()); el.append(st); return el; };
  const host = document.querySelector(".coil");
  const gone = make(); host.after(gone);
  setTimeout(() => host.after(make()), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s, one more panel comes in (the late one), and after 2.5s one drops out (the removal).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
