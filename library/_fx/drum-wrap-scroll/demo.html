<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>drum-wrap-scroll — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-pad { height: 60vh; display: grid; place-content: center; }
  .demo-track { height: 300vh; }
</style>
</head>
<body>
<p class="demo-hint"><b>drum-wrap-scroll</b> Scroll down and the sticker wraps around a cylinder and rotates up from the bottom as it passes. Move the mouse.</p>
<div class="demo-pad">Try scrolling</div>
<div class="demo-track" data-fx="drum-wrap-scroll">
  <span data-fx-part="sticker" data-words="sample|text**ing|here" data-scale="0.5" data-turns="0.5"></span>
  <span data-fx-part="sticker" data-words="artist|name" data-scale="0.25" data-rotation="10" data-turns="-0.5" data-offset="0.2" data-distance="0.04"></span>
</div>
<div class="demo-pad">Footer</div>
<script>
(() => {
  const src = document.querySelector('[data-fx~="drum-wrap-scroll"]');
  if (!src) return;
  const html = src.outerHTML;
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => src.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical one comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="../../_vendor/three@0.137.0/build/three.min.js"></script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
