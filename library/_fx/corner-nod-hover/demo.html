<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>corner-nod-hover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { margin: 0; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .shelf { display: flex; flex-wrap: wrap; gap: 60px; padding: 60px; }
  .shelf a { display: block; width: 180px; aspect-ratio: 230 / 280; box-shadow: var(--kf-shadow-soft); }
  .shelf .wf-img { height: 100%; }
</style>
</head>
<body>
<p class="demo-hint"><b>corner-nod-hover</b> — Hover over the cover. It tilts 3° around the bottom right and returns. The second cover is -4° · .3s.</p>
<div class="shelf" id="shelf">
  <a data-fx="corner-nod-hover" href="#"><div class="wf-img" data-label="Magazine cover · 23:28 portrait"></div></a>
  <a data-fx="corner-nod-hover" data-fx-corner-nod-hover="angle: -4; dur: .3" href="#"><div class="wf-img" data-label="Magazine cover · 23:28 portrait"></div></a>
  <a data-fx="corner-nod-hover" href="#"><div class="wf-img" data-label="Magazine cover · 23:28 portrait"></div></a>
</div>
<script>
// Late arrivals and removals — one more cover comes in after 1s, and the first cover is dropped after 2.5s (detach)
(() => {
  const shelf = document.getElementById("shelf");
  const first = shelf.firstElementChild;
  setTimeout(() => { const a = document.createElement("a"); a.href = "#"; a.dataset.fx = "corner-nod-hover"; a.innerHTML = '<div class="wf-img" data-label="Late cover · Portrait 23:28"></div>'; shelf.append(a); }, 1000);
  setTimeout(() => first.remove(), 2500);
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
