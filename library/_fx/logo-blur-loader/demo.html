<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>logo-blur-loader — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo-spacer { height: 90vh; display: grid; place-items: center; color: var(--kf-dim); }
  .lb svg { width: 120px; height: 120px; }
  .lb [data-fx-part="layer"] { color: var(--kf-ink); }
  .lb .seal { fill: var(--kf-accent); }
  main { padding: 40px; }
</style>
</head>
<body>
<p class="demo-hint"><b>logo-blur-loader</b> — On open, four logo pieces at the center of the curtain sharpen at .3s intervals, and the curtain lifts after 2.7s (refresh to replay). <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<div class="lb" data-demo-remove data-fx="logo-blur-loader" data-fx-logo-blur-loader="hold: 2.7"><svg data-fx-part="layer" viewBox="0 0 100 100"><path d="M30 10c6 2 8 9 6 18-2 10-7 20-5 30 1 5-4 6-6 2-4-10 2-22 3-32 1-7-2-13 2-18z" fill="currentColor"/></svg><svg data-fx-part="layer" viewBox="0 0 100 100"><path d="M46 14c8-4 16 0 15 9-1 8-8 14-14 19-3 2-5-1-3-3 5-5 10-10 10-16 0-5-5-7-9-6-3 1-4-2 1-3z" fill="currentColor"/></svg><svg data-fx-part="layer" viewBox="0 0 100 100"><path d="M14 70c14-6 34-8 54-6 10 1 20 4 28 9 2 2 0 4-3 3-14-6-32-7-50-5-10 1-18 3-26 5-4 1-5-4-3-6z" fill="currentColor"/></svg><svg data-fx-part="layer" viewBox="0 0 100 100"><rect class="seal" x="6" y="84" width="10" height="10"/></svg></div>
<div class="lb" data-fx="logo-blur-loader" data-fx-logo-blur-loader="hold: 2.7"><svg data-fx-part="layer" viewBox="0 0 100 100"><path d="M30 10c6 2 8 9 6 18-2 10-7 20-5 30 1 5-4 6-6 2-4-10 2-22 3-32 1-7-2-13 2-18z" fill="currentColor"/></svg><svg data-fx-part="layer" viewBox="0 0 100 100"><path d="M46 14c8-4 16 0 15 9-1 8-8 14-14 19-3 2-5-1-3-3 5-5 10-10 10-16 0-5-5-7-9-6-3 1-4-2 1-3z" fill="currentColor"/></svg><svg data-fx-part="layer" viewBox="0 0 100 100"><path d="M14 70c14-6 34-8 54-6 10 1 20 4 28 9 2 2 0 4-3 3-14-6-32-7-50-5-10 1-18 3-26 5-4 1-5-4-3-6z" fill="currentColor"/></svg><svg data-fx-part="layer" viewBox="0 0 100 100"><rect class="seal" x="6" y="84" width="10" height="10"/></svg></div>
<template data-demo-late><div class="lb" data-fx="logo-blur-loader" data-fx-logo-blur-loader="hold: 2.7"><svg data-fx-part="layer" viewBox="0 0 100 100"><path d="M30 10c6 2 8 9 6 18-2 10-7 20-5 30 1 5-4 6-6 2-4-10 2-22 3-32 1-7-2-13 2-18z" fill="currentColor"/></svg><svg data-fx-part="layer" viewBox="0 0 100 100"><path d="M46 14c8-4 16 0 15 9-1 8-8 14-14 19-3 2-5-1-3-3 5-5 10-10 10-16 0-5-5-7-9-6-3 1-4-2 1-3z" fill="currentColor"/></svg><svg data-fx-part="layer" viewBox="0 0 100 100"><path d="M14 70c14-6 34-8 54-6 10 1 20 4 28 9 2 2 0 4-3 3-14-6-32-7-50-5-10 1-18 3-26 5-4 1-5-4-3-6z" fill="currentColor"/></svg><svg data-fx-part="layer" viewBox="0 0 100 100"><rect class="seal" x="6" y="84" width="10" height="10"/></svg></div></template>
<div class="demo-spacer"></div>

<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); window.ScrollTrigger?.refresh(); }, 2500);
</script>
</body>
</html>
