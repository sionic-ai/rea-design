<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>char-blur-rise — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .stage { padding: 40px 20px; display: grid; gap: 18px; justify-items: center; text-align: center; }
  .stage h2 { font: 300 36px/1.2 var(--kf-font-display); }
  .stage p { max-width: 36em; color: var(--kf-dim); }
  .stage button { padding: 6px 16px; border: 1px solid var(--kf-line); border-radius: var(--kf-radius-pill); background: none; cursor: pointer; }
</style>
</head>
<body>
<p class="demo-hint"><b>char-blur-rise</b> Title letters resolve from blur right on open. Press the button below and the state shape resolves again.</p>
<section class="stage">
  <h2 data-fx="char-blur-rise" data-demo-remove>A big headline <em>here</em></h2>
  <h2 data-fx="char-blur-rise" data-fx-char-blur-rise="delay: .6">The <em>Second</em> Room</h2>
  <p data-fx="char-blur-rise" data-fx-char-blur-rise="split: word; delay: 1.2">Your two lines of body text go here. Split by word, and a long text settles in one word at a time.</p>
  <h2 id="again" data-fx="char-blur-rise" data-fx-char-blur-rise="on: state">State Title</h2>
  <button type="button" onclick="document.getElementById('again').dispatchEvent(new CustomEvent('fx:show'))">Form again</button>
  <h2 data-fx="char-blur-rise"></h2>
  <template data-demo-late><h2 data-fx="char-blur-rise">Late title</h2></template>
</section>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/CustomEase.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
