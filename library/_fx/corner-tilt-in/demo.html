<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>corner-tilt-in — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-accent); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-spacer { height: 80vh; display: grid; place-items: center; color: var(--kf-on-accent); }
  .col { display: grid; gap: 40px; padding: 0 0 40vh; }
  .card { width: 92%; min-height: 320px; padding: 48px; background: var(--kf-surface); display: grid; place-items: center; }
</style>
</head>
<body>
<p class="demo-hint"><b>corner-tilt-in</b> — Scroll down. The card hangs from the top left corner and then stands upright.</p>
<div class="demo-spacer">Scroll down</div>
<div class="col">
  <section class="card" data-fx="corner-tilt-in">Card 1</section>
  <section class="card" data-fx="corner-tilt-in">Card 2</section>
  <section class="card" data-fx="corner-tilt-in" data-fx-corner-tilt-in="tilt: -6; look: right">Card 3 · right axis −6°</section>
</div>
<script>
(() => {
  const src = document.querySelector('[data-fx~="corner-tilt-in"]');
  if (!src || !src.parentNode) return;
  const host = src.parentNode;
  const make = (tag) => { const el = src.cloneNode(true); el.textContent = tag; return el; };
  const gone = make("Card to drop");
  src.after(gone);
  setTimeout(() => host.append(make("Late-arrived card")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s one more card comes in, and after 2.5s one drops out.");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../../../_shared/vendor/gsap/CustomEase.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
