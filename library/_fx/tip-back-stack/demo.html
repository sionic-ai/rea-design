<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tip-back-stack — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo-spacer { height: 90vh; display: grid; place-items: center; color: var(--kf-dim); }
  .stack { max-width: 960px; margin: 0 auto; padding: 0 20px; }
  .stack > article + article { margin-top: 60px; }
  [data-fx-part="card"] { display: flex; gap: 24px; min-height: 420px; padding: 21px; border: 1px solid var(--kf-dim); border-radius: var(--kf-radius-md); background: var(--kf-surface); font: 700 40px/1.2 var(--kf-font-display); }
  [data-fx-part="card"] .wf-img { width: 45%; flex-shrink: 0; }
</style>
</head>
<body>
<p class="demo-hint"><b>tip-back-stack</b> — Scrolling down, a card sticks at the top, and while the next card covers it the previous card turns slightly and lies back. <span style="color:var(--kf-dim)">(After 1s one more pile comes in, and after 2.5s one drops out)</span></p>
<div class="demo-spacer">Scroll down</div>
<div data-demo-remove class="stack" data-fx="tip-back-stack"><article><div data-fx-part="card"><div class="wf-img wf-r-1x1" data-label="Event poster · Square"></div>Card 1</div></article><article><div data-fx-part="card"><div class="wf-img wf-r-1x1" data-label="Portrait photo · Square"></div>Card 2</div></article></div>
<div class="stack" data-fx="tip-back-stack"><article><div data-fx-part="card"><div class="wf-img wf-r-1x1" data-label="Event poster · Square"></div>Card 1</div></article><article><div data-fx-part="card"><div class="wf-img wf-r-1x1" data-label="Portrait photo · Square"></div>Card 2</div></article><article><div data-fx-part="card"><div class="wf-img wf-r-1x1" data-label="Graphic · square"></div>Card 3</div></article><article><div data-fx-part="card"><div class="wf-img wf-r-1x1" data-label="Campaign poster · Square"></div>Card 4</div></article></div>
<template data-demo-late><div class="stack" data-fx="tip-back-stack"><article><div data-fx-part="card">Late Card 1</div></article><article><div data-fx-part="card">Late Card 2</div></article></div></template>
<div class="demo-spacer"></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); window.ScrollTrigger?.refresh(); }, 2500);
</script>
</body>
</html>
