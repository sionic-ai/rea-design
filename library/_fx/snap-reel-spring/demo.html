<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>snap-reel-spring — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { padding: 24px 20px; display: grid; gap: 24px; }
  .reel { height: 70vh; border: 1px solid var(--kf-line); }
  .reel figure { margin: 0; }
  .reel .wf-img { height: 100%; }
  .out { font: 500 13px/1.4 var(--kf-font-mono); }
</style>
</head>
<body>
<p class="demo-hint"><b>snap-reel-spring</b> — Roll the wheel or drag up and down over the panel. Each row settles with a spring, and only the center row is large and cycles color. Arrow keys work too.</p>
<section class="demo">
  <p class="out">Current cell: <b data-out>0</b></p>
  <div class="reel" data-fx="snap-reel-spring">
    <figure data-fx-part="item"><div class="wf-img" data-label="Work 1 · Horizontal 3:2" style="background: var(--kf-accent-soft)"></div></figure>
    <figure data-fx-part="item"><div class="wf-img" data-label="Work 2 · Horizontal 3:2"></div></figure>
    <figure data-fx-part="item"><div class="wf-img" data-label="Work 3 · Horizontal 3:2" style="background: var(--kf-accent)"></div></figure>
    <figure data-fx-part="item"><div class="wf-img" data-label="Work 4 · Horizontal 3:2"></div></figure>
  </div>
  <div class="reel" data-fx="snap-reel-spring" data-fx-snap-reel-spring="size: .4; small: .5" data-demo-remove style="height: 40vh"><figure data-fx-part="item"><div class="wf-img" data-label="Removed soon 1"></div></figure><figure data-fx-part="item"><div class="wf-img" data-label="Removed soon 2"></div></figure></div>
  <template data-demo-late><div class="reel" data-fx="snap-reel-spring" style="height: 40vh"><figure data-fx-part="item"><div class="wf-img" data-label="Late arrival 1"></div></figure><figure data-fx-part="item"><div class="wf-img" data-label="Late arrival 2"></div></figure><figure data-fx-part="item"><div class="wf-img" data-label="Late arrival 3"></div></figure></div></template>
  <div data-fx="snap-reel-spring" style="height: 120px">Empty board — hangs nothing if there are no children</div>
</section>
<script>
(() => {
  document.querySelector(".reel").addEventListener("fx:change", (e) => (document.querySelector("[data-out]").textContent = e.detail.index));
  const late = document.querySelector("[data-demo-late]");
  setTimeout(() => late.after(late.content.firstElementChild.cloneNode(true)), 1000);
  setTimeout(() => document.querySelector("[data-demo-remove]")?.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s one more panel comes in, and after 2.5s one leaves.");
})();
</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
