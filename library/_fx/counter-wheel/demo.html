<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>counter-wheel — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { display: flex; flex-wrap: wrap; align-items: center; gap: 16px; padding: 48px 20px; }
  .demo-pill { padding: .2em .8em; border-radius: 2em; background: var(--kf-accent); color: var(--kf-on-accent); font-size: 14px; }
  .demo-btn { height: 40px; padding: 0 16px; border: 1px solid var(--kf-line); border-radius: var(--kf-radius-sm); background: var(--kf-surface); color: var(--kf-ink); cursor: pointer; }
  .demo-spacer { height: 90vh; display: grid; place-items: center; color: var(--kf-dim); }
  .demo h2 { display: flex; align-items: center; gap: 8px; font-size: 18px; }
</style>
</head>
<body>
<p class="demo-hint"><b>counter-wheel</b> — On open the numbers roll and stop. Roll again with the button, scroll down and the ”view” number rolls out as it enters.</p>
<section class="demo">
  <span class="demo-pill" data-fx="counter-wheel" id="first">24</span>
  <span class="demo-pill" data-fx="counter-wheel" data-fx-counter-wheel="value: 128; dur: 2">0</span>
  <span class="demo-pill" data-fx="counter-wheel" data-fx-counter-wheel="dur: .8; stagger: .1; ease: 0.16,1,0.3,1; look: plain">07</span>
  <button class="demo-btn" type="button" onclick="document.getElementById('first').dispatchEvent(new Event('fx:roll'))">Roll again</button>
</section>
<div class="demo-spacer">Scroll down</div>
<section class="demo"><h2>Past work <span class="demo-pill" data-fx="counter-wheel" data-fx-counter-wheel="on: view; delay: .2">32</span></h2></section>
<div class="demo-spacer"></div>
<script>
(() => {
  const src = document.querySelector('[data-fx~="counter-wheel"]');
  if (!src) return;
  const make = (tag) => { const el = document.createElement("span"); el.className = "demo-pill"; el.dataset.fx = "counter-wheel"; el.textContent = "57"; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => src.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical one comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/CustomEase.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
