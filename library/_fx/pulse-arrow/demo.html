<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pulse-arrow — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-surface); color: var(--kf-ink); font: 800 28px/1.4 var(--kf-font-display); padding: 40px; }
  .demo-hint { margin-bottom: 30px; font: 500 13px/1.4 var(--kf-font-mono); }
  .hint { display: inline-flex; align-items: center; gap: 14px; margin-right: 40px; }
</style>
</head>
<body>
<p class="demo-hint"><b>pulse-arrow</b> — The arrow grows and shrinks every 2s. (One more enters after 1s and one leaves after 2.5s)</p>
<div id="row">
  <p class="hint">Scroll <i data-fx="pulse-arrow"></i></p>
  <p class="hint" data-demo-remove>Next <i data-fx="pulse-arrow" style="--fx-to: 60px"></i></p>
</div>
<template data-demo-late><p class="hint">Late <i data-fx="pulse-arrow" style="--fx-dur: 1s"></i></p></template>
<script src="../fx-core.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => document.getElementById("row")?.append(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
