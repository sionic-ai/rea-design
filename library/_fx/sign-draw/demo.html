<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sign-draw — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-row { display: flex; gap: 40px; padding: 40px 20px; }
  .demo-row svg { width: 160px; height: auto; }
  .demo-row svg path { stroke-width: 7; }
  .demo-spacer { height: 120vh; display: grid; place-items: center; color: var(--kf-dim); }
  .demo-foot { padding: 40px 20px; background: var(--kf-surface); }
</style>
</head>
<body>
<p class="demo-hint"><b>sign-draw</b> — The left signature is drawn as soon as it opens, and the middle one repeats. Scroll all the way down — the left one erases in reverse and the footer signature is drawn.</p>
<div class="demo-row">
  <svg data-fx="sign-draw" data-fx-sign-draw="reverse-at-bottom: 1; speed: 1.15" viewBox="0 0 400 240" aria-hidden="true">
    <path data-fx-part="stroke" data-at="0 1.35" pathLength="1" d="M40 172C70 122 95 62 110 40C120 27 129 40 118 70C105 110 90 150 96 168C102 183 125 150 140 120C150 100 161 95 158 121C156 145 150 171 166 165C186 157 200 110 215 95C225 85 233 95 226 118C220 140 214 171 233 160C256 146 276 120 300 112C321 106 341 112 366 104"/>
    <path data-fx-part="stroke" data-at="1.35 1.85" pathLength="1" d="M58 124C140 102 252 82 362 58"/>
  </svg>
  <svg data-fx="sign-draw" data-fx-sign-draw="loop: 1" viewBox="0 0 400 240" aria-hidden="true">
    <path data-fx-part="stroke" pathLength="1" d="M40 172C70 122 95 62 110 40C120 27 129 40 118 70C105 110 90 150 96 168C102 183 125 150 140 120C150 100 161 95 158 121"/>
    <path data-fx-part="stroke" pathLength="1" d="M58 124C140 102 252 82 362 58"/>
  </svg>
  <svg data-fx="sign-draw" viewBox="0 0 400 240" aria-hidden="true"></svg>
</div>
<div class="demo-spacer">Scroll down</div>
<footer class="demo-foot">
  <svg data-fx="sign-draw" data-fx-sign-draw="on: bottom" viewBox="0 0 400 240" style="width:200px" aria-hidden="true">
    <path data-fx-part="stroke" data-at="0 1.35" pathLength="1" stroke-width="7" d="M40 172C70 122 95 62 110 40C120 27 129 40 118 70C105 110 90 150 96 168C102 183 125 150 140 120C150 100 161 95 158 121C156 145 150 171 166 165C186 157 200 110 215 95"/>
    <path data-fx-part="stroke" data-at="1.35 1.85" pathLength="1" stroke-width="7" d="M58 124C140 102 252 82 362 58"/>
  </svg>
</footer>
<script>
// Late arrivals and removals — checks that fx-core attaches to an element added after 1s and detaches from an element removed after 2.5s
(() => {
  const src = document.querySelector('[data-fx~="sign-draw"]');
  const html = src.outerHTML;
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => src.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s one more signature comes in, and after 2.5s one drops out (detach).");
})();
</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
