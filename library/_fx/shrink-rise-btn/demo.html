<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>shrink-rise-btn — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .row { display: flex; gap: 8px; padding: 60px 20px; flex-wrap: wrap; }
  .btn { display: inline-flex; align-items: center; height: 37px; padding: 0 16px; border: 0; font: 500 12px/1 var(--kf-font-mono); letter-spacing: .02em; text-transform: uppercase; cursor: pointer; }
</style>
</head>
<body>
<p class="demo-hint"><b>shrink-rise-btn</b> — Hover over the button. The background shrinks and an accent-colored panel rises from below.</p>
<div class="row">
  <a class="btn" href="#" data-fx="shrink-rise-btn">Explore</a>
  <button class="btn is-active" type="button" data-fx="shrink-rise-btn">Selected tab</button>
  <button class="btn" type="button" data-fx="shrink-rise-btn" style="--fx-bg: var(--kf-contrast-bg); --fx-ink: var(--kf-contrast-ink)">Dark background</button>
</div>
<script>
// Late arrivals·removals — a CSS-only part, so attaching and detaching is done directly with selectors
(() => {
  const row = document.querySelector(".row");
  const src = row.querySelector('[data-fx~="shrink-rise-btn"]');
  const gone = src.cloneNode(true); gone.textContent = "Being removed soon"; row.append(gone);
  setTimeout(() => { const n = src.cloneNode(true); n.textContent = "Late one"; row.append(n); }, 1000);
  setTimeout(() => gone.remove(), 2500);
})();
</script>
<script src="../fx-core.js"></script>
</body>
</html>
