<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>scroll-drift — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { padding: 48px 20px; }
  .demo-spacer { height: 90vh; display: grid; place-items: center; color: var(--kf-dim); }

  .field { position: relative; height: 70vh; border-radius: var(--kf-radius-lg); background: var(--kf-raised); }
  .pill { position: absolute; padding: 10px 14px; border-radius: 99px; background: var(--kf-surface); font: 600 12px/1 var(--kf-font-display); }
</style>
</head>
<body>
<p class="demo-hint"><b>scroll-drift</b> — As you scroll down, watch the pills get pushed along, each in its own way. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<div class="demo-spacer">Scroll down</div><section class="demo"><div class="field">
<a data-demo-remove class="pill" data-fx="scroll-drift" href="#" style="left:41%;top:16%">Channel 1</a><a class="pill" data-fx="scroll-drift" href="#" style="left:41%;top:16%">Channel 1</a><template data-demo-late><a class="pill" data-fx="scroll-drift" href="#" style="left:41%;top:16%">Channel 1</a></template><a class="pill" data-fx="scroll-drift" href="#" style="left:15%;top:62%">Channel 2</a><a class="pill" data-fx="scroll-drift" href="#" style="left:66%;top:55%" data-fx-scroll-drift="min: -80; max: 80">Channel 3 (far)</a>
</div></section><div class="demo-spacer"></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); window.ScrollTrigger?.refresh(); }, 2500);
</script>
</body>
</html>
