<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>letter-disc-cursor — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; padding: 40px 20px; }
  .card { aspect-ratio: 4 / 3; background: var(--kf-raised); display: grid; place-items: end start; padding: 12px; }
</style>
</head>
<body>
<p class="demo-hint"><b>letter-disc-cursor</b> — Hover over the card. A circle follows with a lag and the word more floats up. <span style="color:var(--kf-dim)">(After 1s one more cursor comes in, and after 2.5s the first one leaves)</span></p>
<section class="demo">
  <div class="card" data-cursor>Photo 1</div>
  <div class="card" data-cursor="dark">Photo 2 — dark circle</div>
  <div class="card">No label</div>
</section>
<div data-fx="letter-disc-cursor" aria-hidden="true" data-demo-remove><span data-fx-part="text">more</span></div>
<template data-demo-late><div data-fx="letter-disc-cursor" data-fx-letter-disc-cursor="lerp: .2; each: .05" aria-hidden="true"><span data-fx-part="text">view</span></div></template>
<div data-fx="letter-disc-cursor"></div>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
