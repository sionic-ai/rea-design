<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>slant-wipe-rotate — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { padding: 48px 20px; display: grid; gap: 30px; }
  .wipe { height: 320px; }
  .wipe.is-small { height: 220px; max-width: 420px; }
  .sl { display: grid; place-items: center; font: 700 64px/1 var(--kf-font-display); color: var(--kf-surface); }
  .s0 { background: var(--kf-ink); } .s1 { background: var(--kf-accent); } .s2 { background: var(--kf-dim); }
  .demo-log { font: 500 12px/1.4 var(--kf-font-mono); color: var(--kf-dim); }
</style>
</head>
<body>
<p class="demo-hint"><b>slant-wipe-rotate</b> — Left alone, the panel changes every 3s (2s for the two below), peeling away diagonally to the right. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<section class="demo">
  <div class="wipe" data-fx="slant-wipe-rotate" data-fx-slant-wipe-rotate="every: 3; first: 0.5"><div data-fx-part="slide" class="sl s0">1</div><div data-fx-part="slide" class="sl s1">2</div><div data-fx-part="slide" class="sl s2">3</div></div>
  <p class="demo-log" id="log">fx:slide —</p>
  <div class="wipe is-small" data-demo-remove data-fx="slant-wipe-rotate" data-fx-slant-wipe-rotate="every: 2; dur: 1; delay: 0; first: 0"><div data-fx-part="slide" class="sl s2">A</div><div data-fx-part="slide" class="sl s1">B</div></div>
  <template data-demo-late><div class="wipe is-small" data-fx="slant-wipe-rotate" data-fx-slant-wipe-rotate="every: 2; dur: 2; delay: 0.2; first: 0"><div data-fx-part="slide" class="sl s0">Photo</div><div data-fx-part="slide" class="sl s1">Graph</div></div></template>
  <div class="wipe is-small" data-fx="slant-wipe-rotate"></div>
</section>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
document.querySelector(".wipe").addEventListener("fx:slide", (e) => { document.getElementById("log").textContent = "fx:slide — index " + e.detail.index + " · prev " + e.detail.prev; });
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); window.ScrollTrigger?.refresh(); }, 2500);
</script>
</body>
</html>
