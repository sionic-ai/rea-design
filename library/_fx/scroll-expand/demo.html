<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>scroll-expand — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { padding: 48px 20px; }
  .demo-spacer { height: 90vh; display: grid; place-items: center; color: var(--kf-dim); }

  .hero { position: relative; height: 100vh; }
  .preview { top: 25%; right: 8.333%; width: 320px; aspect-ratio: 3 / 2; border-radius: 40px 0 40px 40px; rotate: 14deg; background: var(--kf-ink); color: var(--kf-bg); display: grid; place-items: center; }
  #reel { height: 100vh; }
</style>
</head>
<body>
<p class="demo-hint"><b>scroll-expand</b> — Scroll down and the tilted preview grows into the whole next section. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<section class="hero"><div data-demo-remove class="preview" data-fx="scroll-expand" data-fx-scroll-expand="to: #reel">Showreel preview</div><div class="preview" data-fx="scroll-expand" data-fx-scroll-expand="to: #reel">Showreel preview</div><template data-demo-late><div class="preview" data-fx="scroll-expand" data-fx-scroll-expand="to: #reel">Showreel preview</div></template></section>
<section id="reel"></section>
<div class="demo-spacer"></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); window.ScrollTrigger?.refresh(); }, 2500);
</script>
</body>
</html>
