<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>svg-grow-sweep — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-spacer { height: 100vh; display: grid; place-items: center; color: var(--kf-dim); }
  .sec { position: relative; height: 140vh; }
  .sec figure { position: absolute; top: 0; width: 30%; margin: 0; }
  .sec .l { left: 0; } .sec .r { right: 0; }
  .a { fill: var(--kf-accent); } .b { fill: var(--kf-ink); } .c { fill: var(--kf-raised); }
</style>
</head>
<body>
<p class="demo-hint"><b>svg-grow-sweep</b> — Scroll down and decorative pieces on both sides grow out horizontally one after another (they don’t shrink when scrolling up). <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<div class="demo-spacer">Scroll down</div>
<section class="sec">
  <figure class="l" data-fx="svg-grow-sweep"><svg viewBox="0 0 300 500"><rect class="a" y="20" width="220" height="60"/><rect class="b" y="100" width="160" height="40"/><rect class="c" y="160" width="280" height="90"/><rect class="a" y="270" width="200" height="50"/></svg></figure>
  <figure class="r" data-fx="svg-grow-sweep" data-fx-svg-grow-sweep="origin: right; span: .3"><svg viewBox="0 0 300 500"><rect class="c" x="80" y="40" width="220" height="80"/><rect class="a" x="140" y="140" width="160" height="120"/><rect class="b" x="40" y="280" width="260" height="40"/></svg></figure>
  <figure data-demo-remove class="l" style="top:70vh" data-fx="svg-grow-sweep"><svg viewBox="0 0 300 200"><rect class="b" y="20" width="200" height="60"/></svg></figure>
</section>
<template data-demo-late><section class="sec"><figure class="r" data-fx="svg-grow-sweep" data-fx-svg-grow-sweep="origin: right"><svg viewBox="0 0 300 300"><rect class="a" x="60" y="20" width="240" height="80"/><rect class="b" x="120" y="120" width="180" height="60"/></svg></figure></section></template>
<figure data-fx="svg-grow-sweep"></figure>
<div class="demo-spacer"></div>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
