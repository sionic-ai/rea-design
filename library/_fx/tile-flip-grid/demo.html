<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tile-flip-grid — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { display: grid; gap: 32px; padding: 32px 20px; }
  .stage { height: 60vh; }
  .stage.is-small { height: 320px; width: 320px; }
  .pic { width: 100%; height: 100%; }
  .pic.is-a { background: linear-gradient(160deg, var(--kf-surface), var(--kf-raised)); }
  .pic.is-b { background: linear-gradient(20deg, var(--kf-accent-soft), var(--kf-accent)); }
  .pic.is-c { background: linear-gradient(90deg, var(--kf-ink), var(--kf-dim)); }
  .pic b { position: absolute; left: 50%; top: 50%; translate: -50% -50%; font-size: 28px; color: var(--kf-ink); }
  .pic { position: relative; }
</style>
</head>
<body>
<p class="demo-hint"><b>tile-flip-grid</b> — After 2s the cells flip in turn, and 2s later it moves on to the next scene. Hover over the cells. <span style="color:var(--kf-dim)">(After 1s one more small panel comes in, and one leaves 2.5s later)</span></p>
<section class="demo">
  <div class="stage" data-fx="tile-flip-grid" data-fx-tile-flip-grid="wait: 2; hold: 2">
    <div data-fx-part="scene"><div class="pic is-a" data-fx-part="front"><b>Before Scene 1</b></div><div class="pic is-b" data-fx-part="back"><b>After Scene 1</b></div></div>
    <div data-fx-part="scene"><div class="pic is-c" data-fx-part="front"><b>Before Scene 2</b></div><div class="pic is-a" data-fx-part="back"><b>After Scene 2</b></div></div>
  </div>
  <div class="stage is-small" data-demo-remove data-fx="tile-flip-grid" data-fx-tile-flip-grid="cols: 3; rows: 3; wait: 1; hold: 1">
    <div data-fx-part="scene"><div class="pic is-b" data-fx-part="front"><b>Dropped Panel</b></div><div class="pic is-c" data-fx-part="back"></div></div>
  </div>
  <div class="stage is-small" data-fx="tile-flip-grid"></div>
  <template data-demo-late><div class="stage is-small" data-fx="tile-flip-grid" data-fx-tile-flip-grid="cols: 3; rows: 3; wait: 1.5; hold: 1.5"><div data-fx-part="scene"><div class="pic is-c" data-fx-part="front"><b>Late panel</b></div><div class="pic is-b" data-fx-part="back"><b>Back side</b></div></div><div data-fx-part="scene"><div class="pic is-a" data-fx-part="front"><b>Second</b></div></div></div></template>
</section>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
