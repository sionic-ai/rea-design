<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>contour-terrain-gl — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .stage { min-height: 80vh; padding: 10vh 5vw; display: flex; align-items: flex-end; }
  .stage h1 { font-size: clamp(48px, 9vw, 140px); line-height: .9; letter-spacing: -.05em; }
  .small { min-height: 40vh; margin: 20px; border: 1px solid var(--kf-line); }
</style>
</head>
<body>
<p class="demo-hint"><b>contour-terrain-gl</b> — Move the mouse over the panel. A hill rises under the cursor and the contour lines spread apart. <span style="color:var(--kf-dim)">(After 1s one more panel comes in, and one leaves 2.5s later)</span></p>
<section class="stage" data-fx="contour-terrain-gl"><h1>A big headline<br>on the terrain.</h1></section>
<section class="small" data-fx="contour-terrain-gl" data-fx-contour-terrain-gl="lines: 10; fade: none" data-demo-remove></section>
<template data-demo-late><section class="small" data-fx="contour-terrain-gl" data-fx-contour-terrain-gl="hill: 1; lines: 26; fade: none"></section></template>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
