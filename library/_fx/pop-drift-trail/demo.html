<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pop-drift-trail — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .t { height: 60vh; margin: 16px 0; background: var(--kf-contrast-bg); }
  .t .c { width: 130px; height: 130px; border-radius: 14px; background: var(--kf-raised); box-shadow: var(--kf-shadow-lift); display: grid; place-items: center; font: 700 14px/1 var(--kf-font-mono); color: var(--kf-dim); }
</style>
</head>
<body>
<p class="demo-hint"><b>pop-drift-trail</b> — Swing the mouse over the black panel. Cards pop up, then slide down and vanish.</p>
<section class="t" data-fx="pop-drift-trail"><div data-fx-part="layer"></div>
  <div class="c" data-fx-part="item">Card 1</div><div class="c" data-fx-part="item">Card 2</div><div class="c" data-fx-part="item">Card 3</div>
</section>
<section class="t" data-fx="pop-drift-trail" data-demo-remove><div class="c" data-fx-part="item">Erase</div></section>
<div id="late"></div>
<template data-demo-late><section class="t" data-fx="pop-drift-trail" data-fx-pop-drift-trail="gap: 60; fall: 60,90"><div class="c" data-fx-part="item">Late</div></section></template>
<section class="t" data-fx="pop-drift-trail"></section>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => document.getElementById("late").append(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
