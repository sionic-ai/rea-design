<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>noise-dissolve-slides — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .stage { height: 70vh; }
</style>
</head>
<body>
<p class="demo-hint"><b>noise-dissolve-slides</b> — Every 3s the image shimmers and melts into the next. Scrolling the wheel or dragging also advances it.</p>
<section class="stage" data-fx="noise-dissolve-slides"><canvas data-fx-part="canvas"></canvas></section>
<script>
// Three demo images — canvases painted with Skin variable colors (the user puts in an img)
(() => {
  const stage = document.querySelector('[data-fx~="noise-dissolve-slides"]');
  if (!stage || !stage.parentNode) return;
  const host = stage.parentNode;
  const css = getComputedStyle(document.documentElement);
  const tone = ["--kf-accent", "--kf-accent-soft", "--kf-ink"].map((v) => css.getPropertyValue(v).trim());
  tone.forEach((c, i) => {
    const cv = document.createElement("canvas");
    cv.width = 512; cv.height = 288; cv.setAttribute("data-fx-part", "slide");
    const g = cv.getContext("2d");
    g.fillStyle = c; g.fillRect(0, 0, 512, 288);
    g.fillStyle = tone[(i + 1) % 3]; g.beginPath(); g.arc(256, 144, 80 + i * 20, 0, Math.PI * 2); g.fill();
    stage.append(cv);
  });
  const gone = stage.cloneNode(true);
  host.append(gone);
  setTimeout(() => host.append(stage.cloneNode(true)), 1000);
  setTimeout(() => gone.remove(), 2500);
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="three-global.js"></script>
<script src="../../_vendor/three@0.176.0/build/three.cjs"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
