<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fill-swap-hover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { padding: 48px 20px; }
  .demo-spacer { height: 90vh; display: grid; place-items: center; color: var(--kf-dim); }

  .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  .btn { padding: 14px 16px; border-radius: var(--kf-radius-md); background: var(--kf-surface); border: 1px solid var(--kf-line); font: 600 12px/1 var(--kf-font-display); text-transform: uppercase; }
  .pill { padding: 10px 14px; border-radius: 99px; background: var(--kf-raised); font: 600 12px/1 var(--kf-font-display); }
</style>
</head>
<body>
<p class="demo-hint"><b>fill-swap-hover</b> — Hover over the buttons and pills. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<section class="demo"><div class="row">
  <a data-demo-remove class="btn" data-fx="fill-swap-hover" href="#">Your button here</a><a class="btn" data-fx="fill-swap-hover" href="#">Your button here</a><template data-demo-late><a class="btn" data-fx="fill-swap-hover" href="#">Your button here</a></template>
  <a class="pill" data-fx="fill-swap-hover" style="--fx-dur:.3s" href="#">Channel 1 ↗</a>
  <a class="btn" data-fx="fill-swap-hover" style="--fx-fill: var(--kf-ink); --fx-on: var(--kf-bg)" href="#">Button that darkens</a>
  <a class="btn" data-fx="fill-swap-hover" data-fx-fill-swap-hover="look: rise" href="#">Button rising from below</a>
  <a class="btn" data-fx="fill-swap-hover" data-fx-fill-swap-hover="look: rise-through" style="--fx-fill: var(--kf-contrast-bg); --fx-on: var(--kf-contrast-ink); --fx-press: .95; --fx-text-dur: .6s; --fx-ease: cubic-bezier(.32,.48,0,1); --fx-text-ease: cubic-bezier(.32,.48,0,1)" href="#">Card that fills up and exits upward</a>
  <a class="btn" data-fx="fill-swap-hover" data-fx-fill-swap-hover="look: grow" style="border-radius: 48px" href="#">Pill that grows from the center and lights up</a>
</div></section>

<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); window.ScrollTrigger?.refresh(); }, 2500);
</script>
</body>
</html>
