<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sticky-nudge-stack — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo-spacer { height: 70vh; display: grid; place-items: center; color: var(--kf-dim); }
  .demo-stack { display: flex; flex-direction: column; align-items: center; padding: 10vh 20px 0; background: var(--kf-raised); }
  .demo-stack [data-fx-part="card"] { width: 100%; height: 75vh; display: flex; justify-content: center; align-items: center; }
  .demo-stack .wf-img { width: min(560px, 80vw); aspect-ratio: 4 / 3; border-radius: var(--kf-radius-md); }
  .demo-stack [data-fx-part="end"] { width: 100%; height: 120vh; }
</style>
</head>
<body>
<p class="demo-hint"><b>sticky-nudge-stack</b> — Scroll down and photo cards stick at the top and stack, while the next card rises, the previous card steps back 20px. <span style="color:var(--kf-dim)">(After 1s one more card comes in, and after 2.5s one panel leaves)</span></p>
<div class="demo-spacer">Scroll down</div>
<ul class="demo-stack" data-demo-remove data-fx="sticky-nudge-stack" data-fx-sticky-nudge-stack="lift: 40">
  <li data-fx-part="card"><div class="wf-img" data-label="Photo 1"></div></li>
  <li data-fx-part="card"><div class="wf-img" data-label="Photo 2"></div></li>
</ul>
<ul class="demo-stack" data-fx="sticky-nudge-stack">
  <li data-fx-part="card"><div class="wf-img" data-label="Photo 1"></div></li>
  <li data-fx-part="card"><div class="wf-img" data-label="Photo 2"></div></li>
  <li data-fx-part="card"><div class="wf-img" data-label="Photo 3"></div></li>
  <li data-fx-part="end"></li>
</ul>
<template data-demo-late><ul class="demo-stack" data-fx="sticky-nudge-stack" data-fx-sticky-nudge-stack="dur: 0">
  <li data-fx-part="card"><div class="wf-img" data-label="Late panel · pushed immediately"></div></li>
  <li data-fx-part="card"><div class="wf-img" data-label="Photo 2"></div></li>
  <li data-fx-part="end"></li>
</ul></template>
<div class="demo-spacer">Footer</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); window.ScrollTrigger?.refresh(); }, 2500);
</script>
</body>
</html>
