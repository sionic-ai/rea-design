<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>offset-lift — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { padding: 48px 20px; }
  .demo-spacer { height: 90vh; display: grid; place-items: center; color: var(--kf-dim); }

  .row { display: flex; gap: 24px; align-items: center; }
  [data-fx-part="face"] { min-height: 44px; padding: 0 18px; border: 1px solid var(--kf-line); background: var(--kf-accent); color: var(--kf-on-accent); font: 600 14px/1 var(--kf-font-sans); }
  [data-fx-offset-lift*="quiet"] [data-fx-part="face"] { background: var(--kf-bg); color: var(--kf-ink); }
</style>
</head>
<body>
<p class="demo-hint"><b>offset-lift</b> — Hover over and press the three buttons — lift · light · quiet. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<section class="demo"><div class="row">
<a data-demo-remove data-fx="offset-lift" href="#"><span data-fx-part="face">Your button here <i data-fx-part="arrow">↓</i></span></a><a data-fx="offset-lift" href="#"><span data-fx-part="face">Your button here <i data-fx-part="arrow">↓</i></span></a><template data-demo-late><a data-fx="offset-lift" href="#"><span data-fx-part="face">Your button here <i data-fx-part="arrow">↓</i></span></a></template>
<a data-fx="offset-lift" href="#" data-fx-offset-lift="look: glow"><span data-fx-part="face">Light Bloom</span></a>
<a data-fx="offset-lift" href="#" data-fx-offset-lift="look: quiet"><span data-fx-part="face">Quiet Button</span></a></div></section>

<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); window.ScrollTrigger?.refresh(); }, 2500);
</script>
</body>
</html>
