<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>view-disc-cursor — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .zone { display: grid; place-items: center; height: 60vh; margin: 40px; background: var(--kf-contrast-bg); color: var(--kf-contrast-ink); font-size: 22px; }
</style>
</head>
<body>
<p class="demo-hint"><b>view-disc-cursor</b> — Move the mouse over the dark panel. The VIEW circle follows with a stuttering lag. <span style="color:var(--kf-dim)">(After 1s one more panel comes in, and one leaves 2.5s later)</span></p>
<main id="box">
  <a class="zone" href="#" data-fx="view-disc-cursor">Video window slot</a>
  <a class="zone" href="#" data-fx="view-disc-cursor" data-fx-view-disc-cursor="text: OPEN; follow: .15">Fast-following panel</a>
  <a class="zone" href="#" data-fx="view-disc-cursor" data-demo-remove>Panel to be removed soon</a>
</main>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => { const s = document.createElement("a"); s.className = "zone"; s.href = "#"; s.dataset.fx = "view-disc-cursor"; s.textContent = "Late panel"; document.getElementById("box").append(s); }, 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
