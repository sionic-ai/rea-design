<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>click-spark — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { min-height: 70vh; padding: 60px 40px; display: flex; flex-wrap: wrap; gap: 32px; align-items: center; }
  .demo button, .demo a { padding: 14px 22px; border: 1px solid var(--kf-line); border-radius: var(--kf-radius-pill); background: var(--kf-surface); color: inherit; font: inherit; text-decoration: none; }
</style>
</head>
<body>
<p class="demo-hint"><b>click-spark</b> — Press a button or link. Three short lines pop out from where you pressed. <span style="color:var(--kf-dim)">(After 1s one more button comes in, and after 2.5s one drops out)</span></p>
<main class="demo" data-fx="click-spark">
  <button type="button">Your button here</button>
  <a href="#" onclick="return false">Your link here</a>
  <button type="button" data-demo-remove>Soon-Removed Button</button>
  <button type="button" disabled>Disabled button (no bounce)</button>
  <template data-demo-late><button type="button">Late-arriving button</button></template>
</main>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
