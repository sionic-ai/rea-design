<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>slider-arrow-cursor — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-accent); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .stage { position: relative; width: 60%; height: 60vh; margin: 60px auto; border-radius: 20px; overflow: hidden; }
  .stage .wf-img { height: 100%; }
  .stage button { position: absolute; top: 0; bottom: 0; width: 50%; border: 0; background: none; }
  .stage [data-fx-part="prev"] { left: 0; } .stage [data-fx-part="next"] { right: 0; }
  .count { text-align: center; color: var(--kf-on-accent); font: 700 24px var(--kf-font-mono); }
</style>
</head>
<body>
<p class="demo-hint"><b>slider-arrow-cursor</b> — Hover over the photo panel. A white circle arrow becomes the cursor, turning to ← on the left half of the screen and → on the right half.</p>
<div class="stage" data-fx="slider-arrow-cursor"><span class="wf-img" data-label="Swipe photo panel"></span><button type="button" data-fx-part="prev" aria-label="Previous"></button><button type="button" data-fx-part="next" aria-label="Next"></button></div>
<p class="count">0</p>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
  let n = 0;
  const show = () => (document.querySelector(".count").textContent = n);
  document.addEventListener("click", (e) => { const b = e.target.closest("[data-fx-part]"); if (!b) return; n += b.dataset.fxPart === "next" ? 1 : -1; show(); });
  setTimeout(() => { const src = document.querySelector(".stage"); if (!src) return; const s = src.cloneNode(true); s.querySelector(".wf-img").dataset.label = "Layer added after 1s · direction split in half"; s.setAttribute("data-fx-slider-arrow-cursor", "side: area; size: 90"); document.body.append(s); }, 1000);
</script>
</body>
</html>
