<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>corner-link-lines — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-kv { height: 90vh; position: relative; }
  .demo-label { position: absolute; top: 40vh; left: 90px; padding: 4px 9px 4px 15px; background: var(--kf-ink); color: var(--kf-on-accent); font: 400 12px/1 var(--kf-font-sans); letter-spacing: .06em; }
  .demo-label.is-b { left: auto; right: 120px; top: 60vh; }
  .demo-photo { height: 100vh; margin: 0 30px; background: var(--kf-raised); display: grid; place-items: center; font: 600 28px/1 var(--kf-font-sans); }
  .demo-photo.is-b { height: 60vh; margin: 20vh 200px 40vh; }
</style>
</head>
<body>
<p class="demo-hint"><b>corner-link-lines</b> Scroll. Two lines joining the two corners under the label and the two corners above the photo tilt along. <span style="color:var(--kf-dim)">(After 1s one more label comes in, and after 2.5s one drops out)</span></p>
<section class="demo-kv">
  <div class="demo-label" data-fx="corner-link-lines" data-fx-corner-link-lines="to: .demo-photo">Explore the Garden</div>
  <div class="demo-label is-b" data-fx="corner-link-lines" data-fx-corner-link-lines="to: .demo-photo.is-b; min: 0" data-demo-remove>Second</div>
  <template data-demo-late><div class="demo-label is-b" style="top: 20vh" data-fx="corner-link-lines" data-fx-corner-link-lines="to: .demo-photo.is-b; min: 0">Late label</div></template>
</section>
<div class="demo-photo">First photo</div>
<div class="demo-photo is-b">Second Photo</div>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
