<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>column-span-photo-hover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { padding: 48px 0; }
  .row { height: 420px; }
  .row [data-fx-part="col"] { display: grid; place-items: center; height: 100%; }
  .row [data-fx-part="col"] .wf-img { position: absolute; inset: 0; height: 100%; filter: grayscale(1); }
  .row [data-fx-part="photo"] .wf-img { height: 100%; }
  .row [data-fx-part="info"] { padding: 6px 12px; background: var(--kf-contrast-bg); color: var(--kf-contrast-ink); font-weight: 700; }
</style>
</head>
<body>
<p class="demo-hint"><b>column-span-photo-hover</b> Hover over a cell. That cell’s large photo spreads across the whole row and the names of the other cells disappear. <span style="color:var(--kf-dim)">(After 1s one more line comes in, and one leaves 2.5s later)</span></p>
<section class="demo">
  <div class="row" data-fx="column-span-photo-hover">
    <div data-fx-part="photo"><div class="wf-img" data-label="Large photo 1 · Full width"></div></div>
    <div data-fx-part="photo"><div class="wf-img" data-label="Large photo 2 · Full width"></div></div>
    <div data-fx-part="photo"><div class="wf-img" data-label="Large photo 3 · Full width"></div></div>
    <div data-fx-part="photo"><div class="wf-img" data-label="Large photo 4 · Full width"></div></div>
    <a data-fx-part="col" href="#"><div class="wf-img" data-label="Cell Photo 1"></div><span data-fx-part="info">Cell Name 1</span></a>
    <a data-fx-part="col" href="#"><div class="wf-img" data-label="Cell Photo 2"></div><span data-fx-part="info">Cell Name 2</span></a>
    <a data-fx-part="col" href="#"><div class="wf-img" data-label="Cell Photo 3"></div><span data-fx-part="info">Cell Name 3</span></a>
    <a data-fx-part="col" href="#"><div class="wf-img" data-label="Cell Photo 4"></div><span data-fx-part="info">Cell Name 4</span></a>
  </div>
</section>
<section class="demo" data-demo-remove>
  <div class="row" data-fx="column-span-photo-hover"><a data-fx-part="col" href="#"><span data-fx-part="info">Line to be removed soon</span></a></div>
</section>
<template data-demo-late>
  <section class="demo"><div class="row" data-fx="column-span-photo-hover" data-fx-column-span-photo-hover="min: 0">
    <div data-fx-part="photo"><div class="wf-img" data-label="Late-arriving large photo A"></div></div>
    <div data-fx-part="photo"><div class="wf-img" data-label="Late-arriving large photo B"></div></div>
    <a data-fx-part="col" href="#"><div class="wf-img" data-label="Cell A"></div><span data-fx-part="info">Late-arriving cell A</span></a>
    <a data-fx-part="col" href="#"><div class="wf-img" data-label="Cell B"></div><span data-fx-part="info">Late-arriving cell B</span></a>
  </div></section>
</template>
<section class="demo"><div class="row" data-fx="column-span-photo-hover"></div></section>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); }, 2500);
</script>
</body>
</html>
