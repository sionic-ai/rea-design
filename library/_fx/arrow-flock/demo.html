<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>arrow-flock — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { position: relative; min-height: 100vh; padding: 48px 20px; display: grid; align-content: end; }
  .demo h2 { font: 400 40px/1 var(--kf-font-display); }
  .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .cards div { aspect-ratio: 1; border: 1px solid var(--kf-line); }
</style>
</head>
<body>
<p class="demo-hint"><b>arrow-flock</b> — Scroll slowly. The arrow swarm moves section by section from text → sphere → card image, and birds near the cursor move aside.</p>
<section class="demo" data-fx="arrow-flock" data-fx-arrow-flock="form: word; text: FLOCK; lead: 1">
  <span data-fx-part="word">FLOCK</span>
  <h2>A crowd of large letters</h2>
</section>
<section class="demo" data-fx="arrow-flock" data-fx-arrow-flock="form: sphere; glow: on; spin: .5; tilt: .35; ax: .7; fit: .15; max: .3">
  <h2>Glowing, spinning sphere</h2>
</section>
<section class="demo" data-fx="arrow-flock" data-fx-arrow-flock="form: cards">
  <div class="cards">
    <div data-fx-part="card" data-shape="bag"></div>
    <div data-fx-part="card" data-shape="lock"></div>
    <div data-fx-part="card" data-shape="windows"></div>
  </div>
  <h2>A different picture on each card</h2>
</section>
<section class="demo" data-fx="arrow-flock" data-fx-arrow-flock="form: check" id="gone">
  <h2>Check — this section drops out after 2.5 seconds</h2>
</section>
<script>
(() => {
  const late = document.createElement("section");
  late.className = "demo";
  late.innerHTML = "<h2>Late-arriving Section — Cover</h2>";
  setTimeout(() => {
    late.setAttribute("data-fx", "arrow-flock");
    late.setAttribute("data-fx-arrow-flock", "form: logo");
    document.body.append(late);
  }, 1000);
  setTimeout(() => document.getElementById("gone").remove(), 2500);
})();
</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
