<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ring-tunnel-dive — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 10; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .pad { height: 40vh; display: grid; place-items: center; color: var(--kf-dim); }
  .world { display: grid; place-items: center; }
  .head { position: relative; width: 260px; height: 240px; border: 3px solid var(--kf-ink); border-radius: 30px 30px 90px 90px; background: var(--kf-surface); }
  .hole { position: absolute; left: 20px; right: 20px; top: 26px; height: 26px; border-radius: 50%; background: var(--kf-ink); }
  .next { display: grid; place-items: center; font: var(--kf-weight-display) clamp(48px, 10vw, 140px)/1 var(--kf-font-display); text-transform: uppercase; }
</style>
</head>
<body>
<p class="demo-hint"><b>ring-tunnel-dive</b> — Scroll down to dive into the hole overhead, pass through a ring tunnel, and the next scene lights up. Scroll back up to climb out. <span style="color:var(--kf-dim)">(One more stage comes in after 1s, and one drops out after 2.5s)</span></p>
<div class="pad">Downward</div>
<section data-fx="ring-tunnel-dive" data-fx-ring-tunnel-dive="to: --kf-accent-soft">
  <div data-fx-part="stage">
    <div class="world" data-fx-part="world"><div class="head"><span class="hole" data-fx-part="target"></span></div></div>
    <div class="next" data-fx-part="next">Next Scene</div>
  </div>
</section>
<section data-demo-remove data-fx="ring-tunnel-dive" style="--fx-len: 200vh">
  <div data-fx-part="stage"><div class="world" data-fx-part="world"><div class="head"></div></div></div>
</section>
<template data-demo-late><section data-fx="ring-tunnel-dive" data-fx-ring-tunnel-dive="rings: 7; zoom: 12" style="--fx-len: 220vh"><div data-fx-part="stage"><div class="world" data-fx-part="world"><div class="head"><span class="hole" data-fx-part="target"></span></div></div><div class="next" data-fx-part="next">Late</div></div></section></template>
<div class="pad">Footer</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
