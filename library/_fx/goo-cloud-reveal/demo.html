<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>goo-cloud-reveal — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { display: flex; flex-wrap: wrap; gap: 40px; padding: 60px 40px 90vh; }
  .panel { width: 360px; height: 260px; overflow: hidden; border-radius: var(--kf-radius-md); background: var(--kf-contrast-bg); color: var(--kf-contrast-ink); }
  .panel p { position: relative; z-index: 1; margin: 0; padding: 24px; font: 600 22px/1.3 var(--kf-font-display); opacity: 0; transition: opacity .3s ease .5s; }
  .panel.is-open p { opacity: 1; }
  .label { width: 200px; padding: 18px 20px; overflow: hidden; border-radius: var(--kf-radius-sm); }
  .label b { position: relative; z-index: 1; }
  button { font: inherit; padding: 8px 14px; }
</style>
</head>
<body>
<p class="demo-hint"><b>goo-cloud-reveal</b> — Press the button to open and close the panel. Going down, the label background blooms like a cloud. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<section class="demo">
  <div><button type="button" data-demo-toggle>Open / Close</button>
    <div class="panel" data-fx="goo-cloud-reveal" data-fx-goo-cloud-reveal="look: large" style="--fx-cloud: var(--kf-bg); --fx-close-dur: 1s; --fx-close-ease: cubic-bezier(.1,.8,.6,.8); --fx-close-lag: 0"><p>Menu 1<br>Menu 2<br>Menu 3</p></div></div>
  <div class="label" data-demo-remove data-fx="goo-cloud-reveal" data-fx-goo-cloud-reveal="on: view" style="--fx-cloud: var(--kf-accent-soft)"><b>Your name tag here</b></div>
  <div class="label" data-fx="goo-cloud-reveal" data-fx-goo-cloud-reveal="on: view; look: reverse" style="--fx-cloud: var(--kf-contrast-bg)"><b>Collected Type</b></div>
  <template data-demo-late><div class="label" data-fx="goo-cloud-reveal" data-fx-goo-cloud-reveal="on: view" style="--fx-cloud: var(--kf-surface)"><b>Late-arriving name tag</b></div></template>
</section>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
document.querySelector("[data-demo-toggle]").addEventListener("click", () => document.querySelector(".panel").classList.toggle("is-open"));
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
