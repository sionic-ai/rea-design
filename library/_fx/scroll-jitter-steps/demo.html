<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>scroll-jitter-steps — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { margin: 0; background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 2; margin: 0; padding: 12px 20px; border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); background: var(--kf-surface); }
  .wrap { display: flex; gap: 40px; justify-content: center; padding: 60px 20px 200vh; }
  .wrap span { display: block; width: 90px; height: 90px; border-radius: 50%; background: var(--kf-accent); }
  .wrap span:nth-child(2) { border-radius: 8px; background: var(--kf-ink); }
</style>
</head>
<body>
<p class="demo-hint"><b>scroll-jitter-steps</b> — Shapes jitter only while scrolling and settle when it stops.</p>
<div class="wrap"><span data-fx="scroll-jitter-steps"></span><span data-fx="scroll-jitter-steps" data-fx-scroll-jitter-steps="deg: -3"></span><span data-fx="scroll-jitter-steps" data-fx-scroll-jitter-steps="deg: 5"></span></div>
<script>
// Late arrivals and removals — add a shape after 1s and remove it after 2.5s
(() => {
  setTimeout(() => { const s = document.createElement("span"); s.dataset.fx = "scroll-jitter-steps"; document.querySelector(".wrap").append(s); setTimeout(() => s.remove(), 1500); }, 1000);
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
