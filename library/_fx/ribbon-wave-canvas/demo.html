<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ribbon-wave-canvas — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-box { margin: 24px 20px; height: 420px; border: 1px solid var(--kf-line); }
  .demo-box p { position: relative; z-index: 1; padding: 20px; }
</style>
</head>
<body>
<p class="demo-hint"><b>ribbon-wave-canvas</b> When the panel appears, a line is drawn over 1.5s, then a ribbon slowly twists and a light trail flows along it.</p>
<div class="demo-box" data-fx="ribbon-wave-canvas" data-fx-ribbon-wave-canvas="rotate: -28; pspeed: .84"><p>Tilted ribbon (-28°)</p></div>
<div class="demo-box" data-fx="ribbon-wave-canvas" data-fx-ribbon-wave-canvas="particles: off; intro: 0" style="height:300px"><p>No tail · visible right away</p></div>
<script>
(() => {
  const src = document.querySelector('[data-fx~="ribbon-wave-canvas"]');
  const make = (tag) => { const el = src.cloneNode(true); el.querySelector("canvas")?.remove(); el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => src.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
