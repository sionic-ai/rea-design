<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>crt-glass — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { display: grid; gap: 20px; max-width: 760px; padding: 48px 20px; }
  .demo h2 { font: var(--kf-weight-display) 56px/1.05 var(--kf-font-display); }
  .box { height: 260px; display: grid; place-items: center; border: 1px solid var(--kf-line); }
  .demo-btn { justify-self: start; height: 40px; padding: 0 16px; border: 1px solid var(--kf-line); background: var(--kf-surface); color: var(--kf-ink); cursor: pointer; }
</style>
</head>
<body>
<p class="demo-hint"><b>crt-glass</b> — Scanlines, light bands and rounded corners cover the whole screen. Press a button — it still presses through the glass.</p>
<main class="demo" data-fx="crt-glass">
  <h2>Your title here</h2>
  <p>Your body goes here in two lines. A band of light passes from bottom to top every 9 seconds.</p>
  <button class="demo-btn" type="button" onclick="this.textContent = 'It was pressed'">Try Pressing</button>
</main>
<section class="demo"><div class="box" data-fx="crt-glass" data-fx-crt-glass="screen: off; radius: .06">Glass applied only inside this box (screen: off)</div></section>
<script>
(() => {
  const src = document.querySelector(".box");
  const make = () => { const el = src.cloneNode(true); el.textContent = "Late-arriving box"; return el; };
  const gone = make();
  gone.textContent = "Soon-Removed Box";
  src.after(gone);
  setTimeout(() => src.after(make()), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1 second one more box comes in (a late arrival), and after 2.5 seconds one is removed (detach).");
})();
</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
