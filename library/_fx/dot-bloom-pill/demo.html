<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dot-bloom-pill — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { margin: 0; padding: 12px 20px; border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-row { display: flex; flex-wrap: wrap; gap: 32px; justify-content: center; padding: 60px 20px; }
  .demo-pill { display: inline-flex; align-items: center; padding: 20px 47px 20px 30px; border-radius: 100px; background: var(--kf-surface); color: var(--kf-ink); font-weight: 700; text-decoration: none; }
  .demo-pill:hover { padding: 20px 38px; }
  .demo-pill [data-fx-part="dot"] { right: 26px; top: calc(50% - 3px); }
  .demo-pill svg { position: absolute; right: 20px; top: 50%; width: 14px; height: 14px; translate: 0 -50%; }
  .demo-pill svg circle { fill: var(--kf-accent); }
  .demo-pill svg path { fill: none; stroke: var(--kf-on-accent); stroke-width: 1.6; }
</style>
</head>
<body>
<p class="demo-hint"><b>dot-bloom-pill</b> — Hover over the button. The dot on the right spreads and fills the button. <span style="color:var(--kf-dim)">(After 1s one more button comes in, and after 2.5s one drops out)</span></p>
<div class="demo-row">
  <a href="#" class="demo-pill" data-fx="dot-bloom-pill">View details<i data-fx-part="dot"></i><svg data-fx-part="icon" viewBox="0 0 14 14"><circle cx="7" cy="7" r="7"/><path d="M5.6 4.2 8.4 7l-2.8 2.8"/></svg></a>
  <a href="#" class="demo-pill" data-fx="dot-bloom-pill" style="--fx-scale: 120">Enter a slightly longer button label<i data-fx-part="dot"></i><svg data-fx-part="icon" viewBox="0 0 14 14"><circle cx="7" cy="7" r="7"/><path d="M5.6 4.2 8.4 7l-2.8 2.8"/></svg></a>
  <a href="#" class="demo-pill" data-demo-remove data-fx="dot-bloom-pill">Omitted button<i data-fx-part="dot"></i></a>
</div>
<script src="../fx-core.js"></script>
<script>
setTimeout(() => document.querySelector(".demo-row").insertAdjacentHTML("beforeend", '<a href="#" class="demo-pill" data-fx="dot-bloom-pill" style="--fx-dur: .3s">Late-arriving quick button<i data-fx-part="dot"></i></a>'), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
