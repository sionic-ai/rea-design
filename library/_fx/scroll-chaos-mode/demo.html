<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>scroll-chaos-mode — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); transition: background-color .2s; }
  body.is-chaos { background: var(--kf-accent); color: var(--kf-on-accent); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); color: var(--kf-ink); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .meter { position: fixed; left: 20px; bottom: 20px; z-index: 100; padding: 8px 12px; background: var(--kf-surface); color: var(--kf-ink); font: 600 14px/1 var(--kf-font-mono); }
  .meter i { display: block; height: 6px; margin-top: 6px; background: var(--kf-accent); transform-origin: 0 50%; transform: scaleX(var(--fx-chaos, 0)); }
  .demo p { height: 60vh; display: grid; place-items: center; font: 700 40px/1 var(--kf-font-display); }
</style>
</head>
<body>
<p class="demo-hint"><b>scroll-chaos-mode</b> — Scroll up and down several times (this demo uses 200→800px). When intensity exceeds .9 the background flips, and at 1 the X button circles the edge — press it and it settles within 1s.</p>
<div class="meter">--fx-chaos<i></i></div>
<section class="demo"><p>Scroll 1</p><p>Scroll 2</p><p>Scroll 3</p><p>Scroll 4</p><p>Scroll 5</p></section>
<button type="button" aria-label="Turn Off Chaos" data-fx="scroll-chaos-mode" data-fx-scroll-chaos-mode="from: 200; to: 800">
  <svg viewBox="0 0 64 64" aria-hidden="true"><rect x="-6" y="23" width="76" height="18" rx="5" transform="rotate(45 32 32)"/><rect x="-6" y="23" width="76" height="18" rx="5" transform="rotate(-45 32 32)"/></svg>
</button>
<template data-demo-late><span data-fx="scroll-chaos-mode" data-demo-remove></span></template>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
