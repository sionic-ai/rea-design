<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bead-glass-gl — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .glass { height: 70vh; display: grid; place-items: center; color: var(--kf-contrast-ink); font: 700 40px/1 var(--kf-font-display); --fx-top: var(--kf-accent-soft); --fx-bottom: var(--kf-contrast-bg); }
</style>
</head>
<body>
<p class="demo-hint"><b>bead-glass-gl</b> — Watch quietly. Droplets on the glass refract the colors behind, and raindrops run down each band. <span style="color:var(--kf-dim)">(After 1s one more panel comes in, and one leaves 2.5s later)</span></p>
<section class="glass" data-fx="bead-glass-gl">Beyond the wet glass</section>
<section class="glass" data-demo-remove data-fx="bead-glass-gl" data-fx-bead-glass-gl="big-amount: .4">Panel to be removed soon</section>
<template data-demo-late><section class="glass" data-fx="bead-glass-gl" data-fx-bead-glass-gl="speed-max: .5">Late-arriving panel</section></template>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
