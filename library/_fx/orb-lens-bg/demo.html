<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>orb-lens-bg — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 10; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { display: grid; gap: 40px; padding: 40px; }
  .demo [data-fx] { height: 70vh; border-radius: var(--kf-radius-md); }
  .demo button { justify-self: start; padding: 8px 14px; border: 1px solid var(--kf-line); border-radius: var(--kf-radius-sm); background: var(--kf-surface); color: var(--kf-ink); font: inherit; cursor: pointer; }
</style>
</head>
<body>
<p class="demo-hint"><b>orb-lens-bg</b> — Move the mouse over the panel. Swap the disc positions with the button and they slide over. <span style="color:var(--kf-dim)">(After 1s one more panel comes in, and one leaves 2.5s later)</span></p>
<section class="demo">
  <button type="button" data-demo-swap>Swap disc positions</button>
  <div data-fx="orb-lens-bg" data-fx-orb-lens-bg="scroll: 0" data-orbs='{"pc":[{"x":0.02,"y":0.083,"size":0.8},{"x":0.02,"y":0.083,"size":0,"opacity":0},{"x":0.22,"y":1.45,"size":0.94,"gradient":"right","lensWeight":0.25},{"x":0,"y":0,"size":0,"opacity":0}],"sp":[{"x":-0.68,"y":0.23,"size":1.57},{"size":0},{"x":0.34,"y":6,"size":2.1,"gradient":"right"},{"size":0}]}'></div>
  <div data-demo-remove data-fx="orb-lens-bg" data-fx-orb-lens-bg="scroll: 0; grain: 0" data-orbs='[{"x":0.1,"y":0.05,"size":0.3},{"x":0.6,"y":-0.1,"size":0.4,"opacity":0.3,"gradient":"right"}]' style="height:30vh"></div>
  <template data-demo-late><div data-fx="orb-lens-bg" data-fx-orb-lens-bg="scroll: 0; turn: 3" data-orbs='[{"x":0.3,"y":0,"size":0.4}]' style="height:30vh"></div></template>
</section>
<script src="../pillar-gallery-gl/three-global.js"></script>
<script src="../../_vendor/three@0.181.0/build/three.cjs"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
const spots = [
  { pc: [{ x: -0.18, y: 0.17, size: 0.55 }, { x: 0.58, y: -0.13, size: 0.27, opacity: 0.3, gradient: "right" }, { x: 0, y: 0, size: 0 }, { x: 0.2, y: 0.59, size: 0.94 }] },
  { pc: [{ x: 0.02, y: 0.083, size: 0.8 }, { x: 0.02, y: 0.083, size: 0, opacity: 0 }, { x: 0.22, y: 1.45, size: 0.94, gradient: "right", lensWeight: 0.25 }, { x: 0, y: 0, size: 0, opacity: 0 }] },
];
let n = 0;
document.querySelector("[data-demo-swap]").addEventListener("click", () => {
  const el = document.querySelector('[data-fx="orb-lens-bg"]');
  el.dispatchEvent(new CustomEvent("fx:orbs", { detail: spots[n++ % spots.length] }));
});
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
