<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>flash-window-opening — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .stage { height: 70vh; margin: 20px; }
  .small { width: 360px; height: 240px; margin: 20px; --fx-h: calc(100% - 60px); }
  .stage .wf-img, .small .wf-img { height: 100%; }
  .cover { height: 100%; background: var(--kf-accent); }
</style>
</head>
<body>
<p class="demo-hint"><b>flash-window-opening</b> — In the center window the photo flickers faster and faster, and a red panel expands from the window size to the full screen (refresh to replay)</p>
<div class="stage" data-fx="flash-window-opening">
  <div data-fx-part="flash"><div class="wf-img" data-label="Photo 1"></div></div>
  <div data-fx-part="flash"><div class="wf-img" data-label="Photo 2"></div></div>
  <div data-fx-part="flash"><div class="wf-img" data-label="Photo 3"></div></div>
  <div data-fx-part="flash"><div class="wf-img" data-label="Photo 4"></div></div>
  <div data-fx-part="reveal"><div class="cover"></div></div>
</div>
<div class="small" data-demo-remove data-fx="flash-window-opening" data-fx-flash-window-opening="hold: 1; h: calc(100% - 60px)">
  <div data-fx-part="flash"><div class="wf-img" data-label="Dropping panel"></div></div>
  <div data-fx-part="reveal"><div class="cover"></div></div>
</div>
<template data-demo-late><div class="small" data-fx="flash-window-opening" data-fx-flash-window-opening="times: 0, .3; hold: 1; h: calc(100% - 60px)">
  <div data-fx-part="flash"><div class="wf-img" data-label="Late 1"></div></div>
  <div data-fx-part="flash"><div class="wf-img" data-label="Late 2"></div></div>
  <div data-fx-part="reveal"><div class="cover"></div></div>
</div></template>
<div class="small" data-fx="flash-window-opening"></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
