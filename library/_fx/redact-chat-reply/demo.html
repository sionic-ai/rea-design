<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>redact-chat-reply — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 16px/1.6 var(--kf-font-sans); }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .box { max-width: 640px; margin: 200px auto; padding: 0 20px; color: var(--kf-ink-soft); }
</style>
</head>
<body>
<p class="demo-hint"><b>redact-chat-reply</b> — The masked letters change every half second. Click it and a speech bubble shows the answer.</p>
<p class="box">By your side <button type="button" data-fx="redact-chat-reply"><span data-fx-part="chat"><span data-fx-part="bubble">Your short answer line here</span><span data-fx-part="bubble">Your second answer, a little longer, here</span></span><span data-fx-part="glyphs">▓░▓▒░░▓░</span></button> We are building it.</p>
<p class="box"><template data-demo-late><button type="button" data-fx="redact-chat-reply" data-fx-redact-chat-reply="set: ■□; length: 5; steps: .6,1"><span data-fx-part="chat"><span data-fx-part="bubble">Late-arriving answer</span></span><span data-fx-part="glyphs">■□■□■</span></button></template> Late-arriving mask text</p>
<p class="box"><span data-demo-remove data-fx="redact-chat-reply"><span data-fx-part="glyphs">░░░</span></span> Fading mask text</p>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
