<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hover-elevator-roll — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { display: flex; gap: 60px; padding: 60px 40px; }
  .more { position: relative; display: inline-flex; align-items: center; gap: 16px; padding-bottom: 10px; color: inherit; text-decoration: none; font: 400 14px var(--kf-font-display); }
  .more [data-fx-part="line"] { position: absolute; left: 0; right: 0; bottom: 0; height: 1px; background: currentColor; }
  .more svg { width: 14px; height: 10px; }
</style>
</head>
<body>
<p class="demo-hint"><b>hover-elevator-roll</b> — Hover over the button. The text, arrow and underline drop out once and then return. <span style="color:var(--kf-dim)">(After 1s one more button comes in, and after 2.5s one drops out)</span></p>
<div class="demo">
  <a class="more" data-fx="hover-elevator-roll" href="#"><span data-fx-part="text">view more</span><span data-fx-part="arrow"><svg viewBox="0 0 14 10"><path d="M0 5h13M9 1l4 4-4 4" fill="none" stroke="currentColor"/></svg></span><span data-fx-part="line"></span></a>
  <a class="more" data-fx="hover-elevator-roll" href="#"><span data-fx-part="text">Contact</span></a>
  <a class="more" data-fx="hover-elevator-roll" data-demo-remove href="#"><span data-fx-part="text">Being removed soon</span></a>
  <template data-demo-late><a class="more" data-fx="hover-elevator-roll" data-fx-hover-elevator-roll="dur: 1.4" href="#"><span data-fx-part="text">Late button 1.4s</span><span data-fx-part="line"></span></a></template>
  <a class="more" data-fx="hover-elevator-roll" href="#">No children</a>
</div>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
