<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sticky-tilt-deck — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .stage { padding: 120px 20px 50vh; background: var(--kf-accent); }
  .deck { max-width: 520px; margin: 0 auto; --fx-top: 120px; }
  .deck [data-fx-part="card"] { display: block; padding: 28px; background: var(--kf-surface); border: 8px solid var(--kf-surface); border-radius: var(--kf-radius-lg); }
  .deck [data-fx-part="photo"] { border-radius: var(--kf-radius-md); }
  .deck .wf-img { aspect-ratio: 16 / 9; border: 0; }
  .deck h3 { margin-top: 16px; font-size: 22px; }
</style>
</head>
<body>
<p class="demo-hint"><b>sticky-tilt-deck</b> — Scroll down. Tilted cards stack on top of each other one after another. Hover over a card and the border and photo change. <span style="color:var(--kf-dim)">(One more card comes in after 1s, and one drops out after 2.5s)</span></p>
<div class="stage">
  <div class="deck" data-fx="sticky-tilt-deck">
    <a data-fx-part="card" href="#"><div data-fx-part="photo"><div class="wf-img" data-label="Photo 1"></div></div><h3>Card 1</h3></a>
    <a data-fx-part="card" href="#" data-demo-remove><div data-fx-part="photo"><div class="wf-img" data-label="Photo 2"></div></div><h3>Card 2 · to be removed</h3></a>
    <a data-fx-part="card" href="#"><div data-fx-part="photo"><div class="wf-img" data-label="Photo 3"></div></div><h3>Card 3</h3></a>
    <template data-demo-late><a data-fx-part="card" href="#"><div data-fx-part="photo"><div class="wf-img" data-label="Late-arrived Photo"></div></div><h3>Late-arrived card</h3></a></template>
  </div>
</div>
<script src="../fx-core.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
