<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>flyby-scatter — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 10; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .sp { height: 70vh; display: grid; place-items: center; color: var(--kf-dim); }
  h2 { margin: 0 auto; padding: 0 20px; max-width: 900px; font: 400 56px/1.1 var(--kf-font-display); word-break: keep-all; }
  .plane path { fill: currentColor; }
  .plane path + path { fill: color-mix(in oklab, currentColor 70%, var(--kf-ink)); }
</style>
</head>
<body>
<p class="demo-hint"><b>flyby-scatter</b> — Scroll down and a paper plane flies across the title, and letters in its path scatter and fall. Scroll back up and they return.</p>
<div class="sp">Scroll down</div>
<h2 data-fx="flyby-scatter"><span data-fx-part="text">Your big title in about two lines here</span><svg class="plane" data-fx-part="flyer" width="56" height="36" viewBox="0 0 56 36" aria-hidden="true"><path d="M56 14 0 0l14 18z"/><path d="M56 14 14 18l4 18z"/></svg></h2>
<div class="sp"></div>
<h2 data-fx="flyby-scatter" data-demo-remove><span data-fx-part="text">Title to Be Removed</span></h2>
<template data-demo-late><h2 data-fx="flyby-scatter" data-fx-flyby-scatter="fall: 120; spin: 40"><span data-fx-part="text">Late-arriving heading scatters too</span></h2></template>
<div class="sp"></div>
<h2 data-fx="flyby-scatter"></h2>
<div class="sp"></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); window.ScrollTrigger?.refresh(); }, 2500);
</script>
</body>
</html>
