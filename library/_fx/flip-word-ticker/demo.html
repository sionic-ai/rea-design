<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>flip-word-ticker — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { padding: 8vh 0; display: grid; gap: 40px; }
  .demo [data-fx~="flip-word-ticker"] { border-block: 1px solid var(--kf-line); }
  .demo [data-fx-part="row"] > p { padding: 10px 40px; font-size: 16px; line-height: 1.75; }
</style>
</head>
<body>
<p class="demo-hint"><b>flip-word-ticker</b> — Leave it alone. The band flows and a word flips a full turn every few seconds. <span style="color:var(--kf-dim)">(After 1s one more band comes in, and one leaves 2.5s later)</span></p>
<section class="demo" id="box">
  <div data-fx="flip-word-ticker"><div data-fx-part="row"><p><span data-fx-part="word">Category name 1</span></p></div></div>
  <div data-fx="flip-word-ticker" style="--fx-flip-delay: 4.5s"><div data-fx-part="row"><p><span data-fx-part="word">Category name 2</span></p></div></div>
  <div data-fx="flip-word-ticker" data-fx-flip-word-ticker="dir: right; dur: 10; narrow-dur: 13; look: still"><div data-fx-part="row"><p>One line of intro text flowing to the right →</p></div></div>
  <div data-fx="flip-word-ticker" data-demo-remove><div data-fx-part="row"><p><span data-fx-part="word">Dropped Band</span></p></div></div>
  <div data-fx="flip-word-ticker"><div data-fx-part="row"></div></div>
</section>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => { const d = document.createElement("div"); d.dataset.fx = "flip-word-ticker"; d.style.setProperty("--fx-flip-delay", "6s"); d.innerHTML = '<div data-fx-part="row"><p><span data-fx-part="word">Late band</span></p></div>'; document.getElementById("box").append(d); }, 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
