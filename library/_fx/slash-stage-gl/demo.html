<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>slash-stage-gl — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { margin: 0; background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; margin: 0; padding: 12px 20px; background: var(--kf-surface); color: var(--kf-ink); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .scene { position: relative; min-height: 90vh; display: grid; place-items: center; text-align: center; }
  .scene.dark { background: var(--kf-contrast-bg); color: var(--kf-contrast-ink); }
  .scene > [data-fx] { position: absolute; inset: -60px 0; }
  .scene h2 { position: relative; z-index: 1; margin: 0; font: 500 clamp(48px, 10vw, 140px)/0.9 var(--kf-font-display); }
</style>
</head>
<body>
<p class="demo-hint"><b>slash-stage-gl</b> — On scroll the camera orbits a diagonal pillar, and moving the mouse left and right tilts the scene. After 1 second an aurora section attaches, and after 2.5 seconds a point-cloud section detaches.</p>
<section class="scene"><div data-fx="slash-stage-gl" data-fx-slash-stage-gl="look: wire"></div><h2>Here<br>Big Headline.</h2></section>
<section class="scene dark" data-demo-remove><div data-fx="slash-stage-gl" data-fx-slash-stage-gl="look: points"></div><h2>Dot cloud<br>Stage.</h2></section>
<template data-demo-late><section class="scene dark"><div data-fx="slash-stage-gl" data-fx-slash-stage-gl="look: aurora; drop: 600"></div><h2>Aurora<br>Mountain range.</h2></section></template>
<div style="height:60vh"></div>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove] > [data-fx]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
