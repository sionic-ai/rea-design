<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cloud-threshold-reveal — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { display: grid; gap: 40px; padding: 48px 20px; max-width: 820px; }
  .big { font: 500 44px/1 var(--kf-font-display); max-width: 12ch; }
  .tag { display: inline-block; padding: 14px 26px; border: 1px solid var(--kf-line); letter-spacing: .4em; font-size: 11px; }
  .space { height: 120vh; }
</style>
</head>
<body>
<p class="demo-hint"><b>cloud-threshold-reveal</b> — Open it and the title blooms like a cloud. Press ”Toggle” to see the state type <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<section class="demo">
  <h1 class="big" data-fx="cloud-threshold-reveal" data-fx-cloud-threshold-reveal="dur: 2.5; delay: .3">Your three-line big title that blooms like clouds here</h1>
  <div><button type="button" class="tag" data-demo-toggle>Turn on and off</button></div>
  <p class="tag" data-fx="cloud-threshold-reveal" data-fx-cloud-threshold-reveal="on: state; dur: 2" data-demo-target>Selected item label</p>
  <p data-fx="cloud-threshold-reveal" data-demo-remove>Line to be removed soon</p>
  <template data-demo-late><p class="tag" data-fx="cloud-threshold-reveal" data-fx-cloud-threshold-reveal="dur: 1.2">Late row</p></template>
  <div class="space"></div>
  <p class="big" data-fx="cloud-threshold-reveal" data-fx-cloud-threshold-reveal="on: view">Title that blooms as you scroll</p>
</section>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
document.querySelector("[data-demo-toggle]").addEventListener("click", () => document.querySelector("[data-demo-target]").classList.toggle("is-on"));
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
