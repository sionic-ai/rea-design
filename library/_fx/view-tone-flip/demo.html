<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>view-tone-flip — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { --kf-bg: var(--kf-ink); --kf-ink: var(--wf-bg); background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  [data-fx~="view-tone-flip"] { --kf-contrast-bg: var(--wf-bg); --kf-contrast-ink: var(--wf-ink); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); color: var(--wf-ink); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .gap { height: 90vh; display: grid; place-items: center; }
  .flip { padding: 60vh 40px; }
  .flip h2 { font-size: 40px; position: relative; z-index: 2; }
</style>
</head>
<body>
<p class="demo-hint"><b>view-tone-flip</b> — Scroll down — when a section overlaps the screen the background flips to paper color, and goes dark again once it passes. (One section enters after 1 second and one leaves after 2.5 seconds)</p>
<div class="gap">Dark Section</div>
<section class="flip" data-fx="view-tone-flip"><div data-fx-part="sheet"></div><div data-fx-part="band-top"></div><h2>Facility About Section</h2><div data-fx-part="band-bottom"></div></section>
<div class="gap">Dark Section</div>
<section class="flip" data-fx="view-tone-flip" data-demo-remove><div data-fx-part="sheet"></div><h2>Dropping section</h2></section>
<span data-late-slot></span>
<div class="gap">Dark Section</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelector("[data-late-slot]").outerHTML = '<section class="flip" data-fx="view-tone-flip"><div data-fx-part="sheet"></div><h2>Late section</h2></section>', 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
