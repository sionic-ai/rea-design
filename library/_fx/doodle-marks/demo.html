<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>doodle-marks — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { margin: 0; padding: 12px 20px; border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .grid { display: grid; gap: 40px; max-width: 760px; margin: 40px auto; padding: 0 20px; }
  figure { position: relative; margin: 0; }
  figure .wf-img { aspect-ratio: 3 / 2; border-radius: 12px; }
  .marks { position: absolute; inset: 0; }
  button { padding: 6px 14px; border: 1px solid var(--kf-line); border-radius: 999px; background: var(--kf-surface); color: var(--kf-ink); font: inherit; cursor: pointer; }
</style>
</head>
<body>
<p class="demo-hint"><b>doodle-marks</b> — When a photo enters the screen, a hand-drawn line is drawn then erased, repeating every 5 seconds. The second photo does it once per button press.</p>
<div class="grid" id="grid">
  <figure>
    <div class="wf-img" data-label="Photo of people laughing together · landscape 3:2"></div>
    <div class="marks" data-fx="doodle-marks">
      <i data-fx-part="spot" data-kind="halo" style="left:28%;top:30%"></i>
      <i data-fx-part="spot" data-kind="effect" data-dir="-130" style="left:16%;top:18%"></i>
      <i data-fx-part="spot" data-kind="effect" data-dir="-50" style="left:52%;top:22%"></i>
      <i data-fx-part="spot" data-kind="halo" data-key="surface" style="left:66%;top:34%"></i>
      <i data-fx-part="spot" data-kind="wrinkle" style="left:34%;top:52%"></i>
    </div>
  </figure>
  <figure>
    <div class="wf-img" data-label="Photo of two people sitting face to face · landscape 3:2"></div>
    <div class="marks" id="once" data-fx="doodle-marks" data-fx-doodle-marks="loop: false; when: event">
      <i data-fx-part="spot" data-kind="effect" data-dir="-60" style="left:62%;top:24%"></i>
      <i data-fx-part="spot" data-kind="wrinkle" style="left:30%;top:44%"></i>
    </div>
  </figure>
  <p><button type="button" id="play">Redraw second photo</button></p>
</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../../_vendor/lottie-web@5.13.0/lottie_svg.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
  document.getElementById("play").addEventListener("click", () => document.getElementById("once")?.dispatchEvent(new CustomEvent("fx:play")));
  // Check that late-arriving photos get hooked and missing photos get released
  setTimeout(() => {
    const f = document.createElement("figure");
    f.innerHTML = '<div class="wf-img" data-label="Late-arriving photo"></div><div class="marks" data-fx="doodle-marks"><i data-fx-part="spot" data-kind="halo" style="left:50%;top:36%"></i><i data-fx-part="spot" data-kind="effect" data-dir="-40" style="left:66%;top:20%"></i></div>';
    document.getElementById("grid").append(f);
  }, 1000);
  setTimeout(() => document.querySelectorAll("figure")[2]?.remove(), 2500);
</script>
</body>
</html>
