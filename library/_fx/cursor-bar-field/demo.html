<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cursor-bar-field — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.6 var(--kf-font-sans); }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .stage { margin: 40px 5%; padding: 40px; background: var(--kf-contrast-bg); color: var(--kf-contrast-ink); }
  .stage h2 { font: 400 clamp(48px, 8vw, 120px)/0.9 var(--kf-font-display); letter-spacing: -0.05em; margin-bottom: 24px; }
</style>
</head>
<body>
<p class="demo-hint"><b>cursor-bar-field</b> — Move the mouse over the graph. The line around the cursor stretches up to the cursor height. <span style="color:var(--kf-dim)">(After 1s one more graph comes in, and after 2.5s one is removed)</span></p>
<div class="stage"><h2>0.0 Bn</h2><div data-fx="cursor-bar-field"></div></div>
<div class="stage" data-demo-remove><div data-fx="cursor-bar-field" data-fx-cursor-bar-field="lines: 90; peak: .3; span: 20" style="--fx-h: 30vh"></div></div>
<div class="stage" data-demo-late-host></div>
<div data-fx="cursor-bar-field" data-fx-cursor-bar-field="lines: 0" style="--fx-h: 0"></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => { document.querySelector("[data-demo-late-host]").innerHTML = '<p>Late-arriving graph</p><div data-fx="cursor-bar-field" data-fx-cursor-bar-field="lines: 140" style="--fx-h: 24vh"></div>'; }, 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
