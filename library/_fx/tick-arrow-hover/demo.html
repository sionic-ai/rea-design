<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tick-arrow-hover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; padding: 40px 32px; }
  .card { position: relative; display: block; padding: 0 0 28px; border-bottom: 1px solid var(--kf-line); }
  .card .wf-img { aspect-ratio: 4 / 3; margin-bottom: 14px; }
  .card [data-fx-part="arrow"] { position: absolute; right: 0; bottom: 10px; }
</style>
</head>
<body>
<p class="demo-hint"><b>tick-arrow-hover</b> — Hover over a card. An arrow at bottom right slides in and ticks every second.</p>
<div class="cards">
  <a class="card" href="#" data-fx="tick-arrow-hover"><div class="wf-img" data-label="Card photo · landscape 4:3"></div>Your card title here<span data-fx-part="arrow"></span></a>
  <a class="card" href="#" data-fx="tick-arrow-hover"><div class="wf-img" data-label="Card photo · landscape 4:3"></div>Your card title here<span data-fx-part="arrow"></span></a>
  <a class="card" href="#" data-fx="tick-arrow-hover"><div class="wf-img" data-label="Card photo · landscape 4:3"></div>Card without arrow child</a>
</div>
<script>
// Late arrivals and vanishing items — CSS parts, so attaching and detaching works with attributes alone. One more enters after 1s and one leaves after 2.5s
(() => {
  const host = document.querySelector('[data-fx~="tick-arrow-hover"]');
  if (!host) return;
  const html = host.outerHTML;
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  host.after(gone);
  setTimeout(() => host.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical one comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
</body>
</html>
