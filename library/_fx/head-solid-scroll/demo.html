<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>head-solid-scroll — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: relative; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .head { position: fixed; left: 0; right: 0; top: 44px; z-index: 50; display: flex; align-items: center; justify-content: space-between; padding: 0 32px; }
  .head nav { display: flex; gap: 18px; font-size: 14px; }
  .hero { height: 90vh; background: var(--kf-accent); }
  .body { height: 140vh; padding: 60px 32px; }
</style>
</head>
<body>
<p class="demo-hint"><b>head-solid-scroll</b> — Scroll down a little. The transparent header turns into a background-color panel and gets shorter.</p>
<header class="head" data-fx="head-solid-scroll" style="--fx-height: 118px; --fx-height-solid: 90px">
  <span>Your name here</span>
  <nav><a href="#">Menu 1</a><a href="#">Menu 2</a><a href="#">Menu 3</a></nav>
</header>
<div class="hero"></div>
<div class="body"><p>Your two body lines here.</p></div>
<script>
// Late arrivals and removals — checks that fx-core attaches to an element added after 1s and detaches from an element removed after 2.5s
(() => {
  const host = document.querySelector('[data-fx~="head-solid-scroll"]');
  if (!host) return;
  const html = host.outerHTML;
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; el.style.top = "180px"; return el; };
  const gone = make("gone");
  host.after(gone);
  setTimeout(() => host.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical one comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
