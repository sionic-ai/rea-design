<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tilt-settle-in — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.6 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo-spacer { height: 70vh; display: grid; place-items: center; color: var(--kf-dim); }
  .row { position: relative; width: min(90%, 1000px); margin: 0 auto 160px; padding-top: 14px; border-top: 2px solid var(--kf-ink); font: 600 28px/1 var(--kf-font-display); }
  .row::before { content: ""; position: absolute; top: -2px; left: 0; width: 170px; height: 8px; background: var(--kf-ink); }
  .row b { font-size: 48px; padding-left: 8px; }
  .chars { width: min(90%, 1000px); margin: 0 auto 120px; font: 600 22px/1.4 var(--kf-font-display); }
</style>
</head>
<body>
<p class="demo-hint"><b>tilt-settle-in</b> — Scroll down. The headline floats tilted and blurred, then settles upright. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<p class="chars" data-fx="tilt-settle-in" data-fx-tilt-settle-in="split: chars; on: load">Heading line where each character settles late</p>
<div class="demo-spacer">Scroll down</div>
<div class="row"><span data-fx="tilt-settle-in">Brand lineup <b>01</b></span></div>
<div class="row" data-demo-remove><span data-fx="tilt-settle-in">Brand lineup <b>02</b></span></div>
<template data-demo-late><div class="row"><span data-fx="tilt-settle-in" data-fx-tilt-settle-in="dur: 1.2">Late-arriving line <b>03</b></span></div></template>
<span data-fx="tilt-settle-in" data-fx-tilt-settle-in="split: chars"></span>
<div class="demo-spacer">Footer</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
