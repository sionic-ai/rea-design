<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sweep-fit-title — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { margin: 0; background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .title { margin: 40px 24px; font: 800 120px/1 var(--kf-font-display); }
</style>
</head>
<body>
<p class="demo-hint"><b>sweep-fit-title</b> — A title wider than its cell shifts left and right by the overflow (short titles stay still). After 1s one title attaches late, and after 3s a part falls off the first title.</p>
<h1 class="title" id="first" data-fx="sweep-fit-title" data-fx-sweep-fit-title="look: fade"><span data-fx-part="text">A very long field name overflows the cell</span></h1>
<h1 class="title" data-fx="sweep-fit-title"><span data-fx-part="text">Short Title</span></h1>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
  setTimeout(() => {
    const h = document.createElement("h1");
    h.className = "title"; h.innerHTML = '<span data-fx-part="text">Even a long title added late slides left and right</span>';
    h.setAttribute("data-fx", "sweep-fit-title"); h.setAttribute("data-fx-sweep-fit-title", "speed: 3");
    document.body.append(h);
  }, 1000);
  setTimeout(() => document.getElementById("first")?.removeAttribute("data-fx"), 3000);
</script>
</body>
</html>
