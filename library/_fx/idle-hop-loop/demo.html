<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>idle-hop-loop — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .row { display: flex; gap: 60px; justify-content: center; align-items: flex-end; padding: 140px 20px; }
  .who { width: 90px; height: 120px; border: 2px solid var(--kf-ink); border-radius: 45px 45px 12px 12px; background: var(--kf-accent-soft); display: grid; place-items: center; font-size: 12px; }
</style>
</head>
<body>
<p class="demo-hint"><b>idle-hop-loop</b> — The props hop once every 5s (the three are offset by 0·1·2s). <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<div class="row" id="row">
  <div class="who" data-fx="idle-hop-loop">Prop 1</div>
  <div class="who" data-fx="idle-hop-loop" data-fx-idle-hop-loop="delay: 1">Prop 2</div>
  <div class="who" data-demo-remove data-fx="idle-hop-loop" data-fx-idle-hop-loop="delay: 2; height: 40">Prop 3</div>
</div>
<template data-demo-late><div class="who" data-fx="idle-hop-loop" data-fx-idle-hop-loop="every: 2; scale: 1.1">Late-arrived Prop</div></template>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => document.getElementById("row").append(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
