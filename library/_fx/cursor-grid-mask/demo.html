<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cursor-grid-mask — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { position: relative; height: 80vh; padding: 48px 20px; overflow: hidden; background: var(--kf-contrast-bg); color: var(--kf-contrast-ink); }
  .demo h2 { position: relative; z-index: 1; margin: 0; font: 400 56px/1 var(--kf-font-display); }
  .layer { position: absolute; inset: 0; }
  .demo-spacer { height: 40vh; display: grid; place-items: center; color: var(--kf-dim); }
</style>
</head>
<body>
<p class="demo-hint"><b>cursor-grid-mask</b> — Move the mouse over the panel. Line patterns flicker into view only around the cursor.</p>
<section class="demo"><div class="layer" data-fx="cursor-grid-mask"></div><h2>Hidden grid</h2></section>
<div class="demo-spacer">Larger ellipse without flicker ↓</div>
<section class="demo"><div class="layer" data-fx="cursor-grid-mask" data-fx-cursor-grid-mask="size: .8; flicker: off" style="--fx-line: var(--kf-contrast-ink)"></div><h2>Soft lens</h2></section>
<script>
(() => {
  const src = document.querySelector('[data-fx~="cursor-grid-mask"]');
  const html = src.outerHTML;
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => src.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s one more panel comes in, and after 2.5s one leaves.");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
