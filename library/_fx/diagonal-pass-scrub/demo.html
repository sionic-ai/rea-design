<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>diagonal-pass-scrub — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); overflow-x: clip; }
  .demo-hint { position: sticky; top: 0; z-index: 10; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .pad { height: 120vh; }
  .board { position: relative; height: 60vh; display: grid; place-items: center; font: 700 32px var(--kf-font-display); }
  .board svg { position: absolute; left: 50%; top: 50%; width: 220px; margin: -80px 0 0 -110px; }
  .board svg path, .board svg circle { fill: var(--kf-surface); stroke: var(--kf-accent); stroke-width: 4; }
</style>
</head>
<body>
<p class="demo-hint"><b>diagonal-pass-scrub</b> — Scroll down and the truck passes from top right to bottom left, scroll up and it flips and returns.</p>
<div class="pad"></div>
<div class="board">Your two-line copy here<svg data-fx="diagonal-pass-scrub" viewBox="0 0 220 160" aria-hidden="true"><path d="M20 30h120v80H20zM140 60h40l24 26v24h-64z"/><circle cx="56" cy="118" r="16"/><circle cx="168" cy="118" r="16"/></svg></div>
<div class="pad"></div>
<div class="board" data-demo-remove>Panel that drops out after 2.5s<svg data-fx="diagonal-pass-scrub" data-fx-diagonal-pass-scrub="y: 0.3; flip: false" viewBox="0 0 220 160" aria-hidden="true"><path d="M20 30h120v80H20z"/><circle cx="56" cy="118" r="16"/></svg></div>
<div class="board"><template data-demo-late><svg data-fx="diagonal-pass-scrub" data-fx-diagonal-pass-scrub="scrub: 0" viewBox="0 0 220 160" aria-hidden="true"><path d="M20 30h120v80H20z"/><circle cx="168" cy="118" r="16"/></svg></template>Truck that came in after 1s</div>
<div class="pad"></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); window.ScrollTrigger?.refresh(); }, 2500);
</script>
</body>
</html>
