<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cursor-pan-scroll — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.6 var(--kf-font-sans); }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .thumbs { display: flex; gap: 10px; width: min(640px, 90vw); margin: 48px auto; }
  .thumbs span { flex: none; width: 120px; height: 90px; border-radius: var(--kf-radius-sm); background: var(--kf-surface); border: 1px solid var(--kf-line); display: grid; place-items: center; font: 600 18px/1 var(--kf-font-display); }
</style>
</head>
<body>
<p class="demo-hint"><b>cursor-pan-scroll</b> — Move the mouse left and right over the thumbnail strip. The strip follows in proportion to the mouse position. <span style="color:var(--kf-dim)">(After 1s one more band comes in, and one leaves 2.5s later)</span></p>
<div class="thumbs" data-fx="cursor-pan-scroll"><span>01</span><span>02</span><span>03</span><span>04</span><span>05</span><span>06</span><span>07</span><span>08</span><span>09</span><span>10</span></div>
<div class="thumbs" data-fx="cursor-pan-scroll" data-fx-cursor-pan-scroll="ease: .4" data-demo-remove><span>A</span><span>B</span><span>C</span><span>D</span><span>E</span><span>F</span><span>G</span><span>H</span></div>
<template data-demo-late><div class="thumbs" data-fx="cursor-pan-scroll" data-fx-cursor-pan-scroll="ease: .2"><span>Late</span><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span></div></template>
<div class="thumbs" data-fx="cursor-pan-scroll"></div>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
