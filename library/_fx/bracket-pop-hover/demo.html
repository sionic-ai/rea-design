<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bracket-pop-hover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { padding: 64px 20px; max-width: 760px; margin: 0 auto; font-size: 20px; line-height: 2; }
  .demo svg { fill: var(--kf-bg); stroke: var(--kf-ink); stroke-width: 1.5px; stroke-linejoin: round; overflow: visible; }
</style>
</head>
<body>
<p class="demo-hint"><b>bracket-pop-hover</b> — Hover over the picture words inside the sentence (or use keyboard Tab).</p>
<section class="demo">
  <p>Add a sentence introducing what you do here, and
    <a href="#" data-fx="bracket-pop-hover"><span data-fx-part="frame"><svg data-fx-part="icon" viewBox="0 0 70 70"><path d="M22 22l13-7 13 7v26l-13 7-13-7z"/><path d="M22 22l13 7 13-7M35 29v26"/></svg></span><span data-fx-part="label">Field One</span></a>,
    <a href="#" data-fx="bracket-pop-hover" data-fx-bracket-pop-hover="pop: 4; zoom: 1.3"><span data-fx-part="frame"><svg data-fx-part="icon" viewBox="0 0 70 70"><rect x="18" y="24" width="34" height="22" rx="2"/><path d="M18 31h34"/></svg></span><span data-fx-part="label">Field Two</span></a>
    Continue writing with</p>
</section>
<script>
// Late arrivals and removals — checks that fx-core attaches to an element added after 1s and detaches from an element removed after 2.5s
(() => {
  const src = document.querySelector('[data-fx~="bracket-pop-hover"]');
  if (!src) return;
  const html = src.outerHTML, host = src.parentElement;
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(" ", gone);
  setTimeout(() => host.append(" ", make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical one comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
