<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>view-dock-rise — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.6 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .page { height: 300vh; padding: 40px 20px; }
  .dock { position: fixed; right: 26px; bottom: 0; z-index: 50; display: flex; gap: 8px; padding: 25px 0; }
  .dock--left { right: auto; left: 26px; }
  .pill { display: grid; place-items: center; width: 180px; height: 50px; border-radius: var(--kf-radius-pill); background: var(--kf-contrast-bg); color: var(--kf-contrast-ink); font: 500 15px/1 var(--kf-font-sans); }
  .tag { position: fixed; right: 420px; bottom: 44px; z-index: 50; margin: 0; font: 500 12px/1 var(--kf-font-sans); }
</style>
</head>
<body>
<p class="demo-hint"><b>view-dock-rise</b> Scroll down. The booking bar at bottom right is hidden on the first screen and rises as far as you scroll. <span style="color:var(--kf-dim)">(A left band comes in after 1s, and the tag drops out after 2.5s)</span></p>
<div class="page">Scroll down one screen height and the band is fully raised.</div>
<p class="tag" data-demo-remove data-fx="view-dock-rise">Booking tag</p>
<div class="dock" data-fx="view-dock-rise"><a class="pill" href="#">Same-day booking</a><a class="pill" href="#">Stay Booking</a></div>
<template data-demo-late><div class="dock dock--left" data-fx="view-dock-rise"><a class="pill" href="#">Late band</a></div></template>
<script src="../fx-core.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => document.body.append(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
