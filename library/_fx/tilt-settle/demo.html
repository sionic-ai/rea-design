<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tilt-settle — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { padding: 48px 20px; }
  .demo-spacer { height: 90vh; display: grid; place-items: center; color: var(--kf-dim); }

  .wrap { display: flex; justify-content: flex-end; padding: 0 60px; }
  form { width: 44%; max-width: 640px; padding: 34px 54px 100px; border-radius: 16px 16px 0 0; background: var(--kf-surface); border: 1px solid var(--kf-line); }
  form label { display: block; margin-top: 8px; }
  form input, form textarea { width: 100%; height: 52px; border: 0; border-radius: 8px; background: var(--kf-raised); font: inherit; padding: 0 16px; }
  form textarea { height: 140px; padding-top: 14px; }
</style>
</head>
<body>
<p class="demo-hint"><b>tilt-settle</b> Scroll down and the form unfolds halfway. Hover over the form or tap a field to make it stand upright. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<div class="demo-spacer">Scroll down</div>
<section class="wrap"><form data-demo-remove data-fx="tilt-settle" onsubmit="return false">
  <b>Your form title here</b>
  <label><input placeholder="Name"></label><label><input placeholder="Mail"></label><label><textarea placeholder="Message"></textarea></label>
</form><form data-fx="tilt-settle" onsubmit="return false">
  <b>Your form title here</b>
  <label><input placeholder="Name"></label><label><input placeholder="Mail"></label><label><textarea placeholder="Message"></textarea></label>
</form><template data-demo-late><form data-fx="tilt-settle" onsubmit="return false">
  <b>Your form title here</b>
  <label><input placeholder="Name"></label><label><input placeholder="Mail"></label><label><textarea placeholder="Message"></textarea></label>
</form></template></section>
<div class="demo-spacer"></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../../../_shared/vendor/gsap/CustomEase.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); window.ScrollTrigger?.refresh(); }, 2500);
</script>
</body>
</html>
