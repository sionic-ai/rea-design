<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pop-float — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 2; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .gap { height: 70vh; }
  .sec { position: relative; max-width: 900px; margin: 0 auto 120px; padding: 120px 60px; border-radius: 48px; background: var(--kf-raised); }
  .deco { position: absolute; width: 90px; height: 90px; border-radius: 30% 70% 60% 40% / 40% 40% 60% 60%; background: var(--kf-accent); }
  .photo { width: 60%; margin: 0 auto; aspect-ratio: 4 / 3; border-radius: 40% 60% 55% 45% / 50% 45% 55% 50%; }
  .blob { position: absolute; inset: 20% auto auto -40px; width: 200px; height: 160px; border-radius: 50%; background: var(--kf-accent-soft); z-index: -1; }
</style>
</head>
<body>
<p class="demo-hint"><b>pop-float</b> — Scroll down. The surrounding pieces pop out elastically and float in place, and the center photo settles down from large. <span style="color:var(--kf-dim)">(One more piece comes in after 1s, and one drops out after 2.5s)</span></p>
<div class="gap"></div>
<section class="sec" id="s1">
  <span class="blob" data-fx="pop-float" data-fx-pop-float="look: still; float: 14"></span>
  <span class="deco" style="top:-30px;left:40px;rotate:-8deg" data-fx="pop-float"></span>
  <span class="deco" style="top:40px;right:-20px;width:60px;height:60px" data-fx="pop-float" data-fx-pop-float="delay: .1"></span>
  <span class="deco" style="bottom:-30px;left:45%;width:50px;height:70px" data-fx="pop-float" data-fx-pop-float="delay: .2; float: 0" data-demo-remove></span>
  <div class="photo wf-img" data-label="Photo slot · look: photo" data-fx="pop-float" data-fx-pop-float="look: photo"></div>
</section>
<section class="sec" id="late"></section>
<template data-demo-late><span class="deco" style="top:-20px;right:30%" data-fx="pop-float" data-fx-pop-float="from: .5; dur: .8"></span></template>
<div class="gap"></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => document.getElementById("late").append(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
