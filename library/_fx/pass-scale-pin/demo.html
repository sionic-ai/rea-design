<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pass-scale-pin — Motion part</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  h2 { max-width: 900px; margin: 0 auto; font: 400 64px/1 var(--kf-font-display); }
  .ph { aspect-ratio: 1; background: var(--kf-raised); border: 1px solid var(--kf-line); }
  .pad { height: 40vh; display: grid; place-items: center; color: var(--kf-dim); }
</style>
</head>
<body>
<p class="demo-hint"><b>pass-scale-pin</b> — Scroll down. Photos grow and shrink as they pass while the big phrase stays pinned. <span style="color:var(--kf-dim)">(After 1s one more section comes in, and one leaves 2.5s later)</span></p>
<section data-fx="pass-scale-pin">
  <div data-fx-part="text"><h2>Your fixed large copy in two lines here</h2></div>
  <div data-fx-part="list"><div class="ph" data-fx-part="item"></div><div class="ph" data-fx-part="item"></div><div class="ph" data-fx-part="item"></div></div>
</section>
<section data-fx="pass-scale-pin" data-demo-remove><div data-fx-part="list"><div class="ph" data-fx-part="item"></div></div></section>
<template data-demo-late><section data-fx="pass-scale-pin" data-fx-pass-scale-pin="from: 0.6" style="--fx-item: 240px"><div data-fx-part="list"><div class="ph" data-fx-part="item"></div><div class="ph" data-fx-part="item"></div></div></section></template>
<section data-fx="pass-scale-pin"></section>
<div class="pad">Bottom margin</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
