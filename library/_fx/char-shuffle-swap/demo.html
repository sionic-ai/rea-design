<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>char-shuffle-swap — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 500 13px/1.4 var(--kf-font-sans); }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .stage { display: grid; gap: 18px; justify-items: center; padding: 80px 20px; text-align: center; }
  .stage h2 { font: 400 46px/1 var(--kf-font-display); }
  .stage p { text-transform: uppercase; letter-spacing: .02em; }
  .stage button { padding: 6px 14px; border: 1px solid var(--kf-line); border-radius: var(--kf-radius-pill); background: var(--kf-surface); cursor: pointer; }
</style>
</head>
<body>
<p class="demo-hint"><b>char-shuffle-swap</b> — Press ”Next”. Letters switch off at random, then new text switches on at random. <span style="color:var(--kf-dim)">(One more title comes in after 1s, and one drops out after 2.5s)</span></p>
<div class="stage">
  <h2 data-fx="char-shuffle-swap" data-demo-title>First Series</h2>
  <p data-fx="char-shuffle-swap" data-demo-title>Enter series A</p>
  <p data-fx="char-shuffle-swap" data-demo-remove>Dropped Text</p>
  <button type="button" data-demo-next>Next</button>
</div>
<template data-demo-late><p data-fx="char-shuffle-swap" data-fx-char-shuffle-swap="in: true; step: 80; gap: 150; dur: .15" data-demo-title>Late-arriving text</p></template>
<span data-fx="char-shuffle-swap"></span>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
const words = [["First Series", "Enter series A", "Late-arriving text"], ["Second Series", "Enter series B", "Changed text one"]];
let at = 0;
document.querySelector("[data-demo-next]").addEventListener("click", () => {
  at = 1 - at;
  document.querySelectorAll("[data-demo-title]").forEach((el, i) => el.dispatchEvent(new CustomEvent("fx:swap", { detail: { text: words[at][i] || words[at][2] } })));
});
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => document.querySelector(".stage").insertBefore(t.content.cloneNode(true), document.querySelector("[data-demo-next]"))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); }, 2500);
</script>
</body>
</html>
