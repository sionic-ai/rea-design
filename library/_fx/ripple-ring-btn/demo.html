<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ripple-ring-btn — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.6 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .row { display: flex; gap: 80px; align-items: center; justify-content: center; padding: 20vh 0; }
  .row.is-blue { background: var(--kf-accent); color: var(--kf-on-accent); }
  .more { font-size: 16px; }
  .gap { height: 90vh; }
</style>
</head>
<body>
<p class="demo-hint"><b>ripple-ring-btn</b> — When the button is visible, a ripple spreads twice. Hover and the letters settle down while a circle is drawn around them. <span style="color:var(--kf-dim)">(After 1s one more button comes in, and after 2.5s one drops out)</span></p>
<div class="row">
  <a class="more" href="#" data-fx="ripple-ring-btn" data-fx-ripple-ring-btn="on: load"><span data-fx-part="label">More</span><svg data-fx-part="icon" viewBox="0 0 60 14"><path d="M1 12C6 4 12 1.6 18 1.6c7 0 12 4.6 20 4.6 7 0 13-2.4 21-6-4 7-10 12-17 12.4-8 .4-13-4.4-21-4.4C14 8.2 8 9 1 12Z"/></svg></a>
  <a class="more" href="#" data-fx="ripple-ring-btn" data-fx-ripple-ring-btn="on: load" data-demo-remove><span data-fx-part="label">Omission</span><svg data-fx-part="icon" viewBox="0 0 60 14"><path d="M1 7h58"/></svg></a>
  <span data-late-slot></span>
</div>
<div class="gap"></div>
<div class="row is-blue">
  <a class="more" href="#" data-fx="ripple-ring-btn"><span data-fx-part="label">More</span><svg data-fx-part="icon" viewBox="0 0 60 14"><path d="M1 12C6 4 12 1.6 18 1.6c7 0 12 4.6 20 4.6 7 0 13-2.4 21-6-4 7-10 12-17 12.4-8 .4-13-4.4-21-4.4C14 8.2 8 9 1 12Z"/></svg></a>
  <a class="more" href="#" data-fx="ripple-ring-btn" data-fx-ripple-ring-btn="ripple: 1.2; repeat: 3; hide: 0"><span data-fx-part="label">Next</span><svg data-fx-part="icon" viewBox="0 0 60 14"><path d="M1 12C6 4 12 1.6 18 1.6c7 0 12 4.6 20 4.6 7 0 13-2.4 21-6-4 7-10 12-17 12.4-8 .4-13-4.4-21-4.4C14 8.2 8 9 1 12Z"/></svg></a>
</div>
<div class="gap"></div>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelector("[data-late-slot]").outerHTML = '<a class="more" href="#" data-fx="ripple-ring-btn" data-fx-ripple-ring-btn="on: load"><span data-fx-part="label">Late</span><svg data-fx-part="icon" viewBox="0 0 60 14"><path d="M1 12C6 4 12 1.6 18 1.6c7 0 12 4.6 20 4.6 7 0 13-2.4 21-6-4 7-10 12-17 12.4-8 .4-13-4.4-21-4.4C14 8.2 8 9 1 12Z"/></svg></a>', 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
