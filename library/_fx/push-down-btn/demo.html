<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>push-down-btn — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .row { display: flex; flex-wrap: wrap; gap: 16px; padding: 40px 20px; }
  .pill { display: inline-flex; align-items: center; justify-content: center; height: 48px; padding: 0 28px; border-radius: 999px; color: var(--kf-ink); }
  .tile { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 160px; height: 110px; border-radius: 24px; color: var(--kf-ink); }
</style>
</head>
<body>
<p class="demo-hint"><b>push-down-btn</b> — Hover over the button. It drops straight down by the height of its lower lip.</p>
<div class="row">
  <a class="pill" data-fx="push-down-btn" href="#">Apply</a>
  <a class="pill" data-fx="push-down-btn" href="#" style="--fx-depth: 6px">Booking Availability Calendar</a>
  <a class="tile" data-fx="push-down-btn" href="#"><b>000-000-0000</b><small>Reception 9:00~18:00</small></a>
</div>
<script>
// Late arrivals and removals — checks that fx-core attaches to an element added after 1s and detaches from an element removed after 2.5s
(() => {
  const host = document.querySelector('[data-fx~="push-down-btn"]');
  if (!host) return;
  const html = host.outerHTML;
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  host.after(gone);
  setTimeout(() => host.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical one comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
</body>
</html>
