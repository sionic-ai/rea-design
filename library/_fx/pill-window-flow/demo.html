<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pill-window-flow — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .stage { height: 86vh; }
  .stage .photo { position: absolute; inset: 0; background: linear-gradient(135deg, var(--kf-accent), var(--kf-accent-soft) 45%, var(--kf-ink-soft)); }
  .stage h1 { position: absolute; left: 6%; bottom: 8%; z-index: 3; margin: 0; font: 700 32px/1.2 var(--kf-font-display); writing-mode: vertical-rl; }
  .small { height: 50vh; margin-top: 40px; }
</style>
</head>
<body>
<p class="demo-hint"><b>pill-window-flow</b> — Just watch. Pill-shaped windows cut in the paper drift in alternating up and down directions on each row, revealing the picture behind (a pattern cell every third cell). <span style="color:var(--kf-dim)">(After 1s one more panel comes in, and one leaves 2.5s later)</span></p>
<section class="stage" data-fx="pill-window-flow"><div class="photo"></div><h1>Your one line here,<br>Set in two lines.</h1></section>
<section class="stage small" data-fx="pill-window-flow" data-fx-pill-window-flow="cols: 3; dur: 3; every: 0" data-demo-remove><div class="photo"></div></section>
<template data-demo-late><section class="stage small" data-fx="pill-window-flow" data-fx-pill-window-flow="n: 2; every: 2"><div class="photo"></div></section></template>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
