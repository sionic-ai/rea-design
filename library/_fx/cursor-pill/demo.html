<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cursor-pill — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { padding: 48px 20px; display: grid; grid-template-columns: 2fr 1fr; gap: 16px; }
  .card { height: 50vh; border-radius: var(--kf-radius-md); display: grid; place-items: center; color: var(--kf-dim); }
  .card.a { background: var(--kf-raised); }
  .card.b { background: var(--kf-accent-soft); }
  .card.c { background: var(--kf-surface); border: 1px solid var(--kf-line); }
</style>
</head>
<body>
<p class="demo-hint"><b>cursor-pill</b> — Move the mouse over the panel — a dot follows, and over a cell it expands into a pill. <span style="color:var(--kf-dim)">(After 1s one more cell comes in, and one leaves 2.5s later)</span></p>
<main class="demo" data-fx="cursor-pill">
  <div class="card a" data-fx-part="target" data-label="View Work">One cell</div>
  <div class="card b" data-fx-part="target" data-label="View Reel">Cell two</div>
  <div class="card c" data-demo-remove data-fx-part="target" data-label="Cell to Be Removed">Cell three</div>
  <div class="card c">Unlabeled slot</div>
  <template data-demo-late><div class="card a" data-fx-part="target" data-label="Late cell">Cell four</div></template>
</main>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); window.ScrollTrigger?.refresh(); }, 2500);
</script>
</body>
</html>
