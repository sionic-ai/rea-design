<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>split-line-loader — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { padding: 48px 20px; }
  .demo-btn { display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 16px; border: 1px solid var(--kf-line); border-radius: var(--kf-radius-sm); background: var(--kf-surface); color: var(--kf-ink); cursor: pointer; }
  .hero { height: 70vh; display: grid; place-items: center; font: 400 72px/.9 var(--kf-font-display); color: var(--kf-accent); }
</style>
</head>
<body>
<p class="demo-hint"><b>split-line-loader</b> — On open, a center line stretches in half-and-half colors then clears and the curtain splits (reload to replay). The ”Transition line” button redraws only the line under the header.</p>
<div data-fx="split-line-loader" style="--fx-left: var(--kf-accent-text)"></div>
<div data-fx="split-line-loader" data-fx-split-line-loader="veil: off" style="--fx-line-top: 48px" id="nav-line"></div>
<section class="hero">Your Hero here</section>
<div class="demo"><button class="demo-btn" type="button" id="go">Flip line</button></div>
<script>
  addEventListener("fx:done", () => document.querySelector(".demo-hint").append(" — fx:done"), { once: true });
  document.getElementById("go").addEventListener("click", () => document.getElementById("nav-line").dispatchEvent(new CustomEvent("fx:cover")));
</script>
<script>
// Late arrivals and removals — checks that fx-core attaches to an element added after 1s and detaches from an element removed after 2.5s
(() => {
  const src = document.querySelector('[data-fx~="split-line-loader"]');
  if (!src) return;
  const html = src.outerHTML.replace(/\sid="[^"]*"/g, "");
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => src.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical one comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
