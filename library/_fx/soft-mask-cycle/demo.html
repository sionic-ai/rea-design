<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>soft-mask-cycle — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 40px; padding: 48px 20px; }
  .shot { aspect-ratio: 4 / 3; display: grid; place-items: center; background: var(--kf-ink); color: var(--kf-bg); font: 600 32px/1 var(--kf-font-sans); }
  .shot.is-b { background: var(--kf-dim); }
  .shot.is-c { background: var(--kf-accent); color: var(--kf-on-accent); }
  button { margin: 12px 0 0; padding: 6px 14px; border: 1px solid var(--kf-line); background: var(--kf-surface); }
</style>
</head>
<body>
<p class="demo-hint"><b>soft-mask-cycle</b> — Just watch. Every 4s a new section wipes down from the top in a round curve. The second panel is auto: off — it changes only when you press the button. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<section class="demo">
  <div data-fx="soft-mask-cycle" data-demo-remove><div class="shot" data-fx-part="slide">01</div><div class="shot is-b" data-fx-part="slide">02</div></div>
  <div data-fx="soft-mask-cycle"><div class="shot" data-fx-part="slide">A</div><div class="shot is-b" data-fx-part="slide">B</div><div class="shot is-c" data-fx-part="slide">C</div></div>
  <div>
    <div data-fx="soft-mask-cycle" data-fx-soft-mask-cycle="auto: off; dur: 1.2" id="manual"><div class="shot is-c" data-fx-part="slide">1</div><div class="shot" data-fx-part="slide">2</div></div>
    <button type="button" id="next">Next section</button>
  </div>
  <template data-demo-late>
    <div data-fx="soft-mask-cycle" data-fx-soft-mask-cycle="every: 2"><div class="shot is-b" data-fx-part="slide">Late 1</div><div class="shot" data-fx-part="slide">Late 2</div></div>
  </template>
</section>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
let n = 0;
document.getElementById("next").addEventListener("click", () => document.getElementById("manual").dispatchEvent(new CustomEvent("fx:go", { detail: { index: ++n } })));
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((x) => x.remove()), 2500);
</script>
</body>
</html>
