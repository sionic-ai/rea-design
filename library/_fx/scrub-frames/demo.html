<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>scrub-frames — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .track { position: relative; height: 400vh; }
  .stage { position: sticky; top: 0; display: grid; place-items: center; height: 100vh; }
  .stage [data-fx] { width: min(40vw, 420px); }
  .spacer { height: 60vh; display: grid; place-items: center; color: var(--kf-dim); }
</style>
</head>
<body>
<p class="demo-hint"><b>scrub-frames</b> — Scroll down. Past 12% of the panel, the card turns from front to back over 120 frames, and keeps gliding to a stop even after you stop scrolling. <span style="color:var(--kf-dim)">(After 1s one more panel comes in, and one leaves 2.5s later)</span></p>
<div class="spacer">↓</div>
<section class="track"><div class="stage"><div data-fx="scrub-frames" data-fx-scrub-frames="trigger: .track"><canvas data-fx-part="canvas" width="560" height="540"></canvas></div></div></section>
<section class="track" data-demo-remove><div class="stage"><div data-fx="scrub-frames" data-fx-scrub-frames="trigger: .track; speed: 1; lerp: .2"><canvas data-fx-part="canvas" width="560" height="540"></canvas></div></div></section>
<template data-demo-late><section class="track"><div class="stage"><div data-fx="scrub-frames" data-fx-scrub-frames="trigger: .track"></div></div></section></template>
<div class="spacer">Footer</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
gsap.registerPlugin(ScrollTrigger);
// Instead of an image file, take a sheet number and draw one card at that angle — sheets 0~119 map 0→180°
const css = (n) => getComputedStyle(document.documentElement).getPropertyValue(n);
addEventListener("fx:frame", (e) => {
  const cv = e.target.querySelector("canvas");
  if (!cv) return;
  if (cv.width !== 560) { cv.width = 560; cv.height = 540; }
  const x = cv.getContext("2d"), a = (e.detail.frame / (e.detail.count - 1)) * Math.PI, k = Math.cos(a);
  x.clearRect(0, 0, cv.width, cv.height);
  x.save();
  x.translate(cv.width / 2, cv.height / 2);
  x.scale(Math.max(0.02, Math.abs(k)), 1);
  x.fillStyle = k >= 0 ? css("--kf-accent") : css("--kf-ink");
  x.fillRect(-140, -230, 280, 460);
  x.fillStyle = css("--kf-surface");
  x.font = `700 64px ${css("--kf-font-sans")}`;
  x.textAlign = "center";
  x.fillText(k >= 0 ? "Front" : "Back", 0, 20);
  x.restore();
  x.fillStyle = css("--kf-dim");
  x.font = `500 16px ${css("--kf-font-mono")}`;
  x.fillText(`${e.detail.frame + 1} / ${e.detail.count}`, 16, 28);
}, true);
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
