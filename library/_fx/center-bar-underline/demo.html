<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>center-bar-underline — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 700 14px/1.6 var(--kf-font-sans); }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { display: flex; gap: 30px; padding: 60px 40px; }
</style>
</head>
<body>
<p class="demo-hint"><b>center-bar-underline</b> — Hover over the menu. A bar grows from the center to both sides. <span style="color:var(--kf-dim)">(After 1s one more menu item comes in, and after 2.5s one drops out)</span></p>
<nav class="demo">
  <a href="#" data-fx="center-bar-underline">Menu First</a>
  <a href="#" data-fx="center-bar-underline">Menu 2, slightly longer</a>
  <a href="#" data-fx="center-bar-underline" style="--fx-bar: 2px; --fx-gap: 8px">Thin bar</a>
  <a href="#" data-fx="center-bar-underline" data-demo-remove>Omitted menu</a>
</nav>
<script src="../fx-core.js"></script>
<script>
setTimeout(() => { const a = document.createElement("a"); a.href = "#"; a.dataset.fx = "center-bar-underline"; a.textContent = "Late-arrived Menu"; document.querySelector(".demo")?.append(a); }, 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); }, 2500);
</script>
</body>
</html>
