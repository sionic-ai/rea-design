<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>drop-fade-in — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { padding: 96px 20px; display: grid; justify-items: center; gap: 16px; text-align: center; }
  .demo h1 { font: var(--kf-weight-display) 56px/1.02 var(--kf-font-display); letter-spacing: -0.04em; }
  .demo .eyebrow { color: var(--kf-accent); font-size: 26px; }
</style>
</head>
<body>
<p class="demo-hint"><b>drop-fade-in</b> — Refresh and four lines drop in from the top one by one. <span style="color:var(--kf-dim)">(After 1s one more row comes in, and one row leaves 2.5s later)</span></p>
<section class="demo">
  <p class="eyebrow" data-fx="drop-fade-in" style="--fx-delay: .1s">Eyebrow</p>
  <h1 data-fx="drop-fade-in" style="--fx-delay: .2s">A headline<br>on two lines</h1>
  <p data-fx="drop-fade-in" data-demo-remove style="--fx-delay: .3s">Description in two lines. Text that sits under the Hero title.</p>
  <p data-fx="drop-fade-in" style="--fx-delay: .4s; --fx-drop: 24px">Button slot</p>
  <template data-demo-late><p data-fx="drop-fade-in">Late-arriving line</p></template>
  <p data-fx="drop-fade-in"></p>
</section>
<script src="../fx-core.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
