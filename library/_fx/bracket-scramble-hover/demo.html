<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bracket-scramble-hover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-mono); }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { padding: 48px 20px; display: grid; gap: 40px; }
  .nav { display: flex; gap: 64px; }
  .nav a { display: inline-flex; gap: 4px; }
  .row { position: relative; display: flex; justify-content: space-between; padding: 24px; border-top: 1px solid var(--kf-line); }
  .row:hover { background: var(--kf-raised); }
</style>
</head>
<body>
<p class="demo-hint"><b>bracket-scramble-hover</b> — Hover over the menu text and the row below. <span style="color:var(--kf-dim)">(After 1s one more menu item comes in, and after 2.5s one drops out)</span></p>
<section class="demo">
  <nav class="nav" data-demo-nav>
    <a href="#" data-fx="bracket-scramble-hover" aria-current="page"><span data-fx-part="bracket">[</span><span data-fx-part="label">Home</span><span data-fx-part="bracket">]</span></a>
    <a href="#" data-fx="bracket-scramble-hover"><span data-fx-part="bracket">[</span><span data-fx-part="label">Works</span><span data-fx-part="bracket">]</span></a>
    <a href="#" data-fx="bracket-scramble-hover" data-demo-remove><span data-fx-part="bracket">[</span><span data-fx-part="label">Studio</span><span data-fx-part="bracket">]</span></a>
    <a href="#" data-fx="bracket-scramble-hover"><span data-fx-part="bracket">[</span><span data-fx-part="label">Careers</span><span data-fx-part="bracket">]</span></a>
  </nav>
  <div class="row">
    <span>Your work name here</span>
    <span data-fx="bracket-scramble-hover" data-fx-bracket-scramble-hover="dur: .6; delay: 0; ease: power2.inOut; chars: abcdefghijklmnopqrstuvwxyz; group: .row"><span data-fx-part="label">View</span></span>
  </div>
  <a href="#" data-fx="bracket-scramble-hover"></a>
  <template data-demo-late><a href="#" data-fx="bracket-scramble-hover"><span data-fx-part="bracket">[</span><span data-fx-part="label">Contact</span><span data-fx-part="bracket">]</span></a></template>
</section>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrambleTextPlugin.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => document.querySelector("[data-demo-nav]").append(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
