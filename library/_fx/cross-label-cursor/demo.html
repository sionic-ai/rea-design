<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cross-label-cursor — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { margin: 0; background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; margin: 0; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { padding: 48px 20px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; min-height: 70vh; }
  .card { height: 40vh; border-radius: var(--kf-radius-md); display: grid; place-items: center; color: var(--kf-dim); background: var(--kf-raised); }
</style>
</head>
<body>
<p class="demo-hint"><b>cross-label-cursor</b> — Move the mouse over the panel. A crosshair follows, and over a cell a name-tag pill expands. <span style="color:var(--kf-dim)">(After 1s one more cell comes in, and one leaves 2.5s later)</span></p>
<main class="demo" data-fx="cross-label-cursor">
  <a class="card" href="#" data-fx-part="target" data-label="Open">One cell</a>
  <a class="card" href="#" data-fx-part="target" data-label="View all cases">Cell two</a>
  <div class="card" data-fx-part="target" data-icon="play">Play slot</div>
  <div class="card" data-demo-remove data-fx-part="target" data-label="Cell to Be Removed">Cell four</div>
  <div class="card">Unlabeled slot</div>
  <template data-demo-late><a class="card" href="#" data-fx-part="target" data-label="Late cell">Six cells</a></template>
</main>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); window.ScrollTrigger?.refresh(); }, 2500);
</script>
</body>
</html>
