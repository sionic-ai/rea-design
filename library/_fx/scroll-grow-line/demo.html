<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>scroll-grow-line — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.7 var(--kf-font-sans); }
  .demo-hint { margin: 0; padding: 12px 20px; border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .pad { height: 60vh; }
  .line { max-width: 560px; margin: 0 auto 80vh; padding-left: 48px; }
  .line::before { content: ""; position: absolute; top: 0; bottom: 0; left: 0; width: 2px; margin-left: -1px; background: var(--kf-line); }
  .line li { position: relative; padding: 0 0 18vh; }
  .line [data-fx-part="dot"] { position: absolute; top: 6px; left: -59px; width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--kf-line); background: var(--kf-bg); }
  .line [data-fx-part="dot"].is-active { border-color: var(--kf-accent); background: var(--kf-accent); }
</style>
</head>
<body>
<p class="demo-hint"><b>scroll-grow-line</b> — Scroll down. The line grows and the dots for past years light up.</p>
<div class="pad"></div>
<div class="line" id="line" data-fx="scroll-grow-line"><span data-fx-part="bar"></span><ol id="years">
  <li><span data-fx-part="dot"></span><b>0001</b> Your first task here</li>
  <li><span data-fx-part="dot"></span><b>0002</b> Your second task here</li>
  <li class="gone"><span data-fx-part="dot"></span><b>0003</b> Year to be removed soon</li>
  <li><span data-fx-part="dot"></span><b>0004</b> Your fourth task here</li>
</ol></div>
<div class="line" id="late"></div>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Checks whether it attaches to late-arriving panels and whether detaching runs when a panel is removed
(() => {
  const late = document.getElementById("late");
  setTimeout(() => { late.innerHTML = '<span data-fx-part="bar"></span><ol><li><span data-fx-part="dot"></span>Late sun</li></ol>'; late.setAttribute("data-fx", "scroll-grow-line"); }, 1000);
  setTimeout(() => document.querySelector(".gone")?.remove(), 2500);
  setTimeout(() => late.remove(), 3500);
})();
</script>
</body>
</html>
