<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>glow-field — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .field { height: 90vh; display: grid; place-items: center; font: 400 48px/1 var(--kf-font-display); letter-spacing: -0.04em; --fx-glow-base: var(--kf-ink); }
  .field + .field { height: 60vh; }
</style>
</head>
<body>
<p class="demo-hint"><b>glow-field</b> — Move the mouse, then scroll down as the second section’s light fills up and covers the screen. <span style="color:var(--kf-dim)">(After 1s one more section comes in, and one leaves 2.5s later)</span></p>
<section class="field" data-fx="glow-field">Your title here</section>
<section class="field" id="grow" data-fx="glow-field" data-fx-glow-field="from: top">Fills up on scroll</section>
<section class="field" data-fx="glow-field" data-fx-glow-field="reveal: 1; alpha: 0" data-demo-remove>Being removed soon</section>
<template data-demo-late><section class="field" data-fx="glow-field" data-fx-glow-field="reveal: 0.2">Enters late</section></template>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
const grow = document.getElementById("grow");
addEventListener("scroll", () => { const r = grow.getBoundingClientRect(), p = Math.max(0, Math.min(1, 1 - r.bottom / (innerHeight + r.height))); grow.style.setProperty("--fx-reveal", p.toFixed(3)); grow.style.setProperty("--fx-exit", Math.max(0, (p - 0.5) * 2).toFixed(3)); }, { passive: true });
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); }, 2500);
</script>
</body>
</html>
