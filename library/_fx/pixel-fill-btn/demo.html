<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pixel-fill-btn — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { padding: 48px 20px; display: flex; flex-wrap: wrap; gap: 12px; }
  .b { padding: 14px 16px; font: 500 13px/1 var(--kf-font-mono); text-transform: uppercase; color: var(--kf-ink); border: 1px solid var(--kf-line); background: none; }
  .b.is-brand { background: var(--kf-accent); color: var(--kf-on-accent); border-color: var(--kf-accent); }
  .b.is-text { color: var(--kf-accent-text); }
</style>
</head>
<body>
<p class="demo-hint"><b>pixel-fill-btn</b> — Hover over the button. Ink-black pixels spread from the left and the letters roll upward. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<section class="demo">
  <a class="b" data-fx="pixel-fill-btn" data-demo-remove href="#"><span data-fx-part="label">Being removed soon</span></a>
  <a class="b is-brand" data-fx="pixel-fill-btn" href="#"><span data-fx-part="label">Contact Us</span><span data-fx-part="icon">→</span></a>
  <button class="b" type="button" data-fx="pixel-fill-btn" data-fx-pixel-fill-btn="look: outline"><span data-fx-part="label">Refusal</span></button>
  <a class="b is-text" data-fx="pixel-fill-btn" data-fx-pixel-fill-btn="look: outline; dur: .4" href="#"><span data-fx-part="label">See more</span><span data-fx-part="icon">→</span></a>
  <template data-demo-late><a class="b" data-fx="pixel-fill-btn" href="#"><span data-fx-part="label">Late-arrived Button</span></a></template>
</section>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
