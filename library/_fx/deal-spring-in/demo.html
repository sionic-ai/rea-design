<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>deal-spring-in — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; left: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .reel { display: flex; gap: 4vw; overflow-x: auto; padding: 12vh 6vw; }
  .reel figure, .col figure { flex: none; margin: 0; width: 40vw; aspect-ratio: 16 / 9; }
  .plate { width: 100%; height: 100%; background: var(--kf-raised); border: 1px solid var(--kf-line); display: grid; place-items: center; font: 700 28px/1 var(--kf-font-display); }
  .col { display: grid; justify-items: center; gap: 30vh; padding: 20vh 0 60vh; }
  .col figure { width: min(80vw, 640px); }
</style>
</head>
<body>
<p class="demo-hint"><b>deal-spring-in</b> — Scroll the horizontal row sideways and the lower row downward. Each time a panel enters, it settles with a wobble from where it was thrown. <span style="color:var(--kf-dim)">(After 1s one more panel comes in, and one leaves 2.5s later)</span></p>
<div class="reel" data-fx-scroller>
  <figure data-fx="deal-spring-in"><div class="plate" data-fx-part="swing">Panel 1</div></figure>
  <figure data-fx="deal-spring-in" data-demo-remove><div class="plate" data-fx-part="swing">Panel 2</div></figure>
  <figure data-fx="deal-spring-in"><div class="plate" data-fx-part="swing">Panel 3</div></figure>
  <figure data-fx="deal-spring-in"><div class="plate" data-fx-part="swing">Panel 4</div></figure>
  <figure data-fx="deal-spring-in"><div class="plate" data-fx-part="swing">Panel 5</div></figure>
  <figure data-fx="deal-spring-in"></figure>
</div>
<div class="col">
  <figure data-fx="deal-spring-in"><div class="plate" data-fx-part="swing">Vertical 1</div></figure>
  <figure data-fx="deal-spring-in" data-fx-deal-spring-in="steady: 1"><div class="plate" data-fx-part="swing">Vertical 2 (steady)</div></figure>
  <template data-demo-late><figure data-fx="deal-spring-in"><div class="plate" data-fx-part="swing">Late panel</div></figure></template>
  <figure data-fx="deal-spring-in"><div class="plate" data-fx-part="swing">Vertical 3</div></figure>
</div>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
