<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>peek-out-hover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 2; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .row { display: grid; grid-template-columns: repeat(3, minmax(0, 260px)); gap: 40px; justify-content: center; padding: 80px 20px; }
  .card { display: block; padding: 20px; border-radius: 40px; background: var(--kf-surface); }
  .card [data-fx-part="frame"] { border-radius: 20px; aspect-ratio: 2 / 1; }
  .card .wf-img { height: 100%; border: 0; }
  .peek { width: 26%; aspect-ratio: 1; }
  .peek circle { fill: var(--kf-accent); }
  .peek .eye { fill: var(--kf-surface); }
  h3 { margin-top: 16px; font-weight: 700; }
</style>
</head>
<body>
<p class="demo-hint"><b>peek-out-hover</b> — Hover over a card. A character peeks out from the photo edge. <span style="color:var(--kf-dim)">(One more card comes in after 1s, and one drops out after 2.5s)</span></p>
<div class="row" id="row">
  <a class="card" href="#" data-fx="peek-out-hover"><div data-fx-part="frame"><div class="wf-img" data-label="Photo"></div><svg class="peek" data-fx-part="peek" style="top:100%;left:5%" viewBox="0 0 40 40"><circle cx="20" cy="20" r="20"/><circle class="eye" cx="14" cy="14" r="4"/><circle class="eye" cx="26" cy="14" r="4"/></svg></div><h3>From below</h3></a>
  <a class="card" href="#" data-fx="peek-out-hover"><div data-fx-part="frame"><div class="wf-img" data-label="Photo"></div><svg class="peek" data-fx-part="peek" data-key="top" style="bottom:100%;right:18%" viewBox="0 0 40 40"><circle cx="20" cy="20" r="20"/><circle class="eye" cx="14" cy="26" r="4"/><circle class="eye" cx="26" cy="26" r="4"/></svg></div><h3>From above</h3></a>
  <a class="card" href="#" data-fx="peek-out-hover" data-demo-remove><div data-fx-part="frame"><div class="wf-img" data-label="Photo"></div><svg class="peek" data-fx-part="peek" data-key="left" style="right:100%;bottom:15%" viewBox="0 0 40 40"><circle cx="20" cy="20" r="20"/><circle class="eye" cx="28" cy="16" r="4"/><circle class="eye" cx="28" cy="26" r="4"/></svg></div><h3>Left (omitted)</h3></a>
  <a class="card" href="#" data-fx="peek-out-hover" data-fx-peek-out-hover="look: touch-out"><div data-fx-part="frame"><div class="wf-img" data-label="Photo"></div><svg class="peek" data-fx-part="peek" style="top:100%;left:100%;--fx-x:-58%;--fx-y:-52%;--fx-dur:.5s;--fx-ease:cubic-bezier(.045,.821,.559,.611)" viewBox="0 0 40 40"><circle cx="20" cy="20" r="20"/><circle class="eye" cx="14" cy="14" r="4"/><circle class="eye" cx="26" cy="14" r="4"/></svg></div><h3>At the corner · the phone always shows up</h3></a>
</div>
<template data-demo-late><a class="card" href="#" data-fx="peek-out-hover"><div data-fx-part="frame"><div class="wf-img" data-label="Late"></div></div><h3>Card without character</h3></a></template>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => document.getElementById("row").append(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
