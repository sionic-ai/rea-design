<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hover-panel-cards — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 500 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .band { margin: 60px 0; padding: 150px 0; border-top: 2px solid var(--kf-ink); border-bottom: 2px solid var(--kf-ink); text-align: center; }
  .band h2 { margin: 0; font: 700 40px/1 var(--kf-font-display); }
  .card { display: flex; flex-direction: column; justify-content: center; align-items: center; width: 200px; height: 240px; background: var(--kf-accent); color: var(--kf-on-accent); font-weight: 700; text-decoration: none; }
</style>
</head>
<body>
<p class="demo-hint"><b>hover-panel-cards</b> — Hover over the CONTACT band between the lines <span style="color:var(--kf-dim)">(After 1s one more band comes in, and one leaves 2.5s later)</span></p>
<section>
  <div class="band" data-fx="hover-panel-cards">
    <h2>CONTACT</h2>
    <div data-fx-part="contents"><a class="card" href="#" data-fx-part="item">Contact 1</a><a class="card" href="#" data-fx-part="item">Contact 2</a><a class="card" href="#" data-fx-part="item">Contact 3</a><a class="card" href="#" data-fx-part="item">Contact 4</a><span data-fx-part="panel"></span></div>
  </div>
  <div class="band" data-demo-remove data-fx="hover-panel-cards"><h2>Dropped Band</h2><div data-fx-part="contents"><a class="card" href="#" data-fx-part="item">Inquiry</a><span data-fx-part="panel"></span></div></div>
  <template data-demo-late><div class="band" data-fx="hover-panel-cards" data-fx-hover-panel-cards="dur: .5; each: .08"><h2>Late-arriving band · fast version</h2><div data-fx-part="contents"><a class="card" href="#" data-fx-part="item">Contact 1</a><a class="card" href="#" data-fx-part="item">Contact 2</a><span data-fx-part="panel"></span></div></div></template>
</section>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/CustomEase.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
