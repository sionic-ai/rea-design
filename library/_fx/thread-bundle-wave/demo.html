<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>thread-bundle-wave — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo-hero { height: 80vh; display: grid; place-items: center; }
  .demo-hero h1 { position: relative; z-index: 1; font: 700 64px/1 var(--kf-font-display); }
  .demo-small { height: 220px; margin: 40px 20px; border: 1px solid var(--kf-line); }
</style>
</head>
<body>
<p class="demo-hint"><b>thread-bundle-wave</b> — Behind the hero title, a bundle of colored threads flows in waves and the bundle width slowly breathes. The small panel below is tilt: 0 · count: 60.</p>
<section class="demo-hero" data-fx="thread-bundle-wave"><h1>Your title here</h1></section>
<div class="demo-small" data-fx="thread-bundle-wave" data-fx-thread-bundle-wave="tilt: 0; count: 60"></div>
<script>
(() => {
  // Late arrivals and removals — after 1 second another plate comes in (late arrival), and after 2.5 seconds one is removed (detach)
  const src = document.querySelector(".demo-small");
  const make = () => { const d = src.cloneNode(false); return d; };
  const gone = make();
  src.after(gone);
  setTimeout(() => src.after(make()), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s one more panel comes in, and after 2.5s one leaves.");
})();
</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
