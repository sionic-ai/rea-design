<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>frame-grid-lines — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .gap { height: 80vh; }
  .frame { position: relative; isolation: isolate; padding: 120px 40px; }
  .vline { position: absolute; top: 0; width: 1px; height: 100%; background: var(--kf-line); z-index: -1; }
  .vline.l { left: 40px; } .vline.c { left: 50%; } .vline.r { right: 40px; }
  .block { position: relative; padding: 40px 0; }
  .hline { position: absolute; left: 0; width: 100%; height: 1px; background: var(--kf-line); z-index: -1; }
  .hline.t { top: 0; } .hline.b { bottom: 0; }
</style>
</head>
<body>
<p class="demo-hint"><b>frame-grid-lines</b> — Scroll down — when the panel reaches 70% of the screen, vertical and horizontal grid lines are drawn over 2.4s. <span style="color:var(--kf-dim)">(After 1s one more panel comes in, and one leaves 2.5s later)</span></p>
<div class="gap"></div>
<section class="frame" data-fx="frame-grid-lines">
  <i class="vline l" data-fx-part="vline"></i><i class="vline c" data-fx-part="vline"></i><i class="vline r" data-fx-part="vline"></i>
  <div class="block"><i class="hline t" data-fx-part="hline"></i>Panel 1 — horizontal lines above and below the block<i class="hline b" data-fx-part="hline"></i></div>
</section>
<section class="frame" data-fx="frame-grid-lines" data-fx-frame-grid-lines="dur: 1" data-demo-remove>
  <i class="vline l" data-fx-part="vline"></i><i class="vline r" data-fx-part="vline"></i>
  <div class="block"><i class="hline t" data-fx-part="hline"></i>Panel 2 — dur 1 (fading panel)<i class="hline b" data-fx-part="hline"></i></div>
</section>
<span data-late-slot></span>
<section class="frame" data-fx="frame-grid-lines"><div class="block">Lineless edition</div></section>
<div class="gap"></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelector("[data-late-slot]").outerHTML = '<section class="frame" data-fx="frame-grid-lines"><i class="vline c" data-fx-part="vline"></i><div class="block"><i class="hline t" data-fx-part="hline"></i>Late panel<i class="hline b" data-fx-part="hline"></i></div></section>', 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
