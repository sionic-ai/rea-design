<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>palette-glow-gl — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; background: transparent; }
  .demo-hint { position: sticky; top: 0; z-index: 10; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  section { min-height: 90vh; padding: 40px; font: 400 48px var(--kf-font-display); }
  .demo-glow {
    --fx-glow-warm-0: color-mix(in oklab, var(--kf-bg) 80%, var(--kf-accent-soft));
    --fx-glow-warm-1: var(--kf-accent-soft);
    --fx-glow-warm-2: color-mix(in oklab, var(--kf-accent) 30%, var(--kf-bg));
    --fx-glow-warm-3: var(--kf-raised);
    --fx-glow-night-0: var(--kf-contrast-bg);
    --fx-glow-night-1: color-mix(in oklab, var(--kf-accent) 50%, var(--kf-contrast-bg));
    --fx-glow-night-2: color-mix(in oklab, var(--kf-contrast-ink) 20%, var(--kf-contrast-bg));
    --fx-glow-night-3: var(--kf-accent);
  }
  [data-glow="night"] { color: var(--kf-contrast-ink); }
</style>
</head>
<body>
<p class="demo-hint"><b>palette-glow-gl</b> — Scroll down. Each time you cross a section, the glow color behind slowly tints. <span style="color:var(--kf-dim)">(After 1s one more panel comes in, and one leaves 2.5s later)</span></p>
<div class="demo-glow" data-fx="palette-glow-gl" data-fx-palette-glow-gl="names: warm night; dark: night"><div data-fx-part="fallback"></div><canvas></canvas><div data-fx-part="noise"></div></div>
<section>Default Skin</section>
<section data-glow="warm">Warm Skin</section>
<section data-glow="night">Night Skin</section>
<section>Back to default</section>
<div data-fx="palette-glow-gl" data-demo-remove style="opacity: 0"></div>
<template data-demo-late><div data-fx="palette-glow-gl" data-fx-palette-glow-gl="fps: 12; res: .3" style="opacity: 0"></div></template>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
