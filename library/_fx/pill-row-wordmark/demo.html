<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pill-row-wordmark — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .mark { font-family: var(--kf-font-wordmark, var(--kf-font-display)); font-weight: 900; margin: 40px 32px; }
  .stage { background: var(--kf-contrast-bg); color: var(--kf-contrast-ink); padding: 48px 32px; }
  .small { width: 320px; }
</style>
</head>
<body>
<p class="demo-hint"><b>pill-row-wordmark</b> — The text is redrawn as horizontal pill bars, and the bars sway left and right every 1s. Just watch. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<section class="stage"><p class="mark" data-fx="pill-row-wordmark">STUDIO</p></section>
<p class="mark small" data-fx="pill-row-wordmark" data-fx-pill-row-wordmark="look: halo; amp: 0">STUDIO</p>
<p class="mark small" data-demo-remove data-fx="pill-row-wordmark" data-fx-pill-row-wordmark="rows: 5">BRAND</p>
<p class="mark small" data-fx="pill-row-wordmark"></p>
<template data-demo-late><p class="mark small" data-fx="pill-row-wordmark" data-fx-pill-row-wordmark="amp: .8">LATE</p></template>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
