<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ghost-map-pins — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .spacer { height: 60vh; display: grid; place-items: center; color: var(--kf-dim); }
  .area { padding-bottom: 10vh; }
  .ghost { left: 25%; width: 50%; margin-top: 12vh; z-index: -1; }
  .ghost svg, .real svg { display: block; width: 100%; height: auto; }
  .ghost path, .real path { fill: none; stroke: var(--kf-ink); stroke-width: 2; }
  .rows { position: relative; padding: 40vh 10% 0; display: grid; gap: 30vh; }
  .rows p { margin: 0; font: 600 28px/1.2 var(--kf-font-display); }
  .real { width: 50%; margin: 30vh auto 0; }
  .real .pin { position: absolute; width: 22px; height: 30px; }
  .real .pin svg path { fill: var(--kf-ink); stroke: none; }
  .real .pin svg circle { fill: var(--kf-accent); }
</style>
</head>
<body>
<p class="demo-hint"><b>ghost-map-pins</b> — Scroll down. On entering the section a blurred map sticks to the screen and follows, and when it reaches the real map a pin drops. Hover over the pin.</p>
<div class="spacer">Your previous page here</div>
<section class="area" data-fx="ghost-map-pins" data-fx-ghost-map-pins="ghost: .3">
  <div class="ghost" data-fx-part="ghost"><svg viewBox="0 0 400 420" aria-hidden="true"><path d="M110 20 L150 60 L240 150 L360 260 L280 330 L300 360 L170 400 L130 330 L40 290 L20 200 L80 190 L95 110 Z"/></svg></div>
  <div class="rows"><p>Your place name 1</p><p>Your place name 2</p><p>Your place name 3</p></div>
  <div class="real" data-fx-part="map">
    <svg data-fx-part="base" viewBox="0 0 400 420" aria-hidden="true"><path d="M110 20 L150 60 L240 150 L360 260 L280 330 L300 360 L170 400 L130 330 L40 290 L20 200 L80 190 L95 110 Z"/></svg>
    <a class="pin" data-fx-part="pin" href="#" style="left: 25%; top: 28%" aria-label="Place 1"><svg viewBox="0 0 22 30"><path d="M11 0a11 11 0 0 1 11 11c0 8-11 19-11 19S0 19 0 11A11 11 0 0 1 11 0z"/><circle cx="11" cy="11" r="4"/></svg></a>
    <a class="pin" data-fx-part="pin" href="#" style="left: 40%; top: 37%" aria-label="Place 2"><svg viewBox="0 0 22 30"><path d="M11 0a11 11 0 0 1 11 11c0 8-11 19-11 19S0 19 0 11A11 11 0 0 1 11 0z"/><circle cx="11" cy="11" r="4"/></svg></a>
    <a class="pin" data-fx-part="pin" href="#" style="left: 48%; top: 45%" aria-label="Place 3"><svg viewBox="0 0 22 30"><path d="M11 0a11 11 0 0 1 11 11c0 8-11 19-11 19S0 19 0 11A11 11 0 0 1 11 0z"/><circle cx="11" cy="11" r="4"/></svg></a>
    <a class="pin" data-fx-part="pin" href="#" style="left: 60%; top: 56%" aria-label="Place 4"><svg viewBox="0 0 22 30"><path d="M11 0a11 11 0 0 1 11 11c0 8-11 19-11 19S0 19 0 11A11 11 0 0 1 11 0z"/><circle cx="11" cy="11" r="4"/></svg></a>
  </div>
</section>
<div class="spacer">Your next section here</div>
<div class="spacer"></div>
<script>
// Late arrivals and removals — checks that fx-core attaches to an element added after 1s and detaches from an element removed after 2.5s
(() => {
  const src = document.querySelector('[data-fx~="ghost-map-pins"]');
  if (!src) return;
  const html = src.outerHTML.replace(/\sid="[^"]*"/g, "");
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => src.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
})();
</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
