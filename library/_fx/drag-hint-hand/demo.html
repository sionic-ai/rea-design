<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>drag-hint-hand — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .row { display: flex; flex-wrap: wrap; gap: 20px; padding: 30px 20px; }
  .hint { position: relative; width: 300px; height: 360px; border-radius: var(--kf-radius-md); background: var(--kf-contrast-bg); }
  .card { position: absolute; inset: 30px; display: grid; place-items: center; align-content: center; gap: 16px; border-radius: var(--kf-radius-md); background: var(--kf-surface); color: var(--kf-ink); text-align: center; pointer-events: none; }
  .icn { position: relative; width: 150px; height: 150px; }
  .icn svg { position: absolute; fill: none; stroke: var(--kf-ink); stroke-width: 2; }
  .icn .hand { left: 20px; top: 20px; width: 100px; }
  .icn .a { width: 24px; height: 24px; }
  .a1 { left: 0; top: 0; } .a2 { right: 0; top: 0; } .a3 { left: 0; bottom: 0; } .a4 { right: 0; bottom: 0; }
</style>
</head>
<body>
<p class="demo-hint"><b>drag-hint-hand</b> — After 1s a hand drags it for you. Press a panel for the next card, press once more to fold it away. <span style="color:var(--kf-dim)">(After 1s one more panel comes in, and one leaves 2.5s later)</span></p>
<div class="row">
  <div class="hint" data-fx="drag-hint-hand">
    <div class="card" data-fx-part="card">
      <div class="icn">
        <svg class="a a1" data-fx-part="arrow" viewBox="0 0 25 25"><path d="M2 12V2h10M2 2l12 12"/></svg>
        <svg class="a a2" data-fx-part="arrow" viewBox="0 0 25 25"><path d="M13 2h10v10M23 2L11 14"/></svg>
        <svg class="a a3" data-fx-part="arrow" viewBox="0 0 25 25"><path d="M2 13v10h10M2 23l12-12"/></svg>
        <svg class="a a4" data-fx-part="arrow" viewBox="0 0 25 25"><path d="M23 13v10H13M23 23L11 11"/></svg>
        <svg class="hand" data-fx-part="hand" viewBox="0 0 100 110"><path d="M30 60V18a7 7 0 0 1 14 0v34-12a7 7 0 0 1 14 0v14-8a7 7 0 0 1 14 0v12-4a7 7 0 0 1 14 0v22c0 22-12 34-32 34-14 0-22-6-30-18L14 64a7 7 0 0 1 11-9z"/></svg>
      </div>
      <p>Drag the screen to look around!</p>
    </div>
    <div class="card" data-fx-part="card"><p>Click a title to open the article!</p></div>
  </div>
  <div class="hint" data-fx="drag-hint-hand" data-fx-drag-hint-hand="delay: .3; step: .4" data-demo-remove>
    <div class="card" data-fx-part="card"><div class="icn"><svg class="hand" data-fx-part="hand" viewBox="0 0 100 110"><path d="M30 60V18a7 7 0 0 1 14 0v34-12a7 7 0 0 1 14 0v14-8a7 7 0 0 1 14 0v12-4a7 7 0 0 1 14 0v22c0 22-12 34-32 34-14 0-22-6-30-18L14 64a7 7 0 0 1 11-9z"/></svg></div><p>Fast Panel</p></div>
  </div>
  <template data-demo-late><div class="hint" data-fx="drag-hint-hand" data-fx-drag-hint-hand="close: 0"><div class="card is-active"><div class="icn"><svg class="hand" data-fx-part="hand" viewBox="0 0 100 110"><path d="M30 60V18a7 7 0 0 1 14 0v34-12a7 7 0 0 1 14 0v14-8a7 7 0 0 1 14 0v12-4a7 7 0 0 1 14 0v22c0 22-12 34-32 34-14 0-22-6-30-18L14 64a7 7 0 0 1 11-9z"/></svg></div><p>Cardless panel — collapses on click</p></div></div></template>
  <div class="hint" data-fx="drag-hint-hand"></div>
</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
