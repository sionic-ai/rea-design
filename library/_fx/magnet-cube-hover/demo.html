<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>magnet-cube-hover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 2; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .row { display: flex; flex-wrap: wrap; gap: 40px; padding: 80px 40px; }
  .btn { width: 175px; height: 51px; color: var(--kf-on-accent); text-decoration: none; }
  .btn.is-big { width: 360px; height: 203px; }
  .face { display: flex; align-items: flex-end; padding: 0 10px 6px; background: var(--kf-accent); font: 500 15px/1.2 var(--kf-font-display); }
  .face.is-back { background: var(--kf-contrast-bg); color: var(--kf-contrast-ink); }
</style>
</head>
<body>
<p class="demo-hint"><b>magnet-cube-hover</b> — Hover over the button and move around. It rolls 180° so the back face stands up and tilts toward the cursor. <span style="color:var(--kf-dim)">(After 1s one more comes in, and one drops out after 2s)</span></p>
<div class="row" id="row">
  <a href="#" class="btn" data-fx="magnet-cube-hover"><span><span class="face" data-fx-part="front">Online store</span><span class="face is-back" data-fx-part="back">Online store</span></span></a>
  <a href="#" class="btn is-big" data-fx="magnet-cube-hover" data-fx-magnet-cube-hover="tilt: 10; dur: 1; ease: power4.inOut"><span><span class="face wf-img" data-fx-part="front" data-label="Video first scene · 16:9"></span><span class="face is-back" data-fx-part="back">Play movie</span></span></a>
  <a href="#" class="btn" data-fx="magnet-cube-hover" data-demo-remove><span><span class="face" data-fx-part="front">Exit button</span><span class="face is-back" data-fx-part="back">Exit button</span></span></a>
  <a href="#" class="btn" data-fx="magnet-cube-hover">No plane</a>
</div>
<template data-demo-late><a href="#" class="btn" data-fx="magnet-cube-hover" data-fx-magnet-cube-hover="tilt: 0; lift: 0"><span><span class="face" data-fx-part="front">Late · Tilt 0</span><span class="face is-back" data-fx-part="back">Late · Tilt 0</span></span></a></template>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/CustomEase.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => document.getElementById("row").append(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2000);
</script>
</body>
</html>
