<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>step-highlight-row — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 12px/1.4 var(--kf-font-mono); padding: 40px 64px; letter-spacing: 0.1em; text-transform: uppercase; }
  .demo-hint { margin: 0 0 24px; text-transform: none; letter-spacing: 0; font-size: 13px; }
  .list { border-top: 1px solid var(--kf-line); }
  .row { display: grid; grid-template-columns: 2fr 5fr 1fr; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--kf-line); color: var(--kf-ink); }
  .row > :last-child { justify-self: end; }
  svg { width: 7px; height: 10px; fill: currentColor; }
</style>
</head>
<body>
<p class="demo-hint"><b>step-highlight-row</b> Hover over a row. In each cell a band lays out in steps and an arrow slides in from the left. <span style="color:var(--kf-dim)">(After 1s one more line comes in, and one leaves 2.5s later)</span></p>
<div class="list" data-list>
  <a class="row" href="#" data-fx="step-highlight-row"><span data-fx-part="icon"><svg viewBox="0 0 7 10"><path d="M0 0h2v2h2v2h2v2H4v2H2v2H0z"/></svg></span><span data-fx-part="label" data-key="first"><span>Source One</span></span><span data-fx-part="label" style="--fx-delay:45ms"><span>Your one-line article title here</span></span><span data-fx-part="label" style="--fx-delay:90ms"><span>View</span></span></a>
  <a class="row" href="#" data-fx="step-highlight-row" data-demo-remove><span data-fx-part="label" data-key="first"><span>Source Two</span></span><span data-fx-part="label" style="--fx-delay:45ms"><span>Line to Be Removed</span></span><span data-fx-part="label" style="--fx-delay:90ms"><span>View</span></span></a>
  <a class="row" href="#" data-fx="step-highlight-row" style="--fx-hl: var(--kf-accent); --fx-dur: .5s"><span data-fx-part="label" data-key="first"><span>Source Three</span></span><span data-fx-part="label" style="--fx-delay:45ms"><span>Accent color band · .5s</span></span><span data-fx-part="label" style="--fx-delay:90ms"><span>View</span></span></a>
</div>
<a href="#" data-fx="step-highlight-row"></a>
<script src="../fx-core.js"></script>
<script>
setTimeout(() => { document.querySelector("[data-list]").insertAdjacentHTML("beforeend", '<a class="row" href="#" data-fx="step-highlight-row"><span data-fx-part="label" data-key="first"><span>Late Source</span></span><span data-fx-part="label" style="--fx-delay:45ms"><span>Late row</span></span><span data-fx-part="label" style="--fx-delay:90ms"><span>View</span></span></a>'); }, 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
