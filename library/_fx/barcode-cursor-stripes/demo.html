<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>barcode-cursor-stripes — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .row { display: flex; gap: 2rem; padding: 2rem; flex-wrap: wrap; }
  .box { width: min(40rem, 90vw); height: 60vh; }
  .tall { width: 18rem; aspect-ratio: .64; }
  .wf-img { height: 100%; }
</style>
</head>
<body>
<p class="demo-hint"><b>barcode-cursor-stripes</b> — Move the mouse over the left photo. At each cursor spot three blue bars appear and vanish after 2s. The right side is a self-playing version. <span style="color:var(--kf-dim)">(After 1s one more panel comes in, and one leaves 2.5s later)</span></p>
<div class="row">
  <div class="box" data-fx="barcode-cursor-stripes"><div class="wf-img" data-label="Face close-up · landscape"></div></div>
  <div class="tall" data-fx="barcode-cursor-stripes" data-fx-barcode-cursor-stripes="look: auto"><div class="wf-img" data-label="Vertical portrait photo"></div></div>
  <div class="tall" data-fx="barcode-cursor-stripes" data-demo-remove><div class="wf-img" data-label="Dropped Panel"></div></div>
</div>
<template data-demo-late><div class="tall" data-fx="barcode-cursor-stripes" data-fx-barcode-cursor-stripes="rows: 5; max: 40" style="--fx-color: var(--kf-ink)"><div class="wf-img" data-label="Late-entering Panel · Five lines"></div></div></template>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => { document.querySelector(".row").append(t.content.cloneNode(true)); t.remove(); }), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); }, 2500);
</script>
</body>
</html>
