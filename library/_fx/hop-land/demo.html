<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hop-land — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .row { display: flex; align-items: flex-end; gap: 24px; height: 40vh; padding: 0 40px 0; border-bottom: 2px solid var(--kf-line); }
  .row + .gap { height: 70vh; }
  .thing { display: block; width: 90px; aspect-ratio: 1.4; border-radius: var(--kf-radius-md); background: var(--kf-accent); }
  .thing.is-b { width: 60px; aspect-ratio: 0.8; background: var(--kf-ink); border-radius: 30px 30px 8px 8px; }
  button { margin: 20px 40px; padding: 8px 14px; border: 1px solid var(--kf-line); border-radius: var(--kf-radius-sm); background: var(--kf-surface); cursor: pointer; }
</style>
</head>
<body>
<p class="demo-hint"><b>hop-land</b> — When opened, the first line drops in with a ”tok, tok”. Scroll down for the second line, and press the button to make the third bounce again. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<section class="row">
  <i class="thing" data-fx="hop-land" data-fx-hop-land="on: load"></i>
  <i class="thing is-b" data-fx="hop-land" data-fx-hop-land="on: load; delay: .2"></i>
  <i class="thing" data-fx="hop-land" data-fx-hop-land="on: load; delay: .4" data-demo-remove></i>
  <template data-demo-late><i class="thing is-b" data-fx="hop-land" data-fx-hop-land="on: load; from: -80; again: -16"></i></template>
</section>
<div class="gap"></div>
<section class="row">
  <i class="thing" data-fx="hop-land"></i>
  <i class="thing is-b" data-fx="hop-land" data-fx-hop-land="delay: .08"></i>
  <i class="thing" data-fx="hop-land" data-fx-hop-land="delay: .16; from: -1.8vw; again: -0.6vw"></i>
  <i class="thing is-b" id="again" data-fx="hop-land" data-fx-hop-land="on: event"></i>
</section>
<button type="button" onclick="document.getElementById('again').dispatchEvent(new CustomEvent('fx:play'))">Bounce again</button>
<div class="gap"></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
