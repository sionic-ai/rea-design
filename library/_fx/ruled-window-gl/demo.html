<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ruled-window-gl — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 2; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .row { position: relative; display: flex; gap: 20px; flex-wrap: wrap; padding: 40px 20px; }
  .frame { width: 320px; height: 400px; }
  .frame.wide { width: 560px; height: 340px; }
  .frame .wf-img { position: absolute; inset: 0; height: 100%; }
  .demo-spacer { height: 40vh; display: grid; place-items: center; color: var(--kf-dim); }
</style>
</head>
<body>
<p class="demo-hint"><b>ruled-window-gl</b> — Move the mouse over the photo. A grid window opens where it passed and the photo bends in waves.</p>
<section class="row" id="row">
  <div class="frame" data-fx="ruled-window-gl"><div class="wf-img" data-fx-part="picture" data-label="Person full body · Black and white · Portrait 4:5"></div></div>
  <div class="frame wide" data-fx="ruled-window-gl" data-fx-ruled-window-gl="cell: 32; bend: 40"><div class="wf-img" data-fx-part="picture" data-label="Still life · white background · landscape 16:10"></div></div>
  <div class="frame" id="gone" data-fx="ruled-window-gl"><div class="wf-img" data-fx-part="picture" data-label="Deleting soon"></div></div>
</section>
<div class="demo-spacer">Body spot — even as you scroll down, the panel follows the photo</div>
<section class="row"><div class="frame" data-fx="ruled-window-gl"><div class="wf-img" data-fx-part="picture" data-label="Bottom photo · Portrait 4:5"></div></div></section>
<div class="demo-spacer"></div>
<script>
  setTimeout(() => { const d = document.createElement("div"); d.className = "frame"; d.dataset.fx = "ruled-window-gl"; d.innerHTML = '<div class="wf-img" data-fx-part="picture" data-label="Photo attached after 1s"></div>'; document.getElementById("row").append(d); }, 1000);
  setTimeout(() => document.getElementById("gone").remove(), 1500);
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../_vendor/ogl@1.0.11/ogl.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
