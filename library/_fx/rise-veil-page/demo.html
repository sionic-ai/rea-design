<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rise-veil-page — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { min-height: 90vh; padding: 48px 20px; display: grid; gap: 16px; align-content: start; }
  .demo a { color: var(--kf-accent-text); text-decoration: underline; }
  .demo .card { height: 40vh; border-radius: var(--kf-radius-md); background: var(--kf-surface); border: 1px solid var(--kf-line); }
</style>
</head>
<body>
<p class="demo-hint"><b>rise-veil-page</b> — Click a link and the curtain rises from the bottom, on the reopened page it lifts upward.</p>
<main class="demo" data-fx="rise-veil-page"><a href="demo.html?again">Reopen the same demo</a><div class="card"></div><div class="card"></div></main>
<template data-demo-late><main class="demo" data-fx="rise-veil-page" data-fx-rise-veil-page="dur: .6; shift: 30vh"><a href="demo.html">Short Swipe</a></main></template>
<main class="demo" data-demo-remove data-fx="rise-veil-page"><a href="demo.html">Panel to Be Removed</a></main>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
