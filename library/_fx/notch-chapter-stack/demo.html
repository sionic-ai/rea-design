<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>notch-chapter-stack — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-spacer { height: 60vh; display: grid; place-items: center; color: var(--kf-dim); }
  .demo-ch { min-height: 90vh; padding: 80px 40px; font: 700 48px/1 var(--kf-font-display); }
  .demo-ch.is-long { min-height: 150vh; }
  .demo-ch:nth-child(2) { background: var(--kf-accent); color: var(--kf-on-accent); }
  .demo-ch:nth-child(3) { background: var(--kf-contrast-bg); color: var(--kf-contrast-ink); }
  .demo-ch:nth-child(4) { background: var(--kf-accent-soft); }
</style>
</head>
<body>
<p class="demo-hint"><b>notch-chapter-stack</b> — Scroll down and a section sticks while the next one slides up over it. The covered section darkens, and the rounded-corner notch is the previous section’s color.</p>
<div class="demo-spacer">Scroll down ↓</div>
<div data-fx="notch-chapter-stack" data-fx-notch-chapter-stack="look: flat-first">
  <section class="demo-ch" data-fx-part="chapter">Section One</section>
  <section class="demo-ch is-long" data-fx-part="chapter">Section two — Taller than the screen</section>
  <section class="demo-ch" data-fx-part="chapter">Section Three</section>
  <section class="demo-ch" data-fx-part="chapter">Section Four</section>
</div>
<div class="demo-spacer"></div>
<script>
(() => {
  const src = document.querySelector('[data-fx~="notch-chapter-stack"]');
  if (!src) return;
  const html = src.outerHTML;
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => src.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical group comes in (a late arrival), and after 2.5s one is removed (detach).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
