<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>slice-burst-intro — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: relative; z-index: 2000; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .list { display: grid; grid-template-columns: 1fr 1fr; gap: 0 80px; max-width: 1100px; margin: 80px auto; padding: 0 20px; }
  .list li { display: flex; align-items: center; gap: 18px; padding: 28px 0; border-bottom: 1px solid var(--kf-line); font-size: 28px; }
  .list svg { width: 40px; height: 40px; flex: none; }
  .art { fill: var(--kf-accent); }
  .art-soft { fill: var(--kf-accent-text); }
</style>
</head>
<body>
<p class="demo-hint"><b>slice-burst-intro</b> Reload. The big image bursts, four pieces fly off and settle in front of the list, and the white veil lifts.</p>
<section data-fx="slice-burst-intro">
  <div data-fx-part="veil"></div>
  <div data-fx-part="burst"><svg viewBox="0 0 100 100" aria-hidden="true"><circle class="art" cx="50" cy="54" r="40"/><path class="art-soft" d="M50 14c6-10 18-12 24-8-4 8-14 12-24 8z"/></svg></div>
  <ul class="list">
    <li><svg data-fx-part="slice" style="transform: rotate(22deg)" viewBox="0 0 40 40" aria-hidden="true"><path class="art" d="M20 4 34 30H6z"/></svg>Menu First</li>
    <li><svg data-fx-part="slice" viewBox="0 0 40 40" aria-hidden="true"><path class="art" d="M20 4 34 30H6z"/></svg>Menu Two</li>
    <li><svg data-fx-part="slice" style="transform: scaleX(-1) rotate(12deg)" viewBox="0 0 40 40" aria-hidden="true"><path class="art" d="M20 4 34 30H6z"/></svg>Menu Three</li>
    <li><svg data-fx-part="slice" style="transform: rotate(22deg)" viewBox="0 0 40 40" aria-hidden="true"><path class="art" d="M20 4 34 30H6z"/></svg>Menu Four</li>
  </ul>
</section>
<section data-fx="slice-burst-intro" class="second"><ul class="list"><li>List with no pieces — skipped silently</li></ul></section>
<script>
// Late arrivals and removals — 1s later one more identical sheet comes in (late arrival), and 2.5s later the second sheet is removed (teardown)
(() => {
  const src = document.querySelector('[data-fx~="slice-burst-intro"]');
  setTimeout(() => { const t = document.createElement("template"); t.innerHTML = src.outerHTML; document.body.append(t.content.firstElementChild); }, 1000);
  setTimeout(() => document.querySelector(".second")?.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s one more of the same section comes in, and after 2.5s one drops out.");
})();
</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
