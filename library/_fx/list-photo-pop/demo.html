<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>list-photo-pop — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { display: grid; gap: 80px; padding: 160px 20px 80px; justify-items: center; overflow-x: clip; }
  .demo-list { display: flex; flex-direction: column; align-items: center; gap: 20px; text-align: center; }
  .demo-list h3 { font: 800 64px/1 var(--kf-font-display); text-transform: uppercase; }
  .demo-list [data-fx-part="photo"] { width: 160px; height: 230px; border-radius: 20px; overflow: hidden; }
  .demo-list .wf-img { height: 100%; }
</style>
</head>
<body>
<p class="demo-hint"><b>list-photo-pop</b> — Every 4s the next row lights up and photos pop out at both ends. Hover a row to stop on it. <span style="color:var(--kf-dim)">(One more list comes in after 1s, and one drops out after 2.5s)</span></p>
<main class="demo">
  <div class="demo-list" data-fx="list-photo-pop">
    <div data-fx-part="item"><h3 data-fx-part="label">Benefit One</h3><div data-fx-part="photo"><div class="wf-img" data-label="Smiling Team Member · Portrait"></div></div><div data-fx-part="photo"><div class="wf-img" data-label="Event Booth · Portrait"></div></div></div>
    <div data-fx-part="item"><h3 data-fx-part="label">Benefit 2</h3><div data-fx-part="photo"><div class="wf-img" data-label="Rest area · Portrait"></div></div><div data-fx-part="photo"><div class="wf-img" data-label="Dining Together · Portrait"></div></div></div>
    <div data-fx-part="item"><h3 data-fx-part="label">Benefit 3</h3><div data-fx-part="photo"><div class="wf-img" data-label="Workspace · Portrait"></div></div></div>
  </div>
  <div class="demo-list" data-fx="list-photo-pop" data-fx-list-photo-pop="every: 1.5; dim: .15" data-demo-remove>
    <div data-fx-part="item"><h3 data-fx-part="label">Quick one</h3></div>
    <div data-fx-part="item"><h3 data-fx-part="label">Fast Two</h3></div>
  </div>
  <div class="demo-list" data-fx="list-photo-pop"><p>Plain list without lines (attaches nothing)</p></div>
  <template data-demo-late><div class="demo-list" data-fx="list-photo-pop"><div data-fx-part="item"><h3 data-fx-part="label">Late One</h3></div><div data-fx-part="item"><h3 data-fx-part="label">Late two</h3></div></div></template>
</main>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
