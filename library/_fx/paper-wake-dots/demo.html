<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>paper-wake-dots — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); min-height: 100vh; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-paper { position: fixed; inset: 0; z-index: 0; }
  .demo-box { position: relative; height: 40vh; margin: 20px; border: 1px solid var(--kf-line); border-radius: var(--kf-radius-md); }
</style>
</head>
<body>
<p class="demo-hint"><b>paper-wake-dots</b> Move the mouse over the screen. Where it passed, halftone marks spread and fade, and pressing spreads a ring.</p>
<div class="demo-paper" data-fx="paper-wake-dots"></div>
<div class="demo-box" data-fx="paper-wake-dots" data-fx-paper-wake-dots="pitch: 8; amount: .6"></div>
<script>
(() => {
  const src = document.querySelector(".demo-box");
  const html = src.outerHTML;
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => document.body.append(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical panel comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
