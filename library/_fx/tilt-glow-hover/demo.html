<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tilt-glow-hover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { padding: 60px 20px; display: grid; gap: 40px; justify-items: center; }
  .btn { display: inline-flex; align-items: center; gap: 10px; padding: 16px 28px; overflow: hidden; border-radius: var(--kf-radius-sm); background: var(--kf-accent); color: var(--kf-on-accent); text-decoration: none; }
  .btn span { position: relative; z-index: 1; }
  .wide { width: min(90vw, 760px); justify-content: space-between; padding: 60px 40px; background: var(--kf-ink); color: var(--kf-bg); }
</style>
</head>
<body>
<p class="demo-hint"><b>tilt-glow-hover</b> — Move the mouse over the button. It tilts slowly and floats up while the light follows. <span style="color:var(--kf-dim)">(After 1s one more button comes in, and after 2.5s one drops out)</span></p>
<section class="demo">
  <a class="btn" data-fx="tilt-glow-hover" href="#"><i data-fx-part="glow"></i><span>Your booking button here</span></a>
  <a class="btn wide" data-fx="tilt-glow-hover" data-fx-tilt-glow-hover="x: 0; y: 0.1; z: 2; ry: 2" href="#"><i data-fx-part="glow"></i><span>Your wide banner button here</span><span>→</span></a>
  <a class="btn" data-demo-remove data-fx="tilt-glow-hover" href="#"><span>Excluded button (no light)</span></a>
  <template data-demo-late><a class="btn" data-fx="tilt-glow-hover" data-fx-tilt-glow-hover="ry: 0; back: 1" href="#"><i data-fx-part="glow"></i><span>Late-arrived Button</span></a></template>
</section>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
