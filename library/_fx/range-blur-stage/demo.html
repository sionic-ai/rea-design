<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>range-blur-stage — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .fake-media { background: repeating-linear-gradient(45deg, var(--kf-raised) 0 24px, var(--kf-line) 24px 48px); }
  main { position: relative; z-index: 1; }
  .spacer { height: 150vh; }
  .poem { height: 120vh; display: grid; place-items: center; color: var(--kf-contrast-ink); font: 700 28px/1.6 var(--kf-font-sans); text-align: center; }
  .stop { height: 100vh; }
</style>
</head>
<body>
<p class="demo-hint"><b>range-blur-stage</b> — Scroll down. Past the middle of the first gap the pattern stage blurs and darkens, and after the text section only the blur clears. <span style="color:var(--kf-dim)">(One more stage comes in after 1s, and one drops out after 2.5s)</span></p>
<div data-fx="range-blur-stage" data-fx-range-blur-stage="from: .spacer; to: .stop">
  <div class="fake-media" data-fx-part="media"></div>
  <div data-fx-part="veil"></div>
</div>
<div data-demo-remove data-fx="range-blur-stage" data-fx-range-blur-stage="from: .spacer; to: .stop" style="--fx-z: -1"><div class="fake-media" data-fx-part="media"></div></div>
<template data-demo-late><div data-fx="range-blur-stage" data-fx-range-blur-stage="start: 2; blur: 12; keep-veil: false" style="--fx-z: -2"><div class="fake-media" data-fx-part="media"></div><div data-fx-part="veil"></div></div></template>
<main>
  <div class="spacer"></div>
  <section class="poem"><p>Your one-line slogan goes here.<br>Text passes over a blurred stage.</p></section>
  <div class="stop"></div>
</main>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
