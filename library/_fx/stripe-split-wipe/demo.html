<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>stripe-split-wipe — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: sticky; top: 0; z-index: 100; margin: 0; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .pad { height: 60vh; display: grid; place-items: center; }
  .panel { height: 100vh; display: grid; place-items: center; background: var(--kf-surface); font: var(--kf-weight-display) 40px/1 var(--kf-font-display); }
</style>
</head>
<body>
<p class="demo-hint"><b>stripe-split-wipe</b> — Scroll down. With the section pinned, five strips spread from the bottom and cover it.</p>
<div class="pad">Downward</div>
<section class="panel" data-fx="stripe-split-wipe">Section covered by a solid-color band</section>
<div class="pad">Once more</div>
<section class="panel" data-fx="stripe-split-wipe" data-fx-stripe-split-wipe="look: gradient; length: 1.6">Section covered by a gradient band</section>
<div class="pad">Footer</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script>
// Late arrivals and removals — fx-core also attaches to a section added after 1 second, and checks that a section removed after 2.5 seconds gets detached
(() => {
  gsap.registerPlugin(ScrollTrigger);
  const src = document.querySelector(".panel");
  const html = src.outerHTML;
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const last = document.querySelector(".pad:last-of-type");
  const gone = make("gone");
  last.after(gone);
  setTimeout(() => { last.after(make("late")); ScrollTrigger.refresh(); }, 1000);
  setTimeout(() => { gone.remove(); ScrollTrigger.refresh(); }, 2500);
  document.querySelector(".demo-hint").append(" · After 1s, one more sheet comes in (the late one), and after 2.5s one drops out (the removal).");
})();
</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
