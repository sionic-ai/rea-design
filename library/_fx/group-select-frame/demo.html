<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>group-select-frame — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .board { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; align-items: start; row-gap: 60px; padding: 60px 20px; }
  .board a { position: relative; display: block; }
  .board .lab { position: absolute; bottom: 100%; left: 0; padding-bottom: 8px; font-size: 13px; color: var(--kf-dim); white-space: nowrap; }
  .board .wf-img { aspect-ratio: 4 / 3; }
  .board .tall { aspect-ratio: 3 / 4; }
</style>
</head>
<body>
<p class="demo-hint"><b>group-select-frame</b> — Hover over a cell. Cells of the same job in each row are grouped by a blue selection frame. <span style="color:var(--kf-dim)">(After 1s one more panel comes in, and one leaves 2.5s later)</span></p>
<section class="board" data-fx="group-select-frame">
  <a href="#a" data-fx-part="tile" data-key="a"><span class="lab" data-fx-part="label">project a</span><div class="wf-img" data-label="a 1"></div></a>
  <a href="#a" data-fx-part="tile" data-key="a"><div class="wf-img tall" data-label="a 2"></div></a>
  <a href="#a" data-fx-part="tile" data-key="a"><div class="wf-img" data-label="a 3"></div></a>
  <a href="#b" data-fx-part="tile" data-key="b"><span class="lab" data-fx-part="label">project b</span><div class="wf-img tall" data-label="b 1"></div></a>
  <a href="#b" data-fx-part="tile" data-key="b"><div class="wf-img" data-label="b 2"></div></a>
  <a href="#b" data-fx-part="tile" data-key="b"><div class="wf-img" data-label="b 3"></div></a>
  <a href="#b" data-fx-part="tile" data-key="b"><div class="wf-img" data-label="b 4 · Next line"></div></a>
  <a href="#c" data-fx-part="tile" data-key="c"><span class="lab" data-fx-part="label">project c</span><div class="wf-img" data-label="c 1"></div></a>
</section>
<section class="board" data-fx="group-select-frame" data-demo-remove>
  <a href="#d" data-fx-part="tile" data-key="d"><span class="lab" data-fx-part="label">Panel to Be Removed</span><div class="wf-img" data-label="d 1"></div></a>
</section>
<template data-demo-late>
  <section class="board" data-fx="group-select-frame">
    <a href="#e" data-fx-part="tile" data-key="e"><span class="lab" data-fx-part="label">Late panel</span><div class="wf-img" data-label="e 1"></div></a>
    <a href="#e" data-fx-part="tile" data-key="e"><div class="wf-img" data-label="e 2"></div></a>
  </section>
</template>
<section class="board" data-fx="group-select-frame"></section>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
