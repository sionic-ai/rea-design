<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>inner-scale-hover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { padding: 48px 20px; }
  .demo-spacer { height: 90vh; display: grid; place-items: center; color: var(--kf-dim); }

  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; max-width: 1000px; }
  .card { display: block; position: relative; aspect-ratio: 505 / 615; }
  [data-fx-part="inner"] { position: absolute; inset: 0; border-radius: 16px; background: var(--kf-raised); border: 1px solid var(--kf-line); display: grid; place-items: end start; padding: 14px; }
</style>
</head>
<body>
<p class="demo-hint"><b>inner-scale-hover</b> — Hover over the card. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<section class="demo"><div class="grid">
  <a data-demo-remove class="card" data-fx="inner-scale-hover" href="#"><div data-fx-part="inner">Case 01</div></a><a class="card" data-fx="inner-scale-hover" href="#"><div data-fx-part="inner">Case 01</div></a><template data-demo-late><a class="card" data-fx="inner-scale-hover" href="#"><div data-fx-part="inner">Case 01</div></a></template>
  <a class="card" data-fx="inner-scale-hover" href="#"><div data-fx-part="inner">Case 02</div></a>
  <a class="card" data-fx="inner-scale-hover" style="--fx-scale:1.06" href="#"><div data-fx-part="inner">Coming Closer</div></a>
</div></section>

<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); window.ScrollTrigger?.refresh(); }, 2500);
</script>
</body>
</html>
