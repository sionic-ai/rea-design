<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>zoom-fade-in — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .spacer { height: 70vh; display: grid; place-items: center; color: var(--kf-dim); }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; padding: 0 24px 80px; }
  .card [data-fx] { aspect-ratio: 1; }
  .card .wf-img { height: 100%; }
  .card h3 { margin-top: 12px; font-size: 15px; }
</style>
</head>
<body>
<p class="demo-hint"><b>zoom-fade-in</b> — Scroll down — when the photo cell enters the screen it settles from 1.1x over 1s as it appears (once only).</p>
<div class="spacer">Downward</div>
<div class="grid" id="grid">
  <div class="card"><div data-fx="zoom-fade-in"><div data-fx-part="media" class="wf-img" data-label="Photo 1 · Square"></div></div><h3>Your title 1 here</h3></div>
  <div class="card"><div data-fx="zoom-fade-in"><div class="wf-img" data-label="Photo 2 · no child marker"></div></div><h3>Your title 2 here</h3></div>
  <div class="card" data-demo-remove><div data-fx="zoom-fade-in"><div data-fx-part="media" class="wf-img" data-label="Photo 3 · Drops out after 2.5s"></div></div><h3>Your title 3 here</h3></div>
  <div class="card"><div data-fx="zoom-fade-in" style="--fx-scale: 1.3; --fx-dur: 2s"><div data-fx-part="media" class="wf-img" data-label="Photo 4 · 1.3x 2s"></div></div><h3>Your title 4 here</h3></div>
  <div class="card"><div data-fx="zoom-fade-in" style="--fx-scale: 1.04; --fx-dur: 2s; --fx-delay: 1s; --fx-ease: cubic-bezier(.61,1,.88,1)"><i data-fx-part="swatch"></i><div data-fx-part="media" class="wf-img" data-label="Photo 5 · gray box first"></div></div><h3>Your Title 5 · placeholder box here</h3></div>
  <div class="card"><div data-fx="zoom-fade-in"></div><h3>Blank cell</h3></div>
</div>
<template data-demo-late><div class="card"><div data-fx="zoom-fade-in"><div data-fx-part="media" class="wf-img" data-label="Late-arriving photo"></div></div><h3>Your title 6 here</h3></div></template>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => { document.getElementById("grid").append(t.content.cloneNode(true)); t.remove(); }), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
