<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cloud-wrap-drift — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .sky { position: relative; height: 420px; margin: 40px; overflow: hidden; border-radius: var(--kf-radius-lg); background: linear-gradient(0deg, var(--kf-surface), var(--kf-accent-soft)); }
  .cloud { position: absolute; height: 48px; border-radius: 48px; background: var(--kf-surface); box-shadow: var(--kf-shadow-soft); }
</style>
</head>
<body>
<p class="demo-hint"><b>cloud-wrap-drift</b> — Leave it as is and the clouds drift left and vanish, then flow back in from the right (the demo is sped up to 8 · 12 · 16s). <span style="color:var(--kf-dim)">(After 1s one more cloud comes in, and after 2.5s one drops out)</span></p>
<div class="sky">
  <span class="cloud" data-fx="cloud-wrap-drift" style="left: 40%; top: 40px; width: 220px; --fx-dur: 8s"></span>
  <span class="cloud" data-fx="cloud-wrap-drift" style="left: 70%; top: 160px; width: 320px; --fx-dur: 12s"></span>
  <span class="cloud" data-fx="cloud-wrap-drift" style="left: 10%; top: 280px; width: 160px; --fx-dur: 16s" data-demo-remove></span>
  <span data-late-slot></span>
</div>
<script src="../fx-core.js"></script>
<script>
setTimeout(() => document.querySelector("[data-late-slot]").outerHTML = '<span class="cloud" data-fx="cloud-wrap-drift" style="left: 55%; top: 330px; width: 120px; --fx-dur: 10s"></span>', 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
