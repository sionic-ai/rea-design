<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cursor-drop-shapes — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-foot { height: 100vh; padding: 40px 20px; background: var(--kf-raised); --fx-shape: var(--kf-surface); }
  .demo-foot h2 { font: 700 32px/1.2 var(--kf-font-display); }
</style>
</head>
<body>
<p class="demo-hint"><b>cursor-drop-shapes</b> Move the mouse widely over the panel below. A white shape drops every 200px.</p>
<footer class="demo-foot" data-fx="cursor-drop-shapes" id="src"><h2>Your footer title here</h2><p>Shapes are piled up on the floor.</p></footer>
<script>
(() => {
  const src = document.getElementById("src");
  const html = src.outerHTML.replace(/\sid="[^"]*"/g, "");
  const make = () => { const t = document.createElement("template"); t.innerHTML = html; return t.content.firstElementChild; };
  const gone = make();
  src.after(gone);
  setTimeout(() => src.after(make()), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s, one more panel comes in (the late one), and after 2.5s one drops out (the removal).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../_vendor/matter-js@0.20.0/matter.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
