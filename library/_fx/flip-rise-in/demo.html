<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>flip-rise-in — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { display: flex; flex-wrap: wrap; gap: 40px; padding: 48px 20px; align-items: flex-start; }
  .demo-spacer { height: 90vh; display: grid; place-items: center; color: var(--kf-dim); }
  .demo h2 { font-size: 44px; font-weight: 800; }
  .demo .card { display: grid; place-items: center; width: 220px; height: 220px; border-radius: var(--kf-radius-md); background: var(--kf-accent); color: var(--kf-on-accent); font-weight: 700; }
</style>
</head>
<body>
<p class="demo-hint"><b>flip-rise-in</b> — Scroll down and the panel rises flipped, turning to its front face as it settles. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<div class="demo-spacer">Scroll down</div><section class="demo" data-fx="flip-rise-in"><a class="card" data-fx-part="item" href="#">Button 1</a><a class="card" data-fx-part="item" href="#">Button 2</a></section><section class="demo" data-fx="flip-rise-in" data-demo-remove><a class="card" data-fx-part="item" href="#">Omitted button</a></section><template data-demo-late><section class="demo" data-fx="flip-rise-in"><a class="card" data-fx-part="item" href="#">Late-arrived Button</a></section></template><section class="demo" data-fx="flip-rise-in"></section><div class="demo-spacer"></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../../../_shared/vendor/gsap/CustomEase.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); window.ScrollTrigger?.refresh(); }, 2500);
</script>
</body>
</html>
