<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>skew-chars-in — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { padding: 48px 20px; display: grid; gap: 48px; }
  h2 { font: var(--kf-weight-display) 80px/1 var(--kf-font-display); }
  .demo-spacer { height: 70vh; display: grid; place-items: center; color: var(--kf-dim); }
</style>
</head>
<body>
<p class="demo-hint"><b>skew-chars-in</b> — When the title enters the screen, the letters stand straight up from their slanted, bent positions. Scroll down. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<section class="demo">
  <h2 data-fx="skew-chars-in" data-fx-skew-chars-in="on: load">Story</h2>
  <p data-fx="skew-chars-in" data-fx-skew-chars-in="on: load; look: soft">A one-line greeting message goes here</p>
  <div class="demo-spacer">↓</div>
  <h2 data-fx="skew-chars-in">History</h2>
  <h2 data-demo-remove data-fx="skew-chars-in">Title to Be Removed</h2>
  <template data-demo-late><h2 data-fx="skew-chars-in" data-fx-skew-chars-in="each: 0.06">Late title</h2></template>
  <div class="demo-spacer">Footer</div>
</section>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
gsap.registerPlugin(ScrollTrigger);
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); ScrollTrigger.refresh(); }, 2500);
</script>
</body>
</html>
