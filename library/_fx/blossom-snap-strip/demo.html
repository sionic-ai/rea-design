<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>blossom-snap-strip — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="../../_vendor/blossom-carousel-core@0.2.0/blossom-carousel-core.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 500 15px/1.45 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { padding: 48px 0; container-type: inline-size; overflow: hidden; }
  .demo figure { padding: 8px 0 20px; }
  .demo .wf-img { aspect-ratio: 2079 / 1290; border: 0; border-radius: 8px; }
  .demo figcaption { max-width: 36ch; margin-top: .86em; font-size: .75em; }
</style>
</head>
<body>
<p class="demo-hint"><b>blossom-snap-strip</b> — Grab the strip with the mouse and drag. It slides with inertia and snaps to the center of the nearest cell.</p>
<section class="demo">
  <div data-fx="blossom-snap-strip">
    <figure><div class="wf-img" data-label="Result screen 1 · Landscape 2079:1290"></div><figcaption>Your one or two lines on what this screen shows here.</figcaption></figure>
    <figure><div class="wf-img" data-label="Result screen 2 · Landscape 2079:1290"></div><figcaption>Your step and year first, then what changed.</figcaption></figure>
    <figure><div class="wf-img" data-label="Result screen 3 · Landscape 2079:1290"></div><figcaption>Your description, one line.</figcaption></figure>
    <figure><div class="wf-img" data-label="Result screen 4 · Landscape 2079:1290"></div><figcaption>Your two-line description of where it was used, kept short.</figcaption></figure>
  </div>
</section>
<script>
(() => {
  const src = document.querySelector('[data-fx~="blossom-snap-strip"]');
  if (!src) return;
  const html = src.outerHTML;
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => src.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical one comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="../../_vendor/blossom-carousel-core@0.2.0/blossom-carousel-core.umd.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
