<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>circle-pill-panel — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); min-height: 200vh; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .menu { --fx-top: 72px; }
  .menu.is-late { --fx-top: 140px; --fx-open-w: 300px; --fx-open-h: 260px; }
  .menu svg { width: 16px; }
  .top { display: flex; justify-content: flex-end; height: 40px; }
  .x { display: grid; place-items: center; width: 40px; height: 40px; }
  .links { display: flex; flex-direction: column; gap: 28px; margin: 30px 24px 0; font: 600 28px/0.8 var(--kf-font-display); }
  .links a { padding-bottom: 20px; border-bottom: 1px solid var(--kf-line); }
  @media (max-width: 809px) { .menu { --fx-right: 20px; --fx-open-w: calc(100vw - 40px); --fx-open-h: 480px; } }
</style>
</head>
<body>
<p class="demo-hint"><b>circle-pill-panel</b> — Click the black circle at top right. It becomes a pill sideways, then a panel downward, and folds with × · Esc · outside click. <span style="color:var(--kf-dim)">(After 1s one more circle comes in, and one leaves 2.5s later)</span></p>
<div class="menu" data-fx="circle-pill-panel">
  <div data-fx-part="bg"></div>
  <div data-fx-part="toggle" role="button" tabindex="0" aria-label="Open Menu"><svg viewBox="0 0 16 11" fill="none" stroke="currentColor" stroke-width="1.67"><path d="M0 .8h16M0 5.5h16M0 10.2h16"/></svg></div>
  <div data-fx-part="panel">
    <div class="top"><div class="x" data-fx-part="close" role="button" tabindex="0" aria-label="Close"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.67"><path d="M2 2l12 12M14 2 2 14"/></svg></div></div>
    <nav class="links"><a data-fx-part="item" href="#">Menu First</a><a data-fx-part="item" href="#">Menu Two</a><a data-fx-part="item" href="#">Menu Three</a><a data-fx-part="item" href="#">Menu Four</a></nav>
  </div>
</div>
<div class="menu" data-fx="circle-pill-panel" data-demo-remove style="--fx-top: 210px">
  <div data-fx-part="bg"></div>
  <div data-fx-part="toggle" role="button" tabindex="0" aria-label="Menu to be removed soon"><svg viewBox="0 0 16 11" fill="none" stroke="currentColor" stroke-width="1.67"><path d="M0 .8h16M0 5.5h16M0 10.2h16"/></svg></div>
</div>
<template data-demo-late>
  <div class="menu is-late" data-fx="circle-pill-panel" data-fx-circle-pill-panel="wait: 0; dur: .4">
    <div data-fx-part="bg"></div>
    <div data-fx-part="toggle" role="button" tabindex="0" aria-label="Small menu"><svg viewBox="0 0 16 11" fill="none" stroke="currentColor" stroke-width="1.67"><path d="M0 .8h16M0 5.5h16M0 10.2h16"/></svg></div>
  </div>
</template>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/CustomEase.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
