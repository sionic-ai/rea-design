<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>char-fade-ripple-hover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { padding: 12px 20px; border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .stage { display: flex; gap: 80px; align-items: flex-start; padding: 80px 40px; }
  .en { display: grid; gap: 12px; list-style: none; padding: 0; margin: 0; }
  .en a { color: var(--kf-ink); font: 300 13px/1.2 var(--kf-font-sans); letter-spacing: .2em; text-decoration: none; }
  .ja { display: flex; flex-direction: row-reverse; gap: 16px; height: 160px; list-style: none; padding: 0; margin: 0; }
  .ja a { writing-mode: vertical-rl; color: var(--kf-ink); font: 300 18px/1 var(--kf-font-display); letter-spacing: .2em; text-decoration: none; }
</style>
</head>
<body>
<p class="demo-hint"><b>char-fade-ripple-hover</b> — Hover over the menu text. Letters farther from the touched spot blink later and fainter, then return (vertical menus use vertical distance).</p>
<div class="stage">
  <ul class="en">
    <li><a href="#" data-fx="char-fade-ripple-hover">ABOUT</a></li>
    <li><a href="#" data-fx="char-fade-ripple-hover">NEWS</a></li>
    <li><a href="#" data-fx="char-fade-ripple-hover">RESERVATION</a></li>
  </ul>
  <ul class="ja">
    <li><a href="#" data-fx="char-fade-ripple-hover">About the Inn</a></li>
    <li><a href="#" data-fx="char-fade-ripple-hover">News</a></li>
    <li><a href="#" data-fx="char-fade-ripple-hover">Directions</a></li>
  </ul>
</div>
<script>
// Late arrivals and removals — checks that fx-core attaches to an element added after 1s and detaches from an element removed after 2.5s
(() => {
  const list = document.querySelector(".en");
  const add = (text) => { const li = document.createElement("li"); li.innerHTML = `<a href="#" data-fx="char-fade-ripple-hover">${text}</a>`; list.append(li); return li; };
  const gone = add("GONE");
  setTimeout(() => add("LATE ITEM"), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s one more menu item comes in, and after 2.5s one drops out.");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
