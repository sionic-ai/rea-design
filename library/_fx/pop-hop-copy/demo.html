<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>pop-hop-copy — The headline pops out</title>
  <link rel="stylesheet" href="../../../_shared/wire.css">
  <link rel="stylesheet" href="../../../_shared/kf-defaults.css">
  <link rel="stylesheet" href="fx.css">
  <style>
    body { display: grid; place-items: center; min-height: 100vh; gap: 24px; padding: 40px; font-family: var(--kf-font-sans); }
    .hint { color: var(--kf-dim); font-size: 14px; }
    .copy { width: min(560px, 90vw); text-align: center; }
    .tags { display: flex; justify-content: center; gap: 8px; }
    .tag { padding: 0.2em 0.6em; background: var(--kf-accent); color: var(--kf-on-accent); font: 700 28px/1.2 var(--kf-font-display); }
    .tag + .tag { background: var(--kf-accent-soft); color: var(--kf-accent-text); }
    .big { margin-top: 18px; font: 800 88px/1 var(--kf-font-display); color: var(--kf-accent); }
    .w { display: inline-block; }
    button { padding: 8px 16px; border: 1px solid var(--kf-line); border-radius: var(--kf-radius-pill); background: var(--kf-surface); cursor: pointer; }
  </style>
</head>
<body>
  <p class="hint">Opening makes the headline pop out — press “Replay” to watch from the start. A second headline joins after 1s, and one is erased after 2s.</p>
  <div class="copy" id="a" data-fx="pop-hop-copy">
    <div class="tags">
      <p class="tag" data-fx-part="tag-left"><span class="w"><span data-fx-part="char">Woman</span><span data-fx-part="char">Flag</span><span data-fx-part="char">At</span></span> <span class="w"><span data-fx-part="char">One</span><span data-fx-part="char">Line</span></span></p>
      <p class="tag" data-fx-part="tag-right"><span class="w"><span data-fx-part="char">Dream</span><span data-fx-part="char">Object marker</span></span> <span class="w"><span data-fx-part="char">Scent</span><span data-fx-part="char">Sun</span></span></p>
    </div>
    <p class="big" data-fx-part="bottom"><span data-fx-part="piece">S</span><span data-fx-part="piece">t</span><span data-fx-part="piece">u</span><span data-fx-part="piece">d</span><span data-fx-part="piece">i</span><span data-fx-part="piece">o</span><span data-fx-part="piece">!</span></p>
    <p data-fx-part="desc">Your one-line description goes here.</p>
  </div>
  <button type="button" id="again">Again</button>
  <script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
  <script src="../fx-core.js"></script>
  <script src="fx.js"></script>
  <script>
    const a = document.getElementById("a");
    document.getElementById("again").addEventListener("click", () => {
      a.removeAttribute("data-fx");
      requestAnimationFrame(() => a.setAttribute("data-fx", "pop-hop-copy"));
    });
    setTimeout(() => {
      const late = a.cloneNode(true);
      late.id = "late";
      document.body.append(late);
      setTimeout(() => late.remove(), 1000);
    }, 1000);
  </script>
</body>
</html>
