<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>logo-hole-reveal — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: sticky; top: 0; z-index: 1000; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo-stage { height: 100vh; display: grid; place-items: center; background: linear-gradient(120deg, var(--kf-accent), var(--kf-accent-soft)); color: var(--kf-on-accent); font: 700 48px/1.2 var(--kf-font-display); }
  .demo-logo { width: 90px; color: var(--kf-contrast-ink); text-align: center; font: 700 14px/1 var(--kf-font-sans); }
  .demo-logo svg { width: 100%; fill: currentColor; }
  .demo-spacer { height: 60vh; display: grid; place-items: center; color: var(--kf-dim); }
</style>
</head>
<body>
<p class="demo-hint"><b>logo-hole-reveal</b> — On open: black curtain and bar → logo → a logo-shaped hole grows to reveal the screen below (refresh to replay). <span style="color:var(--kf-dim)">(One more panel comes in after 1s, and the first panel drops out after 2.5s)</span></p>
<div class="demo-stage" id="stage">View through the hole</div>
<div data-fx="logo-hole-reveal" data-demo-remove>
  <div data-fx-part="cover"><i data-fx-part="bar"></i></div>
  <div class="demo-logo" data-fx-part="logo"><svg viewBox="0 0 120 100"><path d="M0 0h22v100H0zM98 0h22v100H98zM0 0h24l38 46-12 14zM120 0H96L58 46l12 14z"/></svg>LOGO<span data-fx-part="sweep"></span></div>
  <div data-fx-part="hole"></div>
  <div data-fx-part="frame"></div>
</div>
<template data-demo-late><div data-fx="logo-hole-reveal" data-fx-logo-hole-reveal="load: .5; hold: .8"><div data-fx-part="hole"></div></div></template>
<div class="demo-spacer">When fx:open arrives, the top panel text changes</div>

<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
addEventListener("fx:open", () => { document.getElementById("stage").textContent = "Opened (fx:open)"; });
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
