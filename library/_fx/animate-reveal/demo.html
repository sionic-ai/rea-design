<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>animate-reveal — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="../../_vendor/animate.css@3.1.1/animate.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-spacer { height: 80vh; display: grid; place-items: center; color: var(--kf-dim); }
  .row { display: flex; gap: 32px; justify-content: center; flex-wrap: wrap; padding: 40px 20px 40vh; }
  .chip { width: 160px; height: 160px; border-radius: 50%; background: var(--kf-accent); color: var(--kf-on-accent); display: grid; place-items: center; }
</style>
</head>
<body>
<p class="demo-hint"><b>animate-reveal</b> — Scroll down. Pieces pop out one after another, each with a different effect.</p>
<div class="demo-spacer">Scroll down</div>
<div class="row">
  <div class="chip" data-fx="animate-reveal" data-fx-animate-reveal="name: zoomIn">zoomIn</div>
  <div class="chip" data-fx="animate-reveal" data-fx-animate-reveal="name: fadeInDown; delay: .4">fadeInDown .4s</div>
  <div class="chip" data-fx="animate-reveal" data-fx-animate-reveal="name: bounceIn; delay: .8">bounceIn .8s</div>
  <div class="chip" data-fx="animate-reveal" data-fx-animate-reveal="name: rotateInDownLeft; delay: 1.2; dur: 2">rotateInDownLeft</div>
</div>
<script>
(() => {
  const src = document.querySelector('[data-fx~="animate-reveal"]');
  if (!src || !src.parentNode) return;
  const host = src.parentNode;
  const make = (t) => { const el = src.cloneNode(true); el.textContent = t; return el; };
  const gone = make("Piece to drop");
  src.after(gone);
  setTimeout(() => host.append(make("Late-arrived piece")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s one more piece comes in, and after 2.5s one drops out.");
})();
</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
