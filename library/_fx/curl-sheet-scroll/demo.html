<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>curl-sheet-scroll — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; overflow-x: hidden; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .wrap { display: grid; grid-template-columns: 0.4fr 0.6fr; }
  .stage { grid-column: 2; grid-row: 1; position: sticky; top: 0; height: 100vh; }
  #chapters { grid-column: 1; grid-row: 1; padding-left: 20px; }
  #chapters section { min-height: 100vh; display: flex; align-items: center; font: 600 40px/1.1 var(--kf-font-display); }
  .sheet { background: var(--kf-surface); color: var(--kf-ink); }
  .sheet.is-dark { background: var(--kf-contrast-bg); color: var(--kf-contrast-ink); }
  .end { height: 60vh; }
</style>
</head>
<body>
<p class="demo-hint"><b>curl-sheet-scroll</b> — Scroll down. The right panel curls from its corner like paper and turns over, revealing the next page.</p>
<div class="wrap">
  <div class="stage" data-fx="curl-sheet-scroll" data-fx-curl-sheet-scroll="track: #chapters" id="stage">
    <div class="sheet is-dark" data-fx-part="sheet">01 / First case screen</div>
    <div class="sheet" data-fx-part="sheet">02 / Second case screen</div>
    <div class="sheet is-dark" data-fx-part="sheet">03 / Third case screen</div>
  </div>
  <div id="chapters"><section>First Section</section><section>Second Section</section><section>Third Section</section></div>
</div>
<div class="end"></div>
<script>
// Late and erased plates — hooks onto the plate attached after 1 second too, and removing one after 2.5 seconds runs detach (renderer cleanup)
(() => {
  const make = () => { const d = document.createElement("div"); d.dataset.fx = "curl-sheet-scroll"; d.style.cssText = "height:240px"; d.innerHTML = '<div class="sheet" data-fx-part="sheet">late</div><div class="sheet is-dark" data-fx-part="sheet">late 2</div>'; return d; };
  const gone = make();
  document.body.append(gone);
  setTimeout(() => document.body.append(make()), 1000);
  setTimeout(() => gone.remove(), 2500);
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="three-global.js"></script>
<script src="../../_vendor/three@0.185.0/build/three.cjs"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
