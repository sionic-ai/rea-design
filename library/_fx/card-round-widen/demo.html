<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>card-round-widen — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-raised); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-card { height: 180vh; margin-top: 100px; background: var(--kf-surface); display: grid; place-items: start center; padding-top: 30vh; font-size: 40px; }
  .demo-gap { height: 60vh; }
</style>
</head>
<body>
<p class="demo-hint"><b>card-round-widen</b> — Scroll down. The rounded card expands to full screen width, then narrows again at the end. <span style="color:var(--kf-dim)">(One more card comes in after 1s, and one drops out after 2.5s)</span></p>
<div class="demo-card" data-fx="card-round-widen" data-fx-card-round-widen="first: on">Your first card here</div>
<div class="demo-gap"></div>
<div class="demo-card" data-fx="card-round-widen">Your second card here</div>
<div class="demo-gap"></div>
<div class="demo-card" data-demo-remove data-fx="card-round-widen" data-fx-card-round-widen="inset: 32; round: 24">Card to Remove</div>
<template data-demo-late><div class="demo-card" data-fx="card-round-widen" data-fx-card-round-widen="open: 300">Late-arrived card</div></template>
<div class="demo-gap"></div>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
