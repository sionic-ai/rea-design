<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pass-wipe-loader — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 1; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .bird { fill: currentColor; overflow: visible; }
  .bird .wing { transform-box: fill-box; transform-origin: 50% 100%; animation: flap .36s ease-in-out infinite alternate; }
  @keyframes flap { to { transform: scaleY(-.4); } }
  main { padding: 48px 20px; }
</style>
</head>
<body>
<p class="demo-hint"><b>pass-wipe-loader</b> — On open a bird flies in, stands, then leaves, and the curtain lifts from the right (open in a new tab to see it again).</p>
<div data-fx="pass-wipe-loader" data-fx-pass-wipe-loader="once: always; min: 1.5"><svg data-fx-part="mark" class="bird" viewBox="0 0 110 80"><path class="wing" d="M52 34C44 18 30 8 12 6c10 8 18 18 22 30Z"/><path d="M20 44c14-4 30-6 46-2 10 2 20 1 30-4-4 8-12 13-22 15l-8 12-4-10c-14 2-28-2-42-11Z"/><path class="wing" d="M56 40C62 22 76 10 98 6 88 16 80 28 76 42Z"/></svg></div>
<div data-fx="pass-wipe-loader" data-demo-remove data-fx-pass-wipe-loader="once: always; key: demo-b"></div>
<template data-demo-late><div data-fx="pass-wipe-loader" data-fx-pass-wipe-loader="once: always; min: .5; key: demo-c"></div></template>
<main>Hero Behind the Curtain</main>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
document.addEventListener("fx:done", () => { const m = document.querySelector("main"); if (m) m.textContent = "fx:done received — Hero opens"; });
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
