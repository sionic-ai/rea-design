<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>year-dial — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-contrast-bg); color: var(--kf-contrast-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { margin: 0; padding: 12px 20px; border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .wrap { display: flex; gap: 80px; justify-content: center; padding: 80px 20px; flex-wrap: wrap; }
  .dial { width: min(420px, 80vw); aspect-ratio: 1; --fx-year-size: 64px; }
  .dial .ring { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .dial [data-fx-part="slide"] { inset: 13%; }
</style>
</head>
<body>
<p class="demo-hint"><b>year-dial</b> — Wait a moment. Every 5s the sun changes, numbers rise one digit at a time, and an outer arc is drawn.</p>
<div class="wrap" id="wrap">
  <figure class="dial" data-fx="year-dial">
    <div data-fx-part="slide"><div class="wf-img" data-fx-part="photo" data-label="1982 photo"></div><p data-fx-part="year">1982</p></div>
    <div data-fx-part="slide"><div class="wf-img" data-fx-part="photo" data-label="1992 photo"></div><p data-fx-part="year">1992</p></div>
    <div data-fx-part="slide"><div class="wf-img" data-fx-part="photo" data-label="2022 photo"></div><p data-fx-part="year">2022</p></div>
    <svg class="ring" viewBox="0 0 600 600"><path data-fx-part="arc" d="M300 20a280 280 0 1 1 0 560"/></svg>
  </figure>
  <figure class="dial gone" data-fx="year-dial"><div data-fx-part="slide"><div class="wf-img" data-fx-part="photo" data-label="Disc to be removed soon"></div><p data-fx-part="year">2000</p></div></figure>
</div>
<script>
setTimeout(() => { const f = document.createElement("figure"); f.className = "dial"; f.dataset.fx = "year-dial"; f.innerHTML = '<div data-fx-part="slide"><div class="wf-img" data-fx-part="photo" data-label="Late-arrived plate"></div><p data-fx-part="year">2010</p></div><div data-fx-part="slide"><div class="wf-img" data-fx-part="photo" data-label="2020"></div><p data-fx-part="year">2020</p></div>'; document.getElementById("wrap").append(f); }, 1000);
setTimeout(() => document.querySelector(".gone")?.remove(), 2500);
</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
