<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lerp-stalker — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { display: grid; gap: 40px; padding: 60px 20px; max-width: 1000px; margin: 0 auto; }
  .box { display: block; height: 320px; border-radius: var(--kf-radius-lg); background: var(--kf-accent); color: var(--kf-on-accent); padding: 40px; overflow: hidden; }
  .box h2 { font-size: 40px; }
  .box [data-fx-part="badge"] { font: 600 15px/1 var(--kf-font-display); letter-spacing: .04em; }
</style>
</head>
<body>
<p class="demo-hint"><b>lerp-stalker</b> — Hover and move over the blue panel. The round button grows and follows the cursor with a lag. <span style="color:var(--kf-dim)">(After 1s one more panel comes in, and one leaves 2.5s later)</span></p>
<section class="demo">
  <a class="box" href="#" data-fx="lerp-stalker"><h2>Your contact title here</h2><div data-fx-part="stalker"><b data-fx-part="badge">CONTACT</b></div></a>
  <a class="box" href="#" data-fx="lerp-stalker" data-fx-lerp-stalker="lerp: .08" style="--fx-size: 120px; --fx-dur: 0s"><h2>Later · no transition</h2><div data-fx-part="stalker"><b data-fx-part="badge">GO</b></div></a>
  <a class="box" href="#" data-fx="lerp-stalker" data-demo-remove><h2>Panel to be removed soon</h2><div data-fx-part="stalker"><b data-fx-part="badge">BYE</b></div></a>
  <template data-demo-late><a class="box" href="#" data-fx="lerp-stalker"><h2>Late panel (no button — quiet)</h2></a></template>
</section>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
