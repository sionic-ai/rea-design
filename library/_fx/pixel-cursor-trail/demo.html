<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pixel-cursor-trail — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; min-height: 100vh; }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-box { position: relative; height: 240px; margin: 40px 20px; border: 1px solid var(--kf-line); display: grid; place-content: center; }
</style>
</head>
<body>
<p class="demo-hint"><b>pixel-cursor-trail</b> — Move the mouse over the screen. Cells it passes over are filled, then vanish within half a second.</p>
<div data-fx="pixel-cursor-trail" aria-hidden="true"></div>
<div class="demo-box">Attached only inside the box below (look: inline, 6px cells)<div data-fx="pixel-cursor-trail" data-fx-pixel-cursor-trail="look: inline; size: 6; color: --kf-ink" aria-hidden="true"></div></div>
<script>
(() => {
  const src = document.querySelector(".demo-box [data-fx~='pixel-cursor-trail']");
  if (!src) return;
  const make = (tag) => { const d = src.cloneNode(false); d.dataset.demo = tag; return d; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => src.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical one comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
