<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>stepped-tilt-follow — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 320px)); gap: 60px; padding: 60px; }
  .card { display: block; aspect-ratio: 1; color: inherit; text-decoration: none; }
  .card [data-fx-part="media"] { width: 100%; height: 100%; background: var(--kf-raised); display: grid; place-items: center; font-weight: 700; }
  .card [data-fx-part="media"] i { width: 40%; aspect-ratio: 1; background: var(--kf-accent); }
</style>
</head>
<body>
<p class="demo-hint"><b>stepped-tilt-follow</b> — Move the mouse over the card. The inner square follows in stepped jolts and tilts, and when you leave it returns in five steps. <span style="color:var(--kf-dim)">(One more card comes in after 1s, and one drops out after 2.5s)</span></p>
<section class="grid">
  <a class="card" href="#" data-fx="stepped-tilt-follow"><div data-fx-part="media"><i></i></div></a>
  <a class="card" href="#" data-fx="stepped-tilt-follow" data-fx-stepped-tilt-follow="div: 10; rot: 0"><div data-fx-part="media"><i></i></div></a>
  <a class="card" href="#" data-fx="stepped-tilt-follow" data-demo-remove><div data-fx-part="media"><i></i></div></a>
  <template data-demo-late><a class="card" href="#" data-fx="stepped-tilt-follow" data-fx-stepped-tilt-follow="step: 8; rot: 4"><div data-fx-part="media"><i></i></div></a></template>
  <a class="card" href="#" data-fx="stepped-tilt-follow"></a>
</section>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
