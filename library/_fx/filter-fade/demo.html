<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>filter-fade — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { padding: 48px 20px; }
  .demo-spacer { height: 90vh; display: grid; place-items: center; color: var(--kf-dim); }

  .bar { display: flex; gap: 4px; padding: 4px; width: max-content; border-radius: 8px; background: var(--kf-raised); margin-bottom: 24px; }
  .bar button { padding: 10px 14px; border: 0; border-radius: 6px; background: none; font: 600 12px/1 var(--kf-font-display); color: var(--kf-ink); }
  .bar button.is-on { background: var(--kf-accent); color: var(--kf-on-accent); }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
  .card { display: grid; place-items: end start; aspect-ratio: 4 / 5; padding: 14px; border-radius: 16px; background: var(--kf-raised); border: 1px solid var(--kf-line); }
</style>
</head>
<body>
<p class="demo-hint"><b>filter-fade</b> — Pick a category with the buttons above. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<section data-demo-remove class="demo" data-fx="filter-fade">
  <div class="bar"><button class="is-on" data-fx-part="filter" data-f="">Entire</button><button data-fx-part="filter" data-f="a">Field A</button><button data-fx-part="filter" data-f="b">Field B</button><button data-fx-part="filter" data-f="c">Field C</button></div>
  <div class="grid"><a class="card" href="#" data-fx-part="item" data-cat="a"><span>Case 01</span></a><a class="card" href="#" data-fx-part="item" data-cat="b"><span>Case 02</span></a><a class="card" href="#" data-fx-part="item" data-cat="a b"><span>Case 03</span></a><a class="card" href="#" data-fx-part="item" data-cat="c"><span>Case 04</span></a><a class="card" href="#" data-fx-part="item" data-cat="b"><span>Case 05</span></a><a class="card" href="#" data-fx-part="item" data-cat="a"><span>Case 06</span></a><a class="card" href="#" data-fx-part="item" data-cat="c"><span>Case 07</span></a><a class="card" href="#" data-fx-part="item" data-cat="b"><span>Case 08</span></a></div>
</section><section class="demo" data-fx="filter-fade">
  <div class="bar"><button class="is-on" data-fx-part="filter" data-f="">Entire</button><button data-fx-part="filter" data-f="a">Field A</button><button data-fx-part="filter" data-f="b">Field B</button><button data-fx-part="filter" data-f="c">Field C</button></div>
  <div class="grid"><a class="card" href="#" data-fx-part="item" data-cat="a"><span>Case 01</span></a><a class="card" href="#" data-fx-part="item" data-cat="b"><span>Case 02</span></a><a class="card" href="#" data-fx-part="item" data-cat="a b"><span>Case 03</span></a><a class="card" href="#" data-fx-part="item" data-cat="c"><span>Case 04</span></a><a class="card" href="#" data-fx-part="item" data-cat="b"><span>Case 05</span></a><a class="card" href="#" data-fx-part="item" data-cat="a"><span>Case 06</span></a><a class="card" href="#" data-fx-part="item" data-cat="c"><span>Case 07</span></a><a class="card" href="#" data-fx-part="item" data-cat="b"><span>Case 08</span></a></div>
</section><template data-demo-late><section class="demo" data-fx="filter-fade">
  <div class="bar"><button class="is-on" data-fx-part="filter" data-f="">Entire</button><button data-fx-part="filter" data-f="a">Field A</button><button data-fx-part="filter" data-f="b">Field B</button><button data-fx-part="filter" data-f="c">Field C</button></div>
  <div class="grid"><a class="card" href="#" data-fx-part="item" data-cat="a"><span>Case 01</span></a><a class="card" href="#" data-fx-part="item" data-cat="b"><span>Case 02</span></a><a class="card" href="#" data-fx-part="item" data-cat="a b"><span>Case 03</span></a><a class="card" href="#" data-fx-part="item" data-cat="c"><span>Case 04</span></a><a class="card" href="#" data-fx-part="item" data-cat="b"><span>Case 05</span></a><a class="card" href="#" data-fx-part="item" data-cat="a"><span>Case 06</span></a><a class="card" href="#" data-fx-part="item" data-cat="c"><span>Case 07</span></a><a class="card" href="#" data-fx-part="item" data-cat="b"><span>Case 08</span></a></div>
</section></template>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); window.ScrollTrigger?.refresh(); }, 2500);
</script>
</body>
</html>
