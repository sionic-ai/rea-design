<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>wave-hills — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .gap { height: 120px; }
  .sec { padding: 40px 20px 120px; background: var(--kf-accent); color: var(--kf-on-accent); }
  .sec.dark { background: var(--kf-ink); color: var(--kf-bg); }
</style>
</head>
<body>
<p class="demo-hint"><b>wave-hills</b> — Three layers of hills at the section head ripple at different speeds. Just look.</p>
<div class="gap"></div>
<div class="stack">
  <div data-fx="wave-hills" style="margin-bottom: -1px"></div>
  <section class="sec"><p>Your section title, one line, here.</p></section>
  <div data-fx="wave-hills" data-fx-wave-hills="amp: 24; rate: 1.4" style="--fx-front: var(--kf-ink); --fx-middle: var(--kf-dim); margin-bottom: -1px"></div>
  <section class="sec dark"><p>Your next chapter title here, one line.</p></section>
</div>
<script>
// Late arrivals and removals — checks that fx-core attaches to an element added after 1s and detaches from an element removed after 2.5s
(() => {
  const stack = document.querySelector(".stack");
  const make = (tag) => { const d = document.createElement("div"); d.dataset.fx = "wave-hills"; d.dataset.demo = tag; return d; };
  const gone = make("gone");
  stack.append(gone);
  setTimeout(() => stack.append(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical one comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
