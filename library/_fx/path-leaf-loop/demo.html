<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>path-leaf-loop — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .stage { position: relative; height: 340px; margin: 40px; }
  .trail { position: absolute; font-size: 12px; }
  .trail svg { width: 50.875em; height: auto; }
  .leaf { width: 4em; height: 1.6em; border-radius: 50% 0 50% 0; background: var(--kf-accent); }
</style>
</head>
<body>
<p class="demo-hint"><b>path-leaf-loop</b> A leaf flies along a dotted ring path and then vanishes, rests, and flies again. The path below runs in reverse. <span style="color:var(--kf-dim)">(After 1s one more path comes in, and one leaves 2.5s later)</span></p>
<div class="stage">
  <div class="trail" style="left: 40px; top: 20px" data-fx="path-leaf-loop"><svg viewBox="0 0 814 234"><path data-fx-part="path" d="M812 0C812 44 776 78 660 78C540 78 452 30 342 30C232 30 166 100 162 160C158 220 186 233 210 233C236 233 270 220 274 158C278 96 208 10 118 10C30 10 0 74 0 74"/></svg><div class="leaf" data-fx-part="rider"></div></div>
  <div class="trail" style="left: 420px; top: 140px" data-fx="path-leaf-loop" data-fx-path-leaf-loop="dir: reverse" data-demo-remove><svg viewBox="0 0 814 234"><path data-fx-part="path" d="M812 0C812 44 776 78 660 78C540 78 452 30 342 30C232 30 166 100 162 160C158 220 186 233 210 233C236 233 270 220 274 158C278 96 208 10 118 10C30 10 0 74 0 74"/></svg><div class="leaf" data-fx-part="rider"></div></div>
  <template data-demo-late><div class="trail" style="left: 120px; top: 200px" data-fx="path-leaf-loop" data-fx-path-leaf-loop="dur: 4; rest: 1"><svg viewBox="0 0 814 234"><path data-fx-part="path" d="M0 120C200 0 400 240 814 120"/></svg><div class="leaf" data-fx-part="rider"></div></div></template>
  <div class="trail" data-fx="path-leaf-loop"></div>
</div>
<script src="../../_vendor/animejs@3.2.1/anime.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
