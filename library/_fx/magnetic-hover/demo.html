<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>magnetic-hover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .row { display: flex; flex-wrap: wrap; gap: 60px; align-items: center; padding: 80px 40px; }
  .btn { display: inline-grid; place-items: center; padding: 18px 34px; border-radius: var(--kf-radius-pill); background: var(--kf-accent); color: var(--kf-on-accent); text-decoration: none; }
  .round { width: 120px; height: 120px; padding: 0; border-radius: 50%; }
</style>
</head>
<body>
<p class="demo-hint"><b>magnetic-hover</b> — Move the mouse close to the button (within 10px of its border). It is pulled toward the cursor and tilts slightly at the corners. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<div class="row">
  <a class="btn" href="#" data-fx="magnetic-hover">Your buy-the-book link here</a>
  <a class="btn round" href="#" data-fx="magnetic-hover" data-fx-magnetic-hover="dist: 40; max: 24">Drag Large</a>
  <a class="btn" href="#" data-demo-remove data-fx="magnetic-hover">Omitted button</a>
  <template data-demo-late><a class="btn" href="#" data-fx="magnetic-hover">Late-arrived Button</a></template>
</div>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
