<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pop-image-trail — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .zone { height: 70vh; border-bottom: 1px solid var(--kf-line); display: grid; place-items: center; font: 600 48px/1 var(--kf-font-sans); }
  .zone svg { width: 120px; height: 120px; display: block; }
</style>
</head>
<body>
<p class="demo-hint"><b>pop-image-trail</b> — Move the mouse widely over the panel. After 1s one panel attaches late below, and after 3s parts fall from the first panel.</p>
<section class="zone" id="zone" data-fx="pop-image-trail">Move from here</section>
<script>
  const shapes = [
    '<circle cx="50" cy="50" r="40" style="fill: var(--kf-accent)"/>',
    '<path d="M50 6l12 30 32 2-25 20 9 32-28-18-28 18 9-32L6 38l32-2z" style="fill: var(--kf-ink)"/>',
    '<rect x="12" y="24" width="76" height="52" rx="26" style="fill: var(--kf-accent-text)"/>',
    '<path d="M58 4L22 56h24l-6 40 38-56H54z" style="fill: var(--kf-dim)"/>',
  ];
  const fill = (zone, n) => { for (let i = 0; i < n; i++) { const d = document.createElement("div"); d.setAttribute("data-fx-part", "item"); d.innerHTML = `<svg viewBox="0 0 100 100">${shapes[i % shapes.length]}</svg>`; zone.append(d); } };
  fill(document.getElementById("zone"), 8);
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
  setTimeout(() => {
    const z = document.createElement("section");
    z.className = "zone"; z.textContent = "Late-attached Board"; fill(z, 6);
    z.setAttribute("data-fx", "pop-image-trail"); z.setAttribute("data-fx-pop-image-trail", "gap: 60; inner: 1.8");
    document.body.append(z);
  }, 1000);
  setTimeout(() => document.getElementById("zone")?.removeAttribute("data-fx"), 3000);
</script>
</body>
</html>
