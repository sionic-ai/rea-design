<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>baton-line-cta — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 20px/1.2 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { padding: 48px 20px; max-width: 480px; }
  .cta { display: flex; justify-content: space-between; padding-block: 10px; }
  .box { position: relative; width: 1lh; height: 1lh; overflow: hidden; }
  .box i { position: absolute; inset: 0; display: grid; place-items: center end; font-style: normal; }
  nav { display: flex; gap: 15px; margin-top: 40px; }
  nav a { display: inline-block; height: 1lh; }
</style>
</head>
<body>
<p class="demo-hint"><b>baton-line-cta</b> — Hover over a row. The top line and arrow hand off the baton. The menu below uses an underline style.</p>
<section class="demo">
  <a class="cta" href="#" data-fx="baton-line-cta"><span>Company About</span><span class="box"><i data-fx-part="arrow">→</i><i data-fx-part="arrow">→</i></span></a>
  <a class="cta" href="#" data-fx="baton-line-cta"><span>Hiring</span><span class="box"><i data-fx-part="arrow">→</i><i data-fx-part="arrow">→</i></span></a>
  <nav><a href="#" data-fx="baton-line-cta" data-fx-baton-line-cta="look: underline">Work</a><a href="#" data-fx="baton-line-cta" data-fx-baton-line-cta="look: underline">Service</a></nav>
  <nav><a href="#" data-fx="baton-line-cta" data-fx-baton-line-cta="look: underline; line: .8; ease: expo.out; out: .6; out-ease: power4.out; from: -100; to: 105">In .8s · out .6s (fora bottom nav)</a></nav>
  <a class="cta" href="#" data-fx="baton-line-cta"></a>
</section>
<script>
// Late arrivals and removals — checks that fx-core attaches to an element added after 1s and detaches from an element removed after 2.5s
(() => {
  const src = document.querySelector('[data-fx~="baton-line-cta"]');
  if (!src) return;
  const html = src.outerHTML.replace(/\sid="[^"]*"/g, "");
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => src.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical one comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
