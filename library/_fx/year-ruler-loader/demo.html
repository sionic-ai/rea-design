<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>year-ruler-loader — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { display: flex; flex-wrap: wrap; gap: 40px; padding: 48px 20px; }
  .demo .card { display: grid; place-items: center; width: 220px; height: 220px; border-radius: var(--kf-radius-md); background: var(--kf-accent); color: var(--kf-on-accent); font-weight: 700; }
  .demo-mark { display: grid; place-items: center; aspect-ratio: 73 / 106; border: 2px solid currentColor; border-radius: var(--kf-radius-sm); font: 700 14px/1 var(--kf-font-display); }
</style>
</head>
<body>
<p class="demo-hint"><b>year-ruler-loader</b> — On open, the year on the ruler counts up to the far right end and the panel clears (refresh to replay). <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<section class="demo"><div class="card">Screen below</div><div class="card">Your content here</div></section>
<div data-fx="year-ruler-loader" data-fx-year-ruler-loader="from: 1990; to: 2000; dur: 1; delay: 3" data-demo-remove><div data-fx-part="track"><span data-fx-part="count">1990</span></div></div>
<template data-demo-late><div data-fx="year-ruler-loader" data-fx-year-ruler-loader="to: 2010; dur: .6; fade: .3"><div data-fx-part="track"><span data-fx-part="count">2005</span></div></div></template>
<div data-fx="year-ruler-loader"></div>
<!-- The main demo comes last — it stacks above the panels that start later -->
<div data-fx="year-ruler-loader" data-fx-year-ruler-loader="from: 2000; to: 2020; look: grid"><div class="demo-mark" data-fx-part="mark">Logo</div><div data-fx-part="track"><span data-fx-part="count">2000</span></div></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../../../_shared/vendor/gsap/CustomEase.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); window.ScrollTrigger?.refresh(); }, 2500);
</script>
</body>
</html>
