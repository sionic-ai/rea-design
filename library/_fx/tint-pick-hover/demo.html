<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tint-pick-hover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="../arrow-pass-hover/fx.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { padding: 48px 20px; display: grid; gap: 24px; justify-items: start; }
  .btn { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 206px; height: 64px; padding: 0 8px 0 15px; border-radius: 8px; background: var(--kf-ink); color: var(--kf-bg); font-weight: 700; font-size: 13px; }
  .btn [data-fx~="arrow-pass-hover"] { --fx-w: 48px; --fx-h: 48px; --fx-shift: 48px; --fx-dur: .5s; border-radius: 3px; }
  .btn [data-fx~="arrow-pass-hover"] > span { display: grid; place-items: center; background: var(--kf-bg); color: var(--kf-ink); }
  .btn [data-fx~="arrow-pass-hover"] > span:last-child { background: var(--fx-tint); }
  .btn svg { width: 14px; height: 12px; fill: none; stroke: currentColor; stroke-width: 2; }
  .chip { padding: 10px 16px; border-radius: var(--kf-radius-pill); border: 2px solid var(--fx-tint); color: var(--fx-tint); }
</style>
</head>
<body>
<p class="demo-hint"><b>tint-pick-hover</b> — Hover over the button several times. Each time you enter, the arrow cell color changes at random.</p>
<section class="demo">
  <a href="#" class="btn" data-fx="tint-pick-hover" data-fx-tint-pick-hover="pick: --kf-accent, --kf-ink"><span>Your button text here</span><span data-fx="arrow-pass-hover" data-fx-arrow-pass-hover="look: slide"><span><svg viewBox="0 0 14 12"><path d="M0 6h12M8 1.5 12.5 6 8 10.5"/></svg></span><span><svg viewBox="0 0 14 12"><path d="M0 6h12M8 1.5 12.5 6 8 10.5"/></svg></span></span></a>
  <a href="#" class="chip" data-fx="tint-pick-hover" data-fx-tint-pick-hover="pick: --kf-accent, --kf-ink, --kf-dim">Border in one of three colors</a>
</section>
<script>
(() => {
  const host = document.querySelector('[data-fx~="tint-pick-hover"]');
  if (!host) return;
  const html = host.outerHTML;
  const make = () => { const t = document.createElement("template"); t.innerHTML = html; return t.content.firstElementChild; };
  const gone = make();
  host.after(gone);
  setTimeout(() => host.after(make()), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s one more button comes in, and after 2.5s one drops out.");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
