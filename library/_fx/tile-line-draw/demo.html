<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tile-line-draw — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .lead { height: 70vh; display: grid; place-items: center; }
  .board { display: grid; grid-template-columns: repeat(4, 1fr); grid-auto-rows: 120px; margin: 0 20px 40px; }
  .board > div { padding: 16px; }
  .wide { grid-column: span 2; }
  button { margin: 0 20px 120px; padding: 8px 14px; border: 1px solid var(--kf-line); background: var(--kf-surface); cursor: pointer; }
</style>
</head>
<body>
<p class="demo-hint"><b>tile-line-draw</b> — Scroll down. The grid is drawn cell by cell. Press the button to fold it away. <span style="color:var(--kf-dim)">(After 1s one more cell comes in, and one leaves 2.5s later)</span></p>
<div class="lead">Your first section here</div>
<section class="board" id="b" data-fx="tile-line-draw" data-fx-tile-line-draw="look: frame">
  <div class="wide" data-fx="tile-line-draw">Your cell 1 here</div>
  <div data-fx="tile-line-draw">Your cell 2 here</div>
  <div data-fx="tile-line-draw" data-demo-remove>Dropping cell</div>
  <div data-fx="tile-line-draw">Your cell 4 here</div>
  <div class="wide" data-fx="tile-line-draw">Your cell 5 here</div>
  <template data-demo-late><div data-fx="tile-line-draw">Late cell</div></template>
</section>
<div data-fx="tile-line-draw"></div>
<button type="button" id="go">Grid withdraw (fx:leave)</button>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script>gsap.registerPlugin(ScrollTrigger);</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
document.getElementById("go").addEventListener("click", () => document.querySelectorAll('[data-fx~="tile-line-draw"]').forEach((n) => n.dispatchEvent(new CustomEvent("fx:leave"))));
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
