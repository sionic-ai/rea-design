<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>veil-drop-mega — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { margin: 0; padding: 92px 20px 12px; border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .bar { position: fixed; inset: 0 0 auto; z-index: 100; display: flex; gap: 32px; align-items: center; height: 72px; padding: 0 32px; background: var(--kf-surface); }
  .bar button { border: 0; background: none; font-weight: 700; cursor: pointer; }
  .sheet { padding: 96px 2% 32px; background: var(--kf-bg); }
  .sheet h2 { font-size: 28px; margin-bottom: 20px; }
  .row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
  .card { aspect-ratio: 10 / 3; border-radius: var(--kf-radius-md); }
  .demo-spacer { height: 140vh; padding: 40px; color: var(--kf-dim); }
</style>
</head>
<body>
<div data-fx="veil-drop-mega" id="mega">
  <nav class="bar">
    <b>Brand</b>
    <button data-fx-part="trigger" data-key="a">Menu 1</button>
    <button data-fx-part="trigger" data-key="b">Menu 2</button>
  </nav>
  <div data-fx-part="panel" data-key="a"><div class="sheet"><h2>Menu 1</h2><div class="row"><a href="#" class="card wf-img" data-label="Card 1"></a><a href="#" class="card wf-img" data-label="Card 2"></a><a href="#" class="card wf-img" data-label="Card 3"></a></div></div></div>
  <div data-fx-part="panel" data-key="b"><div class="sheet"><h2>Menu 2</h2><div class="row"><a href="#" class="card wf-img" data-label="Card 4"></a><a href="#" class="card wf-img" data-label="Card 5"></a></div></div></div>
</div>
<p class="demo-hint"><b>veil-drop-mega</b> — Press “Menu 1” or “Menu 2”. The panel drops from the top in .7s and the area below dims. Pressing the same menu or panel again, or Esc, lifts it back up.</p>
<div class="demo-spacer">Blank Paper</div>
<script>
// Late arrivals and removals — after 1s the same menu set comes in once more, and after 2.5s it is removed
(() => {
  const src = document.getElementById("mega");
  const late = src.cloneNode(true);
  late.removeAttribute("id");
  late.querySelector(".bar").style.top = "72px";
  setTimeout(() => document.body.append(late), 1000);
  setTimeout(() => late.remove(), 2500);
})();
</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
