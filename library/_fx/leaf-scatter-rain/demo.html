<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>leaf-scatter-rain — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-panel { height: 80vh; background: var(--kf-raised); color: var(--kf-surface); display: flex; align-items: center; justify-content: center; }
  .demo-late { height: 30vh; background: var(--kf-raised); color: var(--kf-dim); }
</style>
</head>
<body>
<p class="demo-hint"><b>leaf-scatter-rain</b> — Just watch. Fourteen white leaves fall at different speeds and sway.</p>
<div class="demo-panel" data-fx="leaf-scatter-rain" data-demo-root>
  <span data-fx-part="leaf"><svg viewBox="0 0 40 40" aria-hidden="true"><path fill="currentColor" d="M5.2 32.8C3.6 19 14 6.6 33.2 5.2Z"/><path fill="currentColor" d="M6.8 34.8C21 36.4 33.4 26 34.8 6.8Z"/></svg></span>
</div>
<div data-demo-late-host></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Attach to one late-arriving section, detach after 1.5 sec (does detaching clear the summoned leaves?)
setTimeout(() => {
  const d = document.createElement("div");
  d.className = "demo-late";
  d.dataset.fx = "leaf-scatter-rain";
  d.dataset.fxLeafScatterRain = "count: 5; drop: 1";
  d.innerHTML = '<span data-fx-part="leaf"><svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="14" fill="currentColor"/></svg></span>';
  document.querySelector("[data-demo-late-host]")?.append(d);
  setTimeout(() => d.remove(), 1500);
}, 1000);
</script>
</body>
</html>
