<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bloom-sweep-btn — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { display: flex; flex-wrap: wrap; gap: 24px; padding: 48px 20px; }
  .demo-btn { display: inline-flex; align-items: center; justify-content: space-between; gap: 24px; min-width: 190px; padding: 12px 30px; border-radius: var(--kf-radius-sm); background: var(--kf-accent); color: var(--kf-on-accent); font: 700 16px/30px var(--kf-font-display); letter-spacing: .04em; }
  .demo-btn.is-wide { min-width: 289px; }
</style>
</head>
<body>
<p class="demo-hint"><b>bloom-sweep-btn</b> — Hover over a button — a pale circle spreads and .4s later a second color covers it from the left. After 1s one button comes in and one drops out.</p>
<section class="demo" id="demo">
  <a class="demo-btn" href="#" data-fx="bloom-sweep-btn"><span>View list</span><span aria-hidden="true">→</span></a>
  <a class="demo-btn is-wide" href="#" data-fx="bloom-sweep-btn"><span>Clinic info · Directions</span><span aria-hidden="true">→</span></a>
  <a class="demo-btn" href="#" data-fx="bloom-sweep-btn" data-fx-bloom-sweep-btn="look: bloom" id="gone"><span>Original plate only</span><span aria-hidden="true">→</span></a>
  <a class="demo-btn" href="#" data-fx="bloom-sweep-btn" style="--fx-fill: var(--kf-ink)"><span>Ink-black surface</span><span aria-hidden="true">→</span></a>
</section>
<script>
  setTimeout(() => {
    const a = document.createElement("a");
    a.className = "demo-btn"; a.href = "#"; a.dataset.fx = "bloom-sweep-btn";
    a.innerHTML = "<span>Late-arriving button</span><span aria-hidden=\"true\">→</span>";
    document.getElementById("demo").append(a);
    document.getElementById("gone")?.remove();
  }, 1000);
</script>
</body>
</html>
