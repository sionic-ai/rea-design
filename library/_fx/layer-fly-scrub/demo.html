<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>layer-fly-scrub — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-spacer { height: 60vh; display: grid; place-items: center; color: var(--kf-dim); }
  .stage { background: color-mix(in oklab, var(--kf-accent) 18%, var(--kf-bg)); }
  .ly { position: absolute; border-radius: 50% 50% 8px 8px; background: color-mix(in oklab, var(--kf-accent) 60%, var(--kf-ink)); }
  .ly.l { left: -4%; bottom: -10%; width: 34%; height: 80%; }
  .ly.r { right: -4%; bottom: -12%; width: 30%; height: 90%; }
  .ly.g { left: -10%; right: -10%; bottom: -20%; height: 40%; border-radius: 50% 50% 0 0; background: var(--kf-accent); }
  .ly.t { left: 50%; top: 30%; translate: -50% 0; font: 700 40px/1 var(--kf-font-display); border-radius: 0; background: none; }
</style>
</head>
<body>
<p class="demo-hint"><b>layer-fly-scrub</b> — Scroll down. Layers grow and fly off to both sides while the white veil deepens. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<div class="demo-spacer">Top margin</div>
<section data-demo-remove data-fx="layer-fly-scrub" style="--fx-h: 220vh"><div class="stage" data-fx-part="stage">
  <div class="ly g" data-fx-part="layer" data-to="scale: 1.75"></div>
  <div class="ly l" data-fx-part="layer" data-to="scale: 2; x: -100%; y: 50%"></div>
  <div class="ly r" data-fx-part="layer" data-to="scale: 2; x: 100%; y: 50%"></div>
  <div class="ly t" data-fx-part="layer" data-to="scale: 1.8; alpha: -.5">Your title here</div>
  <div data-fx-part="cover"></div>
</div></section>
<template data-demo-late><section data-fx="layer-fly-scrub" style="--fx-h: 220vh"><div class="stage" data-fx-part="stage">
  <div class="ly g" data-fx-part="layer" data-to="scale: 2"></div>
  <div class="ly l" data-fx-part="layer" data-to="scale: 2; x: -150%; y: 100%"></div>
  <div class="ly r" data-fx-part="layer" data-to="scale: 2; x: 150%; y: -50%"></div>
  <div data-fx-part="cover"></div>
</div></section></template>
<section data-fx="layer-fly-scrub" style="--fx-h: 120vh"><div data-fx-part="stage"></div></section>
<div class="demo-spacer">Bottom margin</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); window.ScrollTrigger?.refresh(); }, 2500);
</script>
</body>
</html>
