<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>video-hole-loader — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.6 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 2000; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .page { display: grid; place-items: center; min-height: 100vh; font-size: 40px; font-weight: 800; color: var(--kf-accent-text); }
  .stage { width: 100%; height: 100%; background: radial-gradient(circle at 50% 50%, var(--kf-accent) 0 18%, var(--kf-accent-soft) 18.5%); }
</style>
</head>
<body>
<p class="demo-hint"><b>video-hole-loader</b> — The panel inside the cover turns on, and when Skip is pressed (or after 3s) a circular hole opens from the center. <span style="color:var(--kf-dim)">(After 1s one more panel comes in, and one leaves 2.5s later)</span></p>
<div class="page">Page below</div>
<div data-fx="video-hole-loader" data-fx-video-hole-loader="max: 3">
  <div data-fx-part="media"><div class="stage"></div></div>
  <button data-fx-part="skip" type="button">Skip →</button>
</div>
<div data-fx="video-hole-loader" data-demo-remove style="display:none"></div>
<div id="late"></div>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => { const d = document.createElement("div"); d.dataset.fx = "video-hole-loader"; d.style.display = "none"; document.querySelector("#late")?.append(d); }, 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); }, 2500);
</script>
</body>
</html>
