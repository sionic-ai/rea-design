<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pass-veil — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .photo { position: fixed; inset: 0; z-index: 0; }
  .photo .wf-img { height: 100%; }
  .gap { height: 100vh; }
  .over { padding: 120px 40px 50vh; color: var(--kf-bg); font-size: 40px; }
  .after { position: relative; z-index: 3; height: 100vh; background: var(--kf-bg); padding: 40px; }
</style>
</head>
<body>
<p class="demo-hint"><b>pass-veil</b> — Scroll down. While the white text section passes, the whole screen darkens. <span style="color:var(--kf-dim)">(After 1s one more section comes in, and one leaves 2.5s later)</span></p>
<div class="photo"><div class="wf-img" data-label="Photo attached to the screen"></div></div>
<div class="gap"></div>
<section class="over" data-fx="pass-veil">Your white text rising over the photo</section>
<section class="over" data-fx="pass-veil" data-demo-remove>Section to Be Removed</section>
<template data-demo-late><section class="over" data-fx="pass-veil" data-fx-pass-veil="start: top 60%">Late section · 60% line</section></template>
<div class="after">White section after the curtain lifts</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
