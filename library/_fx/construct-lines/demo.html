<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>construct-lines — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { padding: 40px 20px; display: grid; grid-template-columns: 2fr 1fr; gap: 24px; align-items: start; }
  .panel { height: 520px; border-radius: 30px; }
  .side { display: grid; gap: 24px; }
  .sq { aspect-ratio: 1; border-radius: 8px; }
  .wide { height: 220px; border-radius: 20px; }
  .tab { position: absolute; left: 0; bottom: 0; padding: 18px 24px 0 0; border-radius: 0 20px 0 0; background: var(--kf-bg); font: 500 32px/1 var(--kf-font-display); }
  .empty { height: 80px; }
</style>
</head>
<body>
<p class="demo-hint"><b>construct-lines</b> — On the large panel, watch over 13 seconds as a white line is drawn and withdrawn, a large circle makes one turn, the upper circle flips, and a small circle leaves and returns. The wide panel on the right is a single still, pulled and held with still, zoom, at.</p>
<section class="demo">
  <div class="panel" data-fx="construct-lines"><p class="tab">Your title here</p></div>
  <div class="side">
    <div class="sq" data-fx="construct-lines" data-fx-construct-lines="offset: 1.7"></div>
    <div class="wide" data-fx="construct-lines" data-fx-construct-lines="still: 2.2; zoom: 1.42; at: 0.381 0.625; grain: off"></div>
    <div class="empty" data-fx="construct-lines"></div>
  </div>
</section>
<script>
// Late arrivals and removals — fx-core also attaches to a panel added after 1 second, and checks that a panel removed after 2.5 seconds gets detached
(() => {
  const side = document.querySelector(".side");
  const make = (opt) => { const d = document.createElement("div"); d.className = "sq"; d.dataset.fx = "construct-lines"; d.setAttribute("data-fx-construct-lines", opt); return d; };
  const gone = make("offset: 6");
  side.append(gone);
  setTimeout(() => side.append(make("offset: 9; loop: 6.5")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s, one more panel comes in (the late one), and after 2.5s one drops out (the removal).");
})();
</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
