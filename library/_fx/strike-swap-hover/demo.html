<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>strike-swap-hover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { padding: 64px 20px; display: flex; gap: 48px; align-items: center; flex-wrap: wrap; font: 400 15px/1 var(--kf-font-mono); text-transform: uppercase; }
  .demo button { border: 0; background: none; padding: 0; font: inherit; }
</style>
</head>
<body>
<p class="demo-hint"><b>strike-swap-hover</b> — Hover over the button and then release. <span style="color:var(--kf-dim)">(After 1s one more button comes in, and after 2.5s one drops out)</span></p>
<section class="demo">
  <span>If you agree <button data-fx="strike-swap-hover" data-fx-strike-swap-hover="look: shaky">Here</button> Press</span>
  <button data-fx="strike-swap-hover" data-fx-strike-swap-hover="look: shaky">Example</button> / <button data-demo-remove data-fx="strike-swap-hover" data-fx-strike-swap-hover="look: shaky">No</button>
  <span>Sound <button data-fx="strike-swap-hover" data-fx-strike-swap-hover="look: shaky; under: off">Blink</button></span>
  <a href="#" data-fx="strike-swap-hover" data-fx-strike-swap-hover="dur: .6; ease: power3.inOut">Straight line · .6s</a>
  <template data-demo-late><button data-fx="strike-swap-hover">Late-arrived Button</button></template>
  <button data-fx="strike-swap-hover"></button>
</section>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
