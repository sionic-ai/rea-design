<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lottie-scroll-seek — Lottie tied to scroll</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { margin: 0; font-family: var(--kf-font-sans); color: var(--kf-ink); background: var(--kf-bg); }
  p { padding: 40px; margin: 0; }
  .pad { height: 70vh; }
  .stage { display: grid; gap: 40px; padding: 0 40px; }
  .spot { height: 60vh; background: var(--kf-raised); }
</style>
</head>
<body>
<p>Scroll down — the circle grows from 0 to full as the panel passes through the screen (after 1 second a second panel is added, after 2 seconds the first panel is removed).</p>
<div class="pad"></div>
<!-- So it runs even when opened as a file, Lottie is placed as in-document JSON (src: #id) — 600×400 board, the circle scales 0→1x over frames 0→60 -->
<script type="application/json" id="demo-spot">{"v":"5.7.0","fr":30,"ip":0,"op":60,"w":600,"h":400,"nm":"demo spot","ddd":0,"assets":[],"layers":[{"ddd":0,"ind":1,"ty":4,"nm":"spot","sr":1,"ao":0,"bm":0,"ip":0,"op":150,"st":0,"ks":{"a":{"a":0,"k":[0,0]},"p":{"a":0,"k":[300,200]},"s":{"a":1,"k":[{"t":0,"s":[0,0,100],"o":{"x":[0.167],"y":[0.167]},"i":{"x":[0.833],"y":[0.833]}},{"t":60,"s":[100,100,100]}]},"r":{"a":0,"k":0},"o":{"a":0,"k":100}},"shapes":[{"ty":"gr","nm":"disc","it":[{"ty":"el","nm":"e","d":1,"p":{"a":0,"k":[0,0]},"s":{"a":0,"k":[360,360]}},{"ty":"fl","nm":"f","c":{"a":0,"k":[0.5,0.5,0.5,1]},"o":{"a":0,"k":100},"r":1},{"ty":"tr","p":{"a":0,"k":[0,0]},"a":{"a":0,"k":[0,0]},"s":{"a":0,"k":[100,100]},"r":{"a":0,"k":0},"o":{"a":0,"k":100}}]}]}]}</script>
<div class="stage" id="stage">
  <div class="spot" id="first" data-fx="lottie-scroll-seek" data-fx-lottie-scroll-seek="src: #demo-spot; look: tint"></div>
</div>
<div class="pad"></div><div class="pad"></div>
<script src="../../_vendor/lottie-web@5.12.2/lottie_svg.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
  setTimeout(() => document.getElementById("stage").insertAdjacentHTML("beforeend", '<div class="spot" data-fx="lottie-scroll-seek" data-fx-lottie-scroll-seek="src: #demo-spot; look: tint"></div>'), 1000);
  setTimeout(() => document.getElementById("first").remove(), 2000);
</script>
</body>
</html>
