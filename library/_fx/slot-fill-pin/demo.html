<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>slot-fill-pin — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { margin: 0; background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; margin: 0; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .hero { height: 100vh; padding: 16px 20px; box-sizing: border-box; }
  .hero [data-fx-part="box"] { height: 100%; border-radius: var(--kf-radius-lg); background: radial-gradient(circle at 50% 150%, color-mix(in oklab, var(--kf-accent) 40%, transparent), transparent); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 40px; overflow: hidden; }
  .hero h1 { margin: 0; font-size: clamp(32px, 5vw, 70px); font-weight: var(--kf-weight-display); letter-spacing: -2px; text-align: center; }
  .hero p { margin: 0; }
  .hero [data-fx-part="slot"] { width: min(580px, 80vw); aspect-ratio: 16 / 9; }
  .hero [data-fx-part="media"] { width: 100%; aspect-ratio: 16 / 9; border-radius: var(--kf-radius-md); background: var(--kf-raised); }
  .hero.fx-slot-fill-on [data-fx-part="media"] { aspect-ratio: auto; }
  .hero [data-fx-part="media"] { position: relative; }
  .hero [data-fx-part="media"]::after { content: attr(data-label); position: absolute; inset: auto 0 12px; text-align: center; color: var(--kf-dim); font-size: 12px; }
  .after { height: 120vh; display: grid; place-items: center; color: var(--kf-dim); }
</style>
</head>
<body>
<p class="demo-hint"><b>slot-fill-pin</b> — Scroll down — the small video slot in the center grows to the full panel and the text changes (992px and up). <span style="color:var(--kf-dim)">(After 1s one more line of text comes in, and after 2.5s one drops out)</span></p>
<section class="hero" data-fx="slot-fill-pin">
  <div data-fx-part="box">
    <h1 data-fx-part="ink">Your Hero title here<br>Place it in two lines</h1>
    <div data-fx-part="slot"><div data-fx-part="media" data-label="Interview video · indoor natural light · horizontal 16:9"><i data-fx-part="veil"></i></div></div>
    <p data-fx-part="ink" data-demo-remove>Your one-line description here</p>
    <template data-demo-late><p data-fx-part="ink">Late-arriving single line</p></template>
  </div>
</section>
<div class="after">Next section</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); window.ScrollTrigger?.refresh(); }, 2500);
</script>
</body>
</html>
