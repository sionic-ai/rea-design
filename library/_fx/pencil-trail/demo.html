<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pencil-trail — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { min-height: 80vh; padding: 48px 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .demo section { min-height: 300px; padding: 24px; border: 1px solid var(--kf-line); border-radius: var(--kf-radius-sm); }
  .demo section:nth-child(2) { background: var(--kf-contrast-bg); color: var(--kf-contrast-ink); }
</style>
</head>
<body>
<p class="demo-hint"><b>pencil-trail</b> — Move the mouse over the two panels. Pencil marks are left along the path, then fade. <span style="color:var(--kf-dim)">(After 1s one more panel comes in, and one leaves 2.5s later)</span></p>
<main class="demo">
  <section data-fx="pencil-trail">Bright panel — two lines of body text go here.</section>
  <section data-fx="pencil-trail" data-fx-pencil-trail="life: 1400; gap: 8" style="--fx-trail: var(--kf-bg)">Dark board — marks last longer.</section>
  <section data-fx="pencil-trail" data-demo-remove>Panel to be removed soon</section>
  <template data-demo-late><section data-fx="pencil-trail">Late-arriving panel</section></template>
</main>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
