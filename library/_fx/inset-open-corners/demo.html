<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>inset-open-corners — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-spacer { height: 70vh; display: grid; place-items: center; color: var(--kf-dim); }
  .spacer { position: relative; height: 100vh; min-height: 78vw; }
  .stage { position: sticky; top: -5vh; height: 110vh; display: grid; place-items: center; background: var(--kf-contrast-bg); color: var(--kf-contrast-ink); }
  .box { position: relative; width: min(50vw, 70vh); aspect-ratio: 1; display: grid; place-items: center; text-align: center; padding: 10%; }
</style>
</head>
<body>
<p class="demo-hint"><b>inset-open-corners</b> — Scroll down. The center half panel opens to fill the screen and four corner arcs gather.</p>
<div class="demo-spacer">Scroll down</div>
<div class="spacer">
  <div class="stage" data-fx="inset-open-corners">
    <div class="box">
      <i data-fx-part="corner" data-key="tl"><svg viewBox="0 0 26 26" fill="none"><path d="M1 25C1 11.7 11.7 1 25 1" stroke="currentColor" stroke-width="1.6"/></svg></i>
      <i data-fx-part="corner" data-key="tr"><svg viewBox="0 0 26 26" fill="none"><path d="M1 25C1 11.7 11.7 1 25 1" stroke="currentColor" stroke-width="1.6"/></svg></i>
      <i data-fx-part="corner" data-key="bl"><svg viewBox="0 0 26 26" fill="none"><path d="M1 25C1 11.7 11.7 1 25 1" stroke="currentColor" stroke-width="1.6"/></svg></i>
      <i data-fx-part="corner" data-key="br"><svg viewBox="0 0 26 26" fill="none"><path d="M1 25C1 11.7 11.7 1 25 1" stroke="currentColor" stroke-width="1.6"/></svg></i>
      <p>Your upper panel paragraph here, three or four lines.</p>
    </div>
  </div>
</div>
<div class="demo-spacer">Footer</div>
<script>
// Late arrivals and removals — checks that fx-core attaches to an element added after 1s and detaches from an element removed after 2.5s
(() => {
  const src = document.querySelector('[data-fx~="inset-open-corners"]').parentElement;
  const make = () => { const n = src.cloneNode(true); return n; };
  const gone = make();
  src.after(gone);
  setTimeout(() => src.after(make()), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical panel comes in, and after 2.5s one drops out (detach).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../../../_shared/vendor/gsap/CustomEase.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
