<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hero-dock-slot — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-contrast-bg); color: var(--kf-contrast-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); color: var(--kf-ink); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .bg { position: fixed; inset: 0; z-index: 10; display: block; height: 100svh; }
  .bg .wf-img { height: 100%; border: 0; }
  .hero { position: relative; z-index: 11; height: 100svh; display: flex; align-items: flex-end; padding: 60px; font: 700 64px/1 var(--kf-font-display); pointer-events: none; }
  .blank { height: 100svh; }
  .copy { padding: 200px 20px 400px; text-align: center; font: 700 9vw/0.9 var(--kf-font-display); }
  .slot { display: inline-block; height: 1lh; aspect-ratio: 90 / 42; vertical-align: top; outline: 1px dashed var(--kf-dim); }
</style>
</head>
<body>
<p class="demo-hint"><b>hero-dock-slot</b> Scroll down — a full-screen photo shrinks and docks into the dotted box in the copy below. <span style="color:var(--kf-dim)">(After 1s a panel with no cells comes in, and after 2.5s it leaves)</span></p>
<a class="bg" href="#" data-fx="hero-dock-slot" data-fx-hero-dock-slot="to: #dock; from: #blank"><span class="wf-img" data-label="Work collection collage · Dark background"></span></a>
<section class="hero">Big Headline</section>
<div class="blank" id="blank"></div>
<section class="copy">CREATING A <span class="slot" id="dock"></span><br>NEW STANDARD</section>
<span data-late-slot></span>
<div data-fx="hero-dock-slot" data-fx-hero-dock-slot="to: #nowhere" data-demo-remove></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelector("[data-late-slot]").outerHTML = '<div data-fx="hero-dock-slot"></div>', 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
