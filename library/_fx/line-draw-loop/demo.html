<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>line-draw-loop — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { padding: 48px 20px; }
  .demo-spacer { height: 90vh; display: grid; place-items: center; color: var(--kf-dim); }
  .ld { display: block; width: 100%; height: 220px; color: var(--kf-accent); stroke-width: 3; margin-bottom: 40px; }
</style>
</head>
<body>
<p class="demo-hint"><b>line-draw-loop</b> — Curves are drawn and erased while flowing sideways (the first row rests 8s, the second row 2s, then it repeats). <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<section class="demo"><svg class="ld" data-demo-remove data-fx="line-draw-loop" viewBox="0 0 1400 300"><path d="M0 180C160 60 300 280 480 170S780 40 940 150s300 110 460 10"/></svg><svg class="ld" data-fx="line-draw-loop" data-fx-line-draw-loop="draw: 1.5; erase: .6; travel: 2; rest: 2" viewBox="0 0 1400 300"><path d="M0 180C160 60 300 280 480 170S780 40 940 150s300 110 460 10"/></svg><template data-demo-late><svg class="ld" data-fx="line-draw-loop" data-fx-line-draw-loop="rest: 0" viewBox="0 0 1400 300"><path d="M0 180C160 60 300 280 480 170S780 40 940 150s300 110 460 10"/></svg></template><svg data-fx="line-draw-loop"></svg></section>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); window.ScrollTrigger?.refresh(); }, 2500);
</script>
</body>
</html>
