<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>snap-slider — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { padding: 48px 20px; }
  .demo-spacer { height: 90vh; display: grid; place-items: center; color: var(--kf-dim); }

  .demo { padding-left: 40px; padding-right: 0; }
  [data-fx-part="track"] { gap: 24px; }
  .card { display: grid; place-items: end start; width: 26vw; min-width: 240px; aspect-ratio: 505 / 615; padding: 14px; border-radius: 16px; background: var(--kf-raised); border: 1px solid var(--kf-line); }
</style>
</head>
<body>
<p class="demo-hint"><b>snap-slider</b> — Drag and fling the card row sideways. You can also drag the handle above the dots below. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<section class="demo"><div data-demo-remove data-fx="snap-slider"><div data-fx-part="track"><a class="card" href="#" data-cat="a"><span>Case 01</span></a><a class="card" href="#" data-cat="b"><span>Case 02</span></a><a class="card" href="#" data-cat="a b"><span>Case 03</span></a><a class="card" href="#" data-cat="c"><span>Case 04</span></a><a class="card" href="#" data-cat="b"><span>Case 05</span></a><a class="card" href="#" data-cat="a"><span>Case 06</span></a><a class="card" href="#" data-cat="c"><span>Case 07</span></a><a class="card" href="#" data-cat="b"><span>Case 08</span></a></div><div data-fx-part="pager"><span data-fx-part="dots"></span><i data-fx-part="knob"></i></div></div><div data-fx="snap-slider"><div data-fx-part="track"><a class="card" href="#" data-cat="a"><span>Case 01</span></a><a class="card" href="#" data-cat="b"><span>Case 02</span></a><a class="card" href="#" data-cat="a b"><span>Case 03</span></a><a class="card" href="#" data-cat="c"><span>Case 04</span></a><a class="card" href="#" data-cat="b"><span>Case 05</span></a><a class="card" href="#" data-cat="a"><span>Case 06</span></a><a class="card" href="#" data-cat="c"><span>Case 07</span></a><a class="card" href="#" data-cat="b"><span>Case 08</span></a></div><div data-fx-part="pager"><span data-fx-part="dots"></span><i data-fx-part="knob"></i></div></div><template data-demo-late><div data-fx="snap-slider"><div data-fx-part="track"><a class="card" href="#" data-cat="a"><span>Case 01</span></a><a class="card" href="#" data-cat="b"><span>Case 02</span></a><a class="card" href="#" data-cat="a b"><span>Case 03</span></a><a class="card" href="#" data-cat="c"><span>Case 04</span></a><a class="card" href="#" data-cat="b"><span>Case 05</span></a><a class="card" href="#" data-cat="a"><span>Case 06</span></a><a class="card" href="#" data-cat="c"><span>Case 07</span></a><a class="card" href="#" data-cat="b"><span>Case 08</span></a></div><div data-fx-part="pager"><span data-fx-part="dots"></span><i data-fx-part="knob"></i></div></div></template></section>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/Draggable.min.js"></script>
<script src="../../../_shared/vendor/gsap/InertiaPlugin.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); window.ScrollTrigger?.refresh(); }, 2500);
</script>
</body>
</html>
