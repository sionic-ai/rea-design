<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sweep-through-hover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 500 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  nav { display: flex; gap: 20px; padding: 40px; font-weight: 700; }
  nav a { color: inherit; text-decoration: none; }
  .rows { padding: 0 0 60vh; }
  .row { display: flex; align-items: center; gap: 14px; padding: 10px 20px 6px; color: inherit; text-decoration: none; font: 600 56px/1 var(--kf-font-display); }
  .bar { display: block; width: 42px; height: 2px; background: currentColor; }
</style>
</head>
<body>
<p class="demo-hint"><b>sweep-through-hover</b> — Hover over a menu link and a large line, then move away. <span style="color:var(--kf-dim)">(After 1s one more line comes in, and one leaves 2.5s later)</span></p>
<nav><a href="#" data-fx="sweep-through-hover" data-fx-sweep-through-hover="look: line">Menu 1</a><a href="#" data-fx="sweep-through-hover" data-fx-sweep-through-hover="look: line">Menu Two</a><a href="#" data-fx="sweep-through-hover" data-fx-sweep-through-hover="look: line">Menu Third</a><a href="#" data-fx="sweep-through-hover" data-fx-sweep-through-hover="look: line; grow: width" style="--fx-line-y: -10px; --fx-line-h: 5px; --fx-fill: var(--kf-accent); --fx-dur: .4s; --fx-ease: cubic-bezier(0,.55,.45,1)">Bar growing in width</a></nav>
<section class="rows">
  <a class="row" href="#" data-fx="sweep-through-hover"><span class="bar" data-fx-part="bar"></span>NOMINATE<span data-fx-part="band"></span></a>
  <a class="row" href="#" data-demo-remove data-fx="sweep-through-hover"><span class="bar" data-fx-part="bar"></span>Dropped Line<span data-fx-part="band"></span></a>
  <a class="row" href="#" data-fx="sweep-through-hover" style="--fx-fill: var(--kf-accent)"><span class="bar" data-fx-part="bar"></span>Without a band, use ::before</a>
  <template data-demo-late><a class="row" href="#" data-fx="sweep-through-hover"><span class="bar" data-fx-part="bar"></span>Late-arriving line<span data-fx-part="band"></span></a></template>
</section>
<script src="../fx-core.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
