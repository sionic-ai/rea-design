<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>step-widen-frame — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 14px/1.6 var(--kf-font-sans); }
  .demo-hint { position: relative; z-index: 5; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .frame { position: fixed; inset: 0; height: 100vh; }
  .frame [data-fx-part="media"] { background: repeating-linear-gradient(45deg, var(--kf-raised) 0 20px, var(--kf-line) 20px 40px); }
  .after { position: relative; z-index: 2; height: 300vh; padding: 110vh 20px 0; font-size: 20px; }
  .late { position: relative; z-index: 2; height: 240px; margin: 0 20px; }
</style>
</head>
<body>
<p class="demo-hint"><b>step-widen-frame</b> — Scroll down a little at a time. At 10, 100 and 150px the frame widens one step each, and past 600px a curtain is laid over. <span style="color:var(--kf-dim)">(After 1s one more small picture frame comes in, and leaves 2.5s later)</span></p>
<div class="frame" data-fx="step-widen-frame"><div data-fx-part="media"></div></div>
<div class="after">Content continues below here<div id="slot"></div></div>
<template data-demo-late><div class="late" data-fx="step-widen-frame" data-fx-step-widen-frame="widths: 60,80,100; bands: 80,40,0; steps: 20,80; shade: 0" data-demo-remove><div data-fx-part="media"></div></div></template>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => document.getElementById("slot").append(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
