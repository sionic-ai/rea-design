<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bento-drag-grid — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { max-width: 1200px; margin: 0 auto; padding: 24px 0 80px; }
  .demo-filters { display: flex; gap: 8px; justify-content: center; margin-bottom: 8px; }
  .demo-filters button { border: 1px solid var(--kf-line); background: var(--kf-surface); border-radius: 99px; padding: 6px 14px; cursor: pointer; }
  .tile { height: 100%; display: grid; place-items: center; background: var(--kf-surface); font: 700 20px/1 var(--kf-font-display); }
</style>
<script src="../../../_shared/vendor/gsap/gsap.min.js" defer></script>
<script src="../../_vendor/react@17.0.2/react.production.min.js" defer></script>
<script src="../../_vendor/react-dom@17.0.2/react-dom.production.min.js" defer></script>
<script src="../../_vendor/react-grid-layout@1.2.0/react-grid-layout.min.js" defer></script>
<script src="../fx-core.js" defer></script>
<script src="fx.js" defer></script>
</head>
<body>
<p class="demo-hint"><b>bento-drag-grid</b> — Use the buttons above to change the filter, then drag the cards. <span style="color:var(--kf-dim)">(After 1s one more grid cell comes in, and after 2.5s one drops out)</span></p>
<section class="demo">
  <div class="demo-filters">
    <button type="button" data-f="all">all</button><button type="button" data-f="a">a</button><button type="button" data-f="b">b</button>
  </div>
  <div class="demo-grid" data-fx="bento-drag-grid" data-fx-bento-drag-grid="rows: 160,140,120,100">
    <script type="application/json" data-fx-part="layouts">{"all":{"lg":[{"i":"1","x":0,"y":0,"w":2,"h":1},{"i":"2","x":2,"y":0,"w":1,"h":1},{"i":"3","x":3,"y":0,"w":1,"h":2},{"i":"4","x":0,"y":1,"w":1,"h":1},{"i":"5","x":1,"y":1,"w":2,"h":1}],"sm":[{"i":"1","x":0,"y":0,"w":2,"h":1},{"i":"2","x":0,"y":1,"w":1,"h":1},{"i":"3","x":1,"y":1,"w":1,"h":2},{"i":"4","x":0,"y":2,"w":1,"h":1},{"i":"5","x":0,"y":3,"w":2,"h":1}]},"a":{"lg":[{"i":"1","x":0,"y":0,"w":2,"h":1},{"i":"4","x":2,"y":0,"w":1,"h":1},{"i":"3","x":3,"y":0,"w":1,"h":2},{"i":"2","x":0,"y":1,"w":1,"h":1},{"i":"5","x":1,"y":1,"w":2,"h":1}]},"b":{"lg":[{"i":"3","x":0,"y":0,"w":1,"h":2},{"i":"5","x":1,"y":0,"w":2,"h":1},{"i":"2","x":3,"y":0,"w":1,"h":1},{"i":"1","x":1,"y":1,"w":2,"h":1},{"i":"4","x":3,"y":1,"w":1,"h":1}]}}</script>
    <div class="tile" data-fx-part="item" data-key="1" data-tags="a">1</div>
    <div class="tile" data-fx-part="item" data-key="2" data-tags="b">2</div>
    <div class="tile" data-fx-part="item" data-key="3" data-tags="b">3</div>
    <div class="tile" data-fx-part="item" data-key="4" data-tags="a">4</div>
    <div class="tile" data-fx-part="item" data-key="5" data-tags="b">5</div>
  </div>
  <template data-demo-late>
    <div class="demo-grid" data-fx="bento-drag-grid" data-fx-bento-drag-grid="rows: 120; dim: .4">
      <script type="application/json" data-fx-part="layouts">{"all":{"lg":[{"i":"x","x":0,"y":0,"w":3,"h":1},{"i":"y","x":3,"y":0,"w":1,"h":1}]}}</script>
      <div class="tile" data-fx-part="item" data-key="x" data-tags="a">late x</div>
      <div class="tile" data-fx-part="item" data-key="y" data-tags="b">late y</div>
    </div>
  </template>
  <div class="demo-grid" data-fx="bento-drag-grid"></div>
  <div class="demo-grid" data-demo-remove data-fx="bento-drag-grid" data-fx-bento-drag-grid="rows: 80; drag: off">
    <script type="application/json" data-fx-part="layouts">{"all":{"lg":[{"i":"r","x":0,"y":0,"w":4,"h":1}]}}</script>
    <div class="tile" data-fx-part="item" data-key="r">Soon-Removed Grid</div>
  </div>
</section>
<script>
document.querySelector(".demo-filters").addEventListener("click", (e) => {
  const f = e.target.closest("[data-f]")?.dataset.f;
  if (f) document.querySelectorAll("[data-fx~='bento-drag-grid']").forEach((g) => g.dispatchEvent(new CustomEvent("fx:filter", { detail: { name: f } })));
});
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
