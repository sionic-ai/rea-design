<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>comet-wires — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-above { height: 320px; }
  .demo-sec { position: relative; overflow-x: clip; border-top: 1px solid var(--kf-line); }
  .demo-sec svg { position: absolute; right: 0; bottom: -150px; width: min(640px, 70%); clip-path: inset(0 0 150px 0); }
  .demo-in { position: relative; width: min(900px, 90%); margin: 0 auto; padding: 56px 24px; border-inline: 1px solid var(--kf-line); font: 500 28px/1.2 var(--kf-font-display); }
</style>
</head>
<body>
<p class="demo-hint"><b>comet-wires</b> — A bundle of wires runs along the right of the bottom band, and a comet tail passes along the strands every 1~2s. Outside the band (above) the lines are pale gray.</p>
<div class="demo-above"></div>
<section class="demo-sec">
  <svg data-fx="comet-wires" data-fx-comet-wires="band: .demo-in"></svg>
  <div class="demo-in">Your last one-line title here</div>
</section>
<div class="demo-above"></div>
<script>
(() => {
  const src = document.querySelector(".demo-sec");
  const make = (tag) => { const el = src.cloneNode(true); el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => src.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
