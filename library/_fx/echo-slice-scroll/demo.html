<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>echo-slice-scroll — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 14px/1.4 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { display: grid; gap: 96px; padding: 24px 24px 160vh; }
  .demo figure { display: grid; gap: 12px; color: var(--kf-dim); }
  .demo [data-fx-part="layer"] { display: flex; align-items: center; gap: 4vw; color: var(--kf-ink); }
  .demo [data-fx-part="layer"] svg { display: block; width: 100%; height: auto; }
  .demo text { font: 500 220px/1 var(--kf-font-sans); fill: currentColor; }
</style>
</head>
<body>
<p class="demo-hint"><b>echo-slice-scroll</b> — Scroll down. The layer above the wordmark rises faster, and below it each layer reveals a 24px edge strip like stairs. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<div class="demo">
  <figure><div data-fx="echo-slice-scroll"><div data-fx-part="layer"><svg viewBox="0 0 1040 230" aria-hidden="true"><text x="0" y="200" textLength="1040" lengthAdjust="spacingAndGlyphs">Studio</text></svg></div></div><figcaption>Default · three clones · 24px each</figcaption></figure>
  <figure data-demo-remove><div data-fx="echo-slice-scroll" data-fx-echo-slice-scroll="copies: 2; step: 40"><div data-fx-part="layer"><svg viewBox="0 0 1040 230" aria-hidden="true"><text x="0" y="200" textLength="1040" lengthAdjust="spacingAndGlyphs">Name</text></svg></div></div><figcaption>Two clones · 40px apart (removed after 2.5s)</figcaption></figure>
  <template data-demo-late><figure><div data-fx="echo-slice-scroll" data-fx-echo-slice-scroll="copies: 4; step: 16; offset: 0"><div data-fx-part="layer"><svg viewBox="0 0 1040 230" aria-hidden="true"><text x="0" y="200" textLength="1040" lengthAdjust="spacingAndGlyphs">Late</text></svg></div></div><figcaption>Late · Four clones · 16px each</figcaption></figure></template>
  <figure><div data-fx="echo-slice-scroll"></div><figcaption>No layers (quiet)</figcaption></figure>
</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
