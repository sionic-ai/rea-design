<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cloud-ring-hover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { display: flex; flex-wrap: wrap; gap: 32px; padding: 48px 20px; align-items: center; }
  .btn { display: inline-flex; align-items: center; gap: 12px; height: 38px; padding: 0 26px; border-radius: 3.5px; font-size: 9px; letter-spacing: .4em; text-transform: uppercase; }
  .btn > span:last-child { overflow: hidden; padding: 2px 0; }
</style>
</head>
<body>
<p class="demo-hint"><b>cloud-ring-hover</b> — Hover over the button (Tab focus works the same) <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<section class="demo">
  <a class="btn" data-fx="cloud-ring-hover" href="#"><span><span data-fx-part="label">View all work</span></span></a>
  <button class="btn" type="button" data-fx="cloud-ring-hover" data-fx-cloud-ring-hover="look: fill"><span><span data-fx-part="label">How the Inside Fills Up</span></span></button>
  <button class="btn" type="button" data-fx="cloud-ring-hover" data-fx-cloud-ring-hover="reveal: .35; hide: .2"><span><span data-fx-part="label">Fast Type</span></span></button>
  <a class="btn" data-fx="cloud-ring-hover" data-demo-remove href="#"><span><span data-fx-part="label">Being removed soon</span></span></a>
  <button class="btn" type="button" data-fx="cloud-ring-hover"></button>
  <template data-demo-late><a class="btn" data-fx="cloud-ring-hover" href="#"><span><span data-fx-part="label">Late-arrived Button</span></span></a></template>
</section>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
