<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mirror-trail-cursor — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { height: 70vh; margin: 40px 0; background: var(--kf-contrast-bg); color: var(--kf-contrast-ink); display: grid; place-items: center; }
</style>
</head>
<body>
<p class="demo-hint"><b>mirror-trail-cursor</b> — Move the mouse over the dark panel and a square follows with a trail, while an inverted twin moves on the opposite side.</p>
<section class="demo" data-fx="mirror-trail-cursor"><p>Your Hero title here</p></section>
<script>
(() => {
  const src = document.querySelector('[data-fx~="mirror-trail-cursor"]');
  if (!src) return;
  const make = (tag) => { const el = document.createElement("section"); el.className = "demo"; el.dataset.fx = "mirror-trail-cursor"; el.dataset.demo = tag; el.style.height = "40vh"; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => src.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s one more panel comes in, and after 2.5s one drops out (detach).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
