<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>smoke-rise-loop — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-contrast-bg); color: var(--kf-contrast-ink); font: 400 14px/1.6 var(--kf-font-sans); overflow-x: clip; }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); color: var(--kf-ink); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .stage { position: relative; height: 900px; overflow: hidden; display: flex; gap: 40px; justify-content: center; padding-top: 400px; }
  .smoke { width: min(624px, 60vw); height: 500px; }
  .smoke svg { stroke: var(--kf-contrast-ink); }
</style>
</head>
<body>
<p class="demo-hint"><b>smoke-rise-loop</b> Smoke rises and fades over 18 seconds, and after 8.5 seconds a second wisp joins (the small one on the right is 6s · 2s). <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<div class="stage">
  <div class="smoke" data-fx="smoke-rise-loop"><svg data-fx-part="wisp" viewBox="0 0 680 940" fill="none" stroke-linecap="round"><path d="M340 930c-30-130 50-190 15-310s-70-170-20-290 50-190 10-330" stroke-width="150" opacity=".16"/><path d="M380 900c25-110-30-200 10-310s60-150 25-260-30-180 10-320" stroke-width="80" opacity=".14"/></svg></div>
  <div class="smoke" data-fx="smoke-rise-loop" data-fx-smoke-rise-loop="dur: 6; join: 2; rise: 500" data-demo-remove><svg data-fx-part="wisp" viewBox="0 0 680 940" fill="none" stroke-linecap="round"><path d="M340 930c-30-130 50-190 15-310s-70-170-20-290" stroke-width="120" opacity=".2"/></svg></div>
  <template data-demo-late><div class="smoke" data-fx="smoke-rise-loop" data-fx-smoke-rise-loop="dur: 6; join: 2; rise: 500"><svg data-fx-part="wisp" viewBox="0 0 680 940" fill="none" stroke-linecap="round"><path d="M340 930c-30-130 50-190 15-310s-70-170-20-290" stroke-width="120" opacity=".2"/></svg></div></template>
</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
