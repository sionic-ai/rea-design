<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>window-expand-scrub — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .scene { position: relative; }
  .stage { position: sticky; top: 0; height: 100vh; overflow: hidden; }
  .logo { position: absolute; left: 20px; top: 10vh; width: min(70vw, 100vh); aspect-ratio: 800 / 585; border: 2px dashed var(--kf-ink); display: grid; place-items: center; font: 800 12vmin/1 var(--kf-font-display); }
  .photo { position: absolute; inset: 0; }
  .photo .wf-img { height: 100%; border: 0; display: block; }
  .next { position: relative; height: 140vh; padding: 20px; }
  .end { height: 60vh; }
</style>
</head>
<body>
<p class="demo-hint"><b>window-expand-scrub</b> — Scroll down. A photo seen through a window inside a dashed box spreads out to fill the whole screen. <span style="color:var(--kf-dim)">(After 1s one more section comes in, and one leaves 2.5s later)</span></p>
<div class="scene" data-fx="window-expand-scrub">
  <div class="stage"><div class="logo" data-fx-part="ref">LO<br>GO</div><div class="photo" data-fx-part="media"><span class="wf-img" data-label="Full-screen photo · notes laid out across it"></span></div></div>
  <section class="next" data-fx-part="trigger">Your next section here</section>
</div>
<div data-late-slot></div>
<div class="scene" data-demo-remove data-fx="window-expand-scrub" data-fx-window-expand-scrub="inset: 30 30 30 30">
  <div class="stage"><div class="logo" data-fx-part="ref">X</div><div class="photo" data-fx-part="media"><span class="wf-img" data-label="Dropping section"></span></div></div>
  <section class="next" data-fx-part="trigger"></section>
</div>
<template data-demo-late><div class="scene" data-fx="window-expand-scrub" data-fx-window-expand-scrub="inset: 10 10 10 10; scrub: 1"><div class="stage"><div class="logo" data-fx-part="ref">LATE</div><div class="photo" data-fx-part="media"><span class="wf-img" data-label="Late-arrived Photo"></span></div></div><section class="next" data-fx-part="trigger">Footer</section></div></template>
<div class="end"></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script>gsap.registerPlugin(ScrollTrigger);</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => document.querySelector("[data-late-slot]").replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); ScrollTrigger.refresh(); }, 2500);
</script>
</body>
</html>
