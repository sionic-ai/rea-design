<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>scroll-countdown — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .meter { position: fixed; right: 24px; bottom: 24px; z-index: 50; font: 500 14px/1 var(--kf-font-sans); letter-spacing: -0.025em; }
  .meter + .meter { bottom: 52px; }
  .tall { height: 400vh; padding: 120px 20px; color: var(--kf-dim); }
</style>
</head>
<body>
<p class="demo-hint"><b>scroll-countdown</b> — Scroll down and the number at bottom right counts down from 377 to 0 at the very bottom. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<span class="meter" data-fx="scroll-countdown">(Altitude<span data-fx-part="num">377</span>)</span>
<span class="meter" data-fx="scroll-countdown" data-fx-scroll-countdown="from: 0; to: 100" data-demo-remove>0</span>
<template data-demo-late><span class="meter" style="bottom:80px" data-fx="scroll-countdown" data-fx-scroll-countdown="from: 12; to: 1">Floor <span data-fx-part="num">12</span></span></template>
<div class="tall">Scroll down.</div>
<span data-fx="scroll-countdown"></span>
<section data-fx-part="track" style="height:160vh"><div style="position:sticky;top:0;height:100vh;display:grid;place-items:center;font-size:clamp(4rem,14vw,12rem);font-weight:700"><span data-fx="scroll-countdown" data-fx-scroll-countdown="from: 0; to: 400; track: section; ease: out"><span data-fx-part="num">0</span><small style="font-size:.25em"> km</small></span></div></section>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
