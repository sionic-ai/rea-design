<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rope-hang-photos — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .stage { position: relative; height: 80vh; margin: 24px; border: 1px solid var(--kf-line); }
  .stage h2 { position: absolute; left: 50%; top: 50%; translate: -50% -50%; font: 700 40px/1 var(--kf-font-display); }
  .ph { position: absolute; width: 120px; padding: 6px 6px 18px; background: var(--kf-surface); box-shadow: var(--kf-shadow-lift); }
  .ph i { display: block; aspect-ratio: 4 / 5; background: var(--kf-raised); }
</style>
</head>
<body>
<p class="demo-hint"><b>rope-hang-photos</b> — Sweep the mouse across the row. Hover a photo and it tilts toward it. <span style="color:var(--kf-dim)">(After 1s one more panel comes in, and one leaves 2.5s later)</span></p>
<section class="stage" data-fx="rope-hang-photos">
  <h2>Your title here</h2>
  <figure class="ph" data-fx-part="photo" style="left:8%;top:12%"><i></i></figure>
  <figure class="ph" data-fx-part="photo" style="left:40%;top:6%"><i></i></figure>
  <figure class="ph" data-fx-part="photo" style="left:76%;top:14%"><i></i></figure>
  <figure class="ph" data-fx-part="photo" style="left:80%;top:58%"><i></i></figure>
  <figure class="ph" data-fx-part="photo" style="left:44%;top:66%"><i></i></figure>
  <figure class="ph" data-fx-part="photo" style="left:6%;top:56%"><i></i></figure>
</section>
<section class="stage" data-demo-remove data-fx="rope-hang-photos" data-fx-rope-hang-photos="wave: 0; lean: 10">
  <figure class="ph" data-fx-part="photo" style="left:10%;top:20%"><i></i></figure>
  <figure class="ph" data-fx-part="photo" style="left:70%;top:20%"><i></i></figure>
</section>
<template data-demo-late><section class="stage" data-fx="rope-hang-photos" data-fx-rope-hang-photos="sag: .15">
  <figure class="ph" data-fx-part="photo" style="left:12%;top:14%"><i></i></figure>
  <figure class="ph" data-fx-part="photo" style="left:46%;top:40%"><i></i></figure>
  <figure class="ph" data-fx-part="photo" style="left:78%;top:12%"><i></i></figure>
</section></template>
<section class="stage" data-fx="rope-hang-photos"><figure class="ph" data-fx-part="photo" style="left:40%;top:30%"><i></i></figure></section>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); }, 2500);
</script>
</body>
</html>
