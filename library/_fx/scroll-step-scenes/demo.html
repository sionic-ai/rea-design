<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>scroll-step-scenes — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo-spacer { height: 60vh; display: grid; place-items: center; color: var(--kf-dim); }
  [data-fx-part="step"] { display: grid; place-items: center; text-align: center; }
  [data-fx-part="step"]:nth-child(1) { background: var(--kf-surface); }
  [data-fx-part="step"]:nth-child(2) { background: var(--kf-accent-soft); }
  [data-fx-part="step"]:nth-child(3) { background: var(--kf-raised); }
  [data-fx-part="title"] { font: 400 48px/1.1 var(--kf-font-display); max-width: 14ch; }
  .bar { position: absolute; left: 0; right: 0; bottom: 40px; display: flex; justify-content: center; align-items: center; gap: 8px; font-size: 14px; }
  .bar span { position: relative; width: 80px; height: 2px; background: var(--kf-line); }
  .bar i { position: absolute; inset: 0; background: var(--kf-ink); }
</style>
</head>
<body>
<p class="demo-hint"><b>scroll-step-scenes</b> — Scroll down. While the stage is pinned, cells overlap and swap one at a time and the title words light up in turn.</p>
<div class="demo-spacer">Downward</div>
<section data-fx="scroll-step-scenes">
  <div data-fx-part="stage">
    <div data-fx-part="step"><h2 data-fx-part="title">First column title sentence, four words</h2></div>
    <div data-fx-part="step"><h2 data-fx-part="title">Second column — a slightly longer title sentence</h2></div>
    <div data-fx-part="step"><h2 data-fx-part="title">Third column title</h2></div>
    <div class="bar"><b data-fx-part="num">01</b><span><i data-fx-part="fill"></i></span><b>03</b></div>
  </div>
</section>
<div class="demo-spacer">Footer</div>
<section data-fx="scroll-step-scenes"><div data-fx-part="stage"></div></section>
<section data-fx="scroll-step-scenes"></section>
<script>
(() => {
  const src = document.querySelector('[data-fx~="scroll-step-scenes"]');
  if (!src) return;
  const html = src.outerHTML.replace(/\sid="[^"]*"/g, "");
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => src.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical one comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/SplitText.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
