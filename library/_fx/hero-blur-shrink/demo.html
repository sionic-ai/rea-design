<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hero-blur-shrink — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-contrast-bg); color: var(--kf-contrast-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: fixed; top: 0; left: 0; right: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); color: var(--kf-ink); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .hero { position: fixed; inset: 0; z-index: 5; overflow: hidden; background: var(--kf-contrast-bg); }
  .hero .wf-img { position: absolute; inset: -1%; width: 102%; height: 102%; }
  .hero__logo { position: absolute; inset: 0; display: grid; place-items: center; font: 800 56px/1 var(--kf-font-display); color: var(--kf-contrast-ink); }
  .after { position: relative; z-index: 1; height: 300vh; padding: 120vh 24px 0; }
</style>
</head>
<body>
<p class="demo-hint"><b>hero-blur-shrink</b> — Scroll down. Over one screen, the photo shrinks and blurs, the logo shrinks, and the panel disappears.</p>
<section class="hero" data-fx="hero-blur-shrink">
  <div class="wf-img" data-fx-part="image" data-label="Dark leather grain macro · low side light · full frame"></div>
  <div class="hero__logo" data-fx-part="logo">Logo</div>
</section>
<section class="after"><p>The next section revealed after the hero melts away.</p></section>
<script>
(() => {
  const t = document.createElement("template");
  t.innerHTML = '<section class="hero" style="z-index:0" data-fx="hero-blur-shrink" data-fx-hero-blur-shrink="fade: off"></section>';
  const empty = t.content.firstElementChild;
  setTimeout(() => document.body.append(empty), 1000);
  setTimeout(() => empty.remove(), 2500);
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
