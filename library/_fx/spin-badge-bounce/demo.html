<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>spin-badge-bounce — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .room { height: 160vh; }
  .badge { position: fixed; right: 24px; bottom: 40px; display: block; width: 120px; color: var(--kf-on-accent); text-decoration: none; }
  .badge + .badge { right: 170px; }
  .badge__fig { position: absolute; z-index: 2; top: -40px; left: 0; right: 0; width: 44px; height: 52px; margin: 0 auto; border: 2px solid var(--kf-ink); border-radius: 50% 50% 46% 46%; background: var(--kf-bg); }
  .badge__ring { position: absolute; inset: 0; border-radius: 50%; background: var(--kf-ink); outline: 6px dotted var(--kf-ink); outline-offset: -3px; }
  .badge__in { position: relative; z-index: 1; display: grid; place-items: center; width: 120px; height: 120px; font-weight: 700; font-size: 14px; text-align: center; }
  footer { padding: 120px 20px; background: var(--kf-surface); }
</style>
</head>
<body>
<p class="demo-hint"><b>spin-badge-bounce</b> — Hover the bottom-right button (the character above bounces). Scroll down until the footer appears and the button hides.</p>
<div class="room"></div>
<a class="badge" href="#" data-fx="spin-badge-bounce" data-fx-spin-badge-bounce="until: footer"><i class="badge__fig" data-fx-part="figure"></i><span class="badge__ring" data-fx-part="ring"></span><span class="badge__in">Crowding Status<br>is here</span></a>
<footer>Footer — once this comes into view, the button drops down out of the way</footer>
<script>
(() => {
  const src = document.querySelector('[data-fx~="spin-badge-bounce"]');
  if (!src) return;
  const html = src.outerHTML;
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => src.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical one comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
