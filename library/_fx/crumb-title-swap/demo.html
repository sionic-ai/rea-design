<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>crumb-title-swap — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: fixed; bottom: 0; left: 0; right: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-top: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .head { position: fixed; top: 0; left: 0; right: 0; height: 80px; display: flex; align-items: center; z-index: 10; background: var(--kf-bg); }
  .head nav { width: min(720px, 100vw - 180px); margin: 0 auto; font-size: 20px; }
  section { min-height: 90vh; display: grid; place-items: center; border-bottom: 1px solid var(--kf-line); font-size: 40px; }
</style>
</head>
<body>
<header class="head"><nav data-fx="crumb-title-swap"><span data-fx-part="prefix"><a href="#">Site Name</a><span data-fx-part="sep"><span>→</span></span></span><span data-fx-part="slot"></span></nav></header>
<section>Hero — no name</section>
<section data-section-title="What we do">What we do</section>
<section data-section-title="How We Work" data-demo-remove>How we work (drops out after 2.5s)</section>
<section data-section-title="Where We Work">Where We Work</section>
<template data-demo-late><section data-section-title="Late-arriving section">Late-arriving section</section></template>
<p class="demo-hint"><b>crumb-title-swap</b> — Scroll down. The current section name attaches to the center of the header row and changes.</p>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
