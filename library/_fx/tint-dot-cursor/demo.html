<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tint-dot-cursor — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 30; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  main { display: grid; grid-template-columns: repeat(3, 220px); gap: 24px; padding: 48px 20px; }
  .card { display: block; aspect-ratio: 4 / 5; }
  .links { display: flex; flex-direction: column; gap: 8px; }
</style>
</head>
<body>
<p class="demo-hint"><b>tint-dot-cursor</b> — Move the mouse. Over links it grows translucent, over photo cards it grows larger and “View” appears. Pressing makes it flinch.</p>
<main>
  <a class="card wf-img" href="#" data-cursor="project" data-label="Work photo · Vertical 4:5"></a>
  <div class="links"><a href="#">Link one</a><a href="#">Link Two</a><nav data-cursor="subtle"><a href="#">Quiet link (dot as is)</a></nav><button type="button">Button</button></div>
</main>
<div data-fx="tint-dot-cursor"><span data-fx-part="dot"></span><span data-fx-part="label">View</span></div>
<div data-fx="tint-dot-cursor" data-demo-remove></div>
<template data-demo-late><div data-fx="tint-dot-cursor" data-fx-tint-dot-cursor="lerp: .18; text: view"></div></template>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 600);
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll('[data-fx="tint-dot-cursor"]:not(:first-of-type)').forEach((n) => n.remove()), 1600);
</script>
</body>
</html>
