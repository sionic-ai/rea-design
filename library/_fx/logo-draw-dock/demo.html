<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>logo-draw-dock — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-head { display: flex; align-items: center; justify-content: space-between; padding: 16px 32px; }
  .demo-head svg { display: block; width: 77px; height: 40px; }
  .demo-hint { padding: 12px 32px; font: 500 13px/1.4 var(--kf-font-mono); }
  .mark { width: 112px; height: 58px; }
  main { padding: 80px 32px; font: 500 56px/1.05 var(--kf-font-display); }
</style>
</head>
<body>
<header class="demo-head"><a class="demo-logo" href="#" aria-label="Home"><svg viewBox="0 0 77 40" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" aria-hidden="true"><path d="M4 31c4 6 15 6 18-2 3-8-6-12-10-6-4 6 3 13 12 10 6-2 9-9 9-16"/><circle cx="35" cy="5" r="2.6" fill="currentColor" stroke="none"/><circle cx="40" cy="25" r="7.5"/><path d="M53 18l5 14 5-14M71 18v14"/></svg></a></header>
<p class="demo-hint"><b>logo-draw-dock</b> On open, the center logo is drawn in lines, then flies to the header logo spot and settles in (reload to see it again).</p>
<main>Hero Behind the Curtain</main>
<div data-fx="logo-draw-dock" data-fx-logo-draw-dock="to: .demo-logo svg; done: demo:intro" aria-hidden="true"><svg class="mark" data-fx-part="logo" viewBox="0 0 77 40" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"><path d="M4 31c4 6 15 6 18-2 3-8-6-12-10-6-4 6 3 13 12 10 6-2 9-9 9-16"/><circle cx="35" cy="5" r="2.6" fill="currentColor" stroke="none"/><circle cx="40" cy="25" r="7.5"/><path d="M53 18l5 14 5-14M71 18v14"/></svg></div>
<div data-fx="logo-draw-dock" data-demo-remove></div>
<template data-demo-late><div data-fx="logo-draw-dock" data-fx-logo-draw-dock="draw: .6; hold: 0; fly: .3"></div></template>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
