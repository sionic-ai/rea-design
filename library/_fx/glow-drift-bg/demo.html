<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>glow-drift-bg — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.6 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 300; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  main { position: relative; z-index: 3; padding: 80px 20px; max-width: 640px; margin: 0 auto; }
  .box { position: relative; height: 240px; margin: 40px 20px; border: 1px solid var(--kf-line); overflow: hidden; }
</style>
</head>
<body>
<p class="demo-hint"><b>glow-drift-bg</b> — Blurry circles of light slowly drift behind the background (watch quietly). <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<div data-fx="glow-drift-bg" aria-hidden="true"></div>
<main><p>Your body copy goes here. A canvas behind it softly tints the background at .1 opacity and 25px blur.</p></main>
<div class="box" data-fx="glow-drift-bg" data-fx-glow-drift-bg="fixed: 0; opacity: 0.6; blur: 10; count: 40" data-demo-remove></div>
<template data-demo-late><div class="box" data-fx="glow-drift-bg" data-fx-glow-drift-bg="fixed: 0; opacity: 0.5; count: 20"></div></template>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
