<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bow-curtain-loader — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { margin: 0; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .page { min-height: 80vh; display: grid; place-items: center; font: 700 48px/1 var(--kf-font-display); }
  .ld [data-fx-part="count"] { right: 12px; bottom: 120px; margin: 0; font: 700 160px/1 var(--kf-font-sans); }
  .ld [data-fx-part="line"] { left: 0; bottom: 12px; margin: 0; font: 700 110px/1 var(--kf-font-sans); }
  .ld [data-fx-part="line"] span span { padding-right: 0.4em; }
  .demo-btn { margin: 16px 20px; height: 40px; padding: 0 16px; border: 1px solid var(--kf-line); border-radius: var(--kf-radius-sm); background: var(--kf-surface); color: var(--kf-ink); cursor: pointer; }
</style>
</head>
<body>
<p class="demo-hint"><b>bow-curtain-loader</b> — On open, the number counts to 100 and two curtains with curved bottoms lift. You can replay it with the button.</p>
<div class="ld" data-fx="bow-curtain-loader"><p data-fx-part="count">0</p><p data-fx-part="line"><span>SALON NAME STUDIO</span></p></div>
<main class="page" id="page">Your Hero here</main>
<button class="demo-btn" type="button" id="again">Reopen (no number)</button>
<script>
// Late arrivals and removals — 1s later one more identical curtain comes in (late arrival), and 2.5s later the first curtain is removed to see teardown
(() => {
  const src = document.querySelector('[data-fx~="bow-curtain-loader"]');
  setTimeout(() => { const late = src.cloneNode(true); late.dataset.demo = "late"; late.setAttribute("data-fx-bow-curtain-loader", "count: off; bow: 30"); document.body.append(late); }, 1000);
  setTimeout(() => src.remove(), 2500);
  document.addEventListener("fx:reveal", () => gsap.fromTo("#page", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 1.25, ease: "expo.out" }));
  document.getElementById("again").addEventListener("click", () => {
    const el = document.createElement("div");
    el.className = "ld";
    el.dataset.fx = "bow-curtain-loader";
    el.setAttribute("data-fx-bow-curtain-loader", "count: off");
    document.body.append(el);
    el.addEventListener("fx:done", () => el.remove());
  });
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
