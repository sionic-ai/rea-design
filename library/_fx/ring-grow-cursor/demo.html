<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ring-grow-cursor — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { display: flex; flex-wrap: wrap; gap: 32px; align-items: center; padding: 64px 20px; }
  .demo-btn { display: inline-flex; align-items: center; height: 44px; padding: 0 22px; border: 1px solid var(--kf-line); border-radius: 50%; background: var(--kf-surface); color: var(--kf-ink); }
  .demo-card { width: 260px; height: 180px; display: grid; place-items: center; border: 1px solid var(--kf-line); border-radius: var(--kf-radius-md); background: var(--kf-surface); }
</style>
</head>
<body>
<p class="demo-hint"><b>ring-grow-cursor</b> — Move the mouse. Over links and buttons the ring grows, over the right panel text floats up, and oval buttons are slightly pulled toward the cursor.</p>
<section class="demo">
  <a class="demo-btn" href="#">Link one</a>
  <a class="demo-btn" href="#" data-magnet>Tempting button</a>
  <div class="demo-card" data-cursor="Drag">Panel where text appears</div>
</section>
<div class="ring" data-fx="ring-grow-cursor" aria-hidden="true"><span data-fx-part="label"></span></div>
<script>
(() => {
  const src = document.querySelector('[data-fx~="ring-grow-cursor"]');
  const make = (tag) => { const el = src.cloneNode(true); el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => { src.remove(); document.body.append(make("late")); }, 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1 second a new ring comes in (a late arrival), and after 2.5 seconds one drops out (detach).");
})();
</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
