<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>wheel-hole-gate — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: fixed; bottom: 0; left: 0; right: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-top: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .gate { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; background: var(--kf-contrast-bg); color: var(--kf-contrast-ink); font: 700 40px/1.2 var(--kf-font-display); }
  .page { min-height: 300vh; padding: 30vh 20px; background: var(--kf-accent-soft); }
  .top { position: fixed; top: 12px; right: 12px; z-index: 60; }
</style>
</head>
<body>
<div class="gate" data-fx="wheel-hole-gate">Try scrolling the wheel</div>
<button class="top demo-btn" type="button">Lock again</button>
<main class="page"><p>Body below the curtain — scrolls once the hole opens.</p></main>
<p class="demo-hint"><b>wheel-hole-gate</b> — With the wheel or the ↓ key the center hole grows, and if you scroll past 35% and stop, it opens fully.</p>
<script>
// Late arrivals and removals — also attaches to a panel added after 1 second, and checks that a panel removed after 2.5 seconds gets detached (both small panels)
(() => {
  const mk = (tag) => { const el = document.createElement("div"); el.dataset.fx = "wheel-hole-gate"; el.dataset.demo = tag; el.style.cssText = "position:absolute;left:20px;top:40px;width:120px;height:80px;background:var(--kf-raised)"; return el; };
  const gone = mk("gone");
  document.body.append(gone);
  setTimeout(() => document.body.append(mk("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".top").addEventListener("click", () => document.querySelector(".gate").dispatchEvent(new Event("fx:lock")));
  document.querySelector(".demo-hint").append(" · After 1s one more small panel comes in, and after 2.5s one drops out.");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
