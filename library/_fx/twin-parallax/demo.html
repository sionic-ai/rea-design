<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>twin-parallax — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo-spacer { height: 90vh; display: grid; place-items: center; color: var(--kf-dim); }
  .collage { display: grid; grid-template-columns: 670fr 360fr; gap: 0 6%; padding: 0 20px; aspect-ratio: 1100 / 580; }
  .collage figure { margin: 0; }
  .collage .a { order: 2; aspect-ratio: 1 / 1; }
  .collage .b { aspect-ratio: 670 / 378; margin-top: auto; }
  .ph { position: relative; background: var(--kf-surface); }
  .ph i { display: block; width: 100%; height: 100%; background: linear-gradient(160deg, var(--kf-raised), var(--kf-line)); }
  .row { display: flex; gap: 6%; padding: 120px 20px; }
  .row figure { flex: 1; aspect-ratio: 4 / 3; margin: 0; }
</style>
</head>
<body>
<p class="demo-hint"><b>twin-parallax</b> — Scroll and watch the outer frame and the inner image move at different speeds. <span style="color:var(--kf-dim)">(After 1s one more cell comes in, and one leaves 2.5s later)</span></p>
<div class="demo-spacer">Scroll down</div>
<section class="collage">
  <figure class="a ph" data-fx="twin-parallax" data-fx-twin-parallax="drift: 40; ratio: .08"><i data-fx-part="inner"></i></figure>
  <figure class="b ph" data-fx="twin-parallax" data-fx-twin-parallax="drift: -20; ratio: .12"><i data-fx-part="inner"></i></figure>
</section>
<section class="row">
  <figure class="ph" data-demo-remove data-fx="twin-parallax" data-fx-twin-parallax="drift: 30"><i data-fx-part="inner"></i></figure>
  <figure class="ph" data-fx="twin-parallax" data-fx-twin-parallax="drift: 100; ratio: 0"><i data-fx-part="inner"></i></figure>
  <template data-demo-late><figure class="ph" data-fx="twin-parallax" data-fx-twin-parallax="drift: 10; ratio: .15"><i data-fx-part="inner"></i></figure></template>
</section>
<div class="demo-spacer"></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
