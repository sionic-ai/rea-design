<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dot-grid-bulge — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-contrast-bg); color: var(--kf-contrast-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: relative; z-index: 2; padding: 12px 20px; background: var(--kf-surface); color: var(--kf-ink); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .stage { height: 70vh; opacity: .5; }
  .small { height: 30vh; opacity: .5; margin-top: 20px; }
</style>
</head>
<body>
<p class="demo-hint"><b>dot-grid-bulge</b> — Move your mouse over the board — the dots around the edge push away like a lens only while you move, and settle when you stop. On open, the dots rise diagonally. <span style="color:var(--kf-dim)">(One more panel comes in after 1s, and the top panel drops out after 2.5s)</span></p>
<div class="stage" data-demo-remove data-fx="dot-grid-bulge"></div>
<template data-demo-late><div class="small" data-fx="dot-grid-bulge" data-fx-dot-grid-bulge="cell: 20; radius: .3"></div></template>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
