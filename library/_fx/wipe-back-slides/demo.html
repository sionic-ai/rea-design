<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>wipe-back-slides — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .row { display: flex; gap: 40px; justify-content: center; padding: 60px 20px; }
  .stack { width: 300px; aspect-ratio: 330 / 300; border: 1px solid var(--kf-ink); border-radius: 50% 4px; overflow: hidden; }
  .stack .wf-img { height: 100%; border: 0; }
</style>
</head>
<body>
<p class="demo-hint"><b>wipe-back-slides</b> — Wait and see. From 3.6s on, the top photo wipes from the right edge to the left, revealing the next photo. Delay per cell is 0, .3 and .6s. <span style="color:var(--kf-dim)">(After 1s one more cell comes in, and one leaves 2.5s later)</span></p>
<div class="row">
  <ul class="stack" data-fx="wipe-back-slides" data-fx-wipe-back-slides="first: 1.5">
    <li data-fx-part="slide"><div class="wf-img" data-label="Photo 3"></div></li>
    <li data-fx-part="slide"><div class="wf-img" data-label="Photo 2"></div></li>
    <li data-fx-part="slide"><div class="wf-img" data-label="Photo 1 · Top"></div></li>
  </ul>
  <ul class="stack" data-fx="wipe-back-slides" data-fx-wipe-back-slides="first: 1.5" style="--fx-delay: .3s">
    <li data-fx-part="slide"><div class="wf-img" data-label="Photo B"></div></li>
    <li data-fx-part="slide"><div class="wf-img" data-label="Photo A"></div></li>
  </ul>
  <ul class="stack" data-fx="wipe-back-slides" data-fx-wipe-back-slides="first: 1.5; look: up" style="--fx-delay: .6s" data-demo-remove>
    <li data-fx-part="slide"><div class="wf-img" data-label="Wipe down B"></div></li>
    <li data-fx-part="slide"><div class="wf-img" data-label="Wipe down A"></div></li>
  </ul>
</div>
<template data-demo-late><div class="row"><ul class="stack" data-fx="wipe-back-slides" data-fx-wipe-back-slides="first: 1; on: ready"><li data-fx-part="slide"><div class="wf-img" data-label="Late B"></div></li><li data-fx-part="slide"><div class="wf-img" data-label="Late A"></div></li></ul></div></template>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
