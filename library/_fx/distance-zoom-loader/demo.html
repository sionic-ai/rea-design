<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>distance-zoom-loader — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 500 13px/1.4 var(--kf-font-sans); min-height: 120vh; }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .ld { color: var(--kf-ink); }
  .ld [data-fx-part="line"] { position: absolute; right: 80px; top: 20%; width: 2px; height: 60%; }
  .ld [data-fx-part="meter"] { position: absolute; right: 96px; top: 45%; font-size: 20px; }
  .ld svg { position: absolute; inset: 0; width: 100%; height: 100%; }
</style>
</head>
<body>
<p class="demo-hint"><b>distance-zoom-loader</b> — Open it and the map approaches the island, the number rises 0 → 200, and the panel lifts away. <span style="color:var(--kf-dim)">(After 1s an empty panel slides in, and after 2.5s it leaves)</span></p>
<div class="ld" data-fx="distance-zoom-loader" data-fx-distance-zoom-loader="min: 2; zoom: 6; x: -.4; y: -.4; out: 1">
  <i data-fx-part="line"></i><p data-fx-part="meter"><span data-fx-part="num">0</span> km</p>
  <svg data-fx-part="map" viewBox="0 0 400 300"><g data-fx-part="zoom"><rect x="0" y="0" width="400" height="300" style="fill: var(--kf-surface)"/><circle cx="280" cy="210" r="8" style="fill: var(--kf-accent)"/><path d="M40 60h120v60H40z" style="fill: var(--kf-raised)"/></g></svg>
  <svg data-fx-part="island" viewBox="0 0 400 300"><ellipse cx="200" cy="150" rx="90" ry="60" style="fill: var(--kf-accent)"/></svg>
</div>
<template data-demo-late><div data-fx="distance-zoom-loader" data-fx-distance-zoom-loader="min: .5; out: .3"></div></template>
<div data-fx="distance-zoom-loader" data-demo-remove data-fx-distance-zoom-loader="min: 1; out: .2"></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); }, 2500);
</script>
</body>
</html>
