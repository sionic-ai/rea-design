<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>scroll-compact-header — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: fixed; bottom: 0; left: 0; right: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-top: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  header.hd { position: fixed; top: 0; left: 0; right: 0; z-index: 50; display: grid; place-items: center; background: var(--kf-surface); box-shadow: var(--kf-shadow-soft); }
  header.hd [data-fx-part="hide"] { position: absolute; left: 24px; top: 20px; font-weight: 600; }
  header.hd [data-fx-part="logo"] { aspect-ratio: 1; border-radius: 50%; background: var(--kf-accent); }
  header.hd.is-compact { place-items: center start; padding-left: 24px; }
  .fill { height: 2400px; padding: 200px 24px; }
  .late { position: fixed; top: 0; right: 0; z-index: 60; width: 120px; padding: 8px; background: var(--kf-raised); }
</style>
</head>
<body>
<p class="demo-hint"><b>scroll-compact-header</b> — Scroll down past 500px and the large headline collapses to one line (wide screens). Scroll back up to restore it. <span style="color:var(--kf-dim)">(After 1s one more small header comes in, and after 2.5s one drops out)</span></p>
<header class="hd" data-fx="scroll-compact-header" data-demo-remove><p data-fx-part="hide">Brand line</p><a data-fx-part="logo" href="#" aria-label="Logo"></a></header>
<template data-demo-late><div class="late" data-fx="scroll-compact-header" data-fx-scroll-compact-header="at: 200; wide: (min-width: 1px)" style="--fx-tall: 80px; --fx-short: 40px; --fx-dur: .3s">Late-added Head</div></template>
<div data-fx="scroll-compact-header"></div>
<div class="fill">Try scrolling down.</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
