<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fade-zoom-slides — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .stage { height: 70vh; margin: 20px; }
  .stage .wf-img { height: 100%; }
</style>
</head>
<body>
<p class="demo-hint"><b>fade-zoom-slides</b> — Just watch. The photo changes with a fade every few seconds, and the lit photo slowly zooms in (demo is set to 2 seconds).</p>
<div class="stage" data-fx="fade-zoom-slides" data-fx-fade-zoom-slides="every: 2; fade: 1">
  <div data-fx-part="slide"><div class="wf-img" data-fx-part="media" data-label="Photo 1"></div></div>
  <div data-fx-part="slide"><div class="wf-img" data-fx-part="media" data-label="Photo 2"></div></div>
  <div data-fx-part="slide"><div class="wf-img" data-fx-part="media" data-label="Photo 3"></div></div>
</div>
<p class="demo-hint">The panel below uses look: pan · pan-from: -35px → pan: 0px — the lit photo flows to the right from 35px left into place (Brand).</p>
<div class="stage stage--pan" data-fx="fade-zoom-slides" data-fx-fade-zoom-slides="every: 1; fade: 3; look: pan; pan-from: -35px; pan: 0px; pan-dur: 8; pan-width: calc(100% + 40px)">
  <div data-fx-part="slide"><div class="wf-img" data-fx-part="media" data-label="Photo A"></div></div>
  <div data-fx-part="slide"><div class="wf-img" data-fx-part="media" data-label="Photo B"></div></div>
</div>
<script>
(() => {
  const src = document.querySelector('[data-fx~="fade-zoom-slides"]');
  if (!src) return;
  const html = src.outerHTML;
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => src.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical one comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
