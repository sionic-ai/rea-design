<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fixed-curtain — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 16px/1.6 var(--kf-font-sans); }
  .demo-hint { position: relative; z-index: 2; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  section h2 { position: relative; padding: 40vh 8vw 0; font-size: 40px; color: var(--kf-contrast-ink); }
  .p1 { background: var(--kf-contrast-bg); }
  .p2 { background: var(--kf-accent); }
  .p3 { background: repeating-linear-gradient(45deg, var(--kf-contrast-bg) 0 30px, var(--kf-accent) 30px 60px); }
  .tail { height: 60vh; padding: 40px 20px; }
</style>
</head>
<body>
<p class="demo-hint"><b>fixed-curtain</b> — Try scrolling. The photo stays in place and the next photo covers it from below like a curtain. <span style="color:var(--kf-dim)">(After 1s one more section comes in, and one leaves 2.5s later)</span></p>
<section data-fx="fixed-curtain"><div data-fx-part="photo" class="p1"></div><h2>Your first section title here</h2></section>
<section data-fx="fixed-curtain"><div data-fx-part="photo" class="p2"></div><h2>Your second Section title here</h2></section>
<section data-fx="fixed-curtain" data-demo-remove><div data-fx-part="photo" class="p3"></div><h2>Section to be removed soon</h2></section>
<template data-demo-late><section data-fx="fixed-curtain"><div data-fx-part="photo" class="p3"></div><h2>Late-arriving section</h2></section></template>
<div class="tail">Content continues below here</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
