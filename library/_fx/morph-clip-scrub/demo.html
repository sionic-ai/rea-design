<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>morph-clip-scrub — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .track { height: 400vh; position: relative; }
  .stage { position: sticky; top: 0; height: 100vh; display: flex; gap: 6vw; align-items: center; justify-content: center; }
  .win { width: min(36vw, 420px); aspect-ratio: 612 / 824; }
  .a { fill: var(--kf-accent); } .b { fill: var(--kf-ink); }
</style>
</head>
<body>
<p class="demo-hint"><b>morph-clip-scrub</b> — Scroll down and the window changes shape and the color plate inside changes.</p>
<section class="track">
  <div class="stage">
    <div class="win" data-fx="morph-clip-scrub" data-demo-remove>
      <svg viewBox="0 0 612 824"><clipPath id="d1"><path data-fx-part="shape" d="M560 0L190 2C163 3 140 20 134 46L2 554C-5 582 9 611 36 623L470 820C520 842 580 806 590 752L612 60C614 28 590 0 560 0Z" data-to="M612 748V110C612 55 566 18 520 30L300 90C276 96 258 112 248 134L10 616C-12 660 14 712 62 716L540 800C580 806 612 784 612 748Z"/></clipPath>
      <g clip-path="url(#d1)"><rect class="a" data-fx-part="photo" width="612" height="824"/><rect class="b" data-fx-part="photo" width="612" height="824"/></g></svg>
    </div>
    <template data-demo-late><div class="win" data-fx="morph-clip-scrub" data-fx-morph-clip-scrub="at: .3; len: .5">
      <svg viewBox="0 0 612 824"><clipPath id="d2"><path data-fx-part="shape" d="M40 0H572C594 0 612 18 612 40V784C612 806 594 824 572 824H40C18 824 0 806 0 784V40C0 18 18 0 40 0Z" data-to="M306 0L612 300L520 824H92L0 300Z"/></clipPath>
      <g clip-path="url(#d2)"><rect class="b" data-fx-part="photo" width="612" height="824"/><rect class="a" data-fx-part="photo" width="612" height="824"/></g></svg>
    </div></template>
  </div>
</section>
<div style="height:60vh"></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../../../_shared/vendor/gsap/MorphSVGPlugin.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); window.ScrollTrigger?.refresh(); }, 2500);
</script>
</body>
</html>
