<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pile-gather-push — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 500 13px/1.4 var(--kf-font-sans); }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .stage { height: 70vh; }
  .demo-bar { display: flex; gap: 10px; padding: 0 20px 20px; }
  .demo-bar button { padding: 6px 14px; border: 1px solid var(--kf-line); border-radius: var(--kf-radius-pill); background: var(--kf-surface); cursor: pointer; }
  .late { height: 40vh; }
</style>
</head>
<body>
<p class="demo-hint"><b>pile-gather-push</b> — Move the mouse over the cluster. The shapes get pushed away, then regroup. Press Swap Set and other shapes fly in and clump together. <span style="color:var(--kf-dim)">(After 1s one more small stage comes in, and after 2.5s one drops out)</span></p>
<div class="stage" data-fx="pile-gather-push" data-demo-main></div>
<div class="demo-bar"><button type="button" data-demo-swap>Switch bundle</button></div>
<div class="late" data-fx="pile-gather-push" data-demo-remove></div>
<template data-demo-late><div class="late" data-fx="pile-gather-push" data-fx-pile-gather-push="set: b; count: 6; z: 4"></div></template>
<div data-fx="pile-gather-push"></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="three-global.js"></script>
<script src="../../_vendor/three@0.179.0/build/three.cjs"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
let set = "a";
document.querySelector("[data-demo-swap]").addEventListener("click", () => {
  set = set === "a" ? "b" : "a";
  document.querySelector("[data-demo-main]").dispatchEvent(new CustomEvent("fx:set", { detail: { set } }));
});
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); }, 2500);
</script>
</body>
</html>
