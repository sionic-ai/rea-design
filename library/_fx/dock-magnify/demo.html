<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dock-magnify — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { min-height: 70vh; display: grid; place-items: end center; padding: 80px 20px; }
  .dock { gap: 8px; padding-block: 8px; border-radius: var(--kf-radius-lg); background: var(--kf-surface); box-shadow: var(--kf-shadow-soft); }
  .dock a { border-radius: 28%; background: var(--kf-accent); display: grid; place-items: center; color: var(--kf-on-accent); text-decoration: none; font-size: 12px; }
  .dock a:nth-child(even) { background: var(--kf-ink); color: var(--kf-bg); }
</style>
</head>
<body>
<p class="demo-hint"><b>dock-magnify</b> — Slowly move the mouse over the bottom row. Icons near the cursor swell up to 1.6x from the bottom edge and the neighboring icons are pushed aside. <span style="color:var(--kf-dim)">(After 1s one more line comes in, and one leaves 2.5s later)</span></p>
<main class="demo">
  <nav class="dock" data-fx="dock-magnify" style="--fx-size: 44px"><a data-fx-part="item" href="#">1</a><a data-fx-part="item" href="#">2</a><a data-fx-part="item" href="#">3</a><a data-fx-part="item" href="#">4</a><a data-fx-part="item" href="#">5</a></nav>
  <nav class="dock" data-fx="dock-magnify" data-fx-dock-magnify="scale: 2; distance: 140; falloff: smooth" data-demo-remove><a data-fx-part="item" href="#">Go</a><a data-fx-part="item" href="#">Me</a><a data-fx-part="item" href="#">All</a></nav>
  <nav class="dock" data-fx="dock-magnify"></nav>
  <template data-demo-late><nav class="dock" data-fx="dock-magnify" style="--fx-size: 32px"><a data-fx-part="item" href="#">A</a><a data-fx-part="item" href="#">B</a><a data-fx-part="item" href="#">C</a></nav></template>
</main>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
