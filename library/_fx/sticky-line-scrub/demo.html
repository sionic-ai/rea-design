<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sticky-line-scrub — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.6 var(--kf-font-sans); margin: 0; overflow-x: clip; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .gap { height: 60vh; }
  .sec { display: flex; gap: 60px; width: min(900px, 92vw); margin: 0 auto; padding-bottom: 20vh; }
  .sec h2 { writing-mode: vertical-rl; font-size: 20px; padding-top: 44px; margin-bottom: 48px; }
  .sec [data-fx-part="head"] { --fx-top: 60px; display: flex; flex-direction: column; align-items: center; }
  .body { flex: 1; display: grid; gap: 160px; }
  .body .wf-img { aspect-ratio: 4 / 3; }
</style>
</head>
<body>
<p class="demo-hint"><b>sticky-line-scrub</b> — Scroll down. The vertical title on the left sticks along the sections, and the line beneath it fills as you read. <span style="color:var(--kf-dim)">(After 1s a photo comes in, and after 2.5s one leaves)</span></p>
<div class="gap"></div>
<section class="sec" data-fx="sticky-line-scrub">
  <div data-fx-part="head"><h2>Your section title here</h2><span data-fx-part="track"><span data-fx-part="fill"></span></span></div>
  <div class="body" data-late-body>
    <div class="wf-img" data-label="Photo one"></div>
    <div class="wf-img" data-label="Exit photo" data-demo-remove></div>
    <p>Your two lines of body text here. The line fills up by the end of the section.</p>
    <div class="wf-img" data-label="Photo Two"></div>
  </div>
</section>
<div class="gap"></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script>gsap.registerPlugin(ScrollTrigger);</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelector("[data-late-body]").insertAdjacentHTML("beforeend", '<div class="wf-img" data-label="Late-arrived Photo"></div>'), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
