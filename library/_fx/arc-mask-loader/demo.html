<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>arc-mask-loader — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 10; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-page { min-height: 80vh; display: grid; place-items: center; gap: 16px; }
  .demo-page button { padding: 10px 18px; border: 1px solid var(--kf-line); border-radius: var(--kf-radius-pill); background: var(--kf-surface); cursor: pointer; }
  .demo-loader [data-fx-part="title"] { font: 800 clamp(48px, 8vw, 110px)/.9 var(--kf-font-display); text-transform: uppercase; }
  .demo-loader [data-fx-part="word"] { font: italic 300 clamp(18px, 2vw, 28px)/1.3 serif; }
  .demo-loader [data-fx-part="count"] { font: 500 11px/1 var(--kf-font-mono); }
</style>
</head>
<body>
<p class="demo-hint"><b>arc-mask-loader</b> — On open the title rises, and when the counter reaches 100 a round curtain covers and then lifts upward. Show it again with the button below.</p>
<main class="demo-page"><button type="button" data-again>Replay loader</button></main>
<div class="demo-loader" data-fx="arc-mask-loader" data-fx-arc-mask-loader="page: .demo-page">
  <div data-fx-part="mask"></div>
  <div data-fx-part="lines"><span data-fx-part="clip"><b data-fx-part="title">Studio</b></span><span data-fx-part="clip"><i data-fx-part="word">Experience</i></span></div>
  <span data-fx-part="count">000</span>
</div>
<script>
(() => {
  const html = document.querySelector(".demo-loader").outerHTML;
  const make = (tag, opt) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; el.setAttribute("data-fx-arc-mask-loader", opt); return el; };
  const gone = make("gone", "ramp: 3");
  document.body.append(gone);
  setTimeout(() => document.body.append(make("late", "ramp: .4; rise: .6")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector("[data-again]").addEventListener("click", () => { const el = make("again", "page: .demo-page"); el.addEventListener("fx:done", () => el.remove()); document.body.append(el); });
  document.querySelector(".demo-hint").append(" · After 1 second one more loader comes in (a late arrival), and after 2.5 seconds one is removed (detach).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
