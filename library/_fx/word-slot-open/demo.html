<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>word-slot-open — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .pad { height: 90vh; }
  .demo h2 { margin: 0 0 30vh; text-align: center; font: 800 clamp(2rem, 6vw, 5rem)/.95 var(--kf-font-display); text-transform: uppercase; white-space: nowrap; }
  .demo h2 .ln { display: flex; justify-content: center; align-items: center; }
  .shot { background: linear-gradient(120deg, var(--kf-accent), var(--kf-accent-soft)); }
</style>
</head>
<body>
<p class="demo-hint"><b>word-slot-open</b> — Scroll down — the gap between text lines opens from the center and pushes the words away. After 1 second one line comes in and one drops out.</p>
<div class="pad"></div>
<section class="demo" id="demo">
  <h2 data-fx="word-slot-open"><span class="ln">From 0<span data-fx-part="slot"><span class="shot"></span></span>to 100</span><span class="ln"><span data-fx-part="slot"><span class="shot"></span></span>in one place</span></h2>
  <h2 data-fx="word-slot-open" data-fx-word-slot-open="w: 3em" id="gone">To be erased<span data-fx-part="slot"><span class="shot"></span></span>Line</h2>
  <h2 data-fx="word-slot-open">Row Without Cells</h2>
</section>
<div class="pad"></div>
<script>
  setTimeout(() => {
    const h = document.createElement("h2");
    h.dataset.fx = "word-slot-open";
    h.innerHTML = 'Late<span data-fx-part="slot"><span class="shot"></span></span>Incoming line';
    document.getElementById("demo").append(h);
    document.getElementById("gone")?.remove();
  }, 1000);
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script>gsap.registerPlugin(ScrollTrigger);</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
