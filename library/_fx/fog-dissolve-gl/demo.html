<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fog-dissolve-gl — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { margin: 0; background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: relative; z-index: 2; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .track { height: 300vh; }
  .pin { position: sticky; top: 0; height: 100vh; overflow: hidden; background: linear-gradient(160deg, color-mix(in oklab, var(--kf-accent) 30%, var(--kf-bg)), var(--kf-bg)); display: grid; place-items: center; }
  .pin p { font-size: clamp(2rem, 6vw, 5rem); margin: 0; }
  .end { height: 60vh; display: grid; place-items: center; color: var(--kf-dim); }
</style>
</head>
<body>
<p class="demo-hint"><b>fog-dissolve-gl</b> Scroll down. White mist covers from 72% of the section, fully covers the screen at 92%, and lifts from 94%. <span style="color:var(--kf-dim)">(One more patch of fog comes in after 1s, and one drops out after 2.5s)</span></p>
<section class="track" data-fx-part="track"><div class="pin"><p>Scene beneath the fog</p><div data-fx="fog-dissolve-gl"></div><div data-fx="fog-dissolve-gl" data-fx-fog-dissolve-gl="start: .2; cover: .5; clear: .6" data-demo-remove></div></div></section>
<template data-demo-late><div style="position:relative;height:40vh"><div data-fx="fog-dissolve-gl" data-fx-fog-dissolve-gl="start: 0; cover: .01"></div></div></template>
<div class="end">Footer</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
gsap.registerPlugin(ScrollTrigger);
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
