<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>frame-shrink-zoom-hover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { display: grid; grid-template-columns: repeat(3, 1fr); gap: 32px; max-width: 1000px; padding: 48px 20px; }
  .card { position: relative; display: grid; gap: 10px; }
  .card [data-fx-part="frame"] { aspect-ratio: 1; background: var(--kf-surface); }
  .card [data-fx-part="photo"] { width: 100%; height: 100%; display: grid; place-items: center; background: var(--kf-raised); border: 1px solid var(--kf-line); color: var(--kf-dim); }
  .card [data-fx-part="badge"] { position: absolute; top: 10px; right: 10px; display: grid; place-items: center; width: 28px; height: 28px; border: 1px solid var(--kf-ink); border-radius: 50%; background: var(--kf-surface); color: var(--kf-ink); text-decoration: none; }
  .demo-spacer { height: 90vh; }
</style>
</head>
<body>
<p class="demo-hint"><b>frame-shrink-zoom-hover</b> — Hover over a card. The frame shrinks, the photo comes closer and the corner arrow grows. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<section class="demo">
  <article class="card" data-demo-remove data-fx="frame-shrink-zoom-hover"><div data-fx-part="frame"><div data-fx-part="photo">Photo 01</div></div><a data-fx-part="badge" href="#" aria-label="In detail">→</a><span>Your name here</span></article>
  <article class="card" data-fx="frame-shrink-zoom-hover"><div data-fx-part="frame"><div data-fx-part="photo">Photo 02</div></div><a data-fx-part="badge" href="#" aria-label="In detail">→</a><span>Your name here</span></article>
  <article class="card" data-fx="frame-shrink-zoom-hover" style="--fx-frame: .94; --fx-zoom: 1.12"><div data-fx-part="frame"><div data-fx-part="photo">Larger stagger</div></div><span>Unmarked card</span></article>
  <template data-demo-late><article class="card" data-fx="frame-shrink-zoom-hover"><div data-fx-part="frame"><div data-fx-part="photo">Late-arrived Photo</div></div><a data-fx-part="badge" href="#" aria-label="In detail">→</a><span>Your name here</span></article></template>
</section>
<div class="demo-spacer"></div>
<script src="../fx-core.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
