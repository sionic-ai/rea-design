<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>notch-corner-card — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 14px/1.4 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 24px; padding: 32px 20px; }
  .demo .wf-img { height: 100%; border: 0; border-radius: 12px; }
  .demo a { display: block; }
</style>
</head>
<body>
<p class="demo-hint"><b>notch-corner-card</b> — When the card appears, a corner notch grows and is cut in, and hovering closes the notch. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<div class="demo">
<a href="#"  data-fx="notch-corner-card"  style="aspect-ratio:4/3"><div class="wf-img" data-label="Default no-tr · closes on hover"></div><i data-fx-part="corner" data-key="tl"></i><i data-fx-part="corner" data-key="tr"></i><i data-fx-part="corner" data-key="br"></i><i data-fx-part="corner" data-key="bl"></i></a>
<a href="#" data-demo-remove data-fx="notch-corner-card" data-fx-notch-corner-card="cycle: diagonal, no-bl, none; every: 1.5" style="aspect-ratio:4/3"><div class="wf-img" data-label="Spins every 1.5s"></div><i data-fx-part="corner" data-key="tl"></i><i data-fx-part="corner" data-key="tr"></i><i data-fx-part="corner" data-key="br"></i><i data-fx-part="corner" data-key="bl"></i></a>
<template data-demo-late><a href="#"  data-fx="notch-corner-card" data-fx-notch-corner-card="look: no-bl; hover: off" style="aspect-ratio:4/3"><div class="wf-img" data-label="Late · no-bl · Hover off"></div><i data-fx-part="corner" data-key="tl"></i><i data-fx-part="corner" data-key="tr"></i><i data-fx-part="corner" data-key="br"></i><i data-fx-part="corner" data-key="bl"></i></a></template>
<a href="#" data-fx="notch-corner-card" style="aspect-ratio:4/3"><div class="wf-img" data-label="No pieces (quiet)"></div></a>
</div>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
