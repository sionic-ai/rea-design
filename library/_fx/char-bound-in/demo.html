<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>char-bound-in — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 2; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .gap { height: 80vh; }
  .sec { padding: 60px 40px; text-align: center; }
  h2 { margin: 0; font: 800 64px/1.1 var(--kf-font-display); color: var(--kf-accent); }
  h2 [data-fx-part="sub"] { display: block; font: 700 14px/1.6 var(--kf-font-sans); color: var(--kf-ink); }
  .bubble { display: inline-block; margin-top: 24px; padding: 10px 16px; background: var(--kf-surface); box-shadow: var(--kf-shadow-soft); font-weight: 700; }
</style>
</head>
<body>
<p class="demo-hint"><b>char-bound-in</b> — Scroll down. Title letters bounce up one by one. <span style="color:var(--kf-dim)">(After 1s one more comes in, and one drops out after 2s)</span></p>
<section class="sec"><h2 data-fx="char-bound-in" data-fx-char-bound-in="on: load"><span data-fx-part="sub">As soon as it loads</span>Welcome</h2></section>
<div class="gap"></div>
<section class="sec"><h2 data-fx="char-bound-in"><span data-fx-part="sub">Section intro text</span>Section Title</h2></section>
<section class="sec"><h2 data-fx="char-bound-in" data-fx-char-bound-in="stagger: .03"><span data-fx-part="line">Studio Name</span> <span data-fx-part="line" data-delay=".3">Enjoy Day!</span></h2>
  <div><span class="bubble" data-fx="char-bound-in" data-fx-char-bound-in="split: none; look: small; delay: .3">Whole speech bubble</span></div></section>
<section class="sec" data-demo-remove><h2 data-fx="char-bound-in">Exit title</h2></section>
<template data-demo-late><section class="sec"><h2 data-fx="char-bound-in">Late-arriving title</h2></section></template>
<span data-fx="char-bound-in"></span>
<div class="gap"></div>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2000);
</script>
</body>
</html>
