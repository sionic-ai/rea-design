<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>magazine-ribbon — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { margin: 0; background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .stage { height: 80vh; }
  .readout { padding: 12px 20px; font: 500 13px/1.4 var(--kf-font-mono); }
</style>
</head>
<body>
<p class="demo-hint"><b>magazine-ribbon</b> — Spin the wheel or drag over the band. Click a side card to bring it to center, click the center card and the chosen number is stamped below <span style="color:var(--kf-dim)">(After 1s a band with one more sheet attached appears, and after 2.5s it disappears)</span></p>
<div class="stage" data-fx="magazine-ribbon">
  <figure data-fx-part="card" data-label="Work 01 main screen · landscape 5:4"></figure>
  <figure data-fx-part="card" data-label="Work 02 Half-length portrait · Daytime shade"></figure>
  <figure data-fx-part="card" data-label="Work 03 Product front view · White background"></figure>
  <figure data-fx-part="card" data-label="Work 04 street scene · sunset"></figure>
  <figure data-fx-part="card" data-label="Work 05 screen collection · dark background"></figure>
  <figure data-fx-part="card" data-label="Work 06 Hand close-up · Side light"></figure>
</div>
<p class="readout" data-readout>Center Section: —</p>
<template data-demo-late><div class="stage" data-fx="magazine-ribbon" data-fx-magazine-ribbon="intro: off; gap: 1" data-demo-remove><figure data-fx-part="card" data-label="Late strip 01"></figure><figure data-fx-part="card" data-label="Late strip 02"></figure></div></template>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="three-global.js"></script>
<script src="../../_vendor/three@0.184.0/build/three.cjs"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
const out = document.querySelector("[data-readout]");
document.addEventListener("fx:center", (e) => (out.textContent = `Center Section: ${e.detail.index + 1} / ${e.detail.count}`));
document.addEventListener("fx:pick", (e) => (out.textContent = `Selected section: ${e.detail.index + 1}`));
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
