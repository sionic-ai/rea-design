<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>skew-panel-btn — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { display: flex; flex-wrap: wrap; align-items: center; gap: 30px; padding: 48px 20px; }
  .demo--dark { background: var(--kf-contrast-bg); }
  .demo a { width: 220px; padding: 1em 2em; border-radius: var(--kf-radius-sm); letter-spacing: .1em; text-decoration: none; }
</style>
</head>
<body>
<p class="demo-hint"><b>skew-panel-btn</b> — Hover over the button and then release. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<section class="demo">
  <a href="#" data-fx="skew-panel-btn"><span data-fx-part="panel"></span><span>MORE</span></a>
  <a href="#" data-demo-remove data-fx="skew-panel-btn"><span data-fx-part="panel"></span><span>REMOVED</span></a>
  <a href="#" data-fx="skew-panel-btn" data-fx-skew-panel-btn="look: ghost"><span data-fx-part="panel"></span><span>Product Page</span></a>
  <template data-demo-late><a href="#" data-fx="skew-panel-btn"><span data-fx-part="panel"></span><span>LATE</span></a></template>
</section>
<section class="demo demo--dark">
  <a href="#" data-fx="skew-panel-btn" data-fx-skew-panel-btn="look: light"><span data-fx-part="panel"></span><span>ABOUT US</span></a>
</section>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
