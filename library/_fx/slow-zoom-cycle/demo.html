<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>slow-zoom-cycle — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); padding: 24px; }
  .demo-hint { margin-bottom: 16px; font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-stage { width: min(560px, 100%); aspect-ratio: 4 / 3; margin-bottom: 16px; border-radius: var(--kf-radius-lg); --fx-dur: 9s; }
  .demo-stage .wf-img { height: 100%; }
</style>
</head>
<body>
<p class="demo-hint"><b>slow-zoom-cycle</b> — Three photos light up in turn and slowly move closer (demo loop is 9s, original 21s).</p>
<div class="demo-stage" data-fx="slow-zoom-cycle">
  <div class="wf-img" data-fx-part="slide" data-label="Photo 1"></div>
  <div class="wf-img" data-fx-part="slide" data-label="Photo 2"></div>
  <div class="wf-img" data-fx-part="slide" data-label="Photo 3"></div>
</div>
<script>
// Late arrivals and removals — a css motion part, so it runs as soon as it is attached. Adds one panel after 1 second and removes one after 2.5 seconds
(() => {
  const src = document.querySelector('[data-fx~="slow-zoom-cycle"]');
  const gone = src.cloneNode(true);
  src.after(gone);
  setTimeout(() => src.after(src.cloneNode(true)), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · A panel comes in after 1s, and one drops out after 2.5s.");
})();
</script>
<script src="../fx-core.js"></script>
</body>
</html>
