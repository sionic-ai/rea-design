<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>wheel-pull-footer — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { margin: 0; background: var(--kf-bg); color: var(--kf-ink); font: 400 14px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 5; margin: 0; padding: 12px 20px; background: var(--kf-surface); font: 500 13px/1.4 var(--kf-font-mono); }
  main { position: relative; z-index: 2; min-height: 180vh; padding: 24px; background: var(--kf-bg); border-bottom: 1px solid var(--kf-line); }
  .foot { padding: 28px; background: var(--kf-surface); }
  .foot b { display: block; font: 700 18vw/0.9 var(--kf-font-sans); }
</style>
</head>
<body>
<p class="demo-hint"><b>wheel-pull-footer</b> — Scroll to the very bottom, then keep rolling the wheel. The body is pushed up to reveal the logo, and when you stop it drops and closes. <span style="color:var(--kf-dim)">(After 1s one more identical footer is added, and after 2.5s one is removed)</span></p>
<main id="page"><p>Body panel — scroll down.</p></main>
<div class="foot" data-fx="wheel-pull-footer" data-fx-wheel-pull-footer="target: #page"><b>LOGO</b></div>
<template data-demo-late><div class="foot" data-fx="wheel-pull-footer" data-fx-wheel-pull-footer="target: #page" style="z-index:0"><b>LATE</b></div></template>
<div class="foot" data-fx="wheel-pull-footer" data-fx-wheel-pull-footer="target: #missing" data-demo-remove><b>X</b></div>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
