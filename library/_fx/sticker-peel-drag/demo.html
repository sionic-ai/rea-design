<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sticker-peel-drag — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .zone { position: relative; height: 70vh; margin: 20px; border: 1px dashed var(--kf-line); display: flex; gap: 60px; align-items: center; justify-content: center; }
  .s { width: 160px; height: 160px; }
</style>
</head>
<body>
<p class="demo-hint"><b>sticker-peel-drag</b> — Put a hand on the sticker and its corner peels. Drag it and it follows with a tilt. Let go and it stands up right away. <span style="color:var(--kf-dim)">(After 1s one more sticker comes in, and after 2.5s one is removed)</span></p>
<div class="zone">
  <div class="s" data-fx="sticker-peel-drag"><svg data-fx-part="art" viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="var(--kf-accent)" stroke="var(--kf-ink)" stroke-width="4"/><text x="50" y="58" text-anchor="middle" font-size="22" fill="var(--kf-on-accent)">Sticker</text></svg></div>
  <div class="s" data-fx="sticker-peel-drag" data-fx-sticker-peel-drag="tilt: .8; max: 30"><svg data-fx-part="art" viewBox="0 0 100 100"><rect x="6" y="18" width="88" height="64" rx="32" fill="var(--kf-accent-soft)" stroke="var(--kf-ink)" stroke-width="4" transform="rotate(-8 50 50)"/></svg></div>
  <div class="s" data-fx="sticker-peel-drag" data-demo-remove><svg data-fx-part="art" viewBox="0 0 100 100"><path d="M50 4 61 38 96 38 68 59 79 94 50 72 21 94 32 59 4 38 39 38Z" fill="var(--kf-raised)" stroke="var(--kf-ink)" stroke-width="4"/></svg></div>
  <template data-demo-late><div class="s" data-fx="sticker-peel-drag"><svg data-fx-part="art" viewBox="0 0 100 100"><rect x="10" y="10" width="80" height="80" rx="16" fill="var(--kf-surface)" stroke="var(--kf-ink)" stroke-width="4"/></svg></div></template>
</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/Draggable.min.js"></script>
<script src="../../../_shared/vendor/gsap/InertiaPlugin.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
gsap.registerPlugin(Draggable, InertiaPlugin);
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); }, 2500);
</script>
</body>
</html>
