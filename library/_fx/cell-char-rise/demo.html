<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cell-char-rise — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { padding: 24px 20px; display: grid; gap: 48px; }
  .spacer { height: 110vh; display: grid; place-items: center; color: var(--kf-dim); }
  .t { font: var(--kf-weight-display) 28px/1 var(--kf-font-display); }
  .own { display: flex; gap: 2px; }
  .own .cell { display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; overflow: hidden; border: 1px solid var(--kf-ink); font: 500 30px/1 var(--kf-font-display); }
  .own .cell.is-fill { background: var(--kf-ink); color: var(--kf-bg); }
  .own .cell span { display: block; }
</style>
</head>
<body>
<p class="demo-hint"><b>cell-char-rise</b> — Scroll down. Letters rise one by one inside a square cell.</p>
<div class="demo">
  <h2 class="t" data-fx="cell-char-rise" data-fx-cell-char-rise="on: load; y: 60; dur: .4">Your title here</h2>
  <div class="spacer">Downward</div>
  <h3 class="own" data-fx="cell-char-rise"><span class="cell is-fill"><span data-fx-part="char">First</span></span><span class="cell is-fill"><span data-fx-part="char">Th</span></span><span class="cell"><span data-fx-part="char">Grind</span></span><span class="cell"><span data-fx-part="char">Rae</span></span></h3>
  <div class="spacer">Footer</div>
</div>
<script>
// Late arrivals and removals — checks that fx-core attaches to an element added after 1s and detaches from an element removed after 2.5s
(() => {
  const src = document.querySelector('[data-fx~="cell-char-rise"]');
  if (!src) return;
  const make = (tag) => { const el = document.createElement("h2"); el.className = "t"; el.textContent = "Late-arrived title"; el.dataset.fx = "cell-char-rise"; el.dataset.fxCellCharRise = "on: load"; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => src.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1 second one more heading comes in (a late arrival), and after 2.5 seconds one is removed (detach).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
