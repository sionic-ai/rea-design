<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cursor-speed-marquee — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.6 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: sticky; top: 0; z-index: 100; margin: 0; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo-row { margin: 48px 0; }
  .demo-row figure { margin: 0; flex: none; width: 260px; height: 180px; display: grid; place-items: center; background: var(--kf-surface); border: 1px solid var(--kf-line); color: var(--kf-dim); }
  .demo-row figure.is-p { width: 180px; height: 260px; }
</style>
</head>
<body>
<p class="demo-hint"><b>cursor-speed-marquee</b> — Move the mouse to the right or left end of the row. It stays still in the middle and speeds up toward whichever end you approach (drag with a finger on phones). <span style="color:var(--kf-dim)">(After 1s one more line comes in, and one leaves 2.5s later)</span></p>
<div class="demo-row" data-fx="cursor-speed-marquee" data-demo-remove><div data-fx-part="track"><div data-fx-part="set"><figure>Removed Row 01</figure><figure>Removed Row 02</figure><figure>Removed Row 03</figure></div></div></div>
<div class="demo-row" data-fx="cursor-speed-marquee"><div data-fx-part="track"><div data-fx-part="set"><figure class="is-p">Photo 01</figure><figure>Photo 02</figure><figure>Photo 03</figure><figure class="is-p">Photo 04</figure><figure>Photo 05</figure><figure>Photo 06</figure><figure class="is-p">Photo 07</figure></div></div></div>
<template data-demo-late><div class="demo-row" data-fx="cursor-speed-marquee" data-fx-cursor-speed-marquee="base: .05; gain: .3"><div data-fx-part="track"><div data-fx-part="set"><figure>Late 01</figure><figure>Late 02</figure><figure>Late 03</figure><figure>Late 04</figure><figure>Late 05</figure></div></div></div></template>

<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); window.ScrollTrigger?.refresh(); }, 2500);
</script>
</body>
</html>
