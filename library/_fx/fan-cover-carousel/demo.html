<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fan-cover-carousel — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .c { position: relative; height: 460px; margin: 16px 0; overflow: hidden; background: var(--kf-contrast-bg); }
  .c [data-fx-part="media"] { display: grid; place-items: center; border-radius: var(--kf-radius-md); background: var(--kf-raised); color: var(--kf-dim); font: 700 14px/1 var(--kf-font-mono); }
  .c button { position: absolute; top: 50%; padding: 8px 12px; border: 0; border-radius: var(--kf-radius-pill); background: var(--kf-surface); }
  .c [data-fx-part="prev"] { left: 16px; } .c [data-fx-part="next"] { right: 16px; }
  .sw { margin: 0 20px; }
</style>
</head>
<body>
<p class="demo-hint"><b>fan-cover-carousel</b> — Page through with the arrows, the side covers, or ←→. The buttons below fan the cards out in an arc.</p>
<button class="sw" type="button" onclick="document.querySelector('.c').dispatchEvent(new CustomEvent('fx:layout',{detail: this.dataset.k = this.dataset.k === 'arc' ? 'fan' : 'arc'}))">fan ↔ arc</button>
<div class="c" data-fx="fan-cover-carousel">
  <div data-fx-part="stage">
    <a data-fx-part="item" href="#"><span data-fx-part="media">1</span></a><a data-fx-part="item" href="#"><span data-fx-part="media">2</span></a><a data-fx-part="item" href="#"><span data-fx-part="media">3</span></a>
    <a data-fx-part="item" href="#"><span data-fx-part="media">4</span></a><a data-fx-part="item" href="#"><span data-fx-part="media">5</span></a><a data-fx-part="item" href="#"><span data-fx-part="media">6</span></a>
    <a data-fx-part="item" href="#"><span data-fx-part="media">7</span></a>
  </div>
  <button data-fx-part="prev" type="button">‹</button><button data-fx-part="next" type="button">›</button>
</div>
<div class="c" data-fx="fan-cover-carousel" data-demo-remove><div data-fx-part="stage"><a data-fx-part="item" href="#">Erase</a></div></div>
<div id="late"></div>
<template data-demo-late><div class="c" data-fx="fan-cover-carousel" data-fx-fan-cover-carousel="look: arc; start: 2"><div data-fx-part="stage"><a data-fx-part="item" href="#"><span data-fx-part="media">Late 1</span></a><a data-fx-part="item" href="#"><span data-fx-part="media">Late 2</span></a><a data-fx-part="item" href="#"><span data-fx-part="media">Late 3</span></a></div></div></template>
<div class="c" data-fx="fan-cover-carousel"></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => document.getElementById("late").append(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
