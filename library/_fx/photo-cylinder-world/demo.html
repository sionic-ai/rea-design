<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>photo-cylinder-world — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .hero { height: 240svh; }
  .stage { position: sticky; top: 0; height: 100svh; }
  .t { display: grid; place-items: center; width: 100%; height: 100%; background: var(--kf-raised); color: var(--kf-dim); font-size: 12px; }
  .demo-spacer { height: 60vh; display: grid; place-items: center; color: var(--kf-dim); }
</style>
</head>
<body>
<p class="demo-hint"><b>photo-cylinder-world</b> — Move the mouse left and right and drag the tiles — the cylinder rotates, and scrolling down scatters the tiles.</p>
<section class="hero">
  <div class="stage" data-fx="photo-cylinder-world" data-fx-photo-cylinder-world="open: .hero">
    <a href="#" data-fx-part="tile" data-name="Client 01"><span class="t">Photo 1</span></a>
    <a href="#" data-fx-part="tile" data-name="Client 02"><span class="t">Photo 2</span></a>
    <a href="#" data-fx-part="tile" data-name="Client 03"><span class="t">Photo 3</span></a>
    <a href="#" data-fx-part="tile" data-name="Client 04"><span class="t">Photo 4</span></a>
  </div>
</section>
<div class="demo-spacer">Lower section</div>
<script>
// Late arrivals and removals — checks that fx-core attaches to an element added after 1s and detaches from an element removed after 2.5s
(() => {
  const src = document.querySelector('[data-fx~="photo-cylinder-world"]');
  if (!src) return;
  const make = (tag) => { const el = document.createElement("div"); el.className = "stage"; el.dataset.fx = "photo-cylinder-world"; el.dataset.demo = tag; el.style.height = "60vh"; el.style.position = "relative"; el.innerHTML = '<a href="#" data-fx-part="tile" data-name="Late"><span class="t">Late one</span></a>'; return el; };
  const gone = make("gone");
  document.querySelector(".demo-spacer").before(gone);
  setTimeout(() => document.querySelector(".demo-spacer").before(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical one comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
