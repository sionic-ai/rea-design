<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>swoosh-draw — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { display: grid; gap: 24px; padding: 24px 20px; }
  .stage { position: relative; height: 320px; background: var(--kf-surface); border-radius: var(--kf-radius-md); overflow: hidden; }
  .stage [data-fx] { position: absolute; inset: 0; }
  .stage b { position: absolute; left: 24px; top: 20px; z-index: 2; font-size: 28px; }
</style>
</head>
<body>
<p class="demo-hint"><b>swoosh-draw</b> — A curve is drawn, and after 2s it moves to the front and the next curve is drawn. The lower panel draws once and stops. <span style="color:var(--kf-dim)">(After 1s one more panel comes in, and one leaves 2.5s later)</span></p>
<section class="demo">
  <div class="stage"><b>Multiple shapes · every 2s</b><div data-fx="swoosh-draw" data-fx-swoosh-draw="hold: 2"></div></div>
  <div class="stage"><b>Once · 1.3s</b><div data-fx="swoosh-draw" data-fx-swoosh-draw="draw: 1.3; loop: off"></div></div>
  <div class="stage" data-demo-remove><b>Dropped Panel</b><div data-fx="swoosh-draw" data-fx-swoosh-draw="hold: 1"></div></div>
  <div class="stage"><b>No shape</b><div data-fx="swoosh-draw"></div></div>
  <template data-demo-late><div class="stage"><b>Late panel</b><div data-fx="swoosh-draw" data-fx-swoosh-draw="hold: 1.5" data-fill></div></div></template>
</section>
<script>
  const D = ["M40 300C220 200 380 80 560 140S860 340 960 80", "M40 80C260 360 640 380 960 120", "M60 340C200 120 420 60 620 180C760 260 860 200 940 40"];
  const fill = (box, n) => { box.innerHTML = D.slice(0, n).map((d, i) => `<svg data-fx-part="shape" viewBox="0 0 1000 400" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="g${Math.random().toString(36).slice(2, 7)}${i}" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1000" y2="400"><stop data-fx-part="from" offset="0"/><stop data-fx-part="to" offset="1"/></linearGradient></defs><path d="${d}" stroke-width="90"/></svg>`).join(""); box.querySelectorAll("svg").forEach((s) => s.querySelector("path").setAttribute("stroke", `url(#${s.querySelector("linearGradient").id})`)); };
  const boxes = document.querySelectorAll('[data-fx="swoosh-draw"]');
  fill(boxes[0], 3); fill(boxes[1], 1); fill(boxes[2], 2);
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => { const n = t.content.firstElementChild.cloneNode(true); fill(n.querySelector("[data-fx]"), 2); t.replaceWith(n); }), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
