<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>char-jolt-in — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { margin: 0; background: var(--kf-bg); color: var(--kf-ink); font: 600 15px/1.6 var(--kf-font-sans); }
  .demo-hint { margin: 0; padding: 12px 20px; border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); background: var(--kf-surface); }
  .pad { height: 80vh; }
  h2 { padding: 0 20px; font-size: 32px; text-align: center; color: var(--kf-accent); }
  p.t { max-width: 520px; margin: 40px auto; padding: 0 20px; }
</style>
</head>
<body>
<p class="demo-hint"><b>char-jolt-in</b> — Scroll down. Scattered letters come jolting into place and then wobble.</p>
<div class="pad"></div>
<h2 data-fx="char-jolt-in">Participating artists intro</h2>
<p class="t" data-fx="char-jolt-in">Two short comment lines here. Each character comes in separately with a clunk.</p>
<div class="pad"></div>
<script>
// Late arrivals and removals — add one more title after 1 sec, remove it after 2.5 sec
(() => {
  setTimeout(() => { const h = document.createElement("h2"); h.dataset.fx = "char-jolt-in"; h.textContent = "Late-arriving title"; document.body.append(h); setTimeout(() => h.remove(), 1500); }, 1000);
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../../../_shared/vendor/gsap/SplitText.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
