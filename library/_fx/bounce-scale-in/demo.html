<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bounce-scale-in — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 2; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .gap { height: 90vh; }
  .sec { padding: 60px 40px; }
  h2 { position: relative; display: inline-block; margin: 0; font: 800 40px/1.4 var(--kf-font-display); }
  .deco { position: absolute; right: -44px; top: -20px; width: 40px; color: var(--kf-accent); }
  .deco svg { display: block; width: 100%; height: auto; }
</style>
</head>
<body>
<p class="demo-hint"><b>bounce-scale-in</b> — Scroll down. The hatch marks beside the title pop in with a bounce as they cross the 80% line of the screen. <span style="color:var(--kf-dim)">(After 1s one more comes in, and one drops out after 2s)</span></p>
<div class="gap"></div>
<section class="sec"><h2>Your title here<span class="deco" data-fx="bounce-scale-in"><svg viewBox="0 0 40 30" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 26 2 14M16 22 18 6M26 24 36 12"/></svg></span></h2></section>
<section class="sec"><h2>Subtler Type<span class="deco" data-fx="bounce-scale-in" data-fx-bounce-scale-in="look: soft; dur: 1.2"><svg viewBox="0 0 40 30" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 26 2 14M16 22 18 6M26 24 36 12"/></svg></span></h2></section>
<section class="sec" data-demo-remove><h2>Dropping row<span class="deco" data-fx="bounce-scale-in"><svg viewBox="0 0 40 30" fill="none" stroke="currentColor" stroke-width="3"><path d="M6 26 2 14"/></svg></span></h2></section>
<template data-demo-late><section class="sec"><h2>Late-arriving line<span class="deco" data-fx="bounce-scale-in" data-fx-bounce-scale-in="scale: .3"><svg viewBox="0 0 40 30" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 26 2 14M16 22 18 6"/></svg></span></h2></section></template>
<span data-fx="bounce-scale-in"></span>
<div class="gap"></div>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2000);
</script>
</body>
</html>
