<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>eye-gather-loader — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: fixed; bottom: 0; left: 0; right: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-top: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-page { min-height: 100vh; display: grid; place-items: center; font: 700 48px/1 var(--kf-font-display); }
  .small { inset: auto 20px 60px auto; width: 320px; height: 200px; position: fixed; }
</style>
</head>
<body>
<p class="demo-hint"><b>eye-gather-loader</b> — On page open, dots gather into an eye shape, then blink open. Reload to watch again. <span style="color:var(--kf-dim)">(After 1s one more small panel comes in, and after 2.5s it leaves)</span></p>
<div class="demo-page">Hero after loader</div>
<div data-fx="eye-gather-loader"><p data-fx-part="word">Name slot</p></div>
<template data-demo-late><div class="small" data-demo-remove data-fx="eye-gather-loader" data-fx-eye-gather-loader="speed: 2; count: 400"></div></template>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
