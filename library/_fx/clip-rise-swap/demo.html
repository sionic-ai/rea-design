<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>clip-rise-swap — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { margin: 0; background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; margin: 0; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-spacer { height: 90vh; display: grid; place-items: center; color: var(--kf-dim); }
  .cr-kv { display: flex; height: 80vh; margin: 20px; border-radius: 24px; overflow: hidden; }
  .cr-lane { display: flex; flex-direction: column; width: 41%; } .cr-lane.is-w { width: 59%; }
  .cr-a { background: linear-gradient(135deg, var(--kf-accent), var(--kf-ink)); } .cr-b { background: linear-gradient(135deg, var(--kf-raised), var(--kf-dim)); } .cr-c { background: linear-gradient(135deg, var(--kf-accent-soft), var(--kf-accent)); }
</style>
</head>
<body>
<p class="demo-hint"><b>clip-rise-swap</b> — Nine photo cells change in turn — the next image opens from beneath the cell and the picture zooms in from 1.2x (about 2s interval).</p>
<div class="cr-kv" data-fx="clip-rise-swap" data-demo-host>
  <div class="cr-lane"><div class="cr-cell" style="height:69%" data-fx-part="cell" data-step="2 5"><div data-fx-part="layer"><span class="cr-a"></span></div><div data-fx-part="layer"><span class="cr-b"></span></div></div><div class="cr-cell" style="height:31%" data-fx-part="cell"><div data-fx-part="layer"><span class="cr-c"></span></div></div></div>
  <div class="cr-lane is-w"><div class="cr-cell" style="height:55%" data-fx-part="cell"><div data-fx-part="layer"><span class="cr-b"></span></div></div><div class="cr-cell" style="height:45%" data-fx-part="cell" data-step="0 6"><div data-fx-part="layer"><span class="cr-c"></span></div><div data-fx-part="layer"><span class="cr-a"></span></div></div></div>
  <div class="cr-lane is-w"><div class="cr-cell" style="height:34%" data-fx-part="cell" data-step="1 4"><div data-fx-part="layer"><span class="cr-a"></span></div><div data-fx-part="layer"><span class="cr-c"></span></div></div><div class="cr-cell" style="height:33%" data-fx-part="cell"><div data-fx-part="layer"><span class="cr-b"></span></div></div><div class="cr-cell" style="height:33%" data-fx-part="cell"><div data-fx-part="layer"><span class="cr-c"></span></div></div></div>
  <div class="cr-lane"><div class="cr-cell" style="height:45%" data-fx-part="cell"><div data-fx-part="layer"><span class="cr-a"></span></div></div><div class="cr-cell" style="height:55%" data-fx-part="cell" data-step="3 7"><div data-fx-part="layer"><span class="cr-b"></span></div><div data-fx-part="layer"><span class="cr-c"></span></div></div></div>
</div>
<script>
// Late arrivals and removals — checks that fx-core attaches to an element added after 1s and detaches from an element removed after 2.5s
(() => {
  const src = document.querySelector('[data-fx~="clip-rise-swap"]');
  if (!src) return;
  const html = src.outerHTML.replace(/\sid="[^"]*"/g, "");
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const host = src.closest("[data-demo-host]") || src;
  const gone = make("gone");
  
  setTimeout(() => 0, 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical one comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
