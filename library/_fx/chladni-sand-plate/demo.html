<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>brand-sand-plate — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { padding: 64px 20px; }
  .demo-title { margin: 0 0 40px; font: 600 72px/1 var(--kf-font-display); letter-spacing: -.03em; }
  .demo-plate { width: min(560px, 90vw); aspect-ratio: 1; margin-bottom: 16px; } .demo-btns { display: flex; gap: 8px; } .demo-btns button { padding: 8px 14px; border: 1px solid var(--kf-line); border-radius: 999px; background: none; color: var(--kf-ink); font: 12px var(--kf-font-mono); cursor: pointer; }
</style>
</head>
<body>
<p class="demo-hint"><b>brand-sand-plate</b> — Watch the sand on the plate gather along the nodal lines. Switch modes with the buttons below and the pattern blends over 1.4 seconds as the sand moves to the new lines.</p>
<main class="demo"><div class="demo-plate" data-fx="brand-sand-plate" data-fx-brand-sand-plate="m: 2; n: 3; sign: -1"></div><p class="demo-btns"><button data-mn="1,2,-1">1 · 2 · −</button><button data-mn="2,3,1">2 · 3 · +</button><button data-mn="3,5,-1">3 · 5 · −</button></p></main><script>document.querySelectorAll("[data-mn]").forEach((b) => b.addEventListener("click", () => { const [m, n, sign] = b.dataset.mn.split(",").map(Number); document.querySelectorAll('[data-fx~="brand-sand-plate"]').forEach((p) => p.dispatchEvent(new CustomEvent("fx:mode", { detail: { m, n, sign } }))); }));</script>
<script>
// Late arrivals and removals — checks that fx-core attaches to an element added after 1s and detaches from an element removed after 2.5s
(() => {
  const src = document.querySelector('[data-fx~="brand-sand-plate"]');
  if (!src) return;
  const html = src.outerHTML.replace(/\sid="[^"]*"/g, "");
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => src.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical one comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="../../_vendor/three@0.186.0/three.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
