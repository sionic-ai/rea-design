<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>grid-cell-draw — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.6 var(--kf-font-sans); margin: 0; }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-row { display: grid; grid-template-columns: repeat(3, 1fr); margin: 0 8vw; --fx-bleed: 8vw; min-height: 22vh; }
  .demo-row > div { padding: 14px; }
  .demo-pad { height: 50vh; }
</style>
</head>
<body>
<p class="demo-hint"><b>grid-cell-draw</b> — Scroll down. In each row a horizontal line is drawn from the left and dividers from the top, in turn. (1s later one more row comes in and 2.5s later one drops out)</p>
<div class="demo-row" data-fx="grid-cell-draw"><div data-fx-part="cell">Cell 1</div><div data-fx-part="cell">Cell 2</div><div data-fx-part="cell">Cell 3</div></div>
<div class="demo-row" data-fx="grid-cell-draw"><div data-fx-part="cell">Cell 1</div><div data-fx-part="cell">Cell 2</div><div data-fx-part="cell">Cell 3</div></div>
<div class="demo-pad"></div>
<div class="demo-row" data-fx="grid-cell-draw" data-demo-remove><div data-fx-part="cell">Dropped Line</div></div>
<div class="demo-row" data-fx="grid-cell-draw" data-fx-grid-cell-draw="each: .2"><div data-fx-part="cell">Delay .2</div><div data-fx-part="cell">Cell 2</div><div data-fx-part="cell">Cell 3</div></div>
<div class="demo-pad" data-demo-late-host></div>
<div class="demo-row" data-fx="grid-cell-draw"></div>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => {
  const d = document.createElement("div");
  d.className = "demo-row";
  d.dataset.fx = "grid-cell-draw";
  d.innerHTML = '<div data-fx-part="cell">Late-arriving line</div><div data-fx-part="cell">Cell 2</div><div data-fx-part="cell">Cell 3</div>';
  document.querySelector("[data-demo-late-host]").append(d);
}, 1000);
setTimeout(() => document.querySelector("[data-demo-remove]")?.remove(), 2500);
</script>
</body>
</html>
