<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>orbit-ring-pin — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.6 var(--kf-font-sans); transition: background-color .6s; }
  body.is-half { background: var(--kf-surface); }
  .demo-hint { position: fixed; top: 0; left: 0; right: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .pin { min-height: 100vh; display: grid; place-items: center; }
  .pin > * { grid-area: 1 / 1; }
  .pin h2 { font: 400 clamp(28px, 3vw, 44px)/1.2 var(--kf-font-display); text-align: center; }
  .chip { aspect-ratio: 4 / 3; background: var(--kf-raised); border: 1px solid var(--kf-line); }
  .chip.c { background: var(--kf-accent); border: 0; }
  .demo-spacer { height: 80vh; display: grid; place-items: center; color: var(--kf-dim); }
</style>
</head>
<body>
<p class="demo-hint"><b>orbit-ring-pin</b> — Scrolling down pins the panel, and pieces gather around a circle, spin, then scatter. Once the circle passes half a turn the background color changes. <span style="color:var(--kf-dim)">(One more piece comes in after 1s, and one drops out after 2.5s)</span></p>
<div class="demo-spacer">Scroll down</div>
<section data-fx="orbit-ring-pin" id="orbit">
  <div class="pin" data-fx-part="pin">
    <h2>A question set<br>across two lines?</h2>
    <div data-fx-part="ring">
      <div class="chip" data-fx-part="item" style="width:9%"></div>
      <div class="chip c" data-fx-part="item" style="width:3%"></div>
      <div class="chip" data-fx-part="item" style="width:7%"></div>
      <div class="chip" data-fx-part="item" style="width:10%" data-demo-remove></div>
      <div class="chip c" data-fx-part="item" style="width:2.4%"></div>
      <div class="chip" data-fx-part="item" style="width:8%"></div>
      <div class="chip" data-fx-part="item" style="width:9%"></div>
      <div class="chip" data-fx-part="item" style="width:12%"></div>
      <div class="chip c" data-fx-part="item" style="width:3%"></div>
      <div class="chip" data-fx-part="item" style="width:8%"></div>
    </div>
  </div>
</section>
<div class="demo-spacer" data-demo-late-host>Footer</div>
<div data-fx="orbit-ring-pin"></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
document.getElementById("orbit").addEventListener("fx:orbit-half", (e) => document.body.classList.toggle("is-half", e.detail.past));
setTimeout(() => { const s = document.createElement("section"); s.setAttribute("data-fx", "orbit-ring-pin"); s.innerHTML = '<div class="pin"><h2>Late-arriving circle</h2><div data-fx-part="ring"><div class="chip" data-fx-part="item" style="width:10%"></div><div class="chip c" data-fx-part="item" style="width:3%"></div><div class="chip" data-fx-part="item" style="width:8%"></div></div></div>'; document.querySelector("[data-demo-late-host]").before(s); }, 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
