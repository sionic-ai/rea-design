<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>logo-cycle-loader — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .page { min-height: 80vh; display: grid; place-items: center; font: 700 48px/1 var(--kf-font-display); }
  .demo-again { margin: 20px; }
</style>
</head>
<body>
<p class="demo-hint"><b>logo-cycle-loader</b> — On a fresh open, five logos swap over 1.4s, the cover turns the background color and then folds up. Reloading in the same window runs the short version (uncovers after .5s). <button class="demo-again" type="button" onclick="sessionStorage.removeItem('kfLogoCycleLoader');location.reload()">Like new again</button></p>
<div data-fx="logo-cycle-loader">
  <div data-fx-part="panel"></div>
  <div data-fx-part="marks">
    <svg data-fx-part="mark" viewBox="0 0 400 120" style="--fx-w: 36%"><rect x="4" y="4" width="392" height="112" rx="56" fill="none" stroke="currentColor" stroke-width="8"/><text x="200" y="80" text-anchor="middle" fill="currentColor" style="font: 700 64px var(--kf-font-display)">Logo 1</text></svg>
    <svg data-fx-part="mark" viewBox="0 0 24 24" style="--fx-w: 14%"><path d="M12 0c.6 6.4 5.6 11.4 12 12-6.4.6-11.4 5.6-12 12-.6-6.4-5.6-11.4-12-12C6.4 11.4 11.4 6.4 12 0Z" fill="currentColor"/></svg>
    <svg data-fx-part="mark" viewBox="0 0 300 140" style="--fx-w: 28%"><ellipse cx="150" cy="70" rx="144" ry="64" fill="none" stroke="currentColor" stroke-width="8"/><text x="150" y="88" text-anchor="middle" fill="currentColor" style="font: 700 52px var(--kf-font-sans)">Logo 3</text></svg>
    <svg data-fx-part="mark" viewBox="0 0 200 200" style="--fx-w: 18%"><circle cx="100" cy="100" r="94" fill="none" stroke="currentColor" stroke-width="8"/></svg>
    <svg data-fx-part="mark" viewBox="0 0 400 110" style="--fx-w: 34%"><text x="200" y="90" text-anchor="middle" fill="currentColor" style="font: 700 100px var(--kf-font-display)">WORDMARK</text></svg>
  </div>
</div>
<main class="page">Your Hero here</main>
<section style="padding: 20px"><div data-fx="logo-cycle-loader" data-fx-logo-cycle-loader="key: none" data-demo-empty style="position: relative; height: 0"></div></section>
<script>
// Late arrivals · removed items — checks that fx-core attaches to elements added 1 second later, and detaches from elements removed after 2.5 seconds (it is a cover, so judged as a height-0 panel)
(() => {
  const src = document.querySelector('[data-fx~="logo-cycle-loader"]');
  if (!src) return;
  const html = src.outerHTML;
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; el.setAttribute("data-fx-logo-cycle-loader", "key: none"); el.style.cssText = "position: relative; height: 0; overflow: hidden"; return el; };
  const gone = make("gone");
  document.querySelector("[data-demo-empty]").after(gone);
  setTimeout(() => gone.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical one comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
