<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>group-step-rise — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.8 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-spacer { height: 90vh; display: grid; place-items: center; color: var(--kf-dim); }
  .demo-group { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; width: min(900px, 90%); margin: 0 auto 60vh; }
  .demo-photo { aspect-ratio: 3 / 4; background: var(--kf-raised); border: 1px solid var(--kf-line); }
  .demo-text p + p { margin-top: 1.6em; }
</style>
</head>
<body>
<p class="demo-hint"><b>group-step-rise</b> — Scroll down. When the group enters, the photo (0) rises first, then the text rises in order 1, 2, 3, .5s later each.</p>
<div class="demo-spacer">Scroll down</div>
<div class="demo-group" data-fx="group-step-rise">
  <div class="demo-text">
    <p data-fx-part="item" data-key="1">Your first body line here.</p>
    <p data-fx-part="item" data-key="2">Your second line of body copy here.</p>
    <p data-fx-part="item" data-key="3">Your third line of body copy here.</p>
  </div>
  <div class="demo-photo" data-fx-part="item" data-key="0"></div>
</div>
<script>
// Late arrivals and removals — checks that fx-core attaches to an element added after 1s and detaches from an element removed after 2.5s
(() => {
  const src = document.querySelector('[data-fx~="group-step-rise"]');
  if (!src) return;
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = src.outerHTML; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => src.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s one more identical bundle comes in, and after 2.5s one drops out.");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
