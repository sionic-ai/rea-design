<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>defog-cycle — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .row { display: flex; gap: 24px; padding: 24px; }
  .stage { width: 360px; aspect-ratio: 438 / 534; clip-path: ellipse(43% 54% at 50% 50%); }
  .small { width: 240px; aspect-ratio: 1; }
  .stage .wf-img, .small .wf-img { height: 100%; }
</style>
</head>
<body>
<p class="demo-hint"><b>defog-cycle</b> — Every 5 seconds (2 for small plates) the next photo blooms brightly, then clears and settles. The mask is in the using side’s css (the left plate is an ellipse)</p>
<div class="row">
  <div class="stage" data-fx="defog-cycle">
    <div data-fx-part="item"><div class="wf-img" data-label="Photo 1 · Worker · portrait"></div></div>
    <div data-fx-part="item"><div class="wf-img" data-label="Photo 2 · Forest · Vertical"></div></div>
    <div data-fx-part="item"><div class="wf-img" data-label="Photo 3 · Solid wood · Portrait"></div></div>
  </div>
  <div class="small" data-demo-remove data-fx="defog-cycle" data-fx-defog-cycle="every: 2">
    <div data-fx-part="item"><div class="wf-img" data-label="Small panel 1"></div></div>
    <div data-fx-part="item"><div class="wf-img" data-label="Small panel 2"></div></div>
  </div>
  <template data-demo-late><div class="small" data-fx="defog-cycle" data-fx-defog-cycle="every: 2" style="--fx-fade: 1.5s">
    <div data-fx-part="item"><div class="wf-img" data-label="Late-arriving panel 1"></div></div>
    <div data-fx-part="item"><div class="wf-img" data-label="Late-arriving panel 2"></div></div>
  </div></template>
</div>
<div class="small" data-fx="defog-cycle"></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
