<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hole-open-intro — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 101; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .scene { height: 100vh; display: grid; place-items: center; background: var(--kf-accent); color: var(--kf-on-accent); font-size: 48px; font-weight: 700; }
  .logo { display: block; aspect-ratio: 2 / 1; border: 2px dashed var(--kf-ink); border-radius: 12px; display: grid; place-items: center; font-weight: 700; color: var(--kf-ink); opacity: 0; }
  .is-play .logo { opacity: 1; transition: opacity .6s; }
  .box { height: 40vh; }
</style>
</head>
<body>
<p class="demo-hint"><b>hole-open-intro</b> — Refresh. After the center logo lights up, a hole opens in the cover and grows, revealing the scene below. <span style="color:var(--kf-dim)">(After 1s one more empty act comes in, and after 2.5s it is removed)</span></p>
<div class="sn" id="op" data-fx="hole-open-intro"><div data-fx-part="figure"><span class="logo">LOGO</span></div></div>
<section class="scene">Hero scene</section>
<div class="box" id="late"></div>
<template data-demo-late><div data-fx="hole-open-intro" data-fx-hole-open-intro="at: .5; dur: .4; from: 30vw; dip: 18vw; size: 220vw; ease: 0.25,1,0.5,1; lock: false" data-demo-remove style="z-index:99; --fx-fill: var(--kf-accent)"></div></template>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
document.getElementById("op").addEventListener("fx:play", (e) => e.currentTarget.classList.add("is-play"));
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => document.getElementById("late").append(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
