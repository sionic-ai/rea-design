<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sketch-hover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { display: flex; flex-wrap: wrap; align-items: center; gap: 48px; padding: 48px; }
  .btn { display: inline-flex; align-items: center; gap: .3em; font: 700 32px/1 var(--kf-font-display); text-transform: uppercase; color: var(--kf-accent); }
  .btn i { width: 1.5em; height: .12em; background: currentColor; }
  .link { font-size: 18px; text-transform: uppercase; }
</style>
</head>
<body>
<p class="demo-hint"><b>sketch-hover</b> — Hover over buttons and links. They grow slightly and tilt while the letters boil like a hand drawing. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<section class="demo">
  <a class="btn" href="#" data-fx="sketch-hover"><i></i><span>Enter</span><i></i></a>
  <a class="link" href="#" data-fx="sketch-hover">Menu</a>
  <a class="link" href="#" data-fx="sketch-hover" data-fx-sketch-hover="tilt: -2; rock: 2">Tilted more</a>
  <a class="link" href="#" data-fx="sketch-hover" data-demo-remove>Removed</a>
  <template data-demo-late><a class="btn" href="#" data-fx="sketch-hover"><i></i><span>Late</span><i></i></a></template>
</section>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
