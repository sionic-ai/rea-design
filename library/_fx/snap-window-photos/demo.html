<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>snap-window-photos — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-spacer { height: 60vh; display: grid; place-items: center; color: var(--kf-dim); }
  .demo-photo .wf-img { height: 100%; }
  .demo-photo:nth-child(2) .wf-img { background-color: var(--kf-accent-soft); }
  .demo-row { position: relative; z-index: 1; display: grid; grid-template-columns: 1fr minmax(240px, 32%) 1fr; min-height: 100vh; }
  .demo-dim { background: color-mix(in oklab, var(--kf-ink) 32%, transparent); }
  .demo-col { display: flex; flex-direction: column; }
  .demo-col .demo-dim { flex-grow: 1; min-height: 30vh; }
  .demo-card { background: var(--kf-contrast-bg); color: var(--kf-contrast-ink); padding: 10px; }
  .demo-card i { display: block; height: 140px; margin: 10px 0; background: transparent; box-shadow: inset 10px 0 0 var(--kf-contrast-bg), inset -10px 0 0 var(--kf-contrast-bg); }
  .demo-nav { position: sticky; top: 50vh; z-index: 2; height: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 8px; }
  .demo-nav a { width: 40px; padding: 8px; background: var(--kf-surface); border: 1px solid var(--kf-line); font: 500 13px var(--kf-font-mono); }
</style>
</head>
<body>
<p class="demo-hint"><b>snap-window-photos</b> — Scrolling down, the background photo changes and shrinks each time a card passes, and when you stop scrolling the card snaps to the center of the screen.</p>
<div class="demo-spacer">Scroll down ↓</div>
<section data-fx="snap-window-photos">
  <div data-fx-part="stage">
    <div class="demo-photo" data-fx-part="photo" data-key="1"><div class="wf-img" data-label="Photo 1"></div></div>
    <div class="demo-photo" data-fx-part="photo" data-key="2"><div class="wf-img" data-label="Photo 2"></div></div>
  </div>
  <nav class="demo-nav"><a href="#c1" data-fx-part="link" data-key="1">01</a><a href="#c2" data-fx-part="link" data-key="2">02</a></nav>
  <div class="demo-row"><div class="demo-dim"></div><div class="demo-col"><div class="demo-dim"></div><article class="demo-card" id="c1" data-fx-part="card" data-key="1">Card 1<i></i>Photos show through the window</article><div class="demo-dim"></div></div><div class="demo-dim"></div></div>
  <div class="demo-row"><div class="demo-dim"></div><div class="demo-col"><div class="demo-dim"></div><article class="demo-card" id="c2" data-fx-part="card" data-key="2">Card 2<i></i>Photos show through the window</article><div class="demo-dim"></div></div><div class="demo-dim"></div></div>
</section>
<div class="demo-spacer"></div>
<script>
(() => {
  // Late arrival and removal: after 1s attach one more part, after 2.5s remove it
  const src = document.querySelector('[data-fx~="snap-window-photos"]');
  if (!src) return;
  const t = document.createElement("template");
  t.innerHTML = src.outerHTML;
  const late = t.content.firstElementChild;
  late.dataset.demo = "late";
  setTimeout(() => src.after(late), 1000);
  setTimeout(() => late.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s one more of the same section comes in, then leaves after 2.5s (detach).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
