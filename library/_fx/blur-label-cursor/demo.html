<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>blur-label-cursor — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { padding: 32px 20px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .pic { aspect-ratio: 4 / 3; }
</style>
</head>
<body>
<p class="demo-hint"><b>blur-label-cursor</b> — Hover over a photo. A frosted glass circle shows the name and follows with a lag. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<section class="demo">
  <a class="pic wf-img" data-label="Being removed soon" data-fx="blur-label-cursor" data-demo-remove href="#"></a>
  <a class="pic wf-img" data-label="Work photo" data-fx="blur-label-cursor" data-fx-blur-label-cursor="text: Browse" href="#"></a>
  <a class="pic wf-img" data-label="Work photo" data-fx="blur-label-cursor" href="#"></a>
  <template data-demo-late><a class="pic wf-img" data-label="Late-arrived Photo" data-fx="blur-label-cursor" data-fx-blur-label-cursor="text: Learn more" href="#"></a></template>
</section>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
