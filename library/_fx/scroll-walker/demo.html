<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>scroll-walker — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { margin: 0; background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); overflow-x: clip; }
  .demo-hint { position: sticky; top: 0; z-index: 60; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  section { height: 90vh; display: grid; place-items: center; border-bottom: 1px dashed var(--kf-line); font: 600 28px/1 var(--kf-font-display); }
  .walker { bottom: 6vh; left: 70vw; width: 90px; height: 120px; }
  .walker svg { display: block; width: 100%; height: 100%; }
  .body { fill: var(--kf-accent); stroke: var(--kf-ink); stroke-width: 3; }
  .body.b2 { fill: var(--kf-accent-soft); }
  .body.b3 { fill: var(--kf-raised); }
  .card { width: 50%; height: 30vh; margin: 0 auto; background: var(--kf-raised); border: 1px solid var(--kf-line); border-radius: var(--kf-radius-md); }
</style>
</head>
<body>
<p class="demo-hint"><b>scroll-walker</b> Scroll down. The character walks along, stops at the left, and flips to change when the section changes. Scrolling up turns it around. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<div class="walker" data-fx="scroll-walker" data-fx-scroll-walker="edge: top; avoid: .card; avoid-below: 2000">
  <div data-fx-part="hide"><div data-fx-part="dir"><div data-fx-part="face">
    <svg data-fx-part="look" viewBox="0 0 90 120"><circle class="body" cx="45" cy="30" r="22"/><rect class="body" x="22" y="56" width="46" height="56" rx="12"/></svg>
    <svg data-fx-part="look" data-key="#s2" data-ratio=".4" viewBox="0 0 90 120"><circle class="body b2" cx="45" cy="30" r="22"/><rect class="body b2" x="22" y="56" width="46" height="56" rx="12"/></svg>
    <svg data-fx-part="look" data-key="#s3" data-ratio=".3" viewBox="0 0 90 120"><circle class="body b3" cx="45" cy="30" r="22"/><path class="body b3" d="M20 112 45 56 70 112Z"/></svg>
  </div></div></div>
</div>
<section id="s1">Section One</section>
<section id="s2">Section two — the character changes here</section>
<section id="s3"><div class="card"></div></section>
<section>Footer</section>
<div class="walker" data-fx="scroll-walker" data-demo-remove style="left: 40vw"><svg data-fx-part="look" viewBox="0 0 90 120"><circle class="body" cx="45" cy="30" r="22"/></svg></div>
<div id="late"></div>
<template data-demo-late><div class="walker" data-fx="scroll-walker" data-fx-scroll-walker="stop: 10; turn: .5" style="left: 55vw; bottom: 30vh"><div data-fx-part="dir"><svg data-fx-part="look" viewBox="0 0 90 120"><rect class="body b2" x="22" y="20" width="46" height="90" rx="20"/></svg></div></div></template>
<div data-fx="scroll-walker"></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => document.getElementById("late").append(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
