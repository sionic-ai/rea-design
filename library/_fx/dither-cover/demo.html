<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dither-cover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo-box { margin: 40px 20px; padding: 40px; border: 1px solid var(--kf-line); display: flex; gap: 16px; }
  .demo-box a { padding: 10px 18px; border: 1px solid var(--kf-line); border-radius: var(--kf-radius-pill); color: var(--kf-ink); text-decoration: none; }
</style>
</head>
<body>
<p class="demo-hint"><b>dither-cover</b> — Click the link below. Large pixels cover the page more and more densely, then it returns to the same page and clears.</p>
<div class="demo-box" data-fx="dither-cover"><a href="demo.html?again">Reopen this page</a><a href="demo.html?fast">Once more</a></div>
<div class="demo-box" data-fx="dither-cover" data-fx-dither-cover="cover: 0; dur: 0.4"><a href="demo.html?quick">Skip the cover and move on right away (arrival only .4s)</a></div>
<script>
// Late arrivals and removals — checks that fx-core attaches to an element added after 1s and detaches from an element removed after 2.5s
(() => {
  const src = document.querySelector('[data-fx~="dither-cover"]');
  const make = (tag) => { const el = src.cloneNode(true); el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => src.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another link group comes in (a late arrival), and after 2.5s one is removed (detach).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
