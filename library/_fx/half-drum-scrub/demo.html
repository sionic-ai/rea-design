<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>half-drum-scrub — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-spacer { height: 70vh; display: grid; place-items: center; color: var(--kf-dim); }
  .d { background: var(--kf-contrast-bg); color: var(--kf-contrast-ink); font: 600 5.2vw/1 var(--kf-font-display); }
</style>
</head>
<body>
<p class="demo-hint"><b>half-drum-scrub</b> — Scroll down. The section stays put while a word cylinder rolls from bottom to top. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<div class="demo-spacer">Downward</div>
<section class="d" data-fx="half-drum-scrub"><div data-fx-part="drum"><div data-fx-part="item">Field 01</div><div data-fx-part="item">Field 02</div><div data-fx-part="item">Field 03</div><div data-fx-part="item">Field 04</div><div data-fx-part="item">Field 05</div><div data-fx-part="item">Field 06</div><div data-fx-part="item">Field 07</div><div data-fx-part="item">Field 08</div><div data-fx-part="item">Field 09</div><div data-fx-part="item">Field 10</div></div></section>
<div class="demo-spacer">Between</div>
<template data-demo-late><section class="d" data-fx="half-drum-scrub" data-fx-half-drum-scrub="span: 1200"><div data-fx-part="drum"><div data-fx-part="item">Late One</div><div data-fx-part="item">Late two</div><div data-fx-part="item">Late three</div></div></section></template>
<section data-demo-remove data-fx="half-drum-scrub"></section>
<div class="demo-spacer">Footer</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); window.ScrollTrigger?.refresh(); }, 2500);
</script>
</body>
</html>
