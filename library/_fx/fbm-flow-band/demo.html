<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fbm-flow-band — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.6 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .panel { position: relative; isolation: isolate; margin: 24px; min-height: 70vh; border-radius: var(--kf-radius-lg); background: var(--kf-bg); box-shadow: 0 0 0 1px var(--kf-line); overflow: hidden; display: grid; place-items: center; }
  .panel > .band { position: absolute; inset: 0; z-index: -1; }
  .panel h2 { font-size: 40px; }
</style>
</head>
<body>
<p class="demo-hint"><b>fbm-flow-band</b> — Sweep the mouse over the panel. The noise grain is pushed along by the flow. <span style="color:var(--kf-dim)">(After 1s one more panel comes in, and one leaves 2.5s later)</span></p>
<section class="panel">
  <div class="band" data-fx="fbm-flow-band" data-fx-fbm-flow-band="origin: 0.5,-0.2; from: bottom; fade: 0,3; ease: 0.75,0.5,0.5,1; scale: 1; octaves: 3.5; chroma: .25; ref: 640; res: .1; blur: 8"></div>
  <h2>Strip rising from below the panel</h2>
</section>
<section class="panel" style="min-height: 50vh">
  <div class="band" data-fx="fbm-flow-band" data-fx-fbm-flow-band="iris: .55; spot: 1"></div>
  <h2>Top-center cloud · Dense only around the cursor</h2>
</section>
<section class="panel" data-demo-remove><div class="band" data-fx="fbm-flow-band"></div><h2>Dropping panel</h2></section>
<div data-late-slot></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/CustomEase.min.js"></script>
<script>gsap.registerPlugin(CustomEase);</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelector("[data-late-slot]").outerHTML = '<section class="panel" style="min-height:40vh"><div class="band" data-fx="fbm-flow-band" data-fx-fbm-flow-band="from: bottom; origin: 0.5,0; seed: 3"></div><h2>Late panel</h2></section>', 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
