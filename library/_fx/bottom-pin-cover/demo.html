<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bottom-pin-cover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { margin: 0; padding: 12px 20px; border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .lead { height: 60vh; display: grid; place-items: center; }
  .pin { display: grid; place-items: center; font: 700 40px/1 var(--kf-font-display); background: var(--kf-accent-soft); }
  .cover { position: relative; z-index: 100; min-height: 100vh; display: grid; place-items: center; border-radius: 40px 40px 0 0; background: var(--kf-surface); font: 700 40px/1 var(--kf-font-display); }
  .end { position: relative; z-index: 100; height: 80vh; background: var(--kf-raised); }
</style>
</head>
<body>
<p class="demo-hint"><b>bottom-pin-cover</b> — Scroll down. The first panel sticks to the floor and the next panel rises to cover it.</p>
<div class="lead">Previous content</div>
<section id="s1" data-fx="bottom-pin-cover" data-fx-bottom-pin-cover="end: .end"><div class="pin" data-fx-part="pin">Section to Pin</div></section>
<section class="cover">Overlay Panel</section>
<section class="end"></section>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
  gsap.registerPlugin(ScrollTrigger);
  // Checks whether it attaches to late-arriving sections and whether removed sections get detached
  setTimeout(() => {
    const s = document.createElement("section");
    s.dataset.fx = "bottom-pin-cover";
    s.innerHTML = '<div class="pin" data-fx-part="pin">Late section</div>';
    document.querySelector(".cover").after(s);
    setTimeout(() => s.remove(), 1500);
  }, 1000);
</script>
</body>
</html>
