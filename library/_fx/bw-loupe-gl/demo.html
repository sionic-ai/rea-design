<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bw-loupe-gl — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .row { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px; padding: 20px; }
  .row figure { margin: 0; aspect-ratio: 3 / 2; border: 1px solid var(--kf-line); }
</style>
</head>
<body>
<p class="demo-hint"><b>bw-loupe-gl</b> — Move the mouse over the black-and-white photo and only around the cursor it magnifies and color returns. Click and a color ripple spreads from that spot.</p>
<section class="row">
  <figure data-fx="bw-loupe-gl" data-demo-remove><img data-fx-part="img" alt="" src="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='600' height='400'%3E%3Crect width='600' height='400' fill='%23c9d6d8'/%3E%3Cellipse cx='300' cy='370' rx='150' ry='110' fill='%232b2b2b'/%3E%3Cellipse cx='300' cy='160' rx='62' ry='78' fill='%23d9b39b'/%3E%3C/svg%3E"></figure>
  <figure data-fx="bw-loupe-gl" data-fx-bw-loupe-gl="radius: 110; mag: 1.6"><img data-fx-part="img" alt="" src="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='600' height='400'%3E%3Crect width='600' height='400' fill='%23e0cfcf'/%3E%3Cellipse cx='260' cy='370' rx='150' ry='110' fill='%235a3b2c'/%3E%3Cellipse cx='260' cy='160' rx='62' ry='78' fill='%23e8c4ad'/%3E%3C/svg%3E"></figure>
  <figure data-fx="bw-loupe-gl"></figure>
  <template data-demo-late><figure data-fx="bw-loupe-gl"><img data-fx-part="img" alt="" src="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='600' height='400'%3E%3Crect width='600' height='400' fill='%23cfd8cf'/%3E%3C/svg%3E"></figure></template>
</section>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
