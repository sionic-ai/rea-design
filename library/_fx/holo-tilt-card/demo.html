<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>holo-tilt-card — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { display: flex; flex-wrap: wrap; gap: 30px; padding: 48px 20px; }
  .stage { perspective: 600px; }
  .card { width: 240px; height: 320px; border: 3px solid var(--kf-surface); border-radius: 12px; background: var(--kf-accent); box-shadow: var(--kf-shadow-lift); }
  .card b { position: absolute; left: 16px; bottom: 16px; padding: 6px 12px; background: var(--kf-surface); font: 700 18px/1 var(--kf-font-display); }
</style>
</head>
<body>
<p class="demo-hint"><b>holo-tilt-card</b> — Move the mouse over the card. The card tilts and a rainbow band and glare follow (the second one has no band). <span style="color:var(--kf-dim)">(One more card comes in after 1s, and one drops out after 2.5s)</span></p>
<section class="demo">
  <div class="stage" data-demo-remove><article class="card" data-fx="holo-tilt-card"><b>Player 1</b></article></div>
  <div class="stage"><article class="card" data-fx="holo-tilt-card" data-fx-holo-tilt-card="look: plain"><b>Without band</b></article></div>
  <div class="stage"><article class="card" data-fx="holo-tilt-card" data-fx-holo-tilt-card="max: 12"><b>Up to 12°</b><span data-fx-part="glare"></span><span data-fx-part="foil"></span></article></div>
  <template data-demo-late><div class="stage"><article class="card" data-fx="holo-tilt-card"><b>Late-arrived card</b></article></div></template>
  <div class="stage"><article class="card" data-fx="holo-tilt-card"></article></div>
</section>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
