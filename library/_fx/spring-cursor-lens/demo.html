<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>spring-cursor-lens — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 9; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .band { min-height: 50vh; display: flex; gap: 40px; align-items: center; justify-content: center; border-top: 1px solid var(--kf-line); }
  .band a, .band span { font-size: 28px; }
  .demo-photo { width: 320px; height: 200px; }
</style>
</head>
<body>
<p class="demo-hint"><b>spring-cursor-lens</b> — Move the mouse. Over links and ‹click spots› the circle shrinks, and it shrinks further while pressed. <span style="color:var(--kf-dim)">(One more cursor comes in after 1s, and one drops out after 1.5s)</span></p>
<div id="gone" data-fx="spring-cursor-lens" data-fx-spring-cursor-lens="small: .3; native: show" style="--fx-size: 20px" aria-hidden="true"></div>
<section class="band"><a href="#a">Link one</a><a href="#b">Link Two</a><span data-clickable>Press Spot</span></section>
<section class="band"><div class="demo-photo wf-img" data-label="Photo slot · inverted blur shows through"></div></section>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
  setTimeout(() => {
    const d = document.createElement("div");
    d.dataset.fx = "spring-cursor-lens";
    d.setAttribute("aria-hidden", "true");
    d.innerHTML = '<span data-fx-part="lens"></span>';
    document.body.append(d);
  }, 1000);
  setTimeout(() => document.getElementById("gone").remove(), 1500);
</script>
</body>
</html>
