<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>blob-stage-switch — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<link rel="stylesheet" href="../svg-blob-morph/fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo-sec { min-height: 100vh; display: grid; place-items: center; font: 600 48px/1 var(--kf-font-display); }
  .b1 path { fill: var(--kf-accent); } .b2 path { fill: var(--kf-accent-soft); } .b3 path { fill: var(--kf-line); }
  .b1 { width: 60vw; left: -10vw; top: -10vh; } .b2 { width: 50vw; left: 50vw; top: 40vh; } .b3 { width: 40vw; left: 20vw; top: 60vh; }
  [data-scene="two"] .b1 { width: 40vw; left: 55vw; top: 5vh; }
  [data-scene="two"] .b2 { width: 70vw; left: -20vw; top: 30vh; }
  [data-scene="three"] .b3 { width: 80vw; left: 10vw; top: 10vh; }
</style>
</head>
<body>
<p class="demo-hint"><b>blob-stage-switch</b> — Three blobs fly in from off-screen and settle, then move to a new spot when the section changes on scroll.</p>
<div class="stage" data-fx="blob-stage-switch" data-fx-blob-stage-switch="enter: fly">
  <figure class="b1" data-fx-part="blob" data-from="1.2 0" data-at="0"><svg viewBox="0 0 906 547"><path data-fx="svg-blob-morph" data-fx-svg-blob-morph="seed: 11"/></svg></figure>
  <figure class="b2" data-fx-part="blob" data-from="-.8 1.5" data-at=".5"><svg viewBox="0 0 626 456"><path data-fx="svg-blob-morph" data-fx-svg-blob-morph="seed: 37; begin: 1"/></svg></figure>
  <figure class="b3" data-fx-part="blob" data-from=".8 .8" data-at="1"><svg viewBox="0 0 535 508"><path data-fx="svg-blob-morph" data-fx-svg-blob-morph="seed: 41; begin: 2"/></svg></figure>
</div>
<section class="demo-sec" data-blob-scene="one">Section One</section>
<section class="demo-sec" data-blob-scene="two">Section Two</section>
<section class="demo-sec" data-blob-scene="three">Section Three</section>
<script>
// Late arrivals and removals — after 1 second one more of the same panel comes in, and after 2.5 seconds that panel leaves to check whether detaching works
(() => {
  const src = document.querySelector('[data-fx~="blob-stage-switch"]');
  const t = document.createElement("template");
  t.innerHTML = src.outerHTML.replace('enter: fly', 'enter: none');
  const late = t.content.firstElementChild;
  late.style.opacity = ".3";
  setTimeout(() => src.after(late), 1000);
  setTimeout(() => late.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1 second one more pale panel comes in (a late arrival), and after 2.5 seconds it drops out (detach).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="../svg-blob-morph/fx.js"></script>
<script src="fx.js"></script>
</body>
</html>
