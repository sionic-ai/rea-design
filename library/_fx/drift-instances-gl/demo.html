<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>drift-instances-gl — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .row { display: flex; flex-wrap: wrap; gap: 20px; padding: 20px; }
  .win { width: 340px; height: 340px; border: 15px solid var(--kf-ink); background: var(--kf-accent-soft); }
</style>
</head>
<body>
<p class="demo-hint"><b>drift-instances-gl</b> — 50 identical items drift around in each window.</p>
<div class="row">
  <div class="win" data-fx="drift-instances-gl" data-fx-drift-instances-gl="shape: arc"></div>
  <div class="win" data-fx="drift-instances-gl" data-fx-drift-instances-gl="shape: disc; count: 30" data-demo-remove></div>
  <div class="win" data-fx="drift-instances-gl" data-fx-drift-instances-gl="shape: bottle; speed: 0"></div>
</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../_vendor/three@0.132.2/three.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => {
  const late = document.createElement("div");
  late.className = "win";
  late.setAttribute("data-fx", "drift-instances-gl");
  late.setAttribute("data-fx-drift-instances-gl", "shape: bowl");
  document.querySelector(".row").append(late);
}, 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
