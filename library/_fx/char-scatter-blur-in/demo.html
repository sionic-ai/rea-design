<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>char-scatter-blur-in — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { padding: 12px 20px; border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .catch { display: flex; flex-direction: row-reverse; justify-content: center; gap: 24px; height: 70vh; padding-top: 60px; writing-mode: vertical-rl; font: 400 34px/1.6 var(--kf-font-display); letter-spacing: .2em; }
  .rest { display: grid; gap: 40px; padding: 120vh 40px 60vh; font: 400 28px/1.6 var(--kf-font-display); }
</style>
</head>
<body>
<p class="demo-hint"><b>char-scatter-blur-in</b> — As soon as it opens, the vertical catch letters come into focus in random order as the blur clears. Scroll down and the horizontal title lights up the same way when 20% of it enters the screen.</p>
<h1 class="catch"><span data-fx="char-scatter-blur-in">Your first-line catchphrase here,</span><span data-fx="char-scatter-blur-in">Second line.</span></h1>
<div class="rest"><p data-fx="char-scatter-blur-in">Your one-line bottom heading here</p></div>
<script>
// Late arrivals and removals — checks that fx-core attaches to an element added after 1s and detaches from an element removed after 2.5s
(() => {
  const rest = document.querySelector(".rest");
  const make = (t) => { const p = document.createElement("p"); p.dataset.fx = "char-scatter-blur-in"; p.textContent = t; return p; };
  const gone = make("Line to be removed soon");
  rest.prepend(gone);
  setTimeout(() => rest.prepend(make("Late-arriving line")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s one more row comes in, and after 2.5s one leaves.");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
