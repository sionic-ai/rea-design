<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>inset-clip-hover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; padding: 48px 20px; }
  .demo a { display: block; color: inherit; text-decoration: none; }
  .demo .wf-img { aspect-ratio: 16 / 9; }
  .demo p { padding: 10px 0; font-weight: 700; }
</style>
</head>
<body>
<p class="demo-hint"><b>inset-clip-hover</b> — Hover over the photo cards. <span style="color:var(--kf-dim)">(One more card comes in after 1s, and one drops out after 2.5s)</span></p>
<section class="demo" id="demo">
  <a data-fx="inset-clip-hover" href="#" data-demo-remove><div class="wf-img" data-fx-part="media" data-label="Photo 1"></div><p>Card 1</p></a>
  <a data-fx="inset-clip-hover" href="#"><div class="wf-img" data-fx-part="media" data-label="Photo 2"></div><p>Card 2</p></a>
  <a data-fx="inset-clip-hover" href="#" style="--fx-inset: 20px"><div class="wf-img" data-fx-part="media" data-label="Photo 3 · inset 20px"></div><p>Card 3</p></a>
  <div class="wf-img" data-fx="inset-clip-hover" data-label="Photo of the Element Itself"></div>
</section>
<script>
// Check that it also applies to late-added elements (it’s CSS, so immediately) and that removed ones get detached
setTimeout(() => document.getElementById("demo").insertAdjacentHTML("beforeend", '<a data-fx="inset-clip-hover" href="#"><div class="wf-img" data-fx-part="media" data-label="Late-arrived Photo"></div><p>Card 4</p></a>'), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
