<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>perch-mask-in — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 1; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .spacer { height: 90vh; display: grid; place-items: center; color: var(--kf-dim); }
  .stage { display: flex; gap: 40px; justify-content: center; padding: 40px 20px 60vh; }
  .bird { display: block; width: 180px; }
  .bird svg { width: 100%; fill: var(--kf-accent); }
</style>
</head>
<body>
<p class="demo-hint"><b>perch-mask-in</b> — Scroll down and a new image settles in from the right, revealed from the top.</p>
<div class="spacer">Scroll down</div>
<div class="stage">
  <span class="bird" data-fx="perch-mask-in"><svg viewBox="0 0 120 80"><path d="M10 44c14-4 30-6 46-2 10 2 20 1 30-4-4 8-12 13-22 15l-8 12-4-10c-14 2-28-2-42-11Z"/><path d="M42 34C34 18 20 8 2 6c10 8 18 18 22 30Z"/><path d="M46 40C52 22 66 10 88 6 78 16 70 28 66 42Z"/></svg></span>
  <span class="bird" data-fx="perch-mask-in" data-demo-remove style="--fx-x: 3rem; --fx-mask: 2s"><svg viewBox="0 0 120 80"><path d="M10 44c14-4 30-6 46-2 10 2 20 1 30-4-4 8-12 13-22 15l-8 12-4-10c-14 2-28-2-42-11Z"/></svg></span>
  <template data-demo-late><span class="bird" data-fx="perch-mask-in" data-fx-perch-mask-in="start: top 80%"><svg viewBox="0 0 120 80"><path d="M42 34C34 18 20 8 2 6c10 8 18 18 22 30Z"/><path d="M46 40C52 22 66 10 88 6 78 16 70 28 66 42Z"/></svg></span></template>
</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
