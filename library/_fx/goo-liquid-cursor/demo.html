<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>goo-liquid-cursor — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { min-height: 100vh; background: var(--kf-contrast-bg); color: var(--kf-contrast-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .stage { --fx-goo: var(--kf-contrast-ink); --fx-goo-ink: var(--kf-contrast-bg); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); color: var(--kf-text, inherit); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .stage { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 120px; padding: 160px 40px; }
  .round { display: grid; place-items: center; width: 44px; height: 44px; padding: 0; border: 1px solid currentColor; border-radius: 999px; background: none; color: inherit; cursor: none; transition: background-color 0.25s; }
  .round:hover { background: color-mix(in srgb, currentColor 12%, transparent); }
  .round svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; }
  .big { display: grid; place-items: center; width: 160px; height: 160px; border-radius: 999px; background: var(--kf-contrast-bg); color: inherit; font: 500 13px/1 var(--kf-font-sans); letter-spacing: 0.12em; text-decoration: none; translate: var(--fx-liquid-x, 0) var(--fx-liquid-y, 0); transition: translate 0.3s ease; box-shadow: 0 0 32px color-mix(in srgb, currentColor 25%, transparent); }
  .plain { color: inherit; }
</style>
</head>
<body>
<p class="demo-hint"><b>goo-liquid-cursor</b> — Move the mouse near the button. The dot disappears and a disc fills up stickily inside the button. Over ordinary links the dot hides.</p>
<main class="stage" data-fx="goo-liquid-cursor" data-demo-remove>
  <button class="round" type="button" data-fx-part="well" aria-label="Previous section"><svg viewBox="0 0 24 24"><path d="m6 15 6-6 6 6"/></svg></button>
  <a class="big" href="#" data-fx-part="well" data-fx-goo-liquid-cursor="blur: 26; cut: -8" style="--fx-goo-mirror: 56px"><span>VIEW SITE</span></a>
  <a class="big" href="#" data-fx-part="well"><span>Your button text here</span></a>
  <a class="plain" href="#">Plain link, no liquid</a>
</main>
<template data-demo-late><section class="stage" data-fx="goo-liquid-cursor" data-fx-goo-liquid-cursor="reach: 60; follow: .15; blur: 26; cut: -8"><button class="round" type="button" data-fx-part="well" aria-label="Next section"><svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></button><span>Button that appears after 1s (close 60px · dot follows slowly · wide filter)</span></section></template>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
