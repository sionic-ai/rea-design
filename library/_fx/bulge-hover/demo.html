<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bulge-hover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { display: flex; gap: 40px; padding: 48px 20px; }
  .demo-spacer { height: 60vh; display: grid; place-items: center; color: var(--kf-dim); }
  .card { width: 30%; aspect-ratio: 1; border-radius: var(--kf-radius-md); background: var(--kf-raised); }
</style>
</head>
<body>
<p class="demo-hint"><b>bulge-hover</b> — Hover and move over the photo — the cursor spot swells like a lens. It slowly settles back when you leave. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<section class="demo">
  <a class="card" data-demo-remove data-fx="bulge-hover"><canvas data-fx-part="source" data-demo-paint width="560" height="560"></canvas></a>
  <a class="card" data-fx="bulge-hover" data-fx-bulge-hover="power: .4; falloff: 4"><canvas data-fx-part="source" data-demo-paint width="560" height="560"></canvas></a>
  <template data-demo-late><a class="card" data-fx="bulge-hover"><canvas data-fx-part="source" data-demo-paint width="560" height="560"></canvas></a></template>
</section>
<div class="demo-spacer">Scrolling down pauses rendering off-screen</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../_vendor/ogl@1.0.11/ogl.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// A panel drawing bands and circles in skin colors instead of photos — uploading an img to WebGL is blocked on file://, so it’s drawn on a canvas
const css = getComputedStyle(document.documentElement), c = (n) => css.getPropertyValue(n).trim();
const paint = (root) => root.querySelectorAll("[data-demo-paint]").forEach((cv) => {
  const g = cv.getContext("2d"), W = cv.width, H = cv.height;
  g.fillStyle = c("--kf-ink"); g.fillRect(0, 0, W, H);
  for (let i = 0; i < 12; i++) { g.fillStyle = i % 2 ? c("--kf-accent") : c("--kf-surface"); g.globalAlpha = 0.85; g.fillRect(i * W / 12, H * 0.55, W / 24, H * 0.45); }
  g.globalAlpha = 1; g.fillStyle = c("--kf-accent"); g.beginPath(); g.arc(W / 2, H * 0.32, W * 0.22, 0, Math.PI * 2); g.fill();
});
paint(document);
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => { const f = t.content.cloneNode(true); paint(f); t.replaceWith(f); }), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); window.ScrollTrigger?.refresh(); }, 2500);
</script>
</body>
</html>
