<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>skew-slide-btn — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .row { display: flex; gap: 12px; padding: 60px 20px; flex-wrap: wrap; }
  .btn { align-items: center; gap: 8px; padding: 12px 16px; border-radius: 4px; color: var(--kf-on-accent); font: 700 14px/1 var(--kf-font-sans); text-transform: uppercase; text-decoration: none; }
</style>
</head>
<body>
<p class="demo-hint"><b>skew-slide-btn</b> — Hover over the button. The text tilts and slides out to the left, and the same text enters from the right.</p>
<div class="row">
  <a class="btn" href="#" data-fx="skew-slide-btn" style="--fx-bg: var(--kf-accent)"><span data-fx-part="text">Join together</span> »</a>
  <a class="btn" href="#" data-fx="skew-slide-btn" style="--fx-bg: var(--kf-accent)">Get the guidebook</a>
</div>
<script>
// Late arrivals and removals — checks that fx-core attaches to an element added after 1s and detaches from an element removed after 2.5s
(() => {
  const row = document.querySelector(".row");
  const src = row.querySelector('[data-fx~="skew-slide-btn"]');
  const make = (t) => { const n = src.cloneNode(true); n.querySelector('[data-fx-part="text"]').textContent = t; return n; };
  const gone = make("Being removed soon"); row.append(gone);
  setTimeout(() => row.append(make("Late one")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s one more button comes in, and after 2.5s one drops out.");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
