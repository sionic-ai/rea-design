<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>swap-tint-cycle — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-surface); color: var(--kf-ink); font: 400 15px/1.6 var(--kf-font-sans); }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .box { display: grid; grid-template-columns: 1fr 1fr; align-items: center; gap: 40px; max-width: 1000px; margin: 40px auto; padding: 0 20px; }
  .item { position: relative; height: 420px; aspect-ratio: 4 / 5; overflow: hidden; margin: 0; background: linear-gradient(160deg, var(--kf-raised), var(--tone) 140%); }
  .badge { position: absolute; bottom: 240px; width: 70px; height: 66px; display: grid; place-items: center; background: var(--kf-surface); box-shadow: var(--kf-shadow-soft); font-size: 11px; }
  .phone { position: absolute; left: 26%; bottom: -10px; width: 48%; height: 220px; border-radius: 22px 22px 0 0; background: var(--kf-ink); }
  h2 { font: var(--kf-weight-display) clamp(36px, 6vw, 72px)/1 var(--kf-font-display); text-transform: uppercase; text-align: center; }
</style>
</head>
<body>
<p class="demo-hint"><b>swap-tint-cycle</b> — Just watch. The photo set changes every 3 seconds (the actual change starts at 6 seconds) and the word on the right changes color to match. <span style="color:var(--kf-dim)">(One more bundle comes in after 1s, and one drops out after 2.5s)</span></p>
<section class="box" data-fx="swap-tint-cycle">
  <div class="stack">
    <figure class="item is-displayed" data-fx-part="item" style="--tone: var(--kf-accent)">
      <span class="badge" data-fx-part="pop" style="left:30%">LOGO</span><span class="badge" data-fx-part="pop" style="left:52%;bottom:220px;--fx-turn:10deg">LOGO</span><span class="phone" data-fx-part="rise"></span>
    </figure>
    <figure class="item" data-fx-part="item" style="--tone: var(--kf-accent-text)">
      <span class="badge" data-fx-part="pop" style="left:30%">LOGO</span><span class="phone" data-fx-part="rise"></span>
    </figure>
    <figure class="item" data-fx-part="item" data-demo-remove style="--tone: var(--kf-dim)">
      <span class="phone" data-fx-part="rise"></span>
    </figure>
  </div>
  <h2>Brand<br>in your<br><span data-fx-part="word">colours.</span></h2>
</section>
<template data-demo-late><section class="box" data-fx="swap-tint-cycle" data-fx-swap-tint-cycle="every: 1.5"><div><figure class="item is-displayed" data-fx-part="item" style="--tone: var(--kf-ink)"></figure><figure class="item" data-fx-part="item" style="--tone: var(--kf-accent)"></figure></div><h2><span data-fx-part="word">Late</span></h2></section></template>
<div data-fx="swap-tint-cycle"></div>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
