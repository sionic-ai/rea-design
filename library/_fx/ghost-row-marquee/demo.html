<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ghost-row-marquee — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  ul { padding: 60px 6vw; }
  li { border-bottom: 1px solid var(--kf-line); padding: 18px 0; }
  h3, [data-fx-part="marquee"] span { font: 700 64px/1 var(--kf-font-display); text-transform: uppercase; padding-right: 1em; }
  [data-fx-part="items"] span { padding: 0 1.2em; font: 500 12px/2.4 var(--kf-font-mono); letter-spacing: .18em; }
</style>
</head>
<body>
<p class="demo-hint"><b>ghost-row-marquee</b> — Hover over a row. The name flows as a marquee and an item strip appears below.</p>
<ul data-fx="ghost-row-marquee">
  <li data-fx-part="row"><h3 data-fx-part="title">Field One</h3><div data-fx-part="marquee"><div><span>Field One</span><span>Field One</span><span>Field One</span><span>Field One</span></div></div><div data-fx-part="items"><div><span>Item</span><span>Item</span><span>Item</span><span>Item</span><span>Item</span><span>Item</span></div></div></li>
  <li data-fx-part="row"><h3 data-fx-part="title">Field Two</h3><div data-fx-part="marquee"><div><span>Field Two</span><span>Field Two</span><span>Field Two</span><span>Field Two</span></div></div><div data-fx-part="items"><div><span>Item</span><span>Item</span><span>Item</span><span>Item</span></div></div></li>
</ul>
<ul data-demo-remove data-fx="ghost-row-marquee"><li data-fx-part="row"><h3 data-fx-part="title">Line to erase</h3></li></ul>
<template data-demo-late><ul data-fx="ghost-row-marquee" data-fx-ghost-row-marquee="speed: 10"><li data-fx-part="row"><h3 data-fx-part="title">Late row</h3><div data-fx-part="marquee"><div><span>Late row</span><span>Late row</span></div></div></li></ul></template>
<ul data-fx="ghost-row-marquee"></ul>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
