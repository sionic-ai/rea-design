<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pin-pulse — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-spacer { height: 70vh; display: grid; place-items: center; color: var(--kf-dim); }
  .map { position: relative; height: 70vh; margin: 0 20px; border-radius: var(--kf-radius-lg); background: var(--kf-raised); }
  .pin { position: absolute; left: 50%; top: 45%; width: 24px; }
  .pin svg { display: block; width: 100%; height: auto; fill: var(--kf-accent); }
</style>
</head>
<body>
<p class="demo-hint"><b>pin-pulse</b> — Scroll down. When the map panel catches the screen the pin shows and the glow behind it spreads over 3 seconds (the always type repeats).</p>
<div class="demo-spacer">Downward</div>
<section data-fx="pin-pulse" data-fx-pin-pulse="loop: always"><div class="map"><span class="pin" data-fx-part="pin"><svg viewBox="0 0 23 32"><path d="M11.5 31S1 19 1 11.5a10.5 10.5 0 0 1 21 0C22 19 11.5 31 11.5 31z"/></svg></span></div></section>
<div class="demo-spacer">Bottom margin</div>
<script>
// Late arrivals and removals — checks that fx-core attaches to an element added after 1s and detaches from an element removed after 2.5s
(() => {
  const src = document.querySelector('[data-fx~="pin-pulse"]');
  if (!src) return;
  const html = src.outerHTML.replace(/\sid="[^"]*"/g, "");
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => src.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical one comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
