<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>brush-sweep-loader — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 1; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { min-height: 80vh; padding: 80px 40px; }
  .ld svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .ld .a { stroke: var(--kf-accent); }
  .ld .b { stroke: var(--kf-accent-soft); }
  .ld .logo { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  .ld .logo svg { position: static; width: min(420px, 70vw); height: auto; overflow: visible; }
  .ld .logo path { stroke: var(--kf-accent); }
  .ld .logo text { fill: var(--kf-accent); stroke: var(--kf-accent); font: 700 300px/1 var(--kf-font-sans); }
</style>
</head>
<body>
<p class="demo-hint"><b>brush-sweep-loader</b> — Refresh. A brush stroke draws the logo and the letters pop, then two brush strokes exit diagonally and the screen opens.</p>
<main class="demo"><p data-demo-status>First screen behind the curtain</p></main>
<div class="ld" data-fx="brush-sweep-loader" data-fx-brush-sweep-loader="skip: nav" data-demo-loader>
  <svg viewBox="0 0 1500 1093" preserveAspectRatio="xMidYMid slice"><path class="a" data-fx-part="sweep" d="M-200 200 C 400 -100 900 900 1700 600"/><path class="b" data-fx-part="sweep" d="M-200 900 C 500 400 1000 1200 1700 300"/></svg>
  <div class="logo"><svg viewBox="0 0 1000 700"><g data-fx-part="logo">
    <path data-fx-part="ribbon" d="M-200 900 C 100 700 300 500 420 330 C 520 200 600 120 700 60 C 900 -60 1100 100 1300 -200"/>
    <path data-fx-part="draw" d="M380 60 L 480 300 L 560 120 L 640 300 L 740 60"/>
    <text data-fx-part="pop" x="80" y="300">A</text><text data-fx-part="pop" x="780" y="300">B</text>
    <text data-fx-part="pop" x="330" y="650">0</text><text data-fx-part="pop" x="530" y="650">1</text>
  </g></svg></div>
</div>
<template data-demo-late><div data-fx="brush-sweep-loader" data-fx-brush-sweep-loader="min: 0" data-demo-remove style="position:fixed;inset:auto 0 0 auto;width:120px;height:80px"><svg viewBox="0 0 100 100"><path data-fx-part="sweep" style="stroke:var(--kf-accent)" d="M0 50 L100 50"/></svg></div></template>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
document.addEventListener("fx:done", () => (document.querySelector("[data-demo-status]").textContent = "fx:done — curtain lifted"));
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
