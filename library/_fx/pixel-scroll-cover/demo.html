<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pixel-scroll-cover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .sec { position: relative; min-height: 110vh; padding: 80px 24px 40vw; overflow: hidden; }
  .sec h2 { font: 600 48px/1 var(--kf-font-display); }
  .sec.dark { background: var(--kf-contrast-bg); color: var(--kf-contrast-ink); }
  .px { position: absolute; inset: auto 0 0; height: 37.5vw; }
</style>
</head>
<body>
<p class="demo-hint"><b>pixel-scroll-cover</b> — Scroll down. At the tail of a section, cells light up from the bottom row and cover it with the next section’s color. <span style="color:var(--kf-dim)">(After 1s one more section comes in, and one leaves 2.5s later)</span></p>
<section class="sec"><h2>Your light section here</h2><div class="px" data-fx="pixel-scroll-cover" style="color:var(--kf-contrast-bg)"></div></section>
<section class="sec dark"><h2>Your dark section here</h2><div class="px" data-fx="pixel-scroll-cover" data-fx-pixel-scroll-cover="cols: 8; rows: 4" style="color:var(--kf-bg)"></div></section>
<section class="sec" data-demo-remove><h2>Section to Be Removed</h2><div class="px" data-fx="pixel-scroll-cover"></div></section>
<template data-demo-late><section class="sec"><h2>Late section (reveal)</h2><div class="px" data-fx="pixel-scroll-cover" data-fx-pixel-scroll-cover="mode: reveal" style="inset:0 0 auto;color:var(--kf-contrast-bg)"></div></section></template>
<section class="sec"><h2>Footer</h2><div class="px" data-fx="pixel-scroll-cover" data-fx-pixel-scroll-cover="cols: 0; rows: 0"></div></section>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => { document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()); window.ScrollTrigger?.refresh(); }, 2500);
</script>
</body>
</html>
