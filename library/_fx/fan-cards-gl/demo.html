<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fan-cards-gl — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); min-height: 100vh; }
  .demo-hint { position: relative; z-index: 2; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .row { position: relative; z-index: 2; display: flex; gap: 12px; padding: 20px; }
</style>
</head>
<body>
<p class="demo-hint"><b>fan-cards-gl</b> — Press “Add one” to float up cards one by one, and “Collect” to gather them all.</p>
<div class="row"><button type="button" data-more>One more sheet</button><button type="button" data-exit>Collecting</button></div>
<div class="fan" data-fx="fan-cards-gl">
  <figure data-fx-part="item" data-ratio="0.75" data-tone="mid" data-label="Category cover photo · One"></figure>
  <figure data-fx-part="item" data-ratio="0.8" data-label="Category cover photo · two"></figure>
  <figure data-fx-part="item" data-ratio="0.75" data-tone="dark" data-label="Category cover photo · three"></figure>
  <figure data-fx-part="item" data-ratio="0.8" data-label="Category cover photo · four"></figure>
  <figure data-fx-part="item" data-ratio="0.77" data-tone="mid" data-label="Category cover photo · Five"></figure>
</div>
<div data-fx="fan-cards-gl" data-demo-remove><figure data-fx-part="item" data-label="Card to Remove"></figure></div>
<template data-demo-late><div data-fx="fan-cards-gl"><figure data-fx-part="item" data-ratio="1" data-label="Late-arrived card"></figure></div></template>
<div data-fx="fan-cards-gl"></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="three-global.js"></script>
<script src="../../_vendor/three@0.184.0/build/three.cjs"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
let n = 0;
const fan = () => document.querySelector(".fan");
document.querySelector("[data-more]").addEventListener("click", () => fan().dispatchEvent(new CustomEvent("fx:fan", { detail: { reveal: n++ % 5 } })));
document.querySelector("[data-exit]").addEventListener("click", () => fan().dispatchEvent(new CustomEvent("fx:fan", { detail: { exit: true } })));
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
