<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>side-pass-parallax — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .rail { height: 300vh; }
  .stage { position: sticky; top: 44px; height: calc(100vh - 44px); overflow: hidden; }
  .track { display: flex; gap: 120px; align-items: center; height: 100%; padding: 0 60vw; width: max-content; }
  .photo { width: 420px; height: 300px; }
  .photo .wf-img { width: 125%; height: 100%; }
</style>
</head>
<body>
<p class="demo-hint"><b>side-pass-parallax</b> — Scrolling down, the band flows horizontally, the drawing inside the photo trails late and appears when it comes 200px in from the right edge. <span style="color:var(--kf-dim)">(One more photo comes in after 1s, and one drops out after 2.5s)</span></p>
<section class="rail">
  <div class="stage"><div class="track">
    <figure class="photo" data-fx="side-pass-parallax" data-fx-side-pass-parallax="look: fade"><div class="wf-img" data-fx-part="img" data-label="Interior photo · landscape"></div></figure>
    <figure class="photo" data-demo-remove data-fx="side-pass-parallax" data-fx-side-pass-parallax="max: 15; look: fade"><div class="wf-img" data-fx-part="img" data-label="Falls out"></div></figure>
    <figure class="photo" data-fx="side-pass-parallax" data-fx-side-pass-parallax="max: 30"><div class="wf-img" data-fx-part="img" data-label="Push 30%"></div></figure>
    <figure class="photo" data-fx="side-pass-parallax"></figure>
    <template data-demo-late><figure class="photo" data-fx="side-pass-parallax" data-fx-side-pass-parallax="look: fade"><div class="wf-img" data-fx-part="img" data-label="Late-arriving photo"></div></figure></template>
  </div></div>
</section>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Push the band left by the vertical scroll — parts only look at the cell’s screen position, however the band flows
const track = document.querySelector(".track"), rail = document.querySelector(".rail");
const move = () => { const p = Math.min(1, Math.max(0, scrollY / (rail.offsetHeight - innerHeight))); track.style.transform = `translateX(${-p * (track.scrollWidth - innerWidth)}px)`; };
addEventListener("scroll", move, { passive: true }); move();
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
