<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>focus-word-cycle — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  h1 { font: var(--kf-weight-display) clamp(48px, 9vw, 120px)/.9 var(--kf-font-display); margin: 40px 20px; overflow: hidden; }
  h1 em { color: var(--kf-accent); }
</style>
</head>
<body>
<p class="demo-hint"><b>focus-word-cycle</b> — The last word changes to a different type every 1.5s (blur·typewriter·rainbow·select).</p>
<h1>MADE<br><em data-fx="focus-word-cycle" data-fx-focus-word-cycle="hold: 1.5"><span data-fx-part="phrase" class="is-on">to last.</span><span data-fx-part="phrase" data-look="typewriter" data-decoy="to be loud">to be read.</span><span data-fx-part="phrase" data-look="gradient">to be seen</span><span data-fx-part="phrase" data-look="copy">to be copied</span></em></h1>
<h1 data-demo-remove><em data-fx="focus-word-cycle"><span data-fx-part="phrase" class="is-on">To be erased</span><span data-fx-part="phrase">Word</span></em></h1>
<template data-demo-late><h1><em data-fx="focus-word-cycle" data-fx-focus-word-cycle="hold: 2"><span data-fx-part="phrase" class="is-on">Arrived late</span><span data-fx-part="phrase">Title</span></em></h1></template>
<h1><em data-fx="focus-word-cycle"></em></h1>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
