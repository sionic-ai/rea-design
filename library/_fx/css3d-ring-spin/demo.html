<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>css3d-ring-spin — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { display: grid; place-items: center; gap: 10vh; padding: 10vh 20px 40vh; }
  .stage { display: grid; place-items: center; width: min(90vw, 900px); height: 520px; perspective: 1600px; overflow: hidden; }
  .demo button { padding: 8px 14px; border: 1px solid var(--kf-line); border-radius: 999px; background: var(--kf-surface); cursor: pointer; }
</style>
</head>
<body>
<p class="demo-hint"><b>css3d-ring-spin</b> — Just watch. A cylinder wrapped by a curved band of eight photos keeps spinning, seen from a low angle. Stop and restart it with the button. <span style="color:var(--kf-dim)">(One more cylinder comes in after 1s, and one drops out after 2.5s)</span></p>
<section class="demo">
  <div class="stage"><div id="ring" data-fx="css3d-ring-spin" style="--fx-d: 640px">
    <i data-fx-part="photo" data-label="Photo 1"></i><i data-fx-part="photo" data-label="Photo 2"></i><i data-fx-part="photo" data-label="Photo 3"></i><i data-fx-part="photo" data-label="Photo 4"></i>
    <i data-fx-part="photo" data-label="Photo 5"></i><i data-fx-part="photo" data-label="Photo 6"></i><i data-fx-part="photo" data-label="Photo 7"></i><i data-fx-part="photo" data-label="Photo 8"></i>
  </div></div>
  <button type="button" id="toggle">Pause</button>
  <div class="stage" data-demo-remove><div data-fx="css3d-ring-spin" data-fx-css3d-ring-spin="speed: 30; segs: 4; tilt-x: -100; tilt-y: 10" style="--fx-d: 420px">
    <i data-fx-part="photo"></i><i data-fx-part="photo"></i><i data-fx-part="photo"></i><i data-fx-part="photo"></i><i data-fx-part="photo"></i><i data-fx-part="photo"></i>
  </div></div>
  <div class="stage"><div data-fx="css3d-ring-spin" style="--fx-d: 400px"></div></div>
  <template data-demo-late><div class="stage"><div data-fx="css3d-ring-spin" data-fx-css3d-ring-spin="speed: -20" style="--fx-d: 360px"><i data-fx-part="photo"></i><i data-fx-part="photo"></i><i data-fx-part="photo"></i><i data-fx-part="photo"></i><i data-fx-part="photo"></i></div></div></template>
</section>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
let on = true;
document.getElementById("toggle").addEventListener("click", (e) => { on = !on; document.getElementById("ring").dispatchEvent(new CustomEvent(on ? "fx:play" : "fx:pause")); e.target.textContent = on ? "Pause" : "Play"; });
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
