<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cursor-dot-caption — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.6 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 10; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .stage { display: flex; gap: 40px; padding: 60px; min-height: 60vh; align-items: center; justify-content: center; }
  .stage a { width: 220px; aspect-ratio: 1; border-radius: 50%; background: var(--kf-raised); display: grid; place-items: center; color: var(--kf-dim); }
</style>
</head>
<body>
<p class="demo-hint"><b>cursor-dot-caption</b> — Hover over the circle. A dot and a name follow in place of the cursor. <span style="color:var(--kf-dim)">(After 1s one more comes in, and 2.5s later a panel leaves)</span></p>
<section class="stage" data-fx="cursor-dot-caption" id="stage">
  <a href="#" data-fx-part="item" data-label="PRODUCT ONE">Figure 1</a>
  <a href="#" data-fx-part="item" data-label="PRODUCT TWO">Figure 2</a>
  <a href="#" data-fx-part="item">No name</a>
</section>
<section class="stage" data-fx="cursor-dot-caption" data-demo-remove style="--fx-dot: 8px"><a href="#" data-fx-part="item" data-label="Dropped Panel">Dropped Panel</a></section>
<section class="stage" data-fx="cursor-dot-caption"></section>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => { const a = document.createElement("a"); a.href = "#"; a.dataset.fxPart = "item"; a.dataset.label = "LATE ONE"; a.textContent = "Late-arrived Image"; document.getElementById("stage")?.append(a); }, 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
