<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fixed-photo-window — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo-spacer { height: 70vh; display: grid; place-items: center; color: var(--kf-dim); }
  [data-fx-part="media"].wf-img { border: 0; }
  .demo-on { position: absolute; inset: 0; display: grid; place-items: center; z-index: 1; color: var(--kf-contrast-ink); font: 400 24px/1 var(--kf-font-sans); letter-spacing: .3em; }
</style>
</head>
<body>
<p class="demo-hint"><b>fixed-photo-window</b> — Scroll down. The photo stays fixed on screen while the frame passes over it, revealing the photo. <span style="color:var(--kf-dim)">(After 1s one more cell comes in, and one leaves 2.5s later)</span></p>
<div class="demo-spacer">Scroll down</div>
<section data-demo-remove data-fx="fixed-photo-window"><span class="wf-img" data-fx-part="media" data-label="Excluded cell · shop entrance"></span></section>
<div class="demo-spacer">Interstitial text</div>
<section data-fx="fixed-photo-window"><span class="wf-img wf-dark" data-fx-part="media" data-label="Store entrance signboard wall · warm lighting"></span><p class="demo-on">RESERVE</p></section>
<template data-demo-late><div class="demo-spacer">Below Late Cell</div><section data-fx="fixed-photo-window" style="--fx-h: 60vh"><span class="wf-img" data-fx-part="media" data-label="Late Cell · 60vh"></span></section></template>
<div class="demo-spacer">Footer</div>
<script src="../fx-core.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
