<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>nav-to-burger — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .head { position: fixed; top: 52px; left: 0; right: 0; z-index: 50; display: flex; justify-content: space-between; align-items: flex-start; padding: 0 24px; pointer-events: none; }
  .head > * { pointer-events: auto; }
  .logo { font: 600 40px/1 var(--kf-font-display); transition: font-size 0.4s cubic-bezier(0.33, 1, 0.68, 1); }
  .logo.is-fx-small { font-size: 30px; }
  .nav { display: flex; gap: 20px; font-size: 13px; }
  .burger { position: absolute; right: 24px; top: 0; display: flex; align-items: center; gap: 14px; border: 0; background: none; font: inherit; color: inherit; }
  .burger i { display: block; width: 68px; height: 6px; border-top: 1px solid currentColor; border-bottom: 1px solid currentColor; }
  .tag { position: fixed; left: 24px; bottom: 24px; font-size: 17px; }
  .tall { height: 300vh; padding: 200px 20px; color: var(--kf-dim); }
</style>
</head>
<body>
<p class="demo-hint"><b>nav-to-burger</b> — Scroll past 500px and the menu row slides up while the burger floats in. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<header class="head" data-fx="nav-to-burger">
  <a class="logo" data-fx-part="shrink" href="#">LOGO</a>
  <nav class="nav" data-fx-part="nav"><a href="#">Menu 1</a><a href="#">Menu 2</a><a href="#">Menu 3</a></nav>
  <button class="burger" type="button" data-fx-part="toggle">Menu <i></i></button>
  <p class="tag" data-fx-part="fade">Your Hero copy here</p>
</header>
<header class="head" style="top:120px" data-fx="nav-to-burger" data-fx-nav-to-burger="at: 200" data-demo-remove><span></span><nav class="nav" data-fx-part="nav"><a href="#">Changes at 200px</a></nav></header>
<template data-demo-late><header class="head" style="top:160px" data-fx="nav-to-burger" data-fx-nav-to-burger="at: 800"><span></span><nav class="nav" data-fx-part="nav"><a href="#">Late · 800px</a></nav></header></template>
<div class="tall">Scroll down.</div>
<div data-fx="nav-to-burger"></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
