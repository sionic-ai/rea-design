<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>stroke-draw — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { padding: 48px 20px; }
  .demo-btn { display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 16px; border: 1px solid var(--kf-line); border-radius: var(--kf-radius-sm); background: var(--kf-surface); color: var(--kf-ink); cursor: pointer; }
  .demo-card { padding: 20px; border: 1px solid var(--kf-line); border-radius: var(--kf-radius-md); background: var(--kf-surface); }
  .demo-spacer { height: 90vh; display: grid; place-items: center; color: var(--kf-dim); }
  .scrib { width: 520px; height: 260px; stroke: var(--kf-accent); stroke-width: 2.5; fill: none; stroke-linecap: round; }
  .zig { display: flex; gap: 40px; margin-top: 40px; } .zig svg { width: 90px; height: 40px; stroke: var(--kf-accent); stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
</style>
</head>
<body>
<p class="demo-hint"><b>stroke-draw</b> — The hand scribble above draws smoothly in 1.6s, while the zigzag scratch below is drawn stepwise, one stroke at a time.</p>
<section class="demo"><svg class="scrib" data-fx="stroke-draw" viewBox="0 0 520 260"><path d="M60 230C30 150 70 40 180 30s240 10 280 90-40 130-160 120S60 180 120 110"/></svg>
<div class="zig" data-fx="stroke-draw" data-fx-stroke-draw="steps: 7; delay: .4"><svg viewBox="-4 -4 98 48"><path d="M0,0 L15,40 L30,0 L45,40 L60,0 L75,40 L90,0"/></svg><svg viewBox="-4 -4 98 48"><path d="M0,0 L15,40 L30,0 L45,40 L60,0 L75,40 L90,0"/></svg><svg viewBox="-4 -4 98 48"><path d="M0,0 L15,40 L30,0 L45,40 L60,0 L75,40 L90,0"/></svg></div></section>
<script>
// Late arrivals and removals — checks that fx-core attaches to an element added after 1s and detaches from an element removed after 2.5s
(() => {
  const src = document.querySelector('[data-fx~="stroke-draw"]');
  if (!src) return;
  const html = src.outerHTML.replace(/\sid="[^"]*"/g, "");
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => (src.closest(".pin-spacer") || src).after(make("late")), 1000); // Once pinned the panel gets wrapped in a pin-spacer, so place it outside that
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical one comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
