<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fan-focus-cards — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.6 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .row { width: min(986px, 92vw); margin: 80px auto; }
  .card { flex: 0 0 240px; height: 300px; margin-inline: -30px; border-radius: var(--kf-radius-lg); background: var(--kf-surface); box-shadow: var(--kf-shadow-soft); padding: 24px; display: flex; align-items: flex-end; font-weight: 600; }
</style>
</head>
<body>
<p class="demo-hint"><b>fan-focus-cards</b> — Hover over a card. The hovered card stands up and the cards behind it step aside. <span style="color:var(--kf-dim)">(After 1s one more line comes in, and one leaves 2.5s later)</span></p>
<div class="row" data-fx="fan-focus-cards">
  <article class="card" data-fx-part="card" data-tilt="-3.859" tabindex="0">Card 1</article>
  <article class="card" data-fx-part="card" data-tilt="1.891" tabindex="0">Card 2</article>
  <article class="card" data-fx-part="card" data-tilt="-0.207" tabindex="0">Card 3</article>
  <article class="card" data-fx-part="card" data-tilt="2.596" tabindex="0">Card 4</article>
  <article class="card" data-fx-part="card" data-tilt="-3.466" tabindex="0">Card 5</article>
</div>
<div class="row" data-fx="fan-focus-cards" data-demo-remove><article class="card" data-fx-part="card" data-tilt="2">Dropped Line</article></div>
<div data-late-slot></div>
<div class="row" data-fx="fan-focus-cards"></div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/CustomEase.min.js"></script>
<script>gsap.registerPlugin(CustomEase);</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelector("[data-late-slot]").outerHTML = '<div class="row" data-fx="fan-focus-cards" data-fx-fan-focus-cards="push: 20"><article class="card" data-fx-part="card" data-tilt="-2" tabindex="0">Late 1</article><article class="card" data-fx-part="card" data-tilt="2" tabindex="0">Late 2</article><article class="card" data-fx-part="card" data-tilt="-1" tabindex="0">Late 3</article></div>', 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
