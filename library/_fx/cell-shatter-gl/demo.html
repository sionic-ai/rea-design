<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cell-shatter-gl — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .row { display: grid; grid-template-columns: repeat(3, minmax(0, 300px)); gap: 0; margin: 30px 20px; }
  .cell { aspect-ratio: 1; border: 1px solid var(--kf-line); display: grid; place-items: center; }
  .cell h2 { font: 500 160px/1 var(--kf-font-display); margin: 0; }
</style>
</head>
<body>
<p class="demo-hint"><b>cell-shatter-gl</b> — Move the mouse over the text block. The area around the cursor shatters and scatters, and the letters step aside. <span style="color:var(--kf-dim)">(After 1s one more cell comes in, and one leaves 2.5s later)</span></p>
<div class="row">
  <div class="cell" data-fx="cell-shatter-gl" data-demo-remove><h2 data-fx-part="glyph">Go</h2></div>
  <div class="cell" data-fx="cell-shatter-gl"><h2 data-fx-part="glyph">A</h2></div>
  <div class="cell" data-fx="cell-shatter-gl"></div>
  <template data-demo-late><div class="cell" data-fx="cell-shatter-gl" data-fx-cell-shatter-gl="cells: 24; radius: .3"><h2 data-fx-part="glyph">Me</h2></div></template>
</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../_vendor/ogl@1.0.11/ogl.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
