<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>metaball-trail-gl — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { margin: 0; background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { height: 80vh; margin: 20px; border-radius: var(--kf-radius-md); }
  .demo h2 { position: relative; z-index: 1; margin: 0; padding: 40px; font: 400 64px/1 var(--kf-font-display); pointer-events: none; }
</style>
</head>
<body>
<p class="demo-hint"><b>metaball-trail-gl</b> — Move the mouse over the dark panel and a tail of small spheres follows, melting into the big droplet on the right.</p>
<section class="demo" data-fx="metaball-trail-gl"><h2>Your big title here</h2></section>
<script>
(() => {
  const late = document.createElement("section");
  late.setAttribute("data-fx", "metaball-trail-gl");
  late.style.height = "80px";
  setTimeout(() => document.body.append(late), 1000);
  setTimeout(() => late.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s a small panel comes in and leaves after 2.5s (detach).");
})();
</script>
<script src="three-global.js"></script>
<script src="../../_vendor/three@0.174.0/build/three.cjs"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
