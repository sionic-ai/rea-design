<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>crack-split — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { padding: 48px 20px; }
  .demo-btn { display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 16px; border: 1px solid var(--kf-line); border-radius: var(--kf-radius-sm); background: var(--kf-surface); color: var(--kf-ink); cursor: pointer; }
  .demo-card { padding: 20px; border: 1px solid var(--kf-line); border-radius: var(--kf-radius-md); background: var(--kf-surface); }
  .demo-spacer { height: 90vh; display: grid; place-items: center; color: var(--kf-dim); }
  .row { display: flex; gap: 40px; align-items: center; } .big { width: 120px; height: 120px; } .state { font: 13px var(--kf-font-mono); color: var(--kf-dim); }
</style>
</head>
<body>
<p class="demo-hint"><b>crack-split</b> — Hover over the heart and it opens slightly along the crack, press and it splits wide (press again to close).</p>
<section class="demo row"><button data-fx="crack-split" aria-label="Menu"><svg viewBox="0 0 300 238" aria-hidden="true"><path d="M150 236C60 170 4 118 4 66 4 30 32 4 68 4c34 0 62 22 82 52C170 26 198 4 232 4c36 0 64 26 64 62 0 52-56 104-146 170Z"/></svg></button><button class="big" data-fx="crack-split" aria-label="Menu"><svg viewBox="0 0 300 238" aria-hidden="true"><path d="M150 236C60 170 4 118 4 66 4 30 32 4 68 4c34 0 62 22 82 52C170 26 198 4 232 4c36 0 64 26 64 62 0 52-56 104-146 170Z"/></svg></button><p class="state" id="state">fx:toggle is logged here</p></section>
<script>document.addEventListener("fx:toggle", (e) => (document.getElementById("state").textContent = "fx:toggle → on: " + e.detail.on));</script>
<script>
// Late arrivals and removals — checks that fx-core attaches to an element added after 1s and detaches from an element removed after 2.5s
(() => {
  const src = document.querySelector('[data-fx~="crack-split"]');
  if (!src) return;
  const html = src.outerHTML.replace(/\sid="[^"]*"/g, "");
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => (src.closest(".pin-spacer") || src).after(make("late")), 1000); // Once pinned the panel gets wrapped in a pin-spacer, so place it outside that
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical one comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
