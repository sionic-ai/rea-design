<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>shard-burst-loader — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: relative; z-index: 200; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .page { min-height: 80vh; display: grid; place-items: center; font: var(--kf-weight-display) 48px/1 var(--kf-font-display); }
  .logo { fill: currentColor; }
</style>
</head>
<body>
<p class="demo-hint"><b>shard-burst-loader</b> — Refresh the page. Fragments gather over the curtain, tremble, and scatter as the curtain lifts. <span>(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<div class="page">Your Hero here</div>
<div data-fx="shard-burst-loader">
  <svg data-fx-part="logo" viewBox="0 0 100 40"><rect class="logo" x="10" y="10" width="80" height="20" rx="10"/></svg>
  <svg data-fx-part="shards" viewBox="-400 -300 800 600"><polygon points="-210,-120 -150,-150 -170,-100"/><polygon points="160,-140 230,-170 205,-110"/><polygon points="-260,40 -200,10 -220,70"/><polygon points="220,60 290,30 270,95"/><polygon points="-90,-210 -40,-240 -60,-185"/><polygon points="60,180 120,150 100,210"/></svg>
</div>
<div data-demo-remove data-fx="shard-burst-loader" data-fx-shard-burst-loader="delay: 5"><svg data-fx-part="shards" viewBox="-400 -300 800 600"><polygon points="0,0 40,-20 30,20"/></svg></div>
<template data-demo-late><div data-fx="shard-burst-loader" data-fx-shard-burst-loader="speed: 2; keep: off"></div></template>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
