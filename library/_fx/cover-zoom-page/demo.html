<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cover-zoom-page — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { margin: 0; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .mast { display: inline-block; margin: 20px; padding: 14px 22px; border: 1px solid var(--kf-line); font-weight: 700; }
  .shelf { display: flex; flex-wrap: wrap; gap: 60px; padding: 40px 60px; }
  .shelf a { display: block; width: 180px; aspect-ratio: 230 / 280; overflow: hidden; box-shadow: var(--kf-shadow-soft); }
  .shelf svg { display: block; width: 100%; height: 100%; }
  .art-a { fill: var(--kf-accent); }
  .art-b { fill: var(--kf-surface); }
</style>
</head>
<body>
<p class="demo-hint"><b>cover-zoom-page</b> — Click the cover. A color panel covers the screen over the enlarged cover, and 1 second later when this page reopens, the panel shrinks to the masthead spot at top left and lifts away.</p>
<a class="mast" href="demo.html" data-fx="cover-zoom-page" data-fx-cover-zoom-page="look: arrive">Your masthead here</a>
<div class="shelf" id="shelf">
  <a data-fx="cover-zoom-page" href="demo.html?from=1" aria-label="Issue 0001 cover"><svg data-fx-part="art" viewBox="0 0 230 280"><rect class="art-a" width="230" height="280"/><circle class="art-b" cx="150" cy="120" r="60"/></svg></a>
  <a data-fx="cover-zoom-page" href="demo.html?from=2" style="--fx-sheet: var(--kf-ink)" aria-label="Issue 0002 cover"><svg data-fx-part="art" viewBox="0 0 230 280"><rect class="art-b" width="230" height="280"/><rect class="art-a" x="40" y="60" width="120" height="160"/></svg></a>
</div>
<script>
// Late arrivals and removals — one more cover comes in after 1s, and the first cover is dropped after 2.5s (detach)
(() => {
  const shelf = document.getElementById("shelf");
  const first = shelf.firstElementChild;
  setTimeout(() => { const a = document.createElement("a"); a.href = "demo.html?from=3"; a.dataset.fx = "cover-zoom-page"; a.setAttribute("aria-label", "Late-arrived cover"); a.innerHTML = '<svg data-fx-part="art" viewBox="0 0 230 280"><rect class="art-a" width="230" height="280"/></svg>'; shelf.append(a); }, 1000);
  setTimeout(() => first.remove(), 2500);
})();
</script>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
