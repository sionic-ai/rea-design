<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>shape-mask-hover — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); padding: 24px; }
  .demo-hint { margin-bottom: 20px; font: 500 13px/1.4 var(--kf-font-mono); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
  .grid > a { aspect-ratio: 1; border-radius: var(--kf-radius-md); background: var(--kf-accent); }
  .photo { width: 100%; height: 100%; display: grid; place-items: center; background: var(--kf-raised); color: var(--kf-dim); font-size: 22px; }
</style>
</head>
<body>
<p class="demo-hint"><b>shape-mask-hover</b> — Hover over a card — the photo shrinks into a shaped hole and the marquee behind flows. (After 1 second one more card comes in, and after 2.5 seconds one drops out)</p>
<div class="grid">
  <a href="#" data-fx="shape-mask-hover" style="--fx-rest: 3"><div data-fx-part="marquee"><div><span>Room Name</span><span>Room Name</span></div></div><svg viewBox="-3.5 -3.5 407 407" preserveAspectRatio="xMidYMid slice"><mask id="d1" mask-type="alpha" maskUnits="userSpaceOnUse" x="-3.5" y="-3.5" width="407" height="407"><path data-fx-part="shape" d="M0 350 L0 250 A200 200 0 0 1 400 250 L400 350 Z"/></mask><path data-fx-part="shape" data-key="line" d="M0 350 L0 250 A200 200 0 0 1 400 250 L400 350 Z"/><g mask="url(#d1)"><foreignObject data-fx-part="photo" x="-3.5" y="-3.5" width="407" height="407"><div class="photo">Photo</div></foreignObject></g></svg></a>
  <a href="#" data-fx="shape-mask-hover" style="--fx-rest: 2.1"><div data-fx-part="marquee"><div><span>Room Name</span><span>Room Name</span></div></div><svg viewBox="-3.5 -3.5 407 407" preserveAspectRatio="xMidYMid slice"><mask id="d2" mask-type="alpha" maskUnits="userSpaceOnUse" x="-3.5" y="-3.5" width="407" height="407"><path data-fx-part="shape" d="M200 0 L400 200 L200 400 L0 200 Z"/></mask><path data-fx-part="shape" data-key="line" d="M200 0 L400 200 L200 400 L0 200 Z"/><g mask="url(#d2)"><foreignObject data-fx-part="photo" x="-3.5" y="-3.5" width="407" height="407"><div class="photo">Photo</div></foreignObject></g></svg></a>
  <a href="#" data-demo-remove data-fx="shape-mask-hover" style="--fx-rest: 4.6; --fx-hover: 1.2"><svg viewBox="-3.5 -3.5 407 407" preserveAspectRatio="xMidYMid slice"><mask id="d3" mask-type="alpha" maskUnits="userSpaceOnUse" x="-3.5" y="-3.5" width="407" height="407"><path data-fx-part="shape" d="M50 65 L150 65 L150 155 L250 155 L250 245 L350 245 L350 335 L50 335 Z"/></mask><g mask="url(#d3)"><foreignObject data-fx-part="photo" x="-3.5" y="-3.5" width="407" height="407"><div class="photo">No marquee</div></foreignObject></g></svg></a>
  <template data-demo-late><a href="#" data-fx="shape-mask-hover" style="--fx-rest: 3.4"><svg viewBox="-3.5 -3.5 407 407" preserveAspectRatio="xMidYMid slice"><mask id="d4" mask-type="alpha" maskUnits="userSpaceOnUse" x="-3.5" y="-3.5" width="407" height="407"><path data-fx-part="shape" d="M200 50 L400 350 L0 350 Z"/></mask><path data-fx-part="shape" data-key="line" d="M200 50 L400 350 L0 350 Z"/><g mask="url(#d4)"><foreignObject data-fx-part="photo" x="-3.5" y="-3.5" width="407" height="407"><div class="photo">Late-arriving card</div></foreignObject></g></svg></a></template>
  <a href="#" data-fx="shape-mask-hover"></a>
</div>
<script src="../fx-core.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
