<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ime-convert-type — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { position: sticky; top: 0; z-index: 100; margin: 0; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo { padding: 48px 20px; display: grid; gap: 28px; justify-items: start; }
  .title { font: var(--kf-weight-display) 44px/1.1 var(--kf-font-display); letter-spacing: -0.04em; display: grid; gap: 6px; }
  .title span { background: var(--kf-accent); color: var(--kf-on-accent); padding: 4px 6px; }
  .menu { display: flex; gap: 8px; }
  .menu span { border: 1px solid var(--kf-line); border-radius: var(--kf-radius-pill); padding: 8px 14px; font-size: 14px; }
  .demo-btn { height: 40px; padding: 0 16px; border: 1px solid var(--kf-line); border-radius: var(--kf-radius-sm); background: var(--kf-surface); color: var(--kf-ink); cursor: pointer; }
</style>
</head>
<body>
<p class="demo-hint"><b>ime-convert-type</b> Title and menu appear as if typed with an IME and flash into conversion at the end of each word. Press the button to type again.</p>
<section class="demo">
  <h2 class="title" data-fx="ime-convert-type" data-fx-ime-convert-type="on: load; mode: serial; char: 25; convert: 18"><span data-fx-part="line">Your bold heading here</span><span data-fx-part="line">A spot for two lines.</span></h2>
  <nav class="menu" data-fx="ime-convert-type" data-fx-ime-convert-type="on: load; stagger: 55; delay: 140"><span data-fx-part="line">Menu First</span><span data-fx-part="line">Speaker</span><span data-fx-part="line">Timetable</span><span data-fx-part="line" data-text="FAQ|F-A-Q">FAQ</span></nav>
  <p class="line" data-fx="ime-convert-type" data-fx-ime-convert-type="on: load; char: 30" data-text="会議の|かいぎの 前に|まえに">会議の前に</p>
  <button class="demo-btn" type="button" onclick="document.querySelectorAll('[data-fx~=ime-convert-type]').forEach((b) => b.dispatchEvent(new Event('fx:play')))">Retype</button>
</section>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script>
// Late arrivals and removals — checks that fx-core attaches to an element added after 1s and detaches from an element removed after 2.5s
(() => {
  const src = document.querySelector(".line");
  const html = src.outerHTML;
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => src.after(make("late")), 1000);
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1 second one more line comes in (a late arrival), and after 2.5 seconds one drops out (detach).");
})();
</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
