<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>underline-draw-through — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  nav { display: flex; gap: 32px; padding: 40px 24px; font-size: 16px; }
</style>
</head>
<body>
<p class="demo-hint"><b>underline-draw-through</b> — Hover over the menu and move away right away. The underline is drawn all the way across and then retracts to the right</p>
<nav id="menu">
  <a href="#" data-fx="underline-draw-through">Menu 1</a>
  <a href="#" data-fx="underline-draw-through">Menu 2</a>
  <a href="#" data-fx="underline-draw-through" data-fx-underline-draw-through="hold: .6" style="--fx-weight: 2px">Quick-grab menu</a>
  <a href="#" data-demo-remove data-fx="underline-draw-through">Exit menu</a>
  <span data-fx="underline-draw-through"></span>
</nav>
<template data-demo-late><a href="#" data-fx="underline-draw-through">Late-arriving menu</a></template>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
// Checks that late-arriving elements are picked up and removed ones are detached — adds [data-demo-late] after 1 second and removes [data-demo-remove] after 2.5 seconds.
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => document.getElementById("menu").append(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
