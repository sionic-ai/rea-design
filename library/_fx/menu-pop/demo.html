<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>menu-pop — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .demo-hint b { font-weight: 700; }
  .demo { padding: 48px 20px; }
  .demo-btn { display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 16px; border: 1px solid var(--kf-line); border-radius: var(--kf-radius-sm); background: var(--kf-surface); color: var(--kf-ink); cursor: pointer; }
  .demo-card { padding: 20px; border: 1px solid var(--kf-line); border-radius: var(--kf-radius-md); background: var(--kf-surface); }
  .demo-spacer { height: 90vh; display: grid; place-items: center; color: var(--kf-dim); }
  .bar { display: flex; justify-content: space-between; gap: 4px; padding: 8px; border-bottom: 1px solid var(--kf-line); }
  .bar [data-fx-part="trigger"] { height: 36px; padding: 0 16px; border: 0; border-radius: var(--kf-radius-sm); background: none; color: var(--kf-ink); cursor: pointer; }
  [data-fx-part="pop"] button { display: flex; align-items: center; justify-content: space-between; gap: 16px; width: 100%; min-height: 40px; padding: 4px 16px; border: 0; background: none; color: inherit; cursor: pointer; white-space: nowrap; text-align: left; }
  .key { color: var(--kf-dim); font: 12px var(--kf-font-mono); }
</style>
</head>
<body>
<p class="demo-hint"><b>menu-pop</b> — Press a bar button to open a menu. Hover the ”Mountain size” row under ”Tools” to open the submenu. Click outside or press Esc to close.</p>
<section class="demo"><nav class="bar"><div style="display:flex;gap:4px">
<div data-fx="menu-pop"><button data-fx-part="trigger" data-fx="dim-hover">File</button><div data-fx-part="pop"><button data-fx="tint-hover">New map <span class="key">ctrl-n</span></button><button data-fx="tint-hover">Export <span class="key">ctrl-p</span></button></div></div>
<div data-fx="menu-pop"><button data-fx-part="trigger" data-fx="dim-hover">Editing</button><div data-fx-part="pop"><button data-fx="tint-hover">Undo</button><button data-fx="tint-hover">Do again</button><button data-fx="tint-hover">Clear all</button></div></div>
<div data-fx="menu-pop"><button data-fx-part="trigger" data-fx="dim-hover">Tool</button><div data-fx-part="pop"><button data-fx="tint-hover">Choice</button><button data-fx="tint-hover">Ground</button>
<div data-fx-part="sub"><button data-fx="tint-hover">Size Bought ▸</button><div data-fx-part="pop"><button data-fx="tint-hover">Small</button><button data-fx="tint-hover">Regular</button><button data-fx="tint-hover">Large</button></div></div></div></div>
</div><div data-fx="menu-pop"><button data-fx-part="trigger" data-fx="dim-hover">Menu attached at the end</button><div data-fx-part="pop"><button data-fx="tint-hover">Pushed in 12px from the screen edge to open</button></div></div></nav>
<div class="demo-spacer">Blank Paper</div></section>
<link rel="stylesheet" href="../dim-hover/fx.css"><link rel="stylesheet" href="../tint-hover/fx.css">
<script>
// Late arrivals and removals — checks that fx-core attaches to an element added after 1s and detaches from an element removed after 2.5s
(() => {
  const src = document.querySelector('[data-fx~="menu-pop"]');
  if (!src) return;
  const html = src.outerHTML.replace(/\sid="[^"]*"/g, "");
  const make = (tag) => { const t = document.createElement("template"); t.innerHTML = html; const el = t.content.firstElementChild; el.dataset.demo = tag; return el; };
  const gone = make("gone");
  src.after(gone);
  setTimeout(() => (src.closest(".pin-spacer") || src).after(make("late")), 1000); // Once pinned the panel gets wrapped in a pin-spacer, so place it outside that
  setTimeout(() => gone.remove(), 2500);
  document.querySelector(".demo-hint").append(" · After 1s another identical one comes in (the late arrival), and after 2.5s one drops out (the detach).");
})();
</script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
</body>
</html>
