<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hover-side-photos — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 16px/1.5 var(--kf-font-sans); margin: 0; }
  .demo-hint { padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .list { display: flex; flex-direction: column; align-items: center; padding: 80px 20px; }
  .list a { font: 300 clamp(32px, 5vw, 64px)/1.15 var(--kf-font-display); color: inherit; text-decoration: none; }
  .list a:hover { color: var(--kf-accent); }
  .list img { background: var(--kf-raised); }
  .list a span { position: relative; z-index: 1; }
</style>
</head>
<body>
<p class="demo-hint"><b>hover-side-photos</b> Hover over a list row. Two photos tilt and float up from both sides. (One more row enters after 1s and one leaves after 2.5s)</p>
<div class="list" data-demo-list>
  <a href="#" data-fx="hover-side-photos"><span>Your list name one here</span><img data-fx-part="left" alt=""><img data-fx-part="right" alt=""></a>
  <a href="#" data-fx="hover-side-photos" data-demo-remove><span>Your list name two here</span><img data-fx-part="left" alt=""><img data-fx-part="right" alt=""></a>
  <a href="#" data-fx="hover-side-photos" style="--fx-left-w: 25vmin; --fx-right-w: 20vmin"><span>Your list name three here</span><img data-fx-part="left" alt=""><img data-fx-part="right" alt=""></a>
  <a href="#" data-fx="hover-side-photos"><span>Row without photo</span></a>
</div>
<script src="../../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => {
  const a = document.createElement("a");
  a.href = "#"; a.dataset.fx = "hover-side-photos";
  a.innerHTML = '<span>Late-arriving line</span><img data-fx-part="left" alt=""><img data-fx-part="right" alt="">';
  document.querySelector("[data-demo-list]").append(a);
}, 1000);
setTimeout(() => document.querySelector("[data-demo-remove]")?.remove(), 2500);
</script>
</body>
</html>
