<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>step-pop-dots — Motion part</title>
<link rel="stylesheet" href="../../../_shared/wire.css">
<link rel="stylesheet" href="../../../_shared/kf-defaults.css">
<link rel="stylesheet" href="fx.css">
<style>
  body { background: var(--kf-bg); color: var(--kf-ink); font: 400 15px/1.5 var(--kf-font-sans); }
  .demo-hint { position: sticky; top: 0; z-index: 100; padding: 12px 20px; background: var(--kf-surface); border-bottom: 1px solid var(--kf-line); font: 500 13px/1.4 var(--kf-font-mono); }
  .row { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 30px; padding: 50px 40px; }
  .stage { position: relative; aspect-ratio: 4 / 3; border-radius: var(--kf-radius-md); overflow: hidden; }
  .stage .wf-img { position: absolute; inset: 0; border: 0; }
  .stage i { position: absolute; width: 7%; aspect-ratio: 1; border-radius: 50% 50% 46% 54% / 55% 48% 52% 45%; background: var(--kf-accent); }
  .stage i:nth-child(odd) { background: var(--kf-ink); }
  .row button { margin-block-start: 10px; padding: 8px 16px; border: 1px solid var(--kf-line); border-radius: var(--kf-radius-pill); background: var(--kf-surface); color: var(--kf-ink); font: 500 13px/1 var(--kf-font-sans); cursor: pointer; }
</style>
</head>
<body>
<p class="demo-hint"><b>step-pop-dots</b> — Wait and the dots on the photo pop in one by one, then shrink in four steps and vanish (again every 5 seconds). The second plate only on button press. <span style="color:var(--kf-dim)">(After 1s one more comes in, and after 2.5s one drops out)</span></p>
<div class="row">
  <div class="stage" data-fx="step-pop-dots" data-fx-step-pop-dots="every: 5"><div class="wf-img" data-label="Hero product photo · landscape 4:3"></div><i data-fx-part="dot" style="top:15%;left:80%"></i><i data-fx-part="dot" style="top:70%;left:72%"></i><i data-fx-part="dot" style="top:8%;left:30%"></i><i data-fx-part="dot" style="top:37%;left:4%"></i><i data-fx-part="dot" style="top:57%;left:12%"></i></div>
  <div><div class="stage" id="ev" data-fx="step-pop-dots" data-fx-step-pop-dots="on: event; delay: 0"><div class="wf-img" data-label="Bursts when pressed"></div><i data-fx-part="dot" style="top:20%;left:60%"></i><i data-fx-part="dot" style="top:55%;left:25%"></i><i data-fx-part="dot" style="top:30%;left:85%"></i></div><button type="button" onclick="document.getElementById('ev').dispatchEvent(new Event('fx:play'))">send fx:play</button></div>
  <div class="stage" data-demo-remove data-fx="step-pop-dots" data-fx-step-pop-dots="every: 3"><div class="wf-img" data-label="Dropped Panel"></div><i data-fx-part="dot" style="top:40%;left:40%"></i></div>
  <template data-demo-late><div class="stage" data-fx="step-pop-dots" data-fx-step-pop-dots="every: 4"><div class="wf-img" data-label="Late panel"></div><i data-fx-part="dot" style="top:30%;left:50%"></i><i data-fx-part="dot" style="top:60%;left:70%"></i></div></template>
</div>
<script src="../fx-core.js"></script>
<script src="fx.js"></script>
<script>
setTimeout(() => document.querySelectorAll("template[data-demo-late]").forEach((t) => t.replaceWith(t.content.cloneNode(true))), 1000);
setTimeout(() => document.querySelectorAll("[data-demo-remove]").forEach((n) => n.remove()), 2500);
</script>
</body>
</html>
