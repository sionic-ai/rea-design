<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Work list · endless vertical name list where the center photo grows</title>
<link rel="stylesheet" href="../../_shared/wire.css">
<link rel="stylesheet" href="../../_shared/kf-defaults.css">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="../_fx/arc-mask-loader/fx.css">
<link rel="stylesheet" href="works.css">
</head>
<body data-page="works">

<main class="ax-works" data-slot="work-reel" aria-label="Work list — scroll with the wheel">
  <div class="ax-works__thumbs" aria-hidden="true"></div>
  <div class="ax-works__photo" aria-hidden="true" data-cursor-label="View work"></div>
  <ol class="ax-works__rows"></ol>
</main>

<div class="ax-loader" data-slot="loader" data-fx="arc-mask-loader" data-fx-arc-mask-loader="page: main; hold: 1.5">
  <div data-fx-part="mask"></div>
  <div data-fx-part="lines"><span data-fx-part="clip"><b data-fx-part="title" data-label="Studio English name, about 4 letters">Nova</b></span><span data-fx-part="clip"><i data-fx-part="word">Practice</i></span></div>
  <span data-fx-part="count">000</span>
</div>

<script src="../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../_fx/fx-core.js"></script>
<script src="../_fx/arc-mask-loader/fx.js"></script>
<script src="../_fx/text-scramble/fx.js"></script>
<script src="shared.js"></script>
<script src="works.js"></script>
<script src="../../_shared/wire.js"></script>
</body>
</html>
