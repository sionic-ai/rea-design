<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home · flowing photo strip and giant wordmark</title>
<link rel="stylesheet" href="../../_shared/wire.css">
<link rel="stylesheet" href="../../_shared/kf-defaults.css">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="../_fx/arc-mask-loader/fx.css">
<link rel="stylesheet" href="index.css">
</head>
<body data-page="home">

<main class="ax-home">
  <section class="ax-rail" data-slot="card-rail" aria-label="Work strip — advance with wheel or drag">
    <div class="ax-rail__track"></div>
  </section>
  <section class="ax-hero" data-slot="wordmark" data-rise>
    <h1 class="ax-hero__word ax-display" data-label="Studio English name, about 4 letters"><span class="ax-rise"><span>Nova</span></span></h1>
    <div class="ax-hero__about">
      <p class="ax-label" data-fx="text-scramble" data-fx-text-scramble="on: manual; duration: .8; chars: ABCDEFGHIJKLMNOPQRSTUVWXYZ">Nova Studio©</p>
      <p class="ax-hero__text"><span class="ax-rise"><span>Your Studio intro here.</span></span><span class="ax-rise"><span>With brands that dream big</span></span><span class="ax-rise"><span>Distinctive through design, technology and experiments</span></span><span class="ax-rise"><span>Four lines about creating experiences.</span></span></p>
    </div>
  </section>
</main>

<div class="ax-loader" data-slot="loader" data-fx="arc-mask-loader" data-fx-arc-mask-loader="page: main; hold: 2.3">
  <div data-fx-part="mask"></div>
  <div data-fx-part="lines"><span data-fx-part="clip"><b data-fx-part="title" data-label="Studio English name, about 4 letters">Nova</b></span><span data-fx-part="clip"><i data-fx-part="word">Practice</i></span></div>
  <span data-fx-part="count">000</span>
</div>

<script src="../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../_fx/fx-core.js"></script>
<script src="../_fx/arc-mask-loader/fx.js"></script>
<script src="../_fx/text-scramble/fx.js"></script>
<script src="shared.js"></script>
<script src="index.js"></script>
<script src="../../_shared/wire.js"></script>
</body>
</html>
