<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>News list · lodging intro on a hero that splits left and right and rotates</title>
<link rel="stylesheet" href="../../_shared/wire.css">
<link rel="stylesheet" href="../../_shared/kf-defaults.css">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="news.css">
</head>
<body data-page="news">

<header data-slot="header"></header>
<div data-slot="mobile-menu"></div>

<div id="fg-smooth-wrapper">
<div id="fg-smooth-content">
<main class="fg-main">

  <section class="fg-news-under" data-slot="news-list">
    <div class="fg-container">
      <h2 class="fg-section-title fg-split-title" data-label="Section name (English)">NEWS</h2>
      <div class="fg-news-under__inner">
        <nav class="fg-breadcrumb" aria-label="Current location">
          <ol>
            <li><a href="index.html">HOME</a></li>
            <li aria-current="page">NEWS</li>
          </ol>
        </nav>
        <div class="fg-news-under__body">
          <ul class="fg-news-list" data-inview="classBatch">
            <li class="fg-news-list__item" data-inview-batch-item><a href="news.html" class="fg-news-list__link"><time class="fg-news-list__time">0000.00.00</time><span class="fg-news-list__title">Your news title in one line goes here</span></a></li>
            <li class="fg-news-list__item" data-inview-batch-item><a href="news.html" class="fg-news-list__link"><time class="fg-news-list__time">0000.00.00</time><span class="fg-news-list__title">Your one-line news title here — a slightly longer title</span></a></li>
            <li class="fg-news-list__item" data-inview-batch-item><a href="news.html" class="fg-news-list__link"><time class="fg-news-list__time">0000.00.00</time><span class="fg-news-list__title">Put your News title here</span></a></li>
            <li class="fg-news-list__item" data-inview-batch-item><a href="news.html" class="fg-news-list__link"><time class="fg-news-list__time">0000.00.00</time><span class="fg-news-list__title">Your one-line seasonal news title here</span></a></li>
            <li class="fg-news-list__item" data-inview-batch-item><a href="news.html" class="fg-news-list__link"><time class="fg-news-list__time">0000.00.00</time><span class="fg-news-list__title">Put your News title here</span></a></li>
          </ul>
        </div>
      </div>
    </div>
  </section>

</main>
<footer data-slot="footer"></footer>
</div>
</div>

<script src="../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../../_shared/vendor/gsap/ScrollSmoother.min.js"></script>
<script src="../../_shared/vendor/gsap/SplitText.min.js"></script>
<script src="shared.js"></script>
<script src="../../_shared/wire.js"></script>
</body>
</html>
