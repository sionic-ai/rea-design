<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Event list · filter box and card grid</title>
<link rel="stylesheet" href="../../_shared/wire.css">
<link rel="stylesheet" href="../../_shared/kf-defaults.css">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="../_vendor/choices.js@11.1.0/choices.min.css">
<link rel="stylesheet" href="event.css">
</head>
<body data-page="event" id="top">

<header data-slot="header"></header>

<main data-zig>
  <section class="pgh wrap" data-slot="page-header">
    <hgroup class="pgh__title"><h1 class="pgh__en">Event</h1><p class="pgh__ja">Event</p></hgroup>
  </section>

  <section class="evl wrap" data-slot="event-filter">
    <h2 class="sub"><span class="sub__en">List of Events</span><span class="sub__ja">Event list</span></h2>
    <form class="filter panel" onsubmit="return false">
      <div class="filter__row">
        <label><span>Filter by year held</span><span class="sel"><b>Event Year</b><select><option>Entire</option><option>0000</option></select></span></label>
        <label><span>Filter by place</span><span class="sel"><b>Place</b><select><option>Entire</option><option>Campus 2F</option></select></span></label>
        <label><span>Filter by organizer</span><span class="sel"><b>Host</b><select><option>Entire</option><option>Your department name here</option></select></span></label>
      </div>
      <label class="filter__kw"><span>Search by keyword</span><span class="kw"><input type="search" placeholder="e.g. Open Campus"><button class="btn-black" type="submit">Search</button></span></label>
    </form>
  </section>

  <section class="evl wrap" data-slot="event-grid">
    <h3 class="evl__count">All events <small>102 cases</small></h3>
    <div class="grid" data-grid></div>
    <nav class="pager" aria-label="Page turn"><span class="ring-off" aria-hidden="true">‹</span><a aria-current="page">1</a><a href="#">2</a><a href="#">3</a><span class="dots">····</span><a href="#">10</a><a href="#" aria-label="Next page" data-ring></a></nav>
  </section>
</main>

<footer data-slot="footer"></footer>

<script src="../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../_vendor/lenis@1.3.15/lenis.min.js"></script>
<script src="../_vendor/choices.js@11.1.0/choices.min.js"></script>
<script src="shared.js"></script>
<script src="event.js"></script>
<script src="../../_shared/wire.js"></script>
</body>
</html>
