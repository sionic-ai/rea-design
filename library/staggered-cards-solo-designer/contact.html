<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact · request form on a black panel</title>
<link rel="stylesheet" href="../../_shared/wire.css">
<link rel="stylesheet" href="../../_shared/kf-defaults.css">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="contact.css">
</head>
<body data-page="contact" class="xc-page">
<header class="xa-head" data-slot="header">
  <div class="xa-head__in">
    <a class="xa-id" href="index.html" data-label="Two-line identity — italic serif eyebrow + name"><span class="xa-id__top">An independent studio by</span><span class="xa-id__name">Person Full Name ©</span></a>
    <a class="xa-head__link xc-back" href="index.html">&lt;- Back to first page</a>
  </div>
</header>
<main class="xc" data-slot="inquiry-form">
  <form class="xc-form" onsubmit="return false">
    <h1 class="xc-title xa-serif">You should say <em>hello</em> :)</h1>
    <p class="xc-mail">Your line saying you can write by email right away – <a class="xa-link" href="#">name[at]studio.name</a> Or <a class="xa-link" href="#">Scheduling a Call</a></p>
    <label class="xc-field"><span>Name</span><input type="text" placeholder="Your name here"></label>
    <label class="xc-field"><span>Mail</span><input type="email" placeholder="your-email@domain.com"></label>
    <label class="xc-field"><span>Budget</span><span class="xc-select"><select><option>Select…</option><option>Under 0 won</option><option>00 → 00</option><option>00 → 000</option><option>Over 000</option></select></span></label>
    <fieldset class="xc-checks"><legend>Needed tasks (select multiple)</legend>
      <label><input type="checkbox"><span>Fork 1</span></label><label><input type="checkbox"><span>Fork 2</span></label><label><input type="checkbox"><span>Fork 3</span></label><label><input type="checkbox"><span>Branch 4 / Details</span></label><label><input type="checkbox"><span>Other Things</span></label>
    </fieldset>
    <label class="xc-field"><span>Work story</span><small>Two lines asking for a short description of the scope of work. Note that schedule, industry, funding stage and anything else helpful is welcome.</small><textarea rows="6" placeholder="Write freely here —"></textarea></label>
    <button class="xc-submit" type="submit">Send</button>
  </form>
</main>
<script src="../../_shared/wire.js"></script>
</body>
</html>
