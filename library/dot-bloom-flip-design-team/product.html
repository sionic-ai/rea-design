<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your tool name · your one-line intro here</title>
  <link rel="stylesheet" href="../../_shared/wire.css">
  <link rel="stylesheet" href="../../_shared/kf-defaults.css">
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="shared.css">
  <link rel="stylesheet" href="product.css">
</head>
<body class="sd-studio-page">
<main class="sd-studio" inert data-slot="studio">
  <aside class="sd-side" data-slot="control-panel">
    <div class="sd-side__settings">
      <section class="sd-side__display">
        <div class="sd-switch" role="group" aria-label="Choose view"><button type="button" class="selected" aria-pressed="true" data-panel-to="render">Option 1</button><button type="button" aria-pressed="false" data-panel-to="live">Option 2</button></div>
        <div class="sd-panels">
          <div data-panel="render">
            <div class="sd-upload-card"><label class="sd-upload"><input type="file" accept="image/png,image/jpeg,image/webp" data-target="inner"><span class="sd-upload__icon" aria-hidden="true"><svg viewBox="0 0 18 18"><path d="M9 3.25v11.5M3.25 9h11.5" class="sd-stroke"/></svg></span><span><strong>Inner screen</strong><small data-name="inner">Add image</small></span></label></div>
            <div class="sd-upload-card"><label class="sd-upload"><input type="file" accept="image/png,image/jpeg,image/webp" data-target="folded"><span class="sd-upload__icon" aria-hidden="true"><svg viewBox="0 0 18 18"><path d="M9 3.25v11.5M3.25 9h11.5" class="sd-stroke"/></svg></span><span><strong>Inside, When Folded</strong><small data-name="folded">Optional · Only when collapsed</small></span></label></div>
            <div class="sd-upload-card"><label class="sd-upload"><input type="file" accept="image/png,image/jpeg,image/webp" data-target="cover"><span class="sd-upload__icon" aria-hidden="true"><svg viewBox="0 0 18 18"><path d="M9 3.25v11.5M3.25 9h11.5" class="sd-stroke"/></svg></span><span><strong>Outer Screen</strong><small data-name="cover">Add image</small></span></label></div>
          </div>
          <div data-panel="live" hidden>
            <form class="sd-link-form"><label for="sd-link-1">Inner screen</label><input id="sd-link-1" type="url" placeholder="Your link goes here" autocomplete="off"><div class="sd-link-actions"><button type="submit">Show</button></div></form>
            <form class="sd-link-form"><label for="sd-link-2">Outer Screen</label><input id="sd-link-2" type="url" placeholder="Your link goes here" autocomplete="off"><div class="sd-link-actions"><button type="submit">Show</button></div></form>
            <div class="sd-switch sd-switch--small" role="group" aria-label="Hand control"><button type="button" class="selected" aria-pressed="true">Rotate</button><button type="button" aria-pressed="false">Press</button></div>
            <button type="button" class="sd-text-btn">Reload</button>
          </div>
        </div>
      </section>
      <section aria-label="Device" data-slot="device-controls">
        <div data-mode="render"><div class="sd-field"><label for="sd-angle">Fold Angle</label><output id="sd-angle-out" for="sd-angle">0°</output></div>
        <input id="sd-angle" type="range" min="0" max="180" step="1" value="0"></div>
        <div class="sd-finish"><div class="sd-finish__cap"><span>Deadline</span><span class="sd-muted" id="sd-finish-name">Closing 1</span></div>
          <div class="sd-swatches"><button type="button" class="sd-swatch selected" data-finish="night" aria-label="Closing 1" aria-pressed="true"></button><button type="button" class="sd-swatch" data-finish="white" aria-label="Closing 2" aria-pressed="false"></button></div></div>
        <label class="sd-toggle-row"><span>Auto Rotate</span><input id="sd-rotate" type="checkbox"><span class="sd-toggle"></span></label>
        <label class="sd-toggle-row"><span>Camera Hole</span><input id="sd-cutouts" type="checkbox" checked><span class="sd-toggle"></span></label>
      </section>
      <section class="sd-scene-sec" aria-labelledby="sd-scene-title" data-slot="scene-controls">
        <h2 id="sd-scene-title">Scene</h2>
        <div class="sd-scene-choices"><button type="button" data-bg="light" class="sd-scene-choice selected" aria-pressed="true"><i></i>Scene 1</button><button type="button" data-bg="dark" class="sd-scene-choice" aria-pressed="false"><i></i>Scene 2</button><button type="button" data-bg="peach" class="sd-scene-choice" aria-pressed="false"><i></i>Scene 3</button></div>
        <div class="sd-field sd-field--light"><label for="sd-light">Lighting</label><output id="sd-light-out" for="sd-light">100%</output></div>
        <input id="sd-light" type="range" min="40" max="180" value="100">
      </section>
    </div>
    <section class="sd-export" aria-label="Export" data-slot="export" data-mode="render">
      <div class="sd-field"><label for="sd-res">Resolution</label><span class="sd-select"><select id="sd-res"><option value="2048">2048 px</option><option value="4096">4096 px</option></select></span></div>
      <label class="sd-toggle-row"><span>Transparent Background</span><input id="sd-transparent" type="checkbox"><span class="sd-toggle"></span></label>
      <button type="button" id="sd-export" class="sd-export-btn"><span>Export PNG</span><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2.5v8M4.5 7 8 10.5 11.5 7M3 13.5h10" class="sd-stroke"/></svg></button>
    </section>
  </aside>
  <section class="sd-view" id="sd-view" aria-label="Rotatable foldable phone 3D" data-slot="device-stage">
    <div class="sd-view__head"><button type="button" id="sd-reset" class="sd-reset"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8a5 5 0 1 0 1.6-3.7M3 2.5v2.8h2.8" class="sd-stroke"/></svg><span>Back to First View</span></button></div>
    <div id="sd-canvas-wrap"></div>
    <div class="sd-presets" role="group" aria-label="Device posture" data-slot="pose-presets" data-mode="render">
      <button type="button" data-pose="closed" aria-label="Shut" aria-pressed="true" class="active"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="4" width="8" height="16" rx="2" class="sd-stroke"/></svg></button>
      <button type="button" data-pose="book" aria-label="Book shape" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6 5 4v14l7 2 7-2V4z M12 6v14" class="sd-stroke"/></svg></button>
      <button type="button" data-pose="open" aria-label="In full bloom" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="2" class="sd-stroke"/><path d="M12 6v12" class="sd-stroke"/></svg></button>
    </div>
    <a class="sd-design-link" href="index.html" aria-label="To the Hero"><span class="sd-logo"><svg viewBox="0 0 28 30" aria-hidden="true"><path class="sd-logo-bag" d="M4 9h20l-1.6 19H5.6z"/><path class="sd-logo-strap" d="M9.5 10c0-5 2-7.6 4.5-7.6S18.5 5 18.5 10"/></svg><b>logo</b></span></a>
    <div class="sd-loading" id="sd-loading"><span class="sr-only">Loading 3D device</span></div>
  </section>
</main>
<div id="sd-toast" role="status" aria-live="polite"></div>

<script src="../../_shared/vendor/gsap/gsap.min.js"></script>
<script>window.exports = {};</script>
<script src="../_vendor/three@0.182.0/build/three.cjs"></script>
<script>window.THREE = window.exports; delete window.exports;</script>
<script src="../_vendor/three-addons@0.182.0/OrbitControls.js"></script>
<script src="product.js"></script>
<script src="../../_shared/wire.js"></script>
</body>
</html>
