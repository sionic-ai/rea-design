<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Project — Your company name here</title>
  <link rel="stylesheet" href="../../_shared/wire.css">
  <link rel="stylesheet" href="../../_shared/kf-defaults.css">
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="../_vendor/lenis@1.3.25/lenis.css">
  <link rel="stylesheet" href="../_vendor/swiper@11.2.10/swiper-bundle.min.css">
  <link rel="stylesheet" href="shared.css">
  <link rel="stylesheet" href="works.css">
</head>
<body data-page="works">
  <div id="smooth-content">
    <main>
      <section class="tw-pagehead is-center tw-works__head" data-slot="page-head">
        <div class="tw-wrap"><h1 class="tw-h3 tw-split" data-label="Your English title for the project collection here">Selected Projects</h1></div>
      </section>

      <div class="tw-filter" data-slot="filter-bar">
        <div class="tw-wrap tw-filter__in">
          <div class="tw-filter__group">
            <span class="tw-filter__label">Filter:</span>
            <div class="tw-drop"><button class="tw-drop__btn" type="button" aria-expanded="false">Field <span aria-hidden="true">&darr;</span></button>
              <ul class="tw-drop__list"><li><button type="button">Everyone</button></li><li><button type="button">Field 1</button></li><li><button type="button">Field 2</button></li><li><button type="button">Field 3</button></li><li><button type="button">Field 4</button></li><li><button type="button">Field 5</button></li><li><button type="button">Field 6</button></li><li><button type="button">Field 7</button></li><li><button type="button">Field 8</button></li><li><button type="button">Field 9</button></li><li><button type="button">Field 10</button></li><li><button type="button">Field 11</button></li></ul></div>
            <div class="tw-drop"><button class="tw-drop__btn" type="button" aria-expanded="false">Team <span aria-hidden="true">&darr;</span></button>
              <ul class="tw-drop__list"><li><button type="button">Everyone</button></li><li><button type="button">Team 1</button></li><li><button type="button">Team 2</button></li><li><button type="button">Team 3</button></li><li><button type="button">Team 4</button></li><li><button type="button">Team 5</button></li><li><button type="button">Team 6</button></li><li><button type="button">Team 7</button></li></ul></div>
          </div>
          <div class="tw-filter__view" role="group" aria-label="View">
            <button type="button" class="is-on" data-view="grid">Grid</button><span>/</span><button type="button" data-view="list">List</button>
          </div>
        </div>
      </div>

      <section class="tw-works" data-slot="project-grid">
        <div class="tw-wrap">
          <div class="tw-pgrid" data-project-grid="6"></div>
          <ol class="tw-plist" data-project-list hidden></ol>
        </div>
      </section>
    </main>
  </div>

  <script src="../../_shared/vendor/gsap/gsap.min.js"></script>
  <script src="../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
  <script src="../../_shared/vendor/gsap/SplitText.min.js"></script>
  <script src="../../_shared/vendor/gsap/CustomEase.min.js"></script>
  <script src="../../_shared/vendor/gsap/Draggable.min.js"></script>
  <script src="../../_shared/vendor/gsap/InertiaPlugin.min.js"></script>
  <script src="../_vendor/lenis@1.3.25/lenis.min.js"></script>
  <script src="../_vendor/swiper@11.2.10/swiper-bundle.min.js"></script>
  <script src="shared.js"></script>
  <script src="works.js"></script>
  <script src="../../_shared/wire.js"></script>
</body>
</html>
