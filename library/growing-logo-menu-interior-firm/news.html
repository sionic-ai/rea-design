<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Journal — Your company name here</title>
  <link rel="stylesheet" href="../../_shared/wire.css">
  <link rel="stylesheet" href="../../_shared/kf-defaults.css">
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="../_vendor/lenis@1.3.25/lenis.css">
  <link rel="stylesheet" href="../_vendor/swiper@11.2.10/swiper-bundle.min.css">
  <link rel="stylesheet" href="shared.css">
  <link rel="stylesheet" href="news.css">
</head>
<body data-page="news">
  <div id="smooth-content">
    <main>
      <section class="tw-pagehead is-center tw-works__head" data-slot="page-head">
        <div class="tw-wrap"><h1 class="tw-h3 tw-split" data-label="Your News collection English name here (including brand name)">The Studio Journal</h1></div>
      </section>

      <div class="tw-filter is-static" data-slot="search-bar">
        <div class="tw-wrap tw-filter__in">
          <label class="tw-search"><input type="search" placeholder="Find" aria-label="Find News"><svg viewBox="0 0 12 12" fill="none" aria-hidden="true"><circle cx="5" cy="5" r="4" stroke="currentColor" stroke-width="1.3"/><path d="M8 8l3 3" stroke="currentColor" stroke-width="1.3"/></svg></label>
          <div class="tw-filter__group">
            <div class="tw-drop is-right"><button class="tw-drop__btn" type="button" aria-expanded="false">Align <span aria-hidden="true">&darr;</span></button>
              <ul class="tw-drop__list"><li><button type="button">From newest</button></li><li><button type="button">Starting with the old</button></li><li><button type="button">Alphabetical order</button></li><li><button type="button">Reverse alphabetical order</button></li></ul></div>
            <span class="tw-count"><span class="tw-pill">30</span>Posts</span>
          </div>
        </div>
      </div>

      <section class="tw-news" data-slot="post-grid">
        <div class="tw-wrap"><div class="tw-news__grid" data-news-grid></div></div>
      </section>
    </main>
  </div>

  <script src="../../_shared/vendor/gsap/gsap.min.js"></script>
  <script src="../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
  <script src="../../_shared/vendor/gsap/SplitText.min.js"></script>
  <script src="../../_shared/vendor/gsap/CustomEase.min.js"></script>
  <script src="../../_shared/vendor/gsap/Draggable.min.js"></script>
  <script src="../../_shared/vendor/gsap/InertiaPlugin.min.js"></script>
  <script src="../_vendor/lenis@1.3.25/lenis.min.js"></script>
  <script src="../_vendor/swiper@11.2.10/swiper-bundle.min.js"></script>
  <script src="shared.js"></script>
  <script src="news.js"></script>
  <script src="../../_shared/wire.js"></script>
</body>
</html>
