<body data-page="works">
  <main class="lm-main">
    <!-- Work list: 4-column square cells (dense fill), one in four is a large 2×2 cell. Filtering with the category buttons in the header makes non-matching cells vanish in .7s, and --
         Hovering an empty cell shows an X outline, pressing it clears the filter. 12 cells at a time, and 1s after the signature below enters the screen, 12 more are appended -->
    <section class="lm-px lm-works" data-slot="work-grid">
      <ul class="lm-works__grid"></ul>
      <div class="lm-works__more" data-slot="load-more" hidden><div class="lm-works__loader"></div></div>
    </section>
  </main>

  <script src="../../_shared/vendor/gsap/gsap.min.js"></script>
