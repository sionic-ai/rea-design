<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Feature list · a vocational school site with a spinning cluster of scattered photos</title>
<link rel="stylesheet" href="../../_shared/wire.css">
<link rel="stylesheet" href="../../_shared/kf-defaults.css">
<link rel="stylesheet" href="../_fx/inset-clip-hover/fx.css">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="list.css">
</head>
<body data-page="list">

<header data-slot="header"></header>

<main class="nc-lower">
  <section class="nc-kv -slim" data-slot="page-head"><div class="nc-kv__texture"></div><div class="nc-kv__inner"></div></section>
  <ol class="nc-crumb"><li><a href="index.html">TOP</a></li><li><a href="about.html">About the School</a></li><li>Feature List</li></ol>

  <div class="nc-page">
    <h1 class="nc-h-under">Feature List</h1>
    <section class="nc-feat" data-slot="feature-list"></section>
    <section data-slot="contact" data-nc-fill="contact"></section>
    <section data-slot="cta-banners" data-nc-fill="cta"></section>
  </div>

  <section class="nc-links" data-slot="page-links" data-nc-fill="links" data-cards="Who we raise, Access, Feature list, Admission consultation · info sessions, Staff introduction, Link collection" data-rows="FAQ,Disclosures,Alumni support,Group school overview,Your group overview link here" data-red-last="1" data-photo="School building and classroom scene"></section>
  <script>
    // Five features — cards of the same type
    document.querySelector(".nc-feat").innerHTML = [
      ["Security feature banner · student at a monitor and big title text · blue light", "Your first feature headline in one line here.", "Your first feature introduced in one line here."],
      ["Illustration feature banner · character art with large text ‹For You Who Love It›", "Your second feature title here", "Your second feature intro line here."],
      ["Industry column banner · four people photos and column text", "Industry column", "Your one-line intro to a column delivering industry news goes here."],
      ["Student work banner · work collection with large English handwriting", "Student Work", "Your one line here introducing student and alumni work."],
      ["Admissions special banner · application form and calendar · bright yellow", "Your fifth feature title here", "One line introducing the fifth feature here."],
    ].map(([ph, t, p], i) => `<article class="nc-feat__card"><a class="nc-feat__img" href="#" data-fx="inset-clip-hover"><div class="wf-img" data-fx-part="media" data-label="${ph} · Landscape 2:1"></div></a><div class="nc-feat__body"><p class="nc-feat__no">Feature page No.${i + 1}</p><h2>${t}</h2><p>${p}</p><a class="nc-feat__btn" href="#">View details</a></div></article>`).join("");
  </script>
</main>

<footer data-slot="footer"></footer>

<script src="../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../../_shared/vendor/gsap/ScrollToPlugin.min.js"></script>
<script src="../_fx/fx-core.js"></script>
<script src="shared.js"></script>
<script src="../../_shared/wire.js"></script>
</body>
</html>
