<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photo gallery · a school site where a scattered cluster of photos rotates</title>
<link rel="stylesheet" href="../../_shared/wire.css">
<link rel="stylesheet" href="../../_shared/kf-defaults.css">
<link rel="stylesheet" href="../_fx/inset-clip-hover/fx.css">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="lookbook.css">
</head>
<body data-page="lookbook">

<header data-slot="header"></header>

<main class="nc-lower">
  <section class="nc-kv -slim" data-slot="page-head"><div class="nc-kv__texture"></div><div class="nc-kv__inner"></div></section>

  <div class="nc-gal" data-slot="gallery">
    <div class="nc-gal__bg" aria-hidden="true"><div class="nc-gal__track"></div></div>
    <span class="wf-note">Gallery background · a scattered pattern of blurred photos flows 1920px horizontally in 20s (linear repeat)</span>
    <ol class="nc-crumb"><li><a href="index.html">TOP</a></li><li><a href="#">Campus Life</a></li><li>Photo Gallery</li></ol>
    <div class="nc-gal__contents">
      <header class="nc-gal__head">
        <svg class="nc-gal__cam" viewBox="0 0 40 30" aria-hidden="true"><rect x="2" y="7" width="36" height="21" rx="3" fill="none" stroke="var(--kf-ink)" stroke-width="2.5"/><path d="M13 7l3-5h8l3 5" fill="none" stroke="var(--kf-ink)" stroke-width="2.5"/><circle cx="20" cy="17" r="6" fill="none" stroke="var(--kf-ink)" stroke-width="2.5"/></svg>
        <p class="nc-gal__en nc-en">Photo Gallery.</p>
        <h1 class="nc-gal__title">Photo Gallery</h1>
        <p class="nc-gal__lead">One line here introducing a student’s year in photos. Check out the fun events!</p>
      </header>
      <ul class="nc-gal__grid"></ul>
    </div>
    <div class="nc-page">
      <section data-slot="contact" data-nc-fill="contact"></section>
      <section data-slot="cta-banners" data-nc-fill="cta"></section>
    </div>
  </div>

  <section class="nc-links" data-slot="page-links" data-nc-fill="links" data-cards="School videos, A day in the life of a student, Annual schedule, Photo gallery, Student interviews, Student survey" data-rows="Students living alone,Student life support,Your group living link here,Creator blog" data-photo="Bright illustration cover" data-back="lookbook.html" data-back-label="To the first page of Campus Life"></section>
  <script>
    // Background tiles — two sets of twelve rectangles in the same spot
    const tile = [[30, 120, 120, 90], [260, 520, 110, 80], [1500, 60, 90, 120], [1700, 420, 140, 100], [80, 900, 100, 130], [1760, 980, 120, 90], [40, 1500, 130, 100], [1620, 1600, 100, 140], [120, 2200, 110, 90], [1720, 2400, 130, 100], [60, 3000, 120, 100], [1680, 3200, 110, 130]]
      .map(([x, y, w, h]) => `<i style="left:${x}px;top:${y}px;width:${w}px;height:${h}px"></i>`).join("");
    document.querySelector(".nc-gal__track").innerHTML = `<div class="nc-gal__tile">${tile}</div><div class="nc-gal__tile">${tile}</div>`;
    // Twelve event cells — photo under a color band (blue, orange, green in turn)
    document.querySelector(".nc-gal__grid").innerHTML = ["Entrance ceremony", "Joint company briefing", "School Festival", "Game show visit", "Autumn Festival", "Overseas training", "Esports store event", "Sports Festival", "Making Graduation Projects", "Graduation Ceremony", "Job fair", "Student work showcase"]
      .map((t, i) => `<li class="nc-gal__item" data-tone="${i % 3}"><a href="#" data-fx="inset-clip-hover"><span class="nc-gal__label">${t}</span><div class="wf-img" data-fx-part="media" data-label="${t} Site · students · 4:3"></div></a></li>`).join("");
  </script>
</main>

<footer data-slot="footer"></footer>

<script src="../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../../_shared/vendor/gsap/ScrollToPlugin.min.js"></script>
<script src="../_fx/fx-core.js"></script>
<script src="shared.js"></script>
<script src="../../_shared/wire.js"></script>
</body>
</html>
