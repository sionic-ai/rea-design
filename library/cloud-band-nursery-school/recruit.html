<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recruiting info · nursery school with cloud bands and winged line art</title>
<link rel="stylesheet" href="../../_shared/wire.css">
<link rel="stylesheet" href="../../_shared/kf-defaults.css">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="../_fx/float-bob/fx.css">
<link rel="stylesheet" href="../_fx/plate-pop-hover/fx.css">
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="sub.css">
</head>
<body data-page="recruit">
<header class="ak-header is-plain" data-slot="header"></header>

<div class="ak-key no-image" data-slot="page-hero">
  <span class="wf-note">Photoless head — three floating clouds · navy title · cloud hills · two bobbing children</span>
  <i class="ak-cloud is-c1"></i>
  <i class="ak-cloud is-c2"></i>
  <i class="ak-cloud is-c3"></i>
  <h1 class="ak-key__title">Hiring Info</h1>
  <div class="ak-key__cloud"></div>
  <i class="ak-kid is-k1"><i class="ak-art" data-art="jump" data-fx="float-bob" data-fx-float-bob="look: reverse" style="--fx-dur: 1.8s; --fx-amp: 10%; --k-shirt: var(--site-yellow)"></i></i>
  <i class="ak-kid is-k2"><i class="ak-art" data-art="fly" data-fx="float-bob" style="--fx-dur: 1.8s; --fx-amp: 5%; --k-shirt: var(--site-pink)"></i></i>
</div>

<main class="ak-main is-page">
  <div class="ak-wave-bottom">
    <div class="ak-container is-white" data-slot="notice-card">
      <p>Not currently recruiting.</p>
    </div>
  </div>
</main>

<div class="ak-footwrap" data-slot="footer"></div>

<script src="../_vendor/jquery@3.7.1/jquery.min.js"></script>
<script src="../_vendor/jquery.easing@1.4.1/jquery.easing.min.js"></script>
<script src="../_vendor/jquery-inview@1.1.2/jquery.inview.min.js"></script>
<script src="../_vendor/vivus@0.4.6/vivus.min.js"></script>
<script src="../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../_fx/fx-core.js"></script>
<script src="shared.js"></script>
<script src="../../_shared/wire.js"></script>
</body>
</html>
