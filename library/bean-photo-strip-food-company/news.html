<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>News — Your company name here</title>
  <link rel="stylesheet" href="../../_shared/wire.css">
  <link rel="stylesheet" href="../../_shared/kf-defaults.css">
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="shared.css">
  <link rel="stylesheet" href="news.css">
</head>
<body data-page="news">
<header data-slot="header"></header>

<article class="tk-page tk-contents nw">
  <div class="tk-box">
    <section class="tk-top tk-top--simple tk-dots" data-slot="page-head">
      <div class="tk-title tk-title--page"><p><span class="tk-en">NEWS</span></p><h1>News</h1></div>
      <ul class="tk-crumb"><li><a href="index.html">TOP</a></li><li><span>News</span></li></ul>
    </section>
    <div class="nw-inner" data-slot="news-list">
      <ul class="nw-cats" data-slot="category-tabs">
        <li class="nw-cats__item is-current"><a href="#" data-cat="all">Entire</a></li>
        <li class="nw-cats__item"><a href="#" data-cat="News">News</a></li>
        <li class="nw-cats__item"><a href="#" data-cat="Other">Other</a></li>
      </ul>
      <ul class="tk-news" data-news="12"></ul>
      <div class="nw-pager" data-slot="pager"><span class="nw-pager__num is-current tk-en">1</span><a class="nw-pager__num tk-en" href="#">2</a></div>
    </div>
  </div>
</article>

<section data-slot="cta"></section>
<footer data-slot="footer"></footer>

<script src="../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../_vendor/lenis@1.3.3/lenis.min.js"></script>
<script src="shared.js"></script>
<script>
  // Category tag: click to keep only that category (the original goes to a category page)
  (() => {
    const tabs = [...document.querySelectorAll(".nw-cats a")];
    const rows = [...document.querySelectorAll(".nw-inner .tk-news__item")];
    tabs.forEach((t) => t.addEventListener("click", (e) => {
      e.preventDefault();
      tabs.forEach((o) => o.parentElement.classList.toggle("is-current", o === t));
      rows.forEach((r) => (r.hidden = t.dataset.cat !== "all" && r.querySelector(".tk-cate").textContent.trim() !== t.dataset.cat));
    }));
  })();
</script>
<script src="../../_shared/wire.js"></script>
</body>
</html>
