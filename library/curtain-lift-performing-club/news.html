<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>News — Your group name here</title>
  <link rel="stylesheet" href="../../_shared/wire.css">
  <link rel="stylesheet" href="../../_shared/kf-defaults.css">
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="shared.css">
  <link rel="stylesheet" href="../_fx/studio-appear/fx.css">
  <link rel="stylesheet" href="../_fx/lottie-scroll-seek/fx.css">
  <link rel="stylesheet" href="../_fx/fade-slide-drawer/fx.css">
  <link rel="stylesheet" href="sub.css">
</head>
<body data-page="news">
  <div data-nm="chrome"></div>

  <main class="nm-sub">
    <!-- News list — centered 550px single-column list (date · vertical tick · title), crosses at top right and bottom left -->
    <section class="nm-sub__wrap" data-slot="news-list">
      <span class="nm-sub__deco nm-sub__deco--top" data-nm-cross></span>
      <div class="nm-list">
        <h1 class="nm-script nm-list__title fx-studio-appear-wait" data-fx="studio-appear" data-fx-studio-appear="look: shift; at: 100">News</h1>
        <div class="nm-list__rows fx-studio-appear-wait" data-fx="studio-appear" data-fx-studio-appear="look: shift; at: 100" data-nm-rows="24"></div>
      </div>
      <a class="nm-more nm-sub__more" href="index.html" data-nm-more><span>Back to start</span></a>
      <span class="nm-sub__deco nm-sub__deco--low" data-nm-cross></span>
    </section>
  </main>

  <div data-nm="contact"></div>

  <script src="../../_shared/vendor/gsap/gsap.min.js"></script>
  <script src="../_vendor/lottie-web@5.12.2/lottie_svg.min.js"></script>
  <script src="shared.js"></script>
  <script src="../_fx/fx-core.js"></script>
  <script src="../_fx/studio-appear/fx.js"></script>
  <script src="../_fx/lottie-scroll-seek/fx.js"></script>
  <script src="../_fx/fade-slide-drawer/fx.js"></script>
  <script src="../../_shared/wire.js"></script>
</body>
</html>
