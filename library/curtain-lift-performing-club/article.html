<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>News headline here — Organization name here</title>
  <link rel="stylesheet" href="../../_shared/wire.css">
  <link rel="stylesheet" href="../../_shared/kf-defaults.css">
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="shared.css">
  <link rel="stylesheet" href="../_fx/studio-appear/fx.css">
  <link rel="stylesheet" href="../_fx/lottie-scroll-seek/fx.css">
  <link rel="stylesheet" href="../_fx/fade-slide-drawer/fx.css">
  <link rel="stylesheet" href="sub.css">
</head>
<body data-page="article">
  <div data-nm="chrome"></div>

  <main class="nm-sub">
    <!-- News post — yellow title, one small photo, short body, hand-drawn frame ‹Back to list› button -->
    <article class="nm-sub__wrap nm-post" data-slot="article">
      <span class="nm-sub__deco nm-sub__deco--top" data-nm-cross></span>
      <div class="nm-post__in fx-studio-appear-wait" data-fx="studio-appear" data-fx-studio-appear="look: shift; at: 100">
        <h1 class="nm-post__title">Your news title here<br>Keep it to about a line and a half.</h1>
        <figure class="nm-post__photo"><span class="wf-img" data-label="News photo · stacked gift boxes on an office floor · indoor fluorescent light · 5:3 landscape"></span></figure>
        <p class="nm-post__body">Your news body goes here. In two or three short lines, say who did what and how the club members received it.<br>Place a word of thanks on the last line.</p>
      </div>
      <a class="nm-more nm-sub__more" href="news.html" data-nm-more><span>Back to List</span></a>
      <span class="nm-sub__deco nm-sub__deco--low" data-nm-cross></span>
    </article>
  </main>

  <div data-nm="contact"></div>

  <script src="../../_shared/vendor/gsap/gsap.min.js"></script>
  <script src="../_vendor/lottie-web@5.12.2/lottie_svg.min.js"></script>
  <script src="shared.js"></script>
  <script src="../_fx/fx-core.js"></script>
  <script src="../_fx/studio-appear/fx.js"></script>
  <script src="../_fx/lottie-scroll-seek/fx.js"></script>
  <script src="../_fx/fade-slide-drawer/fx.js"></script>
  <script src="../../_shared/wire.js"></script>
</body>
</html>
