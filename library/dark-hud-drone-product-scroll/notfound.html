  <svg class="zk-defs" aria-hidden="true" focusable="false">
    <symbol id="zk-sym" viewBox="0 0 24 24"><path d="M12 1v22M1 12h22M4.2 4.2l15.6 15.6M19.8 4.2 4.2 19.8" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="12" cy="12" r="2.6" fill="currentColor"/></symbol>

  </svg>
  <!-- Not found: inside the same four-corner frame as the loader, big letters offset per band, a signal band crossing the center -->

    <i class="zk-corner zk-corner--lt"></i><i class="zk-corner zk-corner--rt"></i><i class="zk-corner zk-corner--lb"></i><i class="zk-corner zk-corner--rb"></i>
    <a class="zk-mark zk-404__logo" href="index.html" aria-label="Back to start"><svg class="zk-mark__sym"><use href="#zk-sym"/></svg><span lang="en">ORB</span></a>
    <div class="zk-404__word" lang="en" data-label="Error word (four uppercase English letters)" aria-label="NULL">
      <div class="zk-404__band" aria-hidden="true">NULL</div><div class="zk-404__band" aria-hidden="true">NULL</div><div class="zk-404__band" aria-hidden="true">NULL</div>
      <div class="zk-404__band" aria-hidden="true">NULL</div><div class="zk-404__band" aria-hidden="true">NULL</div><div class="zk-404__band" aria-hidden="true">NULL</div>

      <div class="zk-404__band" aria-hidden="true">NULL</div><div class="zk-404__band" aria-hidden="true">NULL</div><div class="zk-404__band" aria-hidden="true">NULL</div>
    </div>
    <div class="zk-404__signal">
      <div class="zk-mono" lang="en">// ERROR 404 — PAGE NOT FOUND</div>
      <div class="zk-404__bars" aria-hidden="true"></div>
    </div>
    <a class="zk-404__back zk-mono" href="index.html" lang="en">back to homepage <svg aria-hidden="true"><use href="#zk-cross"/></svg></a>

  <div class="zk-track zk-mono" aria-hidden="true"><span>X: <b>0000</b></span><span>Y: <b>0000</b></span></div>
