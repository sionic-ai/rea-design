<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Work list · portrait photo grid with category underline</title>
<link rel="stylesheet" href="../../_shared/wire.css">
<link rel="stylesheet" href="../../_shared/kf-defaults.css">
<link rel="stylesheet" href="../_vendor/lenis@1.3.27/lenis.css">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="../_fx/typeset-toggle/fx.css">
<link rel="stylesheet" href="../_fx/nav-underline-follow/fx.css">
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="works.css">
</head>
<body class="is-sub-page" data-barba="wrapper">
<div class="ns-page" data-barba="container" data-barba-namespace="works">
  <header data-ns="header" data-slot="header"></header>
  <main class="ns-main">
    <div class="ns-container">
      <div class="ns-content">
        <div class="ns-content__head ns-works-head" data-slot="page-head">
          <h1 class="ns-h1">Projects</h1>
          <nav class="ns-cats" aria-label="Category" data-fx="nav-underline-follow" data-fx-nav-underline-follow="inset: 0; dur: .35; w-dur: .3; ease: 0.25,0.1,0.25,1; leave: hide; show: .75" style="--fx-fade: .4s; --fx-fade-ease: ease-out">
            <span class="wf-note">Category nav · underline slides under the hovered item in .35s (width .3s) · turns off in .4s on leave</span>
            <ul>
              <li><a href="works.html" aria-current="page" data-fx-part="item">All</a></li>
              <li><a href="#" data-fx-part="item">Branding</a></li>
              <li><a href="#" data-fx-part="item">Typeface</a></li>
              <li><a href="#" data-fx-part="item">Visual Identity</a></li>
              <li><a href="#" data-fx-part="item">Product Design</a></li>
              <li><a href="#" data-fx-part="item">Interactive</a></li>
              <li><a href="#" data-fx-part="item">Graphic</a></li>
              <li><a href="#" data-fx-part="item">Event</a></li>
            </ul>
            <span class="ns-cats__line" data-fx-part="line"></span>
          </nav>
        </div>
        <div class="ns-content__body ns-works-body" data-slot="works-grid">
          <div class="ns-works" data-works="20" data-more-grid></div>
          <div class="ns-loader" aria-hidden="true" hidden><i></i><i></i><i></i></div>
          <p class="ns-more" data-more-wrap><button type="button" data-more>Next Projects</button></p>
        </div>
      </div>
    </div>
  </main>
  <footer data-ns="footer" data-slot="footer"></footer>
</div>

<script src="../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../_shared/vendor/gsap/CustomEase.min.js"></script>
<script>gsap.registerPlugin(CustomEase);</script>
<script src="../_vendor/lenis@1.3.27/lenis.min.js"></script>
<script src="../_vendor/barba-core@2.10.3/barba.umd.js"></script>
<script src="../_fx/fx-core.js"></script>
<script src="../_fx/typeset-toggle/fx.js"></script>
<script src="../_fx/nav-underline-follow/fx.js"></script>
<script src="works.js"></script>
<script src="shared.js"></script>
<script src="../../_shared/wire.js"></script>
</body>
</html>
