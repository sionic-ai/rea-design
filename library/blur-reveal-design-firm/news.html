<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>News · news list that switches between grid and rows</title>
<link rel="stylesheet" href="../../_shared/wire.css">
<link rel="stylesheet" href="../../_shared/kf-defaults.css">
<link rel="stylesheet" href="../_vendor/lenis@1.3.27/lenis.css">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="../_fx/typeset-toggle/fx.css">
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="news.css">
</head>
<body class="is-sub-page" data-barba="wrapper">
<div class="ns-page" data-barba="container" data-barba-namespace="news">
  <header data-ns="header" data-slot="header"></header>
  <main class="ns-main">
    <div class="ns-container">
      <div class="ns-content">
        <div class="ns-content__head ns-news-head" data-slot="page-head">
          <h1 class="ns-h1">News</h1>
          <nav class="ns-layout" aria-label="Example Type">
            <span class="wf-note">View type · on click the list fades out in .15s and returns in the changed form in .3s · remembered until the next visit</span>
            <ul><li><button type="button" data-layout="grid" aria-pressed="true">Grid</button></li><li><button type="button" data-layout="list" aria-pressed="false">List</button></li></ul>
          </nav>
        </div>
        <div class="ns-content__body" data-slot="news-grid">
          <div class="ns-news" data-layout="grid" data-news="32"></div>
          <nav class="ns-pager" aria-label="Page">
            <span class="ns-pager__prev is-off" aria-hidden="true">←</span>
            <div class="ns-pager__pages"><span class="ns-pager__cur">1</span><a class="ns-pager__link" href="#">2</a></div>
            <a class="ns-pager__next" href="#" aria-label="Next page">→</a>
          </nav>
        </div>
      </div>
    </div>
  </main>
  <footer data-ns="footer" data-slot="footer"></footer>
</div>

<script src="../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../_shared/vendor/gsap/CustomEase.min.js"></script>
<script>gsap.registerPlugin(CustomEase);</script>
<script src="../_vendor/lenis@1.3.27/lenis.min.js"></script>
<script src="../_vendor/barba-core@2.10.3/barba.umd.js"></script>
<script src="../_fx/fx-core.js"></script>
<script src="../_fx/typeset-toggle/fx.js"></script>
<script src="news.js"></script>
<script src="shared.js"></script>
<script src="../../_shared/wire.js"></script>
</body>
</html>
