<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blog · list of post cards that tilt slightly on hover</title>
<link rel="stylesheet" href="../../_shared/wire.css">
<link rel="stylesheet" href="../../_shared/kf-defaults.css">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="../_fx/random-tilt-hover/fx.css">

</head>
<body data-page="blog">
<header data-slot="header"></header>

<main>
  <section class="am-blog__head" data-slot="blog-head">
    <div class="am-blog__icon wf-img" data-label="App icon illustration · small box on a red calendar · front view · 88px"></div>
    <h1 class="am-blog__title" data-label="Blog English name">Product Blog</h1>
    <p class="am-blog__lead">Your blog description here in two lines. Thoughts on productivity, things learned, and ways to use time better.</p>
  </section>

  <section class="am-posts" data-slot="post-grid" data-posts></section>

  <nav class="am-pager" aria-label="Page turn" data-slot="pager">
    <a href="#" aria-current="page">1</a><a href="#">2</a><a href="#">3</a><a href="#" aria-label="Next">›</a>
  </nav>
</main>

<footer data-slot="footer"></footer>

<script src="../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../_fx/fx-core.js"></script>
<script src="../_fx/random-tilt-hover/fx.js"></script>
<script src="shared.js"></script>
<script src="blog.js"></script>
<script src="../../_shared/wire.js"></script>
</body>
</html>
