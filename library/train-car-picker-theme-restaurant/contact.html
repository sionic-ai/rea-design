<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact | Your shop name here</title>
  <link rel="stylesheet" href="../../_shared/wire.css">
  <link rel="stylesheet" href="../../_shared/kf-defaults.css">
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="shared.css">
  <link rel="stylesheet" href="contact.css">
</head>
<body data-page="contact" id="top">
  <header data-slot="header"></header>

  <main>
    <section class="ft-pagehead kp-head" data-slot="page-head">
      <h1 class="ft-d kp-title" data-label="English contact section title here"><span data-ft-title>Contact</span></h1>
      <p class="kp-lead" data-ft-lines>Feel free to contact us.<br>Your one line on what kinds of inquiries you accept goes here.</p>
      <nav class="ft-crumb kp-crumb" aria-label="Current location"><a href="index.html">Home</a><span>›</span><span>Contact</span></nav>
    </section>

    <section class="ft-sheet kp-sheet" data-slot="contact-form">
      <h2 class="kp-form-t">Contact form</h2>
      <p class="kp-req">* An asterisk marks fields you must write in.</p>
      <form class="kp-form" novalidate>
        <label class="kp-row"><span class="kp-lab is-req">Contact type</span>
          <span class="kp-sel"><select name="type" required><option value="">-- Select --</option><option>Reservation</option><option>Group</option><option>Reporting</option><option>Others</option></select></span></label>
        <label class="kp-row"><span class="kp-lab">Company · organization name</span><input type="text" placeholder="Your company name here"></label>
        <label class="kp-row"><span class="kp-lab is-req">Name</span><input type="text" name="name" required placeholder="Name"></label>
        <label class="kp-row"><span class="kp-lab">How to read the name</span><input type="text"></label>
        <label class="kp-row"><span class="kp-lab">Phone number</span><input type="tel"></label>
        <label class="kp-row"><span class="kp-lab is-req">Email address</span><input type="email" name="email" required></label>
        <label class="kp-row"><span class="kp-lab">Preferred visit date</span><input type="text" placeholder="YYYY/mm/dd"></label>
        <label class="kp-row kp-row--top"><span class="kp-lab is-req">Contact message</span><textarea name="body" required placeholder="Please describe your inquiry."></textarea></label>
        <label class="kp-agree"><input type="checkbox" name="agree" required><span><a href="#">Privacy policy</a>I agree to</span></label>
        <div class="kp-captcha wf-img" data-label="CAPTCHA box · landscape 300:65"></div>
        <button class="kp-submit" type="submit" disabled>Confirm</button>
      </form>
    </section>
  </main>

  <div data-slot="footer"></div>

  <script src="../../_shared/vendor/gsap/gsap.min.js"></script>
  <script src="../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
  <script src="../../_shared/vendor/gsap/SplitText.min.js"></script>
  <script src="shared.js"></script>
  <script src="contact.js"></script>
  <script src="../../_shared/wire.js"></script>
</body>
</html>
