<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact · guesthouse in a renovated old house</title>
<link rel="stylesheet" href="../../_shared/wire.css">
<link rel="stylesheet" href="../../_shared/kf-defaults.css">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="sub.css">
</head>
<body data-page="contact" data-head="w" data-th="100" class="is-fadeout">
<div class="nt-page" id="nt-page">
<div data-nt-shared="head"></div>

<div class="nt-sub nt-contact" data-slot="contact-form">
  <div class="nt-pmv"><span class="wf-img" data-label="Railway between mountain villages · clear winter day · landscape 2.3:1"></span></div>
  <h2 class="nt-sub__h nt-hand nt-contact__h">contact</h2>
  <form class="nt-form" onsubmit="return false">
    <div class="nt-inq">
      <table><tbody>
        <tr><td class="nt-form__m"><p><span>*</span>Name</p></td><td><div><input type="text" aria-label="Name"></div></td></tr>
        <tr><td class="nt-form__m"><p>Read name</p></td><td><div><input type="text" aria-label="Read name"></div></td></tr>
        <tr><td class="nt-form__m"><p>Phone number</p></td><td><div><input type="text" aria-label="Phone number"></div></td></tr>
        <tr><td class="nt-form__m"><p><span>*</span>Email address</p></td><td><div><input type="text" aria-label="Email address"></div></td></tr>
        <tr><td class="nt-form__m"><p><span>*</span>Verify email address</p></td><td><div><input type="text" aria-label="Verify email address"></div></td></tr>
        <tr><td class="nt-form__m"><p><span>*</span>Contact message</p></td><td><div><textarea rows="8" aria-label="Contact message"></textarea></div></td></tr>
        <tr class="nt-flex"><td class="nt-form__m"><p><span>*</span>Confirm send</p></td><td><div class="nt-form__ac"><label><input type="checkbox"> I have checked what I’m sending</label><span class="nt-form__a">※ Please check the above and mark it.</span></div></td></tr>
      </tbody></table>
      <div class="nt-form__btn"><input type="submit" value="Send"></div>
      <p class="nt-form__last">If there’s no reply after three days,<br>Since the email may not have reached you,<br>Sorry for the trouble, please let us know once more.</p>
    </div>
  </form>
</div>
</div>
<div data-nt-shared="foot"></div>

<script src="../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../_vendor/jquery@3.6.0/jquery.min.js"></script>
<script src="shared.js"></script>
<script src="../../_shared/wire.js"></script>
</body>
</html>
