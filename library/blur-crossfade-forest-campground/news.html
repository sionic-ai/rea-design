<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>News · forest campsite crossfading through blur</title>
<link rel="stylesheet" href="../../_shared/wire.css">
<link rel="stylesheet" href="../../_shared/kf-defaults.css">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="sub.css">
</head>
<body data-page="news">
<div class="fc-wrap">
<main>
  <section class="fc-head" data-slot="page-head">
    <div class="wf-img" data-label="Top-down photo of camping gear on grass · morning · landscape strip"></div>
    <div class="fc-head__container">
      <a class="fc-head__logo" href="index.html" data-fc-logo></a>
      <h1 class="fc-h2"><span class="ja">Latest news</span><span class="en fc-en">NEWS</span></h1>
    </div>
  </section>
  <nav class="fc-crumbs" data-slot="breadcrumbs"><ul><li><a class="fc-fade" href="index.html">TOP</a></li><li>Latest news</li></ul></nav>
  <section class="ns" data-slot="news-list">
    <div class="ns__contain">
      <ul class="ns__cats">
        <li><a href="news.html">Entire</a></li><li><a href="news.html">Notice</a></li><li><a href="news.html">Event</a></li><li><a href="news.html">Business guide</a></li>
      </ul>
      <ul class="ns__list" data-fc-news="9"></ul>
      <nav class="ns__pager fc-en" aria-label="Page"><span class="is-current">1</span><a href="news.html">2</a><a href="news.html">3</a><span>…</span><a href="news.html">8</a><a href="news.html">›</a></nav>
    </div>
  </section>
  <footer data-slot="footer"></footer>
</main>
</div>
<script src="../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="shared.js"></script>
<script>
  // Fills same-type News rows with placeholders — photo, date, tag, title, bar
  (() => {
    const ul = document.querySelector("[data-fc-news]");
    const pics = ["Shop signboard illustration · black background · 3:2", "Thatched house exterior · in front of forest · 3:2", "Snowy forest · winter · 3:2", "Wooden signboard close-up · 3:2", "Sauna cabin · evening · 3:2", "Business calendar table graphic · 3:2"];
    const tags = ["Business guide", "Notice", "Event", ""];
    ul.innerHTML = Array.from({ length: +ul.dataset.fcNews }, (_, i) => `<li><a class="fc-hov" href="news.html"><figure><div class="wf-img" data-label="${pics[i % pics.length]}"></div></figure><div class="textarea"><div class="head"><time>0000.0.00</time>${tags[i % 4] ? `<ul><li>${tags[i % 4]}</li></ul>` : ""}</div><p>Your News title $ here{i % 2 ? "One line" : "is added a bit longer"}</p></div><span class="fc-bar ns__bar"><span></span><span></span><span></span><span></span></span></a></li>`).join("");
  })();
</script>
<script src="../../_shared/wire.js"></script>
</body>
</html>
