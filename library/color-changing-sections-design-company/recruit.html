<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Work with us — Careers</title>
<script>sessionStorage.getItem("ss-nav") && document.documentElement.classList.add("ss-arriving");</script>
<link rel="stylesheet" href="../../_shared/wire.css">
<link rel="stylesheet" href="../../_shared/kf-defaults.css">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="recruit.css">
</head>
<body data-page="recruit" data-theme="red">
<main class="ss-page">
  <div class="ss-wbar ss-wbar-page" style="--wtop: 0">
    <div class="ss-widget"><div class="ss-wcard ts-body-s" data-wlink="#openings|Want to work with us?|Get to know us|arrow"></div></div>
    <div class="ss-widget"><div class="ss-wcard"><div class="ss-wmedia"><div class="wf-img" data-label="Office dog · on a chair · 1:1"></div></div></div></div>
    <div class="ss-widget"><div class="ss-wcard ts-body-s" data-wnews="Subscribe to news"></div></div>
  </div>

  <!-- Red section: giant two-line title + slightly tilted team photo (parallax) -->
  <section class="ss-hero" data-tone="red" data-slot="hero">
    <h1 class="ts-h1-exception title" style="--fs-exception: 26" data-label="Your two-word big English careers title here">Big<br>Title</h1>
    <div class="ss-overlay is-join">
      <div class="ss-media" data-parallax="-0.5" data-parallax-top data-rotate="-3" style="aspect-ratio: 3 / 4"><div class="wf-img" data-label="Three smiling teammates outdoors · clear daytime · portrait 3:4"></div></div>
    </div>
  </section>
  <section class="ss-row" data-tone="red" data-slot="intro" style="--pt: 2rem; --pb: 3rem">
    <div class="ss-col ss-rich" style="--span: 6"><h2 class="ts-label-m">Working in Spring/Summer</h2><p class="ts-body-l" style="margin-top: 1em">We gather talented people who are smart, kind and quick to smile. They are people you can build with at a level that is hard to find elsewhere.</p></div>
  </section>
  <section class="ss-row bleed" data-tone="red" data-slot="wide-photo">
    <div class="ss-media is-flat" style="aspect-ratio: 4 / 3"><div class="wf-img" data-label="Sea and clouds seen from a hill · clear daytime · landscape 4:3"></div></div>
  </section>
  <section class="ss-row" data-tone="sand-ink" data-slot="openings" id="openings" style="--pt: 9rem; --pb: 5rem">
    <div class="ss-col"><h2 class="ts-label-m">See the open spots below</h2><p class="ts-body-xl" style="margin-top: 1.5rem">No openings right now :(</p></div>
  </section>
  <section class="ss-row ss-collage" data-tone="sand-ink" data-slot="photo-collage" style="--pb: 5rem">
    <div class="ss-col" style="--span: 6"><div class="ss-media" data-parallax="0.1" style="aspect-ratio: 2 / 3"><div class="wf-img" data-label="Shelf and leather chair · white wall · portrait 2:3"></div></div></div>
    <div class="ss-col" style="--span: 6"><div class="ss-media" data-parallax="0.2" style="aspect-ratio: 9 / 16"><div class="wf-img" data-label="Two people doing handstands on the beach · Clear daytime · Portrait 9:16"></div></div></div>
    <div class="ss-collage-over"><div class="ss-media" data-parallax="0.4" style="aspect-ratio: 3 / 4"><div class="wf-img" data-label="Sky above palm trees · from below · portrait"></div></div></div>
  </section>
</main>

<script src="../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="shared.js"></script>
<script src="../../_shared/wire.js"></script>
</body>
</html>
