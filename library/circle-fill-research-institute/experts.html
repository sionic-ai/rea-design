<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Experts · people grid with search and team filter</title>
<link rel="stylesheet" href="../../_shared/wire.css">
<link rel="stylesheet" href="../../_shared/kf-defaults.css">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="experts.css">
</head>
<body data-page="experts">

<header data-slot="header"></header>

<main>
  <section class="om-pad ex-top" data-slot="team-grid">
    <span class="wf-note">People grid · name search · team filter · on hover the photo border turns plum and the job title turns navy</span>
    <div class="om-wrap">
      <div class="ex-head">
        <h1 class="om-h2" data-label="English section title">Our Experts</h1>
        <div class="ex-tools">
          <label class="ex-search"><svg viewBox="0 0 20 20" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5"/><path d="m13 13 4 4"/></svg><input type="search" placeholder="Search" data-find aria-label="Find name"></label>
          <div class="ex-filter" data-filter>
            <button class="om-btn om-btn--line om-btn--sm" type="button" aria-expanded="false"><span data-filter-label>Team</span><svg class="om-dd__chev" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M2.5 4.5 6 8l3.5-3.5"/></svg></button>
            <div class="ex-filter__list"><button type="button" data-team="">All</button><button type="button" data-team="research">Research</button><button type="button" data-team="evaluation">Evaluation</button><button type="button" data-team="development">Development</button><button type="button" data-team="operations">Operations</button></div>
          </div>
        </div>
      </div>
      <div class="ex-grid" data-people data-count="30"></div>
      <p class="om-p ex-empty" data-empty hidden>Your line for when no one is found here.</p>
    </div>
  </section>

  <section class="om-pad om-sec ex-board" data-slot="board-grid">
    <div class="om-wrap">
      <h2 class="om-h4" data-label="English section title">Board of Directors</h2>
      <div class="ex-grid" data-people data-count="6" data-board></div>
    </div>
  </section>

  <section data-slot="cta" data-fixed-tone="plum"></section>
</main>

<footer data-slot="footer"></footer>

<script src="../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../_vendor/lottie-web@5.12.2/lottie_svg.min.js"></script>
<script src="lottie-data.js"></script>
<script src="shared.js"></script>
<script src="experts.js"></script>
<script src="../../_shared/wire.js"></script>
</body>
</html>
