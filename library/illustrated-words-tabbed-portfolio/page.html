<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portfolio with text, pictures, words and intro sentences</title>
<script>
  // The intro that draws the avatar runs only once a day — it holds the rest of the text while drawing, and if the script can’t take over it just shows after 6 seconds
  try {
    const h = document.documentElement, now = Date.now();
    const force = /[?&]intro\b/.test(location.search);
    if (!matchMedia("(prefers-reduced-motion: reduce)").matches && (force || now - (Number(localStorage.getItem("g-intro-seen")) || 0) >= 864e5)) {
      localStorage.setItem("g-intro-seen", String(now));
      h.dataset.intro = "hold";
      setTimeout(() => h.dataset.intro === "hold" && delete h.dataset.intro, 6000);
    }
  } catch {}
  // If arriving via a word link, the first image is pre-covered with the previous screen’s image — shared.js turns the same image into a WebGL paper, rolls it up and clears it
  try {
    const shot = sessionStorage.getItem("g-curl");
    if (shot && !matchMedia("(prefers-reduced-motion: reduce)").matches) {
      sessionStorage.removeItem("g-curl");
      window.gCurlShot = JSON.parse(shot);
      document.documentElement.dataset.curl = "";
      const cover = document.createElement("style");
      cover.textContent = `html[data-curl]::after{content:"";position:fixed;inset:0;z-index:2147483647;pointer-events:none;background:url(${window.gCurlShot.src}) 0 0/100% 100% no-repeat}`;
      document.head.append(cover);
    }
  } catch {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;450;500&family=Geist+Mono:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="../../_shared/wire.css">
<link rel="stylesheet" href="../../_shared/kf-defaults.css">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="shared.css">
</head>
<body data-page="page">
<div class="g-shell">
<main class="g-landing">
  <span class="wf-note">Article · just a one-line notice when there are no articles yet · header same as About</span>
  <div class="g-intro">
    <div data-shared="intro" data-slot="intro"></div>
    <div class="g-panel t-copy-16" data-reveal data-slot="writing-empty">
      <p>One line introducing the collection of posts. The first post is coming soon.</p>
    </div>
  </div>
</main>
</div>
<script src="../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="shared.js"></script>
<script src="../../_shared/wire.js"></script>
</body>
</html>
