<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Work list · dark photo card wall and filter pills</title>
<link rel="stylesheet" href="../../_shared/wire.css">
<link rel="stylesheet" href="../../_shared/kf-defaults.css">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="../_fx/rune-title-loader/fx.css">
<link rel="stylesheet" href="works.css">
</head>
<body data-page="works" data-crumb="Portfolio">

<main class="cs-works" id="archive">
  <div class="cs-filter" data-slot="filter-bar">
    <div class="cs-filter__inner">
      <div class="cs-filter__groups">
        <div class="cs-fgroup"><button class="cs-fbtn" type="button" aria-expanded="false">Field<svg viewBox="0 0 10 6" aria-hidden="true"><path d="M1 1l4 4 4-4"/></svg></button><div class="cs-fdrop"><button type="button" class="is-on">Entire</button><button type="button">Field 1</button><button type="button">Field 2</button><button type="button">Field 3</button></div></div>
        <div class="cs-fgroup"><button class="cs-fbtn" type="button" aria-expanded="false">Type<svg viewBox="0 0 10 6" aria-hidden="true"><path d="M1 1l4 4 4-4"/></svg></button><div class="cs-fdrop"><button type="button" class="is-on">Entire</button><button type="button">Company Site</button><button type="button">Shopping mall</button><button type="button">Landing</button></div></div>
        <div class="cs-fgroup"><button class="cs-fbtn" type="button" aria-expanded="false">Platform<svg viewBox="0 0 10 6" aria-hidden="true"><path d="M1 1l4 4 4-4"/></svg></button><div class="cs-fdrop"><button type="button" class="is-on">Entire</button><button type="button">Platform 1</button><button type="button">Platform 2</button></div></div>
        <div class="cs-fgroup"><button class="cs-fbtn" type="button" aria-expanded="false">Tag<svg viewBox="0 0 10 6" aria-hidden="true"><path d="M1 1l4 4 4-4"/></svg></button><div class="cs-fdrop"><button type="button" class="is-on">Entire</button><button type="button">Tag 1</button><button type="button">Tag 2</button></div></div>
        <div class="cs-fgroup"><button class="cs-fbtn" type="button" aria-expanded="false">Country<svg viewBox="0 0 10 6" aria-hidden="true"><path d="M1 1l4 4 4-4"/></svg></button><div class="cs-fdrop"><button type="button" class="is-on">Entire</button><button type="button">Country 1</button><button type="button">Country 2</button></div></div>
      </div>
      <div class="cs-view" role="group" aria-label="View Style">
        <button class="cs-vbtn is-on" type="button" data-view="grid" aria-label="View as grid"><svg viewBox="0 0 22 22" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="12" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="12" width="7" height="7" rx="1.5"/><rect x="12" y="12" width="7" height="7" rx="1.5"/></svg></button>
        <button class="cs-vbtn" type="button" data-view="list" aria-label="View as lines"><svg viewBox="0 0 22 22" aria-hidden="true"><path d="M4 6h14M4 11h14M4 16h14"/></svg></button>
      </div>
    </div>
  </div>

  <ul class="cs-wall" data-slot="card-wall"></ul>
  <ol class="cs-rows" data-slot="row-list" hidden></ol>
</main>

<div class="cs-part-card" data-slot="part-card" data-fx="rune-title-loader" data-fx-rune-title-loader="hold: 3000; spread: 0">
  <div class="cs-part">
    <p data-fx-part="caption">— Part III —</p>
    <h1 data-fx-part="title" data-label="Section English name">Portfolio</h1>
  </div>
</div>

<script src="../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../_fx/fx-core.js"></script>
<script src="../_fx/rune-title-loader/fx.js"></script>
<script src="shared.js"></script>
<script src="works.js"></script>
<script src="../../_shared/wire.js"></script>
</body>
</html>
