<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home · menu floating inside a cathedral panorama</title>
<link rel="stylesheet" href="../../_shared/wire.css">
<link rel="stylesheet" href="../../_shared/kf-defaults.css">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="../_fx/panorama-look/fx.css">
<link rel="stylesheet" href="../_fx/scramble-magnet-link/fx.css">
<link rel="stylesheet" href="../_fx/rune-title-loader/fx.css">
<link rel="stylesheet" href="index.css">
</head>
<body data-page="home">

<main class="cs-home">
  <section class="cs-pano" data-slot="hero-panorama" data-fx="panorama-look" data-fx-panorama-look="lon: 273; lat: 12; fov: 75; beam-lon: 281.6; beam-lat: 11">
    <canvas data-fx-part="map" width="4096" height="2048" data-label="360° equirectangular panorama photo · inside a Gothic cathedral nave · cold light shafts falling from three tall windows and pooled light on the floor · 2:1"></canvas>
    <span class="cs-pin" data-fx-part="pin" data-lon="276" data-lat="-9" aria-hidden="true"><svg viewBox="0 0 32 32"><circle class="cs-pin__ring" cx="16" cy="16" r="6"/><circle class="cs-pin__core" cx="16" cy="16" r="2.4"/></svg></span>
  </section>

  <nav class="cs-menu" data-slot="menu" aria-label="Main menu">
    <ul class="cs-menu__list"></ul>
    <a class="cs-menu__contact" href="detail.html#contact">Get in touch</a>
  </nav>
</main>

<div class="cs-gate" data-slot="enter-gate" hidden>
  <p class="cs-gate__label" data-fx="text-scramble" data-fx-text-scramble="on: manual; duration: 1.2; flicker: .033; chars: ᚠᚢᚦᚨᚱᚲᚷᚹᚺᚾᛁᛃᛇᛈᛉᛊᛏᛒᛖᛗᛚᛜᛞᛟ" data-label="Entry message, one English line">Step inside. You are awaited.</p>
  <svg class="cs-gate__dot" viewBox="0 0 32 32" aria-hidden="true"><circle class="cs-gate__ring" cx="16" cy="16" r="6"/><circle class="cs-gate__core" cx="16" cy="16" r="2.6"/></svg>
  <div class="cs-gate__consent">
    <p class="cs-gate__line">This site can remember your visit. Put a one-line notice about the record here. <a href="#">Privacy policy</a></p>
    <i class="cs-gate__rule"></i>
    <div class="cs-gate__doors">
      <button class="cs-door-btn" type="button" data-enter="loud">
        <svg viewBox="0 0 34 46" aria-hidden="true"><path class="cs-door-btn__arch" d="M3 45V17Q17-6 31 17V45Z"/><circle class="cs-door-btn__handle" cx="24" cy="30" r="1.4"/></svg>
        <span class="cs-door-btn__name">Enter</span>
        <span class="cs-door-btn__hint">We remember your visit</span>
      </button>
      <i class="cs-gate__sep"></i>
      <button class="cs-door-btn cs-door-btn--quiet" type="button" data-enter="quiet">
        <svg viewBox="0 0 34 46" aria-hidden="true"><path class="cs-door-btn__arch" d="M3 45V17Q17-6 31 17V45Z"/></svg>
        <span class="cs-door-btn__name">Enter quietly</span>
        <span class="cs-door-btn__hint">Leaves no trace</span>
      </button>
    </div>
  </div>
</div>

<div class="cs-pre" data-slot="loader" data-fx="rune-title-loader" data-fx-rune-title-loader="hold: 3000; gate: wait">
  <canvas class="cs-pre__bg" width="1600" height="900" data-label="Loader background video · Gothic castle silhouette on a moonlit hill · dry branches in front · 16:9 · 6s loop"></canvas>
  <div class="cs-pre__vignette"></div>
  <div class="cs-pre__grain"></div>
  <div class="cs-pre__frame"><i></i><i></i><i></i><i></i></div>
  <div class="cs-pre__content">
    <p data-fx-part="caption">— Part I —</p>
    <h1 data-fx-part="title" data-label="Welcome line in English">Welcome to the hall</h1>
    <div data-fx-part="track"><div data-fx-part="bar"></div></div>
    <p data-fx-part="sub" data-label="Studio English subtitle">Feel the studio</p>
  </div>
</div>

<script src="../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../_fx/panorama-look/three-global.js"></script>
<script src="../_vendor/three@0.184.0/build/three.cjs"></script>
<script src="../_fx/fx-core.js"></script>
<script src="../_fx/panorama-look/fx.js"></script>
<script src="../_fx/scramble-magnet-link/fx.js"></script>
<script src="../_fx/rune-title-loader/fx.js"></script>
<script src="../_fx/text-scramble/fx.js"></script>
<script src="../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="shared.js"></script>
<script src="index.js"></script>
<script src="../../_shared/wire.js"></script>
</body>
</html>
