<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>News list · three-column news cards on white paper over an orange background</title>
<link rel="stylesheet" href="../../_shared/wire.css">
<link rel="stylesheet" href="../../_shared/kf-defaults.css">
<link rel="stylesheet" href="../_fx/studio-appear/fx.css">
<link rel="stylesheet" href="../_fx/marquee/fx.css">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="news.css">
</head>
<body data-page="news">

<header data-slot="header"></header>

<main class="kd-sub">
  <div class="kd-pagehead" data-slot="page-head">
    <span class="wf-note">Sub section header · white text on orange · name + giant English + breadcrumbs</span>
    <div>
      <p class="kd-label">Your section name here</p>
      <h1 class="kd-title">NEWS</h1>
      <nav class="kd-crumbs" aria-label="Current location"><a href="index.html">First</a><i></i><span aria-current="page">News List</span></nav>
    </div>
  </div>
  <section class="kd-sheet" data-slot="news-grid">
    <span class="wf-note">News list · three-slot cards inside white paper (corner 32) · dotted lines between slots · on hover the photo scales 1.1x + the orange arrow nudges 8px</span>
    <ul class="kd-news-grid"></ul>
    <div class="kd-sheet__peek" data-fx="studio-appear" data-fx-studio-appear="look: grow; at: 100"><svg class="kd-bob" viewBox="0 0 120 150"><use href="#kd-buddy"/></svg></div>
  </section>
</main>

<footer data-slot="footer"></footer>

<template id="kd-news-card">
  <li><a class="kd-ncard" href="article.html">
    <div class="kd-photo kd-ncard__photo"><div class="wf-img" data-label="Event notice graphic · large text + photo of people · landscape 341×200"></div></div>
    <div class="kd-ncard__meta"><time class="kd-date">2026.00.00 Thu</time><span class="kd-tag">Notice</span></div>
    <p class="kd-ncard__title">Your news title here</p>
    <i class="kd-dot kd-ncard__go"><svg class="kd-arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></i>
  </a></li>
</template>

<script src="../_fx/fx-core.js"></script>
<script src="../_fx/marquee/fx.js"></script>
<script src="../_fx/studio-appear/fx.js"></script>
<script src="shared.js"></script>
<script src="news.js"></script>
<script src="../../_shared/wire.js"></script>
</body>
</html>
