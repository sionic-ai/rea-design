<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>News · Category tabs and a load-more list</title>
<link rel="stylesheet" href="../../_shared/wire.css">
<link rel="stylesheet" href="../../_shared/kf-defaults.css">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="news.css">
</head>
<body data-page="news">

<header data-slot="header"></header>

<div class="kd-container">
  <div class="kd-main">
    <ul class="kd-crumb"><li><a href="index.html">First Page</a></li><li><span>News</span></li></ul>
    <div class="kd-lower kd-inner" data-slot="news-list">
      <h1 class="kd-ttl"><span>NEWS</span>News</h1>
      <span class="wf-note">Clicking a category tab floats up that list in .3s · after 11 items, ”Load more” adds 12 at a time (.1s)</span>
      <div class="kd-tabs" role="tablist">
        <button class="kd-tabs__btn" type="button" data-id="all">Entire</button>
        <button class="kd-tabs__btn" type="button" data-id="news">News</button>
        <button class="kd-tabs__btn" type="button" data-id="progress">Commemorative Projects News</button>
        <button class="kd-tabs__btn" type="button" data-id="event">Event<br class="kd-sp">Report</button>
      </div>
      <div class="kd-news-blocks">
        <div class="kd-news-block" data-n="30" data-kinds="news,news,news,progress,event"></div>
        <div class="kd-news-block" data-n="16" data-kinds="news"></div>
        <div class="kd-news-block" data-n="22" data-kinds="progress"></div>
        <div class="kd-news-block" data-n="1" data-kinds="event"></div>
      </div>
    </div>
  </div>
  <footer data-slot="footer"></footer>
</div>

<script src="../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="shared.js"></script>
<script src="news.js"></script>
<script src="../../_shared/wire.js"></script>
</body>
</html>
