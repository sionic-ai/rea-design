<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Interview list · job filter and load more</title>
<link rel="stylesheet" href="../../_shared/wire.css">
<link rel="stylesheet" href="../../_shared/kf-defaults.css">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="list.css">
</head>
<body class="ty" data-page="list">

<main>
  <section class="ty-lower" data-slot="page-head">
    <span class="wf-note">After .5s each letter bounces ±5° · English letters bounce in one of seven colors</span>
    <div>
      <h1 class="ty-lower__title -en ty-split">Interview</h1>
      <p class="ty-lower__ja ty-split">Interview</p>
    </div>
    <nav class="ty-crumb" aria-label="Current location"><ol><li><a href="index.html">TOP</a></li><li>Interview</li></ol></nav>
  </section>

  <div class="ty-ilist" data-slot="interview-grid">
    <span class="wf-note">Filter = Cards drop out and return with a .1s stagger at .8 scale and .5s transparency power4.out · load 9 more at a time</span>
    <div class="ty-filter" data-slot="filter">
      <p class="ty-filter__title -en">Filter</p>
      <div class="ty-filter__btns" role="group" aria-label="Job Filter">
        <button type="button" class="ty-filter__btn is-active" data-filter="all" aria-current="true"><span class="ty-btn__text"><span class="ty-btn__inner -en">All</span></span></button>
        <button type="button" class="ty-filter__btn" data-filter="Role 1" aria-current="false"><span class="ty-btn__text"><span class="ty-btn__inner">Role 1</span></span></button>
        <button type="button" class="ty-filter__btn" data-filter="Role 2" aria-current="false"><span class="ty-btn__text"><span class="ty-btn__inner">Role 2</span></span></button>
        <button type="button" class="ty-filter__btn" data-filter="Role 3" aria-current="false"><span class="ty-btn__text"><span class="ty-btn__inner">Role 3</span></span></button>
      </div>
    </div>
    <ul class="ty-ilist__grid" data-grid></ul>
    <button type="button" class="ty-btn -en ty-ilist__more" data-more><span class="ty-btn__text"><span class="ty-btn__inner">Load More</span></span></button>
  </div>
</main>

<div data-ty-footer="lower"></div>

<script src="../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="interviews.js"></script>
<script src="shared.js"></script>
<script src="list.js"></script>
<script src="../../_shared/wire.js"></script>
</body>
</html>
