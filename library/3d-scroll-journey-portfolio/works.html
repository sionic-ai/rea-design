<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Work · 3D journey portfolio behind an entrance door</title>
<link rel="stylesheet" href="../../_shared/wire.css">
<link rel="stylesheet" href="../../_shared/kf-defaults.css">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="shared.css">
</head>
<body data-page="works" data-start="works">

<div class="ae-stage" data-stage aria-hidden="true"></div>
<div class="ae-fade" aria-hidden="true"></div>
<div data-slot="loader-gate"></div>
<nav data-slot="nav"></nav>
<div data-slot="veil"></div>

<main class="ae-track">
  <section data-scene="works" data-slot="crystal-projects"></section>
</main>

<div class="ae-hud ae-discover" data-slot="project-title" data-visible="false">
  <h2 class="ae-discover__title" data-label="Your work (client) English name here — changes to the name in the list below with each flip"><span class="is-under">Project Name 01</span><span class="is-front">Project Name 01</span></h2>
  <button class="ae-discover__btn" type="button">Explore work<span class="ae-arrowbox"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M2 2l8 8M10 3.5V10H3.5"/></svg><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M2 2l8 8M10 3.5V10H3.5"/></svg></span></button>
</div>
<div class="ae-hud ae-count" data-slot="project-count" data-visible="false">
  <p class="ae-count__n"><span class="ae-count__cur"><span class="ae-roll"><span>0</span><span>0</span></span><span class="ae-roll"><span>1</span><span>1</span></span></span><span class="ae-count__total">/ 06</span></p>
  <button class="ae-count__next" type="button"><span class="ae-arrowbox"><svg viewBox="0 0 6 11" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M1 1l4 4.5L1 10"/></svg><svg viewBox="0 0 6 11" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M1 1l4 4.5L1 10"/></svg></span>Next project</button>
</div>
<div class="ae-hud ae-drag" data-slot="drag-hint" data-visible="false" aria-hidden="true">
  <div class="ae-drag__col"><div class="ae-drag__row"><svg class="ae-drag__arrow is-l" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M6.5 1.5L3 5l3.5 3.5"/></svg><svg class="ae-drag__hand" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11V4.5a1.5 1.5 0 0 1 3 0V10"/><path d="M12 9.5a1.5 1.5 0 0 1 3 0V11"/><path d="M15 10.5a1.5 1.5 0 0 1 3 0V15a6 6 0 0 1-6 6h-1a6 6 0 0 1-5-2.7L4 15a1.5 1.5 0 0 1 2.4-1.8L9 15"/></svg><svg class="ae-drag__arrow is-r" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M6.5 1.5L3 5l3.5 3.5"/></svg></div><p class="ae-drag__label">Drag to pass work along</p></div>
</div>
<!-- Six works flipped in front of a crystal. data-hue is the hue shift (0~1) of the light inside the crystal -->
<ol class="ae-projects" hidden data-label="Your six English work names here (client or project names)">
  <li data-hue="0">Project Name 01</li>
  <li data-hue=".06">Project Name 02</li>
  <li data-hue=".18">Project Name 03</li>
  <li data-hue=".43">Project Name 04</li>
  <li data-hue="-.08">Project Name 05</li>
  <li data-hue=".3">Project Name 06</li>
</ol>

<script src="../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../_vendor/lenis@1.3.26/lenis.min.js"></script>
<script>window.exports = {};</script>
<script src="../_vendor/three@0.184.0/build/three.cjs"></script>
<script>window.THREE = window.exports; delete window.exports;</script>
<script src="stage.js"></script>
<script src="shared.js"></script>
<script src="../../_shared/wire.js"></script>
</body>
</html>
