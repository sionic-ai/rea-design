<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact · cloud-scroll kimono shop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Antique+B1&family=Shippori+Mincho+B1:wght@400;700&family=Gowun+Batang&family=Gowun+Dodum&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../_shared/wire.css">
<link rel="stylesheet" href="../../_shared/kf-defaults.css">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="contact.css">
</head>
<body data-page="contact" class="is-sub">

<header data-slot="header"></header>

<main>
  <p class="kb-word" aria-hidden="true">Contact</p>
  <section class="kb-section kb-sub" data-slot="contact-form">
    <span class="wf-note">Contact · label 30% | input 70% rows · confirm-content button (does not send)</span>
    <div class="kb-box">
      <p class="kb-tab"><span>Inquiry</span></p>
      <div class="kb-sub__inner is-contact">
        <p class="kb-form__text">After entering below, press the confirm button<br>Please press. (<b class="kb-form__strong">*</b>must be used)</p>
        <form class="kb-form" onsubmit="return false">
          <label class="kb-form__block"><span class="kb-form__label">Name<b class="kb-form__strong">*</b></span><input class="kb-form__input" type="text" placeholder="(e.g.) Name 0"></label>
          <label class="kb-form__block"><span class="kb-form__label">How to read<b class="kb-form__strong">*</b></span><input class="kb-form__input" type="text" placeholder="(e.g.) Early"></label>
          <label class="kb-form__block"><span class="kb-form__label">Email address<b class="kb-form__strong">*</b></span><input class="kb-form__input" type="email" placeholder="(e.g.) name@mail.com"></label>
          <label class="kb-form__block"><span class="kb-form__label">Phone number<b class="kb-form__strong">*</b></span><input class="kb-form__input" type="tel" placeholder="(e.g.) 000-0000-0000"></label>
          <label class="kb-form__block is-start"><span class="kb-form__label">Contact message<b class="kb-form__strong">*</b></span><textarea class="kb-form__input" rows="6" placeholder="Please describe your inquiry."></textarea></label>
          <button class="kb-btn" type="submit"><span>To content check</span></button>
        </form>
      </div>
    </div>
  </section>
</main>

<footer data-slot="footer"></footer>

<script src="../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="shared.js"></script>
<script src="../../_shared/wire.js"></script>
<!-- Like the original (WordPress), the next page is preloaded the moment a link is pressed -->
<script type="speculationrules">{"prefetch":[{"source":"document","where":{"href_matches":"/*"},"eagerness":"conservative"}]}</script>
</body>
</html>
