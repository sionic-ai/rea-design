<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>News·Topics · black-and-white fashion department site with torn-paper edges</title>
<link rel="stylesheet" href="../../_shared/wire.css">
<link rel="stylesheet" href="../../_shared/kf-defaults.css">
<link rel="stylesheet" href="../_vendor/swiper@12.0.3/swiper-bundle.min.css">
<link rel="stylesheet" href="../_fx/line-redraw-hover/fx.css">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="news.css">
</head>
<body data-page="news">

<div class="yf-loader" data-slot="loader" aria-hidden="true"><div class="yf-loader__inner">
  <div class="yf-loader__logo"><svg viewBox="0 0 182 30"><path d="M2 26V9l7 6 6-9 6 9 7-6v17Z" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/><text x="36" y="22" font-size="19" font-weight="700" fill="currentColor" style="font-family: var(--kf-font-sans)">School name here</text></svg></div>
  <p class="yf-loader__text"><span class="en">Fashion Creator Dept.</span><span class="jp">Fashion creator department</span></p>
</div></div>

<header data-slot="header"></header>

<main class="yf-sub">
  <h1 class="yf-h1" data-slot="page-head"><span class="yf-h1__en yf-en">NewsTopics</span><span class="yf-h1__jp yf-min">News · Topics</span></h1>
  <section class="yf-newslist" data-slot="news-grid">
    <p class="yf-newslist__tags">Tags: <a class="is-current" href="#" data-fx="line-redraw-hover" data-fx-line-redraw-hover="look: always">Entire</a><a href="#" data-fx="line-redraw-hover">Event</a><a href="#" data-fx="line-redraw-hover">Open Campus</a><a href="#" data-fx="line-redraw-hover">Notice</a><a href="#" data-fx="line-redraw-hover">Graduate</a></p>
    <ul class="yf-newslist__grid"></ul>
  </section>
  <ol class="yf-crumbs" data-slot="breadcrumbs"><li><a href="index.html" data-fx="line-redraw-hover" data-fx-line-redraw-hover="look: always">HOME</a></li><li>News · Topics</li></ol>
</main>
<script>
  // Sixteen News cards — same type
  document.querySelector(".yf-newslist__grid").innerHTML = Array.from({ length: 16 }, (_, i) => {
    const tag = ["Open Campus", "Admissions", "News", "Event"][i % 4];
    // The original tags (red bands stamped on photos) mix uppercase English bands and kana bands, so alternate them
    const red = i % 3 !== 0 ? "" : i % 6 === 0
      ? `<span class="yf-newslist__label" data-label="Event tag in English · red band over the photo here">EVENT NAME HERE</span>`
      : `<span class="yf-newslist__label -ko" data-label="Your event tag text here · red band over the photo.">Your tag text here</span>`;
    return `<li><article class="yf-card"><a href="#"><div class="yf-card__thumb${i % 3 === 0 ? "" : " is-plate"}">${red}<div class="wf-img" data-label="${i % 3 === 0 ? "Event Photo · B&W" : "School logo spot · ink-black panel"} · Landscape 16:9"></div></div><time>2026/00/00</time><p class="yf-card__title">Your News title $ here{i + 1} — Fits up to two lines</p></a><ul class="yf-tags"><li>${tag}</li><li>News</li></ul></article></li>`;
  }).join("");
</script>

<footer data-slot="footer"></footer>

<script src="../_vendor/swiper@12.0.3/swiper-bundle.min.js"></script>
<script src="../_fx/fx-core.js"></script>
<script src="shared.js"></script>
<script src="../../_shared/wire.js"></script>
</body>
</html>
