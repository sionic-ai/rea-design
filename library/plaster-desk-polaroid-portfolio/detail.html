<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">

  <link rel="stylesheet" href="../../_shared/wire.css">
  <link rel="stylesheet" href="../../_shared/kf-defaults.css">

<body data-page="detail">
  <!-- One work: at the top desk, the work’s site screens are reflected as a curved band (flows sideways by wheel · drag), below are the large name · description · pills, and inside the cell the work’s polaroid -->
  <main class="tg-stage" data-slot="desk" data-fx="polaroid-desk-gl" data-fx-polaroid-desk-gl="size: .097; msize: .277; wind: off">
    <div class="tg-hud" data-slot="hud">
      <a class="tg-name tg-rv" style="--i:0" href="index.html" data-label="Name in English, two lines">Studio
Name</a>
      <button class="tg-sound tg-rv" style="--i:0" type="button" aria-pressed="true" aria-label="Toggle sound off and on"><svg viewBox="0 0 38 18" aria-hidden="true"><path d=""/></svg></button>
      <a class="tg-close tg-rv" style="--i:0" href="work.html" aria-label="Close">X</a>
      <div class="tg-screens" data-slot="screen-strip" aria-label="Work screen strip — flip with the wheel or drag">
        <span data-screen data-label="Work site first-screen capture · globe on a light background · landscape 16:10" data-head="A headline over" data-head2="two short lines"></span>
        <span data-screen data-label="Work site About section capture · blue photo · landscape 16:10" data-head="Who we are"></span>
        <span data-screen data-label="Work site product list capture · mineral photos on white · landscape 16:10" data-head="What we do"></span>
        <span data-screen data-label="Work site map section capture · light gray · landscape 16:10" data-head="Our reach"></span>
        <span data-screen data-label="Work site Footer section capture · dark background · landscape 16:10" data-head="Get in touch"></span>
      </div>
      <h1 class="tg-project" data-slot="project-title" data-label="Work name, English caps"><span class="tg-rv" style="--i:1">Project A</span></h1>
      <div class="tg-meta" data-slot="project-meta">
        <p class="tg-meta__text tg-rv" style="--i:1">Your introduction of the work in a line and a half here.</p>
        <div class="tg-pills tg-rv" style="--i:2" data-label="Places, fields, years worked together · English">
          <span class="tg-pill tg-pill--fill"><span class="tg-wide">Built at&nbsp;</span>Agency Name</span>
          <span class="tg-pills__row"><span class="tg-pill">Web</span><span class="tg-pill">3D</span><span class="tg-pill">2026</span><a class="tg-pill tg-pill--round" href="#" aria-label="Open work site"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 9.5 9.5 2.5M4 2.5h5.5V8" fill="none" stroke="currentColor" stroke-width="1.6"/></svg></a></span>
        </div>
      </div>
    </div>
    <a data-fx-part="card" data-slot="project-card" href="work.html" data-well data-caption="Project A" data-title="Project A" data-label="Work cover shot · mineral chunk on a white background · square">Back to work list</a>
    <div data-fx-part="well" data-slot="drop-well" data-x=".859" data-y=".769" data-w=".149" data-h=".31" data-mx=".733" data-my=".864" data-mw=".39" data-mh=".211"></div>
    <button class="tg-view" type="button" data-label="Enlarge video button (hidden on screen)">View the experience in motion, full screen</button>
  </main>
  <div class="tg-viewer" data-slot="media-viewer" hidden>
    <div class="tg-viewer__stage wf-img wf-r-16x9" data-label="Work site screen recording video · hero moving as you scroll · landscape 16:9"></div>
    <button class="tg-viewer__close" type="button" aria-label="Close">X</button>
  </div>
  <div class="tg-gobo" data-slot="leaf-shadow" data-fx="leaf-gobo-shadow" data-fx-leaf-gobo-shadow="shift: 35; from: .35; mx: 1.05; my: .5"></div>
  <div class="tg-loader" data-slot="loader" data-fx="bracket-odometer-loader" data-fx-bracket-odometer-loader="min: .6" aria-hidden="true">
    <p data-fx-part="mark">Studio
Name</p>
    <span data-fx-part="focus"></span>
    <p data-fx-part="readout"><span>ISO 100</span><span>f/8</span><span>1/125</span></p>
  </div>

  <script src="../../_shared/vendor/gsap/gsap.min.js"></script>
  <script src="../../_shared/vendor/gsap/CustomEase.min.js"></script>
  <script src="../_fx/coin-drop-physics/three-global.js"></script>
  <script src="../_vendor/three@0.174.0/build/three.cjs"></script>
  <script src="../_fx/fx-core.js"></script>
  <script src="../_fx/bracket-odometer-loader/fx.js"></script>
  <script src="../_fx/leaf-gobo-shadow/fx.js"></script>
  <script src="../_fx/polaroid-desk-gl/fx.js"></script>
  <script src="shared.js"></script>
  <script src="detail.js"></script>
  <script src="../../_shared/wire.js"></script>
</body>
</html>
