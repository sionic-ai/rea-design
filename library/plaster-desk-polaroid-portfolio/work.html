<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Selected Work — Studio Name</title>
  <link rel="stylesheet" href="../../_shared/wire.css">
  <link rel="stylesheet" href="../../_shared/kf-defaults.css">
  <link rel="stylesheet" href="theme.css">

<body data-page="work">
  <!-- Work list: six Polaroids line up in a row, and the name of the hovered work appears in big letters on the floor behind them -->
  <main class="tg-stage" data-slot="desk" data-fx="polaroid-desk-gl" data-fx-polaroid-desk-gl="size: .101; msize: .285; title: on; title-y: .322">
    <div class="tg-hud" data-slot="hud">
      <a class="tg-name tg-rv" style="--i:0" href="index.html" data-label="Name in English, two lines">Studio
Name</a>
      <button class="tg-sound tg-rv" style="--i:0" type="button" aria-pressed="true" aria-label="Toggle sound off and on"><svg viewBox="0 0 38 18" aria-hidden="true"><path d=""/></svg></button>
      <a class="tg-close tg-rv" style="--i:0" href="index.html" aria-label="Close">X</a>
      <h1 class="tg-sr">Selected Work</h1>
    </div>
    <a data-fx-part="card" data-slot="work-row" href="detail.html" data-x=".186" data-y=".475" data-r="-4" data-mx=".328" data-my=".29" data-mr="-3" data-caption="Project A" data-title="Project A" data-label="Work cover shot · mineral chunk on a white background · square">Work 1</a>
    <a data-fx-part="card" href="detail.html" data-x=".312" data-y=".475" data-r="0" data-mx=".674" data-my=".29" data-mr="2" data-caption="Project B" data-title="Project B" data-label="Work cover cut · navy game screen · large text">Work 2</a>
    <a data-fx-part="card" href="detail.html" data-x=".436" data-y=".475" data-r="1" data-mx=".328" data-my=".48" data-mr="2" data-caption="Project C" data-title="Project C" data-label="Work cover shot · 3D exhibition booth · purple lighting">Work 3</a>
    <a data-fx-part="card" href="detail.html" data-x=".561" data-y=".475" data-r="2" data-mx=".674" data-my=".48" data-mr="-2" data-caption="Project D" data-title="Project D" data-label="Work lead shot · bright store furniture · square">Work 4</a>
    <a data-fx-part="card" href="detail.html" data-x=".687" data-y=".475" data-r="2" data-mx=".328" data-my=".67" data-mr="-3" data-caption="Project E" data-title="Project E" data-label="Work main shot · green sports car · dark studio">Work 5</a>
    <a data-fx-part="card" href="detail.html" data-x=".8125" data-y=".475" data-r="4" data-mx=".674" data-my=".67" data-mr="3" data-caption="Project F" data-title="Project F" data-label="Work lead shot · red maple tree · sunset light">Work 6</a>
    <div data-fx-part="well" data-slot="drop-well" data-x=".859" data-y=".769" data-w=".149" data-h=".31" data-mx=".733" data-my=".864" data-mw=".39" data-mh=".211"></div>
  </main>
  <div class="tg-gobo" data-slot="leaf-shadow" data-fx="leaf-gobo-shadow" data-fx-leaf-gobo-shadow="shift: 35; from: .35; mx: 1.05; my: .5"></div>
  <div class="tg-loader" data-slot="loader" data-fx="bracket-odometer-loader" data-fx-bracket-odometer-loader="min: .6" aria-hidden="true">
    <p data-fx-part="mark">Studio
Name</p>
    <span data-fx-part="focus"></span>
    <p data-fx-part="readout"><span>ISO 100</span><span>f/8</span><span>1/125</span></p>
  </div>

  <script src="../../_shared/vendor/gsap/gsap.min.js"></script>
