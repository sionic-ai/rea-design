<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home · music label hero converging into RGB noise</title>
<link rel="stylesheet" href="../../_shared/wire.css">
<link rel="stylesheet" href="../../_shared/kf-defaults.css">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="../_fx/rgb-noise-settle/fx.css">
<link rel="stylesheet" href="../_fx/char-cycle-up-hover/fx.css">
<link rel="stylesheet" href="../_fx/ellipse-arrow-cursor/fx.css">
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="index.css">
</head>
<body data-page="home" class="is-top" data-fx="ellipse-arrow-cursor" data-fx-ellipse-arrow-cursor="show: none">

<header data-slot="header"></header>
<div data-slot="menu-ellipse"></div>

<main>
  <section class="al-mv" data-slot="hero-noise-photo" data-fx="rgb-noise-settle" data-fx-rgb-noise-settle="on: load; delay: 0.5; dur: 2; spread: 0.1 0.5 1; rate: 1; narrow: 835">
    <span class="wf-note">Hero · the full-bleed photo (three) gathers from RGB noise after .5s over 2s circ.out · logo 1.15→1 6s · tagline typed at 50ms · header line drops in 2s</span>
    <canvas class="al-mv__ph" data-fx-part="image" width="1920" height="1080" data-label="Underwater photo of a jellyfish swarm · red and blue light shafts from above · dark sea · landscape 16:9"></canvas>
    <canvas class="al-mv__ph" data-fx-part="image-narrow" width="780" height="1338" data-label="Underwater photo of a jellyfish swarm (phone) · light shafts · portrait 1560×2676"></canvas>
    <h1 class="al-mv__logo al-logo" data-label="Brand logo — four sharply split brush strokes + small Studio below (original art 800:255)">
      <svg viewBox="0 0 800 255" role="img" aria-label="Studio Name"><text class="w" x="400" y="170" text-anchor="middle" textLength="760" lengthAdjust="spacingAndGlyphs">NAME</text><text class="s" x="400" y="245" text-anchor="middle">STUDIO</text></svg>
    </h1>
    <p class="al-mv__state" data-type="A short tagline , in four , quick parts , all." data-label="One-line English tagline — four items joined by commas"></p>
  </section>
</main>

<section class="al-loader" data-slot="loader" aria-hidden="true">
  <p class="al-loader__txt">Loading.</p>
</section>

<script src="../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../_vendor/three@0.141.0/build/three.min.js"></script>
<script src="../_vendor/ityped@1.0.3/ityped.min.js"></script>
<script src="../_fx/fx-core.js"></script>
<script src="../_fx/rgb-noise-settle/fx.js"></script>
<script src="../_fx/char-cycle-up-hover/fx.js"></script>
<script src="../_fx/ellipse-arrow-cursor/fx.js"></script>
<script src="shared.js"></script>
<script src="index.js"></script>
<script src="../../_shared/wire.js"></script>
</body>
</html>
