<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact · focus-bracket product company</title>
<link rel="stylesheet" href="../../_shared/wire.css">
<link rel="stylesheet" href="../../_shared/kf-defaults.css">
<link rel="stylesheet" href="../_fx/band-paint-text/fx.css">
<link rel="stylesheet" href="../_fx/line-rise/fx.css">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="contact.css">
</head>
<body data-page="contact">
<div class="ts-wrap">
<header data-slot="header"></header>

<main class="ts-main">
  <section class="ts-ptitle" data-hero data-slot="page-title">
    <h1>CONTACT</h1>
    <span>Inquiry</span>
  </section>

  <section class="ct-intro" data-slot="download-intro">
    <p class="ct-intro__txt">One line here on what visitors can ask about,<br>A single line on requesting materials and samples,<br>Add one line saying feel free to get in touch.</p>
    <div class="ct-intro__link"><a class="ct-pill" href="#">Download all materials at once<svg viewBox="0 0 18 17" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M9 1v10M4.5 6.5 9 11l4.5-4.5M1.5 11v4.5h15V11"/></svg></a></div>
  </section>

  <section class="ct-form" data-slot="mail-form">
    <form onsubmit="return false" novalidate>
      <div class="ct-form__wrap">
        <div class="ct-form__left"><p>* marks a required field</p></div>
        <div class="ct-form__right">
          <div class="ct-form__input">
            <dl><dt><label for="ct-type">Contact item *</label></dt><dd><div class="ct-select"><select id="ct-type" required><option value="">Choose from below</option><option>Contact item 1</option><option>Contact item 2</option><option>Contact item 3</option><option>Contact item 4</option><option>Others</option></select></div></dd></dl>
            <dl><dt><label for="ct-company">Company or organization name *</label></dt><dd><div class="ct-input"><input id="ct-company" type="text" placeholder="Company name" required></div></dd></dl>
            <dl><dt><label for="ct-address">Address *</label></dt><dd><div class="ct-input"><input id="ct-address" type="text" placeholder="Your address example 00-00 here" required></div></dd></dl>
            <dl><dt><label for="ct-name">Name *</label></dt><dd><div class="ct-input"><input id="ct-name" type="text" placeholder="Name" required></div></dd></dl>
            <dl><dt><label for="ct-mail">Email address *</label></dt><dd><div class="ct-input"><input id="ct-mail" type="email" placeholder="info@example.com" required></div></dd></dl>
            <dl><dt><label for="ct-detail">Contact details *</label></dt><dd><div class="ct-textarea"><textarea id="ct-detail" placeholder="Your sample inquiry line here.&#10;Write a sample request on the second line." required></textarea></div></dd></dl>
          </div>
          <div class="ct-form__privacy">
            <label><input type="checkbox" data-privacy><span></span></label>
            <p><a href="#">Privacy policy</a>I agree to</p>
          </div>
        </div>
      </div>
      <div class="ct-form__btn"><button type="submit" data-submit disabled><span class="ts-en">To the confirm screen</span></button></div>
    </form>
  </section>
</main>

<footer data-slot="footer"></footer>
</div>

<script src="../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../../_shared/vendor/gsap/CustomEase.min.js"></script>
<script src="../_vendor/lenis@1.1.18/lenis.min.js"></script>
<script src="../_fx/fx-core.js"></script>
<script src="../_fx/band-paint-text/fx.js"></script>
<script src="../_fx/line-rise/fx.js"></script>
<script src="shared.js"></script>
<script>
  // Tick the consent box to enable the send button (original data-privacy → data-submit-btn)
  document.querySelector("[data-privacy]").addEventListener("change", (e) => { document.querySelector("[data-submit]").disabled = !e.target.checked; });
</script>
<script src="../../_shared/wire.js"></script>
</body>
</html>
