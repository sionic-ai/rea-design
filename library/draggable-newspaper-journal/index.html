<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home · draggable newspaper layout</title>
<link rel="stylesheet" href="../../_shared/wire.css">
<link rel="stylesheet" href="../../_shared/kf-defaults.css">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="index.css">
</head>
<body data-page="home" class="is-home">

<header data-slot="header"></header>

<main id="home" class="fc-main">
  <span class="wf-note">Dragging the canvas (stops at the edges) · wheel moves vertical deltaY×0.5 · +/− zoom steps .3s ease · title band hover .35s, text .3</span>
  <div class="fc-wrap js-wrap" data-slot="explore-grid">
    <div class="fc-overlay js-overlay"></div>
    <div class="fc-grid js-grid">
      <div class="fc-cover" data-slot="cover-card" style="top:calc(var(--u)*103.8);left:calc(var(--u)*114.2)">
        <div class="fc-cover__img">
          <div class="js-emblem"></div>
          <video class="fc-cover__video" muted loop playsinline data-src="media/placeholder.mp4" data-label="Cover · looping video of a sparkling woodcut print · black and white · portrait 5:8"></video>
        </div>
        <button class="fc-cover__btn fc-paper js-menu" type="button"><span class="fc-cover__btn-in"><span class="fc-cover__btn-txt">Article list goes here<small>Table of Contents</small></span></span><i class="fc-arrow" aria-hidden="true"></i></button>
      </div>
      <article class="fc-block" data-n="001" data-ttl="25.5,0" data-w="48" data-h="42.5" data-title="Look slowly, read here" data-href="article.html" style="top:calc(var(--u)*15.8);left:calc(var(--u)*15.5)"></article>
      <article class="fc-block" data-n="007" data-ttl="17,24" data-w="72" data-h="42.5" data-title="Your short title No.3 here" data-href="article.html" style="top:calc(var(--u)*15.8);left:calc(var(--u)*65)"></article>
      <article class="fc-block" data-n="003" data-ttl="25.5,24" data-w="72" data-h="42.5" data-title="Discovering the origins of ”Here”" data-href="article.html" style="top:calc(var(--u)*15.8);left:calc(var(--u)*162.5)"></article>
      <article class="fc-block" data-n="009" data-ttl="17,0" data-w="72" data-h="42.5" data-title="See it here, read it here" data-href="article.html" data-new="1" style="top:calc(var(--u)*59.8);left:calc(var(--u)*65)"></article>
      <article class="fc-block" data-n="006" data-ttl="25.5,0" data-w="96" data-h="42.5" data-title="Searching for the big headline ”here”" data-href="article.html" style="top:calc(var(--u)*59.8);left:calc(var(--u)*138.5)"></article>
      <article class="fc-block" data-n="004" data-ttl="17,0" data-w="48" data-h="42.5" data-title="Your article title here" data-href="article.html" style="top:calc(var(--u)*76.8);left:calc(var(--u)*15.5)"></article>
      <article class="fc-block" data-n="008" data-ttl="17,0" data-w="48" data-h="42.5" data-title="“Here” title placeholder No.4" data-href="article.html" data-new="1" style="top:calc(var(--u)*103.8);left:calc(var(--u)*65)"></article>
      <article class="fc-block" data-n="010" data-ttl="17,24" data-w="96" data-h="42.5" data-title="Your ”Interview” title here?" data-href="dialogue.html" data-new="1" data-persons="1" style="top:calc(var(--u)*103.8);left:calc(var(--u)*138.5)"></article>
      <article class="fc-block" data-n="000" data-ttl="35.5,0" data-w="48" data-h="51" data-title="BRAND launch note" data-href="article.html" style="top:calc(var(--u)*120.8);left:calc(var(--u)*15.5)"></article>
      <article class="fc-block" data-n="011" data-ttl="17,24" data-w="72" data-h="42.5" data-title="Your social issue title here" data-href="article.html" data-new="1" style="top:calc(var(--u)*147.8);left:calc(var(--u)*65)"></article>
      <article class="fc-block" data-n="012" data-ttl="8.5,0" data-w="96" data-h="42.5" data-title="Introducing “Project Name Here”" data-href="article.html" data-new="1" style="top:calc(var(--u)*147.8);left:calc(var(--u)*138.5)"></article>
      <article class="fc-block" data-n="005" data-ttl="17,0" data-w="72" data-h="42.5" data-title="Your field × title here" data-href="article.html" style="top:calc(var(--u)*191.8);left:calc(var(--u)*65)"></article>
      <article class="fc-block" data-n="002" data-ttl="17,24" data-w="96" data-h="42.5" data-title="Your opening question title here?" data-href="article.html" style="top:calc(var(--u)*191.8);left:calc(var(--u)*138.5)"></article>
    </div>
  </div>

  <div class="fc-zoom js-zoom" data-slot="zoom-controls"><button class="fc-zoom__in js-zoom-in" type="button" aria-label="Zoom in"></button><button class="fc-zoom__out js-zoom-out" type="button" aria-label="Shrink"></button></div>

  <div class="fc-drag js-drag" data-slot="drag-hint">
    <div class="fc-drag__bg"></div>
    <div class="fc-drag__card js-drag-card is-active">
      <div class="fc-drag__icn">
        <svg class="fc-drag__arrow js-drag-arrow is-tl" viewBox="0 0 25 25" aria-hidden="true"><path d="M2 12V2h10M2 2l12 12"/></svg>
        <svg class="fc-drag__arrow js-drag-arrow is-tr" viewBox="0 0 25 25" aria-hidden="true"><path d="M13 2h10v10M23 2L11 14"/></svg>
        <svg class="fc-drag__arrow js-drag-arrow is-bl" viewBox="0 0 25 25" aria-hidden="true"><path d="M2 13v10h10M2 23l12-12"/></svg>
        <svg class="fc-drag__arrow js-drag-arrow is-br" viewBox="0 0 25 25" aria-hidden="true"><path d="M23 13v10H13M23 23L11 11"/></svg>
        <svg class="fc-drag__hand js-drag-hand" viewBox="0 0 100 110" aria-hidden="true"><path d="M30 60V18a7 7 0 0 1 14 0v34-12a7 7 0 0 1 14 0v14-8a7 7 0 0 1 14 0v12-4a7 7 0 0 1 14 0v22c0 22-12 34-32 34-14 0-22-6-30-18L14 64a7 7 0 0 1 11-9z"/></svg>
      </div>
      <p class="fc-drag__txt">Drag the screen<br>Browse the articles!</p>
    </div>
    <div class="fc-drag__card js-drag-card">
      <div class="fc-drag__icn is-wide">
        <svg class="fc-drag__grid" viewBox="0 0 194 160" aria-hidden="true"><rect x="2" y="2" width="150" height="110"/><path d="M2 40h150M2 76h150M64 2v110M110 40v72"/><rect class="fill" x="2" y="40" width="108" height="36"/><text x="56" y="64" text-anchor="middle">Founding note</text></svg>
        <svg class="fc-drag__hand is-click" viewBox="0 0 100 110" aria-hidden="true"><path d="M30 60V18a7 7 0 0 1 14 0v34-12a7 7 0 0 1 14 0v14-8a7 7 0 0 1 14 0v12-4a7 7 0 0 1 14 0v22c0 22-12 34-32 34-14 0-22-6-30-18L14 64a7 7 0 0 1 11-9z"/></svg>
      </div>
      <p class="fc-drag__txt">When You Click the Title<br>The article opens!</p>
    </div>
  </div>

  <div class="fc-loading fc-paper js-loading" data-slot="loader">
    <video class="fc-loading__video" muted loop autoplay playsinline src="media/placeholder.mp4" data-label="Looping video of the logo being drawn · monochrome · horizontal 4:3"></video>
  </div>
</main>

<script src="../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="shared.js"></script>
<script src="index.js"></script>
<script src="../../_shared/wire.js"></script>
</body>
</html>
