<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>News · company introduction on an open-book stage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,500;0,700;1,500;1,700&family=Shippori+Mincho:wght@500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../_shared/wire.css">
<link rel="stylesheet" href="../../_shared/kf-defaults.css">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="news.css">
</head>
<body data-page="news">
<div class="nsl-bg" aria-hidden="true"></div>

<main>
  <section class="nsl-pagehead" data-slot="page-head">
    <div class="nsl-pagehead__art" data-art="headNews"></div>
    <h1 class="nsl-title" data-type data-frames="8">NEWS</h1>
    <p class="nsl-sub ap">Your news here</p>
  </section>

  <div class="nsl-paper">
    <section class="nw" data-slot="news-list">
      <span class="wf-note">Pressing a row opens a white paper detail window over a mustard sheet · close with BACK</span>
      <div class="nw__list ap">
        <button class="nsl-news__row" type="button"><span class="nsl-news__d">0000.0.00</span><span class="nsl-news__t">Your News title here &nbsp;|&nbsp; Your work name here</span></button>
        <button class="nsl-news__row" type="button"><span class="nsl-news__d">0000.0.00</span><span class="nsl-news__t">Your News title here &nbsp;|&nbsp; Your slightly longer work title here</span></button>
        <button class="nsl-news__row" type="button"><span class="nsl-news__d">0000.0.00</span><span class="nsl-news__t">Your short news line here.</span></button>
      </div>
    </section>
  </div>

  <div class="bd nsl-end" data-slot="boundary-page-end" data-art="pageEnd"></div>
  <div class="bd nsl-to" data-slot="boundary-to-contact" data-art="toContact"></div>
  <section data-slot="contact"></section>
</main>

<header data-slot="header"></header>
<div class="nsl-grain" aria-hidden="true"></div>

<script src="../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="art.js"></script>
<script src="shared.js"></script>
<script src="../../_shared/wire.js"></script>
</body>
</html>
