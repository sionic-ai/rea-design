<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Work — motion and sound designer portfolio</title>
<script>sessionStorage.getItem("pp-nav") && document.documentElement.classList.add("pp-entering");</script>
<link rel="stylesheet" href="../../_shared/wire.css">
<link rel="stylesheet" href="../../_shared/kf-defaults.css">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="index.css">
</head>
<body data-page="index">
<div class="pp-grid" aria-hidden="true"></div>
<!-- A WebGL stage where 18 work panels (9 works × two laps) travel a cylindrical spiral — each panel gets a work thumbnail placeholder drawn on canvas -->
<canvas class="pp-webgl" data-slot="spiral-stage" aria-label="Work spiral — rotate with wheel or drag"></canvas>

<main class="pp-page">
  <div class="pp-switch" data-slot="view-switch">
    <div class="pp-switch-btn is-active"><button data-mode="spiral"><span>Spiral</span><span>Spiral</span></button></div>
    <span class="dot"></span>
    <div class="pp-switch-btn"><button data-mode="list"><span>List</span><span>List</span></button></div>
  </div>

  <section class="pp-list" data-slot="project-list" hidden>
    <div class="pp-list-row" data-i="0"><p><a href="#work-1">Your work title here</a></p></div>
    <div class="pp-list-row" data-i="1"><p><a href="#work-2">Your even longer work title here</a></p></div>
    <div class="pp-list-row" data-i="2"><p><a href="#work-3">Work title, third</a></p></div>
    <div class="pp-list-row" data-i="3"><p><a href="#work-4">Work Four</a></p></div>
    <div class="pp-list-row" data-i="4"><p><a href="#work-5">Work Five</a></p></div>
    <div class="pp-list-row" data-i="5"><p><a href="#work-6">Work number six</a></p></div>
    <div class="pp-list-row" data-i="6"><p><a href="#work-7">Work Title Seven</a></p></div>
    <div class="pp-list-row" data-i="7"><p><a href="#work-8">Brand work eight</a></p></div>
    <div class="pp-list-row" data-i="8"><p><a href="#work-9">Work title, ninth</a></p></div>
  </section>
  <!-- Hovering a list row makes a 16:9 thumbnail follow the cursor with lerp .1 (up to 5 stacked) -->
  <div class="pp-cursor-image is-hidden" data-slot="cursor-image" aria-hidden="true"></div>

  <!-- Hover the spiral board and the work name shows in a white pill at bottom center -->
  <div class="pp-hover" data-slot="project-hover" aria-live="polite">
    <div class="pp-hover-content">
      <div class="pp-hover-infos"><div class="wf-img" data-label=""></div><h4>Your work title here</h4></div>
    </div>
  </div>

  <!-- Hero door: after Lottie (greeting → name → face), two intro lines drop in, then an enter button -->
  <div class="pp-loader" data-slot="loader-gate">
    <div class="pp-loader-lottie">
      <div class="pp-loader-anim"></div>
      <span class="pp-loader-cap" data-from="3" data-to="49">Hello!</span>
      <span class="pp-loader-cap is-low" data-from="54" data-to="76">I am ○○○</span>
    </div>
    <p class="pp-loader-text">Motion & sound designer<br>Working in the City</p>
    <button class="pp-solid pp-enter"><span class="hidden-label">Enter with sound on</span><span class="animated-label">Enter with sound on</span></button>
    <button class="pp-nosound">Enter without sound</button>
  </div>
</main>

<script src="../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../../_shared/vendor/gsap/SplitText.min.js"></script>
<script src="../_vendor/lenis@1.3.15/lenis.min.js"></script>
<script src="../_vendor/howler@2.2.4/howler.core.min.js"></script>
<script src="../_vendor/lottie-web@5.12.2/lottie_svg.min.js"></script>
<script>window.exports = {};</script>
<script src="../_vendor/three@0.180.0/build/three.cjs"></script>
<script>window.THREE = window.exports; delete window.exports;</script>
<script src="shared.js"></script>
<script src="index.js"></script>
<script src="../../_shared/wire.js"></script>
</body>
</html>
