<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>News · Facility-operations SaaS with a cylindrical photo band</title>
<link rel="stylesheet" href="../../_shared/wire.css">
<link rel="stylesheet" href="../../_shared/kf-defaults.css">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="../_fx/arrow-cycle-hover/fx.css">
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="sub.css">
<style>
  /* News — filter on the left (category buttons · year picker) + news rows on the right */
  .hc-newsw { display: grid; grid-template-columns: 200px 1fr; gap: 60px; max-width: 1000px; margin: 0 auto; padding: 60px 20px 0; }
  @media (max-width: 767px) { .hc-newsw { grid-template-columns: 1fr; gap: 30px; } }
  .hc-newsw__side h2 { margin-bottom: 14px; font-size: 13px; font-weight: 700; }
  .hc-newsw__side label { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; font-size: 13px; cursor: pointer; }
  .hc-newsw__side input { accent-color: var(--kf-ink); }
  .hc-newsw__side select { margin-top: 4px; padding: 6px 28px 6px 10px; border: 1px solid var(--kf-line); border-radius: 4px; background: var(--kf-bg); font: 13px var(--kf-font-sans); }
  .hc-newsw__side h2 + * + h2, .hc-newsw__year { margin-top: 36px; }
</style>
</head>
<body data-page="news">

<main>
  <header class="hc-pagehead" data-slot="page-head">
    <ol class="hc-bread"><li><a href="index.html">TOP</a></li><li>News</li></ol>
    <h1>News</h1>
  </header>
  <div class="hc-newsw" data-slot="news-list">
    <aside class="hc-newsw__side" data-slot="news-filter">
      <h2>Category</h2>
      <div><label><input type="radio" name="cat" checked>Everyone</label><label><input type="radio" name="cat">Update info</label><label><input type="radio" name="cat">Press Release</label></div>
      <div class="hc-newsw__year"><h2>Year</h2><select aria-label="Year"><option>Everyone</option><option>2026</option><option>2025</option></select></div>
    </aside>
    <div>
      <ul data-hc-news-list="10"></ul>
      <div class="hc-pager" data-slot="pagination"><span class="is-current">1</span><a href="news.html">2</a><a class="is-next" href="news.html" aria-label="Next"></a></div>
    </div>
  </div>
</main>

<script src="../_fx/fx-core.js"></script>
<script src="shared.js"></script>
<script src="sub.js"></script>
<script src="../../_shared/wire.js"></script>
</body>
</html>
