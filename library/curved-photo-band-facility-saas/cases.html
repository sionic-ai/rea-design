<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Case study · facility operations SaaS with a cylinder photo strip</title>
<link rel="stylesheet" href="../../_shared/wire.css">
<link rel="stylesheet" href="../../_shared/kf-defaults.css">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="../_fx/arrow-cycle-hover/fx.css">
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="sub.css">
<style>
  /* Work list — from header to list, one gray board with a white filter bar (opens in .4s on press) and three-column white Work cards */
  [data-page="cases"] main { margin: 12px 12px 0; padding-bottom: 20px; background: var(--kf-raised); border-radius: 8px; }
  @media (max-width: 767px) { [data-page="cases"] main { margin: 56px 10px 0; } }
  [data-page="cases"] .hc-pagehead { margin: 0; padding-bottom: 40px; }
  [data-page="cases"] .hc-section { padding-top: 20px; }
  .hc-fold { margin-bottom: 40px; padding: 0 20px; background: var(--kf-bg); border-radius: 4px; }
  .hc-fold > button { display: flex; justify-content: space-between; align-items: center; width: 100%; padding: 18px 4px; border: 0; background: none; color: var(--kf-ink); font: 700 14px var(--kf-font-sans); cursor: pointer; }
  .hc-fold > button::after { content: ""; width: 16px; height: 16px; background: currentColor; mask: var(--hc-chev) center / contain no-repeat; transition: rotate .4s; }
  .hc-fold.is-open > button::after { rotate: 180deg; }
  .hc-fold__body { height: 0; overflow: hidden; transition: height .4s ease; }
  .hc-fold__inner { display: grid; grid-template-columns: 120px 1fr; gap: 14px 20px; padding: 10px 4px 28px; font-size: 13px; }
  .hc-fold__inner dt { font-weight: 700; }
  .hc-fold__inner dd { display: flex; flex-wrap: wrap; gap: 8px; }
  .hc-fold__inner label { display: inline-flex; gap: 6px; align-items: center; padding: 4px 12px; border: 1px solid var(--kf-line); border-radius: 999px; }
</style>
</head>
<body data-page="cases">

<main>
  <header class="hc-pagehead" data-slot="page-head">
    <ol class="hc-bread"><li><a href="index.html">TOP</a></li><li>Adoption cases</li></ol>
    <h1>Adoption cases</h1>
  </header>
  <section class="hc-section" data-slot="case-list">
    <span class="wf-note">Filter accordion (.4s) · three-column case cards (photo 4:3, 1.04x on hover) · round page number</span>
    <div class="hc-fold" data-hc-fold>
      <button type="button" aria-expanded="false">Filter Cases</button>
      <div class="hc-fold__body"><dl class="hc-fold__inner">
        <dt>Business type</dt><dd><label><input type="checkbox">Multi-Sport Club</label><label><input type="checkbox">Personal gym</label><label><input type="checkbox">Yoga · Pilates</label><label><input type="checkbox">Exercise school</label><label><input type="checkbox">Public facilities</label></dd>
        <dt>Membership size</dt><dd><label><input type="checkbox">~100 people</label><label><input type="checkbox">101~300 people</label><label><input type="checkbox">301~500 people</label><label><input type="checkbox">1,001+ people</label></dd>
        <dt>Challenges to solve</dt><dd><label><input type="checkbox">Streamlining work</label><label><input type="checkbox">Sales Growth</label><label><input type="checkbox">Member satisfaction</label></dd>
      </dl></div>
    </div>
    <ul class="hc-cases" data-hc-cases-list="15"></ul>
    <div class="hc-pager" data-slot="pagination"><span class="is-current">1</span><a href="cases.html">2</a><a href="cases.html">3</a><span>…</span><a href="cases.html">6</a><a class="is-next" href="cases.html" aria-label="Next"></a></div>
  </section>
</main>

<script src="../_fx/fx-core.js"></script>
<script src="shared.js"></script>
<script src="sub.js"></script>
<script src="../../_shared/wire.js"></script>
</body>
</html>
