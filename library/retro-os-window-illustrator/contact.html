<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact — illustration portfolio</title>
<link rel="stylesheet" href="../../_shared/wire.css">
<link rel="stylesheet" href="../../_shared/kf-defaults.css">

</head>
<body>
<div class="ic-wrapper"><div class="ic-content">
<header data-slot="header"></header>
<main id="swup" data-page="contact">
<div class="ic-contact">
  <div class="ic-contact__heading" data-slot="page-title">
    <div class="ic-heading"><h1 class="ic-heading__main" translate="no">contact</h1><div class="ic-heading__barcode"><span class="ic-barcode" aria-hidden="true">contact</span></div></div>
    <div class="ic-contact__desc"><p>Contact us using the form below or</p><p>We accept DMs on SNS.</p><p>For commission inquiries, please include your schedule and budget.</p></div>
  </div>
  <div class="ic-contact__body" data-slot="contact-form">
    <div class="ic-contact__deco">
      <div class="ic-contact__space">
        <span class="ic-dash"></span>
        <div class="ic-sticker ic-contact__sticker1" data-sticker><div class="wf-img" data-label="Character sticker · pink background · square"></div></div>
        <div class="ic-sticker ic-contact__sticker2" data-sticker><div class="wf-img" data-label="Character sticker · blue background · square"></div></div>
      </div>
      <div class="ic-contact__cross"><span class="ic-cross"><span><span class="ic-dash"></span></span><span><span class="ic-dash"></span></span></span></div>
    </div>
        <div class="ic-contact__content">
      <p class="ic-contact__content-head">(Form)</p>
      <form class="ic-contact__form" action="#" onsubmit="return false">
        <div class="ic-contact__block"><label class="ic-contact__label" for="ic-name">Name</label><input class="ic-contact__input" id="ic-name" name="name" placeholder="Name John Doe" required></div>
        <div class="ic-contact__block"><label class="ic-contact__label" for="ic-mail">Email address</label><input class="ic-contact__input" id="ic-mail" name="email" type="email" placeholder="info@example.com" required></div>
        <div class="ic-contact__block"><label class="ic-contact__label" for="ic-msg">Contact message</label><textarea class="ic-contact__textarea" id="ic-msg" name="message" placeholder="Feel free to write" required></textarea></div>
        <button class="ic-contact__submit" type="submit">Send</button>
      </form>
      <div class="ic-contact__barcode"><span class="ic-barcode" aria-hidden="true">contact</span></div>
    </div>
  </div>
</div>
</main>
<footer data-slot="footer"></footer>
</div></div>
