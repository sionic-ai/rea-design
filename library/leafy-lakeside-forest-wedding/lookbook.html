<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photo collection · lakeside forest wedding intro</title>
<link rel="stylesheet" href="../../_shared/wire.css">
<link rel="stylesheet" href="../../_shared/kf-defaults.css">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="../_fx/foliage-sway/fx.css">
<link rel="stylesheet" href="../_fx/gradient-sweep-title/fx.css">
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="lookbook.css">
</head>
<body data-page="lookbook">

<header class="tw-header" data-slot="header"></header>

<div class="tw-container">
  <div class="tw-container__inner">
    <main class="tw-gallery">
      <section class="tw-gallery__kv" data-slot="hero-photo-fixed">
        <span class="wf-note">The hero photo stays pinned to the screen and later sections rise over it · title glow spreads from the right over 2s, Korean from 30px blur over 1s · the header row is white while over the photo</span>
        <div class="tw-gallery__kv-ttl">
          <p class="tw-gallery__kv-en" data-fx="gradient-sweep-title" data-fx-gradient-sweep-title="look: duo; size: 500; reverse: 1; on: load; dur: 2" data-label="English page name">Gallery</p>
          <p class="tw-gallery__kv-ja">Photo collection</p>
        </div>
        <div class="tw-gallery__kv-bg wf-img" data-label="Bride and groom in a canoe on a lake · white tent and forest behind · afternoon light · full-screen landscape"></div>
      </section>

      <div class="tw-gallery__wrap" data-slot="gallery-chapters">
        <section class="tw-gsec tw-gsec--first" data-section-id="1">
          <div class="tw-gsec__ttl"><span data-label="Section English name">Venue</span></div>
          <div class="tw-gsec__photo tw-p1 wf-img" data-label="Two people toasting face to face · outdoors in the forest · daytime · landscape 28:15"></div>
          <div class="tw-gsec__photo tw-p2 wf-img" data-label="Bride from behind · Portrait 2:3"></div>
          <div class="tw-gsec__photo tw-p3 wf-img" data-label="Two people under a macramé arch · Landscape 3:2"></div>
          <div class="tw-gsec__photo tw-p4 wf-img" data-label="Outdoor ceremony venue view · rows of chairs · landscape 3:2"></div>
          <div class="tw-gsec__photo tw-p5 wf-img" data-label="Bouquet close-up · portrait 2:3"></div>
          <div class="tw-gsec__photo tw-p6 wf-img" data-label="Ring exchange hands · landscape 3:2"></div>
          <div class="tw-gsec__photo tw-p7 wf-img" data-label="Wedding aisle in the forest · top-down view · landscape 28:15"></div>
        </section>
        <section class="tw-gsec" data-section-id="2">
          <div class="tw-gsec__ttl"><span data-label="Section English name">Waterside</span></div>
          <div class="tw-gsec__photo tw-q1 wf-img" data-label="Two people by the lake · water reflection · landscape 28:15"></div>
          <div class="tw-gsec__photo tw-q2 wf-img" data-label="Dried flower decor prop · portrait 2:3"></div>
          <div class="tw-gsec__photo tw-q3 wf-img" data-label="Two clasped hands · Lake background · Landscape 3:2"></div>
          <div class="tw-gsec__photo tw-q4 wf-img" data-label="Person walking by the water seen from behind · Landscape 3:2"></div>
          <div class="tw-gsec__photo tw-q5 wf-img" data-label="Bride in profile · backlit · vertical 2:3"></div>
          <div class="tw-gsec__photo tw-q6 wf-img" data-label="Table on a wooden deck · landscape 3:2"></div>
          <div class="tw-gsec__photo tw-q7 wf-img" data-label="Two people in a canoe · landscape 3:2"></div>
          <div class="tw-gsec__photo tw-q8 wf-img" data-label="Forest reflected on water · vertical 2:3"></div>
          <div class="tw-gsec__photo tw-q9 wf-img" data-label="Lake view and tents · landscape 28:15"></div>
        </section>
        <section class="tw-gsec" data-section-id="3">
          <div class="tw-gsec__ttl"><span data-label="Section English name">Ceremony Day</span></div>
          <div class="tw-gsec__photo tw-q1 wf-img" data-label="Entrance to a forest wedding venue · Landscape 28:15"></div>
          <div class="tw-gsec__photo tw-q2 wf-img" data-label="Welcome board · Portrait 2:3"></div>
          <div class="tw-gsec__photo tw-q3 wf-img" data-label="Two people full-length in pine forest · Landscape 3:2"></div>
          <div class="tw-gsec__photo tw-q4 wf-img" data-label="Toast with wedding guests · landscape 3:2"></div>
          <div class="tw-gsec__photo tw-q5 wf-img" data-label="Cake close-up · portrait 2:3"></div>
          <div class="tw-gsec__photo tw-q6 wf-img" data-label="Food on a buffet table · landscape 3:2"></div>
          <div class="tw-gsec__photo tw-q7 wf-img" data-label="Party under evening string lights · landscape 3:2"></div>
          <div class="tw-gsec__photo tw-q8 wf-img" data-label="Flowers in the bride’s hands · portrait 2:3"></div>
          <div class="tw-gsec__photo tw-q9 wf-img" data-label="Venue view at dusk · landscape 28:15"></div>
        </section>
        <section class="tw-gsec" data-section-id="4">
          <div class="tw-gsec__ttl"><span data-label="Section English name">Photo Session</span></div>
          <div class="tw-gsec__photo tw-q1 wf-img" data-label="Two people in hanbok · garden · landscape 28:15"></div>
          <div class="tw-gsec__photo tw-q2 wf-img" data-label="Bride alone, full-length · vertical 2:3"></div>
          <div class="tw-gsec__photo tw-q3 wf-img" data-label="Two people on an antique sofa · Landscape 3:2"></div>
          <div class="tw-gsec__photo tw-q4 wf-img" data-label="Two people smiling with props · Landscape 3:2"></div>
          <div class="tw-gsec__photo tw-q5 wf-img" data-label="Side face under a veil · vertical 2:3"></div>
          <div class="tw-gsec__photo tw-q6 wf-img" data-label="Two people walking through the forest · landscape 3:2"></div>
          <div class="tw-gsec__photo tw-q7 wf-img" data-label="Foreheads touching, face to face · landscape 3:2"></div>
          <div class="tw-gsec__photo tw-q8 wf-img" data-label="Boutonniere close-up · Portrait 2:3"></div>
          <div class="tw-gsec__photo tw-q9 wf-img" data-label="Two people on a meadow from afar · landscape 28:15"></div>
        </section>
        <section class="tw-gsec" data-section-id="5">
          <div class="tw-gsec__ttl"><span data-label="Section English name">Garden Party</span></div>
          <div class="tw-gsec__photo tw-q1 wf-img" data-label="Bride and sofa under a flowering tree · landscape 28:15"></div>
          <div class="tw-gsec__photo tw-q2 wf-img" data-label="Flower-decorated table · vertical 2:3"></div>
          <div class="tw-gsec__photo tw-q3 wf-img" data-label="Garden party guests · landscape 3:2"></div>
          <div class="tw-gsec__photo tw-q4 wf-img" data-label="Two people strolling in a garden · landscape 3:2"></div>
          <div class="tw-gsec__photo tw-q5 wf-img" data-label="Bride alone · flower arch · portrait 2:3"></div>
          <div class="tw-gsec__photo tw-q6 wf-img" data-label="Dessert table · landscape 3:2"></div>
          <div class="tw-gsec__photo tw-q7 wf-img" data-label="Garden view · horizontal 3:2"></div>
          <div class="tw-gsec__photo tw-q8 wf-img" data-label="Prop on grass · 2:3 portrait"></div>
          <div class="tw-gsec__photo tw-q9 wf-img" data-label="Two people in a garden at sunset · landscape 28:15"></div>
        </section>
      </div>
    </main>
  </div>
</div>
