<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">

  <link rel="stylesheet" href="../../_shared/wire.css">
  <link rel="stylesheet" href="../../_shared/kf-defaults.css">

  <script>try { var zkFade = sessionStorage.getItem("zk-fade"); if (zkFade) document.documentElement.style.setProperty("background", "var(--site-pal-" + zkFade + ")"); } catch (e) {}</script>
</head>
<body class="zk is-fixed">
  <div class="zk-page">
    <div class="zk-content">
      <main data-slot="hero-wordmark">
        <section class="zk-sec is-fixed">
          <div class="zk-sec__inner no-pad">
            <div class="zk-logo-cell">
              <div class="zk-logo">
                <div class="zk-logo__inner">
                  <div class="zk-logo__border"></div>
                  <h1 class="zk-logo__title" lang="en" data-label="Brand English wordmark — 4 letters in the form of three capitals + one thin lowercase (matched to the original’s total letter width)">NiCE</h1>
                </div>
              </div>
            </div>
          </div>
          <div class="zk-stickers-cell" data-slot="sticker-drum">
            <!-- Sticker = Images wrapped around a cylinder, rotating bottom→top. art: words (English word lines over color blocks) / photo (photo slot, label says what photo) -->
            <div class="zk-stickers" data-fixed="true" data-label="Exhibition slogan sticker — three English words over three color-block lines, square transparent SVG"
              data-config='[{"art":"words","seed":11,"rows":[{"text":"sample","bg":3,"ink":6},{"text":"text**ing","bg":8,"ink":3},{"text":"here","bg":1,"ink":6}],"speed":1,"scale":0.5,"rotation":0,"turns":0.5,"turn_offset":0,"distance":0,"offset":0}]'></div>
          </div>
        </section>
      </main>
      <footer class="zk-foot" data-slot="footer">
        <div class="zk-foot__inner">
          <div class="zk-foot__copy" lang="en" data-label="Copyright line">©Name, 0000</div>
          <div class="zk-foot__bottom">
            <div class="zk-foot__items" lang="en">
              <div class="is-ext"><a href="mailto:hello@example.com">Mail</a></div>
              <div class="is-ext"><a href="https://example.com" target="_blank" rel="noopener">Social</a></div>
            </div>
            <div class="zk-foot__items is-right" lang="en">
              <div class="is-ext"><p>Made by <a href="https://example.com" target="_blank" rel="noopener">Studio</a></p></div>
              <div><a href="imprint.html">Legal</a></div>
            </div>
          </div>
        </div>
      </footer>
    </div>

    <header class="zk-head" data-slot="nav">
      <div class="zk-head__logo"><a href="index.html" lang="en" data-label="Brand English name">NAME</a></div>
      <nav class="zk-head__menu" lang="en" data-label="Four English menu names + language switch" data-slot="menu-drawer">
        <div class="zk-head__item"><div class="zk-head__inner" style="transition-delay: 100ms"><a href="detail.html">Menu First</a></div></div>
        <div class="zk-head__item"><div class="zk-head__inner" style="transition-delay: 200ms"><a href="program.html">Menu Two</a></div></div>
        <div class="zk-head__item"><div class="zk-head__inner" style="transition-delay: 300ms"><a href="contact.html">Menu Three</a></div></div>
        <div class="zk-head__item"><div class="zk-head__inner" style="transition-delay: 400ms"><a href="about.html">About Name</a></div></div>
        <div class="zk-head__item"><div class="zk-head__inner" style="transition-delay: 500ms"><a href="#lang">EN</a></div></div>
      </nav>
      <button class="zk-head__burger" type="button" aria-label="Menu" aria-expanded="false"><span></span><span></span></button>
    </header>
  </div>
  <div class="zk-gl" aria-hidden="true"></div>

  <script src="../../_shared/vendor/gsap/gsap.min.js"></script>
