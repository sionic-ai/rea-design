<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your company name — Entry</title>
  <link rel="stylesheet" href="../../_shared/wire.css">
  <link rel="stylesheet" href="../../_shared/kf-defaults.css">
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="../_fx/gate-widen-panels/fx.css">
  <link rel="stylesheet" href="shared.css">
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <main class="g-main">
    <header class="g-head" data-slot="gate-head">
      <h1><a href="index.html" class="o-logo" data-label="Company logo (bold italic text logo · black)">Company Name Logo</a></h1>
      <time class="g-date" datetime="">0000. 00. 00. MON</time>
    </header>

    <nav class="g-gate" data-slot="gate-split" data-fx="gate-widen-panels" data-fx-gate-widen-panels="tap: 1000" aria-label="Two-way entrance">
      <a href="index.html" class="is-first" data-fx-part="panel" style="--fx-w: 80%">
        <span class="g-media" data-fx-part="media">
          <span class="wf-img o-ph" data-fx-part="zoom" data-label="Product driving photo · front of an SUV splashing through a puddle on a forest trail · shaded forest natural light · low angle landscape 16:10"></span>
        </span>
        <div class="g-txt">
          <h2 data-fx-part="roll"><span>Your first category here</span><span>Your quick word here</span></h2>
          <p data-fx-part="roll"><span>Your one-line description goes here</span><span data-label="First branch English name">First Site</span></p>
        </div>
        <span data-fx-part="dot"></span>
      </a>
      <a href="about.html" class="is-second" data-fx-part="panel" style="--fx-w: 20%; --fx-open: 66.4%">
        <video data-fx-part="media" src="media/loop.mp4" muted autoplay loop playsinline preload="metadata" aria-label="Everyday people video slot · several cuts of people smiling on streets and at school · natural light · landscape 16:9 · 6s loop"></video>
        <div class="g-txt">
          <h2 data-fx-part="roll"><span>Second Branch</span><span>Your quick word here</span></h2>
          <p data-fx-part="roll"><span>Activities of “Your slogan here”</span><span data-label="Second branch English name">Brand Site</span></p>
        </div>
        <span data-fx-part="dot"></span>
      </a>
    </nav>
  </main>

  <script src="../../_shared/vendor/gsap/gsap.min.js"></script>
  <script src="../_fx/fx-core.js"></script>
  <script src="../_fx/gate-widen-panels/fx.js"></script>
  <script>
    // In the original, the server stamps today’s date in the form 2026. 11. 14. SAT
    (() => {
      const t = document.querySelector(".g-date");
      const d = new Date(), p = (n) => String(n).padStart(2, "0");
      t.dateTime = d.toISOString().slice(0, 10);
      t.textContent = `${d.getFullYear()}. ${p(d.getMonth() + 1)}. ${p(d.getDate())}. ${["SUN", "MON", "TUE", "WED", "THU", "FRI", "SAT"][d.getDay()]}`;
    })();
  </script>
  <script src="../../_shared/wire.js"></script>
</body>
</html>
