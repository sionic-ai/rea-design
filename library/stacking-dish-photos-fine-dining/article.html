<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>News headline here — Shop name here</title>
  <link rel="stylesheet" href="../../_shared/wire.css">
  <link rel="stylesheet" href="../../_shared/kf-defaults.css">
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="shared.css">
  <link rel="stylesheet" href="article.css">
</head>
<body data-page="article" id="top">
  <header data-slot="header"></header>

  <main class="z-main">
    <!-- One News item: wordmark box · date · title · body · back link -->
    <article class="z-entry" data-slot="article-body">
      <div class="z-entry__logo"><a href="index.html"><span class="z-logo" aria-label="Logo">L O G O T Y P E</span></a></div>
      <header class="z-entry__head">
        <h1 class="z-entry__title">Your news title in one line goes here</h1>
        <time class="z-entry__time">0000/00/00</time>
      </header>
      <div class="z-entry__wrap">
        <p>Your first news body paragraph here. This is where the date and event name go, running about two lines.</p>
        <p>Your second paragraph goes here, in one line.</p>
        <p>Your closing greeting in one line here.</p>
      </div>
      <nav class="z-entry__back"><a class="z-backLink" href="index.html"><span class="z-backLink__icon" data-back></span><span class="z-backLink__text">Back to Top</span></a></nav>
    </article>

    <!-- Full news list (gray cells, two-row cards) -->
    <section class="z-postList" data-slot="news-list">
      <div class="z-notice__body">
        <div class="z-head-c"><h2 class="z-label">NEWS</h2></div>
        <ul class="z-posts" data-all-posts></ul>
      </div>
    </section>
  </main>

  <section data-slot="information"></section>
  <article data-slot="visit-news"></article>
  <div data-slot="reserve"></div>
  <footer data-slot="footer"></footer>

  <script src="../../_shared/vendor/gsap/gsap.min.js"></script>
  <script src="../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
  <script src="../_vendor/lenis@1.0.19/lenis.umd.js"></script>
  <!-- The npm 1.0.19 umd build has the global name lenis (lowercase) — set to match the bundled build (Lenis) the original used -->
  <script>window.Lenis = window.Lenis || window.lenis;</script>
  <script src="shared.js"></script>
  <script>
    // Full News list of fifteen items — same card, so filled with placeholders
    (() => {
      const list = document.querySelector("[data-all-posts]");
      const rows = Array.from({ length: 15 }, (_, i) => [i % 3 === 1 ? "A slightly longer news title here to check whether it wraps to two lines" : "Your news title in one line goes here", "0000/00/00"]);
      list.innerHTML = rows.map(Z.postCard).join("");
      document.querySelector("[data-back]").innerHTML = Z.icons.arrowR;
    })();
  </script>
  <script src="../../_shared/wire.js"></script>
</body>
</html>
