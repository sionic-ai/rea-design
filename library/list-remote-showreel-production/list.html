<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Work list · a showreel studio where the list is the remote control</title>
<link rel="stylesheet" href="../../_shared/wire.css">
<link rel="stylesheet" href="../../_shared/kf-defaults.css">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="list.css">
</head>
<body data-page="list" class="is-paper">

<header data-slot="header"></header>

<main class="work">
  <!-- Gallery view: huge two-line title, category and view toggle row, 75vh video cards that repeat a full-width cell + two half-width cells -->
  <section class="work__gallery-wrap is-active" data-slot="gallery">
    <span class="wf-note">Video inside cards shifts up and down with scroll (1.16x scale parallax) · video plays on hover · view switch uses a white curtain wipe</span>
    <h1 class="t-head work__title" data-label="Large English heading for the work list, two lines">Selected<br>Work</h1>
    <div class="work__bar">
      <div class="t-body" data-work-cat data-label="Your work category English name here">Category 1</div>
      <div class="work__switch t-body">
        <button class="work__switch-btn is-active" type="button" data-view="gallery"><svg viewBox="0 0 16 10" aria-hidden="true"><path d="M0 0h4v4H0zM6 0h4v4H6zM12 0h4v4h-4zM0 6h4v4H0zM6 6h4v4H6zM12 6h4v4h-4z"/></svg>Gallery View</button>
        <button class="work__switch-btn" type="button" data-view="full"><svg viewBox="0 0 16 10" aria-hidden="true"><path d="M2 0h12v10H2z"/></svg>Full Screen</button>
      </div>
    </div>
    <div class="work__gallery" data-gallery></div>
  </section>

  <!-- Fullscreen view: full-bleed video, info on top · progress bar · scene thumbnails, work name strip at the bottom (wheel · drag to advance) -->
  <section class="work__full" data-slot="fullscreen-player" aria-hidden="true">
    <div class="work__full-stage" data-full-stage></div>
    <div class="work__full-top">
      <div class="work__full-info">
        <h2 class="t-subup work__full-title" data-label="Your work English name here"><span data-full-title>Project Name 01</span></h2>
        <div class="work__full-data t-body">
          <div data-label="Your studio name in English here"><span class="dim">[ Made by ]</span><br><span data-full-made>Studio Name 01</span></div>
          <div data-label="Your director’s English name here"><span class="dim">[ Director ]</span><br><span data-full-dir>Director Name 01</span></div>
        </div>
        <div class="work__full-timeline">
          <div class="work__full-bar"><div class="work__full-watched" data-full-watched><i></i></div></div>
          <div class="work__full-frames" data-full-frames></div>
        </div>
      </div>
      <div class="work__full-buttons t-body">
        <button type="button" data-view="gallery" data-brackets>Gallery</button>
        <button type="button" class="work__sound" data-brackets>Sound On</button>
      </div>
    </div>
    <div class="work__full-slider t-subup" data-full-slider></div>
  </section>
</main>

<footer data-slot="footer"></footer>

<script src="../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../../_shared/vendor/gsap/CustomEase.min.js"></script>
<script src="../_vendor/lenis@1.2.3/lenis.min.js"></script>
<script src="shared.js"></script>
<script src="list.js"></script>
<script src="../../_shared/wire.js"></script>
</body>
</html>
