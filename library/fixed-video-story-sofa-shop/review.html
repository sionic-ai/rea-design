<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reviews · Cushion sofa brand set</title>
<link rel="stylesheet" href="../../_shared/wire.css">
<link rel="stylesheet" href="../../_shared/kf-defaults.css">
<link rel="stylesheet" href="../_vendor/lenis@1.3.13/lenis.css">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="review.css">
</head>
<body data-page="review">

<header data-slot="header"></header>

<main>
  <section class="rv" data-slot="review-page">
    <div class="rv__wrap">
      <div class="yr-common-head" data-slot="page-head">
        <h1 class="yr-page-title is-s js-textAnimation"><span class="yr-page-title__main" data-split>Review</span><span class="yr-page-title__sub">Review List</span></h1>
      </div>
      <div class="rv__body yr-common-body">
        <aside class="rv__left" data-slot="review-product">
          <button class="rv__change" type="button" data-modal-open><span class="rv__plus" aria-hidden="true"></span><span>Change Product</span></button>
          <div class="rv__product">
            <div class="rv__product-img"><div class="wf-img" data-label="Cushion sofa cutout · front 1:1"></div></div>
            <div class="rv__product-text">
              <p class="rv__product-name">Product Name<br>Item Line</p>
              <div class="rv__rating"><span class="rv__rating-stars" aria-hidden="true"></span><span class="yr-num">0.00 (00)</span></div>
              <a class="yr-btn is-small" href="product.html"><span>View product</span></a>
            </div>
          </div>
        </aside>
        <div class="rv__right">
          <label class="rv__count"><span class="rv__count-icon" aria-hidden="true"></span><select aria-label="Displayed Count"><option>Showing 20 items</option><option>Show 50</option></select></label>
          <div class="rv__list" data-review-list data-review-card data-count="18"></div>
        </div>
      </div>
    </div>
  </section>
</main>

<footer data-slot="footer"></footer>

<div class="yr-modal" data-modal-content data-slot="product-picker">
  <button class="yr-modal__close" type="button" data-modal-close>Close</button>
  <div class="yr-modal__inner rv-pick">
    <p class="rv-pick__title">Choose a product</p>
    <ul class="rv-pick__list">
      <li><button type="button" data-modal-close><div class="wf-img" data-label="Product 1 cutout"></div><span>Product name 1</span></button></li>
      <li><button type="button" data-modal-close><div class="wf-img" data-label="Product 2 cutout"></div><span>Product name 2</span></button></li>
      <li><button type="button" data-modal-close><div class="wf-img" data-label="Product 3 cutout"></div><span>Product name 3</span></button></li>
    </ul>
  </div>
</div>

<script src="../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../_vendor/lenis@1.3.13/lenis.min.js"></script>
<script src="shared.js"></script>
<script src="../../_shared/wire.js"></script>
</body>
</html>
