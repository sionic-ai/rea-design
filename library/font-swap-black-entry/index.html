<!doctype html>
<html lang="ko" class="is-intro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Pattern Atlas — Your one-line intro here</title>
  <link rel="stylesheet" href="../../_shared/wire.css">
  <link rel="stylesheet" href="../../_shared/kf-defaults.css">
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="../_fx/dot-grid-bulge/fx.css">
  <link rel="stylesheet" href="../_fx/font-cycle-title/fx.css">
  <link rel="stylesheet" href="shared.css">
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <div class="ct-grid" data-slot="dot-grid" data-fx="dot-grid-bulge" aria-hidden="true"></div>

  <header class="ct-header" data-slot="header"><div class="ct-head">
    <a class="ct-logo" href="index.html" aria-label="Back to start" data-label="Brand logo · two-line wordmark (bold company name + light department name) · 2.84:1">
      <svg viewBox="0 0 284 100" aria-hidden="true">
        <text x="0" y="42" font-size="46" font-weight="700" letter-spacing="-2" fill="currentColor">Brandname</text>
        <text x="0" y="94" font-size="46" font-weight="400" letter-spacing="-1.5" fill="currentColor">Studio</text>
      </svg>
    </a>
    <button type="button" class="ct-icon-btn" data-modal-open="share" aria-label="Share">
      <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true">
        <circle cx="13.5" cy="4" r="2"/><circle cx="4.5" cy="9" r="2"/><circle cx="13.5" cy="14" r="2"/>
        <path d="M6.3 8 11.7 5M6.3 10l5.4 3"/>
      </svg>
    </button>
  </div></header>

  <main id="content" class="ct-container">
    <h1 class="ct-sr">The Pattern Atlas</h1>
    <section class="ct-hero" data-slot="hero-title">
      <div class="ct-title" data-fx="font-cycle-title" aria-hidden="true">
        <span data-fx-part="word" data-label="First word of title (English)">The</span>
        <span data-fx-part="stack" data-label="Title middle word (English) — sits on a slanted serif, swapping through four typefaces">
          <span data-fx-part="variant" class="v-poster">Pattern</span><span data-fx-part="variant" class="v-hand">Pattern</span><span data-fx-part="variant" class="v-round">Pattern</span><span data-fx-part="variant" class="v-italic">Pattern</span>
        </span>
        <span data-fx-part="word" class="is-end" data-label="Last word of title (English)">Atlas</span>
      </div>
      <div class="ct-call-row">
        <div class="ct-call" data-slot="intro-cta">
          <p>Two lines here with a question for visitors?</p>
          <button type="button" class="ct-btn" data-modal-open="form" data-label="Enter button label (English uppercase)">Start the Survey Now</button>
        </div>
      </div>
    </section>
  </main>

  <footer class="ct-foot ct-container" data-slot="footer">
    <span class="is-dim">&copy;0000</span>
    <a class="ct-link" href="#">Privacy policy</a>
    <a class="ct-link" href="#">Terms of service</a>
    <button type="button" class="ct-link">Cookie Settings</button>
  </footer>

  <div class="ct-modal" data-modal="form" data-slot="form-modal" aria-hidden="true" role="dialog" aria-modal="true" aria-label="Entry Form">
    <div class="ct-modal__outer">
      <div class="ct-modal__inner">
        <button type="button" class="ct-icon-btn ct-modal__close" data-modal-close aria-label="Close">
          <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="m4.5 4.5 9 9m0-9-9 9"/></svg>
        </button>
        <p class="ct-modal__title">Your two-line form title goes here?</p>
        <form class="ct-form">
          <label>Name<input type="text" autocomplete="given-name"></label>
          <label>Castle<input type="text" autocomplete="family-name"></label>
          <label>Company Brand<input type="brand" autocomplete="brand"></label>
          <label>Company name<input type="text" autocomplete="organization"></label>
          <label>Job title<input type="text" autocomplete="organization-title"></label>
          <label>Country<select><option>Please select</option><option>Item 1</option><option>Item 2</option></select></label>
          <button type="submit" class="ct-btn is-dark">Submit</button>
        </form>
      </div>
    </div>
  </div>

  <div class="ct-modal" data-modal="share" data-slot="share-modal" aria-hidden="true" role="dialog" aria-modal="true" aria-label="Share">
    <div class="ct-modal__outer">
      <div class="ct-modal__inner ct-share">
        <div class="ct-share__head">
          <p>Share</p>
          <button type="button" class="ct-icon-btn" data-modal-close aria-label="Close">
            <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="m4.5 4.5 9 9m0-9-9 9"/></svg>
          </button>
        </div>
        <div class="ct-share__list">
          <button type="button">Copy link <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M4 10 10 4M5 4h5v5"/></svg></button>
          <a href="#">Share Target 1 <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M4 10 10 4M5 4h5v5"/></svg></a>
          <a href="#">Share Target 2 <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M4 10 10 4M5 4h5v5"/></svg></a>
          <a href="#">Send by brand <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M4 10 10 4M5 4h5v5"/></svg></a>
        </div>
      </div>
    </div>
  </div>

  <script src="../../_shared/vendor/gsap/gsap.min.js"></script>
  <script src="../_fx/fx-core.js"></script>
  <script src="../_fx/dot-grid-bulge/fx.js"></script>
  <script src="../_fx/font-cycle-title/fx.js"></script>
  <script src="shared.js"></script>
  <script src="../../_shared/wire.js"></script>
</body>
</html>
