<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>News | Service</title>
  <link rel="stylesheet" href="../../_shared/wire.css">
  <link rel="stylesheet" href="../../_shared/kf-defaults.css">
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="../_fx/ghost-wipe-title/fx.css">
  <link rel="stylesheet" href="../_fx/ring-redraw-btn/fx.css">
  <link rel="stylesheet" href="../_fx/updown-header/fx.css">
  <link rel="stylesheet" href="shared.css">
  <link rel="stylesheet" href="sub.css">
</head>
<body data-nav="news" class="np-old">
<div class="np-wrap np-page is-wait">
<main class="np-page__content">
  <!-- Text-only header: title + English subtitle + thin line below -->
  <div class="np-ihead" data-slot="page-head">
    <span class="wf-note">Old version entrance — panel after .7s then .3s · body from 40px below in .8s · hovering a row gives .8 · title accent color</span>
    <h1 class="np-ihead__title" data-fx="ghost-wipe-title" data-fx-ghost-wipe-title="look: fade">News</h1>
    <span class="np-ihead__sub">News</span>
  </div>
  <nav class="np-crumb" aria-label="Current location"><span><a href="index.html">Business-to-business payment Service</a></span><span>News</span></nav>

  <!-- News row: date / category on the left, bold title and trailing arrow on the right -->
  <ul class="np-news" data-slot="news-list"></ul>

  <nav class="np-pager" aria-label="Page turn" data-slot="pagination">
    <span class="np-pager__side np-pager__prev np-pager--off" data-fx="ring-redraw-btn" data-fx-ring-redraw-btn="enter: none"><span data-fx-part="icon"></span><span data-fx-part="label">Previous</span></span>
    <ul class="np-pager__nums"><li><span class="is-current">1</span></li><li><a href="news.html">2</a></li><li><span>…</span></li><li><a href="news.html">11</a></li></ul>
    <a class="np-pager__side np-pager__next" href="news.html" data-fx="ring-redraw-btn" data-fx-ring-redraw-btn="enter: none"><span data-fx-part="label">Next</span><span data-fx-part="icon"></span></a>
  </nav>
</main>
</div>
<script src="../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../_fx/fx-core.js"></script>
<script src="../_fx/ghost-wipe-title/fx.js"></script>
<script src="../_fx/ring-redraw-btn/fx.js"></script>
<script src="../_fx/updown-header/fx.js"></script>
<script>
  gsap.registerPlugin(ScrollTrigger);
  const NEWS = ["Company name, write a one-line news headline here", "Brand is starting a business partnership with Partner", "Company name introduces ‹Service› as an adoption case study", "Company name, write a one-line award announcement here", "Brand’s Service passes 0 trillion won in cumulative transactions", "Company name, write a one-line research results announcement here"];
  document.querySelector(".np-news").innerHTML = Array.from({ length: 10 }, (_, i) => `
    <li class="np-news__item"><a href="news.html">
      <p class="np-news__txt">0000.00.${String(28 - i * 2).padStart(2, "0")}<span class="np-news__slash">/</span>Press Release</p>
      <p class="np-news__title">${NEWS[i % NEWS.length]}</p>
    </a></li>`).join("");
</script>
<script src="shared.js"></script>
<script src="sub.js"></script>
<script src="../../_shared/wire.js"></script>
</body>
</html>
