<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Series picker · pottery pile stage</title>
<link rel="stylesheet" href="../../_shared/wire.css">
<link rel="stylesheet" href="../../_shared/kf-defaults.css">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="../_fx/pile-gather-push/fx.css">
<link rel="stylesheet" href="index.css">
</head>
<body data-page="home" data-series="a">

<header class="cg-top" data-slot="header"></header>

<main class="cg-page">
  <section class="cg-stage" data-slot="series-pile">
    <span class="wf-note">Series stage · 10 3D-scanned ceramic pieces cluster in the center under zero-gravity physics (rapier) and a cursor sphere pushes them away · on page turn they vanish in 1s and a new set flies in 1s later and clusters</span>
    <div class="cg-pile" data-fx="pile-gather-push" data-fx-pile-gather-push="set: a; fov: 50; z: 5.21" data-label="10 3D-scanned ceramic pieces · glaze stains · dark stage with even light · one piece at screen center"></div>

    <a class="cg-enter" href="list.html?series=a" data-slot="series-enter">
      <span class="cg-enter__icon" data-icon aria-hidden="true"></span>
      <span class="cg-enter__ja" data-label="Series name (original is four Japanese characters)">Doll collection</span>
      <span class="cg-enter__en" data-label="Intro + series English name">Enter figures</span>
    </a>

    <div class="cg-side is-prev" data-slot="series-prev">
      <button class="cg-step" type="button" data-step="-1" aria-label="Previous series" hidden>
        <span class="cg-step__label">Prev</span>
        <span class="cg-step__icon" data-icon aria-hidden="true"></span>
        <span class="cg-step__title" data-label="Previous series English name">Figures</span>
      </button>
    </div>
    <div class="cg-side is-next" data-slot="series-next">
      <button class="cg-step" type="button" data-step="1" aria-label="Next series">
        <span class="cg-step__label">Next</span>
        <span class="cg-step__icon" data-icon aria-hidden="true"></span>
        <span class="cg-step__title" data-label="Next series English name">Faces</span>
      </button>
    </div>
  </section>
</main>

<script src="../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../_fx/pile-gather-push/three-global.js"></script>
<script src="../_vendor/three@0.179.0/build/three.cjs"></script>
<script src="../_fx/fx-core.js"></script>
<script src="../_fx/pile-gather-push/fx.js"></script>
<script src="shared.js"></script>
<script src="index.js"></script>
<script src="../../_shared/wire.js"></script>
</body>
</html>
