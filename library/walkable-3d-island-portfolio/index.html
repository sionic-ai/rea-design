<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Your name here</title>
  <meta name="theme-color" content="#000000">
  <link rel="stylesheet" href="../../_shared/wire.css">

<body>
  <!-- The whole walkable island is this single canvas. Spots on the island (control signs, link signs, project doors, pads) are changed in WORLD in index.js -->
  <div class="mf-world" data-slot="island-world" aria-label="Your world description line here"></div>

  <div class="mf-layer" data-slot="loader">
    <p class="mf-loader" aria-live="polite">0</p>
  </div>

  <div class="mf-layer mf-gate" data-slot="hero-iris-gate" hidden>
    <button class="mf-enter" type="button" data-label="Your enter button here, one English word">Enter</button>
  </div>
  <p class="wf-note">Water-drop door — after the scene is ready, hole -.1→.35 (1s circ.out) · hover .45 (.5s power2.out) · click 1.5 (5s expo.out), camera 5s power3.out</p>

  <button class="mf-sound" type="button" aria-pressed="true" aria-label="Toggle sound on and off" data-slot="sound-toggle">
    <svg class="mf-sound__on" viewBox="0 0 100 100" fill="none" aria-hidden="true">
      <circle cx="50" cy="50" r="46.4" stroke="currentColor" stroke-opacity=".9" stroke-width="7.2"/>
      <path d="M27 41h10l14-12v42L37 59H27z" fill="currentColor" fill-opacity=".9"/>
      <path d="M60 39c4 3 6 7 6 11s-2 8-6 11M66 32c6 5 9 11 9 18s-3 13-9 18" stroke="currentColor" stroke-opacity=".9" stroke-width="5" stroke-linecap="round"/>
    </svg>
    <svg class="mf-sound__off" viewBox="0 0 100 100" fill="none" aria-hidden="true">
      <circle cx="50" cy="50" r="46.4" stroke="currentColor" stroke-opacity=".9" stroke-width="7.2"/>
      <path d="M27 41h10l14-12v42L37 59H27z" fill="currentColor" fill-opacity=".9"/>
      <path d="M61 42l14 16M75 42L61 58" stroke="currentColor" stroke-opacity=".9" stroke-width="5" stroke-linecap="round"/>
    </svg>
  </button>

  <div class="mf-joystick" data-slot="touch-joystick"><div class="mf-joystick__knob"></div></div>
  <p class="mf-toast" role="status" data-slot="link-toast"></p>

  <script src="../../_shared/vendor/gsap/gsap.min.js"></script>
  <script src="../_vendor/howler@2.2.4/howler.core.min.js"></script>
  <script>window.exports = {};</script>
  <script src="../_vendor/three@0.185.0/build/three.cjs"></script>
  <script>window.THREE = window.exports; delete window.exports;</script>
  <script src="shared.js"></script>

  <script src="../../_shared/wire.js"></script>

</html>
