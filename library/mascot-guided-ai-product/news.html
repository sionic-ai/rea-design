<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blog — Product name here</title>
  <link rel="stylesheet" href="../../_shared/wire.css">
  <link rel="stylesheet" href="../../_shared/kf-defaults.css">
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="../_fx/seat-line-up/fx.css">
  <link rel="stylesheet" href="shared.css">
  <link rel="stylesheet" href="news.css">
</head>
<body data-page="news" data-say="A short phrase here introducing this page." data-say-c="">
  <div data-t-head></div>
  <main class="t-sub-content">
    <header class="t-sub-head" data-slot="page-head"><h1>All posts</h1></header>
    <section class="n-list t-wrap" data-slot="post-grid">
      <ul class="t-blog-grid" data-posts></ul>
    </section>
  </main>
  <div data-t-cta></div>
  <div data-t-foot></div>
  <script>
    // Post card — a list mixing three types (story · news · press) like the original. Same type, so fill it by cycling placeholders
    (() => {
      const T = [["story", "Story", "Your two-line event review title goes here", "People at the venue · warm indoor light · 1200:630 landscape"],
        ["news", "New", "Your new edition news title here", "Large panel number text over a product screen · solid background · landscape 1200:630"],
        ["news", "New", "Your new version news 0.0.0 here", "Plate number on a solid background · landscape 1200:630"],
        ["story", "Story", "A slightly longer two-line title for a joining story here", "Person face front · light solid background · landscape 1200:630"],
        ["press", "Press", "Your press release title goes here in two lines", "Product logo and laptop screen · on a desk · landscape 1200:630"],
        ["story", "Story", "Your group photo record title here", "Group photo · indoor · landscape 1200:630"]];
      document.querySelector("[data-posts]").innerHTML = Array.from({ length: 12 }, (_, i) => {
        const [tone, chip, title, label] = T[i % T.length];
        return `<li><a class="t-card" href="article.html"><span class="t-chip" data-tone="${tone}">${chip}</span><h2 class="t-card-title">${title}</h2><time class="t-card-date">0000/00/${String(28 - i * 2).padStart(2, "0")}</time><span class="t-card-cover wf-img" data-label="${label}"></span></a></li>`;
      }).join("");
    })();
  </script>
  <script src="shared.js"></script>
  <script src="../_fx/fx-core.js"></script>
  <script src="../_fx/seat-line-up/fx.js"></script>
  <script src="../../_shared/wire.js"></script>
</body>
</html>
