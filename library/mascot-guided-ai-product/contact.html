<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact us — Product name here</title>
  <link rel="stylesheet" href="../../_shared/wire.css">
  <link rel="stylesheet" href="../../_shared/kf-defaults.css">
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="../_fx/seat-line-up/fx.css">
  <link rel="stylesheet" href="shared.css">
  <link rel="stylesheet" href="contact.css">
</head>
<body data-page="contact" data-say="A short phrase here introducing this page." data-say-c="">
  <div data-t-head></div>
  <main class="t-sub-content">
    <div class="c-wrap" data-slot="contact-form">
      <header class="c-head"><h1>Contact Us</h1><p>Please fill out the inquiry form below.</p></header>
      <form class="c-form" onsubmit="event.preventDefault(); this.querySelector('.c-status').textContent = 'Sent. We’ll be in touch soon.';">
        <label class="c-field"><span class="c-label">Name <span>*</span></span><input type="text" required></label>
        <label class="c-field"><span class="c-label">Company email address <span>*</span></span><input type="email" required></label>
        <label class="c-field"><span class="c-label">Phone number <span>*</span></span><input type="tel" required></label>
        <label class="c-field"><span class="c-label">Company name <span>*</span></span><input type="text" required></label>
        <label class="c-field"><span class="c-label">Company size <span>*</span></span><select required><option>1-50</option><option>50-100</option><option>100-500</option><option>500-1000</option><option>1000+</option></select></label>
        <label class="c-field"><span class="c-label">What is your inquiry about? <span>*</span></span><textarea required></textarea></label>
        <div class="c-actions"><button class="t-btn t-btn--dark c-submit" type="submit">Send</button><p class="c-status" aria-live="polite"></p></div>
      </form>
    </div>
  </main>
  <div data-t-cta></div>
  <div data-t-foot></div>
  <script src="shared.js"></script>
  <script src="../_fx/fx-core.js"></script>
  <script src="../_fx/seat-line-up/fx.js"></script>
  <script src="../../_shared/wire.js"></script>
</body>
</html>
