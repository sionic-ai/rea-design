<!doctype html>
<html lang="ko" class="connect">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your name — contact here</title>
  <link rel="stylesheet" href="../../_shared/wire.css">
  <link rel="stylesheet" href="../../_shared/kf-defaults.css">
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="shared.css">
  <link rel="stylesheet" href="contact.css">
</head>
<body>
  <!-- A one-screen contact section is duplicated in a 3×3 layout, and as you scroll the whole grid shrinks 1 → 1/3 so the same screen shows nine times -->
  <div class="c-page">
    <main class="c-grid" data-grid data-slot="contact-zoom-grid">
      <section class="c-screen" data-screen>
        <div class="c-center" data-slot="contact-lines">
          <a class="c-row c-row--phone" href="#">
            <span class="c-mask"><span class="c-move" data-reveal-block="0">
              <span class="c-text"><span>+00 000 000 00 00</span></span>
              <span class="c-u" aria-hidden="true"></span>
            </span></span>
          </a>
          <a class="c-row c-row--email" href="#">
            <span class="c-mask"><span class="c-move" data-reveal-block="1">
              <span class="c-text"><span>MAIL@NAME.COM</span></span>
              <span class="c-u" aria-hidden="true"></span>
            </span></span>
          </a>
        </div>

        <div class="c-block c-block--top">
          <p class="blend h3 c-note c-note--l" data-reveal="2">Your quick word here</p>
          <p class="blend h3 c-note c-note--r" data-reveal="2">Your quick word here</p>
        </div>

        <div class="c-block c-block--bottom">
          <!-- Horizontally flattened globe badge (original is an SVG graphic) -->
          <svg class="c-globe" viewBox="0 0 73 32" aria-hidden="true">
            <g fill="none" stroke="currentColor" stroke-width="1.1">
              <ellipse cx="36.5" cy="16" rx="35.6" ry="15.2"/>
              <ellipse cx="36.5" cy="16" rx="23" ry="15.2"/>
              <ellipse cx="36.5" cy="16" rx="9.5" ry="15.2"/>
              <path d="M1.4 16h70.2M5.5 8.5h62M5.5 23.5h62"/>
            </g>
          </svg>
          <p class="blend h3 c-foot c-foot--top" data-reveal="3">Your three words here, comma-separated</p>
          <p class="blend h3 c-foot c-foot--bottom" data-reveal="4">0000 — Now</p>
        </div>
      </section>
    </main>
  </div>

  <div class="veil" data-veil></div>

  <p class="blend h3 corner corner--tl" data-ui><a href="index.html" data-home data-label="Your English name (wordmark) here">Name Surname</a></p>

  <nav class="blend menu" aria-label="Main menu" data-label="Your English menu name here" data-ui>
    <a class="pill pill--menu" href="index.html">
      <span class="pill-label"><span>Menu 1</span><sup class="pill-count">(05)</sup></span>
    </a>
    <a class="pill pill--menu" href="about.html">Menu 2</a>
    <a class="pill pill--menu is-active" href="contact.html" aria-current="page">
      <span>Menu 3</span>
      <svg class="pill-dot" viewBox="0 0 3.2 4" aria-hidden="true"><ellipse cx="1.6" cy="2" rx="1.56" ry="2"/></svg>
    </a>
  </nav>

  <p class="blend h3 corner corner--tr progress" data-ui data-swap><span>P</span><span data-progress>000</span></p>
  <p class="blend h3 corner corner--bl" data-clock="Asia/City" data-city="City, Country_" data-ui>City, Country_00:00:00</p>
  <p class="blend h3 corner corner--br" data-ui>©0000</p>

  <script src="../../_shared/vendor/gsap/gsap.min.js"></script>
  <script src="shared.js"></script>
  <script src="contact.js"></script>
  <script src="../../_shared/wire.js"></script>
</body>
</html>
