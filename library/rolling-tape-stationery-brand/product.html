      <a href="product.html" aria-current="page" style="--i:1"><span class="thumb st-photo"></span><span class="label">Our family</span><span class="arrow"><svg viewBox="0 0 20 20"><path d="M5 15 15 5M7 5h8v8"/></svg></span></a><span class="rule" style="--i:1"></span>
      <a href="about.html" style="--i:2"><span class="thumb st-photo"></span><span class="label">About</span><span class="arrow"><svg viewBox="0 0 20 20"><path d="M5 15 15 5M7 5h8v8"/></svg></span></a><span class="rule" style="--i:2"></span>
      <a href="news.html" style="--i:3"><span class="thumb st-photo"></span><span class="label">News</span><span class="arrow"><svg viewBox="0 0 20 20"><path d="M5 15 15 5M7 5h8v8"/></svg></span></a><span class="rule" style="--i:3"></span>
      <a href="detail.html" style="--i:4"><span class="thumb st-photo"></span><span class="label">Contact</span><span class="arrow"><svg viewBox="0 0 20 20"><path d="M5 15 15 5M7 5h8v8"/></svg></span></a><span class="rule" style="--i:4"></span>

  <button class="st-sound" type="button" aria-pressed="false" aria-label="Sound On" data-slot="sound-toggle"><span class="st-sound__ball"></span><svg viewBox="0 0 16 16"><path d="M2 6h3l4-3v10l-4-3H2zM11 6l3 4M14 6l-3 4"/></svg></button>
  <div class="st-cursor" aria-hidden="true"><svg viewBox="0 0 34 40"><path d="M3 2l26 16-11 2 7 13-5 3-7-13-8 8z"/></svg></div>

  <main>

      <svg class="st-doodle sp-pick__arrow" viewBox="0 0 160 80" aria-hidden="true"><path d="M150 10C110 60 50 70 10 50M10 50l14-8M10 50l12 10"/></svg>
      <ul class="sp-pick__row" data-label="Six product rolls · lift on hover">
        <li><a href="detail.html" data-tape="Cloth tape" data-tape-sub="Normal" style="--tape: var(--site-tape-purple)" aria-label="Product 1"></a></li>
        <li><a href="detail.html" data-tape="Masking tape" data-tape-sub="Normal" style="--tape: var(--site-tape-orange)" aria-label="Product 2"></a></li>

        <li><a href="detail.html" data-tape="Station tape" data-tape-sub="Easy tear" style="--tape: var(--site-tape-red)" aria-label="Product 5"></a></li>
        <li><a href="detail.html" data-tape="Double tape" data-tape-sub="Arts &amp; craft" style="--tape: var(--site-tape-sky)" aria-label="Product 6"></a></li>
      </ul>
      <div class="sp-pick__ground st-paper st-dome"></div>

    <nav aria-label="Footer Menu" data-label="Menu English 4"><ul><li><a href="product.html"><span>Our family</span></a></li><li><a href="about.html"><span>About</span></a></li><li><a href="news.html"><span>News</span></a></li><li><a href="detail.html"><span>Contact</span></a></li></ul></nav>
    <div class="st-footer__word" data-label="Wordmark, two-line English">
      <svg class="st-logo" viewBox="0 0 220 120" aria-hidden="true"><path class="leaf" d="M14 70C30 20 150 0 206 40c-6 50-130 86-192 30z"/><text x="110" y="62" text-anchor="middle">BRAND</text><text x="110" y="100" text-anchor="middle">NAME</text></svg>
      <div class="st-head" lang="en">Stick<br>by you</div>
    </div>
    <div class="st-footer__phys" aria-hidden="true" data-label="Six tape rolls falling and piling up (matter-js)">
      <span data-drop data-tape="Cloth tape" style="--tape: var(--site-tape-purple)"></span>
      <span data-drop data-tape="Double tape" style="--tape: var(--site-tape-sky)"></span>
      <span data-drop data-tape="Station tape" style="--tape: var(--site-tape-red)"></span>
      <span data-drop data-tape="Masking tape" style="--tape: var(--site-tape-orange)"></span>
      <span data-drop data-tape="Opp tape" style="--tape: var(--site-tape-green)"></span>
      <span data-drop data-tape="Opp tape" style="--tape: var(--site-tape-yellow)"></span>
