<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HISTORY · a commemorative site that runs forward</title>
<link rel="stylesheet" href="../../_shared/wire.css">
<link rel="stylesheet" href="../../_shared/kf-defaults.css">
<link rel="stylesheet" href="../_vendor/glightbox@3.3.1/glightbox.min.css">
<link rel="stylesheet" href="../_fx/ribbon-draw-breathe/fx.css">
<link rel="stylesheet" href="../_fx/slot-reel-year/fx.css">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="sub.css">
</head>
<body data-page="history">
<header data-slot="header"></header>

<main class="am-page">
  <div class="am-pageribbon" data-fx="ribbon-draw-breathe" data-fx-ribbon-draw-breathe="dur: 1.5; start: top bottom"><svg viewBox="0 0 1440 1400" preserveAspectRatio="none"><path stroke-width="56" d="M-40 980C300 1120 520 860 380 700S560 420 900 480s420 160 580 40"/></svg></div>
  <section class="am-head" data-slot="page-head">
    <div class="am-head__ph"><div class="wf-img" data-label="Building lobby wall logo and green potted plant · blurred · landscape 16:5"></div></div>
    <div class="am-head__front"><h1 class="am-head__title"><span class="en">HISTORY</span><span class="kr">Company Timeline</span></h1><p class="am-head__lead">Today’s company is built on everything gathered so far<br>Built on a wealth of experience. Looking back on 00 years of steps.</p></div>
  </section>

  <section class="am-sec" id="movie" data-slot="movie">
    <div class="am-movie">
      <div class="am-movie__bg am-en" aria-hidden="true">MOVIE</div>
      <a class="am-movie__video glightbox" href="#modal_video" data-type="inline"><div class="wf-img wf-video" data-label="History video cover — large red year number over an old photo collage · 16:9"></div><span class="play" aria-hidden="true"></span></a>
      <a class="am-movie__more" href="article.html">The company’s 00-year journey</a>
    </div>
  </section>

  <section class="am-sec" id="slot" data-slot="chronology-slot">
    <h2 class="am-slot__heading"><span class="en">CHRONOLOGY SLOT</span><span class="kr">Spin the timeline slots!</span></h2>
    <div class="am-slot" data-fx="slot-reel-year" data-fx-slot-reel-year="values: 0001,0003,0004,0005,0019,0024,0027,0032,0033,0047">
      <div class="am-slot__body"></div>
      <span class="am-slot__arm" aria-hidden="true"></span>
      <div class="am-slot__reels"><span data-fx-part="reel"></span><span data-fx-part="reel"></span><span data-fx-part="reel"></span><span data-fx-part="reel"></span></div>
      <button class="am-slot__start" type="button" data-fx-part="start">START!!</button>
    </div>
  </section>
</main>

<div class="am-modals" hidden>
  <div class="am-yearmodal" id="modal_video"><div class="wf-img wf-video" data-label="History video · 16:9 · click to play"></div></div>
</div>
<footer data-slot="footer"></footer>

<script src="../../_shared/vendor/gsap/gsap.min.js"></script>
<script src="../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../../_shared/vendor/gsap/DrawSVGPlugin.min.js"></script>
<script src="../_vendor/glightbox@3.3.1/glightbox.min.js"></script>
<script src="../_fx/fx-core.js"></script>
<script src="../_fx/ribbon-draw-breathe/fx.js"></script>
<script src="../_fx/slot-reel-year/fx.js"></script>
<script src="sub.js"></script>
<script src="shared.js"></script>
<script src="../../_shared/wire.js"></script>
</body>
</html>
