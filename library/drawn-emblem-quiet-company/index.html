<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Company Name — Your one-line intro here</title>
  <link rel="stylesheet" href="../../_shared/wire.css">
  <link rel="stylesheet" href="../../_shared/kf-defaults.css">
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="shared.css">
  <link rel="stylesheet" href="index.css">
</head>
<body class="tb" data-intro="home">
  <div class="tb-pixels tb-after-intro" style="opacity: 0" aria-hidden="true" data-slot="cursor-pixel-trail"><canvas></canvas></div>
  <div class="tb-theme tb-after-intro" style="opacity: 0" data-slot="theme-toggle"><button class="tb-mono tb-mono-link" type="button" lang="en"><span></span>Theme</button></div>

  <div class="tb-home">
    <header class="tb-home__head" data-slot="emblem-intro">
      <div class="tb-home__slot">
        <!-- Emblem = Company seal (round ring·ticks·center window). The Lottie is newly made from our own shapes (lottie-data.js) -->
        <div class="tb-lottie" data-lottie="ambient" data-lottie-manual data-hover="speed" data-label="Company seal emblem · line art · looping Lottie"></div>
      </div>
    </header>
    <div class="tb-intro tb-lottie" data-lottie="logo" data-lottie-manual aria-hidden="true" data-label="Intro Lottie where the company seal is drawn in lines (2.1s)"></div>

    <div class="tb-home__body">
      <section class="tb-home__hero" data-slot="hero-statement">
        <h1 class="tb-heading tb-rich" lang="en" data-label="One-sentence company intro in English (italic serif) — dotted-underline links on two product names">A short italic headline set over two lines with <a class="tb-head-link" href="https://example.com" target="_blank" rel="noopener">Name</a> and <a class="tb-head-link" href="https://example.com" target="_blank" rel="noopener">Item</a>.</h1>
        <ul class="tb-home__products" lang="en" data-label="Two English product names + small product mark">
          <li><a class="tb-btn-link tb-mono" href="https://example.com" target="_blank" rel="noopener"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><rect x="2" y="3" width="12" height="10" rx="3"/><path d="M5 8h6"/></svg>Product One</a></li>
          <li><a class="tb-btn-link tb-mono" href="https://example.com" target="_blank" rel="noopener"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M2 13c1-6 4-9 6-9s5 3 6 9"/><path d="M5 13c.6-3 1.8-5 3-5s2.4 2 3 5"/></svg>Product Two</a></li>
        </ul>
        <div class="tb-home__mark" aria-hidden="true"><svg viewBox="0 0 19 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="1.5" y="1.5" width="16" height="21" rx="8"/><path d="M6.5 8h6v4h-6v4h6"/></svg></div>
      </section>
      <footer class="tb-home__foot" lang="en" data-slot="footer-menu" data-label="Menu in English — values, careers, newsletter, SNS accounts">
        <a class="tb-mono tb-mono-link" href="about.html">Values Page</a>
        <a class="tb-mono tb-mono-link" href="recruit.html">Jobs</a>
        <a class="tb-mono tb-mono-link" href="https://example.com" target="_blank" rel="noopener">Newsletter</a>
        <a class="tb-mono tb-mono-link" href="https://example.com" target="_blank" rel="noopener">@companyname</a>
      </footer>
      <div class="tb-bar is-fixed tb-after-intro" style="opacity: 0" data-slot="lottie-footer-bar" data-label="Five company marks — globe·four-letter plate·coin initial·wordmark·copyright line, all 5s looping Lottie">
        <div class="tb-lottie is-globe" data-lottie="globe"></div>
        <div class="tb-lottie is-four" data-lottie="four"></div>
        <div class="tb-lottie is-coin" data-lottie="coin"></div>
        <div class="tb-lottie is-word" data-lottie="wordmark"></div>
        <div class="is-copy"><small class="wf-sr" hidden>Copyright 0000 Company Name</small><div class="tb-lottie is-copy" data-lottie="copyright"></div></div>
      </div>
    </div>
  </div>

  <script src="../../_shared/vendor/gsap/gsap.min.js"></script>
  <script src="../../_shared/vendor/gsap/CustomEase.min.js"></script>
  <script src="../_vendor/lottie-web@5.13.0/lottie_svg.min.js"></script>
  <script src="lottie-data.js"></script>
  <script src="shared.js"></script>
  <script src="index.js"></script>
  <script src="../../_shared/wire.js"></script>
</body>
</html>
