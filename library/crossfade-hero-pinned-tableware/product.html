<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Product list · filter row and four-column square grid</title>
<link rel="stylesheet" href="../../_shared/wire.css">
<link rel="stylesheet" href="../../_shared/kf-defaults.css">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="product.css">
</head>
<body data-page="product">
<a class="mw-skip" href="#main">Skip to content</a>
<header data-slot="header"></header>
<div data-slot="menu-drawer"></div>

<main id="main" class="mw-sub">
  <section class="mw-shop" data-slot="product-list">
    <span class="wf-note">Product list · filter (stock, price) and sort row + four-column square grid · on hover the photo scales 1.03x over .5s</span>
    <h1 class="mw-shop__h">Product</h1>
    <form class="mw-facets" data-slot="facets" data-fade-in onsubmit="return false">
      <div class="mw-facets__l">
        <span class="mw-facets__label">Filter:</span>
        <details class="mw-facet"><summary><span>Availability</span><svg viewBox="0 0 10 6" fill="currentColor"><path d="M.6.6a.5.5 0 0 1 .7 0L5 4.3 8.7.6a.5.5 0 0 1 .7.7l-4 4a.5.5 0 0 1-.7 0l-4-4a.5.5 0 0 1 0-.7z"/></svg></summary>
          <div class="mw-facet__pop"><label><input type="checkbox"> In stock (00)</label><label><input type="checkbox"> Sold out (00)</label></div></details>
        <details class="mw-facet"><summary><span>Price</span><svg viewBox="0 0 10 6" fill="currentColor"><path d="M.6.6a.5.5 0 0 1 .7 0L5 4.3 8.7.6a.5.5 0 0 1 .7.7l-4 4a.5.5 0 0 1-.7 0l-4-4a.5.5 0 0 1 0-.7z"/></svg></summary>
          <div class="mw-facet__pop"><label>Lowest <input type="text" inputmode="numeric" placeholder="0"></label><label>Best <input type="text" inputmode="numeric" placeholder="0"></label></div></details>
      </div>
      <div class="mw-facets__r">
        <label class="mw-facets__label" for="mw-sort">Sort:</label>
        <select id="mw-sort" class="mw-facets__sort"><option>By recommended</option><option>Newest products first</option><option>Price: low to high</option><option>Price: high to low</option></select>
        <span class="mw-facets__count">00 Products</span>
      </div>
      <button class="mw-facets__sp" type="button">Filter and sort</button>
    </form>
    <ul class="mw-plist" data-plist data-slide-in></ul>
    <nav class="mw-pager is-row" aria-label="Page count">
      <span class="mw-pager__i is-now" aria-current="page">1</span>
      <a class="mw-pager__i" href="#">2</a>
      <a class="mw-pager__i" href="#">3</a>
      <a class="mw-pager__i" href="#">4</a>
      <a class="mw-pager__i is-next" href="#" aria-label="Next page"><svg viewBox="0 0 10 6" fill="none" stroke="currentColor" stroke-width="1"><path d="M1 5l4-4 4 4"/></svg></a>
    </nav>
  </section>
</main>

<div data-slot="footer"></div>
<div data-slot="tab-bar"></div>

<script>
  // 24 product cells of the same type — each row lays out the same item with only the color changed (original cup → fork order)
  (() => {
    const list = document.querySelector("[data-plist]");
    const KINDS = ["Large cup", "Large cup", "Large cup", "Large cup", "Large cup", "Large cup", "Large cup", "Small cup", "Small cup", "Small cup", "Small cup", "Small cup", "Small cup", "Small cup", "Fork", "Fork", "Fork", "Fork", "Fork", "Fork", "Fork", "Small fork", "Small fork", "Small fork"];
    const COLORS = ["Deep Navy", "Old pine yellow", "Tea field green", "Cherry blossom pink", "Baby anchovy gray-white", "Teal Navy", "Lava Ink Black"];
    list.innerHTML = KINDS.map((k, i) => `
      <li class="mw-pcard" data-slide-in>
        <a href="#" class="mw-pcard__media"><div class="wf-img" data-label="${COLORS[i % 7]} ${k} Cutout · light gray floor · square"></div>${i === 20 ? '<span class="mw-pcard__badge">Sold out</span>' : ""}</a>
        <p class="mw-pcard__name" data-label="Product English name — color name">Product ${String(Math.floor(i / 7) + 1).padStart(2, "0")} — Color ${String((i % 7) + 1).padStart(2, "0")}</p>
        <p class="mw-pcard__price">KRW 0,000<span>(Tax excluded)</span></p>
      </li>`).join("");
  })();
</script>
<script src="shared.js"></script>
<script src="../../_shared/wire.js"></script>
</body>
</html>
