<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BRAND STUDIOS — Your one-line intro here</title>
  <link rel="stylesheet" href="../../_shared/wire.css">
  <link rel="stylesheet" href="../../_shared/kf-defaults.css">
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="../_fx/drag-front-free/fx.css">
  <link rel="stylesheet" href="shared.css">
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <h1 class="sr-only">BRAND STUDIOS</h1>
  <div class="preloader" data-slot="loader"><p>Loading...</p></div>

  <!-- Stage — two words filling the screen (change every 3 seconds) and eight color windows above them. Inside the windows 50 objects drift (three.js) -->
  <div class="stage" data-slot="stage"
       data-words="BRAND|STUDIOS"
       data-label="Two English brand words — fill the screen and swap alternately"
       data-items="ITEM NAME 01:cone|ITEM NAME 02:sphere|ITEM NAME 03:arc|ITEM NAME 04:bottle|ITEM NAME 05:disc|ITEM NAME 06:egg|ITEM NAME 07:ball|ITEM NAME 08:bowl"
       aria-hidden="true"></div>

  <!-- Tags — six white boxes, scattered anywhere and draggable -->
  <div class="t" data-slot="tags">
    <a class="tag" data-fx-part="item" href="#" data-label="SNS link name">Link One</a>
    <a class="tag" data-fx-part="item" href="#" data-label="SNS link name">Link Two</a>
    <a class="tag" data-fx-part="item" href="#" data-label="Account name, three lines">@HANDLE NAME
@HANDLE NAME
@HANDLE NAME</a>
    <button type="button" class="tag" data-fx-part="item" data-sound data-label="Sound on — text changes when pressed" data-on="CAN'T STOP THE SOUND!!!">Play The Sound!</button>
    <a class="tag" data-fx-part="item" href="#" data-label="Follow links, four lines">Follow Us
Follow Us
Follow Us
Follow Us</a>
    <button type="button" class="tag" data-fx-part="item" data-share data-label="Share button, three lines">Share This
Share This
Share This</button>
  </div>

  <script src="../../_shared/vendor/gsap/gsap.min.js"></script>
  <script src="../_vendor/three@0.132.2/three.min.js"></script>
  <script src="../_fx/fx-core.js"></script>
  <script src="../_fx/drag-front-free/fx.js"></script>
  <script src="index.js"></script>
  <script src="../../_shared/wire.js"></script>
</body>
</html>
