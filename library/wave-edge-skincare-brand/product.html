<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Product — Brand name here</title>
  <link rel="stylesheet" href="../../_shared/wire.css">
  <link rel="stylesheet" href="../../_shared/kf-defaults.css">

<body data-page="product">
  <header data-slot="header"></header>

  <main>
    <section class="nu-pagehead" data-slot="page-head" data-pagehead>
      <span class="wf-note">After the loader lifts, letters at .08s intervals → around the circle 1.5s power4.inOut</span>
      <div class="nu-pagehead__circle" aria-hidden="true"><svg viewBox="0 0 485 485" fill="none"><circle cx="242.5" cy="242.5" r="242" stroke="currentColor"/></svg></div>
      <h1 class="nu-en-disp" data-main-catch data-label="Product list page English title">Products</h1>
    </section>

    <section class="pr-list" data-slot="product-list">
      <span class="wf-note">List rises 2rem from below (.6s · 75ms stagger per item) · beige veil over the photo lifts away as a mask · vertical text lines enter from 30% to the side with blur, line by line</span>
      <ul class="nu-products nu-slidein" data-product-rows></ul>
    </section>
  </main>

  <footer data-slot="footer"></footer>

  <script src="../../_shared/vendor/gsap/gsap.min.js"></script>
  <script src="../../_shared/vendor/gsap/ScrollTrigger.min.js"></script>

  <script src="../_vendor/splide-extension-intersection@0.2.0/splide-extension-intersection.min.js"></script>
  <!-- lenis goes after Splide — splide.min.js leaks function r at the top and overwrites lenis’s top-level r (VirtualScroll) -->
  <script src="../_vendor/lenis@1.2.3/lenis.min.js"></script>
  <script src="shared.js"></script>
  <script src="../../_shared/wire.js"></script>
