name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: plugin manifest
        run: npx --yes @anthropic-ai/claude-code@latest plugin validate ./plugin
      - name: marketplace manifest
        run: npx --yes @anthropic-ai/claude-code@latest plugin validate .
      - name: rea CLI smoke test (offline catalog)
        run: node test/cli.test.mjs
