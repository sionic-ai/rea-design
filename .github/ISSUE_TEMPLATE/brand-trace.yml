name: Brand trace or takedown
description: A library page still carries a name, logo or another identifying trace of a real site
labels: [takedown]
body:
  - type: input
    id: slug
    attributes: { label: Library slug, placeholder: horizontal-scroll-school-anniversary }
    validations: { required: true }
  - type: textarea
    id: what
    attributes: { label: What did you find, description: File and line, or a screenshot }
    validations: { required: true }
