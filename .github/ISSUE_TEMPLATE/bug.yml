name: Bug
description: The rea CLI, a skill, a page or a motion part misbehaves
body:
  - type: textarea
    id: what
    attributes: { label: What happened, description: Command or page, what you expected, what you got }
    validations: { required: true }
  - type: input
    id: version
    attributes: { label: rea version, placeholder: "rea version" }
